<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>둠바족 - 마사이족의 습격</title>
    <style>
        :root {
            --primary: #8b4513;
            --secondary: #d2b48c;
            --danger: #e74c3c;
            --accent: #f1c40f;
            --text-light: #f5f5f5;
            --bear-color: #1a1a1a;
            --bear-secondary: #333;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
            background-color: #0a0a0a;
            color: var(--text-light);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        /* --- UI Elements --- */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            height: 700px;
            background-color: #34495e;
            margin-top: 20px;
            border: 8px solid #2c3e50;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            cursor: crosshair;
            transition: background-color 0.5s ease;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 100;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            border-bottom: 4px solid var(--accent);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .exit-btn {
            pointer-events: auto;
            background: var(--danger);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #c0392b;
            transition: all 0.2s;
        }

        .exit-btn:hover { background: #ff5e4d; }
        .exit-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #c0392b; }

        /* --- Menu Screen --- */
        #menu-screen {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, #2c3e50 0%, #000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            transition: opacity 0.5s ease;
        }

        #menu-screen::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 100" preserveAspectRatio="none"><path d="M0 100 L0 80 L50 60 L100 85 L150 40 L200 90 L250 30 L300 80 L350 50 L400 90 L450 20 L500 85 L550 45 L600 95 L650 35 L700 80 L750 55 L800 90 L850 25 L900 85 L950 40 L1000 80 L1000 100 Z" fill="%23111"/></svg>');
            background-size: cover;
            opacity: 0.6;
        }

        #menu-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 3.5rem;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(241, 196, 15, 0.5), 4px 4px 0px #c0392b;
            margin-bottom: 5px;
            text-align: center;
            z-index: 10;
        }

        .floor-options {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            z-index: 10;
        }

        .floor-card {
            background: rgba(44, 62, 80, 0.8);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            width: 200px;
            border: 4px solid #444;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(10px);
        }

        .floor-card:hover {
            transform: translateY(-10px);
            background: rgba(52, 73, 94, 0.9);
            border-color: var(--accent);
            box-shadow: 0 0 30px rgba(241, 196, 15, 0.4);
        }

        /* --- Icons --- */
        .icon-box {
            width: 70px;
            height: 70px;
            background: #111;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            border: 2px solid #555;
            font-size: 2rem;
        }

        /* --- Bear (Resized) --- */
        #doomba {
            position: absolute;
            width: 100px;
            height: 100px;
            transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 150;
            user-select: none;
            pointer-events: none;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .bear-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bear-body {
            position: relative;
            width: 65px;
            height: 72px;
            background: var(--bear-color);
            border-radius: 45% 45% 40% 40%;
            border: 3px solid #000;
            box-shadow: inset 0 -6px 15px rgba(0,0,0,0.5);
        }

        .bear-ear {
            position: absolute;
            width: 22px;
            height: 22px;
            background: var(--bear-color);
            border: 2px solid #000;
            border-radius: 40%;
            top: -6px;
            z-index: -2;
        }
        .bear-ear.left { left: 8px; transform: rotate(-20deg); }
        .bear-ear.right { right: 8px; transform: rotate(20deg); }

        .bear-muzzle {
            position: absolute;
            width: 32px;
            height: 26px;
            background: #222;
            border-radius: 50%;
            top: 36px;
            left: 50%;
            transform: translateX(-50%);
            border: 1px solid #000;
        }

        .bear-eye {
            position: absolute;
            width: 7px;
            height: 7px;
            background: #f1c40f;
            border-radius: 50%;
            top: 22px;
            box-shadow: 0 0 5px #f1c40f;
        }
        .bear-eye.left { left: 18px; }
        .bear-eye.right { right: 18px; }

        .fist {
            position: absolute;
            width: 32px;
            height: 32px;
            background: var(--bear-color);
            border: 3px solid #000;
            border-radius: 8px;
            top: 32px;
            z-index: 10;
        }
        .fist.left { left: -20px; transform: rotate(-15deg); }
        .fist.right { right: -20px; transform: rotate(15deg); }

        .punch-animation { animation: punch-heavy 0.25s ease-out; }

        @keyframes punch-heavy {
            0% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.6) translate(0, -20px); filter: brightness(1.3); }
            100% { transform: scale(1) translate(0, 0); }
        }

        /* --- Environments --- */
        .bg-android { background: #1d3521; background-image: radial-gradient(#2a4d31 2px, transparent 2px); background-size: 50px 50px; }
        .bg-frontend { background: #1a2a44; background-image: linear-gradient(rgba(52, 152, 219, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(52, 152, 219, 0.1) 1px, transparent 1px); background-size: 40px 40px; }
        .bg-backend { background: #0a0a0a; background-image: linear-gradient(#111 1px, transparent 1px); background-size: 100% 30px; }

        .object {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s;
            z-index: 50;
        }

        .crack-overlay {
            position: absolute;
            inset: 0;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><path d="M5 5 L25 35 L15 55 L45 85 M65 5 L55 35 L75 65" stroke="white" stroke-width="4" fill="none" opacity="0.6"/></svg>');
            display: none;
            pointer-events: none;
            z-index: 10;
        }

        .damage-1 .crack-overlay { display: block; }
        .damage-2 { transform: rotate(12deg) translate(8px, 8px); filter: brightness(0.5); }
        .damage-3 { opacity: 0; transform: scale(0); transition: all 0.4s; }

        .particle {
            position: absolute;
            width: 10px; height: 10px; pointer-events: none;
            animation: explode 0.7s ease-out forwards;
            z-index: 160;
        }

        @keyframes explode { to { transform: translate(var(--tx), var(--ty)) rotate(720deg); opacity: 0; } }

        #game-over {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 300;
        }

        .btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 15px 50px;
            font-size: 1.4rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 25px;
            box-shadow: 0 6px 0 #b7950b;
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #b7950b; }
    </style>
</head>
<body>

<div id="game-container">
    <!-- UI -->
    <div id="ui-layer" style="display: none;">
        <div class="stat-box">🏙️ 마을: <span id="current-floor-text">-</span></div>
        <div class="stat-box">💰 파괴 가치: <span id="score">0</span></div>
        <button class="exit-btn" onclick="backToMenu()">철수 (EXIT)</button>
    </div>

    <!-- Bear (Player) -->
    <div id="doomba">
        <div class="bear-container">
            <div class="bear-ear left"></div>
            <div class="bear-ear right"></div>
            <div class="bear-body">
                <div class="bear-eye left"></div>
                <div class="bear-eye right"></div>
                <div class="bear-muzzle"></div>
            </div>
            <div class="fist left" id="fist-l"></div>
            <div class="fist right" id="fist-r"></div>
        </div>
    </div>

    <!-- Menu Screen -->
    <div id="menu-screen">
        <h1>둠바족: 마사이족의 습격</h1>
        <p style="color: #ccc; margin-bottom: 30px; z-index: 10;">마을을 파괴하고 둠바족의 자연을 되찾으세요.</p>
        <div class="floor-options">
            <div class="floor-card" onclick="startGame('android')">
                <h2 style="color: #3ddc84; margin:0;">모바일 안드로이드 마을</h2>
                <p style="margin:5px 0 10px; font-size: 0.9rem;">11층 점령지</p>
                <div class="icon-box">🤖</div>
            </div>
            <div class="floor-card" onclick="startGame('frontend')">
                <h2 style="color: #61dafb; margin:0;">프론트엔드 마을</h2>
                <p style="margin:5px 0 10px; font-size: 0.9rem;">12층 점령지</p>
                <div class="icon-box">🌐</div>
            </div>
            <div class="floor-card" onclick="startGame('backend')">
                <h2 style="color: #ffca28; margin:0;">백엔드 마을</h2>
                <p style="margin:5px 0 10px; font-size: 0.9rem;">13층 점령지</p>
                <div class="icon-box">⚙️</div>
            </div>
        </div>
    </div>

    <div id="game-over">
        <h2 style="font-size: 3.5rem; color: var(--accent);">마을 점령 완료!</h2>
        <p style="font-size: 1.8rem;">총 파괴 가치: <span id="final-score">0</span></p>
        <button class="btn" onclick="backToMenu()">다른 마을 습격하기</button>
    </div>
</div>

<script>
    /* --- Audio Engine (Synthetic Sounds) --- */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        switch(type) {
            case 'punch': // 퍽 효과음 (Thud)
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
                break;
            case 'android': // 안드로이드 마을 입장 (Electronic)
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(880, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
                break;
            case 'frontend': // 프론트엔드 마을 입장 (Clicky)
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
                break;
            case 'backend': // 백엔드 마을 입장 (Deep)
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(60, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.8);
                break;
        }
    }

    const gameContainer = document.getElementById('game-container');
    const uiLayer = document.getElementById('ui-layer');
    const doomba = document.getElementById('doomba');
    const fistL = document.getElementById('fist-l');
    const fistR = document.getElementById('fist-r');
    const scoreElement = document.getElementById('score');
    const menuScreen = document.getElementById('menu-screen');
    const gameOverScreen = document.getElementById('game-over');
    const floorText = document.getElementById('current-floor-text');

    let score = 0;
    let objects = [];
    let punchToggle = false;
    const MAX_DAMAGE_STAGE = 3;

    const graphicTemplates = {
        /* Android Village Assets */
        androidBot: () => `<div style="width:80px; height:80px; background:#3ddc84; border-radius:50px 50px 10px 10px; position:relative; border:4px solid #2e7d32;"><div style="width:8px; height:8px; background:white; border-radius:50%; position:absolute; top:25px; left:20px;"></div><div style="width:8px; height:8px; background:white; border-radius:50%; position:absolute; top:25px; right:20px;"></div><div style="width:4px; height:20px; background:#3ddc84; position:absolute; top:-15px; left:20px; transform:rotate(-20deg);"></div><div style="width:4px; height:20px; background:#3ddc84; position:absolute; top:-15px; right:20px; transform:rotate(20deg);"></div></div>`,
        smartphone: () => `<div style="width:60px; height:110px; background:#111; border:3px solid #555; border-radius:10px; position:relative;"><div style="width:50px; height:90px; background:#333; margin:7px auto; border-radius:3px;"></div><div style="width:10px; height:10px; background:#222; border-radius:50%; margin:0 auto;"></div></div>`,
        kotlinBadge: () => `<div style="width:60px; height:60px; background:linear-gradient(45deg, #7F52FF, #E24462); border:3px solid #fff; position:relative; display:flex; justify-content:center; align-items:center; font-weight:bold; color:white; font-size:12px; clip-path: polygon(0% 0%, 100% 0%, 50% 50%, 100% 100%, 0% 100%);">KOTLIN</div>`,

        /* Frontend Village Assets */
        reactLogo: () => `<div style="width:80px; height:80px; border:4px solid #61dafb; border-radius:50%; position:relative; display:flex; justify-content:center; align-items:center;"><div style="width:20px; height:20px; background:#61dafb; border-radius:50%;"></div><div style="width:80px; height:30px; border:2px solid #61dafb; border-radius:50%; position:absolute;"></div><div style="width:80px; height:30px; border:2px solid #61dafb; border-radius:50%; position:absolute; transform:rotate(60deg);"></div><div style="width:80px; height:30px; border:2px solid #61dafb; border-radius:50%; position:absolute; transform:rotate(-60deg);"></div></div>`,
        browserWin: () => `<div style="width:120px; height:80px; background:#fff; border:3px solid #bdc3c7; border-radius:5px;"><div style="width:100%; height:15px; background:#ecf0f1; border-bottom:1px solid #bdc3c7; display:flex; gap:4px; padding-left:5px; align-items:center;"><div style="width:6px; height:6px; background:#ff5f56; border-radius:50%;"></div><div style="width:6px; height:6px; background:#ffbd2e; border-radius:50%;"></div><div style="width:6px; height:6px; background:#27c93f; border-radius:50%;"></div></div><div style="font-size:10px; color:#95a5a6; padding:5px;">&lt;html&gt;...</div></div>`,
        jsBadge: () => `<div style="width:60px; height:60px; background:#f7df1e; border:3px solid #d4c017; font-weight:bold; color:#000; display:flex; align-items:flex-end; justify-content:flex-end; padding:5px; box-sizing:border-box; font-size:20px;">JS</div>`,

        /* Backend Village Assets */
        serverRack: () => `<div style="width:80px; height:120px; background:#333; border:4px solid #555; border-radius:5px; display:flex; flex-direction:column; gap:5px; padding:10px;"><div style="height:10px; background:#222; display:flex; align-items:center; gap:5px;"><div style="width:5px; height:5px; background:#0f0; border-radius:50%;"></div><div style="width:40px; height:3px; background:#444;"></div></div><div style="height:10px; background:#222; display:flex; align-items:center; gap:5px;"><div style="width:5px; height:5px; background:#0f0; border-radius:50%;"></div><div style="width:40px; height:3px; background:#444;"></div></div><div style="height:10px; background:#222; display:flex; align-items:center; gap:5px;"><div style="width:5px; height:5px; background:#f00; border-radius:50%;"></div><div style="width:40px; height:3px; background:#444;"></div></div></div>`,
        database: () => `<div style="width:70px; height:90px; position:relative;"><div style="width:70px; height:30px; background:#7f8c8d; border:3px solid #555; border-radius:50%; position:absolute; top:0; z-index:3;"></div><div style="width:70px; height:60px; background:#95a5a6; border-left:3px solid #555; border-right:3px solid #555; border-bottom:3px solid #555; position:absolute; top:15px; border-radius:0 0 35px 35px; z-index:1;"></div><div style="width:70px; height:30px; background:#7f8c8d; border:3px solid #555; border-radius:50%; position:absolute; top:30px; z-index:2;"></div></div>`,
        javaSpring: () => `<div style="width:80px; height:80px; background:#fff; border:3px solid #6db33f; border-radius:15px; position:relative; display:flex; flex-direction:column; justify-content:center; align-items:center;"><div style="color:#e74c3c; font-weight:bold; font-size:12px;">JAVA</div><div style="width:40px; height:20px; background:#6db33f; border-radius:10px; margin-top:5px; color:white; font-size:10px; display:flex; justify-content:center; align-items:center;">Spring</div></div>`
    };

    const villageConfig = {
        android: { name: "모바일 안드로이드 마을", bg: "bg-android", sound: 'android' },
        frontend: { name: "프론트엔드 마을", bg: "bg-frontend", sound: 'frontend' },
        backend: { name: "백엔드 마을", bg: "bg-backend", sound: 'backend' }
    };

    function startGame(villageKey) {
        score = 0;
        scoreElement.innerText = score;
        floorText.innerText = villageConfig[villageKey].name;
        menuScreen.classList.add('hidden');
        gameOverScreen.style.display = 'none';
        uiLayer.style.display = 'flex';
        doomba.style.display = 'flex';
        gameContainer.className = villageConfig[villageKey].bg;

        playSound(villageConfig[villageKey].sound);
        spawnObjectsByTheme(villageKey);
    }

    function backToMenu() {
        menuScreen.classList.remove('hidden');
        gameOverScreen.style.display = 'none';
        uiLayer.style.display = 'none';
        doomba.style.display = 'none';
        gameContainer.className = '';
        document.querySelectorAll('.object').forEach(o => o.remove());
    }

    function spawnObjectsByTheme(villageKey) {
        document.querySelectorAll('.object').forEach(o => o.remove());
        objects = [];

        if (villageKey === 'android') {
            for (let i = 0; i < 4; i++) createObject('androidBot', 100 + i * 220, 100, 80, 80);
            for (let i = 0; i < 3; i++) createObject('smartphone', 200 + i * 250, 300, 60, 110);
            for (let i = 0; i < 5; i++) createObject('kotlinBadge', 50 + i * 190, 500, 60, 60);
        } else if (villageKey === 'frontend') {
            createObject('reactLogo', 450, 80, 80, 80);
            for (let i = 0; i < 3; i++) createObject('browserWin', 150 + i * 300, 250, 120, 80);
            for (let i = 0; i < 6; i++) createObject('jsBadge', 80 + i * 150, 480, 60, 60);
            createObject('reactLogo', 100, 100, 80, 80);
            createObject('reactLogo', 800, 100, 80, 80);
        } else if (villageKey === 'backend') {
            for (let i = 0; i < 3; i++) createObject('serverRack', 150 + i * 300, 80, 80, 120);
            for (let i = 0; i < 4; i++) createObject('javaSpring', 100 + i * 230, 300, 80, 80);
            for (let i = 0; i < 5; i++) createObject('database', 80 + i * 200, 520, 70, 90);
        }
    }

    function createObject(type, x, y, width, height) {
        const container = document.createElement('div');
        container.className = 'object';
        container.style.width = width + 'px';
        container.style.height = height + 'px';
        container.style.left = x + 'px';
        container.style.top = y + 'px';
        const graphic = document.createElement('div');
        graphic.className = 'graphic';
        graphic.innerHTML = graphicTemplates[type]() + '<div class="crack-overlay"></div>';
        container.appendChild(graphic);
        const state = { element: container, stage: 0 };
        container.addEventListener('click', (e) => { e.stopPropagation(); handleAttack(state); });
        gameContainer.appendChild(container);
        objects.push(state);
    }

    function handleAttack(state) {
        const rect = state.element.getBoundingClientRect();
        const cRect = gameContainer.getBoundingClientRect();
        const targetX = rect.left - cRect.left + (rect.width / 2) - 50;
        const targetY = rect.top - cRect.top + (rect.height / 2) - 50;

        const currentX = parseInt(doomba.style.left) || 0;
        doomba.style.left = `${targetX}px`;
        doomba.style.top = `${targetY}px`;
        doomba.style.transform = targetX < currentX ? 'scaleX(-1)' : 'scaleX(1)';

        const activeFist = punchToggle ? fistL : fistR;
        activeFist.classList.remove('punch-animation');
        void activeFist.offsetWidth;
        activeFist.classList.add('punch-animation');
        punchToggle = !punchToggle;

        playSound('punch');
        state.stage++;
        createParticles(targetX + 50, targetY + 50);

        if (state.stage === 1) state.element.classList.add('damage-1');
        else if (state.stage === 2) { state.element.classList.remove('damage-1'); state.element.classList.add('damage-2'); }
        else if (state.stage >= MAX_DAMAGE_STAGE) {
            state.element.classList.add('damage-3');
            score += 2000;
            scoreElement.innerText = score.toLocaleString();
            checkVictory();
        }
    }

    function createParticles(x, y) {
        for (let i = 0; i < 15; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = x + 'px';
            p.style.top = y + 'px';
            p.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
            p.style.setProperty('--ty', (Math.random() - 0.5) * 200 + 'px');
            const colors = ['#ffffff', '#ffca28', '#e74c3c', '#3ddc84', '#61dafb'];
            p.style.background = colors[Math.floor(Math.random()*colors.length)];
            gameContainer.appendChild(p);
            setTimeout(() => p.remove(), 700);
        }
    }

    function checkVictory() {
        const active = objects.filter(o => o.stage < MAX_DAMAGE_STAGE);
        if (active.length === 0) {
            setTimeout(() => {
                gameOverScreen.style.display = 'flex';
                document.getElementById('final-score').innerText = score.toLocaleString();
            }, 800);
        }
    }

    gameContainer.addEventListener('mousedown', (e) => {
        if (!menuScreen.classList.contains('hidden') || e.target.closest('.exit-btn')) return;
        const rect = gameContainer.getBoundingClientRect();
        doomba.style.left = (e.clientX - rect.left - 50) + 'px';
        doomba.style.top = (e.clientY - rect.top - 50) + 'px';
    });
</script>
</body>
</html>
