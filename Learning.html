<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlanBeforeCode Pro - 알고리즘 마스터</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #6366f1;
            --primary-light: #818cf8;
            --success: #10b981;
            --error: #f43f5e;
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --code-bg: #020617;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Pretendard', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* Layout */
        header { padding: 3rem 1rem 2rem; text-align: center; background: linear-gradient(to bottom, #1e293b, var(--bg)); }
        header h1 { font-size: 2.5rem; color: var(--primary); margin-bottom: 0.5rem; letter-spacing: -1px; }
        header p { color: var(--text-muted); font-size: 1.1rem; }

        nav {
            display: flex; justify-content: center; gap: 15px; padding: 1rem;
            position: sticky; top: 0; background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px); z-index: 100; border-bottom: 1px solid var(--border);
        }
        nav button {
            padding: 0.8rem 1.6rem; border: none; background: transparent;
            color: var(--text-muted); cursor: pointer; border-radius: 12px;
            font-weight: 700; transition: 0.3s;
        }
        nav button.active { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); }

        main { max-width: 900px; margin: 2rem auto; padding: 0 1.5rem; min-height: 70vh; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease-out; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* UI Elements */
        .card { background: var(--card); border-radius: 20px; padding: 2rem; border: 1px solid var(--border); margin-bottom: 1.5rem; position: relative; }
        .btn { padding: 0.8rem 1.5rem; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; text-align: center; font-size: 1rem; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-light); }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: var(--primary); color: white; }
        .btn-disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; border: 2px solid var(--border); }
        
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }

        /* Algorithm Detail View */
        .algo-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 10px; }
        .theory-box { background: rgba(255,255,255,0.02); padding: 1.5rem; border-radius: 12px; border-left: 4px solid var(--primary); margin-bottom: 1.5rem; }
        .theory-box h3 { color: var(--primary-light); margin-bottom: 0.5rem; }
        
        .visual-container { display: flex; flex-direction: column; gap: 1rem; margin: 1.5rem 0; }
        .visual-box { background: var(--code-bg); padding: 2rem; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid var(--border); overflow-x: auto; }
        .visual-desc { font-size: 0.9rem; color: var(--text-muted); margin-top: 15px; text-align: center; line-height: 1.5; }
        
        .example-card { background: #0f172a; padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 1rem; }
        .example-card h4 { color: var(--success); margin-bottom: 0.5rem; display: flex; align-items: center; gap: 8px; }
        .example-desc { font-size: 0.95rem; color: var(--text-main); margin-bottom: 1rem; font-weight: 500; }
        .example-solution { background: rgba(16, 185, 129, 0.1); border-left: 3px solid var(--success); padding: 1rem; border-radius: 0 8px 8px 0; font-size: 0.9rem; color: var(--text-muted); }
        
        /* Quiz */
        .quiz-option-group { display: flex; gap: 10px; margin-top: 1rem; flex-direction: column; }
        .option-btn { width: 100%; padding: 1.2rem; background: #0f172a; border: 1px solid var(--border); border-radius: 12px; color: white; text-align: left; cursor: pointer; transition: 0.2s; font-size: 1rem; }
        .option-btn:hover:not(:disabled) { border-color: var(--primary); transform: translateX(5px); background: #1e293b; }
        .option-btn.correct { background: var(--success) !important; border-color: var(--success) !important; color: white !important; }
        .option-btn.wrong { background: var(--error) !important; border-color: var(--error) !important; color: white !important; }

        /* Dashboard Visualization */
        .mastery-item { margin-bottom: 1.5rem; }
        .mastery-label { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-weight: 600; }
        .mastery-bar-bg { height: 12px; background: var(--border); border-radius: 6px; overflow: hidden; }
        .mastery-bar-fill { height: 100%; transition: width 1s ease-in-out; }

        /* Modal */
        #modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; z-index: 1000; overflow-y: auto; }
        #modal-content { max-width: 850px; width: 95%; margin: 2rem auto; background: var(--card); border-radius: 24px; padding: 2.5rem; position: relative; }
        
        /* Top Navigation inside Modal */
        .modal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
        .back-btn { background: transparent; border: none; color: var(--text-muted); font-size: 1rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: 0.2s; padding: 0.5rem 0; }
        .back-btn:hover { color: var(--primary); }
        .close-btn { font-size: 2rem; cursor: pointer; color: var(--text-muted); transition: 0.2s; line-height: 1; }
        .close-btn:hover { color: white; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        .status-badge { font-size: 0.8rem; padding: 4px 10px; border-radius: 20px; font-weight: 700; white-space: nowrap; }
        .badge-learned { background: rgba(16, 185, 129, 0.2); color: var(--success); border: 1px solid var(--success); }
        .badge-locked { background: rgba(244, 63, 94, 0.2); color: var(--error); border: 1px solid var(--error); }
        
        .card-badge { position: absolute; top: 1.5rem; right: 1.5rem; }
    </style>
</head>
<body>

    <header>
        <h1>PlanBeforeCode Pro</h1>
        <p>확실하게 이해하고, 퀴즈로 증명하는 알고리즘 마스터 과정</p>
    </header>

    <nav>
        <button onclick="switchTab('learn')" id="tab-learn" class="active">학습 & 퀴즈</button>
        <button onclick="switchTab('dashboard')" id="tab-dashboard">나의 마스터리</button>
    </nav>

    <main>
        <!-- 1. Learn & Localized Quiz Section -->
        <div id="learn" class="tab-content active">
            <h2 style="margin-bottom: 1.5rem; display:flex; justify-content:space-between; align-items:center;">
                학습할 알고리즘 선택
                <span style="font-size:0.9rem; color:var(--text-muted); font-weight:normal;">* 개념 확인 퀴즈(5문제) 통과 시 일반 퀴즈 잠금 해제</span>
            </h2>
            <div class="grid-2" id="algo-list">
                <!-- JS handles rendering -->
            </div>
        </div>

        <!-- 2. Dashboard Section -->
        <div id="dashboard" class="tab-content">
            <div class="card">
                <h2 style="margin-bottom: 1.5rem;">알고리즘별 마스터리 지표</h2>
                <div id="mastery-container">
                    <!-- JS handles rendering -->
                </div>
                <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border);">
                    <p style="font-size: 0.9rem; color: var(--text-muted);">* 마스터리는 정답률(70%)과 학습 완료 여부(30%)를 종합하여 산출됩니다.</p>
                </div>
            </div>
            
            <div class="grid-2">
                <div class="card" style="text-align: center;">
                    <div style="font-size: 0.9rem; color: var(--text-muted);">일반 퀴즈 총 시도</div>
                    <div style="font-size: 2.5rem; font-weight: 800; color: var(--primary);" id="total-tried">0</div>
                </div>
                <div class="card" style="text-align: center;">
                    <div style="font-size: 0.9rem; color: var(--text-muted);">일반 퀴즈 정답률</div>
                    <div style="font-size: 2.5rem; font-weight: 800; color: var(--success);" id="avg-accuracy">0%</div>
                </div>
            </div>
            <button class="btn btn-outline" style="width:100%; border-color:var(--error); color:var(--error);" onclick="resetData()">학습 데이터 전체 초기화</button>
        </div>
    </main>

    <!-- Detailed Learning & Quiz Modal -->
    <div id="modal">
        <div id="modal-content">
            <!-- Navigation Header will be injected here -->
            <div id="modal-nav-container"></div>
            <!-- Body Content -->
            <div id="modal-view-content"></div>
        </div>
    </div>

    <script>
        /* --- DB: 알고리즘 상세 지식 & 문제 세트 --- */
        const ALGO_DB = [
            {
                id: 'bfs-dfs',
                name: 'BFS / DFS (그래프 탐색)',
                icon: '🕸️',
                intro: '그래프의 모든 정점을 방문하는 완전 탐색의 기초입니다.',
                theory: `
                    <div class="theory-box">
                        <h3>DFS (깊이 우선 탐색, Depth-First Search)</h3>
                        <p>한 경로로 갈 수 있을 때까지 깊게 들어갔다가, 더 이상 갈 곳이 없으면 뒤로 돌아와서(Backtracking) 다른 경로를 탐색합니다. 주로 <b>재귀함수</b>나 <b>스택(Stack)</b>을 이용해 구현합니다.</p>
                        <p style="margin-top:5px; color:var(--text-muted);">👉 <b>특징:</b> 경로의 특징을 저장해야 할 때(예: 경로에 동일한 숫자가 있으면 안됨) 유리합니다. 메모리 사용량이 상대적으로 적습니다.</p>
                    </div>
                    <div class="theory-box">
                        <h3>BFS (너비 우선 탐색, Breadth-First Search)</h3>
                        <p>시작점에서 가까운 노드부터 차례대로 탐색합니다. <b>큐(Queue)</b>를 이용해 구현합니다. 물결이 퍼져나가는 모습을 상상하면 됩니다.</p>
                        <p style="margin-top:5px; color:var(--text-muted);">👉 <b>특징:</b> 간선의 가중치가 동일할 때 <b>최단 거리</b>를 보장합니다. 최단 경로 탐색 시 무조건 BFS를 떠올려야 합니다.</p>
                    </div>
                `,
                visual: `
                    <div class="visual-box">
                        <div style="display: flex; justify-content: space-around; width: 100%; text-align: center; gap: 20px;">
                            <div style="flex: 1;">
                                <h4 style="color:var(--warning); margin-bottom:15px;">BFS (너비 우선 탐색)</h4>
                                <svg viewBox="0 0 160 120" width="100%" height="120" style="max-width:200px;">
                                    <line x1="80" y1="20" x2="40" y2="60" stroke="#334155" stroke-width="2"/>
                                    <line x1="80" y1="20" x2="120" y2="60" stroke="#334155" stroke-width="2"/>
                                    <line x1="40" y1="60" x2="20" y2="100" stroke="#334155" stroke-width="2"/>
                                    <line x1="40" y1="60" x2="60" y2="100" stroke="#334155" stroke-width="2"/>
                                    
                                    <circle cx="80" cy="20" r="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
                                    <text x="80" y="25" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">1</text>
                                    
                                    <circle cx="40" cy="60" r="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
                                    <text x="40" y="65" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">2</text>
                                    
                                    <circle cx="120" cy="60" r="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
                                    <text x="120" y="65" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">3</text>
                                    
                                    <circle cx="20" cy="100" r="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
                                    <text x="20" y="105" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">4</text>
                                    
                                    <circle cx="60" cy="100" r="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
                                    <text x="60" y="105" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">5</text>
                                </svg>
                            </div>
                            <div style="flex: 1;">
                                <h4 style="color:var(--success); margin-bottom:15px;">DFS (깊이 우선 탐색)</h4>
                                <svg viewBox="0 0 160 120" width="100%" height="120" style="max-width:200px;">
                                    <line x1="80" y1="20" x2="40" y2="60" stroke="#334155" stroke-width="2"/>
                                    <line x1="80" y1="20" x2="120" y2="60" stroke="#334155" stroke-width="2"/>
                                    <line x1="40" y1="60" x2="20" y2="100" stroke="#334155" stroke-width="2"/>
                                    <line x1="40" y1="60" x2="60" y2="100" stroke="#334155" stroke-width="2"/>
                                    
                                    <circle cx="80" cy="20" r="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
                                    <text x="80" y="25" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">1</text>
                                    
                                    <circle cx="40" cy="60" r="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
                                    <text x="40" y="65" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">2</text>
                                    
                                    <circle cx="20" cy="100" r="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
                                    <text x="20" y="105" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">3</text>
                                    
                                    <circle cx="60" cy="100" r="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
                                    <text x="60" y="105" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">4</text>
                                    
                                    <circle cx="120" cy="60" r="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
                                    <text x="120" y="65" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">5</text>
                                </svg>
                            </div>
                        </div>
                        <div class="visual-desc">
                            <b>노드 안의 숫자는 탐색 순서를 의미합니다.</b><br>
                            <b>BFS</b>는 같은 깊이의 노드를 모두 방문한 뒤 다음 깊이로 넘어가고,<br>
                            <b>DFS</b>는 한쪽 가지를 끝까지 파고든 뒤에야 다른 가지로 넘어갑니다.
                        </div>
                    </div>
                `,
                examples: [
                    { 
                        title: "유형 1: 미로 탈출 최단 거리", 
                        desc: "N x M 크기의 미로에서 시작점(0,0)부터 출구(N-1, M-1)까지 이동하는 최소 칸 수를 구하시오.",
                        solution: "✅ <b>사용 알고리즘: BFS</b><br>1. 큐(Queue)에 시작점 좌표와 현재 이동 거리(x, y, dist=1)를 삽입합니다.<br>2. 큐에서 꺼낸 좌표에서 상하좌우 4방향을 확인하고, 갈 수 있는 길(1)이며 방문하지 않았다면 큐에 삽입합니다 (이때 dist + 1).<br>3. 출구 좌표에 도달하면 현재 dist를 반환하고 종료합니다."
                    },
                    { 
                        title: "유형 2: 연결된 영역(섬)의 개수 구하기", 
                        desc: "1은 땅, 0은 물을 의미하는 지도에서 상하좌우로 연결된 땅(섬)은 총 몇 개인지 구하시오.",
                        solution: "✅ <b>사용 알고리즘: DFS 또는 BFS</b><br>1. 지도의 모든 좌표를 이중 for문으로 순회합니다.<br>2. 방문하지 않은 땅(1)을 발견하면, 정답 카운트를 +1 하고 탐색(DFS/BFS)을 시작합니다.<br>3. 탐색 함수는 연결된 모든 땅을 재귀나 큐를 통해 방문 처리(0으로 변경 또는 visited 체크)합니다.<br>4. 순회가 끝나면 정답 카운트가 섬의 개수가 됩니다."
                    }
                ],
                concept_quizzes: [
                    { q: "DFS를 구현할 때 내부적으로 사용하는 자료구조 또는 프로그래밍 기법은 무엇입니까?", options: ["Queue", "Stack / 재귀함수", "Priority Queue", "Linked List"], ans: 1 },
                    { q: "가중치가 없는 2차원 배열(미로)에서 시작점에서 목적지까지의 '최단 경로'를 찾기 위해 가장 적합한 탐색 방법은?", options: ["DFS", "BFS", "이분 탐색", "다익스트라"], ans: 1 },
                    { q: "BFS 알고리즘을 구현할 때 사용하는 필수 자료구조는?", options: ["Stack", "Hash Table", "Queue", "Tree"], ans: 2 },
                    { q: "방향성이 없는 그래프에서 '사이클(Cycle)' 존재 여부를 판별하는 데 효율적으로 사용할 수 있는 탐색 기법은?", options: ["DFS", "투 포인터", "그리디", "누적 합"], ans: 0 },
                    { q: "다음 중 재귀 함수를 깊게 호출할 경우 발생할 수 있는 치명적인 에러의 이름은?", options: ["Memory Leak", "Time Limit Exceeded", "Stack Overflow", "Queue Underflow"], ans: 2 }
                ],
                quizzes: [
                    { type: 'mc', q: "DFS는 최단 경로를 보장한다.", options: ["O (그렇다)", "X (아니다)"], ans: 1 },
                    { type: 'ox', q: "BFS에서 노드를 큐에 넣을 때 방문 처리를 하는 것이 중복 삽입을 막는 데 유리하다.", options: ["O", "X"], ans: 0 },
                    { type: 'mc', q: "N이 10만일 때 O(N^2)의 2중 for문 안에서 매번 DFS를 돌리는 방식은 시간초과가 날 확률이 높다.", options: ["O", "X"], ans: 0 }
                ]
            },
            {
                id: 'dp',
                name: '동적 계획법 (DP)',
                icon: '💎',
                intro: '기억(메모이제이션)을 통해 중복 연산을 방지하여 최적해를 구하는 기법입니다.',
                theory: `
                    <div class="theory-box">
                        <h3>동적 계획법의 2가지 조건</h3>
                        <p><b>1. 최적 부분 구조 (Optimal Substructure):</b> 큰 문제의 최적해가 작은 문제들의 최적해로 이루어져 있어야 합니다.<br>
                        <b>2. 중복되는 부분 문제 (Overlapping Subproblems):</b> 동일한 작은 문제들이 반복해서 나타나야 합니다.</p>
                    </div>
                    <div class="theory-box">
                        <h3>메모이제이션 (Memoization)</h3>
                        <p>한 번 계산한 결과를 배열이나 해시 테이블에 저장해 두고, 나중에 동일한 계산이 필요할 때 저장된 값을 꺼내 쓰는 캐싱(Caching) 기법입니다. 이를 통해 지수 시간(O(2^N))이 걸릴 수 있는 문제를 다항 시간(O(N))으로 줄여줍니다.</p>
                    </div>
                `,

                    <span style="color:var(--text-muted)">문항 ${idx+1} / 5</span>
                </div>
                <div style="height:4px; background:var(--border); margin-bottom:2rem; border-radius:2px; overflow:hidden;">
                    <div style="height:100%; background:var(--primary); width:${(idx/5)*100}%; transition:0.3s;"></div>
                </div>
                
                <h2 style="margin-bottom:2.5rem; font-size:1.4rem; line-height:1.4;">${q.q}</h2>
                <div class="quiz-option-group">
                    ${q.options.map((opt, i) => `
                        <button class="option-btn" onclick="handleConceptAnswer('${algoId}', ${JSON.stringify(qSet).replace(/"/g, '&quot;')}, ${idx}, ${i}, ${score}, this)">${opt}</button>
                    `).join('')}
                </div>
            `;
        }

        function handleConceptAnswer(algoId, qSet, idx, selected, score, btnElement) {
            const q = qSet[idx];
            const isCorrect = selected === q.ans;
            const btns = document.querySelectorAll('.option-btn');
            
            btns.forEach((btn, i) => {
                btn.disabled = true;
                if(i === q.ans) btn.classList.add('correct');
                else if(i === selected) btn.classList.add('wrong');
            });

            if(isCorrect) score++;

            setTimeout(() => {
                if(idx + 1 < qSet.length) {
                    renderConceptQuizPage(algoId, qSet, idx + 1, score);
                } else {
                    renderConceptResult(algoId, score);
                }
            }, 1200);
        }

        function renderConceptResult(algoId, score) {
            renderHeader('이론 학습으로', `openLearn('${algoId}')`);
            const view = document.getElementById('modal-view-content');
            const passed = (score === 5);
            
            if(passed) {
                if(!state.stats[algoId]) state.stats[algoId] = {tried:0, correct:0, learned:false};
                state.stats[algoId].learned = true;
                save();
            }

            view.innerHTML = `
                <div style="text-align:center; padding:3rem 1rem;">
                    <div style="font-size:5rem; margin-bottom:1rem;">${passed ? '🎉' : '🥲'}</div>
                    <h2 style="font-size:2rem; margin-bottom:1rem; color:${passed ? 'var(--success)' : 'var(--error)'}">
                        ${passed ? '학습 완료! 축하합니다.' : '앗, 조금 아쉽네요.'}
                    </h2>
                    <p style="font-size:1.2rem; margin-bottom:2rem;">정답: <b>${score} / 5</b></p>
                    
                    ${passed 
                        ? `<p style="color:var(--text-muted); margin-bottom:2rem;">개념을 완벽하게 숙지하셨습니다. 이제 실전 퀴즈를 풀어보세요!</p>
                           <button class="btn btn-primary" onclick="openQuizSelection('${algoId}')">일반 퀴즈 바로가기</button>` 
                        : `<p style="color:var(--text-muted); margin-bottom:2rem;">학습 완료를 위해서는 5문제를 모두 맞춰야 합니다.<br>이론을 다시 한 번 천천히 읽어보고 재도전해보세요!</p>
                           <div style="display:flex; gap:10px; justify-content:center;">
                               <button class="btn btn-primary" onclick="startConceptQuiz('${algoId}')">퀴즈 다시 풀기</button>
                               <button class="btn btn-outline" onclick="openLearn('${algoId}')">이론 다시 보기</button>
                           </div>`
                    }
                </div>
            `;
        }

        /* --- Regular Quiz Selection & Flow --- */
        function openQuizSelection(id) {
            renderHeader('목록으로', 'closeModal()');
            const algo = ALGO_DB.find(a => a.id === id);
            const view = document.getElementById('modal-view-content');
            
            view.innerHTML = `
                <h2 style="margin-bottom:1rem; color:var(--primary); font-size:1.8rem; margin-top:0;">${algo.icon} ${algo.name} 실전 퀴즈</h2>
                <p style="color:var(--text-muted); margin-bottom:2rem;">원하시는 퀴즈 형식을 선택하세요.</p>
                <div class="grid-2">
                    <button class="btn btn-outline" style="padding:3rem 1rem; border-radius:16px; display:flex; flex-direction:column; align-items:center; gap:15px;" onclick="startRegularQuiz('${id}', 'mc')">
                        <div style="font-size:3rem;">📝</div>
                        <div style="font-size:1.2rem;">객관식 퀴즈 시작</div>
                    </button>
                    <button class="btn btn-outline" style="padding:3rem 1rem; border-radius:16px; display:flex; flex-direction:column; align-items:center; gap:15px;" onclick="startRegularQuiz('${id}', 'ox')">
                        <div style="font-size:3rem;">⭕❌</div>
                        <div style="font-size:1.2rem;">OX 퀴즈 시작</div>
                    </button>
                </div>
            `;
            document.getElementById('modal').style.display = 'block';
        }

        function startRegularQuiz(id, type) {
            renderHeader('퀴즈 선택으로', `openQuizSelection('${id}')`);
            const algo = ALGO_DB.find(a => a.id === id);
            const questions = algo.quizzes.filter(q => q.type === type);
            if(questions.length === 0) {
                alert("해당 유형의 문제가 준비 중입니다. 다른 유형을 선택해주세요.");
                return;
            }
            const shuffled = [...questions].sort(() => 0.5 - Math.random());
            renderRegularQuizPage(id, shuffled, 0, 0);
        }

        function renderRegularQuizPage(algoId, qSet, idx, score) {
            const view = document.getElementById('modal-view-content');
            const q = qSet[idx];
            document.getElementById('modal-content').scrollTop = 0;

            view.innerHTML = `
                <div style="margin-bottom:1rem; display:flex; justify-content:space-between; color:var(--text-muted);">
                    <span>일반 실전 퀴즈</span>
                    <span>문항 ${idx+1} / ${qSet.length}</span>
                </div>
                
                <h2 style="margin-bottom:2rem; font-size:1.3rem;">${q.q}</h2>
                <div class="quiz-option-group">
                    ${q.options.map((opt, i) => `
                        <button class="option-btn" onclick="handleRegularAnswer('${algoId}', ${JSON.stringify(qSet).replace(/"/g, '&quot;')}, ${idx}, ${i}, ${score})">${opt}</button>
                    `).join('')}
                </div>
            `;
        }

        function handleRegularAnswer(algoId, qSet, idx, selected, score) {
            const q = qSet[idx];
            const isCorrect = selected === q.ans;
            const btns = document.querySelectorAll('.option-btn');
            
            btns.forEach((btn, i) => {
                btn.disabled = true;
                if(i === q.ans) btn.classList.add('correct');
                else if(i === selected) btn.classList.add('wrong');
            });

            if(!state.stats[algoId]) state.stats[algoId] = {tried:0, correct:0, learned:true};
            state.stats[algoId].tried++;
            if(isCorrect) {
                state.stats[algoId].correct++;
                score++;
            }
            save();

            setTimeout(() => {
                if(idx + 1 < qSet.length) {
                    renderRegularQuizPage(algoId, qSet, idx + 1, score);
                } else {
                    renderRegularResult(algoId, score, qSet.length);
                }
            }, 1200);
        }

        function renderRegularResult(algoId, score, total) {
            renderHeader('퀴즈 선택으로', `openQuizSelection('${algoId}')`);
            const view = document.getElementById('modal-view-content');
            view.innerHTML = `
                <div style="text-align:center; padding:2rem;">
                    <div style="font-size:4rem; margin-bottom:1rem;">${score === total ? '🏆' : '👏'}</div>
                    <h2 style="margin-bottom:1rem;">퀴즈 완료!</h2>
                    <p style="font-size:1.5rem; margin:1rem 0;">점수: <b>${score} / ${total}</b></p>
                    <p style="color:var(--text-muted); margin-bottom:2rem;">대시보드 마스터리에 결과가 반영되었습니다.</p>
                    <div style="display:flex; gap:10px; justify-content:center;">
                        <button class="btn btn-primary" onclick="closeModal()">목록으로</button>
                    </div>
                </div>
            `;
        }

        /* --- Dashboard Logic --- */
        function updateDashboard() {
            const container = document.getElementById('mastery-container');
            let totalT = 0, totalC = 0;

            container.innerHTML = ALGO_DB.map(algo => {
                const s = state.stats[algo.id] || {tried:0, correct:0, learned:false};
                totalT += s.tried;
                totalC += s.correct;

                const accuracy = s.tried === 0 ? (s.learned ? 100 : 0) : (s.correct / s.tried) * 100;
                const progress = s.learned ? 100 : 0;
                let mastery = 0;
                if(s.tried === 0 && !s.learned) mastery = 0;
                else if(s.tried === 0 && s.learned) mastery = 30;
                else mastery = Math.round((accuracy * 0.7) + (progress * 0.3));

                let barColor = 'linear-gradient(90deg, #94a3b8, #cbd5e1)';
                if(mastery >= 80) barColor = 'linear-gradient(90deg, #10b981, #34d399)';
                else if(mastery >= 40) barColor = 'linear-gradient(90deg, #6366f1, #818cf8)';
                else if(mastery > 0) barColor = 'linear-gradient(90deg, #f59e0b, #fbbf24)';

                return `
                    <div class="mastery-item">
                        <div class="mastery-label">
                            <span>${algo.name}</span>
                            <span>${mastery}% ${s.learned ? '✅' : '🔒'}</span>
                        </div>
                        <div class="mastery-bar-bg">
                            <div class="mastery-bar-fill" style="width: ${mastery}%; background: ${barColor};"></div>
                        </div>
                        <div style="font-size:0.8rem; color:var(--text-muted); margin-top:4px; text-align:right;">
                            퀴즈 ${s.correct}/${s.tried} 정답
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('total-tried').innerText = totalT + "제";
            const avgAcc = totalT === 0 ? 0 : Math.round((totalC / totalT) * 100);
            document.getElementById('avg-accuracy').innerText = avgAcc + '%';
        }

        /* --- Utilities --- */
        function save() { localStorage.setItem('pbc_pro_v4_stats', JSON.stringify(state.stats)); }
        function closeModal() { document.getElementById('modal').style.display = 'none'; renderAlgoList(); updateDashboard(); }
        function resetData() { 
            if(confirm("모든 학습 완료 상태와 퀴즈 기록이 영구적으로 삭제됩니다. 계속하시겠습니까?")) { 
                localStorage.clear(); 
                location.reload(); 
            } 
        }

        window.onclick = function(event) { if (event.target == document.getElementById('modal')) closeModal(); }

        // Start App
        init();
    </script>
</body>
</html>
