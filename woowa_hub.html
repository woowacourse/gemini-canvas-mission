<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Woowa Hub</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --bg-sidebar: #0f172a;
            --bg-main: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --white: #ffffff;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styles */
        aside {
            width: 260px;
            background-color: var(--bg-sidebar);
            color: white;
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
            flex-shrink: 0;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 8px;
        }

        .logo-box {
            width: 32px;
            height: 32px;
            background-color: var(--primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            color: #94a3b8;
            font-weight: 500;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover { background-color: #1e293b; color: white; }
        .nav-item.active { background-color: var(--primary); color: white; }

        /* Main Content area */
        main {
            flex: 1;
            overflow-y: auto;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        header { padding: 32px 40px 16px; display: flex; justify-content: space-between; align-items: flex-end; }
        .view-content { padding: 0 40px 40px; flex: 1; }
        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; }
        .subtitle { color: var(--text-muted); font-size: 0.9rem; }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn-primary:hover { background-color: var(--primary-dark); }

        /* List Section Styles */
        .section-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 24px;
        }

        .list-container { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            transition: all 0.2s;
        }

        .todo-item.today-highlight { border-left: 4px solid var(--warning); background: #fffbeb; }
        .todo-item.completed { opacity: 0.6; }
        .todo-item.completed .todo-title { text-decoration: line-through; color: var(--text-muted); }

        .todo-checkbox { width: 18px; height: 18px; cursor: pointer; }
        .todo-content { flex: 1; }
        .todo-title { font-weight: 600; font-size: 1rem; margin-bottom: 2px; }
        .todo-desc { font-size: 0.85rem; color: var(--text-muted); }

        .todo-actions { display: flex; gap: 4px; }

        .btn-icon {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            color: var(--text-muted);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:hover { background: var(--border); }
        .btn-danger:hover { color: var(--danger); }
        .btn-success:hover { color: var(--success); }

        /* Links Grid (Life) */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .link-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .link-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .link-actions { position: absolute; top: 16px; right: 16px; display: flex; gap: 4px; }
        .link-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 8px; padding-right: 60px; }
        .link-desc { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }

        .link-btn {
            width: 100%;
            text-align: center;
            background: var(--bg-main);
            padding: 10px;
            border-radius: 8px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Calendar Styles */
        .calendar-container { background: white; border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid var(--border); }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
        .calendar-day-label { padding: 12px; text-align: center; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); background: var(--bg-main); border-bottom: 1px solid var(--border); }

        .calendar-cell {
            min-height: 110px;
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            padding: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .calendar-cell:nth-child(7n) { border-right: none; }
        .calendar-cell:hover { background: #fdfdfd; }
        .calendar-cell.drag-over { background: #eff6ff; border: 2px dashed var(--primary); }

        .day-num { font-size: 0.85rem; font-weight: 500; margin-bottom: 4px; display: inline-flex; align-items: center; justify-content: center; }

        /* Today Circle Design */
        .day-num.today-circle {
            background-color: var(--primary);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
        }

        .cal-assignment {
            background: #dbeafe;
            color: #1e40af;
            padding: 4px 6px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: grab;
            user-select: none;
        }
        .cal-assignment.done {
            background: #dcfce7;
            color: #166534;
            text-decoration: line-through;
            border: 1px solid #bbf7d0;
        }

        /* Side Panel */
        .side-panel {
            position: fixed;
            right: 0;
            top: 0;
            width: 440px;
            height: 100vh;
            background: white;
            box-shadow: -10px 0 30px rgba(0,0,0,0.1);
            z-index: 100;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }

        .side-panel.open { transform: translateX(0); }
        .panel-header { padding: 32px 24px 24px; border-bottom: 1px solid var(--border); }
        .panel-content { flex: 1; overflow-y: auto; padding: 24px; }

        .editable-field {
            padding: 8px;
            border: 1px solid transparent;
            border-radius: 8px;
            transition: all 0.2s;
            min-height: 1.5em;
            min-width: 50px;
            word-break: break-all;
        }

        .editable-field[contenteditable="true"] {
            border-color: var(--primary) !important;
            background: white !important;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            cursor: text;
        }

        .editable-field:hover { border-color: var(--border); background: var(--bg-main); }
        .editable-field:focus { outline: none; }

        .panel-section { margin-bottom: 32px; }
        .section-title { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.05em; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }

        .comment-item {
            background: var(--bg-main);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border: 1px solid transparent;
        }

        .comment-item:hover { border-color: var(--border); }
        .comment-actions { display: flex; gap: 4px; }

        /* Fixed word wrapping and line breaks for memos */
        .comment-text {
            flex: 1;
            outline: none;
            min-height: 1.2em;
            min-width: 50px;
            word-break: break-all;
            overflow-wrap: break-word;
            white-space: pre-wrap; /* Respect manual line breaks */
        }

        .comment-input-area { padding: 24px; border-top: 1px solid var(--border); }

        /* Modal Styles */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 200; }
        .modal-overlay.active { display: flex; }
        .modal { background: white; width: 100%; max-width: 500px; border-radius: 24px; padding: 32px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; }
        .form-control { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px; font-size: 1rem; }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<!-- Sidebar -->
<aside>
    <div class="logo">
        <div class="logo-box">
            <i data-lucide="orbit" size="18"></i>
        </div>
        Woowa Hub
    </div>
    <nav id="topic-nav">
        <button class="nav-item active" data-topic="notice"><i data-lucide="bell"></i> 공지사항</button>
        <button class="nav-item" data-topic="life"><i data-lucide="coffee"></i> 생활</button>
        <button class="nav-item" data-topic="assignment"><i data-lucide="layout"></i> 과제</button>
        <button class="nav-item" data-topic="pair"><i data-lucide="users"></i> 페어 프로그래밍</button>
        <button class="nav-item" data-topic="team"><i data-lucide="message-square"></i> 팀 프로젝트</button>
    </nav>
</aside>

<!-- Main View -->
<main id="main-content">
    <header>
        <div>
            <h1 id="view-title">공지사항</h1>
            <p class="subtitle" id="view-subtitle">중요 공지를 한 곳에서 관리하세요.</p>
        </div>
        <button class="btn-primary" id="add-btn">
            <i data-lucide="plus"></i> <span id="add-btn-text">공지 등록</span>
        </button>
    </header>

    <section class="view-content" id="view-container"></section>
</main>

<!-- Assignment Side Panel -->
<div class="side-panel" id="assignment-panel">
    <div class="panel-header">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 8px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 800; letter-spacing: 0.1em;">ASSIGNMENT DETAIL</span>
                <div style="display: flex; gap: 4px;">
                    <button class="btn-icon btn-danger" onclick="deleteCurrentAssignment()" title="과제 삭제"><i data-lucide="trash-2" size="16"></i></button>
                    <button class="btn-icon" onclick="closePanel()" title="닫기"><i data-lucide="x" size="18"></i></button>
                </div>
            </div>
            <div style="display: flex; align-items: center; gap: 4px;">
                <h2 id="panel-title" contenteditable="false" class="editable-field" style="font-size: 1.5rem; font-weight: 800; margin-left: -8px; flex: 1;"></h2>
                <button class="btn-icon" id="edit-btn-title" onclick="toggleEditField('panel-title', 'title', 'edit-btn-title')"><i data-lucide="edit-2" size="16"></i></button>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px;">
                <i data-lucide="calendar" size="14" class="text-muted"></i>
                <input type="date" id="panel-date-input" class="form-control" style="width: auto; padding: 4px 8px; font-size: 0.85rem; border: none; background: transparent;" onchange="updateAssignmentField('date', this.value)">
            </div>
            <div style="display: flex; align-items: center; gap: 10px; margin-top: 4px;">
                <input type="checkbox" id="panel-complete-check" class="todo-checkbox">
                <span style="font-size: 0.95rem; font-weight: 600; color: var(--text-main);">완료 여부</span>
            </div>
        </div>
    </div>
    <div class="panel-content">
        <div class="panel-section">
            <h4 class="section-title">
                <span><i data-lucide="info" size="14"></i> 설명</span>
                <button class="btn-icon" id="edit-btn-desc" onclick="toggleEditField('panel-desc', 'desc', 'edit-btn-desc')"><i data-lucide="edit-2" size="14"></i></button>
            </h4>
            <div id="panel-desc" contenteditable="false" class="editable-field" style="font-size: 1rem; line-height: 1.6; color: var(--text-main); margin-left: -8px;"></div>
        </div>
        <div class="panel-section">
            <h4 class="section-title">
                <span><i data-lucide="external-link" size="14"></i> 제출 링크</span>
                <button class="btn-icon" id="edit-btn-submitUrl" onclick="toggleEditField('panel-submit-link-text', 'submitUrl', 'edit-btn-submitUrl', true)"><i data-lucide="edit-2" size="14"></i></button>
            </h4>
            <div style="display: flex; gap: 8px; align-items: center;">
                <div id="panel-submit-link-text" contenteditable="false" class="editable-field" style="flex: 1; font-size: 0.9rem; color: var(--primary); text-decoration: underline; margin-left: -8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">제출 링크 바로가기</div>
                <a id="panel-submit-link-btn" href="#" target="_blank" class="btn-icon" style="color: var(--primary);"><i data-lucide="arrow-up-right"></i></a>
            </div>
        </div>
        <div class="panel-section">
            <h4 class="section-title"><span><i data-lucide="message-circle" size="14"></i> 공지 및 메모</span></h4>
            <div id="panel-comments"></div>
        </div>
    </div>
    <div class="comment-input-area">
        <input type="text" id="comment-input" class="form-control" placeholder="메모를 입력하고 Enter를 누르세요...">
    </div>
</div>

<!-- Modals -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal-content">
        <h3 id="modal-title" style="margin-bottom: 24px; font-size: 1.25rem;">추가하기</h3>
        <form id="main-form">
            <div id="form-fields"></div>
            <div style="display: flex; gap: 12px; margin-top: 32px;">
                <button type="button" class="btn-primary" style="background: var(--border); color: var(--text-main); flex: 1;" onclick="closeModal()">취소</button>
                <button type="submit" class="btn-primary" style="flex: 2;">저장하기</button>
            </div>
        </form>
    </div>
</div>

<script>
    // --- DATA STATE ---
    let state = {
        activeTopic: 'notice',
        notices: [
            { id: 1, title: 'kdt 수료 관련 공지', desc: '줌에서 2시반에 진행 예정', date: '2026-02-26', url: '', completed: false },
            { id: 2, title: '도서관', desc: '도서관 책은 내부에서 사용', date: '', url: '', completed: true },
            { id: 3, title: '연극 시연', desc: '우리팀은 13층에서 진행 예정', date: '2026-03-03', url: '', completed: false }
        ],
        life: [
            { id: 1, title: 'LMS', desc: '수강 과목과 과제 공지사항을 확인할 수 있는 우테코 LMS입니다.', url: 'https://techcourse.woowahan.com/' },
            { id: 2, title: 'LMS+', desc: '생활에 필요한 링크들을 모아두었습니다.', url: 'https://techcourse-lms-plus-web.woowahan.com/crew' },
            { id: 3, title: '찜꽁', desc: '회의실 예약할 수 있는 찜꽁 링크입니다.', url: 'https://zzimkkong.com/guest/gAjJTeISFY54CNKWYmOVxQ' }
        ],
        assignments: [
            {
                id: 1,
                title: '웹앱 만들기',
                date: '2026-02-26',
                desc: '6시까지 깃허브로 제출',
                submitUrl: 'https://github.com/woowacourse/gemini-canvas-mission',
                completed: false,
                comments: [
                    { id: 1001, text: '3개의 개인 프로젝트와 1개의 페어 프로그래밍을 완성해서 제출(유틸, 게임, 학습, 페어)\n\n관련 LMS 공지 : https://techcourse.woowahan.com/s/jNIeIA9C/ls/be4zF0sV' },
                    { id: 1002, text: '4개의 html 파일로 제출\n\n관련 Slack 공지 : https://woowacourse.slack.com/archives/C0AEFJT6285/p1771993480318849' }
                ]
            }
        ],
        pair: [
            { id: 1, title: '웹앱 만들기', desc: '페어와 제미나이 canvas를 이용해서 웹앱 만들기', completed: false }
        ],
        team: [
            { id: 1, title: '연극 대본 완성', desc: '팀원들과 연극 대본 완성하고, 리허설해보기', completed: false }
        ],
        calendar: { currentMonth: 1, currentYear: 2026 } // Feb 2026
    };

    let editingId = null;
    let currentAssignmentId = null;

    // Helper: Convert https://... URLs in text into clickable <a> tags
    function linkify(text) {
        const urlRegex = /(https?:\/\/[^\s]+)/g;
        return text.replace(urlRegex, function(url) {
            return `<a href="${url}" target="_blank" style="color: var(--primary); text-decoration: underline;">${url}</a>`;
        });
    }

    // --- DOM ELEMENTS ---
    let viewContainer, viewTitle, viewSubtitle, addBtn, addBtnText, topicButtons, modalOverlay, formFields, mainForm, assignmentPanel;

    // --- INITIALIZE ---
    window.onload = () => {
        viewContainer = document.getElementById('view-container');
        viewTitle = document.getElementById('view-title');
        viewSubtitle = document.getElementById('view-subtitle');
        addBtn = document.getElementById('add-btn');
        addBtnText = document.getElementById('add-btn-text');
        topicButtons = document.querySelectorAll('.nav-item');
        modalOverlay = document.getElementById('modal-overlay');
        formFields = document.getElementById('form-fields');
        mainForm = document.getElementById('main-form');
        assignmentPanel = document.getElementById('assignment-panel');

        // Set up navigation
        topicButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                topicButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.activeTopic = btn.dataset.topic;
                closePanel();
                renderView();
            });
        });

        addBtn.onclick = () => openModal();

        // Form Submit handling
        mainForm.onsubmit = (e) => {
            e.preventDefault();
            const fd = new FormData(mainForm);
            const t = state.activeTopic;

            if (t === 'notice' || t === 'pair' || t === 'team') {
                const collection = t === 'notice' ? 'notices' : t;
                if (editingId) {
                    const item = state[collection].find(x => x.id === editingId);
                    if(item) {
                        item.title = fd.get('title');
                        item.desc = fd.get('desc');
                        if (t === 'notice') {
                            item.date = fd.get('date');
                            item.url = fd.get('url');
                        }
                    }
                } else {
                    const newItem = {
                        id: Date.now(),
                        title: fd.get('title'),
                        desc: fd.get('desc'),
                        completed: false
                    };
                    if (t === 'notice') {
                        newItem.date = fd.get('date') || '';
                        newItem.url = fd.get('url') || '';
                    }
                    state[collection].unshift(newItem);
                }
            } else if (t === 'life') {
                if (editingId) {
                    const l = state.life.find(x => x.id === editingId);
                    if(l) { l.title=fd.get('title'); l.desc=fd.get('desc'); l.url=fd.get('url'); }
                } else {
                    state.life.unshift({ id: Date.now(), title: fd.get('title'), desc: fd.get('desc'), url: fd.get('url') });
                }
            } else if (t === 'assignment') {
                state.assignments.push({ id: Date.now(), title: fd.get('title'), date: fd.get('date'), desc: fd.get('desc'), submitUrl: fd.get('submitUrl'), completed: false, comments: [] });
            }
            closeModal();
            renderView();
        };

        renderView();
        lucide.createIcons();
    };

    // --- RENDERING ---
    function renderView() {
        if (!viewContainer) return;
        const topic = state.activeTopic;
        viewContainer.innerHTML = '';

        const config = {
            notice: { title: '공지사항', subtitle: '오늘의 주요 공지를 확인하고 할 일을 관리하세요.', btn: '공지 등록' },
            life: { title: '생활 정보', subtitle: '링크를 모아두고 필요할 때 언제든 확인하세요.', btn: '링크 추가' },
            assignment: { title: '과제 관리', subtitle: '일정을 확인하고 과제별 자료를 정리하세요.', btn: '과제 등록' },
            pair: { title: '페어 프로그래밍', subtitle: '페어와 함께 할 일들을 투두 리스트로 관리하세요.', btn: '할 일 추가' },
            team: { title: '팀 프로젝트', subtitle: '팀 프로젝트 진행 상황을 체크하세요.', btn: '할 일 추가' }
        };

        viewTitle.innerText = config[topic].title;
        viewSubtitle.innerText = config[topic].subtitle;
        addBtnText.innerText = config[topic].btn;

        if (topic === 'notice') renderNoticeView();
        else if (topic === 'life') renderLifeView();
        else if (topic === 'assignment') renderAssignmentView();
        else if (topic === 'pair' || topic === 'team') renderTodoListView(topic);

        lucide.createIcons();
    }

    function renderNoticeView() {
        const today = new Date().toISOString().split('T')[0];
        const todayNotices = state.notices.filter(n => n.date === today);
        const otherNotices = state.notices.filter(n => n.date !== today);

        let html = '';
        if (todayNotices.length > 0) {
            html += `<div class="section-label"><i data-lucide="zap" size="14"></i> 오늘의 공지사항</div>`;
            html += `<div class="list-container">${todayNotices.map(n => renderTodoItemHTML(n, 'notices', true)).join('')}</div>`;
        }
        html += `<div class="section-label"><i data-lucide="list" size="14"></i> 전체 공지사항</div>`;
        html += `<div class="list-container">${otherNotices.map(n => renderTodoItemHTML(n, 'notices', false)).join('')}</div>`;
        if (state.notices.length === 0) html += `<p style="text-align:center; color:var(--text-muted); padding:40px;">등록된 공지가 없습니다.</p>`;
        viewContainer.innerHTML = html;
    }

    function renderTodoListView(topic) {
        const items = state[topic];
        let html = `<div class="list-container" style="margin-top: 24px;">`;
        html += items.map(item => renderTodoItemHTML(item, topic)).join('');
        if (items.length === 0) html += `<p style="text-align:center; color:var(--text-muted); padding:40px;">등록된 할 일이 없습니다.</p>`;
        html += `</div>`;
        viewContainer.innerHTML = html;
    }

    function renderTodoItemHTML(n, collection, isToday = false) {
        return `
                <div class="todo-item ${n.completed ? 'completed' : ''} ${isToday ? 'today-highlight' : ''}">
                    <input type="checkbox" class="todo-checkbox" ${n.completed ? 'checked' : ''} onchange="toggleTodoStatus('${collection}', ${n.id})">
                    <div class="todo-content">
                        <div class="todo-title">${n.title}</div>
                        <div class="todo-desc">${n.desc} ${n.date ? `| ${n.date}` : ''}</div>
                    </div>
                    <div class="todo-actions">
                        ${n.url ? `<a href="${n.url}" target="_blank" class="btn-icon" style="color:var(--primary);"><i data-lucide="external-link" size="16"></i></a>` : ''}
                        <button class="btn-icon" onclick="openEditTodo('${collection}', ${n.id})"><i data-lucide="edit-2" size="16"></i></button>
                        <button class="btn-icon btn-danger" onclick="deleteItem('${collection}', ${n.id})"><i data-lucide="trash-2" size="16"></i></button>
                    </div>
                </div>`;
    }

    function renderLifeView() {
        const html = `
                <div class="links-grid">
                    ${state.life.map(l => `
                        <div class="link-card">
                            <div class="link-actions">
                                <button class="btn-icon" onclick="openEditLife(${l.id})"><i data-lucide="edit-2" size="14"></i></button>
                                <button class="btn-icon btn-danger" onclick="deleteItem('life', ${l.id})"><i data-lucide="trash-2" size="14"></i></button>
                            </div>
                            <div>
                                <div class="link-title">${l.title}</div>
                                <div class="link-desc">${l.desc || '설명이 없습니다.'}</div>
                            </div>
                            ${l.url ? `<a href="${l.url}" target="_blank" class="link-btn">링크 열기 <i data-lucide="external-link" size="14"></i></a>` : `<div class="link-btn" style="opacity:0.5; color:var(--text-muted); cursor:default;">링크 없음</div>`}
                        </div>`).join('')}
                </div>`;
        viewContainer.innerHTML = html;
    }

    function renderAssignmentView() {
        const { currentMonth, currentYear } = state.calendar;
        const firstDay = new Date(currentYear, currentMonth, 1).getDay();
        const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        const monthName = new Intl.DateTimeFormat('ko-KR', { month: 'long', year: 'numeric' }).format(new Date(currentYear, currentMonth));

        // Get today's date string
        const todayStr = new Date().toISOString().split('T')[0];

        let html = `
                <div class="calendar-container">
                    <div class="calendar-header">
                        <button class="btn-icon" onclick="changeMonth(-1)"><i data-lucide="chevron-left"></i></button>
                        <h2 style="font-size: 1.1rem; font-weight: 700;">${monthName}</h2>
                        <button class="btn-icon" onclick="changeMonth(1)"><i data-lucide="chevron-right"></i></button>
                    </div>
                    <div class="calendar-grid">
                        ${['일', '월', '화', '수', '목', '금', '토'].map(d => `<div class="calendar-day-label">${d}</div>`).join('')}
                        ${Array(firstDay).fill(0).map(() => `<div class="calendar-cell empty"></div>`).join('')}
                        ${Array(daysInMonth).fill(0).map((_, i) => {
            const day = i + 1;
            const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const dayAssists = state.assignments.filter(a => a.date === dateStr);
            const isToday = dateStr === todayStr;

            return `
                                <div class="calendar-cell" onclick="openAssignmentPanelByDate('${dateStr}')"
                                     ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, '${dateStr}')">
                                    <div class="day-num ${isToday ? 'today-circle' : ''}">${day}</div>
                                    ${dayAssists.map(a => `
                                        <div class="cal-assignment ${a.completed ? 'done' : ''}" draggable="true" ondragstart="handleDragStart(event, ${a.id})">
                                            ${a.title}
                                        </div>`).join('')}
                                </div>`;
        }).join('')}
                    </div>
                </div>`;
        viewContainer.innerHTML = html;
    }

    // --- DATA ACTIONS ---
    function toggleTodoStatus(col, id) {
        const item = state[col].find(x => x.id === id);
        if(item) item.completed = !item.completed;
        renderView();
    }

    function deleteItem(col, id) {
        state[col] = state[col].filter(x => x.id !== id);
        renderView();
    }

    function deleteCurrentAssignment() {
        if(!currentAssignmentId) return;
        state.assignments = state.assignments.filter(a => a.id !== currentAssignmentId);
        closePanel();
        renderView();
    }

    function changeMonth(d) {
        state.calendar.currentMonth += d;
        if(state.calendar.currentMonth>11){state.calendar.currentMonth=0; state.calendar.currentYear++;}
        else if(state.calendar.currentMonth<0){state.calendar.currentMonth=11; state.calendar.currentYear--;}
        renderView();
    }

    // --- DRAG AND DROP ---
    function handleDragStart(e, id) { e.dataTransfer.setData('text/plain', id); e.target.style.opacity = '0.5'; }
    function handleDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
    function handleDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
    function handleDrop(e, newDate) {
        e.preventDefault(); e.currentTarget.classList.remove('drag-over');
        const id = parseInt(e.dataTransfer.getData('text/plain'));
        const a = state.assignments.find(x => x.id === id);
        if (a) { a.date = newDate; renderView(); }
    }

    // --- MODAL ---
    function openModal() {
        const topic = state.activeTopic;
        formFields.innerHTML = '';
        document.getElementById('modal-title').innerText = `${viewTitle.innerText} 추가`;
        if (topic === 'notice' || topic === 'pair' || topic === 'team') {
            const fields = [{ label: '제목', name: 'title', type: 'text', req: true }, { label: '설명', name: 'desc', type: 'text' }];
            if (topic === 'notice') {
                fields.push({ label: '날짜', name: 'date', type: 'date' });
                fields.push({ label: '링크', name: 'url', type: 'url' });
            }
            injectFields(fields);
        } else if (topic === 'life') {
            injectFields([{ label: '이름', name: 'title', type: 'text', req: true }, { label: '설명', name: 'desc', type: 'text' }, { label: '링크', name: 'url', type: 'url' }]);
        } else if (topic === 'assignment') {
            injectFields([{ label: '과제 이름', name: 'title', type: 'text', req: true }, { label: '기한', name: 'date', type: 'date', req: true }, { label: '설명', name: 'desc', type: 'textarea' }, { label: '제출 링크', name: 'submitUrl', type: 'url' }]);
        }
        modalOverlay.classList.add('active');
    }

    function openEditTodo(col, id) {
        editingId = id;
        const n = state[col].find(x => x.id === id);
        if (!n) return;

        let activeTopicUI = col === 'notices' ? 'notice' : col;
        state.activeTopic = activeTopicUI;

        openModal();
        document.getElementById('modal-title').innerText = '정보 수정';

        const elements = mainForm.elements;
        if (elements['title']) elements['title'].value = n.title || '';
        if (elements['desc']) elements['desc'].value = n.desc || '';
        if (elements['date']) elements['date'].value = n.date || '';
        if (elements['url']) elements['url'].value = n.url || '';
    }

    function openEditLife(id) {
        editingId = id; const l = state.life.find(x => x.id === id);
        if (!l) return;
        state.activeTopic = 'life'; openModal();
        document.getElementById('modal-title').innerText = '링크 수정';
        const elements = mainForm.elements;
        if (elements['title']) elements['title'].value = l.title || '';
        if (elements['desc']) elements['desc'].value = l.desc || '';
        if (elements['url']) elements['url'].value = l.url || '';
    }

    function injectFields(fs) {
        fs.forEach(f => {
            const d = document.createElement('div'); d.className = 'form-group';
            d.innerHTML = `<label>${f.label} ${f.req ? '*' : '(선택)'}</label>${f.type==='textarea'?`<textarea name="${f.name}" class="form-control" rows="3"></textarea>`:`<input name="${f.name}" type="${f.type}" class="form-control" ${f.req?'required':''}>`}`;
            formFields.appendChild(d);
        });
    }

    function closeModal() { modalOverlay.classList.remove('active'); mainForm.reset(); editingId = null; }

    // --- ASSIGNMENT PANEL ---
    function openAssignmentPanelByDate(dateStr) {
        const a = state.assignments.find(x => x.date === dateStr);
        if (!a) return;
        currentAssignmentId = a.id;

        document.getElementById('panel-title').innerText = a.title;
        document.getElementById('panel-desc').innerText = a.desc || '설명을 추가하세요...';

        // Apply clickable link to the text area when NOT in edit mode
        const submitLinkEl = document.getElementById('panel-submit-link-text');
        if (a.submitUrl) {
            submitLinkEl.innerHTML = `<a href="${a.submitUrl}" target="_blank" style="color: inherit; text-decoration: inherit; display: block;">제출 링크 바로가기</a>`;
        } else {
            submitLinkEl.innerText = '제출 링크 없음';
        }

        document.getElementById('panel-submit-link-btn').href = a.submitUrl || '#';
        document.getElementById('panel-complete-check').checked = a.completed;
        document.getElementById('panel-date-input').value = a.date;

        resetEditModes();
        renderComments();
        assignmentPanel.classList.add('open');
        lucide.createIcons();
    }

    function resetEditModes() {
        const fields = ['panel-title', 'panel-desc', 'panel-submit-link-text'];
        const btnIds = ['edit-btn-title', 'edit-btn-desc', 'edit-btn-submitUrl'];
        fields.forEach((fid, idx) => {
            const el = document.getElementById(fid);
            if (el) el.contentEditable = "false";
            const btn = document.getElementById(btnIds[idx]);
            if (btn) btn.innerHTML = `<i data-lucide="edit-2" size="${idx===0?16:14}"></i>`;
        });
        lucide.createIcons();
    }

    function toggleEditField(fieldId, stateField, btnId, isUrl = false) {
        const el = document.getElementById(fieldId);
        const btn = document.getElementById(btnId);
        if (!el || !btn) return;
        const isEditing = el.contentEditable === "true";
        const a = state.assignments.find(x => x.id === currentAssignmentId);
        if(!a) return;

        if (!isEditing) {
            el.contentEditable = "true";
            // Show raw text for editing
            if (isUrl) el.innerText = a.submitUrl;
            el.focus();
            btn.innerHTML = `<i data-lucide="check" class="text-success" size="${fieldId==='panel-title'?16:14}"></i>`;
        } else {
            el.contentEditable = "false";
            const newVal = el.innerText.trim();
            updateAssignmentField(stateField, newVal);
            if (isUrl) {
                el.innerHTML = newVal ? `<a href="${newVal}" target="_blank" style="color: inherit; text-decoration: inherit; display: block;">제출 링크 바로가기</a>` : '제출 링크 없음';
            }
            btn.innerHTML = `<i data-lucide="edit-2" size="${fieldId==='panel-title'?16:14}"></i>`;
        }
        lucide.createIcons();
    }

    function updateAssignmentField(field, val) {
        const a = state.assignments.find(x => x.id === currentAssignmentId);
        if (!a) return;
        a[field] = val;
        if (field === 'submitUrl') document.getElementById('panel-submit-link-btn').href = val || '#';
        renderView();
    }

    function renderComments() {
        const a = state.assignments.find(x => x.id === currentAssignmentId);
        if(!a) return;
        const d = document.getElementById('panel-comments');
        d.innerHTML = a.comments.map(c => `
                <div class="comment-item">
                    <div class="comment-text" id="comm-text-${c.id}" contenteditable="false">${linkify(c.text)}</div>
                    <div class="comment-actions">
                        <button class="btn-icon" id="edit-comm-${c.id}" onclick="toggleCommentEdit(${c.id})"><i data-lucide="edit-2" size="14"></i></button>
                        <button class="btn-icon btn-danger" onclick="deleteComment(${c.id})"><i data-lucide="trash-2" size="14"></i></button>
                    </div>
                </div>`).join('');
        if(a.comments.length===0) d.innerHTML = '<p style="font-size:0.85rem; color:var(--text-muted); padding:4px;">등록된 메모가 없습니다.</p>';
        lucide.createIcons();
    }

    function toggleCommentEdit(cid) {
        const el = document.getElementById(`comm-text-${cid}`);
        const btn = document.getElementById(`edit-comm-${cid}`);
        if(!el || !btn) return;
        const isEditing = el.contentEditable === "true";
        const a = state.assignments.find(x => x.id === currentAssignmentId);
        if(!a) return;

        if (!isEditing) {
            el.contentEditable = "true";
            // Show raw text for editing
            const c = a.comments.find(x => x.id === cid);
            if(c) el.innerText = c.text;
            el.focus();
            btn.innerHTML = `<i data-lucide="check" class="text-success" size="14"></i>`;
        } else {
            el.contentEditable = "false";
            const c = a.comments.find(x => x.id === cid);
            if(c) c.text = el.innerText.trim();
            btn.innerHTML = `<i data-lucide="edit-2" size="14"></i>`;
            // Re-render to apply linkify
            renderComments();
        }
        lucide.createIcons();
    }

    function deleteComment(cid) {
        const a = state.assignments.find(x => x.id === currentAssignmentId);
        if(!a) return;
        a.comments = a.comments.filter(x => x.id !== cid); renderComments();
    }

    // Global keypress for comments
    document.addEventListener('keypress', (e) => {
        if (e.target.id === 'comment-input' && e.key === 'Enter' && e.target.value.trim()) {
            const a = state.assignments.find(x => x.id === currentAssignmentId);
            if(a) {
                a.comments.push({ id: Date.now(), text: e.target.value.trim() });
                e.target.value = ''; renderComments();
            }
        }
    });

    // Toggle checkbox listener for assignments
    document.addEventListener('change', (e) => {
        if(e.target.id === 'panel-complete-check') {
            const a = state.assignments.find(x => x.id === currentAssignmentId);
            if (a) { a.completed = e.target.checked; renderView(); }
        }
    });

    function closePanel() { if (assignmentPanel) assignmentPanel.classList.remove('open'); currentAssignmentId = null; }
</script>
</body>
</html>
