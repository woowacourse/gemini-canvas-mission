<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우테코 회고 자동 작성기</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #4ade80;
            --primary-dim: #22543d;
            --text-main: #e2e8f0;
            --text-dim: #94a3b8;
            --border-color: #334155;
            --error-color: #f87171;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            margin-top: 10px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 4px;
            color: var(--primary-color);
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        /* Stepper */
        .stepper {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            position: relative;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
            flex: 1;
            opacity: 0.4;
            transition: var(--transition);
        }

        .step.active, .step.completed {
            opacity: 1;
        }

        .step-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--surface-color);
            border: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 6px;
            transition: var(--transition);
        }

        .step.active .step-circle {
            border-color: var(--primary-color);
            color: var(--primary-color);
            box-shadow: 0 0 12px var(--primary-dim);
        }

        .step.completed .step-circle {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: var(--bg-color);
        }

        .step-label {
            font-size: 0.7rem;
            color: var(--text-dim);
        }

        .step.active .step-label {
            color: var(--primary-color);
            font-weight: bold;
        }

        /* Card & UI */
        .card {
            background: var(--surface-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        textarea {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            padding: 14px;
            font-size: 1rem;
            resize: vertical;
            min-height: 100px;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--primary-color);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            width: 100%;
            margin-top: 8px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: var(--bg-color);
        }

        .btn-primary:disabled {
            background: var(--border-color);
            color: var(--text-dim);
            cursor: not-allowed;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
        }

        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* Progress Bar */
        .progress-container {
            margin-top: 8px;
            height: 4px;
            background: var(--border-color);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .work-item-card {
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .work-item-card:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .work-title {
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 8px;
            display: block;
            font-size: 0.9rem;
        }

        .question-text {
            font-size: 1.05rem;
            margin-bottom: 12px;
            display: block;
            font-weight: 500;
            color: #fff;
            line-height: 1.4;
        }

        /* Tab System */
        .tab-row {
            display: flex;
            background: #0f172a;
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            border: none;
            background: transparent;
            color: var(--text-dim);
            cursor: pointer;
            border-radius: 6px;
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .tab-btn.active {
            background: var(--surface-color);
            color: var(--primary-color);
            font-weight: bold;
        }

        .reflection-content {
            white-space: pre-wrap;
            background: #0f172a;
            padding: 18px;
            border-radius: 12px;
            font-size: 0.95rem;
            border: 1px solid var(--border-color);
            min-height: 350px;
            overflow-y: auto;
            color: #cbd5e1;
        }

        .reflection-content h3 {
            color: var(--primary-color);
            margin-top: 20px;
            margin-bottom: 8px;
            font-size: 1.1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
        }

        .reflection-content strong {
            color: var(--primary-color);
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--surface-color);
            color: var(--primary-color);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid var(--primary-color);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: all 0.4s;
            z-index: 1000;
            font-size: 0.9rem;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .help-section {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-top: 30px;
            padding: 20px;
            border-top: 1px solid var(--border-color);
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.4rem;
            }

            .card {
                padding: 16px;
            }

            .btn {
                padding: 10px 16px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>우테코 회고 자동 작성기</h1>
        <div class="subtitle" id="current-date">YYYY-MM-DD</div>
    </header>

    <div class="stepper">
        <div class="step" id="step1">
            <div class="step-circle">1</div>
            <div class="step-label">할 일</div>
        </div>
        <div class="step" id="step2">
            <div class="step-circle">2</div>
            <div class="step-label">생각</div>
        </div>
        <div class="step" id="step3">
            <div class="step-circle">3</div>
            <div class="step-label">심화</div>
        </div>
        <div class="step" id="step4">
            <div class="step-circle">4</div>
            <div class="step-label">작성</div>
        </div>
    </div>

    <div id="app-content"></div>

    <div class="btn-row" id="footer-btns">
        <button class="btn btn-secondary" onclick="app.saveDraft()">임시저장</button>
        <button class="btn btn-secondary" style="color: var(--error-color);" onclick="app.reset()">초기화</button>
    </div>

    <div class="help-section">
        <h3>💡 이용 안내</h3>
        <p>• <strong>담백한 말투:</strong> '~했습니다' 체로 정중하고 깔끔하게 작성해 드려요.</p>
        <p>• <strong>심플한 구성:</strong> 오늘 한 일, 잘한 점, 아쉬운 점 등 꼭 필요한 내용만 담습니다.</p>
        <p>• <strong>편집 모드:</strong> 4단계에서 내용을 직접 수정하거나 보충할 수 있습니다.</p>
    </div>
</div>

<div id="toast" class="toast">메시지</div>

<script>
    const STORAGE_KEY = "wooteco_reflection_v4";
    const apiKey = "";

    const app = {
        state: {
            step: 1,
            date: new Date().toLocaleDateString('sv-SE'),
            works: [],
            rawInput: "",
            isLoading: false,
            finalReflection: "",
            viewMode: 'preview'
        },

        init() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const parsed = JSON.parse(saved);
                if (parsed.date === this.state.date) {
                    this.state = {...this.state, ...parsed};
                }
            }
            document.getElementById('current-date').textContent = this.state.date;
            this.render();
        },

        saveDraft() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
            this.showToast("임시저장 완료! 💾");
        },

        reset() {
            if (confirm("오늘 작성한 내용을 모두 비울까요?")) {
                localStorage.removeItem(STORAGE_KEY);
                location.reload();
            }
        },

        showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        },

        async callGemini(prompt, systemInstruction = "") {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{parts: [{text: prompt}]}],
                systemInstruction: {parts: [{text: systemInstruction}]}
            };

            let delay = 1000;
            for (let i = 0; i < 5; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        body: JSON.stringify(payload),
                        headers: {'Content-Type': 'application/json'}
                    });
                    if (!response.ok) throw new Error("API Limit");
                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                } catch (e) {
                    if (i === 4) return null;
                    await new Promise(r => setTimeout(r, delay));
                    delay *= 2;
                }
            }
        },

        getCategory(text) {
            if (/버그|에러|장애|트러블|로그|예외|수정/.test(text)) return "DEBUG";
            if (/리팩토링|개선|정리|구조|성능/.test(text)) return "REFACTOR";
            if (/리뷰|PR|머지|커밋|피드백/.test(text)) return "PR";
            if (/테스트|Mock|TDD|검증/.test(text)) return "TEST";
            if (/페어|팀|회의|논의|협업/.test(text)) return "COLLAB";
            return "GENERAL";
        },

        async generateQ1() {
            const lines = this.state.rawInput.split('\n').map(l => l.trim()).filter(l => l.length >= 2);
            if (lines.length === 0) return;

            this.state.isLoading = true;
            this.render();

            const works = [];
            for (const line of lines) {
                const category = this.getCategory(line);
                const systemPrompt = `너는 우테코 크루의 동료이자, 작업의 맥락을 예리하게 파악하는 '관찰자'야.
입력된 작업 내용을 [설계/구현/리팩터링/협업/트러블슈팅] 중 하나로 분류해줘. 분류된 카테고리는 질문에 명시하지 마.
그 성격에 맞춰 '도전'의 관점에서 성찰을 유도하는 질문을 한 문장으로 해줘.
친근한 '해요체'를 사용하고, 50자 이내로 짧게 질문해.`;

                const prompt = `
크루님의 작업 내용: "${line}"

[질문 생성 가이드]
- 설계: 선택의 이유나 트레이드오프를 묻기
- 구현: 가장 까다로웠던 로직이나 '도전'했던 지점 묻기
- 리팩터링: 개선 전후의 차이나 스스로 세운 기준 묻기
- 협업/리뷰: 소통 과정에서 새롭게 발견한 관점 묻기
- 트러블슈팅: 문제의 원인을 찾아가는 과정에서의 직관 묻기

위 가이드 중 하나를 선택해, 크루님이 당시 상황을 생생하게 복기할 수 있는 질문을 하나만 해주세요.`;

                let q1 = await this.callGemini(prompt, systemPrompt);
                if (!q1) q1 = "이 활동을 하면서 크루님이 가장 고민하며 공을 들였던 부분은 무엇이었나요?";
                works.push({text: line, q1: q1.trim(), a1: "", q2: "", a2: "", category});
            }

            this.state.works = works;
            this.state.step = 2;
            this.state.isLoading = false;
            this.saveDraft();
            this.render();
        },

        async generateQ2() {
            this.state.isLoading = true;
            this.render();

            for (let work of this.state.works) {
                const systemPrompt = "우테코 동료로서 크루의 답변 속에 숨겨진 의도나 배움을 끌어내는 꼬리 질문을 해줘. 결과보다는 과정에서의 변화나 깨달음에 집중해 줘. 정중한 '해요체'를 사용하고, 한 문장으로 깊이 있는 성찰을 유도해 줘.";
                const prompt = `크루님의 작업: ${work.text}, 답변하신 내용: ${work.a1}. 만약 이 작업을 다시 시작한다면, 그때의 나에게 어떤 팁을 가장 먼저 전해주고 싶나요? 50자 이내.`;

                let q2 = await this.callGemini(prompt, systemPrompt);
                work.q2 = q2 ? q2.trim() : "만약 이 작업을 다시 시작한다면, 그때의 나에게 어떤 팁을 가장 먼저 전해주고 싶나요?";
            }

            this.state.step = 3;
            this.state.isLoading = false;
            this.saveDraft();
            this.render();
        },

        async generateFinal() {
            this.state.isLoading = true;
            this.render();

            const context = this.state.works.map(w => `- 작업: ${w.text}\n  생각1: ${w.a1}\n  생각2: ${w.a2}`).join('\n\n');
            const systemPrompt = `너는 우테코 크루의 활동 기록을 바탕으로 담백하고 객관적인 회고를 정리해주는 동료야.
반드시 '~했습니다' 체를 사용하고, 불필요한 수식어나 추상적인 비유(예: 찬란한, 벽을 마주한, 뜨거운 열정 등)를 엄격히 배제해줘.
감정보다는 '시도한 사실'과 '도출된 데이터/깨달음' 위주로 간결하게 작성해.`;

            const prompt = `아래 데이터를 바탕으로 1인칭 성찰 보고서를 작성해줘. 이번 기수의 핵심 키워드는 '도전'이야.

[데이터]
${context}

[구성 가이드]
## 01. 오늘의 실행
- 오늘 완료한 작업이나 학습한 내용을 불릿 포인트로 요약

## 02. 도전과 시도
- 기존 방식 대신 시도해본 것, 혹은 가장 고민하며 에너지를 쏟은 지점 2가지 (잘한 점을 '도전'의 관점에서 기술)

## 03. 객관적 복기
- 예상과 달랐던 결과나 보완이 필요한 지점을 '사실' 위주로 서술 (아쉬운 점을 드라이하게 표현)

## 04. 획득한 인사이트
- 오늘 새롭게 알게 된 지식이나 협업/코드에 대한 구체적인 깨달음

## 05. 내일의 우선순위
- 내일 바로 실행 가능한 구체적인 행동 계획

## 06. 오늘의 요약
- 전체 내용을 관통하는 담백한 한 문장 정의`;

            let reflection = await this.callGemini(prompt, systemPrompt);
            if (!reflection) reflection = "회고를 작성하는 중에 문제가 발생했습니다. 수동으로 작성을 부탁드립니다.";

            this.state.finalReflection = reflection;
            this.state.step = 4;
            this.state.viewMode = 'preview';
            this.state.isLoading = false;
            this.saveDraft();
            this.render();
        },

        updateA(step, index, val) {
            const key = step === 2 ? 'a1' : 'a2';
            this.state.works[index][key] = val;
            this.renderProgress();
        },

        renderProgress() {
            const currentWorks = this.state.works;
            const key = this.state.step === 2 ? 'a1' : 'a2';
            const doneCount = currentWorks.filter(w => w[key].trim().length >= 2).length;
            const progress = Math.round((doneCount / currentWorks.length) * 100);

            const bar = document.querySelector('.progress-bar');
            if (bar) bar.style.width = progress + '%';

            const btn = document.getElementById('next-btn');
            if (btn) btn.disabled = doneCount < currentWorks.length;
        },

        copyToClipboard() {
            const el = document.createElement('textarea');
            el.value = this.state.finalReflection;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            this.showToast("회고가 복사되었습니다! 📋");
        },

        setTab(mode) {
            this.state.viewMode = mode;
            this.render();
        },

        render() {
            const container = document.getElementById('app-content');

            [1, 2, 3, 4].forEach(idx => {
                const el = document.getElementById(`step${idx}`);
                el.classList.toggle('active', idx === this.state.step);
                el.classList.toggle('completed', idx < this.state.step);
            });

            if (this.state.isLoading) {
                container.innerHTML = `
                    <div class="card" style="text-align:center; padding: 50px 20px;">
                        <div class="loading-spinner"></div>
                        <p style="margin-top:20px; color: var(--text-dim);">글을 정리하고 있습니다.<br>잠시만 기다려주세요...</p>
                    </div>
                `;
                document.getElementById('footer-btns').style.display = 'none';
                return;
            }

            document.getElementById('footer-btns').style.display = 'grid';

            switch (this.state.step) {
                case 1:
                    container.innerHTML = `
                        <div class="card">
                            <h2 style="margin-top:0; font-size:1.2rem;">오늘 어떤 일을 하셨나요?</h2>
                            <textarea id="work-input" placeholder="예: 페어와 사다리 타기 미션 진행\n스트림 API 학습 및 블로그 정리\n팀 데일리 회고 및 갈등 조정">${this.state.rawInput}</textarea>
                            <button class="btn btn-primary" id="btn-q1" onclick="app.generateQ1()" ${this.state.rawInput.trim().length < 2 ? 'disabled' : ''}>질문 받기</button>
                        </div>
                    `;
                    document.getElementById('work-input').addEventListener('input', (e) => {
                        this.state.rawInput = e.target.value;
                        document.getElementById('btn-q1').disabled = e.target.value.trim().length < 2;
                    });
                    break;

                case 2:
                    container.innerHTML = `
                        <div class="card">
                            <h2 style="margin-top:0; font-size:1.2rem;">가볍게 답변해 주세요.</h2>
                            <div class="progress-container"><div class="progress-bar" style="width:0%"></div></div>
                            <div style="margin-top:24px;">
                                ${this.state.works.map((w, i) => `
                                    <div class="work-item-card">
                                        <span class="work-title">📌 ${w.text}</span>
                                        <span class="question-text">${w.q1}</span>
                                        <textarea oninput="app.updateA(2, ${i}, this.value)" placeholder="들려주세요...">${w.a1}</textarea>
                                    </div>
                                `).join('')}
                            </div>
                            <button class="btn btn-primary" id="next-btn" onclick="app.generateQ2()" disabled>심화 질문 받기</button>
                        </div>
                    `;
                    this.renderProgress();
                    break;

                case 3:
                    container.innerHTML = `
                        <div class="card">
                            <h2 style="margin-top:0; font-size:1.2rem;">마지막 생각 정리입니다.</h2>
                            <div class="progress-container"><div class="progress-bar" style="width:0%"></div></div>
                            <div style="margin-top:24px;">
                                ${this.state.works.map((w, i) => `
                                    <div class="work-item-card">
                                        <span class="work-title">📌 ${w.text}</span>
                                        <div style="font-size:0.85rem; color:var(--text-dim); margin-bottom:12px; border-left: 2px solid var(--border-color); padding-left:10px;">이전 답변: ${w.a1}</div>
                                        <span class="question-text">${w.q2}</span>
                                        <textarea oninput="app.updateA(3, ${i}, this.value)" placeholder="답변해 주세요...">${w.a2}</textarea>
                                    </div>
                                `).join('')}
                            </div>
                            <button class="btn btn-primary" id="next-btn" onclick="app.generateFinal()" disabled>회고 작성하기</button>
                        </div>
                    `;
                    this.renderProgress();
                    break;

                case 4:
                    const isPreview = this.state.viewMode === 'preview';
                    const formatted = this.state.finalReflection
                        .replace(/^## (.*$)/gim, '<h3>$1</h3>')
                        .replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>')
                        .replace(/^- (.*$)/gim, '• $1');

                    container.innerHTML = `
                        <div class="card">
                            <h2 style="margin-top:0; font-size:1.2rem;">작성된 회고를 확인하세요.</h2>
                            <div class="tab-row">
                                <button class="tab-btn ${isPreview ? 'active' : ''}" onclick="app.setTab('preview')">미리보기</button>
                                <button class="tab-btn ${!isPreview ? 'active' : ''}" onclick="app.setTab('edit')">편집</button>
                            </div>

                            ${isPreview ? `
                                <div class="reflection-content">${formatted}</div>
                            ` : `
                                <textarea id="final-editor" style="height: 450px; font-family: inherit; font-size: 0.95rem;" oninput="app.state.finalReflection = this.value">${this.state.finalReflection}</textarea>
                            `}

                            <button class="btn btn-primary" style="margin-top:20px;" onclick="app.copyToClipboard()">복사하기</button>
                            <button class="btn btn-outline" style="margin-top:10px;" onclick="app.reset()">새로 작성</button>
                        </div>
                    `;
                    break;
            }
        }
    };

    window.onload = () => app.init();
</script>

</body>
</html>
