<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>버블 퀴즈 - 머리 속 거품을 터트리세요</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');

        :root {
            --bg-deep: #020617;
            --highlight-color: #fbbf24; /* Amber 400 */
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background: radial-gradient(circle at center, #0f172a, var(--bg-deep));
            color: #f8fafc;
            height: 100vh;
            margin: 0;
            overflow: hidden; 
            touch-action: none;
        }

        .bubble-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .bubble {
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 15px;
            cursor: pointer;
            pointer-events: auto;
            user-select: none;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), scale 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s, border-color 0.3s, box-shadow 0.3s, background 0.3s;
            color: #e2e8f0;
            font-weight: 700;
            word-break: keep-all;
            font-size: 0.9rem;
            z-index: 5;
            scale: 1;
        }

        /* 크기(scale) 변경 없이 색상과 효과만으로 강조되도록 수정 */
        .bubble:hover {
            border-color: #38bdf8;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.6), inset 0 0 15px rgba(56, 189, 248, 0.2);
            background: rgba(56, 189, 248, 0.15);
            color: #ffffff;
            z-index: 10;
        }

        .bubble:active {
            scale: 0.95;
        }

        /* 강조된 거품 스타일 (퀴즈 완료 후) */
        .bubble.highlighted {
            border-color: var(--highlight-color);
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.4), inset 0 0 15px rgba(251, 191, 36, 0.2);
            background: rgba(251, 191, 36, 0.1);
            color: #fff;
            animation: pulse-highlight 2s infinite;
        }

        @keyframes pulse-highlight {
            0% { scale: 1; box-shadow: 0 0 20px rgba(251, 191, 36, 0.4); }
            50% { scale: 1.05; box-shadow: 0 0 40px rgba(251, 191, 36, 0.6); }
            100% { scale: 1; box-shadow: 0 0 20px rgba(251, 191, 36, 0.4); }
        }

        .bubble.popping {
            animation: pop-effect 0.4s ease-out forwards;
            pointer-events: none;
        }

        @keyframes pop-effect {
            0% { scale: 1; opacity: 1; }
            100% { scale: 2; opacity: 0; }
        }

        #intro-screen { z-index: 20; }

        .modal-backdrop {
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(10px);
            overflow-y: auto;
            padding: 2rem 1rem;
        }

        .quiz-card {
            max-height: calc(100vh - 4rem);
            display: flex;
            flex-direction: column;
        }

        .quiz-content { overflow-y: auto; flex: 1; }

        .quiz-option {
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .loading-spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #38bdf8;
            border-radius: 50%;
            width: 20px; height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Intro Section -->
    <div id="intro-screen" class="fixed inset-0 flex items-center justify-center p-6 transition-opacity duration-500">
        <div class="max-w-2xl w-full text-center space-y-8 py-10">
            <h1 class="text-6xl font-black tracking-tighter text-white mb-2 italic">
                DEEP<span class="text-sky-500">BUBBLE</span>
            </h1>
            <p class="text-slate-400 text-lg font-medium">머리 속 거품을 터트리세요.</p>
            
            <div class="space-y-4">
                <textarea id="topic-input" rows="3" 
                    class="w-full bg-slate-900/80 border border-slate-700 rounded-2xl p-5 text-white placeholder-slate-500 focus:ring-2 focus:ring-sky-500 outline-none transition-all shadow-2xl"
                    placeholder="공부하고 싶은 심화 주제를 입력하세요..."></textarea>
                <button id="start-btn" 
                    class="w-full bg-white hover:bg-sky-50 text-slate-950 font-black py-5 px-8 rounded-2xl shadow-xl transition-all active:scale-95 flex items-center justify-center gap-3 text-lg">
                    <span>학습 생태계 생성하기</span>
                    <div id="start-spinner" class="loading-spinner hidden"></div>
                </button>
            </div>
        </div>
    </div>

    <!-- Bubble Playground -->
    <div id="bubble-container" class="bubble-container"></div>

    <!-- Quiz Modal -->
    <div id="quiz-modal" class="fixed inset-0 hidden z-50 flex items-center justify-center modal-backdrop">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-3xl rounded-[2.5rem] shadow-2xl quiz-card">
            <div class="p-8 md:p-10 quiz-content">
                <div class="flex justify-between items-center mb-6">
                    <span id="quiz-tag" class="bg-sky-500 text-slate-950 px-4 py-1.5 rounded-full text-xs font-black uppercase tracking-widest">TOPIC</span>
                    <span id="quiz-progress" class="text-slate-500 text-sm font-bold">1 / 3</span>
                </div>
                <h2 id="quiz-question" class="text-2xl md:text-3xl font-extrabold text-white leading-tight mb-8">퀴즈 로딩 중...</h2>
                <div id="quiz-options" class="grid grid-cols-1 gap-3 md:gap-4 mb-8"></div>
                <div id="quiz-explanation" class="p-6 bg-slate-800/80 border border-slate-700 rounded-2xl hidden">
                    <div class="flex items-start gap-4">
                        <div class="bg-sky-500/20 p-2 rounded-lg shrink-0">
                            <svg class="w-5 h-5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                        <div>
                            <p id="exp-text" class="text-slate-200 leading-relaxed font-medium mb-3"></p>
                            <p id="exp-source" class="text-xs text-sky-500 font-bold italic"></p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="p-8 bg-slate-800/40 border-t border-slate-800 flex justify-end shrink-0">
                <button id="next-btn" class="bg-sky-500 hover:bg-sky-400 text-slate-950 px-10 py-4 rounded-xl font-black transition-all opacity-50 cursor-not-allowed" disabled>
                    다음 단계
                </button>
            </div>
        </div>
    </div>

    <!-- Message Box -->
    <div id="message-box" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-white text-slate-950 px-8 py-4 rounded-2xl shadow-2xl transform translate-y-32 transition-transform duration-500 z-[100] font-bold">
        <span id="message-text">준비 완료!</span>
    </div>

    <script>
        const apiKey = "";
        const introScreen = document.getElementById('intro-screen');
        const topicInput = document.getElementById('topic-input');
        const startBtn = document.getElementById('start-btn');
        const btnText = startBtn.querySelector('span');
        const startSpinner = document.getElementById('start-spinner');
        const bubbleContainer = document.getElementById('bubble-container');
        const quizModal = document.getElementById('quiz-modal');
        const messageBox = document.getElementById('message-box');
        const messageText = document.getElementById('message-text');

        let mainTopic = "";
        let bubbles = [];
        let quizStore = {}; 
        let currentKeyword = "";
        let currentQuizIndex = 0;
        let activeBubbleObj = null;
        let pendingChildren = [];

        async function fetchGemini(prompt, systemInstruction = "", isJson = true) {
            let retries = 0;
            const maxRetries = 5;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: systemInstruction }] },
                generationConfig: isJson ? { responseMimeType: "application/json" } : {}
            };

            while (retries < maxRetries) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error('API failed');
                    const result = await response.json();
                    const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!text) throw new Error('No content');
                    return isJson ? JSON.parse(text) : text;
                } catch (error) {
                    retries++;
                    await new Promise(res => setTimeout(res, Math.pow(2, retries) * 1000));
                }
            }
            throw new Error('All retries failed');
        }

        function showToast(msg) {
            messageText.innerText = msg;
            messageBox.style.transform = 'translate(-50%, 0)';
            setTimeout(() => { messageBox.style.transform = 'translate(-50%, 200%)'; }, 3000);
        }

        class Bubble {
            constructor(keyword, x, y) {
                this.keyword = keyword.trim();
                this.x = x || Math.random() * (window.innerWidth - 180) + 20;
                this.y = y || Math.random() * (window.innerHeight - 180) + 20;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 1.5;
                this.isHighlighted = false;
                
                this.element = document.createElement('div');
                this.element.className = 'bubble';
                this.element.innerText = this.keyword;
                
                // 클릭 이벤트 (드래그 대신 클릭으로 단순화)
                this.element.onclick = () => {
                    this.removeHighlight();
                    if (!currentKeyword) {
                        this.pop();
                    }
                };
                
                // 호버 시 강조 해제
                this.element.onmouseenter = () => this.removeHighlight();
                
                bubbleContainer.appendChild(this.element);
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x <= 10 || this.x >= window.innerWidth - 150) this.vx *= -1;
                if (this.y <= 10 || this.y >= window.innerHeight - 150) this.vy *= -1;
                
                this.element.style.setProperty('--tx', `${this.x}px`);
                this.element.style.setProperty('--ty', `${this.y}px`);
                this.element.style.transform = `translate(${this.x}px, ${this.y}px)`;
            }

            pop() {
                this.element.classList.add('popping');
                activeBubbleObj = this;
                
                // 실시간 분열
                splitKeywordsImmediately(this.keyword, this.x, this.y);

                setTimeout(() => {
                    this.element.style.display = 'none';
                    startQuiz(this.keyword);
                }, 300);
            }

            highlight() {
                this.isHighlighted = true;
                this.element.classList.add('highlighted');
            }

            removeHighlight() {
                if (this.isHighlighted) {
                    this.isHighlighted = false;
                    this.element.classList.remove('highlighted');
                }
            }

            remove() {
                this.element.remove();
                bubbles = bubbles.filter(b => b !== this);
            }
        }

        function animate() {
            bubbles.forEach(b => b.update());
            requestAnimationFrame(animate);
        }

        startBtn.onclick = async () => {
            const topic = topicInput.value.trim();
            if (!topic) return showToast("주제를 입력하세요.");
            mainTopic = topic;
            startBtn.disabled = true;
            startSpinner.classList.remove('hidden');
            btnText.innerText = "지식에 거품을 열심히 내고 있어요";

            try {
                const systemPrompt = `당신은 교육 공학 전문가입니다. 주제 "${topic}"에 대한 핵심 한국어 키워드 3~5개와 각 키워드별 심화 퀴즈 3개를 생성하세요.
                반드시 다음 JSON 형식을 엄격하게 지켜주세요:
                {
                  "data": [
                    {
                      "keyword": "키워드",
                      "quizzes": [
                        {
                          "question": "질문 내용",
                          "options": ["보기1", "보기2", "보기3", "보기4"],
                          "answerIndex": 0,
                          "explanation": "상세한 해설",
                          "source": "출처 정보"
                        }
                      ]
                    }
                  ]
                }`;
                const response = await fetchGemini(`주제: ${topic}`, systemPrompt);
                
                if (!response.data || !Array.isArray(response.data)) throw new Error('Invalid format');

                response.data.forEach(item => {
                    const kw = item.keyword.trim();
                    quizStore[kw] = item.quizzes;
                    bubbles.push(new Bubble(kw));
                });
                introScreen.classList.add('opacity-0', 'pointer-events-none');
                showToast("거품을 터뜨려 학습을 시작하세요!");
                animate();
            } catch (err) {
                console.error(err);
                showToast("생성 실패 - 다시 시도해 주세요.");
                startBtn.disabled = false;
                btnText.innerText = "학습 생태계 생성하기";
            } finally { startSpinner.classList.add('hidden'); }
        };

        async function splitKeywordsImmediately(parentKeyword, px, py) {
            pendingChildren = [];
            try {
                const systemPrompt = `"${parentKeyword}"에서 파생된 더욱 심화된 한국어 하위 키워드 2개와 각 3개의 퀴즈를 생성하세요.
                반드시 다음 JSON 형식을 엄격하게 지켜주세요:
                {
                  "data": [
                    {
                      "keyword": "키워드",
                      "quizzes": [
                        {
                          "question": "질문 내용",
                          "options": ["보기1", "보기2", "보기3", "보기4"],
                          "answerIndex": 0,
                          "explanation": "상세한 해설",
                          "source": "출처 정보"
                        }
                      ]
                    }
                  ]
                }`;
                const response = await fetchGemini(`컨텍스트: ${mainTopic}\n이전 키워드: ${parentKeyword}`, systemPrompt);
                
                if (response.data) {
                    response.data.forEach((item, i) => {
                        const kw = item.keyword.trim();
                        quizStore[kw] = item.quizzes;
                        const child = new Bubble(kw, px + (i * 60 - 30), py + (i * 60 - 30));
                        bubbles.push(child);
                        pendingChildren.push(child);
                    });
                }
            } catch (err) { console.error("분열 실패", err); }
        }

        function startQuiz(keyword) {
            currentKeyword = keyword.trim();
            currentQuizIndex = 0;
            quizModal.classList.remove('hidden');
            renderQuiz();
        }

        function renderQuiz() {
            const quizzes = quizStore[currentKeyword];
            
            if (!quizzes || !Array.isArray(quizzes) || quizzes.length === 0) {
                showToast("퀴즈 데이터를 로드할 수 없습니다.");
                closeQuiz();
                return;
            }

            const quiz = quizzes[currentQuizIndex];
            if (!quiz || !quiz.question || !quiz.options) {
                showToast("문제 데이터 형식이 올바르지 않습니다.");
                closeQuiz();
                return;
            }

            document.getElementById('quiz-tag').innerText = currentKeyword;
            document.getElementById('quiz-progress').innerText = `${currentQuizIndex + 1} / ${quizzes.length}`;
            document.getElementById('quiz-question').innerText = quiz.question;
            
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = "";
            document.getElementById('quiz-explanation').classList.add('hidden');
            
            const nextBtn = document.getElementById('next-btn');
            nextBtn.disabled = true;
            nextBtn.classList.add('opacity-50');
            nextBtn.innerText = currentQuizIndex === quizzes.length - 1 ? "학습 완료" : "다음 문제";

            if (quiz.options && Array.isArray(quiz.options)) {
                quiz.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = "quiz-option w-full text-left p-5 rounded-2xl text-slate-300 bg-slate-800/40 hover:bg-slate-800 border border-slate-700/50 font-medium";
                    btn.innerText = opt;
                    btn.onclick = () => handleAnswer(idx, btn);
                    optionsContainer.appendChild(btn);
                });
            } else {
                showToast("보기를 불러올 수 없습니다.");
            }
            
            document.querySelector('.quiz-content').scrollTop = 0;
        }

        function handleAnswer(idx, btn) {
            const quizzes = quizStore[currentKeyword];
            if (!quizzes) return;
            const quiz = quizzes[currentQuizIndex];
            
            const options = document.querySelectorAll('.quiz-option');
            options.forEach(opt => opt.onclick = null);

            if (idx === quiz.answerIndex) {
                btn.classList.add('bg-emerald-500/20', 'border-emerald-500/50', 'text-emerald-400');
            } else {
                btn.classList.add('bg-rose-500/20', 'border-rose-500/50', 'text-rose-400');
                if (options[quiz.answerIndex]) {
                    options[quiz.answerIndex].classList.add('bg-emerald-500/20', 'border-emerald-500/50', 'text-emerald-400');
                }
            }

            document.getElementById('exp-text').innerText = quiz.explanation || "설명이 없습니다.";
            document.getElementById('exp-source').innerText = quiz.source ? `Source: ${quiz.source}` : "";
            document.getElementById('quiz-explanation').classList.remove('hidden');
            
            const nextBtn = document.getElementById('next-btn');
            nextBtn.disabled = false;
            nextBtn.classList.remove('opacity-50');
        }

        function closeQuiz() {
            quizModal.classList.add('hidden');
            if (activeBubbleObj) {
                activeBubbleObj.element.classList.remove('popping');
                activeBubbleObj.element.style.display = 'flex';
                activeBubbleObj = null;
            }
            currentKeyword = "";
        }

        document.getElementById('next-btn').onclick = () => {
            const quizzes = quizStore[currentKeyword];
            if (quizzes && currentQuizIndex < quizzes.length - 1) {
                currentQuizIndex++;
                renderQuiz();
            } else {
                finishQuizAndHighlight();
            }
        };

        function finishQuizAndHighlight() {
            quizModal.classList.add('hidden');
            if (activeBubbleObj) activeBubbleObj.remove();
            activeBubbleObj = null;
            currentKeyword = "";
            
            if (pendingChildren.length > 0) {
                pendingChildren.forEach(child => child.highlight());
                showToast("새로운 지식이 빛나고 있습니다!");
            } else {
                showToast("학습 완료!");
            }
        }
    </script>
</body>
</html>
