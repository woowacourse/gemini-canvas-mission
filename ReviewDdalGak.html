<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>리뷰 딸깍 - 사진 한 장으로 완벽한 리뷰 완성</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f4f5f7; /* Very light cool gray */
            -webkit-tap-highlight-color: transparent;
        }
        /* 페이드 인 애니메이션 */
        .fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* 드래그 앤 드롭 활성화 스타일 */
        .dragover {
            border-color: #111827 !important;
            background-color: #f9fafb !important;
        }
        /* 커스텀 스크롤바 (텍스트 영역) */
        textarea::-webkit-scrollbar {
            width: 6px;
        }
        textarea::-webkit-scrollbar-thumb {
            background-color: #d1d5db;
            border-radius: 10px;
        }
    </style>
</head>
<body class="text-gray-900 antialiased flex items-center justify-center min-h-screen">

<!-- 모바일 최적화 화면 & 데스크탑에서는 세련된 위젯 형태로 표시 -->
<div class="w-full max-w-md bg-white min-h-screen sm:min-h-[800px] sm:h-auto sm:my-10 sm:rounded-[2.5rem] sm:shadow-[0_20px_60px_-15px_rgba(0,0,0,0.1)] relative flex flex-col overflow-hidden border-x sm:border border-gray-100">
    
    <!-- Header -->
    <header class="bg-white/90 backdrop-blur-lg z-10 px-6 py-5 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-gray-900 rounded-lg flex items-center justify-center">
                <i data-lucide="sparkles" class="text-white w-4 h-4"></i>
            </div>
            <h1 class="text-xl font-bold tracking-tight text-gray-900">
                리뷰 딸깍
            </h1>
        </div>
        <button id="resetHeaderBtn" class="text-gray-400 hover:text-gray-900 transition-colors hidden">
            <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
        </button>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col px-6 pb-8 pt-2 gap-8 overflow-y-auto">
        
        <!-- Header 텍스트 (업로드 섹션에서만 보임) -->
        <div class="flex flex-col gap-1.5 fade-in" id="introText">
            <h2 class="text-2xl font-bold tracking-tight text-gray-900">사진을 올려주세요</h2>
            <p class="text-gray-500 text-sm">AI가 사진을 분석해 완벽한 리뷰를 작성합니다.</p>
        </div>

        <!-- Section 1: Upload (기본 상태) -->
        <div id="uploadSection" class="flex flex-col gap-4 fade-in">
            <input type="file" id="fileInput" accept="image/*" class="hidden">
            <div id="dropZone" class="border-2 border-dashed border-gray-200 rounded-[2rem] p-12 flex flex-col items-center justify-center gap-5 cursor-pointer hover:border-gray-900 hover:bg-gray-50 transition-all duration-300 group bg-white shadow-sm">
                <div class="w-16 h-16 bg-gray-50 rounded-2xl flex items-center justify-center text-gray-400 group-hover:text-gray-900 group-hover:scale-110 transition-all duration-300 ring-1 ring-gray-100 group-hover:ring-gray-200 group-hover:bg-white shadow-sm">
                    <i data-lucide="image-plus" class="w-7 h-7"></i>
                </div>
                <div class="text-center flex flex-col gap-1">
                    <p class="font-semibold text-gray-900">클릭하여 사진 업로드</p>
                    <p class="text-xs text-gray-400 font-medium">또는 파일을 이쪽으로 드래그</p>
                </div>
            </div>
        </div>

        <!-- Section 2: Details Input (추가 정보 입력) -->
        <div id="detailsSection" class="hidden flex-col gap-7 fade-in">
            <!-- 이미지 미리보기 -->
            <div class="relative rounded-[2rem] overflow-hidden shadow-sm bg-gray-50 border border-gray-100 h-56 group">
                <img id="detailsPreviewImage" src="" alt="업로드된 사진" class="w-full h-full object-cover">
                <button id="detailsReuploadBtn" class="absolute top-4 right-4 bg-white/90 backdrop-blur-md text-gray-900 p-2.5 rounded-full hover:bg-white transition-colors shadow-sm opacity-0 group-hover:opacity-100 sm:opacity-100">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>

            <div class="flex flex-col gap-6">
                <!-- 가게 상호명 입력 -->
                <div class="flex flex-col gap-2.5">
                    <label class="text-sm font-semibold text-gray-900 flex items-center gap-1.5">
                        가게 이름 <span class="text-gray-400 font-normal text-xs">(선택)</span>
                    </label>
                    <div class="relative">
                        <i data-lucide="store" class="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                        <input type="text" id="storeNameInput" placeholder="정확한 상호명을 입력해주세요" class="w-full bg-gray-50 border border-gray-200 rounded-2xl py-4 pl-12 pr-4 text-gray-900 text-[15px] font-medium placeholder-gray-400 focus:bg-white focus:ring-2 focus:ring-gray-900 focus:border-gray-900 outline-none transition-all shadow-sm">
                    </div>
                </div>

                <!-- 별점 선택 -->
                <div class="flex flex-col gap-2.5">
                    <label class="text-sm font-semibold text-gray-900">평가 별점</label>
                    <div class="bg-gray-50 border border-gray-200 rounded-2xl p-4 flex justify-between items-center shadow-sm">
                        <span class="text-sm font-medium text-gray-500" id="ratingLabel">매우 만족해요</span>
                        <div class="flex gap-1" id="detailsStarContainer">
                            <!-- JavaScript로 별 아이콘 생성 -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- 생성 버튼 -->
            <button id="generateReviewBtn" class="w-full bg-gray-900 text-white font-bold text-[17px] py-4.5 h-14 rounded-2xl shadow-lg shadow-gray-900/20 hover:bg-black active:transform active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-2">
                <i data-lucide="wand-2" class="w-5 h-5"></i>
                리뷰 딸깍 생성하기
            </button>
        </div>

        <!-- Section 3: Loading (API 호출 중) -->
        <div id="loadingSection" class="hidden flex-col items-center justify-center py-20 gap-6 fade-in flex-1">
            <div class="relative w-16 h-16 flex items-center justify-center">
                <div class="absolute inset-0 bg-gray-100 rounded-2xl animate-spin" style="animation-duration: 3s;"></div>
                <div class="absolute inset-1 bg-white rounded-xl flex items-center justify-center">
                    <i data-lucide="loader-2" class="w-6 h-6 text-gray-900 animate-spin"></i>
                </div>
            </div>
            <div class="text-center flex flex-col gap-1.5">
                <p class="font-bold text-gray-900 text-lg">AI가 리뷰를 생성 중입니다</p>
                <p class="text-sm text-gray-500 font-medium">사진의 특징을 꼼꼼히 분석하고 있어요</p>
            </div>
        </div>

        <!-- Section 4: Edit & Copy (API 응답 후) -->
        <div id="editSection" class="hidden flex-col gap-6 fade-in flex-1">
            
            <!-- 요약 칩 -->
            <div class="flex flex-wrap items-center gap-2">
                <div class="inline-flex items-center gap-1.5 bg-gray-100 text-gray-800 px-3 py-1.5 rounded-lg text-xs font-bold border border-gray-200">
                    <i data-lucide="image" class="w-3.5 h-3.5 text-gray-500"></i>
                    사진 첨부됨
                </div>
                <div class="inline-flex items-center gap-1.5 bg-yellow-50 text-yellow-800 px-3 py-1.5 rounded-lg text-xs font-bold border border-yellow-200/50">
                    <i data-lucide="star" class="w-3.5 h-3.5 fill-yellow-500 text-yellow-500"></i>
                    <span id="editStarText">5점</span>
                </div>
                <div id="editStoreChip" class="inline-flex items-center gap-1.5 bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-lg text-xs font-bold border border-indigo-100 hidden">
                    <i data-lucide="map-pin" class="w-3 h-3"></i>
                    <span id="editStoreName"></span>
                </div>
            </div>

            <!-- 리뷰 텍스트 결과 영역 -->
            <div class="flex flex-col gap-3 flex-1">
                <div class="flex justify-between items-end">
                    <label class="text-lg font-bold text-gray-900">생성된 리뷰</label>
                    <button id="regenerateBtn" class="text-sm text-gray-500 font-semibold flex items-center gap-1.5 hover:text-gray-900 transition-colors bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-lg">
                        <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> 다시 만들기
                    </button>
                </div>
                
                <div class="relative flex-1 min-h-[200px] flex flex-col">
                    <textarea id="reviewTextarea" class="flex-1 w-full bg-gray-50 border border-gray-200 rounded-[1.5rem] p-5 text-gray-900 text-[15px] focus:bg-white focus:ring-2 focus:ring-gray-900 focus:border-gray-900 outline-none resize-none shadow-inner leading-relaxed font-medium" placeholder="리뷰 내용을 입력해주세요."></textarea>
                </div>
            </div>

            <!-- 액션 버튼 영역 -->
            <div class="flex flex-col gap-3 mt-2">
                <button id="copyBtn" class="w-full bg-gray-900 text-white font-bold text-[17px] py-4.5 h-14 rounded-2xl shadow-lg shadow-gray-900/20 hover:bg-black active:transform active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                    <i data-lucide="copy" class="w-5 h-5"></i> 리뷰 내용 복사하기
                </button>
                
                <button id="resetBtn" class="w-full bg-white text-gray-600 border border-gray-200 font-bold text-[15px] py-4 h-13 rounded-2xl hover:bg-gray-50 hover:text-gray-900 transition-all flex items-center justify-center">
                    새로운 사진으로 시작
                </button>
            </div>
        </div>

    </main>

    <!-- Toast Notification (모던 스타일) -->
    <div id="toast" class="fixed sm:absolute bottom-8 left-1/2 transform -translate-x-1/2 bg-gray-900/95 backdrop-blur-md text-white px-6 py-3.5 rounded-2xl shadow-xl shadow-gray-900/20 opacity-0 pointer-events-none transition-all duration-300 z-50 text-[14.5px] font-semibold whitespace-nowrap flex items-center gap-2 translate-y-4">
        <i data-lucide="check-circle-2" class="w-4 h-4 text-green-400" id="toastIcon"></i>
        <span id="toastText">알림 메시지</span>
    </div>
</div>

<script>
    // Lucide 아이콘 초기화
    lucide.createIcons();

    // --- 환경 변수 및 상태 ---
    const apiKey = ""; // 런타임에 주입됨
    
    // 앱 상태
    const state = {
        currentImageData: null,
        currentMimeType: null,
        currentRating: 5
    };

    // --- DOM 요소 ---
    const elements = {
        uploadSection: document.getElementById('uploadSection'),
        detailsSection: document.getElementById('detailsSection'),
        loadingSection: document.getElementById('loadingSection'),
        editSection: document.getElementById('editSection'),
        introText: document.getElementById('introText'),
        resetHeaderBtn: document.getElementById('resetHeaderBtn'),
        
        fileInput: document.getElementById('fileInput'),
        dropZone: document.getElementById('dropZone'),
        
        detailsPreviewImage: document.getElementById('detailsPreviewImage'),
        detailsReuploadBtn: document.getElementById('detailsReuploadBtn'),
        storeNameInput: document.getElementById('storeNameInput'),
        detailsStarContainer: document.getElementById('detailsStarContainer'),
        ratingLabel: document.getElementById('ratingLabel'),
        generateReviewBtn: document.getElementById('generateReviewBtn'),
        
        editStarText: document.getElementById('editStarText'),
        editStoreChip: document.getElementById('editStoreChip'),
        editStoreName: document.getElementById('editStoreName'),
        reviewTextarea: document.getElementById('reviewTextarea'),
        
        regenerateBtn: document.getElementById('regenerateBtn'),
        copyBtn: document.getElementById('copyBtn'),
        resetBtn: document.getElementById('resetBtn'),
        
        toast: document.getElementById('toast'),
        toastText: document.getElementById('toastText'),
        toastIcon: document.getElementById('toastIcon')
    };

    // --- 초기화 ---
    function init() {
        renderStars(state.currentRating);
        setupEventListeners();
    }

    // --- 이벤트 리스너 설정 ---
    function setupEventListeners() {
        elements.dropZone.addEventListener('click', () => elements.fileInput.click());
        elements.fileInput.addEventListener('change', handleFileSelect);
        
        elements.dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            elements.dropZone.classList.add('dragover');
        });
        elements.dropZone.addEventListener('dragleave', () => {
            elements.dropZone.classList.remove('dragover');
        });
        elements.dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            elements.dropZone.classList.remove('dragover');
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                processFile(e.dataTransfer.files[0]);
            }
        });

        elements.detailsReuploadBtn.addEventListener('click', resetToUpload);
        elements.generateReviewBtn.addEventListener('click', () => {
            if (state.currentImageData) {
                analyzeImageWithAI(state.currentImageData, state.currentMimeType);
            }
        });
        
        elements.regenerateBtn.addEventListener('click', () => {
            if (state.currentImageData) {
                analyzeImageWithAI(state.currentImageData, state.currentMimeType);
            }
        });
        elements.copyBtn.addEventListener('click', copyReview);
        elements.resetBtn.addEventListener('click', resetToUpload);
        elements.resetHeaderBtn.addEventListener('click', resetToUpload);
    }

    // --- 파일 처리 로직 ---
    function handleFileSelect(e) {
        if (e.target.files && e.target.files[0]) {
            processFile(e.target.files[0]);
        }
    }

    async function processFile(file) {
        if (!file.type.startsWith('image/')) {
            showToast('이미지 파일만 업로드 가능합니다.', 'alert');
            return;
        }

        try {
            const base64Url = await resizeImage(file, 800);
            
            elements.detailsPreviewImage.src = base64Url;
            
            const mimeType = base64Url.split(';')[0].split(':')[1];
            const base64Data = base64Url.split(',')[1];
            
            state.currentImageData = base64Data;
            state.currentMimeType = mimeType;

            showSection('details');
        } catch (error) {
            console.error("파일 처리 에러:", error);
            showToast('이미지 처리 중 오류가 발생했습니다.', 'alert');
        }
    }

    function resizeImage(file, maxSize) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxSize) {
                            height *= maxSize / width;
                            width = maxSize;
                        }
                    } else {
                        if (height > maxSize) {
                            width *= maxSize / height;
                            height = maxSize;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    resolve(canvas.toDataURL('image/jpeg', 0.8));
                };
                img.onerror = reject;
                img.src = e.target.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    // --- UI 전환 함수 ---
    function showSection(sectionName) {
        elements.uploadSection.classList.add('hidden');
        elements.detailsSection.classList.add('hidden');
        elements.loadingSection.classList.add('hidden');
        elements.editSection.classList.add('hidden');
        elements.introText.classList.add('hidden');
        elements.resetHeaderBtn.classList.add('hidden');

        elements.detailsSection.style.display = '';
        elements.loadingSection.style.display = '';
        elements.editSection.style.display = '';

        if (sectionName === 'upload') {
            elements.uploadSection.classList.remove('hidden');
            elements.introText.classList.remove('hidden');
            elements.fileInput.value = ''; 
        } else if (sectionName === 'details') {
            elements.detailsSection.classList.remove('hidden');
            elements.detailsSection.style.display = 'flex';
            elements.resetHeaderBtn.classList.remove('hidden');
        } else if (sectionName === 'loading') {
            elements.loadingSection.classList.remove('hidden');
            elements.loadingSection.style.display = 'flex';
        } else if (sectionName === 'edit') {
            elements.editSection.classList.remove('hidden');
            elements.editSection.style.display = 'flex';
            elements.resetHeaderBtn.classList.remove('hidden');
        }
    }

    function resetToUpload() {
        state.currentImageData = null;
        state.currentMimeType = null;
        elements.storeNameInput.value = '';
        elements.reviewTextarea.value = '';
        renderStars(5);
        showSection('upload');
    }

    // --- 별점 UI 렌더링 ---
    function renderStars(rating) {
        state.currentRating = rating;
        
        // 레이블 텍스트 업데이트
        const labels = {
            1: "너무 아쉬워요",
            2: "조금 아쉬워요",
            3: "보통이에요",
            4: "만족해요",
            5: "매우 만족해요"
        };
        elements.ratingLabel.textContent = labels[rating];
        
        // 렌더링
        elements.detailsStarContainer.innerHTML = '';
        for (let i = 1; i <= 5; i++) {
            const wrapper = document.createElement('div');
            wrapper.className = 'cursor-pointer px-0.5 hover:scale-110 transition-transform';
            wrapper.addEventListener('click', () => renderStars(i));

            const star = document.createElement('i');
            star.setAttribute('data-lucide', 'star');
            star.className = `w-7 h-7 transition-colors ${i <= rating ? 'text-yellow-400 fill-yellow-400' : 'text-gray-200 fill-gray-100'}`;
            
            wrapper.appendChild(star);
            elements.detailsStarContainer.appendChild(wrapper);
        }
        
        lucide.createIcons();
    }

    // --- Gemini API 연동 ---
    const delay = ms => new Promise(res => setTimeout(res, ms));

    async function analyzeImageWithAI(base64Data, mimeType) {
        showSection('loading');
        
        const storeName = elements.storeNameInput.value.trim();
        const storeContext = storeName ? `가게 상호명은 '${storeName}'입니다. 이 상호명을 리뷰에 자연스럽게 포함해주세요.` : '가게 상호명은 언급하지 않거나 자연스럽게 생략해주세요.';
        const ratingContext = `사용자가 평가한 별점은 5점 만점에 ${state.currentRating}점입니다. 이 별점 분위기(1~2점: 부정적/아쉬움, 3점: 보통, 4~5점: 긍정적/만족)에 완벽하게 맞춰서 작성해주세요.`;
        
        const promptText = `이 사진을 보고 사용자가 작성할 법한 자연스럽고 현실적인 소비자 리뷰를 2~3문장으로 작성해줘. SNS나 리뷰 앱에 올라갈 글이야. 사진에서 보이는 특징(맛있어 보임, 분위기 좋음, 예쁨, 포장 잘됨 등)을 캐치해줘.
        ${storeContext}
        ${ratingContext}
        반드시 JSON 형식으로 {"review": "리뷰 내용"} 형태로만 반환해줘.`;

        const payload = {
            contents: [{
                role: "user",
                parts: [
                    { text: promptText },
                    { inlineData: { mimeType: mimeType, data: base64Data } }
                ]
            }],
            generationConfig: {
                responseMimeType: "application/json",
                responseSchema: {
                    type: "OBJECT",
                    properties: {
                        review: { type: "STRING" }
                    }
                }
            }
        };

        const maxRetries = 5;
        const delays = [1000, 2000, 4000, 8000, 16000];
        let attempt = 0;

        while (attempt < maxRetries) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                const resultText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                
                if (resultText) {
                    const cleanText = resultText.replace(new RegExp('```json', 'gi'), '').replace(new RegExp('```', 'g'), '').trim();
                    const parsedResult = JSON.parse(cleanText);
                    
                    // UI 업데이트 (요약 칩 업데이트)
                    elements.reviewTextarea.value = parsedResult.review || "정말 만족스러운 경험이었어요! 추천합니다.";
                    elements.editStarText.textContent = `${state.currentRating}점`;
                    
                    if(storeName) {
                        elements.editStoreName.textContent = storeName;
                        elements.editStoreChip.classList.remove('hidden');
                        elements.editStoreChip.style.display = 'inline-flex';
                    } else {
                        elements.editStoreChip.classList.add('hidden');
                        elements.editStoreChip.style.display = 'none';
                    }

                    showSection('edit');
                    
                    showToast('리뷰 작성이 완료되었습니다!', 'success');
                    lucide.createIcons();
                    
                    return; 
                } else {
                    throw new Error("API 응답에서 텍스트를 찾을 수 없습니다.");
                }

            } catch (error) {
                attempt++;
                if (attempt >= maxRetries) {
                    console.error("API Error after retries:", error);
                    fallbackReviewGeneration();
                    return;
                }
                await delay(delays[attempt - 1]);
            }
        }
    }

    function fallbackReviewGeneration() {
        showToast('AI 응답이 지연되어 기본 템플릿을 제공합니다.', 'alert');
        elements.reviewTextarea.value = "사진으로 담기 부족할 만큼 정말 만족스러웠어요! 다음에도 또 이용하고 싶습니다. 강추해요!";
        
        elements.editStarText.textContent = `${state.currentRating}점`;
        if(elements.storeNameInput.value.trim()) {
            elements.editStoreName.textContent = elements.storeNameInput.value.trim();
            elements.editStoreChip.classList.remove('hidden');
            elements.editStoreChip.style.display = 'inline-flex';
        } else {
            elements.editStoreChip.classList.add('hidden');
            elements.editStoreChip.style.display = 'none';
        }

        showSection('edit');
    }

    // --- 리뷰 복사 로직 ---
    function copyReview() {
        const textToCopy = elements.reviewTextarea.value.trim();
        if (!textToCopy) {
            showToast('복사할 리뷰 내용이 없습니다.', 'alert');
            return;
        }

        elements.reviewTextarea.select();
        elements.reviewTextarea.setSelectionRange(0, 99999); 

        try {
            document.execCommand('copy');
            showToast('리뷰가 클립보드에 복사되었습니다!', 'success');
            window.getSelection().removeAllRanges();
        } catch (err) {
            showToast('복사에 실패했습니다. 직접 복사해주세요.', 'alert');
        }
    }

    // --- 토스트 알림 ---
    let toastTimeout;
    function showToast(message, type = 'success') {
        elements.toastText.textContent = message;
        
        if(type === 'success') {
            elements.toastIcon.setAttribute('data-lucide', 'check-circle-2');
            elements.toastIcon.classList.replace('text-red-400', 'text-green-400');
        } else {
            elements.toastIcon.setAttribute('data-lucide', 'alert-circle');
            elements.toastIcon.classList.replace('text-green-400', 'text-red-400');
        }
        lucide.createIcons();

        // Show animation (Tailwind classes)
        elements.toast.classList.remove('opacity-0', 'translate-y-4');
        
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            elements.toast.classList.add('opacity-0', 'translate-y-4');
        }, 3000);
    }

    // 앱 실행
    init();

</script>
</body>
</html>
