<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Quiz Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        
        /* Code Block Styling */
        pre {
            background-color: #1e293b;
            color: #f8f8f2;
            padding: 1rem;
            border-radius: 0.75rem;
            overflow-x: auto;
            margin: 1rem 0;
            font-family: 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', monospace;
            font-size: 0.875rem;
            line-height: 1.5;
        }
        code {
            font-family: inherit;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <!-- Header -->
    <header class="w-full max-w-md mb-8 mt-4 text-center">
        <h1 class="text-3xl font-bold text-blue-600">Java Quiz Master ☕</h1>
        <p class="text-gray-500 text-sm mt-1">출퇴근 시간을 활용한 자바 마스터링</p>
    </header>

    <!-- Main Container -->
    <main id="app-container" class="w-full max-w-md">
        
        <!-- Step 1: Category Selection -->
        <section id="category-section" class="space-y-4">
            <h2 class="text-xl font-semibold mb-4 text-gray-800 text-center">공부할 주제를 선택하세요</h2>
            <div class="grid grid-cols-1 gap-3">
                <button onclick="startQuiz('알고리즘')" class="p-4 bg-white border border-gray-200 rounded-2xl shadow-sm hover:border-blue-500 hover:bg-blue-50 transition-all text-left flex items-center justify-between group">
                    <span class="font-medium text-gray-700">알고리즘</span>
                    <span class="text-blue-400 group-hover:translate-x-1 transition-transform">→</span>
                </button>
                <button onclick="startQuiz('자료구조')" class="p-4 bg-white border border-gray-200 rounded-2xl shadow-sm hover:border-blue-500 hover:bg-blue-50 transition-all text-left flex items-center justify-between group">
                    <span class="font-medium text-gray-700">자료구조</span>
                    <span class="text-blue-400 group-hover:translate-x-1 transition-transform">→</span>
                </button>
                <button onclick="startQuiz('자바 문법')" class="p-4 bg-white border border-gray-200 rounded-2xl shadow-sm hover:border-blue-500 hover:bg-blue-50 transition-all text-left flex items-center justify-between group">
                    <span class="font-medium text-gray-700">자바 문법</span>
                    <span class="text-blue-400 group-hover:translate-x-1 transition-transform">→</span>
                </button>
                <button onclick="startQuiz('JVM 내부 구조')" class="p-4 bg-white border border-gray-200 rounded-2xl shadow-sm hover:border-blue-500 hover:bg-blue-50 transition-all text-left flex items-center justify-between group">
                    <span class="font-medium text-gray-700">JVM 내부 구조</span>
                    <span class="text-blue-400 group-hover:translate-x-1 transition-transform">→</span>
                </button>
                <button onclick="startQuiz('컬렉션 프레임워크')" class="p-4 bg-white border border-gray-200 rounded-2xl shadow-sm hover:border-blue-500 hover:bg-blue-50 transition-all text-left flex items-center justify-between group">
                    <span class="font-medium text-gray-700">컬렉션 프레임워크</span>
                    <span class="text-blue-400 group-hover:translate-x-1 transition-transform">→</span>
                </button>
                <button onclick="startQuiz('함수형 프로그래밍 (Stream, Lambda)')" class="p-4 bg-white border border-gray-200 rounded-2xl shadow-sm hover:border-blue-500 hover:bg-blue-50 transition-all text-left flex items-center justify-between group">
                    <span class="font-medium text-gray-700">함수형 프로그래밍 (Stream, Lambda)</span>
                    <span class="text-blue-400 group-hover:translate-x-1 transition-transform">→</span>
                </button>
                <button onclick="startQuiz('객체지향 설계')" class="p-4 bg-white border border-gray-200 rounded-2xl shadow-sm hover:border-blue-500 hover:bg-blue-50 transition-all text-left flex items-center justify-between group">
                    <span class="font-medium text-gray-700">객체지향 설계</span>
                    <span class="text-blue-400 group-hover:translate-x-1 transition-transform">→</span>
                </button>
                <button onclick="startQuiz('클린 코드 / SOLID')" class="p-4 bg-white border border-gray-200 rounded-2xl shadow-sm hover:border-blue-500 hover:bg-blue-50 transition-all text-left flex items-center justify-between group">
                    <span class="font-medium text-gray-700">클린 코드 / SOLID</span>
                    <span class="text-blue-400 group-hover:translate-x-1 transition-transform">→</span>
                </button>
            </div>
        </section>

        <!-- Step 2: Loading -->
        <section id="loading-section" class="hidden flex flex-col items-center justify-center py-20">
            <div class="loader mb-4"></div>
            <p class="text-gray-600 font-medium">AI가 퀴즈를 생성하고 있습니다...</p>
        </section>

        <!-- Step 3: Quiz Screen -->
        <section id="quiz-section" class="hidden">
            <div class="mb-4 flex justify-between items-center px-2">
                <span id="quiz-progress" class="text-sm font-semibold text-blue-600">문제 1/10</span>
                <span id="quiz-category" class="text-xs bg-gray-200 px-2 py-1 rounded text-gray-600">카테고리</span>
            </div>
            
            <div class="bg-white p-6 rounded-3xl shadow-lg border border-gray-100">
                <div id="question-text" class="text-lg font-bold text-gray-800 mb-6 leading-snug">
                    <!-- Text or Code Block will be here -->
                </div>
                
                <div id="options-container" class="space-y-3">
                    <!-- Options -->
                </div>

                <div id="feedback-container" class="mt-6 hidden">
                    <div id="feedback-alert" class="p-4 rounded-2xl mb-4"></div>
                    <p id="explanation-text" class="text-sm text-gray-600 bg-gray-50 p-4 rounded-xl leading-relaxed"></p>
                </div>

                <button id="next-btn" onclick="nextQuestion()" class="w-full mt-6 py-4 bg-blue-600 text-white rounded-2xl font-bold shadow-lg shadow-blue-200 hover:bg-blue-700 transition-all hidden">
                    다음 문제
                </button>
            </div>
        </section>

        <!-- Step 4: Result Screen -->
        <section id="result-section" class="hidden text-center py-10">
            <div class="text-6xl mb-4">🎉</div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">테스트 완료!</h2>
            <p id="final-score" class="text-4xl font-black text-blue-600 mb-6">0 / 10</p>
            <button onclick="resetQuiz()" class="w-full py-4 bg-gray-800 text-white rounded-2xl font-bold hover:bg-black transition-all">
                다시 시작하기
            </button>
        </section>

    </main>

    <script>
        const apiKey = "";
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let selectedCategory = "";

        // Function to safely encode HTML special characters
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Function to format text that might contain code blocks (marked with ```)
        function formatQuestionText(text) {
            if (text.includes('```')) {
                const parts = text.split('```');
                return parts.map((part, index) => {
                    if (index % 2 === 1) {
                        // This is a code block
                        // Remove potential language identifier like "java"
                        const code = part.replace(/^[a-z]+\n/, '');
                        return `<pre><code>${escapeHtml(code)}</code></pre>`;
                    }
                    return `<p class="mb-2">${escapeHtml(part)}</p>`;
                }).join('');
            }
            return `<p>${escapeHtml(text)}</p>`;
        }

        async function startQuiz(category) {
            selectedCategory = category;
            showSection('loading-section');
            
            try {
                const questions = await fetchQuestionsFromAI(category);
                currentQuestions = questions;
                currentIndex = 0;
                score = 0;
                
                document.getElementById('quiz-category').innerText = category;
                renderQuestion();
                showSection('quiz-section');
            } catch (error) {
                console.error(error);
                alert("문제를 생성하는 중 오류가 발생했습니다. 다시 시도해주세요.");
                showSection('category-section');
            }
        }

        async function fetchQuestionsFromAI(category) {
            const systemPrompt = `당신은 자바 전문 교육가입니다. 
            사용자가 선택한 카테고리에 대해 실력을 점검할 수 있는 객관식 퀴즈 10개를 생성하세요.
            문항에 코드 예제가 필요한 경우 반드시 Markdown 코드 블록 (\`\`\`java ... \`\`\`) 형식을 사용하여 질문 내용에 포함시키세요.
            응답은 반드시 아래 JSON 구조를 따라야 합니다. 다른 텍스트는 포함하지 마세요.
            {
                "questions": [
                    {
                        "question": "다음 코드의 출력 결과는 무엇인가요?\\n\\n\`\`\`java\\nSystem.out.println(1 + 2);\\n\`\`\`",
                        "options": ["1", "2", "3", "4"],
                        "answerIndex": 2,
                        "explanation": "1과 2를 더하면 3이 출력됩니다."
                    }
                ]
            }`;

            const userQuery = `카테고리: ${category}. 자바 퀴즈 10개를 생성해줘. 코드 예제가 포함된 문제도 3개 이상 포함시켜줘.`;

            let retries = 0;
            const maxRetries = 5;
            
            while (retries < maxRetries) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: userQuery }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] },
                            generationConfig: { 
                                responseMimeType: "application/json",
                                temperature: 0.7
                            }
                        })
                    });

                    const result = await response.json();
                    const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    const data = JSON.parse(text);
                    return data.questions;
                } catch (e) {
                    retries++;
                    const delay = Math.pow(2, retries) * 500;
                    await new Promise(res => setTimeout(res, delay));
                }
            }
            throw new Error("Failed after retries");
        }

        function renderQuestion() {
            const q = currentQuestions[currentIndex];
            document.getElementById('quiz-progress').innerText = `문제 ${currentIndex + 1}/10`;
            
            // Format question text with potential code blocks
            document.getElementById('question-text').innerHTML = formatQuestionText(q.question);
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full p-4 text-left border-2 border-gray-100 rounded-2xl hover:bg-gray-50 transition-all font-medium text-gray-700";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(idx);
                container.appendChild(btn);
            });

            document.getElementById('feedback-container').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');
        }

        function checkAnswer(idx) {
            const q = currentQuestions[currentIndex];
            const buttons = document.getElementById('options-container').children;
            
            for (let btn of buttons) btn.disabled = true;

            const feedbackAlert = document.getElementById('feedback-alert');
            const feedbackContainer = document.getElementById('feedback-container');
            const explanationText = document.getElementById('explanation-text');
            const nextBtn = document.getElementById('next-btn');

            if (idx === q.answerIndex) {
                score++;
                buttons[idx].classList.add('border-green-500', 'bg-green-50');
                feedbackAlert.className = "p-4 rounded-2xl mb-4 bg-green-100 text-green-700 font-bold";
                feedbackAlert.innerText = "정답입니다! ✨";
            } else {
                buttons[idx].classList.add('border-red-500', 'bg-red-50');
                buttons[q.answerIndex].classList.add('border-green-500', 'bg-green-50');
                feedbackAlert.className = "p-4 rounded-2xl mb-4 bg-red-100 text-red-700 font-bold";
                feedbackAlert.innerText = "아쉽네요, 틀렸습니다. 💡";
            }

            explanationText.innerHTML = formatQuestionText(q.explanation);
            feedbackContainer.classList.remove('hidden');
            nextBtn.classList.remove('hidden');
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentQuestions.length) {
                renderQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('final-score').innerText = `${score} / ${currentQuestions.length}`;
            showSection('result-section');
        }

        function resetQuiz() {
            showSection('category-section');
        }

        function showSection(id) {
            ['category-section', 'loading-section', 'quiz-section', 'result-section'].forEach(sid => {
                document.getElementById(sid).classList.add('hidden');
            });
            document.getElementById(id).classList.remove('hidden');
            window.scrollTo(0,0);
        }
    </script>
</body>
</html>
