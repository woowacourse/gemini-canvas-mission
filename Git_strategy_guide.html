<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git 전략 가이드</title>
    <style>
        :root {
            --primary: #2563eb;
            --danger: #dc2626;
            --warning: #d97706;
            --success: #16a34a;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            color: var(--primary);
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .section {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 24px;
        }

        h2 {
            font-size: 1.25rem;
            margin-top: 0;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .step-group {
            margin-bottom: 20px;
        }

        .step-title {
            font-weight: 600;
            margin-bottom: 10px;
            display: block;
        }

        .option-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 12px;
            cursor: pointer;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .option-item:hover {
            background: #f1f5f9;
        }

        .option-item input {
            margin-top: 4px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: monospace;
            resize: vertical;
            margin-bottom: 12px;
            box-sizing: border-box;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .result-area {
            margin-top: 20px;
            display: none;
            padding: 20px;
            border-radius: 8px;
            background: #f1f5f9;
        }

        .warning-card {
            background-color: #fef2f2;
            border-left: 4px solid var(--danger);
            color: #991b1b;
            padding: 16px;
            margin-top: 15px;
            border-radius: 4px;
        }

        /* 코드 블록 가독성 개선: 자동 줄바꿈 및 넘침 방지 */
        .code-block {
            background: #1e293b;
            color: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            position: relative;
            margin: 15px 0;
            font-family: 'Courier New', Courier, monospace;
        }

        .code-block pre {
            margin: 0;
            white-space: pre-wrap; /* 자동 줄바꿈 활성화 */
            word-break: break-all;
            line-height: 1.7;
        }

        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 0.75rem;
            padding: 4px 8px;
            background: rgba(255,255,255,0.1);
            color: white;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .badge-strategy { background: #dbeafe; color: #1e40af; }
        .badge-ai { background: #fdf2f8; color: #9d174d; border: 1px solid #f9a8d4; }

        #loading {
            display: none;
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--primary);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Git 전략 가이드</h1>
        <p>실수를 방지하고 최선의 Git 명령어 조합을 찾으세요.</p>
    </header>

    <div class="section">
        <h2>🎯 무엇을 하고 싶나요?</h2>

        <div class="step-group">
            <span class="step-title">1단계 — 목표 선택</span>
            <label class="option-item">
                <input type="radio" name="goal" value="keep-local" onchange="saveState()">
                <span>내 로컬 커밋을 유지하면서 최신 원격 변경도 반영하고 싶다</span>
            </label>
            <label class="option-item">
                <input type="radio" name="goal" value="reset-remote" onchange="saveState()">
                <span>원격 브랜치 상태로 맞추고 싶다 (내 로컬 커밋은 필요 없음)</span>
            </label>
            <label class="option-item">
                <input type="radio" name="goal" value="clean-history" onchange="saveState()">
                <span>히스토리를 깔끔하게 유지하고 싶다 (rebase 선호)</span>
            </label>
            <label class="option-item">
                <input type="radio" name="goal" value="collab-safe" onchange="saveState()">
                <span>팀원과 협업 중이라 안전하게 작업하고 싶다</span>
            </label>
        </div>

        <div class="step-group">
            <span class="step-title">2단계 — 현재 상태 체크</span>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="hasLocalCommits" onchange="saveState()"> 로컬 커밋 있음
                </label>
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="hasRemoteCommits" onchange="saveState()"> 원격 새 커밋 있음
                </label>
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="isProtectedBranch" onchange="saveState()"> 보호 브랜치 (main/dev)
                </label>
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="noForcePush" onchange="saveState()"> Force Push 금지됨
                </label>
            </div>
        </div>

        <button onclick="evaluateStrategy()">전략 확인하기</button>

        <div id="strategyResult" class="result-area"></div>
    </div>

    <div class="section">
        <h2>🔍 Git 에러 메시지 진단 (AI 기반)</h2>
        <p style="font-size: 0.9rem; color: #64748b; margin-bottom: 12px;">콘솔에 나타난 에러 메시지를 복사해서 붙여넣으세요.</p>
        <textarea id="errorInput" placeholder="예: error: failed to push some refs to..." oninput="saveState()"></textarea>
        <button id="diagnoseBtn" onclick="analyzeErrorMessage()" style="background-color: #475569;">진단하기</button>
        <div id="loading">Gemini AI가 상황을 분석 중입니다... 잠시만 기다려주세요.</div>

        <div id="diagnosisResult" class="result-area"></div>
    </div>
</div>

<script>
    const apiKey = "";

    function copyToClipboard(text) {
        const tempInput = document.createElement("textarea");
        tempInput.value = text;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand("copy");
        document.body.removeChild(tempInput);

        const msg = document.createElement("div");
        msg.innerText = "명령어가 복사되었습니다!";
        msg.style.cssText = "position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#333; color:white; padding:8px 16px; border-radius:4px; z-index:100; font-size: 14px;";
        document.body.appendChild(msg);
        setTimeout(() => msg.remove(), 2000);
    }

    function saveState() {
        const state = {
            goal: document.querySelector('input[name="goal"]:checked')?.value,
            hasLocal: document.getElementById('hasLocalCommits').checked,
            hasRemote: document.getElementById('hasRemoteCommits').checked,
            isProtected: document.getElementById('isProtectedBranch').checked,
            noForce: document.getElementById('noForcePush').checked,
            errorInput: document.getElementById('errorInput').value
        };
        localStorage.setItem('git_guide_state', JSON.stringify(state));
    }

    function loadState() {
        const saved = localStorage.getItem('git_guide_state');
        if (!saved) return;
        const state = JSON.parse(saved);

        if (state.goal) {
            const radio = document.querySelector(`input[name="goal"][value="${state.goal}"]`);
            if (radio) radio.checked = true;
        }
        document.getElementById('hasLocalCommits').checked = state.hasLocal;
        document.getElementById('hasRemoteCommits').checked = state.hasRemote;
        document.getElementById('isProtectedBranch').checked = state.isProtected;
        document.getElementById('noForcePush').checked = state.noForce;
        document.getElementById('errorInput').value = state.errorInput || "";
    }

    function evaluateStrategy() {
        const goal = document.querySelector('input[name="goal"]:checked')?.value;
        if (!goal) return;

        const hasLocal = document.getElementById('hasLocalCommits').checked;
        const isProtected = document.getElementById('isProtectedBranch').checked;

        let result = {
            strategy: "안전한 병합 (Merge)",
            commands: "git pull origin $(git branch --show-current)",
            reason: "가장 표준적이고 안전한 협업 방식입니다.",
            warning: ""
        };

        if (goal === "reset-remote") {
            result.strategy = "강제 동기화 (Hard Reset)";
            result.commands = "git fetch origin\ngit reset --hard origin/$(git branch --show-current)";
            result.reason = "로컬의 모든 변경 사항을 무시하고 원격 브랜치와 완벽하게 일치시킵니다.";
            if (hasLocal) {
                result.warning = "이 명령어는 작성하신 로컬 커밋을 완전히 삭제하며, 복구가 매우 어렵습니다.";
            }
        } else if (goal === "clean-history" || (goal === "keep-local" && hasLocal && !isProtected)) {
            result.strategy = "리베이스 (Rebase)";
            result.commands = "git pull --rebase origin $(git branch --show-current)";
            result.reason = "로컬 커밋을 원격의 최신 이력 위로 재배치하여 깔끔한 선형 히스토리를 만듭니다.";
            if (isProtected) {
                result.warning = "공용 브랜치(main/dev)에서의 리베이스는 다른 팀원들의 히스토리를 깨뜨릴 수 있어 주의가 필요합니다.";
            }
        }

        renderResult('strategyResult', result);
        saveState();
    }

    function renderResult(elementId, data) {
        const area = document.getElementById(elementId);
        area.style.display = 'block';

        area.innerHTML = `
            <div class="badge badge-strategy">권장 전략: ${data.strategy}</div>
            <div class="step-title">왜 이 전략이 안전한가</div>
            <p style="font-size:0.9rem; margin-bottom: 15px;">${data.reason}</p>

            <div class="step-title">실행 명령어</div>
            <div class="code-block">
                <button class="copy-btn" onclick="copyToClipboard(\`${data.commands.replace(/\$/g, '\\$')}\`)">복사</button>
                <pre>${data.commands}</pre>
            </div>
            ${data.warning ? `
                <div class="warning-card">
                    <strong>⚠️ 위험 요소 감지</strong><br>
                    <span style="font-size:0.85rem;">${data.warning}</span>
                </div>
            ` : ''}
        `;
    }

    async function analyzeErrorMessage() {
        const input = document.getElementById('errorInput').value.trim();
        if (!input) return;

        const btn = document.getElementById('diagnoseBtn');
        const loading = document.getElementById('loading');

        btn.disabled = true;
        loading.style.display = 'block';
        document.getElementById('diagnosisResult').style.display = 'none';

        try {
            const systemPrompt = `너는 전문 Git 전문가이다. 사용자가 제공하는 Git 에러 메시지를 분석하여 다음 JSON 형식으로 응답하라.
            반드시 한국어로 답변하고, JSON 구조를 엄격히 지켜라.
            특히 'commands' 필드에는 실행해야 할 명령어를 단계별로 한 줄씩 작성하여 '\\n'으로 구분하라. 긴 명령어는 가독성을 위해 적절히 나누어라.
            {
                "analysis": "현재 상황에 대한 한 문장 요약",
                "reason": "에러가 발생한 구체적인 원인 분석",
                "strategy": "해결을 위한 권장 전략 명칭",
                "commands": "명령어1\\n명령어2\\n명령어3"
            }`;

            const userQuery = `이 Git 에러 메시지를 진단해줘: \n${input}`;

            const response = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: userQuery }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                analysis: { type: "STRING" },
                                reason: { type: "STRING" },
                                strategy: { type: "STRING" },
                                commands: { type: "STRING" }
                            },
                            required: ["analysis", "reason", "strategy", "commands"]
                        }
                    }
                })
            });

            const result = await response.json();
            const text = result.candidates?.[0]?.content?.parts?.[0]?.text;

            if (text) {
                const jsonMatch = text.match(/\{[\s\S]*\}/);
                const diagnosis = JSON.parse(jsonMatch ? jsonMatch[0] : text);
                renderErrorDiagnosis(diagnosis, true);
            } else {
                throw new Error("API 응답 내용이 비어 있습니다.");
            }
        } catch (error) {
            console.error("Diagnosis Error:", error);
            localFallbackAnalysis(input, error.message);
        } finally {
            btn.disabled = false;
            loading.style.display = 'none';
        }
    }

    async function fetchWithRetry(url, options, maxRetries = 5) {
        let lastError;
        for (let i = 0; i < maxRetries; i++) {
            try {
                const response = await fetch(url, options);
                if (response.ok) return response;
                await response.json();
            } catch (err) {
                lastError = err;
            }
            await new Promise(resolve => setTimeout(resolve, Math.pow(2, i) * 1000));
        }
        throw lastError || new Error("최대 재시도 횟수를 초과했습니다.");
    }

    function localFallbackAnalysis(input, errorMessage) {
        const lowerInput = input.toLowerCase();
        let diagnosis = {
            analysis: "AI 분석에 실패했습니다.",
            reason: `상세 원인: ${errorMessage || "알 수 없는 통신 오류"}.`,
            strategy: "기본 상태 확인",
            commands: "git status"
        };

        if (lowerInput.includes("conflict")) {
            diagnosis = {
                analysis: "코드 충돌 발생",
                reason: "병합 과정에서 동일한 줄이 수정되었습니다.",
                strategy: "충돌 수동 해결",
                commands: "git status\n# 충돌 파일 수정 후\ngit add .\ngit commit"
            };
        }

        renderErrorDiagnosis(diagnosis, false);
    }

    function renderErrorDiagnosis(data, isAi = false) {
        const area = document.getElementById('diagnosisResult');
        area.style.display = 'block';

        area.innerHTML = `
            <div class="badge ${isAi ? 'badge-ai' : 'badge-strategy'}">${isAi ? '✨ AI 진단 완료' : '⚠️ 로컬 분석'}</div>
            <p><strong>${data.analysis}</strong></p>
            <div class="step-title">발생 원인</div>
            <p style="font-size:0.9rem; margin-bottom: 15px;">${data.reason}</p>
            <div class="step-title">권장 조치: ${data.strategy}</div>
            <div class="code-block">
                <button class="copy-btn" onclick="copyToClipboard(\`${data.commands.replace(/\$/g, '\\$')}\`)">복사</button>
                <pre>${data.commands}</pre>
            </div>
        `;
    }

    window.onload = loadState;
</script>

</body>
</html>
