<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>컬러 매치 (Color Match)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 뷰 전환을 위한 유틸리티 클래스 */
    .view-section { display: none; }
    .view-section.active { display: flex; }
    
    /* 기본 드래그 방지 */
    .select-none { user-select: none; }
  </style>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen">

  <!-- ============================== -->
  <!-- 1. 메인 메뉴 뷰 -->
  <!-- ============================== -->
  <div id="view-menu" class="view-section active flex-col items-center justify-center p-4 min-h-screen">
    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl max-w-md w-full border border-slate-700">
      <div class="flex flex-col items-center mb-8">
        <div class="bg-gradient-to-tr from-rose-500 via-purple-500 to-blue-500 p-4 rounded-full mb-4">
          <!-- Palette Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5" fill="white"/><circle cx="17.5" cy="10.5" r=".5" fill="white"/><circle cx="8.5" cy="7.5" r=".5" fill="white"/><circle cx="6.5" cy="12.5" r=".5" fill="white"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>
        </div>
        <h1 class="text-4xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">
          컬러 매치
        </h1>
        <p class="text-slate-400 mt-2 text-center text-sm">
          목표 색상과 똑같은 색을 최대한 빠르고 정확하게 조합하세요!
        </p>
      </div>

      <div class="space-y-6">
        <!-- 라운드 설정 -->
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">
            총 라운드: <span id="setting-rounds-display" class="text-white font-bold">5</span>
          </label>
          <input 
            type="range" id="setting-rounds" min="1" max="10" value="5"
            class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500"
          />
          <div class="flex justify-between text-xs text-slate-500 mt-1 px-1">
            <span>1</span><span>10</span>
          </div>
        </div>

        <!-- 난이도 설정 -->
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">난이도</label>
          <div class="grid grid-cols-2 gap-2" id="difficulty-buttons">
            <button data-diff="easy" class="diff-btn py-2 px-3 rounded-lg text-sm font-medium transition-all bg-slate-700 text-slate-300 hover:bg-slate-600">쉬움</button>
            <button data-diff="medium" class="diff-btn py-2 px-3 rounded-lg text-sm font-medium transition-all bg-blue-600 text-white shadow-lg shadow-blue-500/30">보통</button>
            <button data-diff="hard" class="diff-btn py-2 px-3 rounded-lg text-sm font-medium transition-all bg-slate-700 text-slate-300 hover:bg-slate-600">어려움</button>
            <button data-diff="impossible" class="diff-btn py-2 px-3 rounded-lg text-sm font-medium transition-all bg-slate-700 text-slate-300 hover:bg-slate-600">불가능</button>
          </div>
        </div>

        <button id="btn-start-game" class="w-full mt-8 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-white font-bold py-4 rounded-xl shadow-lg shadow-teal-500/20 transition-transform active:scale-95 flex items-center justify-center gap-2">
          <!-- Play Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          게임 시작
        </button>
      </div>
    </div>
  </div>


  <!-- ============================== -->
  <!-- 2. 게임 플레이 뷰 -->
  <!-- ============================== -->
  <div id="view-playing" class="view-section flex-col items-center justify-center p-4 min-h-screen select-none">
    <div class="w-full max-w-lg">
      
      <!-- 헤더 및 타이머 -->
      <div class="flex justify-between items-end mb-4 px-2">
        <div class="text-xl font-bold text-slate-300">
          Round <span id="play-current-round" class="text-blue-400">1</span> / <span id="play-total-rounds">5</span>
        </div>
        <div id="play-timer-container" class="text-3xl font-mono font-bold flex items-center gap-2 text-slate-100">
          <!-- Timer Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></svg>
          <span id="play-time-left">0.0s</span>
        </div>
      </div>
      
      <!-- 타이머 프로그레스 바 -->
      <div class="w-full h-3 bg-slate-800 rounded-full mb-8 overflow-hidden">
        <div id="play-progress-bar" class="h-full bg-emerald-500" style="width: 100%;"></div>
      </div>

      <!-- 색상 표시 영역 -->
      <div class="flex gap-4 mb-8">
        <div class="flex-1 flex flex-col items-center">
          <span class="text-sm text-slate-400 font-medium mb-2">목표 색상</span>
          <div id="play-target-box" class="w-full aspect-square rounded-2xl shadow-lg border-4 border-slate-700"></div>
        </div>
        <div class="flex-1 flex flex-col items-center">
          <span class="text-sm text-slate-400 font-medium mb-2">내가 만든 색상</span>
          <div id="play-current-box" class="w-full aspect-square rounded-2xl shadow-lg border-4 border-slate-600 transition-colors duration-75"></div>
        </div>
      </div>

      <!-- 슬라이더 컨트롤 -->
      <div class="space-y-6 bg-slate-800 p-6 rounded-2xl shadow-xl">
        <!-- Red -->
        <div class="flex items-center gap-4">
          <div class="w-8 font-bold text-red-500 text-lg text-center">R</div>
          <input type="range" id="slider-r" min="0" max="255" value="128" class="flex-1 h-3 rounded-lg appearance-none cursor-pointer" style="background: linear-gradient(to right, black, red)">
          <div id="val-r" class="w-12 text-right font-mono font-medium text-slate-300">128</div>
        </div>
        <!-- Green -->
        <div class="flex items-center gap-4">
          <div class="w-8 font-bold text-green-500 text-lg text-center">G</div>
          <input type="range" id="slider-g" min="0" max="255" value="128" class="flex-1 h-3 rounded-lg appearance-none cursor-pointer" style="background: linear-gradient(to right, black, #10b981)">
          <div id="val-g" class="w-12 text-right font-mono font-medium text-slate-300">128</div>
        </div>
        <!-- Blue -->
        <div class="flex items-center gap-4">
          <div class="w-8 font-bold text-blue-500 text-lg text-center">B</div>
          <input type="range" id="slider-b" min="0" max="255" value="128" class="flex-1 h-3 rounded-lg appearance-none cursor-pointer" style="background: linear-gradient(to right, black, #3b82f6)">
          <div id="val-b" class="w-12 text-right font-mono font-medium text-slate-300">128</div>
        </div>
      </div>

      <button id="btn-submit-color" class="w-full mt-8 bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-500/30 transition-transform active:scale-95 flex items-center justify-center gap-2 text-lg">
        <!-- Check Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></svg>
        제출하기 (남은 시간 보너스)
      </button>
    </div>
  </div>


  <!-- ============================== -->
  <!-- 3. 라운드 결과 뷰 -->
  <!-- ============================== -->
  <div id="view-round-result" class="view-section flex-col items-center justify-center p-4 min-h-screen">
    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl max-w-sm w-full border border-slate-700 text-center animate-in fade-in zoom-in duration-300">
      <h2 class="text-2xl font-bold text-slate-300 mb-6">Round <span id="rr-round-num">1</span> 결과</h2>
      
      <div class="flex justify-center gap-4 mb-8">
         <div id="rr-target-box" class="w-20 h-20 rounded-xl shadow-inner"></div>
         <div id="rr-submit-box" class="w-20 h-20 rounded-xl shadow-inner"></div>
      </div>

      <div class="space-y-3 mb-8">
        <div class="flex justify-between items-center text-lg">
          <span class="text-slate-400">정확도</span>
          <span id="rr-accuracy" class="font-bold">0%</span>
        </div>
        <div class="flex justify-between items-center text-lg">
          <span class="text-slate-400">시간 보너스</span>
          <span id="rr-time-bonus" class="font-bold text-emerald-400">+0</span>
        </div>
        <div class="border-t border-slate-700 pt-3 flex justify-between items-center text-2xl">
          <span class="text-slate-300 font-bold">라운드 점수</span>
          <span id="rr-total-score" class="font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-500">
            0 점
          </span>
        </div>
      </div>

      <button id="btn-next-round" class="w-full bg-slate-100 hover:bg-white text-slate-900 font-bold py-4 rounded-xl shadow-lg transition-transform active:scale-95 text-lg">
        다음 라운드
      </button>
    </div>
  </div>


  <!-- ============================== -->
  <!-- 4. 최종 결과 뷰 -->
  <!-- ============================== -->
  <div id="view-game-result" class="view-section flex-col items-center p-4 py-12 min-h-screen overflow-y-auto">
    <div class="max-w-md w-full animate-in slide-in-from-bottom-8 duration-500">
      
      <div class="flex flex-col items-center mb-8">
        <!-- Trophy Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-yellow-400 mb-4"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
        <h1 class="text-3xl font-bold text-slate-200">게임 완료!</h1>
      </div>

      <!-- 최종 점수판 -->
      <div class="bg-slate-800 p-8 rounded-3xl shadow-2xl border border-slate-700 flex flex-col items-center mb-8 relative overflow-hidden">
        <div class="absolute top-0 right-0 w-32 h-32 bg-white opacity-5 rounded-full -translate-y-1/2 translate-x-1/2 blur-2xl"></div>
        
        <p class="text-slate-400 font-medium mb-2">최종 점수</p>
        <div class="flex items-baseline gap-2 mb-6">
          <span id="gr-total-score" class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-br from-white to-slate-400">
            0
          </span>
          <span id="gr-max-score" class="text-xl text-slate-500 font-medium">/ 500</span>
        </div>

        <div class="flex flex-col items-center justify-center p-6 w-full bg-slate-900/50 rounded-2xl">
          <span class="text-sm text-slate-400 mb-1">나의 등급</span>
          <span id="gr-grade" class="text-7xl font-black italic drop-shadow-lg text-yellow-400">
            S
          </span>
        </div>
      </div>

      <!-- 라운드별 상세 리스트 영역 -->
      <div class="space-y-3 mb-10">
        <h3 class="text-lg font-bold text-slate-300 ml-2">라운드별 기록</h3>
        <div id="gr-round-list" class="space-y-3">
          <!-- JS로 동적 생성됨 -->
        </div>
      </div>

      <button id="btn-restart" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-500/20 transition-transform active:scale-95 flex items-center justify-center gap-2 text-lg">
        <!-- Rotate Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        다시 플레이하기
      </button>

    </div>
  </div>


  <!-- ============================== -->
  <!-- JavaScript 로직 -->
  <!-- ============================== -->
  <script>
    // --- 상수 및 유틸리티 함수 ---
    const DIFFICULTY_SETTINGS = {
      easy: { name: '쉬움', baseTime: 15, timeDecay: 0.95, minTime: 5 },
      medium: { name: '보통', baseTime: 10, timeDecay: 0.92, minTime: 3 },
      hard: { name: '어려움', baseTime: 7, timeDecay: 0.88, minTime: 2 },
      impossible: { name: '불가능', baseTime: 4, timeDecay: 0.85, minTime: 1 },
    };

    const getRandomColor = () => ({
      r: Math.floor(Math.random() * 256),
      g: Math.floor(Math.random() * 256),
      b: Math.floor(Math.random() * 256)
    });

    const calculateAccuracy = (c1, c2) => {
      const rDiff = c1.r - c2.r;
      const gDiff = c1.g - c2.g;
      const bDiff = c1.b - c2.b;
      const distance = Math.sqrt(rDiff * rDiff + gDiff * gDiff + bDiff * bDiff);
      const maxDistance = Math.sqrt(255 * 255 * 3); // 약 441.67
      const accuracy = Math.max(0, 100 - (distance / maxDistance) * 100);
      return accuracy;
    };

    const getGrade = (averageAccuracy) => {
      if (averageAccuracy >= 95) return { grade: 'S', color: 'text-yellow-400' };
      if (averageAccuracy >= 85) return { grade: 'A', color: 'text-blue-400' };
      if (averageAccuracy >= 70) return { grade: 'B', color: 'text-green-400' };
      if (averageAccuracy >= 50) return { grade: 'C', color: 'text-orange-400' };
      return { grade: 'F', color: 'text-red-500' };
    };

    // --- 글로벌 상태 (State) ---
    let settings = { rounds: 5, difficulty: 'medium' };
    let currentRound = 1;
    let targetColor = { r: 0, g: 0, b: 0 };
    let currentColor = { r: 128, g: 128, b: 128 };
    let timeLeft = 0;
    let roundTime = 0;
    let scoreData = [];
    let roundResult = null;
    let timerRef = null;
    let endTime = 0;

    // --- DOM 요소 캐싱 ---
    // Views
    const viewMenu = document.getElementById('view-menu');
    const viewPlaying = document.getElementById('view-playing');
    const viewRoundResult = document.getElementById('view-round-result');
    const viewGameResult = document.getElementById('view-game-result');

    // Menu Elements
    const settingRoundsSlider = document.getElementById('setting-rounds');
    const settingRoundsDisplay = document.getElementById('setting-rounds-display');
    const diffButtons = document.querySelectorAll('.diff-btn');
    const btnStartGame = document.getElementById('btn-start-game');

    // Playing Elements
    const playCurrentRound = document.getElementById('play-current-round');
    const playTotalRounds = document.getElementById('play-total-rounds');
    const playTimerContainer = document.getElementById('play-timer-container');
    const playTimeLeft = document.getElementById('play-time-left');
    const playProgressBar = document.getElementById('play-progress-bar');
    const playTargetBox = document.getElementById('play-target-box');
    const playCurrentBox = document.getElementById('play-current-box');
    const sliderR = document.getElementById('slider-r');
    const sliderG = document.getElementById('slider-g');
    const sliderB = document.getElementById('slider-b');
    const valR = document.getElementById('val-r');
    const valG = document.getElementById('val-g');
    const valB = document.getElementById('val-b');
    const btnSubmitColor = document.getElementById('btn-submit-color');

    // Round Result Elements
    const rrRoundNum = document.getElementById('rr-round-num');
    const rrTargetBox = document.getElementById('rr-target-box');
    const rrSubmitBox = document.getElementById('rr-submit-box');
    const rrAccuracy = document.getElementById('rr-accuracy');
    const rrTimeBonus = document.getElementById('rr-time-bonus');
    const rrTotalScore = document.getElementById('rr-total-score');
    const btnNextRound = document.getElementById('btn-next-round');

    // Game Result Elements
    const grTotalScore = document.getElementById('gr-total-score');
    const grMaxScore = document.getElementById('gr-max-score');
    const grGrade = document.getElementById('gr-grade');
    const grRoundList = document.getElementById('gr-round-list');
    const btnRestart = document.getElementById('btn-restart');

    // --- 화면 전환 함수 ---
    function showView(view) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      view.classList.add('active');
    }

    // --- 이벤트 리스너 설정 ---

    // [메뉴] 라운드 슬라이더
    settingRoundsSlider.addEventListener('input', (e) => {
      settings.rounds = parseInt(e.target.value);
      settingRoundsDisplay.textContent = settings.rounds;
    });

    // [메뉴] 난이도 버튼
    diffButtons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        settings.difficulty = e.target.getAttribute('data-diff');
        
        // 스타일 리셋
        diffButtons.forEach(b => {
          b.className = "diff-btn py-2 px-3 rounded-lg text-sm font-medium transition-all bg-slate-700 text-slate-300 hover:bg-slate-600";
        });
        
        // 선택된 버튼 스타일 적용
        e.target.className = "diff-btn py-2 px-3 rounded-lg text-sm font-medium transition-all bg-blue-600 text-white shadow-lg shadow-blue-500/30";
      });
    });

    // [메뉴] 시작 버튼
    btnStartGame.addEventListener('click', () => {
      scoreData = [];
      currentRound = 1;
      startRound(currentRound, settings.difficulty);
      showView(viewPlaying);
    });

    // [플레이] 색상 슬라이더
    function updateCurrentColor() {
      currentColor = {
        r: parseInt(sliderR.value),
        g: parseInt(sliderG.value),
        b: parseInt(sliderB.value)
      };
      valR.textContent = currentColor.r;
      valG.textContent = currentColor.g;
      valB.textContent = currentColor.b;
      playCurrentBox.style.backgroundColor = `rgb(${currentColor.r}, ${currentColor.g}, ${currentColor.b})`;
    }

    sliderR.addEventListener('input', updateCurrentColor);
    sliderG.addEventListener('input', updateCurrentColor);
    sliderB.addEventListener('input', updateCurrentColor);

    // [플레이] 제출 버튼
    btnSubmitColor.addEventListener('click', () => {
      handleRoundEnd(timeLeft, targetColor, currentColor);
    });

    // [결과] 다음 라운드 / 결과 보기 버튼
    btnNextRound.addEventListener('click', () => {
      if (currentRound < settings.rounds) {
        currentRound++;
        startRound(currentRound, settings.difficulty);
        showView(viewPlaying);
      } else {
        renderGameResult();
        showView(viewGameResult);
      }
    });

    // [최종결과] 다시하기 버튼
    btnRestart.addEventListener('click', () => {
      showView(viewMenu);
    });


    // --- 핵심 게임 로직 ---

    function calculateRoundTime(round, difficulty) {
      const config = DIFFICULTY_SETTINGS[difficulty];
      let time = config.baseTime * Math.pow(config.timeDecay, round - 1);
      return Math.max(time, config.minTime);
    }

    function startRound(round, difficulty) {
      // 상태 초기화
      targetColor = getRandomColor();
      currentColor = { r: 128, g: 128, b: 128 };
      
      // 슬라이더 및 텍스트 UI 초기화
      sliderR.value = 128; sliderG.value = 128; sliderB.value = 128;
      updateCurrentColor();

      // UI 텍스트 렌더링
      playCurrentRound.textContent = round;
      playTotalRounds.textContent = settings.rounds;
      playTargetBox.style.backgroundColor = `rgb(${targetColor.r}, ${targetColor.g}, ${targetColor.b})`;

      // 타이머 설정
      const timeForRound = calculateRoundTime(round, difficulty);
      roundTime = timeForRound;
      timeLeft = timeForRound;
      endTime = Date.now() + timeForRound * 1000;

      if (timerRef) cancelAnimationFrame(timerRef);
      
      const updateTimer = () => {
        const now = Date.now();
        const remaining = Math.max(0, (endTime - now) / 1000);
        timeLeft = remaining;

        // UI 업데이트
        playTimeLeft.textContent = timeLeft.toFixed(1) + 's';
        const timeRatio = timeLeft / roundTime;
        playProgressBar.style.width = `${Math.max(0, timeRatio * 100)}%`;

        const isUrgent = timeLeft < 3;
        
        // 긴급 상태 CSS 토글
        if (isUrgent) {
          playTimerContainer.className = "text-3xl font-mono font-bold flex items-center gap-2 text-rose-500 animate-pulse";
          playProgressBar.className = "h-full bg-rose-500";
        } else {
          playTimerContainer.className = "text-3xl font-mono font-bold flex items-center gap-2 text-slate-100";
          playProgressBar.className = "h-full bg-emerald-500";
        }

        if (remaining > 0) {
          timerRef = requestAnimationFrame(updateTimer);
        } else {
          // 바닐라 JS에서는 타이머 루프 내에서도 클로저를 통해 전역 변수인 currentColor의 최신값을 바로 읽을 수 있습니다.
          handleRoundEnd(0, targetColor, currentColor); 
        }
      };
      
      timerRef = requestAnimationFrame(updateTimer);
    }

    function handleRoundEnd(timeRemaining, tColor, cColor) {
      if (timerRef) cancelAnimationFrame(timerRef);
      
      const accuracy = calculateAccuracy(tColor, cColor);
      const timeBonus = (timeRemaining / roundTime) * 20; 
      let finalScore = accuracy + (accuracy > 50 ? timeBonus : 0); 
      if (finalScore > 100) finalScore = 100;
      
      roundResult = {
        round: currentRound,
        accuracy: accuracy,
        timeBonus: accuracy > 50 ? timeBonus : 0, // 50% 미만이면 보너스 0
        totalScore: finalScore,
        target: tColor,
        submitted: cColor
      };

      scoreData.push(roundResult);
      renderRoundResult();
      showView(viewRoundResult);
    }

    function renderRoundResult() {
      rrRoundNum.textContent = currentRound;
      rrTargetBox.style.backgroundColor = `rgb(${roundResult.target.r}, ${roundResult.target.g}, ${roundResult.target.b})`;
      rrSubmitBox.style.backgroundColor = `rgb(${roundResult.submitted.r}, ${roundResult.submitted.g}, ${roundResult.submitted.b})`;
      rrAccuracy.textContent = `${roundResult.accuracy.toFixed(1)}%`;
      rrTimeBonus.textContent = `+${roundResult.timeBonus.toFixed(1)}`;
      rrTotalScore.textContent = `${roundResult.totalScore.toFixed(0)} 점`;

      if (currentRound < settings.rounds) {
        btnNextRound.textContent = '다음 라운드';
      } else {
        btnNextRound.textContent = '최종 결과 보기';
      }
    }

    function renderGameResult() {
      const totalScore = scoreData.reduce((acc, curr) => acc + curr.totalScore, 0);
      const maxPossibleScore = settings.rounds * 100;
      const averageScore = totalScore / settings.rounds;
      const gradeInfo = getGrade(averageScore);

      grTotalScore.textContent = Math.round(totalScore);
      grMaxScore.textContent = `/ ${maxPossibleScore}`;
      
      // 기존 클래스 제거 후 새 색상 클래스 추가
      grGrade.className = `text-7xl font-black italic drop-shadow-lg ${gradeInfo.color}`;
      grGrade.textContent = gradeInfo.grade;

      // 라운드 리스트 동적 생성
      grRoundList.innerHTML = ''; // 초기화
      scoreData.forEach(data => {
        const row = document.createElement('div');
        row.className = "bg-slate-800/80 p-4 rounded-xl flex items-center justify-between border border-slate-700/50";
        row.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="text-slate-400 font-bold w-6">#${data.round}</div>
            <div class="flex -space-x-2">
              <div class="w-6 h-6 rounded-full border border-slate-700" style="background-color: rgb(${data.target.r}, ${data.target.g}, ${data.target.b})"></div>
              <div class="w-6 h-6 rounded-full border border-slate-700" style="background-color: rgb(${data.submitted.r}, ${data.submitted.g}, ${data.submitted.b})"></div>
            </div>
          </div>
          <div class="flex items-center gap-4 text-sm">
            <span class="text-slate-400">${data.accuracy.toFixed(0)}% 정확도</span>
            <span class="font-bold w-12 text-right">${data.totalScore.toFixed(0)}점</span>
          </div>
        `;
        grRoundList.appendChild(row);
      });
    }
  </script>
</body>
</html>
