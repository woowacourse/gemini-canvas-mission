<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>과소비 감시자</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f8fafc;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .chart-container {
            position: relative;
            height: 200px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* 상세 내역 리스트용 커스텀 스크롤바 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <div class="max-w-6xl mx-auto px-4 pt-8">
        <!-- 헤더 -->
        <header class="mb-10 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-blue-600 tracking-tighter">과소비 감시자</h1>
                <p class="text-gray-500 font-medium">당신의 모든 지출을 철저하게 추적하고 기록합니다.</p>
            </div>
        </header>

        <!-- 상단 섹션: 지출 내역 추가 및 상세 내역 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 mb-16">
            <!-- 왼쪽: 입력 폼 -->
            <div class="space-y-8">
                <section class="glass-card p-8 rounded-[2.5rem] shadow-xl border-t-4 border-blue-600">
                    <h2 class="text-xl font-bold mb-6 flex items-center gap-2 text-gray-800">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-500" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v2H7a1 1 0 100 2h2v2a1 1 0 102 0v-2h2a1 1 0 100-2h-2V7z" clip-rule="evenodd" />
                        </svg>
                        지출 내역 추가
                    </h2>
                    <form id="expense-form" class="space-y-6">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-semibold text-gray-600 mb-2">언제 썼나요?</label>
                                <input type="date" id="input-date" required class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:ring-4 focus:ring-blue-100 outline-none transition-all text-lg">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-600 mb-2">분류</label>
                                <select id="input-category" class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:ring-4 focus:ring-blue-100 outline-none transition-all text-lg">
                                    <option value="식비">🍔 식비</option>
                                    <option value="교통">🚌 교통</option>
                                    <option value="쇼핑">🛍️ 쇼핑</option>
                                    <option value="문화">🎨 문화</option>
                                    <option value="의료">🏥 의료</option>
                                    <option value="기타">✨ 기타</option>
                                </select>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-semibold text-gray-600 mb-2">항목명 (1~15자, 숫자 제외)</label>
                                <input type="text" id="input-title" placeholder="무엇에 지출했나요?" maxlength="15" required class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:ring-4 focus:ring-blue-100 outline-none transition-all text-lg">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-600 mb-2">금액 (원)</label>
                                <input type="number" id="input-amount" placeholder="0" min="0" required class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:ring-4 focus:ring-blue-100 outline-none transition-all text-lg">
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-2xl shadow-xl shadow-blue-100 transition-all transform active:scale-[0.98] text-xl">
                            추가
                        </button>
                    </form>
                </section>
            </div>

            <!-- 오른쪽: 지출 상세 내역 리스트 -->
            <div>
                <section>
                    <div class="flex flex-col mb-6 gap-4">
                        <div class="flex justify-between items-center px-1">
                            <h2 class="text-2xl font-black text-gray-900 tracking-tight">지출 내역</h2>
                            <button id="clear-all" class="text-sm font-bold text-gray-400 hover:text-blue-500 transition-colors">기록 전면 삭제</button>
                        </div>
                        
                        <div class="flex flex-wrap items-center gap-3 bg-white p-4 rounded-3xl shadow-sm border border-gray-100">
                            <div class="flex items-center gap-3 flex-grow">
                                <span class="text-xs font-black text-gray-400 uppercase tracking-widest ml-1">조회 일자</span>
                                <input type="date" id="filter-date" class="text-sm border border-gray-200 rounded-xl px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                                <button id="reset-filter" class="text-xs font-bold bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-2 rounded-xl transition-all">전체 내역</button>
                            </div>
                            <div class="flex items-center gap-2 border-l border-gray-100 pl-4">
                                <select id="sort-order" class="text-sm bg-transparent border-none focus:ring-0 text-gray-700 font-bold cursor-pointer">
                                    <option value="desc">최신순</option>
                                    <option value="asc">오래된순</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div id="expense-list" class="space-y-4 max-h-[500px] overflow-y-auto pr-2 custom-scrollbar">
                        <!-- 내역 동적 추가 -->
                    </div>
                </section>
            </div>
        </div>

        <!-- 하단 섹션: 지출 분석 요약 -->
        <div>
            <div class="flex items-center gap-3 mb-8">
                <div class="h-1 w-10 bg-blue-600 rounded-full"></div>
                <h2 class="text-2xl font-black text-gray-900 tracking-tight">지출 정밀 분석</h2>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <!-- 오늘 지출 현황 -->
                <div class="flex flex-col gap-6">
                    <div class="glass-card p-10 rounded-[2.5rem] shadow-lg border-b-8 border-blue-500">
                        <p class="text-sm text-gray-500 font-bold mb-2 uppercase tracking-widest">오늘의 지출</p>
                        <p id="total-today" class="text-4xl font-black text-gray-900">0원</p>
                    </div>
                    <div class="glass-card p-8 rounded-[2.5rem] shadow-md flex flex-col items-center justify-center">
                        <p class="text-xs font-bold text-gray-400 mb-4 uppercase">주요 지출처 (오늘)</p>
                        <div class="chart-container">
                            <canvas id="chart-today"></canvas>
                        </div>
                    </div>
                </div>
                
                <!-- 이번 주 지출 현황 -->
                <div class="flex flex-col gap-6">
                    <div class="glass-card p-10 rounded-[2.5rem] shadow-lg border-b-8 border-indigo-500">
                        <p class="text-sm text-gray-500 font-bold mb-2 uppercase tracking-widest">주간 누적 지출</p>
                        <p id="total-week" class="text-4xl font-black text-gray-900">0원</p>
                    </div>
                    <div class="glass-card p-8 rounded-[2.5rem] shadow-md flex flex-col items-center justify-center">
                        <p class="text-xs font-bold text-gray-400 mb-4 uppercase">주간 소비 패턴</p>
                        <div class="chart-container">
                            <canvas id="chart-week"></canvas>
                        </div>
                    </div>
                </div>

                <!-- 이번 달 지출 현황 -->
                <div class="flex flex-col gap-6">
                    <div class="glass-card p-10 rounded-[2.5rem] shadow-lg border-b-8 border-slate-900">
                        <p class="text-sm text-gray-500 font-bold mb-2 uppercase tracking-widest">월간 총 지출액</p>
                        <p id="total-month" class="text-4xl font-black text-gray-900">0원</p>
                    </div>
                    <div class="glass-card p-8 rounded-[2.5rem] shadow-md flex flex-col items-center justify-center">
                        <p class="text-xs font-bold text-gray-400 mb-4 uppercase">월간 소비 비중</p>
                        <div class="chart-container">
                            <canvas id="chart-month"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 토스트 메시지 -->
    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-8 py-4 rounded-full shadow-2xl transition-all opacity-0 pointer-events-none z-50 font-bold text-sm">
        메시지
    </div>

    <script>
        // State Management
        let expenses = JSON.parse(localStorage.getItem('my_expenses')) || [];
        
        let currentSortOrder = 'desc';
        let currentFilterDate = '';
        
        let charts = {
            today: null,
            week: null,
            month: null
        };

        const categories = ['식비', '교통', '쇼핑', '문화', '의료', '기타'];
        const categoryColors = ['#2563eb', '#4f46e5', '#7c3aed', '#6366f1', '#0ea5e9', '#64748b'];

        const expenseForm = document.getElementById('expense-form');
        const expenseList = document.getElementById('expense-list');
        const totalTodayEl = document.getElementById('total-today');
        const totalWeekEl = document.getElementById('total-week');
        const totalMonthEl = document.getElementById('total-month');
        const clearAllBtn = document.getElementById('clear-all');
        const sortSelect = document.getElementById('sort-order');
        const filterDateInput = document.getElementById('filter-date');
        const resetFilterBtn = document.getElementById('reset-filter');
        const toast = document.getElementById('toast');

        // 초기 날짜 설정
        document.getElementById('input-date').valueAsDate = new Date();

        function formatKRW(amount) {
            return new Intl.NumberFormat('ko-KR').format(amount) + '원';
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.remove('opacity-0', 'translate-y-4');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4');
            }, 3000);
        }

        function saveToStorage() {
            localStorage.setItem('my_expenses', JSON.stringify(expenses));
            render();
        }

        // 지출 추가
        expenseForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const titleInput = document.getElementById('input-title');
            const titleVal = titleInput.value.trim();
            const amountVal = parseInt(document.getElementById('input-amount').value);
            
            const hasNumber = /\d/.test(titleVal);
            if (titleVal.length < 1 || titleVal.length > 15 || hasNumber) {
                showToast('항목명은 1~15자 이내의 숫자를 제외한 문자만 가능합니다.');
                return;
            }

            if (amountVal < 0) {
                showToast('금액은 음수로 입력할 수 없습니다. 다시 확인하세요.');
                return;
            }

            const newExpense = {
                id: Date.now(),
                date: document.getElementById('input-date').value,
                category: document.getElementById('input-category').value,
                title: titleVal,
                amount: amountVal
            };
            expenses.push(newExpense);
            saveToStorage();
            
            titleInput.value = '';
            document.getElementById('input-amount').value = '';
            showToast('지출이 성공적으로 기록되었습니다. ✨');
        });

        function deleteExpense(id) {
            expenses = expenses.filter(item => item.id !== id);
            saveToStorage();
            showToast('내역을 삭제했습니다.');
        }

        sortSelect.addEventListener('change', (e) => {
            currentSortOrder = e.target.value;
            render();
        });

        filterDateInput.addEventListener('change', (e) => {
            currentFilterDate = e.target.value;
            render();
        });

        resetFilterBtn.addEventListener('click', () => {
            currentFilterDate = '';
            filterDateInput.value = '';
            render();
        });

        clearAllBtn.addEventListener('click', () => {
            if (expenses.length === 0) return;
            if (confirm('모든 기록을 삭제하시겠습니까? 데이터는 복구되지 않습니다.')) {
                expenses = [];
                saveToStorage();
                showToast('초기화가 완료되었습니다.');
            }
        });

        function updateChart(id, dataMap) {
            const canvas = document.getElementById(`chart-${id}`);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const dataValues = categories.map(cat => dataMap[cat] || 0);
            const total = dataValues.reduce((a, b) => a + b, 0);

            if (charts[id]) charts[id].destroy();

            // 차트 기본 옵션
            const baseOptions = {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '75%',
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        enabled: total > 0,
                        backgroundColor: '#1e293b',
                        padding: 12,
                        cornerRadius: 12,
                        callbacks: {
                            label: function(context) {
                                const val = context.raw;
                                const percent = ((val / total) * 100).toFixed(1);
                                return ` ${context.label}: ${formatKRW(val)} (${percent}%)`;
                            }
                        }
                    }
                }
            };

            if (total === 0) {
                charts[id] = new Chart(ctx, {
                    type: 'doughnut',
                    data: { 
                        labels: ['데이터 없음'], 
                        datasets: [{ 
                            data: [1], 
                            backgroundColor: ['#f1f5f9'], 
                            borderWidth: 0 
                        }] 
                    },
                    options: baseOptions
                });
                return;
            }

            charts[id] = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: categories,
                    datasets: [{
                        data: dataValues,
                        backgroundColor: categoryColors,
                        hoverOffset: 12,
                        borderWidth: 0,
                    }]
                },
                options: baseOptions
            });
        }

        function calculateStats() {
            const now = new Date();
            const todayStr = new Date().toISOString().split('T')[0];
            const weekRef = new Date();
            const day = weekRef.getDay();
            const diff = weekRef.getDate() - day + (day === 0 ? -6 : 1);
            const startOfWeek = new Date(weekRef.setDate(diff));
            startOfWeek.setHours(0,0,0,0);
            const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);

            let tTotal = 0, wTotal = 0, mTotal = 0;
            let tMap = {}, wMap = {}, mMap = {};

            expenses.forEach(item => {
                const itemDate = new Date(item.date);
                const amt = item.amount;
                const cat = item.category;

                if (item.date === todayStr) { tTotal += amt; tMap[cat] = (tMap[cat] || 0) + amt; }
                if (itemDate >= startOfWeek) { wTotal += amt; wMap[cat] = (wMap[cat] || 0) + amt; }
                if (itemDate >= startOfMonth) { mTotal += amt; mMap[cat] = (mMap[cat] || 0) + amt; }
            });

            totalTodayEl.textContent = formatKRW(tTotal);
            totalWeekEl.textContent = formatKRW(wTotal);
            totalMonthEl.textContent = formatKRW(mTotal);

            updateChart('today', tMap);
            updateChart('week', wMap);
            updateChart('month', mMap);
        }

        function render() {
            let displayList = expenses;
            if (currentFilterDate) displayList = expenses.filter(item => item.date === currentFilterDate);

            if (displayList.length === 0) {
                const message = "지출 내역이 없습니다.";
                expenseList.innerHTML = `<div class="bg-white p-12 rounded-[2.5rem] text-center text-gray-400 border-2 border-dashed border-gray-100 font-medium">${message}</div>`;
            } else {
                const sorted = [...displayList].sort((a, b) => {
                    const dateA = new Date(a.date), dateB = new Date(b.date);
                    return currentSortOrder === 'desc' ? (dateB - dateA || b.id - a.id) : (dateA - dateB || a.id - b.id);
                });

                expenseList.innerHTML = sorted.map(item => `
                    <div class="glass-card p-5 rounded-3xl flex items-center justify-between group hover:shadow-xl hover:translate-x-1 transition-all duration-300">
                        <div class="flex items-center gap-5">
                            <div class="w-14 h-14 rounded-2xl bg-gray-50 flex items-center justify-center text-2xl shadow-inner group-hover:bg-white transition-colors">
                                ${getEmoji(item.category)}
                            </div>
                            <div>
                                <h3 class="font-black text-gray-800 text-lg">${item.title}</h3>
                                <div class="flex gap-2 text-[10px] font-bold uppercase tracking-widest mt-1">
                                    <span class="text-blue-600 bg-blue-50 px-2 py-1 rounded-lg">${item.date}</span>
                                    <span class="text-gray-400 bg-gray-100 px-2 py-1 rounded-lg">${item.category}</span>
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <span class="font-black text-gray-900 text-xl">${formatKRW(item.amount)}</span>
                            <button onclick="deleteExpense(${item.id})" class="p-2 text-gray-200 hover:text-red-500 transition-colors opacity-0 group-hover:opacity-100">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                            </button>
                        </div>
                    </div>
                `).join('');
            }
            calculateStats();
        }

        function getEmoji(category) {
            const emojis = {'식비': '🍔', '교통': '🚌', '쇼핑': '🛍️', '문화': '🎨', '의료': '🏥', '기타': '✨'};
            return emojis[category] || '💰';
        }

        window.onload = render;
    </script>
</body>
</html>
