<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>나 벨트 풀었다. - 메인 음식 쌓기</title>
    <style>
        @font-face {
            font-family: 'BMHANNAPro';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_seven@1.0/BMHANNAPro.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --baemin-mint: #2AC1BC;
            --baemin-dark: #333333;
            --baemin-gray: #999999;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'BMHANNAPro', sans-serif;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
        }

        body {
            background-color: #f6f6f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 100dvh;
            background-color: #fff;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        /* Start Screen */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fff;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
        }

        .start-logo {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        .start-title {
            font-size: clamp(28px, 8vw, 40px);
            color: var(--baemin-dark);
            margin-bottom: 10px;
        }

        .start-desc {
            font-size: 16px;
            color: var(--baemin-gray);
            margin-bottom: 40px;
            line-height: 1.5;
        }

        .btn-start {
            width: 100%;
            max-width: 250px;
            background-color: var(--baemin-mint);
            color: white;
            border: none;
            padding: 18px;
            font-size: 20px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0px #21a19d;
            transition: all 0.1s;
        }

        .btn-start:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px #21a19d;
        }

        /* Header UI */
        #header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 12px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border: 2px solid var(--baemin-mint);
            min-width: 100px;
        }

        .label {
            font-size: 12px;
            color: var(--baemin-gray);
            margin-bottom: 2px;
        }

        .value {
            font-size: clamp(16px, 4vw, 20px);
            color: var(--baemin-dark);
        }

        .highlight {
            color: var(--baemin-mint);
            font-weight: bold;
        }

        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #ffffff;
        }

        .danger-line {
            position: absolute;
            top: 120px;
            left: 0;
            width: 100%;
            height: 2px;
            background: repeating-linear-gradient(90deg, #ff4d4d, #ff4d4d 10px, transparent 10px, transparent 20px);
            opacity: 0.6;
            z-index: 5;
        }

        .pop-text {
            position: absolute;
            top: 160px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            font-size: clamp(18px, 5vw, 24px);
            color: var(--baemin-mint);
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.9);
            white-space: nowrap;
            z-index: 100;
            animation: popFadeCenter 2s ease-out forwards;
        }

        @keyframes popFadeCenter {
            0% {
                transform: translate(-50%, 20px) scale(0.8);
                opacity: 0;
            }

            15% {
                transform: translate(-50%, 0) scale(1.1);
                opacity: 1;
            }

            85% {
                transform: translate(-50%, -10px) scale(1);
                opacity: 1;
            }

            100% {
                transform: translate(-50%, -30px) scale(1);
                opacity: 0;
            }
        }

        #result-modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .receipt {
            background: #fff;
            width: 100%;
            max-width: 340px;
            max-height: 90vh;
            padding: 30px 20px;
            position: relative;
            filter: drop-shadow(0 10px 10px rgba(0, 0, 0, 0.3));
            overflow-y: auto;
        }

        .receipt::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 0;
            width: 100%;
            height: 10px;
            background: linear-gradient(-45deg, transparent 5px, #fff 5px), linear-gradient(45deg, transparent 5px, #fff 5px);
            background-size: 10px 10px;
        }

        .receipt-header {
            text-align: center;
            border-bottom: 1px dashed #ccc;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .receipt-title {
            font-size: 24px;
            color: var(--baemin-dark);
        }

        .receipt-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 16px;
        }

        .receipt-total {
            border-top: 2px solid #333;
            margin-top: 15px;
            padding-top: 15px;
            font-size: 22px;
        }

        .btn-restart {
            margin-top: 25px;
            width: 100%;
            background: var(--baemin-mint);
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 4px;
        }

        #next-food {
            position: absolute;
            top: 90px;
            right: 15px;
            text-align: center;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .next-preview {
            width: 50px;
            height: 50px;
            background: #f0f0f0;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            border: 2px solid var(--baemin-mint);
            margin-top: 4px;
        }
    </style>
</head>

<body>

    <div id="game-container">
        <div id="start-screen">
            <div class="start-logo">🍖</div>
            <h1 class="start-title">나 벨트 풀었다.</h1>
            <p class="start-desc">메인 음식을 쌓아서<br>배가 터질 때까지 달려보세요!<br>(우아한테크코스 8기 전용)</p>
            <button class="btn-start" onclick="startGame()">주문 시작하기</button>
        </div>

        <div id="header">
            <div class="info-box">
                <div class="label">남은 시간</div>
                <div id="timer" class="value highlight">20.0s</div>
            </div>
            <div class="info-box">
                <div class="label">주문 금액</div>
                <div id="score" class="value">0원</div>
            </div>
        </div>

        <div id="next-food">
            <div class="label">다음 메뉴</div>
            <div id="next-preview" class="next-preview">🍢</div>
        </div>

        <div class="danger-line"></div>
        <canvas id="game-canvas"></canvas>

        <div id="result-modal">
            <div class="receipt">
                <div class="receipt-header">
                    <div class="receipt-title">주문 내역서</div>
                    <div style="font-size:12px; color:#999; margin-top:5px;">배달의 민족 - 우아한테크코스</div>
                </div>
                <div id="receipt-items"></div>
                <div class="receipt-row receipt-total">
                    <span>오늘의 먹부림</span>
                    <span id="final-score">0원</span>
                </div>
                <button class="btn-restart" onclick="resetGame()">다시 주문하기</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');
        const startScreen = document.getElementById('start-screen');
        const headerUI = document.getElementById('header');
        const nextFoodUI = document.getElementById('next-food');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const nextPreviewEl = document.getElementById('next-preview');
        const resultModal = document.getElementById('result-modal');
        const finalScoreEl = document.getElementById('final-score');

        const FOOD_DATA = [
            { name: "떡볶이", emoji: "🍢", radius: 25, score: 1000, color: "#FF5733" },
            { name: "김밥", emoji: "🍙", radius: 35, score: 3000, color: "#333333" },
            { name: "햄버거", emoji: "🍔", radius: 50, score: 7000, color: "#FFC300" },
            { name: "돈까스", emoji: "🍱", radius: 70, score: 12000, color: "#C70039" },
            { name: "치킨", emoji: "🍗", radius: 95, score: 20000, color: "#FF8D1A" },
            { name: "피자", emoji: "🍕", radius: 125, score: 30000, color: "#F39C12", bonus: 0 },
            { name: "족발", emoji: "🍖", radius: 160, score: 45000, color: "#5D4037", bonus: 15 }
        ];

        const BAEMIN_PHRASES = [
            "배달의 민족 주문~",
            "배민 원~",
            "우리가 어떤 민족입니까",
            "살 안쪄요, 맛있으면",
            "오늘 먹을 음식을 내일로 미루지 말자"
        ];

        let foods = [];
        let currentFood = null;
        let nextFoodIndex = 0;
        let score = 0;
        let timeLeft = 20.0;
        let isGameOver = false;
        let isGameStarted = false;
        let lastTime = 0;
        let canDrop = true;
        let audioCtx = null;

        function startGame() {
            initAudio();
            startScreen.style.display = 'none';
            headerUI.style.opacity = '1';
            nextFoodUI.style.opacity = '1';
            isGameStarted = true;
            initGame();
        }

        function initGame() {
            resize();
            foods = [];
            score = 0;
            timeLeft = 20.0;
            isGameOver = false;
            nextFoodIndex = Math.floor(Math.random() * 3);
            spawnNextFood();
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function resize() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = container.clientWidth * dpr;
            canvas.height = container.clientHeight * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playDingSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function spawnNextFood() {
            const index = nextFoodIndex;
            nextFoodIndex = Math.floor(Math.random() * 3);
            nextPreviewEl.innerText = FOOD_DATA[nextFoodIndex].emoji;
            currentFood = {
                ...FOOD_DATA[index],
                level: index,
                x: container.clientWidth / 2,
                y: 70,
                vx: 0,
                vy: 0,
                isDropped: false
            };
        }

        function gameLoop(timestamp) {
            if (!isGameStarted || isGameOver) return;
            const deltaTime = (timestamp - lastTime) / 1000;
            lastTime = timestamp;
            if (deltaTime < 0.1) update(deltaTime);
            draw();
            requestAnimationFrame(gameLoop);
        }

        function update(dt) {
            timeLeft -= dt;
            if (timeLeft <= 0) {
                timeLeft = 0;
                endGame();
            }
            timerEl.innerText = timeLeft.toFixed(1) + 's';

            for (let i = 0; i < foods.length; i++) {
                const f = foods[i];
                f.vy += 35;
                f.x += f.vx * dt;
                f.y += f.vy * dt;

                // 시간 경과 트래킹 (판정 유예용)
                if (!f.activeTime) f.activeTime = 0;
                f.activeTime += dt;

                if (f.y + f.radius > container.clientHeight) {
                    f.y = container.clientHeight - f.radius;
                    f.vy *= -0.5;
                    f.vx *= 0.98;
                }
                if (f.x - f.radius < 0) { f.x = f.radius; f.vx *= -0.6; }
                if (f.x + f.radius > container.clientWidth) { f.x = container.clientWidth - f.radius; f.vx *= -0.6; }
            }

            for (let iter = 0; iter < 5; iter++) {
                for (let i = 0; i < foods.length; i++) {
                    const f = foods[i];
                    for (let j = i + 1; j < foods.length; j++) {
                        const o = foods[j];
                        const dx = o.x - f.x, dy = o.y - f.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const minDist = f.radius + o.radius;

                        if (dist < minDist) {
                            if (iter === 0 && f.level === o.level) {
                                mergeFoods(i, j);
                                return;
                            }
                            const nx = dx / dist, ny = dy / dist;
                            const overlap = minDist - dist;
                            f.x -= nx * overlap * 0.5;
                            f.y -= ny * overlap * 0.5;
                            o.x += nx * overlap * 0.5;
                            o.y += ny * overlap * 0.5;

                            const rvx = o.vx - f.vx, rvy = o.vy - f.vy;
                            const velAlongNormal = rvx * nx + rvy * ny;
                            if (velAlongNormal < 0) {
                                const e = 0.6;
                                let jImpulse = -(1 + e) * velAlongNormal;
                                jImpulse /= 2;
                                const impulseX = jImpulse * nx, impulseY = jImpulse * ny;
                                f.vx -= impulseX; f.vy -= impulseY;
                                o.vx += impulseX; o.vy += impulseY;
                            }
                        }
                    }
                }
            }

            // 게임 오버 판정 로직 수정 (고정된 시간 기반 판정)
            for (const f of foods) {
                f.vx *= 0.995;
                f.vy *= 0.995;

                // 위험선(120px) 체크. 
                // 투하 후 1.5초 이상 경과 + 위쪽 끝이 120px보다 높은 경우 + 수직 속도가 안정화된 경우
                if (f.isDropped && f.activeTime > 1.5) {
                    if (f.y - f.radius < 120 && Math.abs(f.vy) < 20) {
                        endGame();
                        return;
                    }
                }
            }
        }

        function mergeFoods(idx1, idx2) {
            const f1 = foods[idx1], f2 = foods[idx2];
            const nextLv = f1.level + 1;
            const nX = (f1.x + f2.x) / 2, nY = (f1.y + f2.y) / 2;

            score += FOOD_DATA[nextLv] ? FOOD_DATA[nextLv].score : 50000;
            scoreEl.innerText = score.toLocaleString() + '원';
            showPopText();

            if (nextLv < FOOD_DATA.length) {
                const bonus = FOOD_DATA[nextLv].bonus || 0;
                if (bonus > 0) {
                    timeLeft += bonus;
                    foods.splice(Math.max(idx1, idx2), 1);
                    foods.splice(Math.min(idx1, idx2), 1);
                    return;
                }
                const newFood = {
                    ...FOOD_DATA[nextLv],
                    level: nextLv,
                    x: nX,
                    y: nY,
                    vx: 0,
                    vy: 0,
                    isDropped: true,
                    activeTime: 1.0 // 병합된 음식은 즉시 판정 유예 시간을 일부 가짐
                };
                foods.splice(Math.max(idx1, idx2), 1);
                foods.splice(Math.min(idx1, idx2), 1);
                foods.push(newFood);
            }
        }

        function showPopText() {
            playDingSound();
            const prev = container.querySelector('.pop-text');
            if (prev) prev.remove();
            const text = document.createElement('div');
            text.className = 'pop-text';
            text.innerText = BAEMIN_PHRASES[Math.floor(Math.random() * BAEMIN_PHRASES.length)];
            container.appendChild(text);
            setTimeout(() => text.remove(), 2000);
        }

        function draw() {
            ctx.clearRect(0, 0, container.clientWidth, container.clientHeight);
            if (currentFood && !isGameOver) {
                ctx.beginPath();
                ctx.setLineDash([5, 5]);
                ctx.moveTo(currentFood.x, currentFood.y);
                ctx.lineTo(currentFood.x, container.clientHeight);
                ctx.strokeStyle = "#eee";
                ctx.stroke();
                ctx.setLineDash([]);
            }
            foods.forEach(f => {
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
                ctx.fillStyle = f.color;
                ctx.fill();
                ctx.strokeStyle = "rgba(0,0,0,0.1)";
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.font = `${f.radius}px Arial`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(f.emoji, f.x, f.y + 2);
            });
            if (currentFood) {
                ctx.beginPath();
                ctx.arc(currentFood.x, currentFood.y, currentFood.radius, 0, Math.PI * 2);
                ctx.fillStyle = currentFood.color;
                ctx.fill();
                ctx.font = `${currentFood.radius}px Arial`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(currentFood.emoji, currentFood.x, currentFood.y + 2);
            }
        }

        const handleInput = (e) => {
            if (!currentFood || isGameOver || !isGameStarted) return;
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const x = clientX - rect.left;
            const minX = currentFood.radius, maxX = container.clientWidth - currentFood.radius;
            currentFood.x = Math.max(minX, Math.min(maxX, x));
        };

        container.addEventListener('mousemove', handleInput);
        container.addEventListener('touchmove', handleInput, { passive: false });

        const triggerDrop = () => {
            if (!isGameStarted || !currentFood || !canDrop || isGameOver) return;
            canDrop = false;
            currentFood.isDropped = true;
            currentFood.activeTime = 0; // 드롭 시점부터 카운트
            foods.push(currentFood);
            currentFood = null;
            setTimeout(() => { if (!isGameOver) { spawnNextFood(); canDrop = true; } }, 600);
        };

        container.addEventListener('mousedown', triggerDrop);
        container.addEventListener('touchstart', (e) => { e.preventDefault(); triggerDrop(); }, { passive: false });

        function endGame() {
            if (isGameOver) return;
            isGameOver = true;
            document.getElementById('receipt-items').innerHTML = `
            <div class="receipt-row"><span>기본 배달료</span><span>3,000원</span></div>
            <div class="receipt-row"><span>메뉴 주문 합계</span><span>${score.toLocaleString()}원</span></div>
        `;
            finalScoreEl.innerText = (score + 3000).toLocaleString() + '원';
            resultModal.style.display = 'flex';
        }

        function resetGame() {
            resultModal.style.display = 'none';
            initGame();
        }

        window.addEventListener('resize', resize);
        window.onload = () => {
            // resize call removed from here, initGame calls it
        };
    </script>
</body>

</html>
