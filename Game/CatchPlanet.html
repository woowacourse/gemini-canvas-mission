<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>행성을 잡아라!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Pretendard:wght@600;800&display=swap');

      :root {
        --primary-bg: #ffebee;
        --card-bg: #ffffff;
        --accent-color: #ff7043;
        --success-color: #4caf50;
        --point-color: #ffd54f;
      }

      body {
        font-family: 'Pretendard', sans-serif;
        background-color: #fff9c4;
        touch-action: none;
        overflow: hidden;
      }

      .font-gaegu {
        font-family: 'Gaegu', cursive;
      }

      .cloud-bg {
        background: linear-gradient(180deg, #81d4fa 0%, #e1f5fe 100%);
        position: relative;
      }

      .cloud {
        position: absolute;
        background: white;
        border-radius: 50px;
        opacity: 0.8;
        animation: move-clouds linear infinite;
      }

      @keyframes move-clouds {
        from {
          transform: translateX(-150px);
        }
        to {
          transform: translateX(500px);
        }
      }

      .cookie-card {
        border: 6px solid #5d4037;
        border-radius: 40px;
        box-shadow: 0 10px 0 #d7ccc8;
      }

      .cookie-btn {
        border: 4px solid #5d4037;
        border-radius: 25px;
        box-shadow: 0 6px 0 #5d4037;
        transition: all 0.1s;
      }

      .cookie-btn:active {
        transform: translateY(4px);
        box-shadow: 0 2px 0 #5d4037;
      }

      .jelly {
        animation: jelly-bounce 0.8s infinite alternate;
      }

      @keyframes jelly-bounce {
        0% {
          transform: scale(1, 1);
        }
        100% {
          transform: scale(1.1, 0.9);
        }
      }

      .planet-spin {
        animation: planet-roll 4s linear infinite;
      }

      @keyframes planet-roll {
        from {
          transform: translateX(-50%) rotate(0deg);
        }
        to {
          transform: translateX(-50%) rotate(360deg);
        }
      }

      .target-line {
        background: rgba(255, 255, 255, 0.3);
        border: 3px dashed #5d4037;
      }
    </style>
  </head>
  <body class="flex items-center justify-center min-h-screen">
    <div
      id="app-container"
      class="relative w-full max-w-md h-[100dvh] sm:h-[750px] sm:rounded-[50px] overflow-hidden cloud-bg shadow-2xl border-[8px] border-[#5D4037]"
    >
      <!-- 구름 요소들 -->
      <div
        class="cloud w-20 h-8 top-10 left-5"
        style="animation-duration: 20s"
      ></div>
      <div
        class="cloud w-32 h-12 top-40 left-20"
        style="animation-duration: 15s"
      ></div>
      <div
        class="cloud w-24 h-10 top-80 left-10"
        style="animation-duration: 25s"
      ></div>

      <!-- 1. 닉네임 설정 모달 -->
      <div
        id="nickname-modal"
        class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-white/40 backdrop-blur-md p-6"
      >
        <div class="bg-white cookie-card p-8 w-full max-w-sm text-center">
          <div class="text-7xl mb-4 jelly">🪐</div>
          <h1 class="text-4xl font-gaegu font-bold text-[#5D4037] mb-2">
            행성을 잡아라!
          </h1>
          <!-- 요청하신 대로 안내 문구 수정 -->
          <p class="text-[#8D6E63] font-bold mb-6">
            귀여운 행성들이 선에 닿을 때<br />콕! 눌러서 잡아주세요 ☺️
          </p>

          <input
            type="text"
            id="nickname-input"
            placeholder="이름을 입력해줘!"
            maxlength="8"
            class="w-full bg-[#F5F5F5] border-4 border-[#D7CCC8] rounded-2xl px-4 py-3 text-center text-[#5D4037] font-bold focus:outline-none focus:border-[#FF7043] mb-6 transition-all"
          />

          <button
            id="start-btn"
            class="w-full bg-[#FF7043] cookie-btn text-white text-2xl font-gaegu font-bold py-3"
          >
            모험 시작!
          </button>
        </div>
      </div>

      <!-- 2. 게임 화면 -->
      <div
        id="game-screen"
        class="absolute inset-0 z-10 flex flex-col pointer-events-none hidden"
      >
        <div class="flex justify-between items-center p-6 z-20">
          <div
            class="bg-white border-4 border-[#5D4037] px-4 py-1 rounded-full shadow-md"
          >
            <span class="text-[#FF7043] font-bold" id="player-name">쿠키</span>
          </div>
          <div
            class="bg-white border-4 border-[#5D4037] px-4 py-1 rounded-full shadow-md"
          >
            <span id="attempt-label" class="text-[#5D4037] font-bold"
              >남은 기회 :
              <span id="attempt-counter" class="text-[#FF7043]">4회</span></span
            >
          </div>
        </div>

        <div
          id="target-zone"
          class="absolute top-[75%] w-full h-6 target-line z-20 flex items-center justify-center"
        >
          <div
            class="w-20 h-8 bg-[#FFD54F]/60 rounded-full border-4 border-white animate-pulse"
          ></div>
        </div>

        <div
          id="planet"
          class="absolute left-1/2 -translate-x-1/2 text-[70px] length-none z-30 planet-spin"
          style="top: -100px; filter: drop-shadow(0 5px 0 rgba(0, 0, 0, 0.1))"
        >
          🌍
        </div>

        <div
          id="hit-area"
          class="absolute inset-0 z-40 cursor-pointer pointer-events-auto flex items-end justify-center pb-12"
        >
          <button
            class="bg-[#4CAF50] cookie-btn text-white text-2xl font-gaegu font-bold py-4 px-10 shadow-lg"
          >
            타이밍에 맞춰 터치!👋
          </button>
        </div>
      </div>

      <!-- 3. 결과 모달 -->
      <div
        id="result-modal"
        class="absolute inset-0 z-50 flex items-center justify-center bg-black/20 backdrop-blur-sm p-6 hidden"
      >
        <div
          class="bg-white cookie-card p-8 w-full max-w-sm text-center transform scale-100 transition-transform"
        >
          <div id="result-emoji" class="text-7xl mb-4 jelly">⭐</div>

          <div
            id="result-text-1"
            class="text-3xl font-gaegu font-bold text-[#5D4037] mb-2"
          >
            0.00% 정확해!
          </div>
          <div id="result-text-2" class="text-xl text-[#8D6E63] font-bold mb-8">
            다시 도전해보자😄
          </div>

          <button
            id="next-attempt-btn"
            class="w-full bg-[#4FC3F7] cookie-btn text-white text-2xl font-gaegu font-bold py-3"
          >
            다시 도전해보기 (2/4)
          </button>
        </div>
      </div>

      <!-- 4. 랭킹 모달 -->
      <div
        id="leaderboard-modal"
        class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-[#E1F5FE] p-6 hidden"
      >
        <div class="w-full max-w-sm flex flex-col h-full py-6">
          <div class="text-center mb-6">
            <div class="text-6xl mb-2 jelly">🏆</div>
            <h2 class="text-4xl font-gaegu font-bold text-[#5D4037]">
              명예의 전당
            </h2>
            <p class="text-[#8D6E63] font-bold mt-2">
              나의 최고 점수:
              <span id="final-score" class="text-[#FF7043]">0.00%</span>
            </p>
          </div>

          <div
            class="bg-white border-4 border-[#5D4037] rounded-[30px] shadow-inner overflow-hidden flex-1 max-h-[380px]"
          >
            <ul
              id="ranking-list"
              class="divide-y-2 divide-[#F5F5F5] p-4 h-full overflow-y-auto"
            ></ul>
          </div>

          <div class="flex gap-4 mt-6">
            <button
              id="restart-btn"
              class="flex-1 bg-[#FFB300] cookie-btn text-white text-xl font-gaegu font-bold py-4"
            >
              한 판 더!
            </button>
            <button
              id="reset-all-btn"
              class="flex-1 bg-[#BDBDBD] cookie-btn text-white text-xl font-gaegu font-bold py-4"
            >
              처음으로
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const state = {
        nickname: '',
        attempt: 0,
        maxAttempts: 4,
        scores: [],
        isPlaying: false,
        planetY: -100,
        speed: 0,
        animationFrame: null,
        rankings: [],
      };

      const planets = ['🌍', '🌕', '🪐', '🌑', '⭐', '☀️', '☄️'];

      const els = {
        nicknameModal: document.getElementById('nickname-modal'),
        nicknameInput: document.getElementById('nickname-input'),
        startBtn: document.getElementById('start-btn'),
        gameScreen: document.getElementById('game-screen'),
        playerName: document.getElementById('player-name'),
        attemptCounter: document.getElementById('attempt-counter'),
        planet: document.getElementById('planet'),
        hitArea: document.getElementById('hit-area'),
        container: document.getElementById('app-container'),
        resultModal: document.getElementById('result-modal'),
        resultEmoji: document.getElementById('result-emoji'),
        resultText1: document.getElementById('result-text-1'),
        resultText2: document.getElementById('result-text-2'),
        nextBtn: document.getElementById('next-attempt-btn'),
        leaderboardModal: document.getElementById('leaderboard-modal'),
        finalScore: document.getElementById('final-score'),
        rankingList: document.getElementById('ranking-list'),
        restartBtn: document.getElementById('restart-btn'),
        resetAllBtn: document.getElementById('reset-all-btn'),
      };

      function init() {
        els.startBtn.addEventListener('click', startGame);
        els.hitArea.addEventListener('mousedown', handleHit);
        els.hitArea.addEventListener('touchstart', (e) => {
          e.preventDefault();
          handleHit();
        });
        els.nextBtn.addEventListener('click', prepareNextAttempt);
        els.restartBtn.addEventListener('click', playAgain);
        els.resetAllBtn.addEventListener('click', resetGame);

        els.nicknameInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') startGame();
        });
      }

      function startGame() {
        const nick = els.nicknameInput.value.trim();
        if (!nick) return;
        state.nickname = nick;
        state.attempt = 0;
        state.scores = [];
        els.playerName.textContent = state.nickname;
        els.nicknameModal.classList.add('hidden');
        els.gameScreen.classList.remove('hidden');
        prepareNextAttempt();
      }

      function prepareNextAttempt() {
        els.resultModal.classList.add('hidden');
        state.attempt++;
        if (state.attempt > state.maxAttempts) {
          showLeaderboard();
          return;
        }

        const remaining = state.maxAttempts - state.attempt + 1;
        els.attemptCounter.textContent = `${remaining}회`;

        els.planet.textContent =
          planets[Math.floor(Math.random() * planets.length)];
        state.planetY = -100;
        els.planet.style.top = state.planetY + 'px';
        state.speed = Math.random() * 3 + 6;
        setTimeout(() => {
          state.isPlaying = true;
          dropPlanet();
        }, 600);
      }

      function dropPlanet() {
        if (!state.isPlaying) return;
        state.planetY += state.speed;
        els.planet.style.top = state.planetY + 'px';
        const containerHeight = els.container.clientHeight;
        if (state.planetY > containerHeight + 50) {
          processResult(true);
          return;
        }
        state.animationFrame = requestAnimationFrame(dropPlanet);
      }

      function handleHit() {
        if (!state.isPlaying) return;
        processResult(false);
      }

      function processResult(isMissed) {
        state.isPlaying = false;
        cancelAnimationFrame(state.animationFrame);
        let accuracy = 0;
        if (!isMissed) {
          const containerHeight = els.container.clientHeight;
          const targetY = containerHeight * 0.75;
          const planetRect = els.planet.getBoundingClientRect();
          const containerRect = els.container.getBoundingClientRect();
          const currentY =
            planetRect.top - containerRect.top + planetRect.height / 2;

          const diff = Math.abs(currentY - targetY);
          const maxTolerance = containerHeight * 0.15;

          accuracy = Math.max(0, 100 - (diff / maxTolerance) * 100);
        }
        state.scores.push(accuracy);
        showResultModal(accuracy);
      }

      function showResultModal(accuracy) {
        let emoji = '🌑';
        let message = '다시 도전해보자😄';

        if (accuracy >= 95) {
          emoji = '👑';
          message = '완벽해! 우주 최고의 헌터야!';
        } else if (accuracy >= 80) {
          emoji = '🌟';
          message = '거의 잡을 뻔했어! 최고야!';
        } else if (accuracy >= 50) {
          emoji = '🌍';
          message = '앗 아쉬워! 조금만 더 노력해볼까?';
        }

        els.resultEmoji.textContent = emoji;
        els.resultText1.textContent = `${accuracy.toFixed(2)}% 정확해!`;
        els.resultText2.textContent = message;

        if (state.attempt >= state.maxAttempts) {
          els.nextBtn.textContent = '결과 확인!';
          els.nextBtn.classList.replace('bg-[#4FC3F7]', 'bg-[#FF7043]');
        } else {
          els.nextBtn.textContent = `다시 도전해보기 (${state.attempt + 1}/${state.maxAttempts})`;
          els.nextBtn.classList.replace('bg-[#FF7043]', 'bg-[#4FC3F7]');
        }
        els.resultModal.classList.remove('hidden');
      }

      function showLeaderboard() {
        els.gameScreen.classList.add('hidden');
        els.leaderboardModal.classList.remove('hidden');

        const highestScore = Math.max(...state.scores);
        const currentFinalScore = Number(highestScore.toFixed(2));
        els.finalScore.textContent = `${currentFinalScore}%`;

        state.rankings.forEach((r) => (r.isMe = false));

        const existingPlayerIndex = state.rankings.findIndex(
          (r) => r.name === state.nickname,
        );

        if (existingPlayerIndex !== -1) {
          if (currentFinalScore > state.rankings[existingPlayerIndex].score) {
            state.rankings[existingPlayerIndex].score = currentFinalScore;
          }
          state.rankings[existingPlayerIndex].isMe = true;
        } else {
          state.rankings.push({
            name: state.nickname,
            score: currentFinalScore,
            isMe: true,
          });
        }

        state.rankings.sort((a, b) => b.score - a.score);

        els.rankingList.innerHTML = '';

        if (state.rankings.length === 0) {
          els.rankingList.innerHTML =
            '<li class="text-center py-10 text-gray-400">아직 등록된 랭킹이 없어요!</li>';
        } else {
          state.rankings.slice(0, 10).forEach((rank, index) => {
            const li = document.createElement('li');
            li.className = `py-3 flex items-center justify-between font-bold transition-all ${rank.isMe ? 'bg-[#FFF9C4] rounded-2xl px-2 border-2 border-[#FFD54F] scale-105 mx-1' : 'px-2'}`;

            let medal = `<span class="w-8 text-[#8D6E63] text-center">${index + 1}</span>`;
            if (index === 0) medal = `🥇`;
            if (index === 1) medal = `🥈`;
            if (index === 2) medal = `🥉`;

            li.innerHTML = `
                        <div class="flex items-center gap-3">
                            <span class="text-xl w-8 text-center">${medal}</span>
                            <span class="${rank.isMe ? 'text-[#FF7043]' : 'text-[#5D4037]'}">${rank.name}</span>
                        </div>
                        <div class="text-[#4CAF50]">${rank.score.toFixed(2)}%</div>
                    `;
            els.rankingList.appendChild(li);
          });
        }
      }

      function playAgain() {
        state.attempt = 0;
        state.scores = [];
        els.leaderboardModal.classList.add('hidden');
        els.gameScreen.classList.remove('hidden');
        prepareNextAttempt();
      }

      function resetGame() {
        els.nicknameInput.value = '';
        state.attempt = 0;
        state.scores = [];
        els.leaderboardModal.classList.add('hidden');
        els.nicknameModal.classList.remove('hidden');
      }

      init();
    </script>
  </body>
</html>
