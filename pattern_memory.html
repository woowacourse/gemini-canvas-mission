<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pattern Memory Challenge</title>
    <style>
        :root {
            --bg: #0f172a;
            --tile-bg: #1e293b;
            --tile-active: #38bdf8;
            --tile-wrong: #ef4444;
            --tile-correct: #22c55e;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 왼쪽 상단 앱 로고 */
        .app-logo {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            z-index: 10;
            opacity: 0.8;
        }

        /* 헤더 섹션 */
        header {
            flex: 0 0 auto;
            padding: 25px 20px 15px;
            text-align: center;
        }

        .level-info {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--tile-active);
            margin-bottom: 5px;
        }

        .best-info {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* 메인 게임 영역 */
        main {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            min-height: 0;
        }

        #status-msg {
            margin-bottom: 15px;
            font-weight: 600;
            height: 1.5rem;
            text-align: center;
            color: var(--text-secondary);
        }

        /* 4x4 그리드 */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 8px;
            width: 90vw;
            height: 90vw;
            max-width: 400px;
            max-height: 400px;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        @media (min-aspect-ratio: 1/1) {
            .grid {
                width: 60vh;
                height: 60vh;
            }
        }

        .tile {
            background-color: var(--tile-bg);
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.1s, transform 0.1s, box-shadow 0.1s;
        }

        .tile.active {
            background-color: var(--tile-active);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
            transform: scale(0.94);
        }

        .tile.correct {
            background-color: var(--tile-correct);
            transform: scale(0.96);
        }

        .tile.wrong {
            background-color: var(--tile-wrong);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
        }

        /* 오버레이 */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 15, 28, 0.97);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
            backdrop-filter: blur(4px);
        }

        .modal {
            background: #1e293b;
            width: 100%;
            max-width: 340px;
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .modal h2 {
            font-size: 1.6rem;
            margin-bottom: 12px;
            font-weight: 800;
        }

        .modal p {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            color: white;
            transition: all 0.2s;
        }

        .btn:active { transform: scale(0.97); filter: brightness(0.9); }

        .btn-easy { background: #10b981; }
        .btn-normal { background: #3b82f6; }
        .btn-hard { background: #ef4444; }
        .btn-retry {
            background: var(--accent-gradient);
            margin-top: 20px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }

        .game-results {
            background: rgba(0, 0, 0, 0.25);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 15px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 1rem;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<!-- 왼쪽 상단 로고 -->
<div class="app-logo">Pattern Memory</div>

<header>
    <div class="level-info">Level <span id="cur-lvl">1</span></div>
    <div class="best-info">난이도 최고 기록: <span id="best-lvl">0</span></div>
</header>

<main>
    <div id="status-msg"></div>
    <div class="grid" id="grid"></div>
</main>

<!-- 초기 시작 화면 -->
<div id="start-screen" class="overlay">
    <div class="modal">
        <h2>게임 시작</h2>
        <p>반짝이는 패턴 순서를 기억하고<br>똑같이 클릭하세요!</p>
        <div class="btn-list">
            <button class="btn btn-easy" onclick="startGame('easy')">EASY 모드</button>
            <button class="btn btn-normal" onclick="startGame('normal')">NORMAL 모드</button>
            <button class="btn btn-hard" onclick="startGame('hard')">HARD 모드</button>
        </div>
    </div>
</div>

<!-- 게임 오버 화면 -->
<div id="over-screen" class="overlay hidden">
    <div class="modal">
        <h2 style="color: var(--tile-wrong); font-size: 2rem; margin-bottom: 20px;">Game Over</h2>
        <div class="game-results">
            <div class="result-row">
                <span style="color: var(--text-secondary);">최고 레벨</span>
                <span id="res-best" style="font-weight: 800;">0</span>
            </div>
            <div class="result-row">
                <span style="color: var(--text-secondary);">현재 레벨</span>
                <span id="res-cur" style="color: var(--tile-active); font-weight: 800;">0</span>
            </div>
        </div>
        <button class="btn btn-retry" onclick="resetToMenu()">다시 도전</button>
    </div>
</div>

<script>
    const gridEl = document.getElementById('grid');
    const statusEl = document.getElementById('status-msg');
    const curLvlEl = document.getElementById('cur-lvl');
    const bestLvlEl = document.getElementById('best-lvl');
    const startScreen = document.getElementById('start-screen');
    const overScreen = document.getElementById('over-screen');

    const configs = {
        easy: { show: 700, gap: 300 },
        normal: { show: 450, gap: 200 },
        hard: { show: 250, gap: 100 }
    };

    let game = {
        level: 1,
        difficulty: 'normal',
        pattern: [],
        userStep: 0,
        isLocked: true,
        highScores: JSON.parse(localStorage.getItem('pattern_memory_v2')) || { easy: 0, normal: 0, hard: 0 }
    };

    // 타일 생성 (16개)
    for (let i = 0; i < 16; i++) {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.dataset.idx = i;
        tile.onclick = () => handleTileClick(i);
        gridEl.appendChild(tile);
    }

    function startGame(diff) {
        game.difficulty = diff;
        game.level = 1;
        game.isLocked = true;

        startScreen.classList.add('hidden');
        overScreen.classList.add('hidden');

        updateHeader();
        prepareLevel();
    }

    function updateHeader() {
        curLvlEl.textContent = game.level;
        bestLvlEl.textContent = game.highScores[game.difficulty];
    }

    function prepareLevel() {
        game.userStep = 0;
        // 완전히 새로운 무작위 패턴 생성
        game.pattern = [];
        for (let i = 0; i < game.level; i++) {
            game.pattern.push(Math.floor(Math.random() * 16));
        }
        playSequence();
    }

    async function playSequence() {
        game.isLocked = true;
        statusEl.textContent = "패턴을 기억하세요...";

        await sleep(1000);

        const conf = configs[game.difficulty];
        for (const idx of game.pattern) {
            const tile = gridEl.children[idx];
            tile.classList.add('active');
            await sleep(conf.show);
            tile.classList.remove('active');
            await sleep(conf.gap);
        }

        statusEl.textContent = "똑같이 클릭하세요!";
        game.isLocked = false;
    }

    function handleTileClick(idx) {
        if (game.isLocked) return;

        const tile = gridEl.children[idx];

        if (idx === game.pattern[game.userStep]) {
            // 성공 클릭
            tile.classList.add('correct');
            setTimeout(() => tile.classList.remove('correct'), 150);
            game.userStep++;

            if (game.userStep === game.pattern.length) {
                game.isLocked = true;
                statusEl.textContent = "성공!";
                game.level++;

                if (game.level > game.highScores[game.difficulty]) {
                    game.highScores[game.difficulty] = game.level;
                    localStorage.setItem('pattern_memory_v2', JSON.stringify(game.highScores));
                }

                setTimeout(() => {
                    updateHeader();
                    prepareLevel();
                }, 1000);
            }
        } else {
            // 오답
            tile.classList.add('wrong');
            game.isLocked = true;
            statusEl.textContent = "틀렸습니다!";
            setTimeout(showGameOver, 600);
        }
    }

    function showGameOver() {
        Array.from(gridEl.children).forEach(t => t.classList.remove('wrong', 'active', 'correct'));
        document.getElementById('res-best').textContent = game.highScores[game.difficulty];
        document.getElementById('res-cur').textContent = game.level;
        overScreen.classList.remove('hidden');
    }

    function resetToMenu() {
        overScreen.classList.add('hidden');
        startScreen.classList.remove('hidden');
        statusEl.textContent = "";
    }

    function sleep(ms) {
        return new Promise(r => setTimeout(r, ms));
    }

    updateHeader();
</script>
</body>
</html>
