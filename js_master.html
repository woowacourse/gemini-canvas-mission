<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Pretendard:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .code-block {
            font-family: 'Fira Code', monospace;
            background-color: #1e293b;
        }
        .correct { border-color: #22c55e !important; background-color: rgba(34, 197, 94, 0.1); }
        .wrong { border-color: #ef4444 !important; background-color: rgba(239, 68, 68, 0.1); }
        .transition-all { transition: all 0.3s ease; }

        /* 로딩 애니메이션 */
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #eab308;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="app" class="w-full max-w-2xl bg-slate-800 rounded-2xl shadow-2xl p-6 md:p-10 border border-slate-700">
        <!-- 메인 화면 -->
        <div id="start-screen" class="text-center">
            <h1 class="text-4xl font-extrabold mb-4 text-yellow-400">JS Master</h1>
            <p class="text-slate-400 mb-8">AI가 실시간으로 생성하는 까다로운 자바스크립트 문제를 정복하세요!</p>
            
            <!-- 퀴즈 설정 영역 추가 -->
            <div class="bg-slate-700/50 p-6 rounded-xl mb-8 text-left space-y-6">
                <div>
                    <label class="block text-slate-300 font-bold mb-3">🔥 난이도 선택</label>
                    <div class="grid grid-cols-3 gap-3">
                        <label class="cursor-pointer">
                            <input type="radio" name="difficulty" value="초급" class="peer sr-only">
                            <div class="text-center p-3 rounded-lg border border-slate-600 peer-checked:border-yellow-400 peer-checked:bg-yellow-400/10 peer-checked:text-yellow-400 transition-all text-sm font-semibold text-slate-400 hover:bg-slate-600">초급</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="difficulty" value="중급" class="peer sr-only" checked>
                            <div class="text-center p-3 rounded-lg border border-slate-600 peer-checked:border-yellow-400 peer-checked:bg-yellow-400/10 peer-checked:text-yellow-400 transition-all text-sm font-semibold text-slate-400 hover:bg-slate-600">중급</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="difficulty" value="고급" class="peer sr-only">
                            <div class="text-center p-3 rounded-lg border border-slate-600 peer-checked:border-yellow-400 peer-checked:bg-yellow-400/10 peer-checked:text-yellow-400 transition-all text-sm font-semibold text-slate-400 hover:bg-slate-600">고급</div>
                        </label>
                    </div>
                </div>
                <div>
                    <label class="block text-slate-300 font-bold mb-3">📝 문제 개수</label>
                    <div class="grid grid-cols-3 gap-3">
                        <label class="cursor-pointer">
                            <input type="radio" name="qCount" value="3" class="peer sr-only">
                            <div class="text-center p-3 rounded-lg border border-slate-600 peer-checked:border-yellow-400 peer-checked:bg-yellow-400/10 peer-checked:text-yellow-400 transition-all text-sm font-semibold text-slate-400 hover:bg-slate-600">3문제</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="qCount" value="5" class="peer sr-only" checked>
                            <div class="text-center p-3 rounded-lg border border-slate-600 peer-checked:border-yellow-400 peer-checked:bg-yellow-400/10 peer-checked:text-yellow-400 transition-all text-sm font-semibold text-slate-400 hover:bg-slate-600">5문제</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="qCount" value="10" class="peer sr-only">
                            <div class="text-center p-3 rounded-lg border border-slate-600 peer-checked:border-yellow-400 peer-checked:bg-yellow-400/10 peer-checked:text-yellow-400 transition-all text-sm font-semibold text-slate-400 hover:bg-slate-600">10문제</div>
                        </label>
                    </div>
                </div>
            </div>

            <button onclick="quizManager.generateAndStart()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold py-4 px-10 rounded-xl transition-all transform hover:scale-105">
                AI 퀴즈 생성 및 시작
            </button>
        </div>

        <!-- 로딩 화면 -->
        <div id="loading-screen" class="hidden text-center py-10">
            <div class="flex justify-center mb-6">
                <div class="loader"></div>
            </div>
            <h2 class="text-2xl font-bold mb-2">AI가 문제를 출제 중입니다...</h2>
            <p class="text-slate-400">자바스크립트의 깊은 곳을 뒤지고 있습니다.</p>
        </div>

        <!-- 퀴즈 진행 화면 -->
        <div id="quiz-screen" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <span id="progress-text" class="text-sm font-semibold text-slate-400">문제 1 / 5</span>
                <div class="w-32 h-2 bg-slate-700 rounded-full overflow-hidden">
                    <div id="progress-bar" class="h-full bg-yellow-500 transition-all" style="width: 0%"></div>
                </div>
            </div>
            
            <div id="question-container">
                <h2 id="question-title" class="text-xl font-bold mb-4 leading-relaxed"></h2>
                <pre class="code-block p-4 rounded-lg mb-6 overflow-x-auto text-sm border border-slate-600"><code id="question-code" class="text-blue-300"></code></pre>
                
                <!-- 힌트 영역 -->
                <div class="mb-4 text-right">
                    <button id="hint-btn" class="text-sm text-yellow-400 hover:text-yellow-300 font-semibold transition-all">💡 힌트 보기</button>
                </div>
                <div id="hint-box" class="hidden mb-6 p-4 bg-slate-700/50 rounded-lg border border-slate-600 text-sm text-slate-300 shadow-inner">
                    <p id="hint-text"></p>
                </div>

                <div id="options-grid" class="grid grid-cols-1 gap-3">
                    <!-- 옵션들 -->
                </div>
            </div>

            <div id="explanation-box" class="hidden mt-6 p-4 rounded-lg border-l-4">
                <p id="explanation-text" class="text-sm leading-relaxed"></p>
                <button id="next-btn" class="mt-4 w-full bg-slate-100 text-slate-900 font-bold py-2 rounded-lg hover:bg-white transition-all">다음 문제</button>
            </div>
        </div>

        <!-- 결과 화면 -->
        <div id="result-screen" class="hidden text-center">
            <h2 class="text-3xl font-extrabold mb-2">결과 리포트</h2>
            <div id="score-circle" class="text-6xl font-black text-yellow-400 my-8">0/5</div>
            <p id="result-comment" class="text-slate-400 mb-8"></p>
            
            <div class="space-y-3">
                <button onclick="quizManager.showScreen('start-screen')" class="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold py-3 rounded-xl">새로운 퀴즈 설정하기</button>
                <button id="review-btn" onclick="quizManager.startReview()" class="hidden w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl border border-slate-500">틀린 문제 복습하기</button>
            </div>
        </div>
    </div>

    <script>
        const apiKey = ""; // API Key는 환경에 의해 주입됩니다.

        const quizManager = {
            currentQuestions: [],
            currentIndex: 0,
            score: 0,
            wrongQuestions: [],
            isReviewMode: false,

            // AI에게 문제 생성을 요청하는 함수
            async fetchAIQuestions(difficulty, count) {
                // 난이도별 가이드라인 세분화
                let diffGuide = "";
                if (difficulty === "초급") {
                    diffGuide = "기본적인 변수 선언, 데이터 타입, 간단한 연산자, 조건문 등 입문자가 헷갈리기 쉬운 기초적인 개념";
                } else if (difficulty === "중급") {
                    diffGuide = "호이스팅, 클로저, this 바인딩, 배열 고차 함수(map, filter 등), 얕은 복사와 깊은 복사 등 실무에서 자주 마주치는 헷갈리는 개념";
                } else {
                    diffGuide = "이벤트 루프, 마이크로태스크 큐, 프로토타입 체인, 심화 비동기(Promise, async/await 동작 원리), 메모리 관리 등 매우 까다롭고 깊이 있는 개념";
                }

                const systemPrompt = `
                    너는 숙련된 자바스크립트 시니어 개발자이자 교육자야. 
                    학습자가 혼동하기 쉬운 자바스크립트 개념에 관한 퀴즈를 정확히 ${count}문제 생성해줘.
                    출제 난이도는 '${difficulty}' 수준이며, 집중해야 할 주제는 다음과 같아: [${diffGuide}]
                    
                    각 문제는 아래의 JSON 스키마를 준수해야 해.
                    
                    스키마:
                    {
                        "questions": [
                            {
                                "q": "질문 텍스트 (한국어)",
                                "code": "퀴즈와 관련된 자바스크립트 코드 스니펫",
                                "options": ["보기1", "보기2", "보기3", "보기4"],
                                "answer": 정답 인덱스 (0-3),
                                "exp": "정답에 대한 상세한 설명 (한국어)",
                                "hint": "문제 해결을 위한 짧은 힌트 (한국어)"
                            }
                        ]
                    }
                    
                    반드시 유효한 JSON 포맷으로만 응답해.
                `;

                const userQuery = `자바스크립트 ${difficulty} 난이도에 해당하는 퀴즈를 ${count}문제 출제해줘.`;

                const fetchWithRetry = async (retries = 5, delay = 1000) => {
                    try {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: userQuery }] }],
                                systemInstruction: { parts: [{ text: systemPrompt }] },
                                generationConfig: {
                                    responseMimeType: "application/json",
                                    responseSchema: {
                                        type: "OBJECT",
                                        properties: {
                                            questions: {
                                                type: "ARRAY",
                                                items: {
                                                    type: "OBJECT",
                                                    properties: {
                                                        q: { type: "STRING" },
                                                        code: { type: "STRING" },
                                                        options: { type: "ARRAY", items: { type: "STRING" } },
                                                        answer: { type: "NUMBER" },
                                                        exp: { type: "STRING" },
                                                        hint: { type: "STRING" }
                                                    },
                                                    required: ["q", "code", "options", "answer", "exp", "hint"]
                                                }
                                            }
                                        },
                                        required: ["questions"]
                                    }
                                }
                            })
                        });

                        if (!response.ok) throw new Error("API 요청 실패");
                        const data = await response.json();
                        return JSON.parse(data.candidates[0].content.parts[0].text).questions;
                    } catch (error) {
                        if (retries > 0) {
                            await new Promise(res => setTimeout(res, delay));
                            return fetchWithRetry(retries - 1, delay * 2);
                        }
                        throw error;
                    }
                };

                return await fetchWithRetry();
            },

            async generateAndStart() {
                const selectedDifficulty = document.querySelector('input[name="difficulty"]:checked').value;
                const selectedCount = document.querySelector('input[name="qCount"]:checked').value;

                this.showScreen('loading-screen');
                try {
                    this.currentQuestions = await this.fetchAIQuestions(selectedDifficulty, selectedCount);
                    this.isReviewMode = false;
                    this.wrongQuestions = [];
                    this.initQuiz();
                } catch (error) {
                    console.error(error);
                    alert("문제를 가져오는 데 실패했습니다. 다시 시도해 주세요.");
                    this.showScreen('start-screen');
                }
            },

            startReview() {
                this.isReviewMode = true;
                this.currentQuestions = [...this.wrongQuestions];
                this.initQuiz();
            },

            initQuiz() {
                this.currentIndex = 0;
                this.score = 0;
                this.showScreen('quiz-screen');
                this.renderQuestion();
            },

            showScreen(screenId) {
                ['start-screen', 'loading-screen', 'quiz-screen', 'result-screen'].forEach(id => {
                    document.getElementById(id).classList.add('hidden');
                });
                document.getElementById(screenId).classList.remove('hidden');
            },

            renderQuestion() {
                const question = this.currentQuestions[this.currentIndex];
                const total = this.currentQuestions.length;
                
                document.getElementById('progress-text').innerText = `문제 ${this.currentIndex + 1} / ${total}`;
                document.getElementById('progress-bar').style.width = `${((this.currentIndex + 1) / total) * 100}%`;
                
                document.getElementById('question-title').innerText = question.q;
                document.getElementById('question-code').innerText = question.code;
                
                // 힌트 초기화 로직
                const hintBtn = document.getElementById('hint-btn');
                const hintBox = document.getElementById('hint-box');
                const hintText = document.getElementById('hint-text');
                
                if (question.hint) {
                    hintBox.classList.add('hidden');
                    hintBtn.classList.remove('hidden');
                    hintText.innerText = question.hint;
                    
                    hintBtn.onclick = () => {
                        hintBox.classList.remove('hidden');
                        hintBtn.classList.add('hidden');
                    };
                } else {
                    hintBtn.classList.add('hidden');
                    hintBox.classList.add('hidden');
                }
                
                const optionsGrid = document.getElementById('options-grid');
                optionsGrid.innerHTML = '';
                
                question.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = "w-full text-left p-4 rounded-xl border-2 border-slate-600 hover:border-yellow-500 transition-all bg-slate-700/50 flex justify-between items-center group";
                    btn.innerHTML = `<span>${opt}</span><span class="opacity-0 group-hover:opacity-100 text-xs text-yellow-500">선택</span>`;
                    btn.onclick = () => this.checkAnswer(idx, btn);
                    optionsGrid.appendChild(btn);
                });

                document.getElementById('explanation-box').classList.add('hidden');
            },

            checkAnswer(selectedIdx, btn) {
                const question = this.currentQuestions[this.currentIndex];
                const buttons = document.querySelectorAll('#options-grid button');
                
                buttons.forEach(b => b.disabled = true);

                const expBox = document.getElementById('explanation-box');
                const expText = document.getElementById('explanation-text');
                const nextBtn = document.getElementById('next-btn');
                
                expBox.classList.remove('hidden');

                if (selectedIdx === question.answer) {
                    btn.classList.add('correct');
                    expBox.className = "mt-6 p-4 rounded-lg border-l-4 bg-green-900/20 border-green-500 text-green-200";
                    expText.innerHTML = `<strong>정답입니다!</strong><br>${question.exp}`;
                    this.score++;
                } else {
                    btn.classList.add('wrong');
                    buttons[question.answer].classList.add('correct');
                    expBox.className = "mt-6 p-4 rounded-lg border-l-4 bg-red-900/20 border-red-500 text-red-200";
                    expText.innerHTML = `<strong>오답입니다.</strong> (정답: ${question.options[question.answer]})<br>${question.exp}`;
                    
                    if (!this.isReviewMode && !this.wrongQuestions.includes(question)) {
                        this.wrongQuestions.push(question);
                    }
                }

                nextBtn.onclick = () => {
                    this.currentIndex++;
                    if (this.currentIndex < this.currentQuestions.length) {
                        this.renderQuestion();
                    } else {
                        this.showResult();
                    }
                };
            },

            showResult() {
                this.showScreen('result-screen');
                
                const total = this.currentQuestions.length;
                const percent = Math.round((this.score / total) * 100);
                
                document.getElementById('score-circle').innerText = `${this.score} / ${total}`;
                
                let comment = "";
                if (percent === 100) comment = "와우! AI의 함정을 모두 피해갔군요! 완벽합니다. 💎";
                else if (percent >= 60) comment = "잘했습니다! AI가 낸 문제들도 충분히 풀 수 있는 수준이네요. 👍";
                else comment = "AI가 꽤 어려운 문제를 냈나 봐요. 복습을 통해 실력을 키워보세요! 📚";
                
                document.getElementById('result-comment').innerText = comment;

                const reviewBtn = document.getElementById('review-btn');
                if (this.wrongQuestions.length > 0 && !this.isReviewMode) {
                    reviewBtn.classList.remove('hidden');
                    reviewBtn.innerText = `틀린 문제 (${this.wrongQuestions.length}) 복습하기`;
                } else {
                    reviewBtn.classList.add('hidden');
                }
            }
        };
    </script>
</body>
</html>
