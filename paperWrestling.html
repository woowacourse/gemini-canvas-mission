<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학교 대항! 종이씨름 Pro</title>
  <style>
    :root {
        --desk-color: #d2a679;
        --paper-color: #ffffff;
        --line-color: #a0c4ff;
        --p1-color: #ff595e;
        --p2-color: #1982c4;
    }

    * {
        box-sizing: border-box;
        user-select: none;
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
        margin: 0;
        padding: 0;
        background-color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }

    /* 책상 배경 */
    #game-container {
        width: 90vw;
        max-width: 1000px;
        height: 75vh;
        background-color: var(--desk-color);
        border: 15px solid #8b5a2b;
        border-radius: 20px;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    /* 씨름 판 (공책 종이) */
    #ring {
        width: 80%;
        height: 70%;
        background-color: var(--paper-color);
        background-image: linear-gradient(var(--line-color) 1px, transparent 1px);
        background-size: 100% 30px;
        border-radius: 5px;
        position: relative;
        box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
        display: flex;
        align-items: center;
    }

    #ring::before {
        content: '';
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        width: 2px;
        background-color: rgba(255, 0, 0, 0.2);
        z-index: 1;
    }

    /* 선수들 */
    .player {
        width: 80px;
        height: 100px;
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10;
        transition: transform 0.1s ease-out, left 0.1s ease-out;
    }

    .paper-body {
        width: 60px;
        height: 80px;
        border: 3px solid #333;
        position: relative;
        transform: skewX(-5deg);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        font-weight: bold;
        box-shadow: 3px 3px 0 rgba(0,0,0,0.1);
    }

    #player1 .paper-body { background-color: var(--p1-color); border-radius: 5px 15px 5px 5px; }
    #player2 .paper-body { background-color: var(--p2-color); border-radius: 15px 5px 5px 5px; }

    .key-hint {
        position: absolute;
        top: -40px;
        background: #333;
        color: white;
        padding: 2px 10px;
        border-radius: 10px;
        font-size: 14px;
        white-space: nowrap;
    }

    /* UI 레이어 */
    #ui-layer {
        position: absolute;
        top: -60px;
        width: 100%;
        display: flex;
        justify-content: space-between;
        padding: 0 20px;
        pointer-events: none;
    }

    .score-box {
        background: rgba(255,255,255,0.9);
        padding: 10px 20px;
        border-radius: 10px;
        border: 3px solid #333;
        font-weight: bold;
        text-align: center;
        min-width: 120px;
    }

    .match-info {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #333;
        color: white;
        padding: 5px 20px;
        border-radius: 20px;
        font-weight: bold;
    }

    /* 오버레이 */
    #overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.85);
        z-index: 100;
        display: flex;
        flex-direction: column; justify-content: center; align-items: center;
        color: white; text-align: center;
        border-radius: 5px;
    }

    /* 중앙 카운트다운 수정 */
    #countdown {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 12rem; /* 크기 확대 */
        font-weight: 900;
        color: #fbc531;
        text-shadow: 10px 10px 0 #000;
        display: none;
        z-index: 150;
        pointer-events: none;
        text-align: center;
        width: 100%;
    }

    .mode-selector {
        display: flex;
        gap: 10px;
        margin: 20px 0;
    }

    .mode-btn {
        padding: 10px 20px;
        background: #444;
        border: 2px solid #666;
        color: white;
        cursor: pointer;
        border-radius: 5px;
        transition: all 0.2s;
    }

    .mode-btn.active {
        background: #fbc531;
        color: #333;
        border-color: #fff;
        transform: scale(1.1);
    }

    .btn {
        padding: 15px 40px;
        font-size: 24px;
        background: #4cd137;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        font-weight: bold;
        margin-top: 20px;
        box-shadow: 0 5px 0 #44bd32;
    }

    .btn:hover { transform: scale(1.05); }
    .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #44bd32; }

    /* 애니메이션 */
    @keyframes fallP1 {
        0% { transform: translate(0, 0) rotate(0); opacity: 1; }
        100% { transform: translate(-200px, 600px) rotate(-720deg); opacity: 0; }
    }

    @keyframes fallP2 {
        0% { transform: translate(0, 0) rotate(0); opacity: 1; }
        100% { transform: translate(200px, 600px) rotate(720deg); opacity: 0; }
    }

    .p1-fall { animation: fallP1 1s forwards cubic-bezier(0.55, 0.055, 0.675, 0.19); }
    .p2-fall { animation: fallP2 1s forwards cubic-bezier(0.55, 0.055, 0.675, 0.19); }

    @keyframes shake {
        0%, 100% { transform: translate(0, 0); }
        25% { transform: translate(-2px, 2px); }
        50% { transform: translate(2px, -2px); }
        75% { transform: translate(-2px, -2px); }
    }
    .shaking { animation: shake 0.1s infinite; }

    h1 { font-size: 3.5rem; margin: 10px 0; color: #fbc531; }
  </style>
</head>
<body>

<div id="game-container">
  <div id="ui-layer">
    <div class="score-box" style="border-color: var(--p1-color);">
      PLAYER 1<br><span id="p1-score" style="font-size: 1.5rem;">0</span>
    </div>
    <div class="score-box" style="border-color: var(--p2-color);">
      PLAYER 2<br><span id="p2-score" style="font-size: 1.5rem;">0</span>
    </div>
  </div>

  <div id="match-status" class="match-info">단판 승부</div>

  <div id="ring">
    <div id="player1" class="player">
      <div class="key-hint">'A' 연타!</div>
      <div class="paper-body">P1</div>
    </div>
    <div id="player2" class="player">
      <div class="key-hint">'L' 연타!</div>
      <div class="paper-body">P2</div>
    </div>
    <!-- 카운트다운은 게임 컨테이너 중앙에 오도록 배치 -->
    <div id="countdown">3</div>
  </div>

  <div id="overlay">
    <h1 id="msg-title">종이씨름 Pro</h1>
    <p id="msg-desc">경기 방식을 선택하세요</p>

    <div class="mode-selector">
      <button class="mode-btn active" onclick="setMode(1, this)">단판</button>
      <button class="mode-btn" onclick="setMode(2, this)">3판 2선승</button>
      <button class="mode-btn" onclick="setMode(3, this)">5판 3선승</button>
    </div>

    <button class="btn" id="start-btn" onclick="prepareGame()">대결 시작!</button>
  </div>
</div>

<script>
  const ring = document.getElementById('ring');
  const p1 = document.getElementById('player1');
  const p2 = document.getElementById('player2');
  const overlay = document.getElementById('overlay');
  const countdownEl = document.getElementById('countdown');
  const msgTitle = document.getElementById('msg-title');
  const msgDesc = document.getElementById('msg-desc');
  const matchStatus = document.getElementById('match-status');

  const p1ScoreEl = document.getElementById('p1-score');
  const p2ScoreEl = document.getElementById('p2-score');

  let p1Pos = 0;
  let gameState = 'ready';
  let p1Wins = 0;
  let p2Wins = 0;
  let requiredWins = 1;

  const PUSH_FORCE = 12;
  const PLAYER_GAP = 50;

  function setMode(wins, btn) {
      requiredWins = wins;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const texts = ["단판 승부", "3판 2선승제", "5판 3선승제"];
      matchStatus.innerText = texts[wins-1];
  }

  function initPosition() {
      p1Pos = 0;
      p1.className = 'player';
      p2.className = 'player';
      p1.style.opacity = '1';
      p2.style.opacity = '1';
      updateDisplay();
  }

  function updateDisplay() {
      const ringWidth = ring.offsetWidth;
      const centerX = ringWidth / 2;

      const p1TargetX = centerX + p1Pos - PLAYER_GAP;
      const p2TargetX = centerX + p1Pos + PLAYER_GAP;

      p1.style.left = `${p1TargetX - p1.offsetWidth/2}px`;
      p2.style.left = `${p2TargetX - p2.offsetWidth/2}px`;

      if (gameState === 'playing') {
          const limit = ringWidth / 2 - 20;
          if (p1Pos > limit) endGame(1);
          else if (p1Pos < -limit) endGame(2);
      }
  }

  function prepareGame() {
      overlay.style.display = 'none';
      initPosition();
      startCountdown();
  }

  function startCountdown() {
      gameState = 'countdown';
      countdownEl.style.display = 'block';
      let count = 3;
      countdownEl.innerText = count;

      const timer = setInterval(() => {
          count--;
          if (count > 0) {
              countdownEl.innerText = count;
          } else if (count === 0) {
              countdownEl.innerText = "시작!";
          } else {
              clearInterval(timer);
              countdownEl.style.display = 'none';
              gameState = 'playing';
          }
      }, 800);
  }

  function endGame(winner) {
      if (gameState !== 'playing') return;
      gameState = 'finished';

      if (winner === 1) {
          p2.classList.add('p2-fall');
          p1Wins++;
      } else {
          p1.classList.add('p1-fall');
          p2Wins++;
      }

      p1ScoreEl.innerText = p1Wins;
      p2ScoreEl.innerText = p2Wins;

      setTimeout(() => {
          checkMatchResult();
      }, 1200);
  }

  function checkMatchResult() {
      const isMatchOver = (p1Wins >= requiredWins || p2Wins >= requiredWins);

      if (isMatchOver) {
          overlay.style.display = 'flex';
          msgTitle.innerText = (p1Wins > p2Wins ? "PLAYER 1" : "PLAYER 2") + " 최종 승리!";
          msgTitle.style.color = p1Wins > p2Wins ? "var(--p1-color)" : "var(--p2-color)";
          msgDesc.innerText = `${p1Wins} : ${p2Wins}로 경기가 종료되었습니다.`;
          document.getElementById('start-btn').innerText = "새 게임 시작";
          p1Wins = 0;
          p2Wins = 0;
          p1ScoreEl.innerText = "0";
          p2ScoreEl.innerText = "0";
      } else {
          initPosition();
          startCountdown();
      }
  }

  window.addEventListener('keydown', (e) => {
      if (gameState !== 'playing') return;

      const key = e.key.toLowerCase();

      if (key === 'a') {
          p1Pos += PUSH_FORCE;
          p1.classList.add('shaking');
          setTimeout(() => p1.classList.remove('shaking'), 50);
      } else if (key === 'l') {
          p1Pos -= PUSH_FORCE;
          p2.classList.add('shaking');
          setTimeout(() => p2.classList.remove('shaking'), 50);
      }

      updateDisplay();
  });

  window.addEventListener('resize', updateDisplay);

  window.onload = () => {
      initPosition();
  };
</script>

</body>
</html>
