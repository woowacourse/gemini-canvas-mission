<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pick & Log | 식물과 함께하는 기록장</title>
    <style>
        :root {
            --shelf-wood: #4e342e;
            --shelf-shadow: #2a1b18;
            --lp-case: #1e272e;
            --bg-color: #f1f8f1; /* 연한 식물 톤 배경 */
            --primary-green: #2d5a27; /* 활성 탭 및 강조색 */
            --brand-brown: #67B362; /* 요청하신 추가 버튼용 색상 */
            --text-main: #2c3e50;
            --accent: #ffa502;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image:
                    radial-gradient(circle at 10% 20%, rgba(45, 90, 39, 0.05) 0%, transparent 20%),
                    radial-gradient(circle at 90% 80%, rgba(45, 90, 39, 0.05) 0%, transparent 20%);
            color: var(--text-main);
            padding-bottom: 100px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 60px 0 40px;
            position: relative;
        }

        header h1 {
            font-size: 3rem;
            color: var(--primary-green);
            font-weight: 900;
            letter-spacing: -2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        header p {
            color: #6a8e6a;
            font-weight: 500;
            margin-top: 10px;
        }

        /* Leaf Decors */
        header::before {
            content: '🌿';
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-200px) rotate(-20deg);
            font-size: 2rem;
        }

        header::after {
            content: '🍃';
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(150px) rotate(15deg);
            font-size: 1.5rem;
        }

        /* Tabs */
        nav {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
            justify-content: center;
        }

        nav button {
            padding: 14px 30px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 800;
            background: #d4e0d4;
            transition: all 0.3s ease;
            color: #5d7a5d;
        }

        nav button.active {
            background: var(--primary-green);
            color: white;
            box-shadow: 0 8px 20px rgba(45, 90, 39, 0.3);
            transform: translateY(-3px);
        }

        /* Shelf Area */
        .shelf-container {
            background: var(--shelf-wood);
            padding: 30px 20px 20px;
            border-radius: 15px;
            box-shadow: inset 0 25px 50px rgba(0,0,0,0.6), 0 15px 30px rgba(0,0,0,0.15);
            margin-bottom: 50px;
            min-height: 240px;
            position: relative;
        }

        .shelf-label {
            position: absolute;
            top: 8px;
            left: 20px;
            color: rgba(255,255,255,0.4);
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .shelf-row {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            padding-bottom: 5px;
            overflow-x: auto;
            min-height: 180px;
            border-bottom: 20px solid var(--shelf-shadow);
        }

        /* Book Styling */
        .book {
            height: 160px;
            background: #8e44ad;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            border-radius: 4px 4px 1px 1px;
            font-size: 0.9rem;
            padding: 10px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 4px 0 10px rgba(0,0,0,0.4);
            border-left: 3px solid rgba(255,255,255,0.1);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .book:hover {
            transform: translateY(-20px) rotate(2deg);
            filter: brightness(1.2);
            z-index: 10;
        }

        /* LP Styling */
        .lp-item {
            position: relative;
            flex: 0 0 150px;
            height: 150px;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .lp-item:hover { transform: translateY(-15px); }

        .lp-case {
            width: 100%; height: 100%;
            background: #111;
            border-radius: 4px;
            position: relative;
            z-index: 2;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .lp-case img { width: 100%; height: 100%; object-fit: cover; }

        .lp-disc {
            position: absolute;
            top: 5px; right: -30px;
            width: 140px; height: 140px;
            background: radial-gradient(circle, #333 15%, #000 100%);
            border-radius: 50%;
            z-index: 1;
            transition: all 0.5s ease;
        }

        .lp-item:hover .lp-disc {
            right: -60px;
            transform: rotate(180deg);
        }

        /* Floating Buttons */
        .action-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: -30px;
            margin-bottom: 50px;
        }

        .btn-open-modal {
            padding: 16px 30px;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            transition: all 0.2s;
            color: white;
            font-size: 1rem;
            background: var(--brand-brown); /* 요청하신 색상 적용 */
        }

        .btn-open-modal:hover { transform: scale(1.05); box-shadow: 0 12px 30px rgba(0,0,0,0.2); }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 500px;
            padding: 35px;
            border-radius: 30px;
            position: relative;
            animation: modalPop 0.3s ease-out;
        }

        @keyframes modalPop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-close {
            position: absolute;
            top: 20px; right: 20px;
            background: none; border: none; font-size: 2rem; cursor: pointer; color: #ccc;
        }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 8px; color: #4b634b; }
        .input-group input, .input-group select, .input-group textarea {
            width: 100%; padding: 14px; border: 2px solid #f1f2f6; border-radius: 12px; font-size: 1rem;
            outline: none; transition: border-color 0.3s;
        }
        .input-group input:focus { border-color: var(--primary-green); }

        /* Recommendation */
        .rec-card {
            background: white;
            border-radius: 25px;
            overflow: hidden;
            margin-bottom: 30px;
            display: flex;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            transition: transform 0.3s;
        }

        .rec-card:hover { transform: translateX(15px); }
        .rec-card img { width: 160px; height: 240px; object-fit: cover; }
        .rec-body { padding: 30px; flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .rec-aggro { font-size: 1.4rem; font-weight: 900; margin-bottom: 15px; color: #e67e22; line-height: 1.3; }
        .rec-title { font-weight: 800; font-size: 1.1rem; }

        #toast {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: #2d3436; color: white; padding: 12px 30px; border-radius: 50px;
            font-size: 0.95rem; font-weight: bold; opacity: 0; transition: 0.3s; z-index: 2000;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Pick & Log</h1>
        <p>싱그러운 초록빛 공간에서 당신의 취향을 기록하세요 🌿</p>
    </header>

    <nav>
        <button id="tab-home-btn" class="active" onclick="showTab('home')">나의 컬렉션</button>
        <button id="tab-rec-btn" onclick="showTab('rec')">취향 저격 추천</button>
    </nav>

    <!-- Main Collection Tab -->
    <div id="tab-home" class="tab-content active">
        <div class="action-container">
            <button class="btn-open-modal" onclick="openAddModal('book')">📚 책 추가하기</button>
            <button class="btn-open-modal" onclick="openAddModal('movie')">🎬 영화 추가하기</button>
        </div>

        <div class="shelf-container">
            <div class="shelf-label">My Botanic Bookshelf</div>
            <div id="book-shelf" class="shelf-row">
                <!-- Books rendered here -->
            </div>
        </div>

        <div class="shelf-container" style="background: #2c3e50;">
            <div class="shelf-label" style="color:rgba(255,255,255,0.2)">My Vinyl Rack</div>
            <div id="movie-shelf" class="shelf-row lp-container">
                <!-- LP items rendered here -->
            </div>
        </div>
    </div>

    <!-- Recommendation Tab -->
    <div id="tab-rec" class="tab-content" style="display:none">
        <div style="display:flex; justify-content:center; gap:15px; margin-bottom:30px;">
            <button id="rec-book-btn" class="active" onclick="setRecType('book')">도서 추천</button>
            <button id="rec-movie-btn" onclick="setRecType('movie')">영화 추천</button>
        </div>
        <div id="rec-display"></div>
    </div>
</div>

<!-- Modal Overlay (Common for Add and Edit) -->
<div id="modal-overlay" class="modal-overlay">
    <div class="modal-content">
        <button class="modal-close" onclick="closeModal()">×</button>
        <h2 id="modal-title" style="margin-bottom:25px; color:var(--primary-green)">기록하기</h2>

        <div id="form-content">
            <div class="input-group">
                <label>제목</label>
                <input type="text" id="item-title" placeholder="제목을 입력하세요">
            </div>

            <div id="book-only-fields">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
                    <div class="input-group">
                        <label>장르</label>
                        <select id="book-genre">
                            <option>SF/판타지</option><option>소설/문학</option><option>자기계발</option><option>인문/사회</option><option>스릴러</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>페이지 수</label>
                        <input type="number" id="book-pages" value="250">
                    </div>
                </div>
            </div>

            <div id="movie-only-fields" style="display:none">
                <div class="input-group">
                    <label>장르</label>
                    <select id="movie-genre">
                        <option>액션/스릴러</option><option>로맨스</option><option>애니메이션</option><option>코미디</option><option>공포</option>
                    </select>
                </div>
                <div class="input-group" id="file-upload-group">
                    <label>포스터 이미지 업로드</label>
                    <input type="file" id="movie-file" accept="image/*">
                </div>
            </div>

            <div class="input-group">
                <label>나의 평점</label>
                <select id="item-rating">
                    <option value="5">⭐⭐⭐⭐⭐</option>
                    <option value="4">⭐⭐⭐⭐</option>
                    <option value="3">⭐⭐⭐</option>
                    <option value="2">⭐⭐</option>
                    <option value="1">⭐</option>
                </select>
            </div>

            <div class="input-group">
                <label>한 줄 후기</label>
                <textarea id="item-review" rows="3" placeholder="당신의 솔직한 감상을 남겨주세요"></textarea>
            </div>

            <div style="display:flex; gap:10px;">
                <button id="btn-save-item" class="btn-open-modal" style="flex:1; justify-content:center" onclick="saveItem()">저장하기</button>
                <button id="btn-delete-item" class="btn-open-modal" style="background:#ff4757; display:none" onclick="deleteItem()">삭제하기</button>
            </div>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
    let db = JSON.parse(localStorage.getItem('pick_n_log_plant_v1')) || { books: [], movies: [] };
    let currentModalType = 'book';
    let editIndex = -1;
    let recType = 'book';

    // --- Core Logic ---
    function saveDB() {
        try {
            localStorage.setItem('pick_n_log_plant_v1', JSON.stringify(db));
        } catch (e) {
            showToast("이미지가 너무 커서 저장할 수 없어요! 😅");
        }
    }

    function showToast(m) {
        const t = document.getElementById('toast');
        t.innerText = m; t.style.opacity = 1;
        setTimeout(() => t.style.opacity = 0, 2500);
    }

    function showTab(tab) {
        document.getElementById('tab-home').style.display = tab === 'home' ? 'block' : 'none';
        document.getElementById('tab-rec').style.display = tab === 'rec' ? 'block' : 'none';
        document.getElementById('tab-home-btn').classList.toggle('active', tab === 'home');
        document.getElementById('tab-rec-btn').classList.toggle('active', tab === 'rec');
        if(tab === 'rec') renderRecommendations();
    }

    // --- Modal Logic ---
    function closeModal() {
        document.getElementById('modal-overlay').style.display = 'none';
        editIndex = -1;
    }

    function openAddModal(type) {
        currentModalType = type;
        editIndex = -1;

        document.getElementById('modal-overlay').style.display = 'flex';
        document.getElementById('modal-title').innerText = type === 'book' ? '📖 독서 기록 추가' : '🎞️ 영화 기록 추가';
        document.getElementById('book-only-fields').style.display = type === 'book' ? 'block' : 'none';
        document.getElementById('movie-only-fields').style.display = type === 'movie' ? 'block' : 'none';
        document.getElementById('btn-delete-item').style.display = 'none';

        // Reset fields
        document.getElementById('item-title').value = '';
        document.getElementById('item-review').value = '';
        document.getElementById('item-rating').value = '5';
    }

    function openEditModal(type, index) {
        currentModalType = type;
        editIndex = index;
        const item = db[type === 'book' ? 'books' : 'movies'][index];

        document.getElementById('modal-overlay').style.display = 'flex';
        document.getElementById('modal-title').innerText = type === 'book' ? '🔍 도서 정보 수정' : '🔍 영화 정보 수정';
        document.getElementById('book-only-fields').style.display = type === 'book' ? 'block' : 'none';
        document.getElementById('movie-only-fields').style.display = type === 'movie' ? 'block' : 'none';
        document.getElementById('btn-delete-item').style.display = 'block';

        // Fill fields
        document.getElementById('item-title').value = item.title;
        document.getElementById('item-rating').value = item.rating;
        document.getElementById('item-review').value = item.review || '';

        if (type === 'book') {
            document.getElementById('book-genre').value = item.genre;
            document.getElementById('book-pages').value = item.pages;
        } else {
            document.getElementById('movie-genre').value = item.genre;
        }
    }

    async function saveItem() {
        const title = document.getElementById('item-title').value;
        const rating = document.getElementById('item-rating').value;
        const review = document.getElementById('item-review').value;

        if (!title) return showToast("제목은 꼭 써주셔야 해요!");

        let newItem = { title, rating, review };

        if (currentModalType === 'book') {
            newItem.genre = document.getElementById('book-genre').value;
            newItem.pages = document.getElementById('book-pages').value || 250;
            newItem.color = editIndex > -1 ? db.books[editIndex].color : getRandomNaturalColor();

            if (editIndex > -1) db.books[editIndex] = newItem;
            else db.books.push(newItem);
        } else {
            newItem.genre = document.getElementById('movie-genre').value;
            const fileInput = document.getElementById('movie-file');

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    newItem.img = e.target.result;
                    if (editIndex > -1) db.movies[editIndex] = newItem;
                    else db.movies.push(newItem);
                    finishSaving();
                };
                reader.readAsDataURL(fileInput.files[0]);
                return;
            } else {
                newItem.img = editIndex > -1 ? db.movies[editIndex].img : 'https://via.placeholder.com/150?text=Poster';
                if (editIndex > -1) db.movies[editIndex] = newItem;
                else db.movies.push(newItem);
            }
        }
        finishSaving();
    }

    function finishSaving() {
        saveDB();
        renderShelves();
        closeModal();
        showToast("컬렉션에 안전하게 저장되었습니다! 🌿");
    }

    function deleteItem() {
        if (confirm("정말 이 소중한 기록을 지울까요?")) {
            const list = currentModalType === 'book' ? 'books' : 'movies';
            db[list].splice(editIndex, 1);
            saveDB();
            renderShelves();
            closeModal();
            showToast("기록이 삭제되었습니다.");
        }
    }

    function getRandomNaturalColor() {
        const colors = ['#6a8e6a', '#94a684', '#e67e22', '#34495e', '#a29bfe', '#fab1a0', '#2d3436'];
        return colors[Math.floor(Math.random() * colors.length)];
    }

    function renderShelves() {
        const bShelf = document.getElementById('book-shelf');
        bShelf.innerHTML = db.books.length ? db.books.map((b, i) => {
            const width = Math.min(Math.max(b.pages / 8, 30), 80);
            return `<div class="book" style="width:${width}px; background:${b.color}" onclick="openEditModal('book', ${i})" title="${b.title}">${b.title}</div>`;
        }).join('') : `<div style="padding:40px; color:rgba(255,255,255,0.2); font-weight:bold">책장이 비어있습니다.</div>`;

        const mShelf = document.getElementById('movie-shelf');
        mShelf.innerHTML = db.movies.length ? db.movies.map((m, i) => `
            <div class="lp-item" onclick="openEditModal('movie', ${i})" title="${m.title}">
                <div class="lp-case"><img src="${m.img}" onerror="this.src='https://via.placeholder.com/150?text=Poster'"></div>
                <div class="lp-disc"></div>
            </div>
        `).join('') : `<div style="padding:40px; color:rgba(255,255,255,0.1); font-weight:bold">진열대가 비어있습니다.</div>`;
    }

    // --- Recommendation Logic ---
    const REC_POOL = {
        book: [
            { title: "조화로운 삶", genre: "인문/사회", aggro: "도시의 소음에 지친 당신, 진정한 평온을 찾고 싶다면 이 책을 펼치세요. 인생의 속도가 바뀝니다.", img: "https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=300" },
            { title: "초록의 힘", genre: "자기계발", aggro: "당신의 창가에 놓인 식물이 사실 성공의 열쇠였다면? 환경이 사람을 바꿉니다.", img: "https://images.unsplash.com/photo-1589998059171-988d887df646?w=300" },
            { title: "침묵의 봄", genre: "인문/사회", aggro: "우리가 몰랐던 자연의 경고. 이 책을 읽고 나면 아침에 들리는 새소리가 다르게 느껴질 겁니다.", img: "https://images.unsplash.com/photo-1474932430478-367dbb6832c1?w=300" }
        ],
        movie: [
            { title: "리틀 포레스트", genre: "드라마/코미디", aggro: "지금 당장 짐 싸서 떠나고 싶게 만드는 영화! 배고플 때 보면 위험한 힐링 영상미.", img: "https://images.unsplash.com/photo-1505230833350-732ce12b513c?w=300" },
            { title: "월-E", genre: "애니메이션", aggro: "황폐해진 지구에서 발견한 단 하나의 초록색 새싹... 인류의 마지막 희망을 지켜낼 수 있을까요?", img: "https://images.unsplash.com/photo-1518384401463-d3876163c195?w=300" },
            { title: "미나리", genre: "드라마", aggro: "어디서든 잘 자라는 미나리처럼, 끈질기고 아름다운 가족의 생명력을 경험하세요.", img: "https://images.unsplash.com/photo-1523348837708-15d4a09cfac2?w=300" }
        ]
    };

    function setRecType(type) {
        recType = type;
        document.getElementById('rec-book-btn').classList.toggle('active', type === 'book');
        document.getElementById('rec-movie-btn').classList.toggle('active', type === 'movie');
        renderRecommendations();
    }

    function renderRecommendations() {
        const display = document.getElementById('rec-display');
        const userItems = db[recType === 'book' ? 'books' : 'movies'];

        if (userItems.length === 0) {
            display.innerHTML = `<div style="text-align:center; padding:50px; color:#6a8e6a; font-weight:bold">먼저 컬렉션을 채워주세요! <br>그래야 당신의 초록빛 취향을 분석할 수 있답니다.</div>`;
            return;
        }

        const recentGenre = userItems[userItems.length - 1].genre;
        let picks = REC_POOL[recType].sort(() => 0.5 - Math.random());

        display.innerHTML = `
            <div style="margin-bottom:25px; text-align:center; font-weight:900; color:var(--primary-green); font-size:1.2rem;">
                🌱 당신의 '${recentGenre}' 취향을 닮은 힐링 콘텐츠
            </div>
            ${picks.map(p => `
                <div class="rec-card">
                    <img src="${p.img}" alt="recommend">
                    <div class="rec-body">
                        <div class="rec-aggro">"${p.aggro}"</div>
                        <div class="rec-title">${p.title}</div>
                        <div style="color:#6a8e6a; font-size:0.85rem; margin-top:8px;">${p.genre} · Pick & Log 추천</div>
                    </div>
                </div>
            `).join('')}
        `;
    }

    window.onload = renderShelves;
</script>

</body>
</html>
