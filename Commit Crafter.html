<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commit Crafter</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css');
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');

        /* =========================================
           1. Global Styles & Variables (Modern Dark)
           ========================================= */
        :root {
            --bg-base: #0a0a0b;
            --bg-card: #141415;
            --bg-input: #1f1f22;
            --bg-input-hover: #27272a;
            --border-color: #2e2e32;
            --border-focus: #818cf8;
            --text-primary: #ededef;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --font-sans: 'Pretendard Variable', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', 'Fira Code', 'D2Coding', Consolas, monospace;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow-glow: 0 0 24px rgba(99, 102, 241, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-sans);
            line-height: 1.6;
            padding: 3rem 1rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* =========================================
           2. Layout & Container
           ========================================= */
        #app-container {
            width: 100%;
            max-width: 760px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .app-header {
            margin-bottom: 1rem;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
        }

        .app-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(180deg, #ffffff, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* =========================================
           3. Cards & Sections
           ========================================= */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2rem;
            position: relative;
        }

        .section-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-primary);
        }

        .section-title svg {
            color: var(--text-secondary);
        }

        /* AI Card Special Styling */
        .ai-card {
            background: linear-gradient(var(--bg-card), var(--bg-card)) padding-box,
                        var(--accent-gradient) border-box;
            border: 1px solid transparent;
            box-shadow: var(--shadow-glow);
        }

        .ai-title {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .ai-title svg {
            stroke: #c084fc;
        }

        /* =========================================
           4. Form Elements
           ========================================= */
        .grid-2-col {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 1.25rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .required { color: var(--accent-red); margin-left: 2px; }
        .optional { color: var(--text-muted); font-size: 0.8rem; font-weight: 400; }

        .modern-input {
            width: 100%;
            background-color: var(--bg-input);
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            padding: 0.875rem 1rem;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .modern-input:hover {
            background-color: var(--bg-input-hover);
        }

        .modern-input:focus {
            outline: none;
            border-color: var(--border-focus);
            background-color: #1a1a1e;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.15);
        }

        .modern-input::placeholder {
            color: var(--text-muted);
        }

        textarea.modern-input {
            resize: vertical;
            min-height: 80px;
            line-height: 1.5;
        }

        textarea#commitBody {
            min-height: 120px;
        }

        .ai-input {
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .ai-input:focus {
            background-color: rgba(0, 0, 0, 0.4);
        }

        /* Select styling */
        .select-wrapper {
            position: relative;
        }

        .select-wrapper::after {
            content: "▼";
            font-size: 0.6rem;
            color: var(--text-secondary);
            position: absolute;
            right: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        select.modern-input {
            appearance: none;
            padding-right: 2.5rem;
            cursor: pointer;
        }

        /* =========================================
           5. Buttons
           ========================================= */
        .action-right {
            display: flex;
            justify-content: flex-end;
            margin-top: 1rem;
        }

        .btn-magic {
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 99px;
            padding: 0.75rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
            box-shadow: 0 4px 15px rgba(129, 140, 248, 0.3);
        }

        .btn-magic:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(129, 140, 248, 0.4);
        }

        .btn-magic:active {
            transform: translateY(0);
        }

        .btn-magic:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-icon {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        /* =========================================
           6. Terminal Preview Area
           ========================================= */
        .terminal-window {
            background-color: #000000;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .terminal-header {
            background-color: #111111;
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .terminal-buttons {
            display: flex;
            gap: 6px;
        }

        .terminal-buttons span {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .close { background-color: #ff5f56; }
        .minimize { background-color: #ffbd2e; }
        .maximize { background-color: #27c93f; }
        
        .terminal-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .terminal-body {
            padding: 1.5rem;
            min-height: 120px;
        }

        pre {
            font-family: var(--font-mono);
            font-size: 0.95rem;
            color: #e2e8f0;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin: 0;
            line-height: 1.5;
        }

        /* =========================================
           7. Toast Feedback
           ========================================= */
        #messageFeedback {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background-color: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 12px 24px;
            border-radius: 99px;
            font-size: 0.95rem;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #messageFeedback::before {
            content: "✓";
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            background-color: var(--accent-green);
            color: #000;
            border-radius: 50%;
            font-size: 0.75rem;
            font-weight: bold;
        }

        #messageFeedback.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        #messageFeedback.error::before {
            content: "!";
            background-color: var(--accent-red);
            color: white;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <header class="app-header">
            <div class="logo-area">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="url(#gradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <defs>
                        <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#818cf8" />
                            <stop offset="100%" stop-color="#c084fc" />
                        </linearGradient>
                    </defs>
                    <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                    <path d="M2 17l10 5 10-5"></path>
                    <path d="M2 12l10 5 10-5"></path>
                </svg>
                <h1>Commit Crafter</h1>
            </div>
            <p class="subtitle">프로페셔널 개발자를 위한 표준 Git 커밋 메시지 생성기</p>
        </header>

        <!-- AI Assistant Section -->
        <section class="card ai-card">
            <h2 class="section-title ai-title">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                AI 커밋 메시지 다듬기
            </h2>
            <div class="form-group">
                <textarea id="taskSummary" class="modern-input ai-input" placeholder="작업 내용을 편하게 적어주세요. (예: 로그인 API 응답 속도 개선을 위해 Redis 캐싱 적용)"></textarea>
            </div>
            <div class="action-right">
                <button id="aiRefineBtn" class="btn-magic">
                    <span id="aiBtnText">✨ AI 자동 완성</span>
                </button>
            </div>
        </section>

        <!-- Manual Input Form Section -->
        <section class="card">
            <h2 class="section-title">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                수동 입력
            </h2>
            <div class="grid-2-col">
                <div class="form-group">
                    <label for="commitType">Type <span class="required">*</span></label>
                    <div class="select-wrapper">
                        <select id="commitType" class="modern-input">
                            <option value="feat">feat (새로운 기능 추가)</option>
                            <option value="fix">fix (버그 수정)</option>
                            <option value="docs">docs (문서 수정)</option>
                            <option value="style">style (코드 포맷팅)</option>
                            <option value="refactor">refactor (코드 리팩토링)</option>
                            <option value="test">test (테스트 코드)</option>
                            <option value="chore">chore (빌드 업무 수정)</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="commitScope">Scope <span class="optional">(선택)</span></label>
                    <input type="text" id="commitScope" class="modern-input" placeholder="예: auth, payment">
                </div>
            </div>

            <div class="form-group">
                <label for="commitSubject">Subject <span class="required">*</span></label>
                <input type="text" id="commitSubject" class="modern-input" placeholder="짧고 간결한 명령형 제목 (50자 이내)" maxlength="50">
            </div>

            <div class="form-group">
                <label for="commitBody">Body <span class="optional">(선택)</span></label>
                <textarea id="commitBody" class="modern-input" placeholder="무엇을, 왜 변경했는지 상세히 작성하세요."></textarea>
            </div>

            <div class="form-group">
                <label for="commitFooter">Footer <span class="optional">(선택)</span></label>
                <input type="text" id="commitFooter" class="modern-input" placeholder="예: Resolves #123, Refs #456">
            </div>
        </section>

        <!-- Real-time Preview Section -->
        <section class="terminal-window">
            <div class="terminal-header">
                <div class="terminal-buttons">
                    <span class="close"></span>
                    <span class="minimize"></span>
                    <span class="maximize"></span>
                </div>
                <div class="terminal-title">commit_preview.txt</div>
                <button id="copyBtn" class="btn-icon" title="복사하기">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                </button>
            </div>
            <div class="terminal-body" id="previewArea">
                <pre id="commitPreview"></pre>
            </div>
        </section>
    </div>

    <!-- Toast Feedback -->
    <div id="messageFeedback">복사되었습니다!</div>

    <script>
        /**
         * =========================================
         * Vanilla JavaScript 로직
         * =========================================
         */

        // 1. DOM 요소 참조
        const els = {
            type: document.getElementById('commitType'),
            scope: document.getElementById('commitScope'),
            subject: document.getElementById('commitSubject'),
            body: document.getElementById('commitBody'),
            footer: document.getElementById('commitFooter'),
            preview: document.getElementById('commitPreview'),
            copyBtn: document.getElementById('copyBtn'),
            feedback: document.getElementById('messageFeedback'),
            taskSummary: document.getElementById('taskSummary'),
            aiBtn: document.getElementById('aiRefineBtn'),
            aiBtnText: document.getElementById('aiBtnText')
        };

        // 2. 환경 변수 세팅 (실행 환경에서 제공되는 API Key 활용)
        // 지시사항에 따라 빈 문자열로 초기화하며, 실행 환경에서 런타임에 주입됩니다.
        const apiKey = ""; 

        // 3. 커밋 메시지 생성 함수 (실시간 업데이트)
        function generateCommitMessage() {
            const type = els.type.value;
            const scope = els.scope.value.trim();
            const subject = els.subject.value.trim();
            const body = els.body.value.trim();
            const footer = els.footer.value.trim();

            // 첫 줄 구성: type(scope): subject
            let message = `${type}`;
            if (scope) {
                message += `(${scope})`;
            }
            message += `: ${subject || '여기에 제목이 표시됩니다'}`;

            // 본문 추가
            if (body) {
                message += `\n\n${body}`;
            }

            // 푸터 추가
            if (footer) {
                message += `\n\n${footer}`;
            }

            els.preview.textContent = message;
        }

        // 4. 이벤트 리스너 등록 (입력 값 변경 시 프리뷰 업데이트)
        const inputElements = [els.type, els.scope, els.subject, els.body, els.footer];
        inputElements.forEach(el => {
            el.addEventListener('input', generateCommitMessage);
            el.addEventListener('change', generateCommitMessage);
        });

        // 5. 클립보드 복사 및 토스트 피드백 기능
        function showFeedback(message, isError = false) {
            els.feedback.textContent = message;
            if (isError) els.feedback.classList.add('error');
            else els.feedback.classList.remove('error');
            
            els.feedback.classList.add('show');
            
            // 2.5초 후 토스트 숨김
            setTimeout(() => {
                els.feedback.classList.remove('show');
            }, 2500);
        }

        els.copyBtn.addEventListener('click', () => {
            const textToCopy = els.preview.textContent;
            
            // execCommand fallback for iFrame compatibility (지시사항 준수)
            try {
                const textarea = document.createElement('textarea');
                textarea.value = textToCopy;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();
                const successful = document.execCommand('copy');
                document.body.removeChild(textarea);

                if (successful) {
                    showFeedback('클립보드에 복사되었습니다! 🚀');
                } else {
                    throw new Error('Fallback copy failed');
                }
            } catch (err) {
                console.error('Copy failed:', err);
                showFeedback('복사에 실패했습니다. 브라우저 권한을 확인해주세요.', true);
            }
        });

        // 6. 지수 백오프(Exponential Backoff)를 적용한 Fetch 함수
        async function fetchWithRetry(url, options, retries = 5, delay = 1000) {
            try {
                const response = await fetch(url, options);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return await response.json();
            } catch (error) {
                if (retries > 0) {
                    await new Promise(resolve => setTimeout(resolve, delay));
                    return fetchWithRetry(url, options, retries - 1, delay * 2);
                } else {
                    throw error;
                }
            }
        }

        // 7. Gemini API 연동 (AI 커밋 메시지 다듬기)
        els.aiBtn.addEventListener('click', async () => {
            const summaryText = els.taskSummary.value.trim();
            
            if (!summaryText) {
                showFeedback('작업 요약을 먼저 입력해주세요.', true);
                els.taskSummary.focus();
                return;
            }

            // 버튼 로딩 상태 처리
            els.aiBtn.disabled = true;
            els.aiBtnText.textContent = 'AI가 분석 중입니다... ⏳';

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            
            const payload = {
                contents: [{
                    parts: [{
                        text: `다음 작업 요약을 바탕으로 Git 커밋 컨벤션에 맞는 type, subject, body를 생성해줘. 
                               조건 1: type은 다음 중 하나만 정확히 선택할 것 [feat, fix, docs, style, refactor, test, chore].
                               조건 2: subject는 50자 이내로 작성하며, 한국어 명사형 종결어미(~함, ~적용, ~개선 등)로 끝낼 것.
                               조건 3: body는 '무엇을(What)', '왜(Why)' 변경했는지 논리적이고 구체적으로 작성할 것.
                               조건 4: [매우 중요] subject와 body 모두 감정적표현을 배제하고, 객관적, 사무적, 기술적인 문서 어투(명사형 종결어미 '-함', '-음')만 사용할 것.
                               조건 5: [매우 중요] API, DB, Redis, Caching, Refactoring 등 백엔드 개발자가 흔히 사용하는 기술 영단어는 억지로 한국어로 번역하지 말고 영어 원문을 그대로 사용할 것.
                               작업 요약: ${summaryText}`
                    }]
                }],
                systemInstruction: {
                    parts: [{
                        text: "너는 풍부한 개발 지식을 가진 시니어 백엔드 개발자이자 엄격한 코드 리뷰어 전문가야. 네가 작성하는 커밋 메시지는 기술 문서처럼 전문적이어야 해. 응답은 반드시 JSON 형식으로 반환해야 해. 구조는 { \"type\": \"결정된타입\", \"subject\": \"생성된제목\", \"body\": \"생성된본문\" } 형태여야 해."
                    }]
                },
                generationConfig: {
                    responseMimeType: "application/json"
                }
            };

            try {
                const result = await fetchWithRetry(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // JSON 파싱 (Gemini 응답 구조에서 텍스트 추출)
                const rawText = result.candidates[0].content.parts[0].text;
                const parsedData = JSON.parse(rawText);

                // 폼 자동 채우기
                if (parsedData.type && [...els.type.options].some(opt => opt.value === parsedData.type)) {
                    els.type.value = parsedData.type;
                }
                els.subject.value = parsedData.subject || '';
                els.body.value = parsedData.body || '';

                // 프리뷰 강제 갱신
                generateCommitMessage();
                showFeedback('AI가 성공적으로 커밋 메시지를 작성했습니다! ✨');

            } catch (error) {
                console.error('AI Generation Failed:', error);
                showFeedback('AI 생성 중 오류가 발생했습니다. API 키나 네트워크를 확인해주세요.', true);
            } finally {
                // 버튼 상태 복구
                els.aiBtn.disabled = false;
                els.aiBtnText.textContent = 'AI로 다듬기';
            }
        });

        // 8. 초기 렌더링 시 프리뷰 설정
        generateCommitMessage();

    </script>
</body>
</html>
