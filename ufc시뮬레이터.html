<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFC SIMULATOR - Pro Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&display=swap');

        :root {
            --ufc-red: #D20A0A;
            --ufc-black: #080808;
            --ufc-gold: #c5a059;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--ufc-black);
            color: #e5e7eb;
        }

        .oswald { font-family: 'Oswald', sans-serif; }

        .nav-btn {
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }
        .nav-btn.active {
            color: var(--ufc-red);
            border-bottom-color: var(--ufc-red);
        }

        .division-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(145deg, #1a1a1a, #0a0a0a);
            border: 1px solid #333;
        }

        .division-btn:hover {
            border-color: var(--ufc-red);
            transform: translateY(-3px);
        }

        .stat-bar-bg {
            height: 4px;
            background: #262626;
            border-radius: 2px;
        }

        .stat-bar-fill {
            height: 100%;
            background: var(--ufc-red);
            border-radius: 2px;
            transition: width 1s ease-in-out;
        }

        .rank-card {
            background: #111;
            border-left: 4px solid #333;
            transition: transform 0.2s;
        }
        .rank-card:hover {
            transform: scale(1.01);
        }

        .champion-card {
            background: linear-gradient(135deg, #1a1a1a 0%, #050505 100%);
            border: 2px solid var(--ufc-gold);
        }

        .simulator-panel {
            background: #111;
            border: 1px solid #333;
            border-radius: 1rem;
        }

        .vs-badge {
            background: var(--ufc-red);
            transform: rotate(-10deg);
            font-style: italic;
        }

        .log-entry {
            border-left: 2px solid var(--ufc-red);
            padding-left: 1rem;
            margin-bottom: 0.5rem;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }

        .radar-container {
            width: 180px;
            height: 180px;
        }

        .loading-shimmer {
            background: linear-gradient(90deg, #1a1a1a 25%, #2a2a2a 50%, #1a1a1a 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="pb-10">

<header class="p-6 border-b border-zinc-800 sticky top-0 bg-black/95 backdrop-blur-sm z-50">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
        <h1 onclick="goHome(); showPage('home');" class="oswald text-3xl font-bold italic tracking-tighter cursor-pointer uppercase">
            UFC <span class="text-red-600">SIMULATOR</span>
        </h1>

        <nav class="flex gap-8">
            <button onclick="showPage('home')" id="nav-home" class="nav-btn active oswald uppercase font-bold tracking-widest py-2">Encyclopedia</button>
            <button onclick="showPage('simulator')" id="nav-sim" class="nav-btn oswald uppercase font-bold tracking-widest py-2">Match Simulator</button>
        </nav>
    </div>
</header>

<main class="max-w-6xl mx-auto p-6">

    </div>

                    <select id="sim-fighter-2" class="w-full bg-zinc-800 border border-zinc-700 p-3 rounded-lg focus:outline-none focus:border-red-600 oswald"></select>
                </div>

                <button id="btn-start" onclick="runSimulation()" class="w-full bg-red-600 hover:bg-red-700 text-white oswald font-black italic text-xl py-4 rounded-xl transition-all shadow-lg uppercase tracking-tighter">
                    START FIGHT
                </button>
            </div>

            <div class="lg:col-span-2">
                <div id="sim-result-container" class="hidden">
                    <div id="sim-panel-main" class="simulator-panel p-8 mb-6 relative overflow-hidden bg-zinc-900">
                        <div id="title-fight-badge" class="hidden absolute top-0 left-1/2 -translate-x-1/2 bg-yellow-500 text-black px-6 py-1 oswald font-black text-xs tracking-widest uppercase rounded-b-lg z-20">Title Fight - 5 Rounds</div>

                            <div id="display-f1" class="text-center w-1/2">
                                <span class="oswald text-blue-500 text-sm font-bold uppercase tracking-widest mb-1 block">Corner</span>
                                <h3 id="name-f1" class="oswald text-3xl font-black italic uppercase leading-tight"></h3>
                            </div>
                            <div class="vs-badge px-4 py-1 text-2xl font-black">VS</div>
                            <div id="display-f2" class="text-center w-1/2">
                                <span class="oswald text-red-500 text-sm font-bold uppercase tracking-widest mb-1 block">Corner</span>
                                <h3 id="name-f2" class="oswald text-3xl font-black italic uppercase leading-tight"></h3>
                            </div>
                        </div>

                        <div id="sim-log" class="bg-black rounded-xl p-6 h-96 overflow-y-auto no-scrollbar font-mono text-sm text-zinc-300 border border-zinc-800"></div>
                    </div>

                    <div id="match-summary" class="hidden space-y-6 pb-10">

                            <h2 id="winner-name" class="oswald text-5xl font-black italic uppercase text-white"></h2>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                                <h4 class="oswald text-zinc-500 uppercase text-xs font-bold tracking-widest mb-4">Match Statistics</h4>
                                <div id="match-stats" class="space-y-4"></div>
                            </div>

                                <div id="analysis-loading" class="hidden space-y-2">

                                </div>
                                <p id="winner-analysis" class="text-sm text-zinc-400 leading-relaxed italic"></p>
                            </div>
                        </div>

                </div>
            </div>
        </div>
    </div>

</main>

        document.getElementById(`nav-${pageId === 'home' ? 'home' : 'sim'}`).classList.add('active');
        if(pageId === 'simulator') initSimulator();
    }

                    <span class="oswald text-xl font-bold group-hover:text-red-600 transition-colors uppercase">${div}</span>
                </button>
            `).join('');
    }

    function createRadarChart(canvasId, stats) {
        const ctx = document.getElementById(canvasId).getContext('2d');
        const newChart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['STR', 'GRP', 'CRD', 'TEC', 'CHN'],
                datasets: [{
                    data: stats,
                    backgroundColor: 'rgba(210, 10, 10, 0.2)',
                    borderColor: '#D20A0A',
                    borderWidth: 2,
                    pointBackgroundColor: '#D20A0A',
                    pointRadius: 0
                }]
            },
            options: {
                scales: {
                    r: {
                        min: 50,
                        max: 100,
                        ticks: { display: false },
                        grid: { color: '#333' },
                        angleLines: { color: '#333' },
                        pointLabels: {
                            color: '#777',
                            font: { size: 10, family: 'Oswald', weight: 'bold' }
                        }
                    }
                },
                plugins: { legend: { display: false } },
                responsive: true,
                maintainAspectRatio: false
            }
        });
        activeCharts.push(newChart);
    }

    function renderStat(label, value) {
        return `
                <div>
                    <div class="flex justify-between text-[10px] font-bold mb-1"><span class="text-zinc-500 uppercase">${label}</span><span class="text-zinc-300">${value}</span></div>
                    <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${value}%"></div></div>
                </div>
            `;
    }

    function goHome() {
        document.getElementById('home-view').classList.remove('hidden');
        document.getElementById('division-view').classList.add('hidden');
    }

    function initSimulator() {
        const divSelect = document.getElementById('sim-division');
        if(divSelect.options.length === 0) {
            Object.keys(ufcData).forEach(div => {
                const opt = document.createElement('option');
                opt.value = div; opt.textContent = div;
                divSelect.appendChild(opt);
            });
            updateSimFighters();
        }
    }

    function updateSimFighters() {
        const division = document.getElementById('sim-division').value;
        const fighters = ufcData[division].fighters;
        const s1 = document.getElementById('sim-fighter-1');
        const s2 = document.getElementById('sim-fighter-2');
        s1.innerHTML = ''; s2.innerHTML = '';
        fighters.forEach((f, idx) => {
            const nameStr = `${f.rank === 'C' ? '🏆' : '#' + f.rank} ${f.name} (${f.style})`;
            s1.add(new Option(nameStr, idx));
            s2.add(new Option(nameStr, idx));
        });
        s2.selectedIndex = fighters.length > 1 ? 1 : 0;
    }

    async function runSimulation() {
        const division = document.getElementById('sim-division').value;
        const idx1 = document.getElementById('sim-fighter-1').value;
        const idx2 = document.getElementById('sim-fighter-2').value;
        if (idx1 === idx2) { alert("상대 선수를 다르게 선택해주세요."); return; }

        const f1 = ufcData[division].fighters[idx1];
        const f2 = ufcData[division].fighters[idx2];

        const isTitleFight = f1.rank === 'C' || f2.rank === 'C';
        const totalRounds = isTitleFight ? 5 : 3;

        document.getElementById('sim-placeholder').classList.add('hidden');
        document.getElementById('sim-result-container').classList.remove('hidden');
        document.getElementById('match-summary').classList.add('hidden');
        document.getElementById('winner-analysis').textContent = "";
        document.getElementById('name-f1').textContent = f1.name;
        document.getElementById('name-f2').textContent = f2.name;

        const titleBadge = document.getElementById('title-fight-badge');
        const mainPanel = document.getElementById('sim-panel-main');
        if(isTitleFight) {
            titleBadge.classList.remove('hidden');
            mainPanel.classList.add('border-yellow-500');
        } else {
            titleBadge.classList.add('hidden');
            mainPanel.classList.remove('border-yellow-500');
        }

        const btn = document.getElementById('btn-start');
        btn.disabled = true; btn.classList.add('opacity-50');

        const log = document.getElementById('sim-log');
        log.innerHTML = `<div class="log-entry text-yellow-500 font-bold uppercase">[System] ${isTitleFight ? 'Title Main Event' : 'Ranking Fight'} Starting...</div>`;
        await sleep(500);

        let roundStats = { f1: { strikes: 0, td: 0, score: 0 }, f2: { strikes: 0, td: 0, score: 0 } };
        let isFinished = false;
        let finishReason = "Decision";
        let winner = null;
        let lastRound = totalRounds;

        const strikeEvents = ["날카로운 잽이 적중합니다!", "강력한 바디킥!", "오버핸드 훅이 가드를 뚫습니다.", "클린치 상태에서의 니킥 공격.", "압박하며 원투 스트레이트를 꽂습니다."];
        const grapplingEvents = ["기습적인 태클 성공!", "싱글렉 시도 후 상대를 눕힙니다.", "백 포지션을 점유하며 압박합니다.", "케이지 몰아넣고 더블렉 테이크다운.", "서브미션 그립을 깊게 시도합니다."];

        for (let r = 1; r <= totalRounds && !isFinished; r++) {
            await sleep(500);
            addLog(`<div class="mt-4 text-red-500 font-black oswald border-b border-zinc-800 pb-1 uppercase italic">ROUND ${r}</div>`);

            for (let i = 0; i < 5 && !isFinished; i++) {
                await sleep(400);
                const luck = Math.random() * 20;

                // Fatigue impact (Cardio)
                const f1_stamina = 1 - (r * (105 - f1.stats[2]) / 600);
                const f2_stamina = 1 - (r * (105 - f2.stats[2]) / 600);

                let p1_power = (f1.stats[0] * 0.4 + f1.stats[3] * 0.2) * f1_stamina + luck;
                let p2_power = (f2.stats[0] * 0.4 + f2.stats[3] * 0.2) * f2_stamina + (20 - luck);

                const attacker = p1_power > p2_power ? f1 : f2;
                const defender = p1_power > p2_power ? f2 : f1;
                const attKey = p1_power > p2_power ? 'f1' : 'f2';

                if (Math.random() > (attacker.style === 'Grappler' ? 0.4 : 0.7)) {
                    const ev = strikeEvents[Math.floor(Math.random() * strikeEvents.length)];
                    addLog(`<span class="text-blue-400 font-bold">${attacker.name}</span>: ${ev}`);
                    roundStats[attKey].strikes += Math.floor(Math.random() * 8) + 4;
                    roundStats[attKey].score += 1;

                    // CHIN Balance: High Chin significantly reduces KO chance
                    // KO Probability = (Striking Power / Chin Power^2) * Multiplier
                    let koChance = (attacker.stats[0] / Math.pow(defender.stats[4], 1.5)) * 0.25;
                    if (Math.random() < koChance) {
                        addLog(`<span class="text-red-600 font-black text-lg uppercase">CRITICAL! ${attacker.name}의 한방에 ${defender.name} 선수가 고꾸라집니다! KO!</span>`);
                        isFinished = true; finishReason = "KO/TKO"; winner = attacker; lastRound = r;
                    }
                } else {
                    const ev = grapplingEvents[Math.floor(Math.random() * grapplingEvents.length)];
                    addLog(`<span class="text-green-400 font-bold">${attacker.name}</span>: ${ev}`);
                    roundStats[attKey].td += 1;
                    roundStats[attKey].score += 2;

                    let subChance = (attacker.stats[1] / Math.pow(defender.stats[1], 1.2)) * 0.1;
                    if (Math.random() < subChance) {
                        addLog(`<span class="text-yellow-500 font-black text-lg uppercase">SUBMISSION! ${attacker.name}가 탭을 받아냅니다!</span>`);
                        isFinished = true; finishReason = "Submission"; winner = attacker; lastRound = r;
                    }
                }
            }
        }

        if(!isFinished) {
            winner = roundStats.f1.score >= roundStats.f2.score ? f1 : f2;
            finishReason = "Unanimous Decision";
        }

        displaySummary(winner, finishReason, roundStats, lastRound, isTitleFight);
        btn.disabled = false; btn.classList.remove('opacity-50');

        generateAIBreakdown(winner, f1, f2, finishReason, roundStats, lastRound, isTitleFight);
    }

    async function generateAIBreakdown(winner, f1, f2, type, stats, lastRound, isTitle) {
        const loading = document.getElementById('analysis-loading');
        const analysisText = document.getElementById('winner-analysis');
        loading.classList.remove('hidden');
        analysisText.textContent = "";

        const prompt = `UFC 경기 결과를 전문 해설가 조 로건처럼 분석해줘.
            경기 정보:
            - 선수: ${f1.name} (Blue) vs ${f2.name} (Red)
            - 승자: ${winner.name}
            - 방식: ${type}
            - 마지막 라운드: ${lastRound}R
            - 총 경기 성격: ${isTitle ? '5라운드 챔피언십 매치' : '3라운드 랭킹 매치'}
            - 통계 (F1): 타격 ${stats.f1.strikes}회, 테이크다운 ${stats.f1.td}회
            - 통계 (F2): 타격 ${stats.f2.strikes}회, 테이크다운 ${stats.f2.td}회

            요구사항:
            1. 매우 박진감 넘치고 흥미롭게 작성할 것.
            2. 승자의 핵심 전략이 무엇이었는지 구체적 통계(타격/레슬링)를 언급하며 칭찬할 것.
            3. 패자에게 아쉬웠던 점을 한 문장 추가할 것.
            4. 한국어로 작성하되 중간중간 전문 용어(카프킥, 그라운드 앤 파운드 등)를 사용할 것.
            5. 전체 길이는 4~5문장 내외로 강렬하게 끝낼 것.`;

        try {
            let retries = 5;
            let delay = 1000;
            let resultText = "";

            while(retries > 0) {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                if(response.ok) {
                    const data = await response.json();
                    resultText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    break;
                }
                await sleep(delay);
                delay *= 2; retries--;
            }

            loading.classList.add('hidden');
            analysisText.textContent = resultText || "경기가 끝난 후 옥타곤은 고요함에 잠겼습니다. 승자는 자신의 모든 것을 증명했고, 패자는 다시 일어설 준비를 합니다.";
        } catch (e) {
            loading.classList.add('hidden');
            analysisText.textContent = "통신 장애로 인해 현장 리포트를 가져오지 못했습니다.";
        }
    }

    function displaySummary(winner, type, stats, lastRound, isTitle) {
        document.getElementById('match-summary').classList.remove('hidden');
        document.getElementById('winner-name').textContent = winner.name;
        document.getElementById('finish-type').textContent = type;

        const statHtml = `
                <div class="grid grid-cols-3 gap-2 text-center items-center">
                    <div class="oswald text-2xl text-blue-500">${stats.f1.strikes}</div>
                    <div class="text-[10px] text-zinc-500 font-bold uppercase">Strikes</div>
                    <div class="oswald text-2xl text-red-500">${stats.f2.strikes}</div>
                </div>
                <div class="grid grid-cols-3 gap-2 text-center items-center">
                    <div class="oswald text-2xl text-blue-500">${stats.f1.td}</div>
                    <div class="text-[10px] text-zinc-500 font-bold uppercase">Takedowns</div>
                    <div class="oswald text-2xl text-red-500">${stats.f2.td}</div>
                </div>
                <div class="text-center mt-4">
                    <span class="oswald text-xs font-bold text-zinc-600 uppercase tracking-widest italic">Stopped in Round ${lastRound}</span>
                </div>
            `;
        document.getElementById('match-stats').innerHTML = statHtml;

        setTimeout(() => {
            document.getElementById('match-summary').scrollIntoView({ behavior: 'smooth' });
        }, 100);
    }

    function addLog(msg) {
        const log = document.getElementById('sim-log');
        const div = document.createElement('div');
        div.className = 'log-entry';
        div.innerHTML = msg;
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
    }

    function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
    window.onload = () => { initEncyclopedia(); initSimulator(); };
</script>
