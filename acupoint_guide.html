<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상세 2D 근육통 완화 혈자리 가이드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background-color: #f1f5f9; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
        .body-container { height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        
        /* 인체 SVG 스타일 */
        #human-svg { height: 90vh; width: auto; filter: drop-shadow(0 20px 30px rgba(0,0,0,0.1)); }
        .body-part { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; transition: all 0.25s ease; cursor: pointer; }
        .body-part:hover { fill: #f1f5f9; stroke: #475569; }
        .body-part.active { fill: #3b82f6; stroke: #1d4ed8; stroke-width: 2; }

        /* 혈자리 포인트 애니메이션 */
        .acupoint-dot { fill: #ef4444; stroke: #fff; stroke-width: 2; r: 5; cursor: pointer; animation: pulse 1.5s infinite; pointer-events: none; }
        @keyframes pulse {
            0% { r: 4; opacity: 1; filter: blur(0px); }
            50% { r: 7; opacity: 0.6; filter: blur(1px); }
            100% { r: 4; opacity: 1; filter: blur(0px); }
        }

        .ui-overlay { position: absolute; top: 40px; left: 40px; pointer-events: none; z-index: 10; }
        .info-card { 
            position: absolute; top: 40px; right: 40px; 
            width: 400px; background: rgba(255, 255, 255, 0.98); 
            backdrop-filter: blur(12px);
            border-radius: 28px; padding: 32px; 
            box-shadow: 0 25px 60px rgba(0,0,0,0.12); 
            display: none; z-index: 20; 
            border: 1px solid rgba(255,255,255,1);
            max-height: calc(100vh - 80px);
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="ui-overlay">
    <h1 class="text-4xl font-black text-slate-900 tracking-tighter">혈자리 가이드</h1>
    <p class="text-slate-500 mt-3 font-semibold text-lg">상세 부위를 클릭하여 지압점을 확인하세요.</p>
</div>

<div class="body-container">
    <!-- 정교하게 세분화된 인체 2D SVG 모델 -->
    <svg id="human-svg" viewBox="0 0 240 640" xmlns="http://www.w3.org/2000/svg">
        <!-- 머리 (Head) -->
        <path d="M120,20 c-20,0 -35,15 -35,35 c0,20 15,35 35,35 s35,-15 35,-35 c0,-20 -15,-35 -35,-35" class="body-part" data-part="head" />
        <!-- 목 (Neck) -->
        <path d="M105,90 h30 v20 q-15,5 -30,0 z" class="body-part" data-part="neck" />
        
        <!-- 몸통 상부 / 가슴 (Chest) -->
        <path d="M70,115 h100 l10,80 q-60,15 -120,0 z" class="body-part" data-part="chest" />
        <!-- 몸통 중부 / 복부 (Abdomen) -->
        <path d="M80,195 h80 v50 q-40,10 -80,0 z" class="body-part" data-part="abdomen" />
        <!-- 골반 (Pelvis) -->
        <path d="M80,245 h80 l15,45 h-110 z" class="body-part" data-part="pelvis" />

        <!-- 어깨 (Shoulders) -->
        <circle cx="65" cy="125" r="18" class="body-part" data-part="shoulder" />
        <circle cx="175" cy="125" r="18" class="body-part" data-part="shoulder" />

        <!-- 팔 상부 (Upper Arms) -->
        <path d="M47,135 l-12,95 l25,0 l12,-95 z" class="body-part" data-part="arm_upper" />
        <path d="M193,135 l12,95 l-25,0 l-12,-95 z" class="body-part" data-part="arm_upper" />
        
        <!-- 팔 하부 (Forearms) -->
        <path d="M35,230 l-8,105 l22,0 l8,-105 z" class="body-part" data-part="arm_lower" />
        <path d="M205,230 l8,105 l-22,0 l-8,-105 z" class="body-part" data-part="arm_lower" />

        <!-- 허벅지 (Thighs) -->
        <path d="M85,290 l-15,150 h35 l5,-150 z" class="body-part" data-part="leg_upper" />
        <path d="M155,290 l15,150 h-35 l-5,-150 z" class="body-part" data-part="leg_upper" />

        <!-- 종아리 (Calves) -->
        <path d="M70,445 l-10,140 h30 l10,-140 z" class="body-part" data-part="leg_lower" />
        <path d="M170,445 l10,140 h-30 l-10,-140 z" class="body-part" data-part="leg_lower" />

        <!-- 혈자리 포인트 마커 그룹 -->
        <g id="point-markers"></g>
    </svg>
</div>

<div id="info-card" class="info-card">
    <div id="selection-step">
        <div class="flex justify-between items-center mb-8">
            <h3 id="part-name" class="text-2xl font-black text-slate-800 tracking-tight">부위별 증상</h3>
            <button onclick="closeCard()" class="p-2 hover:bg-slate-100 rounded-full transition-colors">
                <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div id="symptom-list" class="space-y-4"></div>
    </div>
    
    <div id="detail-step" style="display: none;">
        <button onclick="backToSymptoms()" class="text-blue-600 font-bold text-sm mb-6 flex items-center group">
            <span class="mr-2 group-hover:-translate-x-1 transition-transform">←</span> 증상 목록으로 돌아가기
        </button>
        <h3 id="point-name" class="text-4xl font-black text-slate-900 mb-4 tracking-tighter">혈자리</h3>
        <p id="point-desc" class="text-slate-600 mb-8 leading-relaxed text-lg font-medium">상세 설명...</p>
        <div class="bg-gradient-to-br from-blue-600 to-blue-700 p-6 rounded-2xl shadow-lg text-white">
            <h4 class="text-blue-100 font-bold text-xs uppercase tracking-widest mb-3">Professional Guide</h4>
            <p id="massage-method" class="text-md leading-snug font-medium"></p>
        </div>
    </div>
</div>

<script>
    const bodyPartsData = {
        'head': {
            name: '머리 (Head)',
            points: [{ x: 120, y: 55 }],
            symptoms: [
                { title: '눈의 피로 / 관자놀이 통증', point: '태양혈', desc: '눈썹 바깥쪽 끝과 눈 바깥쪽 끝의 중간 지점입니다. 두통과 안구 건조 개선에 효과적입니다.', method: '양쪽 검지로 지긋이 누르며 원을 그리듯 20회 반복 마사지하세요.' },
                { title: '정수리 압박감 / 스트레스', point: '백회혈', desc: '머리 꼭대기 정중앙입니다. 전신의 양기가 모이는 곳으로 머리를 맑게 합니다.', method: '손가락 끝으로 가볍게 톡톡 두드리거나 3초간 꾹 눌러주세요.' }
            ]
        },
        'neck': {
            name: '목 (Neck)',
            points: [{ x: 120, y: 100 }],
            symptoms: [
                { title: '거북목 / 뒷목 뻣뻣함', point: '풍지혈', desc: '목 뒤쪽 머리카락이 나기 시작하는 오목한 곳입니다.', method: '엄지로 머리 쪽을 향해 강하게 밀어 올리듯 5초간 지압하세요.' }
            ]
        },
        'shoulder': {
            name: '어깨 (Shoulder)',
            points: [{ x: 65, y: 125 }, { x: 175, y: 125 }],
            symptoms: [
                { title: '승모근 결림 / 오십견', point: '견정혈', desc: '목 뼈와 어깨 끝의 중간 지점입니다. 어깨 무거움을 즉각 완화합니다.', method: '반대쪽 손을 갈고리처럼 만들어 아래 방향으로 강하게 5회 압박하세요.' }
            ]
        },
        'chest': {
            name: '가슴 및 상부 몸통',
            points: [{ x: 120, y: 160 }],
            symptoms: [
                { title: '가슴 답답함 / 화병', point: '전중혈', desc: '양쪽 젖꼭지를 이은 선의 정중앙입니다. 스트레스 완화의 핵심입니다.', method: '손바닥 전체로 부드럽게 문지르거나 숨을 내쉬며 지긋이 누르세요.' }
            ]
        },
        'abdomen': {
            name: '복부 (Abdomen)',
            points: [{ x: 120, y: 220 }],
            symptoms: [
                { title: '소화불량 / 복부 팽만', point: '중완혈', desc: '명치와 배꼽 사이 중간 지점입니다. 위장 운동을 돕습니다.', method: '양손 손가락을 겹쳐 배꼽 방향으로 깊게 3초간 누르기를 반복하세요.' }
            ]
        },
        'arm_upper': {
            name: '상완 (Upper Arm)',
            points: [{ x: 40, y: 180 }, { x: 200, y: 180 }],
            symptoms: [
                { title: '이두근 피로 / 팔 근육통', point: '비노혈', desc: '어깨 삼각근이 끝나는 지점의 오목한 곳입니다.', method: '엄지와 검지로 팔 근육을 집듯이 잡고 부드럽게 주물러주세요.' }
            ]
        },
        'arm_lower': {
            name: '전완 및 손목',
            points: [{ x: 20, y: 290 }, { x: 220, y: 290 }],
            symptoms: [
                { title: '손목 터널 증후군', point: '외관혈', desc: '손목 등쪽 주름 위 2마디 지점입니다.', method: '손목을 고정하고 반대쪽 엄지로 뼈 사이를 깊게 자극하세요.' }
            ]
        },
        'leg_upper': {
            name: '허벅지 (Thigh)',
            points: [{ x: 80, y: 370 }, { x: 160, y: 370 }],
            symptoms: [
                { title: '하체 부종 / 허벅지 당김', point: '혈해혈', desc: '무릎뼈 안쪽 끝에서 위로 2마디 지점입니다. 혈액 순환의 바다라 불립니다.', method: '의자에 앉아 손바닥으로 무릎 위를 감싸며 엄지로 꾹 눌러주세요.' }
            ]
        },
        'leg_lower': {
            name: '종아리 (Calf)',
            points: [{ x: 75, y: 510 }, { x: 165, y: 510 }],
            symptoms: [
                { title: '종아리 쥐 / 다리 무거움', point: '승산혈', desc: '종아리 알이 갈라지는 정중앙 하단입니다.', method: '발가락을 몸쪽으로 당기면서 엄지로 가장 깊은 곳을 압박하세요.' }
            ]
        }
    };

    const parts = document.querySelectorAll('.body-part');
    const infoCard = document.getElementById('info-card');
    const markerGroup = document.getElementById('point-markers');

    parts.forEach(part => {
        part.addEventListener('click', (e) => {
            const partKey = e.target.getAttribute('data-part');
            selectPart(partKey);
        });
    });

    function selectPart(key) {
        parts.forEach(p => p.classList.remove('active'));
        document.querySelectorAll(`[data-part="${key}"]`).forEach(p => p.classList.add('active'));

        const data = bodyPartsData[key];
        if(!data) return;

        document.getElementById('part-name').innerText = data.name;
        
        const list = document.getElementById('symptom-list');
        list.innerHTML = '';
        data.symptoms.forEach(s => {
            const btn = document.createElement('button');
            btn.className = 'w-full text-left p-5 bg-white border border-slate-200 rounded-2xl hover:bg-blue-50 hover:border-blue-300 hover:shadow-md transition-all group';
            btn.innerHTML = `<div class="flex justify-between items-center"><span class="font-bold text-slate-800">${s.title}</span><span class="text-blue-500 opacity-0 group-hover:opacity-100 transition-opacity">→</span></div>`;
            btn.onclick = () => showDetail(s);
            list.appendChild(btn);
        });

        markerGroup.innerHTML = '';
        data.points.forEach(pt => {
            const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            dot.setAttribute("cx", pt.x);
            dot.setAttribute("cy", pt.y);
            dot.setAttribute("class", "acupoint-dot");
            markerGroup.appendChild(dot);
        });

        infoCard.style.display = 'block';
        backToSymptoms();
    }

    function showDetail(symptom) {
        document.getElementById('selection-step').style.display = 'none';
        document.getElementById('detail-step').style.display = 'block';
        document.getElementById('point-name').innerText = symptom.point;
        document.getElementById('point-desc').innerText = symptom.desc;
        document.getElementById('massage-method').innerText = symptom.method;
    }

    function backToSymptoms() {
        document.getElementById('selection-step').style.display = 'block';
        document.getElementById('detail-step').style.display = 'none';
    }

    function closeCard() {
        infoCard.style.display = 'none';
        parts.forEach(p => p.classList.remove('active'));
        markerGroup.innerHTML = '';
    }
</script>
</body>
</html>
