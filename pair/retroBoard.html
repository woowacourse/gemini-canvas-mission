<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로젝트 회고 보드</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }

        main { overflow-y: scroll; scroll-behavior: smooth; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        .tab-active {
            border-bottom: 3px solid #3b82f6;
            color: #3b82f6 !important;
            font-weight: 800 !important;
        }

        /* AI 분석 탭 고유 컬러 유지 */
        #tab-ai-summary.tab-active {
            border-bottom-color: #9333ea !important; /* purple-600 */
            color: #9333ea !important;
        }

        /* 아코디언 애니메이션 */
        .card-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
            opacity: 0;
        }
        .card-expanded .card-details {
            max-height: 4000px;
            opacity: 1;
        }

        /* 태그 컬러셋 */
        .tag-pill { transition: all 0.2s; cursor: pointer; }
        .tag-pill:hover { transform: translateY(-1px); filter: brightness(0.95); }
        .tag-color-0 { background-color: #eff6ff; color: #1e40af; border-color: #dbeafe; }
        .tag-color-1 { background-color: #ecfdf5; color: #065f46; border-color: #d1fae5; }
        .tag-color-2 { background-color: #fffbeb; color: #92400e; border-color: #fef3c7; }
        .tag-color-3 { background-color: #fef2f2; color: #991b1b; border-color: #fee2e2; }
        .tag-color-4 { background-color: #f5f3ff; color: #6b21a8; border-color: #ede9fe; }
        .tag-color-5 { background-color: #fff7ed; color: #9a3412; border-color: #ffedd5; }

        /* KPT 콜아웃 공통 스타일 */
        .kpt-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 85px;
            padding: 0.4rem 0;
            border-radius: 0.8rem;
            font-size: 0.75rem;
            font-weight: 900;
            flex-shrink: 0;
            letter-spacing: 0.05em;
        }

        .interaction-badge {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 0.3rem 0.7rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 800;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .animate-fadeIn {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .view-header {
            background-color: #ffffff;
            border-left: 6px solid #3b82f6;
            padding: 1.5rem 2rem;
            border-radius: 0 1.5rem 1.5rem 0;
            box-shadow: 0 4px 15px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 2rem;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* AI 리포트 컨텐츠 스타일링 */
        #ai-summary-content h3 { font-size: 1.25rem; font-weight: 900; color: #1e3a8a; margin-top: 1.5rem; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; }
        #ai-summary-content h3::before { content: "✨"; font-size: 1rem; }
        #ai-summary-content ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1.5rem; color: #334155; }
        #ai-summary-content li { margin-bottom: 0.5rem; line-height: 1.6; }
        #ai-summary-content p { line-height: 1.6; color: #334155; margin-bottom: 1rem; }
        #ai-summary-content strong { color: #0f172a; font-weight: 800; }
    </style>
</head>
<body class="text-gray-800 antialiased h-screen flex flex-col">

<!-- Header -->
<header class="bg-white shadow-sm z-10 border-b border-gray-100">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center gap-2 cursor-pointer" onclick="clearFilter(); switchTab('board');">
            <i class="fa-solid fa-leaf text-green-500 text-2xl"></i>
            <h1 class="text-xl font-black text-gray-900 tracking-tighter">프로젝트 회고 보드</h1>
        </div>
        <div class="flex items-center gap-4">
            <span id="currentUserDisplay" class="text-sm font-bold text-gray-600">로그인 필요</span>
            <button id="auth-btn" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 py-1.5 px-4 rounded-full transition hidden font-black">로그아웃</button>
        </div>
    </div>
</header>

<!-- Navigation Tabs -->
<div id="nav-tabs" class="bg-white border-b border-gray-200 hidden">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 flex gap-6 overflow-x-auto no-scrollbar">
        <button id="tab-board" class="py-4 px-1 text-sm font-bold text-gray-500 hover:text-gray-900 transition whitespace-nowrap tab-active">
            <i class="fa-solid fa-layer-group mr-1.5 opacity-60"></i>전체 회고
        </button>
        <button id="tab-write" class="py-4 px-1 text-sm font-bold text-gray-500 hover:text-gray-900 transition whitespace-nowrap">
            <i class="fa-solid fa-pen-nib mr-1.5 opacity-60"></i>내 회고 작성
        </button>
        <div id="filter-tab-container" class="hidden flex items-center gap-2">
            <button id="tab-filter" class="py-4 px-1 text-sm font-bold text-gray-500 hover:text-blue-600 whitespace-nowrap cursor-pointer transition">
                <i class="fa-solid fa-filter mr-1.5 opacity-60"></i>필터링 결과 (<span id="filter-count">0</span>)
            </button>
            <i class="fa-solid fa-circle-xmark text-gray-300 hover:text-blue-600 cursor-pointer text-sm mb-0.5" onclick="clearFilter();"></i>
        </div>
        <button id="tab-compare" class="hidden py-4 px-1 text-sm font-bold text-gray-500 hover:text-gray-900 transition whitespace-nowrap">
            <i class="fa-solid fa-code-compare mr-1.5 opacity-60"></i>비교 분석 (<span id="compareCount">0</span>)
        </button>
        <div id="ai-summary-tab-container" class="hidden flex items-center gap-2">
            <button id="tab-ai-summary" class="py-4 px-1 text-sm font-bold text-gray-500 hover:text-purple-600 transition whitespace-nowrap cursor-pointer">
                <i class="fa-solid fa-wand-magic-sparkles mr-1.5 opacity-60"></i>AI 통합 분석
            </button>
            <i class="fa-solid fa-circle-xmark text-gray-300 hover:text-purple-600 cursor-pointer text-sm mb-0.5" onclick="closeAISummary();"></i>
        </div>
    </div>
</div>

<!-- Main Area -->
<main class="flex-1 p-4 sm:p-6 lg:p-8">
    <div class="max-w-5xl mx-auto h-full relative">

        <!-- VIEW: Auth -->
        <div id="view-auth" class="flex items-center justify-center min-h-[60vh] hidden">
            <div class="bg-white p-10 rounded-3xl shadow-xl border border-gray-100 w-full max-w-md">
                <div class="text-center mb-10">
                    <div class="w-16 h-16 bg-blue-50 text-blue-500 rounded-2xl flex items-center justify-center mx-auto mb-4"><i class="fa-solid fa-shield-halved text-3xl"></i></div>
                    <h2 id="auth-title" class="text-3xl font-black text-gray-900 tracking-tight">로그인</h2>
                    <p id="auth-desc" class="text-sm text-gray-500 mt-2 font-medium">계정 정보를 입력하세요.</p>
                </div>
                <div class="space-y-4">
                    <input type="text" id="auth-id" class="w-full bg-gray-50 border-2 border-transparent rounded-xl px-5 py-3 text-sm font-bold focus:border-blue-500 focus:bg-white outline-none transition" placeholder="아이디">
                    <input type="password" id="auth-pw" class="w-full bg-gray-50 border-2 border-transparent rounded-xl px-5 py-3 text-sm font-bold focus:border-blue-500 focus:bg-white outline-none transition" placeholder="비밀번호">
                    <div id="signup-extra-fields" class="hidden space-y-4 pt-2 border-t border-gray-100 mt-4">
                        <input type="password" id="auth-pw-confirm" class="w-full bg-red-50/30 border-2 border-transparent rounded-xl px-5 py-3 text-sm font-bold focus:border-red-400 focus:bg-white outline-none transition" placeholder="비밀번호 확인">
                        <input type="text" id="auth-nickname" class="w-full bg-gray-50 border-2 border-transparent rounded-xl px-5 py-3 text-sm font-bold focus:border-blue-500 focus:bg-white outline-none transition" placeholder="닉네임">
                    </div>
                    <div id="login-actions" class="space-y-4 pt-6">
                        <button id="btn-login" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl text-base font-black transition shadow-lg shadow-blue-100">로그인하기</button>
                        <div class="flex items-center gap-3">
                            <button id="btn-show-signup" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-800 py-3 rounded-xl text-xs font-black transition">회원가입</button>
                            <button id="btn-guest" class="flex-1 bg-white border border-gray-200 hover:bg-gray-50 text-gray-500 py-3 rounded-xl text-xs font-black transition">게스트 입장</button>
                        </div>
                    </div>
                    <div id="signup-actions" class="hidden space-y-4 pt-6">
                        <button id="btn-complete-signup" class="w-full bg-green-600 hover:bg-green-700 text-white py-4 rounded-2xl text-base font-black transition shadow-lg shadow-green-100">가입 완료</button>
                        <button id="btn-cancel-signup" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-800 py-3 rounded-xl text-sm font-black transition">가입 취소</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Header Callout for Views -->
        <div id="view-header-container" class="hidden animate-fadeIn">
            <div class="view-header relative">
                <div class="flex justify-between items-end w-full">
                    <div class="w-full pr-[340px]">
                        <div class="flex items-center gap-3 mb-1">
                            <div id="header-icon-box" class="bg-blue-500 text-white p-2.5 rounded-xl shadow-sm"><i id="header-icon" class="fa-solid fa-layer-group"></i></div>
                            <h2 id="view-title" class="text-2xl font-black text-gray-900 tracking-tighter">전체 회고</h2>
                        </div>
                        <p id="view-desc" class="text-sm text-gray-500 font-medium">다양한 프로젝트의 소중한 인사이트가 모이는 공간입니다.</p>
                        <!-- 필터링 뷰에서만 노출되는 태그 컨테이너 (공간은 항상 확보) -->
                        <div id="active-filter-chips" class="flex flex-wrap gap-2 mt-4 min-h-[28px] opacity-0 pointer-events-none transition-opacity"></div>
                    </div>
                    <div id="header-action-area" class="flex flex-col items-end justify-end gap-2 flex-shrink-0 absolute right-8 bottom-6">
                        <div class="flex items-center gap-2">
                            <button id="btn-compare-all" class="hidden w-44 flex items-center justify-center bg-indigo-50 hover:bg-indigo-100 text-indigo-700 py-3.5 rounded-2xl text-sm font-black transition shadow-sm border border-indigo-200" onclick="selectAllFiltered()">필터 결과 모두 선택</button>
                            <button id="btn-clear-selection" class="hidden w-36 flex items-center justify-center gap-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 py-3.5 rounded-2xl text-sm font-black transition disabled:opacity-50 disabled:cursor-not-allowed shadow-sm" onclick="clearSelection()" disabled>
                                <span>선택 해제</span>
                                <span id="selected-count-display" class="bg-gray-300 text-gray-700 px-1.5 py-0.5 rounded-lg text-xs font-bold min-w-[1.5rem] text-center">0</span>
                            </button>
                        </div>
                        <div class="flex items-center gap-2">
                            <button id="btn-ai-analyze" class="hidden w-44 flex items-center justify-center gap-1.5 bg-purple-600 hover:bg-purple-700 text-white py-3.5 rounded-2xl text-sm font-black transition disabled:opacity-30 disabled:cursor-not-allowed shadow-xl shadow-purple-200" disabled onclick="runAIAnalysis()"><i class="fa-solid fa-wand-magic-sparkles"></i> AI 통합 분석</button>
                            <button id="btn-do-compare" class="hidden w-36 flex items-center justify-center bg-blue-600 hover:bg-blue-700 text-white py-3.5 rounded-2xl text-sm font-black transition disabled:opacity-30 disabled:cursor-not-allowed shadow-xl shadow-blue-100" disabled onclick="goToCompare()">비교 분석 시작</button>
                            <button id="btn-back-to-board" class="hidden bg-blue-600 hover:bg-blue-700 text-white px-6 py-3.5 rounded-2xl text-sm font-black transition shadow-xl shadow-blue-100">목록으로 돌아가기</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- View Contexts -->
        <div id="view-board" class="hidden space-y-6 animate-fadeIn pb-20">
            <div id="retroGrid" class="flex flex-col gap-6 w-full"></div>
        </div>

        <div id="view-write" class="hidden space-y-8 animate-fadeIn pb-20">
            <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-gray-100 space-y-10">
                <div class="space-y-4">
                    <label class="flex items-center gap-2 text-sm font-black text-gray-800"><i class="fa-solid fa-quote-left text-blue-500"></i> 회고 제목</label>
                    <input type="text" id="write-title" class="w-full bg-gray-50 border-2 border-transparent rounded-2xl px-6 py-4 text-base font-bold focus:border-blue-500 focus:bg-white outline-none transition shadow-inner" placeholder="진행한 프로젝트나 활동의 주제를 적어주세요.">
                </div>
                <div class="space-y-4">
                    <label class="flex items-center gap-2 text-sm font-black text-gray-800"><i class="fa-solid fa-hashtag text-blue-500"></i> 태그</label>
                    <div id="selected-tags-chips" class="flex flex-wrap gap-2"></div>
                    <input type="text" id="write-tags" class="w-full bg-gray-50 border-2 border-transparent rounded-2xl px-6 py-4 text-sm font-bold focus:border-blue-500 focus:bg-white outline-none transition shadow-inner" placeholder="태그 입력 (쉼표 구분)">
                    <div class="pt-2"><p class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-3">인기 태그 추천</p><div id="tag-buttons-container" class="flex flex-wrap gap-2"></div></div>
                </div>
                <div class="grid grid-cols-1 gap-8">
                    <div class="bg-blue-50/30 p-8 rounded-[2rem] border border-blue-100/50 space-y-6">
                        <div class="flex justify-between items-center"><div class="flex items-center gap-2 text-blue-600 font-black text-lg"><i class="fa-solid fa-circle-check"></i> KEEP</div><button class="action-add-item bg-blue-500 text-white w-9 h-9 rounded-2xl hover:bg-blue-600 transition shadow-lg shadow-blue-200" data-section="keep"><i class="fa-solid fa-plus"></i></button></div>
                        <div id="write-keep-container" class="space-y-3"></div>
                    </div>
                    <div class="bg-red-50/30 p-8 rounded-[2rem] border border-red-100/50 space-y-6">
                        <div class="flex justify-between items-center"><div class="flex items-center gap-2 text-red-600 font-black text-lg"><i class="fa-solid fa-circle-exclamation"></i> PROBLEM</div><button class="action-add-item bg-red-500 text-white w-9 h-9 rounded-2xl hover:bg-red-600 transition shadow-lg shadow-red-200" data-section="problem"><i class="fa-solid fa-plus"></i></button></div>
                        <div id="write-problem-container" class="space-y-3"></div>
                    </div>
                    <div class="bg-green-50/30 p-8 rounded-[2rem] border border-green-100/50 space-y-6">
                        <div class="flex justify-between items-center"><div class="flex items-center gap-2 text-green-600 font-black text-lg"><i class="fa-solid fa-lightbulb"></i> TRY</div><button class="action-add-item bg-green-500 text-white w-9 h-9 rounded-2xl hover:bg-green-600 transition shadow-lg shadow-green-200" data-section="try"><i class="fa-solid fa-plus"></i></button></div>
                        <div id="write-try-container" class="space-y-3"></div>
                    </div>
                </div>
                <div class="flex justify-end gap-3 pt-8 border-t border-gray-100">
                    <button id="btn-write-cancel" class="px-8 py-4 bg-gray-50 text-gray-500 rounded-2xl text-sm font-black hover:bg-gray-100 transition">취소</button>
                    <button id="btn-write-submit" class="px-12 py-4 bg-blue-600 text-white rounded-2xl text-base font-black hover:bg-blue-700 transition shadow-xl shadow-blue-100">회고 등록하기</button>
                </div>
            </div>
        </div>

        <!-- Compare Contents -->
        <div id="view-compare" class="hidden space-y-8 animate-fadeIn pb-20">
            <div class="bg-white rounded-[2.5rem] shadow-sm border border-gray-100 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse min-w-[800px]">
                        <thead id="compare-thead" class="bg-gray-50/50 border-b border-gray-100"></thead>
                        <tbody id="compare-tbody" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- AI Summary Contents -->
        <div id="view-ai-summary" class="hidden space-y-8 animate-fadeIn pb-20">
            <div class="bg-white rounded-[2.5rem] shadow-sm border border-gray-100 overflow-hidden p-10">
                <div id="ai-summary-content">
                    <!-- AI content injected here -->
                </div>
            </div>
        </div>

    </div>
</main>

<div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none"></div>

<script>
    // --- State ---
    const apiKey = ""; // Runtime automatically injects the Gemini API key here
    let users = {};
    let currentUser = '';
    let retrospectives = [];
    let selectedForCompare = new Set();
    let selectedSuggestionTags = new Set();
    let filterTags = new Set();
    let expandedCards = new Set();
    let currentAuthMode = 'login';
    let editingRetroId = null;

    function load() {
        users = JSON.parse(localStorage.getItem('retro_users_v4') || '{}');

        if (Object.keys(users).length === 0) {
            users = {
                'test': { pw: '123', nickname: '테스터' }
            };
            localStorage.setItem('retro_users_v4', JSON.stringify(users));
        }

        currentUser = localStorage.getItem('retro_currentUser_v4') || '';
        let rawData = JSON.parse(localStorage.getItem('retro_data_v4') || '[]');

        if (rawData.length === 0) {
            rawData = [
                {
                    id: 1, author: '테스터', date: '2023. 11. 01', title: '신규 입사자 온보딩 주간',
                    tags: ['온보딩', 'React', '프론트엔드'], keep: ['온보딩 멘토링 세션이 실무 적응에 큰 도움이 됨', '팀 내 코드 컨벤션 규칙을 명확히 이해함'],
                    problem: ['개발 환경 세팅 문서 일부가 최신화되지 않아 오류 발생'], try: ['사내 위키 가이드 문서 최신화', '신규 입사자용 체크리스트 보강'],
                    likes: 4, likedBy: ['김개발', '최프론트'], comments: [{author: '김개발', text: '환영합니다! 문서 업데이트 부탁드려요.', date: '2023. 11. 02'}]
                },
                {
                    id: 2, author: '테스터', date: '2023. 11. 05', title: '공통 컴포넌트 마이그레이션',
                    tags: ['UI/UX', '디자인시스템', '프론트엔드'], keep: ['스토리북을 활용한 컴포넌트 시각화 및 문서화', '디자인 토큰 도입으로 일관성 확보'],
                    problem: ['기존 레거시 컴포넌트와의 의존성 문제로 예기치 못한 스타일 깨짐 발생'], try: ['의존성 그래프 사전 분석 도입', '점진적 마이그레이션 전략 수립'],
                    likes: 2, likedBy: ['이디자인'], comments: []
                },
                {
                    id: 3, author: '테스터', date: '2023. 11. 10', title: '렌더링 성능 개선 스프린트',
                    tags: ['성능최적화', 'React'], keep: ['React.memo와 useMemo를 적절히 활용하여 불필요한 렌더링 최소화'],
                    problem: ['특정 무거운 리스트 컴포넌트에서 여전히 프레임 드랍 발생'], try: ['가상화(Virtualization) 기법 도입 테스트', 'Lighthouse CI 파이프라인 연동'],
                    likes: 5, likedBy: ['정백엔드'], comments: []
                },
                {

    function showToast(msg, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        const bg = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-blue-600' : 'bg-gray-800';
        toast.className = `${bg} text-white px-6 py-4 rounded-2xl shadow-2xl text-xs font-black animate-fadeIn flex items-center gap-3 pointer-events-auto mb-2`;
        toast.innerHTML = `<span>${msg}</span>`;
        container.appendChild(toast);
        setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 400); }, 3000);
    }

    function getTagColorClass(tag) {
        let h = 0; for(let i=0; i<tag.length; i++) h = tag.charCodeAt(i) + ((h << 5) - h);
        return `tag-color-${Math.abs(h) % 6}`;
    }

    // --- Gemini API Logic ---
    async function callGeminiAPI(prompt, systemInstructionText, retries = 5) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
        const payload = {
            contents: [{ parts: [{ text: prompt }] }],
            systemInstruction: { parts: [{ text: systemInstructionText }] }
        };

        let delay = 1000;
        for (let i = 0; i < retries; i++) {
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "분석 결과를 생성하지 못했습니다.";
            } catch (e) {
                if (i === retries - 1) throw e;
                await new Promise(resolve => setTimeout(resolve, delay));
                delay *= 2;
            }
        }
    }

    async function runAIAnalysis() {
        if (selectedForCompare.size < 2) return showToast("2개 이상의 회고를 선택해야 AI 분석이 가능합니다.", "error");
        if (filterTags.size === 0) return showToast("하나 이상의 태그를 선택(필터링)해야 AI 분석이 가능합니다.", "error");

        document.getElementById('ai-summary-tab-container').classList.remove('hidden');
        switchTab('ai-summary');

        const contentBox = document.getElementById('ai-summary-content');
        contentBox.innerHTML = `
                <div class="flex flex-col items-center justify-center py-24 text-purple-600">
                    <i class="fa-solid fa-spinner fa-spin text-5xl mb-6"></i>
                    <p class="font-black text-xl animate-pulse tracking-tight">AI가 선택된 회고들을 통합적으로 분석하고 있습니다...</p>
                    <p class="text-sm text-gray-400 mt-3 font-bold">잠시만 기다려주세요 (최대 10~15초 소요)</p>
                </div>
            `;

        const selectedData = retrospectives.filter(r => selectedForCompare.has(r.id));

        // 공통 태그 추출 로직
        let commonTags = [];
        if (selectedData.length > 0) {
            commonTags = selectedData[0].tags.filter(tag => selectedData.every(r => r.tags.includes(tag)));
        }

        const systemInstruction = `당신은 프로젝트 관리 전문가이자 회고 분석가입니다. 주어진 여러 프로젝트의 회고 데이터를 KPT(Keep, Problem, Try) 기준으로 엄격히 분류하여 요약하고 통찰력 있는 분석을 제공하세요.
규칙:
1. 반드시 'Keep', 'Problem', 'Try' 3가지 섹션으로 나누어 답변하세요.
2. 각 분류별 분석 및 요약 내용은 반드시 4줄 이내로 핵심만 간결하게 작성하세요.
3. 응답은 마크다운(Markdown) 기호를 전혀 사용하지 말고, 오직 깔끔한 HTML 태그(<h3>, <ul>, <li>, <strong>, <p>, <div>, <span> 등) 구조로만 작성해서 반환하세요.`;

        let promptText = "";
        if (commonTags.length > 0) {
            promptText += `선택된 회고들은 공통적으로 [${commonTags.join(', ')}] 주제(태그)를 다루고 있습니다. 이 주제를 중심으로 여러 프로젝트에서 나타난 K, P, T 요소를 통합 분석하고 요약해주세요.\n\n`;
        } else {
            promptText += `주어진 다양한 프로젝트의 회고 데이터를 바탕으로 K, P, T 기준에 맞춰 종합적인 분석과 요약을 진행해주세요.\n\n`;
        }

        if (selectedData.length >= 5) {
            promptText += `[중요 요청] 제공된 회고 데이터가 5개 이상입니다. 상세 분석 결과 최상단에, 전체 회고에서 공통적으로 빈번하게 등장하는 핵심 단어나 키워드들을 K, P, T 분류별로 추출하여 시각적인 '키워드 인포그래픽' 영역을 먼저 생성해주세요. (HTML <div>와 다채로운 색상의 <span> 뱃지, 이모지를 활용하여 가시성 좋게 꾸며주세요.)\n\n`;
        }

        promptText += `다음은 특정 주제를 공유하는 여러 프로젝트의 회고 데이터 모음입니다. 이들을 종합적으로 분석하여 공통적인 '주요 성공 요인과 강점', '자주 발생하는 병목이나 문제점', '향후 유사 프로젝트에서 참고할 만한 개선 방향(액션 아이템)'을 중심으로 심도있는 요약 리포트를 작성해주세요.\n\n[선택된 회고 목록]\n`;
        selectedData.forEach((r, idx) => {
            promptText += `\n${idx + 1}. 제목: ${r.title} (작성자: ${r.author})\n`;
            promptText += `  - Keep: ${r.keep.length ? r.keep.join(' / ') : '없음'}\n`;
            promptText += `  - Problem: ${r.problem.length ? r.problem.join(' / ') : '없음'}\n`;
            promptText += `  - Try: ${r.try.length ? r.try.join(' / ') : '없음'}\n`;
        });

        try {
            const responseText = await callGeminiAPI(promptText, systemInstruction);
            const cleanHTML = responseText.replace(/```html/g, '').replace(/```/g, '').trim();
            contentBox.innerHTML = cleanHTML;
        } catch (err) {
            contentBox.innerHTML = `
                    <div class="py-20 text-center text-red-500 font-bold">
                        <i class="fa-solid fa-triangle-exclamation text-4xl mb-4"></i>
                        <p class="text-lg">분석 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.</p>
                    </div>
                `;
        }
    }

    }

    function renderAITagsChips() {
        const container = document.getElementById('active-filter-chips');
        container.innerHTML = '';
        const selectedData = retrospectives.filter(r => selectedForCompare.has(r.id));
        let aiTags = new Set();
        selectedData.forEach(r => r.tags.forEach(t => aiTags.add(t)));

        // 필터링에 사용된 핵심 태그와 나머지 연관 태그를 분리하여 정렬
        const coreTags = Array.from(aiTags).filter(t => filterTags.has(t)).sort((a, b) => a.localeCompare(b));
        const otherTags = Array.from(aiTags).filter(t => !filterTags.has(t)).sort((a, b) => a.localeCompare(b));

        // 핵심 태그 우선 렌더링 (강조 스타일 적용)
        coreTags.forEach(tag => {
            const chip = document.createElement('span');
            chip.className = `px-3 py-1.5 rounded-full text-[11px] font-black shadow-md flex items-center gap-1.5 border-2 ring-2 ring-offset-1 ring-purple-300 animate-fadeIn ${getTagColorClass(tag)}`;
            chip.innerHTML = `<i class="fa-solid fa-star text-yellow-500 drop-shadow-sm"></i> #${tag} <span class="bg-white/60 px-1.5 py-0.5 rounded text-[9px] ml-0.5 border border-current opacity-80">핵심</span>`;
            container.appendChild(chip);
        });

        // 나머지 연관 태그 렌더링 (약간 투명하게 처리)
        otherTags.forEach(tag => {
            const chip = document.createElement('span');
            chip.className = `px-3 py-1 rounded-full text-[10px] font-bold shadow-sm flex items-center gap-2 border animate-fadeIn opacity-60 ${getTagColorClass(tag)}`;
            chip.innerHTML = `#${tag}`;
            container.appendChild(chip);
        });
    }

    // --- Auth Functions ---
    function toggleAuthMode(mode) {
        currentAuthMode = mode;
        resetAuthInputs();
        document.getElementById('signup-extra-fields').classList.toggle('hidden', mode === 'login');
        document.getElementById('login-actions').classList.toggle('hidden', mode === 'signup');
        document.getElementById('signup-actions').classList.toggle('hidden', mode === 'login');
        document.getElementById('auth-title').textContent = mode === 'login' ? "로그인" : "회원가입";
    }

    function handleLogin() {
        const id = document.getElementById('auth-id').value.trim();
        const pw = document.getElementById('auth-pw').value.trim();
        if(!users[id] || users[id].pw !== pw) return showToast("계정 정보를 확인하세요.", "error");
        loginUser(users[id].nickname || id);
    }

    function handleSignup() {
        const id = document.getElementById('auth-id').value.trim();
        const pw = document.getElementById('auth-pw').value.trim();
        const pwConfirm = document.getElementById('auth-pw-confirm').value.trim();
        const nick = document.getElementById('auth-nickname').value.trim();
        if(!id || !pw || !nick) return showToast("필수 정보를 입력하세요.", "error");
        if(pw !== pwConfirm) return showToast("비밀번호 확인이 일치하지 않습니다.", "error");
        if(users[id]) return showToast("이미 사용 중인 아이디입니다.", "error");
        users[id] = { pw, nickname: nick };
        localStorage.setItem('retro_users_v4', JSON.stringify(users));
        loginUser(nick);
    }

    function handleGuestLogin() {
        showToast("게스트로 입장합니다.");
        loginUser("게스트");
    }

    function loginUser(name) {
        currentUser = name;
        localStorage.setItem('retro_currentUser_v4', currentUser);
        resetAuthInputs();
        updateUserUI();
        switchTab('board');
    }

    function logout() {
        currentUser = '';
        localStorage.removeItem('retro_currentUser_v4');
        resetAuthInputs();
        updateUserUI();
        switchTab('auth');
        toggleAuthMode('login');
    }

    function updateUserUI() {
        document.getElementById('currentUserDisplay').textContent = currentUser ? `${currentUser} 님` : "로그인 필요";
        document.getElementById('auth-btn').classList.toggle('hidden', !currentUser);
        document.getElementById('nav-tabs').classList.toggle('hidden', !currentUser);
        document.getElementById('tab-write').classList.toggle('hidden', currentUser === '게스트');
    }

    // --- Navigation ---
    function switchTab(tab) {
        ['board', 'write', 'compare', 'auth', 'filter', 'ai-summary'].forEach(t => {
            const btn = document.getElementById(`tab-${t}`); if(btn) btn.classList.toggle('tab-active', t === tab);
            const view = document.getElementById(`view-${t}`);
            if(view) {
                if (tab === 'filter' && t === 'board') view.classList.remove('hidden');
                else view.classList.toggle('hidden', t !== tab);
            }
        });

        if (tab === 'filter') document.getElementById('view-board').classList.remove('hidden');

        const headerCont = document.getElementById('view-header-container');
        const hIcon = document.getElementById('header-icon');
        const hIconBox = document.getElementById('header-icon-box');
        const hTitle = document.getElementById('view-title');
        const hDesc = document.getElementById('view-desc');
        const compareAllBtn = document.getElementById('btn-compare-all');
        const compareBtn = document.getElementById('btn-do-compare');
        const aiBtn = document.getElementById('btn-ai-analyze');
        const clearSelBtn = document.getElementById('btn-clear-selection');
        const backBtn = document.getElementById('btn-back-to-board');
        const activeFilterChipsContainer = document.getElementById('active-filter-chips');

        if (activeFilterChipsContainer) {
            if (tab === 'filter') {
                activeFilterChipsContainer.classList.remove('opacity-0', 'pointer-events-none');
                renderFilterChips();
            } else if (tab === 'ai-summary') {
                activeFilterChipsContainer.classList.remove('opacity-0', 'pointer-events-none');
                renderAITagsChips();
            } else {
                activeFilterChipsContainer.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        if (tab === 'auth') headerCont.classList.add('hidden');
        else {
            headerCont.classList.remove('hidden');
            backBtn.classList.add('hidden');
            compareBtn.classList.add('hidden');
            compareAllBtn.classList.add('hidden');
            aiBtn.classList.add('hidden');
            if(clearSelBtn) clearSelBtn.classList.add('hidden');
            hIconBox.className = "bg-blue-500 text-white p-2.5 rounded-xl shadow-sm";

            if(tab === 'board' || tab === 'filter') {
                hIcon.className = "fa-solid fa-layer-group";
                hTitle.textContent = tab === 'filter' ? "필터링 결과" : "전체 회고";
                hDesc.textContent = "다양한 프로젝트 경험이 담긴 생생한 회고들을 만나보세요.";
                compareBtn.classList.remove('hidden');
                aiBtn.classList.remove('hidden');
                if(clearSelBtn) clearSelBtn.classList.remove('hidden');

                updateCompareBtn();

                if (tab === 'filter') {
                    let data = retrospectives.filter(r => Array.from(filterTags).every(t => r.tags.includes(t)));
                    if (data.length >= 2) compareAllBtn.classList.remove('hidden');
                }

            } else if(tab === 'write') {
                hIcon.className = "fa-solid fa-pen-nib";
                hTitle.textContent = editingRetroId ? "회고 수정" : "내 회고 작성";
                hDesc.textContent = editingRetroId ? "기존에 작성한 내용을 수정합니다." : "오늘의 배움과 성장을 기록하세요.";
                document.getElementById('btn-write-submit').textContent = editingRetroId ? "수정 완료" : "회고 등록하기";
                if (!editingRetroId) resetWriteInputs();
            } else if(tab === 'compare') {
                hIcon.className = "fa-solid fa-code-compare";
                hTitle.textContent = "비교 분석";
                hDesc.textContent = "선택한 회고들을 병렬로 비교 분석합니다.";
                backBtn.classList.remove('hidden');
                backBtn.textContent = "목록으로 돌아가기";
                backBtn.className = "bg-blue-600 hover:bg-blue-700 text-white px-6 py-3.5 rounded-2xl text-sm font-black transition shadow-xl shadow-blue-100";
            } else if(tab === 'ai-summary') {
                hIcon.className = "fa-solid fa-wand-magic-sparkles";
                hIconBox.className = "bg-purple-600 text-white p-2.5 rounded-xl shadow-sm shadow-purple-200";
                hTitle.textContent = "AI 통합 분석 리포트";
                hDesc.textContent = "선택된 회고들을 바탕으로 도출된 통합 인사이트입니다.";
                backBtn.classList.remove('hidden');
                backBtn.textContent = "목록으로 돌아가기";
                backBtn.className = "bg-gray-800 hover:bg-gray-900 text-white px-6 py-3.5 rounded-2xl text-sm font-black transition shadow-xl shadow-gray-200";
            }
        }

        const filterCont = document.getElementById('filter-tab-container');
        filterCont.classList.toggle('hidden', filterTags.size === 0);

        if (tab !== 'ai-summary') {
            document.getElementById('tab-ai-summary').classList.remove('tab-active');
        }

        if (tab === 'board' || tab === 'filter') renderBoard();
        if (tab === 'compare') renderCompareView();

        scrollToTop();
    }

    function setFilter(tag) {
        if (filterTags.has(tag)) filterTags.delete(tag); else filterTags.add(tag);
        renderFilterChips();
        switchTab(filterTags.size > 0 ? 'filter' : 'board');
    }

    function renderFilterChips() {
        const container = document.getElementById('active-filter-chips');
        container.innerHTML = '';
        filterTags.forEach(tag => {
            const chip = document.createElement('span');
            chip.className = `px-3 py-1 rounded-full text-[10px] font-black shadow-sm flex items-center gap-2 border cursor-pointer animate-fadeIn ${getTagColorClass(tag)}`;
            chip.innerHTML = `#${tag} <i class="fa-solid fa-xmark opacity-50"></i>`;
            chip.onclick = () => setFilter(tag);
            container.appendChild(chip);
        });
    }

    function clearFilter() {
        filterTags.clear();
        renderFilterChips();
        switchTab('board');
    }

    // --- Board & Interaction ---

                            <div class="flex items-center gap-4"><div class="flex items-center gap-2 text-red-600 font-black text-xs w-24 flex-shrink-0"><i class="fa-solid fa-circle-exclamation"></i> PROBLEM</div><span class="text-xs font-bold text-gray-600 truncate">${getSum(retro.problem)}</span></div>
                            <div class="flex items-center gap-4"><div class="flex items-center gap-2 text-green-600 font-black text-xs w-24 flex-shrink-0"><i class="fa-solid fa-lightbulb"></i> TRY</div><span class="text-xs font-bold text-gray-600 truncate">${getSum(retro.try)}</span></div>
                        </div>
                        <div class="absolute bottom-2 left-1/2 -translate-x-1/2 text-gray-300 chevron-icon transition-transform" style="${isExp ? 'transform: rotate(180deg)' : ''}"><i class="fa-solid fa-chevron-down text-xs"></i></div>
                    </div>
                    <div class="card-details border-t-2 border-gray-100 bg-gray-50/30">

                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div class="bg-blue-50/40 p-6 rounded-[2rem] border border-blue-100">
                                    <div class="flex items-center gap-2 text-blue-600 font-black text-sm mb-4"><i class="fa-solid fa-circle-check"></i> KEEP</div>
                                    ${retro.keep.length ? `<div class="space-y-3">${retro.keep.map(k => `<div class="bg-white p-4 rounded-2xl text-sm font-bold text-gray-700 leading-relaxed shadow-sm">${k}</div>`).join('')}</div>` : `<div class="flex items-center gap-2 text-gray-400 italic font-medium p-4 bg-white rounded-2xl border border-dashed border-gray-200"><i class="fa-solid fa-ghost opacity-50"></i> 내용 없음</div>`}
                                </div>
                                <div class="bg-red-50/40 p-6 rounded-[2rem] border border-red-100">
                                    <div class="flex items-center gap-2 text-red-600 font-black text-sm mb-4"><i class="fa-solid fa-circle-exclamation"></i> PROBLEM</div>
                                    ${retro.problem.length ? `<div class="space-y-3">${retro.problem.map(p => `<div class="bg-white p-4 rounded-2xl text-sm font-bold text-gray-700 leading-relaxed shadow-sm">${p}</div>`).join('')}</div>` : `<div class="flex items-center gap-2 text-gray-400 italic font-medium p-4 bg-white rounded-2xl border border-dashed border-gray-200"><i class="fa-solid fa-ghost opacity-50"></i> 내용 없음</div>`}

                                                <div class="flex gap-2 justify-center">

                                <div class="flex gap-2 relative no-toggle"><input type="text" id="comment-input-${retro.id}" class="w-full bg-gray-50 border-2 border-transparent rounded-2xl pl-5 pr-20 py-4 text-xs font-bold outline-none focus:border-blue-300 focus:bg-white transition" placeholder="작성자에게 피드백을 남겨주세요..."><button class="absolute right-2 top-2 bottom-2 bg-gray-900 text-white px-5 rounded-xl text-xs font-black" onclick="addComment(${retro.id})">등록</button></div>

    function toggleCard(id, event) {
        if (event.target.closest('.no-toggle')) return;
        if (expandedCards.has(id)) expandedCards.delete(id); else expandedCards.add(id);
        renderBoard();
    }

    function toggleLike(id) {
        const r = retrospectives.find(it => it.id === id);
        const idx = r.likedBy.indexOf(currentUser);
        if (idx > -1) { r.likedBy.splice(idx,1); r.likes--; }
        else { r.likedBy.push(currentUser); r.likes++; }
        save(); renderBoard();
    }

    function addComment(id) {
        const inp = document.getElementById(`comment-input-${id}`);
        const text = inp.value.trim(); if(!text) return;
        const r = retrospectives.find(it => it.id === id);
        r.comments.push({ author: currentUser, text, date: new Date().toLocaleDateString() });
        save(); renderBoard();
    }

    // --- Edit & Delete Logic ---
    function showDeleteConfirm(id) {
        const popup = document.getElementById(`delete-confirm-${id}`);
        if (popup) popup.classList.remove('hidden');
    }

    function hideDeleteConfirm(id) {
        const popup = document.getElementById(`delete-confirm-${id}`);
        if (popup) popup.classList.add('hidden');
    }

    function deleteRetro(id) {
        retrospectives = retrospectives.filter(it => it.id !== id);
        selectedForCompare.delete(id);
        expandedCards.delete(id);
        save();
        showToast("게시글이 삭제되었습니다.", "success");
        renderBoard();
        updateCompareBtn();
        scrollToTop();
    }

    function editRetro(id) {
        const r = retrospectives.find(it => it.id === id);
        if (!r) return;
        editingRetroId = id;

        switchTab('write');

        document.getElementById('write-title').value = r.title;
        selectedSuggestionTags.clear();
        r.tags.forEach(t => selectedSuggestionTags.add(t));
        renderSelectedChips();
        updateTagSuggestions();

        ['keep', 'problem', 'try'].forEach(key => {
            const cont = document.getElementById(`write-${key}-container`);
            cont.innerHTML = '';
            if (r[key].length === 0) {
                addKptInput(key);
            } else {
                r[key].forEach(val => {
                    addKptInput(key);
                    const inputs = cont.querySelectorAll(`.write-${key}-input`);
                    inputs[inputs.length - 1].value = val;
                });
            }
        });
    }

    function toggleCompare(id, check) {
        if(check) selectedForCompare.add(id); else selectedForCompare.delete(id);
        updateCompareBtn();
    }

    function selectAllFiltered() {
        let data = filterTags.size > 0 ? retrospectives.filter(r => Array.from(filterTags).every(t => r.tags.includes(t))) : [];
        if (data.length < 2) return;

        selectedForCompare.clear();
        data.forEach(r => selectedForCompare.add(r.id));

        updateCompareBtn();
        renderBoard();
        showToast("필터링된 모든 결과가 선택되었습니다.", "success");
    }

    function updateCompareBtn() {
        const count = selectedForCompare.size;
        document.getElementById('compareCount').textContent = count;

        const btn = document.getElementById('btn-do-compare');
        const aiBtn = document.getElementById('btn-ai-analyze');
        if(btn) btn.disabled = count < 2;
        if(aiBtn) aiBtn.disabled = count < 2 || filterTags.size === 0;

        const tab = document.getElementById('tab-compare');
        if(tab) tab.classList.toggle('hidden', count < 2);

        const clearBtn = document.getElementById('btn-clear-selection');
        if(clearBtn) {
            clearBtn.disabled = count === 0;
            document.getElementById('selected-count-display').textContent = count;

            const badge = document.getElementById('selected-count-display');
            if (count > 0) {
                badge.classList.remove('bg-gray-300', 'text-gray-700');
                badge.classList.add('bg-blue-500', 'text-white');
            } else {
                badge.classList.add('bg-gray-300', 'text-gray-700');
                badge.classList.remove('bg-blue-500', 'text-white');
            }
        }
    }

    function clearSelection() {
        selectedForCompare.clear();
        updateCompareBtn();
        renderBoard();
    }

    function goToCompare() { switchTab('compare'); }

    // --- Write View Logic ---
    function addKptInput(section) {
        const container = document.getElementById(`write-${section}-container`);
        const div = document.createElement('div');
        div.className = "flex items-center gap-2 animate-fadeIn";
        div.innerHTML = `<input type="text" class="write-${section}-input w-full bg-white border-2 border-${section==='keep'?'blue':section==='problem'?'red':'green'}-100 rounded-2xl px-5 py-3.5 text-sm font-bold outline-none focus:ring-2 focus:ring-${section==='keep'?'blue':section==='problem'?'red':'green'}-400 shadow-sm" placeholder="내용 입력"><button class="text-gray-300 hover:text-red-500 transition-colors no-toggle" onclick="this.parentElement.remove()"><i class="fa-solid fa-circle-minus text-xl"></i></button>`;
        container.appendChild(div);
    }

    function updateTagSuggestions() {
        const counts = {}; retrospectives.forEach(r => r.tags.forEach(t => counts[t] = (counts[t]||0)+1));
        const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
        const container = document.getElementById('tag-buttons-container');
        container.innerHTML = '';
        sorted.forEach(([tag, count]) => {
            const btn = document.createElement('button');
            const isActive = selectedSuggestionTags.has(tag);
            btn.className = `tag-pill px-4 py-2 border-2 rounded-xl text-xs font-black shadow-sm transition ${getTagColorClass(tag)} ${isActive?'ring-4 ring-blue-500/30':''}`;
            btn.innerHTML = `#${tag} <span class="opacity-50 ml-1">${count}</span>`;
            btn.onclick = () => { if(selectedSuggestionTags.has(tag)) selectedSuggestionTags.delete(tag); else selectedSuggestionTags.add(tag); updateTagSuggestions(); renderSelectedChips(); };
            container.appendChild(btn);
        });
    }

    function renderSelectedChips() {
        const container = document.getElementById('selected-tags-chips');
        container.innerHTML = '';
        selectedSuggestionTags.forEach(t => {
            const chip = document.createElement('span');
            chip.className = `px-4 py-1.5 rounded-full text-[10px] font-black shadow-sm flex items-center gap-2 ${getTagColorClass(t)}`;
            chip.innerHTML = `#${t} <i class="fa-solid fa-lock text-[8px] opacity-30"></i>`;
            container.appendChild(chip);
        });
    }

    function submitRetrospective() {
        const title = document.getElementById('write-title').value.trim();
        const manual = document.getElementById('write-tags').value.split(',').map(t=>t.trim()).filter(t=>t);
        const allTags = [...new Set([...selectedSuggestionTags, ...manual])];
        const keep = Array.from(document.querySelectorAll('.write-keep-input')).map(i=>i.value.trim()).filter(i=>i);
        const problem = Array.from(document.querySelectorAll('.write-problem-input')).map(i=>i.value.trim()).filter(i=>i);
        const tries = Array.from(document.querySelectorAll('.write-try-input')).map(i=>i.value.trim()).filter(i=>i);

        if(!title || (!keep.length && !problem.length && !tries.length)) return showToast("제목과 최소 1개 이상의 내용을 적어주세요.", "error");

        if (editingRetroId) {
            const index = retrospectives.findIndex(r => r.id === editingRetroId);
            if (index > -1) {
                retrospectives[index].title = title;
                retrospectives[index].tags = allTags;
                retrospectives[index].keep = keep;
                retrospectives[index].problem = problem;
                retrospectives[index].try = tries;
            }
            editingRetroId = null;
            showToast("성공적으로 수정되었습니다!", "success");
        } else {
            retrospectives.push({ id: Date.now(), author: currentUser, date: new Date().toLocaleDateString(), title, tags: allTags, keep, problem, try: tries, likes: 0, likedBy: [], comments: [] });
            showToast("성공적으로 등록되었습니다!", "success");
        }

        save(); switchTab('board');
    }

    // --- Compare View ---
    function renderCompareView() {
        const items = retrospectives.filter(r => selectedForCompare.has(r.id));
        const thead = document.getElementById('compare-thead');
        const tbody = document.getElementById('compare-tbody');
        thead.innerHTML = `<tr><th class="p-6 border-r text-[10px] font-black uppercase text-gray-400 bg-gray-50/50 w-32 text-center tracking-widest align-top pt-10">CATEGORY</th>${items.map(it => {
            const sortedTags = [...it.tags].sort((a, b) => a.localeCompare(b));
            return `
                <th class="p-8 border-r min-w-[320px] bg-white relative align-top">
                    <button class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full bg-red-50 text-red-500 hover:bg-red-500 hover:text-white transition disabled:opacity-20 disabled:cursor-not-allowed no-toggle" ${items.length <= 2 ? 'disabled' : ''} onclick="toggleCompare(${it.id}, false); renderCompareView();"><i class="fa-solid fa-xmark"></i></button>
                    <div class="space-y-4">
                        <div class="text-base font-black text-blue-600 flex items-center gap-2.5 mb-1">
                            <div class="w-8 h-8 rounded-full bg-blue-50 flex items-center justify-center text-xs border border-blue-100 shadow-sm font-bold text-blue-600">${it.author.charAt(0)}</div>
                            ${it.author}
                        </div>
                        <div class="text-xl font-black text-gray-900 leading-tight">${it.title}</div>
                        <div class="flex flex-wrap gap-1">${sortedTags.map(t => `<span class="px-2 py-0.5 border-2 rounded-lg text-[10px] font-black ${getTagColorClass(t)}">#${t}</span>`).join('')}</div>
                    </div>
                </th>`;
        }).join('')}</tr>`;
        tbody.innerHTML = '';

        const iconMap = {
            keep: { icon: 'fa-solid fa-circle-check', color: 'text-blue-500' },
            problem: { icon: 'fa-solid fa-circle-exclamation', color: 'text-red-500' },
            try: { icon: 'fa-solid fa-lightbulb', color: 'text-green-500' }
        };

        ['keep', 'problem', 'try'].forEach(key => {
            const { icon, color } = iconMap[key];
            let row = `<tr><td class="p-8 font-black text-center border-r uppercase text-xs ${key==='keep'?'text-blue-600 bg-blue-50/30':key==='problem'?'text-red-600 bg-red-50/30':'text-green-600 bg-green-50/30'} align-middle"><div class="flex flex-col items-center gap-1"><i class="${icon} text-lg mb-1"></i>${key}</div></td>`;
            items.forEach(it => {
                const content = it[key].length
                    ? `<div class="space-y-3">${it[key].map(c => `
                            <div class="bg-white p-4 rounded-2xl text-sm font-bold text-gray-700 leading-relaxed shadow-sm flex gap-3 items-start border border-gray-50">
                                <i class="${icon} ${color} mt-0.5 opacity-80"></i>
                                <span>${c}</span>
                            </div>`).join('')}</div>`
                    : `<div class="flex items-center gap-2 text-gray-400 italic font-medium p-4 bg-gray-50/50 rounded-2xl border border-dashed border-gray-200"><i class="fa-solid fa-ghost opacity-50"></i> 내용 없음</div>`;
                row += `<td class="p-8 border-r bg-white align-top">${content}</td>`;
            });
            tbody.innerHTML += row + `</tr>`;
        });
    }

    // --- Init ---
    function setupEvents() {
        // 로그인/회원가입 엔터 키 바인딩
        document.getElementById('auth-id').addEventListener('keydown', (e) => { if(e.key === 'Enter') handleLogin(); });
        document.getElementById('auth-pw').addEventListener('keydown', (e) => { if(e.key === 'Enter') handleLogin(); });
        document.getElementById('auth-pw-confirm').addEventListener('keydown', (e) => { if(e.key === 'Enter') handleSignup(); });
        document.getElementById('auth-nickname').addEventListener('keydown', (e) => { if(e.key === 'Enter') handleSignup(); });

        document.getElementById('btn-login').onclick = handleLogin;
        document.getElementById('btn-show-signup').onclick = () => toggleAuthMode('signup');
        document.getElementById('btn-cancel-signup').onclick = () => toggleAuthMode('login');
        document.getElementById('btn-complete-signup').onclick = handleSignup;
        document.getElementById('btn-guest').onclick = handleGuestLogin;
        document.getElementById('auth-btn').onclick = logout;
        document.getElementById('tab-board').onclick = () => { clearFilter(); switchTab('board'); };
        document.getElementById('tab-write').onclick = () => switchTab('write');
        document.getElementById('tab-compare').onclick = () => switchTab('compare');
        document.getElementById('tab-ai-summary').onclick = () => switchTab('ai-summary');
        document.getElementById('tab-filter').onclick = (e) => {
            if(!e.target.classList.contains('fa-circle-xmark')) switchTab('filter');
        };
        document.getElementById('btn-compare-all').onclick = selectAllFiltered;
        document.getElementById('btn-do-compare').onclick = goToCompare;
        document.getElementById('btn-back-to-board').onclick = () => switchTab(filterTags.size > 0 ? 'filter' : 'board');
        document.getElementById('btn-write-cancel').onclick = () => { editingRetroId = null; switchTab(filterTags.size > 0 ? 'filter' : 'board'); };
        document.getElementById('btn-write-submit').onclick = submitRetrospective;
        document.querySelectorAll('.action-add-item').forEach(b => b.onclick = (e) => addKptInput(e.currentTarget.dataset.section));
    }

    window.onload = function() { load(); setupEvents(); updateUserUI(); if(!currentUser) switchTab('auth'); else switchTab('board'); };
</script>
</body>
</html>
