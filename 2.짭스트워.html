<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>라스트워 스타일 3D 슈팅 게임 (업그레이드)</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #000;
        overflow: hidden;
        font-family: "Arial", sans-serif;
        touch-action: none;
      }
      #gameContainer {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* --- UI 및 화면 스타일 --- */
      #uiLayer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: hidden;
        display: none;
      }

      /* 로딩 화면 */
      #loadingScreen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #0a5c7a;
        display: none;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        color: white;
        z-index: 200;
      }
      #loadingScreen h1 {
        font-family: "Bangers", cursive;
        font-size: 50px;
        letter-spacing: 3px;
        margin-bottom: 10px;
        text-shadow: 2px 2px 0 #000;
      }
      #loadStatus {
        font-size: 20px;
        color: #f1c40f;
        text-align: center;
        padding: 0 20px;
        font-weight: bold;
      }

      /* 메뉴 스크린 (시작 & 스테이지 선택) */
      .menu-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 300;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: #111;
      }
      #startScreen {
        background-color: #111;
        background-image:
          url("https://lh3.googleusercontent.com/d/145w-ckgXiW6_MnoZkdFqNCxyS6g33M3Y"),
          url("https://images.unsplash.com/photo-1506466010722-395aa2bef877?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80");
        background-repeat: no-repeat;
        background-position: center center;
        background-size: cover;
        justify-content: flex-end;
        padding-bottom: 15vh;
      }
      #stageScreen {
        background-color: #111;
        background-image:
          url("https://lh3.googleusercontent.com/d/1aXOv7Yevq-_tcfoLNNLv0Oco70irj7Ej"),
          url("https://images.unsplash.com/photo-1614728263952-84ea256f9679?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80");
        background-repeat: no-repeat;
        background-position: center center;
        background-size: cover;
        display: none;
      }

      .panel {
        background: rgba(0, 0, 0, 0.8);
        padding: 30px;
        border-radius: 15px;
        text-align: center;
        border: 3px solid #f1c40f;
        box-shadow: 0 0 20px #f1c40f;
        color: white;
      }
      .panel h2 {
        font-family: "Bangers", cursive;
        font-size: 36px;
        margin: 0 0 15px 0;
        color: #f1c40f;
        letter-spacing: 2px;
      }
      .panel select {
        width: 100%;
        padding: 10px;
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 20px;
        background: #333;
        color: white;
        border: 2px solid #555;
        border-radius: 8px;
        outline: none;
      }

      #scoreBoard {
        position: absolute;
        top: 20px;
        left: 20px;
        font-size: 32px;
        color: #f1c40f;
        font-weight: 900;
        text-shadow:
          2px 2px 0 #000,
          -1px -1px 0 #000,
          1px -1px 0 #000,
          -1px 1px 0 #000;
        z-index: 10;
      }
      #bossWarning {
        display: none;
        position: absolute;
        top: 20%;
        width: 100%;
        text-align: center;
        font-size: 50px;
        color: #ff3333;
        font-weight: 900;
        text-shadow:
          0 0 20px #ff0000,
          2px 2px 0 #000;
        animation: blink 0.5s infinite alternate;
        z-index: 10;
      }
      @keyframes blink {
        from {
          opacity: 1;
          transform: scale(1);
        }
        to {
          opacity: 0.5;
          transform: scale(1.1);
        }
      }

      #gameOverScreen {
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        background: rgba(0, 0, 0, 0.85);
        padding: 40px;
        border-radius: 20px;
        pointer-events: auto;
        color: white;
        box-shadow: 0 0 30px rgba(231, 76, 60, 0.8);
        border: 3px solid #c0392b;
        z-index: 100;
        min-width: 300px;
      }
      #gameOverScreen h1 {
        color: #e74c3c;
        margin: 0 0 15px 0;
        font-size: 42px;
        font-family: "Bangers", cursive;
      }
      #gameOverScreen p {
        font-size: 20px;
        margin-bottom: 35px;
        color: #ecf0f1;
      }

      button.action-btn {
        padding: 15px 40px;
        font-size: 28px;
        font-family: "Bangers", cursive;
        letter-spacing: 2px;
        background: linear-gradient(to bottom, #f1c40f, #f39c12);
        color: #000;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 5px #d35400;
        transition: all 0.1s;
      }
      button.action-btn:active {
        transform: translateY(5px);
        box-shadow: 0 0 #d35400;
      }
      button.retry-btn {
        background: linear-gradient(to bottom, #3498db, #2980b9);
        color: white;
        box-shadow: 0 5px #1c598a;
        margin: 5px;
      }
      button.retry-btn:active {
        box-shadow: 0 0 #1c598a;
      }

      .dynamic-label {
        position: absolute;
        transform: translate(-50%, -50%);
        font-weight: 900;
        text-align: center;
        text-shadow:
          2px 2px 0 #000,
          -1px -1px 0 #000,
          1px -1px 0 #000,
          -1px 1px 0 #000;
        pointer-events: none;
        display: none;
        min-width: 50px;
      }
      .hp-label,
      .player-label {
        color: #ffffff;
        font-size: 24px;
      }
      .boss-hp-label {
        color: #ffcccc;
        font-size: 40px;
        min-width: 150px;
      }
      .hp-bar-container {
        width: 100%;
        height: 10px;
        background: rgba(0, 0, 0, 0.7);
        border: 2px solid #fff;
        border-radius: 5px;
        margin-top: 3px;
        overflow: hidden;
      }
      .hp-bar-fill {
        height: 100%;
        background: #2ecc71;
        width: 100%;
        transition: width 0.1s;
      }
      .player-label .hp-bar-container {
        border-color: #3498db;
      }

      .damage-text {
        position: absolute;
        font-family: "Bangers", cursive;
        font-size: 44px;
        text-shadow:
          2px 2px 0 #000,
          -2px -2px 0 #000,
          2px -2px 0 #000,
          -2px 2px 0 #000,
          4px 4px 0 rgba(0, 0, 0, 0.5);
        pointer-events: none;
        z-index: 60;
        transform: translate(-50%, -50%);
        letter-spacing: 2px;
      }
    </style>
    <!-- Three.js 및 로더 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MD2Loader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
  </head>
  <body>
    <div id="gameContainer">
      <!-- 시작 화면 -->
      <div id="startScreen" class="menu-screen">
        <button id="btnGoStage" class="action-btn">TAP TO START</button>
      </div>

      <!-- 스테이지 선택 화면 -->
      <div id="stageScreen" class="menu-screen">
        <div class="panel">
          <h2>SELECT STAGE</h2>
          <select id="selStage">
            <option value="1">STAGE 1 : Ocean Bridge</option>
            <option value="2">STAGE 2 : Lava Zone</option>
            <option value="3">STAGE 3 : Toxic Waste</option>
          </select>
          <h2>DIFFICULTY</h2>
          <select id="selDiff">
            <option value="0.7">EASY</option>
            <option value="1.0" selected>NORMAL</option>
            <option value="1.5">HARD</option>
          </select>
          <button id="btnPlay" class="action-btn">PLAY NOW</button>
        </div>
      </div>

      <!-- 로딩 화면 -->
      <div id="loadingScreen">
        <h1>LOADING...</h1>
        <p id="loadStatus">3D 캐릭터 에셋을 준비 중입니다. (0/3)</p>
      </div>

      <!-- 인게임 UI -->
      <div id="uiLayer">
        <div id="scoreBoard">
          SCORE: <span id="scoreVal">0</span> | WEAPON: Lv.<span id="wpnVal"
            >0</span
          >
        </div>
        <div id="bossWarning">BOSS INCOMING!</div>
        <div id="labelsContainer"></div>
      </div>

      <!-- 게임 오버 화면 -->
      <div id="gameOverScreen">
        <h1>GAME OVER</h1>
        <p>병력이 모두 전멸했습니다.</p>
        <button onclick="initGame()" class="action-btn retry-btn">RETRY</button>
        <button
          onclick="goToMenu()"
          class="action-btn retry-btn"
          style="
            background: linear-gradient(to bottom, #95a5a6, #7f8c8d);
            box-shadow: 0 5px #34495e;
          "
        >
          MENU
        </button>
      </div>

      <!-- Three.js 캔버스가 삽입될 위치 -->
      <div id="canvasContainer"></div>
    </div>

    <script>
      // --- 화면 전환 및 설정 변수 ---
      const startScreen = document.getElementById("startScreen");
      const stageScreen = document.getElementById("stageScreen");
      const loadingScreen = document.getElementById("loadingScreen");
      const uiLayer = document.getElementById("uiLayer");
      const canvasContainer = document.getElementById("canvasContainer");
      const gameOverScreen = document.getElementById("gameOverScreen");

      let gameDifficulty = 1.0;
      let gameStage = 1;
      let isInitialized = false;

      // --- UI 요소 ---
      const scoreVal = document.getElementById("scoreVal");
      const wpnVal = document.getElementById("wpnVal");
      const bossWarning = document.getElementById("bossWarning");
      const labelsContainer = document.getElementById("labelsContainer");
      const loadStatus = document.getElementById("loadStatus");

      // --- Three.js 핵심 변수 ---
      let scene, camera, renderer, clock;
      let bridge, water, ambientLight, dirLight;

      // --- 3D 캐릭터 모델 변수 ---
      let soldierModel, soldierAnimations;
      let ogreGeo, ogreTex;
      let playerMeshes = [];
      let maxSwarmCount = 30; // 렉 방지를 위해 렌더링 개체 제한 (수치는 200까지 올라감)

      // --- 게임 상태 ---
      let gameLoopId;
      let isGameOver = false;
      let score = 0;
      let frame = 0;
      let nextBossScore = 400;
      let bossActive = false;
      let cameraShake = 0;
      let weaponLevel = 0;

      // --- 오디오 시스템 ---
      let audioCtx = null;
      function initAudio() {
        if (!audioCtx)
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
      }
      function playSound(type) {
        if (!audioCtx) return;
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        if (type === "shoot0") {
          osc.type = "square";
          osc.frequency.setValueAtTime(600, t);
          osc.frequency.exponentialRampToValueAtTime(200, t + 0.1);
          gain.gain.setValueAtTime(0.015, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
          osc.start(t);
          osc.stop(t + 0.1);
        } else if (type === "shoot1") {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(1200, t);
          osc.frequency.exponentialRampToValueAtTime(600, t + 0.15);
          gain.gain.setValueAtTime(0.02, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
          osc.start(t);
          osc.stop(t + 0.15);
        } else if (type === "shoot2") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(300, t);
          osc.frequency.exponentialRampToValueAtTime(50, t + 0.2);
          gain.gain.setValueAtTime(0.03, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
          osc.start(t);
          osc.stop(t + 0.2);
        } else if (type === "hit") {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(200, t);
          osc.frequency.linearRampToValueAtTime(100, t + 0.05);
          gain.gain.setValueAtTime(0.02, t);
          gain.gain.linearRampToValueAtTime(0.001, t + 0.05);
          osc.start(t);
          osc.stop(t + 0.05);
        } else if (type === "explode") {
          osc.type = "square";
          osc.frequency.setValueAtTime(100, t);
          osc.frequency.exponentialRampToValueAtTime(10, t + 0.3);
          gain.gain.setValueAtTime(0.05, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
          osc.start(t);
          osc.stop(t + 0.3);
        } else if (type === "gateGood") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(400, t);
          osc.frequency.linearRampToValueAtTime(800, t + 0.2);
          gain.gain.setValueAtTime(0.05, t);
          gain.gain.linearRampToValueAtTime(0.001, t + 0.2);
          osc.start(t);
          osc.stop(t + 0.2);
        } else if (type === "gateBad") {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(300, t);
          osc.frequency.linearRampToValueAtTime(150, t + 0.3);
          gain.gain.setValueAtTime(0.05, t);
          gain.gain.linearRampToValueAtTime(0.001, t + 0.3);
          osc.start(t);
          osc.stop(t + 0.3);
        } else if (type === "upgrade") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(400, t);
          osc.frequency.linearRampToValueAtTime(1200, t + 0.5);
          gain.gain.setValueAtTime(0.05, t);
          gain.gain.linearRampToValueAtTime(0.001, t + 0.8);
          osc.start(t);
          osc.stop(t + 0.8);
        }
      }

      // --- 이벤트 연동 ---
      document.getElementById("btnGoStage").addEventListener("click", () => {
        initAudio();
        startScreen.style.display = "none";
        stageScreen.style.display = "flex";
      });

      document.getElementById("btnPlay").addEventListener("click", () => {
        initAudio();
        gameStage = parseInt(document.getElementById("selStage").value);
        gameDifficulty = parseFloat(document.getElementById("selDiff").value);

        stageScreen.style.display = "none";

        if (!isInitialized) {
          loadingScreen.style.display = "flex";
          initThreeJS();
        } else {
          applyStageTheme();
          uiLayer.style.display = "block";
          initGame();
        }
      });

      function goToMenu() {
        cancelAnimationFrame(gameLoopId);
        gameOverScreen.style.display = "none";
        uiLayer.style.display = "none";
        stageScreen.style.display = "flex";
      }

      // --- 엔티티 배열 ---
      let bullets = [];
      let enemies = [];
      let gates = [];
      let particles = [];
      let rings = [];
      let labelPool = [];
      let activeDamageTexts = [];

      // --- 전장 규격 ---
      const bridgeWidth = 45;
      const bridgeLength = 200;
      const spawnZ = -90;
      const despawnZ = 20;

      // --- 플레이어 (최대 200명 제한) ---
      const MAX_PLAYER_COUNT = 200;
      let player = { x: 0, z: 0, radius: 4, count: 5, maxCount: 5, targetX: 0 };

      // --- 무기 & 입자 ---
      const matBullet0 = new THREE.MeshBasicMaterial({ color: 0xffdd00 });
      const matBullet1 = new THREE.MeshBasicMaterial({ color: 0x00ffff });
      const matBullet2 = new THREE.MeshBasicMaterial({ color: 0xff3300 });
      const geoBullet0 = new THREE.CylinderGeometry(0.3, 0.3, 3, 6);
      geoBullet0.rotateX(Math.PI / 2);
      const geoBullet1 = new THREE.CylinderGeometry(0.5, 0.5, 6, 6);
      geoBullet1.rotateX(Math.PI / 2);
      const geoBullet2 = new THREE.CylinderGeometry(1.0, 1.0, 5, 8);
      geoBullet2.rotateX(Math.PI / 2);
      const geoParticle = new THREE.BoxGeometry(0.6, 0.6, 0.6);

      // --- 로딩 시스템 ---
      let loadedAssets = 0;
      const totalAssets = 3;
      function checkLoad() {
        loadedAssets++;
        loadStatus.innerText = `3D 캐릭터 에셋을 불러오는 중입니다. (${loadedAssets}/${totalAssets})`;
        if (loadedAssets >= totalAssets) {
          isInitialized = true;
          loadingScreen.style.display = "none";
          uiLayer.style.display = "block";
          applyStageTheme();
          initGame();
        }
      }

      function handleLoadError(err, type) {
        console.warn("에셋 로드 실패, 대체 모델 사용:", type, err);
        loadStatus.innerText = "네트워크 문제로 대체 모델을 생성중입니다.";

        if (type === "soldier") {
          const group = new THREE.Group();
          const bGeo = new THREE.CylinderGeometry(0.3, 0.4, 1.2, 8);
          const bMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
          const body = new THREE.Mesh(bGeo, bMat);
          body.position.y = 0.6;
          body.castShadow = true;
          group.add(body);
          const hGeo = new THREE.SphereGeometry(0.3, 8, 8);
          const hMat = new THREE.MeshLambertMaterial({ color: 0xffccaa });
          const head = new THREE.Mesh(hGeo, hMat);
          head.position.y = 1.4;
          head.castShadow = true;
          group.add(head);
          soldierModel = group;
          soldierAnimations = [];
        } else if (type === "ogre") {
          ogreGeo = new THREE.BoxGeometry(40, 40, 40);
        } else if (type === "ogreTex") {
          ogreTex = null;
        }
        checkLoad();
      }

      function initThreeJS() {
        clock = new THREE.Clock();
        scene = new THREE.Scene();

        camera = new THREE.PerspectiveCamera(
          50,
          window.innerWidth / window.innerHeight,
          0.1,
          300,
        );
        camera.position.set(0, 45, 35);
        camera.lookAt(0, 0, -15);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        canvasContainer.appendChild(renderer.domElement);

        ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(30, 60, 30);
        dirLight.castShadow = true;
        dirLight.shadow.camera.left = -bridgeWidth;
        dirLight.shadow.camera.right = bridgeWidth;
        dirLight.shadow.camera.top = 80;
        dirLight.shadow.camera.bottom = -120;
        scene.add(dirLight);

        const geoWater = new THREE.PlaneGeometry(300, 300);
        water = new THREE.Mesh(
          geoWater,
          new THREE.MeshLambertMaterial({ color: 0x0a5c7a }),
        );
        water.rotation.x = -Math.PI / 2;
        water.position.y = -2;
        water.receiveShadow = true;
        scene.add(water);

        const geoBridge = new THREE.BoxGeometry(bridgeWidth, 2, bridgeLength);
        bridge = new THREE.Mesh(
          geoBridge,
          new THREE.MeshLambertMaterial({ color: 0x7f8c8d }),
        );
        bridge.position.set(0, -1, -30);
        bridge.receiveShadow = true;
        scene.add(bridge);

        window.addEventListener("resize", onWindowResize, false);

        function updateTargetX(clientX) {
          let ndcX = (clientX / window.innerWidth) * 2 - 1;
          player.targetX = ndcX * (bridgeWidth / 2 - 2);
          player.targetX = Math.max(
            -bridgeWidth / 2 + player.radius,
            Math.min(bridgeWidth / 2 - player.radius, player.targetX),
          );
        }

        document.body.addEventListener("mousemove", (e) => {
          updateTargetX(e.clientX);
        });
        document.body.addEventListener(
          "touchmove",
          (e) => {
            e.preventDefault();
            updateTargetX(e.touches[0].clientX);
          },
          { passive: false },
        );

        // --- 에셋 로드 ---
        const gltfLoader = new THREE.GLTFLoader();
        gltfLoader.setCrossOrigin("anonymous");
        gltfLoader.load(
          "https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/models/gltf/Soldier.glb",
          function (gltf) {
            soldierModel = gltf.scene;
            soldierAnimations = gltf.animations;
            soldierModel.traverse(function (o) {
              if (o.isMesh) o.castShadow = true;
            });
            checkLoad();
          },
          undefined,
          (e) => handleLoadError(e, "soldier"),
        );

        const md2Loader = new THREE.MD2Loader();
        md2Loader.load(
          "https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/models/md2/ogro/ogro.md2",
          function (geo) {
            ogreGeo = geo;
            checkLoad();
          },
          undefined,
          (e) => handleLoadError(e, "ogre"),
        );

        const texLoader = new THREE.TextureLoader();
        texLoader.setCrossOrigin("anonymous");
        texLoader.load(
          "https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/models/md2/ogro/ogrobase.png",
          function (tex) {
            ogreTex = tex;
            checkLoad();
          },
          undefined,
          (e) => handleLoadError(e, "ogreTex"),
        );
      }

      function applyStageTheme() {
        let bgColor, waterColor, bridgeColor;
        if (gameStage === 1) {
          // Ocean
          bgColor = 0x0a5c7a;
          waterColor = 0x0a5c7a;
          bridgeColor = 0x7f8c8d;
        } else if (gameStage === 2) {
          // Lava
          bgColor = 0x4a0e04;
          waterColor = 0x8a1c08;
          bridgeColor = 0x2c2c2c;
        } else if (gameStage === 3) {
          // Toxic
          bgColor = 0x0b3d16;
          waterColor = 0x117a26;
          bridgeColor = 0x4a4f44;
        }
        scene.background = new THREE.Color(bgColor);
        scene.fog = new THREE.Fog(bgColor, 40, 120);
        water.material.color.setHex(waterColor);
        bridge.material.color.setHex(bridgeColor);
      }

      function onWindowResize() {
        if (!camera) return;
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      // --- 동적 텍스처 ---
      function createBoxTexture(text, type) {
        const canvas = document.createElement("canvas");
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext("2d");
        if (type === "+") ctx.fillStyle = "rgba(231, 76, 60, 0.9)";
        else if (type === "W") ctx.fillStyle = "rgba(241, 196, 15, 0.9)";
        else ctx.fillStyle = "rgba(52, 152, 219, 0.9)";
        ctx.fillRect(0, 0, 256, 256);
        ctx.strokeStyle = "white";
        ctx.lineWidth = 12;
        ctx.strokeRect(6, 6, 244, 244);
        ctx.font = type === "W" ? "bold 45px Bangers" : "bold 90px Bangers";
        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(text, 128, 128);
        return new THREE.MeshBasicMaterial({
          map: new THREE.CanvasTexture(canvas),
          transparent: true,
          opacity: 0.85,
        });
      }

      // --- 3D 캐릭터 클론 생성 ---
      function createSoldier(isEnemy, isBoss = false, isElite = false) {
        let clone = THREE.SkeletonUtils.clone(soldierModel);
        let mixer = null;
        if (soldierAnimations && soldierAnimations.length > 0) {
          mixer = new THREE.AnimationMixer(clone);
          let runAnim =
            soldierAnimations.find((a) => a.name === "Run") ||
            soldierAnimations[1];
          if (runAnim) mixer.clipAction(runAnim).play();
        }
        clone.traverse((child) => {
          if (child.isMesh) {
            child.material = child.material.clone();
            if (isEnemy) {
              if (isBoss) child.material.color.setHex(0x8e44ad);
              else if (isElite) child.material.color.setHex(0xc0392b);
              else child.material.color.setHex(0xe74c3c);
            } else child.material.color.setHex(0x3498db);
          }
        });
        return { mesh: clone, mixer: mixer };
      }

      function createOgre() {
        let mat;
        if (ogreTex)
          mat = new THREE.MeshLambertMaterial({
            map: ogreTex,
            morphTargets: !!(
              ogreGeo.morphAttributes && ogreGeo.morphAttributes.position
            ),
          });
        else
          mat = new THREE.MeshLambertMaterial({
            color: 0x27ae60,
            morphTargets: !!(
              ogreGeo.morphAttributes && ogreGeo.morphAttributes.position
            ),
          });
        let mesh = new THREE.Mesh(ogreGeo, mat);
        let mixer = null;
        if (ogreGeo.animations && ogreGeo.animations.length > 0) {
          mixer = new THREE.AnimationMixer(mesh);
          let runClip =
            ogreGeo.animations.find((a) =>
              a.name.toLowerCase().includes("run"),
            ) || ogreGeo.animations[0];
          mixer.clipAction(runClip).play();
        }
        mesh.castShadow = true;
        return { mesh, mixer };
      }

      // --- 이펙트 ---
      function createRingEffect(x, y, z, color, scaleMax = 1.0) {
        let geo = new THREE.TorusGeometry(3, 0.5, 12, 36);
        let mat = new THREE.MeshBasicMaterial({
          color: color,
          transparent: true,
          opacity: 1,
        });
        let ring = new THREE.Mesh(geo, mat);
        ring.position.set(x, y + 0.5, z);
        ring.rotation.x = Math.PI / 2;
        scene.add(ring);
        rings.push({ mesh: ring, life: 1.0, scaleMax: scaleMax });
      }

      function createParticles(x, y, z, color, count = 10) {
        let mat = new THREE.MeshBasicMaterial({ color: color });
        for (let i = 0; i < count; i++) {
          let p = new THREE.Mesh(geoParticle, mat);
          p.position.set(x, y, z);
          let speed = Math.random() * 0.8 + 0.3;
          p.velocity = new THREE.Vector3(
            (Math.random() - 0.5) * speed,
            (Math.random() - 0.5) * speed + 0.5,
            (Math.random() - 0.5) * speed,
          );
          p.life = 20 + Math.random() * 15;
          scene.add(p);
          particles.push(p);
        }
      }

      // --- UI 라벨 ---
      function getLabel(type) {
        let label = labelPool.find((l) => !l.active && l.type === type);
        if (!label) {
          const el = document.createElement("div");
          el.className = `dynamic-label ${type}-label`;
          if (type === "hp" || type === "boss-hp" || type === "player")
            el.innerHTML = `<div class="text-val"></div><div class="hp-bar-container"><div class="hp-bar-fill"></div></div>`;
          else el.innerHTML = `<div class="text-val"></div>`;
          labelsContainer.appendChild(el);
          label = { el: el, type: type, active: true };
          labelPool.push(label);
        }
        label.active = true;
        label.el.style.display = "block";
        return label;
      }

      function updateLabelPos(label, x, y, z, text, hpRatio, barColor) {
        if (!label || !label.active) return;
        const vec = new THREE.Vector3(x, y, z);
        vec.project(camera);
        const xPos = (vec.x * 0.5 + 0.5) * window.innerWidth;
        const yPos = (vec.y * -0.5 + 0.5) * window.innerHeight;
        if (vec.z > 1) label.el.style.display = "none";
        else {
          label.el.style.display = "block";
          label.el.style.left = `${xPos}px`;
          label.el.style.top = `${yPos}px`;
          let textEl = label.el.querySelector(".text-val");
          if (textEl && text !== undefined) textEl.innerText = text;
          if (hpRatio !== undefined) {
            let fillEl = label.el.querySelector(".hp-bar-fill");
            if (fillEl) {
              fillEl.style.width = `${Math.max(0, Math.min(100, hpRatio * 100))}%`;
              if (barColor) fillEl.style.background = barColor;
            }
          }
        }
      }

      function releaseLabel(label) {
        if (label) {
          label.active = false;
          label.el.style.display = "none";
        }
      }

      function spawnDamageText(x, y, z, amount, isPlayerHit) {
        const el = document.createElement("div");
        el.className = "damage-text";
        el.innerText = `-${amount}`;
        el.style.color = isPlayerHit ? "#ff3333" : "#ffcc00";
        labelsContainer.appendChild(el);
        activeDamageTexts.push({
          el: el,
          x: x,
          y: y,
          z: z,
          life: 1.0,
          vy: 0.1,
        });
      }

      // --- 인원수 검증 (최대 200, 최소 0) ---
      function applyPlayerCount(newVal) {
        player.count = Math.max(
          0,
          Math.min(MAX_PLAYER_COUNT, Math.floor(newVal)),
        );
        if (player.count > player.maxCount) player.maxCount = player.count;
      }

      // --- 게임 초기화 ---
      function initGame() {
        enemies.forEach((e) => {
          scene.remove(e.mesh);
          releaseLabel(e.label);
        });
        gates.forEach((g) => {
          scene.remove(g.mesh);
        });
        bullets.forEach((b) => scene.remove(b.mesh));
        particles.forEach((p) => scene.remove(p.mesh));
        rings.forEach((r) => scene.remove(r.mesh));
        playerMeshes.forEach((p) => scene.remove(p.mesh));

        labelPool.forEach((l) => releaseLabel(l));
        activeDamageTexts.forEach((dt) => dt.el.remove());

        bullets = [];
        enemies = [];
        gates = [];
        particles = [];
        rings = [];
        activeDamageTexts = [];
        playerMeshes = [];

        player.count = 5;
        player.maxCount = 5;
        player.x = 0;
        player.targetX = 0;
        score = 0;
        frame = 0;
        nextBossScore = 400;
        bossActive = false;
        isGameOver = false;
        weaponLevel = 0;
        wpnVal.innerText = weaponLevel;

        gameOverScreen.style.display = "none";
        bossWarning.style.display = "none";
        player.label = getLabel("player");

        if (gameLoopId) cancelAnimationFrame(gameLoopId);
        animate();
      }

      function circleRectCollide(px, pz, radius, rx, rz, rw, rd) {
        let testX = px;
        let testZ = pz;
        let left = rx - rw / 2;
        let right = rx + rw / 2;
        let top = rz - rd / 2;
        let bottom = rz + rd / 2;
        if (px < left) testX = left;
        else if (px > right) testX = right;
        if (pz < top) testZ = top;
        else if (pz > bottom) testZ = bottom;
        return Math.sqrt((px - testX) ** 2 + (pz - testZ) ** 2) <= radius;
      }

      function animate() {
        if (isGameOver) return;
        gameLoopId = requestAnimationFrame(animate);

        const delta = clock.getDelta();
        frame++;
        scoreVal.innerText = score;

        // --- 1. 플레이어 이동 및 3D 군집 ---
        player.x += (player.targetX - player.x) * 0.2;

        // 시각적으로 렌더링되는 개체 수 조절 (렉 방지)
        let visualCount = Math.min(player.count, maxSwarmCount);

        while (playerMeshes.length < visualCount) {
          let s = createSoldier(false);
          s.mesh.scale.set(3.5, 3.5, 3.5);
          scene.add(s.mesh);
          playerMeshes.push(s);
        }
        while (playerMeshes.length > visualCount) {
          let s = playerMeshes.pop();
          scene.remove(s.mesh);
        }

        const spacing = 4.2;
        const cols = Math.max(1, Math.ceil(Math.sqrt(visualCount * 1.5)));
        const rows = Math.ceil(visualCount / cols);
        player.radius = Math.max(4, (cols * spacing) / 2);

        for (let i = 0; i < playerMeshes.length; i++) {
          let col = i % cols;
          let row = Math.floor(i / cols);
          let offsetX = (col - (cols - 1) / 2) * spacing;
          let offsetZ = (row - (rows - 1) / 2) * spacing;
          let s = playerMeshes[i];
          s.mesh.position.x += (player.x + offsetX - s.mesh.position.x) * 0.3;
          s.mesh.position.z += (player.z + offsetZ - s.mesh.position.z) * 0.3;
          if (s.mixer) s.mixer.update(delta);
        }

        // UI 라벨은 실제 인원수(최대 200명) 반영
        updateLabelPos(
          player.label,
          player.x,
          8,
          player.z,
          player.count,
          player.count / MAX_PLAYER_COUNT,
          "#3498db",
        );

        // --- 2. 사격 시스템 ---
        let fireRate = Math.max(3, 15 - Math.floor(player.count / 25));
        if (frame % fireRate === 0 && player.count > 0) {
          playSound(`shoot${weaponLevel}`);
          // 화력은 200명 인원수 기반으로 강력하게 적용됨
          let bulletCount = Math.min(1 + Math.floor(player.count / 15), 15);
          let spreadWidth = Math.min(player.radius * 2, bridgeWidth - 4);
          let startX =
            bulletCount === 1 ? player.x : player.x - spreadWidth / 2;
          let spacingB =
            bulletCount === 1 ? 0 : spreadWidth / (bulletCount - 1);

          let cMat =
            weaponLevel === 0
              ? matBullet0
              : weaponLevel === 1
                ? matBullet1
                : matBullet2;
          let cGeo =
            weaponLevel === 0
              ? geoBullet0
              : weaponLevel === 1
                ? geoBullet1
                : geoBullet2;
          let vZ = weaponLevel === 0 ? -3.0 : weaponLevel === 1 ? -4.5 : -3.5;

          for (let i = 0; i < bulletCount; i++) {
            let b = new THREE.Mesh(cGeo, cMat);
            b.position.set(
              startX + i * spacingB,
              2.5,
              player.z - (rows * spacing) / 2 - 1,
            );
            scene.add(b);
            bullets.push({ mesh: b, vz: vZ, level: weaponLevel });
          }
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
          let b = bullets[i];
          b.mesh.position.z += b.vz;
          if (b.level === 2 && frame % 2 === 0)
            createParticles(
              b.mesh.position.x,
              b.mesh.position.y,
              b.mesh.position.z + 2,
              0xff5500,
              1,
            );
          if (b.mesh.position.z < spawnZ) {
            scene.remove(b.mesh);
            bullets.splice(i, 1);
          }
        }

        // --- 3. 큐브 게이트 및 무기 상자 ---
        if (frame % 150 === 0 && !bossActive) {
          let gateW = bridgeWidth / 2 - 2;

          if (Math.random() > 0.85 && weaponLevel < 2) {
            let wMat = createBoxTexture("WEAPON\nCUBE", "W");
            let wMesh = new THREE.Mesh(new THREE.BoxGeometry(12, 12, 12), wMat);
            wMesh.position.set(
              (Math.random() - 0.5) * (bridgeWidth - 12),
              6,
              spawnZ,
            );
            scene.add(wMesh);
            // 난이도 반영
            let wHp = 150 * gameDifficulty;
            enemies.push({
              mesh: wMesh,
              hp: wHp,
              maxHp: wHp,
              w: 12,
              d: 12,
              isWeaponCrate: true,
              isBoss: false,
              label: getLabel("hp"),
              rotY: 0.05,
            });
          } else {
            let ops = [
              { type: "+", val: Math.floor(Math.random() * 40) + 10 },
              { type: "x", val: 2 },
              { type: "-", val: Math.floor(Math.random() * 30) + 20 },
              { type: "/", val: Math.random() > 0.5 ? 2 : 3 },
            ];
            let op1 = ops[Math.floor(Math.random() * 2)];
            let op2 = ops[Math.floor(Math.random() * ops.length)];
            if (Math.random() > 0.5) [op1, op2] = [op2, op1];

            let mat1 = createBoxTexture(op1.type + op1.val, op1.type);
            let m1 = new THREE.Mesh(new THREE.BoxGeometry(gateW, 10, 10), mat1);
            m1.position.set(-bridgeWidth / 4, 5, spawnZ);
            scene.add(m1);
            gates.push({ mesh: m1, op: op1, w: gateW, d: 10, active: true });

            let mat2 = createBoxTexture(op2.type + op2.val, op2.type);
            let m2 = new THREE.Mesh(new THREE.BoxGeometry(gateW, 10, 10), mat2);
            m2.position.set(bridgeWidth / 4, 5, spawnZ);
            scene.add(m2);
            gates.push({ mesh: m2, op: op2, w: gateW, d: 10, active: true });
          }
        }

        for (let i = gates.length - 1; i >= 0; i--) {
          let g = gates[i];
          g.mesh.position.z += 0.45;

          if (
            g.active &&
            Math.abs(g.mesh.position.z - player.z) < g.d / 2 + 2
          ) {
            if (
              Math.abs(g.mesh.position.x - player.x) <
              g.w / 2 + player.radius
            ) {
              let calc = player.count;
              if (g.op.type === "+" || g.op.type === "x") {
                if (g.op.type === "+") calc += g.op.val;
                else calc *= g.op.val;
                playSound("gateGood");
                createRingEffect(player.x, 0, player.z, 0x00ff00, 2.0);
              } else {
                if (g.op.type === "-") calc -= g.op.val;
                else calc = Math.floor(calc / g.op.val);
                playSound("gateBad");
                createRingEffect(player.x, 0, player.z, 0xff0000, 1.5);
              }

              applyPlayerCount(calc); // 최대 200명 제한 적용
              createParticles(player.x, 4, player.z, 0xffffff, 20);

              gates.forEach((og) => {
                if (Math.abs(og.mesh.position.z - g.mesh.position.z) < 2)
                  og.active = false;
              });
              g.mesh.material.opacity = 0.1;
            }
          }
          if (g.mesh.position.z > despawnZ) {
            scene.remove(g.mesh);
            gates.splice(i, 1);
          }
        }

        // --- 4. 적 스폰 (난이도 계수 적용) ---
        let enemySpawnRate =
          Math.max(30, 80 - Math.floor(score / 100)) /
          (gameDifficulty >= 1.5 ? 1.5 : 1);

        if (score >= nextBossScore && !bossActive) {
          bossActive = true;
          playSound("boss");
          bossWarning.style.display = "block";
          setTimeout(() => (bossWarning.style.display = "none"), 3000);

          nextBossScore += 800 + Math.floor(score * 0.5);
          let bossHp = Math.floor(
            (1000 + Math.floor(score * 3)) * gameDifficulty,
          );

          let bObj = createSoldier(true, true, false);
          bObj.mesh.scale.set(15, 15, 15);
          bObj.mesh.rotation.y = Math.PI;
          bObj.mesh.position.set(0, 0, spawnZ);
          scene.add(bObj.mesh);

          enemies.push({
            mesh: bObj.mesh,
            mixer: bObj.mixer,
            hp: bossHp,
            maxHp: bossHp,
            w: 20,
            d: 14,
            isBoss: true,
            label: getLabel("boss-hp"),
          });
        } else if (frame % Math.floor(enemySpawnRate) === 0 && !bossActive) {
          let isOgre = Math.random() > 0.8;
          let isElite = !isOgre && Math.random() > 0.7;
          let baseHp = isOgre ? 80 + score / 15 : 20 + score / 15;
          if (isElite) baseHp *= 3;
          baseHp = Math.floor(baseHp * gameDifficulty); // 난이도 적용

          let eObj, w, d;

          if (isOgre) {
            eObj = createOgre();
            eObj.mesh.scale.set(0.25, 0.25, 0.25);
            eObj.mesh.rotation.y = -Math.PI / 2;
            eObj.mesh.position.set(
              (Math.random() - 0.5) * (bridgeWidth - 10),
              0,
              spawnZ,
            );
            w = 10;
            d = 10;
          } else {
            eObj = createSoldier(true, false, isElite);
            let sc = isElite ? 5.5 : 4.0;
            eObj.mesh.scale.set(sc, sc, sc);
            eObj.mesh.rotation.y = Math.PI;
            eObj.mesh.position.set(
              (Math.random() - 0.5) * (bridgeWidth - sc * 2),
              0,
              spawnZ,
            );
            w = sc * 2;
            d = sc * 2;
          }

          scene.add(eObj.mesh);
          enemies.push({
            mesh: eObj.mesh,
            mixer: eObj.mixer,
            hp: baseHp,
            maxHp: baseHp,
            w: w,
            d: d,
            isOgre: isOgre,
            isBoss: false,
            label: getLabel("hp"),
          });
        }

        // --- 5. 적 이동 및 충돌 ---
        for (let i = enemies.length - 1; i >= 0; i--) {
          let e = enemies[i];
          let speed = e.isBoss
            ? 0.08
            : e.isWeaponCrate
              ? 0.3
              : e.isOgre
                ? 0.25
                : 0.45;
          e.mesh.position.z += speed;

          if (e.mixer) e.mixer.update(delta);
          if (e.rotY) e.mesh.rotation.y += e.rotY;

          let ex = e.mesh.position.x;
          let ez = e.mesh.position.z;
          updateLabelPos(
            e.label,
            ex,
            e.isBoss ? 25 : e.isWeaponCrate ? 14 : e.w + 5,
            ez,
            Math.floor(e.hp),
            e.hp / e.maxHp,
            e.isBoss ? "#9b59b6" : e.isWeaponCrate ? "#f1c40f" : "#e74c3c",
          );

          for (let j = bullets.length - 1; j >= 0; j--) {
            let b = bullets[j];
            let bx = b.mesh.position.x;
            let bz = b.mesh.position.z;

            if (Math.abs(bx - ex) < e.w / 2 && Math.abs(bz - ez) < e.d / 2) {
              let baseDmg = weaponLevel === 0 ? 1 : weaponLevel === 1 ? 2 : 5;
              let dmg = baseDmg + Math.floor(player.count / 80);
              e.hp -= dmg;
              playSound("hit");

              if (e.isOgre || e.isBoss || !e.isWeaponCrate) {
                e.mesh.scale.multiplyScalar(0.95);
                setTimeout(() => {
                  if (e.mesh) e.mesh.scale.multiplyScalar(1.05);
                }, 50);
              }

              createParticles(
                bx,
                e.isWeaponCrate ? e.mesh.position.y : 4,
                bz,
                weaponLevel == 2 ? 0xff3300 : 0xffdd00,
                2,
              );
              spawnDamageText(
                bx + (Math.random() - 0.5),
                e.isBoss ? 15 : 6,
                bz,
                dmg,
                false,
              );

              scene.remove(b.mesh);
              bullets.splice(j, 1);

              if (e.hp <= 0) {
                playSound("explode");
                if (e.isWeaponCrate) {
                  weaponLevel = Math.min(2, weaponLevel + 1);
                  wpnVal.innerText = weaponLevel;
                  playSound("upgrade");
                  cameraShake = 15;
                  createRingEffect(ex, 2, ez, 0xffaa00, 4.0);
                  createParticles(ex, 5, ez, 0xffaa00, 100);
                } else {
                  score += e.isBoss ? 1000 : e.isOgre ? 100 : 20;
                  createParticles(
                    ex,
                    e.isBoss ? 10 : 3,
                    ez,
                    e.isOgre ? 0x2ecc71 : 0xe74c3c,
                    e.isBoss ? 150 : 40,
                  );
                  if (e.isBoss) bossActive = false;
                }

                scene.remove(e.mesh);
                releaseLabel(e.label);
                enemies.splice(i, 1);
                break;
              }
            }
          }

          if (enemies[i]) {
            if (
              circleRectCollide(
                player.x,
                player.z,
                player.radius,
                ex,
                ez,
                e.w,
                e.d,
              )
            ) {
              playSound("explode");
              let dmgTaken = 0;
              if (e.isBoss) {
                dmgTaken = player.count;
                applyPlayerCount(0);
              } else if (e.isWeaponCrate) {
                dmgTaken = 0;
                e.hp = 0;
              } else {
                dmgTaken = Math.floor(e.hp);
                applyPlayerCount(player.count - dmgTaken);
                cameraShake = 10;
              }

              createParticles(player.x, 4, player.z, 0xe74c3c, 40);
              if (dmgTaken > 0)
                spawnDamageText(player.x, 8, player.z, dmgTaken, true);

              if (e.isBoss) bossActive = false;
              scene.remove(e.mesh);
              releaseLabel(e.label);
              enemies.splice(i, 1);

              if (player.count <= 0) {
                isGameOver = true;
                releaseLabel(player.label);
                gameOverScreen.style.display = "block";
              }
            } else if (ez > despawnZ) {
              if (e.isBoss) applyPlayerCount(0);
              scene.remove(e.mesh);
              releaseLabel(e.label);
              enemies.splice(i, 1);
            }
          }
        }

        // --- 6. 링 이펙트 ---
        for (let i = rings.length - 1; i >= 0; i--) {
          let r = rings[i];
          r.life -= 0.04;
          r.mesh.scale.addScalar(0.2 * r.scaleMax);
          r.mesh.material.opacity = Math.max(0, r.life);
          if (r.life <= 0) {
            scene.remove(r.mesh);
            rings.splice(i, 1);
          }
        }

        // --- 7. 데미지 텍스트 ---
        for (let i = activeDamageTexts.length - 1; i >= 0; i--) {
          let dt = activeDamageTexts[i];
          dt.y += dt.vy;
          dt.life -= 0.03;
          if (dt.life <= 0) {
            dt.el.remove();
            activeDamageTexts.splice(i, 1);
            continue;
          }
          const vec = new THREE.Vector3(dt.x, dt.y, dt.z);
          vec.project(camera);
          if (vec.z > 1) dt.el.style.display = "none";
          else {
            dt.el.style.display = "block";
            dt.el.style.left = `${(vec.x * 0.5 + 0.5) * window.innerWidth}px`;
            dt.el.style.top = `${(vec.y * -0.5 + 0.5) * window.innerHeight}px`;
            dt.el.style.opacity = dt.life;
            dt.el.style.transform = `translate(-50%, -50%) scale(${0.7 + (1 - dt.life) * 0.5})`;
          }
        }

        // --- 8. 파티클 & 카메라 셰이크 ---
        for (let i = particles.length - 1; i >= 0; i--) {
          let p = particles[i];
          p.position.add(p.velocity);
          p.velocity.y -= 0.05;
          p.life--;
          if (p.life <= 0) {
            scene.remove(p);
            particles.splice(i, 1);
          }
        }

        if (cameraShake > 0) {
          camera.position.x = (Math.random() - 0.5) * cameraShake;
          camera.position.y = 45 + (Math.random() - 0.5) * cameraShake;
          cameraShake *= 0.8;
          if (cameraShake < 0.1) {
            cameraShake = 0;
            camera.position.set(0, 45, 35);
          }
        }

        renderer.render(scene, camera);

        // 게임 오버 글로벌 체크 (인원수가 0이 되면 즉시 종료)
        if (player.count <= 0 && !isGameOver) {
          isGameOver = true;
          releaseLabel(player.label);
          gameOverScreen.style.display = "block";
        }
      }
    </script>
  </body>
</html>
