<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사주 배틀 게임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;700;900&display=swap');

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0f172a;
            background-image:
                    radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
                    radial-gradient(circle at 80% 70%, rgba(239, 68, 68, 0.1) 0%, transparent 50%),
                    radial-gradient(circle at 50% 50%, #1e1b4b 0%, #0f172a 100%);
            color: #e2e8f0;
            min-height: 100vh;
        }

        .mystic-font {
            font-family: 'Gowun Dodum', sans-serif;
        }

        .card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .player-1-theme {
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.15);
            border-top: 4px solid #3b82f6;
        }

        .player-2-theme {
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.15);
            border-top: 4px solid #ef4444;
        }

        /* VS Badge */
        .vs-badge {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-weight: 900;
            font-size: 1.5rem;
            color: #000;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.5);
            border: 4px solid #0f172a;
        }

        /* Yin-Yang Loading */
        .yin-yang {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(white 50%, black 50%);
            display: flex;
            align-items: center;
            border: 4px solid #f59e0b;
            animation: spin 1.5s cubic-bezier(0.5, 0, 0.5, 1) infinite;
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.3);
        }
        .yin-yang::before, .yin-yang::after {
            content: '';
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }
        .yin-yang::before { background: white; border: 10px solid black; }
        .yin-yang::after { background: black; border: 10px solid white; }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .hidden { display: none !important; }

        /* Chart Animation */
        .chart-bar {
            transition: width 1.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            width: 0;
        }

        /* Result Animation and Fix Clipping */
        #winner-announcement {
            padding-bottom: 0.25em; /* '승리' 자 이응 받침 잘림 완벽 방지 */
            line-height: 1.4;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

<!-- 안내 모달 -->
<div id="modal-overlay" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="card max-w-sm w-full p-8 rounded-3xl border-yellow-500/50 text-center scale-up">
        <div class="text-6xl mb-4">🔮</div>
        <h3 class="text-2xl font-black mb-2 mystic-font text-white">입력 정보 확인</h3>
        <p id="modal-message" class="text-gray-400 mb-8 break-keep">정보를 모두 입력해주세요.</p>
        <button onclick="closeModal()" class="w-full py-4 bg-yellow-600 hover:bg-yellow-500 text-black font-black rounded-2xl shadow-lg transition transform active:scale-95">
            확인
        </button>
    </div>
</div>

<div class="max-w-5xl w-full py-8">
    <header class="text-center mb-12">
        <div class="inline-block px-4 py-1 rounded-full bg-yellow-500/10 border border-yellow-500/20 text-yellow-500 text-xs font-bold mb-4 tracking-widest uppercase">
            Celestial Destiny Battle
        </div>
        <h1 class="text-5xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-b from-yellow-200 via-yellow-500 to-yellow-700 mb-4 mystic-font tracking-tighter">
            천하제일 사주 배틀
        </h1>
        <p class="text-gray-500 text-lg mystic-font">하늘이 정한 운명의 저울, 승자는 이미 정해져 있을지니.</p>
    </header>

    <!-- 입력 섹션 -->
    <main id="input-section" class="transition-all duration-700">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-10 mb-12 relative">
            <div class="hidden md:flex absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-10 w-16 h-16 rounded-full bg-gray-900 border-4 border-gray-800 items-center justify-center font-black text-2xl text-gray-500 italic">VS</div>

            <!-- Player 1 -->
            <div class="card player-1-theme p-8 rounded-3xl">
                <div class="flex items-center gap-3 mb-8">
                    <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center font-black text-white shadow-lg shadow-blue-900/40">1</div>
                    <h2 class="text-2xl font-black text-blue-400">도전자 청룡</h2>
                </div>
                <div class="space-y-6">
                    <div class="group">
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-2 ml-1 group-focus-within:text-blue-400 transition">이름</label>
                        <input type="text" id="p1-name" placeholder="이름을 입력하세요" class="w-full bg-gray-900/50 border border-gray-700 rounded-2xl px-5 py-4 text-white focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition placeholder:text-gray-600">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-2 ml-1 group-focus-within:text-blue-400 transition">생년월일</label>
                            <input type="date" id="p1-date" min="1900-01-01" class="w-full bg-gray-900/50 border border-gray-700 rounded-2xl px-5 py-4 text-white focus:outline-none focus:border-blue-500 transition [color-scheme:dark]">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-2 ml-1 group-focus-within:text-blue-400 transition">태어난 시간</label>
                            <input type="time" id="p1-time" value="12:00" class="w-full bg-gray-900/50 border border-gray-700 rounded-2xl px-5 py-4 text-white focus:outline-none focus:border-blue-500 transition [color-scheme:dark]">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Player 2 -->
            <div class="card player-2-theme p-8 rounded-3xl">
                <div class="flex items-center gap-3 mb-8">
                    <div class="w-10 h-10 rounded-xl bg-red-600 flex items-center justify-center font-black text-white shadow-lg shadow-red-900/40">2</div>
                    <h2 class="text-2xl font-black text-red-400">도전자 주작</h2>
                </div>
                <div class="space-y-6">
                    <div class="group">
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-2 ml-1 group-focus-within:text-red-400 transition">이름</label>
                        <input type="text" id="p2-name" placeholder="이름을 입력하세요" class="w-full bg-gray-900/50 border border-gray-700 rounded-2xl px-5 py-4 text-white focus:outline-none focus:border-red-500 focus:ring-4 focus:ring-red-500/10 transition placeholder:text-gray-600">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-2 ml-1 group-focus-within:text-red-400 transition">생년월일</label>
                            <input type="date" id="p2-date" min="1900-01-01" class="w-full bg-gray-900/50 border border-gray-700 rounded-2xl px-5 py-4 text-white focus:outline-none focus:border-red-500 transition [color-scheme:dark]">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-2 ml-1 group-focus-within:text-red-400 transition">태어난 시간</label>
                            <input type="time" id="p2-time" value="12:00" class="w-full bg-gray-900/50 border border-gray-700 rounded-2xl px-5 py-4 text-white focus:outline-none focus:border-red-500 transition [color-scheme:dark]">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center">
            <button id="battle-btn" class="group relative inline-flex items-center justify-center px-16 py-6 font-black text-xl text-black bg-yellow-500 rounded-full overflow-hidden transition-all hover:bg-yellow-400 active:scale-95 shadow-[0_0_40px_rgba(245,158,11,0.3)]">
                    <span class="relative z-10 flex items-center gap-3">
                        진검승부 시작 <span class="text-2xl">⚡</span>
                    </span>
                <div class="absolute inset-0 h-full w-full bg-white/20 translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-500"></div>
            </button>
        </div>
    </main>

    <!-- 로딩 화면 -->
    <div id="loading-section" class="hidden flex-col items-center justify-center py-32 transition-all">
        <div class="yin-yang mb-10"></div>
        <div class="text-center space-y-3">
            <p class="text-2xl text-yellow-500 font-black mystic-font animate-pulse">우주의 기운을 불러모으고 있습니다...</p>
            <p id="loading-subtext" class="text-gray-500 text-sm italic">AI 명리학자가 당신의 사주팔자와 일진을 대조하고 있습니다.</p>
        </div>
    </div>

    <!-- 결과 섹션 -->
    <section id="result-section" class="hidden relative">
        <div class="text-center mb-16">
            <div class="inline-block mb-4 px-6 py-2 rounded-full bg-white/5 border border-white/10 text-xs font-bold tracking-[0.3em] text-gray-400 uppercase">Battle Result</div>
            <h2 class="text-5xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-yellow-500 to-yellow-200 mb-8 animate-bounce mystic-font" id="winner-announcement">
                승자 발표
            </h2>
            <div id="score-difference" class="flex flex-col items-center gap-8">
                <!-- Scoreboard will be injected here -->
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 items-start relative">
            <div class="vs-badge hidden lg:flex">VS</div>

            <!-- Player 1 Result -->
            <div id="p1-result-card" class="card p-8 rounded-[2rem] flex flex-col relative overflow-hidden h-auto">
                <div class="absolute top-0 left-0 w-full h-2 bg-blue-500"></div>
                <div class="flex justify-between items-center mb-8">
                    <h3 class="text-3xl font-black text-white" id="p1-res-name">청룡</h3>
                    <div class="text-right">
                        <span class="block text-xs text-gray-500 font-bold uppercase tracking-widest mb-1">Total Score</span>
                        <div class="text-5xl font-black text-blue-400" id="p1-res-score">0</div>
                    </div>
                </div>
                <div id="p1-res-desc" class="space-y-8"></div>
            </div>

            <!-- Player 2 Result -->
            <div id="p2-result-card" class="card p-8 rounded-[2rem] flex flex-col relative overflow-hidden h-auto">
                <div class="absolute top-0 left-0 w-full h-2 bg-red-500"></div>
                <div class="flex justify-between items-center mb-8">
                    <h3 class="text-3xl font-black text-white" id="p2-res-name">주작</h3>
                    <div class="text-right">
                        <span class="block text-xs text-gray-500 font-bold uppercase tracking-widest mb-1">Total Score</span>
                        <div class="text-5xl font-black text-red-400" id="p2-res-score">0</div>
                    </div>
                </div>
                <div id="p2-res-desc" class="space-y-8"></div>
            </div>
        </div>

        <div class="text-center mt-16">
            <button id="retry-btn" class="bg-gray-800 hover:bg-gray-700 text-white font-black py-5 px-12 rounded-2xl shadow-xl transform transition hover:scale-105 active:scale-95 flex items-center gap-3 mx-auto">
                🔄 다시 대결하기
            </button>
        </div>
    </section>
</div>

<script>
    const apiKey = "";
    const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

    const stems = ['갑(甲)', '을(乙)', '병(丙)', '정(丁)', '무(戊)', '기(己)', '경(庚)', '신(辛)', '임(壬)', '계(癸)'];
    const stemElements = ['목(木)', '목(木)', '화(火)', '화(火)', '토(土)', '토(土)', '금(金)', '금(金)', '수(水)', '수(水)'];
    const branches = ['자(子)', '축(丑)', '인(寅)', '묘(卯)', '진(辰)', '사(巳)', '오(午)', '미(未)', '신(申)', '유(酉)', '술(戌)', '해(亥)'];
    const branchElements = ['수(水)', '토(土)', '목(木)', '목(木)', '토(土)', '화(火)', '화(火)', '토(土)', '금(金)', '금(金)', '토(土)', '수(水)'];

    const elColors = { '목(木)': 'bg-green-500', '화(火)': 'bg-red-500', '토(土)': 'bg-yellow-600', '금(金)': 'bg-gray-300', '수(水)': 'bg-blue-500' };
    const elTextColors = { '목(木)': 'text-green-400', '화(火)': 'text-red-400', '토(土)': 'text-yellow-500', '금(金)': 'text-gray-300', '수(水)': 'text-blue-400' };

    const hapMap = { '갑(甲)': '기(己)', '기(己)': '갑(甲)', '을(乙)': '경(庚)', '경(庚)': '을(乙)', '병(丙)': '신(辛)', '신(辛)': '병(丙)', '정(丁)': '임(壬)', '임(壬)': '정(丁)', '무(戊)': '계(癸)', '계(癸)': '무(戊)' };
    const chungMap = { '갑(甲)': '경(庚)', '경(庚)': '갑(甲)', '을(乙)': '신(辛)', '신(辛)': '을(乙)', '병(丙)': '임(壬)', '임(壬)': '병(丙)', '정(丁)': '계(癸)', '계(癸)': '정(丁)' };

    function getHash(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            hash = ((hash << 5) - hash) + str.charCodeAt(i);
            hash = hash & hash;
        }
        return Math.abs(hash);
    }

    function showModal(msg) {
        document.getElementById('modal-message').innerText = msg;
        document.getElementById('modal-overlay').classList.remove('hidden');
    }

    function closeModal() {
        document.getElementById('modal-overlay').classList.add('hidden');
    }

    async function fetchWithRetry(url, options, retries = 5) {
        const delays = [1000, 2000, 4000, 8000, 16000];
        for (let i = 0; i < retries; i++) {
            try {
                const response = await fetch(url, options);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return await response.json();
            } catch (e) {
                if (i === retries - 1) throw e;
                await new Promise(res => setTimeout(res, delays[i]));
            }
        }
    }

    async function generateSajuResult(name, dateStr, timeStr) {
        const date = new Date(dateStr);
        const year = date.getFullYear();
        const month = date.getMonth() + 1;
        const day = date.getDate();
        const [hour, minute] = timeStr.split(':').map(Number);

        const yearStemIdx = (year + 6) % 10;
        const yearBranchIdx = (year + 8) % 12;
        const monthBranchIdx = (month + 1) % 12;
        const mStemOffsets = [2, 4, 6, 8, 0, 2, 4, 6, 8, 0];
        const monthStemIdx = (mStemOffsets[yearStemIdx] + monthBranchIdx - 2 + 10) % 10;
        const utcDate = Date.UTC(year, month - 1, day);
        const daysSinceEpoch = Math.floor(utcDate / (1000 * 60 * 60 * 24));
        const dayStemIdx = (((daysSinceEpoch + 3) % 10) + 10) % 10;
        const dayBranchIdx = (((daysSinceEpoch + 11) % 12) + 12) % 12;
        const timeBranchIdx = Math.floor((hour + 1) / 2) % 12;
        const tStemOffsets = [0, 2, 4, 6, 8, 0, 2, 4, 6, 8];
        const timeStemIdx = (tStemOffsets[dayStemIdx] + timeBranchIdx) % 10;

        const saju8 = [
            { s: stems[yearStemIdx], e: stemElements[yearStemIdx] }, { s: branches[yearBranchIdx], e: branchElements[yearBranchIdx] },
            { s: stems[monthStemIdx], e: stemElements[monthStemIdx] }, { s: branches[monthBranchIdx], e: branchElements[monthBranchIdx] },
            { s: stems[dayStemIdx], e: stemElements[dayStemIdx] }, { s: branches[dayBranchIdx], e: branchElements[dayBranchIdx] },
            { s: stems[timeStemIdx], e: stemElements[timeStemIdx] }, { s: branches[timeBranchIdx], e: branchElements[timeBranchIdx] }
        ];

        const userDayStem = saju8[4].s;
        const elCount = { '목(木)': 0, '화(火)': 0, '토(土)': 0, '금(金)': 0, '수(水)': 0 };
        saju8.forEach(item => elCount[item.e]++);

        let missingElements = [];
        for (const [el, count] of Object.entries(elCount)) {
            if (count === 0) missingElements.push(el);
        }

        let natureScore = 15 + (getHash(name + userDayStem) % 16);
        let elementScore = 10 + (Object.values(elCount).filter(c => c > 0).length * 3) + (getHash(name + dateStr) % 6);

        const todayCalc = new Date();
        const todayStemIdx = (((Math.floor(Date.UTC(todayCalc.getFullYear(), todayCalc.getMonth(), todayCalc.getDate()) / 86400000) + 3) % 10) + 10) % 10;
        const todayStem = stems[todayStemIdx];
        const todayElement = stemElements[todayStemIdx];

        const hashJitter = getHash(timeStr + name) % 6;
        let dailyBaseScore = 0;

        if (hapMap[userDayStem] === todayStem) dailyBaseScore = 35 + hashJitter;
        else if (chungMap[userDayStem] === todayStem) dailyBaseScore = 5 + hashJitter;
        else if (missingElements.includes(todayElement)) dailyBaseScore = 25 + hashJitter;
        else if (elCount[todayElement] >= 3) dailyBaseScore = 10 + hashJitter;
        else dailyBaseScore = 15 + (getHash(name) % 11);

        let dailyScore = Math.min(40, dailyBaseScore);
        const totalScore = natureScore + elementScore + dailyScore;

        // AI Prompt
        const promptStr = `[사용자 심층 분석 데이터]
            - 이름: ${name}
            - 사주 명식: 년(${saju8[0].s}${saju8[1].s}), 월(${saju8[2].s}${saju8[3].s}), 일(${saju8[4].s}${saju8[5].s}), 시(${saju8[6].s}${saju8[7].s})
            - 일간(자아): ${userDayStem}
            - 부족한 오행: ${missingElements.join(', ') || '없음'}
            - 오늘 일진: ${todayStem}

            당신은 최고의 맞춤형 사주 전략가입니다. 위 데이터를 모두 종합하여 JSON으로 응답하세요:
            1. 나의 본성: 일간의 특징을 활용한 성격 풀이
            2. 오행 분석: 사주 구성을 보고 잠재력을 제안
            3. 오늘의 운세: 오늘 기운과 사용자의 조화를 다정하게 설명
            4. 완벽한 맞춤형 행운 추천: 사용자의 이름('${name}'), 사주의 부족한 기운, 오늘 일진의 상호작용을 심층 분석하여 이 사람만을 위한 럭키 아이템을 도출하세요.
               - luckyColor: 구체적이고 감각적인 색상명 (예: '심해의 네이비', '포근한 라일락')
               - luckyNumber: 1~99 사이의 정수 딱 1개
               - luckyItem: 뻔하지 않고 개인의 특성과 이름의 분위기가 반영된 유니크한 소품 (예: '빈티지 가죽 다이어리', '은은한 샌달우드 인센스'). 부연 설명 없이 딱 떨어지는 짧은 명칭만 적으세요.`;

        let aiResult = {
            baseNatureDesc: "신비로운 기운을 가진 사주입니다.",
            baseElementDesc: "조화로운 오행 구성을 가지고 있습니다.",
            dailyFortuneDesc: "오늘 하루도 따스한 햇살 같은 일들이 가득할 거예요.",
            luckyColor: "순백색", luckyNumber: "7", luckyItem: "손수건"
        };

        try {
            const payload = {
                contents: [{ parts: [{ text: promptStr }] }],
                systemInstruction: { parts: [{ text: "당신은 심층 사주 분석가입니다. 이름, 사주팔자, 오늘 일진의 상관관계를 완벽히 계산하여 가장 개인화된 결과를 제공합니다. 행운 추천은 반드시 부연 설명 없이 명칭만 짧고 감각적으로 출력하며 JSON 형식으로 응답하세요." }] },
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            baseNatureDesc: { type: "STRING" },
                            baseElementDesc: { type: "STRING" },
                            dailyFortuneDesc: { type: "STRING" },
                            luckyColor: { type: "STRING" },
                            luckyNumber: { type: "STRING" },
                            luckyItem: { type: "STRING" }
                        },
                        required: ["baseNatureDesc", "baseElementDesc", "dailyFortuneDesc", "luckyColor", "luckyNumber", "luckyItem"]
                    }
                }
            };
            const response = await fetchWithRetry(endpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
            if (response.candidates?.[0]?.content?.parts?.[0]?.text) {
                aiResult = JSON.parse(response.candidates[0].content.parts[0].text);
            }
        } catch (e) { console.error(e); }

        const chartHtml = Object.entries(elCount).map(([el, count]) => {
            const percentage = (count / 8) * 100;
            return `
                    <div class="space-y-1">
                        <div class="flex justify-between text-[10px] font-bold text-gray-500 uppercase tracking-tighter">
                            <span>${el}</span>
                            <span>${count}/8</span>
                        </div>
                        <div class="h-2 w-full bg-gray-900 rounded-full overflow-hidden border border-white/5">
                            <div class="chart-bar h-full ${elColors[el]}" style="width: ${percentage}%"></div>
                        </div>
                    </div>
                `;
        }).join('');

        const htmlDescription = `
                <div class="bg-black/40 p-5 rounded-2xl border border-white/10">
                    <div class="grid grid-cols-4 gap-2 text-center">
                        <div class="space-y-1"><span class="text-[10px] text-gray-500 font-bold">시</span><div class="text-lg font-black ${elTextColors[saju8[6].e]}">${saju8[6].s}</div><div class="text-[10px] ${elTextColors[saju8[7].e]}">${saju8[7].s}</div></div>
                        <div class="space-y-1 border-x border-white/5"><span class="text-[10px] text-gray-500 font-bold">일</span><div class="text-lg font-black ${elTextColors[saju8[4].e]}">${saju8[4].s}</div><div class="text-[10px] ${elTextColors[saju8[5].e]}">${saju8[5].s}</div></div>
                        <div class="space-y-1"><span class="text-[10px] text-gray-500 font-bold">월</span><div class="text-lg font-black ${elTextColors[saju8[2].e]}">${saju8[2].s}</div><div class="text-[10px] ${elTextColors[saju8[3].e]}">${saju8[3].s}</div></div>
                        <div class="space-y-1 border-l border-white/5"><span class="text-[10px] text-gray-500 font-bold">년</span><div class="text-lg font-black ${elTextColors[saju8[0].e]}">${saju8[0].s}</div><div class="text-[10px] ${elTextColors[saju8[1].e]}">${saju8[1].s}</div></div>
                    </div>
                </div>
                <div class="space-y-4">
                    <h4 class="text-xs font-black text-gray-400 uppercase tracking-widest flex items-center gap-2">📊 오행 기운 시각화</h4>
                    <div class="grid grid-cols-1 gap-3 px-1">${chartHtml}</div>
                </div>
                <div class="space-y-6">
                    <div class="p-5 bg-purple-500/5 border border-purple-500/10 rounded-2xl">
                        <div class="flex items-center gap-2 mb-2"><span class="text-purple-400 text-xs font-bold uppercase tracking-widest">나의 본성</span><span class="h-px flex-1 bg-purple-500/20"></span><span class="text-xs text-purple-300 font-bold">${natureScore}pt</span></div>
                        <p class="text-sm text-gray-300 leading-relaxed break-keep">${aiResult.baseNatureDesc}</p>
                    </div>
                    <div class="p-5 bg-blue-500/5 border border-blue-500/10 rounded-2xl">
                        <div class="flex items-center gap-2 mb-2"><span class="text-blue-400 text-xs font-bold uppercase tracking-widest">오행 분석</span><span class="h-px flex-1 bg-blue-500/20"></span><span class="text-xs text-blue-300 font-bold">${elementScore}pt</span></div>
                        <p class="text-sm text-gray-300 leading-relaxed break-keep">${aiResult.baseElementDesc}</p>
                    </div>
                    <div class="p-5 bg-green-500/5 border border-green-500/10 rounded-2xl">
                        <div class="flex items-center gap-2 mb-2"><span class="text-green-400 text-xs font-bold uppercase tracking-widest">오늘의 운세</span><span class="h-px flex-1 bg-green-500/20"></span><span class="text-xs text-green-300 font-black">${dailyScore}pt</span></div>
                        <p class="text-sm text-gray-200 leading-relaxed font-bold italic break-keep">"${aiResult.dailyFortuneDesc}"</p>
                    </div>
                </div>
                <!-- 행운 아이템 - 간결한 버전 -->
                <div class="p-6 bg-yellow-500/10 border border-yellow-500/20 rounded-[1.5rem] relative overflow-hidden group">
                    <h4 class="text-yellow-500 text-xs font-black uppercase tracking-widest mb-4">Lucky Items</h4>
                    <div class="grid grid-cols-3 gap-3">
                        <div class="text-center p-3 rounded-2xl bg-black/30 border border-white/5"><div class="text-[10px] text-gray-500 mb-1 font-bold">COLOR</div><div class="text-xs font-bold text-white whitespace-nowrap">${aiResult.luckyColor}</div></div>
                        <div class="text-center p-3 rounded-2xl bg-black/30 border border-white/5"><div class="text-[10px] text-gray-500 mb-1 font-bold">NUMBER</div><div class="text-sm font-black text-yellow-500">${aiResult.luckyNumber}</div></div>
                        <div class="text-center p-3 rounded-2xl bg-black/30 border border-white/5"><div class="text-[10px] text-gray-500 mb-1 font-bold">ITEM</div><div class="text-xs font-bold text-white whitespace-nowrap">${aiResult.luckyItem}</div></div>
                    </div>
                </div>
            `;

        return { score: totalScore, htmlDescription, name };
    }

    const btnBattle = document.getElementById('battle-btn');
    const btnRetry = document.getElementById('retry-btn');
    const inputSection = document.getElementById('input-section');
    const loadingSection = document.getElementById('loading-section');
    const resultSection = document.getElementById('result-section');

    // 입력창 최대 날짜를 오늘로 설정 (긴 연도 입력 및 미래 날짜 방지)
    const todayDateStr = new Date().toISOString().split('T')[0];
    document.getElementById('p1-date').setAttribute('max', todayDateStr);
    document.getElementById('p2-date').setAttribute('max', todayDateStr);

    btnBattle.addEventListener('click', async () => {
        const p1 = { name: document.getElementById('p1-name').value.trim(), date: document.getElementById('p1-date').value, time: document.getElementById('p1-time').value };
        const p2 = { name: document.getElementById('p2-name').value.trim(), date: document.getElementById('p2-date').value, time: document.getElementById('p2-time').value };

        if(!p1.name) return showModal("도전자 1의 이름을 입력하세요!");
        if(!p1.date) return showModal("도전자 1의 올바른 생년월일을 입력하세요!");
        if(!p2.name) return showModal("도전자 2의 이름을 입력하세요!");
        if(!p2.date) return showModal("도전자 2의 올바른 생년월일을 입력하세요!");

        const today = new Date(); today.setHours(0,0,0,0);
        if (new Date(p1.date) > today) return showModal("도전자 1의 생일이 미래 날짜입니다!");
        if (new Date(p2.date) > today) return showModal("도전자 2의 생일이 미래 날짜입니다!");

        inputSection.classList.add('hidden');
        loadingSection.classList.remove('hidden');
        loadingSection.classList.add('flex');

        try {
            const [r1, r2] = await Promise.all([generateSajuResult(p1.name, p1.date, p1.time), generateSajuResult(p2.name, p2.date, p2.time)]);
            loadingSection.classList.add('hidden');
            loadingSection.classList.remove('flex');
            showResults(r1, r2);
        } catch (e) {
            loadingSection.classList.add('hidden');
            loadingSection.classList.remove('flex');
            inputSection.classList.remove('hidden');
            showModal("API 호출 중 오류가 발생했습니다.");
        }
    });

    function showResults(r1, r2) {
        resultSection.classList.remove('hidden');
        document.getElementById('p1-res-name').innerText = r1.name;
        document.getElementById('p1-res-score').innerText = r1.score;
        document.getElementById('p1-res-desc').innerHTML = r1.htmlDescription;
        document.getElementById('p2-res-name').innerText = r2.name;
        document.getElementById('p2-res-score').innerText = r2.score;
        document.getElementById('p2-res-desc').innerHTML = r2.htmlDescription;

        const winAnn = document.getElementById('winner-announcement');
        const diffAnn = document.getElementById('score-difference');

        // 모든 카드를 선명하게 유지
        document.getElementById('p1-result-card').style.opacity = '1';
        document.getElementById('p2-result-card').style.opacity = '1';

        const diff = Math.abs(r1.score - r2.score);
        let scoreTitle = diff === 0 ? "🤝 무승부 🤝" : (r1.score > r2.score ? `🏆 승리: ${r1.name} 🏆` : `🏆 승리: ${r2.name} 🏆`);
        let scoreClass = diff === 0 ? "from-yellow-300 to-yellow-600" : (r1.score > r2.score ? "from-blue-400 to-blue-600" : "from-red-400 to-red-600");

        winAnn.innerText = scoreTitle;
        winAnn.className = `text-5xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r ${scoreClass} mb-8 animate-bounce mystic-font`;

        // 스코어보드 디자인 대폭 강화
        diffAnn.innerHTML = `
                <div class="text-2xl md:text-3xl font-bold text-gray-300 italic mb-6">${diff === 0 ? '막상막하의 대결이었습니다!' : diff + '점 차이로 승리했습니다!'}</div>
                <div class="flex flex-col items-center gap-8 bg-white/5 p-10 rounded-[3rem] border border-white/10 shadow-[0_0_60px_rgba(0,0,0,0.5)] min-w-[320px]">
                    <!-- 이름 대 이름 -->
                    <div class="flex items-center justify-between w-full gap-8 px-4">
                        <span class="text-2xl md:text-4xl font-black text-white mystic-font tracking-tight min-w-[80px] text-right">${r1.name}</span>
                        <span class="text-yellow-500 text-3xl font-black">:</span>
                        <span class="text-2xl md:text-4xl font-black text-white mystic-font tracking-tight min-w-[80px] text-left">${r2.name}</span>
                    </div>
                    <!-- 점수 대 점수 -->
                    <div class="flex items-center justify-between w-full gap-8 bg-black/40 py-6 px-10 rounded-3xl border border-white/5">
                        <span class="text-5xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-b from-blue-300 to-blue-600 min-w-[80px] text-right">${r1.score}</span>
                        <span class="text-white/10 text-5xl font-light">|</span>
                        <span class="text-5xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-b from-red-300 to-red-600 min-w-[80px] text-left">${r2.score}</span>
                    </div>
                </div>
            `;

        setTimeout(() => {
            document.querySelectorAll('.chart-bar').forEach(bar => {
                const width = bar.style.width;
                bar.style.width = '0';
                setTimeout(() => bar.style.width = width, 100);
            });
        }, 100);
    }

    btnRetry.addEventListener('click', () => {
        resultSection.classList.add('hidden');
        inputSection.classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });
</script>
</body>
</html>
