<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backend Master Quiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;900&display=swap');

    body {
      font-family: 'Pretendard', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .keyword-card {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .keyword-card:active {
      transform: scale(0.95);
    }

    .stage-card {
      transition: all 0.3s ease;
    }

    .stage-card:not(.locked):hover {
      transform: translateY(-5px);
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #e2e8f0;
      border-radius: 10px;
    }

    /* 뷰 전환 애니메이션 */
    .view { display: none; }
    .view.active { display: block; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

<div id="app" class="max-w-5xl mx-auto px-4 py-6 md:py-10">

  <!-- 헤더 (로비 제외 상시 노출) -->
  <header id="quiz-header" class="hidden flex justify-between items-center mb-8 animate__animated animate__fadeIn">
    <button onclick="showLobby()" class="flex items-center text-slate-500 font-bold hover:text-indigo-600 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      로비
    </button>
    <div class="flex items-center gap-4">
      <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Progress</span>
      <div id="progress-dots" class="flex gap-1.5">
        <!-- Dots generated by JS -->
      </div>
    </div>
  </header>

  <!-- [1] 로비 뷰 -->
  <section id="view-lobby" class="view active animate__animated animate__fadeIn">
    <div class="text-center mb-16 space-y-4">
      <div class="inline-flex p-4 bg-indigo-600 rounded-[2rem] mb-4 shadow-2xl shadow-indigo-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
      </div>
      <h1 class="text-5xl md:text-6xl font-black text-slate-900 tracking-tighter">Backend Master</h1>
      <p class="text-slate-500 font-bold max-w-lg mx-auto text-lg leading-relaxed">
        핵심 키워드 정복 챌린지. <br/>
        <span class="text-indigo-600 underline underline-offset-4 font-black">10문제를 모두 맞추어야</span> 다음 스테이지가 해금됩니다.
      </p>
      <div class="pt-6 flex justify-center gap-10">
        <div class="text-center">
          <p id="stat-unlocked" class="text-4xl font-black text-indigo-600">1</p>
          <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mt-1">Unlocked</p>
        </div>
        <div class="w-px h-12 bg-slate-200 self-center"></div>
        <div class="text-center">
          <p id="stat-completed" class="text-4xl font-black text-green-500">0</p>
          <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mt-1">Completed</p>
        </div>
      </div>
    </div>

    <div id="stage-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Stages generated by JS -->
    </div>
  </section>

  <!-- [2] 퀴즈 플레이 뷰 -->
  <section id="view-playing" class="view animate__animated animate__fadeInUp">
    <div class="max-w-4xl mx-auto space-y-12">
      <div class="text-center space-y-6">
                    <span id="quiz-badge" class="inline-block px-5 py-1.5 bg-indigo-100 text-indigo-700 rounded-full text-xs font-black uppercase tracking-[0.2em] shadow-sm">
                        Stage 1 • Q1/10
                    </span>
        <h1 id="quiz-topic" class="text-3xl md:text-5xl font-black leading-[1.15] text-slate-900 px-4 tracking-tighter">
          TCP 3-Way Handshake 플래그
        </h1>
        <p class="text-slate-500 font-bold text-lg">연관 키워드 <span id="required-count" class="text-indigo-600 text-2xl font-black mx-1">2</span>개를 선택하세요.</p>
      </div>

      <div id="options-grid" class="grid grid-cols-2 md:grid-cols-3 gap-5 px-2">
        <!-- Options generated by JS -->
      </div>

      <div class="flex justify-center pt-10">
        <button id="btn-submit" disabled class="w-full max-w-lg py-6 rounded-3xl font-black text-2xl shadow-2xl transition-all duration-300 bg-slate-200 text-slate-400 cursor-not-allowed">
          제출하여 확인
        </button>
      </div>
    </div>
  </section>

  <!-- [3] 피드백 뷰 -->
  <section id="view-feedback" class="view animate__animated animate__zoomIn">
    <div class="max-w-4xl mx-auto space-y-8 pb-20">
      <div id="feedback-card" class="rounded-[2.5rem] shadow-2xl overflow-hidden border-4">
        <div id="feedback-header" class="p-10 text-white flex flex-col md:flex-row items-center justify-between gap-6">
          <div class="flex items-center gap-6">
            <div id="feedback-icon-container"></div>
            <div>
              <h2 id="feedback-title" class="text-4xl font-black tracking-tight">정답입니다!</h2>
              <p id="feedback-subtitle" class="opacity-90 font-black text-lg">키워드를 정확하게 파악하셨습니다.</p>
            </div>
          </div>
          <button id="btn-retry" class="hidden bg-white text-red-600 hover:bg-red-50 px-6 py-4 rounded-2xl transition-all flex items-center gap-2 font-black text-base shadow-xl active:scale-95">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            다시 풀어보기
          </button>
        </div>

        <div class="p-10 space-y-12 bg-white">
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
            <section class="space-y-8">
              <div>
                <h4 class="flex items-center gap-2 text-indigo-600 font-black text-xs uppercase tracking-widest mb-3">01. 키워드 해설</h4>
                <p id="exp-core" class="text-slate-800 leading-relaxed font-bold text-lg"></p>
              </div>
              <div>
                <h4 class="flex items-center gap-2 text-emerald-600 font-black text-xs uppercase tracking-widest mb-3">02. 실무 예시</h4>
                <p id="exp-example" class="text-slate-600 italic font-bold bg-slate-50 p-5 rounded-2xl border border-slate-100"></p>
              </div>
            </section>

            <section class="bg-indigo-50/50 p-8 rounded-[2rem] border-2 border-indigo-100 space-y-6 self-start">
              <div class="flex items-center justify-between">
                <h4 class="flex items-center gap-2 text-indigo-700 font-black text-sm uppercase tracking-widest">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                  Interview Prep
                </h4>
                <span class="bg-indigo-600 text-white text-[10px] font-black px-2 py-0.5 rounded tracking-tighter uppercase">Focus</span>
              </div>
              <div class="space-y-6">
                <div>
                  <p class="text-[10px] font-black text-indigo-400 uppercase mb-2">핵심 예상 질문</p>
                  <p id="exp-q" class="font-black text-slate-900 text-xl leading-snug tracking-tight"></p>
                </div>
                <div class="h-px bg-indigo-100"></div>
                <div>
                  <p class="text-[10px] font-black text-indigo-400 uppercase mb-2">모범 답변 가이드</p>
                  <p id="exp-a" class="text-slate-700 leading-relaxed font-bold text-base"></p>
                </div>
              </div>
            </section>
          </div>

          <div class="flex gap-4 pt-4">
            <button id="btn-next" class="flex-1 font-black py-6 rounded-3xl shadow-2xl transition-all flex justify-center items-center gap-3 text-xl active:scale-95 bg-indigo-600 text-white hover:bg-indigo-700 shadow-indigo-500/30">
              <span id="next-text">다음 키워드로</span>
              <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- [4] 결과 뷰 (성공/실패) -->
  <section id="view-result" class="view animate__animated animate__fadeIn">
    <div id="result-container" class="max-w-2xl mx-auto text-center space-y-8">
      <!-- Result content generated by JS -->
    </div>
  </section>

</div>

<script>
  // --- 데이터 정의 ---
  const QUIZ_DATA = [
    {
      level: 1,
      title: "네트워크 & HTTP 구조",
      questions: [
        {
          id: "l1-q1",
          topic: "TCP 3-Way Handshake 플래그",
          requiredCount: 2,
          correctKeywords: ["SYN", "ACK"],
          allOptions: ["SYN", "ACK", "FIN", "RST", "PSH", "URG"],
          explanation: {
            core: "TCP 연결 성립 시 클라이언트는 SYN(동기화)을 보내고, 서버는 SYN+ACK(수락)로 응답하며, 마지막으로 클라이언트가 ACK(확인)를 보냅니다.",
            example: "서버 지연 시 클라이언트가 SYN_SENT 상태에서 응답을 기다리는 현상을 패킷 분석기로 확인할 수 있습니다.",
            interviewQuestion: "왜 2-way가 아닌 3-way handshake를 사용하나요?",
            interviewAnswer: "TCP는 양방향 통신이므로 서버도 자신의 송수신 상태가 정상인지 클라이언트로부터 확인(ACK)받아야 신뢰성이 보장되기 때문입니다."
          }
        },
        {
          id: "l1-q2",
          topic: "HTTP 멱등성 보장 메서드",
          requiredCount: 2,
          correctKeywords: ["GET", "PUT"],
          allOptions: ["GET", "PUT", "POST", "PATCH", "DELETE", "HEAD"],
          explanation: {
            core: "멱등성은 동일 요청을 여러 번 수행해도 서버 상태가 같은 성질입니다. GET(조회)과 PUT(교체)은 반복해도 결과가 같지만 POST는 계속 새 자원을 만듭니다.",
            example: "결제 요청 시 중복 결제를 막기 위해 멱등성 키를 사용하거나 PUT을 활용해 상태를 업데이트합니다.",
            interviewQuestion: "POST와 PUT의 결정적 차이는?",
            interviewAnswer: "POST는 비멱등(리소스 생성), PUT은 멱등(리소스 덮어쓰기) 성질을 가진다는 점입니다."
          }
        },
        {
          id: "l1-q3",
          topic: "OSI 6계층 (표현 계층) 역할",
          requiredCount: 2,
          correctKeywords: ["데이터 인코딩", "암호화/압축"],
          allOptions: ["데이터 인코딩", "암호화/압축", "라우팅", "흐름 제어", "프로세스 통신"],
          explanation: {
            core: "표현 계층은 데이터의 형식을 결정하고, 보안을 위한 암호화와 전송 효율을 위한 압축을 수행하여 응용 계층에 전달합니다.",
            example: "HTTPS의 SSL/TLS 암호화나 JPEG 파일의 포맷 변환이 이 계층의 업무입니다.",
            interviewQuestion: "SSL/TLS는 어느 계층에서 동작하나요?",
            interviewAnswer: "논리적으로는 표현 계층(L6)에서 데이터의 보안 형식을 정의하며 전송 계층 위에서 동작합니다."
          }
        },
        {
          id: "l1-q4",
          topic: "REST Self-descriptive 구성 요소",
          requiredCount: 2,
          correctKeywords: ["Content-Type", "Method"],
          allOptions: ["Content-Type", "Method", "Cookie", "Status", "Proxy"],
          explanation: {
            core: "자체 표현 구조는 메시지만 보고도 그 의미를 해석 가능해야 함을 뜻하며, 헤더의 Content-Type과 HTTP Method가 그 핵심입니다.",
            example: "응답 본문이 JSON임을 알리기 위해 application/json 헤더를 반드시 포함해야 합니다.",
            interviewQuestion: "REST의 Stateless 특징이란?",
            interviewAnswer: "서버가 클라이언트의 상태를 저장하지 않아 각 요청이 독립적이며 서버 확장이 용이한 특징입니다."
          }
        },
        {
          id: "l1-q5",
          topic: "HTTP/2 성능 향상 기술",
          requiredCount: 2,
          correctKeywords: ["Multiplexing", "Header Compression"],
          allOptions: ["Multiplexing", "Header Compression", "Keep-Alive", "Pipelining", "Caching"],
          explanation: {
            core: "HTTP/2는 하나의 연결에서 여러 스트림을 병렬로 처리하는 Multiplexing과 헤더 압축(HPACK)을 통해 지연 시간을 대폭 줄였습니다.",
            example: "웹 페이지의 수많은 아이콘과 CSS를 동시에 다운로드하여 로딩 속도를 개선합니다.",
            interviewQuestion: "Multiplexing의 장점은?",
            interviewAnswer: "HTTP/1.1의 문제인 Head-of-Line Blocking을 해결하여 네트워크 리소스를 효율적으로 사용합니다."
          }
        },
        {
          id: "l1-q6",
          topic: "UDP 프로토콜의 핵심 특징",
          requiredCount: 2,
          correctKeywords: ["비신뢰성", "비연결성"],
          allOptions: ["비신뢰성", "비연결성", "흐름 제어", "혼잡 제어", "순서 보장"],
          explanation: {
            core: "UDP는 수신 확인 없이 데이터를 일방적으로 던지므로 빠르지만, 전송 성공이나 순서를 보장하지 않는 비신뢰적 특성을 갖습니다.",
            example: "지연 시간이 중요한 실시간 스트리밍이나 게임 패킷 전송에 최적입니다.",
            interviewQuestion: "TCP 대신 UDP를 사용하는 경우는?",
            interviewAnswer: "신뢰성보다 속도와 실시간성이 중요한 서비스(VoIP, 게임 등)에서 사용합니다."
          }
        },
        {
          id: "l1-q7",
          topic: "URI 리소스 식별 주소 구조",
          requiredCount: 2,
          correctKeywords: ["Path", "Query String"],
          allOptions: ["Path", "Query String", "Scheme", "Port", "Fragment"],
          explanation: {
            core: "Path는 리소스의 계층적 위치를, Query String은 검색이나 필터링 조건을 담아 특정 리소스를 구체적으로 식별합니다.",
            example: "/users/1?active=true 에서 /users/1은 Path, ?active=true는 Query String입니다.",
            interviewQuestion: "Path Variable과 Query Parameter의 차이는?",
            interviewAnswer: "식별이 목적이면 Path Variable을, 정렬이나 검색 등 조건 전달이 목적이면 Query Parameter를 사용합니다."
          }
        },
        {
          id: "l1-q8",
          topic: "중계 및 부하 분산 구성 요소",
          requiredCount: 2,
          correctKeywords: ["Reverse Proxy", "Load Balancer"],
          allOptions: ["Reverse Proxy", "Load Balancer", "Forward Proxy", "Gateway", "Bridge"],
          explanation: {
            core: "Reverse Proxy는 서버 정보를 은닉하고 캐싱을 수행하며, Load Balancer는 트래픽을 여러 서버로 분배하여 가용성을 높입니다.",
            example: "Nginx를 리버스 프록시로 두고 트래픽을 여러 대의 WAS로 분산하는 아키텍처가 전형적입니다.",
            interviewQuestion: "리버스 프록시의 보안상 이점은?",
            interviewAnswer: "WAS의 실제 IP 주소를 외부로 노출시키지 않아 직접적인 공격을 방어할 수 있습니다."
          }
        },
        {
          id: "l1-q9",
          topic: "HTTP 401 vs 403 상태 구분",
          requiredCount: 2,
          correctKeywords: ["인증 실패", "인가 실패"],
          allOptions: ["인증 실패", "인가 실패", "데이터 부재", "서버 오류", "파라미터 누락"],
          explanation: {
            core: "401(Unauthorized)은 누구인지 모르는 인증 실패를, 403(Forbidden)은 누구인지는 알지만 권한이 없는 인가 실패를 의미합니다.",
            example: "로그인 안 한 사용자에게는 401을, 일반 사용자에게 관리자 메뉴를 막을 때는 403을 반환합니다.",
            interviewQuestion: "401과 403 에러의 차이를 한 줄로 설명한다면?",
            interviewAnswer: "401은 '신원 확인'이 안 된 상태이고, 403은 '신원 확인'은 됐으나 '권한'이 없는 상태입니다."
          }
        },
        {
          id: "l1-q10",
          topic: "HTTP/2 프레임 단위 전송 방식",
          requiredCount: 2,
          correctKeywords: ["Binary Framing", "Stream"],
          allOptions: ["Binary Framing", "Stream", "텍스트 기반", "동기적 전송", "파이프라이닝"],
          explanation: {
            core: "HTTP/2는 이진 프레임 계층을 통해 데이터를 쪼개고 독립적인 스트림 단위로 전송하여 병렬 처리를 가능하게 합니다.",
            example: "대용량 데이터를 보낼 때 다른 작은 요청들이 막히지 않고 프레임 단위로 섞여서 전송됩니다.",
            interviewQuestion: "이진 프레임 계층을 도입한 이유는?",
            interviewAnswer: "텍스트보다 파싱이 빠르고 효율적이며 메시지를 조각내어 멀티플렉싱을 가능하게 하기 위해서입니다."
          }
        }
      ]
    },
    {
      level: 2,
      title: "자바 & 데이터베이스 핵심",
      questions: [
        {
          id: "l2-q1",
          topic: "JVM 모든 스레드 공유 메모리",
          requiredCount: 2,
          correctKeywords: ["Heap", "Method Area"],
          allOptions: ["Heap", "Method Area", "Stack", "PC Register", "Native Stack"],

  // --- 유틸리티 ---
  function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function switchView(viewName) {
    state.view = viewName;
    document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));

    const header = document.getElementById('quiz-header');
    if (viewName === 'lobby') {
      header.classList.add('hidden');
      renderLobby();
    } else {
      header.classList.remove('hidden');
      renderProgressDots();
    }
  }

  function renderLobby() {

    grid.innerHTML = '';

    document.getElementById('stat-unlocked').innerText = state.unlockedLevel;
    document.getElementById('stat-completed').innerText = state.completedLevels.length;

    QUIZ_DATA.forEach((level, idx) => {

    const level = QUIZ_DATA[state.currentLevelIdx];

    document.getElementById('quiz-badge').innerText = `Stage ${level.level} • Q${state.currentQuestionIdx + 1}/10`;

    document.getElementById('required-count').innerText = q.requiredCount;

    const grid = document.getElementById('options-grid');
    grid.innerHTML = '';

    state.shuffledOptions.forEach(option => {

      card.innerText = option;
      const isSelected = state.selectedKeywords.includes(option);
      card.className = `keyword-card p-4 border-2 rounded-2xl text-center cursor-pointer font-black select-none flex items-center justify-center min-h-[75px] text-sm ${isSelected ? STYLES.keywordSelected : STYLES.keywordDefault}`;

      grid.appendChild(card);
    });

    updateSubmitButton();
  }

                            <svg xmlns="http://www.w3.org/2000/svg" class="w-20 h-20 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
                        </div>
                        <h1 class="text-5xl font-black mb-4 text-slate-800 uppercase tracking-tighter">Try Again</h1>
                        <p class="text-slate-500 font-bold text-xl mb-6">모든 문제(10/10)를 맞춰야 스테이지가 완료됩니다.</p>
                        <div class="bg-red-50 p-8 rounded-3xl mb-12 border border-red-100">
                            <p class="text-red-600 font-black text-7xl">${state.correctCount} <span class="text-2xl text-red-300">/ 10</span></p>
                            <p class="text-[10px] font-black text-red-400 uppercase tracking-[0.3em] mt-3">Accuracy Goal: 100%</p>
                        </div>
                        <div class="flex flex-col gap-4">
                            <button onclick="startLevel(${state.currentLevelIdx})" class="w-full bg-slate-900 hover:bg-black text-white font-black py-6 rounded-3xl shadow-2xl transition-all text-2xl active:scale-95">
                                이 단계 처음부터 다시하기
                            </button>
                            <button onclick="showLobby()" class="w-full bg-transparent border-2 border-slate-200 text-slate-500 font-black py-5 rounded-3xl text-xl active:scale-95">
                                로비로 돌아가기
                            </button>
                        </div>
                    </div>
                `;
    }
  }

  // --- 로직 제어 함수들 ---
  function startLevel(idx) {
    state.currentLevelIdx = idx;
    state.currentQuestionIdx = 0;
    state.correctCount = 0;
    prepareQuestion();
    switchView('playing');
  }

  function prepareQuestion() {
    const q = QUIZ_DATA[state.currentLevelIdx].questions[state.currentQuestionIdx];
    state.selectedKeywords = [];
    state.shuffledOptions = shuffle(q.allOptions);
    renderQuestion();
  }

  function toggleKeyword(option) {
    const q = QUIZ_DATA[state.currentLevelIdx].questions[state.currentQuestionIdx];
    if (state.selectedKeywords.includes(option)) {
      state.selectedKeywords = state.selectedKeywords.filter(k => k !== option);
    } else if (state.selectedKeywords.length < q.requiredCount) {
      state.selectedKeywords.push(option);
    }
    renderQuestion();
  }

  function handleSubmit() {
    const q = QUIZ_DATA[state.currentLevelIdx].questions[state.currentQuestionIdx];
    const isCorrect = state.selectedKeywords.length === q.correctKeywords.length &&
            state.selectedKeywords.every(k => q.correctKeywords.includes(k));

    state.isCurrentCorrect = isCorrect;
    if (isCorrect) state.correctCount++;

    renderFeedback();
    switchView('feedback');
  }

  function handleRetry() {
    // 오답 시 correctCount 원복 (이미 더해졌다면) -> 여기서는 feedback 진입 시 정답일 때만 더하므로 상관없음
    // 하지만 다시 풀어서 정답을 맞춰야 하므로 question으로 보냄
    state.selectedKeywords = [];
    switchView('playing');
    renderQuestion();
  }

  function handleNext() {
    if (state.currentQuestionIdx < 9) {
      state.currentQuestionIdx++;
      prepareQuestion();
      switchView('playing');
    } else {
      processLevelClear();
      renderResult();
      switchView('result');
    }
  }

  function processLevelClear() {
    const levelNum = QUIZ_DATA[state.currentLevelIdx].level;
    if (state.correctCount === 10) {
      if (!state.completedLevels.includes(levelNum)) {
        state.completedLevels.push(levelNum);
      }
      if (levelNum === state.unlockedLevel && state.unlockedLevel < 30) {
        state.unlockedLevel++;
      }
      saveProgress();
    }
  }

  function showLobby() {
    switchView('lobby');
  }

  // --- 초기화 ---
  window.onload = () => {
    document.getElementById('btn-submit').onclick = handleSubmit;
    document.getElementById('btn-next').onclick = handleNext;
    document.getElementById('btn-retry').onclick = handleRetry;
    renderLobby();
  };

  const STYLES = {
    keywordDefault: "border-slate-100 hover:border-indigo-400 bg-slate-50/50",
    keywordSelected: "border-indigo-600 bg-indigo-50 text-indigo-700 ring-4 ring-indigo-600/10"
  };
</script>
</body>
</html>
