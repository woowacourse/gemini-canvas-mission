<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>슬랙 테마 생성기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(156, 163, 175, 0.3); border-radius: 20px; }
        
        .hidden-scrollbar::-webkit-scrollbar { display: none; }
        
        .preview-container {
            aspect-ratio: 16 / 10;
            max-height: 100%;
            max-width: calc((100vh - 6rem) * 1.6);
        }

        #drop-zone.dragging {
            border-color: #a855f7;
            background-color: rgba(168, 85, 247, 0.1);
        }

        /* 슬랙 테마 그라데이션 엔진 */
        .slack-gradient {
            transition: background 0.5s ease;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 transition-colors duration-300" id="body">
    <div class="min-h-screen p-4 lg:p-8">
        <div class="max-w-[1800px] mx-auto h-[calc(100vh-4rem)] flex flex-col lg:flex-row gap-6">
            
            <!-- 좌측: 컨트롤 패널 -->
            <aside class="w-full lg:w-[400px] flex-shrink-0 flex flex-col gap-5 overflow-y-auto pr-2 pb-4 hidden-scrollbar">
                
                <!-- 헤더 & 다크모드 -->
                <div class="p-6 rounded-2xl shadow-sm border bg-white border-black/5 flex justify-between items-center" id="header-card">
                    <div class="flex items-center gap-3">
                        <div class="p-2.5 bg-[#1264a3] rounded-xl text-white">
                            <i data-lucide="palette" size="20"></i>
                        </div>
                        <h1 class="text-lg font-black tracking-tight">테마 설정</h1>
                    </div>
                    <button onclick="toggleDarkMode()" class="p-2 rounded-lg border border-gray-200 hover:bg-gray-50 transition-all" id="dark-mode-btn">
                        🌙
                    </button>
                </div>

                <!-- AI 이미지 테마 생성 -->
                <div class="p-6 rounded-2xl shadow-sm border bg-white border-black/5 flex-shrink-0 space-y-4 relative overflow-hidden" id="ai-card">
                    <div class="flex items-center justify-between">
                        <h2 class="text-xs font-black uppercase tracking-widest opacity-50 flex items-center gap-2">
                            <i data-lucide="sparkles" class="text-purple-500 w-3.5 h-3.5"></i> AI 이미지 테마 생성
                        </h2>
                    </div>
                    
                    <div id="drop-zone" class="flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-gray-200 rounded-xl cursor-pointer transition-all hover:border-purple-500/50 hover:bg-purple-500/5 group">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6 px-4 text-center pointer-events-none" id="upload-status">
                            <div class="p-3 rounded-full mb-3 bg-gray-100 text-gray-400 group-hover:bg-purple-500 group-hover:text-white transition-colors">
                                <i data-lucide="image-plus"></i>
                            </div>
                            <p class="text-sm font-bold text-gray-600">이미지를 드롭하거나 클릭</p>
                            <p class="text-[11px] text-gray-400 mt-1">AI가 어울리는 색상을 추출합니다</p>
                        </div>
                        <input type="file" id="file-input" class="hidden" accept="image/*">
                    </div>
                    <p id="error-msg" class="text-[11px] text-red-500 font-bold text-center hidden"></p>
                </div>

                <!-- 색상 지정 -->
                <div class="p-6 rounded-2xl shadow-sm border bg-white border-black/5 flex-shrink-0 space-y-6" id="colors-card">
                    <h2 class="text-xs font-black uppercase tracking-widest opacity-50">색상 지정</h2>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-1.5">
                            <label class="text-[11px] font-bold opacity-70">시스템 탐색</label>
                            <div class="relative flex items-center gap-2 p-2 rounded-xl border border-gray-200 bg-gray-50 hover:border-gray-300 transition-all overflow-hidden cursor-pointer">
                                <input type="color" id="color-systemNav" oninput="updateColor('systemNav', this.value)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                                <div id="swatch-systemNav" class="w-6 h-6 rounded-md shadow-sm border border-black/10 pointer-events-none"></div>
                                <span id="text-systemNav" class="text-[11px] font-mono font-bold uppercase pointer-events-none">#611F69</span>
                            </div>
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-[11px] font-bold opacity-70">선택된 항목</label>
                            <div class="relative flex items-center gap-2 p-2 rounded-xl border border-gray-200 bg-gray-50 hover:border-gray-300 transition-all overflow-hidden cursor-pointer">
                                <input type="color" id="color-selectedItem" oninput="updateColor('selectedItem', this.value)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                                <div id="swatch-selectedItem" class="w-6 h-6 rounded-md shadow-sm border border-black/10 pointer-events-none"></div>
                                <span id="text-selectedItem" class="text-[11px] font-mono font-bold uppercase pointer-events-none">#F9EDFF</span>
                            </div>
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-[11px] font-bold opacity-70">현재 상태</label>
                            <div class="relative flex items-center gap-2 p-2 rounded-xl border border-gray-200 bg-gray-50 hover:border-gray-300 transition-all overflow-hidden cursor-pointer">
                                <input type="color" id="color-presence" oninput="updateColor('presence', this.value)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                                <div id="swatch-presence" class="w-6 h-6 rounded-md shadow-sm border border-black/10 pointer-events-none"></div>
                                <span id="text-presence" class="text-[11px] font-mono font-bold uppercase pointer-events-none">#4CC894</span>
                            </div>
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-[11px] font-bold opacity-70">알림</label>
                            <div class="relative flex items-center gap-2 p-2 rounded-xl border border-gray-200 bg-gray-50 hover:border-gray-300 transition-all overflow-hidden cursor-pointer">
                                <input type="color" id="color-badge" oninput="updateColor('badge', this.value)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                                <div id="swatch-badge" class="w-6 h-6 rounded-md shadow-sm border border-black/10 pointer-events-none"></div>
                                <span id="text-badge" class="text-[11px] font-mono font-bold uppercase pointer-events-none">#EABDFB</span>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-4 pt-4 border-t border-black/5">
                        <label class="flex items-center justify-between cursor-pointer group">
                            <span class="text-sm font-bold opacity-80">창 그라데이션 적용</span>
                            <div class="relative">
                                <input type="checkbox" id="gradient-toggle" checked onchange="toggleGradient()" class="sr-only">
                                <div id="toggle-bg" class="w-10 h-5 rounded-full bg-[#1264a3] transition-all"></div>
                                <div id="toggle-circle" class="absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full transition-transform translate-x-5"></div>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- 테마 공유 및 프리셋 저장 -->
                <div class="p-6 rounded-2xl shadow-sm border bg-white border-black/5 flex-shrink-0 space-y-4" id="share-card">
                    <h2 class="text-xs font-black uppercase tracking-widest opacity-50 mb-2">테마 코드</h2>
                    <div class="flex flex-col gap-3">
                        <button onclick="copyThemeCode()" class="w-full py-3 rounded-xl font-bold text-sm flex items-center justify-center gap-2 bg-[#1264a3] hover:bg-[#0b4d82] text-white transition-all" id="copy-btn">
                            <i data-lucide="copy" class="w-4 h-4"></i> <span id="copy-text">테마 복사하기</span>
                        </button>
                        
                        <div class="flex gap-2">
                            <input type="text" id="theme-input" placeholder="#000,#FFF,#333,#444" oninput="handleTextInput(this.value)" class="flex-1 p-3 rounded-xl text-xs font-mono border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-[#1264a3]/50">
                            <button onclick="saveToPresets()" class="px-4 py-3 bg-gray-200 rounded-xl font-bold text-xs hover:bg-gray-300 transition-all" title="프리셋으로 저장">
                                <i data-lucide="plus" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 기본 프리셋 -->
                <div class="p-6 rounded-2xl shadow-sm border bg-white border-black/5 flex-1 min-h-[200px]" id="presets-card">
                    <h2 class="text-xs font-black uppercase tracking-widest opacity-50 mb-4 flex items-center gap-2">
                        <i data-lucide="list" class="w-3.5 h-3.5"></i> 기본 프리셋
                    </h2>
                    <div class="flex flex-col gap-2" id="presets-list">
                        <!-- Presets injected by JS -->
                    </div>
                </div>
            </aside>

            <!-- 우측: 슬랙 미리보기 -->
            <div class="flex-1 flex items-center justify-center min-w-0 h-full overflow-hidden">
                <main id="slack-main" class="w-full preview-container rounded-[20px] shadow-2xl overflow-hidden flex flex-col relative border border-black/10 slack-gradient">
                    
                    <!-- 상단바 -->
                    <div id="slack-nav" class="h-11 flex items-center justify-between px-4 shrink-0 transition-colors z-30 border-b border-black/10 bg-transparent" style="color: white;">
                        <div class="flex gap-2">
                            <div class="w-3 h-3 rounded-full bg-[#ff5f56]"></div>
                            <div class="w-3 h-3 rounded-full bg-[#ffbd2e]"></div>
                            <div class="w-3 h-3 rounded-full bg-[#27c93f]"></div>
                        </div>
                        <div class="flex gap-4 items-center flex-1 max-w-2xl mx-auto ml-10">
                            <div class="flex gap-3 text-xs font-bold items-center opacity-50">
                                <span>←</span><span>→</span><i data-lucide="history" class="w-3.5 h-3.5"></i>
                            </div>
                            <div class="h-[26px] flex-1 rounded-md flex items-center px-3 gap-2 text-[12px] border bg-black/5 border-black/5 text-gray-500">
                                <i data-lucide="search" class="w-3 h-3"></i> <span>개발팀 검색</span>
                            </div>
                        </div>
                        <i data-lucide="help-circle" class="w-4 h-4 opacity-50"></i>
                    </div>

                    <div class="flex flex-1 overflow-hidden">
                        <!-- 사이드바 -->
                        <div id="slack-sidebar" class="w-[240px] shrink-0 flex flex-col transition-all duration-500 border-r border-black/10 bg-transparent" style="color: white;">
                            <div class="h-12 flex items-center justify-between px-4 font-black text-[15px] border-b border-black/10">
                                <span class="truncate">개발팀 워크스...</span>
                                <i data-lucide="chevron-down" class="w-4 h-4 opacity-50"></i>
                            </div>
                            <div class="flex-1 py-3 space-y-0.5 overflow-y-auto font-medium text-[13px] custom-scrollbar">
                                <div class="px-4 py-1 flex items-center gap-3 opacity-70 hover:opacity-100 cursor-pointer"><i data-lucide="smile" class="w-4 h-4"></i> 시작하기</div>
                                <div class="px-4 py-1 flex items-center gap-3 opacity-70 hover:opacity-100 cursor-pointer"><i data-lucide="message-square" class="w-4 h-4"></i> 스레드</div>
                                
                                <div class="px-4 py-1 flex items-center justify-between opacity-70 hover:opacity-100 cursor-pointer">
                                    <div class="flex items-center gap-3"><i data-lucide="bell" class="w-4 h-4"></i> 멘션 및 반응</div>
                                    <div id="preview-badge-count" class="px-1.5 py-0.5 rounded-full text-[10px] text-white font-black" style="background-color: #EABDFB;">5</div>
                                </div>
                                
                                <div class="px-4 py-1 flex items-center gap-3 opacity-70 hover:opacity-100 cursor-pointer"><i data-lucide="layout-grid" class="w-4 h-4"></i> 허들</div>
                                
                                <div class="mt-4 px-4 mb-1 text-[11px] font-bold opacity-50">나의 프로필</div>
                                
                                <!-- 선택된 나의 프로필 -->
                                <div id="preview-selected-item" class="mx-2 px-2 py-1.5 rounded-md flex items-center justify-between shadow-sm" style="background-color: #F9EDFF; color: #1D1C1D; font-weight: 900;">
                                    <div class="flex items-center gap-2">
                                        <div class="relative">
                                            <div class="w-5 h-5 rounded bg-indigo-500 overflow-hidden text-white flex items-center justify-center">
                                                <i data-lucide="user" class="w-3.5 h-3.5 mt-1"></i>
                                            </div>
                                            <div id="preview-presence-dot" class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full border-2" style="background-color: #4CC894; border-color: #F9EDFF;"></div>
                                        </div>
                                        <span>나와의 대화</span>
                                    </div>
                                    <div id="preview-badge-mini" class="px-1.5 py-0.5 rounded-full text-[10px] text-white font-black" style="background-color: #EABDFB;">3</div>
                                </div>

                                <div class="mt-4 px-4 mb-1 text-[11px] font-black opacity-50 uppercase tracking-tight">다이렉트 메시지</div>
                                <div class="px-4 py-1 flex items-center gap-2 opacity-70 hover:opacity-100 cursor-pointer">
                                    <div class="relative">
                                        <div class="w-4 h-4 rounded bg-green-500 overflow-hidden text-white flex items-center justify-center"><i data-lucide="user" class="w-3 h-3 mt-1"></i></div>
                                        <div class="presence-dot-team absolute -bottom-0.5 -right-0.5 w-2 h-2 rounded-full border border-current" style="background-color: #4CC894;"></div>
                                    </div>
                                    <span>팀장님</span>
                                </div>
                            </div>
                        </div>

                        <!-- 메인 채팅창 -->
                        <div id="chat-window" class="flex-1 flex flex-col m-1.5 ml-0 rounded-[16px] shadow-sm overflow-hidden transition-colors z-10 bg-white text-gray-800">
                            <div class="h-14 flex items-center justify-between px-5 border-b border-black/5">
                                <div class="flex items-center gap-2">
                                    <i data-lucide="user" class="w-4.5 h-4.5 text-gray-400"></i>
                                    <span class="font-black text-[16px]">나와의 대화</span>
                                </div>
                                <div class="flex items-center gap-4 text-gray-500">
                                    <i data-lucide="search" class="w-4.5 h-4.5"></i>
                                    <i data-lucide="more-vertical" class="w-4.5 h-4.5"></i>
                                </div>
                            </div>

                            <div class="flex-1 p-5 space-y-6 overflow-y-auto custom-scrollbar text-[15px]">
                                <div class="flex gap-3">
                                    <div class="w-9 h-9 rounded bg-indigo-500 flex-shrink-0 flex items-center justify-center text-white"><i data-lucide="user" class="w-5 h-5 mt-1"></i></div>
                                    <div class="space-y-1 w-full">
                                        <div class="flex items-baseline gap-2">
                                            <span class="font-black">나</span>
                                            <span class="text-[12px] opacity-50">오후 4:16</span>
                                        </div>
                                        <div class="text-[14px]">
                                            <strong>[실시간 테마 반영 기능]</strong><br>
                                            이제 코드를 입력창에 넣기만 하면 즉시 미리보기에 반영됩니다! <br>
                                            마음에 드는 조합은 하단 <strong>+ 버튼</strong>을 눌러 저장하세요. ✨
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="p-4 pt-0">
                                <div class="rounded-xl border border-gray-300 flex flex-col shadow-sm bg-white">
                                    <div class="px-3 py-3 text-[15px] opacity-50">메모를 입력하세요...</div>
                                    <div class="flex justify-between items-center p-2 pt-0 opacity-60">
                                        <div class="flex gap-1"><i data-lucide="plus" class="w-4.5 h-4.5"></i><i data-lucide="smile" class="w-4.5 h-4.5"></i></div>
                                        <div id="send-btn-mock" class="w-7 h-7 rounded flex items-center justify-center bg-gray-100">
                                            <i data-lucide="send" class="w-4 h-4"></i>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <script>
        // 초기 데이터
        const apiKey = "";
        const MODEL_NAME = "gemini-2.5-flash-preview-09-2025";
        
        let state = {
            theme: {
                systemNav: '#611F69',
                selectedItem: '#F9EDFF',
                presence: '#4CC894',
                badge: '#EABDFB',
                isGradient: true
            },
            isDarkMode: false,
            presets: {
                'Aubergine (기본)': { systemNav: '#611F69', selectedItem: '#F9EDFF', presence: '#4CC894', badge: '#EABDFB', isGradient: true },
                'Tritanopia': { systemNav: '#000000', selectedItem: '#F8F8F8', presence: '#20A271', badge: '#EF3E75', isGradient: false },
                'Choco Mint': { systemNav: '#784C1F', selectedItem: '#E3FFF3', presence: '#B5B5BA', badge: '#74DBAF', isGradient: false }
            }
        };

        // 초기화
        window.onload = () => {
            lucide.createIcons();
            renderPresets();
            applyTheme();
            setupDragAndDrop();
        };

        // 테마 적용 함수
        function applyTheme() {
            const { theme } = state;
            
            // 입력창 동기화
            const code = `${theme.systemNav},${theme.selectedItem},${theme.presence},${theme.badge}`;
            document.getElementById('theme-input').value = code;

            // UI 스와치 및 텍스트 업데이트
            ['systemNav', 'selectedItem', 'presence', 'badge'].forEach(key => {
                document.getElementById(`swatch-${key}`).style.backgroundColor = theme[key];
                document.getElementById(`text-${key}`).innerText = theme[key];
                document.getElementById(`color-${key}`).value = theme[key];
            });

            // 밝기 계산 (폰트 색상 결정)
            const isNavLight = isLight(theme.systemNav);
            const sidebarText = isNavLight ? '#1D1C1D' : '#FFFFFF';
            const sidebarBorder = isNavLight ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.1)';

            // 미리보기 엘리먼트 업데이트
            const main = document.getElementById('slack-main');
            if (theme.isGradient) {
                main.style.background = `linear-gradient(35deg, ${theme.systemNav} 40%, color-mix(in srgb, ${theme.systemNav}, ${theme.selectedItem} 15%) 100%)`;
            } else {
                main.style.background = theme.systemNav;
            }

            const sidebar = document.getElementById('slack-sidebar');
            const nav = document.getElementById('slack-nav');
            sidebar.style.color = sidebarText;
            sidebar.style.borderColor = sidebarBorder;
            nav.style.color = sidebarText;
            nav.style.borderColor = sidebarBorder;

            const selectedItemEl = document.getElementById('preview-selected-item');
            selectedItemEl.style.backgroundColor = theme.selectedItem;
            selectedItemEl.style.color = isLight(theme.selectedItem) ? '#1D1C1D' : '#FFFFFF';

            document.getElementById('preview-presence-dot').style.backgroundColor = theme.presence;
            document.getElementById('preview-presence-dot').style.borderColor = theme.selectedItem;
            
            document.querySelectorAll('.presence-dot-team').forEach(el => el.style.backgroundColor = theme.presence);
            
            document.getElementById('preview-badge-count').style.backgroundColor = theme.badge;
            document.getElementById('preview-badge-mini').style.backgroundColor = theme.badge;

            const sendBtn = document.getElementById('send-btn-mock');
            if (theme.isGradient) {
                sendBtn.style.backgroundColor = '#007a5a';
                sendBtn.style.color = 'white';
            } else {
                sendBtn.style.backgroundColor = '#f3f4f6';
                sendBtn.style.color = 'inherit';
            }

            // 토글 상태 반영
            document.getElementById('gradient-toggle').checked = theme.isGradient;
            const toggleBg = document.getElementById('toggle-bg');
            const toggleCircle = document.getElementById('toggle-circle');
            if (theme.isGradient) {
                toggleBg.style.backgroundColor = '#1264a3';
                toggleCircle.style.transform = 'translateX(20px)';
            } else {
                toggleBg.style.backgroundColor = '#d1d5db';
                toggleCircle.style.transform = 'translateX(0)';
            }
        }

        // 개별 색상 변경
        function updateColor(key, value) {
            state.theme[key] = value.toUpperCase();
            applyTheme();
        }

        // 그라데이션 토글
        function toggleGradient() {
            state.theme.isGradient = !state.theme.isGradient;
            applyTheme();
        }

        // 텍스트 입력 처리
        function handleTextInput(val) {
            const colors = val.split(',').map(c => c.trim().toUpperCase());
            const isValidHex = (hex) => /^#([0-9A-F]{3}){1,2}$/i.test(hex);

            if (colors.length >= 4 && colors.slice(0, 4).every(isValidHex)) {
                state.theme.systemNav = colors[0];
                state.theme.selectedItem = colors[1];
                state.theme.presence = colors[2];
                state.theme.badge = colors[3];
                applyTheme();
            }
        }

        // 프리셋 렌더링
        function renderPresets() {
            const list = document.getElementById('presets-list');
            list.innerHTML = '';
            
            Object.keys(state.presets).forEach(name => {
                const p = state.presets[name];
                const btn = document.createElement('button');
                btn.className = `p-3 rounded-xl text-left text-sm font-bold flex justify-between items-center transition-all border ${JSON.stringify(state.theme) === JSON.stringify(p) ? 'border-[#1264a3] bg-[#1264a3]/5 text-[#1264a3]' : 'border-transparent hover:bg-black/5 opacity-80'}`;
                btn.onclick = () => {
                    state.theme = { ...p };
                    applyTheme();
                    renderPresets();
                };
                
                btn.innerHTML = `
                    ${name}
                    <div class="flex -space-x-1">
                        <div class="w-4 h-4 rounded-full border border-white" style="background: ${p.systemNav}"></div>
                        <div class="w-4 h-4 rounded-full border border-white" style="background: ${p.selectedItem}"></div>
                    </div>
                `;
                list.appendChild(btn);
            });
        }

        // 프리셋 저장
        function saveToPresets() {
            const count = Object.keys(state.presets).filter(k => k.startsWith('사용자 테마')).length;
            const newName = `사용자 테마 ${count + 1}`;
            state.presets[newName] = { ...state.theme };
            renderPresets();
        }

        // 테마 복사
        function copyThemeCode() {
            const code = `${state.theme.systemNav},${state.theme.selectedItem},${state.theme.presence},${state.theme.badge}`;
            const textArea = document.createElement("textarea");
            textArea.value = code;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);

            const btnText = document.getElementById('copy-text');
            const originalText = btnText.innerText;
            btnText.innerText = "복사 완료!";
            document.getElementById('copy-btn').classList.replace('bg-[#1264a3]', 'bg-green-500');
            
            setTimeout(() => {
                btnText.innerText = originalText;
                document.getElementById('copy-btn').classList.replace('bg-green-500', 'bg-[#1264a3]');
            }, 2000);
        }

        // 다크 모드 토글
        function toggleDarkMode() {
            state.isDarkMode = !state.isDarkMode;
            const body = document.getElementById('body');
            const cards = ['header-card', 'ai-card', 'colors-card', 'share-card', 'presets-card'];
            const chat = document.getElementById('chat-window');
            const btn = document.getElementById('dark-mode-btn');

            if (state.isDarkMode) {
                body.classList.add('bg-[#0b0c0e]', 'text-gray-100');
                cards.forEach(id => {
                    const el = document.getElementById(id);
                    el.classList.replace('bg-white', 'bg-[#1a1d21]');
                    el.classList.replace('border-black/5', 'border-white/10');
                });
                chat.classList.replace('bg-white', 'bg-[#1a1d21]');
                chat.classList.add('text-gray-200');
                btn.innerText = '🌞';
            } else {
                body.classList.remove('bg-[#0b0c0e]', 'text-gray-100');
                cards.forEach(id => {
                    const el = document.getElementById(id);
                    el.classList.replace('bg-[#1a1d21]', 'bg-white');
                    el.classList.replace('border-white/10', 'border-black/5');
                });
                chat.classList.replace('bg-[#1a1d21]', 'white');
                chat.classList.remove('text-gray-200');
                btn.innerText = '🌙';
            }
        }

        // 밝기 판단 유틸
        function isLight(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            const brightness = (r * 299 + g * 587 + b * 114) / 1000;
            return brightness > 155;
        }

        // 드래그 앤 드롭 설정
        function setupDragAndDrop() {
            const dz = document.getElementById('drop-zone');
            const fi = document.getElementById('file-input');

            dz.onclick = () => fi.click();
            fi.onchange = (e) => handleFiles(e.target.files);

            dz.ondragover = (e) => { e.preventDefault(); dz.classList.add('dragging'); };
            dz.ondragleave = () => dz.classList.remove('dragging');
            dz.ondrop = (e) => {
                e.preventDefault();
                dz.classList.remove('dragging');
                handleFiles(e.dataTransfer.files);
            };
        }

        async function handleFiles(files) {
            const file = files[0];
            if (!file || !file.type.startsWith('image/')) return;
            
            const status = document.getElementById('upload-status');
            const errorEl = document.getElementById('error-msg');
            errorEl.classList.add('hidden');

            status.innerHTML = `<div class="animate-spin text-purple-500"><i data-lucide="loader-2"></i></div><p class="text-sm font-bold text-purple-500 mt-2">분석 중...</p>`;
            lucide.createIcons();

            try {
                const base64 = await new Promise(r => {
                    const reader = new FileReader();
                    reader.onload = () => r(reader.result.split(',')[1]);
                    reader.readAsDataURL(file);
                });

                const prompt = `Extract 4 harmonious hex colors from this image to create a professional Slack theme. 
                Return JSON with keys: "systemNav", "selectedItem", "presence", "badge".`;

                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }, { inlineData: { mimeType: file.type, data: base64 } }] }],
                        generationConfig: {
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "OBJECT",
                                properties: {
                                    systemNav: { type: "STRING" },
                                    selectedItem: { type: "STRING" },
                                    presence: { type: "STRING" },
                                    badge: { type: "STRING" }
                                },
                                required: ["systemNav", "selectedItem", "presence", "badge"]
                            }
                        }
                    })
                });

                const data = await res.json();
                const colors = JSON.parse(data.candidates[0].content.parts[0].text);
                
                state.theme = {
                    ...state.theme,
                    systemNav: colors.systemNav.toUpperCase(),
                    selectedItem: colors.selectedItem.toUpperCase(),
                    presence: colors.presence.toUpperCase(),
                    badge: colors.badge.toUpperCase(),
                    isGradient: true
                };
                applyTheme();
            } catch (err) {
                errorEl.innerText = "분석 실패. 다시 시도해 주세요.";
                errorEl.classList.remove('hidden');
            } finally {
                status.innerHTML = `
                    <div class="p-3 rounded-full mb-3 bg-gray-100 text-gray-400 group-hover:bg-purple-500 group-hover:text-white transition-colors">
                        <i data-lucide="image-plus"></i>
                    </div>
                    <p class="text-sm font-bold text-gray-600">이미지를 드롭하거나 클릭</p>
                    <p class="text-[11px] text-gray-400 mt-1">AI가 어울리는 색상을 추출합니다</p>
                `;
                lucide.createIcons();
            }
        }
    </script>
</body>
</html>
