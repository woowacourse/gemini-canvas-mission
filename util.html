<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 운동 루틴 메이커</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap");
      body {
        font-family: "Pretendard", sans-serif;
        background-color: #f8fafc;
      }
      .step-card.active {
        border-color: #3b82f6;
        background-color: #eff6ff;
      }
      .loading-spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3b82f6;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .exercise-card {
        transition: all 0.2s ease;
      }
      .exercise-card:hover {
        transform: translateY(-2px);
        border-color: #3b82f6;
      }
    </style>
  </head>
  <body class="min-h-screen pb-20">
    <!-- Header -->
    <header class="bg-white border-b sticky top-0 z-50">
      <div
        class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between"
      >
        <h1 class="text-xl font-bold text-blue-600 flex items-center gap-2">
          <i class="fas fa-dumbbell"></i> FitAI 루틴
        </h1>
        <!-- Reset Button: UI를 초기 선택 화면으로 전환 -->
        <button
          onclick="resetToHome()"
          class="text-gray-400 hover:text-blue-600 transition-colors p-2"
          title="처음으로 돌아가기"
        >
          <i class="fas fa-redo-alt"></i>
        </button>
      </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-8">
      <!-- Input Section -->
      <section id="input-section" class="space-y-8">
        <div class="text-center">
          <h2 class="text-2xl font-bold text-gray-800">
            나만의 맞춤 운동 플랜 만들기
          </h2>
          <p class="text-gray-500 mt-2">
            AI가 당신의 목표와 환경에 맞는 최적의 루틴을 짜드립니다.
          </p>
        </div>

        <!-- Step 1: Level -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border">
          <h3 class="font-bold text-lg mb-4 flex items-center gap-2">
            <span
              class="w-6 h-6 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-sm"
              >1</span
            >
            운동 수준을 선택하세요
          </h3>
          <div class="grid grid-cols-3 gap-3" id="level-container">
            <button
              data-value="초보자"
              class="step-card border-2 p-4 rounded-xl text-center hover:border-blue-400 transition-all"
            >
              <div class="text-2xl mb-2">🌱</div>
              <div class="font-semibold">초보자</div>
            </button>
            <button
              data-value="중급자"
              class="step-card border-2 p-4 rounded-xl text-center hover:border-blue-400 transition-all"
            >
              <div class="text-2xl mb-2">🔥</div>
              <div class="font-semibold">중급자</div>
            </button>
            <button
              data-value="상급자"
              class="step-card border-2 p-4 rounded-xl text-center hover:border-blue-400 transition-all"
            >
              <div class="text-2xl mb-2">💪</div>
              <div class="font-semibold">상급자</div>
            </button>
          </div>
        </div>

        <!-- Step 2: Days -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border">
          <h3 class="font-bold text-lg mb-4 flex items-center gap-2">
            <span
              class="w-6 h-6 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-sm"
              >2</span
            >
            주간 운동 가능 일수
          </h3>
          <div class="flex flex-wrap gap-2" id="days-container">
            <!-- JS generated -->
          </div>
        </div>

        <!-- Step 3: Time -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border">
          <h3 class="font-bold text-lg mb-4 flex items-center gap-2">
            <span
              class="w-6 h-6 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-sm"
              >3</span
            >
            1회 운동 가능 시간
          </h3>
          <div
            class="grid grid-cols-2 md:grid-cols-4 gap-3"
            id="time-container"
          >
            <button
              data-value="30분 이하"
              class="step-card border-2 p-4 rounded-xl text-sm font-semibold hover:border-blue-400"
            >
              30분 이하
            </button>
            <button
              data-value="30~60분"
              class="step-card border-2 p-4 rounded-xl text-sm font-semibold hover:border-blue-400"
            >
              30~60분
            </button>
            <button
              data-value="60~90분"
              class="step-card border-2 p-4 rounded-xl text-sm font-semibold hover:border-blue-400"
            >
              60~90분
            </button>
            <button
              data-value="90분 이상"
              class="step-card border-2 p-4 rounded-xl text-sm font-semibold hover:border-blue-400"
            >
              90분 이상
            </button>
          </div>
        </div>

        <button
          id="generate-btn"
          class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg hover:bg-blue-700 transition-all transform active:scale-95"
        >
          루틴 생성하기
        </button>
      </section>

      <!-- Loading -->
      <section id="loading-section" class="hidden py-20 text-center">
        <div class="flex flex-col items-center">
          <div class="loading-spinner mb-4"></div>
          <h2 class="text-xl font-bold">AI가 루틴을 구성하는 중...</h2>
          <p class="text-gray-500 mt-2">
            사용자님의 수준에 맞춘 최적의 프로그램을 만들고 있습니다.
          </p>
        </div>
      </section>

      <!-- Results -->
      <section id="result-section" class="hidden space-y-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Routine Summary -->
          <div class="bg-white p-6 rounded-2xl shadow-sm border">
            <h3
              class="font-bold text-lg mb-4 underline decoration-blue-500 decoration-4 text-gray-800"
            >
              루틴 요약
            </h3>
            <div id="routine-info" class="space-y-4 text-sm md:text-base">
              <!-- JS generated -->
            </div>
          </div>
          <!-- Muscle Distribution -->
          <div class="bg-white p-6 rounded-2xl shadow-sm border">
            <h3 class="font-bold text-lg mb-2 text-gray-800">운동 부위 분포</h3>
            <div class="h-48 flex items-center justify-center">
              <canvas id="muscleChart"></canvas>
            </div>
          </div>
        </div>

        <h3
          class="font-bold text-xl mt-8 flex items-center gap-2 text-gray-800"
        >
          <i class="fas fa-calendar-alt text-blue-500"></i> 주간 캘린더
        </h3>
        <div id="calendar-view" class="grid grid-cols-4 md:grid-cols-7 gap-2">
          <!-- Days generated -->
        </div>

        <div
          id="daily-details"
          class="bg-white p-6 rounded-2xl shadow-sm border min-h-[300px]"
        >
          <h3
            id="detail-date-title"
            class="font-bold text-lg mb-6 text-blue-600 border-b pb-2"
          >
            요일을 선택하세요.
          </h3>
          <div id="exercise-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Exercise cards -->
          </div>
        </div>
      </section>
    </main>

    <script>
      const apiKey = "";
      const state = { level: "", days: "", time: "", routineData: null };

      window.onload = () => {
        initInputs();
        document
          .getElementById("generate-btn")
          .addEventListener("click", generateRoutine);
      };

      function initInputs() {
        const daysContainer = document.getElementById("days-container");
        for (let i = 1; i <= 7; i++) {
          const btn = document.createElement("button");
          btn.className =
            "step-card border-2 px-5 py-3 rounded-xl font-bold hover:border-blue-400 transition-all";
          btn.textContent = `${i}일`;
          btn.dataset.value = i;
          btn.onclick = () => selectItem("days", btn);
          daysContainer.appendChild(btn);
        }
        document
          .querySelectorAll("#level-container button")
          .forEach((btn) => (btn.onclick = () => selectItem("level", btn)));
        document
          .querySelectorAll("#time-container button")
          .forEach((btn) => (btn.onclick = () => selectItem("time", btn)));
      }

      function selectItem(key, element) {
        element.parentElement
          .querySelectorAll(".step-card")
          .forEach((c) => c.classList.remove("active"));
        element.classList.add("active");
        state[key] = element.dataset.value;
      }

      // 홈 화면(입력 단계)으로 돌아가는 함수
      function resetToHome() {
        // 섹션 전환
        document.getElementById("result-section").classList.add("hidden");
        document.getElementById("loading-section").classList.add("hidden");
        document.getElementById("input-section").classList.remove("hidden");

        // 데이터 초기화
        state.routineData = null;

        // UI 상태 초기화 (선택된 클래스 제거)
        document
          .querySelectorAll(".step-card")
          .forEach((c) => c.classList.remove("active"));
        state.level = "";
        state.days = "";
        state.time = "";

        // 스크롤을 상단으로 이동
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      async function generateRoutine() {
        if (!state.level || !state.days || !state.time) {
          alert("모든 항목을 선택해주세요!");
          return;
        }

        document.getElementById("input-section").classList.add("hidden");
        document.getElementById("loading-section").classList.remove("hidden");

        const systemPrompt = `당신은 전문 피트니스 트레이너입니다.
                JSON 구조만 응답하세요:
                {
                    "summary": { "splitType": "분할 방식 명칭", "focus": "훈련의 구체적 목적 (2줄 이내)" },
                    "muscleDistribution": { "가슴": 20, "등": 20, "하체": 30, "어깨": 15, "팔/복근": 15 },
                    "weeklyPlan": [
                        { "day": "월요일", "type": "운동/휴식", "exercises": [ { "name": "운동명", "sets": 3, "reps": "12", "rest": 60, "target": "주요부위", "tip": "자세 팁 한줄" } ] }
                    ]
                }
                * 모든 텍스트는 한국어. 사용자의 수준(${state.level}), 주간 일수(${state.days}일), 시간(${state.time}) 반영.`;

        const userPrompt = `운동 수준: ${state.level}, 일수: ${state.days}일, 시간: ${state.time}. 최적의 루틴을 짜줘.`;

        try {
          const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [{ parts: [{ text: userPrompt }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: { responseMimeType: "application/json" },
              }),
            },
          );

          const data = await response.json();
          state.routineData = JSON.parse(
            data.candidates[0].content.parts[0].text,
          );
          renderResults();
        } catch (error) {
          console.error(error);
          alert("루틴 생성 중 오류가 발생했습니다. 다시 시도해 주세요.");
          document.getElementById("input-section").classList.remove("hidden");
          document.getElementById("loading-section").classList.add("hidden");
        }
      }

      function renderResults() {
        document.getElementById("loading-section").classList.add("hidden");
        document.getElementById("result-section").classList.remove("hidden");

        const { summary, muscleDistribution, weeklyPlan } = state.routineData;

        const infoBox = document.getElementById("routine-info");
        infoBox.innerHTML = `
                <div class="flex flex-col gap-1 border-b pb-3">
                    <span class="text-xs font-bold text-blue-500 uppercase tracking-wider">분할 방식</span>
                    <span class="font-bold text-gray-800 text-lg">${summary.splitType}</span>
                </div>
                <div class="flex flex-col gap-1 border-b pb-3">
                    <span class="text-xs font-bold text-blue-500 uppercase tracking-wider">훈련 목적</span>
                    <p class="font-medium text-gray-700 leading-relaxed">${summary.focus}</p>
                </div>
                <div class="flex justify-between items-center pt-1">
                    <span class="text-xs font-bold text-blue-500 uppercase tracking-wider">권장 강도</span>
                    <span class="px-3 py-1 bg-blue-50 text-blue-600 rounded-full text-sm font-bold border border-blue-100">
                        ${state.level === "초보자" ? "저~중강도" : state.level === "중급자" ? "중강도" : "고강도"}
                    </span>
                </div>
            `;

        const ctx = document.getElementById("muscleChart").getContext("2d");
        if (window.myChart) window.myChart.destroy();
        window.myChart = new Chart(ctx, {
          type: "doughnut",
          data: {
            labels: Object.keys(muscleDistribution),
            datasets: [
              {
                data: Object.values(muscleDistribution),
                backgroundColor: [
                  "#3b82f6",
                  "#10b981",
                  "#f59e0b",
                  "#ef4444",
                  "#8b5cf6",
                  "#64748b",
                ],
                borderWidth: 0,
              },
            ],
          },
          options: {
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: "right",
                labels: { boxWidth: 10, font: { size: 11 } },
              },
            },
          },
        });

        const calendar = document.getElementById("calendar-view");
        calendar.innerHTML = "";
        weeklyPlan.forEach((plan, idx) => {
          const dayCard = document.createElement("button");
          const isRest =
            plan.type === "휴식" ||
            !plan.exercises ||
            plan.exercises.length === 0;
          dayCard.className = `flex flex-col items-center p-3 rounded-xl border-2 transition-all ${idx === 0 ? "border-blue-500 bg-blue-50" : "border-transparent bg-white shadow-sm"}`;
          dayCard.innerHTML = `
                    <span class="text-[10px] text-gray-400 font-bold mb-1">${plan.day}</span>
                    <div class="w-8 h-8 flex items-center justify-center rounded-full ${isRest ? "bg-gray-100 text-gray-400" : "bg-blue-600 text-white"} font-bold text-sm">
                        ${plan.day.substring(0, 1)}
                    </div>
                `;
          dayCard.onclick = () => {
            calendar.querySelectorAll("button").forEach((b) => {
              b.classList.remove("border-blue-500", "bg-blue-50");
              b.classList.add("border-transparent", "bg-white");
            });
            dayCard.classList.add("border-blue-500", "bg-blue-50");
            showDayDetail(plan);
          };
          calendar.appendChild(dayCard);
        });

        showDayDetail(weeklyPlan[0]);
      }

      function showDayDetail(plan) {
        const title = document.getElementById("detail-date-title");
        const list = document.getElementById("exercise-list");
        title.innerHTML = `${plan.day} <span class="text-sm font-normal text-gray-400 ml-2">| ${plan.type}</span>`;
        list.innerHTML = "";

        if (
          plan.type === "휴식" ||
          !plan.exercises ||
          plan.exercises.length === 0
        ) {
          list.className = "block w-full";
          list.innerHTML = `<div class="py-12 text-center text-gray-400 bg-gray-50 rounded-2xl border border-dashed"><i class="fas fa-mug-hot text-3xl mb-3"></i><p>충분한 휴식을 취하는 날입니다.</p></div>`;
          return;
        }

        list.className = "grid grid-cols-1 md:grid-cols-2 gap-4";
        plan.exercises.forEach((ex, i) => {
          const item = document.createElement("div");
          item.className =
            "exercise-card flex flex-col bg-white rounded-2xl border border-gray-100 shadow-sm p-5 hover:shadow-md transition-all";

          item.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex flex-col">
                            <h4 class="font-bold text-gray-900 text-lg leading-tight">${ex.name}</h4>
                        </div>
                        <span class="text-[10px] font-bold px-2 py-1 bg-gray-100 text-gray-600 rounded-md border border-gray-200 shrink-0 uppercase tracking-tighter">${ex.target}</span>
                    </div>
                    
                    <div class="grid grid-cols-3 gap-3 mb-4">
                        <div class="bg-slate-50 p-2 rounded-xl text-center border border-slate-100">
                            <p class="text-[10px] text-gray-400 font-bold mb-1 uppercase">Sets</p>
                            <p class="font-bold text-blue-600 text-base">${ex.sets}</p>
                        </div>
                        <div class="bg-slate-50 p-2 rounded-xl text-center border border-slate-100">
                            <p class="text-[10px] text-gray-400 font-bold mb-1 uppercase">Reps</p>
                            <p class="font-bold text-gray-800 text-base">${ex.reps}</p>
                        </div>
                        <div class="bg-slate-50 p-2 rounded-xl text-center border border-slate-100">
                            <p class="text-[10px] text-gray-400 font-bold mb-1 uppercase">Rest</p>
                            <p class="font-bold text-gray-800 text-base">${ex.rest}s</p>
                        </div>
                    </div>
                    
                    <div class="bg-amber-50 p-3 rounded-xl border border-amber-100">
                        <p class="text-xs text-amber-700 leading-relaxed">
                            <i class="fas fa-lightbulb mr-1 opacity-70"></i> ${ex.tip}
                        </p>
                    </div>
                `;
          list.appendChild(item);
        });
      }
    </script>
  </body>
</html>
