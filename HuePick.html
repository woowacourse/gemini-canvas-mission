<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>휴픽 (HuePick) - Pixel Art</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face {
            font-family: 'NeoDunggeunmo';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.3/NeoDunggeunmo.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }
        
        :root {
            --bg-base: #222831;
            --bg-panel: #393E46;
            --accent: #00ADB5;
            --text-main: #EEEEEE;
            --shadow-dark: #111111; 
        }

        body {
            font-family: 'NeoDunggeunmo', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            overflow: hidden;
            image-rendering: pixelated;
        }

        /* 두꺼웠던 테두리(4px)를 얇게(2px) 조정하고 그림자 크기도 줄임 */
        .pixel-border {
            border: 2px solid var(--text-main);
            box-shadow: 3px 3px 0px var(--shadow-dark);
            position: relative;
            background: var(--bg-panel);
        }

        .pixel-inner {
            background: var(--bg-base);
            border: 2px solid var(--text-main);
        }

        .pixel-btn {
            background: var(--bg-panel);
            border: 2px solid var(--text-main);
            box-shadow: 3px 3px 0px var(--shadow-dark);
            padding: 12px;
            cursor: pointer;
            font-size: 18px; /* 15px -> 18px */
            color: var(--text-main);
            font-weight: bold;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .pixel-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--shadow-dark);
        }

        .pixel-btn-primary {
            background: var(--accent);
            color: var(--bg-base);
            border-color: var(--text-main);
        }

        /* 분석 실행 버튼 전용 눈에 띄는 스타일 */
        .btn-analyze {
            background: var(--accent); /* 내가 지정한 4가지 색 중 하나 (Accent) */
            color: var(--bg-base); /* 텍스트가 잘 보이도록 Base 색상 사용 */
            border-color: var(--text-main);
            font-size: 21px; /* 글씨를 더 크게 */
            font-weight: 900;
        }

        canvas {
            image-rendering: pixelated;
            cursor: crosshair;
        }

        /* 전체 폰트 크기 +3px 업그레이드 */
        .stats-text {
            font-size: 16px;
            line-height: 1.6;
        }

        .badge {
            font-size: 15px;
            background: var(--bg-base);
            padding: 4px 8px;
            border: 2px solid var(--text-main);
            display: inline-block;
            color: var(--text-main);
        }

        .color-name {
            font-size: 17px;
            color: var(--accent);
            margin-top: 8px;
            min-height: 1.2em;
            font-weight: bold;
        }

        /* 모달 컬러 샘플 크기 대폭 확대 (48px -> 80px) */
        .modal-color-sample {
            width: 80px;
            height: 80px;
            border: 2px solid var(--text-main);
        }

        .text-accent { color: var(--accent); }
        .text-main { color: var(--text-main); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <!-- Main Menu -->
    <div id="menu-screen" class="flex flex-col items-center justify-center flex-grow w-full gap-10">
        <div class="flex flex-col items-center gap-2">
            <svg width="60" height="60" viewBox="0 0 13 13" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
                <path d="M6,0 h1 v4 h-1 z M6,9 h1 v4 h-1 z M0,6 h4 v1 h-4 z M9,6 h4 v1 h-4 z" fill="#EEEEEE"/>
                <path d="M6,1 h1 v2 h-1 z M6,10 h1 v2 h-1 z M1,6 h2 v1 h-2 z M10,6 h2 v1 h-2 z" fill="#00ADB5"/>
                <rect x="6" y="6" width="1" height="1" fill="#00ADB5"/>
            </svg>
            <h1 class="text-[39px] text-accent font-bold tracking-widest mt-2">휴픽</h1>
            <!-- 부제 추가 -->
            <p class="text-[16px] text-main font-bold opacity-80 mt-[-5px]">색 맞추기 게임</p>
        </div>

        <div class="pixel-border p-6 w-full max-w-xs text-center flex flex-col gap-4">
            <h2 class="text-[18px] text-main font-bold">준비되셨나요?</h2>
            <button onclick="startGame()" class="pixel-btn pixel-btn-primary w-full">게임 시작</button>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="hidden w-full max-w-5xl flex flex-col gap-4 h-full">
        <!-- 게임 화면용 미니 헤더 (위치를 좀 더 밑으로) -->
        <div class="flex justify-center items-center gap-2 mb-2 pt-8">
            <svg width="24" height="24" viewBox="0 0 13 13" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
                <path d="M6,0 h1 v4 h-1 z M6,9 h1 v4 h-1 z M0,6 h4 v1 h-4 z M9,6 h4 v1 h-4 z" fill="#EEEEEE"/>
                <path d="M6,1 h1 v2 h-1 z M6,10 h1 v2 h-1 z M1,6 h2 v1 h-2 z M10,6 h2 v1 h-2 z" fill="#00ADB5"/>
                <rect x="6" y="6" width="1" height="1" fill="#00ADB5"/>
            </svg>
            <h1 class="text-[23px] text-accent font-bold tracking-widest">휴픽</h1>
        </div>

        <div class="flex justify-between items-center px-2">
            <div class="stats-text flex gap-4 font-bold text-main">
                <span>시도:<span id="attempt-count" class="text-[#3B82F6] ml-1 text-lg">1</span></span>
                <span>일치:<span id="current-match-text" class="text-[#3B82F6] ml-1 text-lg">0%</span></span>
            </div>
            <!-- 초기화 및 포기 버튼에 적절한 색상 지정 및 버튼화 -->
            <div class="flex gap-3">
                <button onclick="resetGame()" class="pixel-btn !px-3 !py-1 !text-[14px] !bg-[#3B82F6] !text-[#EEEEEE]">초기화</button>
                <button onclick="quitGame()" class="pixel-btn !px-3 !py-1 !text-[14px] !bg-[#E74C3C] !text-[#EEEEEE]">포기</button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-stretch flex-grow">
            <!-- Left Panel -->
            <div class="flex flex-col justify-between h-full space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div class="flex flex-col gap-2">
                        <span class="stats-text text-center text-main font-bold">목표 색상</span>
                        <div id="target-preview" class="w-full h-28 pixel-border"></div>
                        <div id="target-info" class="flex flex-col items-center gap-1 mt-1">
                            <div class="badge w-full text-center" id="t-hex">#??????</div>
                            <div class="badge w-full text-center" id="t-rgb">RGB:?,?,?</div>
                            <div class="color-name text-center" id="t-name">???</div>
                        </div>
                    </div>
                    <div class="flex flex-col gap-2">
                        <span class="stats-text text-center text-main font-bold">현재 선택</span>
                        <div id="user-preview" class="w-full h-28 pixel-border" style="background-color: var(--bg-base);"></div>
                        <div id="user-info" class="flex flex-col items-center gap-1 mt-1">
                            <div class="badge w-full text-center" id="u-hex">#000000</div>
                            <div class="badge w-full text-center" id="u-rgb">RGB:0,0,0</div>
                            <div class="color-name text-center" id="u-name">-</div>
                        </div>
                    </div>
                </div>
                
                <!-- 아래쪽으로 자동 정렬되도록 mt-auto 사용, 바깥 박스를 바탕색(bg-base)과 동일하게 -->
                <div class="pixel-border !bg-[var(--bg-base)] p-4 text-center mt-auto">
                    <button id="analyze-btn" onclick="checkColor()" class="pixel-btn btn-analyze w-full">색상 분석 실행</button>
                </div>
            </div>

            <!-- Right Panel: Pickers -->
            <div class="flex flex-col justify-between h-full space-y-4">
                <div class="flex flex-col gap-1">
                    <span class="stats-text text-accent font-bold">1. 색조 선택 (HUE)</span>
                    <div class="pixel-inner p-1 flex justify-center">
                        <canvas id="hue-canvas"></canvas>
                    </div>
                </div>
                <!-- 하단 라인 맞춤 -->
                <div class="flex flex-col gap-1 mt-auto">
                    <span class="stats-text text-accent font-bold">2. 채도 및 명도 (TONE)</span>
                    <div class="pixel-inner p-1 flex justify-center">
                        <canvas id="tone-canvas"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Result Modal -->
    <div id="result-modal" class="hidden fixed inset-0 flex items-center justify-center p-4 z-50" style="background-color: rgba(34, 40, 49, 0.85); backdrop-filter: blur(4px);">
        <div class="pixel-border p-6 w-full max-w-md text-center">
            <h2 id="modal-title" class="text-[22px] text-accent font-bold mb-6">결과</h2>
            
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="flex flex-col items-center gap-2">
                    <span class="stats-text text-main">목표</span>
                    <div id="res-target-sample" class="modal-color-sample"></div>
                    <div class="stats-text text-main opacity-90 mt-2" id="res-target-details" style="font-size: 14px;"></div>
                </div>
                <div class="flex flex-col items-center gap-2">
                    <span class="stats-text text-main">선택</span>
                    <div id="res-user-sample" class="modal-color-sample"></div>
                    <div class="stats-text text-main opacity-90 mt-2" id="res-user-details" style="font-size: 14px;"></div>
                </div>
            </div>

            <div class="stats-text mb-8 p-4 pixel-inner flex flex-col gap-2">
                <p id="modal-match-status" class="text-accent font-bold text-[20px]">일치율 100%</p>
                <!-- 시도 횟수 폰트 크기 조정 (일치율보다 작게) -->
                <p class="text-main text-[16px]">시도 횟수: <span id="res-attempts" class="text-[18px] text-[#3B82F6] font-bold align-middle ml-1">1</span></p>
            </div>
            
            <div class="flex gap-2">
                <button onclick="startGame()" class="pixel-btn pixel-btn-primary flex-1">다시 도전</button>
                <button onclick="backToMenu()" class="pixel-btn flex-1">처음으로</button>
            </div>
        </div>
    </div>

    <script>
        const hCanvas = document.getElementById('hue-canvas');
        const tCanvas = document.getElementById('tone-canvas');
        const hCtx = hCanvas.getContext('2d');
        const tCtx = tCanvas.getContext('2d');
        
        let target = { h:0, s:0, l:0, r:0, g:0, b:0, hex: "", name: "" };
        let current = { h:0, s:50, l:50, r:0, g:0, b:0, hex: "", name: "" };
        let attempts = 1;
        
        const H_COLS = 20;
        const H_ROWS = 4;
        const T_GRID = 10;
        const CELL_SIZE = 18;

        let selectedHueIdx = 0;
        let selectedToneIdx = 45;

        // 실제 표준 색상 이름 사전 구성
        const colorDictionary = [
            { name: "블랙", r: 0, g: 0, b: 0 },
            { name: "화이트", r: 255, g: 255, b: 255 },
            { name: "레드", r: 255, g: 0, b: 0 },
            { name: "그린", r: 0, g: 128, b: 0 },
            { name: "블루", r: 0, g: 0, b: 255 },
            { name: "옐로우", r: 255, g: 255, b: 0 },
            { name: "시안", r: 0, g: 255, b: 255 },
            { name: "마젠타", r: 255, g: 0, b: 255 },
            { name: "실버", r: 192, g: 192, b: 192 },
            { name: "그레이", r: 128, g: 128, b: 128 },
            { name: "마룬", r: 128, g: 0, b: 0 },
            { name: "올리브", r: 128, g: 128, b: 0 },
            { name: "퍼플", r: 128, g: 0, b: 128 },
            { name: "틸", r: 0, g: 128, b: 128 },
            { name: "네이비", r: 0, g: 0, b: 128 },
            { name: "오렌지", r: 255, g: 165, b: 0 },
            { name: "핑크", r: 255, g: 192, b: 203 },
            { name: "브라운", r: 165, g: 42, b: 42 },
            { name: "골드", r: 255, g: 215, b: 0 },
            { name: "크림슨", r: 220, g: 20, b: 60 },
            { name: "포레스트 그린", r: 34, g: 139, b: 34 },
            { name: "스카이 블루", r: 135, g: 206, b: 235 },
            { name: "핫 핑크", r: 255, g: 105, b: 180 },
            { name: "코랄", r: 255, g: 127, b: 80 },
            { name: "살몬", r: 250, g: 128, b: 114 },
            { name: "토마토", r: 255, g: 99, b: 71 },
            { name: "카키", r: 240, g: 230, b: 140 },
            { name: "플럼", r: 221, g: 160, b: 221 },
            { name: "터콰이즈", r: 64, g: 224, b: 208 },
            { name: "아쿠아마린", r: 127, g: 255, b: 212 },
            { name: "인디고", r: 75, g: 0, b: 130 },
            { name: "바이올렛", r: 238, g: 130, b: 238 },
            { name: "초콜릿", r: 210, g: 105, b: 30 },
            { name: "오키드", r: 218, g: 112, b: 214 },
            { name: "베이지", r: 245, g: 245, b: 220 },
            { name: "아이보리", r: 255, g: 255, b: 240 },
            { name: "다크 올리브 그린", r: 85, g: 107, b: 47 },
            { name: "로얄 블루", r: 65, g: 105, b: 225 },
            { name: "스프링 그린", r: 0, g: 255, b: 127 },
            { name: "슬레이트 블루", r: 106, g: 90, b: 205 },
            { name: "스틸 블루", r: 70, g: 130, b: 180 },
            { name: "다크 시안", r: 0, g: 139, b: 139 },
            { name: "미드나잇 블루", r: 25, g: 25, b: 112 },
            { name: "네이비 블루", r: 0, g: 0, b: 128 },
            { name: "다크 레드", r: 139, g: 0, b: 0 },
            { name: "다크 오렌지", r: 255, g: 140, b: 0 },
            { name: "옐로우 그린", r: 154, g: 205, b: 50 },
            { name: "라이트 그린", r: 144, g: 238, b: 144 },
            { name: "라이트 블루", r: 173, g: 216, b: 230 }
        ];

        function hslToRgb(h, s, l) {
            s /= 100; l /= 100;
            const k = n => (n + h / 30) % 12;
            const a = s * Math.min(l, 1 - l);
            const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
            return [Math.round(255 * f(0)), Math.round(255 * f(8)), Math.round(255 * f(4))];
        }

        function rgbToHex(r, g, b) {
            return "#" + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('').toUpperCase();
        }

        // 유클리드 거리를 사용해 가장 가까운 표준 색상 이름 찾기 (적절한 임계값 적용)
        function getNearestColorName(r, g, b) {
            let minDist = Infinity;
            let closest = "-";
            // 적당한 허용 오차: 각 RGB 채널당 평균 약 22 정도의 차이까지만 허용 (22^2 * 3 ≈ 1500)
            const THRESHOLD = 1500; 

            for(let c of colorDictionary) {
                let dist = Math.pow(c.r - r, 2) + Math.pow(c.g - g, 2) + Math.pow(c.b - b, 2);
                if(dist < minDist) {
                    minDist = dist;
                    closest = c.name;
                }
            }
            
            return minDist > THRESHOLD ? "-" : closest;
        }

        function initCanvases() {
            hCanvas.width = H_COLS * CELL_SIZE;
            hCanvas.height = H_ROWS * CELL_SIZE;
            tCanvas.width = tCanvas.height = T_GRID * CELL_SIZE;
        }

        function drawHuePicker() {
            hCtx.clearRect(0, 0, hCanvas.width, hCanvas.height);
            const total = H_COLS * H_ROWS;
            for(let i=0; i < total; i++) {
                const x = (i % H_COLS) * CELL_SIZE;
                const y = Math.floor(i / H_COLS) * CELL_SIZE;
                const hue = Math.floor((i / total) * 360);
                hCtx.fillStyle = `hsl(${hue}, 100%, 50%)`;
                hCtx.fillRect(x+2, y+2, CELL_SIZE-4, CELL_SIZE-4);
                if(i === selectedHueIdx) {
                    hCtx.strokeStyle = "#EEEEEE";
                    hCtx.lineWidth = 2;
                    hCtx.strokeRect(x+1, y+1, CELL_SIZE-2, CELL_SIZE-2);
                }
            }
        }

        function drawTonePicker() {
            tCtx.clearRect(0, 0, tCanvas.width, tCanvas.height);
            for(let i=0; i < T_GRID * T_GRID; i++) {
                const x = (i % T_GRID) * CELL_SIZE;
                const y = Math.floor(i / T_GRID) * CELL_SIZE;
                const sat = 10 + Math.floor((i % T_GRID) * (80 / (T_GRID - 1)));
                const light = 80 - Math.floor(Math.floor(i / T_GRID) * (60 / (T_GRID - 1)));
                
                tCtx.fillStyle = `hsl(${current.h}, ${sat}%, ${light}%)`;
                tCtx.fillRect(x+2, y+2, CELL_SIZE-4, CELL_SIZE-4);
                
                if(i === selectedToneIdx) {
                    tCtx.strokeStyle = "#EEEEEE";
                    tCtx.lineWidth = 2;
                    tCtx.strokeRect(x+1, y+1, CELL_SIZE-2, CELL_SIZE-2);
                }
            }
        }

        function update() {
            const [r, g, b] = hslToRgb(current.h, current.s, current.l);
            current.r = r; current.g = g; current.b = b;
            current.hex = rgbToHex(r, g, b);
            current.name = getNearestColorName(r, g, b);

            document.getElementById('user-preview').style.backgroundColor = current.hex;
            document.getElementById('u-hex').innerText = current.hex;
            document.getElementById('u-rgb').innerText = `RGB:${r},${g},${b}`;
            document.getElementById('u-name').innerText = current.name;
        }

        function calculateMatch() {
            const rDist = Math.abs(target.r - current.r);
            const gDist = Math.abs(target.g - current.g);
            const bDist = Math.abs(target.b - current.b);
            const totalDist = (rDist + gDist + bDist) / (255 * 3);
            return (target.hex === current.hex) ? 100 : Math.max(0, 100 - (totalDist * 300)).toFixed(1);
        }

        function checkColor() {
            const matchScore = calculateMatch();
            document.getElementById('current-match-text').innerText = matchScore + "%";

            if (matchScore == 100) {
                showResult(true);
            } else {
                attempts++;
                document.getElementById('attempt-count').innerText = attempts;
            }
        }

        function showResult(isSuccess) {
            const matchScore = calculateMatch();
            document.getElementById('res-attempts').innerText = attempts;
            
            const titleEl = document.getElementById('modal-title');
            const statusEl = document.getElementById('modal-match-status');
            
            if (isSuccess) {
                titleEl.innerText = "색상 일치 성공!";
                statusEl.innerText = "일치율 100%";
            } else {
                titleEl.innerText = "분석 결과";
                statusEl.innerText = `일치율: ${matchScore}%`;
            }

            document.getElementById('res-target-sample').style.backgroundColor = target.hex;
            document.getElementById('res-target-details').innerHTML = `${target.hex}<br>RGB:${target.r},${target.g},${target.b}<br>${target.name}`;
            document.getElementById('res-user-sample').style.backgroundColor = current.hex;
            document.getElementById('res-user-details').innerHTML = `${current.hex}<br>RGB:${current.r},${current.g},${current.b}<br>${current.name}`;
            document.getElementById('result-modal').classList.remove('hidden');
        }

        function startGame() {
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            resetGame();
        }

        function quitGame() {
            showResult(false);
        }

        function backToMenu() {
            document.getElementById('result-modal').classList.add('hidden');
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('menu-screen').classList.remove('hidden');
        }

        function resetGame() {
            initCanvases();
            attempts = 1;
            
            const hIdx = Math.floor(Math.random() * (H_COLS * H_ROWS));
            const tIdx = Math.floor(Math.random() * (T_GRID * T_GRID));

            const totalH = H_COLS * H_ROWS;
            const th = Math.floor((hIdx / totalH) * 360);
            const ts = 10 + Math.floor((tIdx % T_GRID) * (80 / (T_GRID - 1)));
            const tl = 80 - Math.floor(Math.floor(tIdx / T_GRID) * (60 / (T_GRID - 1)));
            
            const [tr, tg, tb] = hslToRgb(th, ts, tl);
            target = { h:th, s:ts, l:tl, r:tr, g:tg, b:tb, hex: rgbToHex(tr, tg, tb), name: getNearestColorName(tr, tg, tb) };

            document.getElementById('result-modal').classList.add('hidden');
            document.getElementById('target-preview').style.backgroundColor = target.hex;
            document.getElementById('t-name').innerText = "???";
            document.getElementById('current-match-text').innerText = "0%";
            document.getElementById('attempt-count').innerText = attempts;
            
            selectedHueIdx = 0; selectedToneIdx = 45;
            current.h = 0; current.s = 50; current.l = 50;
            
            drawHuePicker();
            drawTonePicker();
            update();
        }

        function handlePickerClick(e, type) {
            const canvas = type === 'hue' ? hCanvas : tCanvas;
            const rect = canvas.getBoundingClientRect();
            const col = Math.floor((e.clientX - rect.left) / CELL_SIZE);
            const row = Math.floor((e.clientY - rect.top) / CELL_SIZE);
            
            if(type === 'hue') {
                const idx = row * H_COLS + col;
                if(idx >= 0 && idx < H_COLS * H_ROWS) {
                    selectedHueIdx = idx;
                    current.h = Math.floor((idx / (H_COLS * H_ROWS)) * 360);
                    drawHuePicker();
                    drawTonePicker();
                    update();
                }
            } else {
                const idx = row * T_GRID + col;
                if(idx >= 0 && idx < T_GRID * T_GRID) {
                    selectedToneIdx = idx;
                    current.s = 10 + Math.floor((idx % T_GRID) * (80 / (T_GRID - 1)));
                    current.l = 80 - Math.floor(Math.floor(idx / T_GRID) * (60 / (T_GRID - 1)));
                    drawTonePicker();
                    update();
                }
            }
        }

        hCanvas.addEventListener('mousedown', (e) => handlePickerClick(e, 'hue'));
        tCanvas.addEventListener('mousedown', (e) => handlePickerClick(e, 'tone'));
        
        initCanvases();
    </script>
</body>
</html>
