<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우테코 8기: 별자리 일기장</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --space-bg: #020617;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Pretendard', sans-serif;
      background-color: var(--space-bg);
    }

    /* 우주 배경 레이어 */
    #space {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
      z-index: 0;
    }

    .bg-star {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0.5;
      animation: twinkle var(--duration) infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.2); }
    }

    /* 행성 지표면 레이어 */
    #ground {
      position: absolute;
      bottom: -25vh;
      width: 140%;
      height: 45vh;
      left: -20%;
      border-radius: 50% 50% 0 0;
      background: linear-gradient(180deg, #1e293b 0%, #020617 100%);
      box-shadow:
          inset 0 2px 10px rgba(255, 255, 255, 0.1),
          inset 0 20px 50px rgba(0,0,0,0.8),
          0 -1px 20px rgba(100, 116, 139, 0.2);
      z-index: 10;
    }

    /* 일기 별 스타일 */
    #sky {
      position: relative;
      width: 100%;
      height: 70vh;
      z-index: 5;
    }

    .star-container {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: pointer;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      animation: star-floating 6s infinite ease-in-out;
    }

    /* ✨ 이모지 형태의 빛 결정체 */
    .star-shape {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: star-sparkle 3s infinite ease-in-out;
    }

    /* 메인 십자 광선 (+) */
    .ray-main {
      position: absolute;
      background: currentColor;
      border-radius: 50%;
      filter: blur(0.5px);
    }
    .ray-h { width: 100%; height: 2px; }
    .ray-v { width: 2px; height: 100%; }

    /* 보조 대각선 광선 (x) */
    .ray-sub {
      position: absolute;
      background: currentColor;
      border-radius: 50%;
      opacity: 0.6;
      filter: blur(0.5px);
    }
    .ray-d1 { width: 70%; height: 1.5px; transform: rotate(45deg); }
    .ray-d2 { width: 1.5px; height: 70%; transform: rotate(45deg); }

    /* 중앙 핵심 코어 (작은 포인트) */
    .star-core {
      position: absolute;
      width: 4px;
      height: 4px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 10px white;
      z-index: 5;
    }

    @keyframes star-sparkle {
      0%, 100% {
        transform: scale(0.8) rotate(0deg);
        opacity: 0.6;
        filter: brightness(1) drop-shadow(0 0 2px currentColor);
      }
      50% {
        transform: scale(1.2) rotate(15deg);
        opacity: 1;
        filter: brightness(1.5) drop-shadow(0 0 12px currentColor);
      }
    }

    @keyframes star-floating {
      0%, 100% { translate: 0 0; }
      33% { translate: 2px -3px; }
      66% { translate: -2px 2px; }
    }

    .star-container:hover {
      transform: translate(-50%, -50%) scale(1.6) !important;
      z-index: 100;
    }

    /* 툴팁 스타일 */
    .star-tooltip {
      position: absolute;
      bottom: 120%;
      background: rgba(0, 0, 0, 0.95);
      color: white;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 11px;
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      pointer-events: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      border: 1px solid var(--star-color, rgba(255,255,255,0.2));
      z-index: 20;
    }

    .star-container:hover .star-tooltip {
      opacity: 1;
      visibility: visible;
    }

    /* 하단 지평선 UI */
    #view-all-btn {
      position: fixed;
      bottom: 5vh;
      right: 15%;
      z-index: 50;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      padding: 0.6rem 1.4rem;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.3s ease;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 300;
    }

    #view-all-btn:hover {
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
      border-color: rgba(56, 189, 248, 0.4);
      background: rgba(255, 255, 255, 0.08);
    }

    #cannon-container {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #cannon-base {
      width: 120px;
      height: 12px;
      background: linear-gradient(180deg, #334155, #0f172a);
      border-radius: 2px;
      z-index: 22;
      border: 1px solid rgba(100, 116, 139, 0.4);
      margin-top: -2px;
    }

    #cannon {
      width: 44px;
      height: 80px;
      background: linear-gradient(to right, #0f172a, #334155, #020617);
      border-radius: 4px 4px 0 0;
      position: relative;
      cursor: pointer;
      transition: transform 0.3s ease;
      border: 1px solid #1e293b;
      z-index: 21;
      animation: cannon-float 2.5s infinite ease-in-out;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #cannon-label {
      font-size: 8px;
      color: rgba(255, 255, 255, 0.8);
      letter-spacing: 2px;
      font-weight: 800;
      text-shadow: 0 0 5px #fff;
      animation: pulse-text 1.5s infinite ease-in-out;
    }

    @keyframes pulse-text {
      0%, 100% { opacity: 0.3; transform: scale(0.95); }
      50% { opacity: 0.9; transform: scale(1.05); }
    }

    @keyframes cannon-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    @keyframes shoot {
      0% { transform: translate(0, 0) scale(1.2); opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0.3); opacity: 0; }
    }

    .projectile {
      position: fixed;
      width: 14px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      z-index: 100;
      pointer-events: none;
      box-shadow: 0 0 15px #fff, 0 0 30px #fbbf24;
    }

    /* 모달 스타일 */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(6px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: white; padding: 2.5rem; border-radius: 1.5rem;
      width: 100%; max-width: 550px; max-height: 85vh; overflow-y: auto;
    }

    @media (max-width: 640px) {
      #ground { bottom: -20vh; height: 35vh; }
      #view-all-btn { right: 5%; bottom: 3vh; }
    }
  </style>
</head>
<body>

<div id="space"></div>
<div id="sky"></div>
<div id="ground"></div>

<button id="view-all-btn">
  <span>✨</span>
  <span>밤하늘 별 모아보기</span>
</button>

<div id="cannon-container">
  <div id="cannon" onclick="openWriteModal()">
    <span id="cannon-label">TOUCH</span>
  </div>
  <div id="cannon-base"></div>
</div>

<!-- 모달 레이아웃 -->
<div id="diary-modal" class="modal">
  <div class="modal-content">
    <h2 id="modal-title" class="text-3xl font-extrabold mb-2 text-gray-900">오늘의 별 기록</h2>
    <p id="modal-date" class="text-sm font-medium text-indigo-500 mb-6"></p>
    <input type="hidden" id="edit-id">
    <textarea id="diary-content" class="w-full h-48 p-4 border-2 border-gray-100 rounded-2xl mb-6 focus:border-indigo-500 outline-none transition" placeholder="기록을 남겨보세요..."></textarea>
    <div class="flex justify-end gap-3">
      <button onclick="closeModal('diary-modal')" class="px-5 py-2.5 text-gray-400 font-semibold">닫기</button>
      <button id="save-btn" onclick="saveDiary()" class="px-8 py-2.5 bg-indigo-600 text-white rounded-xl font-bold shadow-lg">발사!</button>
    </div>
  </div>
</div>

<div id="list-modal" class="modal">
  <div class="modal-content max-w-2xl bg-slate-50">
    <div class="flex justify-between items-center mb-8">
      <h2 class="text-2xl font-black">별자리 지도</h2>
      <button onclick="closeModal('list-modal')" class="p-2 hover:bg-slate-200 rounded-full">✕</button>
    </div>
    <div id="diary-list" class="space-y-4"></div>
  </div>
</div>

<script>
  let diaries = [
    { id: 1, content: "우테코 8기 최종 코테 합격!", date: "2024-12-15 09:00", x: 25, y: 20 },
    { id: 2, content: "페어 프로그래밍의 즐거움.", date: "2025-02-15 14:20", x: 65, y: 35 },
    { id: 3, content: "자바스크립트 마스터가 되는 그날까지!", date: "2025-02-24 10:00", x: 45, y: 55 }
  ];

  const sky = document.getElementById('sky');
  const diaryModal = document.getElementById('diary-modal');
  const listModal = document.getElementById('list-modal');

  function initBackground() {
    const space = document.getElementById('space');
    for (let i = 0; i < 150; i++) {
      const bgStar = document.createElement('div');
      bgStar.className = 'bg-star';
      const size = Math.random() * 2;
      bgStar.style.width = `${size}px`; bgStar.style.height = `${size}px`;
      bgStar.style.left = `${Math.random() * 100}%`;
      bgStar.style.top = `${Math.random() * 100}%`;
      bgStar.style.setProperty('--duration', `${2 + Math.random() * 4}s`);
      space.appendChild(bgStar);
    }
  }

  window.onload = () => {
    initBackground();
    renderStars();
  };

  function getStellarColor(diaryId) {
    if (diaries.length === 0) return '#ffffff';
    const sorted = [...diaries].sort((a, b) => new Date(a.date) - new Date(b.date));
    const index = sorted.findIndex(d => d.id === diaryId);
    const total = sorted.length;

    const spectrum = [
      '#ff1a1a', // Red (Oldest)
      '#ff80bf', // Pink
      '#f8fafc', // White
      '#22d3ee', // Cyan
      '#3b82f6'  // Blue (Newest)
    ];

    if (total <= 1) return spectrum[4];
    const ratio = index / (total - 1);
    const colorIdx = ratio * (spectrum.length - 1);
    const lower = Math.floor(colorIdx);
    const upper = Math.ceil(colorIdx);
    const p = colorIdx - lower;
    return interpolateColor(spectrum[lower], spectrum[upper], p);
  }

  function interpolateColor(c1, c2, p) {
    const r1 = parseInt(c1.substring(1, 3), 16);
    const g1 = parseInt(c1.substring(3, 5), 16);
    const b1 = parseInt(c1.substring(5, 7), 16);
    const r2 = parseInt(c2.substring(1, 3), 16);
    const g2 = parseInt(c2.substring(3, 5), 16);
    const b2 = parseInt(c2.substring(5, 7), 16);
    const r = Math.round(r1 + (r2 - r1) * p).toString(16).padStart(2, '0');
    const g = Math.round(g1 + (g2 - g1) * p).toString(16).padStart(2, '0');
    const b = Math.round(b1 + (b2 - b1) * p).toString(16).padStart(2, '0');
    return `#${r}${g}${b}`;
  }

  function renderStars() {
    sky.innerHTML = '';
    diaries.forEach(d => createStarElement(d));
  }

  function createStarElement(diary) {
    const starColor = getStellarColor(diary.id);
    const randomDelay = Math.random() * -5;
    const starSize = 15 + Math.random() * 20; // 결정체 크기

    const container = document.createElement('div');
    container.className = 'star-container';
    container.style.left = `${diary.x}%`;
    container.style.top = `${diary.y}%`;
    container.style.width = `${starSize}px`;
    container.style.height = `${starSize}px`;
    container.style.animationDelay = `${randomDelay}s`;

    const shape = document.createElement('div');
    shape.className = 'star-shape';
    shape.style.color = starColor;
    shape.style.animationDelay = `${randomDelay}s`;

    // 구성 요소 추가
    const rh = document.createElement('div'); rh.className = 'ray-main ray-h';
    const rv = document.createElement('div'); rv.className = 'ray-main ray-v';
    const rd1 = document.createElement('div'); rd1.className = 'ray-sub ray-d1';
    const rd2 = document.createElement('div'); rd2.className = 'ray-sub ray-d2';
    const core = document.createElement('div'); core.className = 'star-core';

    shape.append(rh, rv, rd1, rd2, core);

    const tooltip = document.createElement('div');
    tooltip.className = 'star-tooltip';
    tooltip.style.setProperty('--star-color', starColor);
    tooltip.style.borderColor = starColor;
    const preview = diary.content.length > 20 ? diary.content.slice(0, 20) + "..." : diary.content;
    tooltip.innerText = preview;

    container.appendChild(shape);
    container.appendChild(tooltip);

    container.onclick = (e) => {
      e.stopPropagation();
      viewDiary(diary.id);
    };
    sky.appendChild(container);
  }

  function openWriteModal() {
    document.getElementById('modal-title').innerText = "오늘의 별 기록";
    document.getElementById('edit-id').value = "";
    document.getElementById('diary-content').value = "";
    document.getElementById('modal-date').innerText = new Date().toLocaleString('ko-KR');
    diaryModal.style.display = 'flex';
  }

  function viewDiary(id) {
    const diary = diaries.find(d => d.id === id);
    if(!diary) return;
    document.getElementById('modal-title').innerText = "기록 읽기";
    document.getElementById('edit-id').value = diary.id;
    document.getElementById('diary-content').value = diary.content;
    document.getElementById('modal-date').innerText = diary.date;
    diaryModal.style.display = 'flex';
  }

  function closeModal(id) { document.getElementById(id).style.display = 'none'; }

  function saveDiary() {
    const content = document.getElementById('diary-content').value;
    const editId = document.getElementById('edit-id').value;
    if(!content.trim()) return;

    if(editId) {
      const index = diaries.findIndex(d => d.id == editId);
      diaries[index].content = content;
      renderStars();
      closeModal('diary-modal');
    } else {
      launchProjectile(content);
      closeModal('diary-modal');
    }
  }

  function getRandomSafePosition() {
    let x, y, safe = false;
    let attempts = 0;
    const minDistance = 8;
    while (!safe && attempts < 50) {
      x = 10 + Math.random() * 80;
      y = 5 + Math.random() * 55;
      safe = diaries.every(d => Math.sqrt(Math.pow(d.x - x, 2) + Math.pow(d.y - y, 2)) > minDistance);
      attempts++;
    }
    return { x, y };
  }

  function launchProjectile(content) {
    const projectile = document.createElement('div');
    projectile.className = 'projectile';
    const cannon = document.getElementById('cannon');
    const cannonRect = cannon.getBoundingClientRect();
    const startX = cannonRect.left + (cannonRect.width / 2);
    const startY = cannonRect.top;

    projectile.style.left = `${startX - 7}px`;
    projectile.style.top = `${startY - 7}px`;
    const pos = getRandomSafePosition();
    const skyRect = sky.getBoundingClientRect();
    const tx = ((pos.x / 100) * skyRect.width) + skyRect.left - startX;
    const ty = ((pos.y / 100) * skyRect.height) + skyRect.top - startY;

    projectile.style.setProperty('--tx', `${tx}px`);
    projectile.style.setProperty('--ty', `${ty}px`);
    projectile.style.animation = 'shoot 1.2s cubic-bezier(0.15, 0.85, 0.35, 1) forwards';
    document.body.appendChild(projectile);

    setTimeout(() => {
      diaries.push({
        id: Date.now(),
        content: content,
        date: new Date().toLocaleString('ko-KR').replace(/\. /g, '-').replace('.', ''),
        x: pos.x,
        y: pos.y
      });
      renderStars();
      projectile.remove();
    }, 1200);
  }

  document.getElementById('view-all-btn').onclick = () => {
    const list = document.getElementById('diary-list');
    list.innerHTML = '';
    [...diaries].sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(d => {
      const item = document.createElement('div');
      item.className = 'p-5 bg-white rounded-2xl border border-slate-100 shadow-sm cursor-pointer hover:shadow-md transition';
      item.innerHTML = `<p class="text-[11px] text-slate-400 mb-1">${d.date}</p><p class="text-slate-700 text-sm">${d.content}</p>`;
      item.onclick = () => { closeModal('list-modal'); viewDiary(d.id); };
      list.appendChild(item);
    });
    listModal.style.display = 'flex';
  };

  window.onclick = (e) => {
    if (e.target.classList.contains('modal')) closeModal(e.target.id);
  };
</script>
</body>
</html>
