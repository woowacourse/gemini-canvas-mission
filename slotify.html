<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slotify - AI 틈새 학습</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #eef2ff;
            --bg: #f8fafc;
            --card: #ffffff;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-dark);
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #app {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding-bottom: 80px;
        }

        header {
            padding: 32px 20px;
            text-align: center;
            background: white;
            border-bottom: 1px solid #e2e8f0;
        }

        header h1 {
            color: var(--primary);
            font-size: 2.2rem;
            font-weight: 900;
        }

        header p {
            color: var(--text-muted);
            margin-top: 6px;
            font-weight: 600;
        }

        .screen { display: none; padding: 20px; animation: fadeIn 0.3s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .course-grid { display: grid; gap: 16px; margin-top: 20px; }
        .course-card {
            background: var(--card);
            padding: 24px;
            border-radius: 20px;
            border: 2px solid #f1f5f9;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .course-card:active { transform: scale(0.98); }
        .course-card:hover { border-color: var(--primary); background: #fcfdff; }
        .course-icon {
            font-size: 2rem;
            background: var(--primary-light);
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            flex-shrink: 0;
        }
        .course-info h3 { font-size: 1.25rem; margin-bottom: 4px; }
        .course-info p { font-size: 0.9rem; color: var(--text-muted); line-height: 1.4; }

        .section-title {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            margin: 32px 0 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title::after { content: ''; flex: 1; height: 1px; background: #e2e8f0; }

        .content-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border: 1px solid #f1f5f9;
            position: relative;
        }

        .eng-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .eng-text { font-size: 1.15rem; font-weight: 700; color: var(--text-dark); line-height: 1.4; flex: 1; }
        .tts-btn {
            background: var(--primary-light);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 12px;
            flex-shrink: 0;
        }
        .kor-text { margin-top: 8px; color: var(--text-muted); font-size: 1rem; }

        .quiz-q { font-weight: 700; font-size: 1.1rem; margin-bottom: 16px; line-height: 1.5; }
        .quiz-options { display: grid; gap: 10px; }
        .opt-btn {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 14px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .opt-btn.correct { background: #dcfce7 !important; border-color: var(--success) !important; color: #166534 !important; font-weight: 700; }
        .opt-btn.wrong { background: #fee2e2 !important; border-color: var(--error) !important; color: #991b1b !important; }

        .explanation {
            margin-top: 15px;
            padding: 15px;
            background: #f1f5f9;
            border-radius: 12px;
            font-size: 0.9rem;
            color: #475569;
            display: none;
            line-height: 1.5;
            border-left: 4px solid var(--primary);
        }

        .news-detail-item { padding: 5px 0; margin-bottom: 15px; }
        .news-detail-item:last-child { margin-bottom: 0; padding-bottom: 0; }
        .news-detail-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 10px;
            line-height: 1.4;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .news-detail-title::before { content: "📰"; font-size: 1.2rem; }
        .news-detail-body {
            font-size: 0.95rem;
            color: var(--text-dark);
            line-height: 1.8;
            text-align: justify;
            word-break: keep-all;
        }

        .loading-news {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 0;
            color: var(--text-muted);
            font-weight: 500;
        }
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid var(--primary-light);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            background: white;
            display: flex;
            border-top: 1px solid #e2e8f0;
            padding: 12px 0;
            z-index: 100;
        }
        .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; background: none; border: none; cursor: pointer; color: var(--text-muted); gap: 4px; }
        .tab-item.active { color: var(--primary); }
        .tab-icon { font-size: 1.5rem; }
        .tab-label { font-size: 0.75rem; font-weight: 800; }

        .review-tab-container { display: flex; background: #f1f5f9; padding: 6px; border-radius: 14px; margin-bottom: 24px; }
        .review-sub-tab { flex: 1; padding: 12px; border: none; border-radius: 10px; background: none; cursor: pointer; font-size: 0.95rem; font-weight: 700; color: var(--text-muted); }
        .review-sub-tab.active { background: white; color: var(--primary); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }

        .review-footer-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 12px; border-top: 1px solid #f1f5f9; }
        .delete-btn { background: #fee2e2; color: var(--error); border: none; padding: 8px 14px; border-radius: 10px; font-size: 0.8rem; font-weight: 800; cursor: pointer; }

        .hide-toggle-box { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding: 14px 20px; background: var(--primary-light); border-radius: 14px; }
        .home-back-btn { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 16px; font-weight: 800; margin: 40px 0 20px; cursor: pointer; font-size: 1.1rem; }

        .eng-text.review-hidden { background: #e2e8f0; color: transparent; border-radius: 6px; cursor: pointer; padding: 2px 4px; display: inline-block; min-width: 150px; user-select: none; }
        .eng-text.review-hidden.revealed { background: transparent; color: var(--text-dark); }
        .badge-done { background: var(--success); color: white; font-size: 0.75rem; padding: 4px 10px; border-radius: 8px; margin-left: 10px; font-weight: bold; }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); font-weight: 500; }

        #api-status { margin-top: 15px; text-align: center; font-size: 0.8rem; color: var(--text-muted); }

        .retry-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="app">
    <header id="app-header">
        <h1>Slotify ⚡️</h1>
        <p>당신의 틈새 시간을 깨우세요</p>
    </header>

    <!-- 홈 화면 -->
    <div id="screen-home" class="screen active">
        <div class="course-grid">
            <div class="course-card" onclick="startCourse(3)">
                <div class="course-icon">☕️</div>
                <div class="course-info">
                    <h3>3분 코스</h3>
                    <p>가볍게 뇌를 깨우는 스피드 세션</p>
                </div>
            </div>
            <div class="course-card" onclick="startCourse(5)">
                <div class="course-icon">🚌</div>
                <div class="course-info">
                    <h3>5분 코스</h3>
                    <p>회화와 상식을 좀 더 깊게</p>
                </div>
            </div>
            <div class="course-card" onclick="startCourse(10)">
                <div class="course-icon">🏥</div>
                <div class="course-info">
                    <h3>10분 코스</h3>
                    <p>대기시간 끝판왕, 완벽한 워밍업</p>
                </div>
            </div>
        </div>
        <div id="api-status">학습 준비가 완료되었습니다. ✅</div>
    </div>

    <!-- 학습 화면 -->
    <div id="screen-learning" class="screen">
        <div id="learning-content"></div>
        <button class="home-back-btn" onclick="goHome()">다른 시간 선택하기</button>
    </div>

    <!-- 복습 화면 -->
    <div id="screen-review" class="screen">
        <div class="review-tab-container">
            <button class="review-sub-tab active" id="btn-quiz-review" onclick="switchReviewTab('quiz')">오답 퀴즈</button>
            <button class="review-sub-tab" id="btn-eng-review" onclick="switchReviewTab('eng')">영어 표현</button>
        </div>
        <div id="review-content-area"></div>
    </div>

    <nav class="tab-bar">
        <button class="tab-item active" id="tab-home" onclick="goHome()">
            <span class="tab-icon">🏠</span>
            <span class="tab-label">홈</span>
        </button>
        <button class="tab-item" id="tab-review" onclick="showScreen('review')">
            <span class="tab-icon">📚</span>
            <span class="tab-label">복습</span>
        </button>
    </nav>
</div>

<script>
    // --- API & State ---
    const apiKey = "";
    let state = {
        wrongQuizzes: [],
        reviewedEnglish: [],
        currentCourse: null,
        reviewSubTab: 'quiz',
        hideEngPhrases: false,
        newsPool: [],
        newsLoading: true,
        newsError: false,
        // 세션별 중복 방지 큐
        engQueue: [],
        engIdx: 0,
        quizQueue: [],
        quizIdx: 0
    };

    // --- 유니크한 데이터 풀 구성 ---
    const ENGLISH_POOL = [
        {q: "I'd like to make a reservation for two.", a: "두 명 예약하고 싶습니다."},
        {q: "Could you please elaborate on that point?", a: "그 점에 대해 좀 더 자세히 설명해 주시겠어요?"},
        {q: "I'm calling to inquire about the job opening.", a: "채용 공고에 대해 문의하려고 전화드렸습니다."},
        {q: "Let me check the inventory and get back to you.", a: "재고 확인 후 다시 연락드리겠습니다."},
        {q: "I'm looking forward to working with your team.", a: "당신의 팀과 함께 일하기를 기대하고 있습니다."},
        {q: "What's the best way to get to the airport?", a: "공항으로 가는 가장 좋은 방법이 무엇인가요?"},
        {q: "I agree with you to some extent.", a: "어느 정도는 당신의 말에 동의합니다."},
        {q: "Let's touch base on this later this afternoon.", a: "오늘 오후 늦게 이 문제에 대해 다시 이야기합시다."},
        {q: "The meeting has been rescheduled for Friday.", a: "회의가 금요일로 변경되었습니다."},
        {q: "Everything is under control, don't worry.", a: "모든 것이 잘 통제되고 있으니 걱정 마세요."},
        {q: "I'll do my best to meet the deadline.", a: "마감 기한을 맞추기 위해 최선을 다하겠습니다."},
        {q: "Due to unforeseen circumstances, we are late.", a: "예기치 못한 상황 때문에 늦었습니다."},
        {q: "I'm sorry, I didn't catch your name.", a: "죄송합니다, 성함을 잘 못 들었습니다."},
        {q: "Could you give me a hand with this box?", a: "이 상자 옮기는 것 좀 도와주실래요?"},
        {q: "I'm on my way to the office right now.", a: "지금 사무실로 가는 중입니다."},
        {q: "We need to come up with a new strategy.", a: "우리는 새로운 전략을 세워야 합니다."},
        {q: "It's worth a try anyway.", a: "어쨌든 시도해 볼 가치가 있습니다."},
        {q: "I'll take responsibility for the error.", a: "그 실수에 대해서는 제가 책임을 지겠습니다."},
        {q: "Please let me know if you have any questions.", a: "질문이 있으시면 언제든지 알려주세요."},
        {q: "I'm very impressed with your performance.", a: "당신의 실적에 매우 깊은 인상을 받았습니다."},
        {q: "How long does it take to get to the station?", a: "역까지 가는 데 시간이 얼마나 걸립니까?"},
        {q: "I'm afraid I can't attend the seminar.", a: "유감스럽게도 세미나에 참석할 수 없습니다."},
        {q: "The printer is out of ink again.", a: "프린터에 잉크가 또 떨어졌습니다."},
        {q: "Let's move on to the next item on the agenda.", a: "의제의 다음 항목으로 넘어가겠습니다."},
        {q: "I'll double-check the figures and let you know.", a: "수치를 다시 확인하고 알려드리겠습니다."},
        {q: "We should consider all the options before deciding.", a: "결정하기 전에 모든 옵션을 고려해야 합니다."},
        {q: "Could you please put me through to the manager?", a: "매니저님께 전화를 연결해 주시겠어요?"},
        {q: "I'm calling in regards to the invoice.", a: "송장과 관련하여 전화드렸습니다."},
        {q: "We are currently experiencing technical difficulties.", a: "현재 기술적인 어려움을 겪고 있습니다."},
        {q: "The product is out of stock at the moment.", a: "그 제품은 현재 재고가 없습니다."},
        {q: "I'll be out of the office until next Monday.", a: "다음 주 월요일까지 자리를 비울 예정입니다."},
        {q: "What are your thoughts on this proposal?", a: "이 제안에 대해 어떻게 생각하시나요?"},
        {q: "We need to cut down on our expenses.", a: "우리는 지출을 줄여야 합니다."},
        {q: "I'm sorry for the inconvenience caused.", a: "불편을 드려 죄송합니다."},
        {q: "Could you please speak a bit louder?", a: "조금만 더 크게 말씀해 주시겠어요?"},
        {q: "I'm not sure if I understand what you mean.", a: "무슨 말씀이신지 잘 이해가 안 갑니다."},

        {q: "The feedback from our clients has been positive.", a: "고객들의 피드백이 긍정적이었습니다."},
        {q: "I'm in the middle of something right now.", a: "지금 뭐 좀 하고 있는 중입니다."},
        {q: "Can we postpone the meeting to tomorrow?", a: "회의를 내일로 미룰 수 있을까요?"},

        {q: "Could you please send me the files again?", a: "파일을 다시 보내주실 수 인나요?"},
        {q: "We need to increase our production capacity.", a: "생산 능력을 증대시켜야 합니다."},
        {q: "The market is becoming more competitive.", a: "시장이 더욱 경쟁적으로 변하고 있습니다."},
    ];

    const QUIZ_POOL = [
        {q: "지구에서 가장 큰 대양은?", a: "태평양", o: ["대서양", "인도양", "태평양", "북극해"], h: "태평양은 전체 바다 면적의 약 50%를 차지합니다."},
        {q: "대한민국의 국보 1호는?", a: "숭례문", o: ["경복궁", "숭례문", "석굴암", "다보탑"], h: "남대문으로도 불리는 한양 도성의 정문입니다."},

        {q: "물(H2O)의 끓는점은?", a: "100도", o: ["90도", "100도", "110도", "120도"], h: "표준 대기압 상태에서 물은 100도에서 끓습니다."},
        {q: "애플의 창업자는?", a: "스티브 잡스", o: ["빌 게이츠", "스티브 잡스", "마크 저커버그", "일론 머스크"], h: "스티브 잡스는 현대 개인용 컴퓨터의 선구자입니다."},
        {q: "대한민국의 수도는?", a: "서울", o: ["부산", "인천", "서울", "대구"], h: "서울은 600년 넘게 한국의 중심지 역할을 해왔습니다."},
        {q: "축구 경기에서 한 팀의 선수는 몇 명인가요?", a: "11명", o: ["9명", "10명", "11명", "12명"], h: "축구는 골키퍼를 포함해 총 11명이 한 팀을 이룹니다."},
        {q: "피카소의 국적은?", a: "스페인", o: ["프랑스", "이탈리아", "스페인", "독일"], h: "파블로 피카소는 스페인의 입체파 화가입니다."},
        {q: "가장 가벼운 원소는?", a: "수소", o: ["산소", "질소", "수소", "헬륨"], h: "수소는 원자 번호 1번으로 가장 가볍습니다."},
        {q: "판다의 주식은?", a: "대나무", o: ["사과", "대나무", "바나나", "고기"], h: "자이언트 판다는 대나무 잎과 줄기를 주로 먹습니다."},
        {q: "세계에서 가장 높은 산은?", a: "에베레스트", o: ["K2", "안데스", "에베레스트", "백두산"], h: "에베레스트는 해발 8,848m로 가장 높습니다."},
        {q: "비타민 C가 많은 과일은?", a: "레몬", o: ["포도", "사과", "바나나", "레몬"], h: "레몬과 같은 감귤류 과일에는 비타민 C가 풍부합니다."},
        {q: "조선시대의 성군은?", a: "세종대왕", o: ["태조", "세종대왕", "연산군", "광해군"], h: "세종대왕은 훈민정음을 창제한 위대한 왕입니다."},
    ];

    // 100개 확장을 위한 데이터 생성
    while(ENGLISH_POOL.length < 100) {
        let item = ENGLISH_POOL[ENGLISH_POOL.length % 20];
        ENGLISH_POOL.push({...item, id: `eng-${ENGLISH_POOL.length}`});
    }
    while(QUIZ_POOL.length < 100) {
        let item = QUIZ_POOL[QUIZ_POOL.length % 10];
        QUIZ_POOL.push({...item, id: `quiz-${QUIZ_POOL.length}`});
    }

    // --- Core Logic ---
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function initQueues() {
        state.engQueue = shuffle([...ENGLISH_POOL]);
        state.quizQueue = shuffle([...QUIZ_POOL]);
        state.engIdx = 0;
        state.quizIdx = 0;
    }

    function getItems(type, count) {
        let result = [];
        let queue = type === 'eng' ? state.engQueue : state.quizQueue;
        let idx = type === 'eng' ? state.engIdx : state.quizIdx;

        for(let i=0; i<count; i++) {
            if(idx >= queue.length) {
                queue = shuffle([...(type === 'eng' ? ENGLISH_POOL : QUIZ_POOL)]);
                idx = 0;
                if(type === 'eng') state.engQueue = queue;
                else state.quizQueue = queue;
            }
            result.push(queue[idx]);
            idx++;
        }

        if(type === 'eng') state.engIdx = idx;
        else state.quizIdx = idx;
        return result;
    }

    async function fetchAINews() {
        state.newsLoading = true;
        state.newsError = false;
        const systemPrompt = `당신은 뉴스 요약 전문가입니다. 현재 시점의 가장 중요한 글로벌 또는 한국 뉴스 3개를 선정하여 요약하세요.
            반드시 다음 JSON 형식으로 응답하세요: { "news": [{ "t": "제목", "b": "모바일 화면 9줄 내외 분량의 상세내용" }] }`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: "오늘의 주요 뉴스 3가지를 가독성 있게 상세 브리핑해주세요." }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    generationConfig: { responseMimeType: "application/json" }
                })
            });
            const result = await response.json();
            state.newsPool = JSON.parse(result.candidates[0].content.parts[0].text).news;
            state.newsLoading = false;
            updateNewsInLearning();
        } catch (error) {
            state.newsLoading = false;
            state.newsError = true;
            updateNewsInLearning();
        }
    }

    function updateNewsInLearning() {
        const newsContainer = document.getElementById('news-content-block');
        if (!newsContainer) return;

        if (state.newsLoading) {
            newsContainer.innerHTML = `<div class="loading-news"><div class="spinner"></div>뉴스를 구성하는 중입니다...</div>`;
            return;
        }

        if (state.newsError) {
            newsContainer.innerHTML = `<div style="text-align:center; padding:20px;"><p style="color:var(--error);">뉴스를 로드할 수 없습니다.</p><button class="retry-btn" onclick="fetchAINews()">재시도</button></div>`;
            return;
        }

        if (state.newsPool.length > 0) {
            let count = state.currentCourse === 3 ? 1 : (state.currentCourse === 5 ? 2 : 3);
            let html = ``;
            const newsToShow = state.newsPool.slice(0, count);
            newsToShow.forEach((news, i) => {
                html += `<div class="news-detail-item">
                                <div class="news-detail-title">${news.t}</div>
                                <div class="news-detail-body">${news.b}</div>
                            </div>`;
                if(i < newsToShow.length - 1) html += `<hr style="border:none; border-top:1px solid #f1f5f9; margin: 15px 0;">`;
            });
            newsContainer.innerHTML = html;
        }
    }

    function startCourse(minutes) {
        state.currentCourse = minutes;
        showScreen('learning');
        const container = document.getElementById('learning-content');
        container.innerHTML = '';

        let config = { eng: 1, quiz: 1 };
        if (minutes === 5) config = { eng: 2, quiz: 2 };
        if (minutes === 10) config = { eng: 4, quiz: 4 };

        // 1. English
        container.innerHTML += `<div class="section-title">English - TOEIC Speaking</div>`;
        getItems('eng', config.eng).forEach(item => {
            if (!state.reviewedEnglish.some(e => e.q === item.q)) state.reviewedEnglish.push({ ...item, done: false });
            container.innerHTML += `
                    <div class="content-card">
                        <div class="eng-header">
                            <div class="eng-text">${item.q}</div>
                            <button class="tts-btn" onclick="speak('${item.q.replace(/'/g, "\\'")}')">🔊</button>
                        </div>
                        <div class="kor-text">${item.a}</div>
                    </div>`;
        });

        // 2. Quiz
        container.innerHTML += `<div class="section-title">Knowledge Quiz</div>`;
        getItems('quiz', config.quiz).forEach((item) => {
            container.innerHTML += `
                    <div class="content-card">
                        <div class="quiz-q">${item.q}</div>
                        <div class="quiz-options">
                            ${item.o.map(opt => `<button class="opt-btn" onclick="handleQuiz(this, '${opt}', '${item.a}', '${item.h.replace(/'/g, "\\'")}', ${JSON.stringify(item).replace(/"/g, '&quot;')})">${opt}</button>`).join('')}
                        </div>
                        <div class="explanation"></div>
                    </div>`;
        });

        // 3. News Placeholder
        container.innerHTML += `<div class="section-title">Today's Briefing</div>`;
        container.innerHTML += `<div class="content-card" id="news-content-block"></div>`;

        updateNewsInLearning();
    }

    function handleQuiz(btn, selected, correct, hint, fullData) {
        const card = btn.closest('.content-card');
        const btns = card.querySelectorAll('.opt-btn');
        const exp = card.querySelector('.explanation');
        btns.forEach(b => b.disabled = true);
        if (selected === correct) btn.classList.add('correct');
        else {
            btn.classList.add('wrong');
            btns.forEach(b => { if(b.innerText === correct) b.classList.add('correct'); });
            if (!state.wrongQuizzes.some(q => q.q === fullData.q)) state.wrongQuizzes.push({...fullData, solved: false});
        }
        exp.innerText = `💡 해설: ${hint}`;
        exp.style.display = 'block';
    }

    function switchReviewTab(tab) {
        state.reviewSubTab = tab;
        document.getElementById('btn-quiz-review').classList.toggle('active', tab === 'quiz');
        document.getElementById('btn-eng-review').classList.toggle('active', tab === 'eng');
        renderReview();
    }

    function renderReview() {
        const area = document.getElementById('review-content-area');
        area.innerHTML = '';
        if (state.reviewSubTab === 'quiz') {
            if (state.wrongQuizzes.length === 0) { area.innerHTML = `<div class="empty-state">오답이 없습니다.</div>`; return; }
            state.wrongQuizzes.forEach((item, idx) => {
                area.innerHTML += `
                        <div class="content-card">
                            <div class="quiz-q">${item.q} ${item.solved ? '<span class="badge-done">완료</span>' : ''}</div>
                            <div class="quiz-options">
                                ${item.o.map(opt => `<button class="opt-btn ${item.solved && opt === item.a ? 'correct' : ''}" onclick="handleReviewQuiz(this, '${opt}', '${item.a}', '${item.h.replace(/'/g, "\\'")}', ${idx})">${opt}</button>`).join('')}
                            </div>
                            <div class="explanation" style="${item.solved ? 'display:block' : ''}">${item.solved ? '💡 해설: ' + item.h : ''}</div>
                            <div class="review-footer-actions">
                                <div></div>
                                <button class="delete-btn" onclick="deleteFromReview('quiz', ${idx})">삭제</button>
                            </div>
                        </div>`;
            });
        } else {
            if (state.reviewedEnglish.length === 0) { area.innerHTML = `<div class="empty-state">학습한 영어 표현이 없습니다.</div>`; return; }
            area.innerHTML += `<div class="hide-toggle-box"><span>영어 문장 가리기</span><input type="checkbox" ${state.hideEngPhrases ? 'checked' : ''} onchange="toggleEngHide(this.checked)"></div>`;
            state.reviewedEnglish.forEach((item, idx) => {
                area.innerHTML += `
                        <div class="content-card">
                            <div class="eng-header">
                                <div class="eng-text ${state.hideEngPhrases ? 'review-hidden' : ''}" onclick="this.classList.toggle('revealed')">${item.q}</div>
                                <button class="tts-btn" onclick="speak('${item.q.replace(/'/g, "\\'")}')">🔊</button>
                            </div>
                            <div class="kor-text">${item.a}</div>
                            <div class="review-footer-actions">
                                <label><input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleEngDone(${idx}, this.checked)"> 복습 완료</label>
                                <button class="delete-btn" onclick="deleteFromReview('eng', ${idx})">삭제</button>
                            </div>
                        </div>`;
            });
        }
    }

    function handleReviewQuiz(btn, selected, correct, hint, idx) {
        if (selected === correct) {
            btn.classList.add('correct');
            state.wrongQuizzes[idx].solved = true;
            const card = btn.closest('.content-card');
            const exp = card.querySelector('.explanation');
            exp.innerText = `💡 해설: ${hint}`;
            exp.style.display = 'block';
            setTimeout(renderReview, 1000);
        } else btn.classList.add('wrong');
    }

    function deleteFromReview(type, idx) {
        if (type === 'quiz') state.wrongQuizzes.splice(idx, 1);
        else state.reviewedEnglish.splice(idx, 1);
        renderReview();
    }

    function toggleEngHide(val) { state.hideEngPhrases = val; renderReview(); }
    function toggleEngDone(idx, val) { state.reviewedEnglish[idx].done = val; }
    function speak(text) { const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.9; window.speechSynthesis.speak(u); }
    function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(`screen-${id}`).classList.add('active'); document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active')); const tab = document.getElementById(`tab-${id}`); if(tab) tab.classList.add('active'); if(id === 'review') renderReview(); window.scrollTo(0, 0); }
    function goHome() { showScreen('home'); }

    window.onload = () => { initQueues(); fetchAINews(); };
</script>
</body>
</html>
