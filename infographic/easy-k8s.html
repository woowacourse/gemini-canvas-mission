<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kube-Easy: 쿠버네티스 마스터 가이드</title>
    <style>
        :root {
            --neon-cyan: #00f2ff;
            --soft-green: #39ff14;
            --warning-red: #ff4d4d;
            --dark-bg: #0a0e14;
            --card-bg: #161b22;
            --text-main: #e6edf3;
            --text-dim: #8b949e;
            --accent-glow: rgba(0, 242, 255, 0.3);
            --bubble-bg: #21262d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 1rem 2rem;
            background: rgba(22, 27, 34, 0.8);
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .scenario-tabs {
            display: flex;
            gap: 10px;
        }

        .tab {
            padding: 8px 16px;
            border-radius: 20px;
            background: #21262d;
            color: var(--text-dim);
            cursor: pointer;
            border: 1px solid transparent;
            font-size: 0.85rem;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tab.active {
            background: var(--neon-cyan);
            color: var(--dark-bg);
            font-weight: bold;
        }

        .tab .check-mark {
            display: none;
            color: var(--soft-green);
            font-weight: bold;
        }

        .tab.completed .check-mark {
            display: inline;
        }

        .tab.active.completed .check-mark {
            color: #000;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            width: 100%;
        }

        #infographic-canvas {
            flex: 1;
            min-width: 600px;
            position: relative;
            background: radial-gradient(circle at center, #111827 0%, #0a0e14 100%);
            display: flex;
            overflow: hidden;
            border-right: 1px solid #30363d;
        }

        #sidebar {
            width: 400px;
            min-width: 350px;
            background: var(--card-bg);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
            z-index: 10;
        }

        .node {
            position: absolute;
            width: 140px;
            height: 85px;
            border: 2px solid var(--neon-cyan);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 242, 255, 0.05);
            transition: all 0.5s ease;
            z-index: 2;
        }

        .node.active {
            box-shadow: 0 0 30px var(--neon-cyan);
            background: rgba(0, 242, 255, 0.2);
            transform: scale(1.05);
        }

        .node.failed, .node.overload {
            border-color: var(--warning-red);
            background: rgba(255, 77, 77, 0.2);
            box-shadow: 0 0 20px rgba(255, 77, 77, 0.5);
        }

        .node.overload {
            animation: shake 0.2s infinite;
        }

        @keyframes shake {
            0% {
                transform: translate(0, 0);
            }
            25% {
                transform: translate(2px, 2px);
            }
            50% {
                transform: translate(-2px, 0);
            }
            75% {
                transform: translate(2px, -2px);
            }
            100% {
                transform: translate(0, 0);
            }
        }

        .node .analogy {
            font-weight: bold;
            font-size: 0.85rem;
            color: var(--soft-green);
            text-align: center;
            padding: 0 5px;
        }

        .node .term {
            font-size: 0.65rem;
            color: var(--text-dim);
            margin-top: 4px;
        }

        #node-manager {
            left: 40%;
            top: 10%;
            width: 160px;
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.05);
        }

        #node-manager .analogy {
            color: #ffd700;
        }

        #node-manager .eyes {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
        }

        .eye {
            width: 8px;
            height: 8px;
            background: #ffd700;
            border-radius: 50%;
            box-shadow: 0 0 5px #ffd700;
        }

        .eye.blink {
            animation: blink 0.2s infinite;
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(1.2);
            }
        }

        .speech-bubble {
            position: absolute;
            background: var(--bubble-bg);
            color: white;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            border: 1px solid var(--neon-cyan);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 10;
            white-space: pre-line;
            text-align: center;
        }

        #node-ingress {
            left: 5%;
            top: 45%;
        }

        #node-service {
            left: 32%;
            top: 45%;
        }

        .pod-cluster {
            position: absolute;
            left: 60%;
            top: 10%;
            width: 300px;
            height: 80%;
            display: flex;
            flex-wrap: wrap;
            align-content: center;
            justify-content: center;
            gap: 15px;
        }

        .pod-node {
            position: static;
            transition: opacity 0.5s, transform 0.5s;
        }

        #main-packet {
            position: absolute;
            width: 16px;
            height: 16px;
            background: var(--soft-green);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--soft-green);
            z-index: 10;
            pointer-events: none;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
        }

        .flood-packet {
            position: absolute;
            width: 12px;
            height: 12px;
            background: var(--soft-green);
            border-radius: 50%;
            z-index: 5;
            pointer-events: none;
        }

        #connections {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .conn-line {
            stroke: #30363d;
            stroke-width: 1.5;
            fill: none;
            transition: 0.5s;
        }

        .guide-box, .quiz-box {
            background: #0d1117;
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid #30363d;
        }

        .guide-box {
            min-height: 250px;
        }

        .analogy-highlight {
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(57, 255, 20, 0.1);
            border-left: 4px solid var(--soft-green);
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .guide-title {
            font-size: 1.3rem;
            margin-bottom: 0.8rem;
            color: var(--neon-cyan);
        }

        .quiz-box {
            display: none;
            border-color: var(--soft-green);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .quiz-title {
            color: var(--soft-green);
            font-size: 1.1rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quiz-option {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: white;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
        }

        .quiz-option:hover {
            background: #30363d;
            border-color: var(--neon-cyan);
        }

        #control-bar {
            padding: 1rem 2rem;
            background: #161b22;
            border-top: 1px solid #30363d;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            z-index: 100;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0.8rem 1.5rem;
            border-radius: 30px;
            border: 2px solid var(--neon-cyan);
            background: transparent;
            color: var(--neon-cyan);
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        .nav-btn:hover:not(:disabled) {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .nav-btn:disabled {
            border-color: #30363d;
            color: #484f58;
            cursor: not-allowed;
        }

        .nav-btn.quiz-ready {
            border-color: var(--soft-green);
            color: var(--soft-green);
        }

        .nav-btn.quiz-ready:hover {
            background: var(--soft-green);
            color: #000;
        }

        #fireworks-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        #message-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 40px;
            background: var(--soft-green);
            color: black;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.5);
            display: none;
            z-index: 2000;
        }

        #add-guest-btn {
            position: absolute;
            left: 20px;
            bottom: 20px;
            z-index: 100;
            background: var(--warning-red);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<canvas id="fireworks-canvas"></canvas>
<div id="message-toast"></div>

<header>
    <h1>Kube-Easy</h1>
    <div class="scenario-tabs">
        <div id="tab-1" class="tab active" onclick="setScenario(1)">
            <span class="check-mark">✓</span> #1 웹사이트 접속
        </div>
        <div id="tab-2" class="tab" onclick="setScenario(2)">
            <span class="check-mark">✓</span> #2 일꾼의 복구
        </div>
        <div id="tab-3" class="tab" onclick="setScenario(3)">
            <span class="check-mark">✓</span> #3 오토스케일링
        </div>
    </div>
</header>

<main>
    <div id="infographic-canvas">
        <svg id="connections"></svg>
        <div id="packet-layer"></div>
        <div id="main-packet"></div>

        <button id="add-guest-btn" onclick="triggerGuestFlood()">손님 추가 (트래픽 폭주!) 🚀</button>

        <div id="node-manager" class="node hidden">
            <div class="eyes">
                <div class="eye"></div>
                <div class="eye"></div>
            </div>
            <span class="analogy">[관리자 로봇]</span>
            <span class="term">(Control Plane)</span>
        </div>
        <div id="bubble-manager" class="speech-bubble" style="left: 35%; top: 22%;"></div>

        <div id="bubble-ingress" class="speech-bubble" style="left: 5%; top: 35%;"></div>
        <div id="node-ingress" class="node">
            <span class="analogy">[규칙표와 문지기]</span>
            <span class="term">(Ingress & Controller)</span>
        </div>

        <div id="bubble-service" class="speech-bubble" style="left: 32%; top: 35%;"></div>
        <div id="node-service" class="node">
            <span class="analogy">[안내데스크]</span>
            <span class="term">(Service)</span>
        </div>

        <div id="pod-cluster" class="pod-cluster"></div>
    </div>

    <div id="sidebar">
        <div id="guide-section" class="guide-box">
            <h2 class="guide-title" id="step-title">환영합니다!</h2>
            <p id="step-desc">아래의 다음 단계 버튼을 눌러서 공부를 시작해봐요.</p>
            <div id="reality-analogy" class="analogy-highlight" style="display: none;"></div>
        </div>

        <div id="quiz-section" class="quiz-box">
            <div class="quiz-title">✨ 실력 확인 퀴즈!</div>
            <p id="quiz-question">질문이 들어갈 자리입니다.</p>
            <div id="quiz-options-container"></div>
        </div>

        <div style="margin-top: auto; padding: 10px; color: var(--text-dim); font-size: 0.85rem; border-top: 1px solid #30363d;">
            💡 키보드의 화살표(←, →)를 눌러도 페이지를 넘길 수 있어요!
        </div>
    </div>
</main>

<div id="control-bar">
    <button id="prev-btn" class="nav-btn" onclick="prevStep()" disabled>← 이전 단계</button>
    <div style="color: var(--text-dim); letter-spacing: 2px;" id="step-count">STEP 0 / 0</div>
    <button id="next-btn" class="nav-btn" onclick="nextStep()">다음 단계 →</button>
</div>

<script>
    let currentScenarioId = 1;
    let currentStep = 0;
    let completedScenarios = {1: false, 2: false, 3: false};
    let floodInterval = null;
    let targetPodIdx = 0;

    const scenarios = {
        1: {
            title: "웹사이트 접속 흐름",
            quiz: {
                question: "어떤 주소(Host)로 왔는지, 어느 길(Path)로 가고 싶은지 보고 안내데스크로 연결해주는 '문지기' 역할은?",
                options: ["Ingress Controller (인그레스 컨트롤러)", "Service (서비스)", "Kubelet (쿠블릿)"],
                answer: "Ingress Controller (인그레스 컨트롤러)"
            },
            steps: [
                {
                    title: "1. 요청 발생",
                    desc: "사용자가 웹사이트 주소를 입력하고 접속을 시도합니다.",
                    analogy: "마을 입구에 손님이 도착했습니다. 이제 어디로 가야 할지 물어봐야 해요.",
                    action: () => {
                        setupPods(3);
                        moveMainPacket(-5, 50, 0);
                    }
                },
                {
                    title: "2. 규칙표 확인 (Ingress)",
                    desc: "표지판(규칙표)에 적힌 대로 문지기가 손님을 안내하기 시작합니다.",
                    analogy: "<b>[Ingress]</b> 규칙에 적힌 도메인과 경로를 확인해서 담당 안내데스크를 찾아줍니다.",
                    action: () => {
                        setupPods(3);
                        activateNode('node-ingress', "주소와 경로를 확인 중...\n규칙에 맞는 곳으로 안내할게요!");
                        moveMainPacket(5, 45, 1);
                    }
                },
                {
                    title: "3. 안내데스크 (Service)",
                    desc: "이름표(Label)를 단 일꾼들 중 지금 바로 일할 수 있는(Ready) 팀을 찾습니다.",
                    analogy: "<b>[Service]</b>는 손님을 담당 일꾼 팀에게 골고루 나누어 보내주는 로드밸런싱을 수행합니다.",
                    action: () => {
                        setupPods(3);
                        activateNode('node-service', "팀원들 이름표를 확인해서\n준비된 곳으로 보내드릴게요!");
                        moveMainPacket(32, 45, 1);
                    }
                },
                {
                    title: "4. 일꾼 팀 도착 (Pod)",
                    desc: "드디어 프로그램이 실행 중인 방에 도착했습니다.",
                    analogy: "<b>[Pod]</b> 안에는 여러 일꾼(컨테이너)들이 한 팀이 되어 손님의 요청을 처리해 줍니다.",
                    action: () => {
                        setupPods(3);
                        const pod = document.getElementById(`pod-${targetPodIdx}`);
                        activateNode(`pod-${targetPodIdx}`);
                        const podRect = pod.getBoundingClientRect();
                        const canvasRect = document.getElementById('infographic-canvas').getBoundingClientRect();
                        const tx = ((podRect.left + podRect.width / 2 - canvasRect.left) / canvasRect.width) * 100;
                        const ty = ((podRect.top + podRect.height / 2 - canvasRect.top) / canvasRect.height) * 100;
                        moveMainPacket(tx, ty, 1, true);
                    }
                }
            ]
        },
        2: {
            title: "일꾼의 자동 복구",
            quiz: {
                question: "일꾼이 아파서 쓰러졌을 때, '약속된 개수'와 '현재 개수'를 비교해서 복구를 지시하는 로봇은?",
                options: ["Controller Manager (컨트롤러 매니저)", "Scheduler (스케줄러)", "API Server (API 서버)"],
                answer: "Controller Manager (컨트롤러 매니저)"
            },
            steps: [
                {
                    title: "1. 선언적 관리 (Deployment)",
                    desc: "우리는 '일꾼 팀을 항상 3개로 유지해줘'라고 계획표를 넘겼습니다.",
                    analogy: "쿠버네티스는 <b>[Deployment]</b> 계획표에 적힌 '원하는 상태'를 기억하고 있습니다.",
                    action: () => {
                        setupPods(3, true);
                        document.getElementById('node-manager').classList.remove('hidden');
                    }
                },
                {
                    title: "2. 사고 발생!",
                    desc: "일꾼 팀 하나가 갑자기 고장 나서 사라져 버렸습니다.",
                    analogy: "현재 상태가 약속했던 3팀에서 2팀으로 줄어들어버린 위급한 상황입니다.",
                    action: () => {
                        setupPods(3, true);
                        document.getElementById('node-manager').classList.remove('hidden');
                        const pods = document.querySelectorAll('.pod-node');
                        pods[1].classList.remove('active');
                        pods[1].classList.add('failed');
                        pods[1].querySelector('.status-icon').innerHTML = '💀';
                    }
                },
                {
                    title: "3. 차이 발견 (Controller)",
                    desc: "감독관 로봇이 약속과 다른 현재 상태를 즉시 발견합니다.",
                    analogy: "<b>[Controller Manager]</b>는 계획표와 현장의 일꾼 숫자를 비교해서 부족한 팀을 채우라고 지시합니다.",
                    action: () => {
                        setupPods(3, true);
                        document.getElementById('node-manager').classList.remove('hidden');
                        const pods = document.querySelectorAll('.pod-node');
                        pods[1].classList.remove('active');
                        pods[1].classList.add('failed');
                        pods[1].querySelector('.status-icon').innerHTML = '💀';
                        document.querySelectorAll('.eye').forEach(e => e.classList.add('blink'));
                        showManagerBubble("앗! 약속대로라면 3팀이어야 하는데\n지금 2팀뿐이야! 새로 팀을 꾸려야겠어.");
                    }
                },
                {
                    title: "4. 자동 복구 (Scheduler)",
                    desc: "배치 담당 로봇이 가장 쾌적한 장소를 찾아 새 팀을 투입합니다.",
                    analogy: "<b>[Scheduler]</b>가 빈자리를 찾아 새 Pod를 넣어주면 다시 3팀이 되어 평화를 되찾습니다.",
                    action: () => {
                        setupPods(3, true);
                        document.getElementById('node-manager').classList.remove('hidden');
                        showManagerBubble("가장 좋은 빈자리를 찾았어!\n복구 성공! 이제 다시 3팀이야.");
                    }
                }
            ]
        },
        3: {
            title: "오토스케일링",
            quiz: {
                question: "CPU나 메모리 같은 '지표(Metrics)'를 보고 일꾼 팀의 숫자를 자동으로 조절하는 규칙은?",
                options: ["HPA (Horizontal Pod Autoscaler)", "Cluster Autoscaler (CA)", "Load Balancer (로드밸런서)"],
                answer: "HPA (Horizontal Pod Autoscaler)"
            },
            steps: [
                {
                    title: "1. 트래픽 폭주",
                    desc: "갑자기 평소보다 100배 많은 사람들이 동시에 들어왔습니다.",
                    analogy: "마을 입구에 손님이 너무 많아 줄이 수 킬로미터나 이어진 상황입니다.",
                    action: () => {
                        setupPods(3, true);
                        document.getElementById('node-manager').classList.remove('hidden');
                        document.getElementById('add-guest-btn').style.display = 'block';
                    }
                },
                {
                    title: "2. 일꾼들의 비명 (과부하)",
                    desc: "일꾼들의 컴퓨터 성능(CPU/메모리)이 한계에 도달해 속도가 느려집니다.",
                    analogy: "일꾼들이 땀을 흘리며 과부하에 걸렸습니다. 지표(Metrics) 수치가 치솟고 있어요.",
                    action: () => {
                        setupPods(3, true);
                        document.getElementById('node-manager').classList.remove('hidden');
                        triggerGuestFlood(true);
                        document.querySelectorAll('.pod-node').forEach(p => p.classList.add('overload'));
                    }
                },
                {
                    title: "3. 지표 확인과 명령",
                    desc: "관리자 로봇이 치솟는 수치를 보고 '자동 증원'을 결심합니다.",
                    analogy: "<b>[HPA]</b> 규칙이 발동했습니다! 지표 서버에서 부하를 감지하고 일꾼을 7팀으로 늘리라고 명령합니다.",
                    action: () => {
                        setupPods(3, true);
                        document.getElementById('node-manager').classList.remove('hidden');
                        triggerGuestFlood(true);
                        document.querySelectorAll('.pod-node').forEach(p => p.classList.add('overload'));
                        showManagerBubble("성능 수치(Metrics)가 너무 높아!\nHPA 규칙에 따라 7팀으로 확장한다!");
                        document.querySelectorAll('.eye').forEach(e => e.classList.add('blink'));
                    }
                },
                {
                    title: "4. 확장 완료",
                    desc: "일꾼 팀이 늘어나고, 필요하다면 서버(노드)도 자동으로 추가됩니다.",
                    analogy: "<b>[CA]</b> 덕분에 빈 땅(노드)까지 넓힐 수 있습니다. 쿠버네티스 덕분에 일일이 서버를 살 필요가 없어요!",
                    action: () => {
                        setupPods(7, true);
                        document.getElementById('node-manager').classList.remove('hidden');
                        showManagerBubble("성공적으로 늘어났어!\n이제 아무리 많은 손님도 괜찮아.");
                    }
                }
            ]
        }
    };

    function setupPods(count, active = false) {
        const cluster = document.getElementById('pod-cluster');
        cluster.innerHTML = '';
        for (let i = 0; i < count; i++) {
            const pod = document.createElement('div');
            pod.className = `node pod-node ${active ? 'active' : ''}`;
            pod.id = `pod-${i}`;
            pod.innerHTML = `<div class="status-icon"></div><span class="analogy">[작업 팀 ${i + 1}]</span><span class="term">(Pod-${String.fromCharCode(65 + i)})</span>`;
            cluster.appendChild(pod);
        }
    }

    function activateNode(id, bubbleText = "") {
        const node = document.getElementById(id);
        if (node) node.classList.add('active');
        if (bubbleText) {
            const bubbleId = id.includes('ingress') ? 'bubble-ingress' : 'bubble-service';
            const bubble = document.getElementById(bubbleId);
            if (bubble) {
                bubble.innerText = bubbleText;
                bubble.style.opacity = '1';
            }
        }
    }

    function resetVisuals() {
        // 모든 노드 상태 제거
        document.querySelectorAll('.node').forEach(n => {
            n.classList.remove('active', 'failed', 'overload');
            if (n.querySelector('.status-icon')) n.querySelector('.status-icon').innerHTML = '';
        });
        // 말풍선 및 매니저 상태 제거
        document.querySelectorAll('.speech-bubble').forEach(b => b.style.opacity = '0');
        document.querySelectorAll('.eye').forEach(e => e.classList.remove('blink'));

        // 시나리오 관련 레이어 초기화
        stopFlood();
        document.getElementById('packet-layer').innerHTML = '';
        document.getElementById('main-packet').style.opacity = '0';
        document.getElementById('add-guest-btn').style.display = 'none';

        // 관리자 노드 기본값
        document.getElementById('node-manager').classList.add('hidden');
    }

    function resetScenarioState() {
        resetVisuals();
        document.getElementById('quiz-section').style.display = 'none';
        document.getElementById('guide-section').style.display = 'block';
        const nextBtn = document.getElementById('next-btn');
        nextBtn.disabled = false;
        nextBtn.style.display = 'flex';
        nextBtn.innerText = "다음 단계 →";
        nextBtn.classList.remove('quiz-ready');
    }

    function showManagerBubble(text) {
        const bM = document.getElementById('bubble-manager');
        if (bM) {
            bM.innerText = text;
            bM.style.opacity = '1';
        }
    }

    function moveMainPacket(xPct, yPct, opacity = 1, isCentered = false) {
        const p = document.getElementById('main-packet');
        p.style.opacity = opacity;
        const offsetX = isCentered ? 0 : 70;
        const offsetY = isCentered ? 0 : 42.5;
        p.style.left = `calc(${xPct}% + ${offsetX}px)`;
        p.style.top = `calc(${yPct}% + ${offsetY}px)`;
    }

    function renderStep() {
        const scenario = scenarios[currentScenarioId];
        const step = scenario.steps[currentStep];
        const nextBtn = document.getElementById('next-btn');

        // 단계 전환 시 항상 깨끗하게 비우기 (버그 수정 핵심)
        resetVisuals();

        nextBtn.disabled = false;
        document.getElementById('step-title').innerText = step.title;
        document.getElementById('step-desc').innerText = step.desc;
        const reality = document.getElementById('reality-analogy');
        reality.style.display = 'block';
        reality.innerHTML = step.analogy;
        document.getElementById('step-count').innerText = `STEP ${currentStep + 1} / ${scenario.steps.length}`;

        document.getElementById('prev-btn').disabled = (currentStep === 0);

        if (currentStep === scenario.steps.length - 1) {
            nextBtn.innerText = "퀴즈 풀기! ✏️";
            nextBtn.classList.add('quiz-ready');
        } else {
            nextBtn.innerText = "다음 단계 →";
            nextBtn.classList.remove('quiz-ready');
        }

        // 현재 단계에 맞는 액션 실행
        step.action();
    }

    function nextStep() {
        const scenario = scenarios[currentScenarioId];
        if (currentStep === scenario.steps.length - 1) {
            startQuiz();
            return;
        }
        currentStep++;
        renderStep();
    }

    function prevStep() {
        if (currentStep > 0) {
            currentStep--;
            renderStep();
        }
    }

    function startQuiz() {
        document.getElementById('guide-section').style.display = 'none';
        const quizBox = document.getElementById('quiz-section');
        const scenario = scenarios[currentScenarioId];
        document.getElementById('quiz-question').innerText = scenario.quiz.question;

        const container = document.getElementById('quiz-options-container');
        container.innerHTML = '';
        scenario.quiz.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'quiz-option';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt);
            container.appendChild(btn);
        });
        quizBox.style.display = 'block';
        document.getElementById('next-btn').style.display = 'none';
    }

    function checkAnswer(selected) {
        const correct = scenarios[currentScenarioId].quiz.answer;
        if (selected === correct) {
            fireworks();
            showToast("정답이에요! 쿠버네티스 실력이 쑥쑥 늘고 있네요! 👏");
            completedScenarios[currentScenarioId] = true;
            document.getElementById(`tab-${currentScenarioId}`).classList.add('completed');
            document.getElementById('quiz-section').style.display = 'none';
            document.getElementById('guide-section').style.display = 'block';
            document.getElementById('step-title').innerText = "Mission Clear! ✨";
            document.getElementById('step-desc').innerText = "축하합니다! 핵심 원리를 완벽하게 이해하셨어요.\n이제 상단에서 다른 시나리오도 도전해 보세요!";
        } else {
            showToast("틀렸습니다! 설명을 다시 한번 천천히 읽어보세요. 🧐", "#ff4d4d");
        }
    }

    function fireworks() {
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const particles = [];
        for (let i = 0; i < 100; i++) {
            particles.push({
                x: canvas.width / 2, y: canvas.height / 2,
                vx: (Math.random() - 0.5) * 15, vy: (Math.random() - 0.5) * 15,
                size: Math.random() * 5 + 2, color: `hsl(${Math.random() * 360}, 100%, 50%)`, life: 100
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            if (particles.length > 0) requestAnimationFrame(animate);
        }

        animate();
    }

    function showToast(msg, bg = "var(--soft-green)") {
        const toast = document.getElementById('message-toast');
        toast.innerText = msg;
        toast.style.background = bg;
        toast.style.display = 'block';
        setTimeout(() => {
            toast.style.display = 'none';
        }, 2500);
    }

    function setScenario(id) {
        currentScenarioId = id;
        currentStep = 0;
        targetPodIdx = Math.floor(Math.random() * 3);
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(`tab-${id}`).classList.add('active');
        resetScenarioState();
        renderStep();
    }

    function triggerGuestFlood(auto = false) {
        if (floodInterval) return;
        floodInterval = setInterval(() => {
            for (let i = 0; i < 5; i++) {
                const layer = document.getElementById('packet-layer');
                const p = document.createElement('div');
                p.className = 'flood-packet';
                p.style.background = 'var(--soft-green)';
                p.style.boxShadow = '0 0 10px var(--soft-green)';
                p.style.borderRadius = '50%';
                p.style.left = '0%';
                p.style.top = (30 + Math.random() * 40) + '%';
                layer.appendChild(p);
                setTimeout(() => {
                    p.style.transition = 'all 0.8s linear';
                    p.style.left = '95%';
                    setTimeout(() => p.remove(), 850);
                }, 50);
            }
        }, auto ? 200 : 400);
        if (!auto) {
            const btn = document.getElementById('add-guest-btn');
            if (btn) btn.innerText = "손님 몰려오는 중...!!! 🚨";
        }
    }

    function stopFlood() {
        if (floodInterval) {
            clearInterval(floodInterval);
            floodInterval = null;
        }
    }

    document.addEventListener('keydown', (e) => {
        const nextBtn = document.getElementById('next-btn');
        if (e.key === 'ArrowRight' && nextBtn.style.display !== 'none' && !nextBtn.disabled) nextStep();
        if (e.key === 'ArrowLeft') prevStep();
    });

    window.onload = () => setScenario(1);
</script>

</body>
</html>
