          isCorrect: isCorrect
        });

        if (isCorrect) {
          this.score += 1;
        }

        if (this.currentQuestionIndex < this.sessionQuestions.length - 1) {
          this.currentQuestionIndex += 1;
          this.render(); // 상태만 변경하고 재렌더링
        } else {
          this.finishQuiz();
        }
      },

      // 액션: 퀴즈 종료
      finishQuiz: function() {
        this.setState('RESULT');
        const percentage = Math.round((this.score / this.sessionQuestions.length) * 100);
        
        if (percentage === 100) {
          // 폭죽 이펙트
          setTimeout(() => {
            if (window.confetti) {
              const duration = 3 * 1000;
              const animationEnd = Date.now() + duration;
              const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };

              const randomInRange = (min, max) => Math.random() * (max - min) + min;

              const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);

                const particleCount = 50 * (timeLeft / duration);
                window.confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                window.confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
              }, 250);
            }
          }, 300);
        }
      },

      // 액션: 히스토리 보기
      goToHistory: function() {
        this.setState('HISTORY');
      },

      // 렌더링 함수들
      renderHome: function() {
        return `
          <div class="flex flex-col items-center justify-center min-h-[80vh] text-center space-y-8 animate-fade-in px-4">
            <div class="w-24 h-24 bg-teal-100 rounded-full flex items-center justify-center shadow-lg shadow-teal-100/50 mb-4">
              <i data-lucide="trophy" class="w-12 h-12 text-teal-600"></i>
            </div>
            <div>
              <h1 class="text-4xl md:text-5xl font-extrabold text-gray-900 mb-4 tracking-tight">
                우테코 생존 <span class="text-teal-500">모의고사</span>
              </h1>
              <p class="text-lg text-gray-600 max-w-xl mx-auto leading-relaxed">
                1주차, 낯선 환경에 적응하느라 고생하는 크루들을 위해 준비했습니다.<br/>
                이전 기수 선배들의 꿀팁, 포비의 명언, 그리고 우테코의 학습 문화까지!<br/>
                퀴즈를 풀며 우테코 100% 적응에 도전해보세요! 🌱
              </p>
            </div>
            <button 
              onclick="App.startQuiz()"
              class="group relative inline-flex items-center justify-center px-8 py-4 text-lg font-bold text-white transition-all duration-200 bg-teal-500 rounded-full hover:bg-teal-600 hover:shadow-lg hover:-translate-y-1 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500"
            >
              테스트 시작하기
              <i data-lucide="arrow-right" class="w-5 h-5 ml-2 group-hover:translate-x-1 transition-transform"></i>
            </button>
          </div>
        `;
      },

      renderQuiz: function() {
        if (!this.sessionQuestions.length) return '';
        const currentQ = this.sessionQuestions[this.currentQuestionIndex];
        const progress = ((this.currentQuestionIndex) / this.sessionQuestions.length) * 100;

        let optionsHtml = '';
        currentQ.options.forEach((option, idx) => {
          optionsHtml += `
            <button
              onclick="App.handleAnswerSelect(${idx})"
              class="w-full text-left p-5 rounded-xl border-2 border-gray-100 hover:border-teal-500 hover:bg-teal-50 transition-all duration-200 group flex items-start"
            >
              <span class="flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 group-hover:bg-teal-500 group-hover:text-white text-gray-600 font-bold mr-4 transition-colors mt-0.5">
                ${idx + 1}
              </span>
              <span class="text-lg text-gray-700 font-medium leading-relaxed">${option}</span>
            </button>
          `;
        });

        return `
          <div class="max-w-3xl mx-auto w-full pt-8 px-4 animate-fade-in">
            <!-- Progress Bar -->
            <div class="mb-8">
              <div class="flex justify-between text-sm font-medium text-gray-500 mb-2">
                <span>Question ${this.currentQuestionIndex + 1} of ${this.sessionQuestions.length}</span>
                <span>${Math.round(progress)}%</span>
              </div>
              <div class="w-full bg-gray-200 rounded-full h-2.5">
                <div 
                  class="bg-teal-500 h-2.5 rounded-full transition-all duration-500 ease-out" 
                  style="width: ${progress}%"
                ></div>
              </div>
            </div>

            <!-- Question Card -->
            <div class="bg-white rounded-3xl shadow-xl border border-gray-100 p-6 md:p-10 mb-8">
              <span class="inline-block px-3 py-1 mb-4 text-xs font-semibold tracking-wider text-teal-700 bg-teal-100 rounded-full">
                ${currentQ.category}
              </span>
              <h2 class="text-2xl md:text-3xl font-bold text-gray-800 mb-8 leading-snug break-keep">
                ${currentQ.question}
              </h2>

              <div class="space-y-4">
                ${optionsHtml}
              </div>
            </div>
          </div>
        `;
      },

      renderResult: function() {
        if (!this.sessionQuestions.length) return '';
        const percentage = Math.round((this.score / this.sessionQuestions.length) * 100);
        
        // 등급 계산
        let grade = "";
        let gradeDesc = "";
        let iconName = "";
        let iconColor = "";
        let bgColor = "";
        
        if (percentage === 100) {
          grade = "우테코 마스터 👑";
          gradeDesc = "완벽합니다! 이미 우테코의 철학과 문화를 100% 흡수하셨네요. 동기 크루들을 이끌어주세요!";
          iconName = "medal";
          iconColor = "text-yellow-500";
          bgColor = "bg-yellow-50";
        } else if (percentage >= 80) {
          grade = "예비 수석 크루 🚀";
          gradeDesc = "훌륭합니다! 우테코 생활에 꽤 많이 적응하셨군요. 이대로만 쭉 가시면 무사 수료는 문제없습니다!";
          iconName = "star";
          iconColor = "text-teal-500";
          bgColor = "bg-teal-50";
        } else if (percentage >= 50) {
          grade = "적응 완료 크루 🏃";
          gradeDesc = "좋습니다! 아직 헷갈리는 부분도 있지만 방향은 잘 잡고 계시네요. 오답 노트를 통해 꿀팁을 확인해보세요!";
          iconName = "check-circle-2";
          iconColor = "text-blue-500";
          bgColor = "bg-blue-50";
        } else {
          grade = "우린 이제 시작이야 🌱";
          gradeDesc = "괜찮아요! 원래 처음이 가장 힘든 법이죠. 오답 노트의 해설들을 읽어보시면 우테코 생활에 큰 도움이 될 거예요.";
          iconName = "book-open";
          iconColor = "text-green-500";
          bgColor = "bg-green-50";
        }

        const radius = 60;
        const circumference = 2 * Math.PI * radius;
        const strokeDashoffset = circumference - (percentage / 100) * circumference;
        const isPerfect = percentage === 100;

        // 원형 그래프 애니메이션 처리를 위해 인라인 스크립트를 삽입하거나 지연 실행을 활용
        setTimeout(() => {
          const circleEl = document.getElementById('progress-circle');
          if (circleEl) {
            circleEl.style.strokeDashoffset = strokeDashoffset;
          }
        }, 50);

        return `
          <div class="max-w-2xl mx-auto w-full py-12 px-4 animate-fade-in flex flex-col items-center">
            <div class="w-full ${bgColor} rounded-3xl p-8 shadow-sm border border-gray-100 text-center mb-8 relative overflow-hidden">
              ${isPerfect ? '<div class="absolute top-0 left-0 w-full h-full pointer-events-none opacity-50 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-yellow-200 via-transparent to-transparent"></div>' : ''}
              
              <div class="flex justify-center mb-6 relative z-10">
                <!-- Circular Progress Bar -->
                <div class="relative w-40 h-40">
                  <svg class="w-full h-full transform -rotate-90" viewBox="0 0 140 140">
                    <circle cx="70" cy="70" r="60" fill="transparent" stroke="#e5e7eb" stroke-width="12"></circle>
                    <circle 
                      id="progress-circle"
                      cx="70" cy="70" r="60" fill="transparent" 
                      stroke="${isPerfect ? '#eab308' : '#14b8a6'}" 
                      stroke-width="12" 
                      stroke-dasharray="${circumference}" 
                      stroke-dashoffset="${circumference}" 
                      stroke-linecap="round" 
                      class="transition-all duration-1000 ease-out"
                    ></circle>
                  </svg>
                  <div class="absolute top-0 left-0 w-full h-full flex flex-col items-center justify-center">
                    <span class="text-4xl font-extrabold ${isPerfect ? 'text-yellow-600' : 'text-teal-600'}">
                      ${percentage}%
                    </span>
                    <span class="text-sm text-gray-500 font-medium mt-1">
                      ${this.score} / ${this.sessionQuestions.length} 정답
                    </span>
                  </div>
                </div>
              </div>

              <div class="relative z-10 flex flex-col items-center">
                <div class="mb-4">
                  <i data-lucide="${iconName}" class="w-16 h-16 ${iconColor}"></i>
                </div>
                <h2 class="text-3xl font-bold text-gray-900 mb-2">${grade}</h2>
                <p class="text-gray-600 leading-relaxed max-w-md break-keep">${gradeDesc}</p>
              </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-4 w-full justify-center">
              <button 
                onclick="App.goToHistory()"
                class="flex items-center justify-center px-6 py-4 bg-white border-2 border-teal-500 text-teal-600 font-bold rounded-xl hover:bg-teal-50 transition-colors w-full sm:w-auto"
              >
                <i data-lucide="book-open" class="w-5 h-5 mr-2"></i>
                정답 및 해설 보기
              </button>
              <button 
                onclick="App.startQuiz()"
                class="flex items-center justify-center px-6 py-4 bg-gray-900 text-white font-bold rounded-xl hover:bg-gray-800 transition-colors w-full sm:w-auto"
              >
                <i data-lucide="rotate-ccw" class="w-5 h-5 mr-2"></i>
                다시 풀기
              </button>
            </div>
          </div>
        `;
      },

      renderHistory: function() {
        let historyListHtml = '';
        this.userAnswers.forEach((answer, index) => {
          const questionData = QUIZ_DATA.find(q => q.id === answer.questionId);
          
          historyListHtml += `
            <div class="p-6 rounded-2xl border ${answer.isCorrect ? 'border-green-200 bg-green-50/30' : 'border-red-200 bg-red-50/30'} shadow-sm">
              <div class="flex items-start gap-4">
                <div class="mt-1">
                  ${answer.isCorrect 
                    ? '<i data-lucide="check-circle-2" class="w-6 h-6 text-green-500"></i>' 
                    : '<i data-lucide="x-circle" class="w-6 h-6 text-red-500"></i>'}
                </div>
                <div class="flex-1">
                  <span class="text-xs font-bold text-gray-500 mb-1 block">${questionData.category}</span>
                  <h3 class="text-lg font-bold text-gray-900 mb-4 break-keep">${questionData.question}</h3>
                  
                  <div class="space-y-2 mb-4">
                    <div class="p-4 rounded-xl text-sm ${answer.isCorrect ? 'bg-green-100 text-green-900 font-medium' : 'bg-red-100 text-red-900'} leading-relaxed">
                      <span class="font-bold mr-2 block mb-1">나의 답변:</span> 
                      ${questionData.options[answer.selectedOption]}
                    </div>
                    
                    ${!answer.isCorrect ? `
                      <div class="p-4 rounded-xl text-sm bg-blue-50 text-blue-900 font-medium border border-blue-100 leading-relaxed">
                        <span class="font-bold mr-2 block mb-1">실제 정답:</span> 
                        ${questionData.options[questionData.correctAnswerIndex]}
                      </div>
                    ` : ''}
                  </div>

                  <div class="bg-white p-5 rounded-xl border border-gray-100 mt-4 shadow-sm">
                    <h4 class="flex items-center text-sm font-bold text-teal-600 mb-2">
                      <i data-lucide="star" class="w-4 h-4 mr-1 fill-current"></i>
                      코치/선배의 코멘트
                    </h4>
                    <p class="text-gray-700 text-sm leading-relaxed break-keep">
                      ${questionData.explanation}
                    </p>
                  </div>
                </div>
              </div>
            </div>
          `;
        });

        return `
          <div class="max-w-4xl mx-auto w-full py-8 px-4 animate-fade-in">
            <div class="flex items-center justify-between mb-8">
              <div>
                <h2 class="text-3xl font-bold text-gray-900 mb-2">오답 노트 & 꿀팁 방출 📚</h2>
                <p class="text-gray-600">내가 푼 문제들을 복습하고 선배들의 꿀팁을 확인하세요.</p>
              </div>
              <button 
                onclick="App.goHome()"
                class="p-3 bg-gray-100 rounded-full hover:bg-gray-200 transition-colors text-gray-600"
                title="홈으로"
              >
                <i data-lucide="home" class="w-6 h-6"></i>
              </button>
            </div>
            <div class="space-y-6">
              ${historyListHtml}
            </div>
          </div>
        `;
      },

      // 통합 렌더러
      render: function() {
        const root = document.getElementById('app-root');
        
        // 헤더 '처음으로' 버튼 제어
        const headerHomeBtn = document.getElementById('header-home-btn');
        if (this.state === 'HOME') {
          headerHomeBtn.classList.add('hidden');
        } else {
          headerHomeBtn.classList.remove('hidden');
        }

        // 상태별 컴포넌트 마운트
        switch(this.state) {
          case 'HOME':
            root.innerHTML = this.renderHome();
            break;
          case 'QUIZ':
            root.innerHTML = this.renderQuiz();
            break;
          case 'RESULT':
            root.innerHTML = this.renderResult();
            break;
          case 'HISTORY':
            root.innerHTML = this.renderHistory();
            break;
        }

        // HTML 삽입 후 Lucide 아이콘 초기화 (DOM에 새로 추가된 i 태그를 SVG로 변환)
        if (typeof lucide !== 'undefined') {
          lucide.createIcons();
        }
      }
    };

    // 앱 초기화
    document.addEventListener('DOMContentLoaded', () => {
      App.render();
    });

  </script>
</body>
</html>
