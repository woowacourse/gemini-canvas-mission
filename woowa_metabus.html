<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🪐 우아한 메타버스</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jua', sans-serif;
            overflow: hidden;
            touch-action: none;
            background: #f1f5f9;
        }

        /* Lobby Screen */
        #login-screen {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(20px);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-y: auto;
            padding: 80px 20px;
        }

        .login-card {
            background: white;
            padding: 3rem;
            border-radius: 2.5rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            flex-shrink: 0;
        }

        .avatar-option {
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 3px solid transparent;
            font-size: 2.8rem;
            width: 75px;
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 1.5rem;
            background: #f8fafc;
        }
        .avatar-option.selected {
            border-color: #6366f1;
            background: #eef2ff;
            transform: scale(1.1);
        }

        /* Layout Structure */
        #main-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            padding-top: 80px; /* Header Space */
            padding-bottom: 100px; /* Menu Space */
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* World Container */
        #world-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #cbd5e1;
        }

        #viewport {
            width: 400%;
            height: 300%;
            display: flex;
            position: absolute;
            top: 0;
            left: 0;
            will-change: transform;
        }

        .village-porong {
            width: 50%;
            height: 100%;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            position: relative;
            border-right: 4px solid rgba(203, 213, 225, 0.3);
        }

        .village-dumba {
            width: 50%;
            height: 100%;
            background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
            position: relative;
        }

        .village-name-label {
            position: absolute;
            top: 250px;
            width: 100%;
            text-align: center;
            font-size: 8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5rem;
            pointer-events: none;
            user-select: none;
            z-index: 1;
            filter: blur(1px);
        }
        .porong-label { color: rgba(14, 165, 233, 0.08); }
        .dumba-label { color: rgba(245, 158, 11, 0.12); }

        /* Avatar */
        .avatar-container {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            background: white;
            border: 3px solid white;
        }

        .avatar.me {
            border: 4px solid #10b981;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.3);
            z-index: 20;
        }

        .avatar-name {
            font-size: 14px;
            background: rgba(15, 23, 42, 0.85);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            margin-top: 12px;
            white-space: nowrap;
        }

        .speech-bubble {
            position: absolute;
            bottom: 110px;
            background: white;
            color: #1e293b;
            padding: 10px 18px;
            border-radius: 18px;
            font-size: 14px;
            min-width: 60px;
            max-width: 260px;
            width: max-content;
            word-wrap: break-word;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 30;
            border: 1px solid rgba(226, 232, 240, 0.5);
            text-align: center;
        }

        .speech-bubble.active {
            opacity: 1;
            transform: translateY(0);
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: white transparent transparent transparent;
        }

        .deco-item {
            position: absolute;
            font-size: 60px;
            opacity: 0.4;
            user-select: none;
            pointer-events: none;
        }

        /* User List UI */
        #user-list-modal {
            position: fixed;
            top: 85px;
            right: 20px;
            width: 300px;
            max-height: 50vh;
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            z-index: 1500;
            display: none;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #f1f5f9;
        }

        .user-list-header {
            padding: 16px;
            border-bottom: 1px solid #f1f5f9;
            font-weight: bold;
            color: #475569;
            background: #f8fafc;
        }

        #user-list-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .user-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            border-radius: 0.75rem;
            transition: background 0.1s ease;
            cursor: default;
        }
        /* Flickering Fix: No dimension changes on hover, just color */
        .user-item:hover { background: #f8fafc; }

        .goto-btn {
            background: #6366f1;
            color: white;
            font-size: 11px;
            padding: 5px 12px;
            border-radius: 9999px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .goto-btn:hover { background: #4f46e5; transform: scale(1.05); }

        /* Sidebar Chat (Discord Style) */
        #chat-sidebar {
            width: 0;
            background: white;
            border-left: 1px solid #f1f5f9;
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease;
            overflow: hidden;
            flex-shrink: 0;
        }
        #chat-sidebar.active { width: 380px; }

        .chat-header {
            padding: 20px;
            background: #f8fafc;
            border-bottom: 1px solid #f1f5f9;
            font-weight: bold;
            color: #1e293b;
        }

        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-family: sans-serif;
        }

        .chat-log-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .chat-log-name { font-size: 12px; font-weight: 700; color: #6366f1; }
        .chat-log-text { font-size: 14px; color: #334155; line-height: 1.4; word-break: break-all; background: #f1f5f9; padding: 8px 12px; border-radius: 0 12px 12px 12px; width: fit-content; max-width: 90%; }

        .sidebar-chat-input-area {
            padding: 16px;
            border-top: 1px solid #f1f5f9;
            display: flex;
            gap: 8px;
        }

        /* Bottom Menu Bar */
        #bottom-menu {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 100px;
            background: white;
            border-top: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 1400;
        }

        .central-chat-form {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 600px;
        }

        .input-pill {
            flex: 1;
            background: #f1f5f9;
            border: 2px solid transparent;
            border-radius: 1.5rem;
            padding: 12px 24px;
            outline: none;
            font-size: 16px;
            transition: all 0.2s;
        }
        .input-pill:focus { border-color: #6366f1; background: white; }

        .btn-pill {
            background: #6366f1;
            color: white;
            padding: 0 32px;
            border-radius: 1.5rem;
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn-pill:hover { background: #4f46e5; }

        /* Notification Icon wrapper */
        #chat-sidebar-toggle-wrapper {
            position: relative;
        }
        #chat-sidebar-toggle {
            width: 56px;
            height: 56px;
            background: #6366f1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            transition: all 0.2s;
        }
        #chat-sidebar-toggle:hover { transform: scale(1.1); }
        #chat-sidebar-toggle.active { background: #ef4444; }

        #unread-dot {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 16px;
            height: 16px;
            background: #f43f5e;
            border: 2px solid white;
            border-radius: 50%;
            display: none;
            z-index: 1401;
        }
    </style>
</head>
<body class="h-screen w-full flex flex-col">

<!-- Lobby Screen -->
<div id="login-screen">
    <div class="login-card">
        <h2 class="text-4xl font-bold text-center text-indigo-600 mb-3 tracking-tight">🪐 우아한 메타버스</h2>
        <p class="text-center text-slate-500 mb-10 font-sans">함께 소통하며 성장하는 크루들의 공간</p>

        <div class="space-y-8">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-3 ml-1">크루 닉네임</label>
                <input type="text" id="input-nickname" maxlength="12" placeholder="닉네임을 입력하세요" class="w-full px-6 py-4 border-2 border-slate-100 rounded-2xl focus:border-indigo-500 outline-none transition-all font-sans text-lg">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-3 ml-1">입장할 마을</label>
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="selectVillage('porong')" id="btn-sel-porong" class="py-4 rounded-2xl border-2 border-indigo-500 bg-indigo-50 text-indigo-700 font-bold transition-all shadow-sm">❄️ 뽀롱뽀롱</button>
                    <button onclick="selectVillage('dumba')" id="btn-sel-dumba" class="py-4 rounded-2xl border-2 border-slate-100 bg-slate-50 text-slate-400 font-bold transition-all shadow-sm">☀️ 둠바 부족</button>
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-3 ml-1">캐릭터 선택</label>
                <div id="avatar-list" class="flex flex-wrap gap-4 justify-center py-5 bg-slate-50 rounded-3xl p-4 border border-slate-100">
                </div>
            </div>

            <button onclick="enterWorld()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-5 rounded-2xl text-2xl font-bold shadow-2xl transition-all transform active:scale-95 mt-4">
                월드 입장하기
            </button>
        </div>
    </div>
</div>

<!-- Header Interface -->
<header id="top-bar" class="hidden fixed top-0 left-0 right-0 h-[80px] bg-white/90 backdrop-blur-md border-b px-8 flex items-center justify-between z-[1300]">
    <h1 class="text-2xl font-black text-indigo-600 tracking-tighter">🪐 우아한 메타버스</h1>

    <button onclick="toggleUserList()" id="player-count-btn" class="flex items-center bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-full transition-all shadow-lg">
        <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse mr-2.5"></div>
        <span id="player-count-text" class="text-sm font-bold">접속 중: 1명</span>
    </button>
</header>

<!-- User List Modal -->
<div id="user-list-modal">
    <div class="user-list-header text-sm flex justify-between items-center">
        <span>실시간 접속자</span>
        <span id="modal-count" class="text-indigo-600">1명</span>
    </div>
    <div id="user-list-content"></div>
</div>

<!-- Layout Structure -->
<div id="main-container" class="hidden">
    <!-- World container -->
    <main id="world-container">
        <div id="viewport">
            <section id="area-porong" class="village-porong">
                <div class="village-name-label porong-label">PORONG FOREST</div>
            </section>
            <section id="area-dumba" class="village-dumba">
                <div class="village-name-label dumba-label">DUMBA VILLAGE</div>
            </section>
        </div>
    </main>

    <!-- Sidebar persistent chat -->
    <aside id="chat-sidebar">
        <div class="chat-header">전체 채팅 로그 (디스코드 스타일)</div>
        <div id="chat-messages"></div>
        <form id="sidebar-chat-form" class="sidebar-chat-input-area">
            <input type="text" id="sidebar-chat-input" maxlength="50" placeholder="글로벌 채팅 입력..." autocomplete="off" class="flex-1 bg-slate-100 rounded-lg px-4 py-2 text-sm outline-none">
            <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold text-xs">전송</button>
        </form>
    </aside>
</div>

<!-- Bottom Menu Bar -->
<footer id="bottom-menu" class="hidden">
    <div class="flex-1"></div>
    <form id="central-bubble-form" class="central-chat-form">
        <input type="text" id="central-bubble-input" maxlength="50" placeholder="크루들에게 인사해보세요!" autocomplete="off" class="input-pill">
        <button type="submit" class="btn-pill">보내기</button>
    </form>
    <div class="flex-1 flex justify-end items-center">
        <div id="chat-sidebar-toggle-wrapper">
            <div id="unread-dot"></div>
            <div id="chat-sidebar-toggle" onclick="toggleSidebarChat()">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                </svg>
            </div>
        </div>
    </div>
</footer>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot, collection, serverTimestamp, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = typeof __firebase_config !== 'undefined'
        ? JSON.parse(__firebase_config)
        : { apiKey: "", authDomain: "", projectId: "", storageBucket: "", messagingSenderId: "", appId: "" };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'wooa-meta-vfinal-ultimate';

    const AVATARS = {
        porong: ['🐧', '🐻', '🦊', '🦦', '🐰', '⛄'],
        dumba: ['🦓', '🐘', '🐆', '🦒', '🛖', '🏹']
    };

    const STATE = {
        user: null,
        myId: null,
        isLoggedIn: false,
        myVillage: 'porong',
        myAvatar: '🐧',
        myName: '',
        players: {},
        messages: [],
        myPos: { x: 10, y: 50 },
        keys: {},
        cameraX: 0,
        cameraY: 0,
        userListVisible: false,
        sidebarChatVisible: false,
        lastMsgCount: 0,
        lastUserListJson: "" // For flicker fix
    };

    const DOM = {
        loginScreen: document.getElementById('login-screen'),
        mainContainer: document.getElementById('main-container'),
        worldContainer: document.getElementById('world-container'),
        topBar: document.getElementById('top-bar'),
        bottomMenu: document.getElementById('bottom-menu'),
        viewport: document.getElementById('viewport'),
        avatarList: document.getElementById('avatar-list'),
        inputNickname: document.getElementById('input-nickname'),
        porongArea: document.getElementById('area-porong'),
        dumbaArea: document.getElementById('area-dumba'),
        bubbleInput: document.getElementById('central-bubble-input'),
        bubbleForm: document.getElementById('central-bubble-form'),
        sidebarInput: document.getElementById('sidebar-chat-input'),
        sidebarForm: document.getElementById('sidebar-chat-form'),
        sidebarChat: document.getElementById('chat-sidebar'),
        sidebarToggle: document.getElementById('chat-sidebar-toggle'),
        unreadDot: document.getElementById('unread-dot'),
        chatMessages: document.getElementById('chat-messages'),
        countText: document.getElementById('player-count-text'),
        modalCount: document.getElementById('modal-count'),
        userListModal: document.getElementById('user-list-modal'),
        userListContent: document.getElementById('user-list-content')
    };

    window.selectVillage = (v) => {
        STATE.myVillage = v;
        document.getElementById('btn-sel-porong').className = v === 'porong' ? 'py-4 rounded-2xl border-2 border-indigo-500 bg-indigo-50 text-indigo-700 font-bold transition-all shadow-sm' : 'py-4 rounded-2xl border-2 border-slate-100 bg-slate-50 text-slate-400 font-bold transition-all shadow-sm';
        document.getElementById('btn-sel-dumba').className = v === 'dumba' ? 'py-4 rounded-2xl border-2 border-orange-500 bg-orange-50 text-orange-700 font-bold transition-all shadow-sm' : 'py-4 rounded-2xl border-2 border-slate-100 bg-slate-50 text-slate-400 font-bold transition-all shadow-sm';
        renderAvatarOptions();
    };

    window.enterWorld = async () => {
        const name = DOM.inputNickname.value.trim();
        if (!name) return;
        STATE.myName = name;
        STATE.isLoggedIn = true;
        STATE.myPos = STATE.myVillage === 'porong' ? { x: 10, y: 50 } : { x: 90, y: 50 };

        DOM.loginScreen.style.display = 'none';
        DOM.mainContainer.classList.remove('hidden');
        DOM.topBar.classList.remove('hidden');
        DOM.bottomMenu.classList.remove('hidden');

        startSync();
    };

    window.toggleUserList = () => {
        STATE.userListVisible = !STATE.userListVisible;
        DOM.userListModal.style.display = STATE.userListVisible ? 'flex' : 'none';
        if (STATE.userListVisible) renderUserListContent(true);
    };

    window.toggleSidebarChat = () => {
        STATE.sidebarChatVisible = !STATE.sidebarChatVisible;
        if (STATE.sidebarChatVisible) {
            DOM.sidebarChat.classList.add('active');
            DOM.sidebarToggle.classList.add('active');
            DOM.unreadDot.style.display = 'none';
            setTimeout(() => { DOM.chatMessages.scrollTop = DOM.chatMessages.scrollHeight; }, 300);
        } else {
            DOM.sidebarChat.classList.remove('active');
            DOM.sidebarToggle.classList.remove('active');
        }
    };

    window.teleportToPlayer = (uid) => {
        const target = STATE.players[uid];
        if (target) {
            STATE.myPos.x = target.x;
            STATE.myPos.y = target.y;
            window.toggleUserList();
        }
    };

    function renderAvatarOptions() {
        DOM.avatarList.innerHTML = '';
        const list = AVATARS[STATE.myVillage];
        STATE.myAvatar = list[0];
        list.forEach(emoji => {
            const opt = document.createElement('div');
            opt.className = `avatar-option ${emoji === STATE.myAvatar ? 'selected' : ''}`;
            opt.innerText = emoji;
            opt.onclick = () => {
                STATE.myAvatar = emoji;
                document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('selected'));
                opt.classList.add('selected');
            };
            DOM.avatarList.appendChild(opt);
        });
    }

    async function init() {
        renderAvatarOptions();
        setupDecorations();

        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        };

        initAuth().catch(() => {});
        onAuthStateChanged(auth, (user) => {
            if (user) {
                STATE.user = user;
                STATE.myId = user.uid;
            }
        });

        window.addEventListener('keydown', e => STATE.keys[e.key] = true);
        window.addEventListener('keyup', e => STATE.keys[e.key] = false);

        DOM.bubbleForm.onsubmit = handleSendSpeechBubble;
        DOM.sidebarForm.onsubmit = handleSendGlobalMessage;

        gameLoop();
    }

    function setupDecorations() {
        const createDeco = (parent, list, count) => {
            for(let i=0; i<count; i++) {
                const d = document.createElement('div');
                d.className = 'deco-item';
                d.innerText = list[Math.floor(Math.random() * list.length)];
                d.style.left = Math.random() * 92 + 4 + '%';
                d.style.top = Math.random() * 92 + 4 + '%';
                parent.appendChild(d);
            }
        };
        createDeco(DOM.porongArea, ['🌲', '❄️', '🏠', '🎄'], 25);
        createDeco(DOM.dumbaArea, ['⛺', '🌵', '🛖', '🔥'], 25);
    }

    function startSync() {
        if (!STATE.user) return;

        setInterval(() => updateMyRemoteData(), 200);

        const playersCol = collection(db, 'artifacts', appId, 'public', 'data', 'players');
        onSnapshot(playersCol, (snapshot) => {
            const activePlayers = {};
            const now = Date.now();
            snapshot.forEach(doc => {
                const data = doc.data();
                const timestamp = data.updatedAt ? data.updatedAt.toMillis() : now;
                if (now - timestamp < 15000) activePlayers[doc.id] = data;
            });
            if (STATE.myId) {
                activePlayers[STATE.myId] = {
                    uid: STATE.myId, name: STATE.myName, avatar: STATE.myAvatar,
                    x: STATE.myPos.x, y: STATE.myPos.y,
                    msg: STATE.players[STATE.myId]?.msg || ""
                };
            }
            STATE.players = activePlayers;
            renderPlayers();
            updateUI();
            if (STATE.userListVisible) renderUserListContent();
        });

        const chatCol = collection(db, 'artifacts', appId, 'public', 'data', 'messages');
        onSnapshot(chatCol, (snapshot) => {
            let msgs = [];
            snapshot.forEach(doc => msgs.push(doc.data()));
            msgs.sort((a, b) => (a.createdAt?.toMillis() || 0) - (b.createdAt?.toMillis() || 0));

            if (msgs.length > STATE.lastMsgCount && !STATE.sidebarChatVisible) {
                DOM.unreadDot.style.display = 'block';
            }
            STATE.lastMsgCount = msgs.length;
            STATE.messages = msgs;
            renderChatLog();
        });
    }

    async function updateMyRemoteData(extra = {}) {
        if (!STATE.isLoggedIn || !STATE.myId) return;
        const playerRef = doc(db, 'artifacts', appId, 'public', 'data', 'players', STATE.myId);
        try {
            await setDoc(playerRef, {
                uid: STATE.myId, name: STATE.myName, avatar: STATE.myAvatar,
                x: STATE.myPos.x, y: STATE.myPos.y, updatedAt: serverTimestamp(), ...extra
            }, { merge: true });
        } catch (e) {}
    }

    async function handleSendSpeechBubble(e) {
        e.preventDefault();
        const val = DOM.bubbleInput.value.trim();
        if (!val || !STATE.myId) return;
        DOM.bubbleInput.value = '';

        try {
            if (STATE.players[STATE.myId]) STATE.players[STATE.myId].msg = val;
            renderPlayers();
            await updateMyRemoteData({ msg: val });
            setTimeout(async () => {
                if (STATE.players[STATE.myId]) STATE.players[STATE.myId].msg = "";
                await updateMyRemoteData({ msg: "" });
                renderPlayers();
            }, 3000);
        } catch (e) {}
    }

    async function handleSendGlobalMessage(e) {
        e.preventDefault();
        const val = DOM.sidebarInput.value.trim();
        if (!val || !STATE.myId) return;
        DOM.sidebarInput.value = '';
        try {
            const chatCol = collection(db, 'artifacts', appId, 'public', 'data', 'messages');
            await addDoc(chatCol, {
                senderId: STATE.myId,
                senderName: STATE.myName,
                text: val,
                createdAt: serverTimestamp()
            });
        } catch (e) {}
    }

    function renderChatLog() {
        DOM.chatMessages.innerHTML = '';
        STATE.messages.forEach(m => {
            const item = document.createElement('div');
            item.className = 'chat-log-item';
            item.innerHTML = `
                    <div class="chat-log-name">${m.senderName}</div>
                    <div class="chat-log-text">${m.text}</div>
                `;
            DOM.chatMessages.appendChild(item);
        });
        DOM.chatMessages.scrollTop = DOM.chatMessages.scrollHeight;
    }

    function renderPlayers() {
        const currentUids = Object.keys(STATE.players);
        document.querySelectorAll('.avatar-container').forEach(el => {
            if (!currentUids.includes(el.id)) el.remove();
        });
        currentUids.forEach(uid => {
            const data = STATE.players[uid];
            let el = document.getElementById(uid);
            if (!el) {
                el = createPlayerElement(uid, data.name, data.avatar, uid === STATE.myId);
                DOM.viewport.appendChild(el);
            }
            el.style.left = data.x + '%';
            el.style.top = data.y + '%';
            const bubble = el.querySelector('.speech-bubble');
            if (data.msg) {
                bubble.innerText = data.msg;
                bubble.classList.add('active');
            } else {
                bubble.classList.remove('active');
            }
        });
    }

    function createPlayerElement(uid, name, avatar, isMe) {
        const container = document.createElement('div');
        container.id = uid; container.className = 'avatar-container';
        const bubble = document.createElement('div'); bubble.className = 'speech-bubble';
        const av = document.createElement('div'); av.className = `avatar ${isMe ? 'me' : ''}`;
        av.innerText = avatar || '👤';
        const nameTag = document.createElement('div'); nameTag.className = 'avatar-name';
        nameTag.innerText = name + (isMe ? ' (나)' : '');
        container.append(bubble, av, nameTag);
        return container;
    }

    // FLICKER FIX: Only re-render user list if members change
    function renderUserListContent(force = false) {
        const userSummaries = Object.values(STATE.players).map(p => ({uid: p.uid, name: p.name, avatar: p.avatar}));
        const currentJson = JSON.stringify(userSummaries);
        if (STATE.lastUserListJson === currentJson && !force) return;
        STATE.lastUserListJson = currentJson;

        DOM.userListContent.innerHTML = '';
        Object.values(STATE.players).forEach(p => {
            const item = document.createElement('div');
            item.className = 'user-item';
            const actionButton = p.uid === STATE.myId
                ? `<span class="text-[10px] text-slate-400 font-bold italic">나</span>`
                : `<button onclick="teleportToPlayer('${p.uid}')" class="goto-btn">찾아가기</button>`;

            item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="text-xl">${p.avatar}</span>
                        <span class="text-sm text-slate-700 font-bold">${p.name}</span>
                    </div>
                    ${actionButton}
                `;
            DOM.userListContent.appendChild(item);
        });
    }

    function gameLoop() {
        if (!STATE.isLoggedIn) {
            requestAnimationFrame(gameLoop);
            return;
        }

        const baseSpeed = 0.95;
        const horizontalRatio = 4;
        const verticalRatio = 3;
        const speedX = baseSpeed / horizontalRatio;
        const speedY = (baseSpeed * 2) / verticalRatio;

        const chatActive = document.activeElement === DOM.bubbleInput || document.activeElement === DOM.sidebarInput;

        if (!chatActive) {
            if (STATE.keys.ArrowUp || STATE.keys.w) STATE.myPos.y -= speedY;
            if (STATE.keys.ArrowDown || STATE.keys.s) STATE.myPos.y += speedY;
            if (STATE.keys.ArrowLeft || STATE.keys.a) STATE.myPos.x -= speedX;
            if (STATE.keys.ArrowRight || STATE.keys.d) STATE.myPos.x += speedX;
        }

        const containerWidth = DOM.worldContainer.clientWidth;
        const containerHeight = DOM.worldContainer.clientHeight;
        const totalWorldWidth = containerWidth * horizontalRatio;
        const totalWorldHeight = containerHeight * verticalRatio;

        // Character Boundaries: Padding for character size and Header(80px)/Footer(100px)
        const boundX = (32 / totalWorldWidth) * 100;
        const topLimit = (80 / totalWorldHeight) * 100; // 80px Header buffer
        const bottomLimit = 100 - (32 / totalWorldHeight) * 100;

        STATE.myPos.x = Math.max(boundX, Math.min(100 - boundX, STATE.myPos.x));
        STATE.myPos.y = Math.max(topLimit, Math.min(bottomLimit, STATE.myPos.y));

        const myPixelX = (STATE.myPos.x / 100) * totalWorldWidth;
        const myPixelY = (STATE.myPos.y / 100) * totalWorldHeight;

        let offsetX = -(myPixelX - containerWidth / 2);
        let offsetY = -(myPixelY - containerHeight / 2);
        offsetX = Math.min(0, Math.max(-(totalWorldWidth - containerWidth), offsetX));
        offsetY = Math.min(0, Math.max(-(totalWorldHeight - containerHeight), offsetY));

        STATE.cameraX = offsetX;
        STATE.cameraY = offsetY;
        DOM.viewport.style.transform = `translate(${offsetX}px, ${offsetY}px)`;

        const myEl = document.getElementById(STATE.myId);
        if (myEl) {
            myEl.style.left = STATE.myPos.x + '%';
            myEl.style.top = STATE.myPos.y + '%';
        }
        requestAnimationFrame(gameLoop);
    }

    function updateUI() {
        const count = Object.keys(STATE.players).length;
        DOM.countText.innerText = `접속 중: ${count}명`;
        DOM.modalCount.innerText = `${count}명`;
    }

    init();
</script>
</body>
</html>
