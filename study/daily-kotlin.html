<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매일 코틀린 (Daily Kotlin)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f8f9fa;
        }
        /* 코틀린 브랜드 컬러 적용 */
        .text-kotlin {
            background: linear-gradient(to right, #7F52FF, #C757BC, #F58345);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .bg-kotlin {
            background: linear-gradient(to right, #7F52FF, #C757BC);
        }
        .hover-bg-kotlin:hover {
            background: linear-gradient(to right, #6b40e3, #b049a5);
        }
        .completed-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #7F52FF;
            margin: 2px auto 0;
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col items-center py-8 px-4">

    <!-- Header -->
    <header class="w-full max-w-4xl text-center mb-8">
        <h1 class="text-4xl font-extrabold text-kotlin tracking-tight mb-2">매일 코틀린</h1>
        <p class="text-gray-500 font-medium mb-6">하루에 하나씩, 코틀린 개념과 알고리즘을 정복하세요.</p>
        
        <!-- 난이도 선택 탭 -->
        <div class="flex justify-center gap-2">
            <button class="diff-btn active px-5 py-2 rounded-full font-bold text-sm transition-all bg-purple-600 text-white shadow-md" data-level="beginner">초급</button>
            <button class="diff-btn px-5 py-2 rounded-full font-bold text-sm transition-all bg-white text-gray-500 hover:bg-gray-100 border border-gray-200" data-level="intermediate">중급</button>
            <button class="diff-btn px-5 py-2 rounded-full font-bold text-sm transition-all bg-white text-gray-500 hover:bg-gray-100 border border-gray-200" data-level="advanced">고급</button>
            <button class="diff-btn px-5 py-2 rounded-full font-bold text-sm transition-all bg-white text-gray-500 hover:bg-gray-100 border border-gray-200" data-level="expert">숙련자</button>
        </div>
    </header>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-white/80 z-50 flex flex-col items-center justify-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-purple-600 mb-4"></div>
        <p class="text-gray-600 font-semibold">학습 데이터를 불러오는 중입니다...</p>
    </div>

    <!-- Main Content -->
    <main class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-5 gap-6 hidden" id="mainContent">
        
        <!-- Left: Today's Mission -->
        <section class="md:col-span-3 bg-white rounded-2xl shadow-sm border border-gray-100 p-6 flex flex-col h-full">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h2 class="text-2xl font-bold text-gray-800" id="missionDateTitle">오늘의 미션</h2>
                <span id="completionBadge" class="hidden px-3 py-1 bg-green-100 text-green-700 text-sm font-bold rounded-full">학습 완료 🎉</span>
            </div>

            <!-- Concept Section -->
            <div class="mb-6 flex-1">
                <div class="flex items-center gap-2 mb-2">
                    <span class="bg-purple-100 text-purple-700 px-2 py-1 rounded text-xs font-bold tracking-wide">CS & 개념</span>
                    <h3 class="text-xl font-bold text-gray-900" id="conceptTitle">개념 제목</h3>
                </div>
                <p class="text-gray-600 leading-relaxed bg-gray-50 p-4 rounded-xl border border-gray-100" id="conceptDesc">
                    개념 설명이 이곳에 표시됩니다.
                </p>
            </div>

            <!-- Algorithm Section -->
            <div class="mb-8">
                <div class="flex items-center gap-2 mb-2">
                    <span class="bg-orange-100 text-orange-700 px-2 py-1 rounded text-xs font-bold tracking-wide">코딩테스트</span>
                    <span id="algoLevel" class="text-xs text-gray-500 font-medium">Lv.0</span>
                </div>
                <div class="p-4 rounded-xl border border-gray-200 hover:border-purple-300 transition-colors bg-white shadow-sm flex justify-between items-center">
                    <div>
                        <p class="text-sm text-gray-500 mb-1" id="algoSource">플랫폼</p>
                        <h4 class="text-lg font-bold text-gray-800" id="algoTitle">문제 제목</h4>
                    </div>
                    <a id="algoLink" href="#" target="_blank" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-lg text-sm transition-colors">
                        문제 풀러가기
                    </a>
                </div>
            </div>

            <!-- Action Button -->
            <button id="toggleCompleteBtn" class="w-full py-4 rounded-xl text-white font-bold text-lg bg-kotlin hover-bg-kotlin transition-all shadow-md transform hover:-translate-y-0.5">
                오늘의 학습 완료하기
            </button>
        </section>

        <!-- Right: Calendar -->
        <section class="md:col-span-2 bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
            <div class="flex justify-between items-center mb-6">
                <button id="prevMonth" class="p-2 text-gray-400 hover:text-purple-600 hover:bg-purple-50 rounded-lg transition-colors">&larr;</button>
                <h3 class="text-lg font-bold text-gray-800" id="calendarMonthTitle">2026년 2월</h3>
                <button id="nextMonth" class="p-2 text-gray-400 hover:text-purple-600 hover:bg-purple-50 rounded-lg transition-colors">&rarr;</button>
            </div>

            <div class="grid grid-cols-7 gap-1 text-center mb-2">
                <div class="text-xs font-bold text-red-500 py-2">일</div>
                <div class="text-xs font-bold text-gray-500 py-2">월</div>
                <div class="text-xs font-bold text-gray-500 py-2">화</div>
                <div class="text-xs font-bold text-gray-500 py-2">수</div>
                <div class="text-xs font-bold text-gray-500 py-2">목</div>
                <div class="text-xs font-bold text-gray-500 py-2">금</div>
                <div class="text-xs font-bold text-blue-500 py-2">토</div>
            </div>
            
            <div id="calendarDays" class="grid grid-cols-7 gap-1 text-center">
                <!-- Days will be generated here by JS -->
            </div>
        </section>

    </main>

    <!-- Firebase & Application Logic -->

                { concept: "메모리 누수 방지 (Inline vs Noinline)", description: "인라인 함수 파라미터 중 일부 람다를 인라인 처리하지 않아야 할 때 noinline을 써서 클로저 캡처 오버헤드를 조절합니다.", algoSource: "백준", algoLevel: "플래티넘 III", algoTitle: "1006번: 습격자 초라기", algoLink: "https://www.acmicpc.net/problem/1006" },
                { concept: "동시성: Mutex와 Semaphore", description: "코루틴 환경에서 공유 자원에 대한 스레드 안전성을 확보하기 위해 사용되는 락 메커니즘입니다.", algoSource: "백준", algoLevel: "플래티넘 V", algoTitle: "16566번: 카드 게임", algoLink: "https://www.acmicpc.net/problem/16566" },
                { concept: "코루틴: ThreadLocal 데이터 관리", 기재: true, description: "asContextElement()를 사용하여 자바의 ThreadLocal 데이터를 코루틴 컨텍스트를 넘나들며 안전하게 유지합니다.", algoSource: "프로그래머스", algoLevel: "Lv. 4", algoTitle: "호텔 방 배정", algoLink: "https://school.programmers.co.kr/learn/courses/30/lessons/64063" },
                { concept: "컴파일러 플러그인 (KSP)", description: "어노테이션 프로세서(KAPT)를 대체하는 코틀린 심볼 프로세싱 API로, 빌드 속도를 획기적으로 단축시킵니다.", algoSource: "백준", algoLevel: "플래티넘 V", algoTitle: "1708번: 볼록 껍질", algoLink: "https://www.acmicpc.net/problem/1708" }
            ]
        };

        // 배열 데이터를 반복시켜 순환 주기를 31일 이상으로 강제 보장 (데이터 부족 대비 패딩)
        ['beginner', 'intermediate', 'advanced', 'expert'].forEach(level => {
            const original = [...tasksData[level]];
            while(tasksData[level].length < 31) {
                tasksData[level].push(...original);
            }
        });

        // ==========================================
        // 2. 상태 관리 (State)
        // ==========================================
        let currentUser = null;
        let completedDates = []; 
        
        let currentDate = new Date(); 
        let selectedDate = new Date(); 
        const todayStr = toDateString(new Date());

        let currentDifficulty = 'beginner';

        // ==========================================
        // 3. Firebase 초기화 및 연동
        // ==========================================
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-kotlin-app';

        let unsubscribeSnapshot = null;

        async function initApp() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    currentUser = user;
                    if (user) {
                        listenToProgress();
                    } else {
                        document.getElementById('loadingOverlay').classList.add('hidden');
                    }
                });
            } catch (error) {
                console.error("Firebase init error:", error);
                document.getElementById('loadingOverlay').classList.add('hidden');
                document.getElementById('mainContent').classList.remove('hidden');
                updateUI();
            }
        }

        function listenToProgress() {
            if (!currentUser) return;
            
            if (unsubscribeSnapshot) unsubscribeSnapshot();

            const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'progress', 'tracker');
            
            unsubscribeSnapshot = onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    completedDates = docSnap.data().completedDates || [];
                } else {
                    completedDates = [];
                }
                
                document.getElementById('loadingOverlay').classList.add('hidden');
                document.getElementById('mainContent').classList.remove('hidden');
                
                updateUI();
            }, (error) => {
                console.error("Firestore onSnapshot error:", error);
            });
        }

        // ==========================================
        // 4. 이벤트 핸들러 및 액션
        // ==========================================
        document.getElementById('prevMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            updateUI();
        });

        document.getElementById('nextMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            updateUI();
        });

        document.querySelectorAll('.diff-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.diff-btn').forEach(b => {
                    b.classList.remove('bg-purple-600', 'text-white', 'shadow-md');
                    b.classList.add('bg-white', 'text-gray-500');
                });
                e.target.classList.remove('bg-white', 'text-gray-500');
                e.target.classList.add('bg-purple-600', 'text-white', 'shadow-md');
                
                currentDifficulty = e.target.getAttribute('data-level');
                updateUI();
            });
        });

        document.getElementById('toggleCompleteBtn').addEventListener('click', async () => {
            if (!currentUser) return;
            
            const btn = document.getElementById('toggleCompleteBtn');
            btn.disabled = true;
            btn.innerHTML = "처리 중...";

            const selectedStr = toDateString(selectedDate);
            const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'progress', 'tracker');
            
            let newDates = [...completedDates];
            if (newDates.includes(selectedStr)) {
                newDates = newDates.filter(d => d !== selectedStr);
            } else {
                newDates.push(selectedStr);
            }

            try {
                await setDoc(docRef, { completedDates: newDates }, { merge: true });
            } catch (error) {
                console.error("Error updating progress:", error);
            } finally {
                btn.disabled = false;
            }
        });

        // ==========================================
        // 5. UI 렌더링 함수
        // ==========================================
        function updateUI() {
            renderMission();
            renderCalendar();
        }

        function renderMission() {
            const selectedStr = toDateString(selectedDate);
            const isCompleted = completedDates.includes(selectedStr);
            
            const currentTasks = tasksData[currentDifficulty];
            
            const epoch = new Date(1970, 0, 1);
            const daysSinceEpoch = Math.floor((selectedDate - epoch) / (1000 * 60 * 60 * 24));
            const taskIndex = Math.abs(daysSinceEpoch) % currentTasks.length;
            const task = currentTasks[taskIndex];

            const isToday = selectedStr === todayStr;
            document.getElementById('missionDateTitle').textContent = isToday ? "오늘의 미션" : `${selectedDate.getMonth() + 1}월 ${selectedDate.getDate()}일 미션`;
            
            document.getElementById('conceptTitle').textContent = task.concept;
            document.getElementById('conceptDesc').textContent = task.description;
            
            document.getElementById('algoSource').textContent = task.algoSource;
            document.getElementById('algoLevel').textContent = task.algoLevel;
            document.getElementById('algoTitle').textContent = task.algoTitle;
            document.getElementById('algoLink').href = task.algoLink;

            const btn = document.getElementById('toggleCompleteBtn');
            const badge = document.getElementById('completionBadge');
            
            if (isCompleted) {
                badge.classList.remove('hidden');
                btn.innerHTML = "학습 취소하기";
                btn.className = "w-full py-4 rounded-xl text-gray-600 font-bold text-lg bg-gray-200 hover:bg-gray-300 transition-all shadow-sm";
            } else {
                badge.classList.add('hidden');
                btn.innerHTML = isToday ? "오늘의 학습 완료하기" : "이 날짜 학습 완료하기";
                btn.className = "w-full py-4 rounded-xl text-white font-bold text-lg bg-kotlin hover-bg-kotlin transition-all shadow-md transform hover:-translate-y-0.5";
            }
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            document.getElementById('calendarMonthTitle').textContent = `${year}년 ${month + 1}월`;
            
            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();
            
            const calendarDays = document.getElementById('calendarDays');
            calendarDays.innerHTML = '';
            
            let daysCompletedInMonth = 0;

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'p-2';
                calendarDays.appendChild(emptyDiv);
            }
            
            for (let i = 1; i <= lastDate; i++) {
                const dayDate = new Date(year, month, i);
                const dayStr = toDateString(dayDate);
                const isCompleted = completedDates.includes(dayStr);
                const isSelected = toDateString(selectedDate) === dayStr;
                const isToday = todayStr === dayStr;

                if (isCompleted) daysCompletedInMonth++;

                const dayBtn = document.createElement('button');
                
                let btnClasses = "w-8 h-8 mx-auto flex flex-col items-center justify-center rounded-full text-sm font-medium transition-all duration-200 relative ";
                
                if (isCompleted) {
                    btnClasses += "bg-purple-100 text-purple-700 font-bold ";
                } else {
                    btnClasses += "text-gray-600 hover:bg-gray-100 ";
                }

                if (isSelected) {
                    btnClasses += "ring-2 ring-purple-500 ring-offset-1 ";
                }

                if (isToday && !isSelected) {
                    btnClasses += "border border-purple-300 ";
                }

                dayBtn.className = btnClasses;
                dayBtn.innerHTML = `<span>${i}</span>`;
                
                if (isCompleted) {
                    dayBtn.innerHTML += `<div class="completed-dot absolute bottom-1 w-1 h-1"></div>`;
                }

                dayBtn.addEventListener('click', () => {
                    selectedDate = new Date(year, month, i);
                    updateUI();
                });

                calendarDays.appendChild(dayBtn);
            }
        }

        // ==========================================
        // 6. 유틸 함수
        // ==========================================
        function toDateString(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        initApp();
    </script>
</body>
</html>
