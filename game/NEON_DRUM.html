<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON DRUM: GLOBAL NETWORK RANKING</title>
    <script src="https://cdn.tailwindcss.com/"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Firebase SDK -->
    <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js"
      }
    }
    </script>
    <style>
        :root {
            --neon-pink: #ff007f;
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --bg-dark: #020205;
        }
        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }
        canvas { display: block; margin: 0 auto; background: #000; }
        .neon-glow-cyan { text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan); }
        
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        
        .song-card {
            width: 600px;
            padding: 20px 30px;
            margin: 10px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(0, 243, 255, 0.1);
            border-left: 6px solid var(--neon-purple);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
        }
        .song-card:hover {
            background: rgba(0, 243, 255, 0.15);
            transform: translateX(20px);
            border-left-color: var(--neon-cyan);
            box-shadow: -10px 0 30px rgba(0, 243, 255, 0.2);
        }

        #judgment {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 6rem;
            font-weight: 900;
            opacity: 0;
            pointer-events: none;
            z-index: 60;
            font-style: italic;
            transition: 0.1s;
        }

        .key-hint-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            padding: 15px;
            background: rgba(0,0,0,0.6);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .key-hint {
            width: 55px;
            height: 65px;
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            transition: 0.1s;
        }
        .key-hint b { font-size: 1.2rem; color: var(--neon-cyan); }
        .key-active { background: var(--neon-cyan); color: black; transform: translateY(10px); box-shadow: 0 0 25px var(--neon-cyan); }
        .key-active b { color: black; }

        #solo-alert {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            color: #ffd700;
            font-size: 2.5rem;
            font-weight: 900;
            display: none;
            text-shadow: 0 0 20px gold;
            z-index: 50;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.1); }
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 10px; }

        /* Ranking Dashboard Styles */
        .ranking-item {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 10px 15px;
            margin-bottom: 6px;
            background: rgba(255,255,255,0.05);
            border-radius: 5px;
            font-size: 0.9rem;
        }
        .ranking-item.highlight {
            border: 1px solid var(--neon-cyan);
            background: rgba(0, 243, 255, 0.15);
        }
        
        input {
            background: rgba(255,255,255,0.08);
            border: 2px solid var(--neon-cyan);
            padding: 12px 25px;
            color: white;
            outline: none;
            text-align: center;
            font-family: 'Orbitron';
            font-weight: bold;
            width: 300px;
        }
        
        button.neon-btn {
            background: transparent;
            border: 2px solid var(--neon-pink);
            color: var(--neon-pink);
            padding: 12px 40px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        button.neon-btn:hover {
            background: var(--neon-pink);
            color: black;
            box-shadow: 0 0 25px var(--neon-pink);
        }
        button.neon-btn:disabled {
            border-color: #555;
            color: #555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <!-- Game UI -->
    <div id="game-ui" class="fixed top-8 left-8 z-10">
        <h1 class="text-4xl font-black italic neon-glow-cyan tracking-tighter">NEON DRUM</h1>
        <div id="network-status" class="text-pink-500 text-xs font-bold mt-1 tracking-widest uppercase italic">Network Offline</div>

        <div class="mt-14">
            <div class="text-[0.6rem] text-gray-500 tracking-widest uppercase">Combo Streak</div>
            <div id="combo-text" class="text-7xl font-black italic">0</div>
        </div>
        <div class="mt-4">
            <div class="text-[0.6rem] text-gray-400 tracking-widest uppercase">Score</div>
            <div id="score-text" class="text-3xl font-bold text-yellow-300">0</div>
        </div>
    </div>

    <div id="judgment">PERFECT</div>
    <div id="solo-alert">FREE SOLO FINALE: GO WILD!</div>

    <!-- Main Menu -->
    <div id="menu" class="overlay">
        <div class="text-center mb-10">
            <h2 class="text-8xl font-black italic text-white mb-2 tracking-tighter">EVOLUTION</h2>
            <p class="text-xs text-cyan-400 tracking-[1em] font-bold uppercase">Networked Global Sessions</p>
        </div>
        <div id="song-list" class="max-h-[55vh] overflow-y-auto px-10 custom-scrollbar"></div>
    </div>

    <!-- Result & Ranking Modal -->
    <div id="result-overlay" class="overlay hidden">
        <h2 class="text-7xl font-black italic text-white mb-4">FINISH</h2>
        <div id="final-stats" class="text-center mb-10">
            <p id="result-song-name" class="text-magenta-500 text-sm tracking-widest font-bold mb-2 uppercase"></p>
            <p class="text-cyan-400 text-lg tracking-widest">FINAL SCORE</p>
            <p id="final-score" class="text-7xl font-black text-yellow-300">0</p>
        </div>
        
        <div id="nickname-input-area" class="flex flex-col items-center">
            <p class="text-xs text-gray-400 mb-3 uppercase tracking-widest">Enter Your Global Tag</p>
            <input type="text" id="player-nickname" maxlength="12" placeholder="DRUMMER_01" class="mb-6">
            <button id="submit-btn" onclick="submitScore()" class="neon-btn">Transmit Record</button>
        </div>

        <div id="ranking-dashboard" class="hidden w-[550px] flex flex-col items-center mt-4">
            <h3 class="text-xl font-bold text-cyan-400 mb-4 tracking-widest uppercase">Song Top 10 Leaderboard</h3>
            <div id="ranking-list" class="w-full max-h-[320px] overflow-y-auto custom-scrollbar pr-4 mb-8">
                <!-- Ranking items injected here -->
            </div>
            <button onclick="returnToMenu()" class="neon-btn">Back to Selection</button>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <div class="key-hint-container">
        <div id="key-S" class="key-hint">CRASH1<b>S</b></div>
        <div id="key-D" class="key-hint">TOM1<b>D</b></div>
        <div id="key-F" class="key-hint">HIHAT<b>F</b></div>
        <div id="key-G" class="key-hint">SNARE<b>G</b></div>
        <div id="key-SPACE" class="key-hint" style="width: 120px;">KICK<b>SPACE</b></div>
        <div id="key-H" class="key-hint">TOM2<b>H</b></div>
        <div id="key-J" class="key-hint">RIDE<b>J</b></div>
        <div id="key-K" class="key-hint">TOM3<b>K</b></div>
        <div id="key-L" class="key-hint">CRASH2<b>L</b></div>
    </div>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "firebase/auth";
        import { getFirestore, collection, addDoc, getDocs, doc, serverTimestamp } from "firebase/firestore";

        // --- FIREBASE CONFIG ---
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'neon-drum-evolution-net';

        let user = null;

        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                document.getElementById('network-status').textContent = "Global Network Connected";
            } catch (err) {
                console.error("Auth error:", err);
                document.getElementById('network-status').textContent = "Offline Mode Active";
            }
        };

        initAuth();
        onAuthStateChanged(auth, (u) => { user = u; });

        // --- PRO SYNTH & ANALYSIS ---
        class ProSynth {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.analyser = this.ctx.createAnalyser();
                this.analyser.fftSize = 256;
                this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                this.master = this.ctx.createGain();
                this.master.gain.value = 0.5;
                this.master.connect(this.analyser);
                this.analyser.connect(this.ctx.destination);
                this.nextBeat = 0;
                this.beatIdx = 0;
                this.isPlaying = false;
                this.config = null;
            }
            async resume() { if (this.ctx.state === 'suspended') await this.ctx.resume(); }
            playDrum(type, time) {
                const g = this.ctx.createGain();
                const osc = this.ctx.createOscillator();
                if (type === 'kick') {
                    osc.frequency.setValueAtTime(50, time);
                    osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.4);
                    g.gain.setValueAtTime(1.5, time);
                    g.gain.exponentialRampToValueAtTime(0.01, time + 0.4);
                } else if (type === 'snare') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(160, time);
                    g.gain.setValueAtTime(0.8, time);
                    g.gain.exponentialRampToValueAtTime(0.01, time + 0.2);
                    this.playNoise(time, 0.1, 0.4, 1000);
                } else if (type === 'hihat') {
                    this.playNoise(time, 0.05, 0.2, 8000); return;
                } else if (type.includes('tom')) {
                    const freqs = { tom1: 140, tom2: 110, tom3: 80 };
                    osc.frequency.setValueAtTime(freqs[type], time);
                    osc.frequency.exponentialRampToValueAtTime(20, time + 0.3);
                    g.gain.setValueAtTime(1.0, time);
                    g.gain.exponentialRampToValueAtTime(0.01, time + 0.3);
                } else if (type.includes('crash')) {
                    this.playNoise(time, 0.8, 0.3, 4000); return;
                } else if (type === 'ride') {
                    this.playNoise(time, 0.4, 0.2, 6000); return;
                }
                osc.connect(g); g.connect(this.master);
                osc.start(time); osc.stop(time + 0.5);
            }
            playNoise(time, duration, vol, f) {
                const bSize = this.ctx.sampleRate * duration;
                const buffer = this.ctx.createBuffer(1, bSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bSize; i++) data[i] = Math.random() * 2 - 1;
                const src = this.ctx.createBufferSource();
                src.buffer = buffer;
                const g = this.ctx.createGain();
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'highpass'; filter.frequency.value = f;
                g.gain.setValueAtTime(vol, time);
                g.gain.exponentialRampToValueAtTime(0.01, time + duration);
                src.connect(filter); filter.connect(g); g.connect(this.master);
                src.start(time); src.stop(time + duration);
            }
            schedule(bpm) {
                if(!this.isPlaying) return;
                const spb = 60/bpm;
                while(this.nextBeat < this.ctx.currentTime + 0.1) {
                    const b = this.beatIdx % 8;
                    if (this.config.genre === 'Jazz') {
                        if (b % 4 === 0) this.playDrum('kick', this.nextBeat);
                        if (b % 2 === 0) this.playDrum('ride', this.nextBeat);
                    } else if (this.config.genre === 'Hip-hop') {
                        if (b % 8 === 0 || b % 8 === 3) this.playDrum('kick', this.nextBeat);
                        if (b % 8 === 4) this.playDrum('snare', this.nextBeat);
                    } else if (this.config.genre === 'EDM') {
                        if (b % 2 === 0) this.playDrum('kick', this.nextBeat);
                        this.playDrum('hihat', this.nextBeat);
                    } else {
                        if (b % 4 === 0) this.playDrum('kick', this.nextBeat);
                        if (b % 4 === 2) this.playDrum('snare', this.nextBeat);
                    }
                    this.playMelody(this.nextBeat, b);
                    this.nextBeat += spb / 2;
                    this.beatIdx++;
                }
            }
            playMelody(time, beat) {
                const osc = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                osc.type = 'sawtooth';
                const notes = this.config.genre === 'EDM' ? [130, 155, 174, 196] : [220, 246, 261, 293];
                osc.frequency.setValueAtTime(notes[beat % 4], time);
                g.gain.setValueAtTime(0.08, time);
                g.gain.exponentialRampToValueAtTime(0.01, time + 0.15);
                osc.connect(g); g.connect(this.master);
                osc.start(time); osc.stop(time + 0.2);
            }
        }

        // --- GAME CORE ---
        const synth = new ProSynth();
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const soloAlert = document.getElementById('solo-alert');
        const resultOverlay = document.getElementById('result-overlay');
        const nicknameArea = document.getElementById('nickname-input-area');
        const dashboardArea = document.getElementById('ranking-dashboard');

        const songList = [
            { title: "Electric Pulse", genre: "Pop", bpm: 120, lane: 4 },
            { title: "Neon Jazz", genre: "Jazz", bpm: 140, lane: 6 },
            { title: "Binary Rave", genre: "EDM", bpm: 135, lane: 4 },
            { title: "Lowfi Rebel", genre: "Hip-hop", bpm: 90, lane: 3 },
            { title: "Riff Overdrive", genre: "Rock", bpm: 155, lane: 4 }
        ];

        const LANES = 9;
        const KEY_MAP = { 's':0, 'd':1, 'f':2, 'g':3, ' ':4, 'h':5, 'j':6, 'k':7, 'l':8 };
        const LANE_TO_DRUM = ['crash1', 'tom1', 'hihat', 'snare', 'kick', 'tom2', 'ride', 'tom3', 'crash2'];

        let state = 'MENU';
        let score = 0, combo = 0, notes = [], activeKeys = {}, sparkles = [];
        let currentSong = null;
        let speed = 9, lastT = 0, isSolo = false, soloCompleted = false;
        let width, height, laneW, judgeY;

        window.resize = () => {
            width = Math.min(window.innerWidth, 1200);
            height = window.innerHeight;
            canvas.width = width; canvas.height = height;
            laneW = width / LANES; judgeY = height - 160;
        };

        const init = () => {
            resize();
            window.addEventListener('resize', resize);
            const listEl = document.getElementById('song-list');
            songList.forEach(s => {
                const card = document.createElement('div');
                card.className = 'song-card';
                card.innerHTML = `
                    <div class="text-left">
                        <div class="font-black text-3xl italic tracking-tighter uppercase">${s.title}</div>
                        <span class="text-[0.6rem] text-cyan-400 font-bold uppercase tracking-widest">${s.genre} / ${s.bpm} BPM</span>
                    </div>
                    <div class="text-xs font-black text-magenta-500 border-2 border-magenta-500 px-5 py-2 rounded">ENGAGE</div>
                `;
                card.onclick = () => start(s);
                listEl.appendChild(card);
            });
            requestAnimationFrame(loop);
        };

        const start = async (s) => {
            await synth.resume();
            currentSong = s;
            synth.config = s;
            synth.isPlaying = true;
            synth.nextBeat = synth.ctx.currentTime;
            synth.beatIdx = 0;
            notes = []; score = 0; combo = 0; sparkles = [];
            isSolo = false; soloCompleted = false;
            speed = 8 + (s.bpm / 18);
            document.getElementById('menu').style.display = 'none';
            resultOverlay.classList.add('hidden');
            state = 'PLAYING';
            generateNotes(s);
            updateUI();
        };

        const generateNotes = (s) => {
            const step = 60000 / s.bpm;
            for(let t = 3000; t < 40000; t += step) {
                notes.push({ l: s.lane, y: -t * (speed/16.6), h: false });
                if(Math.random() < 0.4) notes.push({ l: Math.floor(Math.random()*LANES), y: -t * (speed/16.6), h: false });
            }
        };

        const loop = (t) => {
            ctx.clearRect(0,0,width,height);
            if(state === 'PLAYING') {
                synth.schedule(currentSong.bpm);
                drawVisualizer();
                drawStage();
                updateNotes();
                drawNotes();
                updateSparkles();
                checkSolo();
            }
            requestAnimationFrame(loop);
        };

        const drawVisualizer = () => {
            synth.analyser.getByteFrequencyData(synth.dataArray);
            const barW = width / synth.dataArray.length;
            ctx.fillStyle = 'rgba(0, 243, 255, 0.05)';
            for(let i=0; i<synth.dataArray.length; i++) {
                const h = (synth.dataArray[i] / 255) * 300;
                ctx.fillRect(i * barW, height - h, barW, h);
            }
        };

        const drawStage = () => {
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            for(let i=0; i<=LANES; i++) {
                ctx.beginPath(); ctx.moveTo(i*laneW, 0); ctx.lineTo(i*laneW, height); ctx.stroke();
            }
            ctx.strokeStyle = isSolo ? 'gold' : varColor('--neon-cyan');
            ctx.lineWidth = 5;
            ctx.shadowBlur = isSolo ? 30 : 15;
            ctx.shadowColor = ctx.strokeStyle;
            ctx.beginPath(); ctx.moveTo(0, judgeY); ctx.lineTo(width, judgeY); ctx.stroke();
            ctx.shadowBlur = 0;
        };

        const checkSolo = () => {
            const soloStartBeat = 130; 
            const soloEndBeat = 180;
            if (synth.beatIdx >= soloStartBeat && synth.beatIdx < soloEndBeat) {
                if (!isSolo) { isSolo = true; soloAlert.style.display = 'block'; }
            } else if (synth.beatIdx >= soloEndBeat) {
                if (isSolo) {
                    isSolo = false; soloCompleted = true; soloAlert.style.display = 'none';
                    setTimeout(showResultScreen, 1000);
                }
            }
        };

        const updateNotes = () => {
            notes.forEach(n => {
                n.y += speed;
                if(!n.h && n.y > judgeY + 60) {
                    n.h = true; combo = 0; updateUI(); showJudge('MISS', '#ff0000');
                }
            });
            notes = notes.filter(n => !n.h || n.y < judgeY + 100);
        };

        const drawNotes = () => {
            notes.forEach(n => {
                if(n.h) return;
                const colors = ['#bc13fe', '#ff007f', '#00f3ff', '#fff200', '#39ff14'];
                ctx.fillStyle = colors[n.l % colors.length];
                ctx.shadowBlur = 15; ctx.shadowColor = ctx.fillStyle;
                ctx.beginPath(); ctx.roundRect(n.l*laneW+10, n.y-12, laneW-20, 24, 6); ctx.fill();
                ctx.shadowBlur = 0;
            });
        };

        const createSparkle = (lane, color) => {
            const centerX = lane * laneW + laneW / 2;
            for (let i = 0; i < 12; i++) {
                sparkles.push({
                    x: centerX, y: judgeY,
                    vx: (Math.random() - 0.5) * 15, vy: (Math.random() - 0.5) * 15,
                    alpha: 1, color: color, size: Math.random() * 4 + 2
                });
            }
        };

        const updateSparkles = () => {
            ctx.save();
            sparkles.forEach((s, idx) => {
                s.x += s.vx; s.y += s.vy; s.alpha -= 0.04;
                if (s.alpha <= 0) { sparkles.splice(idx, 1); return; }
                ctx.globalAlpha = s.alpha;
                ctx.shadowBlur = 10; ctx.shadowColor = s.color; ctx.fillStyle = s.color;
                ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
            });
            ctx.restore();
        };

        const showJudge = (txt, col) => {
            const j = document.getElementById('judgment');
            j.textContent = txt; j.style.color = col; j.style.opacity = 1;
            j.style.textShadow = `0 0 30px ${col}`;
            setTimeout(() => j.style.opacity = 0, 250);
        };

        const updateUI = () => {
            document.getElementById('score-text').textContent = score.toLocaleString();
            document.getElementById('combo-text').textContent = combo;
        };

        // --- GLOBAL NETWORK RANKING LOGIC ---
        const showResultScreen = () => {
            state = 'RESULT';
            synth.isPlaying = false;
            document.getElementById('final-score').textContent = score.toLocaleString();
            document.getElementById('result-song-name').textContent = currentSong.title;
            resultOverlay.classList.remove('hidden');
            nicknameArea.classList.remove('hidden');
            dashboardArea.classList.add('hidden');
        };

        window.submitScore = async () => {
            const nickname = document.getElementById('player-nickname').value.trim() || "GUEST_DRUMMER";
            const submitBtn = document.getElementById('submit-btn');
            if (!user) {
                alert("Network connecting... Please wait.");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Transmitting...";

            try {
                // RULE 1: Use strict public path
                const leaderboardCol = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
                await addDoc(leaderboardCol, {
                    name: nickname,
                    score: score,
                    songTitle: currentSong.title,
                    timestamp: serverTimestamp()
                });
                
                nicknameArea.classList.add('hidden');
                dashboardArea.classList.remove('hidden');
                loadLeaderboard();
            } catch (err) {
                console.error("Transmission error:", err);
                alert("Signal lost. Check connection and retry.");
                submitBtn.disabled = false;
                submitBtn.textContent = "Transmit Record";
            }
        };

        const loadLeaderboard = async () => {
            const listEl = document.getElementById('ranking-list');
            listEl.innerHTML = '<p class="text-center text-gray-500 italic py-4">Downloading Global Data...</p>';
            
            try {
                // RULE 1: Fetch from public collection
                const leaderboardCol = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
                const snapshot = await getDocs(leaderboardCol);
                
                let allScores = [];
                snapshot.forEach(doc => allScores.push(doc.data()));
                
                // RULE 2: Filter for THIS SONG only in memory
                const songSpecificScores = allScores.filter(item => item.songTitle === currentSong.title);
                
                // Sort by score (Highest first)
                songSpecificScores.sort((a, b) => b.score - a.score);
                
                listEl.innerHTML = '';
                if (songSpecificScores.length === 0) {
                    listEl.innerHTML = '<p class="text-center text-gray-500 py-4">No records for this track yet.</p>';
                } else {
                    songSpecificScores.slice(0, 10).forEach((item, idx) => {
                        const div = document.createElement('div');
                        div.className = `ranking-item ${idx === 0 ? 'highlight' : ''}`;
                        div.innerHTML = `
                            <span class="font-bold">${idx + 1}. ${item.name}</span>
                            <span class="text-yellow-400 font-black">${item.score.toLocaleString()}</span>
                        `;
                        listEl.appendChild(div);
                    });
                }
            } catch (err) {
                console.error("Sync error:", err);
                listEl.innerHTML = '<p class="text-center text-red-500 py-4">Database link failed.</p>';
            }
        };

        window.returnToMenu = () => {
            resultOverlay.classList.add('hidden');
            document.getElementById('menu').style.display = 'flex';
            state = 'MENU';
            document.getElementById('submit-btn').disabled = false;
            document.getElementById('submit-btn').textContent = "Transmit Record";
        };

        window.exitGame = () => {
            synth.isPlaying = false;
            state = 'MENU';
            document.getElementById('menu').style.display = 'flex';
            resultOverlay.classList.add('hidden');
            soloAlert.style.display = 'none';
        };

        // --- KEYBOARD HANDLING ---
        window.addEventListener('keydown', e => {
            const key = e.key.toLowerCase();
            const lane = KEY_MAP[key === ' ' ? ' ' : key];
            if(lane !== undefined && !activeKeys[lane]) {
                activeKeys[lane] = true;
                const keyEl = document.getElementById('key-'+(key===' '?'SPACE':key.toUpperCase()));
                if(keyEl) keyEl.classList.add('key-active');
                
                synth.playDrum(LANE_TO_DRUM[lane], synth.ctx.currentTime);
                if(state === 'PLAYING') {
                    if(isSolo) {
                        // ADJUSTED SOLO SCORE: 10 points per hit for better balance
                        score += 10; updateUI();
                        showJudge('SOLO BONUS', 'gold');
                        createSparkle(lane, 'gold');
                    } else checkHit(lane);
                }
            }
        });

        window.addEventListener('keyup', e => {
            const key = e.key.toLowerCase();
            const lane = KEY_MAP[key === ' ' ? ' ' : key];
            if(lane !== undefined) {
                activeKeys[lane] = false;
                const keyEl = document.getElementById('key-'+(key===' '?'SPACE':key.toUpperCase()));
                if(keyEl) keyEl.classList.remove('key-active');
            }
        });

        const checkHit = (lane) => {
            const hitColor = ['#bc13fe', '#ff007f', '#00f3ff', '#fff200', '#39ff14'][lane % 5];
            for(let n of notes) {
                if(!n.h && n.l === lane) {
                    const d = Math.abs(n.y - judgeY);
                    if(d < 65) {
                        n.h = true;
                        createSparkle(lane, hitColor);
                        if(d < 25) { 
                            score += 300 + (combo*10); combo++; 
                            showJudge('PERFECT', '#00f3ff'); 
                        } else { 
                            score += 100; combo++; 
                            showJudge('GREAT', '#ff007f'); 
                        }
                        updateUI(); return;
                    }
                }
            }
        };

        const varColor = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
        window.onload = init;
    </script>
</body>
</html>
