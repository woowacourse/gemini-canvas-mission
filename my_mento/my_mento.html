<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS 마스터 퀴즈</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/variable/pretendardvariable.css" />
    <style>
        :root {
            --toss-blue: #3182f6;
            --toss-blue-hover: #1b64da;
            --toss-gray-bg: #f9fafb;
            --toss-gray-100: #f2f4f6;
            --toss-gray-200: #e5e8eb;
            --toss-gray-300: #d1d6db;
            --toss-gray-400: #b0b8c1;
            --toss-gray-500: #8b95a1;
            --toss-gray-600: #6b7684;
            --toss-gray-700: #4e5968;
            --toss-gray-800: #333d4b;
        }

        body {
            font-family: 'Pretendard Variable', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            background-color: #ffffff;
            color: var(--toss-gray-800);
            -webkit-font-smoothing: antialiased;
        }

        .btn-primary {
            background-color: var(--toss-blue);
            color: white;
            transition: background-color 0.2s ease;
        }
        .btn-primary:hover {
            background-color: var(--toss-blue-hover);
        }
        
        .btn-secondary {
            background-color: var(--toss-gray-100);
            color: var(--toss-gray-700);
            transition: background-color 0.2s ease;
        }
        .btn-secondary:hover {
            background-color: var(--toss-gray-200);
        }

        .chip {
            background-color: #ffffff;
            border: 1px solid var(--toss-gray-200);
            color: var(--toss-gray-700);
            transition: all 0.2s ease;
        }
        .chip.selected {
            background-color: var(--toss-blue);
            border-color: var(--toss-blue);
            color: white;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            70% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        
        .feedback-icon {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            display: none;
            pointer-events: none; 
        }
        
        .spinner {
            border: 4px solid var(--toss-gray-100);
            border-left-color: var(--toss-blue);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--toss-gray-300); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--toss-gray-400); }

        /* --- Chatbot Styles (Updated to Toss UI) --- */
        #chatbot-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        #chatbot-btn {
            width: 60px;
            height: 60px;
            background-color: var(--toss-blue);
            border-radius: 20px;
            box-shadow: 0 4px 12px rgba(49, 130, 246, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s;
        }
        #chatbot-btn:hover {
            transform: scale(1.05);
            background-color: var(--toss-blue-hover);
        }

        #chatbot-window {
            width: calc(100vw / 3);
            height: calc(100vh / 2);
            min-width: 320px;
            min-height: 400px;
            max-width: 420px;
            max-height: 600px;
            background-color: var(--toss-gray-bg); /* Toss 배경색으로 변경 */
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
            display: none;
            flex-direction: column;
            overflow: hidden;
            margin-bottom: 16px;
            border: 1px solid var(--toss-gray-200);
            transform-origin: bottom right;
            animation: scaleUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes scaleUp {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .chat-header {
            background-color: white;
            padding: 16px 20px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--toss-gray-100);
        }

        #chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-bubble {
            max-width: 85%;
            padding: 12px 16px;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
            border-radius: 18px;
        }

        .bubble-ai {
            align-self: flex-start;
            background-color: white;
            color: var(--toss-gray-800);
            border: 1px solid var(--toss-gray-200);
            border-bottom-left-radius: 4px;
        }

        .bubble-user {
            align-self: flex-end;
            background-color: var(--toss-blue);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .chat-input-wrapper {
            background-color: white;
            padding: 12px 16px;
            display: flex;
            gap: 8px;
            align-items: center;
            border-top: 1px solid var(--toss-gray-100);
        }

        #chat-input {
            flex: 1;
            background-color: var(--toss-gray-100);
            border: none;
            padding: 10px 16px;
            border-radius: 12px;
            outline: none;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        #chat-input:focus {
            background-color: var(--toss-gray-200);
        }

        .chat-send-btn {
            color: var(--toss-blue);
            font-weight: 700;
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .chat-send-btn:hover {
            background-color: var(--toss-gray-100);
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 2px;
        }
        .typing-indicator span {
            width: 6px;
            height: 6px;
            background-color: var(--toss-gray-400);
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* --- Tutorial Overlay --- */
        #tutorial-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.65);
            z-index: 2000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            backdrop-filter: blur(4px);
        }

        .tutorial-step {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 400px;
            padding: 20px;
        }
        .tutorial-step.active {
            display: flex;
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tutorial-arrow {
            width: 60px;
            height: 60px;
            margin-bottom: 24px;
            animation: bounce 1.5s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        
        .tutorial-highlight {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 68px;
            height: 68px;
            border: 4px dashed white;
            border-radius: 24px;
            animation: spin-slow 10s linear infinite;
            pointer-events: none;
        }
        @keyframes spin-slow { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex justify-center pb-20 pt-10 px-4">

    <!-- Main Container -->
    <div id="app" class="w-full max-w-2xl bg-white">
        <!-- JS injects content here -->
    </div>

    <!-- Chatbot Container -->
    <div id="chatbot-container">
        <!-- Chat Window -->
        <div id="chatbot-window">
            <div class="chat-header">
                <div class="flex items-center gap-2">
                    <!-- Emoji removed as requested -->
                    <div>
                        <div class="text-[var(--toss-gray-800)] text-sm font-bold">시니어 개발자 멘토</div>
                        <div class="text-[var(--toss-gray-500)] text-[11px] font-normal">소크라테스 챗봇</div>
                    </div>
                </div>
                <button onclick="toggleChatbot()" class="text-[var(--toss-gray-500)] hover:text-[var(--toss-gray-800)] transition-colors">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div id="chat-messages">
                <!-- Messages will be injected here -->
            </div>
            <div class="chat-input-wrapper">
                <input type="text" id="chat-input" placeholder="막히는 부분이 있다면 물어보세요..." onkeypress="if(event.key === 'Enter') sendChatMessage()">
                <button onclick="sendChatMessage()" class="chat-send-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>

        <!-- Chatbot Button -->
        <div id="chatbot-btn" onclick="handleChatbotClick()">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"></rect><circle cx="12" cy="5" r="2"></circle><path d="M12 7v4"></path><line x1="8" y1="16" x2="8" y2="16"></line><line x1="16" y1="16" x2="16" y2="16"></line></svg>
        </div>
    </div>

    <!-- Tutorial Overlay -->
    <div id="tutorial-overlay">
        <div class="tutorial-highlight"></div>
        <div id="tut-step-1" class="tutorial-step active">
            <svg class="tutorial-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
            <h3 class="text-2xl font-bold mb-4">학습 중 길을 잃으셨나요?</h3>
            <p class="text-lg text-gray-200 mb-8">우측 하단의 로봇 아이콘을 눌러<br>시니어 개발자 멘토를 호출해보세요.</p>
            <button onclick="nextTutorial(2)" class="bg-[var(--toss-blue)] text-white px-8 py-3 rounded-xl font-bold hover:bg-[var(--toss-blue-hover)] transition-colors">다음</button>
        </div>
        <div id="tut-step-2" class="tutorial-step">
            <svg class="tutorial-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
            <h3 class="text-2xl font-bold mb-4">정답 대신 생각의 실마리를!</h3>
            <p class="text-lg text-gray-200 mb-8">멘토는 정답을 바로 알려주지 않아요.<br>스스로 깨달을 수 있도록 핵심 질문만 던질 거예요.</p>
            <button onclick="closeTutorial()" class="bg-[var(--toss-blue)] text-white px-8 py-3 rounded-xl font-bold hover:bg-[var(--toss-blue-hover)] transition-colors">이해했어요</button>
        </div>
    </div>

    <script>
        const apiKey = ""; 

        const categoryData = {
            "컴퓨터 구조": ["컴퓨터 기본 구조", "논리 회로", "CPU 원리", "기억 장치", "입출력(I/O)", "파이프라이닝", "병렬 컴퓨터 구조"],
            "데이터베이스": ["데이터베이스 기본", "모델링과 모델", "관계형 데이터베이스(RDB)", "SQL", "설계(정규화 등)", "트랜잭션 관리"],
            "운영체제": ["운영체제 기본", "운영체제 구조(시스템 콜)", "프로세스(IPC, 스케줄링)", "스레드", "CPU 스케줄링", "동기화", "교착 상태", "메인 메모리 관리", "가상 메모리", "저장 장치", "파일 시스템", "입출력 시스템"],
            "네트워크": ["네트워크 기본", "네트워크 모델", "물리 계층 & 데이터 링크 계층", "네트워크 계층", "전송 계층", "응용 계층", "네트워크 보안"],
            "자료구조": ["자료구조 기본", "배열", "리스트", "스택", "큐", "덱", "해시 테이블", "트리", "그래프", "힙"],
            "알고리즘": ["스택 & 큐 & 덱", "해시 테이블", "그래프 & 트리", "힙", "트라이", "복잡도 분석", "정렬", "탐색", "재귀", "브루트 포스", "그리디", "분할 정복", "동적 계획법", "그래프 탐색", "최단 경로", "최소 신장 트리(MST)", "백트래킹", "수학 알고리즘", "문자열", "비트 마스킹", "투 포인터", "슬라이딩 윈도우"],
            "프로그래밍 언어": ["자바(Java)", "파이썬(Python)", "C 언어", "C++", "코틀린(Kotlin)", "자바스크립트(JS)", "타입스크립트(TS)", "다트(Dart)", "Go 언어", "명령형 언어", "선언형 언어", "멀티 패러다임 언어"],
            "소프트웨어 공학": ["소프트웨어 기본(생명 주기)", "요구사항 분석", "요구사항 설계", "테스팅", "유지보수", "애자일(Agile)", "워터폴", "프로토타입", "소프트웨어 설계", "버전 관리"],
            "인공지능": ["인공지능 기본", "인공지능 수학", "지도 학습", "비지도 학습", "강화 학습", "데이터 전처리", "인공 신경망", "심층 신경망", "합성곱 신경망(CNN)", "순환 신경망(RNN)", "생성형 AI", "컴퓨터 비전", "자연어 처리", "음성 인식", "로보틱스"],
            "컴파일러": ["컴파일러 기본", "어휘 분석", "구문 분석", "의미 분석", "중간 코드 생성", "코드 최적화", "목적 코드 생성", "오류 처리"],
            "분산 시스템": ["분산 시스템 기본", "병렬 처리 기술 및 알고리즘", "시스템 핵심 요소 및 기술", "카프카(Kafka)", "하둡(Hadoop)", "스파크(Spark)", "최적화 및 성능 평가"],
            "그래픽스": ["그래픽스 기본", "도형 레스터화", "2D/3D 기하 변환", "3차원 뷰잉 파이프라인", "모델링", "렌더링", "텍스처 매핑", "애니메이션 & 시뮬레이션"],
            "보안": ["시스템 보안", "네트워크 보안", "애플리케이션 보안", "암호학"],
            "디자인 패턴": ["생성 패턴(Singleton, Factory 등)", "구조 패턴(Adapter, Decorator 등)", "행동 패턴(Observer, Strategy 등)"],
            "백엔드": ["Node.js", "Spring 프레임워크", "Spring Boot", "인증 및 보안", "Cloud & DevOps", "MSA", "Serverless", "모니터링", "캐싱 전략", "데이터베이스 최적화", "레디스(Redis)", "카프카", "쿠버네티스(k8s)", "도커(Docker)"],
            "프론트엔드": ["웹 기초", "DOM 조작", "React", "Vue.js", "Next.js", "상태 관리", "타입스크립트"],
            "안드로이드": ["시스템 아키텍처", "UI 디자인", "아키텍처 패턴", "데이터 관리", "네트워크 통신", "애플리케이션 배포"]
        };

        // Application State
        let state = {
            screen: 'setup', 
            selectedMains: new Set(),
            selectedSubs: new Set(),
            difficulty: 3,
            questionCount: 10,
            extraText: "",
            questions: [],
            currentQIdx: 0,
            score: 0,
            feedbackState: null, 
            userAnswer: null,
            isGrading: false,
            // Chatbot state
            isTutorialCompleted: false,
            chatHistory: []
        };

        const appDiv = document.getElementById('app');

        function render() {
            // 화면 깜빡임 방지를 위해 content 단위로 업데이트
            switch(state.screen) {
                case 'setup': renderSetup(); break;
                case 'loading': renderLoading(); break;
                case 'quiz': renderQuiz(); break;
                case 'result': renderResult(); break;
            }
        }

        function renderSetup() {
            let html = `
                <div class="space-y-8 animate-[fadeIn_0.3s_ease-out]">
                    <header class="mb-8">
                        <h1 class="text-3xl font-bold text-[var(--toss-gray-800)] mb-2">무엇을 학습할까요?</h1>
                        <p class="text-[var(--toss-gray-500)] text-lg">나에게 꼭 맞는 퀴즈로 실력을 키워보세요.</p>
                    </header>

                    <section>
                        <h2 class="text-xl font-bold mb-4">학습 주제 선택</h2>
                        <div class="flex flex-wrap gap-2">
                            ${Object.keys(categoryData).map(main => `
                                <button onclick="toggleMain('${main}')" 
                                    class="chip px-4 py-2 rounded-full text-sm font-medium ${state.selectedMains.has(main) ? 'selected' : ''}">
                                    ${main}
                                </button>
                            `).join('')}
                        </div>
                    </section>
            `;

            if (state.selectedMains.size > 0) {
                html += `
                    <section class="bg-[var(--toss-gray-bg)] p-5 rounded-2xl border border-[var(--toss-gray-100)]">
                        <h2 class="text-lg font-bold mb-4">상세 주제 선택</h2>
                `;
                state.selectedMains.forEach(main => {
                    html += `
                        <div class="mb-4 last:mb-0">
                            <h3 class="text-sm font-semibold text-[var(--toss-gray-600)] mb-2">${main}</h3>
                            <div class="flex flex-wrap gap-2">
                                ${categoryData[main].map(sub => `
                                    <button onclick="toggleSub('${main} - ${sub}')" 
                                        class="chip px-3 py-1.5 rounded-full text-sm ${state.selectedSubs.has(`${main} - ${sub}`) ? 'selected' : ''}">
                                        ${sub}
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    `;
                });
                html += `</section>`;
            }

            html += `
                    <section>

        function renderLoading() {
            appDiv.innerHTML = `
                <div class="flex flex-col items-center justify-center min-h-[60vh] space-y-6">
                    <div class="spinner"></div>
                    <div class="text-center">
                        <h2 class="text-xl font-bold mb-2">AI가 맞춤형 퀴즈를 생성 중입니다</h2>
                        <p class="text-[var(--toss-gray-500)]">요청하신 내용을 바탕으로 문제를 구성하고 있어요.</p>
                    </div>
                </div>
            `;
        }

        function renderQuiz() {
            const q = state.questions[state.currentQIdx];
            if (!q) return;
            const isAnswered = state.feedbackState !== null;
            const inputDisabled = isAnswered || state.isGrading;

            let html = `
                <div class="space-y-6 relative">
                    <div class="flex justify-between items-center text-[var(--toss-gray-500)] font-medium mb-2">
                        <span>문제 ${state.currentQIdx + 1} <span class="text-[var(--toss-gray-400)] text-sm">/ ${state.questionCount}</span></span>
                        <span class="text-sm bg-[var(--toss-gray-100)] px-3 py-1 rounded-full">${
                            q.type === 'ox' ? 'O/X' : q.type === 'mcq' ? '객관식' : '주관식'
                        }</span>
                    </div>
                    
                    <div class="w-full bg-[var(--toss-gray-100)] rounded-full h-1.5 mb-8">
                        <div class="bg-[var(--toss-blue)] h-1.5 rounded-full transition-all duration-300" style="width: ${((state.currentQIdx) / state.questionCount) * 100}%"></div>
                    </div>

                    <h2 class="text-2xl font-bold leading-snug text-[var(--toss-gray-800)] min-h-[5rem] mb-8">
                        Q. ${q.question}
                    </h2>

                    <div class="space-y-3">
            `;

            if (q.type === 'ox') {
                html += `
                    <div class="flex gap-4 h-32">
                        <button onclick="submitAnswer('O')" ${inputDisabled ? 'disabled' : ''} 
                            class="flex-1 rounded-2xl border-2 text-4xl font-bold transition-all
                            ${isAnswered && state.userAnswer === 'O' ? 'border-[var(--toss-blue)] bg-[#f0f5ff] text-[var(--toss-blue)]' : 'border-[var(--toss-gray-200)] bg-white text-[var(--toss-gray-600)] hover:border-[var(--toss-blue)] hover:text-[var(--toss-blue)] disabled:opacity-50'}">
                            O
                        </button>
                        <button onclick="submitAnswer('X')" ${inputDisabled ? 'disabled' : ''} 
                            class="flex-1 rounded-2xl border-2 text-4xl font-bold transition-all
                            ${isAnswered && state.userAnswer === 'X' ? 'border-[var(--toss-blue)] bg-[#f0f5ff] text-[var(--toss-blue)]' : 'border-[var(--toss-gray-200)] bg-white text-[var(--toss-gray-600)] hover:border-[var(--toss-blue)] hover:text-[var(--toss-blue)] disabled:opacity-50'}">
                            X
                        </button>
                    </div>
                `;
            } else if (q.type === 'mcq') {
                q.options.forEach((opt, idx) => {
                    const isSelected = state.userAnswer === opt;
                    const isCorrectOpt = q.answer === opt;
                    let btnStyle = 'border-[var(--toss-gray-200)] bg-white text-[var(--toss-gray-700)] hover:border-[var(--toss-blue)]';
                    if (isAnswered) {
                        if (state.feedbackState === 'showAnswer' && isCorrectOpt) {
                            btnStyle = 'border-[var(--toss-blue)] bg-[#f0f5ff] text-[var(--toss-blue)] ring-2 ring-[var(--toss-blue)] ring-offset-1';
                        } else if (isSelected) {
                             btnStyle = state.feedbackState === 'correct' ? 'border-[var(--toss-blue)] bg-[#f0f5ff] text-[var(--toss-blue)]' : 'border-[#ff3b30] bg-[#fff0f0] text-[#ff3b30]';
                        } else {
                            btnStyle = 'border-[var(--toss-gray-200)] bg-white text-[var(--toss-gray-400)] opacity-50';
                        }
                    }

                    html += `
                        <button onclick="submitAnswer('${opt.replace(/'/g, "\\'")}')" ${inputDisabled ? 'disabled' : ''}
                            class="w-full p-4 rounded-xl border-2 text-left font-medium transition-all ${btnStyle}">
                            <span class="text-[var(--toss-gray-400)] mr-2">${idx+1}.</span> ${opt}
                        </button>
                    `;
                });
            } else if (q.type === 'short') {
                html += `
                    <div class="flex gap-2">
                        <input type="text" id="shortAnswerInput" placeholder="정답을 입력하세요" ${inputDisabled ? 'disabled' : ''} value="${state.userAnswer || ''}"
                            class="flex-1 p-4 bg-[var(--toss-gray-bg)] border border-[var(--toss-gray-200)] rounded-xl focus:outline-none focus:border-[var(--toss-blue)] focus:ring-1 focus:ring-[var(--toss-blue)] font-medium text-lg disabled:bg-white disabled:text-[var(--toss-gray-500)]"
                            onkeypress="if(event.key === 'Enter' && !${state.isGrading}) submitShortAnswer()">
                        <button onclick="submitShortAnswer()" ${inputDisabled ? 'disabled' : ''}
                            class="btn-primary px-6 rounded-xl font-bold whitespace-nowrap disabled:opacity-50 min-w-[100px]">
                            ${state.isGrading ? '<div class="w-5 h-5 border-2 border-white border-l-transparent rounded-full animate-spin mx-auto"></div>' : '제출'}
                        </button>
                    </div>
                `;
            }

            html += `<div class="mt-8 min-h-[120px]">`;
            
            if (state.feedbackState === 'correct' || state.feedbackState === 'showAnswer') {
                html += `
                    <div class="bg-[var(--toss-gray-bg)] p-5 rounded-2xl mb-4 border border-[var(--toss-gray-200)] animate-[fadeIn_0.3s_ease-out]">
                        <p class="font-bold text-[var(--toss-blue)] mb-2">정답: ${q.answer}</p>
                        <p class="text-[var(--toss-gray-700)] text-sm leading-relaxed">${q.explanation}</p>
                    </div>
                    <button onclick="nextQuestion()" class="btn-primary w-full py-4 rounded-2xl text-lg font-bold shadow-sm animate-[fadeIn_0.3s_ease-out]">
                        ${state.currentQIdx === state.questionCount - 1 ? '결과 보기' : '다음 문제'}
                    </button>
                `;
            } else if (state.feedbackState === 'wrong') {
                html += `
                    <div class="flex gap-3 animate-[fadeIn_0.3s_ease-out]">
                        <button onclick="retryQuestion()" class="btn-secondary flex-1 py-4 rounded-2xl text-lg font-bold">
                            다시 풀기
                        </button>
                        <button onclick="showAnswer()" class="bg-[#ff3b30] hover:bg-[#d63026] text-white flex-1 py-4 rounded-2xl text-lg font-bold transition-colors shadow-sm">
                            해답 보기
                        </button>
                    </div>
                `;
            }
            html += `</div></div>`;

            html += `
                <div id="icon-o" class="feedback-icon text-[#34c759]">
                    <svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle></svg>
                </div>
                <div id="icon-x" class="feedback-icon text-[#ff3b30]">
                    <svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </div>
            `;

            appDiv.innerHTML = html;

            function handleIconFade(iconId) {
                const icon = document.getElementById(iconId);
                if (!icon) return;
                icon.style.display = 'block';
                setTimeout(() => {
                    const el = document.getElementById(iconId);
                    if (el && el.style.display === 'block') {
                        el.style.animation = 'none';
                        el.style.opacity = '1';
                        void el.offsetWidth;
                        el.style.transition = 'opacity 3s ease-out';
                        el.style.opacity = '0';
                    }
                }, 500);
            }

            if (state.feedbackState === 'correct') {
                handleIconFade('icon-o');
            } else if (state.feedbackState === 'wrong') {
                handleIconFade('icon-x');
            }
            
            if(q.type === 'short' && !isAnswered && !state.isGrading) {
                setTimeout(() => document.getElementById('shortAnswerInput')?.focus(), 50);
            }
        }

        function renderResult() {
            const isPerfect = state.score === state.questionCount;
            appDiv.innerHTML = `
                <div class="text-center py-10 animate-[fadeIn_0.5s_ease-out]">
                    <div class="text-6xl mb-6">${isPerfect ? '🎉' : '👏'}</div>
                    <h2 class="text-3xl font-bold text-[var(--toss-gray-800)] mb-4">학습을 완료했습니다!</h2>
                    <p class="text-xl text-[var(--toss-gray-600)] mb-8">
                        총 ${state.questionCount}문제 중 <span class="font-bold text-[var(--toss-blue)] text-2xl">${state.score}</span>문제를 맞혔어요.
                    </p>
                    
                    <div class="bg-[var(--toss-gray-bg)] rounded-2xl p-6 mb-10 text-left border border-[var(--toss-gray-100)]">
                        <h3 class="font-bold text-[var(--toss-gray-700)] mb-3">학습 리포트</h3>
                        <p class="text-sm text-[var(--toss-gray-600)] mb-1">• 선택한 주제: ${Array.from(state.selectedMains).join(', ')}</p>
                        <p class="text-sm text-[var(--toss-gray-600)] mb-1">• 설정 난이도: ${state.difficulty}단계</p>
                        <p class="text-sm text-[var(--toss-gray-600)]">• 추가 학습 반영: ${state.extraText ? '반영됨' : '없음'}</p>
                    </div>

                    <button onclick="resetApp()" class="btn-primary w-full py-4 rounded-2xl text-lg font-bold shadow-sm">
                        다시 시작하기
                    </button>
                </div>
            `;
        }

        function toggleMain(main) {
            if (state.selectedMains.has(main)) {
                state.selectedMains.delete(main);
                for (let sub of state.selectedSubs) {
                    if (sub.startsWith(main + " - ")) state.selectedSubs.delete(sub);
                }
            } else {
                state.selectedMains.add(main);
            }
            render();
        }

        function toggleSub(sub) {
            if (state.selectedSubs.has(sub)) state.selectedSubs.delete(sub);
            else state.selectedSubs.add(sub);
            render();
        }

        function setDifficulty(level) {
            state.difficulty = level;
            render();
        }

        function updateQuestionCount(val) {
            const newVal = state.questionCount + val;
            if (newVal >= 1 && newVal <= 20) {
                state.questionCount = newVal;
                render();
            }
        }

        function updateExtraText(text) {
            state.extraText = text;
        }

        function submitShortAnswer() {
            if (state.isGrading) return;
            const input = document.getElementById('shortAnswerInput');
            if (input && input.value.trim() !== "") {
                submitAnswer(input.value.trim());
            }
        }

        async function submitAnswer(answer) {
            if (state.feedbackState !== null || state.isGrading) return;
            
            state.userAnswer = answer;
            const q = state.questions[state.currentQIdx];
            let isCorrect = false;

            if (q.type === 'short') {
                state.isGrading = true;
                render();

                const prompt = `문제: ${q.question}\n모범 정답: ${q.answer}\n사용자 답안: ${answer}\n\n사용자 답안이 모범 정답과 의미상 일치하거나 핵심 키워드를 정확히 포함하는지 채점해주세요. 응답은 JSON: {"isCorrect": boolean}`;
                
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });
                    const result = await response.json();
                    const data = JSON.parse(result.candidates[0].content.parts[0].text);
                    isCorrect = data.isCorrect;
                } catch (error) {
                    isCorrect = answer.toLowerCase().replace(/\s/g, '').includes(q.answer.toLowerCase().replace(/\s/g, ''));
                } finally {
                    state.isGrading = false;
                }
            } else {
                isCorrect = answer === q.answer;
            }

            if (isCorrect) {
                state.feedbackState = 'correct';
                if(state.feedbackState !== 'showAnswer') state.score++;
            } else {
                state.feedbackState = 'wrong';
            }
            render();
        }

        function retryQuestion() {
            state.feedbackState = null;
            state.userAnswer = null;
            render();
        }

        function showAnswer() {
            state.feedbackState = 'showAnswer';
            render();
        }

        function nextQuestion() {
            state.currentQIdx++;
            state.feedbackState = null;
            state.userAnswer = null;
            // 문제 이동 시 채팅 내역 초기화
            clearChatHistory();
            if (state.currentQIdx >= state.questionCount) state.screen = 'result';
            render();
        }

        function resetApp() {
            state = {
                screen: 'setup',
                selectedMains: new Set(),
                selectedSubs: new Set(),
                difficulty: 3,
                questionCount: 10,
                extraText: "",
                questions: [],
                currentQIdx: 0,
                score: 0,
                feedbackState: null,
                userAnswer: null,
                isGrading: false,
                isTutorialCompleted: state.isTutorialCompleted,
                chatHistory: []
            };
            clearChatHistory();
            render();
        }

        async function startGeneration() {
            if (state.selectedSubs.size === 0) return;
            state.screen = 'loading';
            render();

            const subsList = Array.from(state.selectedSubs).join(', ');
            
            const prompt = `
당신은 최고의 Computer Science 교수입니다. 사용자의 요청에 맞춰 퀴즈를 생성하세요.

[출제 가이드라인]
1. 사용자 추가 요청 사항 반영: 사용자가 입력한 내용을 전체 문제의 약 70% 비중으로 최우선 반영하여 출제하십시오.
2. 카테고리 맥락: 선택된 카테고리 주제를 나머지 30% 비중으로 반영하십시오.

[요구사항]
- 문제 개수: 정확히 ${state.questionCount}문제.
- 난이도: ${state.difficulty} / 5
- 유형 비율: 객관식, O/X, 단답형을 고르게 섞어서 출제.
- 언어: 한국어.

[출제 범위]
카테고리: ${subsList}
추가 요청 내용: ${state.extraText || "없음"}

응답은 JSON 포맷으로 questions 배열을 포함해야 합니다.
`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: {
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "OBJECT",
                                properties: {
                                    questions: {
                                        type: "ARRAY",
                                        items: {
                                            type: "OBJECT",
                                            properties: {
                                                type: { type: "STRING", enum: ["ox", "mcq", "short"] },
                                                question: { type: "STRING" },
                                                options: { type: "ARRAY", items: { type: "STRING" } },
                                                answer: { type: "STRING" },
                                                explanation: { type: "STRING" }
                                            },
                                            required: ["type", "question", "answer", "explanation"]
                                        }
                                    }
                                }
                            }
                        }
                    })
                });
                
                const result = await response.json();
                const data = JSON.parse(result.candidates[0].content.parts[0].text);
                state.questions = data.questions.slice(0, state.questionCount); 
                state.screen = 'quiz';
                render();

            } catch (error) {
                console.error(error);
                alert("퀴즈 생성에 실패했습니다. 잠시 후 다시 시도해주세요.");
                state.screen = 'setup';
                render();
            }
        }

        // --- Chatbot Logic ---
        function handleChatbotClick() {
            if (!state.isTutorialCompleted) {
                document.getElementById('tutorial-overlay').style.display = 'flex';
            } else {
                toggleChatbot();
            }
        }

        function nextTutorial(step) {
            document.querySelectorAll('.tutorial-step').forEach(el => el.classList.remove('active'));
            document.getElementById(`tut-step-${step}`).classList.add('active');
        }

        function closeTutorial() {
            state.isTutorialCompleted = true;
            document.getElementById('tutorial-overlay').style.display = 'none';
            toggleChatbot();
        }

        function toggleChatbot() {
            const window = document.getElementById('chatbot-window');
            if (window.style.display === 'flex') {
                window.style.display = 'none';
            } else {
                window.style.display = 'flex';
                if (state.chatHistory.length === 0) {
                    appendChatMessage('ai', "어이, 주니어. 막히는 게 있으면 편하게 물어보게. 정답을 떠먹여줄 순 없지만, 길은 안내해주지.");
                }
                setTimeout(() => document.getElementById('chat-input').focus(), 100);
            }
        }

        function clearChatHistory() {
            state.chatHistory = [];
            const container = document.getElementById('chat-messages');
            if (container) container.innerHTML = '';
        }

        function appendChatMessage(role, text) {
            const container = document.getElementById('chat-messages');
            const bubble = document.createElement('div');
            bubble.className = `chat-bubble ${role === 'ai' ? 'bubble-ai' : 'bubble-user'}`;
            bubble.innerHTML = text.replace(/\n/g, '<br>');
            container.appendChild(bubble);
            container.scrollTop = container.scrollHeight;
            
            state.chatHistory.push({ role, text });
        }

        function showTypingIndicator() {
            const container = document.getElementById('chat-messages');
            const wrapper = document.createElement('div');
            wrapper.id = 'typing-indicator-wrapper';
            wrapper.className = 'chat-bubble bubble-ai';
            wrapper.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typing-indicator-wrapper');
            if (indicator) indicator.remove();
        }

        async function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            appendChatMessage('user', text);
            input.value = '';
            showTypingIndicator();

            let contextText = "현재 퀴즈 생성 전입니다. CS 전반적인 질문에 답해주세요.";
            if (state.screen === 'quiz' && state.questions.length > 0) {
                const q = state.questions[state.currentQIdx];
                // AI에게 문제의 구체적인 정보를 더 상세히 전달
                contextText = `
[현재 풀고 있는 문제 정보]
주제: ${Array.from(state.selectedSubs).join(', ')}
문제 유형: ${q.type}
질문 내용: ${q.question}
제시된 보기: ${q.options ? q.options.join(', ') : '없음'}
실제 정답(참고용): ${q.answer}
문제 해설(참고용): ${q.explanation}
사용자 상태: ${state.feedbackState === 'wrong' ? '이미 한 번 틀린 상태' : '아직 답을 제출하지 않았거나 고민 중인 상태'}
`;
            }

            const systemPrompt = `
당신은 15년 차 시니어 백엔드 개발자 멘토입니다. 소크라테스 문답법의 달인입니다.

[절대 규칙 - 반드시 지키세요]
1. 정답을 직접적으로 알려주면 안 됩니다. 절대 안 됩니다.
2. 사용자가 스스로 결론을 도출할 수 있도록 **질문**으로 유도하세요.
3. 답변은 사용자가 한눈에 이해할 수 있도록 **반드시 4줄 이하**로 작성하세요. 간결함이 생명입니다.
4. 말투는 시니컬하지만 실력있고 후배를 아끼는 선배처럼 하세요. (예: "~은 생각해봤나?", "만약 ~라면 어떻게 되겠어?")

[상황 맥락]
${contextText}

[가이드라인]
사용자가 질문한 내용이 위 '현재 풀고 있는 문제'와 관련이 있다면, 해당 문제의 개념을 스스로 깨우칠 수 있도록 힌트가 담긴 질문을 던지세요.
`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    })
                });
                
                const result = await response.json();
                removeTypingIndicator();
                const aiResponse = result.candidates[0].content.parts[0].text;
                appendChatMessage('ai', aiResponse);
            } catch (error) {
                removeTypingIndicator();
                appendChatMessage('ai', "서버에 잠시 문제가 생긴 것 같군. 나중에 다시 묻게나.");
            }
        }

        render();
    </script>
</body>
</html>
