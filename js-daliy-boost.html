<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Daily Boost - 프론트엔드 코드 마스터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #0f172a;
        color: #f1f5f9;
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          sans-serif;
      }
      .code-font {
        font-family: 'Fira Code', monospace;
      }
      .glass-card {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .stamp-animation {
        animation: stampIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      @keyframes stampIn {
        0% {
          transform: scale(3);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      .loader {
        border: 3px solid #334155;
        border-top: 3px solid #3b82f6;
        border-radius: 50%;
        width: 24px;
        height: 24px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .difficulty-btn.active {
        background-color: #4f46e5;
        color: white;
        border-color: #6366f1;
        box-shadow: 0 0 15px rgba(79, 70, 229, 0.4);
      }
      table {
        border-collapse: separate;
        border-spacing: 0;
      }
      th {
        background-color: rgba(30, 41, 59, 0.5);
      }

      /* IDE Editor Styles */
      .editor-wrapper {
        display: flex;
        background-color: #0d1117;
        border-radius: 0 0 12px 12px;
        overflow: hidden;
        position: relative;
        min-height: 350px;
        border: 1px solid #30363d;
      }
      .line-numbers {
        width: 45px;
        padding: 24px 0;
        text-align: right;
        background-color: #0d1117;
        border-right: 1px solid #30363d;
        color: #484f58;
        font-family: 'Fira Code', monospace;
        font-size: 14px;
        line-height: 1.625;
        user-select: none;
        overflow: hidden;
        z-index: 10;
      }
      .line-numbers span {
        display: block;
        padding-right: 12px;
      }
      #code-editor {
        flex: 1;
        background-color: transparent;
        color: #e6edf3;
        padding: 24px 16px;
        font-family: 'Fira Code', monospace;
        font-size: 14px;
        line-height: 1.625;
        outline: none;
        resize: none;
        border: none;
        white-space: pre;
        overflow-x: auto;
        tab-size: 4;
      }
      textarea::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      textarea::-webkit-scrollbar-thumb {
        background: #30363d;
        border-radius: 5px;
      }
      textarea::-webkit-scrollbar-track {
        background: #0d1117;
      }
    </style>
  </head>
  <body class="min-h-screen pb-20">
    <div id="app" class="max-w-4xl mx-auto px-4 pt-8">
      <!-- Header -->
      <header class="flex justify-between items-center mb-10">
        <div>
          <h1
            class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-yellow-400 to-orange-500"
          >
            JS Daily Boost
          </h1>
          <p class="text-slate-400 mt-1 text-sm">
            매일 한 걸음 더 나은 코드를 향해
          </p>
        </div>
        <div
          id="user-info"
          class="flex items-center gap-2 glass-card px-4 py-2 rounded-full"
        >
          <div
            class="w-8 h-8 rounded-full bg-indigo-500 flex items-center justify-center text-[10px] font-bold"
          >
            MY
          </div>
          <div class="flex flex-col">
            <span
              class="text-[10px] font-bold text-slate-400 leading-none uppercase tracking-tighter"
              >JS Specialist</span
            >
          </div>
        </div>
      </header>

      <div class="space-y-8">
        <!-- Mission Card -->
        <div class="glass-card rounded-2xl p-6 relative">
          <div class="flex justify-between items-start mb-6">
            <div class="flex items-center gap-2 -ml-1">
              <i data-lucide="zap" class="text-yellow-400 w-5 h-5"></i>
              <h2 class="text-xl font-bold tracking-tight">오늘의 미션</h2>
            </div>

            <div class="flex items-center gap-3">
              <div
                class="flex bg-slate-800/50 p-1 rounded-xl border border-slate-700 shadow-inner"
              >
                <button
                  data-level="입문"
                  class="difficulty-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all text-slate-400 hover:text-white"
                >
                  입문
                </button>
                <button
                  data-level="보통"
                  class="difficulty-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all text-slate-400 hover:text-white"
                >
                  보통
                </button>
                <button
                  data-level="심화"
                  class="difficulty-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all text-slate-400 hover:text-white"
                >
                  심화
                </button>
              </div>
              <button
                id="refresh-btn"
                class="p-2 hover:bg-slate-700 rounded-lg transition-colors border border-transparent hover:border-slate-600 hidden"
                title="미션 새로고침"
              >
                <i data-lucide="refresh-cw" class="w-4 h-4 text-slate-400"></i>
              </button>
            </div>
          </div>

          <div
            id="problem-area"
            class="min-h-[120px] flex flex-col justify-center items-center text-center"
          >
            <div class="bg-indigo-500/10 p-4 rounded-2xl mb-4">
              <i data-lucide="sparkles" class="w-8 h-8 text-indigo-400"></i>
            </div>
            <h3 class="text-lg font-bold text-white mb-2">
              프론트엔드 실무 역량 강화
            </h3>
            <p class="text-slate-400 text-sm">
              난이도를 선택하여 데이터 가공 및 실무 제어 미션을 시작하세요.
            </p>
          </div>
        </div>

        <!-- IDE Style Editor -->
        <div
          id="editor-container"
          class="glass-card rounded-2xl overflow-hidden border border-slate-700 opacity-50 pointer-events-none transition-opacity shadow-2xl"
        >
          <div
            class="bg-[#161b22] px-4 py-2.5 flex justify-between items-center border-b border-slate-700"
          >
            <div class="flex items-center gap-2">
              <i data-lucide="file-code" class="w-4 h-4 text-indigo-400"></i>
              <span
                class="text-xs font-mono text-slate-300 uppercase tracking-widest"
                >solution.js</span
              >
            </div>
            <div class="flex gap-1.5">
              <div class="w-3 h-3 rounded-full bg-[#ff5f56]"></div>
              <div class="w-3 h-3 rounded-full bg-[#ffbd2e]"></div>
              <div class="w-3 h-3 rounded-full bg-[#27c93f]"></div>
            </div>
          </div>
          <div class="editor-wrapper">
            <div id="line-numbers" class="line-numbers">
              <span>1</span>
            </div>
            <textarea
              id="code-editor"
              spellcheck="false"
              placeholder="// 난이도를 선택해 주세요..."
            ></textarea>
          </div>
          <div
            class="p-4 bg-[#161b22] flex justify-between items-center border-t border-slate-700"
          >
            <span
              class="text-[10px] text-slate-500 font-mono uppercase tracking-widest"
              >TAB to Indent • Frontend Specialist Mode</span
            >
            <button
              id="submit-btn"
              class="px-6 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg font-bold transition-all flex items-center gap-2 disabled:opacity-50"
              disabled
            >
              <span class="text-sm">제출 및 리뷰</span>
              <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <div id="result-area" class="hidden space-y-6"></div>
      </div>
    </div>

    <!-- Success Overlay -->
    <div
      id="success-overlay"
      class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden"
    >
      <div
        class="glass-card p-10 rounded-3xl text-center max-w-sm mx-4 transform scale-95 transition-transform duration-300"
      >
        <div
          class="w-20 h-20 bg-green-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg shadow-green-500/30"
        >
          <i data-lucide="check" class="text-white w-10 h-10"></i>
        </div>
        <h2 class="text-2xl font-bold mb-2 text-white">성공!</h2>
        <p class="text-slate-400 mb-8">
          미션을 성공적으로 해결했습니다. 실력이 한 뼘 더 자라났어요!
        </p>
        <button
          id="close-overlay"
          class="w-full py-3 bg-slate-700 hover:bg-slate-600 rounded-xl font-bold transition-colors"
        >
          닫기
        </button>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
      import {
        getAuth,
        signInAnonymously,
        signInWithCustomToken,
        onAuthStateChanged,
      } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
      import {
        getFirestore,
        doc,
        getDoc,
        setDoc,
        collection,
        query,
        onSnapshot,
      } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

      const firebaseConfig = JSON.parse(__firebase_config);
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      const appId =
        typeof __app_id !== 'undefined' ? __app_id : 'js-daily-boost-v1';

      let user = null;
      let todayMission = null;
      let currentDifficulty = null;
      const apiKey = '';

      const problemArea = document.getElementById('problem-area');
      const codeEditor = document.getElementById('code-editor');
      const lineNumbers = document.getElementById('line-numbers');
      const submitBtn = document.getElementById('submit-btn');
      const resultArea = document.getElementById('result-area');
      const successOverlay = document.getElementById('success-overlay');
      const difficultyBtns = document.querySelectorAll('.difficulty-btn');
      const editorContainer = document.getElementById('editor-container');
      const refreshBtn = document.getElementById('refresh-btn');

      // IDE Logic: Line Numbers & Tab & Scroll Sync
      const updateLineNumbers = () => {
        const lines = codeEditor.value.split('\n');
        lineNumbers.innerHTML = lines
          .map((_, i) => `<span>${i + 1}</span>`)
          .join('');
        lineNumbers.scrollTop = codeEditor.scrollTop;
      };

      codeEditor.addEventListener('input', updateLineNumbers);
      codeEditor.addEventListener('scroll', () => {
        lineNumbers.scrollTop = codeEditor.scrollTop;
      });

      codeEditor.addEventListener('keydown', function (e) {
        if (e.key === 'Tab') {
          e.preventDefault();
          const start = this.selectionStart;
          const end = this.selectionEnd;
          this.value =
            this.value.substring(0, start) + '    ' + this.value.substring(end);
          this.selectionStart = this.selectionEnd = start + 4;
          updateLineNumbers();
        }
      });

      const missionSchema = {
        type: 'OBJECT',
        properties: {
          title: { type: 'STRING' },
          description: { type: 'STRING' },
          initialCode: { type: 'STRING' },
          testCases: {
            type: 'ARRAY',
            items: {
              type: 'OBJECT',
              properties: {
                input: { type: 'STRING' },
                output: { type: 'STRING' },
              },
            },
          },
        },
        required: ['title', 'description', 'initialCode', 'testCases'],
      };

      const reviewSchema = {
        type: 'OBJECT',
        properties: {
          isCorrect: { type: 'BOOLEAN' },
          feedback: { type: 'STRING' },
          refactors: {
            type: 'ARRAY',
            items: {
              type: 'OBJECT',
              properties: {
                type: { type: 'STRING' },
                code: { type: 'STRING' },
                explanation: { type: 'STRING' },
              },
            },
          },
        },
        required: ['isCorrect', 'feedback', 'refactors'],
      };

      // UI Helper
      function safeCreateIcons() {
        if (typeof window.lucide !== 'undefined' && window.lucide.createIcons) {
          window.lucide.createIcons();
        }
      }

      const initAuth = async () => {
        try {
          if (
            typeof __initial_auth_token !== 'undefined' &&
            __initial_auth_token
          ) {
            await signInWithCustomToken(auth, __initial_auth_token);
          } else {
            await signInAnonymously(auth);
          }
        } catch (err) {
          console.error('Auth failed:', err);
        }
      };

      onAuthStateChanged(auth, (u) => {
        user = u;
      });

      async function markToday() {
        if (!user) return;
        const todayStr = new Date().toISOString().split('T')[0];
        const stampDoc = doc(
          db,
          'artifacts',
          appId,
          'users',
          user.uid,
          'stamps',
          todayStr,
        );
        await setDoc(stampDoc, { completed: true, timestamp: Date.now() });
        successOverlay.classList.remove('hidden');
      }

      async function callGemini(prompt, schema, temp = 0.7) {
        for (let i = 0; i < 5; i++) {
          try {
            const response = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: prompt }] }],
                  generationConfig: {
                    responseMimeType: 'application/json',
                    responseSchema: schema,
                    temperature: temp,
                  },
                }),
              },
            );
            const data = await response.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!text) throw new Error('Empty AI response');
            return JSON.parse(text);
          } catch (err) {
            if (i === 4) throw err;
            await new Promise((r) => setTimeout(r, Math.pow(2, i) * 1000));
          }
        }
      }

      async function generateDailyMission() {
        if (!currentDifficulty) return;

        problemArea.innerHTML = `
                <div class="flex flex-col items-center gap-3 py-10">
                    <div class="loader"></div> 
                    <span class="text-sm text-slate-400 font-medium tracking-tight">AI 미션 출제 중...</span>
                </div>`;

        editorContainer.classList.add('opacity-50', 'pointer-events-none');
        resultArea.classList.add('hidden');
        refreshBtn.classList.add('hidden');

        const levelCriteria = {
          입문: `Level 1: '순수 자바스크립트 기본기'. 
                        기준: 외부 데이터 없이, 주어진 변수나 배열 하나를 자바스크립트 내장 함수 한두 개로 조작하기. 
                        핵심: String, Array, Number 메서드 숙달. 
                        예시: "사용자 입력값에서 공백 제거하고 대문자로 바꾸기", "숫자 배열에서 최댓값 찾기".`,
          보통: `Level 2: '데이터 트랜스포메이션(가공)'. 
                        기준: 실무에서 서버 API로부터 받는 '객체 배열(Array of Objects)'을 UI에 뿌리기 좋게 가공하기. 
                        핵심: filter와 map의 체이닝, reduce를 통한 데이터 그룹화. 
                        예시: "전체 상품 목록에서 '품절' 상품은 제외하고, 카테고리별로 묶어서 반환하기".`,
          심화: `Level 3: '엣지 케이스 처리 및 효율성'. 
                        기준: 데이터가 비어있거나(null/undefined), 중첩(Nested)되어 있거나, 시간차(비동기)가 발생하는 상황을 제어하기. 
                        핵심: 옵셔널 체이닝(?.), 재귀(Recursion), 비동기 에러 핸들링(try-catch), 클로저를 활용한 상태 기억. 
                        예시: "무한 댓글 구조에서 특정 ID의 댓글을 찾아 수정하기", "연속으로 들어오는 검색 요청 중 마지막 요청만 처리하기(Debounce logic)".`,
        };

        const prompt = `Task: Create a unique JS mission for Level: ${currentDifficulty}.
            Standards: ${levelCriteria[currentDifficulty]}
            
            CRITICAL Formatting Rule for "initialCode":
            - Return PURE PLAIN TEXT.
            - Provide a multi-line skeleton with a NEWLINE after the opening brace and 4-SPACE INDENT like this:
              function solution(data) {
                  // 여기에 코드를 작성해 주세요
              }
            
            Restrictions:
            - Keep test cases short and concise. Avoid very long data arrays.
            - Respond strictly in JSON.
            - Language: Korean for title/description/test cases.`;

        try {
          todayMission = await callGemini(prompt, missionSchema, 0.8);
          problemArea.className = 'min-h-[100px] text-left block space-y-6';

          const tableRows = (todayMission.testCases || [])
            .map(
              (tc) => `
                    <tr class="border-b border-slate-700/50">
                        <td class="py-2.5 px-4 text-indigo-300 font-mono text-[13px]">${tc.input}</td>
                        <td class="py-2.5 px-4 text-emerald-400 font-mono text-[13px]">${tc.output}</td>
                    </tr>
                `,
            )
            .join('');

          problemArea.innerHTML = `
                    <div class="flex items-center gap-2 mb-1">
                        <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 uppercase tracking-tighter">
                            ${currentDifficulty}
                        </span>
                        <h3 class="text-lg font-bold text-white">${todayMission.title}</h3>
                    </div>
                    <p class="text-slate-300 whitespace-pre-line leading-relaxed text-[13.5px]">${todayMission.description}</p>
                    
                    <div class="overflow-hidden rounded-xl border border-slate-700 bg-slate-800/20">
                        <div class="bg-slate-800/80 px-4 py-2 border-b border-slate-700 flex items-center gap-2">
                            <i data-lucide="terminal" class="w-3.5 h-3.5 text-slate-400"></i>
                            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">테스트 케이스</span>
                        </div>
                        <table class="w-full text-xs text-left">
                            <thead>
                                <tr class="text-slate-500 border-b border-slate-700">
                                    <th class="py-2 px-4 font-bold uppercase tracking-wider">입력 (Input)</th>
                                    <th class="py-2 px-4 font-bold uppercase tracking-wider">결과 (Output)</th>
                                </tr>
                            </thead>
                            <tbody>${tableRows}</tbody>
                        </table>
                    </div>
                `;

          codeEditor.value = todayMission.initialCode || '';
          updateLineNumbers();

          editorContainer.classList.remove('opacity-50', 'pointer-events-none');
          submitBtn.disabled = false;
          refreshBtn.classList.remove('hidden');
          safeCreateIcons();
        } catch (err) {
          console.error(err);
          problemArea.innerHTML = `<div class="text-center w-full py-10"><p class="text-red-400 text-sm">생성 실패. 다시 시도해 주세요.</p></div>`;
        }
      }

      async function reviewCode() {
        const userCode = codeEditor.value.trim();
        if (!userCode || !todayMission) return;

        submitBtn.disabled = true;
        submitBtn.innerHTML = `<div class="loader"></div> <span class="ml-2 text-sm text-white">리뷰 분석 중...</span>`;

        const prompt = `Review this practical solution for: "${todayMission.title}".
            User Code: ${userCode}
            Provide 3 refactored versions: '가독성', '성능', '최신 문법'.
            The code in refactors MUST use 4-space indentation and be perfectly formatted with newlines.
            Respond strictly in JSON in Korean.`;

        try {
          const review = await callGemini(prompt, reviewSchema, 0.4);
          displayReview(review);
          if (review.isCorrect) await markToday();
        } catch (err) {
          console.error(err);
          alert('리뷰를 가져오지 못했습니다.');
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<span class="text-sm text-white">제출 및 AI 리뷰</span><i data-lucide="arrow-right" class="w-4 h-4 text-white"></i>`;
          safeCreateIcons();
        }
      }

      function displayReview(review) {
        resultArea.classList.remove('hidden');
        const typeLabels = {
          가독성: '가독성 (Readability)',
          성능: '성능 (Performance)',
          '최신 문법': '최신 문법 (Modern ES6+)',
        };

        resultArea.innerHTML = `
                <div class="glass-card rounded-2xl p-6 border-l-4 ${review.isCorrect ? 'border-green-500 shadow-[0_0_20px_rgba(34,197,94,0.1)]' : 'border-red-500 shadow-[0_0_20px_rgba(239,68,68,0.1)]'}">
                    <h3 class="text-xl font-bold mb-2 flex items-center gap-2 -ml-1 text-white">
                        ${review.isCorrect ? '<i data-lucide="award" class="text-green-500"></i> 미션 성공!' : '<i data-lucide="alert-circle" class="text-red-500"></i> 보완이 필요해요'}
                    </h3>
                    <p class="text-slate-300 text-[13.5px] mb-10 leading-relaxed">${review.feedback}</p>
                    
                    <div class="flex items-center gap-2 mb-6 -ml-0.5">
                        <i data-lucide="sparkles" class="w-5 h-5 text-indigo-400"></i>
                        <h4 class="text-lg font-bold text-white tracking-tight">AI 추천 리팩토링</h4>
                    </div>

                    <div class="space-y-12">
                        ${(review.refactors || [])
                          .map(
                            (item) => `
                            <div class="space-y-4">
                                <div class="flex items-center gap-3">
                                    <span class="bg-indigo-600 text-white px-3 py-1 rounded-lg text-xs font-bold uppercase tracking-widest shadow-lg shadow-indigo-600/20">
                                        ${typeLabels[item.type] || item.type}
                                    </span>
                                    <div class="h-[1px] flex-grow bg-slate-800"></div>
                                </div>
                                <div class="bg-[#0d1117] border border-slate-700/50 rounded-xl overflow-hidden shadow-2xl">
                                    <div class="p-5 overflow-x-auto bg-[#0d1117]">
                                        <pre class="code-font text-sm text-indigo-100 leading-relaxed"><code>${escapeHtml(item.code)}</code></pre>
                                    </div>
                                    <div class="bg-[#161b22] p-5 border-t border-slate-700/50">
                                        <p class="text-[13.5px] text-slate-200 leading-relaxed font-medium">${item.explanation}</p>
                                    </div>
                                </div>
                            </div>
                        `,
                          )
                          .join('')}
                    </div>
                </div>
            `;
        safeCreateIcons();
        resultArea.scrollIntoView({ behavior: 'smooth' });
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text || '';
        return div.innerHTML;
      }

      submitBtn.addEventListener('click', reviewCode);
      refreshBtn.addEventListener('click', generateDailyMission);
      document
        .getElementById('close-overlay')
        .addEventListener('click', () =>
          successOverlay.classList.add('hidden'),
        );

      difficultyBtns.forEach((btn) => {
        btn.addEventListener('click', () => {
          difficultyBtns.forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          currentDifficulty = btn.dataset.level;
          generateDailyMission();
        });
      });

      initAuth();
      window.onload = () => {
        safeCreateIcons();
        updateLineNumbers();
      };
    </script>
  </body>
</html>
