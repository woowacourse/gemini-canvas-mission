<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExcuseGPT - 당신의 완벽한 핑계 봇</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* React 버전의 animate-in 및 기타 애니메이션을 위한 커스텀 CSS */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(1rem);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-slide-in {
            animation: slideIn 0.5s ease-out forwards;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 text-gray-800 font-sans">
    <div class="p-4 md:p-8">
        <div class="max-w-2xl mx-auto">
            
            <!-- 헤더 섹션 -->
            <header class="text-center mb-10">
                <div class="inline-flex items-center justify-center p-3 bg-indigo-600 rounded-2xl mb-4 shadow-lg shadow-indigo-200">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-8 h-8 text-white"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.5 3.8 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
                </div>
                <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight text-gray-900 mb-3">
                    Excuse<span class="text-indigo-600">GPT</span>
                </h1>
                <p class="text-lg md:text-xl text-gray-600 font-medium">
                    "고민은 AI가, 당신은 복사만"
                </p>
                <p class="text-sm text-gray-500 mt-2">당신의 완벽한 사회적 방패 🛡️</p>
            </header>

            <main class="bg-white rounded-3xl shadow-xl border border-gray-100 p-6 md:p-8">
                
                <!-- 입력 폼 -->
                <div class="space-y-8">
                    
                    <!-- 1. 대상 선택 -->
                    <div class="space-y-3">
                        <label class="block text-sm font-bold text-gray-700">
                            1. 누구에게 보내는 핑계인가요?
                        </label>
                        <div id="target-container" class="flex flex-wrap gap-2">
                            <!-- 대상 버튼들이 JS에 의해 렌더링 됩니다 -->
                        </div>
                    </div>

                    <!-- 2. 상황 입력 -->
                    <div class="space-y-3">
                        <label class="block text-sm font-bold text-gray-700" for="situation">
                            2. 어떤 상황을 피하고 싶나요?
                        </label>
                        <div class="relative">
                            <input
                                id="situation"
                                type="text"
                                placeholder="예: 오늘 저녁 팀 회식, 이번 주말 동호회 등산"
                                class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-gray-900 placeholder-gray-400"
                            />
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="absolute left-4 top-3.5 w-5 h-5 text-gray-400"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                        </div>
                    </div>

                    <!-- 3. 톤앤매너 선택 -->
                    <div class="space-y-3">
                        <label class="block text-sm font-bold text-gray-700">
                            3. 어떤 톤으로 말할까요?
                        </label>
                        <div id="tone-container" class="grid grid-cols-2 gap-3">
                            <!-- 톤 버튼들이 JS에 의해 렌더링 됩니다 -->
                        </div>
                    </div>

                    <!-- 생성 버튼 -->
                    <button
                        id="generate-btn"
                        class="w-full py-4 px-6 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white rounded-xl font-bold text-lg shadow-lg shadow-indigo-200/50 transition-all flex justify-center items-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed transform active:scale-[0.98]"
                    >
                        <svg id="icon-loading" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6 animate-spin hidden"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                        <svg id="icon-wand" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72Z"/><path d="m14 7 3 3"/><path d="M5 6v4"/><path d="M19 14v4"/><path d="M10 2v2"/><path d="M7 8H3"/><path d="M21 16h-4"/><path d="M11 3H9"/></svg>
                        <span id="generate-btn-text">완벽한 핑계 생성하기</span>
                    </button>

                    <!-- 에러 메시지 -->
                    <div id="error-container" class="hidden items-center gap-2 text-red-600 bg-red-50 p-4 rounded-xl text-sm font-medium">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 flex-shrink-0"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
                        <p id="error-message"></p>
                    </div>
                </div>
            </main>

            <!-- 결과 표시 섹션 -->
            <div id="result-container" class="hidden mt-8 animate-slide-in">
                <div class="bg-gray-900 rounded-3xl shadow-2xl overflow-hidden">
                    <div class="px-6 py-4 bg-gray-800 border-b border-gray-700 flex justify-between items-center">
                        <span class="text-gray-300 font-medium text-sm flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
                            생성된 핑계 메시지
                        </span>
                        <button
                            id="copy-btn"
                            class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-bold transition-all bg-white/10 text-white hover:bg-white/20"
                        >
                            <svg id="icon-copy" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                            <svg id="icon-check" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 hidden"><polyline points="20 6 9 17 4 12"/></svg>
                            <span id="copy-text">복사하기</span>
                        </button>
                    </div>
                    <div class="p-6 md:p-8">
                        <p id="generated-excuse-text" class="text-white text-lg md:text-xl leading-relaxed whitespace-pre-wrap font-medium"></p>
                    </div>
                </div>
            </div>
            
            <footer class="mt-12 text-center text-sm text-gray-400">
                <p>이 서비스가 생성한 핑계로 인해 발생하는 인간관계 문제는 책임지지 않습니다 😉</p>
            </footer>

        </div>
    </div>

    <!-- 스크립트 로직 -->
    <script>
        const apiKey = ""; // API 키는 실행 환경에서 자동 주입됩니다.
        
        // 상태 변수
        let currentTarget = '직장 상사';
        let currentTone = '급성 장염, 노로바이러스, 피할 수 없는 집안일 등 상대방이 절대 의심하거나 되물을 수 없는 매우 현실적이고 구체적인 이유로 (가상의 병명 금지, 장난기 절대 없이 진지하게)';
        let generatedExcuse = '';
        let isLoading = false;

        // 옵션 데이터
        const targetOptions = ['직장 상사', '직장 동료', '친한 친구', '어색한 지인', '연인', '가족'];
        const toneOptions = [
            { label: '정중/진지', value: '정중하고 진지하게, 예의 바르게', icon: '👔' },
            { label: '유머/재치', value: '유머러스하고 재치있게, 장난스럽게', icon: '🤪' },
            { label: '반박불가', value: '급성 장염, 노로바이러스, 피할 수 없는 집안일 등 상대방이 절대 의심하거나 되물을 수 없는 매우 현실적이고 구체적인 이유로 (가상의 병명 금지, 장난기 절대 없이 진지하게)', icon: '🛡️' },
            { label: '아련/감성', value: '아련하고 미안함이 뚝뚝 묻어나는 감성적인 말투로', icon: '🥺' }
        ];

        // DOM 요소 캐싱
        const targetContainer = document.getElementById('target-container');
        const toneContainer = document.getElementById('tone-container');
        const situationInput = document.getElementById('situation');
        const generateBtn = document.getElementById('generate-btn');
        const generateBtnText = document.getElementById('generate-btn-text');
        const iconLoading = document.getElementById('icon-loading');
        const iconWand = document.getElementById('icon-wand');
        const errorContainer = document.getElementById('error-container');
        const errorMessage = document.getElementById('error-message');
        const resultContainer = document.getElementById('result-container');
        const generatedExcuseText = document.getElementById('generated-excuse-text');
        const copyBtn = document.getElementById('copy-btn');
        const iconCopy = document.getElementById('icon-copy');
        const iconCheck = document.getElementById('icon-check');
        const copyText = document.getElementById('copy-text');

        // UI 렌더링 함수
        function renderTargets() {
            targetContainer.innerHTML = targetOptions.map(opt => `
                <button
                    onclick="setTarget('${opt}')"
                    class="px-4 py-2 rounded-full text-sm font-medium transition-all ${
                        currentTarget === opt
                            ? 'bg-indigo-600 text-white shadow-md'
                            : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                    }"
                >
                    ${opt}
                </button>
            `).join('');
        }

        function renderTones() {
            toneContainer.innerHTML = toneOptions.map(opt => `
                <button
                    onclick="setTone('${opt.value}')"
                    class="p-3 rounded-xl border-2 text-left flex items-center gap-2 transition-all ${
                        currentTone === opt.value
                            ? 'border-indigo-600 bg-indigo-50 text-indigo-700'
                            : 'border-gray-100 bg-white text-gray-600 hover:border-gray-200 hover:bg-gray-50'
                    }"
                >
                    <span class="text-xl">${opt.icon}</span>
                    <span class="font-semibold text-sm">${opt.label}</span>
                </button>
            `).join('');
        }

        // 상태 업데이트 핸들러
        window.setTarget = (target) => {
            currentTarget = target;
            renderTargets();
        };

        window.setTone = (tone) => {
            currentTone = tone;
            renderTones();
        };

        // 지수 백오프를 적용한 API 호출 함수
        const fetchWithRetry = async (url, options, retries = 5) => {
            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        throw new Error(`서버 에러가 발생했습니다. (상태 코드: ${response.status})`);
                    }
                    return await response.json();
                } catch (error) {
                    if (i === retries - 1) throw error;
                    await new Promise(resolve => setTimeout(resolve, delays[i]));
                }
            }
        };

        // 에러 표시
        const showError = (msg) => {
            errorMessage.textContent = msg;
            errorContainer.classList.remove('hidden');
            errorContainer.classList.add('flex');
        };

        // 에러 숨기기
        const hideError = () => {
            errorContainer.classList.add('hidden');
            errorContainer.classList.remove('flex');
        };

        // 로딩 상태 토글
        const setLoadingState = (loading) => {
            isLoading = loading;
            if (loading) {
                generateBtn.disabled = true;
                iconWand.classList.add('hidden');
                iconLoading.classList.remove('hidden');
                generateBtnText.textContent = 'AI가 핑계를 지어내는 중...';
            } else {
                generateBtn.disabled = false;
                iconWand.classList.remove('hidden');
                iconLoading.classList.add('hidden');
                generateBtnText.textContent = '완벽한 핑계 생성하기';
            }
        };

        // 핑계 생성 메인 로직
        const generateExcuse = async () => {
            const situation = situationInput.value.trim();
            
            if (!situation) {
                showError('어떤 상황인지 입력해주세요! (예: 오늘 저녁 팀 회식)');
                return;
            }

            setLoadingState(true);
            hideError();
            resultContainer.classList.add('hidden');
            generatedExcuse = '';

            const systemInstruction = `당신은 'ExcuseGPT(핑계봇)'입니다. 당신의 목표는 사용자가 원치 않는 일정(회식, 약속 등)에서 빠져나올 수 있도록 완벽한 핑계를 만들어주는 것입니다. 
    핵심 원칙:
    1. 철저하게 카카오톡 등 메신저에서 바로 '복사+붙여넣기' 할 수 있는 자연스러운 1인칭 대화체로 작성할 것.
    2. 불필요한 인사말이나 설명(예: "이렇게 보내보세요:")은 절대 넣지 말고 오직 메시지 본문만 출력할 것.
    3. 길이는 1~3문장 내외로 간결하게.
    4. 요청받은 '대상'과 '톤앤매너'를 완벽하게 반영할 것. 보낼 대상이 '상사'나 '어색한 지인'일 경우 절대 장난스럽거나 비현실적인 변명을 하지 말고 극도로 현실적일 것.`;

            const userQuery = `[요청사항]
    - 보낼 대상: ${currentTarget}
    - 피하고 싶은 상황: ${situation}
    - 원하는 말투: ${currentTone}
    
    위 조건에 맞춰서 보낼 메시지를 작성해줘.`;

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                const payload = {
                    contents: [{ parts: [{ text: userQuery }] }],
                    systemInstruction: { parts: [{ text: systemInstruction }] }
                };

                const data = await fetchWithRetry(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                
                if (text) {
                    generatedExcuse = text.trim();
                    generatedExcuseText.textContent = generatedExcuse;
                    resultContainer.classList.remove('hidden');
                    
                    // 스크롤 부드럽게 내리기
                    setTimeout(() => {
                        resultContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }, 100);
                } else {
                    throw new Error('응답을 생성하지 못했습니다.');
                }
            } catch (err) {
                showError('핑계 생성 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
                console.error(err);
            } finally {
                setLoadingState(false);
            }
        };

        // 복사 기능 핸들러
        const handleCopy = () => {
            if (!generatedExcuse) return;
            
            const textArea = document.createElement("textarea");
            textArea.value = generatedExcuse;
            document.body.appendChild(textArea);
            textArea.select();
            
            try {
                document.execCommand('copy');
                
                // 버튼 스타일 변경
                copyBtn.classList.remove('bg-white/10', 'hover:bg-white/20');
                copyBtn.classList.add('bg-green-500');
                iconCopy.classList.add('hidden');
                iconCheck.classList.remove('hidden');
                copyText.textContent = '복사완료!';
                
                // 2초 후 원래대로 복구
                setTimeout(() => {
                    copyBtn.classList.remove('bg-green-500');
                    copyBtn.classList.add('bg-white/10', 'hover:bg-white/20');
                    iconCopy.classList.remove('hidden');
                    iconCheck.classList.add('hidden');
                    copyText.textContent = '복사하기';
                }, 2000);
            } catch (err) {
                console.error('복사 실패', err);
                showError('클립보드 복사에 실패했습니다. 텍스트를 직접 선택해서 복사해주세요.');
            } finally {
                document.body.removeChild(textArea);
            }
        };

        // 이벤트 리스너 등록
        generateBtn.addEventListener('click', generateExcuse);
        copyBtn.addEventListener('click', handleCopy);
        situationInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') generateExcuse();
        });

        // 초기 렌더링
        renderTargets();
        renderTones();
    </script>
</body>
</html>
