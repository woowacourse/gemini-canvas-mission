<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>링구아</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans flex flex-col">

<!-- Header -->
<header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-indigo-600 flex items-center gap-2">
            <i class="fas fa-language"></i> 링구아
        </h1>
        <div id="progress-container" class="hidden text-sm font-medium text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full">
            문장: <span id="current-count" class="text-indigo-600 font-bold">0</span> / <span id="total-count">0</span>
        </div>
    </div>
</header>

<!-- Main Content -->
<main class="flex-grow max-w-5xl mx-auto w-full px-4 py-8 flex flex-col">

    <!-- Step 1: File Upload Screen -->
    <div id="upload-screen" class="flex-grow flex flex-col items-center justify-center fade-in">
        <div class="bg-white p-10 rounded-2xl shadow-sm border border-slate-200 text-center max-w-lg w-full">
            <div class="w-20 h-20 bg-indigo-50 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-file-alt text-3xl text-indigo-500"></i>
            </div>
            <h2 class="text-2xl font-bold mb-2">텍스트 파일 업로드</h2>
            <p class="text-slate-500 mb-8">번역할 소설이나 문서를 <code>.txt</code> 파일 형식으로 업로드해주세요.</p>

            <label for="file-upload" class="cursor-pointer inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-6 rounded-lg transition-colors w-full justify-center">
                <i class="fas fa-upload"></i> 파일 선택하기
            </label>
            <input id="file-upload" type="file" accept=".txt" class="hidden" />

            <p id="upload-error" class="text-red-500 text-sm mt-4 hidden"></p>
        </div>
    </div>

    <!-- Step 2: Workspace Screen -->
    <div id="workspace-screen" class="hidden flex-col flex-grow fade-in gap-6">

        <!-- Original Text & AI Translation -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- Original Text Card -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                <div class="bg-slate-50 border-b border-slate-200 px-4 py-3 flex items-center gap-2">
                    <i class="fas fa-align-left text-slate-400"></i>
                    <h3 class="font-semibold text-slate-700">원본 문장</h3>
                </div>
                <div class="p-6 flex-grow flex items-center justify-center min-h-[150px]">
                    <p id="original-text" class="text-lg leading-relaxed text-slate-800 text-center w-full"></p>
                </div>
            </div>

            <!-- AI Translation Card -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                <div class="bg-indigo-50 border-b border-indigo-100 px-4 py-3 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <i class="fas fa-robot text-indigo-400"></i>
                        <h3 class="font-semibold text-indigo-800">AI 기계 번역</h3>
                    </div>
                    <button id="retry-ai-btn" class="text-xs text-indigo-600 hover:text-indigo-800 hidden" title="다시 번역하기">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
                <div class="p-6 flex-grow flex items-center justify-center relative min-h-[150px]">
                    <!-- Loading State -->
                    <div id="ai-loading" class="flex flex-col items-center justify-center text-indigo-400 absolute inset-0 bg-white z-10">
                        <i class="fas fa-circle-notch fa-spin text-2xl mb-2"></i>
                        <span class="text-sm font-medium">AI가 번역 중입니다...</span>
                    </div>
                    <!-- Translation Text -->
                    <p id="ai-text" class="text-lg leading-relaxed text-slate-700 text-center w-full hidden"></p>
                </div>
            </div>
        </div>

        <!-- User Translation Input -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mt-2">
            <div class="bg-emerald-50 border-b border-emerald-100 px-4 py-3 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <i class="fas fa-pen text-emerald-500"></i>
                    <h3 class="font-semibold text-emerald-800">나의 번역</h3>
                </div>
            </div>
            <div class="p-4">
                <textarea id="user-translation" rows="4" class="w-full p-4 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none resize-none text-lg transition-all" placeholder="여기에 번역을 입력하세요..."></textarea>
            </div>
        </div>

        <!-- Slider for Navigation -->
        <div class="w-full mt-2 px-1 flex flex-col gap-1">
            <div class="flex items-center justify-between">
                <label for="sentence-slider" class="text-xs text-slate-500 font-medium ml-1">드래그 또는 번호 입력으로 이동</label>
                <div class="flex items-center gap-1.5 text-xs text-slate-600 bg-slate-100 px-2 py-1 rounded-md">
                    <label for="jump-input" class="font-medium">No.</label>
                    <input type="number" id="jump-input" min="1" class="w-16 px-1 py-0.5 text-center bg-white border border-slate-300 rounded focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all text-slate-800 font-semibold" placeholder="1">
                    <span>/ <span id="jump-total">0</span></span>
                </div>
            </div>
            <div class="relative w-full mt-1">
                <!-- Context Tooltip -->
                <div id="slider-tooltip" class="hidden absolute bottom-full mb-3 left-0 transform -translate-x-1/2 bg-slate-800 text-white p-4 rounded-xl shadow-xl w-80 z-50 pointer-events-none transition-opacity duration-150">
                    <p id="tt-prev" class="text-xs text-slate-400 line-clamp-2 mb-2 opacity-80 hidden"></p>
                    <p id="tt-curr" class="text-sm font-bold text-emerald-400 line-clamp-3 leading-relaxed"></p>
                    <p id="tt-next" class="text-xs text-slate-400 line-clamp-2 mt-2 opacity-80 hidden"></p>
                    <!-- Arrow pointer -->
                    <div class="absolute top-full left-1/2 transform -translate-x-1/2 w-0 h-0 border-l-[8px] border-r-[8px] border-t-[8px] border-l-transparent border-r-transparent border-t-slate-800"></div>
                </div>
                <input type="range" id="sentence-slider" min="0" max="0" value="0" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600 outline-none focus:ring-2 focus:ring-indigo-300 transition-all">
            </div>
        </div>

        <!-- Controls -->
        <div class="flex flex-wrap items-center justify-between mt-2 gap-4">
            <button id="prev-btn" class="px-6 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium rounded-lg transition-colors flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                <i class="fas fa-arrow-left"></i> 이전 문장
            </button>

            <button id="export-btn" class="px-6 py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-medium rounded-lg transition-colors flex items-center gap-2">
                <i class="fas fa-download"></i> 번역본 내보내기
            </button>

            <button id="next-btn" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition-colors flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                다음 문장 <i class="fas fa-arrow-right"></i>
            </button>
        </div>
    </div>

</main>

<!-- Word Tooltip -->
<div id="word-tooltip" class="hidden absolute z-50 bg-white border border-slate-200 shadow-xl rounded-lg p-3 w-64 text-sm transition-opacity">
    <div class="flex justify-between items-start mb-2 border-b border-slate-100 pb-2">
        <strong id="wt-word" class="text-indigo-600 text-base font-bold"></strong>
        <button id="wt-ignore-btn" class="text-xs px-2 py-1 bg-slate-100 text-slate-500 hover:text-red-500 hover:bg-red-50 rounded transition-colors"><i class="fas fa-ban"></i> 무시</button>
    </div>
    <div id="wt-meaning" class="text-slate-700 min-h-[40px] flex items-center text-sm leading-relaxed">
    </div>
</div>

<script>
    // --- State Management ---
    const apiKey = ""; // API Key injected by environment
    let sentences = [];
    let userTranslations = [];
    let aiTranslations = {}; // Cache: { index: "translation" }
    let currentIndex = 0;

    // Word Dictionary State
    const defaultStopWords = ['a', 'an', 'the', 'is', 'are', 'was', 'were', 'am', 'be', 'been', 'being', 'in', 'on', 'at', 'to', 'for', 'of', 'and', 'or', 'but', 'as', 'it', 'this', 'that', 'with', 'by', 'from', 'i', 'you', 'he', 'she', 'they', 'we', 'my', 'your', 'his', 'her', 'their', 'our', 'me', 'him', 'them', 'us', 'do', 'does', 'did', 'have', 'has', 'had'];
    let ignoredWords = new Set(JSON.parse(localStorage.getItem('ignoredWords')) || defaultStopWords);
    let wordCache = {};
    let currentTooltipWord = "";

    // --- DOM Elements ---
    const fileInput = document.getElementById('file-upload');
    const uploadError = document.getElementById('upload-error');
    const uploadScreen = document.getElementById('upload-screen');
    const workspaceScreen = document.getElementById('workspace-screen');

    const progressContainer = document.getElementById('progress-container');
    const currentCountEl = document.getElementById('current-count');
    const totalCountEl = document.getElementById('total-count');

    const originalTextEl = document.getElementById('original-text');
    const aiTextEl = document.getElementById('ai-text');
    const aiLoadingEl = document.getElementById('ai-loading');
    const retryAiBtn = document.getElementById('retry-ai-btn');
    const userTranslationEl = document.getElementById('user-translation');

    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const exportBtn = document.getElementById('export-btn');
    const sentenceSlider = document.getElementById('sentence-slider');

    const jumpInput = document.getElementById('jump-input');
    const jumpTotal = document.getElementById('jump-total');

    const sliderTooltip = document.getElementById('slider-tooltip');
    const ttPrev = document.getElementById('tt-prev');
    const ttCurr = document.getElementById('tt-curr');
    const ttNext = document.getElementById('tt-next');

    const wordTooltip = document.getElementById('word-tooltip');
    const wtWord = document.getElementById('wt-word');
    const wtMeaning = document.getElementById('wt-meaning');
    const wtIgnoreBtn = document.getElementById('wt-ignore-btn');

    // --- Event Listeners ---
    fileInput.addEventListener('change', handleFileUpload);
    prevBtn.addEventListener('click', goPrev);
    nextBtn.addEventListener('click', goNext);
    exportBtn.addEventListener('click', exportTranslation);
    userTranslationEl.addEventListener('input', saveCurrentTranslation);
    retryAiBtn.addEventListener('click', () => fetchAITranslation(currentIndex, true));

    // 드래그 중 툴팁 표시 및 업데이트
    sentenceSlider.addEventListener('input', handleSliderInput);
    // 드래그 완료 시 페이지 정보 갱신
    sentenceSlider.addEventListener('change', handleSliderChange);
    // 슬라이더 포커스 아웃 시 툴팁 숨김
    sentenceSlider.addEventListener('blur', () => sliderTooltip.classList.add('hidden'));

    // 인덱스 직접 입력 이벤트
    jumpInput.addEventListener('input', handleJumpInput);
    jumpInput.addEventListener('change', handleJumpChange);
    jumpInput.addEventListener('focus', () => {
        if (sentences.length > 0) handleSliderInput({ target: sentenceSlider });
    });
    jumpInput.addEventListener('blur', () => sliderTooltip.classList.add('hidden'));

    // Enter key in textarea saves and goes to next (if ctrl/cmd is pressed to avoid newline prevention)
    userTranslationEl.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            goNext();
        }
    });

    // 툴팁 외부 클릭 시 닫기
    document.addEventListener('click', (e) => {
        if (!wordTooltip.contains(e.target) && !e.target.classList.contains('word-clickable')) {
            wordTooltip.classList.add('hidden');
        }
    });

    // 단어 무시 버튼 이벤트
    wtIgnoreBtn.addEventListener('click', () => {
        if (currentTooltipWord) {
            ignoredWords.add(currentTooltipWord.toLowerCase());
            localStorage.setItem('ignoredWords', JSON.stringify([...ignoredWords])); // 브라우저에 무시 단어 저장
            wordTooltip.classList.add('hidden');
            renderOriginalText(sentences[currentIndex]); // 다시 렌더링하여 하이라이트 제거
        }
    });

    // --- Functions ---

    function handleJumpInput(e) {
        let val = parseInt(e.target.value, 10);
        if (isNaN(val)) return;

        // 1부터 시작하는 인덱스를 0부터 시작하는 배열 인덱스로 변환
        let index = val - 1;
        index = Math.max(0, Math.min(index, sentences.length - 1)); // 범위를 벗어나지 않게 보정

        // 슬라이더 값을 동기화하고 기존 슬라이더 툴팁 로직을 재사용하여 문맥 미리보기 제공
        sentenceSlider.value = index;
        handleSliderInput({ target: sentenceSlider });
    }

    function handleJumpChange(e) {
        let val = parseInt(e.target.value, 10);
        if (isNaN(val)) {
            // 숫자가 아닌 값을 입력하고 포커스를 잃으면 현재 위치로 원복
            e.target.value = currentIndex + 1;
            sliderTooltip.classList.add('hidden');
            return;
        }

        let index = val - 1;
        index = Math.max(0, Math.min(index, sentences.length - 1));

        e.target.value = index + 1;
        sentenceSlider.value = index;

        sliderTooltip.classList.add('hidden');
        saveCurrentTranslation();
        currentIndex = index;
        loadSentence(currentIndex);
    }

    function handleSliderInput(e) {
        const index = parseInt(e.target.value, 10);

        // 툴팁 텍스트 세팅
        if (index > 0) {
            ttPrev.textContent = sentences[index - 1];
            ttPrev.classList.remove('hidden');
        } else {
            ttPrev.classList.add('hidden');
        }

        ttCurr.textContent = sentences[index];

        if (index < sentences.length - 1) {
            ttNext.textContent = sentences[index + 1];
            ttNext.classList.remove('hidden');
        } else {
            ttNext.classList.add('hidden');
        }

        // 툴팁 위치 계산 (썸 위치에 비례하여 동적 이동)
        const max = sentences.length - 1;
        const percent = max > 0 ? index / max : 0;
        const thumbWidth = 16; // 네이티브 썸의 대략적인 너비
        const offset = (0.5 - percent) * thumbWidth; // 양 끝단 오차 보정

        sliderTooltip.style.left = `calc(${percent * 100}% + ${offset}px)`;
        sliderTooltip.classList.remove('hidden');
    }

    function handleSliderChange(e) {
        sliderTooltip.classList.add('hidden'); // 드래그 완료 후 툴팁 숨김
        saveCurrentTranslation();
        currentIndex = parseInt(e.target.value, 10);
        loadSentence(currentIndex);
    }

    function handleFileUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        if (file.type !== "text/plain") {
            uploadError.textContent = "텍스트(.txt) 파일만 업로드 가능합니다.";
            uploadError.classList.remove('hidden');
            return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
            const text = e.target.result;
            processText(text);
        };
        reader.onerror = () => {
            uploadError.textContent = "파일을 읽는 중 오류가 발생했습니다.";
            uploadError.classList.remove('hidden');
        };
        reader.readAsText(file);
    }

    function processText(text) {
        // 브라우저의 Intl.Segmenter를 사용하여 문장 단위로 정확하게 분리
        try {
            const segmenter = new Intl.Segmenter(undefined, { granularity: 'sentence' });
            const segments = segmenter.segment(text);
            sentences = Array.from(segments)
                .map(seg => seg.segment.trim())
                .filter(seg => seg.length > 0); // 빈 문장 제거
        } catch (e) {
            // Intl.Segmenter 미지원 브라우저 폴백 (정규식 사용)
            sentences = text.split(/(?<=[.?!])\s+/).map(s => s.trim()).filter(s => s.length > 0);
        }

        if (sentences.length === 0) {
            uploadError.textContent = "파일에 읽을 수 있는 문장이 없습니다.";
            uploadError.classList.remove('hidden');
            return;
        }

        // 초기화
        userTranslations = new Array(sentences.length).fill('');
        aiTranslations = {};
        currentIndex = 0;

        // UI 전환
        uploadScreen.classList.add('hidden');
        workspaceScreen.classList.remove('hidden');
        workspaceScreen.classList.add('flex');
        progressContainer.classList.remove('hidden');
        totalCountEl.textContent = sentences.length;
        sentenceSlider.max = sentences.length - 1;
        jumpTotal.textContent = sentences.length;
        jumpInput.max = sentences.length;

        loadSentence(currentIndex);
    }

    function loadSentence(index) {
        currentCountEl.textContent = index + 1;
        renderOriginalText(sentences[index]);
        userTranslationEl.value = userTranslations[index] || '';
        sentenceSlider.value = index;
        jumpInput.value = index + 1;

        wordTooltip.classList.add('hidden'); // 문장 이동 시 단어 툴팁 닫기

        // 버튼 상태 업데이트
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === sentences.length - 1;

        // AI 번역 가져오기
        fetchAITranslation(index);

        // 텍스트 영역에 포커스
        userTranslationEl.focus();
    }

    function renderOriginalText(text) {
        originalTextEl.innerHTML = '';
        // Intl.Segmenter를 사용하여 문장을 단어 단위로 분해
        const segmenter = new Intl.Segmenter(undefined, { granularity: 'word' });
        const segments = segmenter.segment(text);

        for (const seg of segments) {
            if (seg.isWordLike) {
                const wordLower = seg.segment.toLowerCase();
                if (ignoredWords.has(wordLower)) {
                    // 무시 목록에 있는 단어는 일반 텍스트로 처리
                    originalTextEl.appendChild(document.createTextNode(seg.segment));
                } else {
                    // 클릭 가능한 단어 스타일링
                    const span = document.createElement('span');
                    span.textContent = seg.segment;
                    span.className = 'word-clickable cursor-pointer text-indigo-700 border-b-2 border-dotted border-indigo-300 hover:bg-indigo-100 hover:border-indigo-500 transition-colors rounded px-0.5 mx-px';
                    span.addEventListener('click', (e) => showWordTooltip(e, seg.segment));
                    originalTextEl.appendChild(span);
                }
            } else {
                originalTextEl.appendChild(document.createTextNode(seg.segment));
            }
        }
    }

    async function showWordTooltip(e, word) {
        e.stopPropagation();
        currentTooltipWord = word;

        // 클릭된 단어 주변에 툴팁 배치 (화면 우측을 벗어나지 않도록 보정)
        const rect = e.target.getBoundingClientRect();
        wordTooltip.style.left = `${Math.min(rect.left + window.scrollX, window.innerWidth - 270)}px`;
        wordTooltip.style.top = `${rect.bottom + window.scrollY + 8}px`;

        wtWord.textContent = word;
        wordTooltip.classList.remove('hidden');

        const lowerWord = word.toLowerCase();

        // 캐싱된 뜻이 있는지 확인
        if (wordCache[lowerWord]) {
            wtMeaning.innerHTML = wordCache[lowerWord];
        } else {
            wtMeaning.innerHTML = `<i class="fas fa-circle-notch fa-spin text-indigo-400"></i><span class="ml-2 text-slate-500 text-xs">사전 의미를 찾는 중...</span>`;
            try {
                const meaning = await fetchWordMeaningFromAPI(word);
                wordCache[lowerWord] = meaning;
                // 사용자가 그 사이 다른 단어를 클릭하지 않았다면 뜻 업데이트
                if (currentTooltipWord === word) {
                    wtMeaning.innerHTML = meaning;
                }
            } catch (error) {
                if (currentTooltipWord === word) {
                    wtMeaning.innerHTML = `<span class="text-red-500 text-xs">뜻을 불러오지 못했습니다.</span>`;
                }
            }
        }
    }

    async function fetchWordMeaningFromAPI(word) {
        const delays = [1000, 2000, 4000]; // 단어 검색은 재시도 간격/횟수를 짧게 설정
        const promptText = `Provide a brief dictionary definition (in Korean) for the word: "${word}". Provide ONLY the Korean meaning, nothing else. Keep it under 20 characters if possible.`;

        for (let i = 0; i < 3; i++) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }]
                    })
                });

                if (!response.ok) throw new Error(`API HTTP Error`);
                const result = await response.json();
                const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!text) throw new Error("Empty response");
                return text.trim();
            } catch (error) {
                if (i === 2) throw error;
                await new Promise(r => setTimeout(r, delays[i]));
            }
        }
    }

    function saveCurrentTranslation() {
        userTranslations[currentIndex] = userTranslationEl.value;
    }

    function goPrev() {
        if (currentIndex > 0) {
            saveCurrentTranslation();
            currentIndex--;
            loadSentence(currentIndex);
        }
    }

    function goNext() {
        if (currentIndex < sentences.length - 1) {
            saveCurrentTranslation();
            currentIndex++;
            loadSentence(currentIndex);
        }
    }

    async function fetchAITranslation(index, forceRefresh = false) {
        const sentence = sentences[index];

        // 캐시 확인
        if (!forceRefresh && aiTranslations[index]) {
            showAITranslation(aiTranslations[index]);
            return;
        }

        // 로딩 UI 표시
        aiLoadingEl.classList.remove('hidden');
        aiTextEl.classList.add('hidden');
        retryAiBtn.classList.add('hidden');

        try {
            const translation = await apiCallWithBackoff(sentence);
            aiTranslations[index] = translation;
            // 사용자가 기다리는 동안 다른 문장으로 넘어가지 않았는지 확인
            if (currentIndex === index) {
                showAITranslation(translation);
            }
        } catch (error) {
            if (currentIndex === index) {
                showAITranslation("⚠️ AI 번역을 불러오는 데 실패했습니다.", true);
            }
        }
    }

    function showAITranslation(text, isError = false) {
        aiLoadingEl.classList.add('hidden');
        aiTextEl.classList.remove('hidden');
        aiTextEl.textContent = text;
        if (isError) {
            aiTextEl.classList.add('text-red-500');
            retryAiBtn.classList.remove('hidden');
        } else {
            aiTextEl.classList.remove('text-red-500');
            retryAiBtn.classList.add('hidden');
        }
    }

    // Gemini API 호출 (지수 백오프 적용)
    async function apiCallWithBackoff(text, retries = 5) {
        const delays = [1000, 2000, 4000, 8000, 16000];
        const promptText = `Translate the following text into natural Korean. Provide ONLY the translated result, without any quotes, explanations, or additional text:\n\n${text}`;

        for (let i = 0; i < retries; i++) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }],
                        systemInstruction: { parts: [{ text: "You are a highly skilled professional translator. You strictly return only the translated output." }] }
                    })
                });

                if (!response.ok) throw new Error(`API HTTP Error: ${response.status}`);

                const result = await response.json();
                const translatedText = result.candidates?.[0]?.content?.parts?.[0]?.text;

                if (!translatedText) throw new Error("Empty response from API");

                return translatedText.trim();

            } catch (error) {
                console.error(`Attempt ${i + 1} failed:`, error);
                if (i === retries - 1) throw error; // 마지막 시도 실패 시 에러 던짐
                await new Promise(r => setTimeout(r, delays[i]));
            }
        }
    }

    function exportTranslation() {
        saveCurrentTranslation(); // 현재 작성 중인 내용 저장

        // 번역이 없는 문장은 원본이나 빈칸 대신 번역된 문장들만 모아서 조립
        // 원한다면 번역이 비어있을 경우 원본 문장을 넣도록 처리할 수도 있습니다.
        let finalText = "";
        for (let i = 0; i < sentences.length; i++) {
            // 번역본이 있으면 번역본을, 없으면 원본을 출력 (사용자 편의)
            finalText += (userTranslations[i].trim() || sentences[i]) + "\n";
        }

        const blob = new Blob([finalText], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = "번역완료_문서.txt";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>
