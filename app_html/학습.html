<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 기술 면접 트레이너</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
        .hidden { display: none; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <div class="max-w-4xl mx-auto p-4 md:p-8">
        <!-- Header -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-slate-800 flex items-center justify-center gap-2">
                <i data-lucide="book-open" class="text-blue-600"></i>
                AI 기술 면접 트레이너
            </h1>
            <p class="text-slate-500 mt-2">AI 질문 또는 내 문서 분석으로 면접을 대비하세요.</p>
        </header>

        <!-- Error Toast -->
        <div id="error-toast" class="hidden mb-6 bg-red-50 border border-red-200 text-red-700 p-4 rounded-xl flex items-center justify-between animate-bounce">
            <div class="flex items-center gap-2 font-medium">
                <i data-lucide="alert-circle" class="w-5 h-5"></i>
                <span id="error-message"></span>
            </div>
            <button onclick="hideError()" class="p-1 hover:bg-red-100 rounded-full">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- Home View: Category Selection & File Upload -->
        <section id="view-home" class="animate-fade-in space-y-8">
            <div>
                <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
                    <i data-lucide="sparkles" class="w-5 h-5 text-blue-500"></i> AI 추천 질문 카테고리
                </h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="category-grid">
                    <!-- Categories injected via JS -->
                </div>
            </div>

            <!-- Custom File Upload Section -->
            <div id="file-upload-section" class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200 border-dashed transition-all">
                <div class="text-center" id="upload-ui">
                    <div class="bg-blue-50 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4">
                        <i data-lucide="file-text" class="text-blue-600 w-8 h-8"></i>
                    </div>
                    <h3 class="text-xl font-bold mb-2">내 문서 분석하여 질문 생성 (TXT)</h3>
                    <p class="text-slate-500 text-sm mb-6">공부한 노트나 텍스트 파일을 업로드하면<br>AI가 내용을 분석해 핵심 면접 질문 리스트를 만들어줍니다.</p>
                    
                    <label id="upload-label" class="inline-flex items-center px-6 py-3 bg-white border border-slate-300 rounded-xl font-semibold text-slate-700 hover:bg-slate-50 cursor-pointer transition-all shadow-sm">
                        <i data-lucide="upload" class="w-4 h-4 mr-2"></i>
                        파일 업로드 및 분석
                        <input type="file" id="file-input" class="hidden" accept=".txt" onchange="handleFileUpload(event)">
                    </label>
                </div>
                
                <!-- File Analyzing UI -->
                <div id="analyzing-ui" class="hidden text-center py-4">
                    <div class="flex flex-col items-center gap-4">
                        <i data-lucide="refresh-cw" class="w-10 h-10 text-blue-500 animate-spin"></i>
                        <div class="space-y-1">
                            <p class="font-bold text-lg">문서 분석 중...</p>
                            <p class="text-slate-500 text-sm">AI가 텍스트에서 핵심 면접 질문을 추출하고 있습니다.</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Interview View -->
        <section id="view-interview" class="hidden animate-fade-in">
            <div class="bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
                <div id="interview-header" class="p-6 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div id="category-icon-container" class="p-2 rounded-lg"></div>
                        <span id="category-name-display" class="font-bold text-lg">인터뷰</span>
                        <span id="relay-counter" class="hidden bg-slate-100 text-slate-600 px-3 py-1 rounded-full text-xs font-bold">1/10</span>
                    </div>
                    <button onclick="goHome()" class="p-2 hover:bg-black/5 rounded-full">
                        <i data-lucide="arrow-left" class="w-5 h-5"></i>
                    </button>
                </div>
                <div class="p-8">
                    <div class="mb-8">
                        <div class="flex items-center gap-2 mb-3">
                            <span id="question-tag" class="inline-block px-3 py-1 bg-blue-50 text-blue-600 text-xs font-bold rounded-full uppercase tracking-wider">AI Question</span>
                            <div id="q-loading-spinner" class="hidden"><i data-lucide="refresh-cw" class="w-4 h-4 text-blue-400 animate-spin"></i></div>
                        </div>
                        <h2 id="display-question" class="text-2xl font-bold leading-relaxed break-keep min-h-[3rem]"></h2>
                    </div>
                    
                    <textarea id="answer-input" placeholder="핵심 위주로 답변해보세요..." class="w-full h-48 p-5 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition-all resize-none mb-6"></textarea>

                    <div class="flex flex-col sm:flex-row gap-3">
                        <button id="btn-submit" onclick="evaluateAnswer()" class="flex-[2] bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-2 shadow-lg shadow-blue-100 active:scale-95 transition-all">
                            <i data-lucide="send" class="w-5 h-5"></i>
                            <span id="btn-submit-text">답변 제출하고 채점하기</span>
                        </button>
                        <button id="btn-regen" onclick="regenerateQuestion()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-4 rounded-2xl flex items-center justify-center gap-2 transition-all">
                            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                            다른 질문 받기
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Result View -->
        <section id="view-result" class="hidden space-y-6 animate-fade-in">
            <div class="bg-white rounded-3xl shadow-xl border border-slate-100 p-8 text-center relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-400 via-purple-400 to-emerald-400"></div>
                <div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-blue-50 text-blue-600 mb-4 ring-8 ring-blue-50/50">
                    <i data-lucide="trophy" class="w-10 h-10"></i>
                </div>
                <h2 id="display-score" class="text-5xl font-black text-slate-800 mb-2">0점</h2>
                <p class="text-slate-500 font-medium italic" id="score-comment">"실무 핵심을 잘 짚으셨네요!"</p>
                
                <div class="mt-8 grid grid-cols-1 md:grid-cols-2 gap-4 text-left">
                    <div class="bg-emerald-50 p-6 rounded-2xl border border-emerald-100">
                        <h4 class="flex items-center gap-2 text-emerald-700 font-bold mb-3">
                            <i data-lucide="message-square" class="w-4 h-4"></i> 긍정적인 평가
                        </h4>
                        <p id="display-strengths" class="text-slate-700 text-sm leading-relaxed whitespace-pre-wrap"></p>
                    </div>
                    <div class="bg-orange-50 p-6 rounded-2xl border border-orange-100">
                        <h4 class="flex items-center gap-2 text-orange-700 font-bold mb-3">
                            <i data-lucide="refresh-cw" class="w-4 h-4"></i> 조금 더 보완한다면?
                        </h4>
                        <p id="display-weaknesses" class="text-slate-700 text-sm leading-relaxed whitespace-pre-wrap"></p>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-3xl shadow-md border border-slate-100 p-8">
                <h3 class="text-xl font-bold mb-4 flex items-center gap-2">
                    <div class="w-1 h-6 bg-blue-600 rounded-full"></div>
                    참고하면 좋은 내용
                </h3>
                <div id="display-ideal" class="bg-slate-50 p-6 rounded-2xl text-slate-700 leading-relaxed border border-slate-100 italic"></div>
            </div>

            <div class="flex gap-4">
                <button id="btn-next" onclick="nextAction()" class="flex-1 py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-2xl shadow-lg shadow-blue-200 transition-all active:scale-95 flex items-center justify-center gap-2">
                    <i data-lucide="sparkles" class="w-5 h-5"></i>
                    <span id="btn-next-text">다음 질문 도전</span>
                </button>
                <button onclick="goHome()" class="flex-1 py-4 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-2xl transition-all">홈으로</button>
            </div>
        </section>
    </div>

    <script>
        // --- Configuration & Data ---
        const apiKey = ""; 
        const categories = [
            { id: 'JAVA', name: 'JAVA', icon: 'coffee', color: 'bg-orange-100 text-orange-600' },
            { id: 'Spring', name: 'Spring', icon: 'layers', color: 'bg-green-100 text-green-600' },
            { id: 'ORM', name: 'ORM', icon: 'database', color: 'bg-blue-100 text-blue-600' },
            { id: 'OS', name: 'OS', icon: 'cpu', color: 'bg-purple-100 text-purple-600' },
            { id: 'DB', name: 'DB', icon: 'database', color: 'bg-indigo-100 text-indigo-600' },
            { id: 'Network', name: 'Network', icon: 'network', color: 'bg-rose-100 text-rose-600' },
        ];

        let state = {
            selectedCategory: null,
            currentQuestion: "",
            isProcessing: false,
            // Custom Relay State
            isRelayMode: false,
            relayQuestions: [],
            relayIndex: 0
        };

        async function fetchAI(prompt, systemInstruction, responseMimeType = "text/plain") {
            let retries = 0;
            const maxRetries = 5;
            
            const body = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: systemInstruction }] }
            };

            if (responseMimeType === "application/json") {
                body.generationConfig = { responseMimeType: "application/json" };
            }

            while (retries < maxRetries) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });

                    if (response.ok) {
                        const data = await response.json();
                        return data.candidates?.[0]?.content?.parts?.[0]?.text;
                    }
                } catch (e) {
                    console.error("Fetch attempt failed", e);
                }
                const delay = Math.pow(2, retries) * 1000;
                await new Promise(res => setTimeout(res, delay));
                retries++;
            }
            throw new Error("AI 연결 실패");
        }

        // --- TXT File Analysis Logic ---

        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const text = e.target.result;
                if (!text.trim()) {
                    showError("파일 내용이 비어 있습니다.");
                    return;
                }

                setAnalyzingUI(true);
                try {
                    const systemPrompt = `You are a technical interview preparation expert. 
                    Analyze the provided text and extract/generate 5 meaningful technical interview questions in Korean.
                    Focus on the core concepts found in the text.
                    Return the result ONLY as a JSON array of strings.
                    Example: ["질문1", "질문2", "질문3", "질문4", "질문5"]`;

                    const rawResponse = await fetchAI(text, systemPrompt, "application/json");
                    const cleaned = rawResponse.replace(/```json/g, "").replace(/```/g, "").trim();
                    const questions = JSON.parse(cleaned);

                    if (!Array.isArray(questions) || questions.length === 0) {
                        throw new Error("질문을 추출할 수 없습니다.");
                    }

                    startRelay(questions);
                } catch (err) {
                    showError("문서 분석 중 오류가 발생했습니다: " + err.message);
                } finally {
                    setAnalyzingUI(false);
                }
            };
            reader.readAsText(file);
        }

        function setAnalyzingUI(isAnalyzing) {
            const uploadUI = document.getElementById('upload-ui');
            const analyzingUI = document.getElementById('analyzing-ui');
            const section = document.getElementById('file-upload-section');

            if (isAnalyzing) {
                uploadUI.classList.add('hidden');
                analyzingUI.classList.remove('hidden');
                section.classList.add('border-blue-300', 'bg-blue-50/30');
            } else {
                uploadUI.classList.remove('hidden');
                analyzingUI.classList.add('hidden');
                section.classList.remove('border-blue-300', 'bg-blue-50/30');
            }
            lucide.createIcons();
        }

        function startRelay(questions) {
            state.isRelayMode = true;
            state.relayQuestions = questions;
            state.relayIndex = 0;
            state.selectedCategory = { id: 'CUSTOM', name: '문서 분석', icon: 'file-text', color: 'bg-blue-100 text-blue-600' };
            
            showView('interview');
            loadRelayQuestion();
        }

        function loadRelayQuestion() {
            if (state.relayIndex >= state.relayQuestions.length) {
                showError("모든 질문 릴레이가 끝났습니다!");
                goHome();
                return;
            }

            const currentQ = state.relayQuestions[state.relayIndex];
            state.currentQuestion = currentQ;
            
            updateInterviewHeader(state.selectedCategory);
            document.getElementById('question-tag').innerText = "Document Question";
            document.getElementById('display-question').innerText = currentQ;
            document.getElementById('answer-input').value = "";
            
            const counter = document.getElementById('relay-counter');
            counter.classList.remove('hidden');
            counter.innerText = `${state.relayIndex + 1} / ${state.relayQuestions.length}`;
            
            document.getElementById('btn-regen').classList.add('hidden');
        }

        function nextAction() {
            if (state.isRelayMode) {
                state.relayIndex++;
                if (state.relayIndex >= state.relayQuestions.length) {
                    goHome();
                } else {
                    showView('interview');
                    loadRelayQuestion();
                }
            } else {
                generateQuestion(state.selectedCategory);
            }
        }

        // --- Standard Logic ---

        async function generateQuestion(category) {
            if (state.isProcessing) return;
            state.isProcessing = true;
            state.isRelayMode = false;
            state.selectedCategory = category;
            
            showView('interview');
            updateInterviewHeader(category);
            document.getElementById('relay-counter').classList.add('hidden');
            document.getElementById('question-tag').innerText = "AI Question";
            document.getElementById('display-question').innerText = "";
            document.getElementById('q-loading-spinner').classList.remove('hidden');
            document.getElementById('answer-input').value = "";
            document.getElementById('btn-regen').classList.remove('hidden');
            document.getElementById('btn-next-text').innerText = "다음 질문 도전";

            const system = `You are a professional and encouraging technical interviewer. 
            Generate ONE simple, fundamental interview question in Korean for: ${category.name}. 
            Focus on concepts that show general understanding. Output only question text.`;
            
            try {
                const question = await fetchAI(`Question for ${category.name}`, system);
                state.currentQuestion = question.trim();
                document.getElementById('display-question').innerText = state.currentQuestion;
            } catch (err) {
                showError("질문 생성 실패");
                goHome();
            } finally {
                document.getElementById('q-loading-spinner').classList.add('hidden');
                state.isProcessing = false;
            }
        }

        async function evaluateAnswer() {
            const answer = document.getElementById('answer-input').value.trim();
            if (!answer || state.isProcessing) return;

            state.isProcessing = true;
            setLoadingState(true);
            hideError();

            const system = `You are a supportive, practical technical interviewer. 
            Analyze the Korean answer to: "${state.currentQuestion}". 
            
            CRITICAL RULES:
            1. Be generous with scoring. If the user explains the "core concept" correctly in simple terms, give a high score (80+). 
            2. Provide: score (number 0-100), strengths (string), weaknesses (string), idealAnswer (string).
            Respond ONLY in JSON.`;

            try {
                const rawResult = await fetchAI(`Answer: ${answer}`, system, "application/json");
                const cleaned = rawResult.replace(/```json/g, "").replace(/```/g, "").trim();
                const feedback = JSON.parse(cleaned);
                displayResult(feedback);
            } catch (err) {
                showError("채점 오류 발생");
            } finally {
                setLoadingState(false);
                state.isProcessing = false;
            }
        }

        // --- UI Helpers ---

        function initCategories() {
            const grid = document.getElementById('category-grid');
            grid.innerHTML = "";
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = "bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:border-blue-400 hover:shadow-md transition-all group text-left";
                btn.innerHTML = `
                    <div class="${cat.color} w-10 h-10 rounded-lg flex items-center justify-center mb-3">
                        <i data-lucide="${cat.icon}" class="w-5 h-5"></i>
                    </div>
                    <h3 class="text-lg font-bold mb-1">${cat.name}</h3>
                    <p class="text-xs text-slate-500 mb-4">AI 핵심 질문 연습</p>
                    <div class="flex items-center text-blue-600 font-semibold text-xs">
                        시작하기 <i data-lucide="chevron-right" class="w-3 h-3 ml-1 group-hover:translate-x-1 transition-transform"></i>
                    </div>
                `;
                btn.onclick = () => generateQuestion(cat);
                grid.appendChild(btn);
            });
            lucide.createIcons();
        }

        function showView(viewId) {
            ['view-home', 'view-interview', 'view-result'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(`view-${viewId}`).classList.remove('hidden');
        }

        function updateInterviewHeader(cat) {
            const container = document.getElementById('category-icon-container');
            container.className = `p-2 rounded-lg ${cat.color}`;
            container.innerHTML = `<i data-lucide="${cat.icon}" class="w-5 h-5"></i>`;
            document.getElementById('category-name-display').innerText = `${cat.name} 인터뷰`;
            lucide.createIcons();
        }

        function setLoadingState(loading) {
            const btn = document.getElementById('btn-submit');
            const text = document.getElementById('btn-submit-text');
            if (loading) {
                btn.disabled = true;
                btn.classList.add('opacity-70');
                text.innerText = "답변 분석 중...";
            } else {
                btn.disabled = false;
                btn.classList.remove('opacity-70');
                text.innerText = "답변 제출하고 채점하기";
            }
        }

        function displayResult(feedback) {
            document.getElementById('display-score').innerText = `${feedback.score}점`;
            document.getElementById('display-strengths').innerText = feedback.strengths;
            document.getElementById('display-weaknesses').innerText = feedback.weaknesses;
            document.getElementById('display-ideal').innerText = feedback.idealAnswer;
            
            const comment = document.getElementById('score-comment');
            if (feedback.score >= 80) comment.innerText = '"핵심을 꿰뚫는 답변입니다!"';
            else if (feedback.score >= 60) comment.innerText = '"중요한 포인트를 잘 알고 계시네요."';
            else comment.innerText = '"조금만 더 핵심을 정리해보면 좋겠어요."';

            const nextBtnText = document.getElementById('btn-next-text');
            if (state.isRelayMode) {
                nextBtnText.innerText = (state.relayIndex + 1 >= state.relayQuestions.length) ? "인터뷰 종료" : "다음 분석 질문";
            } else {
                nextBtnText.innerText = "다음 질문 도전";
            }

            showView('result');
            lucide.createIcons();
        }

        function showError(msg) {
            document.getElementById('error-message').innerText = msg;
            document.getElementById('error-toast').classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('error-toast').classList.add('hidden');
        }

        function goHome() {
            showView('home');
            state.selectedCategory = null;
            state.currentQuestion = "";
            state.isRelayMode = false;
            document.getElementById('file-input').value = "";
            setAnalyzingUI(false);
        }

        function regenerateQuestion() {
            if (state.selectedCategory && !state.isRelayMode) {
                generateQuestion(state.selectedCategory);
            }
        }

        window.onload = initCategories;
    </script>
</body>
</html>
