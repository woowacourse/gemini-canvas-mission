<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>매일매일 두뇌 트레이닝</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 3D 카드 뒤집기 애니메이션용 CSS */
    .preserve-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
    
    /* 기본 모바일 터치 하이라이트 제거 */
    * { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen">

  <!-- 메인 앱 컨테이너 -->
  <div id="app" class="w-full h-full">
    
    <!-- 1. 달력 뷰 -->
    <div id="calendar-view" class="flex flex-col items-center p-4 pb-10 w-full min-h-screen">
      <div class="w-full max-w-md mt-6 mb-8 text-center space-y-2">
        <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">두뇌 트레이닝</h1>
        <p class="text-slate-500">매일매일 무작위 퍼즐로 뇌를 깨워보세요!</p>
      </div>

      <div class="w-full max-w-md mb-6">
        <div 
          onclick="window.playToday()"
          class="w-full bg-indigo-600 py-5 rounded-3xl shadow-lg shadow-indigo-200 flex flex-col items-center justify-center cursor-pointer hover:bg-indigo-700 transition-colors active:scale-95 text-white"
        >
          <div id="today-btn-content" class="flex flex-col items-center pointer-events-none">
             <!-- JS에서 상태에 따라 내용 삽입 -->
          </div>
        </div>
      </div>

      <!-- 달력 UI -->
      <div class="bg-white rounded-3xl p-5 sm:p-6 shadow-sm border border-slate-100 max-w-md w-full mx-auto">
        <div class="flex items-center justify-between mb-6">
          <button onclick="window.changeMonth(-1)" class="p-2 hover:bg-slate-100 rounded-full transition-colors">
            <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
          </button>
          <h2 id="calendar-month-title" class="text-xl font-bold text-slate-800"></h2>
          <button onclick="window.changeMonth(1)" class="p-2 hover:bg-slate-100 rounded-full transition-colors">
            <svg class="w-5 h-5 text-slate-600 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
          </button>
        </div>
        <div class="grid grid-cols-7 gap-1 sm:gap-2 mb-2">
          <div class="text-center text-xs font-semibold text-slate-400 py-2">일</div>
          <div class="text-center text-xs font-semibold text-slate-400 py-2">월</div>
          <div class="text-center text-xs font-semibold text-slate-400 py-2">화</div>
          <div class="text-center text-xs font-semibold text-slate-400 py-2">수</div>
          <div class="text-center text-xs font-semibold text-slate-400 py-2">목</div>
          <div class="text-center text-xs font-semibold text-slate-400 py-2">금</div>
          <div class="text-center text-xs font-semibold text-slate-400 py-2">토</div>
        </div>
        <div id="calendar-grid" class="grid grid-cols-7 gap-1 sm:gap-2">
          <!-- JS에서 동적 렌더링 -->
        </div>
      </div>
    </div>

    <!-- 2. 게임 뷰 -->
    <div id="game-view" class="hidden flex-col h-full min-h-screen bg-slate-50 w-full relative">
      <div class="bg-white shadow-sm p-4 flex items-center justify-between sticky top-0 z-10">
        <button onclick="window.goBack()" class="p-2 hover:bg-slate-100 rounded-full text-slate-600 transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <div class="text-center">
          <h2 id="game-title" class="text-lg font-bold text-slate-800">게임 이름</h2>
          <p id="game-date" class="text-xs text-slate-500">YYYY-MM-DD</p>
        </div>
        <div class="w-10"></div>
      </div>

      <div class="flex-1 flex flex-col items-center justify-center p-4">
        <div class="flex items-center justify-between w-full max-w-md mb-6 bg-white p-3 rounded-2xl shadow-sm border border-slate-100">
          <div class="flex items-center text-slate-700 font-mono text-xl font-semibold px-2">
            <svg class="w-5 h-5 mr-2 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6l4 2"></path></svg>
            <span id="timer-display">0:00</span>
          </div>
          <button onclick="window.restartGame()" class="flex items-center px-3 py-1.5 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors">
            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3v5h5"></path></svg>
            다시시작
          </button>
        </div>

        <div id="game-container" class="w-full max-w-md bg-white p-4 sm:p-6 rounded-3xl shadow-sm border border-slate-100 min-h-[400px] flex flex-col items-center justify-center overflow-hidden">
          <!-- 게임 보드 영역 -->
        </div>
      </div>
    </div>

    <!-- 3. 성공 모달 -->
    <div id="win-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
      <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl transition-transform transform scale-95 duration-300" id="win-modal-box">
        <div class="w-20 h-20 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-6">
          <svg class="w-10 h-10 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M19 3v4M5 11h14M5 11a7 7 0 0 0 14 0M5 11c0 3.866 3.134 7 7 7s7-3.134 7-7M9 21h6M12 18v3"></path></svg>
        </div>
        <h3 class="text-2xl font-bold text-slate-800 mb-2">성공!</h3>
        <p class="text-slate-600 mb-6">오늘의 두뇌 트레이닝을 완료했습니다.</p>
        <div class="bg-slate-50 rounded-2xl p-4 mb-8">
          <p class="text-sm text-slate-500 mb-1">소요 시간</p>
          <p id="win-time" class="text-3xl font-mono font-bold text-slate-800">0:00</p>
        </div>
        <button onclick="window.closeWinModal()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition-colors shadow-lg shadow-indigo-200">
          달력으로 돌아가기
        </button>
      </div>
    </div>

  </div>

  <script type="module">
    // --- Firebase Initialization (RULE 3 준수) ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

    // --- 글로벌 상태 관리 (State) ---
    const state = {
      user: null,
      progressData: {},
      currentView: 'calendar', // 'calendar' | 'game'
      selectedDate: null,
      currentMonth: new Date(),
      todayStr: '',
      
      // Game State
      gameInfo: null,
      timer: null,
      timeElapsed: 0,
      isPlaying: false,
      gameWon: false,
      gameData: {} // 게임별 내부 상태 저장
    };

    // --- 유틸리티 함수 ---
    function mulberry32(a) {
      return function () {
        var t = a += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      }
    }

    const getLocalYYYYMMDD = (date) => {
      const yyyy = date.getFullYear();
      const mm = String(date.getMonth() + 1).padStart(2, '0');
      const dd = String(date.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    };

    const formatTime = (seconds) => {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return `${m}:${s.toString().padStart(2, '0')}`;
    };

    const shuffleArray = (array, rand) => {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    };

    state.todayStr = getLocalYYYYMMDD(new Date());

    const GAME_TYPES = [
      { id: 'minesweeper', name: '지뢰찾기' },
      { id: 'nonogram', name: '네모네모 로직' },
      { id: 'memory', name: '기억력 짝맞추기' },
      { id: 'sudoku', name: '스도쿠' }
    ];

    const getGameTypeForDate = (dateStr) => {
      const seed = parseInt(dateStr.replace(/-/g, ''), 10);
      const random = mulberry32(seed);
      const index = Math.floor(random() * GAME_TYPES.length);
      return GAME_TYPES[index];
    };

    // --- 렌더링(UI 업데이트) 함수 모음 ---
    const renderApp = () => {
      if (state.currentView === 'calendar') {
        document.getElementById('calendar-view').classList.remove('hidden');
        document.getElementById('calendar-view').classList.add('flex');
        document.getElementById('game-view').classList.add('hidden');
        document.getElementById('game-view').classList.remove('flex');
        renderCalendarUI();
      } else {
        document.getElementById('calendar-view').classList.add('hidden');
        document.getElementById('calendar-view').classList.remove('flex');
        document.getElementById('game-view').classList.remove('hidden');
        document.getElementById('game-view').classList.add('flex');
        renderGameUI();
      }
    };

    const renderCalendarUI = () => {
      // 1. 오늘의 게임 버튼 상태
      const todayBtn = document.getElementById('today-btn-content');
      if (state.progressData[state.todayStr] && state.progressData[state.todayStr].completed) {
        todayBtn.innerHTML = `
          <svg class="w-8 h-8 sm:w-10 sm:h-10 mb-2 text-indigo-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          <p class="font-bold text-sm sm:text-base">오늘의 게임 완료됨</p>
        `;
      } else {
        todayBtn.innerHTML = `
          <svg class="w-8 h-8 sm:w-10 sm:h-10 mb-2 fill-white" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
          <p class="font-bold text-sm sm:text-base">오늘의 게임 시작하기</p>
        `;
      }

      // 2. 달력 헤더
      const year = state.currentMonth.getFullYear();
      const month = state.currentMonth.getMonth() + 1;
      document.getElementById('calendar-month-title').innerText = `${year}년 ${month}월`;

      // 3. 달력 그리드 생성
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';
      
      const daysInMonth = new Date(year, month, 0).getDate();
      const firstDayOfMonth = new Date(year, month - 1, 1).getDay();

      for (let i = 0; i < firstDayOfMonth; i++) {
        grid.innerHTML += `<div></div>`;
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isToday = dateStr === state.todayStr;
        const record = state.progressData[dateStr];
        const isFuture = new Date(dateStr) > new Date(state.todayStr);

        let classes = "relative flex flex-col items-center justify-center aspect-square rounded-2xl transition-all duration-200 ";
        let textClasses = "text-sm font-semibold z-10 ";
        let innerHtml = '';

        if (isFuture) {
          classes += "opacity-30 cursor-not-allowed bg-slate-50";
          textClasses += "text-slate-700";
        } else {
          classes += "cursor-pointer hover:scale-105 active:scale-95 ";
          if (isToday && !record) {
            classes += "bg-indigo-600 shadow-lg shadow-indigo-200";
            textClasses += "text-white";
          } else if (record) {
            classes += "bg-green-50 border border-green-100";
            textClasses += "text-green-700";
            innerHtml += `
              <div class="absolute inset-0 flex flex-col items-center justify-center opacity-20 pointer-events-none">
                <svg class="w-6 h-6 sm:w-8 sm:h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
              </div>
              <span class="text-[9px] sm:text-[10px] text-green-600 font-mono mt-1 absolute bottom-1">${formatTime(record.timeTaken)}</span>
            `;
          } else {
            classes += "bg-slate-50";
            textClasses += "text-slate-700";
          }
        }

        const clickHandler = isFuture ? '' : `onclick="window.openGame('${dateStr}')"`;
        grid.innerHTML += `
          <div ${clickHandler} class="${classes}">
            <span class="${textClasses}">${day}</span>
            ${innerHtml}
          </div>
        `;
      }
    };

    const updateTimerDisplay = () => {
      document.getElementById('timer-display').innerText = formatTime(state.timeElapsed);
    };

    const startTimer = () => {
      if (state.timer) clearInterval(state.timer);
      state.timer = setInterval(() => {
        if (state.isPlaying) {
          state.timeElapsed++;
          updateTimerDisplay();
        }
      }, 1000);
    };

    const stopTimer = () => {
      if (state.timer) clearInterval(state.timer);
      state.timer = null;
    };

    const renderGameUI = () => {
      document.getElementById('game-title').innerText = state.gameInfo.name;
      document.getElementById('game-date').innerText = state.selectedDate;
      updateTimerDisplay();

      const container = document.getElementById('game-container');
      container.innerHTML = '';

      if (state.gameInfo.id === 'minesweeper') renderMinesweeper(container);
      else if (state.gameInfo.id === 'nonogram') renderNonogram(container);
      else if (state.gameInfo.id === 'memory') renderMemory(container);
      else if (state.gameInfo.id === 'sudoku') renderSudoku(container);
    };

    // --- 개별 게임 로직 및 렌더링 ---

    // 1. 지뢰찾기
    const initMinesweeper = () => {
      const size = 8, totalMines = 10;
      const seed = parseInt(state.selectedDate.replace(/-/g, ''), 10) + 1;
      const rand = mulberry32(seed);
      
      let board = Array(size).fill(null).map(() => Array(size).fill({ isMine: false, revealed: false, flagged: false, neighborMines: 0 }));
      board = JSON.parse(JSON.stringify(board));
      let minesPlaced = 0;
      while (minesPlaced < totalMines) {
        const r = Math.floor(rand() * size);
        const c = Math.floor(rand() * size);
        if (!board[r][c].isMine) { board[r][c].isMine = true; minesPlaced++; }
      }
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (!board[r][c].isMine) {
            let count = 0;
            for (let i = -1; i <= 1; i++) {
              for (let j = -1; j <= 1; j++) {
                if (r+i>=0 && r+i<size && c+j>=0 && c+j<size && board[r+i][c+j].isMine) count++;
              }
            }
            board[r][c].neighborMines = count;
          }
        }
      }
      state.gameData = { board, size, gameOver: false };
    };

    const renderMinesweeper = (container) => {
      const { board, size, gameOver } = state.gameData;
      let html = `<div class="flex flex-col items-center select-none touch-none w-full">
                    <div class="bg-gray-200 p-2 rounded-lg inline-block shadow-inner overflow-x-auto max-w-full">`;
      for (let r = 0; r < size; r++) {
        html += `<div class="flex">`;
        for (let c = 0; c < size; c++) {
          const cell = board[r][c];
          let classes = `w-9 h-9 sm:w-10 sm:h-10 flex items-center justify-center border text-base sm:text-lg font-bold cursor-pointer transition-colors shrink-0 `;
          let content = '';
          
          if (cell.revealed) {
            if (cell.isMine) { classes += 'bg-red-500 border-red-600'; content = '💣'; }
            else { 
              classes += 'bg-white border-gray-300';
              if (cell.neighborMines > 0) {
                const colors = ['text-blue-600', 'text-green-600', 'text-red-600', 'text-purple-600', 'text-yellow-600'];
                const color = colors[cell.neighborMines - 1] || 'text-gray-800';
                content = `<span class="${color}">${cell.neighborMines}</span>`;
              }
            }
          } else {
            classes += 'bg-blue-400 border-blue-500 hover:bg-blue-300 active:bg-blue-600 shadow-sm';
            if (cell.flagged) content = '🚩';
          }
          
          html += `<div onclick="window.msClick(${r},${c})" oncontextmenu="window.msRightClick(event, ${r},${c})" class="${classes}">${content}</div>`;
        }
        html += `</div>`;
      }
      html += `</div>`;
      if (gameOver && !state.gameWon) {
        html += `<div class="mt-4 text-red-500 font-bold flex items-center gap-2 text-sm">앗, 지뢰를 밟았습니다! 다시시작 버튼을 눌러주세요.</div>`;
      }
      html += `</div>`;
      container.innerHTML = html;
    };

    window.msClick = (r, c) => {
      const data = state.gameData;
      if (data.gameOver || state.gameWon || data.board[r][c].revealed || data.board[r][c].flagged) return;

      if (data.board[r][c].isMine) {
        data.board.forEach(row => row.forEach(cell => { if(cell.isMine) cell.revealed = true; }));
        data.gameOver = true;
        renderGameUI();
        return;
      }

      const revealEmpty = (rr, cc) => {
        if (rr < 0 || rr >= data.size || cc < 0 || cc >= data.size || data.board[rr][cc].revealed || data.board[rr][cc].flagged) return;
        data.board[rr][cc].revealed = true;
        if (data.board[rr][cc].neighborMines === 0 && !data.board[rr][cc].isMine) {
          for (let i = -1; i <= 1; i++) {
            for (let j = -1; j <= 1; j++) { revealEmpty(rr + i, cc + j); }
          }
        }
      };
      revealEmpty(r, c);

      let unrevealedSafe = 0;
      data.board.forEach(row => row.forEach(cell => { if (!cell.isMine && !cell.revealed) unrevealedSafe++; }));
      if (unrevealedSafe === 0) triggerWin();
      renderGameUI();
    };

    window.msRightClick = (e, r, c) => {
      e.preventDefault();
      const data = state.gameData;
      if (data.gameOver || state.gameWon || data.board[r][c].revealed) return;
      data.board[r][c].flagged = !data.board[r][c].flagged;
      renderGameUI();
    };

    // 2. 네모네모 로직 (Nonogram)
    const initNonogram = () => {
      const size = 5;
      const seed = parseInt(state.selectedDate.replace(/-/g, ''), 10) + 2;
      const rand = mulberry32(seed);
      let tb = Array(size).fill(null).map(() => Array(size).fill(0));
      let filledCount = 0;
      while(filledCount < 5) {
        for(let r=0; r<size; r++) {
          for(let c=0; c<size; c++) {
            if (rand() > 0.5) { tb[r][c] = 1; filledCount++; } else { tb[r][c] = 0; }
          }
        }
      }
      const rClues = tb.map(row => {
        let clues = [], current = 0;
        row.forEach(cell => { if (cell === 1) current++; else if (current > 0) { clues.push(current); current = 0; } });
        if (current > 0) clues.push(current);
        return clues.length > 0 ? clues : [0];
      });
      const cClues = [];
      for(let c=0; c<size; c++) {
        let clues = [], current = 0;
        for(let r=0; r<size; r++) {
          if (tb[r][c] === 1) current++; else if (current > 0) { clues.push(current); current = 0; }
        }
        if (current > 0) clues.push(current);
        cClues.push(clues.length > 0 ? clues : [0]);
      }
      state.gameData = { target: tb, user: Array(size).fill(null).map(() => Array(size).fill(0)), rClues, cClues, size };
    };

    const renderNonogram = (container) => {
      const { user, rClues, cClues, size } = state.gameData;
      let html = `<div class="flex flex-col items-center select-none touch-none overflow-x-auto p-2 w-full">`;
      html += `<div class="flex"><div class="w-12 h-16 sm:w-16 sm:h-20"></div><div class="flex">`;
      cClues.forEach(group => {
        html += `<div class="w-10 h-16 sm:w-12 sm:h-20 flex flex-col justify-end items-center pb-1 sm:pb-2 border-b-2 border-slate-800 bg-slate-100/50">`;
        group.forEach(clue => { html += `<span class="text-xs sm:text-sm font-bold leading-tight">${clue}</span>`; });
        html += `</div>`;
      });
      html += `</div></div>`;

      for (let r = 0; r < size; r++) {
        html += `<div class="flex">`;
        html += `<div class="w-12 h-10 sm:w-16 sm:h-12 flex justify-end items-center pr-1 sm:pr-2 border-r-2 border-slate-800 bg-slate-100/50">`;
        rClues[r].forEach(clue => { html += `<span class="text-xs sm:text-sm font-bold ml-1">${clue}</span>`; });
        html += `</div><div class="flex">`;
        for (let c = 0; c < size; c++) {
          const cell = user[r][c];
          let classes = `w-10 h-10 sm:w-12 sm:h-12 border border-slate-300 flex items-center justify-center cursor-pointer text-lg sm:text-xl `;
          if (r === 4) classes += `border-b-2 border-b-slate-800 `;
          if (c === 4) classes += `border-r-2 border-r-slate-800 `;
          if (r === 0) classes += `border-t-2 border-t-slate-800 `;
          if (c === 0) classes += `border-l-2 border-l-slate-800 `;
          
          let style = cell === 1 ? 'background-color: #334155;' : 'background-color: white;';
          let content = cell === 2 ? `<span class="text-red-400 font-light">X</span>` : '';
          
          html += `<div onclick="window.nonoClick(${r},${c})" class="${classes}" style="${style}">${content}</div>`;
        }
        html += `</div></div>`;
      }
      html += `</div>`;
      container.innerHTML = html;
    };

    window.nonoClick = (r, c) => {
      if (state.gameWon) return;
      const data = state.gameData;
      data.user[r][c] = (data.user[r][c] + 1) % 3;
      
      let win = true;
      for(let i=0; i<data.size; i++) {
        for(let j=0; j<data.size; j++) {
          if ((data.user[i][j] === 1) !== (data.target[i][j] === 1)) win = false;
        }
      }
      if (win) triggerWin();
      renderGameUI();
    };

    // 3. 기억력 짝맞추기
    const initMemory = () => {
      const emojis = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼'];
      const seed = parseInt(state.selectedDate.replace(/-/g, ''), 10) + 3;
      const rand = mulberry32(seed);
      let deck = [...emojis, ...emojis].map((emoji, id) => ({ id, emoji }));
      deck = shuffleArray(deck, rand);
      state.gameData = { cards: deck, flipped: [], solved: [], disabled: false };
    };

    const renderMemory = (container) => {
      const { cards, flipped, solved } = state.gameData;
      let html = `<div class="grid grid-cols-4 gap-2 sm:gap-3 p-2 max-w-sm mx-auto w-full">`;
      cards.forEach((card, index) => {
        const isFlipped = flipped.includes(index) || solved.includes(index);
        let wrapperClass = `w-14 h-14 sm:w-20 sm:h-20 rounded-xl cursor-pointer transition-all duration-300 transform preserve-3d flex items-center justify-center text-2xl sm:text-4xl select-none `;
        if (isFlipped) wrapperClass += `rotate-y-180`;
        else wrapperClass += `bg-indigo-500 shadow-md hover:-translate-y-1`;
        
        let innerClass = `absolute w-full h-full rounded-xl flex items-center justify-center backface-hidden transition-all duration-300 `;
        if (isFlipped) innerClass += `bg-white shadow-sm border-2 border-indigo-100`;
        else innerClass += `bg-indigo-400`;
        
        const content = isFlipped ? card.emoji : `<span class="text-white/50 text-xl font-bold">?</span>`;
        html += `<div onclick="window.memoClick(${index})" class="${wrapperClass}" style="perspective:1000px;"><div class="${innerClass}">${content}</div></div>`;
      });
      html += `</div>`;
      container.innerHTML = html;
    };

    window.memoClick = (index) => {
      const data = state.gameData;
      if (data.disabled || data.flipped.includes(index) || data.solved.includes(index)) return;
      
      data.flipped.push(index);
      renderGameUI();

      if (data.flipped.length === 2) {
        data.disabled = true;
        const [i1, i2] = data.flipped;
        if (data.cards[i1].emoji === data.cards[i2].emoji) {
          data.solved.push(i1, i2);
          data.flipped = [];
          data.disabled = false;
          if (data.solved.length === data.cards.length) triggerWin();
          renderGameUI();
        } else {
          setTimeout(() => {
            data.flipped = [];
            data.disabled = false;
            renderGameUI();
          }, 800);
        }
      }
    };

    // 4. 스도쿠
    const initSudoku = () => {
      const baseBoard = [
        [1,2,3, 4,5,6, 7,8,9],[4,5,6, 7,8,9, 1,2,3],[7,8,9, 1,2,3, 4,5,6],
        [2,3,1, 5,6,4, 8,9,7],[5,6,4, 8,9,7, 2,3,1],[8,9,7, 2,3,1, 5,6,4],
        [3,1,2, 6,4,5, 9,7,8],[6,4,5, 9,7,8, 3,1,2],[9,7,8, 3,1,2, 6,4,5]
      ];
      const seed = parseInt(state.selectedDate.replace(/-/g, ''), 10) + 4;
      const rand = mulberry32(seed);
      let board = JSON.parse(JSON.stringify(baseBoard));

      const nums = shuffleArray([1,2,3,4,5,6,7,8,9], rand);
      board = board.map(row => row.map(val => nums[val - 1]));

      const bands = shuffleArray([0, 1, 2], rand);
      let nb = [];
      bands.forEach(b => { nb.push([...board[b*3]], [...board[b*3 + 1]], [...board[b*3 + 2]]); });
      board = nb;

      for(let b=0; b<3; b++) {
        const rows = shuffleArray([0, 1, 2], rand);
        const temp = [[...board[b*3 + rows[0]]], [...board[b*3 + rows[1]]], [...board[b*3 + rows[2]]]];
        board[b*3] = temp[0]; board[b*3+1] = temp[1]; board[b*3+2] = temp[2];
      }

      let transposed = board[0].map((_, c) => board.map(r => r[c]));
      for(let b=0; b<3; b++) {
        const cols = shuffleArray([0, 1, 2], rand);
        const temp = [[...transposed[b*3 + cols[0]]], [...transposed[b*3 + cols[1]]], [...transposed[b*3 + cols[2]]]];
        transposed[b*3] = temp[0]; transposed[b*3+1] = temp[1]; transposed[b*3+2] = temp[2];
      }
      board = transposed[0].map((_, c) => transposed.map(r => r[c]));

      const cellIndices = shuffleArray(Array.from({length: 81}, (_, i) => i), rand);
      let puzzle = JSON.parse(JSON.stringify(board));
      for (let i = 0; i < 40; i++) {
        const r = Math.floor(cellIndices[i] / 9), c = cellIndices[i] % 9;
        puzzle[r][c] = 0;
      }

      state.gameData = { initial: puzzle, user: JSON.parse(JSON.stringify(puzzle)), selected: null };
    };

    const checkSudokuConflicts = (b, r, c, val) => {
      if (val === 0) return false;
      for (let i = 0; i < 9; i++) {
        if (i !== c && b[r][i] === val) return true;
        if (i !== r && b[i][c] === val) return true;
      }
      const sr = Math.floor(r / 3) * 3, sc = Math.floor(c / 3) * 3;
      for (let i = 0; i < 3; i++) {
        for (let j = 0; j < 3; j++) {
          if ((sr+i !== r || sc+j !== c) && b[sr+i][sc+j] === val) return true;
        }
      }
      return false;
    };

    const renderSudoku = (container) => {
      const { initial, user, selected } = state.gameData;
      let html = `<div class="flex flex-col items-center w-full max-w-sm select-none">
                    <div class="bg-slate-800 p-[2px] rounded-lg mb-6">
                      <div class="grid grid-cols-9 bg-slate-300 gap-px border-2 border-slate-800">`;
      for(let r=0; r<9; r++) {
        for(let c=0; c<9; c++) {
          const cell = user[r][c];
          const isFixed = initial[r][c] !== 0;
          const isSelected = selected && selected[0] === r && selected[1] === c;
          const isConflict = !isFixed && checkSudokuConflicts(user, r, c, cell);
          const highlight = selected && (selected[0] === r || selected[1] === c);
          
          let bg = "bg-white", text = "text-slate-800";
          if (isSelected) bg = "bg-indigo-200"; else if (highlight) bg = "bg-indigo-50"; else if (isFixed) bg = "bg-slate-100";
          if (isFixed) text = "font-bold text-slate-900"; else if (isConflict) text = "text-red-500 font-bold"; else text = "text-indigo-600 font-bold";
          
          let classes = `flex items-center justify-center cursor-pointer text-lg sm:text-xl w-8 h-8 sm:w-10 sm:h-10 transition-colors ${bg} ${text} `;
          if (c%3 === 2 && c !== 8) classes += `border-r-2 border-r-slate-800 `;
          if (r%3 === 2 && r !== 8) classes += `border-b-2 border-b-slate-800 `;

          html += `<div onclick="window.sudoClick(${r},${c})" class="${classes}">${cell !== 0 ? cell : ''}</div>`;
        }
      }
      html += `</div></div><div class="grid grid-cols-5 gap-2 w-full max-w-[300px]">`;
      
      const disableBtn = !selected || initial[selected[0]][selected[1]] !== 0;
      for(let num=1; num<=9; num++) {
        html += `<button onclick="window.sudoInput(${num})" ${disableBtn?'disabled':''} class="w-full aspect-square bg-slate-100 hover:bg-indigo-100 disabled:opacity-50 text-slate-800 font-bold text-xl rounded-xl shadow-sm border border-slate-200 active:scale-95 transition-all">${num}</button>`;
      }
      html += `<button onclick="window.sudoInput(0)" ${disableBtn?'disabled':''} class="w-full aspect-square bg-red-50 hover:bg-red-100 disabled:opacity-50 text-red-500 flex items-center justify-center rounded-xl shadow-sm border border-red-200 active:scale-95 transition-all"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z"></path></svg></button>`;
      html += `</div></div>`;
      container.innerHTML = html;
    };

    window.sudoClick = (r, c) => {
      state.gameData.selected = [r, c];
      renderGameUI();
    };

    window.sudoInput = (num) => {
      if (state.gameWon || !state.gameData.selected) return;
      const [r, c] = state.gameData.selected;
      if (state.gameData.initial[r][c] !== 0) return;

      state.gameData.user[r][c] = num;
      
      let win = true;
      for (let i = 0; i < 9; i++) {
        for (let j = 0; j < 9; j++) {
          if (state.gameData.user[i][j] === 0 || checkSudokuConflicts(state.gameData.user, i, j, state.gameData.user[i][j])) win = false;
        }
      }
      if (num !== 0 && win) triggerWin();
      renderGameUI();
    };

    // Keyboard support for Sudoku
    window.addEventListener('keydown', (e) => {
      if (state.currentView !== 'game' || state.gameInfo.id !== 'sudoku') return;
      if (e.key >= '1' && e.key <= '9') window.sudoInput(parseInt(e.key, 10));
      if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') window.sudoInput(0);
    });

    // --- 앱 컨트롤 로직 ---
    const triggerWin = () => {
      state.gameWon = true;
      state.isPlaying = false;
      stopTimer();
      saveProgress(state.selectedDate, state.timeElapsed, state.gameInfo.id);
      
      document.getElementById('win-time').innerText = formatTime(state.timeElapsed);
      const modal = document.getElementById('win-modal');
      const box = document.getElementById('win-modal-box');
      modal.classList.remove('hidden');
      setTimeout(() => box.classList.remove('scale-95'), 10);
    };

    window.closeWinModal = () => {
      document.getElementById('win-modal').classList.add('hidden');
      document.getElementById('win-modal-box').classList.add('scale-95');
      window.goBack();
    };

    window.openGame = (dateStr) => {
      state.selectedDate = dateStr;
      state.currentView = 'game';
      state.gameInfo = getGameTypeForDate(dateStr);
      state.gameWon = false;
      
      const existing = state.progressData[dateStr];
      if (existing && existing.completed) {
        state.timeElapsed = existing.timeTaken;
        state.isPlaying = false;
      } else {
        state.timeElapsed = 0;
        state.isPlaying = true;
      }

      if (state.gameInfo.id === 'minesweeper') initMinesweeper();
      else if (state.gameInfo.id === 'nonogram') initNonogram();
      else if (state.gameInfo.id === 'memory') initMemory();
      else if (state.gameInfo.id === 'sudoku') initSudoku();

      renderApp();
      startTimer();
    };

    window.playToday = () => {
      window.openGame(state.todayStr);
    };

    window.goBack = () => {
      state.currentView = 'calendar';
      stopTimer();
      renderApp();
    };

    window.restartGame = () => {
      state.timeElapsed = 0;
      state.isPlaying = true;
      state.gameWon = false;
      if (state.gameInfo.id === 'minesweeper') initMinesweeper();
      else if (state.gameInfo.id === 'nonogram') initNonogram();
      else if (state.gameInfo.id === 'memory') initMemory();
      else if (state.gameInfo.id === 'sudoku') initSudoku();
      renderApp();
      startTimer();
    };

    window.changeMonth = (offset) => {
      state.currentMonth = new Date(state.currentMonth.getFullYear(), state.currentMonth.getMonth() + offset, 1);
      renderCalendarUI();
    };

    // --- Firebase 연결 및 실행 ---
    document.addEventListener('DOMContentLoaded', () => {
      const initAuth = async () => {
        try {
          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);
          } else {
            await signInAnonymously(auth);
          }
        } catch (error) { console.error("Auth Error:", error); }
      };
      
      initAuth();
      
      onAuthStateChanged(auth, (user) => {
        state.user = user;
        if (user) {
          const progressRef = collection(db, 'artifacts', appId, 'users', user.uid, 'daily_progress');
          onSnapshot(progressRef, (snapshot) => {
            snapshot.forEach(doc => { state.progressData[doc.id] = doc.data(); });
            renderApp();
          }, (err) => { console.error("Firestore Error:", err); });
        }
      });
      
      renderApp(); // 초기 렌더링
    });

    const saveProgress = async (dateStr, timeTaken, gameType) => {
      if (!state.user) return;
      try {
        const docRef = doc(db, 'artifacts', appId, 'users', state.user.uid, 'daily_progress', dateStr);
        const existing = state.progressData[dateStr];
        const bestTime = existing && existing.timeTaken < timeTaken ? existing.timeTaken : timeTaken;
        
        await setDoc(docRef, {
          date: dateStr,
          timeTaken: bestTime,
          gameType: gameType,
          completed: true,
          lastPlayed: new Date().toISOString()
        }, { merge: true });
      } catch (e) { console.error("Error saving:", e); }
    };
  </script>
</body>
</html>
