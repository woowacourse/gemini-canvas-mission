<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>행성이 메이커</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      /* 커스텀 스크롤바 등 필요시 추가 가능 */
      .hide-scroll::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-800 font-sans selection:bg-indigo-100">
    <div class="max-w-5xl mx-auto px-4 py-12">
      <!-- 헤더 섹션 -->
      <div class="text-center mb-12 space-y-4">
        <div class="flex items-center justify-center mb-6">
          <img
            src="https://github.com/JetProc/gemini-canvas-mission/blob/jetproc/src/self_copy_planet.png?raw=true"
            alt="행성이 대표 이미지"
            class="w-40 h-auto object-contain drop-shadow-sm"
          />
        </div>
        <h1 class="text-4xl md:text-5xl font-extrabold text-slate-900 tracking-tight">행성이 메이커</h1>
        <p class="text-lg text-slate-600 max-w-2xl mx-auto">
          원하는 상황을 텍스트로 입력하면, 귀여운 행성이 이미지를 AI가 만들어줍니다!
        </p>
      </div>

      <!-- 입력 섹션 -->
      <div class="bg-white rounded-3xl shadow-sm border border-slate-100 p-6 md:p-8 mb-12 max-w-3xl mx-auto">
        <div class="flex flex-col space-y-4">
          <label for="promptInput" class="text-sm font-semibold text-slate-700 ml-1"> 어떤 행성이를 그려볼까요? </label>
          <textarea
            id="promptInput"
            rows="3"
            class="w-full resize-none rounded-2xl border-slate-200 bg-slate-50 px-4 py-3 text-slate-700 focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-200 transition-all outline-none"
            placeholder="예: 자전거를 타고 출근하는 행성이, 노트북으로 밤샘 코딩하는 행성이, 커피를 마시는 행성이"
          ></textarea>

          <!-- 에러 메시지 -->
          <div id="errorContainer" class="hidden flex items-center text-red-500 text-sm bg-red-50 p-3 rounded-xl">
            <i data-lucide="alert-circle" class="w-4 h-4 mr-2 flex-shrink-0"></i>
            <p id="errorMessage"></p>
          </div>

          <!-- 버튼 그룹 -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <button
              id="generateBtn"
              class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 rounded-2xl transition-all duration-200 flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed group shadow-md"
            >
              <span id="btnTextNormal" class="flex items-center justify-center">
                <i data-lucide="image" class="w-5 h-5 mr-2 group-hover:scale-110 transition-transform"></i>
                새로운 행성이 만들기
              </span>
              <span id="btnTextLoading" class="hidden flex items-center justify-center">
                <i data-lucide="loader-2" class="w-5 h-5 mr-2 animate-spin"></i>
                그리는 중...
              </span>
            </button>

            <button
              id="randomDevBtn"
              class="w-full bg-indigo-100 hover:bg-indigo-200 text-indigo-700 font-bold py-4 rounded-2xl transition-all duration-200 flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed group shadow-md"
            >
              <span id="randomBtnTextNormal" class="flex items-center justify-center">
                <i data-lucide="terminal" class="w-5 h-5 mr-2 group-hover:scale-110 transition-transform"></i>
                개발자 랜덤 행성이 만들기
              </span>
              <span id="randomBtnTextLoading" class="hidden flex items-center justify-center">
                <i data-lucide="loader-2" class="w-5 h-5 mr-2 animate-spin"></i>
                그리는 중...
              </span>
            </button>
          </div>
        </div>
      </div>

      <!-- 결과 섹션 -->
      <div id="resultsSection" class="hidden space-y-8 animate-in fade-in slide-in-from-bottom-4 duration-700">
        <div class="text-center">
          <h2 class="text-2xl font-bold text-slate-900">✨ 짜잔! 완성된 행성이들</h2>
          <p class="text-slate-500 mt-2">가장 마음에 드는 행성이를 다운로드 하세요.</p>
        </div>

        <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-8">
          <!-- 이미지가 동적으로 삽입될 공간 -->
        </div>
      </div>

      <!-- 빈 상태 플레이스홀더 -->
      <div
        id="emptyState"
        class="text-center p-12 text-slate-400 border-2 border-dashed border-slate-200 rounded-3xl mx-auto max-w-3xl"
      >
        <i data-lucide="image" class="w-12 h-12 mx-auto mb-4 opacity-50"></i>
        <p>생성된 행성이가 이곳에 표시됩니다.</p>
      </div>
    </div>

    <script>
      // 초기 아이콘 렌더링
      lucide.createIcons();

      // API 설정
      const apiKey = '';
      const referenceImageUrl =
        'https://raw.githubusercontent.com/JetProc/gemini-canvas-mission/refs/heads/jetproc/src/planet_resource.png';

      let imagesData = [];
      let isLoading = false;
      let currentPrompt = ''; // 다운로드 시 파일명으로 사용할 프롬프트를 저장하는 변수

      // DOM 요소
      const promptInput = document.getElementById('promptInput');
      const generateBtn = document.getElementById('generateBtn');
      const randomDevBtn = document.getElementById('randomDevBtn');

      const btnTextNormal = document.getElementById('btnTextNormal');
      const btnTextLoading = document.getElementById('btnTextLoading');
      const randomBtnTextNormal = document.getElementById('randomBtnTextNormal');
      const randomBtnTextLoading = document.getElementById('randomBtnTextLoading');

      const errorContainer = document.getElementById('errorContainer');
      const errorMessage = document.getElementById('errorMessage');
      const resultsSection = document.getElementById('resultsSection');
      const resultsGrid = document.getElementById('resultsGrid');
      const emptyState = document.getElementById('emptyState');

      // 개발자 랜덤 상황 프롬프트 리스트
      const devPrompts = [
        '버그를 찾기 위해 돋보기를 들고 코드를 뚫어져라 쳐다보는 행성이',
        '키보드 샷건을 치며 분노하는 행성이',
        '모니터 두 대를 띄워놓고 열심히 타자를 치는 행성이',
        '서버가 터져서 머리를 감싸쥐고 절망하는 행성이',
        '에너지 드링크를 마시며 밤샘 코딩을 하는 행성이',
        '빨간색 에러 메시지를 보고 땀을 흘리는 행성이',
        '코드 리뷰를 받으며 긴장한 행성이',
        '무사히 배포에 성공하고 기뻐서 만세를 부르는 행성이',
      ];

      // 지수 백오프(Exponential Backoff)를 적용한 API 호출 함수
      const fetchWithBackoff = async (url, options, retries = 5) => {
        const delays = [1000, 2000, 4000, 8000, 16000];
        for (let i = 0; i < retries; i++) {
          try {
            const res = await fetch(url, options);
            if (!res.ok) {
              throw new Error(`HTTP error! status: ${res.status}`);
            }
            const data = await res.json();
            if (data.error) {
              throw new Error(data.error.message || 'API Error');
            }
            return data;
          } catch (err) {
            if (i === retries - 1) throw err;
            await new Promise((r) => setTimeout(r, delays[i]));
          }
        }
      };

      const generateSingleImage = async (userPrompt) => {
        let referenceImageBase64 = null;
        try {
          const imageResponse = await fetch(referenceImageUrl);
          const imageBlob = await imageResponse.blob();
          referenceImageBase64 = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onloadend = () => {
              const base64data = reader.result.split(',')[1];
              resolve(base64data);
            };
            reader.onerror = reject;
            reader.readAsDataURL(imageBlob);
          });
        } catch (error) {
          console.error('Failed to fetch or convert reference image:', error);
          throw new Error('레퍼런스 이미지를 불러오는 데 실패했습니다.');
        }

        const baseStylePrompt = `A black and white doodle drawing of a specific cute planet character, strictly following the style of the provided reference image.
            
            Character Appearance Rules:
            1. Structure: The character is EXACTLY ONE SINGLE IMPERFECT, WOBBLY ROUND SHAPE (can be slightly squished, uneven, like a hand-drawn circle or potato shape) that serves as both head and body. It DOES NOT need to be a perfect sphere. ABSOLUTELY NO separate head, neck, or torso. 
            2. Ring: A distinct Saturn-like ring encircling the middle of this wobbly single body.
            3. Face (on the main body): EXACTLY TWO black dot eyes and EXACTLY ONE mouth (can be a dot or a simple small shape). NEVER draw three eyes. No other facial features.
            4. Limbs: EXACTLY TWO short, stubby appendages attached directly to the main body. It must have either two arms OR two legs, BUT NEVER BOTH at the same time. Limbs must be enclosed shapes with white fill and thick black outlines, not thin lines.
            
            Style constraints: 
            1. **STRICTLY MIMIC THE STYLE OF THE REFERENCE IMAGE.** The image must look like it belongs in the reference image's collection.
            2. Drawn with EXTRA THICK, BOLD, heavy hand-drawn, wobbly, squiggly, jittery black outlines and solid white fill, exactly like the reference. The overall shape must feel organic, clumsy and hand-drawn, not digitally perfect.
            3. Pure white background.
            4. ABSOLUTELY NO text, NO words, NO letters, NO speech bubbles, NO typography anywhere in the image.`;

        const fullPrompt = `${baseStylePrompt} \n\nThe character is doing this action or in this situation: ${userPrompt}.`;

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image-preview:generateContent?key=${apiKey}`;

        const payload = {
          contents: [
            { parts: [{ text: fullPrompt }, { inlineData: { mimeType: 'image/png', data: referenceImageBase64 } }] },
          ],
          generationConfig: { responseModalities: ['TEXT', 'IMAGE'] },
        };

        const result = await fetchWithBackoff(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const base64 = result.candidates?.[0]?.content?.parts?.find((p) => p.inlineData)?.inlineData?.data;
        if (base64) {
          return `data:image/png;base64,${base64}`;
        } else {
          throw new Error('이미지 생성 결과가 없습니다.');
        }
      };

      const showError = (msg) => {
        errorMessage.textContent = msg;
        errorContainer.classList.remove('hidden');
      };

      const hideError = () => {
        errorContainer.classList.add('hidden');
        errorMessage.textContent = '';
      };

      const setLoadingState = (loading) => {
        isLoading = loading;
        generateBtn.disabled = loading;
        randomDevBtn.disabled = loading;
        promptInput.disabled = loading;

        if (loading) {
          btnTextNormal.classList.add('hidden');
          btnTextLoading.classList.remove('hidden');
          randomBtnTextNormal.classList.add('hidden');
          randomBtnTextLoading.classList.remove('hidden');
        } else {
          btnTextNormal.classList.remove('hidden');
          btnTextLoading.classList.add('hidden');
          randomBtnTextNormal.classList.remove('hidden');
          randomBtnTextLoading.classList.add('hidden');
        }
      };

      const handleDownload = (base64Data) => {
        const link = document.createElement('a');
        link.href = base64Data;

        // 파일명에 숫자 없이 현재 프롬프트 텍스트를 그대로 사용
        // 단, OS에서 파일명으로 쓸 수 없는 특수기호만 언더바(_)로 안전하게 치환
        const safeFileName = currentPrompt.replace(/[\/\\:*?"<>|]/g, '_');
        link.download = `${safeFileName}.png`;

        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const renderResults = () => {
        resultsGrid.innerHTML = '';

        if (imagesData.length === 0) {
          resultsSection.classList.add('hidden');
          emptyState.classList.remove('hidden');
          return;
        }

        emptyState.classList.add('hidden');
        resultsSection.classList.remove('hidden');

        imagesData.forEach((imgBase64, index) => {
          const card = document.createElement('div');
          card.className = 'bg-white rounded-3xl overflow-hidden shadow-sm border border-slate-100 group flex flex-col';

          // 복사 기능을 완전히 제거하고 다운로드 버튼을 100% 가득 채우도록 변경
          card.innerHTML = `
                    <div class="aspect-square bg-slate-100 p-6 flex items-center justify-center relative">
                        <img 
                            src="${imgBase64}" 
                            alt="생성된 행성이 ${index + 1}" 
                            class="w-full h-full object-contain rounded-xl mix-blend-multiply cursor-pointer"
                        />
                    </div>
                    <div class="p-4 mt-auto bg-white border-t border-slate-50 flex gap-2">
                        <button class="download-btn w-full flex items-center justify-center px-2 py-3 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold rounded-xl transition-colors text-sm">
                            <i data-lucide="download" class="w-4 h-4 mr-1.5"></i> 이미지 다운로드
                        </button>
                    </div>
                `;

          // 다운로드 이벤트 리스너 연결 (인덱스 파라미터 제거)
          const downloadBtn = card.querySelector('.download-btn');
          downloadBtn.addEventListener('click', () => handleDownload(imgBase64));

          resultsGrid.appendChild(card);
        });

        // 동적으로 추가된 아이콘 렌더링
        lucide.createIcons();
      };

      const handleGenerate = async () => {
        const prompt = promptInput.value.trim();
        if (!prompt) {
          showError('어떤 행성이를 보고 싶은지 입력해주세요!');
          return;
        }

        currentPrompt = prompt; // 다운로드 파일명으로 사용하기 위해 저장

        setLoadingState(true);
        hideError();
        imagesData = [];
        renderResults(); // 결과창 숨기고 로딩 상태 반영

        try {
          const promises = [generateSingleImage(prompt), generateSingleImage(prompt), generateSingleImage(prompt)];

          imagesData = await Promise.all(promises);
          renderResults();
        } catch (err) {
          showError(err.message || '이미지 생성 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
          console.error(err);
          emptyState.classList.remove('hidden');
        } finally {
          setLoadingState(false);
        }
      };

      const handleRandomGenerate = () => {
        // 랜덤한 문구를 뽑아 텍스트 에어리어에 채우고 생성 실행
        const randomPrompt = devPrompts[Math.floor(Math.random() * devPrompts.length)];
        promptInput.value = randomPrompt;
        handleGenerate();
      };

      // 이벤트 리스너
      generateBtn.addEventListener('click', handleGenerate);
      randomDevBtn.addEventListener('click', handleRandomGenerate);

      promptInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          if (!isLoading) handleGenerate();
        }
      });
    </script>
  </body>
</html>
