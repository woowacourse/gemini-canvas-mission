<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>나만 아니면 돼! 💸</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* 커스텀 스타일 및 애니메이션 */
      body {
        background-color: #f3f4f6;
        font-family:
          "Pretendard",
          -apple-system,
          BlinkMacSystemFont,
          system-ui,
          Roboto,
          "Helvetica Neue",
          "Segoe UI",
          "Apple SD Gothic Neo",
          "Noto Sans KR",
          "Malgun Gothic",
          sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      /* 숨기기 유틸리티 */
      .hidden-section {
        display: none !important;
      }

      /* 결과 모달 애니메이션 */
      @keyframes popIn {
        0% {
          transform: scale(0.9);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      .animate-pop-in {
        animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      /* 룰렛(섞기) 애니메이션 텍스트 */
      .shuffle-text {
        display: inline-block;
        min-width: 80px;
        font-variant-numeric: tabular-nums;
      }

      /* 토스트 메시지 애니메이션 */
      @keyframes slideUp {
        0% {
          transform: translate(-50%, 20px);
          opacity: 0;
        }
        100% {
          transform: translate(-50%, 0);
          opacity: 1;
        }
      }
      @keyframes fadeOut {
        0% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      .toast-enter {
        animation: slideUp 0.3s ease-out forwards;
      }
      .toast-exit {
        animation: fadeOut 0.3s ease-out forwards;
      }

      /* 페이지 전환 애니메이션 */
      .page-enter {
        animation: fadeInRight 0.3s ease-out forwards;
      }
      @keyframes fadeInRight {
        0% {
          opacity: 0;
          transform: translateX(20px);
        }
        100% {
          opacity: 1;
          transform: translateX(0);
        }
      }
    </style>
  </head>
  <body class="text-gray-800 antialiased pb-24">
    <!-- 메인 컨테이너 (모바일 앱 느낌의 레이아웃) -->
    <div class="max-w-md mx-auto w-full px-4 pt-8">
      <!-- 헤더 -->
      <div class="text-center mb-6">
        <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight mb-2">
          💸 나만 아니면 돼!
        </h1>
        <p class="text-gray-500 text-sm">긴장감 넘치는 랜덤 결제 룰렛</p>
      </div>

      <!-- 스텝 인디케이터 -->
      <div class="flex justify-center items-center gap-2 mb-8">
        <div
          id="step-1-dot"
          class="w-2.5 h-2.5 rounded-full bg-blue-600 transition-colors"
        ></div>
        <div
          class="w-8 h-0.5 bg-gray-200 transition-colors"
          id="step-line-1"
        ></div>
        <div
          id="step-2-dot"
          class="w-2.5 h-2.5 rounded-full bg-gray-200 transition-colors"
        ></div>
        <div
          class="w-8 h-0.5 bg-gray-200 transition-colors"
          id="step-line-2"
        ></div>
        <div
          id="step-3-dot"
          class="w-2.5 h-2.5 rounded-full bg-gray-200 transition-colors"
        ></div>
      </div>

      <!-- PAGE 1: 팀원 입력 -->
      <div id="page-1" class="page-container page-enter">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold flex items-center gap-2">
              1. 팀원 입력
              <span
                id="participant-count-badge"
                class="bg-blue-100 text-blue-700 text-xs px-2 py-1 rounded-full font-semibold"
                >2/10명</span
              >
            </h2>
          </div>

          <div id="participants-container" class="space-y-3">
            <!-- 참가자 인풋들이 여기 렌더링 됩니다. -->
          </div>

          <button
            id="add-participant-btn"
            class="w-full mt-4 py-3 border-2 border-dashed border-gray-300 rounded-xl text-gray-500 font-medium hover:bg-gray-50 hover:border-gray-400 hover:text-gray-700 transition-colors flex items-center justify-center gap-2"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 4v16m8-8H4"
              ></path>
            </svg>
            팀원 추가하기
          </button>
        </div>
      </div>

      <!-- PAGE 2: 결제 설정 -->
      <div id="page-2" class="page-container hidden-section">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
          <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
            2. 결제 설정
          </h2>

          <div class="space-y-5">
            <!-- 총 금액 -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >총 결제 금액</label
              >
              <div class="relative">
                <input
                  type="text"
                  id="total-amount"
                  inputmode="numeric"
                  placeholder="0"
                  class="w-full pl-4 pr-10 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow text-right font-bold text-lg"
                  value="0"
                />
                <div
                  class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none"
                >
                  <span class="text-gray-500 font-medium">원</span>
                </div>
              </div>
            </div>

            <!-- 지출 인원 -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >지출할 인원 (당첨자 수)</label
              >
              <div class="flex items-center gap-3">
                <input
                  type="range"
                  id="payer-count-slider"
                  min="1"
                  max="2"
                  value="1"
                  class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600"
                />
                <div
                  class="w-16 text-center font-bold text-lg text-blue-600 bg-blue-50 py-1 rounded-lg"
                >
                  <span id="payer-count-display">1</span>명
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- PAGE 3: 금액 조정 -->
      <div id="page-3" class="page-container hidden-section">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold flex items-center gap-2">
              3. 금액 조정
            </h2>
            <button
              id="reset-distribution-btn"
              class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1.5 rounded-lg font-medium transition-colors"
            >
              기본(1/N)으로 리셋
            </button>
          </div>

          <div id="distribution-container" class="space-y-3 mb-4">
            <!-- 금액 분배 인풋들이 렌더링 됩니다. -->
          </div>

          <div
            class="bg-gray-50 p-4 rounded-xl flex justify-between items-center border border-gray-200"
          >
            <span class="text-sm font-medium text-gray-600"
              >할당된 총액 합계</span
            >
            <div class="text-right">
              <div id="sum-amount-display" class="font-bold text-lg">0원</div>
              <div
                id="diff-amount-display"
                class="text-xs font-medium text-green-600 mt-0.5"
              >
                금액이 일치합니다.
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 하단 고정 네비게이션 버튼 -->
      <div
        class="fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-white via-white to-transparent max-w-md mx-auto z-10 flex gap-3"
      >
        <button
          id="prev-btn"
          class="hidden-section flex-1 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-bold text-lg py-4 rounded-2xl transition-colors shadow-sm"
        >
          이전
        </button>
        <button
          id="next-btn"
          class="flex-[2] bg-blue-600 hover:bg-blue-700 text-white font-bold text-lg py-4 rounded-2xl shadow-lg transform transition hover:-translate-y-0.5 active:translate-y-0"
        >
          다음 단계로
        </button>
        <button
          id="draw-btn"
          class="hidden-section flex-[2] bg-blue-600 hover:bg-blue-700 text-white font-bold text-lg py-4 rounded-2xl shadow-lg transform transition hover:-translate-y-0.5 active:translate-y-0"
        >
          🎯 당첨자 뽑기!
        </button>
      </div>
    </div>

    <!-- 로딩/추첨 애니메이션 오버레이 -->
    <div
      id="loading-overlay"
      class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden flex-col items-center justify-center text-white hidden-section"
    >
      <div class="text-6xl mb-4">🥁</div>
      <h2 class="text-2xl font-bold mb-2">누가 걸릴까...?</h2>
      <div
        id="shuffle-names"
        class="text-xl text-yellow-300 font-bold h-8 overflow-hidden"
      >
        ???
      </div>
    </div>

    <!-- 결과 모달 -->
    <div
      id="result-modal"
      class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex-col items-center justify-center p-4 hidden-section"
    >
      <div
        class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl animate-pop-in relative"
      >
        <button
          id="close-modal-btn"
          class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"
        >
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            ></path>
          </svg>
        </button>

        <div class="text-center mb-6">
          <div class="text-5xl mb-3">🎉</div>
          <h2 class="text-2xl font-extrabold text-gray-900">당첨 결과</h2>
          <p class="text-gray-500 text-sm mt-1">
            축하합니다(?) 결제를 부탁드려요!
          </p>
        </div>

        <div
          id="result-list"
          class="space-y-3 mb-6 max-h-[50vh] overflow-y-auto pr-1"
        >
          <!-- 결과 렌더링 -->
        </div>

        <button
          id="restart-btn"
          class="w-full bg-gray-900 hover:bg-black text-white font-bold py-3.5 rounded-xl transition-colors"
        >
          확인 및 닫기
        </button>
      </div>
    </div>

    <!-- 토스트 메시지 컨테이너 -->
    <div
      id="toast-container"
      class="fixed bottom-24 left-1/2 transform -translate-x-1/2 z-50 flex flex-col items-center gap-2 pointer-events-none"
    ></div>

    <script>
      // --- 상태 관리 ---
      const state = {
        currentPage: 1,
        participants: ["멤버 1", "멤버 2"], // 기본 2명
        totalAmount: 0,
        payerCount: 1,
        distributions: [0], // 각 지출자가 낼 금액
      };

      const MAX_PARTICIPANTS = 10;
      const MIN_PARTICIPANTS = 2;

      // --- DOM 요소 ---
      const els = {
        pages: [
          null,
          document.getElementById("page-1"),
          document.getElementById("page-2"),
          document.getElementById("page-3"),
        ],
        stepDots: [
          null,
          document.getElementById("step-1-dot"),
          document.getElementById("step-2-dot"),
          document.getElementById("step-3-dot"),
        ],
        stepLines: [
          null,
          document.getElementById("step-line-1"),
          document.getElementById("step-line-2"),
        ],
        prevBtn: document.getElementById("prev-btn"),
        nextBtn: document.getElementById("next-btn"),
        drawBtn: document.getElementById("draw-btn"),

        participantsContainer: document.getElementById(
          "participants-container",
        ),
        addParticipantBtn: document.getElementById("add-participant-btn"),
        participantCountBadge: document.getElementById(
          "participant-count-badge",
        ),

        totalAmountInput: document.getElementById("total-amount"),
        payerCountSlider: document.getElementById("payer-count-slider"),
        payerCountDisplay: document.getElementById("payer-count-display"),

        distributionContainer: document.getElementById(
          "distribution-container",
        ),
        resetDistributionBtn: document.getElementById("reset-distribution-btn"),
        sumAmountDisplay: document.getElementById("sum-amount-display"),
        diffAmountDisplay: document.getElementById("diff-amount-display"),

        loadingOverlay: document.getElementById("loading-overlay"),
        shuffleNames: document.getElementById("shuffle-names"),

        resultModal: document.getElementById("result-modal"),
        resultList: document.getElementById("result-list"),
        closeModalBtn: document.getElementById("close-modal-btn"),
        restartBtn: document.getElementById("restart-btn"),

        toastContainer: document.getElementById("toast-container"),
      };

      // --- 유틸리티 함수 ---
      const formatMoney = (num) => num.toLocaleString("ko-KR");

      const parseMoney = (str) => {
        const parsed = parseInt(str.replace(/[^0-9]/g, ""), 10);
        return isNaN(parsed) ? 0 : parsed;
      };

      const showToast = (message, type = "error") => {
        const toast = document.createElement("div");
        const bgColor = type === "error" ? "bg-red-600" : "bg-gray-800";
        toast.className = `${bgColor} text-white px-5 py-3 rounded-xl shadow-lg text-sm font-medium toast-enter flex items-center gap-2`;
        toast.innerHTML =
          type === "error" ? `<span>⚠️</span> ${message}` : message;

        els.toastContainer.appendChild(toast);

        setTimeout(() => {
          toast.classList.remove("toast-enter");
          toast.classList.add("toast-exit");
          setTimeout(() => toast.remove(), 300);
        }, 2500);
      };

      // --- 페이지 전환 로직 ---
      function updatePageUI() {
        // 1. 모든 페이지 및 버튼 숨기기
        for (let i = 1; i <= 3; i++) {
          els.pages[i].classList.add("hidden-section");
          els.pages[i].classList.remove("page-enter");

          // 스텝 인디케이터 초기화
          els.stepDots[i].classList.replace("bg-blue-600", "bg-gray-200");
          if (i < 3)
            els.stepLines[i].classList.replace("bg-blue-600", "bg-gray-200");
        }

        // 2. 현재 페이지 보이기
        els.pages[state.currentPage].classList.remove("hidden-section");
        void els.pages[state.currentPage].offsetWidth; // 리플로우 (애니메이션 재시작)
        els.pages[state.currentPage].classList.add("page-enter");

        // 3. 스텝 인디케이터 활성화
        for (let i = 1; i <= state.currentPage; i++) {
          els.stepDots[i].classList.replace("bg-gray-200", "bg-blue-600");
          if (i < state.currentPage)
            els.stepLines[i].classList.replace("bg-gray-200", "bg-blue-600");
        }

        // 4. 하단 네비게이션 버튼 상태
        if (state.currentPage === 1) {
          els.prevBtn.classList.add("hidden-section");
          els.nextBtn.classList.remove("hidden-section");
          els.drawBtn.classList.add("hidden-section");
        } else if (state.currentPage === 2) {
          els.prevBtn.classList.remove("hidden-section");
          els.nextBtn.classList.remove("hidden-section");
          els.drawBtn.classList.add("hidden-section");
        } else if (state.currentPage === 3) {
          els.prevBtn.classList.remove("hidden-section");
          els.nextBtn.classList.add("hidden-section");
          els.drawBtn.classList.remove("hidden-section");
          // 3페이지 진입 시 분배 계산
          calculateDistributions();
        }
      }

      function validatePage(page) {
        if (page === 1) {
          for (let i = 0; i < state.participants.length; i++) {
            const name = state.participants[i].trim();
            if (name.length < 1 || name.length > 5) {
              showToast(`참가자 ${i + 1}의 이름을 1~5자로 입력해주세요.`);
              return false;
            }
          }

          // 유효한 이름만 남기기 (공백 제거 적용)
          state.participants = state.participants.map((p) => p.trim());

          if (state.participants.length < MIN_PARTICIPANTS) {
            showToast(`이름을 최소 ${MIN_PARTICIPANTS}명 이상 입력해주세요.`);
            return false;
          }
          renderParticipants();
        } else if (page === 2) {
          if (state.totalAmount <= 0) {
            showToast("총 결제 금액을 입력해주세요.");
            els.totalAmountInput.focus();
            return false;
          }
          if (state.totalAmount > 1000000) {
            showToast("총 결제 금액은 최대 100만원까지 가능합니다.");
            els.totalAmountInput.focus();
            return false;
          }
          if (state.payerCount > state.participants.length) {
            state.payerCount = state.participants.length;
          }
        }
        return true;
      }

      els.nextBtn.addEventListener("click", () => {
        if (validatePage(state.currentPage)) {
          state.currentPage++;
          updatePageUI();
        }
      });

      els.prevBtn.addEventListener("click", () => {
        if (state.currentPage > 1) {
          state.currentPage--;
          updatePageUI();
        }
      });

      // --- 렌더링 함수 ---

      // 1. 참가자 목록 렌더링
      function renderParticipants() {
        els.participantsContainer.innerHTML = "";

        state.participants.forEach((name, index) => {
          const row = document.createElement("div");
          row.className = "flex items-center gap-2";

          const input = document.createElement("input");
          input.type = "text";
          input.value = name;
          input.placeholder = `참가자 ${index + 1} 이름 (최대 5자)`;
          input.className =
            "flex-1 bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow outline-none";
          input.oninput = (e) => {
            let val = e.target.value;
            if (val.length > 5) {
              val = val.substring(0, 5);
              e.target.value = val;
              showToast("이름은 최대 5글자까지 입력 가능합니다.");
            }
            updateParticipantName(index, val);
          };

          row.appendChild(input);

          // 삭제 버튼 (최소 인원 이상일 때만 활성화)
          if (state.participants.length > MIN_PARTICIPANTS) {
            const removeBtn = document.createElement("button");
            removeBtn.className =
              "p-3 text-red-400 hover:text-red-600 hover:bg-red-50 rounded-xl transition-colors";
            removeBtn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>`;
            removeBtn.onclick = () => removeParticipant(index);
            row.appendChild(removeBtn);
          }

          els.participantsContainer.appendChild(row);
        });

        // 상태 업데이트 반영
        els.participantCountBadge.textContent = `${state.participants.length}/${MAX_PARTICIPANTS}명`;

        // 추가 버튼 표시/숨김
        if (state.participants.length >= MAX_PARTICIPANTS) {
          els.addParticipantBtn.classList.add("hidden-section");
        } else {
          els.addParticipantBtn.classList.remove("hidden-section");
        }

        // 지출 인원 슬라이더 Max값 업데이트
        els.payerCountSlider.max = state.participants.length;
        if (state.payerCount > state.participants.length) {
          state.payerCount = state.participants.length;
          els.payerCountSlider.value = state.payerCount;
          els.payerCountDisplay.textContent = state.payerCount;
        }
      }

      // 2. 금액 분배 영역 렌더링
      function renderDistributions() {
        if (state.totalAmount <= 0 || state.payerCount <= 0) {
          return;
        }

        els.distributionContainer.innerHTML = "";

        let sum = 0;
        state.distributions.forEach((amount, index) => {
          sum += amount;
          const row = document.createElement("div");
          row.className = "flex items-center justify-between gap-3";

          const label = document.createElement("div");
          label.className =
            "w-20 text-sm font-medium text-gray-700 bg-gray-100 py-2 text-center rounded-lg";
          label.textContent = `당첨 ${index + 1}`;

          const inputWrapper = document.createElement("div");
          inputWrapper.className = "relative flex-1";

          const input = document.createElement("input");
          input.type = "text";
          input.inputMode = "numeric";
          input.value = formatMoney(amount);
          input.className =
            "w-full pl-3 pr-8 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-right font-semibold";

          const wonSpan = document.createElement("span");
          wonSpan.className =
            "absolute inset-y-0 right-3 flex items-center text-gray-500 text-sm pointer-events-none";
          wonSpan.textContent = "원";

          // 금액 직접 수정 이벤트
          input.oninput = (e) => {
            let val = parseMoney(e.target.value);
            e.target.value = val === 0 ? "" : formatMoney(val);
            state.distributions[index] = val;
            updateDistributionSummary();
          };
          // 포커스 아웃시 빈값이면 0으로 채우기
          input.onblur = (e) => {
            if (e.target.value === "") {
              e.target.value = "0";
              state.distributions[index] = 0;
              updateDistributionSummary();
            }
          };

          inputWrapper.appendChild(input);
          inputWrapper.appendChild(wonSpan);

          row.appendChild(label);
          row.appendChild(inputWrapper);
          els.distributionContainer.appendChild(row);
        });

        updateDistributionSummary();
      }

      // 금액 요약(합계 및 차액) 업데이트
      function updateDistributionSummary() {
        const sum = state.distributions.reduce((a, b) => a + b, 0);
        els.sumAmountDisplay.textContent = `${formatMoney(sum)}원`;

        const diff = state.totalAmount - sum;
        if (diff === 0) {
          els.diffAmountDisplay.textContent = `총 금액과 정확히 일치합니다.`;
          els.diffAmountDisplay.className =
            "text-xs font-bold text-green-600 mt-1";
        } else if (diff > 0) {
          els.diffAmountDisplay.textContent = `${formatMoney(diff)}원이 모자랍니다.`;
          els.diffAmountDisplay.className =
            "text-xs font-bold text-red-500 mt-1";
        } else {
          els.diffAmountDisplay.textContent = `${formatMoney(Math.abs(diff))}원을 초과했습니다.`;
          els.diffAmountDisplay.className =
            "text-xs font-bold text-red-500 mt-1";
        }
      }

      // --- 핵심 로직 함수 ---

      // 참가자 조작
      function addParticipant() {
        if (state.participants.length < MAX_PARTICIPANTS) {
          state.participants.push("");
          renderParticipants();
        }
      }

      function removeParticipant(index) {
        if (state.participants.length > MIN_PARTICIPANTS) {
          state.participants.splice(index, 1);
          renderParticipants();
        }
      }

      function updateParticipantName(index, name) {
        state.participants[index] = name;
      }

      // 1/N 계산 로직 (기본)
      function calculateDistributions() {
        if (state.totalAmount <= 0 || state.payerCount <= 0) {
          state.distributions = [];
          renderDistributions();
          return;
        }

        const baseAmount = Math.floor(state.totalAmount / state.payerCount);
        const remainder = state.totalAmount % state.payerCount;

        state.distributions = Array(state.payerCount).fill(baseAmount);
        // 남은 자투리 금액은 첫 번째 당첨자(또는 랜덤)에게 몰아주기 (여기선 1번에게)
        if (remainder > 0) {
          state.distributions[0] += remainder;
        }

        renderDistributions();
      }

      // 총 금액 입력 처리
      els.totalAmountInput.addEventListener("input", (e) => {
        let val = parseMoney(e.target.value);
        if (val > 1000000) {
          val = 1000000;
          showToast("최대 100만원까지만 입력 가능합니다.");
        }
        e.target.value = val === 0 ? "" : formatMoney(val);
        state.totalAmount = val;
      });

      els.totalAmountInput.addEventListener("blur", (e) => {
        if (e.target.value === "") e.target.value = "0";
      });

      // 지출 인원 슬라이더 처리
      els.payerCountSlider.addEventListener("input", (e) => {
        const count = parseInt(e.target.value, 10);
        state.payerCount = count;
        els.payerCountDisplay.textContent = count;
      });

      // 분배 리셋 버튼
      els.resetDistributionBtn.addEventListener(
        "click",
        calculateDistributions,
      );

      // 참가자 추가 버튼
      els.addParticipantBtn.addEventListener("click", addParticipant);

      // --- 추첨 및 결과 로직 ---
      els.drawBtn.addEventListener("click", () => {
        // 1. 유효성 검사 (페이지 3 전용)
        const sum = state.distributions.reduce((a, b) => a + b, 0);
        if (sum !== state.totalAmount) {
          showToast("할당된 금액의 합계가 총 금액과 다릅니다. 확인해주세요.");
          return;
        }

        // 2. 섞기 및 뽑기 로직
        const validNames = state.participants
          .map((p) => p.trim())
          .filter((p) => p !== "");
        const shuffled = [...validNames].sort(() => 0.5 - Math.random());
        const losers = shuffled.slice(0, state.payerCount);

        // 3. UI 처리 (로딩 애니메이션)
        els.loadingOverlay.classList.remove("hidden-section");
        els.loadingOverlay.style.display = "flex";

        let shuffleInterval;
        let tick = 0;

        // 랜덤 이름 깜빡이기 효과
        shuffleInterval = setInterval(() => {
          const randomName =
            validNames[Math.floor(Math.random() * validNames.length)];
          els.shuffleNames.textContent = randomName;
          tick++;

          if (tick > 20) {
            // 약 1.5초 후 종료 (70ms * 20)
            clearInterval(shuffleInterval);
            els.loadingOverlay.classList.add("hidden-section");
            els.loadingOverlay.style.display = "none";
            showResults(losers);
          }
        }, 70);
      });

      function showResults(losers) {
        els.resultList.innerHTML = "";

        // 금액 기준 내림차순 정렬하여 보여주기 (옵션)
        const resultData = losers
          .map((name, idx) => ({
            name,
            amount: state.distributions[idx],
          }))
          .sort((a, b) => b.amount - a.amount);

        resultData.forEach((result, idx) => {
          const item = document.createElement("div");
          item.className =
            "flex justify-between items-center p-4 bg-gray-50 rounded-xl border border-gray-100";

          // 1등(가장 많이 내는 사람) 강조
          const isTop =
            idx === 0 &&
            resultData.length > 1 &&
            result.amount > resultData[1].amount;

          item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="text-2xl">${isTop ? "👑" : "💸"}</span>
                        <span class="font-bold text-gray-800 text-lg">${result.name}</span>
                    </div>
                    <div class="text-right">
                        <span class="font-extrabold text-blue-600 text-xl">${formatMoney(result.amount)}</span>
                        <span class="text-sm font-medium text-gray-500">원</span>
                    </div>
                `;
          els.resultList.appendChild(item);
        });

        els.resultModal.classList.remove("hidden-section");
        els.resultModal.style.display = "flex";
      }

      const closeModal = () => {
        els.resultModal.classList.add("hidden-section");
        els.resultModal.style.display = "none";
      };

      els.closeModalBtn.addEventListener("click", closeModal);
      els.restartBtn.addEventListener("click", () => {
        closeModal();
        // 재시작 시 1페이지로 돌아가도록 설정
        state.currentPage = 1;
        updatePageUI();
      });

      // 초기화 실행
      updatePageUI();
      renderParticipants();
    </script>
  </body>
</html>
