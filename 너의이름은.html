<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>귀여운 행성 이름 맞추기 🪐</title>
    <style>
        :root {
            --bg-color: #fff0f5;
            --card-bg: #ffffff;
            --text-main: #333333;
            --btn-bg: #ffe4e1;
            --btn-hover: #ffb6c1;
            --correct-bg: #a7f3d0;
            --wrong-bg: #fecaca;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow-x: hidden; /* 흔들림 효과 시 스크롤 방지 */
        }

        .app-container {
            background-color: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            padding: 30px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
            /* 흔들림 효과를 위한 설정 */
            transform-origin: center;
        }

        /* 오답 시 흔들림 효과 애니메이션 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 5px;
            color: #ff6b81;
        }

        .progress {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 20px;
        }

        .image-container {
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        .image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button.option-btn {
            background-color: var(--btn-bg);
            border: none;
            border-radius: 16px;
            padding: 15px 10px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
            word-break: keep-all;
        }

        button.option-btn:hover {
            background-color: var(--btn-hover);
            transform: translateY(-2px);
        }

        button.option-btn:disabled {
            cursor: not-allowed;
            transform: none;
        }

        button.option-btn.correct {
            background-color: var(--correct-bg) !important;
            color: #065f46;
        }

        button.option-btn.wrong {
            background-color: var(--wrong-bg) !important;
            color: #991b1b;
        }

        .feedback {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            height: 24px;
        }

        .hidden {
            display: none !important;
        }

        .result-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .result-screen h2 {
            font-size: 1.8rem;
            color: #ff6b81;
            margin-bottom: 10px;
        }

        .start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .start-screen p {
            color: #666;
            line-height: 1.5;
            margin-bottom: 30px;
            font-size: 1.05rem;
        }

        .start-btn {
            background-color: #ff6b81;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(255, 107, 129, 0.3);
        }

        .start-btn:hover {
            background-color: #ff4757;
            transform: scale(1.05);
        }

        .loading-text {
            grid-column: 1 / -1;
            color: #888;
            font-weight: bold;
            padding: 20px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .score-text {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .restart-btn {
            background-color: #ff6b81;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .restart-btn:hover {
            background-color: #ff4757;
            transform: scale(1.05);
        }

        /* 빵빠레 캔버스 스타일 */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* 클릭 이벤트를 가리지 않도록 설정 */
            z-index: 100; /* 다른 요소들 위에 보이도록 설정 */
        }
    </style>
</head>
<body>
    <!-- 빵빠레 효과를 위한 캔버스 -->
    <canvas id="confetti-canvas"></canvas>

    <div class="app-container" id="app">
        <!-- 시작 화면 (온보딩) -->
        <div id="start-screen" class="start-screen">
            <h1>귀여운 행성 이름 맞추기 🪐</h1>
            <div class="image-container">
                <img src="https://i.postimg.cc/XvwRt7MY/bagsuhaengseong(1x1).png" alt="대표 행성">
            </div>
            <p>어떤 행성인지 이름을 맞춰주세요!<br>총 7문제가 준비되어 있어요.</p>
            <button class="start-btn" onclick="startQuiz()">시작하기 🚀</button>
        </div>

        <!-- 퀴즈 화면 -->
        <div id="quiz-screen" class="hidden">
            <h1>어떤 행성일까요? 🪐</h1>
            <div class="progress" id="progress-text">1 / 7</div>
            
            <div class="image-container">
                <img id="planet-image" src="" alt="행성 이미지">
            </div>

            <div class="options-grid" id="options-container">
                <!-- 버튼들이 여기에 생성됩니다 -->
            </div>

            <div class="feedback" id="feedback-text"></div>
        </div>

        <!-- 결과 화면 -->
        <div id="result-screen" class="hidden result-screen">
            <h2>퀴즈 완료! 🎉</h2>
            <div class="score-text" id="score-text">7문제 중 0문제를 맞췄어요!</div>
            <button class="restart-btn" onclick="startQuiz()">다시 하기 💖</button>
        </div>
    </div>

    <script>
        // 행성 데이터 준비
        const planetsData = [
            { file: 'https://i.postimg.cc/XvwRt7MY/bagsuhaengseong(1x1).png', name: '박수 행성' },
            { file: 'https://i.postimg.cc/CxCJgZK6/seonsaenghaengseong(1x1).png', name: '발표 행성' },
            { file: 'https://i.postimg.cc/5tn3XZLm/undonghaengseong(1x1).png', name: '운동 행성' },
            { file: 'https://i.postimg.cc/RFYLRKPK/euaahaengseong(1x1).png', name: '으아아 행성' },
            { file: 'https://i.postimg.cc/DfW9KgKT/jjagpeulogeulaeminghaengseong(1x1).png', name: '짝코딩 행성' },
            { file: 'https://i.postimg.cc/nLcWSK1P/chughahaengseong(1x1).png', name: '축하 행성' },
            { file: 'https://i.postimg.cc/XJtDvR6f/keopichaeshaengseong(1x1).png', name: '티타임 행성' }
        ];

        let currentQuizList = [];
        let currentIndex = 0;
        let score = 0;
        let canClick = true;

        // 모든 행성 이름 목록 (오답을 고르기 위해 사용)
        const allNames = planetsData.map(p => p.name);

        const appContainer = document.getElementById('app');
        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const planetImage = document.getElementById('planet-image');
        const optionsContainer = document.getElementById('options-container');
        const progressText = document.getElementById('progress-text');
        const feedbackText = document.getElementById('feedback-text');
        const scoreText = document.getElementById('score-text');

        // 배열을 무작위로 섞는 함수
        function shuffleArray(array) {
            return array.slice().sort(() => Math.random() - 0.5);
        }

        // 퀴즈 시작!
        function startQuiz() {
            // 변수 초기화
            currentIndex = 0;
            score = 0;
            currentQuizList = shuffleArray(planetsData); // 문제 순서 섞기
            
            // 화면 전환
            startScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            resultScreen.classList.add('hidden');
            
            loadQuestion();
        }

        // 문제 불러오기
        function loadQuestion() {
            canClick = false; // 이미지 로딩 중 클릭 방지
            feedbackText.innerText = "";
            planetImage.style.display = 'none'; // 로딩 중 이미지 숨기기
            appContainer.classList.remove('shake'); // 흔들림 효과 초기화
            
            // 로딩 중 표시
            optionsContainer.innerHTML = '<div class="loading-text">다음 행성님이 오고 있어요... 🚀</div>';
            
            const currentPlanet = currentQuizList[currentIndex];
            
            // 이미지 로딩 완료 이벤트 (여기서 버튼들을 렌더링해요!)
            planetImage.onload = () => {
                planetImage.style.display = 'block'; // 이미지 다시 표시
                
                // UI 업데이트
                progressText.innerText = `${currentIndex + 1} / ${currentQuizList.length}`;

                // 선택지 만들기 (정답 1개 + 오답 3개)
                let wrongNames = allNames.filter(name => name !== currentPlanet.name);
                wrongNames = shuffleArray(wrongNames).slice(0, 3);
                
                const options = shuffleArray([currentPlanet.name, ...wrongNames]);

                // 버튼 렌더링
                optionsContainer.innerHTML = '';
                options.forEach(optionText => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = optionText;
                    btn.onclick = () => handleSelect(btn, optionText, currentPlanet.name);
                    optionsContainer.appendChild(btn);
                });
                
                canClick = true; // 클릭 허용
            };

            // 이미지 로딩 시작
            planetImage.src = currentPlanet.file;
        }

        // 답을 골랐을 때
        function handleSelect(clickedBtn, selectedName, correctName) {
            if (!canClick) return;
            canClick = false; // 중복 클릭 방지

            const allBtns = document.querySelectorAll('.option-btn');
            
            // 정답 확인
            if (selectedName === correctName) {
                clickedBtn.classList.add('correct');
                feedbackText.innerText = "정답이에요! 짝짝짝 👏";
                feedbackText.style.color = "#059669";
                score++;
                fireConfetti(); // 정답 시 빵빠레 발사!
            } else {
                clickedBtn.classList.add('wrong');
                feedbackText.innerText = "앗, 아쉬워요! 💦";
                feedbackText.style.color = "#dc2626";
                appContainer.classList.add('shake'); // 오답 시 화면 흔들기!
                
                // 정답인 버튼을 찾아서 초록색으로 표시
                allBtns.forEach(btn => {
                    if (btn.innerText === correctName) {
                        btn.classList.add('correct');
                    }
                });
            }

            // 잠시 후 다음 문제로 넘어가기
            setTimeout(() => {
                currentIndex++;
                if (currentIndex < currentQuizList.length) {
                    loadQuestion();
                } else {
                    showResult();
                }
            }, 1500); // 1.5초 대기
        }

        // 결과 화면 보여주기
        function showResult() {
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            
            let message = "";
            if(score === planetsData.length) {
                message = "우와! 완벽해요! 모든 행성을 알고 계시네요 😍";
                fireConfetti(); // 만점 시 빵빠레 한 번 더!
            } else if (score >= 4) {
                message = "잘하셨어요! 행성들과 꽤 친하시군요? 😊";
            } else {
                message = "행성들과 앞으로 더 친해져 보아요! 화이팅 💖";
            }

            scoreText.innerHTML = `총 <b>${planetsData.length}</b>문제 중 <b>${score}</b>문제를 맞췄어요!<br><br><span style="font-size:1rem; color:#666;">${message}</span>`;
        }

        // --- 빵빠레 효과 구현 (JavaScript로 직접 구현) ---
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let confetti = [];
        const confettiCount = 150;
        const gravity = 0.5;
        const terminalVelocity = 5;
        const drag = 0.075;
        const colors = [
            { front: '#ff6b81', back: '#ff4757' },
            { front: '#a7f3d0', back: '#059669' },
            { front: '#fecaca', back: '#dc2626' },
            { front: '#ffe4e1', back: '#ffb6c1' },
            { front: '#c7ceff', back: '#a5b4fc' }
        ];

        resizeCanvas = () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', resizeCanvas);

        randomRange = (min, max) => Math.random() * (max - min) + min;

        initConfetti = () => {
            for (let i = 0; i < confettiCount; i++) {
                confetti.push({
                    color: colors[Math.floor(randomRange(0, colors.length))],
                    dimensions: { x: randomRange(10, 20), y: randomRange(10, 30) },
                    position: { x: randomRange(0, canvas.width), y: canvas.height - 1 },
                    rotation: randomRange(0, 2 * Math.PI),
                    scale: { x: 1, y: 1 },
                    velocity: { x: randomRange(-25, 25), y: randomRange(0, -50) }
                });
            }
        };

        // 빵빠레 그리기 및 애니메이션 루프
        renderConfetti = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 배열 삭제 시 건너뛰는 버그를 막기 위해 뒤에서부터 반복합니다
            for (let i = confetti.length - 1; i >= 0; i--) {
                let confetto = confetti[i];

                confetto.velocity.x -= confetto.velocity.x * drag;
                confetto.velocity.y = Math.min(confetto.velocity.y + gravity, terminalVelocity);
                confetto.velocity.x += Math.random() > 0.5 ? Math.random() : -Math.random();

                confetto.position.x += confetto.velocity.x;
                confetto.position.y += confetto.velocity.y;

                if (confetto.position.x > canvas.width) confetto.position.x = 0;
                if (confetto.position.x < 0) confetto.position.x = canvas.width;

                confetto.scale.y = Math.cos(confetto.position.y * 0.1);
                ctx.fillStyle = confetto.scale.y > 0 ? confetto.color.front : confetto.color.back;

                ctx.save();
                ctx.translate(confetto.position.x, confetto.position.y);
                ctx.rotate(confetto.rotation);
                ctx.fillRect(-confetto.dimensions.x / 2, -confetto.dimensions.y / 2, confetto.dimensions.x, confetto.dimensions.y);
                ctx.restore();

                // 화면 아래로 넘어가면 배열에서 안전하게 제거
                if (confetto.position.y >= canvas.height) {
                    confetti.splice(i, 1);
                }
            }

            if (confetti.length > 0) {
                window.requestAnimationFrame(renderConfetti);
            } else {
                // 애니메이션이 완전히 끝났을 때 캔버스를 깨끗하게 한 번 더 지워줍니다! ✨
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        };

        // 빵빠레 발사 함수
        fireConfetti = () => {
            initConfetti();
            renderConfetti();
        };
        // --- 빵빠레 구현 끝 ---

    </script>
</body>
</html>
