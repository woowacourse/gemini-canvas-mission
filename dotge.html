<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bullet Dodge Game - UI Enhanced</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            body {
                margin: 0;
                overflow: hidden;
                background-color: #0f172a;
                font-family: 'Pretendard', sans-serif;
                touch-action: none;
            }
            canvas {
                display: block;
            }
            .ui-layer {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                color: white;
            }
            .interactive {
                pointer-events: auto;
            }
            /* 시간 표시 UI 스타일 개선 */
            #scoreBoard {
                position: absolute;
                top: 25px;
                right: 25px;
                text-align: right;
                pointer-events: none;
                z-index: 50;
            }
            #currentScore {
                font-size: 2rem;
                font-weight: 900;
                color: #fbbf24; /* 밝은 노란색 (Tailwind Amber-400) */
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8), 0 0 10px rgba(251, 191, 36, 0.5);
                letter-spacing: -0.02em;
            }
            #bestScore {
                font-size: 1rem;
                font-weight: 600;
                color: #fcd34d; /* 약간 연한 노란색 */
                opacity: 0.9;
                text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            }
        </style>
    </head>
    <body>
        <canvas id="gameCanvas"></canvas>

        <!-- 점수 표시 (시간 단위) -->
        <div id="scoreBoard">
            <div id="currentScore">TIME: 0.00s</div>
            <div id="bestScore">BEST: 0.00s</div>
        </div>

        <!-- UI 레이어 -->
        <div id="uiOverlay" class="ui-layer">
            <div
                id="menuContent"
                class="bg-slate-900/80 backdrop-blur-md p-8 rounded-2xl border border-slate-700 text-center interactive shadow-2xl"
            >
                <h1
                    id="uiTitle"
                    class="text-4xl font-extrabold mb-4 bg-gradient-to-r from-blue-400 to-green-400 bg-clip-text text-transparent"
                >
                    BULLET DODGE
                </h1>
                <p id="uiMessage" class="text-slate-300 mb-6">마우스로 총알을 피하고 초록색 쉴드를 획득하세요!</p>
                <button
                    id="startBtn"
                    class="px-8 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-full transition-all transform hover:scale-105 active:scale-95"
                >
                    게임 시작
                </button>
            </div>
        </div>

        <script>
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const uiOverlay = document.getElementById('uiOverlay');
            const uiTitle = document.getElementById('uiTitle');
            const uiMessage = document.getElementById('uiMessage');
            const startBtn = document.getElementById('startBtn');
            const scoreDisplay = document.getElementById('currentScore');
            const bestScoreDisplay = document.getElementById('bestScore');

            let gameState = 'START';
            let survivalTime = 0;
            let bestTime = 0;
            let lastTime = 0;
            let spawnTimer = 0;
            let itemSpawnTimer = 0;
            let difficultyMultiplier = 1;

            const mouse = { x: 0, y: 0, radius: 8 };
            let bullets = [];
            let particles = [];
            let items = [];
            let isShielded = false;

            class Item {
                constructor() {
                    this.radius = 12;
                    this.x = Math.random() * (canvas.width - 40) + 20;
                    this.y = Math.random() * (canvas.height - 40) + 20;
                    this.pulse = 0;
                    this.aliveTime = 0;
                }

                update(dt) {
                    this.aliveTime += dt;
                    this.pulse = Math.sin(this.aliveTime * 0.005) * 5;
                    return this.aliveTime > 10000;
                }

                draw() {
                    ctx.save();
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#4ade80';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius + this.pulse, 0, Math.PI * 2);
                    ctx.fillStyle = '#4ade80';
                    ctx.fill();

                    ctx.fillStyle = '#064e3b';
                    ctx.font = 'bold 12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('S', this.x, this.y);
                    ctx.restore();
                }
            }

            class Bullet {
                constructor() {
                    this.reset();
                }

                reset() {
                    const side = Math.floor(Math.random() * 4);
                    this.radius = 3 + Math.random() * 3;

                    if (side === 0) {
                        this.x = Math.random() * canvas.width;
                        this.y = -this.radius;
                    } else if (side === 1) {
                        this.x = canvas.width + this.radius;
                        this.y = Math.random() * canvas.height;
                    } else if (side === 2) {
                        this.x = Math.random() * canvas.width;
                        this.y = canvas.height + this.radius;
                    } else {
                        this.x = -this.radius;
                        this.y = Math.random() * canvas.height;
                    }

                    const targetX = mouse.x + (Math.random() - 0.5) * 200;
                    const targetY = mouse.y + (Math.random() - 0.5) * 200;

                    const angle = Math.atan2(targetY - this.y, targetX - this.x);
                    const speed = (1.5 + Math.random() * 2.5) * difficultyMultiplier;

                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.color = `hsl(${190 + Math.random() * 40}, 100%, 70%)`;
                    this.history = [];
                }

                update() {
                    this.history.push({ x: this.x, y: this.y });
                    if (this.history.length > 5) this.history.shift();
                    this.x += this.vx;
                    this.y += this.vy;
                    return (
                        this.x < -100 || this.x > canvas.width + 100 || this.y < -100 || this.y > canvas.height + 100
                    );
                }

                draw() {
                    this.history.forEach((pos, index) => {
                        ctx.beginPath();
                        ctx.arc(pos.x, pos.y, this.radius * (index / this.history.length), 0, Math.PI * 2);
                        ctx.fillStyle = this.color.replace(')', `, ${index * 0.1})`).replace('hsl', 'hsla');
                        ctx.fill();
                    });
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                }
            }

            class Particle {
                constructor(x, y, color) {
                    this.x = x;
                    this.y = y;
                    this.color = color;
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 5 + 2;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.alpha = 1;
                    this.decay = Math.random() * 0.02 + 0.01;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.alpha -= this.decay;
                    return this.alpha <= 0;
                }
                draw() {
                    ctx.save();
                    ctx.globalAlpha = this.alpha;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    ctx.restore();
                }
            }

            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('mousemove', (e) => {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
            });
            window.addEventListener(
                'touchmove',
                (e) => {
                    if (e.touches.length > 0) {
                        mouse.x = e.touches[0].clientX;
                        mouse.y = e.touches[0].clientY;
                    }
                },
                { passive: false }
            );

            startBtn.addEventListener('click', startGame);

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            function startGame() {
                survivalTime = 0;
                difficultyMultiplier = 1;
                bullets = [];
                particles = [];
                items = [];
                isShielded = false;
                gameState = 'PLAYING';
                uiOverlay.classList.add('hidden');
                lastTime = performance.now();
                requestAnimationFrame(gameLoop);
            }

            function gameOver() {
                gameState = 'GAMEOVER';
                uiOverlay.classList.remove('hidden');
                uiTitle.innerText = 'GAME OVER';
                uiTitle.className =
                    'text-4xl font-extrabold mb-4 bg-gradient-to-r from-red-400 to-orange-500 bg-clip-text text-transparent';
                uiMessage.innerHTML = `생존 시간: <span class="text-white font-bold">${(survivalTime / 1000).toFixed(
                    2
                )}초</span>`;
                startBtn.innerText = '다시 도전';

                if (survivalTime > bestTime) {
                    bestTime = survivalTime;
                    bestScoreDisplay.innerText = `BEST: ${(bestTime / 1000).toFixed(2)}s`;
                }
            }

            function checkCollision(obj1, obj2) {
                const dx = obj1.x - obj2.x;
                const dy = obj1.y - obj2.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                return distance < (obj1.radius || 0) + (obj2.radius || 0);
            }

            function createExplosion(x, y, color, count = 20) {
                for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color));
            }

            function gameLoop(timestamp) {
                if (gameState !== 'PLAYING') return;

                const deltaTime = timestamp - lastTime;
                lastTime = timestamp;

                ctx.fillStyle = 'rgba(15, 23, 42, 0.3)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                survivalTime += deltaTime;
                difficultyMultiplier = 1 + survivalTime / 25000;
                scoreDisplay.innerText = `TIME: ${(survivalTime / 1000).toFixed(2)}s`;

                spawnTimer += deltaTime;
                const spawnRate = Math.max(45, 300 - survivalTime / 150);
                if (spawnTimer > spawnRate) {
                    bullets.push(new Bullet());
                    spawnTimer = 0;
                }

                itemSpawnTimer += deltaTime;
                if (itemSpawnTimer > 10000 && items.length < 2) {
                    items.push(new Item());
                    itemSpawnTimer = 0;
                }

                for (let i = items.length - 1; i >= 0; i--) {
                    const item = items[i];
                    if (item.update(deltaTime)) {
                        items.splice(i, 1);
                        continue;
                    }
                    if (checkCollision(item, mouse)) {
                        isShielded = true;
                        createExplosion(item.x, item.y, '#4ade80', 10);
                        items.splice(i, 1);
                        continue;
                    }
                    item.draw();
                }

                for (let i = bullets.length - 1; i >= 0; i--) {
                    const bullet = bullets[i];
                    if (bullet.update()) {
                        bullets.splice(i, 1);
                        continue;
                    }

                    if (checkCollision(bullet, mouse)) {
                        if (isShielded) {
                            isShielded = false;
                            createExplosion(mouse.x, mouse.y, '#4ade80', 15);
                            bullets.splice(i, 1);
                        } else {
                            createExplosion(mouse.x, mouse.y, bullet.color);
                            gameOver();
                            return;
                        }
                    }
                    bullet.draw();
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    if (particles[i].update()) particles.splice(i, 1);
                    else particles[i].draw();
                }

                if (isShielded) {
                    ctx.beginPath();
                    ctx.arc(mouse.x, mouse.y, mouse.radius + 10, 0, Math.PI * 2);
                    ctx.strokeStyle = '#4ade80';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    ctx.beginPath();
                    ctx.arc(mouse.x, mouse.y, mouse.radius + 10, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(74, 222, 128, 0.1)';
                    ctx.fill();
                }

                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, mouse.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ffffff';
                ctx.fill();
                ctx.shadowBlur = 0;

                requestAnimationFrame(gameLoop);
            }

            resizeCanvas();
            mouse.x = window.innerWidth / 2;
            mouse.y = window.innerHeight / 2;
        </script>
    </body>
</html>
