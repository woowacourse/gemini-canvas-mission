<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java & Spring Deep Dive</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --secondary: #ec4899;
            --success: #10b981;
            --error: #ef4444;
            --bg: #f8fafc;
            --card: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 550px;
            background: var(--card);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.4s ease-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 1.6rem; color: var(--primary); margin-bottom: 8px; letter-spacing: -0.5px; }
        
        .progress-container { margin-bottom: 20px; }
        .progress-bar { height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }

        .question-box { font-size: 1.15rem; font-weight: 700; margin-bottom: 24px; line-height: 1.5; color: #0f172a; }
        .options-list { display: grid; gap: 12px; }
        .option-item {
            padding: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            background: white;
            cursor: pointer;
            text-align: left;
            font-size: 1rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }
        .option-item:hover { border-color: var(--primary); background: #f5f3ff; }
        .option-item.correct { background: var(--success); border-color: var(--success); color: white; }
        .option-item.wrong { background: var(--error); border-color: var(--error); color: white; }
        .option-item.disabled { pointer-events: none; opacity: 0.7; }

        .feedback-box { margin-top: 24px; padding: 20px; border-radius: 16px; display: none; }
        .feedback-box.active { display: block; }
        .feedback-box.correct-style { background: #ecfdf5; border: 1px solid #10b981; }
        .feedback-box.wrong-style { background: #fef2f2; border: 1px solid #ef4444; }

        .feedback-title { font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .feedback-content { font-size: 0.95rem; line-height: 1.6; color: var(--text-main); }
        .explanation-label { font-size: 0.8rem; font-weight: 800; text-transform: uppercase; margin-bottom: 4px; display: block; }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 15px;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:disabled { background: #cbd5e1; cursor: not-allowed; }
        .btn-outline { background: white; border: 2px solid var(--primary); color: var(--primary); }
        .btn-secondary { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
        .btn-group { display: flex; gap: 10px; }

        .selector-label { margin-bottom: 8px; font-weight: 600; font-size: 0.85rem; color: var(--text-sub); }
        .group-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }
        .select-btn {
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            transition: 0.2s;
            background: white;
        }
        .select-btn.selected {
            border-color: var(--primary);
            background: #f5f3ff;
            color: var(--primary);
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .result-score {
            width: 100px; height: 100px; border-radius: 50%;
            background: var(--primary); color: white;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            margin: 20px auto; font-size: 1.5rem; font-weight: 800;
        }

        .review-card {
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            background: #fcfcfc;
        }
        .review-q { font-weight: 700; margin-bottom: 12px; display: block; }
        .review-ans { font-size: 0.9rem; padding: 10px; border-radius: 8px; background: #dcfce7; color: #166534; margin-bottom: 10px; }
        .review-wrong { font-size: 0.9rem; padding: 10px; border-radius: 8px; background: #fee2e2; color: #991b1b; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 메인 화면 -->
    <div id="home-screen" class="screen active">
        <div class="header">
            <h1>Java & Spring Deep Dive</h1>
            <p>심층 학습을 위한 퀴즈 설정을 선택하세요.</p>
        </div>

        <!-- 주제 선택 -->
        <div class="selector-label">학습 주제</div>
        <div class="group-selector">
            <div class="select-btn selected" data-type="topic" onclick="setSelection('topic', 'Mixed', this)">전체</div>
            <div class="select-btn" data-type="topic" onclick="setSelection('topic', 'Java', this)">Java</div>
            <div class="select-btn" data-type="topic" onclick="setSelection('topic', 'Spring', this)">Spring</div>
        </div>

        <!-- 난이도 선택 -->
        <div class="selector-label">퀴즈 난이도</div>
        <div class="group-selector">
            <div class="select-btn" data-type="level" onclick="setSelection('level', '쉬움', this)">쉬움</div>
            <div class="select-btn selected" data-type="level" onclick="setSelection('level', '보통', this)">보통</div>
            <div class="select-btn" data-type="level" onclick="setSelection('level', '어려움', this)">어려움</div>
        </div>

        <button id="start-btn" class="btn btn-primary" onclick="startAIQuiz()">
            <span id="btn-text">Deep Dive 시작하기</span>
        </button>

        <button id="main-review-btn" class="btn btn-outline" style="display: none; margin-top: 10px;" onclick="startReview()">
            최근 오답 다시 보기
        </button>
    </div>

    <!-- 퀴즈 화면 -->
    <div id="quiz-screen" class="screen">
        <div class="progress-container">
            <div style="display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 6px;">
                <span id="current-pos">1/5</span>
                <span id="quiz-mode-tag" style="color: var(--primary); font-weight: bold;">심층 분석 중</span>
            </div>
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
        </div>
        
        <div id="question-text" class="question-box"></div>
        <div id="options-container" class="options-list"></div>

        <div id="feedback-area" class="feedback-box">
            <div id="feedback-title" class="feedback-title"></div>
            <div id="feedback-body" class="feedback-content"></div>
            <div id="wrong-actions" class="btn-group">
                <button class="btn btn-outline" onclick="retryStep()">다시 도전</button>
                <button class="btn btn-primary" onclick="showFullAnalysis()">심층 해설 보기</button>
            </div>
        </div>

        <button id="next-btn" class="btn btn-primary" style="display: none;" onclick="goNext()">다음 단계로</button>
    </div>

    <!-- 결과 화면 -->
    <div id="result-screen" class="screen" style="text-align: center;">
        <div class="header">
            <h1>Deep Dive 완료</h1>
        </div>
        <div class="result-score">
            <span id="score-text">0</span>
            <span style="font-size: 0.8rem;">점</span>
        </div>
        <p id="result-desc" style="margin-bottom: 20px; line-height: 1.6;"></p>
        <div class="btn-group" style="flex-direction: column;">
            <button id="res-review-btn" class="btn btn-outline" onclick="startReview()">오답 분석 리포트</button>
            <button class="btn btn-primary" onclick="goToHome()">메인으로 이동</button>
        </div>
    </div>

    <!-- 복습 화면 -->
    <div id="review-screen" class="screen">
        <div class="header">
            <h1 style="color: var(--error);">오답 분석 리포트</h1>
            <p>잘못 이해한 개념을 심층적으로 복습하세요.</p>
        </div>
        <div id="review-list" style="max-height: 400px; overflow-y: auto; padding-right: 5px;"></div>
        <button class="btn btn-primary" onclick="goToHome()">메인으로 돌아가기</button>
    </div>
</div>

<script>
    const apiKey = ""; 
    let currentQuizSet = [];
    let currentIdx = 0;
    let score = 0;
    let answered = false;
    let wrongQuestions = []; 
    
    // 기본 설정값
    let selectedTopic = "Mixed";
    let selectedLevel = "보통";

    function setSelection(type, value, el) {
        if (type === 'topic') selectedTopic = value;
        if (type === 'level') selectedLevel = value;
        
        document.querySelectorAll(`.select-btn[data-type="${type}"]`).forEach(btn => {
            btn.classList.remove('selected');
        });
        el.classList.add('selected');
    }

    async function generateQuestionsWithAI() {
        const topicContext = selectedTopic === 'Mixed' ? 'Java and Spring Framework' : selectedTopic;
        const systemPrompt = `You are a professional software engineering instructor specialized in high-level architectural concepts. 
        Generate 5 high-quality multiple choice questions in Korean.
        Subject: ${topicContext}
        Difficulty Level: ${selectedLevel}
        
        Guidelines for Difficulty:
        - 쉬움 (Easy): Fundamental concepts, standard API usage.
        - 보통 (Medium): Design patterns, core internal mechanisms.
        - 어려움 (Hard): Performance tuning, architectural trade-offs, deep internals (e.g., JVM memory model, Spring Proxy behavior).

        Response MUST be a valid JSON object ONLY, with a "questions" array.
        Each question object MUST have:
        "q": question text,
        "options": array of 4 strings,
        "correct": index (0-3),
        "exps": array of 4 strings explaining each option.
        Do not add any extra text outside the JSON block.`;

        const userQuery = `Generate 5 deep-dive questions about ${topicContext} with ${selectedLevel} difficulty level.`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: userQuery }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    generationConfig: { 
                        responseMimeType: "application/json",
                        temperature: 0.7 
                    }
                })
            });

            if (!response.ok) throw new Error('API 호출 실패');
            const result = await response.json();
            let text = result.candidates?.[0]?.content?.parts?.[0]?.text;
            
            // JSON 수리 로직
            if (text.includes('```json')) {
                text = text.split('```json')[1].split('```')[0].trim();
            } else if (text.includes('```')) {
                text = text.split('```')[1].split('```')[0].trim();
            }

            const data = JSON.parse(text);
            return data.questions;
        } catch (error) {
            console.error('AI Generation Error:', error);
            return null;
        }
    }

    async function startAIQuiz() {
        const btn = document.getElementById('start-btn');
        btn.disabled = true;
        const originalText = btn.innerHTML;
        btn.innerHTML = `<span class="loading-spinner"></span>Deep Dive 생성 중...`;

        try {
            const questions = await generateQuestionsWithAI();
            
            if (questions && questions.length > 0) {
                currentQuizSet = questions;
                currentIdx = 0;
                score = 0;
                showScreen('quiz-screen');
                document.getElementById('quiz-mode-tag').innerText = `${selectedTopic} / ${selectedLevel}`;
                renderQuestion();
            } else {
                throw new Error("데이터 파싱 실패");
            }
        } catch (e) {
            alert('데이터 로드 중 오류가 발생했습니다. AI 엔진 응답이 원활하지 않을 수 있으니 다시 시도해주세요.');
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        
        if (id === 'home-screen') {
            const mainReviewBtn = document.getElementById('main-review-btn');
            mainReviewBtn.style.display = wrongQuestions.length > 0 ? 'block' : 'none';
        }
    }

    function goToHome() {
        showScreen('home-screen');
    }

    function renderQuestion() {
        answered = false;
        const qData = currentQuizSet[currentIdx];
        
        document.getElementById('current-pos').innerText = `Step ${currentIdx + 1} / 5`;
        document.getElementById('progress-fill').style.width = `${(currentIdx / 5) * 100}%`;
        document.getElementById('question-text').innerText = qData.q;
        document.getElementById('feedback-area').classList.remove('active');
        document.getElementById('next-btn').style.display = 'none';

        const container = document.getElementById('options-container');
        container.innerHTML = '';
        qData.options.forEach((opt, i) => {
            const div = document.createElement('div');
            div.className = 'option-item';
            div.innerText = opt;
            div.onclick = () => checkAnswer(i);
            container.appendChild(div);
        });
    }

    function checkAnswer(idx) {
        if (answered) return;
        const qData = currentQuizSet[currentIdx];
        const items = document.querySelectorAll('.option-item');
        
        if (idx === qData.correct) {
            answered = true;
            score++;
            items[idx].classList.add('correct');
            showFeedback(true);
        } else {
            items[idx].classList.add('wrong');
            if (!wrongQuestions.find(w => w.q === qData.q)) {
                wrongQuestions.push({ ...qData, userChoice: idx });
            }
            showFeedback(false, idx);
        }
        items.forEach(item => item.classList.add('disabled'));
    }

    function showFeedback(isCorrect, chosenIdx = -1) {
        const fb = document.getElementById('feedback-area');
        const title = document.getElementById('feedback-title');
        const body = document.getElementById('feedback-body');
        const actions = document.getElementById('wrong-actions');
        const nextBtn = document.getElementById('next-btn');
        const qData = currentQuizSet[currentIdx];

        fb.className = 'feedback-box active ' + (isCorrect ? 'correct-style' : 'wrong-style');
        
        if (isCorrect) {
            title.innerHTML = '<span>✅</span> 인사이트 분석 성공';
            body.innerHTML = `<small class="explanation-label">핵심 해설</small>${qData.exps[qData.correct]}`;
            actions.style.display = 'none';
            nextBtn.style.display = 'block';
        } else {
            title.innerHTML = '<span>❌</span> 개념 확인 필요';
            body.innerHTML = `
                <div style="margin-bottom:10px;">
                    <small class="explanation-label">선택한 항목에 대한 분석</small>
                    ${qData.exps[chosenIdx]}
                </div>
                <p style="font-size:0.85rem; color:var(--text-sub);">심층 분석을 통해 정답의 근거를 확인하세요.</p>
            `;
            actions.style.display = 'flex';
            nextBtn.style.display = 'none';
        }
    }

    function retryStep() {
        document.getElementById('feedback-area').classList.remove('active');
        const items = document.querySelectorAll('.option-item');
        items.forEach(item => {
            item.className = 'option-item';
            item.classList.remove('disabled');
        });
        answered = false;
    }

    function showFullAnalysis() {
        const qData = currentQuizSet[currentIdx];
        const title = document.getElementById('feedback-title');
        const body = document.getElementById('feedback-body');
        const actions = document.getElementById('wrong-actions');
        const nextBtn = document.getElementById('next-btn');
        const items = document.querySelectorAll('.option-item');

        items[qData.correct].classList.add('correct');
        title.innerHTML = '<span>💡</span> Deep Dive 심층 해설';
        let html = '<div style="display:grid; gap:8px; margin-top:10px;">';
        qData.exps.forEach((e, i) => {
            const isCorrect = i === qData.correct;
            html += `<div style="font-size:0.85rem; padding:10px; border-radius:10px; background:${isCorrect ? '#dcfce7' : 'rgba(0,0,0,0.03)'}">${isCorrect ? '<strong>[정답]</strong> ' : ''}${e}</div>`;
        });
        html += '</div>';
        body.innerHTML = html;
        
        actions.style.display = 'none';
        nextBtn.style.display = 'block';
        answered = true;
    }

    function goNext() {
        currentIdx++;
        if (currentIdx < 5) {
            renderQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        showScreen('result-screen');
        const finalScore = (score / 5) * 100;
        document.getElementById('score-text').innerText = finalScore;
        
        const reviewBtn = document.getElementById('res-review-btn');
        if (wrongQuestions.length === 0) {
            reviewBtn.style.display = 'none';
            document.getElementById('result-desc').innerText = `완벽합니다! ${selectedLevel} 난이도의 모든 심화 개념을 마스터하셨습니다.`;
        } else {
            reviewBtn.style.display = 'block';
            document.getElementById('result-desc').innerText = `Deep Dive 과정이 종료되었습니다. 오답 분석 리포트를 확인하여 지식의 빈틈을 채워보세요.`;
        }
    }

    function startReview() {
        showScreen('review-screen');
        const list = document.getElementById('review-list');
        list.innerHTML = '';

        if (wrongQuestions.length === 0) {
            list.innerHTML = '<p style="text-align:center; padding:20px;">분석할 데이터가 없습니다.</p>';
            return;
        }

        wrongQuestions.forEach((q, idx) => {
            const card = document.createElement('div');
            card.className = 'review-card';
            card.innerHTML = `
                <span class="review-q">${idx + 1}. ${q.q}</span>
                <div class="review-wrong">나의 분석: ${q.options[q.userChoice]}</div>
                <div class="review-ans">올바른 분석: ${q.options[q.correct]}</div>
                <div style="font-size:0.85rem; line-height:1.5; color:var(--text-main); border-top:1px solid #eee; padding-top:10px; margin-top:10px;">
                    <strong>심층 가이드:</strong><br>${q.exps[q.correct]}
                </div>
            `;
            list.appendChild(card);
        });
    }
</script>
</body>
</html>
