<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>귀여운 2D 행성 수박게임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body {
            background-color: #050510;
            color: white;
            overflow: hidden;
            touch-action: none;
        }
        #app-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            border-left: 1px solid rgba(255,255,255,0.05);
            border-right: 1px solid rgba(255,255,255,0.05);
            background: linear-gradient(to bottom, #070714, #120A2B);
        }
        #canvas-wrapper {
            flex: 1;
            position: relative;
            width: 100%;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
        }
        .modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }
        .hidden { display: none !important; }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 미리보기 및 UI용 CSS 귀여운 얼굴 */
        .cute-face {
            position: absolute;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }
        .eyes {
            display: flex; gap: 8px; margin-bottom: 2px;
        }
        .eye { width: 4px; height: 4px; background: white; border-radius: 50%; }
        .mouth {
            width: 8px; height: 4px;
            border-bottom: 2px solid white;
            border-radius: 0 0 8px 8px;
        }

        @keyframes blastAnim {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen select-none">

<div id="app-container" class="shadow-2xl shadow-indigo-500/20 relative">

    <!-- === 게임 캔버스 영역 === -->
    <div id="canvas-wrapper">
        <!-- Header / UI -->
        <div class="absolute top-0 left-0 w-full p-4 flex justify-between items-start z-10 pointer-events-none">
            <div class="bg-black/40 backdrop-blur-md rounded-2xl p-3 border border-white/10 shadow-lg">
                <p class="text-[10px] text-gray-300 font-bold mb-1 tracking-wider">SCORE</p>
                <p id="score-display" class="text-3xl font-black text-white font-mono leading-none">0</p>
            </div>
            <div class="bg-black/40 backdrop-blur-md rounded-2xl p-3 border border-white/10 shadow-lg flex flex-col items-center min-w-[80px]">
                <p class="text-[10px] text-gray-300 font-bold mb-2 tracking-wider">NEXT</p>
                <div id="next-planet-preview" class="w-12 h-12 relative flex items-center justify-center">
                    <!-- Preview drawn via JS -->
                </div>
            </div>
        </div>

        <!-- 블랙홀 아이템 버튼 -->
        <div class="absolute top-24 right-4 z-20 pointer-events-auto">
            <button id="bh-btn" class="bg-purple-600/90 hover:bg-purple-500 text-white font-bold py-2 px-4 rounded-full shadow-[0_0_15px_rgba(168,85,247,0.8)] border border-purple-300 transition-all flex items-center gap-2 transform hover:scale-105 active:scale-95">
                <span class="text-xl">🌀</span>
                <div class="flex flex-col text-left">
                    <span class="text-[10px] text-purple-200 leading-none">위기탈출</span>
                    <span id="bh-count-text" class="text-sm leading-none mt-1">블랙홀 (1)</span>
                </div>
            </button>
        </div>

        <!-- 블랙홀 모드 오버레이 -->
        <div id="bh-overlay" class="absolute inset-0 bg-purple-900/40 z-10 pointer-events-none hidden flex items-center justify-center backdrop-blur-[2px]">
            <div class="bg-black/60 px-6 py-3 rounded-full border border-purple-400 animate-pulse text-center">
                <p class="text-white text-lg font-black drop-shadow-md">영역을 클릭해 파괴하세요!</p>
                <p class="text-purple-300 text-xs mt-1">주변의 행성들이 모두 삭제됩니다.</p>
            </div>
        </div>

        <!-- 데드라인 (선명한 HTML 오버레이) -->
        <div id="html-deadline" class="absolute left-0 w-full border-t-[3px] border-red-500/60 border-dashed z-0 pointer-events-none transition-all"></div>

        <!-- 순수 2D Canvas Container -->
        <canvas id="game-canvas" class="absolute inset-0 z-0"></canvas>
    </div>

    <!-- === 진화 순서 UI 영역 === -->
    <div id="footer-ui" class="w-full bg-[#0a0515]/95 border-t border-white/10 pt-3 pb-5 flex flex-col items-center shadow-[0_-10px_30px_rgba(0,0,0,0.5)] z-20 shrink-0">
        <p class="text-[10px] text-gray-400 font-bold mb-2 tracking-widest">진화 순서 가이드</p>
        <div id="evolution-sequence" class="flex items-center w-full overflow-x-auto px-4 hide-scrollbar snap-x" style="gap: 6px;">
            <!-- JS로 동적 생성됨 -->
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="modal">
        <h1 class="text-4xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-pink-400 to-yellow-400 drop-shadow-lg text-center leading-tight">거대 행성<br>팡팡 2D</h1>
        <p class="text-gray-200 mb-8 text-center px-6 font-medium mt-4">귀여운 행성들을 합쳐서<br>거대한 태양을 만들어주세요!</p>

        <button id="start-btn" class="px-10 py-4 bg-gradient-to-r from-pink-500 to-orange-400 hover:from-pink-400 hover:to-orange-300 text-white font-bold rounded-full shadow-[0_0_20px_rgba(236,72,153,0.5)] transform transition active:scale-95 text-lg pointer-events-auto">
            우주로 출발
        </button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="modal hidden">
        <h2 class="text-4xl font-black mb-2 text-red-400 drop-shadow-md">우주 초과!</h2>
        <p class="text-gray-200 mb-6 text-lg">상자에 행성이 가득 찼어요.</p>

        <div class="bg-white/10 backdrop-blur-md rounded-3xl p-6 mb-8 text-center border border-white/20 w-3/4 max-w-[250px]">
            <p class="text-sm text-gray-300 mb-1">최종 점수</p>
            <p id="final-score" class="text-5xl font-black text-white font-mono text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-orange-400">0</p>
        </div>

        <button id="restart-btn" class="px-10 py-4 bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-400 hover:to-purple-400 text-white font-bold rounded-full shadow-[0_0_20px_rgba(99,102,241,0.5)] transform transition active:scale-95 text-lg pointer-events-auto">
            다시 하기
        </button>
    </div>
</div>

<script>
    // --- Game Configuration & Data ---
    let GAME_WIDTH = 420;
    let GAME_HEIGHT = 900;
    let DROP_LINE_Y = 160;

    // 크기가 0.8배로 정교하게 축소된 11단계 실제 행성 데이터 롤백
    const PLANETS = [
        { id: 0, name: "명왕성", radius: 19, color1: "#8E9EAB", color2: "#e0e5e8", face: 'normal' },
        { id: 1, name: "달", radius: 27, color1: "#8293ba", color2: "#c1ccdf", face: 'sleepy' },
        { id: 2, name: "수성", radius: 37, color1: "#8391a1", color2: "#b0b8c2", face: 'normal' },
        { id: 3, name: "화성", radius: 50, color1: "#e53935", color2: "#ff8a80", face: 'angry' },
        { id: 4, name: "금성", radius: 64, color1: "#ffb300", color2: "#ffe57f", face: 'smile' },
        { id: 5, name: "지구", radius: 80, color1: "#1e88e5", color2: "#90caf9", face: 'happy' },
        { id: 6, name: "해왕성", radius: 99, color1: "#1e3a8a", color2: "#60a5fa", face: 'normal' },
        { id: 7, name: "천왕성", radius: 118, color1: "#06b6d4", color2: "#a5f3fc", face: 'sleepy', hasVerticalRing: true },
        { id: 8, name: "토성", radius: 142, color1: "#fbc02d", color2: "#fff59d", face: 'smile', hasRing: true },
        { id: 9, name: "목성", radius: 168, color1: "#ef6c00", color2: "#ffcc80", face: 'bigsmile' },
        { id: 10, name: "태양", radius: 196, color1: "#ff1744", color2: "#ff8a65", face: 'star', glow: true }
    ];

    // 2D 캔버스 성능 최적화를 위한 오프스크린 렌더링 (사전 생성)
    const preRenderedPlanets = {};

    function preRenderPlanets() {
        PLANETS.forEach(planet => {
            const canvas = document.createElement('canvas');
            const padding = planet.radius * 1.5; // 고리 및 발광 영역 확보
            canvas.width = (planet.radius + padding) * 2;
            canvas.height = (planet.radius + padding) * 2;
            const ctx = canvas.getContext('2d');
            const center = canvas.width / 2;

            ctx.save();
            ctx.translate(center, center);

            // 빛 발광 효과 (태양)
            if (planet.glow) {
                ctx.shadowBlur = 20;
                ctx.shadowColor = planet.color1;
            }

            // 둥근 행성 그라데이션 몸체
            const grad = ctx.createLinearGradient(-planet.radius*0.5, -planet.radius*0.5, planet.radius*0.5, planet.radius*0.5);
            grad.addColorStop(0, planet.color1);
            grad.addColorStop(1, planet.color2);

            ctx.beginPath();
            ctx.arc(0, 0, planet.radius, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.shadowBlur = 0;

            // 행성별 특수 무늬 (지구, 달, 목성 등)
            ctx.save();
            ctx.beginPath(); ctx.arc(0, 0, planet.radius, 0, Math.PI * 2); ctx.clip();
            if (planet.id === 5) { // 지구 대륙
                ctx.fillStyle = '#4ade80';
                ctx.beginPath(); ctx.arc(-planet.radius*0.3, -planet.radius*0.2, planet.radius*0.4, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(planet.radius*0.4, planet.radius*0.1, planet.radius*0.5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(-planet.radius*0.5, planet.radius*0.6, planet.radius*0.3, 0, Math.PI*2); ctx.fill();
            } else if (planet.id === 1) { // 달 크레이터
                ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
                [[-0.3, -0.4, 0.2], [0.4, 0.2, 0.3], [-0.4, 0.5, 0.15], [0.5, -0.3, 0.2]].forEach(c => {
                    ctx.beginPath(); ctx.arc(c[0]*planet.radius, c[1]*planet.radius, c[2]*planet.radius, 0, Math.PI*2); ctx.fill();
                });
            } else if (planet.id === 9) { // 목성 줄무늬
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.fillRect(-planet.radius, -planet.radius*0.4, planet.radius*2, planet.radius*0.2);
                ctx.fillRect(-planet.radius, planet.radius*0.2, planet.radius*2, planet.radius*0.2);
                ctx.fillStyle = 'rgba(200, 50, 50, 0.5)';
                ctx.beginPath(); ctx.ellipse(-planet.radius*0.2, planet.radius*0.1, planet.radius*0.25, planet.radius*0.15, 0, 0, Math.PI*2); ctx.fill();
            }
            ctx.restore();

            // 고리 (토성, 천왕성)
            if (planet.hasRing) {
                ctx.beginPath();
                ctx.ellipse(0, 0, planet.radius * 1.5, planet.radius * 0.3, -20 * Math.PI/180, 0, Math.PI * 2);
                ctx.lineWidth = Math.max(3, planet.radius * 0.08);
                ctx.strokeStyle = `rgba(255, 255, 255, 0.7)`;
                ctx.stroke();
            } else if (planet.hasVerticalRing) {
                ctx.beginPath();
                ctx.ellipse(0, 0, planet.radius * 0.3, planet.radius * 1.4, 20 * Math.PI/180, 0, Math.PI * 2);
                ctx.lineWidth = Math.max(3, planet.radius * 0.08);
                ctx.strokeStyle = `rgba(255, 255, 255, 0.7)`;
                ctx.stroke();
            }

            // 귀여운 얼굴
            ctx.fillStyle = 'white';
            ctx.strokeStyle = 'white';
            ctx.lineWidth = Math.max(2, planet.radius * 0.05);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            const eyeOffset = planet.radius * 0.35;
            const eyeY = -planet.radius * 0.1;

            if (planet.face === 'sleepy') {
                ctx.beginPath(); ctx.arc(-eyeOffset, eyeY, planet.radius*0.12, Math.PI, Math.PI*2, true); ctx.stroke();
                ctx.beginPath(); ctx.arc(eyeOffset, eyeY, planet.radius*0.12, Math.PI, Math.PI*2, true); ctx.stroke();
            } else if (planet.face === 'angry') {
                ctx.beginPath(); ctx.moveTo(-eyeOffset-8, eyeY-8); ctx.lineTo(-eyeOffset+4, eyeY); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(eyeOffset+8, eyeY-8); ctx.lineTo(eyeOffset-4, eyeY); ctx.stroke();
                ctx.beginPath(); ctx.arc(-eyeOffset, eyeY+4, planet.radius*0.06, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(eyeOffset, eyeY+4, planet.radius*0.06, 0, Math.PI*2); ctx.fill();
            } else if (planet.face === 'star') {
                ctx.font = `bold ${planet.radius*0.4}px sans-serif`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText("✨", -eyeOffset, eyeY);
                ctx.fillText("✨", eyeOffset, eyeY);
            } else {
                ctx.beginPath(); ctx.arc(-eyeOffset, eyeY, planet.radius*0.08, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(eyeOffset, eyeY, planet.radius*0.08, 0, Math.PI*2); ctx.fill();
            }

            // 볼터치
            ctx.fillStyle = 'rgba(255, 120, 150, 0.5)';
            ctx.beginPath(); ctx.arc(-eyeOffset*1.4, eyeY+planet.radius*0.2, planet.radius*0.15, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(eyeOffset*1.4, eyeY+planet.radius*0.2, planet.radius*0.15, 0, Math.PI*2); ctx.fill();

            // 입 모양
            ctx.strokeStyle = 'white';
            ctx.beginPath();
            const mouthY = eyeY + planet.radius * 0.15;
            if (planet.face === 'happy' || planet.face === 'star') {
                ctx.arc(0, mouthY, planet.radius*0.18, 0, Math.PI, false); ctx.stroke();
            } else if (planet.face === 'bigsmile') {
                ctx.fillStyle = 'rgba(150, 0, 0, 0.4)';
                ctx.arc(0, mouthY, planet.radius*0.22, 0, Math.PI, false); ctx.fill(); ctx.stroke();
            } else if (planet.face === 'smile') {
                ctx.moveTo(-planet.radius*0.15, mouthY); ctx.quadraticCurveTo(0, mouthY+planet.radius*0.15, planet.radius*0.15, mouthY); ctx.stroke();
            } else if (planet.face === 'sleepy') {
                ctx.arc(0, mouthY+planet.radius*0.08, planet.radius*0.04, 0, Math.PI*2); ctx.stroke();
            } else {
                ctx.moveTo(-planet.radius*0.12, mouthY); ctx.quadraticCurveTo(-planet.radius*0.06, mouthY+planet.radius*0.12, 0, mouthY);
                ctx.quadraticCurveTo(planet.radius*0.06, mouthY+planet.radius*0.12, planet.radius*0.12, mouthY); ctx.stroke();
            }

            ctx.restore();

            preRenderedPlanets[planet.id] = { canvas, offset: center };
        });
    }

    // --- Matter.js Setup (2D Physics) ---
    const Engine = Matter.Engine,
        Bodies = Matter.Bodies,
        Composite = Matter.Composite,
        Events = Matter.Events;

    let engine;
    let score = 0;
    let highestPlanetIndex = 0;
    let currentPlanetIndex = 0;
    let nextPlanetIndex = 0;
    let isGameOver = false;
    let ghostX = GAME_WIDTH / 2;

    let rapidFireInterval = null;
    let bhUses = 1;
    let isBhMode = false;
    let isGhostHidden = false;

    let ground, leftWall, rightWall;

    const canvasWrapper = document.getElementById('canvas-wrapper');
    const gameCanvas = document.getElementById('game-canvas');
    const ctx = gameCanvas.getContext('2d');
    const scoreDisplay = document.getElementById('score-display');
    const nextPlanetPreview = document.getElementById('next-planet-preview');
    const htmlDeadline = document.getElementById('html-deadline');
    const bhBtn = document.getElementById('bh-btn');
    const bhOverlay = document.getElementById('bh-overlay');
    const bhCountText = document.getElementById('bh-count-text');

    // --- Initialization ---
    function init() {
        preRenderPlanets();

        const rect = canvasWrapper.getBoundingClientRect();
        const w = rect.width || 400;
        const h = rect.height || 900;

        GAME_HEIGHT = GAME_WIDTH * (h / w);
        DROP_LINE_Y = GAME_HEIGHT * 0.18;

        gameCanvas.width = GAME_WIDTH;
        gameCanvas.height = GAME_HEIGHT;

        htmlDeadline.style.top = `${(DROP_LINE_Y / GAME_HEIGHT) * 100}%`;

        initEvolutionUI();
        initPhysics();
        setupEvents();

        window.addEventListener('resize', () => {
            const rect = canvasWrapper.getBoundingClientRect();
            const currentWidth = rect.width || 400;
            const currentHeight = rect.height || 900;

            GAME_HEIGHT = GAME_WIDTH * (currentHeight / currentWidth);
            gameCanvas.height = GAME_HEIGHT;

            DROP_LINE_Y = GAME_HEIGHT * 0.18;
            htmlDeadline.style.top = `${(DROP_LINE_Y / GAME_HEIGHT) * 100}%`;

            if (ground) Matter.Body.setPosition(ground, { x: GAME_WIDTH / 2, y: GAME_HEIGHT + 50 });
            if (leftWall) Matter.Body.setPosition(leftWall, { x: -50, y: GAME_HEIGHT / 2 });
            if (rightWall) Matter.Body.setPosition(rightWall, { x: GAME_WIDTH + 50, y: GAME_HEIGHT / 2 });
        });
    }

    // HTML/CSS로 그려지는 UI 프리뷰 (진화 가이드 바)
    function initEvolutionUI() {
        const sequenceContainer = document.getElementById('evolution-sequence');
        let html = '';

        PLANETS.forEach((p, index) => {
            const isLast = index === PLANETS.length - 1;
            const size = 18 + (index * 2.5);

            const ringCSS = p.hasRing ? `position:absolute; top:50%; left:-20%; right:-20%; height:3px; background:${p.color2}; transform:rotate(-20deg); opacity:0.8; border-radius:50%;` : '';
            const vRingCSS = p.hasVerticalRing ? `position:absolute; top:-20%; bottom:-20%; left:50%; width:3px; background:${p.color2}; transform:rotate(20deg); opacity:0.8; border-radius:50%;` : '';

            html += `
                    <div class="flex items-center shrink-0 snap-center">
                        <div style="
                            width: ${size}px; height: ${size}px;
                            border-radius: 50%;
                            background: linear-gradient(135deg, ${p.color1}, ${p.color2});
                            box-shadow: ${p.glow ? '0 0 8px ' + p.color1 : 'inset -3px -3px 6px rgba(0,0,0,0.3)'};
                            position: relative;
                        ">
                            ${p.hasRing ? `<div style="${ringCSS}"></div>` : ''}
                            ${p.hasVerticalRing ? `<div style="${vRingCSS}"></div>` : ''}
                        </div>
                        ${!isLast ? `<span class="text-white/30 text-[10px] mx-1 font-black">›</span>` : ''}
                    </div>
                `;
        });

        sequenceContainer.innerHTML = html;
    }

    function initPhysics() {
        engine = Engine.create();
        engine.gravity.y = 1.8;

        const wallOptions = { isStatic: true, friction: 0.2 };
        ground = Bodies.rectangle(GAME_WIDTH/2, GAME_HEIGHT + 50, GAME_WIDTH * 2, 100, wallOptions);
        leftWall = Bodies.rectangle(-50, GAME_HEIGHT/2, 100, GAME_HEIGHT * 2, wallOptions);
        rightWall = Bodies.rectangle(GAME_WIDTH + 50, GAME_HEIGHT/2, 100, GAME_HEIGHT * 2, wallOptions);

        Composite.add(engine.world, [ground, leftWall, rightWall]);
        Events.on(engine, 'collisionStart', handleCollision);
    }

    // --- Game Logic ---
    function startGame() {
        score = 0;
        highestPlanetIndex = 0;
        isGameOver = false;

        bhUses = 1;
        isBhMode = false;
        bhOverlay.classList.add('hidden');
        bhBtn.style.opacity = '1';
        bhBtn.style.pointerEvents = 'auto';
        bhBtn.classList.remove('grayscale');
        bhCountText.textContent = '블랙홀 (1)';

        updateScore(0);

        const bodies = Composite.allBodies(engine.world);
        const bodiesToRemove = bodies.filter(b => !b.isStatic);
        Composite.remove(engine.world, bodiesToRemove);

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');

        generateNextPlanets();
    }

    function generateNextPlanets() {
        currentPlanetIndex = nextPlanetIndex !== undefined ? nextPlanetIndex : 0;

        let maxAllowedDrop = Math.max(2, highestPlanetIndex - 2);
        maxAllowedDrop = Math.min(5, maxAllowedDrop); // 11단계, 지구(5) 제한

        nextPlanetIndex = Math.floor(Math.random() * (maxAllowedDrop + 1));
        updatePreviewUI();
    }

    // 상단 다음 행성 프리뷰 (CSS 버전)
    function updatePreviewUI() {
        const nextP = PLANETS[nextPlanetIndex];
        const size = Math.min(nextP.radius * 0.8, 45);

        nextPlanetPreview.innerHTML = `
                <div style="
                    width: ${size}px; height: ${size}px;
                    border-radius: 50%;
                    background: linear-gradient(135deg, ${nextP.color1}, ${nextP.color2});
                    box-shadow: ${nextP.glow ? '0 0 15px ' + nextP.color1 : 'inset -5px -5px 10px rgba(0,0,0,0.2)'};
                    position: relative; overflow: hidden;
                ">
                    <div class="cute-face" style="transform: scale(${size/45});">
                        <div class="eyes">
                            <div class="eye"></div><div class="eye"></div>
                        </div>
                        <div class="mouth"></div>
                    </div>
                    ${nextP.hasRing ? `<div style="position:absolute; top:50%; left:-10%; right:-10%; height:4px; background:${nextP.color2}; transform:rotate(-20deg); opacity:0.8; border-radius:50%;"></div>` : ''}
                    ${nextP.hasVerticalRing ? `<div style="position:absolute; top:-10%; bottom:-10%; left:50%; width:4px; background:${nextP.color2}; transform:rotate(20deg); opacity:0.8; border-radius:50%;"></div>` : ''}
                </div>
            `;
    }

    function updateScore(points) {
        score += points;
        scoreDisplay.textContent = score;
    }

    function toggleBlackHole() {
        if (bhUses <= 0 || isGameOver) return;
        isBhMode = !isBhMode;

        if (isBhMode) {
            bhOverlay.classList.remove('hidden');
            bhBtn.classList.add('ring-4', 'ring-purple-400');
        } else {
            bhOverlay.classList.add('hidden');
            bhBtn.classList.remove('ring-4', 'ring-purple-400');
        }
    }

    function createBlastVisual(x, y, radius) {
        const rect = canvasWrapper.getBoundingClientRect();
        const screenX = (x / GAME_WIDTH) * rect.width;
        const screenY = (y / GAME_HEIGHT) * rect.height;
        const screenRadius = (radius / GAME_WIDTH) * rect.width;

        const blast = document.createElement('div');
        blast.className = 'absolute rounded-full bg-purple-600/50 pointer-events-none transform -translate-x-1/2 -translate-y-1/2 z-10';
        blast.style.left = screenX + 'px';
        blast.style.top = screenY + 'px';
        blast.style.width = (screenRadius * 2) + 'px';
        blast.style.height = (screenRadius * 2) + 'px';
        blast.style.boxShadow = '0 0 30px 10px rgba(168, 85, 247, 0.8)';
        blast.style.animation = 'blastAnim 0.5s ease-out forwards';

        canvasWrapper.appendChild(blast);
        setTimeout(() => blast.remove(), 500);
    }

    function executeBlackHole(x, y) {
        const blastRadius = 120;
        const bodies = Composite.allBodies(engine.world);

        const targets = bodies.filter(b => {
            if (b.isStatic || b.planetId === undefined) return false;
            const dist = Math.hypot(b.position.x - x, b.position.y - y);
            return dist < (blastRadius + PLANETS[b.planetId].radius);
        });

        if (targets.length > 0) {
            Composite.remove(engine.world, targets);

            bhUses--;
            isBhMode = false;
            bhOverlay.classList.add('hidden');
            bhBtn.classList.remove('ring-4', 'ring-purple-400');

            bhBtn.style.opacity = '0.5';
            bhBtn.style.pointerEvents = 'none';
            bhBtn.classList.add('grayscale');
            bhCountText.textContent = '블랙홀 (0)';

            createBlastVisual(x, y, blastRadius);
        }
    }

    function dropPlanet(x) {
        if (isGameOver || isBhMode) return;

        const planetData = PLANETS[currentPlanetIndex];
        const jitterX = x + (Math.random() - 0.5) * 15;
        const safeX = Math.max(planetData.radius, Math.min(GAME_WIDTH - planetData.radius, jitterX));
        const startY = 60;

        const newBody = Bodies.circle(safeX, startY, planetData.radius, {
            restitution: 0.2,
            friction: 0.3,
            density: 0.008,
            planetId: planetData.id,
            isMerging: false,
            hasEnteredBox: false,
            createdAt: Date.now()
        });

        Composite.add(engine.world, newBody);

        generateNextPlanets();

        if (!rapidFireInterval) {
            isGhostHidden = true;
            setTimeout(() => {
                if(!isGameOver && !isBhMode) isGhostHidden = false;
            }, 100);
        }
    }

    function handleCollision(event) {
        const pairs = event.pairs;
        for (let i = 0; i < pairs.length; i++) {
            const bodyA = pairs[i].bodyA;
            const bodyB = pairs[i].bodyB;

            if (bodyA.planetId !== undefined && bodyB.planetId !== undefined) {
                if (bodyA.planetId === bodyB.planetId &&
                    !bodyA.isMerging && !bodyB.isMerging &&
                    bodyA.planetId < PLANETS.length - 1) {

                    bodyA.isMerging = true;
                    bodyB.isMerging = true;

                    const newPlanetId = bodyA.planetId + 1;
                    const newPlanetData = PLANETS[newPlanetId];

                    if (newPlanetId > highestPlanetIndex) {
                        highestPlanetIndex = newPlanetId;
                    }

                    const midX = (bodyA.position.x + bodyB.position.x) / 2;
                    const midY = (bodyA.position.y + bodyB.position.y) / 2;

                    updateScore((newPlanetId) * 10);

                    Composite.remove(engine.world, [bodyA, bodyB]);

                    const newBody = Bodies.circle(midX, midY, newPlanetData.radius, {
                        restitution: 0.2,
                        friction: 0.2,
                        density: 0.005,
                        planetId: newPlanetId,
                        isMerging: false,
                        hasEnteredBox: false,
                        createdAt: Date.now()
                    });

                    Composite.add(engine.world, newBody);
                }
            }
        }
    }

    function checkGameOver() {
        if (isGameOver) return;
        const bodies = Composite.allBodies(engine.world);
        let isOver = false;
        const now = Date.now();

        for (let i = 0; i < bodies.length; i++) {
            const body = bodies[i];
            if (body.planetId !== undefined && !body.isStatic) {
                const topY = body.position.y - PLANETS[body.planetId].radius;

                if (now - body.createdAt < 500) continue;

                if (!body.hasEnteredBox) {
                    if (topY > DROP_LINE_Y) {
                        body.hasEnteredBox = true;
                    } else if (Math.abs(body.velocity.y) < 0.2 && Math.abs(body.velocity.x) < 0.2) {
                        isOver = true;
                        break;
                    }
                } else {
                    if (topY <= DROP_LINE_Y) {
                        isOver = true;
                        break;
                    }
                }
            }
        }

        if (isOver) endGame();
    }

    function endGame() {
        isGameOver = true;
        document.getElementById('final-score').textContent = score;
        document.getElementById('game-over-screen').classList.remove('hidden');
    }

    // --- 2D Canvas Rendering Loop ---
    function animate() {
        requestAnimationFrame(animate);
        Engine.update(engine, 1000 / 60);
        ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        const bodies = Composite.allBodies(engine.world);

        // 사전 렌더링된 이미지들을 불러와 캔버스에 그리기 (매우 빠름)
        for (const body of bodies) {
            if (body.planetId !== undefined) {
                const data = preRenderedPlanets[body.planetId];
                if (data) {
                    ctx.save();
                    ctx.translate(body.position.x, body.position.y);
                    ctx.rotate(body.angle);
                    // 오프스크린 캔버스의 중심축(offset)만큼 이동하여 그림
                    ctx.drawImage(data.canvas, -data.offset, -data.offset);
                    ctx.restore();
                }
            }
        }

        // 고스트(가이드) 행성
        if (!isGhostHidden && !rapidFireInterval && !isBhMode && !isGameOver && document.getElementById('start-screen').classList.contains('hidden')) {
            const planet = PLANETS[currentPlanetIndex];
            const data = preRenderedPlanets[currentPlanetIndex];
            const safeX = Math.max(planet.radius, Math.min(GAME_WIDTH - planet.radius, ghostX));

            if (data) {
                ctx.save();
                ctx.translate(safeX, 60);
                ctx.globalAlpha = 0.5;
                ctx.drawImage(data.canvas, -data.offset, -data.offset);
                ctx.restore();
            }
        }

        checkGameOver();
    }

    // --- Event Listeners ---
    function setupEvents() {
        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);
        bhBtn.addEventListener('click', toggleBlackHole);

        const getPosFromEvent = (e) => {
            const rect = canvasWrapper.getBoundingClientRect();
            const scaleX = GAME_WIDTH / rect.width;
            const scaleY = GAME_HEIGHT / rect.height;

            let clientX, clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        };

        canvasWrapper.addEventListener('mousemove', (e) => {
            const pos = getPosFromEvent(e);
            ghostX = pos.x;
        });
        canvasWrapper.addEventListener('touchmove', (e) => {
            const pos = getPosFromEvent(e);
            ghostX = pos.x;
            e.preventDefault();
        }, { passive: false });

        const startAction = (e) => {
            if (!document.getElementById('start-screen').classList.contains('hidden')) return;

            const pos = getPosFromEvent(e);

            if (isBhMode) {
                executeBlackHole(pos.x, pos.y);
                return;
            }

            dropPlanet(pos.x);

            if (rapidFireInterval) clearInterval(rapidFireInterval);
            isGhostHidden = true;

            rapidFireInterval = setInterval(() => {
                dropPlanet(ghostX);
            }, 120);
        };

        const stopAction = () => {
            if (rapidFireInterval) {
                clearInterval(rapidFireInterval);
                rapidFireInterval = null;
                if(!isGameOver && !isBhMode) isGhostHidden = false;
            }
        };

        canvasWrapper.addEventListener('mousedown', startAction);
        canvasWrapper.addEventListener('mouseup', stopAction);
        canvasWrapper.addEventListener('mouseleave', stopAction);

        canvasWrapper.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startAction(e);
        }, { passive: false });
        canvasWrapper.addEventListener('touchend', (e) => {
            stopAction();
            e.preventDefault();
        }, { passive: false });
        canvasWrapper.addEventListener('touchcancel', stopAction);
    }

    window.addEventListener('load', () => {
        init();
        requestAnimationFrame(animate);
    });
</script>
</body>
