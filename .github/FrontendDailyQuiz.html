<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프론트엔드 데일리 퀴즈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Visual Diagrams */
        .visual-diagram {
            background-color: #f8fafc;
            color: #334155;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            padding: 1.5rem;
            font-family: monospace;
            overflow-x: auto;
            margin: 1rem 0;
            box-shadow: inset 0 2px 4px 0 rgb(0 0 0 / 0.02);
        }
        /* CSS Box Model Diagram */
        .box-model-diagram {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .bm-margin { background: #fef08a; padding: 10px; border: 1px dashed #ca8a04; text-align: center; color: #854d0e; font-size: 12px; border-radius: 4px;}
        .bm-border { background: #fde047; padding: 10px; border: 2px solid #ca8a04; text-align: center; color: #854d0e; font-size: 12px; border-radius: 4px;}
        .bm-padding { background: #bbf7d0; padding: 10px; border: 1px dashed #16a34a; text-align: center; color: #166534; font-size: 12px; border-radius: 4px;}
        .bm-content { background: #bfdbfe; padding: 20px 40px; border: 1px solid #2563eb; text-align: center; font-weight: bold; color: #1e40af; border-radius: 4px;}
        
        .option-label { transition: all 0.2s; }
        .option-input:checked + .option-label {
            background-color: #eff6ff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 1px #3b82f6;
        }

        /* Text & Code Formatting */
        .formatted-text {
            white-space: pre-wrap;
            word-break: break-word;
        }
        pre.code-box {
            background-color: #f8fafc;
            color: #334155;
            padding: 1.25rem;
            border-radius: 0.75rem;
            overflow-x: auto;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.875rem;
            margin-top: 1rem;
            margin-bottom: 1rem;
            box-shadow: inset 0 2px 4px 0 rgb(0 0 0 / 0.02);
            white-space: pre;
            border: 1px solid #e2e8f0;
        }
        code.inline-code {
            background-color: #f1f5f9;
            color: #e11d48;
            padding: 0.125rem 0.375rem;
            border-radius: 0.25rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.9em;
            border: 1px solid #e2e8f0;
            word-break: break-word;
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center cursor-pointer" onclick="navigate('home')">
                    <i class="fa-solid fa-code text-blue-600 text-2xl mr-2"></i>
                    <span class="font-bold text-xl tracking-tight text-slate-800">FE Daily Quiz</span>
                </div>
                <div class="text-sm font-medium text-slate-500 bg-slate-100 px-3 py-1 rounded-full">
                    <i class="fa-regular fa-calendar mr-1"></i> <span id="current-date"></span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main id="app-container" class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 mt-8"></main>

    <script>
        // --- State Management ---
        const API_KEY = ""; // Environment handles the key
        let appState = {
            currentView: 'home', // 'home', 'quiz', 'result', 'explanation'
            currentQuizConfig: { category: '', difficulty: 'medium' },
            currentQuestions: [],
            currentQuestionIndex: 0,
            userAnswers: [],
            history: JSON.parse(localStorage.getItem('feQuizHistory')) || [],
            stats: JSON.parse(localStorage.getItem('feQuizStats')) || {
                categories: {
                    html: { attempted: 0, correct: 0 },
                    css: { attempted: 0, correct: 0 },
                    javascript: { attempted: 0, correct: 0 },
                    network: { attempted: 0, correct: 0 },
                    browser: { attempted: 0, correct: 0 }
                },
                totalDays: 0
            }
        };

        const CATEGORIES = {
            daily: { name: '오늘의 종합 문제', icon: 'fa-star', color: 'text-yellow-500', bg: 'bg-yellow-50' },
            html: { name: 'HTML 마크업', icon: 'fa-brands fa-html5', color: 'text-orange-500', bg: 'bg-orange-50' },
            css: { name: 'CSS 스타일링', icon: 'fa-brands fa-css3-alt', color: 'text-blue-500', bg: 'bg-blue-50' },
            javascript: { name: 'JavaScript 코어', icon: 'fa-brands fa-js', color: 'text-yellow-400', bg: 'bg-yellow-50' },
            network: { name: '네트워크 통신', icon: 'fa-solid fa-network-wired', color: 'text-green-500', bg: 'bg-green-50' },
            browser: { name: '브라우저 렌더링', icon: 'fa-solid fa-window-maximize', color: 'text-purple-500', bg: 'bg-purple-50' }
        };

        // --- Fallback Data (If API fails) ---
        const FALLBACK_QUESTIONS = [
            {
                type: 'mcq',
                question: '브라우저의 렌더링 과정 중 "Layout(Reflow)" 단계에 대한 설명으로 가장 적절한 것은 무엇인가요?',
                options: [
                    'HTML 파서가 DOM 트리를 생성하고 CSS 파서가 CSSOM 트리를 생성하는 단계입니다.',
                    'DOM 트리와 CSSOM 트리를 결합하여 화면에 표시될 노드들만 포함된 렌더 트리를 구성하는 단계입니다.',
                    '뷰포트 내에서 렌더 트리의 각 노드가 화면의 어느 위치에 어떤 크기로 배치될지 정확한 기하학적 형태를 계산하는 단계입니다.',
                    '계산된 레이아웃 정보를 바탕으로 픽셀을 화면에 그리는(Painting) 단계입니다.'
                ],
                answer: '3', // 3rd option (1-based index)
                explanation: 'Layout(또는 Reflow) 단계는 렌더 트리가 구성된 후, 각 요소가 브라우저 화면의 어느 위치에 어떤 크기로 배치되어야 하는지 수학적으로 계산하는 과정입니다. 창 크기를 조절하거나 요소의 크기/위치가 변경될 때 발생합니다.',
                visualType: 'browser-render'
            },
            {
                type: 'mcq',
                question: 'CSS Box Model에서 `box-sizing: border-box;`를 적용했을 때 요소의 너비(width) 계산 방식으로 올바른 것은?',
                options: [
                    '전역 변수 사용을 최소화하고 변수의 상태를 안전하게 은닉(Private 변수 모방)하기 위해 사용합니다.',
                    'React의 useState 훅과 같이 이전 상태 값을 기억하고 업데이트하는 상태 관리 로직을 구현할 때 사용합니다.',
                    '디바운스(Debounce)나 쓰로틀(Throttle) 함수를 구현하여 타이머 ID를 기억하고 이벤트 발생 빈도를 제어할 때 사용합니다.',
                    '이벤트 루프의 콜 스택 크기를 줄여 애플리케이션의 초기 로딩 속도를 최적화하기 위해 사용합니다.'
                ],
                answer: '4', // 4th option
                explanation: '클로저는 외부 변수를 메모리에 유지시키므로 오히려 메모리 사용량이 증가할 수 있습니다. 이벤트 루프의 콜 스택 크기를 줄이거나 초기 로딩 속도를 최적화하는 것과는 직접적인 관련이 없습니다. 주로 상태 유지, 정보 은닉, 고차 함수 구현 등에 쓰입니다.',
                visualType: 'code-closure'
            },
            {
                type: 'mcq',
                question: 'CSS Box Model에서 <code class="inline-code">box-sizing: border-box;</code>를 적용했을 때 요소의 너비(width) 계산 방식으로 올바른 것은?',
                options: [
                    '요소의 너비는 콘텐츠(Content) 영역의 너비만을 의미하며, 패딩(Padding)과 테두리(Border)는 지정된 너비 밖으로 추가됩니다.',
                    '요소의 너비에 콘텐츠(Content)와 패딩(Padding)은 포함되지만, 테두리(Border)는 포함되지 않고 외부에 추가됩니다.',
                    '지정된 요소의 너비 안에 콘텐츠(Content), 패딩(Padding), 테두리(Border)가 모두 포함되어 계산됩니다. 마진(Margin)은 제외됩니다.',
                    '지정된 요소의 너비 안에 콘텐츠, 패딩, 테두리, 그리고 마진(Margin)까지 모두 포함되어 계산됩니다.'
                ],
                answer: '3', // 3rd option
                explanation: '<code class="inline-code">box-sizing: border-box;</code>는 요소의 지정된 width와 height 안에 padding과 border를 포함시킵니다. 이를 통해 레이아웃 크기를 예측하고 관리하기가 훨씬 쉬워집니다. margin은 항상 박스 외부에 존재하므로 포함되지 않습니다.',
                visualType: 'box-model'
            },
            {
                type: 'short',
                question: 'HTTP 프로토콜의 한계를 극복하기 위해 등장한 기술로, 클라이언트와 서버 간에 양방향 실시간 통신을 가능하게 해주는 프로토콜의 이름은 무엇인가요? (영어로 작성)',
                answer: 'WebSocket',
                explanation: 'WebSocket(웹소켓)은 하나의 TCP 접속에 전이중(duplex) 통신 채널을 제공하는 컴퓨터 통신 프로토콜입니다.\n\nHTTP 요청/응답 헤더의 오버헤드 없이 실시간 양방향 통신이 가능하여 채팅, 실시간 주식 데이터 등에 사용됩니다.',
                visualType: 'network-websocket'
            },
            {
                type: 'short',
                question: '리액트(React)나 뷰(Vue)와 같은 모던 프레임워크에서 실제 DOM의 복사본을 메모리에 저장해두고, 상태 변경 시 변경된 부분만 실제 DOM에 반영하여 성능을 최적화하는 기술을 무엇이라고 하나요?',
                answer: 'Virtual DOM',
                explanation: 'Virtual DOM(가상 돔)은 UI의 이상적인 또는 "가상"적인 표현을 메모리에 저장하고 ReactDOM과 같은 라이브러리에 의해 "실제" DOM과 동기화하는 프로그래밍 개념입니다.\n\n이 과정을 재조정(Reconciliation)이라고 부릅니다.',
                visualType: 'dom-tree'
            }
        ];

        // --- Utility Functions ---
        function formatContent(text) {
            if (!text) return '';
            
            // 1. HTML 특수문자 이스케이프 (태그가 화면에서 숨겨지는 것 방지)
            let safeText = text.replace(/&/g, '&amp;')
                               .replace(/</g, '&lt;')
                               .replace(/>/g, '&gt;')
                               .replace(/"/g, '&quot;')
                               .replace(/'/g, '&#039;');
                               
            // 2. 마크다운 코드 블록(```) 변환
            safeText = safeText.replace(/```([a-zA-Z0-9]*)\n?([\s\S]*?)```/g, function(match, lang, code) {
                return `<pre class="code-box"><code>${code}</code></pre>`;
            });
            
            // 3. 마크다운 인라인 코드(`) 변환
            safeText = safeText.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');

            // 4. 마크다운 강조(**) 변환 (선택사항)
            safeText = safeText.replace(/\*\*([^\*]+)\*\*/g, '<strong class="text-blue-700">$1</strong>');

            return safeText;
        }

        function setDate() {
            const today = new Date();
            document.getElementById('current-date').innerText = `${today.getFullYear()}.${today.getMonth() + 1}.${today.getDate()}`;
        }

        function saveState() {
            localStorage.setItem('feQuizHistory', JSON.stringify(appState.history));
            localStorage.setItem('feQuizStats', JSON.stringify(appState.stats));
        }

        function navigate(view) {
            appState.currentView = view;
            render();
            window.scrollTo(0, 0);
        }

        function getCategoryProgress(catId) {
            const stat = appState.stats.categories[catId];
            if (!stat || stat.attempted === 0) return 0;
            return Math.round((stat.correct / stat.attempted) * 100);
        }

        // --- API Integration (Gemini) ---
        async function fetchQuestionsFromGemini(category, difficulty) {
            const catName = CATEGORIES[category]?.name || category;
            
            const prompt = `
            당신은 프론트엔드 개발자를 교육하는 시니어 개발자입니다.
            주제: ${catName}
            난이도: ${difficulty} (easy=기본개념, medium=실무응용, hard=심화원리 및 브라우저 내부동작)
            
            이 주제로 총 5개의 퀴즈를 출제해주세요.
            - 문제 1~3: 객관식 (mcq). 각 선지(options)는 단답형이 아닌 **서술형 문장**으로 자세히 작성해야 합니다.
              - 정답(answer)은 0이 아닌 1부터 4까지의 숫자 문자열입니다 (예: "1", "2", "3", "4").
              - **중요**: 선지 텍스트 맨 앞에 번호(예: '1.', '1)', '(1)', '①')를 절대 붙이지 마세요. 순수한 내용만 작성하세요.
            - 문제 4~5: 주관식 단답형 (short). 웹 개발자가 무조건 알아야 하는 핵심 '용어'나 '기술명'을 묻는 문제입니다. 정답(answer)은 가급적 영어 또는 명확한 한글 용어 하나여야 합니다.
            
            [중요 서식 가이드]
            - 질문이나 해설에 HTML 태그명(예: <div>)이나 코드가 포함될 경우, 반드시 마크다운 백틱(\` 및 \`\`\`)으로 감싸주세요. (HTML 태그를 그대로 작성하면 화면에서 숨겨집니다.)
            - 해설과 문항 내용에서 줄바꿈이 필요한 곳은 자연스럽게 \n 을 사용하여 가독성을 높여주세요.
            - 선지가 비어있거나 해설이 없는 문제가 있어서는 절대 안 됩니다.
            
            각 문제에는 자세한 해설(explanation)을 포함하세요. 해설에서 선지를 언급할 때는 '1번 선지', '2번 선지'와 같이 1부터 시작하는 숫자로 언급하세요.
            visualType은 다음 중 하나를 선택하세요: 'box-model', 'dom-tree', 'network-websocket', 'browser-render', 'code-closure', 'general'.
            
            반드시 아래 JSON 스키마에 맞게 응답하세요. 백틱(\`\`\`)이나 마크다운 없이 순수 JSON 객체만 반환하세요.
            {
              "questions": [
                {
                  "type": "mcq",
                  "question": "질문 내용 (코드 포함 시 백틱 사용)",
                  "options": ["서술형 선지 1", "서술형 선지 2", "서술형 선지 3", "서술형 선지 4"],
                  "answer": "1",
                  "explanation": "상세한 해설. 줄바꿈을 활용하세요.",
                  "visualType": "분류"
                },
                {
                  "type": "short",
                  "question": "질문 내용",
                  "options": [],
                  "answer": "정답 용어",
                  "explanation": "상세한 해설",
                  "visualType": "분류"
                }
              ]
            }
            `;

            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: {
                    responseMimeType: "application/json"
                }
            };

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${API_KEY}`;

            // Exponential backoff retry logic
            const retries = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < retries.length; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    
                    const data = await response.json();
                    const textContent = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    
                    if (textContent) {
                        const parsed = JSON.parse(textContent);
                        
                        // 선지 앞의 번호 제거 (예: "1. DOM 트리를..." -> "DOM 트리를...")
                        if (parsed.questions) {
                            parsed.questions.forEach(q => {
                                if (q.type === 'mcq' && Array.isArray(q.options)) {
                                    q.options = q.options.map(opt => opt.replace(/^(\d+[\.\)]\s*|[①②③④]\s*)/, '').trim());
                                }
                            });
                        }

                        // 데이터 검증 로직 (옵션이나 해설 누락 확인)
                        if (!parsed.questions || parsed.questions.length === 0) {
                            throw new Error("No questions generated");
                        }
                        
                        const isValid = parsed.questions.every(q => {
                            if (!q.question || !q.explanation || !q.answer) return false;
                            if (q.type === 'mcq' && (!q.options || q.options.length === 0)) return false;
                            return true;
                        });

                        if (!isValid) {
                            throw new Error("Missing options or explanations in generated content");
                        }

                        return parsed.questions;
                    } else {
                        throw new Error("Invalid response format");
                    }
                } catch (error) {
                    console.warn(`Attempt ${i+1} failed:`, error);
                    if (i === retries.length - 1) {
                        console.error("API Failed entirely, using fallback questions.");
                        return [...FALLBACK_QUESTIONS];
                    }
                    await new Promise(r => setTimeout(r, retries[i]));
                }
            }
        }

        // --- Rendering Functions ---
        function render() {
            const container = document.getElementById('app-container');
            container.innerHTML = ''; // Clear

            switch (appState.currentView) {
                case 'home': container.innerHTML = renderHome(); break;
                case 'setup': container.innerHTML = renderSetup(); break;
                case 'quiz': container.innerHTML = renderQuizLoading(); initiateQuiz(); break;
                case 'question': container.innerHTML = renderQuestion(); break;
                case 'explanation': container.innerHTML = renderExplanation(); break;
                case 'result': container.innerHTML = renderResult(); break;
            }
        }

        function renderHome() {
            let html = `
                <div class="fade-in space-y-8">
                    <!-- Hero Section -->
                    <div class="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-2xl p-8 text-white shadow-lg relative overflow-hidden">
                        <div class="relative z-10">
                            <h1 class="text-3xl font-bold mb-2">오늘의 프론트엔드 지식 채우기 🚀</h1>
                            <p class="text-blue-100 mb-6">매일 5문제씩 풀고 기본기를 탄탄하게 다져보세요.</p>
                            <button onclick="openSetup('daily')" class="bg-white text-blue-600 px-6 py-3 rounded-full font-bold hover:bg-blue-50 transition shadow-md">
                                데일리 퀴즈 시작하기
                            </button>
                        </div>
                        <i class="fa-brands fa-react absolute -bottom-10 -right-10 text-9xl text-white opacity-10 transform rotate-45"></i>
                    </div>

                    <!-- Categories -->
                    <div>
                        <h2 class="text-xl font-bold mb-4 flex items-center"><i class="fa-solid fa-layer-group mr-2 text-slate-400"></i>목차별 학습</h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            `;

            for (const [key, val] of Object.entries(CATEGORIES)) {
                if (key === 'daily') continue;
                const progress = getCategoryProgress(key);
                html += `
                    <div onclick="openSetup('${key}')" class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 hover:shadow-md hover:border-blue-200 cursor-pointer transition flex items-center justify-between group">
                        <div class="flex items-center space-x-4">
                            <div class="${val.bg} ${val.color} w-12 h-12 rounded-lg flex items-center justify-center text-2xl group-hover:scale-110 transition">
                                <i class="${val.icon}"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-slate-800">${val.name}</h3>
                                <p class="text-xs text-slate-500 mt-1">정답률: ${progress}%</p>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-slate-300 group-hover:text-blue-500 transition"></i>
                    </div>
                `;
            }

            html += `
                        </div>
                    </div>

                    <!-- History -->
                    <div>
                        <h2 class="text-xl font-bold mb-4 flex items-center"><i class="fa-solid fa-clock-rotate-left mr-2 text-slate-400"></i>최근 학습 기록</h2>
                        <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                            ${appState.history.length === 0 ? 
                                '<div class="p-8 text-center text-slate-400">아직 학습 기록이 없습니다. 첫 퀴즈를 풀어보세요!</div>' : 
                                '<ul class="divide-y divide-slate-100">' + appState.history.slice(0, 5).map(h => `
                                    <li class="p-4 flex justify-between items-center hover:bg-slate-50 transition">
                                        <div class="flex flex-col">
                                            <span class="font-semibold text-slate-800">${CATEGORIES[h.category]?.name || h.category} (${h.difficulty})</span>
                                            <span class="text-xs text-slate-500">${h.date}</span>
                                        </div>
                                        <div class="flex items-center space-x-2">
                                            <div class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm font-bold">
                                                ${h.score} / ${h.total}
                                            </div>
                                        </div>
                                    </li>
                                `).join('') + '</ul>'
                            }
                        </div>
                    </div>
                </div>
            `;
            return html;
        }

        function openSetup(category) {
            appState.currentQuizConfig.category = category;
            appState.currentQuizConfig.difficulty = 'medium'; // default
            navigate('setup');
        }

        function renderSetup() {
            const catName = CATEGORIES[appState.currentQuizConfig.category]?.name || '퀴즈';
            return `
                <div class="fade-in max-w-md mx-auto mt-12 bg-white rounded-2xl shadow-lg p-8 border border-slate-100 text-center">
                    <div class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-4 text-blue-500 text-2xl">
                        <i class="fa-solid fa-sliders"></i>
                    </div>
                    <h2 class="text-2xl font-bold mb-2">${catName}</h2>
                    <p class="text-slate-500 mb-8">AI가 난이도에 맞는 5문제를 출제합니다.</p>
                    
                    <div class="space-y-3 mb-8 text-left">
                        <label class="block relative border rounded-xl p-4 cursor-pointer hover:bg-slate-50 transition ${appState.currentQuizConfig.difficulty === 'easy' ? 'border-blue-500 bg-blue-50 ring-1 ring-blue-500' : 'border-slate-200'}">
                            <input type="radio" name="difficulty" value="easy" class="sr-only" onchange="setDifficulty('easy')" ${appState.currentQuizConfig.difficulty === 'easy' ? 'checked' : ''}>
                            <div class="flex justify-between items-center">
                                <div>
                                    <p class="font-bold text-slate-800 text-lg">초급 (Easy)</p>
                                    <p class="text-sm text-slate-500">기본적인 개념과 용어 위주</p>
                                </div>
                                <i class="fa-solid fa-seedling text-green-500 text-xl"></i>
                            </div>
                        </label>
                        <label class="block relative border rounded-xl p-4 cursor-pointer hover:bg-slate-50 transition ${appState.currentQuizConfig.difficulty === 'medium' ? 'border-blue-500 bg-blue-50 ring-1 ring-blue-500' : 'border-slate-200'}">
                            <input type="radio" name="difficulty" value="medium" class="sr-only" onchange="setDifficulty('medium')" ${appState.currentQuizConfig.difficulty === 'medium' ? 'checked' : ''}>
                            <div class="flex justify-between items-center">
                                <div>
                                    <p class="font-bold text-slate-800 text-lg">중급 (Medium)</p>
                                    <p class="text-sm text-slate-500">실무 응용 및 동작 원리</p>
                                </div>
                                <i class="fa-solid fa-fire text-orange-500 text-xl"></i>
                            </div>
                        </label>
                        <label class="block relative border rounded-xl p-4 cursor-pointer hover:bg-slate-50 transition ${appState.currentQuizConfig.difficulty === 'hard' ? 'border-blue-500 bg-blue-50 ring-1 ring-blue-500' : 'border-slate-200'}">
                            <input type="radio" name="difficulty" value="hard" class="sr-only" onchange="setDifficulty('hard')" ${appState.currentQuizConfig.difficulty === 'hard' ? 'checked' : ''}>
                            <div class="flex justify-between items-center">
                                <div>
                                    <p class="font-bold text-slate-800 text-lg">고급 (Hard)</p>
                                    <p class="text-sm text-slate-500">심화 아키텍처 및 최적화</p>
                                </div>
                                <i class="fa-solid fa-skull text-purple-500 text-xl"></i>
                            </div>
                        </label>
                    </div>

                    <div class="flex space-x-3">
                        <button onclick="navigate('home')" class="flex-1 py-3 rounded-xl font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 transition">취소</button>
                        <button onclick="navigate('quiz')" class="flex-1 py-3 rounded-xl font-bold text-white bg-blue-600 hover:bg-blue-700 transition shadow-md flex items-center justify-center">
                            출제 시작 <i class="fa-solid fa-wand-magic-sparkles ml-2"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        function setDifficulty(diff) {
            appState.currentQuizConfig.difficulty = diff;
            renderSetup(); // Re-render to update UI classes
            document.getElementById('app-container').innerHTML = renderSetup();
        }

        function renderQuizLoading() {
            return `
                <div class="fade-in flex flex-col items-center justify-center min-h-[60vh] text-center">
                    <div class="w-16 h-16 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mb-6"></div>
                    <h2 class="text-2xl font-bold text-slate-800 mb-2">Gemini AI가 문제를 생성 중입니다...</h2>
                    <p class="text-slate-500">지정하신 난이도와 주제에 맞춰 퀴즈를 구성하고 있습니다.<br>(약 1분 정도 소요)</p>
                </div>
            `;
        }

        async function initiateQuiz() {
            appState.currentQuestionIndex = 0;
            appState.userAnswers = [];
            // Try fetching from API
            appState.currentQuestions = await fetchQuestionsFromGemini(
                appState.currentQuizConfig.category, 
                appState.currentQuizConfig.difficulty
            );
            navigate('question');
        }

        function renderQuestion() {
            const qIndex = appState.currentQuestionIndex;
            const q = appState.currentQuestions[qIndex];
            const progress = ((qIndex) / appState.currentQuestions.length) * 100;

            let inputHtml = '';
            if (q.type === 'mcq') {
                inputHtml = `<div class="space-y-3 mt-6">`;
                q.options.forEach((opt, idx) => {
                    inputHtml += `
                        <label class="block relative cursor-pointer">
                            <input type="radio" name="answer" value="${idx + 1}" class="sr-only option-input">
                            <div class="option-label border border-slate-200 rounded-xl p-4 flex items-start hover:bg-slate-50">
                                <span class="flex-shrink-0 w-6 h-6 rounded-full border border-slate-300 flex items-center justify-center mr-3 mt-0.5 text-sm">
                                    ${idx + 1}
                                </span>
                                <span class="text-slate-700 leading-relaxed formatted-text">${formatContent(opt)}</span>
                            </div>
                        </label>
                    `;
                });
                inputHtml += `</div>`;
            } else {
                inputHtml = `
                    <div class="mt-8">
                        <label class="block text-sm font-medium text-slate-700 mb-2">정답 입력 (핵심 용어)</label>
                        <input type="text" id="short-answer-input" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition shadow-sm text-lg" placeholder="여기에 입력하세요..." autocomplete="off">
                    </div>
                `;
            }

            return `
                <div class="fade-in max-w-2xl mx-auto mt-4">
                    <!-- Progress -->
                    <div class="mb-8">
                        <div class="flex justify-between text-sm font-medium text-slate-500 mb-2">
                            <span>문제 ${qIndex + 1} / ${appState.currentQuestions.length}</span>
                            <span>${q.type === 'mcq' ? '객관식' : '주관식'}</span>
                        </div>
                        <div class="w-full bg-slate-200 rounded-full h-2">
                            <div class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: ${progress}%"></div>
                        </div>
                    </div>

                    <!-- Question Card -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 sm:p-8">
                        <div class="flex items-center space-x-2 mb-4">
                            <span class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs font-bold uppercase tracking-wider">
                                ${q.type === 'mcq' ? 'Multiple Choice' : 'Short Answer'}
                            </span>
                        </div>
                        <h2 class="text-xl sm:text-2xl font-bold text-slate-800 leading-snug break-keep formatted-text">${formatContent(q.question)}</h2>
                        
                        ${inputHtml}

                        <div class="mt-8 pt-6 border-t border-slate-100 flex justify-end">
                            <button onclick="submitAnswer()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl shadow-md transition flex items-center">
                                정답 확인 <i class="fa-solid fa-arrow-right ml-2"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function submitAnswer() {
            const q = appState.currentQuestions[appState.currentQuestionIndex];
            let userAnswer = '';
            
            if (q.type === 'mcq') {
                const selected = document.querySelector('input[name="answer"]:checked');
                if (!selected) {
                    alert('답을 선택해주세요.');
                    return;
                }
                userAnswer = selected.value; // "1", "2", "3", "4"
            } else {
                const input = document.getElementById('short-answer-input').value.trim();
                if (!input) {
                    alert('답을 입력해주세요.');
                    return;
                }
                userAnswer = input;
            }

            // Check correctness
            let isCorrect = false;
            if (q.type === 'mcq') {
                isCorrect = String(userAnswer) === String(q.answer);
            } else {
                // For short answer, ignore case and spaces
                const cleanUser = userAnswer.toLowerCase().replace(/\s/g, '');
                const cleanAns = String(q.answer).toLowerCase().replace(/\s/g, '');
                isCorrect = cleanUser === cleanAns || cleanAns.includes(cleanUser) && cleanUser.length > 2; // Basic fuzzy matching
            }

            appState.userAnswers.push({
                question: q.question,
                userAnswer: userAnswer,
                correctAnswer: q.answer,
                isCorrect: isCorrect,
                type: q.type,
                options: q.options
            });

            navigate('explanation');
        }

        // Generate Visual Diagrams using CSS/HTML
        function getVisualDiagram(type) {
            switch(type) {
                case 'box-model':
                    return `
                        <div class="visual-diagram box-model-diagram mt-6">
                            <div class="bm-margin">Margin (External spacing)
                                <div class="bm-border mt-2">Border (Edge)
                                    <div class="bm-padding mt-2">Padding (Internal spacing)
                                        <div class="bm-content mt-2">Content (Width x Height)</div>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                case 'dom-tree':
                    return `
                        <div class="visual-diagram text-sm mt-6">
                            <div class="text-blue-600 font-bold">Document</div>
                            <div class="pl-4 border-l-2 border-slate-300 ml-2 mt-1">
                                <div class="text-purple-600">└── &lt;html&gt;</div>
                                <div class="pl-8 border-l-2 border-slate-300 ml-2 mt-1">
                                    <div class="text-emerald-600">├── &lt;head&gt;</div>
                                    <div class="text-amber-600">└── &lt;body&gt;</div>
                                    <div class="pl-8 border-l-2 border-slate-300 ml-2 mt-1">
                                        <div class="text-orange-600">├── &lt;div id="app"&gt;</div>
                                        <div class="text-orange-600">└── &lt;script&gt;</div>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                case 'network-websocket':
                    return `
                        <div class="visual-diagram flex justify-between items-center text-center px-4 mt-6">
                            <div class="text-blue-600"><i class="fa-solid fa-laptop text-3xl mb-2 block"></i>Client</div>
                            <div class="flex-1 px-4 relative">
                                <div class="border-b-2 border-dashed border-emerald-400 w-full absolute top-1/2"></div>
                                <div class="flex justify-between w-full absolute top-1/2 -mt-3">
                                    <i class="fa-solid fa-arrow-right text-emerald-500"></i>
                                    <i class="fa-solid fa-arrow-left text-emerald-500"></i>
                                </div>
                                <div class="text-xs text-emerald-700 font-bold mt-4 relative z-10 bg-[#f8fafc] inline-block px-2">Bi-directional Connection</div>
                            </div>
                            <div class="text-purple-600"><i class="fa-solid fa-server text-3xl mb-2 block"></i>Server</div>
                        </div>`;
                case 'browser-render':
                    return `
                        <div class="visual-diagram text-xs flex justify-center items-center space-x-2 mt-6">
                            <div class="bg-white border border-slate-200 shadow-sm p-2 rounded text-center text-slate-700 font-medium">HTML<br>↓<br>DOM</div>
                            <div class="text-slate-400 font-bold">+</div>
                            <div class="bg-white border border-slate-200 shadow-sm p-2 rounded text-center text-slate-700 font-medium">CSS<br>↓<br>CSSOM</div>
                            <div class="text-slate-400 font-bold">→</div>
                            <div class="bg-blue-50 border border-blue-200 shadow-sm p-2 rounded text-center text-blue-800 font-bold">Render Tree</div>
                            <div class="text-slate-400 font-bold">→</div>
                            <div class="bg-purple-50 border border-purple-200 shadow-sm p-2 rounded text-center text-purple-800 font-medium">Layout</div>
                            <div class="text-slate-400 font-bold">→</div>
                            <div class="bg-emerald-50 border border-emerald-200 shadow-sm p-2 rounded text-center text-emerald-800 font-medium">Paint</div>
                        </div>`;
                default:
                    return '';
            }
        }

        function renderExplanation() {
            const qIndex = appState.currentQuestionIndex;
            const q = appState.currentQuestions[qIndex];
            const ans = appState.userAnswers[qIndex];
            
            const isLast = qIndex === appState.currentQuestions.length - 1;
            const btnText = isLast ? '결과 확인하기' : '다음 문제';
            
            // Format answer display (Map 1-based index string to options array)
            let userAnsDisplay = ans.userAnswer;
            let correctAnsDisplay = q.answer;
            if (q.type === 'mcq') {
                userAnsDisplay = q.options[parseInt(ans.userAnswer) - 1] || "알 수 없음";
                correctAnsDisplay = q.options[parseInt(q.answer) - 1] || "알 수 없음";
            }

            return `
                <div class="fade-in max-w-2xl mx-auto mt-4">
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                        <!-- Result Header -->
                        <div class="${ans.isCorrect ? 'bg-green-500' : 'bg-red-500'} text-white p-6 sm:p-8 text-center relative overflow-hidden">
                            <i class="fa-solid ${ans.isCorrect ? 'fa-check-circle' : 'fa-times-circle'} text-6xl opacity-20 absolute -right-4 -bottom-4"></i>
                            <h2 class="text-3xl font-bold relative z-10">
                                ${ans.isCorrect ? '정답입니다! 🎉' : '아쉽네요! 😢'}
                            </h2>
                        </div>
                        
                        <div class="p-6 sm:p-8">
                            <div class="mb-6 pb-6 border-b border-slate-100">
                                <p class="text-slate-500 text-sm mb-2">문제</p>
                                <p class="text-lg font-semibold text-slate-800 formatted-text">${formatContent(q.question)}</p>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
                                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">나의 답변</p>
                                    <p class="text-slate-800 font-medium formatted-text ${ans.isCorrect ? 'text-green-600' : 'text-red-600'}">${formatContent(userAnsDisplay)}</p>
                                </div>
                                <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                                    <p class="text-xs font-bold text-blue-400 uppercase tracking-wider mb-1">정답</p>
                                    <p class="text-blue-800 font-bold formatted-text">${formatContent(correctAnsDisplay)}</p>
                                </div>
                            </div>

                            <!-- Detailed Explanation -->
                            <div>
                                <h3 class="text-lg font-bold flex items-center text-slate-800 mb-3">
                                    <i class="fa-solid fa-book-open text-blue-500 mr-2"></i> 상세 해설
                                </h3>
                                <div class="bg-slate-50 p-5 rounded-xl border border-slate-200 text-slate-700 leading-relaxed formatted-text">${formatContent(q.explanation)}</div>
                                
                                <!-- Visual Area -->
                                ${getVisualDiagram(q.visualType || 'general')}
                            </div>

                            <div class="mt-8 flex justify-end">
                                <button onclick="${isLast ? "finishQuiz()" : "nextQuestion()"}" class="bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-8 rounded-xl shadow-md transition flex items-center">
                                    ${btnText} <i class="fa-solid ${isLast ? 'fa-flag-checkered' : 'fa-arrow-right'} ml-2"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function nextQuestion() {
            appState.currentQuestionIndex++;
            navigate('question');
        }

        function finishQuiz() {
            // Calculate stats
            const correctCount = appState.userAnswers.filter(a => a.isCorrect).length;
            const total = appState.currentQuestions.length;
            
            // Update app stats
            const cat = appState.currentQuizConfig.category;
            if (CATEGORIES[cat] && cat !== 'daily') {
                appState.stats.categories[cat].attempted += total;
                appState.stats.categories[cat].correct += correctCount;
            }
            
            navigate('result');
        }

        function renderResult() {
            const correctCount = appState.userAnswers.filter(a => a.isCorrect).length;
            const total = appState.currentQuestions.length;
            const score = Math.round((correctCount / total) * 100);
            
            let message = '';
            let emoji = '';
            if (score === 100) { message = '완벽합니다! 마스터 수준이네요.'; emoji = '🏆'; }
            else if (score >= 80) { message = '훌륭합니다! 핵심을 잘 알고 계시네요.'; emoji = '🌟'; }
            else if (score >= 60) { message = '좋은 시도입니다! 해설을 복습해보세요.'; emoji = '👍'; }
            else { message = '조금 더 공부가 필요합니다. 파이팅!'; emoji = '💪'; }

            let reviewHtml = appState.userAnswers.map((ans, idx) => `
                <div class="border-b border-slate-100 py-4 last:border-0">
                    <div class="flex items-start">
                        <div class="mt-1 mr-3">
                            ${ans.isCorrect 
                                ? '<i class="fa-solid fa-circle-check text-green-500 text-lg"></i>' 
                                : '<i class="fa-solid fa-circle-xmark text-red-500 text-lg"></i>'}
                        </div>
                        <div class="flex-1 w-full overflow-hidden">
                            <p class="font-medium text-slate-800 mb-1 formatted-text">Q${idx + 1}. ${formatContent(ans.question)}</p>
                            ${!ans.isCorrect ? `
                                <div class="text-sm mt-2 p-3 bg-red-50 text-red-700 rounded-lg border border-red-100">
                                    <span class="font-bold block mb-1">내 답:</span> <span class="formatted-text">${formatContent(ans.type === 'mcq' ? ans.options[ans.userAnswer - 1] : ans.userAnswer)}</span>
                                </div>
                                <div class="text-sm mt-2 p-3 bg-green-50 text-green-700 rounded-lg border border-green-100">
                                    <span class="font-bold block mb-1">정답:</span> <span class="formatted-text">${formatContent(ans.type === 'mcq' ? ans.options[ans.correctAnswer - 1] : ans.correctAnswer)}</span>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `).join('');

            return `
                <div class="fade-in max-w-3xl mx-auto mt-4">
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8 text-center relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-400 to-indigo-500"></div>
                        
                        <div class="text-6xl mb-4">${emoji}</div>
                        <h2 class="text-3xl font-bold text-slate-800 mb-2">수고하셨습니다!</h2>
                        <p class="text-slate-500 mb-8">${message}</p>
                        
                        <!-- Score Circle -->
                        <div class="w-40 h-40 mx-auto bg-slate-50 rounded-full flex items-center justify-center border-8 border-slate-100 mb-8 relative">
                            <svg class="absolute inset-0 w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                                <circle cx="50" cy="50" r="46" fill="transparent" stroke="#e2e8f0" stroke-width="8" />
                                <circle cx="50" cy="50" r="46" fill="transparent" stroke="#3b82f6" stroke-width="8" stroke-dasharray="289" stroke-dashoffset="${289 - (289 * score / 100)}" class="transition-all duration-1000 ease-out" stroke-linecap="round"/>
                            </svg>
                            <div class="text-center relative z-10">
                                <span class="text-4xl font-bold text-slate-800">${correctCount}</span><span class="text-xl text-slate-400">/${total}</span>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex flex-col sm:flex-row justify-center space-y-3 sm:space-y-0 sm:space-x-4 mb-10">
                            <button onclick="retryQuiz()" class="px-8 py-3 rounded-xl font-bold text-blue-600 bg-blue-50 border border-blue-200 hover:bg-blue-100 transition flex justify-center items-center">
                                <i class="fa-solid fa-rotate-right mr-2"></i> 다시 풀기
                            </button>
                            <button onclick="saveAndGoHome(${correctCount}, ${total})" class="px-8 py-3 rounded-xl font-bold text-white bg-blue-600 hover:bg-blue-700 shadow-md transition flex justify-center items-center">
                                <i class="fa-solid fa-save mr-2"></i> 결과 저장 후 홈으로
                            </button>
                        </div>

                        <!-- Review -->
                        <div class="text-left mt-8 pt-8 border-t border-slate-100">
                            <h3 class="text-lg font-bold mb-4 flex items-center text-slate-800">
                                <i class="fa-solid fa-list-check mr-2 text-blue-500"></i> 오답 노트 및 요약
                            </h3>
                            <div class="bg-slate-50 rounded-xl p-4 border border-slate-200">
                                ${reviewHtml}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function retryQuiz() {
            appState.currentQuestionIndex = 0;
            appState.userAnswers = [];
            navigate('question');
        }

        function saveAndGoHome(correct, total) {
            const today = new Date();
            const dateStr = `${today.getFullYear()}.${String(today.getMonth() + 1).padStart(2, '0')}.${String(today.getDate()).padStart(2, '0')}`;
            
            // Add to history
            appState.history.unshift({
                date: dateStr,
                category: appState.currentQuizConfig.category,
                difficulty: appState.currentQuizConfig.difficulty,
                score: correct,
                total: total
            });
            
            appState.stats.totalDays++;
            saveState(); // Save to localStorage
            
            navigate('home');
        }

        // Initialize App
        setDate();
        render();

    </script>
</body>
</html>
