<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>간식 탐험대 미로 탈출</title>
    <style>
      :root {
        --ck-red: #ff4757;
        --ck-soft-red: #e74c3c;
        --ck-yellow: #ffbc00;
        --ck-orange: #ff9f43;
        --ck-soft-green: #badc58;
        --ck-brown: #5d4037;
        --ck-cream: #fff9c4;
        --bg-light-green: #d4edda;
        --primary-font: 'Cafe24Ssurround', sans-serif;
      }

      @font-face {
        font-family: 'Cafe24Ssurround';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/Cafe24Ssurround.woff')
          format('woff');
        font-weight: normal;
        font-style: normal;
      }

      * {
        box-sizing: border-box;
        font-family: var(--primary-font);
        -webkit-tap-highlight-color: transparent;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-light-green);
        background-image:
          radial-gradient(#c3e6cb 15%, transparent 16%),
          radial-gradient(#c3e6cb 15%, transparent 16%);
        background-size: 60px 60px;
        background-position:
          0 0,
          30px 30px;
        color: var(--ck-brown);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
        touch-action: none;
      }

      #game-container {
        width: 92vw;
        max-width: 500px;
        background: var(--ck-cream);
        border: 6px solid var(--ck-brown);
        border-radius: 30px;
        box-shadow: 0 10px 0 rgba(0, 0, 0, 0.15);
        padding: 15px;
        position: relative;
        text-align: center;
      }

      #intro-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
        padding: 10px 0;
      }

      .main-character-img {
        font-size: 80px;
        filter: drop-shadow(0 5px 0 rgba(0, 0, 0, 0.1));
        animation: bounce 0.6s infinite alternate
          cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      @keyframes bounce {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(-15px);
        }
      }

      .bubble {
        background: white;
        border: 4px solid var(--ck-brown);
        padding: 15px;
        border-radius: 20px;
        font-size: 1rem;
        line-height: 1.5;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.05);
        word-break: keep-all;
      }

      .difficulty-selector {
        display: flex;
        gap: 8px;
        margin: 10px 0;
        width: 100%;
      }
      .difficulty-btn {
        flex: 1;
        padding: 10px;
        border: 3px solid var(--ck-brown);
        background: white;
        border-radius: 15px;
        cursor: pointer;
        font-size: 0.9rem;
        box-shadow: 0 3px 0 var(--ck-brown);
      }
      .difficulty-btn.active {
        background: var(--ck-yellow);
        transform: translateY(2px);
        box-shadow: 0 1px 0 var(--ck-brown);
      }

      .start-btn {
        background: var(--ck-soft-red);
        color: white;
        border: 4px solid var(--ck-brown);
        padding: 12px 40px;
        font-size: 1.5rem;
        border-radius: 40px;
        cursor: pointer;
        box-shadow: 0 5px 0 var(--ck-brown);
        margin-top: 10px;
        transition: all 0.2s;
      }
      .start-btn:active {
        transform: translateY(4px);
        box-shadow: 0 1px 0 var(--ck-brown);
      }

      #game-screen {
        display: none;
        background-color: #f0fff4;
        border-radius: 20px;
        padding: 8px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        gap: 8px;
      }

      .score-board {
        flex-grow: 1;
        background: var(--ck-yellow);
        border: 3px solid var(--ck-brown);
        padding: 5px;
        border-radius: 15px;
        font-size: 1rem;
      }

      .nav-btn {
        background: white;
        border: 2px solid var(--ck-brown);
        padding: 5px 10px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 0.8rem;
      }

      #maze-container {
        position: relative;
        margin: 0 auto;
        border: 4px solid var(--ck-brown);
        background: white;
        border-radius: 15px;
        overflow: hidden;
        width: 100%;
        aspect-ratio: 1/1;
      }

      #maze-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        width: 190px;
        margin: 15px auto 0;
      }

      .control-btn {
        width: 58px;
        height: 58px;
        background: white;
        border: 3px solid var(--ck-brown);
        border-radius: 15px;
        font-size: 28px; /* 기호 크기 */
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 4px 0 var(--ck-brown);
        cursor: pointer;
        user-select: none;
        color: var(--ck-brown);
        /* 특수 기호 정렬 보정 */
        padding-top: 2px;
        line-height: 1;
      }

      .control-btn:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 var(--ck-brown);
        background: var(--ck-yellow);
      }

      /* 버튼별 그리드 배치 */
      .btn-up {
        grid-column: 2;
        grid-row: 1;
      }
      .btn-left {
        grid-column: 1;
        grid-row: 2;
      }
      .btn-down {
        grid-column: 2;
        grid-row: 2;
      }
      .btn-right {
        grid-column: 3;
        grid-row: 2;
      }

      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        backdrop-filter: blur(3px);
      }

      .modal-content {
        background: var(--ck-cream);
        width: 85%;
        max-width: 380px;
        padding: 20px;
        border-radius: 25px;
        border: 5px solid var(--ck-brown);
        text-align: center;
      }

      #toast {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 15px 30px;
        background: white;
        border: 4px solid var(--ck-brown);
        border-radius: 20px;
        z-index: 2000;
        display: none;
        font-size: 1.1rem;
        color: var(--ck-brown);
        transition: background 0.3s ease;
      }

      #loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--ck-cream);
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 3000;
      }

      .loading-animation {
        font-size: 60px;
        animation: loading-pulse 1s infinite alternate;
      }

      @keyframes loading-pulse {
        0% {
          transform: scale(1) rotate(-10deg);
        }
        100% {
          transform: scale(1.3) rotate(10deg);
        }
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="intro-screen">
        <div class="main-character-img">🚶</div>
        <div class="bubble">
          간식 탐험대 출동!<br />
          미로 속 10개의 젤리를 모두 먹어야 탈출할 수 있어!<br />
          자바스크립트 퀴즈를 풀고 집으로 돌아가자😊
        </div>
        <div class="difficulty-selector">
          <button class="difficulty-btn" onclick="setDiff('easy', this)">
            기초(하)
          </button>
          <button
            class="difficulty-btn active"
            onclick="setDiff('medium', this)"
          >
            보통(중)
          </button>
          <button class="difficulty-btn" onclick="setDiff('hard', this)">
            심화(상)
          </button>
        </div>
        <button class="start-btn" onclick="startGame()">START!</button>
      </div>

      <div id="game-screen">
        <div class="header">
          <button class="nav-btn" onclick="confirmQuit()">나가기</button>
          <div class="score-board">
            ✨ 젤리: <span id="snack-count">0</span> / 10
          </div>
          <button
            class="nav-btn"
            style="background: #ff7f50; color: white"
            onclick="resetGame()"
          >
            섞기
          </button>
        </div>
        <div id="maze-container">
          <canvas id="maze-canvas"></canvas>
        </div>
        <!-- 화살표 기호 명시적 입력 -->
        <div class="controls">
          <button class="control-btn btn-up" onclick="movePlayer(0, -1)">
            &#9650;
          </button>
          <button class="control-btn btn-left" onclick="movePlayer(-1, 0)">
            &#9664;
          </button>
          <button class="control-btn btn-down" onclick="movePlayer(0, 1)">
            &#9660;
          </button>
          <button class="control-btn btn-right" onclick="movePlayer(1, 0)">
            &#9654;
          </button>
        </div>
      </div>
    </div>

    <!-- 퀴즈 모달 -->
    <div id="quiz-modal" class="modal-overlay">
      <div class="modal-content">
        <h3 style="margin-top: 0">💎 젤리 획득 퀴즈!</h3>
        <div
          id="quiz-question"
          style="
            background: white;
            padding: 15px;
            border-radius: 15px;
            border: 2px solid var(--ck-brown);
            margin-bottom: 15px;
            text-align: left;
          "
        >
          ...
        </div>
        <div
          class="option-list"
          id="option-list"
          style="display: flex; flex-direction: column; gap: 8px"
        ></div>
      </div>
    </div>

    <!-- 결과 모달 -->
    <div id="result-modal" class="modal-overlay">
      <div class="modal-content">
        <div style="font-size: 60px">🏠</div>
        <h2>집에 도착했어요!</h2>
        <p>모든 젤리를 모으고 안전하게 귀가했어!<br />정말 대단한 실력이야!</p>
        <button class="start-btn" onclick="resetToTitle()">다시 하기</button>
      </div>
    </div>

    <!-- 확인 모달 -->
    <div id="confirm-modal" class="modal-overlay">
      <div class="modal-content">
        <h3>그만하시겠어요?</h3>
        <div style="display: flex; gap: 10px; margin-top: 15px">
          <button
            class="nav-btn"
            style="flex: 1; padding: 10px"
            onclick="closeModal('confirm-modal')"
          >
            계속
          </button>
          <button
            class="nav-btn"
            style="
              flex: 1;
              padding: 10px;
              background: var(--ck-red);
              color: white;
            "
            onclick="resetToTitle()"
          >
            나가기
          </button>
        </div>
      </div>
    </div>

    <div id="loading-overlay">
      <div class="loading-animation">🚶</div>
      <p style="margin-top: 20px; font-weight: bold">
        미로와 퀴즈를 준비하고 있어요...
      </p>
    </div>
    <div id="toast">정답!</div>

    <script>
      const apiKey = '';
      let difficulty = 'medium';
      let quizzes = [];
      let collectedCount = 0;
      let activeQuizIdx = -1;
      const mazeSize = 17;
      let maze = [];
      let canvas, ctx, cellSize;
      let player = { x: 1, y: 1 };
      let snacks = [];
      let exit = { x: mazeSize - 2, y: mazeSize - 2, active: false };
      const snackEmojis = [
        '🍭',
        '🍩',
        '🍰',
        '🍪',
        '🍨',
        '🍮',
        '🧁',
        '🍫',
        '🍬',
        '🥨',
      ];

      function setDiff(val, btn) {
        difficulty = val;
        document
          .querySelectorAll('.difficulty-btn')
          .forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
      }

      async function startGame() {
        showLoading(true);
        try {
          initGameLogic();
          await fetchQuizzes();
          document.getElementById('intro-screen').classList.add('hidden');
          document.getElementById('game-screen').style.display = 'block';
          setTimeout(() => {
            resizeCanvas();
            showLoading(false);
          }, 100);
        } catch (e) {
          console.error(e);
          alert('퀴즈 데이터를 불러오는데 실패했습니다.');
          showLoading(false);
        }
      }

      async function fetchQuizzes() {
        const systemPrompt = `자바스크립트 학습용 퀴즈 10개를 한국어로 생성하세요. 
            난이도는 '${difficulty}' 수준으로 맞추세요. 
            형식: JSON [{q: "질문 내용", o: ["옵션1", "옵션2", "옵션3", "옵션4"], a: 정답의_인덱스_0부터3}]`;

        try {
          const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`,
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [
                  {
                    parts: [
                      { text: '자바스크립트 퀴즈 10개를 한국어로 생성해줘.' },
                    ],
                  },
                ],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: { responseMimeType: 'application/json' },
              }),
            },
          );
          const result = await response.json();
          quizzes = JSON.parse(result.candidates[0].content.parts[0].text);
        } catch (e) {
          quizzes = Array(10).fill({
            q: '자바스크립트에서 상수를 선언할 때 사용하는 키워드는?',
            o: ['var', 'let', 'const', 'def'],
            a: 2,
          });
        }
      }

      function initGameLogic() {
        maze = Array.from({ length: mazeSize }, () => Array(mazeSize).fill(1));
        function walk(x, y) {
          maze[y][x] = 0;
          const dirs = [
            [0, -2],
            [0, 2],
            [-2, 0],
            [2, 0],
          ].sort(() => Math.random() - 0.5);
          for (let [dx, dy] of dirs) {
            const nx = x + dx,
              ny = y + dy;
            if (
              nx > 0 &&
              nx < mazeSize &&
              ny > 0 &&
              ny < mazeSize &&
              maze[ny][nx] === 1
            ) {
              maze[y + dy / 2][x + dx / 2] = 0;
              walk(nx, ny);
            }
          }
        }
        walk(1, 1);
        player = { x: 1, y: 1 };
        collectedCount = 0;
        exit.active = false;
        document.getElementById('snack-count').innerText = '0';

        let paths = [];
        for (let y = 1; y < mazeSize - 1; y++) {
          for (let x = 1; x < mazeSize - 1; x++) {
            if (
              maze[y][x] === 0 &&
              !(x === 1 && y === 1) &&
              !(x === exit.x && y === exit.y)
            )
              paths.push({ x, y });
          }
        }
        paths.sort(() => Math.random() - 0.5);
        snacks = Array.from({ length: 10 }, (_, i) => ({
          ...paths[i],
          emoji: snackEmojis[i],
          collected: false,
        }));
      }

      function resizeCanvas() {
        canvas = document.getElementById('maze-canvas');
        if (!canvas) return;
        ctx = canvas.getContext('2d');
        const size = canvas.parentElement.clientWidth;
        canvas.width = size;
        canvas.height = size;
        cellSize = size / mazeSize;
        draw();
      }

      function draw() {
        if (!ctx || !maze.length) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let y = 0; y < mazeSize; y++) {
          for (let x = 0; x < mazeSize; x++) {
            if (maze[y][x] === 1) {
              ctx.fillStyle = '#5d4037';
              ctx.fillRect(
                x * cellSize,
                y * cellSize,
                cellSize + 1,
                cellSize + 1,
              );
            }
          }
        }

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        snacks.forEach((s) => {
          if (!s.collected) {
            ctx.fillStyle = '#ffbc00';
            ctx.beginPath();
            ctx.arc(
              s.x * cellSize + cellSize / 2,
              s.y * cellSize + cellSize / 2,
              cellSize / 2.2,
              0,
              Math.PI * 2,
            );
            ctx.fill();
            ctx.font = `${cellSize * 0.7}px Arial`;
            ctx.fillText(
              s.emoji,
              s.x * cellSize + cellSize / 2,
              s.y * cellSize + cellSize / 2,
            );
          }
        });

        if (exit.active) {
          ctx.fillStyle = '#fffa65';
          ctx.fillRect(
            exit.x * cellSize,
            exit.y * cellSize,
            cellSize,
            cellSize,
          );
          ctx.font = `${cellSize * 0.8}px Arial`;
          ctx.fillText(
            '🏠',
            exit.x * cellSize + cellSize / 2,
            exit.y * cellSize + cellSize / 2,
          );
        }

        ctx.font = `${cellSize * 0.9}px Arial`;
        ctx.fillText(
          '🚶',
          player.x * cellSize + cellSize / 2,
          player.y * cellSize + cellSize / 2,
        );
      }

      function movePlayer(dx, dy) {
        if (activeQuizIdx !== -1) return;
        const nx = player.x + dx,
          ny = player.y + dy;
        if (
          nx >= 0 &&
          nx < mazeSize &&
          ny >= 0 &&
          ny < mazeSize &&
          maze[ny][nx] === 0
        ) {
          player.x = nx;
          player.y = ny;
          checkCollision();
          draw();
        }
      }

      function checkCollision() {
        const sIdx = snacks.findIndex(
          (s) => !s.collected && s.x === player.x && s.y === player.y,
        );
        if (sIdx !== -1) {
          activeQuizIdx = sIdx;
          setTimeout(() => showQuiz(sIdx), 50);
        }
        if (exit.active && player.x === exit.x && player.y === exit.y) {
          document.getElementById('result-modal').style.display = 'flex';
        }
      }

      function showQuiz(idx) {
        const quiz = quizzes[idx];
        document.getElementById('quiz-question').innerText = quiz.q;
        const list = document.getElementById('option-list');
        list.innerHTML = '';
        quiz.o.forEach((o, i) => {
          const b = document.createElement('button');
          b.className = 'nav-btn';
          b.style.padding = '12px';
          b.style.textAlign = 'left';
          b.innerText = o;
          b.onclick = () => {
            if (i === quiz.a) {
              snacks[activeQuizIdx].collected = true;
              collectedCount++;
              document.getElementById('snack-count').innerText = collectedCount;
              if (collectedCount === 10) exit.active = true;
              showToast('정답! 젤리를 획득했어 ✨');
              closeModal('quiz-modal');
              activeQuizIdx = -1;
              draw();
            } else {
              showToast('틀렸어! 다시 골라봐 😢', true);
            }
          };
          list.appendChild(b);
        });
        document.getElementById('quiz-modal').style.display = 'flex';
      }

      function resetToTitle() {
        document
          .querySelectorAll('.modal-overlay')
          .forEach((m) => (m.style.display = 'none'));
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('intro-screen').classList.remove('hidden');
        collectedCount = 0;
        activeQuizIdx = -1;
        exit.active = false;
        quizzes = [];
      }

      function showLoading(s) {
        document.getElementById('loading-overlay').style.display = s
          ? 'flex'
          : 'none';
      }
      function closeModal(id) {
        document.getElementById(id).style.display = 'none';
      }
      function confirmQuit() {
        document.getElementById('confirm-modal').style.display = 'flex';
      }
      function resetGame() {
        initGameLogic();
        draw();
      }

      function showToast(m, err = false) {
        const t = document.getElementById('toast');
        t.innerText = m;
        t.style.background = err ? 'var(--ck-orange)' : 'var(--ck-soft-green)';
        t.style.color = err ? 'white' : 'var(--ck-brown)';
        t.style.display = 'block';
        setTimeout(() => (t.style.display = 'none'), 1200);
      }

      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp') movePlayer(0, -1);
        if (e.key === 'ArrowDown') movePlayer(0, 1);
        if (e.key === 'ArrowLeft') movePlayer(-1, 0);
        if (e.key === 'ArrowRight') movePlayer(1, 0);
      });
      window.addEventListener('resize', resizeCanvas);
    </script>
  </body>
</html>
