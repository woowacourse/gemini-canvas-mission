<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한글 타자 마스터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
    body { font-family: 'Noto Sans KR', sans-serif; }
    .char-correct { color: #10b981; }
    .char-incorrect { color: #f43f5e; text-decoration: underline; text-underline-offset: 4px; }
    .char-pending { color: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 text-slate-800">

<div class="max-w-3xl w-full bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100">
  <!-- Header -->
  <div class="bg-indigo-600 p-8 text-white flex justify-between items-center">
    <div>
      <h1 class="text-3xl font-bold flex items-center gap-3">
        <i class="fa-solid fa-keyboard"></i>
        한글 타자 마스터
      </h1>
      <p class="text-indigo-100 mt-1 opacity-90">순수 자바스크립트로 구현된 최적화 버전</p>
    </div>
    <div class="bg-indigo-500/30 p-3 rounded-2xl backdrop-blur-sm">
      <i class="fa-solid fa-trophy text-yellow-300 text-3xl"></i>
    </div>
  </div>

  <div class="p-8">
    <!-- Ready State -->
    <div id="state-ready" class="text-center py-12">
      <div class="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-6">
        <i class="fa-solid fa-play text-4xl ml-2"></i>
      </div>
      <h2 class="text-2xl font-bold mb-4">준비되셨나요?</h2>
      <p class="text-slate-500 mb-8 leading-relaxed">
        총 15개의 문장이 준비되어 있습니다.<br/>
        연습을 시작하고 첫 글자를 입력하면 측정이 시작됩니다.
      </p>
      <button id="btn-start" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-10 rounded-2xl transition-all transform hover:scale-105 shadow-lg shadow-indigo-200">
        연습 시작하기
      </button>
    </div>

    <!-- Playing State -->
    <div id="state-playing" class="hidden space-y-8">
      <!-- Stats Bar -->
      <div class="grid grid-cols-4 gap-3">
        <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100 text-center">
          <div class="text-slate-400 text-[10px] font-bold uppercase tracking-wider mb-1">
            <i class="fa-solid fa-clock"></i> 시간
          </div>
          <div id="stat-time" class="text-xl font-mono font-bold text-indigo-600">0.0s</div>
        </div>
        <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100 text-center">
          <div class="text-slate-400 text-[10px] font-bold uppercase tracking-wider mb-1">
            <i class="fa-solid fa-bolt"></i> 현재 타수
          </div>
          <div id="stat-cpm" class="text-xl font-mono font-bold text-indigo-600">0</div>
        </div>
        <div class="bg-indigo-50 p-3 rounded-2xl border border-indigo-100 text-center">
          <div class="text-indigo-400 text-[10px] font-bold uppercase tracking-wider mb-1">
            <i class="fa-solid fa-crown"></i> 최고 타수
          </div>
          <div id="stat-max-cpm" class="text-xl font-mono font-bold text-indigo-700">0</div>
        </div>
        <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100 text-center">
          <div class="text-slate-400 text-[10px] font-bold uppercase tracking-wider mb-1">
            <i class="fa-solid fa-bullseye"></i> 정확도
          </div>
          <div id="stat-accuracy" class="text-xl font-mono font-bold text-indigo-600">100%</div>
        </div>
      </div>

      <!-- Progress Bar -->
      <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
        <div id="progress-bar" class="bg-indigo-600 h-full transition-all duration-300 ease-out" style="width: 0%"></div>
      </div>

      <!-- Sentence Display -->
      <div class="bg-slate-50 rounded-2xl p-10 text-center border border-slate-100 relative min-h-[160px] flex items-center justify-center">
        <div class="absolute top-4 left-4 bg-white px-3 py-1 rounded-full text-xs font-bold text-slate-400 shadow-sm border border-slate-100">
          <span id="current-count">1</span> / 15
        </div>
        <div id="sentence-display" class="text-2xl font-medium leading-relaxed flex flex-wrap gap-x-1 justify-center">
          <!-- Characters will be injected here -->
        </div>
      </div>

      <!-- Input Field -->
      <div class="relative">
        <input
                id="typing-input"
                type="text"
                placeholder="입력 후 Enter를 누르세요"
                class="w-full text-xl p-5 rounded-2xl border-2 border-slate-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 outline-none transition-all text-center"
                autocomplete="off"
        />
        <div class="mt-4 flex justify-between items-center text-sm text-slate-400 px-2">
          <span>Enter를 누르면 다음 문장으로 이동합니다.</span>
          <button id="btn-reset" class="flex items-center gap-1 hover:text-indigo-600 transition-colors">
            <i class="fa-solid fa-rotate-right"></i> 다시 시작
          </button>
        </div>
      </div>
    </div>

    <!-- Finished State -->
    <div id="state-finished" class="hidden text-center py-4">
      <div class="inline-flex items-center justify-center w-20 h-20 bg-yellow-100 text-yellow-600 rounded-full mb-6">
        <i class="fa-solid fa-award text-5xl"></i>
      </div>
      <h2 class="text-3xl font-bold mb-2">훈련 결과 리포트</h2>
      <p class="text-slate-500 mb-8 text-lg">성실하게 모든 문장을 완료했습니다!</p>

      <div class="grid grid-cols-3 gap-4 mb-10 max-w-2xl mx-auto">
        <div class="bg-slate-50 p-6 rounded-3xl border border-slate-100">
          <div class="text-slate-400 text-xs font-bold mb-2"><i class="fa-solid fa-chart-line"></i> 평균 타수</div>
          <div id="final-avg-cpm" class="text-3xl font-black text-slate-700">0 <span class="text-sm font-normal">타</span></div>
        </div>
        <div class="bg-indigo-50 p-6 rounded-3xl border border-indigo-100 ring-2 ring-indigo-200 ring-offset-2">
          <div class="text-indigo-400 text-xs font-bold mb-2"><i class="fa-solid fa-trophy"></i> 최고 타수</div>
          <div id="final-max-cpm" class="text-3xl font-black text-indigo-700">0 <span class="text-sm font-normal">타</span></div>
        </div>
        <div class="bg-emerald-50 p-6 rounded-3xl border border-emerald-100">
          <div class="text-emerald-400 text-xs font-bold mb-2"><i class="fa-solid fa-check-double"></i> 정확도</div>
          <div id="final-accuracy" class="text-3xl font-black text-emerald-700">0%</div>
        </div>
      </div>

      <div class="space-y-3 max-w-sm mx-auto">
        <button id="btn-restart" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-10 rounded-2xl transition-all shadow-lg shadow-indigo-200 flex items-center justify-center gap-2">
          <i class="fa-solid fa-rotate-right"></i> 다시 도전하기
        </button>
      </div>
    </div>
  </div>

  <div class="bg-slate-50 border-t border-slate-100 p-4 text-center text-slate-400 text-sm">
    실시간 타수는 현재까지 입력한 총 글자 수와 소요 시간을 기반으로 합니다.
  </div>
</div>

<script>
  const SENTENCES = [
    "천 리 길도 한 걸음부터 시작이다.",
    "낙숫물이 바위를 뚫는다.",
    "시작이 반이다.",
    "실패는 성공의 어머니이다.",
    "세 살 버릇 여든까지 간다.",
    "가는 말이 고와야 오는 말이 곱다.",
    "백자천손 즐거운 우리 집.",
    "아름다운 우리 강산 푸르게 푸르게.",
    "하면 된다는 믿음으로 노력하자.",
    "오늘 걷지 않으면 내일은 뛰어야 한다.",
    "시간은 금방 지나가니 아껴 쓰자.",
    "지식보다 중요한 것은 상상력이다.",
    "고통 없이는 얻는 것도 없다.",
    "꿈을 크게 가지면 깨져도 그 조각이 크다.",
    "어제보다 나은 오늘을 만들자."
  ];

  let currentIndex = 0;
  let startTime = null;
  let timerInterval = null;
  let totalChars = 0;
  let totalCorrectChars = 0;
  let maxCpm = 0;

  const elReady = document.getElementById('state-ready');
  const elPlaying = document.getElementById('state-playing');
  const elFinished = document.getElementById('state-finished');

  const elInput = document.getElementById('typing-input');
  const elSentenceDisplay = document.getElementById('sentence-display');
  const elProgressBar = document.getElementById('progress-bar');
  const elCurrentCount = document.getElementById('current-count');

  const elStatTime = document.getElementById('stat-time');
  const elStatCpm = document.getElementById('stat-cpm');
  const elStatMaxCpm = document.getElementById('stat-max-cpm');
  const elStatAccuracy = document.getElementById('stat-accuracy');

  const elFinalAvg = document.getElementById('final-avg-cpm');
  const elFinalMax = document.getElementById('final-max-cpm');
  const elFinalAcc = document.getElementById('final-accuracy');

  function initGame() {
    currentIndex = 0;
    startTime = null;
    totalChars = 0;
    totalCorrectChars = 0;
    maxCpm = 0;
    clearInterval(timerInterval);

    elInput.value = '';
    elStatTime.textContent = '0.0s';
    elStatCpm.textContent = '0';
    elStatMaxCpm.textContent = '0';
    elStatAccuracy.textContent = '100%';

    showState('playing');
    updateSentence();
    elInput.focus();
  }

  function showState(state) {
    elReady.classList.add('hidden');
    elPlaying.classList.add('hidden');
    elFinished.classList.add('hidden');
    document.getElementById(`state-${state}`).classList.remove('hidden');
  }

  function updateSentence() {
    const sentence = SENTENCES[currentIndex];
    elSentenceDisplay.innerHTML = '';
    elCurrentCount.textContent = currentIndex + 1;
    elProgressBar.style.width = `${(currentIndex / SENTENCES.length) * 100}%`;

    [...sentence].forEach(char => {
      const span = document.createElement('span');
      span.textContent = char === ' ' ? '\u00A0' : char;
      span.className = 'char-pending';
      elSentenceDisplay.appendChild(span);
    });
  }

  function startTimer() {
    startTime = Date.now();
    timerInterval = setInterval(() => {
      const elapsed = (Date.now() - startTime) / 1000;
      elStatTime.textContent = `${elapsed.toFixed(1)}s`;

      if (elapsed > 0) {
        const currentTotal = totalChars + elInput.value.length;
        const cpm = Math.floor((currentTotal / elapsed) * 60);
        elStatCpm.textContent = cpm;
        if (cpm > maxCpm) {
          maxCpm = cpm;
          elStatMaxCpm.textContent = maxCpm;
        }
      }
    }, 100);
  }

  function handleInput() {
    if (!startTime && elInput.value.length > 0) {
      startTimer();
    }

    const sentence = SENTENCES[currentIndex];
    const val = elInput.value;
    const spans = elSentenceDisplay.querySelectorAll('span');

    spans.forEach((span, i) => {
      if (i < val.length) {
        const targetChar = sentence[i] === ' ' ? '\u00A0' : sentence[i];
        if (val[i] === (targetChar === '\u00A0' ? ' ' : targetChar)) {
          span.className = 'char-correct';
        } else {
          span.className = 'char-incorrect';
        }
      } else {
        span.className = 'char-pending';
      }
    });
  }

  function submitSentence() {
    const sentence = SENTENCES[currentIndex];
    const val = elInput.value;
    if (val.length === 0) return;

    // Accuracy calc
    let correct = 0;
    for(let i=0; i < val.length; i++) {
      if (val[i] === sentence[i]) correct++;
    }

    totalChars += val.length;
    totalCorrectChars += correct;

    const acc = Math.floor((totalCorrectChars / totalChars) * 100);
    elStatAccuracy.textContent = `${acc}%`;

    if (currentIndex < SENTENCES.length - 1) {
      currentIndex++;
      elInput.value = '';
      updateSentence();
    } else {
      finishGame();
    }
  }

  function finishGame() {
    clearInterval(timerInterval);
    const elapsed = (Date.now() - startTime) / 1000;
    const avgCpm = Math.floor((totalChars / elapsed) * 60);
    const acc = Math.floor((totalCorrectChars / totalChars) * 100);

    elFinalAvg.innerHTML = `${avgCpm} <span class="text-sm font-normal">타</span>`;
    elFinalMax.innerHTML = `${maxCpm} <span class="text-sm font-normal">타</span>`;
    elFinalAcc.textContent = `${acc}%`;

    showState('finished');
  }

  // Event Listeners
  document.getElementById('btn-start').addEventListener('click', initGame);
  document.getElementById('btn-restart').addEventListener('click', initGame);
  document.getElementById('btn-reset').addEventListener('click', initGame);

  elInput.addEventListener('input', handleInput);
  elInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitSentence();
  });
</script>
</body>
</html>
