<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhythm Master Pro - Ultimate Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, onSnapshot, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase 설정 (환경 제공 변수 사용)
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'rhythm-ultimate';

        window.db = db;
        window.auth = auth;
        window.appId = appId;
        window.firestoreUtils = { doc, setDoc, getDoc, collection, query, onSnapshot, addDoc, deleteDoc };

        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.currentUser = user;
                // 새로고침 시 이전에 저장된 라이브러리를 불러오지 않고 기본 곡만 유지
                renderSongList();
            }
        });

        initAuth();
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;700&display=swap');

        body {
            background-color: #050505;
            color: white;
            font-family: 'Noto Sans KR', sans-serif;
            overflow: hidden;
            margin: 0;
            user-select: none;
        }

        .font-orbitron { font-family: 'Orbitron', sans-serif; }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            background: radial-gradient(circle at center, #1a1a2e 0%, #050505 100%);
            box-shadow: 0 0 100px rgba(139, 92, 246, 0.15);
        }

        .judgment-text {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            font-weight: 900;
            text-transform: uppercase;
            pointer-events: none;
            opacity: 0;
            transition: all 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 0 0 30px currentColor;
        }

        .modal {
            background: rgba(0, 0, 0, 0.94);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .song-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .song-item:hover {
            background: rgba(168, 85, 247, 0.06);
            border-color: rgba(168, 85, 247, 0.3);
            transform: translateX(3px);
        }

        .song-item-selected {
            background: rgba(168, 85, 247, 0.2) !important;
            border-color: #a855f7 !important;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
            position: relative;
        }
        .song-item-selected::after {
            content: 'SELECTED';
            position: absolute;
            right: 40px;
            font-size: 8px;
            font-family: 'Orbitron';
            color: #a855f7;
            letter-spacing: 1px;
            font-weight: 900;
        }

        .diff-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .diff-btn:hover {
            transform: translateY(-3px) scale(1.02);
            filter: brightness(1.2);
        }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #a855f7; border-radius: 10px; }
    </style>
</head>
<body>

<div id="game-container">
    <!-- UI Overlay -->
    <div class="absolute top-8 left-8 flex flex-col font-orbitron z-10">
        <div class="text-gray-400 text-[11px] tracking-widest mb-1 font-bold">SCORE</div>
        <div id="score" class="text-5xl font-black text-white">000000</div>
        <div id="diffLabel" class="mt-2 text-[11px] text-purple-400 uppercase font-black tracking-widest">SYSTEM READY</div>
    </div>

    <!-- ESC 안내 문구 -->
    <div id="escInfo" class="absolute top-8 left-1/2 -translate-x-1/2 hidden z-10 opacity-60">
        <div class="px-4 py-1.5 border border-white/20 rounded-full text-[10px] font-orbitron tracking-[0.2em] text-white bg-white/5 font-bold">
            ESC : EXIT MENU
        </div>
    </div>

    <div class="absolute top-8 right-8 flex flex-col items-end font-orbitron z-10">
        <div class="text-gray-400 text-[11px] tracking-widest mb-1 font-bold">COMBO</div>
        <div id="combo" class="text-6xl font-black text-cyan-400 font-black">0</div>
    </div>

    <div id="judgment" class="judgment-text font-orbitron z-20">PERFECT</div>

    <canvas id="gameCanvas"></canvas>

    <div id="keyHints" class="absolute bottom-6 flex justify-center pointer-events-none opacity-90 font-orbitron font-black text-white/80 z-10"></div>

    <!-- Main Selection Screen -->
    <div id="startScreen" class="absolute inset-0 z-50 flex items-center justify-center modal overflow-y-auto">
        <div id="menuContent" class="text-center p-8 w-full max-w-2xl py-16">
            <h1 class="text-7xl font-black font-orbitron mb-2 tracking-tighter italic bg-clip-text text-transparent bg-gradient-to-br from-white via-purple-400 to-cyan-500 leading-none">NEON BEAT</h1>
            <p class="text-gray-300 mb-10 tracking-[0.4em] text-[11px] font-black uppercase">Ultimate Rhythm Station</p>

            <div class="flex flex-col gap-8 text-left">
                <!-- Track List -->
                <div>
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-[12px] font-orbitron text-purple-300 tracking-[0.3em] uppercase font-bold">Official & Sessions</h3>
                        <label for="audioFile" class="text-[11px] font-bold text-white bg-purple-600 px-4 py-2 rounded-full cursor-pointer hover:bg-purple-500 transition-all flex items-center gap-2 active:scale-95 shadow-lg shadow-purple-900/20">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"/></svg>
                            ADD CUSTOM MP3
                        </label>
                        <input type="file" id="audioFile" accept="audio/mpeg,audio/mp3" class="hidden" onchange="handleFileSelect(event)">
                    </div>

                    <div id="songList" class="space-y-2 max-h-[40vh] overflow-y-auto pr-2 custom-scroll">
                        <div class="text-center py-10 opacity-40 italic text-sm text-gray-400 font-bold">Loading Library...</div>
                    </div>
                </div>

                <!-- Difficulty Section -->
                <div id="difficultySection" class="hidden border-t border-white/10 pt-8 animate-fade-in">
                    <h3 class="text-[12px] font-orbitron text-cyan-300 tracking-[0.3em] uppercase mb-6 text-center font-bold">Set Difficulty</h3>
                    <div class="grid grid-cols-3 gap-4">
                        <button onclick="startGame('easy')" class="diff-btn p-5 rounded-2xl border border-green-500/20 bg-green-500/5 flex flex-col items-center">
                            <span class="text-green-400 font-orbitron text-xl font-bold">EASY</span>
                            <span class="text-[10px] text-gray-300 uppercase tracking-widest mt-1 font-bold">Beginner</span>
                        </button>
                        <button onclick="startGame('normal')" class="diff-btn p-5 rounded-2xl border border-blue-500/20 bg-blue-500/5 flex flex-col items-center">
                            <span class="text-blue-400 font-orbitron text-lg font-bold font-black">NORMAL</span>
                            <span class="text-[10px] text-gray-300 uppercase tracking-widest mt-1 font-bold">Standard</span>
                        </button>
                        <button onclick="startGame('hard')" class="diff-btn p-5 rounded-2xl border border-red-500/20 bg-red-500/5 flex flex-col items-center">
                            <span class="text-red-500 font-orbitron text-lg font-bold font-black">HARD</span>
                            <span class="text-[10px] text-gray-300 uppercase tracking-widest mt-1 font-bold">Master</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="mt-12 opacity-60 text-[10px] uppercase tracking-[0.5em] font-orbitron text-center text-gray-300 font-bold">
                D F J K to Hit | ESC to Menu
            </div>
        </div>

        <div id="loadingView" class="hidden text-center">
            <div class="w-10 h-10 border-4 border-purple-500/20 border-t-purple-500 rounded-full animate-spin mx-auto mb-4"></div>
            <div id="loadingStatusText" class="font-orbitron text-[10px] tracking-widest text-purple-300 animate-pulse uppercase font-black">Syncing Beats...</div>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="resultScreen" class="absolute inset-0 z-50 hidden flex items-center justify-center modal">
        <div class="text-center p-10 w-full max-w-md">
            <h2 class="text-6xl font-black font-orbitron mb-8 text-white italic">CLEAR</h2>
            <div class="space-y-4 mb-10">
                <div class="flex justify-between items-end border-b border-white/5 pb-2">
                    <span class="text-gray-400 text-[11px] font-orbitron tracking-widest font-black">FINAL SCORE</span>
                    <span id="finalScore" class="text-3xl font-orbitron font-black text-white">0</span>
                </div>
                <div class="flex justify-between items-end border-b border-white/5 pb-2">
                    <span class="text-gray-400 text-[11px] font-orbitron tracking-widest font-black">MAX COMBO</span>
                    <span id="finalCombo" class="text-3xl font-orbitron font-black text-cyan-400">0</span>
                </div>
            </div>
            <button onclick="location.reload()" class="w-full py-5 bg-white text-black font-black font-orbitron tracking-widest rounded-full hover:bg-gray-200 transition-all">BACK TO MENU</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // 공식 트랙 리스트
    const DEFAULT_SONGS = [
        {
            id: 'def-1',
            name: 'Outfoxing (Official)',
            type: 'default',
            url: 'https://raw.githubusercontent.com/mdn/webaudio-examples/master/audio-basics/outfoxing.mp3',
            bpm: 110,
            color: '#a855f7'
        },
        {
            id: 'def-2',
            name: 'Cyber Drums (Official)',
            type: 'default',
            url: 'https://raw.githubusercontent.com/mdn/webaudio-examples/master/multi-track/drums.mp3',
            bpm: 125,
            color: '#3b82f6'
        }
    ];

    const DIFF_CONFIGS = {
        easy: { speed: 0.53, spawnRate: 0.7, name: 'EASY', color: '#4ade80' },
        normal: { speed: 0.73, spawnRate: 1.0, name: 'NORMAL', color: '#3b82f6' },
        hard: { speed: 0.93, spawnRate: 1.3, name: 'HARD', color: '#ef4444' }
    };

    const KEYS = ['d', 'f', 'j', 'k'];
    const LANE_COLORS = ['#a855f7', '#8b5cf6', '#06b6d4', '#22d3ee'];
    const HIT_LINE_Y_RATIO = 0.88;

    let width, height, laneWidth;
    let score = 0, combo = 0, maxCombo = 0;
    let gameActive = false;
    let notes = [];
    let lastTime = 0, spawnTimer = 0;

    let audio = new Audio();
    audio.crossOrigin = "anonymous";
    let audioCtx = null;
    let currentConfig = null;
    let flashLanes = [0, 0, 0, 0];
    let selectedSongData = null;
    let userTracks = [];

    let sessionBlobCache = {};
    let currentlySelectedId = null;

    function renderSongList() {
        const container = document.getElementById('songList');
        const listSongs = [...DEFAULT_SONGS, ...userTracks];

        container.innerHTML = listSongs.map(song => {
            const isSelected = song.id === currentlySelectedId;
            return `
                <div onclick="selectSong('${song.id}')" id="song-${song.id}"
                     class="song-item p-4 rounded-xl flex items-center justify-between cursor-pointer group ${isSelected ? 'song-item-selected' : ''}">
                    <div class="flex items-center gap-4">
                        <div class="w-2.5 h-2.5 rounded-full" style="background-color: ${song.color || '#555'}"></div>
                        <div class="flex flex-col">
                            <span class="text-[13px] font-bold text-white group-hover:text-purple-300 transition-colors font-black">${song.name}</span>
                            <span class="text-[10px] text-gray-400 uppercase tracking-widest font-bold">${song.type === 'default' ? 'STATION TRACK' : 'SESSION MP3'}</span>
                        </div>
                    </div>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400 group-hover:text-purple-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" /></svg>
                </div>
            `;
        }).join('');
    }

    async function selectSong(id) {
        currentlySelectedId = id;
        renderSongList();
        const allSongs = [...DEFAULT_SONGS, ...userTracks];
        selectedSongData = allSongs.find(s => s.id === id);

        if (selectedSongData.type === 'custom' && !selectedSongData.data) {
            if (sessionBlobCache[id]) {
                selectedSongData.data = sessionBlobCache[id];
            } else {
                alert("파일 데이터가 만료되었습니다. 다시 한 번 선택해 주셔야 플레이가 가능합니다.");
                document.getElementById('audioFile').click();
                return;
            }
        }
        document.getElementById('difficultySection').classList.remove('hidden');
        document.getElementById('difficultySection').scrollIntoView({ behavior: 'smooth' });
    }

    async function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file || !file.type.startsWith('audio/')) return;

        const blobUrl = URL.createObjectURL(file);
        const tempId = 'session-' + Date.now();
        currentlySelectedId = tempId;
        sessionBlobCache[tempId] = blobUrl;

        // 120~160 사이의 랜덤 BPM 적용
        const randomBpm = 120 + Math.floor(Math.random() * 41);

        selectedSongData = {
            id: tempId,
            name: file.name,
            type: 'custom',
            data: blobUrl,
            bpm: randomBpm,
            color: LANE_COLORS[Math.floor(Math.random() * 4)]
        };

        userTracks.unshift(selectedSongData);
        renderSongList();

        document.getElementById('difficultySection').classList.remove('hidden');
        document.getElementById('difficultySection').scrollIntoView({ behavior: 'smooth' });
    }

    function playHitSynth(index) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(180 + index * 40, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }

    async function startGame(level) {
        if (!selectedSongData) return;
        currentConfig = DIFF_CONFIGS[level];
        document.getElementById('menuContent').classList.add('hidden');
        document.getElementById('loadingView').classList.remove('hidden');

        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        audio.pause();
        audio.src = selectedSongData.data || selectedSongData.url;
        audio.load();

        audio.oncanplaythrough = () => {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('diffLabel').innerText = `${selectedSongData.name} (${currentConfig.name})`;
            document.getElementById('diffLabel').style.color = currentConfig.color;
            document.getElementById('escInfo').classList.remove('hidden');

            gameActive = true;
            score = 0; combo = 0; maxCombo = 0; notes = [];

            const bpm = selectedSongData.bpm || 120;
            const interval = (60000 / bpm) / (currentConfig.spawnRate * 1.5);
            spawnTimer = interval;

            lastTime = performance.now();
            audio.play().catch(() => {});
            audio.onended = () => { if (gameActive) endMatch(); };
            requestAnimationFrame(gameLoop);
        };
    }

    function init() {
        resize();
        renderSongList();
        window.addEventListener('resize', resize);
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') location.reload();
            handleKeyDown(e);
        });
    }

    function resize() {
        width = Math.min(window.innerWidth, 480);
        height = window.innerHeight;
        laneWidth = width / 4;
        canvas.width = width;
        canvas.height = height;
        const hints = document.getElementById('keyHints');
        hints.style.width = width + 'px';
        hints.innerHTML = KEYS.map(k => `<div style="width:${laneWidth}px" class="text-center text-lg font-black">${k.toUpperCase()}</div>`).join('');
    }

    function handleKeyDown(e) {
        if (!gameActive) return;
        const idx = KEYS.indexOf(e.key.toLowerCase());
        if (idx === -1) return;
        flashLanes[idx] = 1.0;
        playHitSynth(idx);
        const hy = height * HIT_LINE_Y_RATIO;
        for (let i = 0; i < notes.length; i++) {
            const n = notes[i];
            if (n.lane === idx && !n.hit) {
                const diff = Math.abs(n.y - hy);
                if (diff < 120) { n.hit = true; applyJudgment(diff); break; }
            }
        }
    }

    function applyJudgment(diff) {
        let msg = "GOOD", col = "#fbbf24", pts = 200;
        if (diff < 40) { msg = "PERFECT"; col = "#22d3ee"; pts = 1000; }
        else if (diff < 80) { msg = "GREAT"; col = "#a855f7"; pts = 500; }
        score += pts; combo++;
        if (combo > maxCombo) maxCombo = combo;
        updateUI(); showJudgment(msg, col);
    }

    function showJudgment(text, color) {
        const j = document.getElementById('judgment');
        j.innerText = text; j.style.color = color; j.style.opacity = '1';
        j.style.transform = 'translate(-50%, -50%) scale(1.1) rotate(-3deg)';
        setTimeout(() => { if (j.innerText === text) { j.style.opacity = '0'; j.style.transform = 'translate(-50%, -50%) scale(1) rotate(0deg)'; } }, 400);
    }

    function updateUI() {
        document.getElementById('score').innerText = score.toString().padStart(6, '0');
        document.getElementById('combo').innerText = combo;
    }

    function endMatch() {
        if (!gameActive) return;
        gameActive = false;
        audio.pause();
        document.getElementById('escInfo').classList.add('hidden');
        document.getElementById('resultScreen').classList.remove('hidden');
        document.getElementById('finalScore').innerText = score;
        document.getElementById('finalCombo').innerText = maxCombo;
    }

    function gameLoop(time) {
        if (!gameActive) return;
        const dt = time - lastTime;
        lastTime = time;
        spawnTimer += dt;
        const bpm = selectedSongData.bpm || 120;
        const interval = (60000 / bpm) / (currentConfig.spawnRate * 1.5);

        // 음악 종료 4초 전부터 노트 생성을 하지 않음
        const isNearEnd = audio.duration > 0 && (audio.currentTime > audio.duration - 4);

        if (spawnTimer >= interval && !isNearEnd) {
            spawnTimer = 0;
            const lane = Math.floor(Math.random() * 4);
            notes.push({ lane, y: -60, hit: false });
            if (currentConfig.name === 'HARD' && Math.random() < 0.4) {
                const lane2 = (lane + Math.floor(Math.random() * 3) + 1) % 4;
                notes.push({ lane: lane2, y: -60, hit: false });
            }
        }
        notes.forEach(n => n.y += dt * currentConfig.speed);
        notes = notes.filter(n => {
            if (!n.hit && n.y > height * (HIT_LINE_Y_RATIO + 0.15)) {
                combo = 0; updateUI(); showJudgment("MISS", "#ef4444"); return false;
            }
            return !n.hit;
        });
        flashLanes = flashLanes.map(v => Math.max(0, v - dt * 0.005));
        draw();
        requestAnimationFrame(gameLoop);
    }

    function draw() {
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < 4; i++) {
            if (flashLanes[i] > 0) {
                ctx.fillStyle = `rgba(139, 92, 246, ${flashLanes[i] * 0.2})`;
                ctx.fillRect(i * laneWidth, 0, laneWidth, height);
            }
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.strokeRect(i * laneWidth, 0, laneWidth, height);
        }
        const hy = height * HIT_LINE_Y_RATIO;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.lineWidth = 2;
        ctx.setLineDash([15, 8]);
        ctx.beginPath(); ctx.moveTo(0, hy); ctx.lineTo(width, hy); ctx.stroke();
        ctx.setLineDash([]);
        ctx.lineWidth = 1;
        notes.forEach(n => {
            const nx = n.lane * laneWidth + 10, nw = laneWidth - 20, nh = 28;
            ctx.shadowBlur = 15; ctx.shadowColor = LANE_COLORS[n.lane];
            const g = ctx.createLinearGradient(nx, n.y, nx, n.y + nh);
            g.addColorStop(0, '#fff'); g.addColorStop(0.5, LANE_COLORS[n.lane]); g.addColorStop(1, '#000');
            ctx.fillStyle = g; ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(nx, n.y, nw, nh, 8); else ctx.rect(nx, n.y, nw, nh);
            ctx.fill(); ctx.shadowBlur = 0;
        });
    }

    window.onload = init;
</script>
</body>
</html>
