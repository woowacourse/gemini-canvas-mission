<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kotlin 고차함수 마스터 퀴즈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code:wght@400;500&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #f8fafc;
        }
        
        pre, code {
            font-family: 'Fira Code', monospace !important;
        }

        .option-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .correct {
            background-color: #22c55e !important;
            color: white !important;
            border-color: #16a34a !important;
        }

        .incorrect {
            background-color: #ef4444 !important;
            color: white !important;
            border-color: #dc2626 !important;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4">

    <!-- Header -->
    <header class="w-full max-w-2xl text-center mb-8">
        <h1 class="text-3xl font-bold text-indigo-700 flex items-center justify-center gap-2">
            <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M2 2L12 12L22 2H2Z" fill="#7F52FF"/>
                <path d="M2 22L12 12L22 22H2Z" fill="#7F52FF"/>
                <path d="M2 2L12 12L2 22V2Z" fill="#E44857"/>
            </svg>
            Kotlin Higher-Order Functions
        </h1>
        <p class="text-gray-600 mt-2">코틀린의 핵심, 고차함수 실력을 테스트해보세요!</p>
    </header>

    <!-- Quiz Container -->
    <main id="app" class="w-full max-w-2xl bg-white rounded-2xl shadow-xl p-6 md:p-8">
        <!-- Start Screen -->
        <div id="start-screen" class="text-center py-10">
            <div class="mb-6 text-5xl">🚀</div>
            <h2 class="text-2xl font-bold mb-4">준비되셨나요?</h2>
            <p class="text-gray-500 mb-8">총 10개의 문제가 준비되어 있습니다.<br>각 문제의 코드를 보고 올바른 결과값을 선택하세요.</p>
            <button onclick="quizManager.start()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-full transition-colors">
                퀴즈 시작하기
            </button>
        </div>

        <!-- Question Screen (Hidden by default) -->
        <div id="quiz-screen" class="hidden fade-in">
            <div class="flex justify-between items-center mb-6">
                <span id="progress-text" class="text-sm font-semibold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">Question 1/10</span>
                <span id="score-text" class="text-sm font-semibold text-gray-500">Score: 0</span>
            </div>

            <h3 id="question-text" class="text-lg font-bold text-gray-800 mb-4">다음 코드의 실행 결과는 무엇일까요?</h3>
            
            <div class="rounded-lg overflow-hidden mb-6 border border-gray-200">
                <pre class="!m-0"><code id="code-block" class="language-kotlin"></code></pre>
            </div>

            <div id="options-container" class="grid grid-cols-1 gap-3">
                <!-- Options will be injected here -->
            </div>

            <!-- Feedback Area -->
            <div id="feedback" class="hidden mt-6 p-4 rounded-lg border">
                <div class="flex items-center gap-2 mb-2">
                    <span id="feedback-icon" class="font-bold text-lg"></span>
                    <span id="feedback-title" class="font-bold"></span>
                </div>
                <p id="explanation-text" class="text-sm text-gray-700 leading-relaxed"></p>
                <button onclick="quizManager.next()" class="mt-4 w-full bg-gray-800 hover:bg-black text-white py-2 rounded-lg font-semibold transition-colors">
                    다음 문제
                </button>
            </div>
        </div>

        <!-- Result Screen (Hidden by default) -->
        <div id="result-screen" class="hidden text-center py-10 fade-in">
            <div id="result-emoji" class="text-6xl mb-4">🎉</div>
            <h2 class="text-3xl font-bold mb-2">완료했습니다!</h2>
            <p id="final-score" class="text-xl text-indigo-600 font-bold mb-6"></p>
            <p id="result-message" class="text-gray-500 mb-8"></p>
            <button onclick="location.reload()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-full transition-colors">
                다시 도전하기
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-10 text-gray-400 text-sm">
        © 2024 Kotlin Quiz Master · Built for Learning
    </footer>

    <!-- Prism.js for syntax highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-kotlin.min.js"></script>

    <script>
        const questions = [
            {
                code: `val list = listOf(1, 2, 3, 4)\nval result = list.filter { it % 2 == 0 }\nprintln(result)`,
                options: ["[1, 2, 3, 4]", "[2, 4]", "[1, 3]", "[2]"],
                answer: 1,
                explanation: "filter 함수는 주어진 술어(predicate) 조건이 참(true)인 요소들만 모아 새로운 리스트를 반환합니다."
            },
            {
                code: `val list = listOf("a", "b")\nval result = list.map { it.uppercase() }\nprintln(result)`,
                options: ["[A, B]", "[\"a\", \"b\"]", "[A, b]", "Error"],
                answer: 0,
                explanation: "map 함수는 각 요소를 주어진 변환 방식에 따라 변형하여 새로운 리스트를 생성합니다."
            },
            {
                code: `val numbers = listOf(1, 2, 3)\nval result = numbers.fold(10) { acc, i -> acc + i }\nprintln(result)`,
                options: ["6", "10", "16", "15"],
                answer: 2,
                explanation: "fold 함수는 초기값(10)부터 시작하여 누적값(acc)과 현재 요소(i)를 연산합니다. 10 + 1 + 2 + 3 = 16이 됩니다."
            },
            {
                code: `val data = listOf(listOf(1), listOf(2, 3))\nval result = data.flatMap { it }\nprintln(result)`,
                options: ["[1, [2, 3]]", "[[1], [2, 3]]", "[1, 2, 3]", "1, 2, 3"],
                answer: 2,
                explanation: "flatMap은 각 요소를 컬렉션으로 변환한 뒤, 그것들을 하나의 리스트로 평탄화(flatten)합니다."
            },
            {
                code: `val list = listOf(1, 2, 3)\nval result = list.any { it > 2 }\nprintln(result)`,
                options: ["true", "false", "[3]", "1"],
                answer: 0,
                explanation: "any 함수는 컬렉션 내에 조건을 만족하는 요소가 하나라도 있으면 true를 반환합니다."
            },
            {
                code: `val fruits = listOf("apple", "banana", "cherry")\nval result = fruits.groupBy { it.first() }\nprintln(result['b'])`,
                options: ["banana", "[banana]", "['banana']", "b"],
                answer: 1,
                explanation: "groupBy는 조건에 따라 Map<K, List<V>> 형태로 그룹화합니다. 'b'로 시작하는 그룹은 [banana] 리스트를 값으로 가집니다."
            },
            {
                code: `val list = emptyList<Int>()\n// 아래 코드를 실행하면?\nval result = list.reduce { acc, i -> acc + i }`,
                options: ["0", "null", "Exception 발생", "컴파일 에러"],
                answer: 2,
                explanation: "reduce는 초기값이 없으므로 빈 컬렉션에서 호출하면 Runtime Exception(UnsupportedOperationException)이 발생합니다. 빈 리스트가 가능할 땐 fold나 reduceOrNull을 써야 합니다."
            },
            {
                code: `val list = listOf(1, 2, 3, 4, 5)\nval result = list.partition { it % 2 == 0 }\n// result.first는?`,
                options: ["[1, 3, 5]", "[2, 4]", "[1, 2, 3, 4, 5]", "[]"],
                answer: 1,
                explanation: "partition은 조건을 만족하는 리스트(first)와 만족하지 않는 리스트(second)의 Pair를 반환합니다."
            },
            {
                code: `val list = listOf(1, 2, 3)\nval result = list.associateBy { it * 10 }\nprintln(result[20])`,
                options: ["2", "20", "null", "[2]"],
                answer: 0,
                explanation: "associateBy는 요소를 키(Key)로 변환하여 Map을 만듭니다. 여기서 키는 10, 20, 30이 되고 값은 원래 요소인 1, 2, 3이 됩니다."
            },
            {
                code: `val names = listOf("Tom", "Jerry")\nval ages = listOf(20, 30)\nval result = names.zip(ages)\nprintln(result[0])`,
                options: ["(Tom, 20)", "[Tom, 20]", "Tom20", "20"],
                answer: 0,
                explanation: "zip 함수는 두 컬렉션의 같은 인덱스 요소끼리 Pair로 묶어 리스트를 만듭니다."
            }
        ];

        class QuizManager {
            constructor() {
                this.currentIdx = 0;
                this.score = 0;
                this.isAnswered = false;
            }

            start() {
                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('quiz-screen').classList.remove('hidden');
                this.showQuestion();
            }

            showQuestion() {
                const q = questions[this.currentIdx];
                this.isAnswered = false;
                
                // Update UI
                document.getElementById('progress-text').innerText = `Question ${this.currentIdx + 1}/${questions.length}`;
                document.getElementById('score-text').innerText = `Score: ${this.score}`;
                document.getElementById('code-block').textContent = q.code;
                document.getElementById('feedback').classList.add('hidden');
                
                // Re-highlight code
                Prism.highlightAll();

                // Render options
                const container = document.getElementById('options-container');
                container.innerHTML = '';
                q.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn w-full text-left p-4 rounded-xl border-2 border-gray-100 bg-gray-50 font-medium text-gray-700 hover:border-indigo-300';
                    btn.innerText = opt;
                    btn.onclick = () => this.checkAnswer(idx, btn);
                    container.appendChild(btn);
                });
            }

            checkAnswer(selectedIdx, btnElement) {
                if (this.isAnswered) return;
                this.isAnswered = true;

                const q = questions[this.currentIdx];
                const feedback = document.getElementById('feedback');
                const feedbackIcon = document.getElementById('feedback-icon');
                const feedbackTitle = document.getElementById('feedback-title');
                const explanation = document.getElementById('explanation-text');
                const options = document.querySelectorAll('.option-btn');

                // Disable all buttons
                options.forEach(btn => btn.disabled = true);

                if (selectedIdx === q.answer) {
                    btnElement.classList.add('correct');
                    this.score += 10;
                    feedback.classList.add('bg-green-50', 'border-green-200');
                    feedback.classList.remove('bg-red-50', 'border-red-200');
                    feedbackIcon.innerText = '✅';
                    feedbackTitle.innerText = '정답입니다!';
                    feedbackTitle.className = 'font-bold text-green-700';
                } else {
                    btnElement.classList.add('incorrect');
                    options[q.answer].classList.add('correct');
                    feedback.classList.add('bg-red-50', 'border-red-200');
                    feedback.classList.remove('bg-green-50', 'border-green-200');
                    feedbackIcon.innerText = '❌';
                    feedbackTitle.innerText = '아쉽네요...';
                    feedbackTitle.className = 'font-bold text-red-700';
                }

                explanation.innerText = q.explanation;
                feedback.classList.remove('hidden');
                document.getElementById('score-text').innerText = `Score: ${this.score}`;
            }

            next() {
                this.currentIdx++;
                if (this.currentIdx < questions.length) {
                    this.showQuestion();
                } else {
                    this.showResult();
                }
            }

            showResult() {
                document.getElementById('quiz-screen').classList.add('hidden');
                const resultScreen = document.getElementById('result-screen');
                resultScreen.classList.remove('hidden');
                
                const finalScore = document.getElementById('final-score');
                const emoji = document.getElementById('result-emoji');
                const message = document.getElementById('result-message');

                finalScore.innerText = `${this.score} / ${questions.length * 10}`;

                if (this.score >= 90) {
                    emoji.innerText = '🏆';
                    message.innerText = '당신은 코틀린 고차함수 마스터입니다!';
                } else if (this.score >= 60) {
                    emoji.innerText = '🥈';
                    message.innerText = '훌륭합니다! 조금만 더 공부하면 완벽하겠어요.';
                } else {
                    emoji.innerText = '📚';
                    message.innerText = '기초를 다시 한 번 복습해볼까요? 다시 도전해보세요!';
                }
            }
        }

        const quizManager = new QuizManager();
    </script>
</body>
</html>
