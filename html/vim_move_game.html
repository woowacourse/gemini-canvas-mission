<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>똥빔 피하기: High Precision</title>
    <style>
      :root {
        --bg-color: #121212;
        --text-color: #e0e0e0;
        --accent-color: #8b4513;
        --accent-glow: rgba(139, 69, 19, 0.4);
        --gold: #ffcc00;
      }

      body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: var(--bg-color);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        overflow: hidden;
        color: var(--text-color);
      }

      #game-container {
        position: relative;
        width: 95vw;
        max-width: 1100px;
        height: 85vh;
        max-height: 850px;
        background: #1e1e1e;
        border-radius: 20px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
        overflow: hidden;
        border: 1px solid #333;
      }

      canvas {
        display: block;
        background: radial-gradient(circle at center, #252525 0%, #0f0f0f 100%);
      }

      #ui-layer {
        position: absolute;
        top: 20px;
        left: 20px;
        pointer-events: none;
        display: flex;
        gap: 12px;
      }

      .stat-box {
        background: rgba(0, 0, 0, 0.75);
        padding: 6px 14px;
        border-radius: 10px;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        font-weight: 600;
        font-size: 0.85rem;
        letter-spacing: 0.5px;
        color: var(--accent-color);
      }

      #key-guide {
        position: absolute;
        bottom: 20px;
        right: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        pointer-events: none;
        opacity: 0.7;
      }

      .key-row {
        display: flex;
        gap: 5px;
      }

      .mini-key {
        width: 32px;
        height: 32px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--accent-color);
        border-radius: 6px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: monospace;
        font-size: 0.75rem;
        color: var(--text-color);
      }

      .mini-key span {
        font-size: 0.45rem;
        color: var(--accent-color);
        font-weight: bold;
      }

      #overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.94);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 10;
        text-align: center;
        padding: 40px;
      }

      h1 {
        font-size: 3.5rem;
        margin-bottom: 20px;
        color: var(--accent-color);
        font-weight: 900;
        text-shadow: 0 0 20px var(--accent-glow);
      }

      p {
        font-size: 1.1rem;
        margin-bottom: 30px;
        opacity: 0.8;
      }

      .high-score-box {
        background: rgba(255, 204, 0, 0.1);
        padding: 10px 20px;
        border-radius: 10px;
        border: 1px solid var(--gold);
        margin-bottom: 20px;
        font-size: 0.9rem;
      }

      #name-input-container {
        margin-bottom: 20px;
      }

      #user-name {
        background: #2a2a2a;
        border: 1px solid var(--accent-color);
        color: white;
        padding: 12px;
        border-radius: 8px;
        text-align: center;
        font-size: 1rem;
        outline: none;
        width: 200px;
      }

      .btn-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
      }

      .main-btns {
        display: flex;
        gap: 10px;
      }

      button {
        background: var(--accent-color);
        color: white;
        border: none;
        padding: 14px 40px;
        font-size: 1.1rem;
        font-weight: 800;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      button.secondary {
        background: transparent;
        border: 1px solid var(--accent-color);
        padding: 10px 25px;
        font-size: 0.9rem;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px var(--accent-glow);
        filter: brightness(1.1);
      }

      .key-hint-small {
        font-size: 0.75rem;
        opacity: 0.5;
        margin-top: 5px;
        font-family: monospace;
        color: var(--text-color);
      }

      #records-modal {
        position: absolute;
        inset: 50px;
        background: #1a1a1a;
        border: 2px solid var(--accent-color);
        border-radius: 15px;
        z-index: 20;
        display: flex;
        flex-direction: column;
        padding: 30px;
        box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
      }

      #records-list {
        flex: 1;
        overflow-y: auto;
        margin: 20px 0;
        text-align: left;
      }

      .record-item {
        display: flex;
        justify-content: space-between;
        padding: 12px;
        border-bottom: 1px solid #333;
        font-size: 1rem;
      }

      .record-item:first-child {
        color: var(--gold);
        font-weight: bold;
        background: rgba(255, 204, 0, 0.05);
      }

      .hidden {
        display: none !important;
      }

      #final-score-display {
        font-size: 4.5rem;
        font-weight: 900;
        color: var(--gold);
        margin: 5px 0 25px 0;
        text-shadow: 0 0 30px rgba(255, 204, 0, 0.4);
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="gameCanvas"></canvas>

      <div id="ui-layer">
        <div class="stat-box">SCORE: <span id="score">0</span></div>
        <div class="stat-box">LEVEL: <span id="level">1</span></div>
      </div>

      <div id="key-guide">
        <div class="key-row">
          <div class="mini-key">k<span>UP</span></div>
        </div>
        <div class="key-row">
          <div class="mini-key">h<span>LEFT</span></div>
          <div class="mini-key">j<span>DOWN</span></div>
          <div class="mini-key">l<span>RIGHT</span></div>
        </div>
      </div>

      <div id="overlay">
        <h1 id="overlay-title">똥빔 피하기</h1>

        <div id="game-over-info" class="hidden">
          <p>최종 점수</p>
          <div id="final-score-display">0</div>

          <div
            id="new-record-msg"
            class="hidden"
            style="
              color: var(--gold);
              margin-bottom: 15px;
              font-weight: bold;
              font-size: 1.2rem;
            "
          >
            🎉 순위권 진입! 이름을 등록하세요.
          </div>

          <div id="name-input-container" class="hidden">
            <input
              type="text"
              id="user-name"
              placeholder="닉네임 입력"
              maxlength="10"
            />
          </div>
        </div>

        <div id="start-screen-info">
          <div id="best-record-display" class="high-score-box hidden">
            최고 기록: <span id="best-score-val">0</span> (<span
              id="best-name-val"
              >-</span
            >)
          </div>
          <p>사방에서 몰려오는 똥을 피하세요.</p>
        </div>

        <div class="btn-group">
          <div class="main-btns">
            <button id="start-btn">시작</button>
            <button id="home-btn" class="secondary hidden">홈으로</button>
            <button id="records-btn" class="secondary hidden">기록 보기</button>
          </div>
          <span id="space-hint" class="key-hint-small">&lt;space&gt;</span>
        </div>
      </div>

      <div id="records-modal" class="hidden">
        <h2 style="color: var(--gold); margin: 0; text-align: center">
          🏆 명예의 전당 (Top 10)
        </h2>
        <div id="records-list"></div>
        <button id="close-records-btn" style="width: 100%">닫기</button>
      </div>
    </div>

    <script>
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const scoreElement = document.getElementById("score");
      const levelElement = document.getElementById("level");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlay-title");
      const startBtn = document.getElementById("start-btn");
      const homeBtn = document.getElementById("home-btn");
      const recordsBtn = document.getElementById("records-btn");
      const recordsModal = document.getElementById("records-modal");
      const recordsList = document.getElementById("records-list");
      const closeRecordsBtn = document.getElementById("close-records-btn");
      const gameOverInfo = document.getElementById("game-over-info");
      const startScreenInfo = document.getElementById("start-screen-info");
      const finalScoreDisplay = document.getElementById("final-score-display");
      const nameInputContainer = document.getElementById(
        "name-input-container",
      );
      const newRecordMsg = document.getElementById("new-record-msg");
      const userNameInput = document.getElementById("user-name");
      const bestRecordDisplay = document.getElementById("best-record-display");
      const bestScoreVal = document.getElementById("best-score-val");
      const bestNameVal = document.getElementById("best-name-val");

      let canvasWidth, canvasHeight;
      let gameActive = false;
      let score = 0;
      let level = 1;
      let frameCount = 0;
      let poops = [];
      let keys = {};

      let highScore =
        parseInt(localStorage.getItem("poopDodge_highScore")) || 0;
      let highScoreName =
        localStorage.getItem("poopDodge_highScoreName") || "무명";
      let historyRecords =
        JSON.parse(localStorage.getItem("poopDodge_history")) || [];

      const MACBOOK_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect x="15" y="25" width="70" height="45" rx="3" fill="#A1A1A1"/><rect x="18" y="28" width="64" height="39" fill="#000"/><path d="M10 70 L90 70 L95 75 L5 75 Z" fill="#D1D1D1"/><rect x="42" y="70" width="16" height="2" fill="#888"/></svg>`;
      const POOP_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50 15 C40 15 35 25 35 35 C20 40 15 55 25 65 C15 75 30 90 50 90 C70 90 85 75 75 65 C85 55 80 40 65 35 C65 25 60 15 50 15 Z" fill="#8B4513"/><circle cx="40" cy="50" r="4" fill="white"/><circle cx="60" cy="50" r="4" fill="white"/><circle cx="40" cy="50" r="2" fill="black"/><circle cx="60" cy="50" r="2" fill="black"/><path d="M40 70 Q50 80 60 70" stroke="white" stroke-width="2" fill="none"/></svg>`;

      const macbookImg = new Image();
      macbookImg.src = "data:image/svg+xml;base64," + btoa(MACBOOK_SVG);
      const poopImg = new Image();
      poopImg.src = "data:image/svg+xml;base64," + btoa(POOP_SVG);

      const player = {
        x: 0,
        y: 0,
        width: 54,
        height: 46,
        speed: 2.8,
      };

      function updateBestRecordUI() {
        if (highScore > 0) {
          bestRecordDisplay.classList.remove("hidden");
          bestScoreVal.textContent = highScore;
          bestNameVal.textContent = highScoreName;
        }
      }

      function resize() {
        const container = document.getElementById("game-container");
        canvasWidth = container.clientWidth;
        canvasHeight = container.clientHeight;
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;

        if (!gameActive) {
          player.x = canvasWidth / 2 - player.width / 2;
          player.y = canvasHeight / 2 - player.height / 2;
        }
      }

      window.addEventListener("resize", resize);
      resize();
      updateBestRecordUI();

      window.addEventListener("keydown", (e) => {
        keys[e.key] = true;
      });
      window.addEventListener("keyup", (e) => {
        keys[e.key] = false;
      });

      class Poop {
        constructor() {
          this.size = 28 + Math.random() * 12;
          this.side = Math.floor(Math.random() * 4);
          const baseSpeed =
            (0.5 + Math.random() * 1.0) * (1 + (level - 1) * 0.12);
          switch (this.side) {
            case 0:
              this.x = Math.random() * canvasWidth;
              this.y = -this.size;
              this.vx = (Math.random() - 0.5) * 1.2;
              this.vy = baseSpeed;
              break;
            case 1:
              this.x = canvasWidth + this.size;
              this.y = Math.random() * canvasHeight;
              this.vx = -baseSpeed;
              this.vy = (Math.random() - 0.5) * 1.2;
              break;
            case 2:
              this.x = Math.random() * canvasWidth;
              this.y = canvasHeight + this.size;
              this.vx = (Math.random() - 0.5) * 1.2;
              this.vy = -baseSpeed;
              break;
            case 3:
              this.x = -this.size;
              this.y = Math.random() * canvasHeight;
              this.vx = baseSpeed;
              this.vy = (Math.random() - 0.5) * 1.2;
              break;
          }
          this.rotation = Math.random() * Math.PI * 2;
          this.rotationSpeed = (Math.random() - 0.5) * 0.05;
        }
        update() {
          this.x += this.vx;
          this.y += this.vy;
          this.rotation += this.rotationSpeed;
          return (
            this.x < -this.size * 3 ||
            this.x > canvasWidth + this.size * 3 ||
            this.y < -this.size * 3 ||
            this.y > canvasHeight + this.size * 3
          );
        }
        draw() {
          ctx.save();
          ctx.translate(this.x + this.size / 2, this.y + this.size / 2);
          ctx.rotate(this.rotation);
          ctx.drawImage(
            poopImg,
            -this.size / 2,
            -this.size / 2,
            this.size,
            this.size,
          );
          ctx.restore();
        }
      }

      function spawnPoop() {
        const spawnInterval = Math.max(4, 40 - level * 3.5);
        if (frameCount % Math.floor(spawnInterval) === 0) {
          poops.push(new Poop());
        }
      }

      function updatePlayer() {
        if ((keys["h"] || keys["ㅗ"]) && player.x > 0) player.x -= player.speed;
        if ((keys["l"] || keys["ㅣ"]) && player.x < canvasWidth - player.width)
          player.x += player.speed;
        if ((keys["k"] || keys["ㅏ"]) && player.y > 0) player.y -= player.speed;
        if (
          (keys["j"] || keys["ㅓ"]) &&
          player.y < canvasHeight - player.height
        )
          player.y += player.speed;
      }

      function checkCollision(p, poop) {
        const px = p.x + p.width / 2;
        const py = p.y + p.height / 2;
        const ox = poop.x + poop.size / 2;
        const oy = poop.y + poop.size / 2;
        const dx = px - ox;
        const dy = py - oy;
        return Math.sqrt(dx * dx + dy * dy) < p.width / 2.8 + poop.size / 2.8;
      }

      function gameLoop() {
        if (!gameActive) return;
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);
        frameCount++;
        score++;
        scoreElement.textContent = score;
        const newLevel = Math.floor(score / 800) + 1;
        if (newLevel !== level) {
          level = newLevel;
          levelElement.textContent = level;
        }
        updatePlayer();
        spawnPoop();
        ctx.drawImage(
          macbookImg,
          player.x,
          player.y,
          player.width,
          player.height,
        );
        for (let i = poops.length - 1; i >= 0; i--) {
          const poop = poops[i];
          const isOffScreen = poop.update();
          poop.draw();
          if (checkCollision(player, poop)) endGame();
          if (isOffScreen) poops.splice(i, 1);
        }
        requestAnimationFrame(gameLoop);
      }

      function saveCurrentRecord() {
        if (score > 0) {
          // 순위 진입 확인 로직 (Top 10)
          const isQualify =
            historyRecords.length < 10 ||
            score > historyRecords[historyRecords.length - 1].score;

          if (isQualify) {
            const name = userNameInput.value.trim() || "무명";
            const newRecord = {
              name,
              score,
              date: new Date().toLocaleDateString(),
            };

            // 최고 기록 경신 여부 별도 체크
            if (score > highScore) {
              highScore = score;
              highScoreName = name;
              localStorage.setItem("poopDodge_highScore", highScore);
              localStorage.setItem("poopDodge_highScoreName", highScoreName);
            }

            historyRecords.push(newRecord);
            historyRecords.sort((a, b) => b.score - a.score);
            historyRecords = historyRecords.slice(0, 10);
            localStorage.setItem(
              "poopDodge_history",
              JSON.stringify(historyRecords),
            );
            updateBestRecordUI();
          }
        }
      }

      function showHome() {
        saveCurrentRecord();
        overlayTitle.textContent = "똥빔 피하기";
        gameOverInfo.classList.add("hidden");
        startScreenInfo.classList.remove("hidden");
        homeBtn.classList.add("hidden");
        recordsBtn.classList.add("hidden");
        startBtn.textContent = "시작";
        score = 0;
        level = 1;
        scoreElement.textContent = "0";
        levelElement.textContent = "1";
        resize();
      }

      function startGame() {
        if (!gameActive && !gameOverInfo.classList.contains("hidden")) {
          saveCurrentRecord();
        }
        score = 0;
        level = 1;
        frameCount = 0;
        poops = [];
        resize();
        gameActive = true;
        scoreElement.textContent = score;
        levelElement.textContent = level;
        overlay.classList.add("hidden");
        gameLoop();
      }

      function endGame() {
        gameActive = false;
        overlay.classList.remove("hidden");
        overlayTitle.textContent = "게임 종료";
        gameOverInfo.classList.remove("hidden");
        startScreenInfo.classList.add("hidden");
        homeBtn.classList.remove("hidden");
        recordsBtn.classList.remove("hidden");
        finalScoreDisplay.textContent = score;
        startBtn.textContent = "다시 시작";

        // 순위 진입 조건 확인 (비어있거나 10등보다 높을 때)
        const isQualify =
          historyRecords.length < 10 ||
          score > historyRecords[historyRecords.length - 1].score;

        if (isQualify) {
          newRecordMsg.classList.remove("hidden");
          if (score > highScore) {
            newRecordMsg.textContent = "🎉 새로운 최고 기록 달성!";
          } else {
            newRecordMsg.textContent = "🎉 순위권 진입! 이름을 등록하세요.";
          }
          nameInputContainer.classList.remove("hidden");
          userNameInput.focus();
        } else {
          newRecordMsg.classList.add("hidden");
          nameInputContainer.classList.add("hidden");
        }
      }

      function showRecords() {
        recordsList.innerHTML = "";
        if (historyRecords.length === 0) {
          recordsList.innerHTML =
            '<p style="text-align:center; opacity:0.5; margin-top: 50px;">아직 기록이 없습니다.</p>';
        } else {
          historyRecords.forEach((rec, idx) => {
            const item = document.createElement("div");
            item.className = "record-item";
            item.innerHTML = `<span>${idx + 1}. ${rec.name}</span><span>${rec.score}점 (${rec.date})</span>`;
            recordsList.appendChild(item);
          });
        }
        recordsModal.classList.remove("hidden");
      }

      startBtn.addEventListener("click", startGame);
      homeBtn.addEventListener("click", showHome);
      recordsBtn.addEventListener("click", showRecords);
      closeRecordsBtn.addEventListener("click", () =>
        recordsModal.classList.add("hidden"),
      );

      window.addEventListener("keydown", (e) => {
        const key = e.key.toLowerCase();
        if (["h", "j", "k", "l", "ㅗ", "ㅓ", "ㅏ", "ㅣ", " "].includes(key)) {
          e.preventDefault();
        }
        if (
          key === " " &&
          !gameActive &&
          recordsModal.classList.contains("hidden")
        ) {
          startGame();
        }
        if (
          e.key === "Enter" &&
          !gameActive &&
          !gameOverInfo.classList.contains("hidden")
        ) {
          startGame();
        }
      });
    </script>
  </body>
</html>
