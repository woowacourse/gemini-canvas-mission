<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>뇌과학 기반 최적화 플래너</title>
    <style>
        /* CSS 변수 및 기본 초기화 */
        :root {
            --primary-color: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F3F4F6;
            --surface-color: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border-color: #E5E7EB;
            --danger-color: #EF4444;
            --success-color: #10B981;
            --cell-disabled: #F3F4F6;
            --cell-default: #E0E7FF;
            --cell-selected: #4F46E5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        #app-container {
            width: 100%;
            max-width: 600px;
            background-color: var(--surface-color);
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            position: relative;
            overflow-x: hidden;
        }

        /* 화면 전환 유틸리티 */
        .screen { display: none; padding: 2rem 1.5rem; animation: fadeIn 0.3s ease-in-out; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 타이포그래피 및 공통 요소 */
        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text-main); }
        h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem; margin-top: 1.5rem; color: var(--text-main); }
        p.subtitle { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem; }

        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-main); }
        .input-row { display: flex; gap: 0.5rem; align-items: center; }
        
        input[type="time"], input[type="text"], input[type="number"] {
            width: 100%; padding: 0.75rem; border: 1px solid var(--border-color);
            border-radius: 0.5rem; font-size: 1rem; outline: none; transition: border-color 0.2s;
        }
        input:focus { border-color: var(--primary-color); }

        .btn {
            width: 100%; padding: 1rem; background-color: var(--primary-color); color: white;
            border: none; border-radius: 0.5rem; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: background-color 0.2s; display: flex; justify-content: center; align-items: center;
        }
        .btn:hover { background-color: var(--primary-hover); }
        .btn-outline { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-main); }
        .btn-outline:hover { background-color: var(--bg-color); }
        .btn-small { padding: 0.5rem 1rem; width: auto; font-size: 0.9rem; }

        /* 할 일 리스트 */
        #todo-list { list-style: none; margin-top: 1rem; margin-bottom: 2rem; }
        .todo-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem; background-color: var(--bg-color); border-radius: 0.5rem; margin-bottom: 0.5rem;
        }
        .todo-info { display: flex; flex-direction: column; }
        .todo-name { font-weight: 600; }
        .todo-duration { font-size: 0.85rem; color: var(--text-muted); }
        .btn-delete { color: var(--danger-color); background: none; border: none; font-size: 1.25rem; cursor: pointer; padding: 0.5rem; }

        /* 타임 그리드 (2번째 화면) */
        .grid-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 1rem; }
        .time-summary { font-size: 0.9rem; color: var(--primary-color); font-weight: 600; }
        .time-grid-container {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; margin-bottom: 2rem;
            user-select: none; /* 드래그 선택 시 텍스트 선택 방지 */
        }
        .time-cell {
            aspect-ratio: 2/1; display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 0.8rem; font-weight: 500; border-radius: 0.25rem; cursor: pointer;
            transition: all 0.1s; background-color: var(--cell-default); color: var(--primary-hover);
        }
        .time-cell.disabled { background-color: var(--cell-disabled); color: #9CA3AF; cursor: not-allowed; }
        .time-cell.selected { background-color: var(--cell-selected); color: white; box-shadow: 0 2px 4px rgba(79, 70, 229, 0.3); }

        /* 로딩 화면 */
        #screen-loading { display: none; flex-direction: column; justify-content: center; align-items: center; height: 100vh; text-align: center; }
        .spinner {
            width: 50px; height: 50px; border: 4px solid var(--border-color); border-top-color: var(--primary-color);
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 1.5rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading-tip { font-size: 0.95rem; color: var(--text-muted); max-width: 80%; line-height: 1.6; min-height: 3rem; }

        /* 결과 화면 */
        .timeline { position: relative; padding-left: 1.5rem; margin-top: 2rem; margin-bottom: 2rem; }
        .timeline::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background-color: var(--border-color);
        }
        .timeline-item { position: relative; margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px dashed var(--border-color); }
        .timeline-item:last-child { border-bottom: none; }
        .timeline-item::before {
            content: ''; position: absolute; left: -1.8rem; top: 0.2rem; width: 12px; height: 12px;
            border-radius: 50%; background-color: var(--primary-color); border: 2px solid white;
        }
        .timeline-time { font-size: 0.85rem; font-weight: 700; color: var(--primary-color); margin-bottom: 0.25rem; }
        .timeline-task { font-size: 1.1rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.5rem; }
        .timeline-reason { font-size: 0.9rem; color: var(--text-muted); background-color: var(--bg-color); padding: 0.75rem; border-radius: 0.5rem; }

        /* 토스트 알림 */
        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
        .toast {
            background-color: var(--text-main); color: white; padding: 1rem 1.5rem; border-radius: 0.5rem;
            font-size: 0.9rem; font-weight: 500; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            opacity: 0; transform: translateY(-20px); transition: all 0.3s ease;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { background-color: var(--danger-color); }
        .toast.success { background-color: var(--success-color); }

        /* 하단 고정 버튼 영역 */
        .bottom-actions { margin-top: 2rem; display: flex; gap: 0.5rem; }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div id="app-container">
        
        <!-- Screen 1: 기본 정보 및 할 일 입력 -->
        <div id="screen-1" class="screen active">
            <h1>완벽한 하루를 위한 준비</h1>
            <p class="subtitle">평소 생활 루틴과 오늘 해야 할 일들을 알려주세요.</p>

            <div class="form-group">
                <label>평소 생활 루틴</label>
                <div class="input-row">
                    <input type="time" id="input-wake" value="07:00" required>
                    <span>기상</span>
                </div>
                <div class="input-row" style="margin-top: 0.5rem;">
                    <input type="time" id="input-sleep" value="23:30" required>
                    <span>취침</span>
                </div>
            </div>

            <h2>오늘의 할 일</h2>
            <div class="form-group">
                <div class="input-row">
                    <input type="text" id="input-task-name" placeholder="할 일 입력 (예: 기획서 작성)" style="flex: 2;">
                    <input type="number" id="input-task-duration" placeholder="소요시간(분)" style="flex: 1;" min="10" step="10">
                    <button class="btn btn-small" id="btn-add-task">추가</button>
                </div>
            </div>

            <ul id="todo-list">
                <!-- 할 일 항목이 여기에 추가됩니다. -->
            </ul>

            <button class="btn" id="btn-to-screen-2">가용 시간 입력하기</button>
        </div>

        <!-- Screen 2: 가용 시간 선택 -->
        <div id="screen-2" class="screen">
            <h1>가용 시간 선택</h1>
            <p class="subtitle">오늘 실제로 업무나 공부에 집중할 수 있는 시간을 선택해 주세요. (드래그하여 여러 칸 선택 가능)</p>

            <div class="grid-header">
                <div></div>
                <div class="time-summary">
                    필요 시간: <span id="summary-needed">0</span>분 / 선택 시간: <span id="summary-selected">0</span>분
                </div>
            </div>

            <div class="time-grid-container" id="time-grid">
                <!-- JavaScript로 48개의 셀이 생성됩니다. -->
            </div>

            <div class="bottom-actions">
                <button class="btn btn-outline" id="btn-back-to-1" style="flex: 1;">이전으로</button>
                <button class="btn" id="btn-create-planner" style="flex: 2;">뇌과학 플래너 만들기</button>
            </div>
        </div>

        <!-- Screen 3: 로딩 화면 -->
        <div id="screen-loading" class="screen" style="display: none;">
            <div class="spinner"></div>
            <h2>최적의 일정을 계산 중입니다</h2>
            <p id="loading-tip">뇌과학에서는 기상 후 2시간이 인지 능력이 가장 높은 시간이라고 합니다.</p>
        </div>

        <!-- Screen 4: 결과 렌더링 화면 -->
        <div id="screen-result" class="screen">
            <h1>오늘의 뇌과학 플래너</h1>
            <p class="subtitle">입력하신 정보를 바탕으로 가장 효율적인 하루 스케줄을 구성했습니다.</p>

            <div class="timeline" id="planner-timeline">
                <!-- 결과가 여기에 렌더링됩니다. -->
            </div>

            <button class="btn" id="btn-reset">새로운 일정 짜기</button>
        </div>

    </div>

    <script>
        /** * 전역 상태 관리 객체 (State Management)
         */
        const appState = {
            wakeTime: "07:00",
            sleepTime: "23:30",
            todos: [], // { id, name, duration }
            availableSlots: new Set() // 0~47 인덱스 저장 (30분 단위)
        };

        let isDragging = false;
        let dragMode = 'select'; // 'select' or 'deselect'

        // 뇌과학 팁 데이터 (로딩 화면용)
        const neuroscienceTips = [
            "기상 후 2~4시간은 전전두피엽이 가장 활성화되어 창의적이고 복잡한 문제 해결에 최적화된 시간입니다.",
            "점심 식사 직후에는 소화를 위해 혈류가 이동하여 인지 기능이 일시적으로 저하됩니다. 단순 반복 업무를 배치하는 것이 좋습니다.",
            "새로운 것을 학습한 후 짧은 휴식을 취하면 뇌의 해마가 정보를 장기 기억으로 전환하는 데 도움을 줍니다.",
            "취침 2시간 전부터는 강한 빛(블루라이트)을 피하고 뇌를 이완시켜야 수면의 질이 높아지고 다음 날의 생산성이 유지됩니다."
        ];

        /**
         * 유틸리티 함수 모음
         */
        const $ = (selector) => document.querySelector(selector);
        
        // 토스트 알림 표시
        function showToast(message, type = 'error') {
            const container = $('#toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            
            // Reflow 강제 실행 후 애니메이션 적용
            toast.offsetHeight;
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // 화면 전환 함수
        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(el => {
                el.classList.remove('active');
                if (el.id === 'screen-loading') el.style.display = 'none';
            });
            const target = $(`#${screenId}`);
            if (target) {
                if (target.id === 'screen-loading') {
                    target.style.display = 'flex';
                } else {
                    target.classList.add('active');
                }
            }
            window.scrollTo(0, 0);
        }

        // 시간 문자열("HH:MM")을 30분 단위 인덱스(0~47)로 변환
        function timeToIndex(timeStr) {
            const [hours, minutes] = timeStr.split(':').map(Number);
            return (hours * 2) + (minutes >= 30 ? 1 : 0);
        }

        // 인덱스를 시간 문자열로 변환
        function indexToTime(index) {
            const hours = Math.floor(index / 2).toString().padStart(2, '0');
            const minutes = (index % 2 === 0) ? '00' : '30';
            return `${hours}:${minutes}`;
        }

        /**
         * 1. 첫 번째 화면 로직 (할 일 관리)
         */
        function renderTodos() {
            const list = $('#todo-list');
            list.innerHTML = '';
            appState.todos.forEach(todo => {
                const li = document.createElement('li');
                li.className = 'todo-item';
                li.innerHTML = `
                    <div class="todo-info">
                        <span class="todo-name">${todo.name}</span>
                        <span class="todo-duration">${todo.duration}분 소요</span>
                    </div>
                    <button class="btn-delete" data-id="${todo.id}">&times;</button>
                `;
                list.appendChild(li);
            });

            // 삭제 이벤트 바인딩
            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(e.target.getAttribute('data-id'));
                    appState.todos = appState.todos.filter(t => t.id !== id);
                    renderTodos();
                });
            });
        }

        $('#btn-add-task').addEventListener('click', () => {
            const nameInput = $('#input-task-name');
            const durationInput = $('#input-task-duration');
            const name = nameInput.value.trim();
            const duration = parseInt(durationInput.value);

            if (!name) return showToast('할 일 이름을 입력해 주세요.');
            if (!duration || duration < 10) return showToast('소요 시간은 최소 10분 이상 입력해 주세요.');

            appState.todos.push({ id: Date.now(), name, duration });
            nameInput.value = '';
            durationInput.value = '';
            renderTodos();
        });

        $('#btn-to-screen-2').addEventListener('click', () => {
            appState.wakeTime = $('#input-wake').value;
            appState.sleepTime = $('#input-sleep').value;

            if (appState.todos.length === 0) {
                return showToast('최소 하나 이상의 할 일을 추가해 주세요.');
            }
            
            initTimeGrid();
            updateTimeSummary();
            switchScreen('screen-2');
        });

        /**
         * 2. 두 번째 화면 로직 (가용 시간 그리드)
         */
        function updateTimeSummary() {
            const totalNeeded = appState.todos.reduce((acc, curr) => acc + curr.duration, 0);
            const totalSelected = appState.availableSlots.size * 30; // 슬롯당 30분
            $('#summary-needed').textContent = totalNeeded;
            $('#summary-selected').textContent = totalSelected;
            
            const summarySelectedEl = $('#summary-selected');
            if (totalSelected < totalNeeded) {
                summarySelectedEl.style.color = 'var(--danger-color)';
            } else {
                summarySelectedEl.style.color = 'var(--success-color)';
            }
        }

        function initTimeGrid() {
            const grid = $('#time-grid');
            grid.innerHTML = '';
            appState.availableSlots.clear();

            const wakeIdx = timeToIndex(appState.wakeTime);
            let sleepIdx = timeToIndex(appState.sleepTime);
            
            // 취침 시간이 자정 이후(예: 01:00)인 경우 처리 (단순화를 위해 당일 기준으로 계산)
            const isCrossMidnight = sleepIdx <= wakeIdx;

            const fragment = document.createDocumentFragment();

            for (let i = 0; i < 48; i++) {
                const cell = document.createElement('div');
                cell.className = 'time-cell';
                
                const startTime = indexToTime(i);
                const endTime = indexToTime(i + 1);
                cell.innerHTML = `<span>${startTime}</span><span style="font-size: 0.75em; opacity: 0.8; margin-top: 2px;">~ ${endTime}</span>`;
                cell.dataset.index = i;

                // 취침/기상 시간에 따른 비활성화 처리 로직
                let isDisabled = false;
                if (isCrossMidnight) {
                    if (i >= sleepIdx && i < wakeIdx) isDisabled = true;
                } else {
                    if (i < wakeIdx || i >= sleepIdx) isDisabled = true;
                }

                if (isDisabled) {
                    cell.classList.add('disabled');
                } else {
                    // 터치 이벤트 (모바일 대응)
                    cell.addEventListener('touchstart', handleDragStart, { passive: false });
                    
                    // 마우스 이벤트 (데스크톱 대응)
                    cell.addEventListener('mousedown', handleDragStart);
                    cell.addEventListener('mouseenter', handleDragEnter);
                }

                fragment.appendChild(cell);
            }
            grid.appendChild(fragment);
            updateTimeSummary();
        }

        // 드래그 선택 로직 구현
        function toggleCell(cell) {
            if (cell.classList.contains('disabled')) return;
            const index = parseInt(cell.dataset.index);

            if (dragMode === 'select') {
                cell.classList.add('selected');
                appState.availableSlots.add(index);
            } else {
                cell.classList.remove('selected');
                appState.availableSlots.delete(index);
            }
            updateTimeSummary();
        }

        function handleDragStart(e) {
            e.preventDefault(); // 모바일 스크롤 방지
            isDragging = true;
            const cell = e.currentTarget || e.target;
            
            // 현재 셀의 상태에 따라 모드 결정 (선택할지, 해제할지)
            dragMode = cell.classList.contains('selected') ? 'deselect' : 'select';
            toggleCell(cell);
        }

        function handleDragEnter(e) {
            if (isDragging) {
                toggleCell(e.currentTarget);
            }
        }

        // 글로벌 드래그 종료 및 모바일 터치 무브 이벤트 처리
        document.addEventListener('mouseup', () => { isDragging = false; });
        
        document.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const touch = e.touches[0];
            const element = document.elementFromPoint(touch.clientX, touch.clientY);
            if (element && element.classList.contains('time-cell') && !element.classList.contains('disabled')) {
                toggleCell(element);
            }
        }, { passive: false });

        document.addEventListener('touchend', () => { isDragging = false; });

        $('#btn-back-to-1').addEventListener('click', () => switchScreen('screen-1'));

        /**
         * 3. API 연동 및 데이터 처리 (Gemini API)
         */
        let tipInterval;
        function startLoadingTips() {
            let tipIndex = 0;
            const tipEl = $('#loading-tip');
            tipInterval = setInterval(() => {
                tipIndex = (tipIndex + 1) % neuroscienceTips.length;
                tipEl.style.opacity = 0;
                setTimeout(() => {
                    tipEl.textContent = neuroscienceTips[tipIndex];
                    tipEl.style.opacity = 1;
                }, 300);
            }, 3500);
        }

        function stopLoadingTips() {
            clearInterval(tipInterval);
        }

        async function generatePlannerWithAI() {
            const apiKey = ""; // 지시사항에 따라 비워둠
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

            // 가용 시간을 보기 좋은 포맷으로 변환 (연속된 시간 묶기 로직 생략하고 단순 문자열 배열 전달)
            const availableArray = Array.from(appState.availableSlots).sort((a, b) => a - b).map(idx => indexToTime(idx));
            
            const promptText = `
                당신은 뇌과학에 해박한 최고의 생산성 컨설턴트입니다. 
                사용자의 정보를 바탕으로 뇌과학 원리에 맞춰 가장 효율적인 일정표를 만들어주세요.

                [사용자 정보]
                - 기상 시간: ${appState.wakeTime}
                - 취침 시간: ${appState.sleepTime}
                - 사용자가 선택한 작업 가능한 30분 단위 슬롯 시작 시간들: ${availableArray.join(', ')}
                - 오늘 해야 할 일 목록: ${JSON.stringify(appState.todos)}

                [뇌과학 기반 스케줄링 규칙]
                1. 기상 후 2시간은 뇌가 맑은 상태이므로 창의적이거나 어려운 작업을 배치하세요.
                2. 식후(보통 13:00~14:00)에는 인지 피로도가 높으므로 단순 반복 작업을 배치하세요.
                3. 한 작업이 끝나면 뇌의 휴식을 고려하여 다음 작업 사이에 짧은 텀을 두는 것도 좋습니다.
                4. 할 일의 이름(taskName)을 분석하여 성격(창의적/단순반복 등)을 유추하여 배치하세요.
                5. 작업 가능한 슬롯(선택된 시간) 안에서만 일정을 배치해야 합니다.
                6. 시간이 절대 겹치지 않게(Non-overlapping) 배치하세요.
                7. 주어진 할 일 목록을 모두 배치해야 합니다.

                출력은 반드시 제공된 JSON 스키마를 엄격하게 따르는 객체 형태여야 합니다. 
                마크다운 블록이나 부가적인 설명 없이 JSON만 반환하세요.
            `;

            const payload = {
                contents: [{ parts: [{ text: promptText }] }],
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            schedule: {
                                type: "ARRAY",
                                items: {
                                    type: "OBJECT",
                                    properties: {
                                        startTime: { type: "STRING", description: "HH:MM 포맷" },
                                        endTime: { type: "STRING", description: "HH:MM 포맷" },
                                        taskName: { type: "STRING" },
                                        neuroscienceReason: { type: "STRING", description: "이 시간에 이 작업을 배치한 뇌과학적 이유를 1문장으로 설명" }
                                    },
                                    required: ["startTime", "endTime", "taskName", "neuroscienceReason"]
                                }
                            }
                        },
                        required: ["schedule"]
                    }
                }
            };

            // 지수 백오프 기반 재시도 로직 구현
            const maxRetries = 5;
            const delays = [1000, 2000, 4000, 8000, 16000];

            for (let i = 0; i <= maxRetries; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) throw new Error(`API 오류: ${response.status}`);
                    
                    const result = await response.json();
                    const textContent = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    
                    if (!textContent) throw new Error("응답 결과 형식이 잘못되었습니다.");
                    
                    return JSON.parse(textContent);

                } catch (error) {
                    if (i === maxRetries) {
                        throw error;
                    }
                    await new Promise(res => setTimeout(res, delays[i]));
                }
            }
        }

        $('#btn-create-planner').addEventListener('click', async () => {
            const totalNeeded = appState.todos.reduce((acc, curr) => acc + curr.duration, 0);
            const totalSelected = appState.availableSlots.size * 30;

            if (totalSelected < totalNeeded) {
                return showToast(`물리적인 시간이 부족합니다. (필요: ${totalNeeded}분 / 선택: ${totalSelected}분) 가용 시간을 더 늘려주세요.`);
            }

            switchScreen('screen-loading');
            startLoadingTips();

            try {
                const resultJSON = await generatePlannerWithAI();
                stopLoadingTips();
                renderResult(resultJSON.schedule);
            } catch (error) {
                console.error(error);
                stopLoadingTips();
                showToast('일정을 생성하는 도중 오류가 발생했습니다. 다시 시도해 주세요.');
                switchScreen('screen-2');
            }
        });

        /**
         * 4. 결과 렌더링 로직
         */
        function renderResult(scheduleItems) {
            const timelineContainer = $('#planner-timeline');
            timelineContainer.innerHTML = '';

            // 시간 순 정렬
            scheduleItems.sort((a, b) => timeToIndex(a.startTime) - timeToIndex(b.startTime));

            const fragment = document.createDocumentFragment();

            scheduleItems.forEach(item => {
                const el = document.createElement('div');
                el.className = 'timeline-item';
                el.innerHTML = `
                    <div class="timeline-time">${item.startTime} - ${item.endTime}</div>
                    <div class="timeline-task">${item.taskName}</div>
                    <div class="timeline-reason">🧠 ${item.neuroscienceReason}</div>
                `;
                fragment.appendChild(el);
            });

            timelineContainer.appendChild(fragment);
            switchScreen('screen-result');
        }

        $('#btn-reset').addEventListener('click', () => {
            // 상태 초기화
            appState.todos = [];
            appState.availableSlots.clear();
            $('#input-task-name').value = '';
            $('#input-task-duration').value = '';
            renderTodos();
            switchScreen('screen-1');
        });

    </script>
</body>
</html>
