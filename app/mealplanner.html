<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>식비 관리 앱 - 스마트 식비 계산기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .day-cell.selected {
            ring: 2px inset #3b82f6;
            background-color: #eff6ff;
        }

        .day-cell.in-range {
            background-color: #eff6ff;
        }
    </style>
</head>

<body class="bg-slate-50 p-4 md:p-8 text-slate-800">

    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- 좌측 사이드바 -->
        <div class="lg:col-span-1 space-y-6">
            <div class="bg-white rounded-2xl shadow-sm p-6 border border-slate-200">
                <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
                    <i data-lucide="calculator" class="text-blue-600"></i> 예산 및 정보 설정
                </h2>
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">연도</label>
                            <select id="yearSelect"
                                class="w-full bg-slate-100 border-none rounded-lg p-2 text-sm outline-none"></select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">월</label>
                            <select id="monthSelect"
                                class="w-full bg-slate-100 border-none rounded-lg p-2 text-sm outline-none"></select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">월 총 예산 (원)</label>
                        <input type="number" id="budgetInput" value="600000"
                            class="w-full bg-slate-100 border-none rounded-lg p-2 text-lg font-bold text-blue-700 outline-none"
                            step="10000">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-2">하루 식사 횟수</label>
                        <div class="flex gap-2" id="mealsPerDayGroup">
                            <button data-value="1"
                                class="meal-btn flex-1 py-2 rounded-lg border text-sm transition-all bg-white text-slate-600 border-slate-200">1끼</button>
                            <button data-value="2"
                                class="meal-btn flex-1 py-2 rounded-lg border text-sm transition-all bg-blue-600 text-white border-blue-600 font-bold shadow-md">2끼</button>
                            <button data-value="3"
                                class="meal-btn flex-1 py-2 rounded-lg border text-sm transition-all bg-white text-slate-600 border-slate-200">3끼</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 분석 카드 -->
            <div id="analysisCard" class="rounded-2xl shadow-sm p-6 border bg-green-50 border-green-200">
                <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
                    <i id="analysisIcon" data-lucide="check-circle-2" class="text-green-600"></i> 월간 분석
                </h3>
                <div class="space-y-2 text-sm">
                    <div class="flex justify-between"><span>하루 평균 가용:</span><span id="dailyBudgetLabel"
                            class="font-bold">0원</span></div>
                    <div class="flex justify-between"><span>끼니당 권장:</span><span id="perMealBudgetLabel"
                            class="font-bold">0원</span></div>
                </div>
            </div>

            <!-- 구간 요약 카드 -->
            <div id="rangeCard"
                class="hidden bg-indigo-600 text-white rounded-2xl shadow-lg p-6 animate-in zoom-in-95 duration-200">
                <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
                    <i data-lucide="shopping-basket"></i> 구간 장보기 가이드
                </h3>
                <p id="rangeDateLabel" class="text-[10px] opacity-70 mb-4 font-medium uppercase tracking-wider"></p>
                <div class="space-y-4">
                    <div
                        class="flex items-center justify-between bg-indigo-700 bg-opacity-40 p-4 rounded-xl border border-indigo-400 border-opacity-30">
                        <div>
                            <p class="text-[10px] opacity-80 font-bold uppercase">준비할 집밥 끼니</p>
                            <p id="rangeHomeMealsCount" class="text-2xl font-black">0끼</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] opacity-80 font-bold uppercase">외식/옵션 제외</p>
                            <p id="rangeOutingCount" class="text-sm font-bold">0끼</p>
                        </div>
                    </div>
                    <div class="pt-2">
                        <p class="text-xs opacity-80 mb-1">장보기 권장 예산</p>
                        <p id="rangeHomeBudget" class="text-3xl font-black">0<span
                                class="text-sm font-normal ml-1">원</span></p>
                        <div class="mt-3 p-3 bg-white bg-opacity-10 rounded-lg">
                            <p id="rangeTip" class="text-[10px] leading-relaxed opacity-90"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 중앙 달력 -->
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-6 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-center gap-4">
                    <div>
                        <h2 id="calendarTitle" class="text-xl font-bold">2024년 1월 식비 달력</h2>
                        <p class="text-xs text-slate-400 mt-1">드래그하여 장보기 필요한 끼니와 예산을 확인하세요.</p>
                    </div>
                    <div id="calendarLegend" class="flex gap-4 text-xs font-medium"></div>
                </div>
                <div
                    class="grid grid-cols-7 border-b border-slate-100 bg-slate-50 text-center text-xs font-bold text-slate-400 py-2">
                    <div>일</div>
                    <div>월</div>
                    <div>화</div>
                    <div>수</div>
                    <div>목</div>
                    <div>금</div>
                    <div>토</div>
                </div>
                <div id="calendarGrid" class="grid grid-cols-7"></div>
            </div>

            <!-- 일일 상세 모달/패널 -->
            <div id="detailPanel" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <div class="flex justify-between items-center mb-6">
                    <h3 id="detailTitle" class="text-lg font-bold">1월 1일 지출 상세</h3>
                    <button id="closeDetailBtn" class="p-2 hover:bg-slate-100 rounded-full transition-colors">
                        <i data-lucide="plus" class="rotate-45 text-slate-400"></i>
                    </button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="space-y-6">
                        <div class="space-y-3">
                            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-widest">빠른 추가</h4>
                            <div class="grid grid-cols-2 gap-2">
                                <button id="btnCafeteria"
                                    class="flex items-center gap-2 p-3 bg-emerald-50 text-emerald-700 border border-emerald-100 rounded-xl hover:bg-emerald-100 transition-colors">
                                    <i data-lucide="building-2"></i>
                                    <div class="text-left">
                                        <p class="text-[10px] font-bold opacity-80 uppercase">구내식당</p>
                                        <p class="text-sm font-black">7,500원</p>
                                    </div>
                                </button>
                                <button id="btnBuffet"
                                    class="flex items-center gap-2 p-3 bg-orange-50 text-orange-700 border border-orange-100 rounded-xl hover:bg-orange-100 transition-colors">
                                    <i data-lucide="store"></i>
                                    <div class="text-left">
                                        <p class="text-[10px] font-bold opacity-80 uppercase">한식뷔페</p>
                                        <p class="text-sm font-black">8,000원</p>
                                    </div>
                                </button>
                            </div>
                        </div>
                        <div class="space-y-3">
                            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-widest">지출 직접 입력</h4>
                            <div
                                class="p-3 bg-slate-50 rounded-xl border border-slate-100 mb-2 flex items-center gap-2">
                                <i data-lucide="circle-dollar-sign" class="text-slate-400"></i>
                                <input type="number" id="tempCostInput" value="18000"
                                    class="flex-1 bg-transparent font-bold text-slate-700 outline-none text-lg"
                                    step="1000">
                                <span class="text-sm font-medium text-slate-400">원</span>
                            </div>
                            <div id="mealActionButtons" class="flex flex-wrap gap-2"></div>
                        </div>
                        <div id="registeredListSection" class="space-y-2 hidden">
                            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-widest">등록된 항목 관리</h4>
                            <div id="registeredList" class="max-h-32 overflow-y-auto space-y-2 pr-1 custom-scrollbar">
                            </div>
                        </div>
                    </div>
                    <div class="p-5 bg-slate-50 rounded-2xl border border-slate-100 flex flex-col justify-center">
                        <h4 class="text-sm font-semibold text-slate-700 mb-4 flex items-center gap-2">
                            <i data-lucide="trending-down"></i> 오늘의 권장 지출액
                        </h4>
                        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 mb-4">
                            <p class="text-xs text-slate-500 mb-1">오늘 사용 가능한 총액</p>
                            <p id="todayTotalAvailable" class="text-3xl font-black text-blue-600">0원</p>
                        </div>
                        <div id="todayMealList" class="text-[11px] text-slate-500 leading-relaxed space-y-1"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 상태 관리 ---
        const state = {
            year: new Date().getFullYear(),
            month: new Date().getMonth(),
            budget: 600000,
            mealsPerDay: 2,
            outings: [],
            selectedDay: null,
            dragStart: null,
            dragEnd: null,
            isDragging: false,
            tempCost: 18000
        };

        const CONSTANTS = {
            STANDARD_HOME_MEAL: 9000,
            CAFETERIA_PRICE: 7500,
            KOREAN_BUFFET_PRICE: 8000
        };

        // --- 초기화 및 엘리먼트 참조 ---
        const els = {
            yearSelect: document.getElementById('yearSelect'),
            monthSelect: document.getElementById('monthSelect'),
            budgetInput: document.getElementById('budgetInput'),
            mealsBtnGroup: document.getElementById('mealsPerDayGroup'),
            calendarGrid: document.getElementById('calendarGrid'),
            calendarTitle: document.getElementById('calendarTitle'),
            calendarLegend: document.getElementById('calendarLegend'),
            dailyBudgetLabel: document.getElementById('dailyBudgetLabel'),
            perMealBudgetLabel: document.getElementById('perMealBudgetLabel'),
            analysisCard: document.getElementById('analysisCard'),
            analysisIcon: document.getElementById('analysisIcon'),
            rangeCard: document.getElementById('rangeCard'),
            rangeDateLabel: document.getElementById('rangeDateLabel'),
            rangeHomeMealsCount: document.getElementById('rangeHomeMealsCount'),
            rangeOutingCount: document.getElementById('rangeOutingCount'),
            rangeHomeBudget: document.getElementById('rangeHomeBudget'),
            rangeTip: document.getElementById('rangeTip'),
            detailPanel: document.getElementById('detailPanel'),
            detailTitle: document.getElementById('detailTitle'),
            mealActionButtons: document.getElementById('mealActionButtons'),
            registeredList: document.getElementById('registeredList'),
            registeredListSection: document.getElementById('registeredListSection'),
            tempCostInput: document.getElementById('tempCostInput'),
            todayTotalAvailable: document.getElementById('todayTotalAvailable'),
            todayMealList: document.getElementById('todayMealList')
        };

        function init() {
            // 셀렉트 박스 채우기
            for (let y = 2024; y <= 2026; y++) {
                const opt = document.createElement('option');
                opt.value = y; opt.textContent = y + '년';
                els.yearSelect.appendChild(opt);
            }
            els.yearSelect.value = state.year;

            for (let m = 0; m < 12; m++) {
                const opt = document.createElement('option');
                opt.value = m; opt.textContent = (m + 1) + '월';
                els.monthSelect.appendChild(opt);
            }
            els.monthSelect.value = state.month;

            // 이벤트 리스너
            els.yearSelect.onchange = e => { state.year = parseInt(e.target.value); resetRange(); render(); };
            els.monthSelect.onchange = e => { state.month = parseInt(e.target.value); resetRange(); render(); };
            els.budgetInput.oninput = e => { state.budget = parseInt(e.target.value) || 0; render(); };
            els.tempCostInput.oninput = e => { state.tempCost = parseInt(e.target.value) || 0; };

            els.mealsBtnGroup.onclick = e => {
                const btn = e.target.closest('.meal-btn');
                if (!btn) return;
                state.mealsPerDay = parseInt(btn.dataset.value);
                Array.from(els.mealsBtnGroup.children).forEach(b => {
                    b.className = "meal-btn flex-1 py-2 rounded-lg border text-sm transition-all bg-white text-slate-600 border-slate-200";
                });
                btn.className = "meal-btn flex-1 py-2 rounded-lg border text-sm transition-all bg-blue-600 text-white border-blue-600 font-bold shadow-md";
                resetRange();
                render();
            };

            document.getElementById('closeDetailBtn').onclick = () => {
                state.selectedDay = null;
                resetRange();
                render();
            };

            document.getElementById('btnCafeteria').onclick = () => addOuting(state.selectedDay, state.mealsPerDay === 1 ? 'meal' : 'lunch', CONSTANTS.CAFETERIA_PRICE, '구내식당');
            document.getElementById('btnBuffet').onclick = () => addOuting(state.selectedDay, state.mealsPerDay === 1 ? 'meal' : 'lunch', CONSTANTS.KOREAN_BUFFET_PRICE, '한식뷔페');

            window.onmouseup = () => { state.isDragging = false; };

            render();
        }

        function resetRange() {
            state.dragStart = null;
            state.dragEnd = null;
        }

        // --- 로직 함수 ---
        function getDaysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }

        function calculateStats() {
            const totalDays = getDaysInMonth(state.year, state.month);
            const totalOutingCost = state.outings.reduce((acc, o) => acc + o.cost, 0);
            const remainingBudget = state.budget - totalOutingCost;
            const totalPlannedMeals = totalDays * state.mealsPerDay;
            const remainingMealsCount = totalPlannedMeals - state.outings.length;

            const perMealBudget = remainingMealsCount > 0 ? Math.floor(remainingBudget / remainingMealsCount) : 0;
            const isTight = perMealBudget < CONSTANTS.STANDARD_HOME_MEAL;

            return {
                dailyNormal: Math.floor(remainingBudget / totalDays),
                perMeal: Math.max(0, perMealBudget),
                isTight
            };
        }

        function addOuting(day, type, cost = null, label = null) {
            if (!day) return;
            const mealLabel = label || (type === 'breakfast' ? '아침' : type === 'lunch' ? '점심' : type === 'dinner' ? '저녁' : '식사');
            state.outings.push({
                id: Math.random().toString(36).substr(2, 9),
                day, type, label: mealLabel, cost: cost !== null ? cost : state.tempCost
            });
            render();
        }

        // --- 렌더링 함수 ---
        function render() {
            const stats = calculateStats();

            // 헤더 및 메타데이터
            els.calendarTitle.textContent = `${state.year}년 ${state.month + 1}월 식비 달력`;
            els.dailyBudgetLabel.textContent = stats.dailyNormal.toLocaleString() + '원';
            els.perMealBudgetLabel.textContent = stats.perMeal.toLocaleString() + '원';

            els.analysisCard.className = `rounded-2xl shadow-sm p-6 border ${stats.isTight ? 'bg-orange-50 border-orange-200' : 'bg-green-50 border-green-200'}`;
            els.analysisIcon.setAttribute('data-lucide', stats.isTight ? 'alert-circle' : 'check-circle-2');
            els.analysisIcon.className = stats.isTight ? 'text-orange-600' : 'text-green-600';

            // 레전드 업데이트
            els.calendarLegend.innerHTML = '';
            if (state.mealsPerDay === 1) {
                els.calendarLegend.innerHTML = `<div class="flex items-center gap-1.5"><div class="w-3 h-3 bg-slate-500 rounded-sm"></div> 식사</div>`;
            } else {
                if (state.mealsPerDay === 3) els.calendarLegend.innerHTML += `<div class="flex items-center gap-1.5"><div class="w-3 h-3 bg-amber-400 rounded-sm"></div> 아침</div>`;
                els.calendarLegend.innerHTML += `<div class="flex items-center gap-1.5"><div class="w-3 h-3 bg-blue-500 rounded-sm"></div> 점심</div>`;
                els.calendarLegend.innerHTML += `<div class="flex items-center gap-1.5"><div class="w-3 h-3 bg-purple-500 rounded-sm"></div> 저녁</div>`;
            }

            renderCalendar(stats);
            renderRangeSummary(stats);
            renderDetailPanel(stats);

            lucide.createIcons();
        }

        function renderCalendar(stats) {
            els.calendarGrid.innerHTML = '';
            const firstDay = new Date(state.year, state.month, 1).getDay();
            const totalDays = getDaysInMonth(state.year, state.month);

            for (let i = 0; i < firstDay; i++) {
                const empty = document.createElement('div');
                empty.className = "h-20 sm:h-28 border-b border-r border-slate-50";
                els.calendarGrid.appendChild(empty);
            }

            const rangeStart = Math.min(state.dragStart, state.dragEnd);
            const rangeEnd = Math.max(state.dragStart, state.dragEnd);

            for (let day = 1; day <= totalDays; day++) {
                const cell = document.createElement('div');
                const isInRange = state.dragStart && day >= rangeStart && day <= rangeEnd;
                const isSelected = state.selectedDay === day;

                cell.className = `h-20 sm:h-28 p-1 sm:p-2 border-b border-r border-slate-100 cursor-pointer transition-all relative day-cell ${isInRange ? 'in-range' : ''} ${isSelected ? 'selected' : ''}`;

                cell.onmousedown = () => {
                    state.isDragging = true;
                    state.dragStart = day;
                    state.dragEnd = day;
                    state.selectedDay = day;
                    render();
                };
                cell.onmouseenter = () => {
                    if (state.isDragging) {
                        state.dragEnd = day;
                        render();
                    }
                };

                cell.innerHTML = `<span class="text-xs sm:text-sm font-semibold ${isInRange ? 'text-blue-600' : 'text-slate-500'}">${day}</span>`;

                const mealContainer = document.createElement('div');
                mealContainer.className = "mt-1 space-y-1 overflow-hidden";

                state.outings.filter(o => o.day === day).forEach(o => {
                    const badge = document.createElement('div');
                    let colorClass = 'bg-slate-500 border-slate-600';
                    if (o.type === 'breakfast') colorClass = 'bg-amber-400 border-amber-500';
                    if (o.type === 'lunch') colorClass = 'bg-blue-500 border-blue-600';
                    if (o.type === 'dinner') colorClass = 'bg-purple-500 border-purple-600';

                    badge.className = `text-[8px] sm:text-[9px] p-0.5 sm:p-1 rounded shadow-sm border flex flex-col text-white ${colorClass}`;
                    badge.innerHTML = `
                        <div class="flex justify-between items-center">
                            <span class="font-bold truncate max-w-[80%]">${o.label}</span>
                            <i data-lucide="trash-2" class="w-2 h-2 hover:text-red-200" onclick="event.stopPropagation(); deleteOuting('${o.id}')"></i>
                        </div>
                        <span class="opacity-90">${(o.cost / 1000).toFixed(1)}k</span>
                    `;
                    mealContainer.appendChild(badge);
                });

                cell.appendChild(mealContainer);
                els.calendarGrid.appendChild(cell);
            }
        }

        window.deleteOuting = (id) => {
            state.outings = state.outings.filter(o => o.id !== id);
            render();
        };

        function renderRangeSummary(stats) {
            if (!state.dragStart || state.dragStart === state.dragEnd) {
                els.rangeCard.classList.add('hidden');
                return;
            }
            els.rangeCard.classList.remove('hidden');

            const start = Math.min(state.dragStart, state.dragEnd);
            const end = Math.max(state.dragStart, state.dragEnd);
            const length = end - start + 1;
            const rangeOutings = state.outings.filter(o => o.day >= start && o.day <= end);
            const homeMealsCount = Math.max(0, (length * state.mealsPerDay) - rangeOutings.length);
            const homeBudget = homeMealsCount * stats.perMeal;
            const outingCost = rangeOutings.reduce((acc, o) => acc + o.cost, 0);

            els.rangeDateLabel.textContent = `${start}일 ~ ${end}일 (${length}일간)`;
            els.rangeHomeMealsCount.textContent = homeMealsCount + '끼';
            els.rangeOutingCount.textContent = rangeOutings.length + '끼';
            els.rangeHomeBudget.innerHTML = homeBudget.toLocaleString() + '<span class="text-sm font-normal ml-1">원</span>';
            els.rangeTip.innerHTML = `💡 해당 기간 외식비로 이미 <b>${outingCost.toLocaleString()}원</b>이 계획되어 있습니다. 남은 끼니는 위 예산 내에서 장을 보세요!`;
        }

        function renderDetailPanel(stats) {
            if (!state.selectedDay) {
                els.detailPanel.classList.add('hidden');
                return;
            }
            els.detailPanel.classList.remove('hidden');
            els.detailTitle.textContent = `${state.month + 1}월 ${state.selectedDay}일 지출 상세`;

            // 액션 버튼 생성
            els.mealActionButtons.innerHTML = '';
            if (state.mealsPerDay === 1) {
                createMealBtn('meal', '식사 추가', 'slate', 'utensils');
            } else {
                if (state.mealsPerDay === 3) createMealBtn('breakfast', '아침', 'amber', 'sunrise');
                createMealBtn('lunch', '점심', 'blue', 'coffee');
                createMealBtn('dinner', '저녁', 'purple', 'utensils');
            }

            // 등록 리스트
            const dayOutings = state.outings.filter(o => o.day === state.selectedDay);
            if (dayOutings.length > 0) {
                els.registeredListSection.classList.remove('hidden');
                els.registeredList.innerHTML = '';
                dayOutings.forEach(o => {
                    const item = document.createElement('div');
                    item.className = "flex items-center gap-2 bg-white border border-slate-100 p-2 rounded-lg shadow-sm";
                    let colorClass = 'bg-slate-500';
                    if (o.type === 'breakfast') colorClass = 'bg-amber-400';
                    if (o.type === 'lunch') colorClass = 'bg-blue-500';
                    if (o.type === 'dinner') colorClass = 'bg-purple-500';

                    item.innerHTML = `
                        <span class="text-[9px] px-1.5 py-0.5 rounded text-white font-bold whitespace-nowrap ${colorClass}">${o.label}</span>
                        <input type="number" value="${o.cost}" oninput="updateCost('${o.id}', this.value)" class="flex-1 text-right text-sm font-bold text-slate-600 outline-none" />
                        <span class="text-[10px] text-slate-400">원</span>
                    `;
                    els.registeredList.appendChild(item);
                });
            } else {
                els.registeredListSection.classList.add('hidden');
            }

            // 권장 금액 섹션
            const outingSum = dayOutings.reduce((acc, o) => acc + o.cost, 0);
            const remainingMeals = Math.max(0, state.mealsPerDay - dayOutings.length);
            const totalAvailable = outingSum + (remainingMeals * stats.perMeal);

            els.todayTotalAvailable.textContent = totalAvailable.toLocaleString() + '원';

            els.todayMealList.innerHTML = `<p class="font-bold text-slate-600">식사 구성:</p><ul class="list-disc list-inside"></ul>`;
            const ul = els.todayMealList.querySelector('ul');
            dayOutings.forEach(o => {
                const li = document.createElement('li');
                li.textContent = `${o.label}: ${o.cost.toLocaleString()}원`;
                ul.appendChild(li);
            });
            if (remainingMeals > 0) {
                const li = document.createElement('li');
                li.textContent = `남은 ${remainingMeals}끼: ${(remainingMeals * stats.perMeal).toLocaleString()}원`;
                ul.appendChild(li);
            }
        }

        function createMealBtn(type, label, color, icon) {
            const btn = document.createElement('button');
            btn.className = `flex-1 flex flex-col items-center justify-center py-3 bg-${color}-50 text-${color}-700 rounded-xl border border-${color}-100 group transition-all active:scale-95 min-w-[70px]`;
            btn.innerHTML = `<i data-lucide="${icon}" class="mb-1 group-hover:scale-110 transition-transform"></i><span class="text-xs font-bold">${label}</span>`;
            btn.onclick = () => addOuting(state.selectedDay, type);
            els.mealActionButtons.appendChild(btn);
        }

        window.updateCost = (id, val) => {
            const outing = state.outings.find(o => o.id === id);
            if (outing) outing.cost = parseInt(val) || 0;
            render();
        };

        window.onload = init;
    </script>
</body>

</html>
