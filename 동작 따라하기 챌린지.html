<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동작 따라하기 챌린지 - Gemini AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        body { font-family: 'Jua', sans-serif; }
        .captured-image { transform: scaleX(-1); }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            opacity: 0.7;
            pointer-events: none;
        }
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #4f46e5;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 min-h-screen flex items-center justify-center p-4 overflow-x-hidden">

    <div id="game-container" class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl overflow-hidden relative transition-all duration-500 min-h-[600px] flex flex-col">
        
        <!-- Screen: Setup -->
        <div id="setup-screen" class="p-8 flex flex-col h-full active-screen">
            <h1 class="text-4xl text-center text-indigo-600 mb-8">🕺 동작 따라하기 챌린지</h1>
            <p class="text-center text-gray-500 mb-6">문제 출제부터 심사까지 AI가 담당합니다!</p>
            
            <div class="space-y-6 mb-8">
                <!-- 인원 설정 -->
                <div>
                    <label class="block text-gray-700 font-bold mb-2">플레이어 인원</label>
                    <select id="player-count" class="w-full p-3 border-2 border-indigo-100 rounded-xl outline-none focus:border-indigo-500">
                        <option value="1">1명</option>
                        <option value="2">2명</option>
                        <option value="3">3명</option>
                    </select>
                </div>

                <!-- 시간 설정 -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-gray-700 font-bold">동작 표현 시간 (초)</label>
                        <span id="time-value" class="text-indigo-600 font-bold text-xl">10초</span>
                    </div>
                    <input type="range" id="game-time" min="5" max="30" value="10" step="1" 
                        class="w-full h-2 bg-indigo-100 rounded-lg appearance-none cursor-pointer accent-indigo-600">
                    <div class="flex justify-between text-xs text-gray-400 mt-1">
                        <span>5초</span>
                        <span>30초</span>
                    </div>
                </div>

                <!-- 이름 입력 -->
                <div id="player-inputs" class="space-y-4"></div>
            </div>

            <button id="start-btn" class="mt-auto bg-indigo-600 hover:bg-indigo-700 text-white text-2xl py-4 rounded-2xl shadow-lg transform transition active:scale-95">
                게임 시작!
            </button>
        </div>

        <!-- Screen: AI Generating Pose -->
        <div id="pose-gen-screen" class="hidden p-8 flex flex-col items-center justify-center h-full text-center">
            <div class="loader mb-6"></div>
            <h2 class="text-2xl font-bold text-indigo-600 mb-2">AI가 새로운 동작을 생각 중...</h2>
            <p id="gen-player-name" class="text-gray-500">플레이어님을 위한 특별한 미션!</p>
        </div>

        <!-- Screen: Play -->
        <div id="play-screen" class="hidden p-6 flex flex-col h-full text-center">
            <div class="flex justify-between items-center mb-4">
                <div id="current-player-display" class="bg-indigo-100 px-4 py-2 rounded-full text-indigo-700 text-lg font-bold"></div>
                <div id="timer-display" class="text-3xl font-bold text-pink-600 bg-pink-100 w-16 h-16 flex items-center justify-center rounded-full border-4 border-pink-200">10</div>
            </div>
            <div id="pose-instruction" class="mb-6">
                <h2 id="target-pose-name" class="text-4xl text-indigo-800 font-bold mb-2 animate-bounce">동작 생성 중</h2>
                <p id="target-pose-hint" class="text-gray-600 text-lg">잠시만 기다려주세요...</p>
            </div>
            <div class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden shadow-inner mb-6">
                <video id="webcam" autoplay playsinline class="w-full h-full object-cover scale-x-[-1]"></video>
                <div id="capture-flash" class="absolute inset-0 bg-white opacity-0 pointer-events-none transition-opacity duration-100"></div>
            </div>
        </div>

        <!-- Screen: AI Analysis Loading -->
        <div id="loading-screen" class="hidden p-8 flex flex-col items-center justify-center h-full text-center">
            <div class="loader mb-6"></div>
            <h2 class="text-2xl font-bold text-indigo-600 mb-2">Gemini AI가 심사 중...</h2>
            <p class="text-gray-500">포즈의 정확도를 분석하고 있습니다.</p>
        </div>

        <!-- Screen: Turn Result -->
        <div id="turn-result-screen" class="hidden p-8 flex flex-col h-full text-center">
            <h2 class="text-3xl font-bold text-indigo-600 mb-6">판정 결과</h2>
            <div class="flex flex-col md:flex-row gap-4 mb-6">
                <div class="flex-1">
                    <canvas id="captured-canvas" class="w-full rounded-xl border-4 border-indigo-100 captured-image"></canvas>
                </div>
                <div class="flex-1 flex flex-col justify-center items-center bg-indigo-50 rounded-xl p-4">
                    <p class="text-sm text-gray-500 mb-1">AI 유사도 점수</p>
                    <div id="score-circle" class="text-6xl font-black text-indigo-600 mb-2">0</div>
                    <div id="ai-comment" class="text-lg text-indigo-800 font-medium italic">"훌륭한 포즈군요!"</div>
                </div>
            </div>
            <button id="next-turn-btn" class="mt-auto bg-indigo-600 hover:bg-indigo-700 text-white text-xl py-4 rounded-2xl shadow-lg">
                다음 단계로
            </button>
        </div>

        <!-- Screen: Final Winner -->
        <div id="final-screen" class="hidden p-8 flex flex-col h-full text-center overflow-hidden">
            <h1 class="text-4xl font-bold text-indigo-600 mb-8">🏆 최종 결과</h1>
            <div id="leaderboard" class="space-y-4 mb-8"></div>
            <div class="bg-yellow-100 p-6 rounded-3xl border-4 border-yellow-400 mb-8">
                <p class="text-xl text-yellow-700">최종 우승자</p>
                <h2 id="winner-name" class="text-4xl font-black text-yellow-800">플레이어</h2>
            </div>
            <button onclick="location.reload()" class="bg-gray-800 hover:bg-black text-white text-xl py-4 rounded-2xl">다시 하기</button>
        </div>
    </div>

    <script>
        const apiKey = ""; // Runtime provides API Key
        let players = [];
        let currentPlayerIndex = 0;
        let setTime = 10;
        let timer = 10;
        let stream = null;

        const setupScreen = document.getElementById('setup-screen');
        const playScreen = document.getElementById('play-screen');
        const poseGenScreen = document.getElementById('pose-gen-screen');
        const loadingScreen = document.getElementById('loading-screen');
        const turnResultScreen = document.getElementById('turn-result-screen');
        const finalScreen = document.getElementById('final-screen');
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('captured-canvas');
        
        // 시간 설정 업데이트 UI
        const timeInput = document.getElementById('game-time');
        const timeValueDisplay = document.getElementById('time-value');
        timeInput.addEventListener('input', (e) => {
            setTime = parseInt(e.target.value);
            timeValueDisplay.innerText = `${setTime}초`;
        });

        function updatePlayerInputs() {
            const count = parseInt(document.getElementById('player-count').value);
            const container = document.getElementById('player-inputs');
            container.innerHTML = '';
            for (let i = 1; i <= count; i++) {
                container.innerHTML += `<input type="text" placeholder="플레이어 ${i} 이름" class="player-name-input w-full p-3 border-2 border-gray-100 rounded-xl focus:border-indigo-400 outline-none" value="플레이어 ${i}">`;
            }
        }
        document.getElementById('player-count').addEventListener('change', updatePlayerInputs);
        updatePlayerInputs();

        document.getElementById('start-btn').addEventListener('click', async () => {
            players = Array.from(document.querySelectorAll('.player-name-input')).map(input => ({ name: input.value, score: 0 }));
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                prepareTurn();
            } catch (err) { alert("카메라 접근 권한이 필요합니다."); }
        });

        function showScreen(id) {
            [setupScreen, playScreen, poseGenScreen, loadingScreen, turnResultScreen, finalScreen].forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        async function prepareTurn() {
            const player = players[currentPlayerIndex];
            document.getElementById('gen-player-name').innerText = `${player.name}님을 위한 특별한 미션!`;
            showScreen('pose-gen-screen');

            const newPose = await generatePoseFromAI();
            
            document.getElementById('current-player-display').innerText = `${player.name}님의 차례`;
            document.getElementById('target-pose-name').innerText = newPose.pose;
            document.getElementById('target-pose-hint').innerText = newPose.hint;
            
            showScreen('play-screen');
            startCountdown(newPose.pose);
        }

        async function generatePoseFromAI(retries = 0) {
            const systemPrompt = "당신은 동작 따라하기 게임의 미션 출제자입니다. 사람이 카메라 앞에서 따라 할 수 있는 창의적인 동작을 제안하세요. 결과는 반드시 JSON 형식으로만 반환하세요. 예: {\"pose\": \"동작명\", \"hint\": \"설명\"}";
            const userPrompt = "재미있고 독특한 포즈 미션을 하나 생성해줘.";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userPrompt }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });
                const data = await response.json();
                return JSON.parse(data.candidates[0].content.parts[0].text);
            } catch (error) {
                if (retries < 3) return generatePoseFromAI(retries + 1);
                return { pose: "만세!", hint: "두 팔을 하늘 높이 쭉 뻗으세요!" };
            }
        }

        function startCountdown(poseName) {
            timer = setTime; // 설정된 시간 적용
            document.getElementById('timer-display').innerText = timer;
            const interval = setInterval(() => {
                timer--;
                document.getElementById('timer-display').innerText = timer;
                if (timer <= 0) {
                    clearInterval(interval);
                    captureAndAnalyze(poseName);
                }
            }, 1000);
        }

        async function captureAndAnalyze(poseName) {
            document.getElementById('capture-flash').style.opacity = '1';
            setTimeout(() => document.getElementById('capture-flash').style.opacity = '0', 100);

            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            const base64Image = canvas.toDataURL('image/png').split(',')[1];

            showScreen('loading-screen');

            const result = await callGeminiAI(poseName, base64Image);
            players[currentPlayerIndex].score += result.score;
            
            document.getElementById('score-circle').innerText = result.score;
            document.getElementById('ai-comment').innerText = `"${result.comment}"`;
            showScreen('turn-result-screen');
        }

        async function callGeminiAI(poseName, base64Data, retries = 0) {
            const systemPrompt = "당신은 동작 따라하기 챌린지의 심사위원 AI입니다. 사진을 보고 제시된 동작과 얼마나 일치하는지 판정하세요. 결과는 JSON으로 반환하세요. 예: {\"score\": 85, \"comment\": \"평가\"}";
            const userPrompt = `미션: "${poseName}". 사진 속 인물을 0~100점 점수와 위트 있는 한국어 심사평으로 평가해주세요.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: userPrompt },
                                { inlineData: { mimeType: "image/png", data: base64Data } }
                            ]
                        }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });
                const data = await response.json();
                return JSON.parse(data.candidates[0].content.parts[0].text);
            } catch (error) {
                if (retries < 3) return callGeminiAI(poseName, base64Data, retries + 1);
                return { score: 50, comment: "심사 도중 통신이 지연되었습니다!" };
            }
        }

        document.getElementById('next-turn-btn').addEventListener('click', () => {
            currentPlayerIndex++;
            if (currentPlayerIndex < players.length) {
                prepareTurn();
            } else {
                finishGame();
            }
        });

        function finishGame() {
            showScreen('final-screen');
            const sorted = [...players].sort((a, b) => b.score - a.score);
            const container = document.getElementById('leaderboard');
            container.innerHTML = '';
            sorted.forEach((p, i) => {
                container.innerHTML += `<div class="flex justify-between p-4 bg-indigo-50 rounded-xl font-bold"><span>${i+1}. ${p.name}</span><span>${p.score}점</span></div>`;
            });
            document.getElementById('winner-name').innerText = sorted[0].name;
            createConfetti();
            if (stream) stream.getTracks().forEach(t => t.stop());
        }

        function createConfetti() {
            for (let i = 0; i < 80; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
                document.body.appendChild(c);
                c.animate([{ transform: 'translateY(0) rotate(0)', opacity: 1 }, { transform: `translateY(100vh) rotate(${Math.random() * 360}deg)`, opacity: 0 }], { duration: 2000 + Math.random() * 2000, easing: 'ease-out' }).onfinish = () => c.remove();
            }
        }
    </script>
</body>
</html>
