<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>너의 MBTI가 보여</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .mbti-grid-btn { transition: all 0.2s; background: #1e293b; border: 1px solid #334155; }
        .mbti-grid-btn:hover { transform: translateY(-3px); background: #4f46e5; border-color: #818cf8; }
        .clue-card {
            background: #1e293b;
            border-left: 4px solid #6366f1;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .hidden { display: none; }
        .loader {
            border: 4px solid #334155;
            border-top: 4px solid #6366f1;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #guess-grid::-webkit-scrollbar { width: 6px; }
        #guess-grid::-webkit-scrollbar-track { background: #1e293b; }
        #guess-grid::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }

        input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div id="app" class="max-w-md w-full bg-slate-900 rounded-3xl shadow-2xl overflow-hidden border border-slate-800">

    <!-- Header -->
    <div class="bg-indigo-600 p-6 text-white text-center relative overflow-hidden">
        <h1 class="text-2xl font-extrabold flex items-center justify-center gap-2 italic tracking-tighter">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            너의 MBTI가 보여
        </h1>
        <p class="text-indigo-100 text-xs mt-1 opacity-80">사소한 습관으로 꿰뚫어 보는 성향 추리 게임</p>
    </div>

    <div class="p-6">
        <!-- Step 0: Name Input Screen -->
        <div id="step-names" class="space-y-6 animate__animated animate__fadeIn">
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 text-center">
                <h2 class="text-lg font-bold mb-4">플레이어 이름 설정</h2>
                <div class="space-y-4">
                    <div class="text-left">
                        <label class="text-xs text-slate-400 font-bold ml-1 mb-1 block">주인공 (A)</label>
                        <input type="text" id="input-name-a" placeholder="이름을 입력하세요" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-slate-100 placeholder:text-slate-600 transition-all">
                    </div>
                    <div class="text-left">
                        <label class="text-xs text-slate-400 font-bold ml-1 mb-1 block">추리자 (B)</label>
                        <input type="text" id="input-name-b" placeholder="이름을 입력하세요" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-slate-100 placeholder:text-slate-600 transition-all">
                    </div>
                </div>
            </div>
            <button onclick="saveNamesAndGoStart()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg transition-transform active:scale-95">
                입력 완료
            </button>
        </div>

        <!-- Step 1: Start Screen -->
        <div id="step-start" class="hidden space-y-6 text-center animate__animated animate__fadeIn">
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 text-slate-300 text-sm">
                <p class="mb-4 leading-relaxed"><span id="display-name-a" class="text-indigo-400 font-bold"></span>님의 성향을 <span id="display-name-b" class="text-indigo-400 font-bold"></span>님이 맞힐 수 있을까요?<br>AI가 분석한 아주 은밀한 힌트들이 제공됩니다.</p>
            </div>
            <button onclick="goToSelect()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg transition-transform active:scale-95">
                게임 시작하기
            </button>
        </div>

        <!-- Step 2: Selection Screen -->
        <div id="step-select" class="hidden animate__animated animate__fadeInUp">
            <div class="mb-6 text-center">
                <span class="bg-amber-900/30 text-amber-400 px-3 py-1 rounded-full text-xs font-bold border border-amber-900/50">Step 1. <span id="label-name-a"></span></span>
                <h2 class="text-xl font-bold mt-2 text-slate-100">본인의 MBTI 선택</h2>
                <p class="text-slate-500 text-xs mt-1">(상대방에게 정답을 들키지 마세요!)</p>
            </div>
            <div id="mbti-grid" class="grid grid-cols-4 gap-2"></div>
        </div>

        <!-- Step 3: Loading Screen -->
        <div id="step-loading" class="hidden py-12 text-center space-y-4 animate__animated animate__fadeIn">
            <div class="flex justify-center"><div class="loader"></div></div>
            <p id="loading-text" class="text-slate-400 font-medium animate-pulse">분석 중...</p>
        </div>

        <!-- Step 4: Game Screen -->
        <div id="step-game" class="hidden space-y-6 animate__animated animate__fadeIn">
            <div class="text-center">
                <span class="bg-emerald-900/30 text-emerald-400 px-3 py-1 rounded-full text-xs font-bold border border-emerald-900/50">Step 2. <span id="label-name-b"></span></span>
                <h2 class="text-xl font-bold mt-2 text-slate-100"><span id="target-name-a"></span>님, 당신은 누구십니까?</h2>
            </div>
            <div id="clues-container" class="space-y-3"></div>
            <div id="game-controls">
                <button id="next-clue-btn" onclick="showNextClue()" class="w-full flex items-center justify-center gap-2 bg-slate-700 hover:bg-slate-600 text-white py-4 rounded-xl font-bold transition-all shadow-md">
                    다음 고난도 힌트 (<span id="clue-count">1</span>/5)
                </button>
                <div id="final-guess-section" class="hidden pt-6 border-t border-slate-800">
                    <p class="text-center text-xs font-bold text-slate-500 mb-4 uppercase tracking-widest">추리 완료: 정답은 무엇일까요?</p>
                    <div id="guess-grid" class="grid grid-cols-4 gap-2 max-h-48 overflow-y-auto p-1"></div>
                </div>
            </div>
        </div>

        <!-- Step 5: Result Screen -->
        <div id="step-result" class="hidden space-y-6 animate__animated animate__zoomIn pb-8">
            <div id="result-card" class="p-6 rounded-3xl border text-center">
                <div id="result-icon" class="mb-4 flex justify-center"></div>
                <h2 id="result-title" class="text-2xl font-bold mb-4"></h2>

                <div class="space-y-2 mb-6 text-left">
                    <div class="bg-slate-800/50 p-3 rounded-xl flex justify-between items-center border border-slate-700">
                        <span class="text-slate-400 text-xs"><span class="res-name-a"></span>님의 진짜 정체</span>
                        <span id="actual-mbti" class="font-black text-xl text-indigo-400"></span>
                    </div>
                </div>

                <!-- AI Character Analysis -->
                <div class="text-left bg-slate-800 p-4 rounded-2xl border border-slate-700 mb-4">
                    <h3 class="text-indigo-400 text-[10px] font-bold uppercase tracking-widest mb-2 flex items-center gap-1">
                        🕵️ <span class="res-name-a"></span>님 성향 요약
                    </h3>
                    <p id="character-summary" class="text-slate-300 text-sm leading-relaxed"></p>
                </div>

                <!-- Funny Friendship Tip -->
                <div class="text-left bg-indigo-900/30 p-4 rounded-2xl border border-indigo-500/30">
                    <h3 class="text-amber-400 text-[10px] font-bold uppercase tracking-widest mb-2 flex items-center gap-1">
                        🤝 <span class="res-name-b"></span>님을 위한 친해지기 가이드
                    </h3>
                    <p id="friendship-tip" class="text-slate-200 text-sm leading-relaxed italic"></p>
                </div>
            </div>

            <button onclick="resetGame()" class="w-full flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all">
                한 판 더 하기
            </button>
        </div>

    </div>
</div>

<script>
    const apiKey = "";
    const mbtiTypes = [
        'ISTJ', 'ISFJ', 'INFJ', 'INTJ',
        'ISTP', 'ISFP', 'INFP', 'INTP',
        'ESTP', 'ESFP', 'ENFP', 'ENTP',
        'ESTJ', 'ESFJ', 'ENFJ', 'ENTJ'
    ];

    let state = {
        nameA: "",
        nameB: "",
        step: 'names',
        selectedMBTI: null,
        clues: [],
        summary: "",
        tip: "",
        currentClueIndex: 0,
        guessedMBTI: null
    };

    function render() {
        const steps = ['names', 'start', 'select', 'loading', 'game', 'result'];
        steps.forEach(s => {
            const el = document.getElementById(`step-${s}`);
            if (el) el.classList.toggle('hidden', state.step !== s);
        });

        if (state.step === 'start') {
            document.getElementById('display-name-a').innerText = state.nameA;
            document.getElementById('display-name-b').innerText = state.nameB;
        }

        if (state.step === 'select') {
            document.getElementById('label-name-a').innerText = state.nameA;
            const grid = document.getElementById('mbti-grid');
            grid.innerHTML = mbtiTypes.map(type => `
                    <button onclick="selectMBTI('${type}')" class="mbti-grid-btn aspect-square flex items-center justify-center rounded-xl font-extrabold text-slate-100 shadow-sm border border-slate-700">
                        ${type}
                    </button>
                `).join('');
        }

        if (state.step === 'game') {
            document.getElementById('label-name-b').innerText = state.nameB;
            document.getElementById('target-name-a').innerText = state.nameA;
            const container = document.getElementById('clues-container');
            container.innerHTML = state.clues.slice(0, state.currentClueIndex + 1).map((clue, i) => `
                    <div class="clue-card p-4 rounded-xl shadow-sm animate__animated animate__fadeInLeft">
                        <span class="text-[10px] font-bold text-indigo-400 block mb-1 uppercase tracking-widest">Clue ${i+1}</span>
                        <p class="text-slate-200 font-medium leading-relaxed">${clue}</p>
                    </div>
                `).join('');

            document.getElementById('clue-count').innerText = state.currentClueIndex + 1;
            const isLastClue = state.currentClueIndex === 4;
            document.getElementById('next-clue-btn').classList.toggle('hidden', isLastClue);
            document.getElementById('final-guess-section').classList.toggle('hidden', !isLastClue);

            if (isLastClue) {
                const guessGrid = document.getElementById('guess-grid');
                guessGrid.innerHTML = mbtiTypes.map(type => `
                        <button onclick="makeGuess('${type}')" class="p-2 bg-slate-800 border border-slate-700 hover:border-indigo-500 hover:bg-indigo-900/50 rounded-lg text-sm font-bold text-slate-300">
                            ${type}
                        </button>
                    `).join('');
            }
        }

        if (state.step === 'result') {
            const isCorrect = state.selectedMBTI === state.guessedMBTI;
            const card = document.getElementById('result-card');
            const title = document.getElementById('result-title');
            const icon = document.getElementById('result-icon');

            card.className = `p-6 rounded-3xl border ${isCorrect ? 'bg-emerald-900/20 border-emerald-500/30' : 'bg-rose-900/20 border-rose-500/30'}`;
            title.innerText = isCorrect ? '완벽한 통찰력!' : '아쉽게도 틀렸어요!';
            title.className = `text-2xl font-bold mb-4 ${isCorrect ? 'text-emerald-400' : 'text-rose-400'}`;

            icon.innerHTML = isCorrect
                ? `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`
                : `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#fb7185" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`;

            document.querySelectorAll('.res-name-a').forEach(el => el.innerText = state.nameA);
            document.querySelectorAll('.res-name-b').forEach(el => el.innerText = state.nameB);
            document.getElementById('actual-mbti').innerText = state.selectedMBTI;
            document.getElementById('character-summary').innerText = state.summary;
            document.getElementById('friendship-tip').innerText = state.tip;
        }
    }

    function saveNamesAndGoStart() {
        const na = document.getElementById('input-name-a').value.trim();
        const nb = document.getElementById('input-name-b').value.trim();
        if(!na || !nb) { alert("플레이어 이름을 모두 입력해 주세요!"); return; }
        state.nameA = na;
        state.nameB = nb;
        state.step = 'start';
        render();
    }

    async function fetchClues(mbti) {
        state.step = 'loading';
        document.getElementById('loading-text').innerText = `${state.nameA}님의 뇌 구조 스캔 중...`;
        render();

        const systemPrompt = `You are a cryptic and witty MBTI psychologist.
            Your job is to provide clues for the guessing game 'I See Your MBTI'.

            TASKS:
            1. Generate 5 HARD, indirect, humorous clues for ${mbti}.
               - Focus on tiny, funny habits instead of general traits.
               - Ensure all 4 dichotomies (E/I, S/N, T/F, J/P) are covered at least once.
            2. Generate a 'Character Analysis Summary' (2-3 sentences) explaining A's (${state.nameA}) quirky behaviors based on ${mbti}.
            3. Generate a 'Funny Friendship Tip' for B (${state.nameB}) to get closer to A (${state.nameA}) based on this MBTI. Be humorous and slightly teasing.

            Language: Korean.
            Output: JSON object with "clues" (array), "summary" (string), and "tip" (string).`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `Generate for MBTI: ${mbti}, Player A: ${state.nameA}, Player B: ${state.nameB}` }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                clues: { type: "ARRAY", items: { type: "STRING" } },
                                summary: { type: "STRING" },
                                tip: { type: "STRING" }
                            }
                        }
                    }
                })
            });
            if (!response.ok) throw new Error('API Error');
            const data = await response.json();
            const result = JSON.parse(data.candidates?.[0]?.content?.parts?.[0]?.text);
            state.clues = result.clues;
            state.summary = result.summary;
            state.tip = result.tip;
            state.step = 'game';
            render();
        } catch (err) {
            console.error(err);
            alert("힌트 생성에 문제가 발생했습니다. 다시 시도해 주세요.");
            resetGame();
        }
    }

    function goToSelect() { state.step = 'select'; render(); }
    function selectMBTI(mbti) { state.selectedMBTI = mbti; fetchClues(mbti); }
    function showNextClue() { if (state.currentClueIndex < 4) { state.currentClueIndex++; render(); } }
    function makeGuess(mbti) { state.guessedMBTI = mbti; state.step = 'result'; render(); }
    function resetGame() {
        state = { ...state, step: 'names', selectedMBTI: null, clues: [], summary: "", tip: "", currentClueIndex: 0, guessedMBTI: null };
        render();
    }
    window.onload = render;
</script>
</body>
</html>
