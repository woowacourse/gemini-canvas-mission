<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Pair Game</title>
    <!-- 레이아웃 및 기본 스타일링을 위한 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 카드 3D 뒤집기 애니메이션을 위한 커스텀 CSS */
        .perspective-1000 {
            perspective: 1000px;
        }
        
        .memory-card {
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
            cursor: pointer;
        }
        
        .memory-card.flip {
            transform: rotateY(180deg);
        }
        
        /* 카드 hover 애니메이션 */
        .memory-card:not(.flip):not(.matched):hover {
            transform: translateY(-4px) scale(1.03);
        }

        /* 매칭 성공 시 초록색 테두리 및 팝업 효과 */
        .memory-card.matched .front-face {
            border: 3px solid #22c55e; /* Tailwind의 green-500 */
            background-color: #f0fdf4; /* Tailwind의 green-50 */
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
        }

        @keyframes matchPop {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.1); }
            100% { transform: rotateY(180deg) scale(1); }
        }

        .memory-card.matched {
            animation: matchPop 0.4s ease-out;
        }
        
        .front-face, .back-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        
        /* 카드의 앞면 (이모지가 있는 면) */
        .front-face {
            transform: rotateY(180deg);
            background-color: white;
            border: 2px solid #e2e8f0;
            transition: all 0.3s ease; /* 부드러운 색상 전환을 위한 속성 */
        }
        
        /* 카드의 뒷면 (처음 보여지는 면) */
        .back-face {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            font-weight: bold;
            font-size: 2rem;
        }
        
        .back-face::after {
            content: '?';
            opacity: 0.7;
        }

        /* 모바일 등 작은 화면을 위한 폰트 크기 조정 */
        @media (max-width: 640px) {
            .front-face { font-size: 2rem; }
            .back-face { font-size: 1.5rem; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-100 via-purple-100 to-pink-100 flex flex-col items-center justify-center min-h-screen font-sans text-slate-800 p-4">

    <!-- 메인 게임 컨테이너 -->
    <div class="max-w-xl w-full bg-white p-6 sm:p-8 rounded-2xl shadow-xl relative overflow-hidden">
        
        <!-- 헤더 섹션 -->
        <div class="text-center mb-4">
            <h1 class="text-2xl sm:text-3xl font-bold text-slate-800 mb-2">Emoji Pair Game 🧠</h1>
            <p class="text-sm text-slate-500">같은 그림의 카드 쌍을 모두 맞춰보세요!</p>
        </div>

        <!-- 상단 대시보드 (상태 및 컨트롤) -->
        <div class="flex flex-col sm:flex-row justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-200 mb-6 gap-3">
            <div class="flex gap-4 text-sm font-semibold text-slate-600">
                <div>시도: <span id="moves-count" class="text-indigo-600 text-lg">0</span></div>
                <div>시간: <span id="time-count" class="text-indigo-600 text-lg">0</span>초</div>
            </div>
            <div class="flex gap-2 w-full sm:w-auto">
                <select id="difficulty" class="flex-1 sm:flex-none px-3 py-2 bg-white border border-slate-300 rounded-lg text-sm font-medium text-slate-700 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all cursor-pointer">
                    <option value="easy">Easy (4x4)</option>
                    <option value="medium">Medium (4x5)</option>
                    <option value="hard">Hard (6x6)</option>
                </select>
                <button id="restart-btn" class="px-4 py-2 bg-indigo-100 text-indigo-700 hover:bg-indigo-200 rounded-lg font-bold transition-colors text-sm whitespace-nowrap">
                    다시 시작
                </button>
            </div>
        </div>

        <!-- 카드 그리드 영역 -->
        <div id="game-board" class="grid gap-2 sm:gap-3 perspective-1000">
            <!-- JavaScript를 통해 카드가 동적으로 생성됩니다 -->
        </div>

        <!-- 게임 완료 오버레이 메시지 -->
        <div id="win-overlay" class="hidden absolute inset-0 bg-white/95 flex-col items-center justify-center z-10 opacity-0 transition-opacity duration-500">
            <div class="text-6xl mb-4 animate-bounce">🎉</div>
            <h2 class="text-3xl font-bold text-green-600 mb-2">게임 완료!</h2>
            <div class="text-slate-600 mb-6 font-medium text-center bg-slate-100 p-4 rounded-xl w-3/4">
                <p>총 시도: <span id="final-moves" class="text-indigo-600 font-bold text-lg">0</span>번</p>
                <p>소요 시간: <span id="final-time" class="text-indigo-600 font-bold text-lg">0</span>초</p>
            </div>
            <button id="modal-restart-btn" class="px-8 py-3 bg-indigo-600 text-white rounded-full font-bold shadow-lg hover:bg-indigo-700 hover:shadow-xl transition-all transform hover:-translate-y-1">
                새 게임 하기
            </button>
        </div>
        
    </div>

    <script>
        // DOM 요소 캐싱
        const gameBoard = document.getElementById('game-board');
        const movesCountEl = document.getElementById('moves-count');
        const restartBtn = document.getElementById('restart-btn');
        const modalRestartBtn = document.getElementById('modal-restart-btn');
        const winOverlay = document.getElementById('win-overlay');
        const finalMovesEl = document.getElementById('final-moves');
        const timeCountEl = document.getElementById('time-count');
        const finalTimeEl = document.getElementById('final-time');
        const difficultySelect = document.getElementById('difficulty');

        // 게임에 사용할 이모지 풀 (Hard 모드 36장을 위해 18종 필요)
        const allEmojis = ['🐶', '🐱', '🦊', '🐼', '🐸', '🦄', '🐙', '🦕', '🦖', '🐳', '🐢', '🦋', '🐞', '🍎', '🍌', '🍉', '🍕', '🚀'];
        
        // 난이도별 설정
        const difficulties = {
            easy: { pairs: 8, gridClass: 'grid-cols-4' },
            medium: { pairs: 10, gridClass: 'grid-cols-4 sm:grid-cols-5' },
            hard: { pairs: 18, gridClass: 'grid-cols-4 sm:grid-cols-6' }
        };

        // 상태 관리 변수
        let cards = [];
        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let matchedPairs = 0;
        let totalPairs = 8;
        let moves = 0;
        let timerInterval;
        let secondsElapsed = 0;
        let isTimerRunning = false;

        /**
         * 배열을 무작위로 섞는 함수 (Fisher-Yates 알고리즘)
         */
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        /**
         * 게임 보드 초기화 및 시작
         */
        function initGame() {
            // 타이머 초기화
            clearInterval(timerInterval);
            secondsElapsed = 0;
            isTimerRunning = false;
            timeCountEl.textContent = '0';

            // UI 및 상태 초기화
            gameBoard.innerHTML = '';
            winOverlay.classList.add('hidden');
            winOverlay.classList.remove('opacity-100');
            
            matchedPairs = 0;
            moves = 0;
            movesCountEl.textContent = moves;
            resetBoardState();

            // 난이도 설정 적용
            const diffConfig = difficulties[difficultySelect.value];
            totalPairs = diffConfig.pairs;
            
            // 그리드 클래스 업데이트
            gameBoard.className = `grid gap-2 sm:gap-3 perspective-1000 ${diffConfig.gridClass}`;

            // 이모지 쌍 생성 및 섞기
            const gameEmojis = allEmojis.slice(0, totalPairs);
            cards = [...gameEmojis, ...gameEmojis];
            cards = shuffle(cards);

            // 카드 DOM 요소 생성 및 이벤트 할당
            cards.forEach(emoji => {
                const cardElement = document.createElement('div');
                // 카드가 정사각형을 유지하도록 aspect-square 클래스 추가
                cardElement.classList.add('memory-card', 'w-full', 'aspect-square');
                cardElement.dataset.emoji = emoji;

                cardElement.innerHTML = `
                    <div class="front-face select-none">${emoji}</div>
                    <div class="back-face select-none"></div>
                `;

                cardElement.addEventListener('click', flipCard);
                gameBoard.appendChild(cardElement);
            });
        }

        /**
         * 카드 클릭 (뒤집기) 처리
         */
        function flipCard() {
            // 클릭이 잠겨있거나, 이미 선택한 첫 번째 카드를 다시 클릭한 경우 무시
            if (lockBoard) return;
            if (this === firstCard) return;

            // 첫 클릭 시 타이머 시작
            if (!isTimerRunning) {
                isTimerRunning = true;
                timerInterval = setInterval(() => {
                    secondsElapsed++;
                    timeCountEl.textContent = secondsElapsed;
                }, 1000);
            }

            // 카드 뒤집기 (CSS 클래스 추가)
            this.classList.add('flip');

            // 첫 번째 카드를 뒤집은 경우
            if (!hasFlippedCard) {
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            // 두 번째 카드를 뒤집은 경우
            secondCard = this;
            moves++;
            movesCountEl.textContent = moves;
            
            checkForMatch();
        }

        /**
         * 두 카드가 일치하는지 확인
         */
        function checkForMatch() {
            let isMatch = firstCard.dataset.emoji === secondCard.dataset.emoji;

            if (isMatch) {
                disableCards(); // 일치하면 고정
            } else {
                unflipCards();  // 일치하지 않으면 다시 뒤집기
            }
        }

        /**
         * 카드 일치 시 처리 (이벤트 제거 및 게임 완료 체크)
         */
        function disableCards() {
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);

            // 매칭 성공 시 시각적 피드백을 위한 클래스 추가
            firstCard.classList.add('matched');
            secondCard.classList.add('matched');

            matchedPairs++;
            
            // 모든 카드를 맞춘 경우
            if (matchedPairs === totalPairs) {
                clearInterval(timerInterval); // 타이머 정지
                setTimeout(showWinMessage, 500);
            }

            resetBoardState();
        }

        /**
         * 카드 불일치 시 처리 (1초 후 뒤집기)
         */
        function unflipCards() {
            lockBoard = true; // 뒤집히는 동안 다른 카드 클릭 방지

            setTimeout(() => {
                firstCard.classList.remove('flip');
                secondCard.classList.remove('flip');
                resetBoardState();
            }, 1000);
        }

        /**
         * 선택 상태 초기화
         */
        function resetBoardState() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        /**
         * 게임 완료 메시지 표시
         */
        function showWinMessage() {
            finalMovesEl.textContent = moves;
            finalTimeEl.textContent = secondsElapsed; // 소요 시간 업데이트
            winOverlay.classList.remove('hidden');
            // 부드러운 전환을 위해 약간의 지연 후 opacity 변경
            setTimeout(() => {
                winOverlay.classList.add('flex');
                winOverlay.classList.add('opacity-100');
            }, 50);
        }

        // 버튼 이벤트 리스너 할당
        restartBtn.addEventListener('click', initGame);
        modalRestartBtn.addEventListener('click', initGame);
        difficultySelect.addEventListener('change', initGame); // 난이도 변경 시 게임 재시작

        // 초기 게임 시작
        initGame();
    </script>
</body>
</html>
