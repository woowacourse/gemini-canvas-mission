<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 역량검사 - 도형 순서 기억하기 (신역검 방식)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #0f172a; /* slate-900 */
            color: #f8fafc; /* slate-50 */
            user-select: none;
            overflow: hidden;
        }

        .grid-cell {
            background-color: #1e293b; /* slate-800 */
            border: 2px solid #334155; /* slate-700 */
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .shape-anim {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .btn-active {
            transform: scale(0.95);
            background-color: #3b82f6 !important; /* blue-500 */
            color: white !important;
            border-color: #2563eb !important;
        }

        /* SVG Shapes */
        .shape-circle { fill: #ef4444; } /* red-500 */
        .shape-square { fill: #3b82f6; } /* blue-500 */
        .shape-triangle { fill: #22c55e; } /* green-500 */
        .shape-star { fill: #eab308; } /* yellow-500 */
        .shape-diamond { fill: #a855f7; } /* purple-500 */
        .shape-hexagon { fill: #f97316; } /* orange-500 */

        .progress-bar {
            transition: width 0.1s linear;
        }

        .feedback-pop {
            animation: feedbackFade 1s forwards;
        }

        @keyframes feedbackFade {
            0% { opacity: 1; transform: scale(1) translateY(0); }
            50% { opacity: 1; transform: scale(1.2) translateY(-10px); }
            100% { opacity: 0; transform: scale(1) translateY(-20px); }
        }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center">

    <!-- Start / Game Over Modal -->
    <div id="modal" class="absolute inset-0 bg-slate-900/95 z-50 flex flex-col items-center justify-center p-6 text-center backdrop-blur-md">
        <span class="text-blue-500 font-bold mb-2 tracking-widest">신형 AI 역량검사 대비</span>
        <h1 id="modal-title" class="text-4xl md:text-5xl font-bold mb-6 text-white">도형 순서 기억하기</h1>
        
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 max-w-lg mb-8 text-left shadow-2xl">
            <p id="modal-desc" class="text-slate-300 text-lg leading-relaxed mb-4">
                화면에 순서대로 나타나는 도형을 기억하고, 현재 제시된 도형이 <strong>과거 어느 시점의 도형과 일치하는지</strong> 방향키로 판단하세요.
            </p>
            <ul class="space-y-3 text-slate-400 font-medium">
                <li class="flex items-center gap-3"><kbd class="bg-slate-700 px-3 py-1 rounded text-white font-bold">←</kbd> 2번째 전 도형과 같습니다.</li>
                <li class="flex items-center gap-3"><kbd class="bg-slate-700 px-3 py-1 rounded text-white font-bold">↓</kbd> 2번째, 3번째 전 도형과 모두 다릅니다. (해당 없음)</li>
                <li class="flex items-center gap-3"><kbd class="bg-slate-700 px-3 py-1 rounded text-white font-bold">→</kbd> 3번째 전 도형과 같습니다.</li>
            </ul>
            <p class="mt-4 text-sm text-yellow-400">*주의: 처음 나타나는 3개의 도형은 <strong>정답 입력 없이 기억만</strong> 하시면 됩니다. (4번째부터 입력)</p>
        </div>

        <button onclick="startGame()" class="px-10 py-4 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-xl text-xl font-bold text-white shadow-lg shadow-blue-500/30 hover:scale-105 transition-transform">
            게임 시작
        </button>
    </div>

    <!-- Main Game Container -->
    <div class="w-full max-w-3xl p-4 flex flex-col h-full max-h-[800px]">
        
        <!-- Header -->
        <div class="flex justify-between items-center mb-8 bg-slate-800 p-4 rounded-2xl shadow-lg border border-slate-700">
            <div>
                <div class="text-slate-400 text-sm font-semibold mb-1">진행 상황</div>
                <div id="turn-display" class="text-2xl font-bold text-blue-400">TURN 1</div>
            </div>
            <div class="text-center relative">
                <div class="text-slate-400 text-sm font-semibold mb-1">남은 기회</div>
                <div id="lives-display" class="text-2xl font-bold text-red-400 tracking-widest">❤️❤️❤️</div>
            </div>
            <div class="text-right">
                <div class="text-slate-400 text-sm font-semibold mb-1">점수</div>
                <div id="score-display" class="text-2xl font-bold text-green-400">0</div>
            </div>
        </div>

        <!-- Status & Timer -->
        <div class="mb-8 flex flex-col items-center justify-center relative">
            <div id="status-message" class="text-xl font-bold tracking-wide text-slate-300 mb-3">집중하세요!</div>
            <div class="w-full max-w-md h-2 bg-slate-800 rounded-full overflow-hidden">
                <div id="timer-bar" class="h-full bg-blue-500 progress-bar w-full"></div>
            </div>
        </div>

        <!-- Single Game Cell with Feedback overlay -->
        <div class="relative aspect-square w-full max-w-[280px] mx-auto mb-10">
            <div class="grid-cell w-full h-full shadow-2xl relative" id="shape-container"></div>
            <!-- Feedback Animation Layer -->
            <div id="visual-feedback" class="absolute inset-0 flex items-center justify-center text-7xl font-black opacity-0 pointer-events-none z-10"></div>
        </div>

        <!-- Controls -->
        <div class="flex justify-center mt-auto">
            <div class="flex w-full max-w-2xl gap-3 bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-xl">
                <!-- 2-Back (Left) -->
                <button id="btn-2back" onclick="handleInput('2back')" class="flex-1 flex flex-col items-center justify-center py-4 rounded-xl border-2 border-slate-600 font-bold text-slate-300 hover:bg-slate-700 transition relative">
                    <span class="text-lg md:text-xl mb-1">2번째 전</span>
                    <span class="text-sm text-slate-500 bg-slate-900 px-3 py-1 rounded-full mt-2 flex items-center gap-2"><kbd>←</kbd> 화살표</span>
                </button>
                
                <!-- None (Down) -->
                <button id="btn-none" onclick="handleInput('none')" class="flex-1 flex flex-col items-center justify-center py-4 rounded-xl border-2 border-slate-600 font-bold text-slate-300 hover:bg-slate-700 transition relative">
                    <span class="text-lg md:text-xl mb-1 text-red-300">해당 없음</span>
                    <span class="text-sm text-slate-500 bg-slate-900 px-3 py-1 rounded-full mt-2 flex items-center gap-2"><kbd>↓</kbd> 화살표</span>
                </button>

                <!-- 3-Back (Right) -->
                <button id="btn-3back" onclick="handleInput('3back')" class="flex-1 flex flex-col items-center justify-center py-4 rounded-xl border-2 border-slate-600 font-bold text-slate-300 hover:bg-slate-700 transition relative">
                    <span class="text-lg md:text-xl mb-1">3번째 전</span>
                    <span class="text-sm text-slate-500 bg-slate-900 px-3 py-1 rounded-full mt-2 flex items-center gap-2"><kbd>→</kbd> 화살표</span>
                </button>
            </div>
        </div>
    </div>

    <!-- SVG Templates -->
    <template id="svg-circle">
        <svg viewBox="0 0 100 100" class="w-3/5 h-3/5 shape-anim"><circle cx="50" cy="50" r="45" class="shape-circle"/></svg>
    </template>
    <template id="svg-square">
        <svg viewBox="0 0 100 100" class="w-3/5 h-3/5 shape-anim"><rect x="10" y="10" width="80" height="80" rx="12" class="shape-square"/></svg>
    </template>
    <template id="svg-triangle">
        <svg viewBox="0 0 100 100" class="w-3/5 h-3/5 shape-anim"><polygon points="50,10 95,90 5,90" stroke-linejoin="round" class="shape-triangle"/></svg>
    </template>
    <template id="svg-star">
        <svg viewBox="0 0 100 100" class="w-3/5 h-3/5 shape-anim"><polygon points="50,5 61,35 95,35 68,57 79,90 50,70 21,90 32,57 5,35 39,35" class="shape-star"/></svg>
    </template>
    <template id="svg-diamond">
        <svg viewBox="0 0 100 100" class="w-3/5 h-3/5 shape-anim"><polygon points="50,5 95,50 50,95 5,50" class="shape-diamond"/></svg>
    </template>
    <template id="svg-hexagon">
        <svg viewBox="0 0 100 100" class="w-3/5 h-3/5 shape-anim"><polygon points="25,5 75,5 95,50 75,95 25,95 5,50" class="shape-hexagon"/></svg>
    </template>

    <script>
        // Game Configuration & State
        const SHAPES = ['circle', 'square', 'triangle', 'star', 'diamond', 'hexagon'];
        const TURN_DURATION = 3000; // 3초 제한시간
        const SHOW_DURATION = 1500; // 1.5초간 도형 노출 후 사라짐

        let history = []; 
        let currentShape = null;
        let score = 0;
        let lives = 3;
        let isPlaying = false;
        
        let actualAnswer = 'none'; // '2back', '3back', 'none'
        let userAnswer = null;     
        
        let turnTimeout;
        let hideTimeout;

        // Sound Effects (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(freq, type, duration) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = type;
            oscillator.frequency.value = freq;
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            oscillator.stop(audioCtx.currentTime + duration);
        }

        function startGame() {
            document.getElementById('modal').classList.add('hidden');
            
            history = [];
            score = 0;
            lives = 3;
            isPlaying = true;
            updateUI();
            
            // 첫 시작 전 잠깐의 여유
            setTimeout(nextTurn, 1000);
        }

        function gameOver() {
            isPlaying = false;
            clearTimeout(turnTimeout);
            clearTimeout(hideTimeout);
            
            document.getElementById('modal-title').innerText = "게임 종료!";
            document.getElementById('modal-desc').innerHTML = `수고하셨습니다. 신역검 '도형 순서 기억하기' 훈련이 완료되었습니다.<br><br>당신의 최종 점수는 <strong class="text-blue-400 text-3xl">${score}</strong>점 입니다.`;
            document.getElementById('modal').classList.remove('hidden');
        }

        function generateNextShape() {
            // 과거 기록 가져오기
            let shape2back = history.length >= 2 ? history[history.length - 2] : null;
            let shape3back = history.length >= 3 ? history[history.length - 3] : null;

            let nextShape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
            let rand = Math.random();

            // 신역검 패턴 알고리즘: 의도적으로 2-back, 3-back 정답을 생성
            // 단, 2-back과 3-back이 동시에 일치하는 모호한 상황은 알고리즘 상 배제함
            if (rand < 0.3 && shape2back) {
                nextShape = shape2back;
            } else if (rand < 0.6 && shape3back) {
                if (shape3back !== shape2back) { // 중복 정답 방지
                    nextShape = shape3back;
                }
            } else {
                // '해당 없음' 정답이 확실하게 되도록 생성
                while (nextShape === shape2back || nextShape === shape3back) {
                    nextShape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
                }
            }

            return nextShape;
        }

        function determineAnswer(shape) {
            if (history.length >= 2 && shape === history[history.length - 2]) {
                return '2back';
            } else if (history.length >= 3 && shape === history[history.length - 3]) {
                return '3back';
            } else {
                return 'none';
            }
        }

        function drawShape(shapeStr) {
            const container = document.getElementById('shape-container');
            container.innerHTML = '';
            
            if(shapeStr !== null) {
                const template = document.getElementById(`svg-${shapeStr}`);
                container.appendChild(template.content.cloneNode(true));
            }
        }

        function updateUI() {
            document.getElementById('score-display').innerText = score;
            document.getElementById('lives-display').innerText = '❤️'.repeat(lives) + '🖤'.repeat(3 - lives);
            document.getElementById('turn-display').innerText = `TURN ${history.length + 1}`;
        }

        function resetTurnState() {
            userAnswer = null;
            ['btn-2back', 'btn-none', 'btn-3back'].forEach(id => {
                document.getElementById(id).classList.remove('btn-active');
            });
        }

        function startTimerBar() {
            const bar = document.getElementById('timer-bar');
            bar.style.transition = 'none';
            bar.style.width = '100%';
            
            // 약간의 딜레이 후 트랜지션 시작해야 CSS가 인식함
            setTimeout(() => {
                bar.style.transition = `width ${TURN_DURATION}ms linear`;
                bar.style.width = '0%';
            }, 50);
        }

        function nextTurn() {
            if(!isPlaying) return;
            resetTurnState();
            
            currentShape = generateNextShape();
            
            // 처음 3번은 관찰(기억)만 하는 페이즈
            const isObservation = history.length < 3;
            
            if (!isObservation) {
                actualAnswer = determineAnswer(currentShape);
            }
            
            drawShape(currentShape);
            updateUI();
            startTimerBar();

            // 안내 메시지 변경
            if (isObservation) {
                document.getElementById('status-message').innerText = `처음 3개의 도형을 기억하세요 (${history.length + 1}/3)`;
                document.getElementById('status-message').className = "text-xl font-bold tracking-wide text-orange-400 mb-3";
            } else {
                document.getElementById('status-message').innerText = "과거의 도형과 비교하세요!";
                document.getElementById('status-message').className = "text-xl font-bold tracking-wide text-blue-400 mb-3";
            }

            // 도형 일정 시간 노출 후 숨김
            hideTimeout = setTimeout(() => {
                drawShape(null);
            }, SHOW_DURATION);

            // 제한 시간 내 응답 대기 및 턴 평가
            turnTimeout = setTimeout(() => {
                if (isObservation) {
                    // 관찰 페이즈: 평가 없이 바로 기록에 추가하고 다음 턴으로
                    history.push(currentShape);
                    updateUI();
                    setTimeout(nextTurn, 500); 
                } else {
                    evaluateTurn();
                }
            }, TURN_DURATION);
        }

        function handleInput(answerType) {
            if(!isPlaying || userAnswer !== null || history.length < 3) return; // 관찰 페이즈(처음 3번)에는 입력 무시

            userAnswer = answerType;

            // 시각적 피드백 (버튼 눌림)
            ['btn-2back', 'btn-none', 'btn-3back'].forEach(id => document.getElementById(id).classList.remove('btn-active'));
            document.getElementById(`btn-${answerType}`).classList.add('btn-active');
        }

        function triggerVisualFeedback(isCorrect) {
            const feedbackEl = document.getElementById('visual-feedback');
            
            feedbackEl.classList.remove('feedback-pop', 'text-green-500', 'text-red-500');
            // DOM reflow for animation trigger
            void feedbackEl.offsetWidth; 

            if (isCorrect) {
                feedbackEl.innerText = "O";
                feedbackEl.classList.add('text-green-500', 'feedback-pop');
            } else {
                feedbackEl.innerText = "X";
                feedbackEl.classList.add('text-red-500', 'feedback-pop');
            }
        }

        function evaluateTurn() {
            let isCorrect = (userAnswer === actualAnswer);

            triggerVisualFeedback(isCorrect);

            if (isCorrect) {
                score += 20;
                playBeep(600, 'sine', 0.1);
                setTimeout(() => playBeep(800, 'sine', 0.15), 100);
            } else {
                lives--;
                playBeep(300, 'sawtooth', 0.3);
            }

            // 히스토리 추가는 평가가 끝난 후 다음 턴으로 넘어가기 직전에 수행
            history.push(currentShape);
            updateUI();

            if (lives <= 0) {
                setTimeout(gameOver, 800);
            } else {
                setTimeout(nextTurn, 500); // 정답 확인 후 다음 턴까지 짧은 대기
            }
        }

        // 키보드 방향키 바인딩
        window.addEventListener('keydown', (e) => {
            if (!isPlaying) return;
            
            // 기본 스크롤 방지
            if(['ArrowLeft', 'ArrowRight', 'ArrowDown'].includes(e.key)) {
                e.preventDefault();
            }

            switch(e.key) {
                case 'ArrowLeft':
                    handleInput('2back');
                    break;
                case 'ArrowDown':
                    handleInput('none');
                    break;
                case 'ArrowRight':
                    handleInput('3back');
                    break;
            }
        });

    </script>
</body>
</html>
