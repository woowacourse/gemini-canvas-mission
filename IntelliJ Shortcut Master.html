<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntelliJ Shortcut Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #0f172a; color: #f1f5f9; overflow-x: hidden; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .shortcut-card:hover { transform: translateY(-2px); transition: all 0.2s; background: rgba(51, 65, 85, 0.8); }
        .kbd { background: #334155; border-radius: 4px; padding: 2px 6px; font-family: monospace; font-weight: bold; color: #38bdf8; border-bottom: 2px solid #1e293b; }
        .active-tab { border-bottom: 3px solid #38bdf8; color: #38bdf8; }
        .chat-container { height: 350px; overflow-y: auto; scrollbar-width: thin; }
        .quiz-option:hover { background: rgba(56, 189, 248, 0.1); border-color: #38bdf8; }
        .fav-active { color: #fbbf24 !important; }
        .timer-progress { transition: width 1s linear; }
    </style>
</head>
<body class="p-4 md:p-8">
<div class="max-w-6xl mx-auto">
    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
        <div>
            <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">
                IntelliJ Shortcut Master
            </h1>
            <p class="text-slate-400 mt-1">백엔드 크루를 위한 생산성 도구</p>
        </div>
        <div class="flex items-center space-x-2 glass p-1 rounded-xl">
            <button id="btnMac" onclick="setOS('mac')" class="px-6 py-2 rounded-lg font-semibold transition-all bg-blue-600 text-white">MacOS</button>
            <button id="btnWin" onclick="setOS('win')" class="px-6 py-2 rounded-lg font-semibold transition-all hover:bg-slate-700">Windows</button>
        </div>
    </header>

    <!-- Main Navigation Tabs -->
    <nav class="flex space-x-4 mb-8">
        <button onclick="changeView('explorer')" id="view-explorer" class="px-4 py-2 rounded-full glass font-medium border-blue-500 text-blue-400">탐색기</button>
        <button onclick="changeView('quiz')" id="view-quiz" class="px-4 py-2 rounded-full glass font-medium hover:text-blue-400">단축키 퀴즈</button>
        <button onclick="changeView('fav')" id="view-fav" class="px-4 py-2 rounded-full glass font-medium hover:text-blue-400">즐겨찾기 (<span id="favCount">0</span>)</button>
    </nav>

    <!-- View 1: Explorer & AI -->
    <div id="section-explorer" class="space-y-8">
        <section>
            <h2 class="text-xl font-semibold mb-4 flex items-center">
                <i class="fa-solid fa-star text-yellow-400 mr-2"></i> 필수 단축키 TOP 10
            </h2>
            <div id="top10Grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4"></div>
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 glass p-6 rounded-2xl flex flex-col h-[500px]">
                <h2 class="text-xl font-semibold mb-4 flex items-center">
                    <i class="fa-solid fa-robot text-blue-400 mr-2"></i> AI 단축키 추천
                </h2>
                <div id="chatBox" class="chat-container mb-4 space-y-3 pr-2 text-sm flex-1">
                    <div class="bg-slate-700 p-3 rounded-tr-xl rounded-bl-xl rounded-br-xl text-slate-200">
                        안녕하세요! 찾고 계신 인텔리제이 기능이나 상황을 말씀해 주세요.
                    </div>
                </div>
                <div class="flex mt-auto">
                    <input type="text" id="chatInput" placeholder="예: '코드 정렬하는 법'"
                           class="flex-1 bg-slate-800 border-none rounded-l-xl px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none">
                    <button onclick="askAI()" class="bg-blue-600 px-4 rounded-r-xl hover:bg-blue-700 transition-colors">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
                <div id="loading" class="hidden text-xs text-blue-400 mt-2 animate-pulse">Gemini AI가 분석 중...</div>
            </div>

            <div class="lg:col-span-2 glass p-6 rounded-2xl">
                <div class="flex space-x-6 border-b border-slate-700 mb-6 overflow-x-auto pb-2">
                    <button onclick="showCategory('nav')" id="tab-nav" class="category-tab active-tab font-semibold whitespace-nowrap">네비게이션</button>
                    <button onclick="showCategory('edit')" id="tab-edit" class="category-tab hover:text-blue-300 transition-colors whitespace-nowrap">편집</button>
                    <button onclick="showCategory('debug')" id="tab-debug" class="category-tab hover:text-blue-300 transition-colors whitespace-nowrap">디버깅</button>
                    <button onclick="showCategory('git')" id="tab-git" class="category-tab hover:text-blue-300 transition-colors whitespace-nowrap">Git</button>
                </div>
                <div id="shortcutList" class="grid grid-cols-1 md:grid-cols-2 gap-3 h-[350px] overflow-y-auto pr-2"></div>
            </div>
        </div>
    </div>

    <!-- View 2: Quiz Mode -->
    <div id="section-quiz" class="hidden glass p-8 rounded-3xl max-w-2xl mx-auto text-center relative overflow-hidden">
        <!-- Timer Bar -->
        <div class="absolute top-0 left-0 w-full h-1 bg-slate-800">
            <div id="quiz-timer-bar" class="h-full bg-blue-500 w-full timer-progress"></div>
        </div>

        <div class="flex justify-between items-center mb-6">
            <span class="text-sm font-bold text-blue-400">문제 <span id="quiz-current-count">1</span> / 10</span>
            <span id="quiz-timer-text" class="text-sm font-mono text-slate-400">남은 시간: 10초</span>
        </div>

        <div id="quiz-main-ui">
            <p class="text-slate-400 mb-6">표시된 기능을 실행하기 위한 단축키는 무엇일까요?</p>
            <div id="quiz-content">
                <div class="bg-slate-800 p-8 rounded-2xl mb-6 border-2 border-slate-700">
                    <span id="quiz-question" class="text-2xl font-semibold">질문을 불러오는 중...</span>
                </div>
                <div id="quiz-options" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6"></div>
                <button id="hint-btn" onclick="showHint()" class="text-xs text-slate-500 hover:text-blue-400 transition-colors">
                    <i class="fa-solid fa-lightbulb mr-1"></i> 힌트 보기
                </button>
                <div id="hint-text" class="hidden mt-2 text-sm text-blue-300 font-mono"></div>
            </div>
        </div>

        <!-- Quiz Result View -->
        <div id="quiz-result" class="hidden py-10">
            <div id="result-icon" class="text-5xl mb-4"></div>
            <p id="result-text" class="text-2xl font-bold mb-6"></p>
            <div id="quiz-navigation">
                <button id="next-quiz-btn" onclick="nextQuizQuestion()" class="bg-blue-600 px-10 py-3 rounded-xl hover:bg-blue-700 font-bold transition-all">
                    다음 문제
                </button>
                <button id="restart-quiz-btn" onclick="startQuiz()" class="hidden bg-purple-600 px-10 py-3 rounded-xl hover:bg-purple-700 font-bold transition-all">
                    다시 시작하기
                </button>
            </div>
        </div>

        <div class="mt-8 pt-8 border-t border-slate-700 flex justify-between items-center text-sm text-slate-500">
            <span>현재 점수: <span id="quiz-score" class="text-blue-400 font-bold">0</span></span>
            <button onclick="startQuiz()" class="hover:text-white transition-colors">퀴즈 초기화</button>
        </div>
    </div>

    <!-- View 3: Favorites -->
    <div id="section-fav" class="hidden">
        <h2 class="text-2xl font-bold mb-6 flex items-center">
            <i class="fa-solid fa-bookmark text-yellow-500 mr-3"></i> 나의 즐겨찾기
        </h2>
        <div id="favList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        <div id="favEmpty" class="hidden text-center py-20 glass rounded-3xl">
            <i class="fa-regular fa-face-sad-tear text-5xl mb-4 text-slate-600"></i>
            <p class="text-slate-400">아직 즐겨찾기한 단축키가 없네요!</p>
        </div>
    </div>
</div>

<script>
    const apiKey = "";
    let currentOS = 'mac';
    let currentCategory = 'nav';
    let favorites = JSON.parse(localStorage.getItem('intellij_favs') || '[]');

    // Quiz State
    let quizScore = 0;
    let quizCount = 0;
    let currentQuizAnswer = "";
    let timerInterval = null;
    let timeLeft = 10;

    const data = {
        top10: [
            { id: "t1", title: "전체 검색", mac: "Shift Shift", win: "Shift Shift", desc: "파일, 설정 등 모든 것 검색" },
            { id: "t2", title: "액션 찾기", mac: "⌘ ⇧ A", win: "Ctrl Shift A", desc: "메뉴나 기능 이름을 검색" },
            { id: "t3", title: "클래스로 이동", mac: "⌘ O", win: "Ctrl N", desc: "클래스 파일 검색 및 이동" },
            { id: "t4", title: "선언부 이동", mac: "⌘ B", win: "Ctrl B", desc: "정의된 소스코드로 이동" },
            { id: "t5", title: "파일로 이동", mac: "⌘ ⇧ O", win: "Ctrl Shift N", desc: "특정 파일로 바로 가기" },
            { id: "t6", title: "최근 파일", mac: "⌘ E", win: "Ctrl E", desc: "최근 작업한 파일 목록" },
            { id: "t7", title: "퀵 픽스", mac: "⌥ Enter", win: "Alt Enter", desc: "오류 해결 및 의도 조치" },
            { id: "t8", title: "코드 생성", mac: "⌘ N", win: "Alt Insert", desc: "생성자, Getter/Setter 생성" },
            { id: "t9", title: "코드 포맷", mac: "⌘ ⌥ L", win: "Ctrl Alt L", desc: "코드 정렬 최적화" },
            { id: "t10", title: "실행 (Run)", mac: "⌃ R", win: "Shift F10", desc: "현재 컨텍스트 실행" }
        ],
        nav: [
            { id: "n1", name: "선언부로 이동", mac: "⌘ B", win: "Ctrl B" },
            { id: "n2", name: "파일 구조 보기", mac: "⌘ F12", win: "Ctrl F12" },
            { id: "n3", name: "프로젝트 창 열기", mac: "⌘ 1", win: "Alt 1" },
            { id: "n4", name: "터미널 열기", mac: "⌥ F12", win: "Alt F12" },
            { id: "n5", name: "타입 선언부 이동", mac: "⌘ ⇧ B", win: "Ctrl Shift B" },
            { id: "n6", name: "메소드 계층 구조", mac: "⌃ H", win: "Ctrl Shift H" },
            { id: "n7", name: "구현부로 이동", mac: "⌘ ⌥ B", win: "Ctrl Alt B" },
            { id: "n8", name: "뒤로 가기", mac: "⌘ [", win: "Ctrl Alt ←" },
            { id: "n9", name: "앞으로 가기", mac: "⌘ ]", win: "Ctrl Alt →" }
        ],
        edit: [
            { id: "e1", name: "라인 복사", mac: "⌘ D", win: "Ctrl D" },
            { id: "e2", name: "라인 삭제", mac: "⌘ ⌫", win: "Ctrl Y" },
            { id: "e3", name: "주석 처리", mac: "⌘ /", win: "Ctrl /" },
            { id: "e4", name: "블록 주석", mac: "⌘ ⌥ /", win: "Ctrl Shift /" },
            { id: "e5", name: "자동 인덴트", mac: "⌃ ⌥ I", win: "Ctrl Alt I" },
            { id: "e6", name: "Import 최적화", mac: "⌃ ⌥ O", win: "Ctrl Alt O" },
            { id: "e7", name: "구문 완성", mac: "⌘ ⇧ ⏎", win: "Ctrl Shift Enter" },
            { id: "e8", name: "이름 변경(Rename)", mac: "⇧ F6", win: "Shift F6" }
        ],
        debug: [
            { id: "d1", name: "Step Into", mac: "F7", win: "F7" },
            { id: "d2", name: "Step Over", mac: "F8", win: "F8" },
            { id: "d3", name: "Step Out", mac: "⇧ F8", win: "Shift F8" },
            { id: "d4", name: "Resume Program", mac: "⌥ ⌘ R", win: "F9" },
            { id: "d5", name: "Break Point 토글", mac: "⌘ F8", win: "Ctrl F8" },
            { id: "d6", name: "디버깅 종료", mac: "⌘ F2", win: "Ctrl F2" }
        ],
        git: [
            { id: "g1", name: "Commit", mac: "⌘ K", win: "Ctrl K" },
            { id: "g2", name: "Push", mac: "⌘ ⇧ K", win: "Ctrl Shift K" },
            { id: "g3", name: "Update Project", mac: "⌘ T", win: "Ctrl T" },
            { id: "g4", name: "Git 기능 모음", mac: "⌃ V", win: "Alt `" },
            { id: "g5", name: "Git 창 열기", mac: "⌘ 9", win: "Alt 9" }
        ]
    };

    const allItems = [...data.top10.map(i => ({...i, name: i.title})), ...data.nav, ...data.edit, ...data.debug, ...data.git];

    function changeView(view) {
        ['explorer', 'quiz', 'fav'].forEach(v => {
            document.getElementById(`section-${v}`).classList.add('hidden');
            document.getElementById(`view-${v}`).classList.remove('border-blue-500', 'text-blue-400');
        });
        document.getElementById(`section-${view}`).classList.remove('hidden');
        document.getElementById(`view-${view}`).classList.add('border-blue-500', 'text-blue-400');

        clearInterval(timerInterval);
        if(view === 'fav') renderFavs();
        if(view === 'quiz') startQuiz();
    }

    function toggleFav(id) {
        const index = favorites.indexOf(id);
        if(index > -1) favorites.splice(index, 1);
        else favorites.push(id);
        localStorage.setItem('intellij_favs', JSON.stringify(favorites));
        document.getElementById('favCount').innerText = favorites.length;
        render();
    }

    function render() {
        renderTop10();
        renderShortcuts();
        document.getElementById('favCount').innerText = favorites.length;
    }

    function renderTop10() {
        const container = document.getElementById('top10Grid');
        container.innerHTML = data.top10.map(item => `
            <div class="shortcut-card glass p-4 rounded-xl flex flex-col h-full relative">
                <button onclick="toggleFav('${item.id}')" class="absolute top-2 right-2 text-slate-500 hover:text-yellow-400 transition-colors">
                    <i class="fa-solid fa-star ${favorites.includes(item.id) ? 'fav-active' : ''}"></i>
                </button>
                <span class="text-xs text-blue-400 font-bold mb-1 uppercase tracking-wider">${item.title}</span>
                <div class="mb-2"><span class="kbd">${item[currentOS]}</span></div>
                <p class="text-xs text-slate-400 leading-tight">${item.desc}</p>
            </div>
        `).join('');
    }

    function renderShortcuts() {
        const container = document.getElementById('shortcutList');
        container.innerHTML = data[currentCategory].map(item => `
            <div class="flex justify-between items-center p-3 border-b border-slate-800 hover:bg-slate-800/50 rounded-lg transition-all group">
                <div class="flex items-center">
                    <button onclick="toggleFav('${item.id}')" class="mr-3 text-slate-600 hover:text-yellow-400">
                         <i class="fa-solid fa-star ${favorites.includes(item.id) ? 'fav-active' : ''}"></i>
                    </button>
                    <span class="text-sm text-slate-300">${item.name}</span>
                </div>
                <span class="kbd group-hover:bg-blue-900/30">${item[currentOS]}</span>
            </div>
        `).join('');
    }

    function renderFavs() {
        const container = document.getElementById('favList');
        const empty = document.getElementById('favEmpty');
        const favData = allItems.filter(i => favorites.includes(i.id));
        if(favData.length === 0) { container.innerHTML = ""; empty.classList.remove('hidden'); return; }
        empty.classList.add('hidden');
        container.innerHTML = favData.map(item => `
            <div class="glass p-4 rounded-xl flex justify-between items-center border-l-4 border-yellow-500">
                <div>
                    <p class="text-xs text-slate-400 mb-1">인기 항목</p>
                    <p class="font-bold text-slate-100">${item.name || item.title}</p>
                </div>
                <div class="flex items-center space-x-3">
                    <span class="kbd">${item[currentOS]}</span>
                    <button onclick="toggleFav('${item.id}'); renderFavs();" class="text-slate-500 hover:text-red-400">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            </div>
        `).join('');
    }

    // Quiz System
    function startQuiz() {
        quizScore = 0;
        quizCount = 0;
        document.getElementById('quiz-score').innerText = "0";
        nextQuizQuestion();
    }

    function nextQuizQuestion() {
        if (quizCount >= 10) {
            showFinalResult();
            return;
        }
        quizCount++;
        document.getElementById('quiz-current-count').innerText = quizCount;
        document.getElementById('quiz-main-ui').classList.remove('hidden');
        document.getElementById('quiz-result').classList.add('hidden');
        document.getElementById('hint-text').classList.add('hidden');

        const randomItem = allItems[Math.floor(Math.random() * allItems.length)];
        currentQuizAnswer = randomItem[currentOS];
        document.getElementById('quiz-question').innerText = randomItem.name || randomItem.title;

        // Generate Options
        const options = [currentQuizAnswer];
        while(options.length < 4) {
            const rand = allItems[Math.floor(Math.random() * allItems.length)][currentOS];
            if(!options.includes(rand)) options.push(rand);
        }
        options.sort(() => Math.random() - 0.5);
        document.getElementById('quiz-options').innerHTML = options.map(opt => `
            <button onclick="checkQuizAnswer('${opt}')" class="quiz-option glass p-4 rounded-xl border border-slate-700 font-mono font-bold transition-all">
                ${opt}
            </button>
        `).join('');

        resetTimer();
    }

    function resetTimer() {
        clearInterval(timerInterval);
        timeLeft = 10;
        updateTimerUI();
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerUI();
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                checkQuizAnswer(null); // Timeout
            }
        }, 1000);
    }

    function updateTimerUI() {
        document.getElementById('quiz-timer-text').innerText = `남은 시간: ${timeLeft}초`;
        document.getElementById('quiz-timer-bar').style.width = `${(timeLeft / 10) * 100}%`;
        if (timeLeft <= 3) {
            document.getElementById('quiz-timer-bar').classList.replace('bg-blue-500', 'bg-red-500');
        } else {
            document.getElementById('quiz-timer-bar').classList.replace('bg-red-500', 'bg-blue-500');
        }
    }

    function showHint() {
        const hintText = document.getElementById('hint-text');
        hintText.innerText = `힌트: 첫 글자는 '${currentQuizAnswer.split(' ')[0]}' 입니다.`;
        hintText.classList.remove('hidden');
    }

    function checkQuizAnswer(choice) {
        clearInterval(timerInterval);
        const resultDiv = document.getElementById('quiz-result');
        const mainDiv = document.getElementById('quiz-main-ui');
        const resultText = document.getElementById('result-text');
        const resultIcon = document.getElementById('result-icon');
        const nextBtn = document.getElementById('next-quiz-btn');
        const restartBtn = document.getElementById('restart-quiz-btn');

        mainDiv.classList.add('hidden');
        resultDiv.classList.remove('hidden');
        nextBtn.classList.remove('hidden');
        restartBtn.classList.add('hidden');

        if (choice === currentQuizAnswer) {
            quizScore += 10;
            resultIcon.innerHTML = "🎉";
            resultText.innerText = "정답입니다!";
            resultText.className = "text-2xl font-bold mb-6 text-green-400";
        } else if (choice === null) {
            resultIcon.innerHTML = "⏰";
            resultText.innerText = `시간 초과! 정답은 [${currentQuizAnswer}] 입니다.`;
            resultText.className = "text-2xl font-bold mb-6 text-yellow-400";
        } else {
            resultIcon.innerHTML = "❌";
            resultText.innerText = `틀렸습니다. 정답은 [${currentQuizAnswer}] 입니다.`;
            resultText.className = "text-2xl font-bold mb-6 text-red-400";
        }
        document.getElementById('quiz-score').innerText = quizScore;

        if (quizCount >= 10) {
            nextBtn.innerText = "결과 확인하기";
        } else {
            nextBtn.innerText = "다음 문제";
        }
    }

    function showFinalResult() {
        const resultDiv = document.getElementById('quiz-result');
        const resultText = document.getElementById('result-text');
        const resultIcon = document.getElementById('result-icon');
        const nextBtn = document.getElementById('next-quiz-btn');
        const restartBtn = document.getElementById('restart-quiz-btn');

        nextBtn.classList.add('hidden');
        restartBtn.classList.remove('hidden');

        resultIcon.innerHTML = quizScore >= 80 ? "🏆" : "💪";
        resultText.innerHTML = `퀴즈 완료!<br><span class="text-4xl mt-2 block">${quizScore}점 / 100점</span>`;
        resultText.className = "text-2xl font-bold mb-6 text-blue-400";
    }

    // AI & Utility Logic (Keep as is)
    async function askAI() {
        const input = document.getElementById('chatInput');
        const loading = document.getElementById('loading');
        const userText = input.value.trim();
        if (!userText) return;
        input.value = "";
        appendMessage('user', userText);
        loading.classList.remove('hidden');
        const systemPrompt = `인텔리제이 단축키 전문가. OS: ${currentOS}. 단축키는 ⌘, ⌥, ⌃, ⇧ 또는 Ctrl, Alt, Shift 기호를 사용.`;
        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: userText }] }], systemInstruction: { parts: [{ text: systemPrompt }] } })
            });
            const result = await response.json();
            appendMessage('ai', result.candidates?.[0]?.content?.parts?.[0]?.text || "답변을 생성할 수 없습니다.");
        } catch (err) { appendMessage('ai', "에러가 발생했습니다."); }
        finally { loading.classList.add('hidden'); }
    }

    function appendMessage(sender, text) {
        const box = document.getElementById('chatBox');
        const div = document.createElement('div');
        div.className = sender === 'user' ? "bg-blue-600/20 ml-auto p-3 rounded-tl-xl rounded-bl-xl rounded-br-xl text-slate-200 w-fit max-w-[90%]" : "bg-slate-700 p-3 rounded-tr-xl rounded-bl-xl rounded-br-xl text-slate-200 w-fit max-w-[90%]";
        div.innerHTML = text.replace(/\n/g, '<br>');
        box.appendChild(div); box.scrollTop = box.scrollHeight;
    }

    function setOS(os) {
        currentOS = os;
        document.getElementById('btnMac').className = os === 'mac' ? 'px-6 py-2 rounded-lg font-semibold bg-blue-600 text-white' : 'px-6 py-2 rounded-lg font-semibold hover:bg-slate-700';
        document.getElementById('btnWin').className = os === 'win' ? 'px-6 py-2 rounded-lg font-semibold bg-blue-600 text-white' : 'px-6 py-2 rounded-lg font-semibold hover:bg-slate-700';
        render(); if(!document.getElementById('section-fav').classList.contains('hidden')) renderFavs();
    }

    function showCategory(cat) {
        currentCategory = cat;
        document.querySelectorAll('.category-tab').forEach(tab => tab.classList.remove('active-tab'));
        document.getElementById(`tab-${cat}`).classList.add('active-tab');
        renderShortcuts();
    }

    document.getElementById('chatInput').addEventListener('keypress', e => e.key === 'Enter' && askAI());
    render();
</script>
</body>
</html>
