<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>날씨옷장 - 날씨 기반 옷 추천</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 마크다운 파서 및 폰트 추가 (Pretendard + Gowun Dodum) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&family=Gowun+Dodum:wght@400;700&display=swap');

    body {
      font-family: 'Pretendard', sans-serif;
      background-color: #f8fafc;
    }

    /* 로고 전용 폰트 및 두께 설정 */
    .logo-text {
      font-family: 'Gowun Dodum', sans-serif;
      font-weight: 700;
    }

    /* 스크롤바 디자인 */
    .date-scroll::-webkit-scrollbar {
      height: 5px;
    }

    .date-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .date-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }

    .chat-scroll::-webkit-scrollbar {
      width: 4px;
    }

    .chat-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-scroll::-webkit-scrollbar-thumb {
      background: #e2e8f0;
      border-radius: 10px;
    }

    .active-date {
      background-color: #3b82f6;
      color: white;
      border-color: #3b82f6;
    }

    /* 챗봇 마크다운 스타일 */
    .chat-markdown p {
      margin-bottom: 0.5rem;
    }

    .chat-markdown p:last-child {
      margin-bottom: 0;
    }

    .chat-markdown ul {
      list-style-type: disc;
      padding-left: 1rem;
      margin-bottom: 0.5rem;
    }

    .chat-markdown li {
      margin-bottom: 0.25rem;
    }

    .chat-markdown strong {
      font-weight: 600;
      color: #1d4ed8;
    }

    /* 애니메이션 제거 및 정적 스타일 유지 (점선은 복구) */
    .pin-pop {
      opacity: 1;
      transform: none;
    }

    .layer-line {
      stroke-dasharray: 4;
    }
  </style>
</head>
<body class="pb-5">

<!-- Header -->
<header
  class="bg-white border-b sticky top-0 z-50 px-4 py-3 flex justify-between items-center shadow-sm">
  <div class="flex items-center gap-1.5">
    <!-- 날씨옷장 로고 -->
    <svg class="w-7 h-7 drop-shadow-md shrink-0" fill="none" viewBox="4 4 16 16"
         xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="sunGradient" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="#FFF176"/>
          <stop offset="40%" stop-color="#FFD600"/>
          <stop offset="100%" stop-color="#FF6D00"/>
        </linearGradient>
        <linearGradient id="closetBgGradient" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="#60a5fa"/>
          <stop offset="100%" stop-color="#3b82f6"/>
        </linearGradient>
        <linearGradient id="doorGradient" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="#bfdbfe"/>
          <stop offset="100%" stop-color="#60a5fa"/>
        </linearGradient>
      </defs>
      <rect fill="url(#closetBgGradient)" height="16" rx="3.5" width="16" x="4" y="4"/>
      <g>
        <circle cx="12.5" cy="12" fill="url(#sunGradient)" r="4.2"/>
        <g fill="url(#sunGradient)" transform="translate(12.5, 12)">
          <path d="M 0 -7.2 L 1.2 -4.0 L -1.2 -4.0 Z"/>
          <path d="M 0 -7.2 L 1.2 -4.0 L -1.2 -4.0 Z" transform="rotate(45)"/>
          <path d="M 0 -7.2 L 1.2 -4.0 L -1.2 -4.0 Z" transform="rotate(90)"/>
          <path d="M 0 -7.2 L 1.2 -4.0 L -1.2 -4.0 Z" transform="rotate(135)"/>
          <path d="M 0 -7.2 L 1.2 -4.0 L -1.2 -4.0 Z" transform="rotate(180)"/>
          <path d="M 0 -7.2 L 1.2 -4.0 L -1.2 -4.0 Z" transform="rotate(225)"/>
          <path d="M 0 -7.2 L 1.2 -4.0 L -1.2 -4.0 Z" transform="rotate(270)"/>
          <path d="M 0 -7.2 L 1.2 -4.0 L -1.2 -4.0 Z" transform="rotate(315)"/>
        </g>
      </g>
      <path d="M7.5 4 H12 V20 H7.5 C5.6 20 4 18.4 4 16.5 V7.5 C4 5.6 5.6 4 7.5 4 Z"
            fill="url(#doorGradient)"/>
      <rect fill="white" fill-opacity="0.95" height="3" rx="0.5" width="1" x="9.5" y="10.5"/>
    </svg>
    <h1 class="logo-text text-xl text-blue-600 tracking-tight leading-none flex items-center">
      날씨옷장</h1>
  </div>
</header>

<main class="max-w-md mx-auto px-4 mt-5 space-y-5">

  <!-- 날짜 선택 섹션 (카드 스타일 적용) -->
  <section class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
    <h2 class="text-sm font-semibold text-gray-800 mb-4 ml-1 flex items-center gap-1.5">
      <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"
              stroke-width="2"></path>
      </svg>
      날짜 선택
    </h2>
    <div class="flex gap-2.5 overflow-x-auto date-scroll pb-1" id="date-list">
      <!-- JS 렌더링 -->
    </div>
  </section>

  <!-- 날씨 요약 카드 -->
  <section class="bg-gradient-to-br rounded-3xl p-5 text-white shadow-lg transition-colors duration-500"

    <div class="flex justify-between items-start mb-4">
      <div>
        <!-- 커스텀 위치 선택 드롭다운 UI -->
        <div class="relative inline-block text-left mb-2 z-30" id="custom-dropdown-container">
          <button class="inline-flex items-center gap-1.5 bg-white/20 hover:bg-white/30 transition-colors rounded-full pl-3 pr-2 py-1.5 backdrop-blur-md shadow-sm border border-white/20 focus:outline-none cursor-pointer"
                  id="location-dropdown-btn">
            <svg class="w-3.5 h-3.5 text-white shrink-0" fill="none" stroke="currentColor"
                 viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

                    stroke-width="2"></path>

            <span class="font-bold text-white text-sm pr-1" id="location-btn-text">서울특별시</span>

          </button>

          <!-- 드롭다운 메뉴 (유리 질감) -->

            <div class="py-1.5 flex flex-col">

              </button>
              <button
                class="loc-option text-left px-4 py-2.5 text-sm text-gray-700 hover:bg-blue-50 transition-colors"
                data-value="35.8714,128.6014">대구광역시
              </button>
              <button
                class="loc-option text-left px-4 py-2.5 text-sm text-gray-700 hover:bg-blue-50 transition-colors"
                data-value="36.3504,127.3845">대전광역시
              </button>
              <button
                class="loc-option text-left px-4 py-2.5 text-sm text-gray-700 hover:bg-blue-50 transition-colors"
                data-value="35.1595,126.8526">광주광역시
              </button>
              <button
                class="loc-option text-left px-4 py-2.5 text-sm text-gray-700 hover:bg-blue-50 transition-colors"
                data-value="35.5384,129.3114">울산광역시
              </button>
              <button
                class="loc-option text-left px-4 py-2.5 text-sm text-gray-700 hover:bg-blue-50 transition-colors"
                data-value="33.4996,126.5312">제주특별자치도
              </button>
            </div>
          </div>
        </div>
        <div class="text-2xl font-bold mt-0.5" id="weather-status-text"></div>
      </div>
      <div class="text-5xl text-white shrink-0" id="weather-icon">☀️</div>
    </div>
    <div class="flex items-end gap-2">
      <span class="text-6xl font-bold tracking-tighter" id="current-temp"></span>
      <span class="text-blue-100 mb-2 opacity-80" id="temp-range"></span>
    </div>
    <div class="grid grid-cols-3 mt-5 pt-5 border-t border-white/20 text-center gap-2">
      <div>
        <div class="text-xs text-blue-100 mb-1 opacity-70">체감 온도</div>
        <div class="font-bold" id="feels-like-temp"></div>
      </div>
      <div>
        <div class="text-xs text-blue-100 mb-1 opacity-70">풍속</div>
        <div class="font-bold" id="wind-speed"></div>
      </div>
      <div>
        <div class="text-xs text-blue-100 mb-1 opacity-70">강수량</div>
        <div class="font-bold" id="precipitation"></div>
      </div>
    </div>
  </section>

  <!-- 분석 및 챗봇 섹션 -->
  <section class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
    <div class="mb-4">
      <h3 class="text-lg font-bold text-gray-800">추천 레이어링</h3>
      <p class="text-[11px] text-gray-400">날씨에 최적화된 아이템 조합</p>
    </div>

    <div
      class="relative w-full aspect-[4/5] max-h-[450px] bg-slate-50/50 rounded-2xl border border-slate-100 overflow-hidden mt-4">
      <svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 400 500">
        <line class="layer-line" id="line-head" stroke="#94a3b8" stroke-width="1.5" x1="96" x2="165" y1="85"
              y2="85"/>
        <line class="layer-line" id="line-neck" stroke="#94a3b8" stroke-width="1.5" x1="304" x2="215" y1="125"
              y2="125"/>
        <line class="layer-line" id="line-inner" stroke="#94a3b8" stroke-width="1.5" x1="96" x2="135" y1="220"
              y2="220"/>
        <line class="layer-line" id="line-outer" stroke="#94a3b8" stroke-width="1.5" x1="304" x2="265"
              y1="250" y2="250"/>
        <line class="layer-line" id="line-hands" stroke="#94a3b8" stroke-width="1.5" x1="96" x2="125" y1="285"
              y2="285"/>
        <line class="layer-line" id="line-acc" stroke="#94a3b8" stroke-width="1.5" x1="304" x2="245" y1="380"
              y2="380"/>
        <path
          d="M200 50 C180 50 165 65 165 85 C165 100 175 115 185 120 L185 130 C160 135 140 150 135 170 L120 280 C118 290 128 300 138 295 L150 260 L150 300 L160 450 C162 460 178 460 180 450 L195 310 L205 310 L220 450 C222 460 238 460 240 450 L250 300 L250 260 L262 295 C272 300 282 290 280 280 L265 170 C260 150 240 135 215 130 L215 120 C225 115 235 100 235 85 C235 65 220 50 200 50 Z"
          fill="#cbd5e1" opacity="0.45"/>
      </svg>
      <div class="absolute top-[17%] -translate-y-1/2 left-[2%] w-[22%] flex items-center justify-end hidden"
           id="label-head"></div>
      <div class="absolute top-[25%] -translate-y-1/2 right-[2%] w-[22%] flex items-center justify-start hidden"
           id="label-neck"></div>
      <div class="absolute top-[44%] -translate-y-1/2 left-[2%] w-[22%] flex items-center justify-end hidden"
           id="label-inner"></div>
      <div class="absolute top-[50%] -translate-y-1/2 right-[2%] w-[22%] flex items-center justify-start hidden"
           id="label-outer"></div>
      <div class="absolute top-[57%] -translate-y-1/2 left-[2%] w-[22%] flex items-center justify-end hidden"
           id="label-hands"></div>
      <div class="absolute top-[76%] -translate-y-1/2 right-[2%] w-[22%] flex items-center justify-start hidden"
           id="label-acc"></div>
    </div>
  </section>
</main>

<!-- 챗봇 열기 버튼 -->
<button class="fixed bottom-5 right-4 sm:right-auto sm:left-1/2 sm:ml-[160px] w-14 h-14 bg-blue-500 text-white rounded-full shadow-lg flex items-center justify-center hover:bg-blue-600 transition-all z-40 active:scale-95"
        id="chatbot-fab">
  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" stroke-linecap="round" stroke-linejoin="round"
          stroke-width="2"></path>
  </svg>
</button>

<div class="fixed inset-0 bg-black/40 z-[55] hidden opacity-0 transition-opacity duration-300"
     id="chatbot-overlay"></div>

<div class="fixed inset-x-0 bottom-0 z-[60] bg-white rounded-t-3xl shadow-2xl transform translate-y-full transition-transform duration-300 flex flex-col h-[85vh] max-h-[600px] max-w-md mx-auto"
     id="chatbot-sheet">
  <div class="px-5 pt-3 pb-4 border-b border-gray-100 bg-white rounded-t-3xl cursor-grab active:cursor-grabbing touch-none select-none"
       id="chatbot-header">
    <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-4"></div>
    <div class="text-center">
      <h3 class="text-lg font-bold text-gray-800">코디 챗봇</h3>
      <p class="text-[11px] text-gray-400 mt-0.5">추천 외에 다른 조합이 궁금하다면 물어보세요!</p>
    </div>
  </div>
  <div class="flex-1 overflow-y-auto chat-scroll p-5 space-y-4 text-sm bg-gray-50/50"
       id="chat-messages"></div>
  <div class="p-4 bg-white border-t border-gray-100">
    <div class="relative flex items-center">
      <input class="w-full bg-gray-50 border border-gray-200 rounded-full pl-4 pr-12 py-3.5 text-sm focus:outline-none focus:border-blue-400 focus:bg-white transition-all shadow-sm" id="chat-input"
             placeholder="외출 상황과 함께 질문해 보세요..."
             type="text">
      <button class="absolute right-1.5 top-1/2 -translate-y-1/2 w-9 h-9 bg-blue-500 text-white rounded-full flex items-center justify-center hover:bg-blue-600 transition-all shadow-md active:scale-95"
              id="chat-send-btn">
        <svg class="w-4 h-4 -ml-0.5 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
             xmlns="http://www.w3.org/2000/svg">
          <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke-linecap="round" stroke-linejoin="round"
                stroke-width="2"></path>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
  const apiKey = '';
  const modelName = 'gemini-2.5-flash-preview-09-2025';

  let weatherData = [];
  let selectedDateIndex = 1;
  let chatHistory = [];
  let currentGpsCoords = null;
  let isCurrentLocationSelected = true;

  const botAvatarHtml = `
            <div class="w-8 h-8 rounded-full bg-blue-50 border border-blue-100 flex items-center justify-center shrink-0 text-blue-500 shadow-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 10h.01M16 10h.01M9 15h6M5 8h14a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2v-8a2 2 0 012-2zM12 4v4"></path>
                </svg>
            </div>
        `;

  const fetchLocationName = async (lat, lon) => {
    try {
      const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ko`);
      const data = await res.json();
      const locationName = data.locality || data.city || data.principalSubdivision || '위치 알 수 없음';
      document.getElementById('current-loc-hint').innerText = locationName;
      if (isCurrentLocationSelected) {
        document.getElementById('location-btn-text').innerText = locationName;
      }
    } catch (error) {
      document.getElementById('current-loc-hint').innerText = '알 수 없음';
      if (isCurrentLocationSelected) {
        document.getElementById('location-btn-text').innerText = '현재 위치';
      }
    }
  };

  const fetchWeatherData = async (lat, lon) => {
    try {
      const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_sum,windspeed_10m_max&past_days=1&forecast_days=7&timezone=auto`);
      const data = await response.json();

      weatherData = data.daily.time.map((timeStr, i) => {
        const maxT = data.daily.temperature_2m_max[i];
        const minT = data.daily.temperature_2m_min[i];
        const windKmh = data.daily.windspeed_10m_max[i];
        const windMs = windKmh * 0.27778;
        const precip = data.daily.precipitation_sum[i] || 0;
        const code = data.daily.weathercode[i];

        let status = '맑음';
        if ([1, 2, 3, 45, 48].includes(code)) status = '구름많음';
        else if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82, 95, 96, 99].includes(code)) status = '비';
        else if ([71, 73, 75, 77, 85, 86].includes(code)) status = '눈';

        return {
          id: i,
          date: new Date(timeStr),
          temp: Math.round((maxT + minT) / 2),
          maxTemp: Math.round(maxT),
          minTemp: Math.round(minT),
          windSpeed: parseFloat(windMs.toFixed(1)),
          precipitation: parseFloat(precip.toFixed(1)),
          status: status,
        };
      });

      renderDates();
      updateWeatherUI();
      resetChatUI();
    } catch (error) {
      document.getElementById('weather-status-text').innerText = '날씨 정보 오류';
    }
  };

  const getClothingRecommendation = (weather) => {
    const feelsLike = weather.temp - 0.7 * Math.pow(weather.windSpeed, 0.5);
    const rec = { head: [], neck: [], base: [], mid: [], outer: [], hands: [], side: [] };

    if (feelsLike >= 28) {
      rec.base = ['나시', '반팔티'];
      rec.head = ['선글라스'];
    } else if (feelsLike >= 23) {
      rec.base = ['반팔티', '얇은 셔츠'];
    } else if (feelsLike >= 20) {
      rec.base = ['긴팔티'];
      rec.outer = ['가디건'];
    } else if (feelsLike >= 17) {
      rec.base = ['맨투맨'];
      rec.outer = ['바람막이', '가디건'];
    } else if (feelsLike >= 12) {
      rec.base = ['긴팔티'];
      rec.mid = ['얇은 니트'];
      rec.outer = ['자켓', '점퍼'];
    } else if (feelsLike >= 9) {
      rec.base = ['히트텍'];
      rec.mid = ['니트'];
      rec.outer = ['코트', '트렌치코트'];
    } else if (feelsLike >= 5) {
      rec.base = ['히트텍'];
      rec.mid = ['두꺼운 니트'];
      rec.outer = ['코트', '경량패딩'];
      rec.neck = ['목도리'];
    } else {
      rec.base = ['히트텍'];
      rec.mid = ['기모 맨투맨'];
      rec.outer = ['숏패딩', '롱패딩'];
      rec.neck = ['목도리'];
      rec.hands = ['장갑'];
    }

    if (weather.precipitation > 0) {
      rec.side.push('우산');
      if (feelsLike < 15) rec.outer.unshift('레인코트');
    }
    if (weather.windSpeed > 6 && feelsLike < 20) rec.outer.unshift('방풍자켓');

    return { ...rec, feelsLike: feelsLike.toFixed(1) };
  };

  const resetChatUI = () => {
    chatHistory = [];
    const data = weatherData[selectedDateIndex];
    if (!data) return;
    const dateStr = `${data.date.getMonth() + 1}월 ${data.date.getDate()}일`;
    document.getElementById('chat-messages').innerHTML = `
                <div class="flex items-start gap-2">
                    ${botAvatarHtml}
                    <div class="bg-white text-gray-800 rounded-2xl rounded-tl-none px-4 py-2.5 max-w-[85%] leading-relaxed shadow-sm mt-2 border border-gray-100">
                        ${dateStr}의 옷차림에 대해 궁금한 점이 있으신가요? <br>
                        <span class="text-gray-500 text-xs mt-1 block">예: "오늘 한강으로 데이트 가는데 반팔에 두꺼운 점퍼는 어때?"</span>
                    </div>
                </div>
            `;
  };

  const renderDates = () => {
    const dateList = document.getElementById('date-list');
    dateList.innerHTML = '';
    weatherData.forEach((data, index) => {
      const dateBtn = document.createElement('button');
      dateBtn.className = `flex-shrink-0 w-14 py-3 border rounded-2xl flex flex-col items-center transition-all ${index === selectedDateIndex ? 'active-date shadow-md scale-105' : 'bg-white border-gray-200'}`;
      const dayName = index === 1 ? '오늘' : index === 0 ? '어제' : new Intl.DateTimeFormat('ko-KR', { weekday: 'short' }).format(data.date);
      dateBtn.innerHTML = `<span class="text-[10px] ${index === selectedDateIndex ? 'text-blue-100' : 'text-gray-400'}">${dayName}</span><span class="text-sm font-bold">${data.date.getDate()}</span>`;
      dateBtn.onclick = () => {
        selectedDateIndex = index;
        renderDates();
        updateWeatherUI();
        resetChatUI();
      };
      dateList.appendChild(dateBtn);
    });
  };

  const createPin = (label, color = 'gray', prefix = '') => {
    const colors = {
      blue: 'bg-blue-50 text-blue-700 border-blue-200',
      orange: 'bg-orange-50 text-orange-700 border-orange-200',
      purple: 'bg-purple-50 text-purple-700 border-purple-200',
      gray: 'bg-slate-50 text-slate-700 border-slate-200',
    };
    return `
                <div class="pin-pop px-2 py-1.5 rounded-xl text-[10px] sm:text-[11px] font-bold border shadow-sm ${colors[color]} text-center leading-snug w-full break-keep">
                    <span class="block text-[9px] opacity-70 font-normal mb-0.5">${prefix}</span>
                    ${label}
                </div>
            `;
  };

  const updateMapItem = (id, items, color, prefix) => {
    const labelEl = document.getElementById(`label-${id}`);
    const lineEl = document.getElementById(`line-${id}`);
    if (items && items.length > 0) {
      labelEl.innerHTML = createPin(items.join(', '), color, prefix);
      labelEl.classList.remove('hidden');
      lineEl.classList.remove('hidden');
    } else {
      labelEl.innerHTML = '';
      labelEl.classList.add('hidden');
      lineEl.classList.add('hidden');
    }
  };

  const updateWeatherUI = () => {
    const data = weatherData[selectedDateIndex];
    if (!data) return;
    const rec = getClothingRecommendation(data);
    const weatherCard = document.getElementById('weather-card');
    const baseCardClasses = 'bg-gradient-to-br rounded-3xl p-5 text-white shadow-lg transition-colors duration-500';
    let bgClasses = 'from-blue-400 to-blue-500';
    if (data.status === '구름많음') bgClasses = 'from-slate-400 to-slate-500';
    else if (data.status === '비') bgClasses = 'from-slate-600 to-slate-800';
    else if (data.status === '눈') bgClasses = 'from-sky-300 to-blue-400';
    weatherCard.className = `${baseCardClasses} ${bgClasses}`;
    document.getElementById('weather-status-text').innerText = data.status;
    document.getElementById('current-temp').innerText = `${data.temp}°`;
    document.getElementById('temp-range').innerText = `최고 ${data.maxTemp}° / 최저 ${data.minTemp}°`;
    document.getElementById('feels-like-temp').innerText = `${rec.feelsLike}°`;
    document.getElementById('wind-speed').innerText = `${data.windSpeed}m/s`;
    document.getElementById('precipitation').innerText = `${data.precipitation}mm`;
    document.getElementById('weather-icon').innerText = ({
      '맑음': '☀️',
      '구름많음': '☁️',
      '비': '🌧️',
      '눈': '❄️',
    })[data.status] || '☀️';

    const innerItems = [...rec.base, ...rec.mid];
    updateMapItem('head', rec.head, 'purple', '액세서리');
    updateMapItem('neck', rec.neck, 'purple', '액세서리');
    updateMapItem('inner', innerItems, 'gray', '이너 (안/중간)');
    updateMapItem('outer', rec.outer, 'orange', '겉옷');
    updateMapItem('hands', rec.hands, 'purple', '액세서리');
    updateMapItem('acc', rec.side, 'blue', '액세서리');
  };

  const toggleChatbot = (show) => {
    const sheet = document.getElementById('chatbot-sheet');
    const overlay = document.getElementById('chatbot-overlay');
    if (show) {
      document.body.classList.add('overflow-hidden');
      overlay.classList.remove('hidden');
      void overlay.offsetWidth;
      overlay.classList.remove('opacity-0');
      sheet.classList.remove('translate-y-full');
    } else {
      document.body.classList.remove('overflow-hidden');
      sheet.classList.add('translate-y-full');
      overlay.classList.add('opacity-0');
      setTimeout(() => overlay.classList.add('hidden'), 300);
    }
  };

  const appendChatMessage = (role, text) => {
    const chatMessages = document.getElementById('chat-messages');
    const msgDiv = document.createElement('div');
    msgDiv.className = `flex items-start gap-2 ${role === 'user' ? 'justify-end' : ''}`;
    if (role === 'user') {
      msgDiv.innerHTML = `<div class="bg-blue-500 text-white rounded-2xl rounded-tr-none px-4 py-2.5 max-w-[85%] leading-relaxed mt-2 shadow-sm">${text.replace(/\n/g, '<br>')}</div>`;
    } else {
      msgDiv.innerHTML = `${botAvatarHtml}<div class="chat-markdown bg-white text-gray-800 rounded-2xl rounded-tl-none px-4 py-2.5 max-w-[85%] leading-relaxed mt-2 shadow-sm border border-gray-100">${marked.parse(text)}</div>`;
    }
    chatMessages.appendChild(msgDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  };

  const handleChatSubmit = async () => {
    const inputEl = document.getElementById('chat-input');
    const btnEl = document.getElementById('chat-send-btn');
    const text = inputEl.value.trim();
    if (!text) return;
    appendChatMessage('user', text);
    chatHistory.push({ role: 'user', parts: [{ text: text }] });
    inputEl.value = '';
    btnEl.disabled = true;
    const loadingId = 'loading-' + Date.now();
    const loadingDiv = document.createElement('div');
    loadingDiv.id = loadingId;
    loadingDiv.className = `flex items-start gap-2`;
    loadingDiv.innerHTML = `${botAvatarHtml}<div class="bg-white border border-gray-100 rounded-2xl rounded-tl-none px-4 py-3 flex items-center gap-1.5 mt-2 shadow-sm"><div class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce"></div><div class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.15s"></div><div class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.3s"></div></div>`;
    document.getElementById('chat-messages').appendChild(loadingDiv);
    document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;
    const data = weatherData[selectedDateIndex];
    const dateString = new Intl.DateTimeFormat('ko-KR', {
      month: 'long',
      day: 'numeric',
      weekday: 'long',
    }).format(data.date);
    const systemPrompt = `당신은 스타일리스트 챗봇입니다. 기준 날짜: ${dateString}. [규칙] 1. 외출 상황 중심 조언 2. 수치 언급 자제 3. 마크다운 사용.`;
    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: chatHistory,
          systemInstruction: { parts: [{ text: systemPrompt }] },
        }),
      });
      const result = await response.json();
      document.getElementById(loadingId).remove();
      const aiText = result.candidates?.[0]?.content?.parts?.[0]?.text;
      if (aiText) {
        appendChatMessage('bot', aiText);
        chatHistory.push({ role: 'model', parts: [{ text: aiText }] });
      }
    } catch (e) {
      document.getElementById(loadingId).remove();
      appendChatMessage('bot', '통신 오류가 발생했습니다.');
    } finally {
      btnEl.disabled = false;
    }
  };

  const initApp = () => {
    document.getElementById('weather-status-text').innerText = '날씨 불러오는 중...';
    isCurrentLocationSelected = false;

    document.querySelectorAll('.loc-option').forEach(opt => {
      opt.classList.remove('text-blue-600', 'font-bold', 'bg-blue-50/50');
      opt.classList.add('text-gray-700');
    });

    const seoulOpt = document.querySelector('.loc-option[data-value="37.5665,126.9780"]');
    if (seoulOpt) {
      seoulOpt.classList.remove('text-gray-700');
      seoulOpt.classList.add('text-blue-600', 'font-bold', 'bg-blue-50/50');
    }
    document.getElementById('location-btn-text').innerText = '서울특별시';
    fetchWeatherData(37.5665, 126.9780);
  };

  window.onload = () => {
    initApp();

    const dropdownBtn = document.getElementById('location-dropdown-btn');
    const dropdownMenu = document.getElementById('location-dropdown-menu');
    const dropdownArrow = document.getElementById('location-dropdown-arrow');
    const btnText = document.getElementById('location-btn-text');
    let isDropdownOpen = false;

    const toggleDropdown = (show) => {
      isDropdownOpen = show !== undefined ? show : !isDropdownOpen;
      if (isDropdownOpen) {
        dropdownMenu.classList.remove('opacity-0', 'invisible', '-translate-y-2');
        dropdownMenu.classList.add('opacity-100', 'visible', 'translate-y-0');
        dropdownArrow.classList.add('rotate-180');
      } else {
        dropdownMenu.classList.add('opacity-0', 'invisible', '-translate-y-2');
        dropdownMenu.classList.remove('opacity-100', 'visible', 'translate-y-0');
        dropdownArrow.classList.remove('rotate-180');
      }
    };

    dropdownBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleDropdown();
    });

    document.addEventListener('click', (e) => {
      if (isDropdownOpen && !dropdownBtn.contains(e.target) && !dropdownMenu.contains(e.target)) {
        toggleDropdown(false);
      }
    });

    document.querySelectorAll('.loc-option').forEach(option => {
      option.addEventListener('click', () => {
        const val = option.getAttribute('data-value');
        document.querySelectorAll('.loc-option').forEach(opt => {
          opt.classList.remove('text-blue-600', 'font-bold', 'bg-blue-50/50');
          opt.classList.add('text-gray-700');
        });
        option.classList.remove('text-gray-700');
        option.classList.add('text-blue-600', 'font-bold', 'bg-blue-50/50');

        toggleDropdown(false);
        document.getElementById('weather-status-text').innerText = '날씨 불러오는 중...';

        isCurrentLocationSelected = false;
        const text = option.innerText.replace('📍', '').trim();
        btnText.innerText = text;
        const [lat, lon] = val.split(',').map(Number);
        fetchWeatherData(lat, lon);
      });
    });

    document.getElementById('chatbot-fab').addEventListener('click', () => toggleChatbot(true));
    document.getElementById('chatbot-overlay')
            .addEventListener('click', () => toggleChatbot(false));
    const sheet = document.getElementById('chatbot-sheet');
    const header = document.getElementById('chatbot-header');
    let startY = 0, currentY = 0, isDragging = false;
    header.addEventListener('mousedown', (e) => {
      startY = e.clientY;
      isDragging = true;
      sheet.style.transition = 'none';
    });
    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      currentY = e.clientY;
      const d = currentY - startY;
      if (d > 0) sheet.style.transform = `translateY(${d}px)`;
    });
    window.addEventListener('mouseup', () => {
      if (!isDragging) return;
      isDragging = false;
      const d = currentY - startY;
      if (d > 80) {
        sheet.style.transition = 'transform 0.3s ease-out';
        sheet.style.transform = 'translateY(100%)';
        toggleChatbot(false);
        setTimeout(() => {
          sheet.style.transform = '';
        }, 300);
      } else {
        sheet.style.transition = 'transform 0.3s ease-out';
        sheet.style.transform = '';
      }
    });

    header.addEventListener('touchstart', (e) => {
      startY = e.touches[0].clientY;
      isDragging = true;
      sheet.style.transition = 'none';
    }, { passive: true });
    window.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      currentY = e.touches[0].clientY;
      const d = currentY - startY;
      if (d > 0) sheet.style.transform = `translateY(${d}px)`;
    }, { passive: true });
    window.addEventListener('touchend', () => {
      if (!isDragging) return;
      isDragging = false;
      const d = currentY - startY;
      if (d > 80) {
        sheet.style.transition = 'transform 0.3s ease-out';
        sheet.style.transform = 'translateY(100%)';
        toggleChatbot(false);
        setTimeout(() => {
          sheet.style.transform = '';
        }, 300);
      } else {
        sheet.style.transition = 'transform 0.3s ease-out';
        sheet.style.transform = '';
      }
    });

    document.getElementById('chat-send-btn').addEventListener('click', handleChatSubmit);
    document.getElementById('chat-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleChatSubmit();
    });
  };
</script>
</body>
</html>
