<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trace: 런타임 수사대</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap');
      body {
        font-family: 'Noto Sans KR', sans-serif;
        background: #000;
        margin: 0;
        overflow: hidden;
        color: #e2e8f0;
      }
      .font-mono {
        font-family: 'Fira Code', monospace;
      }

      @keyframes scanline {
        0% {
          transform: translateY(-100%);
        }
        100% {
          transform: translateY(100vh);
        }
      }
      .scanline-bg::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background:
          linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
          linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.04));
        background-size:
          100% 4px,
          3px 100%;
        pointer-events: none;
        z-index: 50;
      }
      .scanbar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 15px;
        background: rgba(6, 182, 212, 0.05);
        box-shadow: 0 0 30px rgba(6, 182, 212, 0.3);
        animation: scanline 15s linear infinite;
        pointer-events: none;
        z-index: 51;
      }
      @keyframes crt-flicker {
        0% {
          opacity: 0.98;
        }
        10% {
          opacity: 0.99;
        }
        100% {
          opacity: 1;
        }
      }
      .crt-noise {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: url('https://upload.wikimedia.org/wikipedia/commons/7/76/1k_pnt_noise_static.png');
        opacity: 0.03;
        pointer-events: none;
        z-index: 52;
        animation: crt-flicker 0.2s infinite;
      }
      @keyframes glitch {
        0% {
          transform: translate(0);
          text-shadow:
            -1px 0 #0ff,
            1px 0 #f0f;
        }
        5% {
          transform: translate(-1px, 1px);
        }
        100% {
          transform: translate(0);
          text-shadow:
            -1px 0 #0ff,
            1px 0 #f0f;
        }
      }
      .glitch-title {
        animation: glitch 2s infinite linear alternate-reverse;
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-4px);
        }
        50% {
          transform: translateX(4px);
        }
        75% {
          transform: translateX(-4px);
        }
      }
      .animate-shake {
        animation: shake 0.3s ease-in-out;
      }
      .code-input {
        background: transparent;
        border: none;
        color: #a5f3fc;
        font-family: 'Fira Code', monospace;
        font-size: 1.1rem;
        width: 100%;
        outline: none;
        padding: 2px 4px;
        border-radius: 2px;
      }
      .code-input:focus {
        background: rgba(6, 182, 212, 0.1);
      }
      .code-input.error {
        color: #f87171;
        background: rgba(127, 29, 29, 0.2);
        text-shadow: 0 0 4px red;
      }
      .code-line-num {
        color: #334155;
        font-family: monospace;
        font-size: 0.85rem;
        text-align: right;
        width: 32px;
        margin-right: 16px;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="app-container" class="min-h-screen relative flex flex-col items-center justify-center">
      <div class="absolute inset-0 scanline-bg pointer-events-none"></div>
      <div class="scanbar"></div>
      <div class="crt-noise"></div>

      <!-- Screen 1: Intro -->
      <div id="screen-intro" class="z-10 text-center px-4 max-w-4xl">
        <h1
          class="text-8xl md:text-9xl font-black text-white glitch-title tracking-tighter drop-shadow-[0_0_20px_rgba(6,182,212,0.6)] uppercase"
        >
          Trace
        </h1>
        <p class="text-xl md:text-2xl text-cyan-500 mt-4 font-mono tracking-[0.4em] uppercase opacity-70">
          Runtime Forensic Unit
        </p>
        <div class="h-0.5 w-32 bg-cyan-700 mx-auto mt-8 opacity-40"></div>
        <button
          onclick="startGame()"
          class="mt-16 px-16 py-6 bg-transparent border-2 border-cyan-500 text-cyan-400 font-black rounded-none transition-all hover:bg-cyan-500 hover:text-white hover:shadow-[0_0_30px_rgba(6,182,212,0.6)] uppercase tracking-[0.3em] active:scale-95"
        >
          입장 인증
        </button>
      </div>

      <!-- Screen 2: Case Selection -->
      <div id="screen-case-select" class="z-10 w-full max-w-5xl px-6 flex flex-col gap-10 hidden">
        <div class="flex justify-between items-start">
          <button
            onclick="changeState('intro')"
            class="flex items-center gap-2 text-slate-500 hover:text-cyan-400 transition-colors uppercase font-black tracking-widest text-sm"
          >
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Back
          </button>
          <div class="text-center flex-1 pr-12">
            <h2 class="text-4xl font-black text-white tracking-tighter uppercase glitch-title">Case Selection</h2>
            <p class="text-slate-500 font-mono mt-2 uppercase tracking-widest text-xs">
              수사 대상과 위협 레벨을 설정하십시오.
            </p>
          </div>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="lang-buttons"></div>
        <div class="bg-slate-950/50 border border-slate-800 p-8 flex flex-col gap-6">
          <div class="flex justify-between items-center px-2">
            <span class="text-xs font-black text-slate-600 uppercase tracking-widest">Threat Level</span>
            <span id="diff-label" class="text-xs font-mono text-cyan-700 uppercase">LV.1 Basic</span>
          </div>
          <div class="flex gap-4" id="diff-buttons"></div>
        </div>
        <button
          onclick="startOperation()"
          class="w-full py-6 bg-cyan-700 hover:bg-cyan-600 text-white font-black uppercase tracking-[0.5em] shadow-xl active:scale-95 transition-all"
        >
          수사 개시
        </button>
      </div>

      <!-- Screen 3: Gameplay -->
      <div
        id="screen-gameplay"
        class="z-10 w-full max-w-6xl h-[85vh] flex flex-col bg-slate-950/80 border-2 border-slate-900 rounded-none shadow-2xl relative hidden"
      >
        <header class="p-6 bg-black border-b border-slate-900 flex justify-between items-center shrink-0">
          <div class="flex items-center gap-4">
            <i data-lucide="search-code" class="text-cyan-700 w-6 h-6"></i>
            <h2 id="gp-title" class="font-black text-slate-300 uppercase tracking-tighter">Case #</h2>
          </div>
          <div class="flex gap-8 items-center">
            <button
              id="btn-hint"
              onclick="triggerHint()"
              class="hidden flex items-center gap-2 px-4 py-2 border border-yellow-600/50 text-yellow-500 hover:bg-yellow-900/30 text-xs font-bold uppercase tracking-widest transition-all"
            >
              <i data-lucide="lightbulb" class="w-3 h-3"></i> 단서 요청
            </button>
            <div class="text-right">
              <div class="text-[9px] text-slate-600 uppercase font-black">Score</div>
              <div id="gp-score" class="font-mono text-xl text-slate-100 leading-none">0</div>
            </div>
            <div class="text-right">
              <div class="text-[9px] text-slate-600 uppercase font-black">Uptime</div>
              <div id="gp-time" class="font-mono text-4xl font-black text-cyan-500 leading-none">0s</div>
            </div>
            <button

              class="p-2 border border-slate-800 hover:border-cyan-500 text-slate-500 hover:text-cyan-400 transition-all uppercase font-black text-[10px] tracking-widest"

            </button>
          </div>
        </header>

        <div id="top-bar-container" class="flex flex-col border-b border-cyan-900/50 bg-cyan-950/20 shrink-0">
          <div class="p-4 px-8 flex items-center gap-4">
            <i data-lucide="message-square" class="text-cyan-600 w-5 h-5 shrink-0"></i>
            <p
              id="gp-briefing-bar"
              class="text-cyan-100 font-mono text-lg font-bold tracking-tight opacity-90 leading-tight"
            ></p>
          </div>
          <div id="hint-bar" class="px-8 pb-4 flex items-center gap-4 hidden">
            <i data-lucide="lightbulb" class="text-yellow-500 w-5 h-5 shrink-0"></i>
            <p id="gp-hint-bar" class="text-yellow-400 font-mono text-sm tracking-tight opacity-90 leading-tight"></p>
          </div>
        </div>

        <div class="flex-1 p-8 relative overflow-y-auto bg-black/40">
          <div
            id="overlay-briefing"
            class="absolute inset-0 bg-black/95 z-30 flex flex-col items-center justify-center p-12 text-center backdrop-blur-sm"
          >
            <i data-lucide="terminal" class="text-cyan-800 mb-8 w-20 h-20"></i>
            <h3 class="text-4xl font-black text-white mb-8 uppercase tracking-tight glitch-title">Case Briefing</h3>
            <p
              id="overlay-briefing-text"
              class="text-slate-200 max-w-3xl font-mono text-2xl font-bold leading-relaxed"
            ></p>
            <button
              onclick="enterField()"

            >
              현장 진입
            </button>
          </div>
          <div class="font-mono ml-4 border-l border-slate-800 pl-4" id="editor-lines"></div>
        </div>

        <div
          id="overlay-pause"
          class="hidden absolute inset-0 bg-black/90 z-40 flex flex-col items-center justify-center p-12 text-center backdrop-blur-lg"
        >
          <i data-lucide="cpu" class="text-cyan-600 mb-8 w-20 h-20 animate-pulse"></i>
          <h3 class="text-5xl font-black text-white mb-12 uppercase tracking-tighter glitch-title">System Paused</h3>
          <div class="flex flex-col gap-6 w-full max-w-md">
            <button
              onclick="togglePauseMenu(false)"
              class="w-full py-5 border-2 border-cyan-500 text-cyan-400 font-black uppercase hover:bg-cyan-500 hover:text-white transition-all"
            >
              수사 재개 (Resume)
            </button>
            <button
              onclick="retryAssignment()"
              class="w-full py-5 border-2 border-slate-700 text-slate-400 font-black uppercase hover:border-yellow-500 hover:text-yellow-400 transition-all"
            >
              사건 재시작 (Restart)
            </button>
            <button
              onclick="goToCaseSelect()"
              class="w-full py-5 border-2 border-slate-700 text-slate-400 font-black uppercase hover:border-red-600 hover:text-red-500 transition-all"
            >
              선택 화면으로 (Quit)
            </button>
          </div>
        </div>

        <footer class="p-8 bg-black/80 border-t border-slate-900 flex justify-center shrink-0 min-h-[110px]">
          <button
            id="btn-verify"
            onclick="verifySequence()"
            class="px-16 py-5 bg-cyan-700 hover:bg-cyan-600 text-white font-black rounded-none flex items-center gap-4 transition-all active:scale-95 shadow-lg uppercase tracking-widest"
          >
            <i data-lucide="check-circle-2" class="w-6 h-6"></i> Verify Sequence
          </button>
          <button
            id="btn-retry-footer"
            onclick="retryAssignment()"
            class="hidden px-16 py-5 bg-red-700 hover:bg-red-600 text-white font-black uppercase transition-all active:scale-95 shadow-lg"
          >
            Retry Assignment
          </button>
        </footer>

        <div
          id="overlay-success"
          class="hidden absolute inset-0 bg-green-950/95 z-40 flex flex-col items-center justify-center text-center backdrop-blur-md"
        >
          <i data-lucide="shield-check" class="text-green-500 w-24 h-24 mb-6"></i>
          <h2 class="text-6xl font-black text-green-400 uppercase italic tracking-tighter">Cleaned</h2>
          <button
            onclick="nextAssignment()"
            class="mt-12 px-12 py-4 bg-green-700 hover:bg-green-600 text-white font-black uppercase tracking-widest transition-all"
          >
            Next Assignment
          </button>
        </div>

        <div
          id="overlay-gameover-banner"
          class="hidden absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-50 pointer-events-none"
        >
          <h2 class="text-9xl font-black text-red-600/20 uppercase italic tracking-tighter rotate-12 select-none">
            FAILED
          </h2>
        </div>
      </div>

      <!-- Screen 4: Completed -->
      <div id="screen-completed" class="z-10 text-center px-6 max-w-2xl w-full hidden">
        <i
          data-lucide="shield-check"
          class="text-cyan-500 w-32 h-32 mx-auto mb-8 drop-shadow-[0_0_20px_rgba(6,182,212,0.8)] glitch-title"
        ></i>
        <h1 class="text-7xl font-black text-white tracking-tighter uppercase glitch-title">Investigation Closed</h1>
        <p class="text-xl text-slate-500 mt-6 font-light italic">"결함 없는 코드는 가장 강력한 방어선입니다."</p>
        <div class="mt-12 p-10 bg-slate-900/40 border-2 border-cyan-900 rounded-none relative">
          <div class="text-slate-600 uppercase text-[10px] tracking-[1em] font-black mb-4">Total Integrity Score</div>
          <div id="final-score" class="text-8xl font-black text-cyan-400 tracking-tighter leading-none">0</div>
        </div>
        <button
          onclick="goToCaseSelect()"
          class="mt-16 px-16 py-6 border-2 border-slate-700 hover:border-cyan-600 text-slate-600 hover:text-cyan-500 font-black rounded-none transition-all uppercase tracking-widest"
        >
          New Cases
        </button>
      </div>
    </div>

    <script>
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const playTone = (freq, type, duration, vol = 0.1) => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      };
      const playSound = {
        type: () => playTone(800 + Math.random() * 200, 'square', 0.05, 0.02),
        select: () => playTone(600, 'sine', 0.1, 0.05),
        error: () => playTone(150, 'sawtooth', 0.3, 0.1),
        hint: () => {
          playTone(880, 'sine', 0.1, 0.05);
          setTimeout(() => playTone(1200, 'sine', 0.2, 0.05), 100);
        },
        success: () => {
          playTone(440, 'sine', 0.1, 0.05);
          setTimeout(() => playTone(660, 'sine', 0.2, 0.05), 100);
          setTimeout(() => playTone(880, 'sine', 0.4, 0.05), 200);
        },
        heartbeat: () => {
          playTone(80, 'sine', 0.2, 0.2);
          setTimeout(() => playTone(80, 'sine', 0.2, 0.2), 250);
        },
      };
      const shuffleArray = (array) => {
        const newArr = [...array];
        for (let i = newArr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
        }
        return newArr;
      };
      const normalize = (str) => str.replace(/\s+/g, '');
      const escapeHtml = (unsafe) =>
        unsafe
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');

      const buildSet = (lang, diff, items) =>
        items.map((t, i) => ({
          id: `${lang[0]}${diff}-${i}`,
          title: `${lang.toUpperCase()} Case #${i + 1}`,
          briefing: t[1],
          hint: t[2],
          time: t[3],
          code: t[4].map((c, j) => ({ id: `l${j}`, text: c[0], fixed: c[1] || c[0], isBug: !!c[1] && c[0] !== c[1] })),
        }));

      const GAME_DATABASE = {

            ],
          ]),
          3: buildSet('html', 3, [
            [
              '접근성 단절',
              '입력창 레이블을 클릭해도 커서가 가지 않습니다. 레이블과 인풋의 연결 로직을 수정하십시오.',

              [["<label for='uid'>ID:</label>"], ["<input id='userid'>", "<input id='uid'>"]],
            ],
            [
              '의미론 위반',
              '내비게이션 요소가 검색 엔진에 노출되지 않습니다. 시맨틱 태그로 구조를 개선하십시오.',

      let gameState = 'intro',
        selectedLang = 'javascript',
        selectedDifficulty = 1,
        sessionCases = [],
        currentLevelIdx = 0,
        timeLeft = 0,
        levelLines = [],
        score = 0,
        validationErrors = [],
        showHint = false,
        timerInterval = null;
      const screens = {
        intro: document.getElementById('screen-intro'),
        caseSelect: document.getElementById('screen-case-select'),
        gameplay: document.getElementById('screen-gameplay'),
        completed: document.getElementById('screen-completed'),
      };

      function changeState(newState) {
        Object.values(screens).forEach((s) => s.classList.add('hidden'));
        gameState = newState;
        if (newState === 'intro') screens.intro.classList.remove('hidden');
        else if (newState === 'case_select') {
          screens.caseSelect.classList.remove('hidden');
          renderCaseSelect();
        } else if (['playing', 'briefing', 'success', 'gameover'].includes(newState)) {
          screens.gameplay.classList.remove('hidden');
          renderGameplay();
        } else if (newState === 'completed') {
          screens.completed.classList.remove('hidden');
          document.getElementById('final-score').textContent = score;
        }
        updateTimerLogic();
        lucide.createIcons();
      }

      function startGame() {
        playSound.select();
        changeState('case_select');
      }
      function setLang(lang) {
        selectedLang = lang;
        playSound.select();
        renderCaseSelect();
      }
      function setDiff(diff) {
        selectedDifficulty = diff;
        playSound.select();
        renderCaseSelect();
      }
      function startOperation() {
        playSound.select();
        const pool = GAME_DATABASE[selectedLang][selectedDifficulty];
        sessionCases = shuffleArray(pool).slice(0, 5);
        currentLevelIdx = 0;
        score = 0;
        initLevel();
      }
      function initLevel() {
        const currentLevel = sessionCases[currentLevelIdx];
        if (!currentLevel) return;
        levelLines = currentLevel.code.map((item) => ({ ...item, currentText: item.text }));
        timeLeft = currentLevel.time;
        validationErrors = [];
        showHint = false;
        changeState('briefing');
      }
      function enterField() {
        playSound.select();
        changeState('playing');
      }
      function triggerHint() {
        showHint = true;
        playSound.hint();
        renderGameplay();
      }
      function handleInput(id, value) {
        const line = levelLines.find((l) => l.id === id);
        if (line) {
          line.currentText = value;
          validationErrors = validationErrors.filter((errId) => errId !== id);
          const el = document.getElementById(`input-${id}`);
          if (el) el.classList.remove('error', 'animate-shake');
        }
      }
      function verifySequence() {
        const errors = [];
        let isAllCorrect = true;
        levelLines.forEach((line) => {
          const targetText = line.isBug ? line.fixed : line.text;
          if (normalize(line.currentText) !== normalize(targetText)) {
            errors.push(line.id);
            isAllCorrect = false;
          }
        });
        if (isAllCorrect) {
          playSound.success();
          score += 500 * selectedDifficulty + timeLeft * 5;
          changeState('success');
        } else {
          playSound.error();
          validationErrors = errors;
          timeLeft = Math.max(0, timeLeft - 10);
          updateTimerUI();
          renderEditor();
        }
      }
      function togglePauseMenu(show) {
        playSound.select();
        document.getElementById('overlay-pause').classList.toggle('hidden', !show);
        if (show) clearInterval(timerInterval);
        else updateTimerLogic();
      }
      function retryAssignment() {
        playSound.select();
        togglePauseMenu(false);
        initLevel();
      }
      function nextAssignment() {
        playSound.select();
        if (currentLevelIdx < sessionCases.length - 1) {
          currentLevelIdx++;
          initLevel();
        } else changeState('completed');
      }
      function goToCaseSelect() {
        playSound.select();
        togglePauseMenu(false);
        changeState('case_select');
      }

      function renderCaseSelect() {
        const langContainer = document.getElementById('lang-buttons');
        langContainer.innerHTML = [
          { id: 'html', icon: 'layout', label: 'HTML' },
          { id: 'css', icon: 'file-json', label: 'CSS' },
          { id: 'javascript', icon: 'code-2', label: 'JavaScript' },
          { id: 'react', icon: 'atom', label: 'React' },
        ]
          .map(
            (lang) => `
        <button onclick="setLang('${lang.id}')" class="p-6 border-2 flex flex-col items-center gap-3 transition-all ${selectedLang === lang.id ? 'border-cyan-500 bg-cyan-950/20 text-cyan-400 shadow-[0_0_15px_rgba(6,182,212,0.4)]' : 'border-slate-800 bg-slate-900/30 text-slate-500 hover:border-slate-600'}">
          <div class="${selectedLang === lang.id ? 'animate-pulse' : ''}"><i data-lucide="${lang.icon}"></i></div>
          <span class="font-black uppercase tracking-tighter">${lang.label}</span>
        </button>`
          )
          .join('');
        document.getElementById('diff-label').textContent =
          `LV.${selectedDifficulty} ${selectedDifficulty === 1 ? 'Basic' : selectedDifficulty === 2 ? 'Syntax' : selectedDifficulty === 3 ? 'Logic' : 'Algo'}`;
        document.getElementById('diff-buttons').innerHTML = [1, 2, 3, 4]
          .map(
            (num) => `
        <button onclick="setDiff(${num})" class="flex-1 py-4 font-black border-2 transition-all ${selectedDifficulty === num ? 'border-red-600 bg-red-950/20 text-red-500 shadow-[0_0_15px_rgba(220,38,38,0.4)]' : 'border-slate-800 bg-slate-900/30 text-slate-700 hover:border-slate-700'}">${num === 4 ? '<i data-lucide="skull" class="mx-auto w-5 h-5"></i>' : num}</button>`
          )
          .join('');
        lucide.createIcons();
      }

      function renderGameplay() {
        const currentLevel = sessionCases[currentLevelIdx];
        if (!currentLevel) return;
        document.getElementById('gp-title').textContent = `${currentLevel.title} (${currentLevelIdx + 1}/5)`;
        document.getElementById('gp-score').textContent = score;
        updateTimerUI();
        document.getElementById('gp-briefing-bar').textContent = `${currentLevel.briefing}`;
        const hintBtn = document.getElementById('btn-hint'),
          hintBar = document.getElementById('hint-bar'),
          hintText = document.getElementById('gp-hint-bar');
        if (selectedDifficulty >= 3 && gameState === 'playing' && !showHint) hintBtn.classList.remove('hidden');
        else hintBtn.classList.add('hidden');
        if (showHint) {
          hintBar.classList.remove('hidden');
          hintText.textContent = `시스템 단서: ${currentLevel.hint}`;
        } else hintBar.classList.add('hidden');
        document.getElementById('overlay-briefing').classList.toggle('hidden', gameState !== 'briefing');
        document.getElementById('overlay-briefing-text').textContent = currentLevel.briefing;
        document.getElementById('overlay-success').classList.toggle('hidden', gameState !== 'success');
        document.getElementById('overlay-gameover-banner').classList.toggle('hidden', gameState !== 'gameover');
        document.getElementById('btn-verify').classList.toggle('hidden', gameState !== 'playing');
        document.getElementById('btn-retry-footer').classList.toggle('hidden', gameState !== 'gameover');
        renderEditor();
      }

      function renderEditor() {
        const container = document.getElementById('editor-lines');
        container.innerHTML = '';
        levelLines.forEach((line, index) => {
          const div = document.createElement('div');
          div.className = 'flex flex-col mb-2';
          const innerDiv = document.createElement('div');
          innerDiv.className = 'flex items-center';
          const num = document.createElement('div');
          num.className = 'code-line-num';
          num.textContent = index + 1;
          const input = document.createElement('input');
          input.id = `input-${line.id}`;
          input.type = 'text';
          input.disabled = gameState === 'gameover';
          input.value = line.currentText;
          input.className = `code-input ${validationErrors.includes(line.id) ? 'error animate-shake' : ''}`;
          input.spellcheck = false;
          input.placeholder = 'Analyze and fix...';
          input.addEventListener('input', (e) => handleInput(line.id, e.target.value));
          innerDiv.appendChild(num);
          innerDiv.appendChild(input);
          div.appendChild(innerDiv);
          if (gameState === 'gameover' && line.isBug) {
            const hintDiv = document.createElement('div');
            hintDiv.className = 'ml-[48px] mt-1 text-xs font-bold text-red-500/80 italic flex items-center gap-2';
            hintDiv.innerHTML = `<i data-lucide="history" class="w-3 h-3"></i> <span>정답 지침: ${escapeHtml(line.fixed)}</span>`;
            div.appendChild(hintDiv);
          }
          container.appendChild(div);
        });
        lucide.createIcons();
      }

      function updateTimerLogic() {
        clearInterval(timerInterval);
        if (gameState === 'playing') {
          timerInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft <= 10 && timeLeft > 0) playSound.heartbeat();
            if (timeLeft <= 0) {
              timeLeft = 0;
              playSound.error();
              changeState('gameover');
            } else updateTimerUI();
          }, 1000);
        }
      }
      function updateTimerUI() {
        const el = document.getElementById('gp-time');
        if (el) {
          el.textContent = `${timeLeft}s`;
          if (timeLeft <= 10) {
            el.classList.remove('text-cyan-500');
            el.classList.add('text-red-500', 'animate-pulse');
          } else {
            el.classList.remove('text-red-500', 'animate-pulse');
            el.classList.add('text-cyan-500');
          }
        }
      }
      lucide.createIcons();
      changeState('intro');
    </script>
