<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>오늘의 집중 노트</title>
    <style>
      :root {
        --primary-color: #6c5ce7;
        --bg-color: #f9f9fb;
        --text-color: #2d3436;
        --accent-color: #00b894;
        --note-bg: #fff9db;
      }

      body {
        font-family:
          "Pretendard",
          -apple-system,
          BlinkMacSystemFont,
          system-ui,
          Roboto,
          sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 500px;
        background: white;
        padding: 30px;
        border-radius: 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        position: relative;
        z-index: 10;
      }

      h1 {
        font-size: 1.5rem;
        text-align: center;
        margin-bottom: 24px;
        color: var(--primary-color);
      }

      /* 입력 섹션 */
      .setup-section {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 20px;
      }

      input[type="text"] {
        padding: 12px 16px;
        border: 2px solid #eee;
        border-radius: 12px;
        font-size: 1rem;
        transition: border-color 0.3s;
      }

      input[type="text"]:focus {
        outline: none;
        border-color: var(--primary-color);
      }

      button#start-btn {
        background: var(--primary-color);
        color: white;
        border: none;
        padding: 14px;
        border-radius: 12px;
        font-weight: bold;
        cursor: pointer;
        font-size: 1rem;
        margin-top: 10px;
      }

      /* 할 일 리스트 섹션 */
      .todo-section {
        display: none;
      }

      .todo-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px;
        background: #f1f3f5;
        border-radius: 16px;
        margin-bottom: 12px;
        cursor: pointer;
        transition: all 0.3s;
        position: relative;
        overflow: hidden;
      }

      .todo-item.completed {
        background: #e7f5ff;
      }

      .checkbox {
        width: 24px;
        height: 24px;
        border: 2px solid #dee2e6;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: white;
        transition: all 0.2s;
      }

      .todo-item.completed .checkbox {
        background: var(--accent-color);
        border-color: var(--accent-color);
      }

      .checkbox::after {
        content: "✓";
        color: white;
        display: none;
        font-weight: bold;
      }

      .todo-item.completed .checkbox::after {
        display: block;
      }

      .todo-text {
        font-size: 1.1rem;
        position: relative;
      }

      /* 줄긋기 애니메이션 */
      .todo-text::before {
        content: "";
        position: absolute;
        left: 0;
        top: 50%;
        width: 0;
        height: 2px;
        background-color: #868e96;
        transition: width 0.4s ease-in-out;
      }

      .todo-item.completed .todo-text {
        color: #868e96;
      }

      .todo-item.completed .todo-text::before {
        width: 100%;
      }

      /* 딴생각 노트 */
      .distraction-note {
        margin-top: 30px;
        background: var(--note-bg);
        padding: 20px;
        border-radius: 16px;
        border-left: 5px solid #fab005;
      }

      .distraction-note h3 {
        margin: 0 0 10px 0;
        font-size: 1rem;
        color: #f08c00;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      textarea {
        width: 100%;
        height: 80px;
        background: transparent;
        border: none;
        resize: none;
        font-family: inherit;
        font-size: 0.95rem;
        color: #5c5f66;
        box-sizing: border-box;
      }

      textarea:focus {
        outline: none;
      }

      /* 축하 애니메이션 레이어 */
      #celebration-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.9);
        z-index: 100;
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        pointer-events: none;
      }

      .character-container {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
      }

      .character {
        font-size: 4rem;
        animation: bounce 0.6s infinite alternate;
      }

      .character:nth-child(2) {
        animation-delay: 0.1s;
      }
      .character:nth-child(3) {
        animation-delay: 0.2s;
      }
      .character:nth-child(4) {
        animation-delay: 0.3s;
      }
      .character:nth-child(5) {
        animation-delay: 0.4s;
      }

      @keyframes bounce {
        from {
          transform: translateY(0) scale(1);
        }
        to {
          transform: translateY(-30px) scale(1.1);
        }
      }

      .celebration-text {
        font-size: 2rem;
        font-weight: bold;
        color: var(--primary-color);
        text-align: center;
        animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      @keyframes pop {
        0% {
          transform: scale(0.5);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      .confetti {
        position: absolute;
        width: 10px;
        height: 10px;
        background: red;
        animation: fall 3s linear infinite;
      }

      @keyframes fall {
        to {
          transform: translateY(100vh) rotate(360deg);
        }
      }

      .clap-effect {
        position: absolute;
        font-size: 1.5rem;
        font-weight: bold;
        color: #ff6b6b;
        animation: fadeUp 1s forwards;
      }

      @keyframes fadeUp {
        0% {
          transform: translateY(0);
          opacity: 1;
        }
        100% {
          transform: translateY(-50px);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>오늘 집중할 3가지</h1>

      <!-- 초기 설정 섹션 -->
      <div id="setup-section" class="setup-section">
        <input type="text" id="input1" placeholder="첫 번째 할 일" />
        <input type="text" id="input2" placeholder="두 번째 할 일" />
        <input type="text" id="input3" placeholder="세 번째 할 일" />
        <button id="start-btn">계획 확정하기</button>
      </div>

      <!-- 할 일 리스트 섹션 -->
      <div id="todo-section" class="todo-section">
        <div class="todo-item" onclick="toggleTask(0)">
          <div class="checkbox"></div>
          <span class="todo-text" id="todo-0"></span>
        </div>
        <div class="todo-item" onclick="toggleTask(1)">
          <div class="checkbox"></div>
          <span class="todo-text" id="todo-1"></span>
        </div>
        <div class="todo-item" onclick="toggleTask(2)">
          <div class="checkbox"></div>
          <span class="todo-text" id="todo-2"></span>
        </div>

        <!-- 딴생각 노트 -->
        <div class="distraction-note">
          <h3>📝 딴생각 노트 (여기 적고 털어내세요)</h3>
          <textarea
            placeholder="집중하다가 문득 든 생각들을 여기에 적어두고 다시 할 일에 집중하세요..."
          ></textarea>
        </div>
      </div>
    </div>

    <!-- 축하 애니메이션 레이어 -->
    <div id="celebration-overlay">
      <div class="character-container">
        <div class="character">🐶</div>
        <div class="character">🧑‍🤝‍🧑</div>
        <div class="character">🐱</div>
        <div class="character">🙌</div>
        <div class="character">🐰</div>
      </div>
      <div class="celebration-text">
        수고했어! 완벽하게 해냈어!<br />
        👏 짝짝짝! 👏
      </div>
    </div>

    <script>
      const setupSection = document.getElementById("setup-section");
      const todoSection = document.getElementById("todo-section");
      const startBtn = document.getElementById("start-btn");
      const overlay = document.getElementById("celebration-overlay");

      let tasks = [];
      let completedStates = [false, false, false];

      // 1. 계획 확정
      startBtn.addEventListener("click", () => {
        const i1 = document.getElementById("input1").value.trim();
        const i2 = document.getElementById("input2").value.trim();
        const i3 = document.getElementById("input3").value.trim();

        if (!i1 || !i2 || !i3) {
          alertBox("3가지 할 일을 모두 입력해주세요!");
          return;
        }

        tasks = [i1, i2, i3];

        document.getElementById("todo-0").innerText = i1;
        document.getElementById("todo-1").innerText = i2;
        document.getElementById("todo-2").innerText = i3;

        setupSection.style.display = "none";
        todoSection.style.display = "block";
      });

      // 2. 할 일 토글
      function toggleTask(index) {
        completedStates[index] = !completedStates[index];
        const items = document.querySelectorAll(".todo-item");

        if (completedStates[index]) {
          items[index].classList.add("completed");
        } else {
          items[index].classList.remove("completed");
        }

        checkAllDone();
      }

      // 3. 전체 완료 확인
      function checkAllDone() {
        if (completedStates.every((state) => state === true)) {
          triggerCelebration();
        }
      }

      // 4. 축하 애니메이션 및 소리
      function triggerCelebration() {
        overlay.style.display = "flex";

        // 박수 소리 시뮬레이션 (Web Audio API)
        playClapSound();

        // 꽃가루 생성
        for (let i = 0; i < 50; i++) {
          createConfetti();
        }

        // '짝짝짝' 텍스트 팝업 효과
        const interval = setInterval(() => {
          if (overlay.style.display === "none") {
            clearInterval(interval);
            return;
          }
          showClapText();
          playClapSound();
        }, 500);

        // 5초 후 오버레이 닫기 (클릭 가능하도록 변경)
        setTimeout(() => {
          overlay.style.pointerEvents = "auto";
          overlay.onclick = () => {
            overlay.style.display = "none";
            overlay.style.pointerEvents = "none";
            clearInterval(interval);
          };
        }, 1000);
      }

      // 가상의 박수 소리 생성 (화이트 노이즈 기반)
      function playClapSound() {
        try {
          const audioCtx = new (
            window.AudioContext || window.webkitAudioContext
          )();
          const bufferSize = audioCtx.sampleRate * 0.1;
          const buffer = audioCtx.createBuffer(
            1,
            bufferSize,
            audioCtx.sampleRate,
          );
          const data = buffer.getChannelData(0);

          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize / 4));
          }

          const noise = audioCtx.createBufferSource();
          noise.buffer = buffer;

          const filter = audioCtx.createBiquadFilter();
          filter.type = "bandpass";
          filter.frequency.value = 1000;
          filter.Q.value = 1;

          noise.connect(filter);
          filter.connect(audioCtx.destination);
          noise.start();
        } catch (e) {
          console.log("Audio not supported or interaction needed");
        }
      }

      function createConfetti() {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * 100 + "vw";
        c.style.backgroundColor = `hsl(${Math.random() * 360}, 70%, 60%)`;
        c.style.animationDuration = Math.random() * 2 + 1 + "s";
        c.style.opacity = Math.random();
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 3000);
      }

      function showClapText() {
        const t = document.createElement("div");
        t.className = "clap-effect";
        t.innerText = "짝!";
        t.style.left = Math.random() * 60 + 20 + "vw";
        t.style.top = Math.random() * 60 + 20 + "vh";
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 1000);
      }

      function alertBox(msg) {
        const box = document.createElement("div");
        box.style.position = "fixed";
        box.style.top = "20px";
        box.style.left = "50%";
        box.style.transform = "translateX(-50%)";
        box.style.background = "#ff6b6b";
        box.style.color = "white";
        box.style.padding = "10px 20px";
        box.style.borderRadius = "10px";
        box.style.zIndex = "1000";
        box.innerText = msg;
        document.body.appendChild(box);
        setTimeout(() => box.remove(), 2000);
      }
    </script>
  </body>
</html>
