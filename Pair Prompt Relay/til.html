<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데일리 스크럼 TIL 보드</title>
    <style>
        /* 기본 설정 및 CSS 변수 */
        :root {
            --primary-color: #4F46E5; /* Indigo 600 */
            --primary-hover: #4338CA;
            --bg-color: #F3F4F6;      /* Gray 100 */
            --card-bg: #FFFFFF;
            --text-main: #111827;     /* Gray 900 */
            --text-muted: #6B7280;    /* Gray 500 */
            --border-color: #E5E7EB;  /* Gray 200 */
            --radius-lg: 16px;
            --radius-md: 8px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* 레이아웃 구조 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 2rem;
            align-items: start;
        }

        @media (max-width: 860px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* 헤더 부분 */
        header {
            grid-column: 1 / -1;
            margin-bottom: 1rem;
            text-align: center;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* 패널 및 카드 공통 스타일 */
        .panel {
            background-color: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 1.75rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        /* 입력 폼 섹션 */
        .form-section {
            position: sticky;
            top: 2rem;
        }

        .form-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 0.875rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s ease-in-out;
            background-color: #F9FAFB;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 140px;
        }

        button.submit-btn {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 1rem;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button.submit-btn:hover {
            background-color: var(--primary-hover);
        }

        button.submit-btn:active {
            transform: translateY(1px);
        }

        /* 피드(목록) 섹션 */
        .feed-section {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .til-card {
            background-color: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 1.75rem;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .til-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .til-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .til-author-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary-color), #818CF8);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .author-details {
            display: flex;
            flex-direction: column;
        }

        .til-author {
            font-weight: 700;
            font-size: 1.05rem;
        }

        .til-date {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 0.1rem;
        }

        .til-content {
            white-space: pre-wrap;
            margin-bottom: 1.25rem;
            font-size: 1.05rem;
            color: #374151;
        }

        .til-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tag {
            background-color: #EEF2FF;
            color: var(--primary-hover);
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
            background-color: transparent;
            border: 2px dashed var(--border-color);
        }

        /* 추가된 기능 CSS: 필터, 버튼, 모달 */
        .filter-panel {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.25rem;
            padding: 1.25rem;
        }

        .filter-group {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
        }

        .filter-group input, .filter-group select {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            background-color: #F9FAFB;
        }

        .action-btns {
            display: flex;
            gap: 0.5rem;
        }

        .btn-small {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            border-radius: var(--radius-md);
            transition: background-color 0.2s, color 0.2s;
        }

        .btn-small:hover {
            background-color: #F3F4F6;
            color: var(--text-main);
        }

        .btn-small.delete:hover {
            color: #EF4444;
            background-color: #FEE2E2;
        }

        /* 모달 스타일 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: white;
            padding: 2rem;
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 400px;
            box-shadow: var(--shadow-md);
        }

        .modal-content.large {
            max-width: 600px;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            margin-top: 1.5rem;
        }

        .btn-cancel {
            padding: 0.75rem 1rem;
            background-color: white;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
        }

        .btn-confirm {
            padding: 0.75rem 1rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
        }

        .error-text {
            color: #EF4444;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🚀 데일리 스크럼 TIL</h1>
        <p class="subtitle">오늘 배운 점을 크루들과 함께 나누고 성장하세요!</p>
    </header>

    <!-- 좌측: 작성 폼 -->
    <aside class="form-section">
        <div class="panel">
            <h2 class="form-title">✏️ 새 TIL 작성</h2>
            <form id="til-form">
                <div class="form-group">
                    <label for="author">크루 닉네임</label>
                    <input type="text" id="author" placeholder="예: 라이언, 춘식" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="content">오늘 배운 점 (Today I Learned)</label>
                    <textarea id="content" placeholder="오늘 새롭게 알게 된 기술이나 트러블슈팅 경험을 자유롭게 적어주세요!" required></textarea>
                </div>
                <div class="form-group">
                    <label for="tags">태그 (쉼표로 구분)</label>
                    <input type="text" id="tags" placeholder="예: JavaScript, 회고, 비동기처리" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="password">비밀번호 (수정/삭제 권한용)</label>
                    <input type="password" id="password" placeholder="비밀번호를 입력하세요" required>
                </div>
                <button type="submit" class="submit-btn">보드에 공유하기</button>
            </form>
        </div>
    </aside>

    <!-- 우측: 피드 리스트 -->
    <div style="display: flex; flex-direction: column;">
        <!-- 필터 영역 -->
        <div class="panel filter-panel">
            <div class="filter-group">
                <label for="filter-date">📅 날짜별 보기</label>
                <input type="date" id="filter-date">
            </div>
            <div class="filter-group">
                <label for="filter-author">👤 크루별 보기</label>
                <select id="filter-author">
                    <option value="">모든 크루</option>
                </select>
            </div>
        </div>

        <main class="feed-section" id="til-feed">
            <!-- JavaScript를 통해 이 곳에 카드가 동적으로 렌더링 됩니다. -->
        </main>
    </div>
</div>

<!-- 모달 영역 -->
<div class="modal-overlay" id="password-modal">
    <div class="modal-content">
        <h3 class="modal-title">권한 확인</h3>
        <p style="font-size: 0.9rem; margin-bottom: 1rem; color: var(--text-muted);">이 글을 작성할 때 설정한 비밀번호를 입력해주세요.</p>
        <input type="password" id="modal-password-input" placeholder="비밀번호" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-md);">
        <p class="error-text" id="modal-error-text">비밀번호가 일치하지 않습니다.</p>
        <div class="modal-actions">
            <button class="btn-cancel" id="btn-pwd-cancel">취소</button>
            <button class="btn-confirm" id="btn-pwd-confirm">확인</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="edit-modal">
    <div class="modal-content large">
        <h3 class="modal-title">✏️ TIL 수정</h3>
        <div class="form-group">
            <label for="edit-content">오늘 배운 점 (Today I Learned)</label>
            <textarea id="edit-content" style="width: 100%; padding: 0.875rem; border: 1px solid var(--border-color); border-radius: var(--radius-md); min-height: 140px; resize: vertical;" required></textarea>
        </div>
        <div class="form-group">
            <label for="edit-tags">태그 (쉼표로 구분)</label>
            <input type="text" id="edit-tags" style="width: 100%; padding: 0.875rem; border: 1px solid var(--border-color); border-radius: var(--radius-md);" autocomplete="off">
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" id="btn-edit-cancel">취소</button>
            <button class="btn-confirm" id="btn-edit-confirm">저장하기</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // 환경 변수에서 앱 설정 가져오기
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
    let db, auth;

    // 상태 관리 (DB에서 불러온 데이터를 담을 배열)
    let tils = [];

    // 모달 및 선택된 항목 상태 관리
    let selectedTilId = null;
    let selectedAction = null; // 'edit' 또는 'delete'

    // DOM 요소 연결 및 필터 이벤트 리스너 등록
    document.getElementById('filter-date').addEventListener('change', renderTils);
    document.getElementById('filter-author').addEventListener('change', renderTils);

    // 날짜 포맷 함수
    function getFormattedDate(date) {
        const options = { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
        return date.toLocaleDateString('ko-KR', options);
    }

    // YYYY-MM-DD 포맷 함수 (달력 필터 비교용)
    function getIsoDateStr(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    // HTML 태그 이스케이프 (XSS 방지용)
    function escapeHtml(unsafe) {
        if (!unsafe) return "";
        return unsafe
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // 크루별 필터 옵션 업데이트
    function updateAuthorOptions() {
        const authorSelect = document.getElementById('filter-author');
        const currentSelected = authorSelect.value;

        // 고유한 작성자 목록 추출 (빈 이름 제외)
        const authors = [...new Set(tils.map(til => til.author))].filter(Boolean);

        authorSelect.innerHTML = '<option value="">모든 크루</option>';
        authors.forEach(author => {
            const option = document.createElement('option');
            option.value = author;
            option.textContent = author;
            if (author === currentSelected) option.selected = true;
            authorSelect.appendChild(option);
        });
    }

    // 화면 렌더링 함수
    function renderTils() {
        updateAuthorOptions();
        const feed = document.getElementById('til-feed');
        feed.innerHTML = ''; // 초기화

        const filterDate = document.getElementById('filter-date').value;
        const filterAuthor = document.getElementById('filter-author').value;

        // 필터 적용
        const filteredTils = tils.filter(til => {
            let matchDate = true;
            let matchAuthor = true;

            // 이전 데이터 호환을 위한 dateStr 추출 로직
            const recordDateStr = til.dateStr || (til.timestamp ? getIsoDateStr(new Date(til.timestamp)) : '');

            if (filterDate && recordDateStr !== filterDate) matchDate = false;
            if (filterAuthor && til.author !== filterAuthor) matchAuthor = false;
            return matchDate && matchAuthor;
        });

        // 데이터가 없을 때의 화면
        if (filteredTils.length === 0) {
            feed.innerHTML = `
                    <div class="empty-state panel">
                        <h3>조건에 맞는 TIL이 없습니다.</h3>
                        <p style="margin-top:0.5rem">필터를 변경하거나 새 TIL을 먼저 작성해보세요!</p>
                    </div>
                `;
            return;
        }

        // TIL 카드 생성 및 DOM 추가
        filteredTils.forEach(til => {
            const card = document.createElement('div');
            card.className = 'til-card';

            const avatarInitial = til.author ? til.author.charAt(0).toUpperCase() : '?';

            // 태그 렌더링 처리
            let tagsHtml = '';
            if (til.tags && til.tags.length > 0 && til.tags[0] !== '') {
                tagsHtml = `<div class="til-tags">
                        ${til.tags.map(tag => `<span class="tag">#${escapeHtml(tag.trim())}</span>`).join('')}
                    </div>`;
            }

            card.innerHTML = `
                    <div class="til-header">
                        <div class="til-author-info">
                            <div class="avatar">${avatarInitial}</div>
                            <div class="author-details">
                                <span class="til-author">${escapeHtml(til.author)}</span>
                                <span class="til-date">${escapeHtml(til.date)}</span>
                            </div>
                        </div>
                        <div class="action-btns">
                            <button class="btn-small edit" data-id="${til.id}">수정</button>
                            <button class="btn-small delete" data-id="${til.id}">삭제</button>
                        </div>
                    </div>
                    <div class="til-content">${escapeHtml(til.content)}</div>
                    ${tagsHtml}
                `;
            feed.appendChild(card);
        });

        // 생성된 수정/삭제 버튼에 이벤트 리스너 바인딩
        document.querySelectorAll('.btn-small.edit').forEach(btn => {
            btn.addEventListener('click', (e) => openPasswordModal(e.target.dataset.id, 'edit'));
        });
        document.querySelectorAll('.btn-small.delete').forEach(btn => {
            btn.addEventListener('click', (e) => openPasswordModal(e.target.dataset.id, 'delete'));
        });
    }

    // --- 모달 및 권한(비밀번호) 처리 로직 ---
    const pwdModal = document.getElementById('password-modal');
    const editModal = document.getElementById('edit-modal');
    const pwdInput = document.getElementById('modal-password-input');
    const pwdError = document.getElementById('modal-error-text');

    function openPasswordModal(id, action) {
        selectedTilId = id;
        selectedAction = action;
        pwdInput.value = '';
        pwdError.style.display = 'none';
        pwdModal.classList.add('active');
        pwdInput.focus();
    }

    function closePasswordModal() {
        pwdModal.classList.remove('active');
        selectedTilId = null;
        selectedAction = null;
    }

    document.getElementById('btn-pwd-cancel').addEventListener('click', closePasswordModal);

    document.getElementById('btn-pwd-confirm').addEventListener('click', () => {
        const til = tils.find(t => t.id === selectedTilId);
        if (!til) return;

        // 기존에 비밀번호 없이 작성된 글을 위한 방어 로직
        const expectedPwd = til.password || "";
        if (expectedPwd !== pwdInput.value) {
            pwdError.style.display = 'block';
            pwdError.textContent = expectedPwd === "" ? "이전 글은 비밀번호 없이 엔터(또는 확인)를 누르세요." : "비밀번호가 일치하지 않습니다.";
            return;
        }

        // 비밀번호 일치 성공 시 다음 동작 수행
        pwdModal.classList.remove('active');

        if (selectedAction === 'edit') {
            openEditModal(til);
        } else if (selectedAction === 'delete') {
            deleteTil(til.id);
        }
    });

    // 엔터키 입력 지원 (권한 확인)
    pwdInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') document.getElementById('btn-pwd-confirm').click();
    });

    // --- 수정 / 삭제 DB 처리 로직 ---
    function openEditModal(til) {
        document.getElementById('edit-content').value = til.content || '';
        document.getElementById('edit-tags').value = (til.tags || []).join(', ');
        editModal.classList.add('active');
    }

    document.getElementById('btn-edit-cancel').addEventListener('click', () => {
        editModal.classList.remove('active');
    });

    document.getElementById('btn-edit-confirm').addEventListener('click', async () => {
        if (!selectedTilId) return;

        const btn = document.getElementById('btn-edit-confirm');
        btn.textContent = '저장 중...';
        btn.disabled = true;

        const newContent = document.getElementById('edit-content').value.trim();
        const newTagsInput = document.getElementById('edit-tags').value;
        const newTags = newTagsInput.split(',').map(tag => tag.trim()).filter(tag => tag !== '');

        try {
            // 수정된 내용 DB 반영
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'tils', selectedTilId);
            await updateDoc(docRef, {
                content: newContent,
                tags: newTags
            });
            editModal.classList.remove('active');
        } catch (error) {
            console.error("Error updating document:", error);
            alert("수정에 실패했습니다. 콘솔을 확인해주세요.");
        } finally {
            btn.textContent = '저장하기';
            btn.disabled = false;
            selectedTilId = null;
        }
    });

    async function deleteTil(id) {
        try {
            // 문서 DB에서 삭제
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'tils', id);
            await deleteDoc(docRef);
        } catch (error) {
            console.error("Error deleting document:", error);
            alert("삭제에 실패했습니다.");
        }
    }

    // Firebase 초기화 및 실행
    async function initApp() {
        if (typeof __firebase_config === 'undefined') {
            document.getElementById('til-feed').innerHTML = '<div class="empty-state panel">데이터베이스 설정이 필요합니다.</div>';
            return;
        }

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        // 1. 필수: 데이터베이스 접근 권한 인증
        try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        } catch (error) {
            console.error("Auth Error:", error);
            document.getElementById('til-feed').innerHTML = '<div class="empty-state panel">인증에 실패했습니다.</div>';
            return;
        }

        // 2. 인증 완료 시 데이터 불러오기
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loadTils();
            }
        });
    }

    // Firestore 실시간 리스너 (데이터 읽기)
    function loadTils() {
        // 퍼블릭 데이터 컬렉션 경로
        const tilsCollection = collection(db, 'artifacts', appId, 'public', 'data', 'tils');

        // 데이터가 추가되거나 변경될 때마다 자동으로 실행 (실시간 연동)
        onSnapshot(tilsCollection, (snapshot) => {
            tils = [];
            snapshot.forEach((doc) => {
                tils.push({ id: doc.id, ...doc.data() });
            });

            // 최신 글이 맨 위에 오도록 메모리상에서 정렬
            tils.sort((a, b) => b.timestamp - a.timestamp);

            // 화면 업데이트
            renderTils();
        }, (error) => {
            console.error("Firestore Listen Error:", error);
        });
    }

    // 폼 제출 이벤트 핸들러 (데이터 쓰기)
    document.getElementById('til-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const submitBtn = this.querySelector('.submit-btn');

        // DB 연결 전 클릭 방지
        if (!auth || !auth.currentUser) {
            submitBtn.textContent = 'DB 연결 중...';
            setTimeout(() => submitBtn.textContent = '보드에 공유하기', 2000);
            return;
        }

        // 로딩 상태 표시
        submitBtn.disabled = true;
        submitBtn.textContent = '저장 중...';

        // 입력값 가져오기
        const author = document.getElementById('author').value.trim();
        const content = document.getElementById('content').value.trim();
        const tagsInput = document.getElementById('tags').value;
        const password = document.getElementById('password').value; // 비밀번호 추가

        // 태그 배열화 및 빈 값 제거
        const tags = tagsInput.split(',')
            .map(tag => tag.trim())
            .filter(tag => tag !== '');

        try {
            // Firestore 컬렉션에 새 문서 추가
            const tilsCollection = collection(db, 'artifacts', appId, 'public', 'data', 'tils');
            const now = new Date();
            await addDoc(tilsCollection, {
                author,
                content,
                tags,
                password, // 비밀번호 저장
                date: getFormattedDate(now),
                dateStr: getIsoDateStr(now), // 달력 필터 비교용 날짜 포맷
                timestamp: Date.now() // 정렬을 위한 타임스탬프
            });

            // 폼 초기화 (화면 렌더링은 onSnapshot 리스너가 자동으로 처리합니다)
            this.reset();
        } catch (error) {
            console.error("Error adding document: ", error);
            submitBtn.textContent = '저장 실패 😢';
            setTimeout(() => submitBtn.textContent = '보드에 공유하기', 2000);
        } finally {
            // 버튼 상태 복구
            if(submitBtn.textContent === '저장 중...') {
                submitBtn.disabled = false;
                submitBtn.textContent = '보드에 공유하기';
            }
        }
    });

    // 앱 실행
    initApp();
</script>
</body>
</html>
