<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>노이즈 머신 - 하이브리드 저장 방식</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            color: #e2e8f0;
        }
        .slider-vertical {
            writing-mode: bt-lr; /* IE */
            appearance: slider-vertical;
            width: 12px;
            height: 180px;
            padding: 0 5px;
            cursor: pointer;
        }
        input[type=range]::-webkit-slider-runnable-track {
            background: #334155;
            border-radius: 4px;
        }
        input[type=range]::-webkit-slider-thumb {
            background: #60a5fa;
            border: 2px solid #ffffff;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            margin-top: -3px;
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto bg-slate-900/90 p-6 md:p-10 rounded-3xl shadow-2xl backdrop-blur-xl border border-slate-700">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-black bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-blue-500 to-indigo-600 mb-2">
                NOISE MACHINE
            </h1>
            <p class="text-slate-400 font-medium text-sm">로컬 자동 저장 + 설정 코드 백업</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-10">
            <!-- Playback & Master Volume -->
            <div class="lg:col-span-1 bg-slate-800/50 p-6 rounded-2xl border border-slate-700 flex flex-col justify-between">
                <div>
                    <h2 class="text-lg font-bold mb-4 flex items-center text-slate-200">
                        <span class="mr-2">📢</span> 마스터 제어
                    </h2>
                    <div class="mb-8">
                        <label class="flex justify-between text-sm font-semibold text-slate-400 mb-3">
                            메인 볼륨 <span id="volPercent">50%</span>
                        </label>
                        <input type="range" id="masterVolume" min="0" max="1" step="0.01" value="0.5" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500">
                    </div>
                </div>
                
                <button id="playBtn" class="w-full py-5 bg-gradient-to-br from-blue-600 to-indigo-700 hover:from-blue-500 hover:to-indigo-600 text-white text-xl font-black rounded-2xl transition-all shadow-xl active:scale-95 flex items-center justify-center gap-2">
                    <span id="btnIcon">▶</span> <span id="btnText">재생 시작</span>
                </button>
            </div>

            <!-- Integrated Presets & Config Sync -->
            <div class="lg:col-span-2 bg-slate-800/50 p-6 rounded-2xl border border-slate-700">
                <h2 class="text-lg font-bold mb-4 flex items-center text-slate-200">
                    <span class="mr-2">🎨</span> 통합 노이즈 프리셋
                </h2>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 mb-6">
                    <button onclick="applyPreset('white')" class="p-3 bg-slate-700/50 hover:bg-blue-600/30 border border-slate-600 rounded-xl text-xs font-bold transition-all text-slate-300">화이트</button>
                    <button onclick="applyPreset('brown')" class="p-3 bg-slate-700/50 hover:bg-blue-600/30 border border-slate-600 rounded-xl text-xs font-bold transition-all text-slate-300">브라운</button>
                    <button onclick="applyPreset('pink')" class="p-3 bg-slate-700/50 hover:bg-blue-600/30 border border-slate-600 rounded-xl text-xs font-bold transition-all text-slate-300">핑크</button>
                    <button onclick="applyPreset('deepSleep')" class="p-3 bg-slate-700/50 hover:bg-blue-600/30 border border-slate-600 rounded-xl text-xs font-bold transition-all text-slate-300">숙면</button>
                    <button onclick="applyPreset('focus')" class="p-3 bg-slate-700/50 hover:bg-blue-600/30 border border-slate-600 rounded-xl text-xs font-bold transition-all text-slate-300">집중</button>
                    <button onclick="applyPreset('reset')" class="p-3 bg-slate-700/50 hover:bg-blue-600/30 border border-slate-600 rounded-xl text-xs font-bold transition-all text-slate-300">초기화</button>
                </div>
                
                <div class="space-y-3">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest flex justify-between">
                        <span>설정 코드 (Config Code)</span>
                        <span id="saveStatus" class="text-emerald-400 lowercase font-normal opacity-0 transition-opacity">자동 저장됨</span>
                    </label>
                    <div class="flex gap-2">
                        <input type="text" id="configInput" readonly class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs font-mono text-cyan-400 focus:outline-none focus:border-blue-500" placeholder="설정 코드">
                        <button onclick="copyConfig()" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded-lg text-xs transition-colors">복사</button>
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="importInput" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs font-mono text-slate-300 focus:outline-none focus:border-blue-500" placeholder="코드를 여기에 붙여넣기">
                        <button onclick="importConfig()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-2 rounded-lg text-xs font-bold transition-colors">적용</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- EQ Section -->
        <div class="bg-slate-800/50 p-6 md:p-8 rounded-2xl border border-slate-700">
            <h2 class="text-lg font-bold mb-8 flex items-center text-slate-200">
                <span class="mr-2">🎚️</span> 이퀄라이저 상세 설정 (dB)
            </h2>
            <div id="eqContainer" class="flex justify-between items-end gap-1 overflow-x-auto pb-4 px-2">
                <div class="flex flex-col items-center flex-1 min-w-[45px]">
                    <span class="text-[9px] text-slate-500 mb-2">+12</span>
                    <input type="range" data-index="0" min="-12" max="12" value="0" step="0.1" class="slider-vertical eq-band">
                    <span class="text-[10px] font-bold text-slate-400 mt-3">60</span>
                </div>
                <div class="flex flex-col items-center flex-1 min-w-[45px]">
                    <span class="text-[9px] text-slate-500 mb-2"></span>
                    <input type="range" data-index="1" min="-12" max="12" value="0" step="0.1" class="slider-vertical eq-band">
                    <span class="text-[10px] font-bold text-slate-400 mt-3">170</span>
                </div>
                <div class="flex flex-col items-center flex-1 min-w-[45px]">
                    <span class="text-[9px] text-slate-500 mb-2">0</span>
                    <input type="range" data-index="2" min="-12" max="12" value="0" step="0.1" class="slider-vertical eq-band">
                    <span class="text-[10px] font-bold text-slate-400 mt-3">310</span>
                </div>
                <div class="flex flex-col items-center flex-1 min-w-[45px]">
                    <span class="text-[9px] text-slate-500 mb-2"></span>
                    <input type="range" data-index="3" min="-12" max="12" value="0" step="0.1" class="slider-vertical eq-band">
                    <span class="text-[10px] font-bold text-slate-400 mt-3">600</span>
                </div>
                <div class="flex flex-col items-center flex-1 min-w-[45px]">
                    <span class="text-[9px] text-slate-500 mb-2">0</span>
                    <input type="range" data-index="4" min="-12" max="12" value="0" step="0.1" class="slider-vertical eq-band">
                    <span class="text-[10px] font-bold text-slate-400 mt-3">1k</span>
                </div>
                <div class="flex flex-col items-center flex-1 min-w-[45px]">
                    <span class="text-[9px] text-slate-500 mb-2"></span>
                    <input type="range" data-index="5" min="-12" max="12" value="0" step="0.1" class="slider-vertical eq-band">
                    <span class="text-[10px] font-bold text-slate-400 mt-3">3k</span>
                </div>
                <div class="flex flex-col items-center flex-1 min-w-[45px]">
                    <span class="text-[9px] text-slate-500 mb-2"></span>
                    <input type="range" data-index="6" min="-12" max="12" value="0" step="0.1" class="slider-vertical eq-band">
                    <span class="text-[10px] font-bold text-slate-400 mt-3">6k</span>
                </div>
                <div class="flex flex-col items-center flex-1 min-w-[45px]">
                    <span class="text-[9px] text-slate-500 mb-2">-12</span>
                    <input type="range" data-index="7" min="-12" max="12" value="0" step="0.1" class="slider-vertical eq-band">
                    <span class="text-[10px] font-bold text-slate-400 mt-3">12k</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast UI -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-800 border border-slate-700 text-blue-400 px-6 py-3 rounded-full shadow-2xl transition-all opacity-0 pointer-events-none text-sm font-bold z-50">
        설정값이 적용되었습니다!
    </div>

    <script>
        let audioCtx = null;
        let noiseSource = null;
        let filters = [];
        let masterGain = null;
        let isPlaying = false;
        let autoSaveTimer = null;

        const STORAGE_KEY = 'noise_machine_v3_config';
        const FREQUENCIES = [60, 170, 310, 600, 1000, 3000, 6000, 12000];
        const PRESETS = {
            white: [0, 0, 0, 0, 0, 0, 0, 0],
            brown: [12, 9, 4, -2, -6, -9, -11, -12],
            pink: [6, 4, 2, 0, -2, -4, -6, -8],
            deepSleep: [10, 8, 5, 0, -5, -10, -12, -12],
            focus: [-8, -4, 2, 6, 4, 0, -6, -10],
            reset: [0, 0, 0, 0, 0, 0, 0, 0]
        };

        const elements = {
            playBtn: document.getElementById('playBtn'),
            btnIcon: document.getElementById('btnIcon'),
            btnText: document.getElementById('btnText'),
            masterVolume: document.getElementById('masterVolume'),
            volPercent: document.getElementById('volPercent'),
            eqSliders: document.querySelectorAll('.eq-band'),
            configInput: document.getElementById('configInput'),
            importInput: document.getElementById('importInput'),
            toast: document.getElementById('toast'),
            saveStatus: document.getElementById('saveStatus')
        };

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            const bufferSize = 2 * audioCtx.sampleRate;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

            noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = buffer;
            noiseSource.loop = true;

            filters = Array.from(elements.eqSliders).map((slider, i) => {
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'peaking';
                filter.frequency.value = FREQUENCIES[i];
                filter.Q.value = 1.2;
                filter.gain.value = parseFloat(slider.value);
                return filter;
            });

            masterGain = audioCtx.createGain();
            masterGain.gain.value = parseFloat(elements.masterVolume.value);

            let connection = noiseSource;
            filters.forEach(f => {
                connection.connect(f);
                connection = f;
            });
            connection.connect(masterGain);
            masterGain.connect(audioCtx.destination);
            noiseSource.start();
        }

        elements.playBtn.addEventListener('click', async () => {
            if (!audioCtx) initAudio();
            if (isPlaying) {
                await audioCtx.suspend();
                elements.btnIcon.textContent = '▶';
                elements.btnText.textContent = '재생 시작';
                elements.playBtn.classList.replace('from-red-600', 'from-blue-600');
            } else {
                await audioCtx.resume();
                elements.btnIcon.textContent = '⏸';
                elements.btnText.textContent = '일시 정지';
                elements.playBtn.classList.replace('from-blue-600', 'from-red-600');
            }
            isPlaying = !isPlaying;
        });

        elements.masterVolume.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            elements.volPercent.textContent = Math.round(val * 100) + '%';
            if (masterGain) masterGain.gain.setTargetAtTime(val, audioCtx.currentTime, 0.05);
            onStateChange();
        });

        elements.eqSliders.forEach((slider, i) => {
            slider.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                if (filters[i]) filters[i].gain.setTargetAtTime(val, audioCtx.currentTime, 0.05);
                onStateChange();
            });
        });

        window.applyPreset = (name) => {
            const values = PRESETS[name];
            if (!values) return;
            values.forEach((val, i) => {
                elements.eqSliders[i].value = val;
                if (filters[i]) filters[i].gain.setTargetAtTime(val, audioCtx.currentTime, 0.1);
            });
            onStateChange();
            showToast('프리셋이 적용되었습니다!');
        };

        // --- Core Logic: State, Storage & Config Code ---

        function onStateChange() {
            const code = generateConfigCode();
            elements.configInput.value = code;
            
            // Debounce LocalStorage save to avoid heavy operations
            clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(() => {
                saveToLocalStorage(code);
            }, 500);
        }

        function generateConfigCode() {
            const vol = Math.round(elements.masterVolume.value * 100);
            const eq = Array.from(elements.eqSliders).map(s => Math.round(parseFloat(s.value) * 10) / 10).join(',');
            return `v${vol}|e${eq}`;
        }

        function saveToLocalStorage(code) {
            try {
                localStorage.setItem(STORAGE_KEY, code);
                elements.saveStatus.style.opacity = '1';
                setTimeout(() => elements.saveStatus.style.opacity = '0', 2000);
            } catch (e) {
                console.warn('LocalStorage is blocked or full.');
            }
        }

        function loadFromLocalStorage() {
            try {
                const savedCode = localStorage.getItem(STORAGE_KEY);
                if (savedCode) {
                    applyConfigCode(savedCode, false);
                } else {
                    onStateChange(); // Default state
                }
            } catch (e) {
                console.warn('LocalStorage access denied.');
                onStateChange();
            }
        }

        function applyConfigCode(code, notify = true) {
            if (!code || !code.includes('|')) return false;

            try {
                const parts = code.split('|');
                const volPart = parts.find(p => p.startsWith('v'))?.substring(1);
                const eqPart = parts.find(p => p.startsWith('e'))?.substring(1);

                if (volPart) {
                    const volVal = parseInt(volPart) / 100;
                    elements.masterVolume.value = volVal;
                    elements.volPercent.textContent = volPart + '%';
                    if (masterGain) masterGain.gain.setTargetAtTime(volVal, audioCtx.currentTime, 0.05);
                }

                if (eqPart) {
                    const eqVals = eqPart.split(',');
                    eqVals.forEach((val, i) => {
                        if (elements.eqSliders[i]) {
                            elements.eqSliders[i].value = val;
                            if (filters[i]) filters[i].gain.setTargetAtTime(parseFloat(val), audioCtx.currentTime, 0.1);
                        }
                    });
                }

                elements.configInput.value = code;
                if (notify) showToast('설정을 성공적으로 불러왔습니다!');
                return true;
            } catch (e) {
                if (notify) showToast('코드 형식이 잘못되었습니다.');
                return false;
            }
        }

        function copyConfig() {
            elements.configInput.select();
            document.execCommand('copy');
            showToast('설정 코드가 클립보드에 복사되었습니다!');
        }

        window.importConfig = () => {
            const code = elements.importInput.value.trim();
            if (applyConfigCode(code)) {
                elements.importInput.value = '';
                saveToLocalStorage(code);
            }
        };

        function showToast(msg) {
            elements.toast.textContent = msg;
            elements.toast.style.opacity = '1';
            setTimeout(() => elements.toast.style.opacity = '0', 2000);
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
        });
    </script>
</body>
</html>
