<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>바로 영어 - 원어민 표현 변환기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap");

      body {
        font-family:
          "Pretendard",
          -apple-system,
          BlinkMacSystemFont,
          system-ui,
          Roboto,
          sans-serif;
        background-color: #f8fafc;
        overflow-y: auto;
      }

      .mic-active {
        animation: pulse 1.5s infinite;
        background-color: #ef4444 !important;
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
        }
        70% {
          transform: scale(1.1);
          box-shadow: 0 0 0 15px rgba(239, 68, 68, 0);
        }
        100% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
        }
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .progress-ring__circle {
        transition: stroke-dashoffset 0.1s linear;
        transform: rotate(-90deg);
        transform-origin: 50% 50%;
        stroke-linecap: round;
      }

      @keyframes shadow-pulse {
        0% {
          filter: drop-shadow(0 0 2px rgba(37, 99, 235, 0.2));
        }
        50% {
          filter: drop-shadow(0 0 8px rgba(37, 99, 235, 0.5));
        }
        100% {
          filter: drop-shadow(0 0 2px rgba(37, 99, 235, 0.2));
        }
      }

      .loading-active {
        animation: shadow-pulse 1.5s infinite;
      }

      .mode-btn.active {
        background-color: #2563eb;
        color: white;
        border-color: #2563eb;
      }

      .voice-card {
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
        border: 2px solid transparent;
      }

      .voice-card.selected {
        border-color: #2563eb;
        background-color: #eff6ff;
        transform: translateY(-2px);
      }

      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
    </style>
  </head>
  <body
    class="min-h-screen flex flex-col items-center justify-start py-12 px-4"
  >
    <div class="max-w-xl w-full space-y-8">
      <header class="text-center space-y-2">
        <h1 class="text-4xl font-black text-blue-600 tracking-tight">
          바로 영어
        </h1>
        <p class="text-slate-500 font-medium text-lg">
          한국어로 말하면 즉시 원어민 표현으로
        </p>
      </header>

      <div class="glass-card rounded-[2.5rem] p-8 shadow-2xl space-y-8">
        <!-- 캐릭터 보이스 선택 -->
        <div class="space-y-4">
          <div class="flex justify-between items-end px-1">
            <label
              class="text-xs font-bold text-slate-400 uppercase tracking-wider"
              >캐릭터 설정</label
            >
            <span id="selectedVoiceName" class="text-xs font-bold text-blue-600"
              >엠마 (Emma)</span
            >
          </div>
          <div class="grid grid-cols-2 gap-4" id="voiceGrid">
            <div
              onclick="selectVoice('Leda', '엠마 (Emma)')"
              id="v-Leda"
              class="voice-card selected p-4 rounded-2xl bg-white shadow-sm border border-slate-100 flex items-center space-x-3"
            >
              <div class="text-3xl">👩‍💼</div>
              <div>
                <div class="font-bold text-sm text-slate-800">엠마</div>
                <div class="text-[10px] text-slate-500 italic">
                  친절하고 명확한
                </div>
              </div>
            </div>
            <div
              onclick="selectVoice('Despina', '소피아 (Sophia)')"
              id="v-Despina"
              class="voice-card p-4 rounded-2xl bg-white shadow-sm border border-slate-100 flex items-center space-x-3"
            >
              <div class="text-3xl">🙋‍♀️</div>
              <div>
                <div class="font-bold text-sm text-slate-800">소피아</div>
                <div class="text-[10px] text-slate-500 italic">
                  밝고 에너제틱한
                </div>
              </div>
            </div>
            <div
              onclick="selectVoice('Charon', '제임스 (James)')"
              id="v-Charon"
              class="voice-card p-4 rounded-2xl bg-white shadow-sm border border-slate-100 flex items-center space-x-3"
            >
              <div class="text-3xl">👨‍💼</div>
              <div>
                <div class="font-bold text-sm text-slate-800">제임스</div>
                <div class="text-[10px] text-slate-500 italic">
                  신뢰감 있고 지적인
                </div>
              </div>
            </div>
            <div
              onclick="selectVoice('Puck', '루카스 (Lucas)')"
              id="v-Puck"
              class="voice-card p-4 rounded-2xl bg-white shadow-sm border border-slate-100 flex items-center space-x-3"
            >
              <div class="text-3xl">👦</div>
              <div>
                <div class="font-bold text-sm text-slate-800">루카스</div>
                <div class="text-[10px] text-slate-500 italic">
                  장난기 넘치는 소년
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 출력 방식 설정 -->
        <div class="space-y-4">
          <label
            class="text-xs font-bold text-slate-400 uppercase tracking-wider ml-1"
            >출력 방식</label
          >
          <div class="grid grid-cols-3 gap-2 p-1.5 bg-slate-100 rounded-2xl">
            <button
              onclick="setMode('text')"
              id="mode-text"
              class="mode-btn py-3 px-4 rounded-xl text-sm font-bold transition-all border border-transparent hover:bg-white/50 text-slate-600 active"
            >
              텍스트
            </button>
            <button
              onclick="setMode('voice')"
              id="mode-voice"
              class="mode-btn py-3 px-4 rounded-xl text-sm font-bold transition-all border border-transparent hover:bg-white/50 text-slate-600"
            >
              음성 전용
            </button>
            <button
              onclick="setMode('both')"
              id="mode-both"
              class="mode-btn py-3 px-4 rounded-xl text-sm font-bold transition-all border border-transparent hover:bg-white/50 text-slate-600"
            >
              동시 출력
            </button>
          </div>
        </div>

        <!-- 결과 표시 영역 (스크롤 가능 박스 고정) -->
        <div class="space-y-4">
          <div
            class="bg-slate-50 rounded-[2rem] border border-slate-100 shadow-inner relative flex flex-col h-[280px]"
          >
            <!-- 컨트롤 영역 (로딩 링 + 재생버튼) -->
            <div
              class="absolute top-6 right-6 flex items-center space-x-4 z-10"
            >
              <div
                id="statusIndicator"
                class="relative w-10 h-10 opacity-0 transition-opacity duration-300"
              >
                <svg class="w-full h-full" viewBox="0 0 36 36">
                  <circle
                    class="text-slate-200"
                    stroke-width="3"
                    stroke="currentColor"
                    fill="transparent"
                    r="16"
                    cx="18"
                    cy="18"
                  />
                  <circle
                    id="progressCircle"
                    class="text-blue-600 progress-ring__circle"
                    stroke-width="3"
                    stroke-dasharray="100"
                    stroke-dashoffset="100"
                    stroke="currentColor"
                    fill="transparent"
                    r="16"
                    cx="18"
                    cy="18"
                  />
                </svg>
              </div>
              <button
                id="replayBtn"
                onclick="replayAudio()"
                class="hidden p-3 bg-white shadow-lg rounded-full text-blue-600 hover:bg-blue-50 transition-all active:scale-90 border border-slate-100"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-6 w-6"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"
                  />
                </svg>
              </button>
            </div>

            <!-- 내부 스크롤 영역 -->
            <div class="p-8 overflow-y-auto flex-1">
              <div
                id="inputDisplay"
                class="text-[11px] text-blue-500 mb-4 font-bold uppercase tracking-widest pr-16 break-words"
              ></div>
              <div
                id="outputDisplay"
                class="text-2xl font-bold text-slate-800 leading-tight pr-12 break-words"
              >
                <span class="text-slate-300"
                  >하단 마이크를 눌러 말씀하세요.</span
                >
              </div>
            </div>
          </div>
        </div>

        <!-- 마이크 제어 -->
        <div class="flex justify-center pb-2">
          <button
            id="micBtn"
            class="w-24 h-24 bg-blue-600 rounded-[2rem] flex items-center justify-center text-white shadow-2xl shadow-blue-200 transition-all active:scale-95 hover:bg-blue-700"
          >
            <svg
              id="micIcon"
              xmlns="http://www.w3.org/2000/svg"
              class="h-10 w-10"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"
              />
            </svg>
          </button>
        </div>
      </div>

      <p
        class="text-center text-slate-400 text-[10px] font-bold uppercase tracking-widest pb-8"
      >
        Advanced Native Expression Engine
      </p>
    </div>

    <div
      id="toast"
      class="fixed bottom-10 left-1/2 -translate-x-1/2 px-6 py-3 bg-slate-900 text-white text-sm rounded-2xl opacity-0 transition-opacity duration-300 pointer-events-none z-50 shadow-2xl"
    >
      알림
    </div>

    <script>
      const apiKey = "AIzaSyBRn6K-inr1Y0cmjpSVMKJ9QArnuQpu_UA";
      let recognition;
      let isRecording = false;
      let currentOutputMode = "text";
      let currentVoice = "Leda";
      let lastTranslatedText = "";

      let cachedAudio = { url: null, voice: null, text: null, element: null };
      let progressAnimId = null;

      const micBtn = document.getElementById("micBtn");
      const inputDisplay = document.getElementById("inputDisplay");
      const outputDisplay = document.getElementById("outputDisplay");
      const statusIndicator = document.getElementById("statusIndicator");
      const progressCircle = document.getElementById("progressCircle");
      const replayBtn = document.getElementById("replayBtn");
      const toast = document.getElementById("toast");
      const selectedVoiceName = document.getElementById("selectedVoiceName");

      function selectVoice(voiceId, displayName) {
        if (currentVoice === voiceId) return;
        currentVoice = voiceId;
        selectedVoiceName.textContent = displayName;
        document
          .querySelectorAll(".voice-card")
          .forEach((card) => card.classList.remove("selected"));
        document.getElementById(`v-${voiceId}`).classList.add("selected");

        if (cachedAudio.element) cachedAudio.element.pause();
        clearAudioCache();
        showToast(`${displayName} 캐릭터 선택됨`);
      }

      function clearAudioCache() {
        if (cachedAudio.url) URL.revokeObjectURL(cachedAudio.url);
        cachedAudio = { url: null, voice: null, text: null, element: null };
      }

      function setMode(mode) {
        currentOutputMode = mode;
        document
          .querySelectorAll(".mode-btn")
          .forEach((btn) => btn.classList.remove("active"));
        document.getElementById(`mode-${mode}`).classList.add("active");
      }

      function startLoadingUI() {
        cancelAnimationFrame(progressAnimId);
        statusIndicator.style.opacity = "1";
        statusIndicator.classList.add("loading-active");
        let start = null;
        const duration = 2500;
        function animate(timestamp) {
          if (!start) start = timestamp;
          const elapsed = timestamp - start;
          const progress = Math.min(elapsed / duration, 0.92);
          const offset = 100 - progress * 100;
          progressCircle.style.strokeDashoffset = offset;
          if (progress < 0.92) progressAnimId = requestAnimationFrame(animate);
        }
        progressAnimId = requestAnimationFrame(animate);
      }

      function finishLoadingUI() {
        cancelAnimationFrame(progressAnimId);
        progressCircle.style.strokeDashoffset = "0";
        setTimeout(() => {
          statusIndicator.style.opacity = "0";
          statusIndicator.classList.remove("loading-active");
          setTimeout(
            () => (progressCircle.style.strokeDashoffset = "100"),
            300,
          );
        }, 400);
      }

      const initRecognition = () => {
        const SpeechRecognition =
          window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return null;
        const rec = new SpeechRecognition();
        rec.lang = "ko-KR";
        rec.continuous = false;
        rec.onstart = () => {
          isRecording = true;
          micBtn.classList.add("mic-active");
          inputDisplay.textContent = "듣고 있습니다...";
          outputDisplay.textContent = "";
          replayBtn.classList.add("hidden");
          clearAudioCache();
        };
        rec.onresult = async (event) => {
          const transcript = event.results[0][0].transcript;
          inputDisplay.textContent = `한국어 입력: "${transcript}"`;
          await processTranslation(transcript);
        };
        rec.onerror = stopRecording;
        rec.onend = stopRecording;
        return rec;
      };

      recognition = initRecognition();

      function stopRecording() {
        isRecording = false;
        micBtn.classList.remove("mic-active");
      }

      micBtn.onclick = () => {
        if (isRecording) recognition.stop();
        else recognition.start();
      };

      const showToast = (msg) => {
        toast.textContent = msg;
        toast.style.opacity = "1";
        setTimeout(() => (toast.style.opacity = "0"), 2000);
      };

      async function fetchWithRetry(url, options, retries = 5, backoff = 1000) {
        try {
          const response = await fetch(url, options);
          if (!response.ok) throw new Error("API Error");
          return await response.json();
        } catch (err) {
          if (retries > 0) {
            await new Promise((r) => setTimeout(r, backoff));
            return fetchWithRetry(url, options, retries - 1, backoff * 2);
          }
          throw err;
        }
      }

      async function processTranslation(text) {
        startLoadingUI();
        const prompt =
          "Act as an expert English translator. Convert the following Korean into a very natural, modern, native-level English expression. Provide only the translated English sentence, no explanations.";
        try {
          const result = await fetchWithRetry(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [{ parts: [{ text: text }] }],
                systemInstruction: { parts: [{ text: prompt }] },
              }),
            },
          );
          lastTranslatedText =
            result.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "";
          if (currentOutputMode !== "voice")
            outputDisplay.textContent = lastTranslatedText;
          else outputDisplay.textContent = "🔊 원어민 표현 재생 중...";

          if (currentOutputMode === "voice" || currentOutputMode === "both")
            await speakText(lastTranslatedText);
          else {
            replayBtn.classList.remove("hidden");
            finishLoadingUI();
          }
        } catch (error) {
          outputDisplay.textContent = "번역 중 오류가 발생했습니다.";
          finishLoadingUI();
        }
      }

      async function speakText(text) {
        if (!text) return;
        if (
          cachedAudio.url &&
          cachedAudio.text === text &&
          cachedAudio.voice === currentVoice
        ) {
          replayAudio();
          return;
        }
        const activeVoice = currentVoice;
        try {
          const result = await fetchWithRetry(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [
                  { parts: [{ text: `Say this naturally: ${text}` }] },
                ],
                generationConfig: {
                  responseModalities: ["AUDIO"],
                  speechConfig: {
                    voiceConfig: {
                      prebuiltVoiceConfig: { voiceName: activeVoice },
                    },
                  },
                },
              }),
            },
          );
          const audioData =
            result.candidates[0].content.parts[0].inlineData.data;
          const sampleRate =
            parseInt(
              result.candidates[0].content.parts[0].inlineData.mimeType.split(
                "rate=",
              )[1],
            ) || 24000;
          const binaryString = window.atob(audioData);
          const bytes = new Uint8Array(binaryString.length);
          for (let i = 0; i < binaryString.length; i++)
            bytes[i] = binaryString.charCodeAt(i);
          const blob = new Blob([createWavFile(bytes.buffer, sampleRate)], {
            type: "audio/wav",
          });
          if (cachedAudio.url) URL.revokeObjectURL(cachedAudio.url);
          const url = URL.createObjectURL(blob);
          cachedAudio = {
            url,
            voice: activeVoice,
            text,
            element: new Audio(url),
          };
          cachedAudio.element.play();
          replayBtn.classList.remove("hidden");
          if (currentOutputMode === "voice") outputDisplay.textContent = text;
        } catch (error) {
          showToast("음성 생성 실패");
        } finally {
          finishLoadingUI();
        }
      }

      function replayAudio() {
        if (cachedAudio.element && cachedAudio.voice === currentVoice) {
          cachedAudio.element.currentTime = 0;
          cachedAudio.element.play();
        } else if (lastTranslatedText) {
          startLoadingUI();
          speakText(lastTranslatedText);
        }
      }

      function createWavFile(pcmData, sampleRate) {
        const header = new ArrayBuffer(44);
        const view = new DataView(header);
        const writeString = (v, o, s) => {
          for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i));
        };
        writeString(view, 0, "RIFF");
        view.setUint32(4, 36 + pcmData.byteLength, true);
        writeString(view, 8, "WAVE");
        writeString(view, 12, "fmt ");
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeString(view, 36, "data");
        view.setUint32(40, pcmData.byteLength, true);
        const wav = new Uint8Array(header.byteLength + pcmData.byteLength);
        wav.set(new Uint8Array(header), 0);
        wav.set(new Uint8Array(pcmData), 44);
        return wav;
      }
    </script>
  </body>
</html>
