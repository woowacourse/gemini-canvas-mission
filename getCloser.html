<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>친해지길 바래 - 랜덤 그룹핑 게임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f3f4f6;
        }
        canvas {
            display: block;
            margin: 0 auto;
            background: #1e293b;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            max-width: 100%;
        }
        .participant-tag {
            transition: all 0.2s;
        }
        .participant-tag:hover {
            transform: scale(1.05);
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shake-animation {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
    </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col items-center py-10 px-4">

    <div class="max-w-4xl w-full bg-white rounded-2xl shadow-xl overflow-hidden">
        <!-- 헤더 영역 -->
        <div class="bg-indigo-600 p-6 text-center">
            <h1 class="text-3xl font-bold text-white mb-2">🤝 친해지길 바래</h1>
            <p class="text-indigo-100">모임의 새로운 구성원들과 함께할 그룹을 재미있게 뽑아보세요!</p>
        </div>

        <!-- 1. 설정 화면 (이름 입력 및 그룹 수 설정) -->
        <div id="setup-screen" class="p-8 fade-in">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- 이름 입력 섹션 -->
                <div class="space-y-4">
                    <h2 class="text-xl font-bold text-gray-700 border-b pb-2">1. 참여자 추가</h2>
                    <form id="add-form" class="flex gap-2">
                        <input type="text" id="name-input" class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="이름을 입력하세요 (예: 홍길동)" autocomplete="off">
                        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition-colors">추가</button>
                    </form>
                    
                    <div class="bg-gray-50 rounded-lg p-4 min-h-[150px] border border-gray-200">
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-sm font-medium text-gray-500">참여자 목록 (<span id="participant-count">0</span>명)</span>
                            <button type="button" id="clear-btn" class="text-xs text-red-500 hover:text-red-700 font-medium">전체 삭제</button>
                        </div>
                        <div id="participant-list" class="flex flex-wrap gap-2">
                            <!-- 참여자 태그가 여기에 추가됩니다 -->
                        </div>
                    </div>
                </div>

                <!-- 그룹 설정 및 시작 섹션 -->
                <div class="space-y-4">
                    <h2 class="text-xl font-bold text-gray-700 border-b pb-2">2. 그룹 설정</h2>
                    <div class="flex flex-col gap-2">
                        <label for="group-count" class="font-medium text-gray-700">생성할 그룹의 수:</label>
                        <input type="number" id="group-count" min="2" max="10" value="2" class="border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 w-full">
                        <p class="text-sm text-gray-500">최소 2개 이상의 그룹이 필요합니다.</p>
                    </div>

                    <div class="pt-6">
                        <button id="start-game-btn" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold text-lg py-4 px-6 rounded-xl shadow-lg transform transition-transform hover:scale-[1.02] disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100" disabled>
                            🎲 핀볼 그룹핑 시작하기
                        </button>
                        <p id="start-warning" class="text-center text-sm text-red-500 mt-2 hidden">참여자가 그룹 수보다 많아야 합니다.</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. 게임 화면 (핀볼 캔버스) -->
        <div id="game-screen" class="hidden p-8 flex-col items-center bg-gray-900 fade-in">
            <h2 class="text-2xl font-bold text-white mb-6">운명의 핀볼 구르기!</h2>
            <canvas id="pinball-canvas" width="800" height="600"></canvas>
            <div class="mt-6 flex flex-col sm:flex-row items-center gap-4">
                <button id="shake-btn" class="bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-bold py-3 px-8 rounded-xl shadow-lg transform transition-transform hover:scale-105">
                    👋 판 흔들기
                </button>
                <button id="skip-btn" class="text-gray-400 hover:text-white underline text-sm transition-colors mt-2 sm:mt-0">
                    결과 바로보기
                </button>
            </div>
        </div>

        <!-- 3. 결과 화면 -->
        <div id="result-screen" class="hidden p-8 fade-in">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-indigo-600 mb-2">🎉 그룹핑 완료!</h2>
                <p class="text-gray-600">모든 인원이 균등하게 배정되었습니다. 새로운 사람들과 인사해보세요!</p>
            </div>
            
            <div id="result-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- 결과 카드가 여기에 추가됩니다 -->
            </div>

            <div class="mt-10 text-center">
                <button id="restart-btn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium py-3 px-8 rounded-lg transition-colors">다시하기</button>
            </div>
        </div>
    </div>

    <script>
        // 상태 관리 변수
        let participants = [];
        let numGroups = 2;
        let finalGroups = [];
        
        // DOM 요소
        const setupScreen = document.getElementById('setup-screen');
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        
        const nameInput = document.getElementById('name-input');
        const addForm = document.getElementById('add-form');
        const participantList = document.getElementById('participant-list');
        const participantCount = document.getElementById('participant-count');
        const clearBtn = document.getElementById('clear-btn');
        const groupCountInput = document.getElementById('group-count');
        const startGameBtn = document.getElementById('startGame-btn') || document.getElementById('start-game-btn');
        const startWarning = document.getElementById('start-warning');
        const resultGrid = document.getElementById('result-grid');
        const restartBtn = document.getElementById('restart-btn');
        const skipBtn = document.getElementById('skip-btn');
        const shakeBtn = document.getElementById('shake-btn');

        // 참여자 추가 이벤트
        addForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = nameInput.value.trim();
            if (name && !participants.includes(name)) {
                participants.push(name);
                updateParticipantUI();
                nameInput.value = '';
            } else if (participants.includes(name)) {
                alert('이미 등록된 이름입니다.');
            }
        });

        // 참여자 삭제 (개별)
        function removeParticipant(name) {
            participants = participants.filter(p => p !== name);
            updateParticipantUI();
        }

        // 전체 삭제
        clearBtn.addEventListener('click', () => {
            participants = [];
            updateParticipantUI();
        });

        // 그룹 수 변경
        groupCountInput.addEventListener('input', () => {
            numGroups = parseInt(groupCountInput.value) || 2;
            updateStartButtonState();
        });

        // UI 업데이트
        function updateParticipantUI() {
            participantCount.textContent = participants.length;
            participantList.innerHTML = '';
            
            participants.forEach(name => {
                const tag = document.createElement('div');
                tag.className = 'participant-tag bg-indigo-100 text-indigo-800 px-3 py-1.5 rounded-full text-sm font-medium flex items-center gap-2 cursor-pointer shadow-sm';
                tag.innerHTML = `
                    ${name}
                    <button class="text-indigo-400 hover:text-indigo-600 font-bold ml-1 focus:outline-none">&times;</button>
                `;
                tag.addEventListener('click', () => removeParticipant(name));
                participantList.appendChild(tag);
            });

            updateStartButtonState();
        }

        // 시작 버튼 상태 확인
        function updateStartButtonState() {
            if (participants.length >= numGroups && participants.length > 0) {
                startGameBtn.disabled = false;
                startWarning.classList.add('hidden');
            } else {
                startGameBtn.disabled = true;
                startWarning.classList.remove('hidden');
            }
        }

        // 그룹별 최대 정원 계산 (균등 분배를 위한 설정)
        let groupCapacities = [];
        
        function calculateCapacities() {
            const total = participants.length;
            const base = Math.floor(total / numGroups);
            const remainder = total % numGroups;
            
            groupCapacities = Array(numGroups).fill(base);
            
            // 인원이 완벽히 나누어떨어지지 않을 경우, 남은 인원을 무작위 그룹에 1명씩 추가 정원으로 배정합니다.
            let indices = Array.from({length: numGroups}, (_, i) => i).sort(() => Math.random() - 0.5);
            for(let i = 0; i < remainder; i++) {
                groupCapacities[indices[i]]++;
            }
            
            // 결과를 담을 배열 초기화
            finalGroups = Array.from({ length: numGroups }, () => []);
        }

        // ----------------------------------------------------
        // 핀볼(플링코) 캔버스 엔진
        // ----------------------------------------------------
        const canvas = document.getElementById('pinball-canvas');
        const ctx = canvas.getContext('2d');
        let animationId;
        let isSimulating = false;
        
        let pegs = [];
        let buckets = [];
        let balls = [];
        let ballQueue = [];
        let spawnTimer = 0;
        
        const colors = ['#f87171', '#60a5fa', '#34d399', '#fbbf24', '#a78bfa', '#f472b6', '#38bdf8', '#a3e635', '#facc15', '#e879f9'];

        class Ball {
            constructor(name) {
                this.name = name;
                this.radius = 12;
                // 시작 X 좌표를 상단 전체 영역에서 무작위로 설정하여 더 다채롭게 떨어지게 합니다.
                this.x = canvas.width / 2 + (Math.random() - 0.5) * (canvas.width * 0.8);
                this.y = -20;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = 0;
                this.color = '#cbd5e1'; // 초기 색상은 회색으로 지정합니다.
                this.isSettled = false;
                this.assignedGroupIndex = -1; // 실시간으로 할당될 그룹 인덱스입니다.
            }

            update(bucketWidth) {
                if (this.isSettled) return;

                // 중력 적용
                this.vy += 0.15;

                // 마찰력 및 공기 저항
                this.vx *= 0.99;
                this.vy *= 0.99;

                const bucketTop = canvas.height - 100;

                // 공이 버킷 위쪽에 있을 때: 비어있는 버킷 방향으로 아주 약한 유도력을 주어 원활한 진행을 돕습니다.
                if (this.assignedGroupIndex === -1 && this.y < bucketTop) {
                    let nearestAvailable = -1;
                    let minDistance = Infinity;

                    for (let i = 0; i < numGroups; i++) {
                        if (finalGroups[i].length < groupCapacities[i]) {
                            const targetX = (i * bucketWidth) + (bucketWidth / 2);
                            const dist = Math.abs(targetX - this.x);
                            if (dist < minDistance) {
                                minDistance = dist;
                                nearestAvailable = i;
                            }
                        }
                    }

                    if (nearestAvailable !== -1) {
                        const targetX = (nearestAvailable * bucketWidth) + (bucketWidth / 2);
                        const pullForce = (targetX - this.x) * 0.0005; // 부드러운 유도
                        this.vx += pullForce;
                    }
                }

                // 위치 업데이트
                this.x += this.vx;
                this.y += this.vy;

                // 벽면 충돌 (전체 캔버스)
                if (this.x < this.radius) {
                    this.x = this.radius;
                    this.vx *= -0.8;
                } else if (this.x > canvas.width - this.radius) {
                    this.x = canvas.width - this.radius;
                    this.vx *= -0.8;
                }

                // 버킷(팀 입구) 영역 물리 및 배정 로직
                if (this.y + this.radius > bucketTop) {
                    let currentBucketIndex = Math.floor(this.x / bucketWidth);
                    currentBucketIndex = Math.max(0, Math.min(numGroups - 1, currentBucketIndex));
                    
                    const isFull = finalGroups[currentBucketIndex] && finalGroups[currentBucketIndex].length >= groupCapacities[currentBucketIndex];

                    // 1. 그룹이 꽉 찼고 아직 배정되지 않은 공이라면 뚜껑을 물리적인 벽으로 취급하여 튕겨냅니다.
                    if (this.assignedGroupIndex === -1 && isFull) {
                        if (this.y - this.radius < bucketTop + 10) {
                            this.y = bucketTop - this.radius;
                            this.vy *= -0.7; // 위로 강하게 튕겨냄
                            this.vx += (Math.random() - 0.5) * 4; // 무작위 좌우 튕김으로 다른 곳을 찾게 유도
                        }
                    } else {
                        // 2. 버킷 내부 벽면 충돌 처리 (들어온 공이 옆 그룹으로 뚫고 나가지 못하게 함)
                        const leftWall = currentBucketIndex * bucketWidth;
                        const rightWall = (currentBucketIndex + 1) * bucketWidth;

                        if (this.x - this.radius < leftWall) {
                            this.x = leftWall + this.radius;
                            this.vx *= -0.5;
                        } else if (this.x + this.radius > rightWall) {
                            this.x = rightWall - this.radius;
                            this.vx *= -0.5;
                        }

                        // 3. 물리적으로 버킷 안으로 충분히 들어왔을 때 비로소 소속 그룹을 확정합니다.
                        if (this.assignedGroupIndex === -1 && this.y > bucketTop + 20) {
                            this.assignedGroupIndex = currentBucketIndex;
                            finalGroups[this.assignedGroupIndex].push(this.name);
                            this.color = colors[this.assignedGroupIndex % colors.length];
                        }
                    }
                }

                // 페그(장애물) 충돌 검사
                // 버킷 진입 전(위쪽 영역)일 때만 페그와 충돌합니다.
                if (this.y < bucketTop) {
                    for (let peg of pegs) {
                        const dx = this.x - peg.x;
                        const dy = this.y - peg.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        const minDist = this.radius + peg.radius;

                        if (distance < minDist) {
                            // 충돌 시 밀어내기 및 반사 적용
                            const angle = Math.atan2(dy, dx);
                            const pushOut = minDist - distance;
                            this.x += Math.cos(angle) * pushOut;
                            this.y += Math.sin(angle) * pushOut;

                            // 속도 벡터 반사 처리
                            const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                            this.vx = Math.cos(angle) * speed * 0.6; // 탄성 계수 감소
                            this.vy = Math.sin(angle) * speed * 0.6;
                        }
                    }
                }

                // 바닥 (버킷 바닥) 충돌 및 정착
                if (this.y > canvas.height - this.radius) {
                    this.y = canvas.height - this.radius;
                    this.vy *= -0.2; // 튕김을 대폭 줄입니다.
                    this.vx *= 0.5; // 바닥 마찰
                    
                    if (Math.abs(this.vy) < 0.5 && Math.abs(this.vx) < 0.5) {
                        this.isSettled = true;
                    }
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.closePath();

                // 이름 텍스트
                ctx.fillStyle = '#ffffff';
                ctx.font = '10px Noto Sans KR';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                // 텍스트가 너무 길면 자릅니다.
                const displayText = this.name.length > 3 ? this.name.substring(0,2) + '..' : this.name;
                ctx.fillText(displayText, this.x, this.y - 18);
            }
        }

        function initPinball() {
            pegs = [];
            balls = [];
            ballQueue = [];
            spawnTimer = 0;
            
            // 페그(장애물) 생성
            const rows = 10;
            const cols = 15;
            const spacingX = canvas.width / cols;
            const spacingY = (canvas.height - 150) / rows; // 하단 버킷 공간 확보

            for (let r = 0; r < rows; r++) {
                // 홀수 줄은 반 칸씩 이동하여 지그재그 패턴 생성
                const offset = (r % 2 === 0) ? 0 : spacingX / 2;
                for (let c = 0; c <= cols; c++) {
                    pegs.push({
                        x: c * spacingX + offset,
                        y: r * spacingY + 50, // 상단 여백
                        radius: 5
                    });
                }
            }

            // 대기열에 공 생성 (결과를 미리 정하지 않고 이름만 넣어 랜덤하게 떨어뜨립니다)
            const shuffledParticipants = [...participants].sort(() => 0.5 - Math.random());
            shuffledParticipants.forEach(personName => {
                ballQueue.push(new Ball(personName));
            });
        }

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 페그 그리기
            ctx.fillStyle = '#475569';
            for (let peg of pegs) {
                ctx.beginPath();
                ctx.arc(peg.x, peg.y, peg.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.closePath();
            }

            // 하단 버킷(그룹) 영역 그리기
            const bucketWidth = canvas.width / numGroups;
            for (let i = 0; i < numGroups; i++) {
                const x = i * bucketWidth;
                
                // 버킷 구분선
                ctx.fillStyle = '#334155';
                ctx.fillRect(x, canvas.height - 100, 2, 100);
                
                // 그룹 텍스트
                ctx.fillStyle = '#94a3b8';
                ctx.font = 'bold 16px Noto Sans KR';
                ctx.textAlign = 'center';
                ctx.fillText(`Group ${i + 1}`, x + bucketWidth / 2, canvas.height - 20);
                
                // 해당 그룹이 꽉 찼는지 확인합니다.
                const isFull = finalGroups[i] && groupCapacities[i] && finalGroups[i].length >= groupCapacities[i];
                
                // 버킷 배경 하이라이트 (꽉 차면 색상을 더 진하게 표시합니다)
                ctx.fillStyle = colors[i % colors.length];
                ctx.globalAlpha = isFull ? 0.3 : 0.1;
                ctx.fillRect(x + 2, canvas.height - 100, bucketWidth - 4, 100);
                ctx.globalAlpha = 1.0;

                // 꽉 찬 그룹은 시각적으로 FULL 텍스트와 뚜껑을 표시합니다.
                if (isFull) {
                    ctx.fillStyle = '#ef4444'; // 빨간색 텍스트
                    ctx.font = 'bold 14px Noto Sans KR';
                    ctx.fillText('FULL', x + bucketWidth / 2, canvas.height - 60);
                    
                    // 뚜껑 표시 (공이 들어갈 수 없음을 시각적으로 나타냅니다)
                    ctx.fillRect(x + 2, canvas.height - 100, bucketWidth - 4, 4);
                }
            }
        }

        function animatePinball() {
            if (!isSimulating) return;

            drawBoard();
            const bucketWidth = canvas.width / numGroups;

            // 공 생성 로직
            if (ballQueue.length > 0) {
                spawnTimer++;
                // 약 45프레임(약 0.7초)마다 공 하나씩 투하
                if (spawnTimer > 45) {
                    balls.push(ballQueue.pop());
                    spawnTimer = 0;
                }
            }

            let allSettled = true;

            // 공 업데이트 및 그리기
            for (let ball of balls) {
                ball.update(bucketWidth);
                ball.draw();
                if (!ball.isSettled) {
                    allSettled = false;
                }
            }

            // 모든 공이 대기열에서 빠져나오고 전부 바닥에 정착했다면 애니메이션 종료
            if (ballQueue.length === 0 && allSettled && balls.length > 0) {
                isSimulating = false;
                setTimeout(showResults, 1500); // 1.5초 대기 후 결과 화면 전환
                return;
            }

            animationId = requestAnimationFrame(animatePinball);
        }

        // 게임 시작 이벤트
        startGameBtn.addEventListener('click', () => {
            calculateCapacities(); // 그룹별 최대 정원만 계산하고 배열은 비워둡니다.
            
            setupScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            
            initPinball();
            isSimulating = true;
            animatePinball();
        });

        // 강제로 빈 그룹에 인원을 할당하는 헬퍼 함수 (스킵 버튼 사용 시 필요합니다)
        function assignToAvailableGroup(ball) {
            for (let i = 0; i < numGroups; i++) {
                if (finalGroups[i].length < groupCapacities[i]) {
                    finalGroups[i].push(ball.name);
                    ball.assignedGroupIndex = i;
                    break;
                }
            }
        }

        // 판 흔들기 버튼 이벤트 (공들에게 물리적 반동을 주고 캔버스를 흔듭니다)
        shakeBtn.addEventListener('click', () => {
            if (!isSimulating) return;

            // 캔버스에 시각적 흔들림 효과 부여
            canvas.classList.remove('shake-animation');
            void canvas.offsetWidth; // DOM 리플로우를 강제로 발생시켜 애니메이션을 재시작합니다.
            canvas.classList.add('shake-animation');

            // 아직 정착하지 않은 공들에게 물리적 힘(위쪽 방향 및 무작위 측면 방향)을 가합니다.
            balls.forEach(ball => {
                if (!ball.isSettled) {
                    ball.vy -= (Math.random() * 4 + 4); // 위로 강하게 튕겨 올립니다.
                    ball.vx += (Math.random() - 0.5) * 8; // 좌우로 무작위 힘을 가합니다.
                }
            });
        });

        // 스킵 버튼 이벤트 (애니메이션 건너뛰기)
        skipBtn.addEventListener('click', () => {
            isSimulating = false;
            cancelAnimationFrame(animationId);
            
            // 아직 그룹이 배정되지 않은 화면상의 공과 대기열의 공들을 남은 빈자리에 즉시 배정합니다.
            balls.forEach(ball => {
                if (ball.assignedGroupIndex === -1) assignToAvailableGroup(ball);
            });
            ballQueue.forEach(ball => {
                assignToAvailableGroup(ball);
            });
            
            showResults();
        });

        // 결과 화면 표시
        function showResults() {
            gameScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            
            resultGrid.innerHTML = '';
            
            finalGroups.forEach((group, index) => {
                const card = document.createElement('div');
                const groupColor = colors[index % colors.length];
                
                card.className = 'bg-white rounded-xl shadow-md border-t-4 overflow-hidden transform transition-all hover:-translate-y-1 hover:shadow-lg';
                card.style.borderColor = groupColor;
                
                let listHtml = group.map(name => `
                    <li class="flex items-center py-2 px-4 border-b border-gray-100 last:border-0">
                        <span class="w-8 h-8 rounded-full flex items-center justify-center text-white font-bold text-sm mr-3" style="background-color: ${groupColor}; opacity: 0.8;">
                            ${name.substring(0,1)}
                        </span>
                        <span class="font-medium text-gray-800">${name}</span>
                    </li>
                `).join('');

                card.innerHTML = `
                    <div class="bg-gray-50 p-4 border-b text-center">
                        <h3 class="text-xl font-bold" style="color: ${groupColor}">Group ${index + 1}</h3>
                        <p class="text-sm text-gray-500 mt-1">${group.length}명</p>
                    </div>
                    <ul class="max-h-60 overflow-y-auto">
                        ${listHtml}
                    </ul>
                `;
                resultGrid.appendChild(card);
            });
        }

        // 다시하기 버튼 이벤트
        restartBtn.addEventListener('click', () => {
            resultScreen.classList.add('hidden');
            setupScreen.classList.remove('hidden');
            
            // 데이터는 유지하되 UI만 초기 화면으로 되돌립니다.
            // 만약 완전히 초기화하고 싶다면 여기서 participants = [] 처리 후 updateParticipantUI() 호출.
        });

    </script>
</body>
</html>
