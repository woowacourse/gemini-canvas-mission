<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GOM Dodge - AI Replay & Taunt</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            color: #fff;
            font-family: 'Share Tech Mono', 'Malgun Gothic', sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            background-color: #1a1a1a;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.75);
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 3rem;
            color: #ff9800;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 152, 0, 0.5);
            text-align: center;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 25px;
            color: #ccc;
            text-align: center;
            line-height: 1.6;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1.2rem;
            font-family: inherit;
            color: #111;
            background-color: #ff9800;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s, background-color 0.2s;
        }

        .btn:hover { background-color: #ffb74d; }
        .btn:active { transform: scale(0.95); }

        .btn-ai {
            background-color: #00e5ff;
            color: #000;
        }
        .btn-ai:hover { background-color: #84ffff; }

        .btn-stop-ai {
            position: absolute;
            bottom: 30px;
            background-color: #f44336;
            color: white;
            z-index: 20;
        }

        #hud {
            position: absolute;
            top: 20px;
            right: 30px;
            text-align: right;
            z-index: 5;
            pointer-events: none;
        }

        #timer {
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
            font-variant-numeric: tabular-nums;
        }

        #mode-indicator {
            font-size: 1.2rem;
            color: #00e5ff;
            margin-top: 5px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: blink 1s infinite alternate;
        }

        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.3; }
        }

        #high-score-display {
            font-size: 1rem;
            color: #ffeb3b;
            margin-top: 5px;
        }

        #game-over-time {
            font-size: 4rem;
            color: #f44336;
            margin: 10px 0;
            text-shadow: 0 0 15px rgba(244, 67, 54, 0.5);
        }

        /* 도발 메시지 스타일 */
        #taunt-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem; /* 매우 큰 글씨 */
            font-weight: 900;
            color: #ff0000;
            text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; /* 강한 외곽선 */
            white-space: nowrap;
            z-index: 50;
            pointer-events: none;
            opacity: 0;
            font-family: 'Malgun Gothic', sans-serif; /* 한글 폰트 명시 */
        }

        /* 흔들림 & 페이드 아웃 애니메이션 클래스 */
        .show-taunt {
            animation: shake-fade 2s ease-out forwards;
        }

        @keyframes shake-fade {
            0% { transform: translate(-50%, -50%) rotate(0deg); opacity: 1; }
            10% { transform: translate(-55%, -45%) rotate(-5deg); opacity: 1; }
            20% { transform: translate(-45%, -55%) rotate(5deg); opacity: 1; }
            30% { transform: translate(-55%, -55%) rotate(-5deg); opacity: 1; }
            40% { transform: translate(-45%, -45%) rotate(5deg); opacity: 1; }
            50% { transform: translate(-50%, -50%) rotate(0deg); opacity: 1; }
            100% { transform: translate(-50%, -70%) rotate(0deg); opacity: 0; } /* 위로 올라가며 사라짐 */
        }

        /* 모바일 환경 폰트 크기 조절 */
        @media (max-width: 600px) {
            #taunt-msg { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="hud">
        <div id="timer">0.000</div>
        <div id="high-score-display">Best: 0.000</div>
        <div id="mode-indicator" class="hidden">AI PLAYING</div>
    </div>

    <!-- 도발 메시지 요소 -->
    <div id="taunt-msg">개못하면 건들 ㄴㄴ</div>

    <button id="stop-ai-btn" class="btn btn-stop-ai hidden">관전 종료</button>

    <!-- 시작 화면 -->
    <div id="start-screen" class="overlay">
        <h1>GOM Dodge</h1>
        <p>
            <b>[조작 방법]</b><br>
            PC: 방향키 또는 W,A,S,D<br>
            모바일: 화면 아무 곳이나 터치 후 드래그 (상대 좌표 이동)
        </p>
        <button class="btn" id="start-btn">게임 시작</button>
    </div>

    <!-- 게임 오버 화면 -->
    <div id="game-over-screen" class="overlay hidden">
        <h1 style="color: #f44336; margin-bottom: 0;">GAME OVER</h1>
        <div id="game-over-time">0.000</div>
        <p id="game-over-msg">아쉽네요! 다시 도전하시겠습니까?</p>

        <div class="btn-group">
            <button class="btn btn-ai" id="ai-replay-btn">🤖 AI 풀이 보기</button>
            <button class="btn" id="restart-btn">다시 하기</button>
        </div>
        <p style="font-size: 0.8rem; margin-top: 20px; color: #888;">
            ※ 'AI 풀이 보기'를 누르면 방금 플레이한 탄막 패턴을 AI가 대신 회피합니다.
        </p>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // DOM 요소
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const aiReplayBtn = document.getElementById('ai-replay-btn');
    const stopAiBtn = document.getElementById('stop-ai-btn');
    const timerDisplay = document.getElementById('timer');
    const highScoreDisplay = document.getElementById('high-score-display');
    const gameOverTimeDisplay = document.getElementById('game-over-time');
    const modeIndicator = document.getElementById('mode-indicator');
    const tauntMsg = document.getElementById('taunt-msg'); // 도발 요소 가져오기

    // --- 시드 기반 난수 생성기 (PRNG) ---
    class RandomGenerator {
        constructor(seed) {
            this.seed = seed;
        }
        next() {
            this.seed = (this.seed * 9301 + 49297) % 233280;
            return this.seed / 233280;
        }
    }

    let rng = new RandomGenerator(Date.now());
    let currentSeed = Date.now();

    // 게임 상태 변수
    let animationId;
    let isPlaying = false;
    let isAIMode = false;
    let startTime = 0;
    let score = 0;
    let highScore = localStorage.getItem('gomDodgeHighScore') || 0;

    let bulletSpawnRate = 100;
    let lastBulletSpawnTime = 0;

    highScoreDisplay.textContent = `Best: ${(highScore / 1).toFixed(3)}`;

    // 플레이어
    const player = {
        x: 0, y: 0,
        radius: 6,
        drawRadius: 10,
        speed: 5.5,
        color: '#00e5ff',
        dx: 0, dy: 0
    };

    let bullets = [];

    // 키보드 입력
    const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, w: false, a: false, s: false, d: false };

    // --- 도발 함수 ---
    function showTauntMessage() {
        // 이미 애니메이션 중이면 클래스를 뺐다가 다시 넣어서 재시작
        tauntMsg.classList.remove('show-taunt');
        // 브라우저 리플로우 강제 발생 (애니메이션 재시작을 위함)
        void tauntMsg.offsetWidth;
        tauntMsg.classList.add('show-taunt');
    }

    // 키보드 이벤트
    window.addEventListener('keydown', (e) => {
        // AI 모드 중이고 방향키(또는 wasd)를 눌렀을 때 도발 메시지 출력
        if (isAIMode && isPlaying) {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd'].includes(e.key) ||
                ['W', 'A', 'S', 'D'].includes(e.key)) {
                showTauntMessage();
            }
        }

        if (!isAIMode && keys.hasOwnProperty(e.key)) keys[e.key] = true;
        if (!isAIMode && keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true;
    });

    window.addEventListener('keyup', (e) => {
        if (!isAIMode && keys.hasOwnProperty(e.key)) keys[e.key] = false;
        if (!isAIMode && keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false;
    });

    // 상대 좌표 드래그 (마우스 & 터치)
    let isDragging = false;
    let lastPointerX = 0;
    let lastPointerY = 0;

    const handlePointerDown = (e) => {
        if (!isPlaying) return;

        // AI 모드 중 화면 터치/클릭 시 도발 메시지 출력
        if (isAIMode) {
            // 버튼 클릭 이벤트와 겹치지 않게 타겟 확인 (관전 종료 버튼은 예외)
            if (e.target.id !== 'stop-ai-btn') {
                showTauntMessage();
            }
            return; // 이동 로직은 무시
        }

        isDragging = true;
        const pointer = e.touches ? e.touches[0] : e;
        lastPointerX = pointer.clientX;
        lastPointerY = pointer.clientY;
    };

    const handlePointerMove = (e) => {
        if (!isPlaying || !isDragging || isAIMode) return;
        e.preventDefault();
        const pointer = e.touches ? e.touches[0] : e;

        const deltaX = pointer.clientX - lastPointerX;
        const deltaY = pointer.clientY - lastPointerY;

        player.x += deltaX * 1.2;
        player.y += deltaY * 1.2;

        clampPlayerPosition();

        lastPointerX = pointer.clientX;
        lastPointerY = pointer.clientY;
    };

    const handlePointerUp = () => { isDragging = false; };

    canvas.addEventListener('mousedown', handlePointerDown);
    window.addEventListener('mousemove', handlePointerMove, { passive: false });
    window.addEventListener('mouseup', handlePointerUp);
    canvas.addEventListener('touchstart', handlePointerDown, { passive: false });
    window.addEventListener('touchmove', handlePointerMove, { passive: false });
    window.addEventListener('touchend', handlePointerUp);

    // 리사이즈
    function resizeCanvas() {
        const maxWidth = Math.min(window.innerWidth, 800);
        const maxHeight = Math.min(window.innerHeight, 800);
        canvas.width = maxWidth;
        canvas.height = maxHeight;

        if (!isPlaying) {
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
        } else {
            clampPlayerPosition();
        }

        const dpr = window.devicePixelRatio || 1;
        canvas.width = maxWidth * dpr;
        canvas.height = maxHeight * dpr;
        canvas.style.width = `${maxWidth}px`;
        canvas.style.height = `${maxHeight}px`;
        ctx.scale(dpr, dpr);

        canvas.logicalWidth = maxWidth;
        canvas.logicalHeight = maxHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    // 공통 로직
    function clampPlayerPosition() {
        if (player.x < player.drawRadius) player.x = player.drawRadius;
        if (player.x > canvas.logicalWidth - player.drawRadius) player.x = canvas.logicalWidth - player.drawRadius;
        if (player.y < player.drawRadius) player.y = player.drawRadius;
        if (player.y > canvas.logicalHeight - player.drawRadius) player.y = canvas.logicalHeight - player.drawRadius;
    }

    function movePlayer() {
        if (isAIMode) {
            aiMove();
        } else if (!isDragging) {
            player.dx = 0; player.dy = 0;
            if (keys.ArrowUp || keys.w) player.dy = -player.speed;
            if (keys.ArrowDown || keys.s) player.dy = player.speed;
            if (keys.ArrowLeft || keys.a) player.dx = -player.speed;
            if (keys.ArrowRight || keys.d) player.dx = player.speed;

            if (player.dx !== 0 && player.dy !== 0) {
                const length = Math.sqrt(player.dx * player.dx + player.dy * player.dy);
                player.dx = (player.dx / length) * player.speed;
                player.dy = (player.dy / length) * player.speed;
            }

            player.x += player.dx;
            player.y += player.dy;
            clampPlayerPosition();
        }
    }

    // --- 간단한 회피 AI ---
    function aiMove() {
        let bestVx = 0;
        let bestVy = 0;
        let maxSafety = -Infinity;

        const directions = [
            {dx: 0, dy: 0},
            {dx: 0, dy: -1}, {dx: 0, dy: 1}, {dx: -1, dy: 0}, {dx: 1, dy: 0},
            {dx: -0.707, dy: -0.707}, {dx: 0.707, dy: -0.707}, {dx: -0.707, dy: 0.707}, {dx: 0.707, dy: 0.707}
        ];

        for (let dir of directions) {
            const testX = player.x + dir.dx * player.speed;
            const testY = player.y + dir.dy * player.speed;

            if (testX < player.radius || testX > canvas.logicalWidth - player.radius ||
                testY < player.radius || testY > canvas.logicalHeight - player.radius) {
                continue;
            }

            let minDistanceToBullet = Infinity;

            for (let b of bullets) {
                const futureBx = b.x + b.vx;
                const futureBy = b.y + b.vy;
                const dist = Math.hypot(testX - futureBx, testY - futureBy);
                const safetyMargin = dist - (player.radius + b.radius);

                if (safetyMargin < minDistanceToBullet) {
                    minDistanceToBullet = safetyMargin;
                }
            }

            const distFromCenter = Math.hypot(testX - canvas.logicalWidth/2, testY - canvas.logicalHeight/2);
            const centerBonus = -distFromCenter * 0.05;

            const currentSafety = minDistanceToBullet + centerBonus;

            if (currentSafety > maxSafety) {
                maxSafety = currentSafety;
                bestVx = dir.dx * player.speed;
                bestVy = dir.dy * player.speed;
            }
        }

        player.x += bestVx;
        player.y += bestVy;
        clampPlayerPosition();
    }

    function spawnBullet(timestamp) {
        const currentSpawnRate = Math.max(15, bulletSpawnRate - (score * 2.5));

        if (timestamp - lastBulletSpawnTime > currentSpawnRate) {
            const edge = Math.floor(rng.next() * 4);
            let x, y;
            const size = rng.next() * 2 + 3.5;

            if (edge === 0) { x = rng.next() * canvas.logicalWidth; y = -10; }
            else if (edge === 1) { x = canvas.logicalWidth + 10; y = rng.next() * canvas.logicalHeight; }
            else if (edge === 2) { x = rng.next() * canvas.logicalWidth; y = canvas.logicalHeight + 10; }
            else { x = -10; y = rng.next() * canvas.logicalHeight; }

            let angle;
            if (rng.next() < 0.6) {
                angle = Math.atan2(player.y - y, player.x - x);
                angle += (rng.next() - 0.5) * 0.6;
            } else {
                const targetX = rng.next() * canvas.logicalWidth;
                const targetY = rng.next() * canvas.logicalHeight;
                angle = Math.atan2(targetY - y, targetX - x);
            }

            const speedMultiplier = Math.min(3.5, 1 + (score / 25));
            const speed = (rng.next() * 2.5 + 2) * speedMultiplier;

            bullets.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, radius: size, color: '#ff3333' });

            lastBulletSpawnTime = timestamp;
        }
    }

    function updateBullets() {
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.x += b.vx;
            b.y += b.vy;
            if (b.x < -50 || b.x > canvas.logicalWidth + 50 || b.y < -50 || b.y > canvas.logicalHeight + 50) {
                bullets.splice(i, 1);
            }
        }
    }

    function checkCollision() {
        for (let i = 0; i < bullets.length; i++) {
            const b = bullets[i];
            const dist = Math.hypot(player.x - b.x, player.y - b.y);
            if (dist < player.radius + b.radius) return true;
        }
        return false;
    }

    // 그리기
    function drawPlayer() {
        ctx.beginPath();
        ctx.rect(player.x - player.drawRadius, player.y - player.drawRadius, player.drawRadius * 2, player.drawRadius * 2);

        ctx.fillStyle = isAIMode ? '#ffff00' : player.color;
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fillStyle = isAIMode ? '#ff5722' : '#fff';
        ctx.fill();
    }

    function drawBullets() {
        for (let i = 0; i < bullets.length; i++) {
            const b = bullets[i];
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
            ctx.fillStyle = b.color;
            ctx.fill();
            ctx.strokeStyle = '#ffaaaa';
            ctx.lineWidth = 1;
            ctx.stroke();
        }
    }

    function drawGrid() {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.lineWidth = 1;
        const gridSize = 50;
        for (let x = 0; x <= canvas.logicalWidth; x += gridSize) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.logicalHeight); ctx.stroke();
        }
        for (let y = 0; y <= canvas.logicalHeight; y += gridSize) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.logicalWidth, y); ctx.stroke();
        }
    }

    // 메인 루프
    function gameLoop(timestamp) {
        if (!isPlaying) return;

        movePlayer();
        spawnBullet(timestamp);
        updateBullets();

        score = (timestamp - startTime) / 1000;
        timerDisplay.textContent = score.toFixed(3);

        if (checkCollision()) {
            endGame();
            return;
        }

        ctx.clearRect(0, 0, canvas.logicalWidth, canvas.logicalHeight);
        drawGrid();
        drawBullets();
        drawPlayer();

        animationId = requestAnimationFrame(gameLoop);
    }

    // 게임 시작
    function startRealGame() {
        isAIMode = false;
        currentSeed = Date.now();
        initGame(currentSeed);
    }

    function startAIReplay() {
        isAIMode = true;
        initGame(currentSeed);
    }

    function initGame(seedToUse) {
        rng = new RandomGenerator(seedToUse);

        bullets = [];
        player.x = canvas.logicalWidth / 2;
        player.y = canvas.logicalHeight / 2;
        score = 0;
        isDragging = false;

        for(let key in keys) keys[key] = false;

        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        timerDisplay.style.color = "#fff";
        tauntMsg.classList.remove('show-taunt'); // 시작 시 도발 메시지 초기화

        if (isAIMode) {
            modeIndicator.classList.remove('hidden');
            stopAiBtn.classList.remove('hidden');
        } else {
            modeIndicator.classList.add('hidden');
            stopAiBtn.classList.add('hidden');
        }

        isPlaying = true;

        requestAnimationFrame((timestamp) => {
            startTime = timestamp;
            lastBulletSpawnTime = timestamp;
            gameLoop(timestamp);
        });
    }

    function endGame() {
        isPlaying = false;
        cancelAnimationFrame(animationId);

        if (!isAIMode && score > highScore) {
            highScore = score;
            localStorage.setItem('gomDodgeHighScore', highScore);
            highScoreDisplay.textContent = `Best: ${highScore.toFixed(3)}`;
        }

        gameOverTimeDisplay.textContent = `${score.toFixed(3)}`;

        if (isAIMode) {
            document.getElementById('game-over-msg').innerHTML = "AI가 이만큼 버텼습니다! 당신은 어떨까요?";
            aiReplayBtn.style.display = 'none';
            stopAiBtn.classList.add('hidden');
        } else {
            document.getElementById('game-over-msg').innerHTML = "아쉽네요! 다시 도전하시겠습니까?";
            aiReplayBtn.style.display = 'inline-block';
        }

        gameOverScreen.classList.remove('hidden');
        modeIndicator.classList.add('hidden');
        tauntMsg.classList.remove('show-taunt'); // 게임 오버 시 도발 메시지 숨김
    }

    // 이벤트 리스너
    startBtn.addEventListener('click', startRealGame);
    restartBtn.addEventListener('click', startRealGame);
    aiReplayBtn.addEventListener('click', startAIReplay);

    stopAiBtn.addEventListener('click', () => {
        isPlaying = false;
        cancelAnimationFrame(animationId);
        gameOverScreen.classList.remove('hidden');
        stopAiBtn.classList.add('hidden');
        modeIndicator.classList.add('hidden');
        tauntMsg.classList.remove('show-taunt'); // 도발 메시지 초기화
    });

    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && !isPlaying) {
            if (!startScreen.classList.contains('hidden') || !gameOverScreen.classList.contains('hidden')) {
                startRealGame();
            }
        }
    });

    resizeCanvas();
    ctx.clearRect(0, 0, canvas.logicalWidth, canvas.logicalHeight);
    drawGrid();
    drawPlayer();

</script>
</body>
</html>
