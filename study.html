<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevInterview - 개발자 면접 준비 서비스</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f0f9ff;
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            min-height: 400px;
            display: flex;
            flex-direction: column;
        }

        .job-card {
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
            text-align: center;
        }

        .job-card.selected {
            border-color: #0ea5e9;
            background-color: #f0f9ff;
            transform: translateY(-2px);
        }

        .sub-btn {
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid #e0f2fe;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            word-break: break-all;
        }

        .sub-btn.selected {
            border-color: #0ea5e9;
            background-color: #e0f2fe;
            color: #0369a1;
            font-weight: 700;
        }

        .wrong-text {
            color: #ef4444;
            font-weight: 600;
            text-decoration: underline;
        }

        .loading-spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border-left-color: #ffffff;
            animation: spin 0.8s linear infinite;
        }

        .loading-spinner-blue {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border-left-color: #0ea5e9;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .initial-fade-in {
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { 
                opacity: 0; 
                transform: translateY(40px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }

        .full-width-text {
            white-space: pre-wrap;
            word-break: break-word;
            text-align: justify;
            line-height: 1.7;
        }

        .explanation-section {
            white-space: pre-wrap;
            line-height: 1.8;
        }

        .explanation-section b {
            display: block;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            color: #0369a1;
            font-size: 1.1rem;
            border-left: 4px solid #0ea5e9;
            padding-left: 0.75rem;
            font-weight: 700;
        }
        .explanation-section b:first-child {
            margin-top: 0;
        }

        .explanation-section .md-bold {
            font-weight: 700;
            color: #1e293b;
        }

        .content-center {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #confirm-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .follow-up-badge {
            background-color: #fef3c7;
            color: #92400e;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 800;
            margin-bottom: 8px;
            display: inline-block;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="app" class="max-w-3xl mx-auto">
        <header class="text-left mb-8 px-2 initial-fade-in">
            <div class="inline-block cursor-pointer" onclick="handleLogoClick()">
                <h1 class="text-3xl font-bold text-sky-600 hover:text-sky-700 transition-colors">DevInterview</h1>
            </div>
            <p class="text-gray-500">AI 면접관과 함께하는 기술 면접 대비</p>
        </header>

        <main id="main-container" class="glass-card p-6 md:p-10 initial-fade-in">
            <!-- Content injected by JS -->
        </main>
    </div>

    <!-- 중단 확인 모달 -->
    <div id="confirm-modal">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full mx-4 text-center">
            <h3 class="text-xl font-bold text-gray-800 mb-4">면접을 중단하시겠습니까?</h3>
            <p class="text-gray-500 mb-8 break-keep">진행 중인 모든 질문 이력과 답변 내용이 초기화됩니다. 정말 돌아가시겠습니까?</p>
            <div class="flex gap-3">
                <button onclick="closeConfirmModal()" class="flex-1 py-3 bg-gray-100 text-gray-600 rounded-xl font-bold hover:bg-gray-200 transition-all">취소</button>
                <button onclick="confirmResetAndHome()" class="flex-1 py-3 bg-red-500 text-white rounded-xl font-bold hover:bg-red-600 transition-all">중단하기</button>
            </div>
        </div>
    </div>

    <script>
        const apiKey = ""; 
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'interview-service-123';

        function getInitialState() {
            return {
                currentState: 'HOME',
                selectedJob: null,
                selectedSubs: [],
                customStack: "",
                currentQuestion: "",
                currentAnswer: "",
                userFeedback: null,
                questionHistory: [], 
                isEvaluating: false,
                isProcessingStack: false,
                isFirstRender: true,
                isFollowUp: false 
            };
        }

        let state = getInitialState();

        const jobCategories = {
            backend: { title: '백엔드 개발자', subs: ['CS 기초', 'Java', 'Spring', 'Database', 'System Design'] },
            frontend: { title: '프론트엔드 개발자', subs: ['CS 기초', 'JavaScript', 'React', 'HTML/CSS', 'TypeScript'] },
            android: { title: '안드로이드 개발자', subs: ['CS 기초', 'Kotlin', 'Android SDK', 'Jetpack Compose', 'Architecture'] }
        };

        function handleLogoClick() {
            if (state.currentState !== 'HOME' && state.currentState !== 'SELECT_JOB') {
                document.getElementById('confirm-modal').style.display = 'flex';
            } else {
                resetAndHome();
            }
        }

        function closeConfirmModal() {
            document.getElementById('confirm-modal').style.display = 'none';
        }

        function confirmResetAndHome() {
            closeConfirmModal();
            resetAndHome();
        }

        function render() {
            const container = document.getElementById('main-container');
            if (!container) return;
            if (!state.isFirstRender) container.classList.remove('initial-fade-in');
            
            container.innerHTML = '';
            switch(state.currentState) {
                case 'HOME': renderHome(container); break;
                case 'SELECT_JOB': renderSelectJob(container); break;
                case 'SELECT_SUB': renderSelectSub(container); break;
                case 'INTERVIEW': renderInterview(container); break;
                case 'RESULT': renderResult(container); break;
            }
            state.isFirstRender = false;
        }

        function renderHome(container) {
            container.innerHTML = `
                <div class="content-center py-12 text-center">
                    <div class="mb-6 p-4 bg-sky-50 rounded-full inline-block">
                        <svg class="w-12 h-12 text-sky-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path>
                        </svg>
                    </div>
                    <h2 class="text-3xl font-black text-gray-800 mb-4 break-keep">실전 같은 AI 기술 면접으로<br>당신의 실력을 증명하세요.</h2>
                    <p class="text-lg text-gray-500 mb-12 max-w-md mx-auto break-keep">질문에 답하면 AI가 꼬리 질문을 던지며 당신의 지식을 끝까지 검증합니다.</p>
                    <button onclick="goToSelectJob()" class="w-full sm:w-64 bg-sky-600 text-white py-5 rounded-2xl font-bold text-xl hover:bg-sky-700 transition-all shadow-lg shadow-sky-100 flex items-center justify-center mx-auto">
                        면접 시작하기
                    </button>
                </div>`;
        }

        function goToSelectJob() {
            state.currentState = 'SELECT_JOB';
            render();
        }

        function renderSelectJob(container) {
            let cardsHtml = "";
            Object.keys(jobCategories).forEach(key => {
                const isSelected = state.selectedJob === key;
                cardsHtml += `
                    <div onclick="handleJobClickSelection('${key}')" class="job-card p-6 bg-white border border-gray-100 rounded-2xl flex items-center justify-center shadow-sm ${isSelected ? 'selected ring-2 ring-sky-500 ring-offset-2' : ''}">
                        <div class="text-lg font-bold ${isSelected ? 'text-sky-700' : 'text-gray-700'}">${jobCategories[key].title}</div>
                    </div>`;
            });

            container.innerHTML = `
                <div class="flex-1">
                    <h2 class="text-2xl font-bold mb-8 text-gray-800 text-left">어떤 분야의 면접을 준비할까요?</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                        ${cardsHtml}
                    </div>
                    <div class="mt-8 pt-8 border-t border-gray-100">
                        <label class="block text-sm font-semibold text-gray-600 mb-3 text-left uppercase tracking-wider">나만의 기술 스택 추가 (쉼표로 구분)</label>
                        <input type="text" oninput="saveCustomStack(this.value)" value="${state.customStack}" placeholder="예: 스프링, 리액트, 도커..." 
                            class="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-sky-500 outline-none text-left shadow-inner">
                    </div>
                </div>
                <button onclick="proceed()" ${!state.selectedJob ? 'disabled' : ''} 
                    class="w-full mt-10 py-5 rounded-2xl font-bold text-xl transition-all flex items-center justify-center
                    ${!state.selectedJob ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-sky-600 text-white hover:bg-sky-700 shadow-lg shadow-sky-100'}">
                    주제 선택하기
                </button>`;
        }

        function handleJobClickSelection(key) {
            state.selectedJob = key;
            render();
        }

        function saveCustomStack(val) { state.customStack = val; }

        async function proceed() {
            if (!state.selectedJob) return;
            if (state.customStack.trim()) {
                state.isProcessingStack = true;
                render();
                const refinedStack = await refineStackNames(state.customStack);
                state.customStack = refinedStack;
                const items = state.customStack.split(',').map(s => s.trim()).filter(s => s !== "");
                state.selectedSubs = [...new Set([...state.selectedSubs, ...items])];
                state.isProcessingStack = false;
            }
            state.currentState = 'SELECT_SUB';
            render();
        }

        async function refineStackNames(input) {
            const systemPrompt = "IT 기술 스택 명칭 정제 전문가입니다. 오타 수정 및 표준 명칭으로 변환하세요.";
            const userPrompt = `기술 목록: "${input}"\n\nJSON: {"refined": "기술1, 기술2"}`;
            try {
                const res = await apiCall(userPrompt, systemPrompt);
                return res.refined || input;
            } catch (e) { return input; }
        }

        function toggleSub(sub) {
            if (sub === '전체') {
                state.selectedSubs = state.selectedSubs.includes('전체') ? [] : ['전체'];
            } else {
                const allIndex = state.selectedSubs.indexOf('전체');
                if (allIndex > -1) state.selectedSubs.splice(allIndex, 1);
                const index = state.selectedSubs.indexOf(sub);
                if (index > -1) state.selectedSubs.splice(index, 1);
                else state.selectedSubs.push(sub);
            }
            render();
        }

        function renderSelectSub(container) {
            const job = jobCategories[state.selectedJob];
            let displaySubs = [...job.subs];
            if (state.customStack.trim()) {
                const customItems = state.customStack.split(',').map(s => s.trim()).filter(s => s !== "");
                displaySubs = [...new Set([...displaySubs, ...customItems])];
            }
            const allSubs = ['전체', ...displaySubs];
            let buttonsHtml = '';
            for (let sub of allSubs) {
                const isSelected = state.selectedSubs.includes(sub);
                buttonsHtml += `<button onclick="toggleSub('${sub}')" class="sub-btn p-5 rounded-xl font-medium ${isSelected ? 'selected' : 'bg-white text-gray-700 hover:bg-gray-50'}">${sub}</button>`;
            }
            container.innerHTML = `
                <div class="flex-1">
                    <button onclick="resetAndSelectJob()" class="text-sky-600 hover:text-sky-800 text-sm font-semibold mb-4">← 분야 선택으로</button>
                    <h2 class="text-2xl font-bold mb-8 text-gray-800 text-left">상세 주제를 선택하세요</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-10">
                        ${buttonsHtml}
                    </div>
                </div>
                <button onclick="startInterview()" ${state.selectedSubs.length === 0 ? 'disabled' : ''} 
                    class="w-full py-5 rounded-2xl font-bold text-xl transition-all flex items-center justify-center
                    ${state.selectedSubs.length === 0 ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-sky-600 text-white hover:bg-sky-700 shadow-lg shadow-sky-100'}">
                    면접 시작하기
                </button>`;
        }

        function startInterview() {
            state.questionHistory = [];
            state.isFollowUp = false;
            fetchNewQuestion();
        }

        async function fetchNewQuestion(isFollowUp = false) {
            state.isFollowUp = isFollowUp;
            state.currentQuestion = "";
            state.currentAnswer = "";
            state.currentState = 'INTERVIEW';
            render();

            const jobTitle = jobCategories[state.selectedJob].title;
            const subs = state.selectedSubs.includes('전체') ? jobCategories[state.selectedJob].subs.join(', ') : state.selectedSubs.join(', ');
            
            let systemPrompt = "시니어 면접관입니다. 중복 질문을 피하고 핵심 원리를 묻는 질문을 생성하세요.";
            let userPrompt = `직군: ${jobTitle}, 주제: ${subs}. 이전 질문들: ${state.questionHistory.join('|')}. JSON: {"question": "문자열"}`;
            
            if (isFollowUp && state.userFeedback) {
                systemPrompt = "사용자의 답변에서 미흡한 점이나 더 심화해서 물어볼 지점을 포착하여 날카로운 꼬리 질문을 던지는 면접관입니다.";
                userPrompt = `[맥락 정보]
이전 질문: ${state.questionHistory[state.questionHistory.length-1]}
사용자 답변: ${state.currentAnswer}
AI 분석에 따른 후속 질문 힌트: ${state.userFeedback.followUpHint}

위 정보를 바탕으로, 방금 답변한 내용 중 모호한 부분이나 힌트로 제시된 "${state.userFeedback.followUpHint}" 주제를 직접적으로 다루는 꼬리 질문을 하나 생성하세요.
JSON: {"question": "문자열"}`;
            }

            try {
                const res = await apiCall(userPrompt, systemPrompt);
                state.currentQuestion = res.question || "질문을 생성하는 도중 오류가 발생했습니다.";
                state.questionHistory.push(state.currentQuestion);
                state.userFeedback = null;
                render();
            } catch (e) {
                state.currentQuestion = "질문을 가져오는 데 실패했습니다. 잠시 후 다시 시도해 주세요.";
                render();
            }
        }

        function renderInterview(container) {
            if (!state.currentQuestion) {
                container.innerHTML = `<div class="content-center py-20"><div class="loading-spinner-blue mb-4"></div><p class="text-gray-600">질문을 구성 중입니다...</p></div>`;
                return;
            }

            container.innerHTML = `
                <div class="flex-1">
                    <div class="mb-6 flex justify-between items-center">
                        <button onclick="handleLogoClick()" class="text-gray-400 hover:text-red-500 text-sm font-medium transition-colors flex items-center gap-1">← 중단하기</button>
                        ${state.isFollowUp ? '<span class="follow-up-badge">꼬리 질문</span>' : ''}
                    </div>
                    <div class="mb-10">
                        <h3 class="text-xs font-bold text-sky-400 uppercase tracking-widest mb-3">QUESTION</h3>
                        <p class="text-xl md:text-2xl font-bold text-gray-800 full-width-text">${state.currentQuestion}</p>
                    </div>
                    <div class="mb-8">
                        <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-widest">YOUR ANSWER</label>
                        <textarea id="user-answer" oninput="saveCurrentAnswer(this.value)" placeholder="이 질문에 어떻게 답하시겠습니까?" 
                            class="w-full h-48 p-5 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-sky-500 outline-none resize-none text-gray-700 leading-relaxed shadow-inner" ${state.isEvaluating ? 'disabled' : ''}>${state.currentAnswer}</textarea>
                    </div>
                </div>
                <button id="evaluate-btn" onclick="evaluateAnswer()" 
                    class="w-full py-5 rounded-2xl font-bold text-xl transition-all flex items-center justify-center
                    ${state.isEvaluating || !state.currentAnswer.trim() ? 'bg-gray-300 text-white cursor-not-allowed' : 'bg-sky-600 text-white hover:bg-sky-700 shadow-lg shadow-sky-100'}"
                    ${state.isEvaluating || !state.currentAnswer.trim() ? 'disabled' : ''}>
                    ${state.isEvaluating ? '<div class="loading-spinner mr-3"></div> 분석 중...' : '피드백 받기'}
                </button>`;
        }

        async function evaluateAnswer() {
            if (state.isEvaluating || !state.currentAnswer.trim()) return;
            state.isEvaluating = true;
            render(); 
            
            const systemPrompt = `시니어 개발자 면접관입니다. 다음 형식의 JSON으로만 응답하세요. 
            {
                "score": number, 
                "highlightedAnswer": "잘못된 개념만 [WRONG]단어[/WRONG] 형식으로 감싼 문자열", 
                "explanation": "[출제 의도], [핵심 지식], [답변 보완 가이드] 소제목을 포함한 상세 해설. 말투는 면접관이 직접 조언해 주는 듯한 '친근한 발화체(~해요, ~입니다)'를 사용하세요. 각 항목 내에서 번호 리스트(1., 2., 3.)를 사용할 때 반드시 줄바꿈을 포함하세요.", 
                "modelAnswer": "실제 면접에서 1분 내외로 말하기 좋은 자연스러운 구어체 답변 예시. (중요: 마크다운 기호나 괄호(), 별표 등을 일절 쓰지 마세요. 사람에게 직접 말하는 문장만 쓰세요)", 
                "followUpHint": "방금 답변에서 부족했거나 더 파고들어야 할 핵심 기술 키워드 하나"
            }`;
            
            const userPrompt = `질문: ${state.currentQuestion}\n사용자 답변: ${state.currentAnswer}`;
            try {
                const result = await apiCall(userPrompt, systemPrompt);
                state.userFeedback = {
                    score: result.score || 0,
                    highlightedAnswer: String(result.highlightedAnswer || ""),
                    explanation: String(result.explanation || ""),
                    modelAnswer: String(result.modelAnswer || ""),
                    followUpHint: String(result.followUpHint || "")
                };
                state.isEvaluating = false;
                state.currentState = 'RESULT';
                render();
            } catch (e) {
                state.isEvaluating = false;
                render();
            }
        }

        function renderResult(container) {
            if (!state.userFeedback) return;
            const { score, highlightedAnswer, explanation, modelAnswer, followUpHint } = state.userFeedback;
            container.innerHTML = `
                <div class="flex-1">
                    <div class="mb-10 pb-8 border-b border-gray-100 flex items-center gap-6">
                        <div class="bg-sky-600 text-white text-4xl font-black px-6 py-3 rounded-2xl shadow-xl shadow-sky-100">${score}</div>
                        <div>
                            <h2 class="text-xl font-bold text-gray-800">분석 완료</h2>
                            <p class="text-gray-500 text-sm">답변의 질과 논리를 평가했습니다.</p>
                        </div>
                    </div>
                    <div class="space-y-8 mb-10">
                        <section>
                            <h3 class="text-sm font-bold text-gray-400 uppercase mb-3">채점 결과</h3>
                            <div class="p-5 bg-red-50 border border-red-100 rounded-2xl text-gray-800 full-width-text">${formatFeedbackText(highlightedAnswer)}</div>
                        </section>
                        
                        <section>
                            <h3 class="text-sm font-bold text-gray-400 uppercase mb-3">면접관 조언</h3>
                            <div class="p-5 bg-gray-50 border border-gray-100 rounded-2xl text-sm text-gray-700 explanation-section">${formatExplanation(explanation)}</div>
                        </section>

                        <section>
                            <h3 class="text-sm font-bold text-gray-400 uppercase mb-3">베스트 답변 예시</h3>
                            <div class="p-6 bg-sky-50 border border-sky-100 rounded-2xl text-sky-900 font-medium leading-relaxed whitespace-pre-wrap">${modelAnswer}</div>
                        </section>

                        <section class="p-6 bg-amber-50 border border-amber-100 rounded-2xl">
                            <h3 class="text-xs font-black text-amber-600 uppercase mb-2">심층 질문 힌트</h3>
                            <p class="text-amber-800 font-medium">${followUpHint}에 대해 더 자세히 물어볼 예정입니다.</p>
                        </section>
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <button onclick="fetchNewQuestion(false)" class="bg-white border-2 border-sky-100 text-sky-600 py-4 rounded-2xl font-bold hover:bg-sky-50 transition-all shadow-sm">
                        같은 주제 다른 질문
                    </button>
                    <button onclick="fetchNewQuestion(true)" class="bg-sky-600 text-white py-4 rounded-2xl font-bold hover:bg-sky-700 shadow-lg shadow-sky-100 transition-all flex items-center justify-center gap-2">
                        <span>꼬리 질문 이어가기</span>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
                    </button>
                </div>`;
        }

        function saveCurrentAnswer(val) { 
            state.currentAnswer = val; 
            const btn = document.getElementById('evaluate-btn');
            if (btn) {
                if (val.trim()) {
                    btn.disabled = false;
                    btn.classList.remove('bg-gray-300', 'cursor-not-allowed');
                    btn.classList.add('bg-sky-600', 'hover:bg-sky-700', 'shadow-lg', 'shadow-sky-100');
                } else {
                    btn.disabled = true;
                    btn.classList.add('bg-gray-300', 'cursor-not-allowed');
                    btn.classList.remove('bg-sky-600', 'hover:bg-sky-700', 'shadow-lg', 'shadow-sky-100');
                }
            }
        }
        
        function resetAndHome() { state = getInitialState(); render(); }
        function resetAndSelectJob() { state = getInitialState(); state.currentState = 'SELECT_JOB'; render(); }
        
        function formatFeedbackText(text) {
            if (!text || typeof text !== 'string') return "분석 결과를 표시할 수 없습니다.";
            let formatted = text.replace(/\[WRONG\](.*?)\[\/WRONG\]/g, '<span class="wrong-text">$1</span>');
            return applyMarkdown(formatted);
        }

        function formatExplanation(text) {
            if (!text || typeof text !== 'string') return "해설 데이터를 가져오지 못했습니다.";
            let formatted = text.replace(/\[(.*?)\]/g, '<b>$1</b>');
            formatted = formatted.replace(/([^.\n])\s*(\d+\.)/g, '$1\n$2');
            return applyMarkdown(formatted);
        }

        function applyMarkdown(text) {
            return text.replace(/\*\*(.*?)\*\*/g, '<span class="md-bold">$1</span>');
        }

        async function apiCall(prompt, systemInstruction) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: systemInstruction }] },
                generationConfig: { responseMimeType: "application/json", temperature: 0.7 }
            };

            for (let i = 0; i < 5; i++) {
                try {
                    const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    if (!response.ok) throw new Error('API call failed');
                    const data = await response.json();
                    return JSON.parse(data.candidates?.[0]?.content?.parts?.[0]?.text);
                } catch (e) { 
                    if (i === 4) throw e;
                    await new Promise(r => setTimeout(r, Math.pow(2, i) * 1000)); 
                }
            }
        }

        window.onload = render;
    </script>
</body>
</html>
