<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>그라운드 룰 채팅</title>
        <!-- Tailwind CSS -->
        <script src="https://cdn.tailwindcss.com"></script>
        <!-- Lucide Icons -->
        <script src="https://unpkg.com/lucide@latest"></script>
        <style>
            /* 커스텀 스크롤바 (선택사항) */
            ::-webkit-scrollbar {
                width: 6px;
            }
            ::-webkit-scrollbar-track {
                background: transparent;
            }
            ::-webkit-scrollbar-thumb {
                background: #cbd5e1;
                border-radius: 3px;
            }
            ::-webkit-scrollbar-thumb:hover {
                background: #94a3b8;
            }

            /* 텍스트 줄바꿈 유지 */
            .whitespace-pre-wrap {
                white-space: pre-wrap;
            }
        </style>
    </head>
    <body class="bg-gray-50 font-sans text-gray-800 h-screen flex overflow-hidden">
        <!-- Mobile Sidebar Overlay -->
        <div
            id="mobileOverlay"
            class="fixed inset-0 bg-black/20 z-20 hidden md:hidden"
            onclick="toggleSidebar(false)"
        ></div>

        <!-- Sidebar -->
        <aside
            id="sidebar"
            class="fixed md:static inset-y-0 left-0 z-30 w-72 bg-white border-r border-gray-200 flex flex-col transition-transform duration-300 ease-in-out transform -translate-x-full md:translate-x-0"
        >
            <div class="p-5 flex items-center justify-between border-b border-gray-100">
                <div class="flex items-center gap-2 font-bold text-lg text-indigo-600">
                    <i data-lucide="settings" class="w-6 h-6"></i>
                    <span>룰 세트 관리</span>
                </div>
                <button class="md:hidden text-gray-500 hover:text-gray-800" onclick="toggleSidebar(false)">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <div id="ruleSetList" class="flex-1 overflow-y-auto p-4 space-y-2">
                <!-- 룰 세트 목록이 동적으로 렌더링됩니다 -->
            </div>

            <div class="p-4 border-t border-gray-100 bg-gray-50/50">
                <button
                    onclick="startManualSetup()"
                    class="w-full py-3 px-4 bg-white border border-gray-200 text-gray-700 font-medium rounded-xl shadow-sm hover:bg-gray-50 hover:border-gray-300 flex items-center justify-center gap-2 transition-all"
                >
                    <i data-lucide="plus" class="w-5 h-5 text-gray-500"></i>
                    새 룰 세트 추가
                </button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="flex-1 flex flex-col min-w-0 bg-white relative">
            <!-- Header -->
            <header
                class="h-16 flex items-center px-4 border-b border-gray-200 bg-white/80 backdrop-blur-sm sticky top-0 z-10"
            >
                <button
                    class="mr-3 md:hidden p-2 text-gray-600 hover:bg-gray-100 rounded-lg"
                    onclick="toggleSidebar(true)"
                >
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
                <div class="flex items-center gap-2">
                    <i data-lucide="message-square" class="w-5 h-5 text-indigo-500"></i>
                    <h1 class="font-bold text-lg text-gray-800">그라운드 룰 채팅</h1>
                </div>
                <div id="activeSetBadgeContainer" class="ml-auto">
                    <!-- 활성화된 세트 배지가 동적으로 렌더링됩니다 -->
                </div>
            </header>

            <!-- Chat Messages -->
            <div id="chatContainer" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 bg-[#F8FAFC]">
                <!-- 채팅 메시지가 동적으로 렌더링됩니다 -->
            </div>

            <!-- Input Area -->
            <div class="p-4 bg-white border-t border-gray-200">
                <form id="chatForm" class="flex items-center gap-2 max-w-4xl mx-auto relative">
                    <input
                        type="text"
                        id="messageInput"
                        placeholder="변환하고 싶은 문장을 자유롭게 입력하세요!"
                        class="flex-1 bg-gray-100 text-gray-800 rounded-full py-3 pl-5 pr-12 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 border border-transparent focus:bg-white transition-all shadow-inner"
                        autocomplete="off"
                    />
                    <button
                        type="submit"
                        id="sendBtn"
                        disabled
                        class="absolute right-1.5 p-2 rounded-full transition-all flex items-center justify-center bg-gray-200 text-gray-400 cursor-not-allowed"
                    >
                        <i data-lucide="send" class="w-5 h-5 ml-0.5"></i>
                    </button>
                </form>
                <div class="text-center mt-2 text-[11px] text-gray-400 font-medium">
                    LLM 변환 과정에서 원본의 의도는 훼손하지 않으며 객관적 규칙만 적용됩니다. (맞춤법 교정, 이중 존칭
                    제거 및 전문 용어 순화 포함)
                </div>
            </div>
        </main>

        <script>
            // --- API 설정 및 헬퍼 함수 ---
            const apiKey = ''; // API Key is injected by the environment
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            async function callGemini(systemPrompt, userText) {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

                const payload = {
                    contents: [{ parts: [{ text: userText }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    generationConfig: { temperature: 0.2 },
                };

                let retries = 5;
                let delay = 1000;

                for (let i = 0; i < retries; i++) {
                    try {
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload),
                        });

                        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                        const data = await response.json();
                        return data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || '변환된 텍스트가 없습니다.';
                    } catch (error) {
                        if (i === retries - 1)
                            return '죄송합니다. 텍스트를 변환하는 중 오류가 발생했습니다. 나중에 다시 시도해주세요.';
                        await sleep(delay);
                        delay *= 2;
                    }
                }
            }

            // --- 데이터 정의 ---
            const SETUP_STAGES = [
                {
                    id: 'recipient',
                    question: '변환할 상황에 대해 알려주세요! 대화할 상대방은 누구인가요?',
                    options: [
                        '나보다 직급이 높은 상사',
                        '직급이 같거나 낮은 동료/부하',
                        '친한 친구',
                        '수평적인 커뮤니티 멤버 (예: 우테코)',
                    ],
                },
                {
                    id: 'honorific',
                    question: '존댓말을 사용해야 하는 상황인가요?',
                    options: ['네, 존댓말을 써야 해요', '아니요, 반말을 써도 돼요'],
                },
                {
                    id: 'naming',
                    question: '상대방을 부를 때 어떤 호칭을 사용하나요?',
                    options: [
                        '실명 + 직급/님 (예: 김철수 부장님)',
                        '실명 없이 직급만 (예: 부장님)',
                        '이름만 (예: 철수야)',
                        '별명이나 닉네임 (예: 라바)',
                    ],
                },
                {
                    id: 'setName',
                    question: '거의 다 되었습니다! 나중에 다시 쓸 수 있게 이 규칙 세트의 이름을 무엇으로 저장할까요?',
                    options: ['직장용 (상사)', '친구용', '우아한테크코스'],
                },
            ];

            const defaultProfiles = [
                {
                    id: 'woowa',
                    name: '우아한테크코스',
                    rules: '서로를 별명으로 부르고 "님"을 붙이지 않음. 무조건 존댓말을 사용함. (예: 제성님 안녕 -> 라바 안녕하세요)',
                },
                {
                    id: 'workplace',
                    name: '직장 (회사)',
                    rules: '성+직책으로 부름. 상사에게는 "님"을 붙이고 부하에게는 "님"을 붙이지 않음. 무조건 격식 있는 존댓말을 사용함.',
                },
                {
                    id: 'friends',
                    name: '동네 친구',
                    rules: '서로를 이름으로 부름. 친근한 반말을 사용함. (예: 앨리스님 안녕하세요 -> 민수야 안녕)',
                },
            ];

            // --- 전역 상태 관리 ---
            let state = {
                ruleSets: [...defaultProfiles],
                activeSetId: null,
                chatHistory: [
                    {
                        id: Date.now(),
                        role: 'bot',
                        text: '안녕하세요! 문장을 상황에 맞게 변환해드리는 그라운드 룰 챗봇입니다. 하고 싶은 말을 바로 입력하시거나, 좌측에서 룰 세트를 만들어보세요.',
                    },
                ],
                isLoading: false,
                isSidebarOpen: window.innerWidth >= 768,
                setup: { isSettingUp: false, pendingMessage: null, stageIndex: 0, tempRules: {} },
            };

            // --- DOM 엘리먼트 ---
            const els = {
                sidebar: document.getElementById('sidebar'),
                mobileOverlay: document.getElementById('mobileOverlay'),
                ruleSetList: document.getElementById('ruleSetList'),
                chatContainer: document.getElementById('chatContainer'),
                messageInput: document.getElementById('messageInput'),
                chatForm: document.getElementById('chatForm'),
                sendBtn: document.getElementById('sendBtn'),
                activeSetBadgeContainer: document.getElementById('activeSetBadgeContainer'),
            };

            // --- 유틸리티 ---
            const escapeHTML = (str) =>
                str.replace(
                    /[&<>'"]/g,
                    (tag) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag])
                );
            const scrollToBottom = () =>
                els.chatContainer.scrollTo({ top: els.chatContainer.scrollHeight, behavior: 'smooth' });

            // --- 프롬프트 빌더 ---
            const buildSystemPrompt = (rules) => {
                const rulesText =
                    typeof rules === 'string'
                        ? rules
                        : `- 상대방: ${rules.recipient}\n    - 존댓말/반말 여부: ${rules.honorific}\n    - 호칭 규칙: ${rules.naming}`;
                return `
너는 사용자의 문장을 주어진 '그라운드 룰'에 맞게 변환해주는 전문가야.
객관적이고 정확하게 주어진 규칙만을 적용하여 문장을 재작성해.

[그라운드 룰]
${rulesText}

[제약 사항]
1. 원본 문장의 핵심 의미와 의도는 절대 훼손하지 마.
2. 주어진 그라운드 룰(호칭, 높임말 등)을 원본 문장에 엄격하게 적용해.
3. 이름/호칭 보존 규칙: 원본 문장에 상대방을 부르는 호칭(이름, 닉네임, 별명, 사물/동물 이름 등)이 이미 존재한다면, 해당 단어를 분석하여 그대로 유지해. 주어진 호칭 규칙(예: '님' 제거 등)만 문맥에 맞게 적용하고, 룰 예시에 있는 특정 이름(예: '라바')으로 덮어쓰지 마.
4. 호칭 생성 예외: 원본 문장에 부르는 대상이 아예 생략되어 있고 호칭이 필수적인 상황에만 '라바' 같은 임의의 닉네임을 삽입해.
5. 변환된 최종 문장만 딱 한 줄로 출력해. 부연 설명, 인사말, "변환된 문장:" 같은 접두사는 절대 쓰지 마.
6. 올바른 맞춤법과 띄어쓰기를 적용하고, 어색한 이중 존칭(예: ~되십니다, ~하시었사옵니다 등)은 문맥에 맞게 자연스럽고 객관적인 표현으로 교정해.
7. 특정 분야의 전문 용어(예: 리액트의 Fiber 아키텍처, Reconciliation 등)나 지나치게 어려운 단어가 있다면, 다른 직군(예: 백엔드 개발자, 기획자 등)이 들어도 직관적으로 이해할 수 있도록 의미를 객관적이고 명확하게 풀어서 설명하거나 쉬운 단어로 순화해.`;
            };

            // --- 렌더링 함수 ---
            function renderSidebar() {
                if (state.ruleSets.length === 0) {
                    els.ruleSetList.innerHTML = `<div class="text-sm text-gray-400 text-center py-6">저장된 룰 세트가 없습니다.<br/>새로운 룰을 추가해보세요!</div>`;
                } else {
                    els.ruleSetList.innerHTML = state.ruleSets
                        .map(
                            (set) => `
                    <button onclick="changeActiveSet('${
                        set.id
                    }')" class="w-full text-left px-4 py-3 rounded-xl flex items-center justify-between transition-colors ${
                                state.activeSetId === set.id
                                    ? 'bg-indigo-50 border border-indigo-200 text-indigo-700 shadow-sm'
                                    : 'bg-white border border-gray-100 text-gray-700 hover:bg-gray-50'
                            }">
                        <div class="flex items-center gap-2 truncate">
                            <i data-lucide="check-circle-2" class="w-4 h-4 flex-shrink-0 ${
                                state.activeSetId === set.id ? 'text-indigo-500' : 'text-gray-300'
                            }"></i>
                            <span class="font-medium truncate">${escapeHTML(set.name)}</span>
                        </div>
                        ${
                            state.activeSetId === set.id
                                ? `<i data-lucide="chevron-right" class="w-4 h-4 text-indigo-400 flex-shrink-0"></i>`
                                : ''
                        }
                    </button>
                `
                        )
                        .join('');
                }
                lucide.createIcons();
            }

            function renderHeader() {
                const activeSet = state.ruleSets.find((r) => r.id === state.activeSetId);
                if (activeSet) {
                    els.activeSetBadgeContainer.innerHTML = `
                    <div class="px-3 py-1.5 bg-indigo-50 text-indigo-700 text-xs font-semibold rounded-full border border-indigo-100 flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></span>
                        현재 적용됨: ${escapeHTML(activeSet.name)}
                    </div>`;
                } else {
                    els.activeSetBadgeContainer.innerHTML = '';
                }
            }

            function renderChat() {
                let html = state.chatHistory
                    .map((msg, index) => {
                        if (msg.role === 'system') {
                            return `
                        <div class="flex justify-center">
                            <span class="bg-gray-200/50 text-gray-500 text-xs py-1 px-3 rounded-full font-medium">
                                ${escapeHTML(msg.text)}
                            </span>
                        </div>`;
                        }

                        const isBot = msg.role === 'bot';
                        let optionsHtml = '';

                        if (msg.options && index === state.chatHistory.length - 1) {
                            optionsHtml =
                                `<div class="mt-3 flex flex-wrap gap-2 w-full">` +
                                msg.options
                                    .map(
                                        (opt) =>
                                            `<button onclick="handleOptionClick('${escapeHTML(
                                                opt
                                            )}')" class="px-4 py-2 bg-indigo-50 text-indigo-700 border border-indigo-100 rounded-full text-sm font-medium hover:bg-indigo-100 transition-colors shadow-sm">${escapeHTML(
                                                opt
                                            )}</button>`
                                    )
                                    .join('') +
                                `</div>`;
                        }

                        return `
                    <div class="flex gap-3 ${isBot ? 'flex-row' : 'flex-row-reverse'}">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 mt-1 shadow-sm ${
                            isBot ? 'bg-indigo-600 text-white' : 'bg-blue-100 text-blue-600'
                        }">
                            <i data-lucide="${isBot ? 'bot' : 'user'}" class="w-5 h-5"></i>
                        </div>
                        <div class="flex flex-col max-w-[85%] md:max-w-[70%] ${isBot ? 'items-start' : 'items-end'}">
                            <div class="px-4 py-3 rounded-2xl shadow-sm text-[15px] leading-relaxed whitespace-pre-wrap ${
                                isBot
                                    ? 'bg-white border border-gray-200 text-gray-800 rounded-tl-sm'
                                    : 'bg-indigo-600 text-white rounded-tr-sm'
                            }">${escapeHTML(msg.text)}</div>
                            ${optionsHtml}
                        </div>
                    </div>`;
                    })
                    .join('');

                if (state.isLoading) {
                    html += `
                    <div class="flex gap-3">
                        <div class="w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center flex-shrink-0 mt-1 shadow-sm">
                            <i data-lucide="bot" class="w-5 h-5"></i>
                        </div>
                        <div class="bg-white border border-gray-200 rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm flex items-center gap-2">
                            <span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></span>
                            <span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></span>
                            <span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.4s"></span>
                        </div>
                    </div>`;
                }

                els.chatContainer.innerHTML = html;
                lucide.createIcons();
                scrollToBottom();
            }

            function updateInputUI() {
                const val = els.messageInput.value.trim();
                const disabled = (!val && !state.isLoading) || state.isLoading;

                if (disabled) {
                    els.sendBtn.classList.remove('bg-indigo-600', 'text-white', 'hover:bg-indigo-700', 'shadow-md');
                    els.sendBtn.classList.add('bg-gray-200', 'text-gray-400', 'cursor-not-allowed');
                    els.sendBtn.disabled = true;
                } else {
                    els.sendBtn.classList.add('bg-indigo-600', 'text-white', 'hover:bg-indigo-700', 'shadow-md');
                    els.sendBtn.classList.remove('bg-gray-200', 'text-gray-400', 'cursor-not-allowed');
                    els.sendBtn.disabled = false;
                }

                els.messageInput.placeholder = state.setup.isSettingUp
                    ? '위 버튼을 선택하거나 직접 입력해주세요...'
                    : '변환하고 싶은 문장을 자유롭게 입력하세요!';
            }

            function updateAll() {
                renderSidebar();
                renderHeader();
                renderChat();
                updateInputUI();
            }

            // --- 로직 핸들러 ---
            function toggleSidebar(forceOpen) {
                state.isSidebarOpen = forceOpen !== undefined ? forceOpen : !state.isSidebarOpen;
                if (state.isSidebarOpen) {
                    els.sidebar.classList.remove('-translate-x-full');
                    els.mobileOverlay.classList.remove('hidden');
                } else {
                    els.sidebar.classList.add('-translate-x-full');
                    els.mobileOverlay.classList.add('hidden');
                }
            }

            window.toggleSidebar = toggleSidebar;

            window.changeActiveSet = (setId) => {
                state.activeSetId = setId;
                const setName = state.ruleSets.find((r) => r.id === setId)?.name;
                state.chatHistory.push({
                    id: Date.now(),
                    role: 'system',
                    text: `--- [${setName}] 룰 세트로 변경되었습니다 ---`,
                });

                if (state.setup.isSettingUp) {
                    state.setup = { isSettingUp: false, pendingMessage: null, stageIndex: 0, tempRules: {} };
                }
                if (window.innerWidth < 768) toggleSidebar(false);
                updateAll();
            };

            window.startManualSetup = () => {
                state.setup = { isSettingUp: true, pendingMessage: null, stageIndex: 0, tempRules: {} };
                const firstStage = SETUP_STAGES[0];
                state.chatHistory.push({
                    id: Date.now(),
                    role: 'bot',
                    text: `새로운 그라운드 룰을 만들어봅시다!\n\n${firstStage.question}`,
                    options: firstStage.options,
                });
                if (window.innerWidth < 768) toggleSidebar(false);
                updateAll();
            };

            window.handleOptionClick = (opt) => {
                handleSend(opt);
            };

            async function processMessageWithRule(text, setId, providedRules = null) {
                state.isLoading = true;
                updateAll();

                const ruleSet = providedRules ? { rules: providedRules } : state.ruleSets.find((r) => r.id === setId);
                if (!ruleSet) {
                    state.isLoading = false;
                    updateAll();
                    return;
                }

                const systemPrompt = buildSystemPrompt(ruleSet.rules);
                const rewrittenText = await callGemini(systemPrompt, text);

                state.chatHistory.push({ id: Date.now(), role: 'bot', text: rewrittenText });
                state.isLoading = false;
                updateAll();
            }

            function handleSetupStep(userAnswer) {
                const currentStage = SETUP_STAGES[state.setup.stageIndex];
                state.setup.tempRules[currentStage.id] = userAnswer;
                const nextIndex = state.setup.stageIndex + 1;

                if (nextIndex < SETUP_STAGES.length) {
                    state.setup.stageIndex = nextIndex;
                    const nextStage = SETUP_STAGES[nextIndex];
                    setTimeout(() => {
                        state.chatHistory.push({
                            id: Date.now(),
                            role: 'bot',
                            text: nextStage.question,
                            options: nextStage.options,
                        });
                        updateAll();
                    }, 500);
                } else {
                    const newSetId = Date.now().toString();
                    const newSetName = userAnswer || '새로운 규칙';
                    const newRuleSet = { id: newSetId, name: newSetName, rules: { ...state.setup.tempRules } };

                    state.ruleSets.push(newRuleSet);
                    state.activeSetId = newSetId;

                    const pendingMsg = state.setup.pendingMessage;
                    state.setup = { isSettingUp: false, pendingMessage: null, stageIndex: 0, tempRules: {} };

                    setTimeout(() => {
                        state.chatHistory.push({
                            id: Date.now(),
                            role: 'bot',
                            text: `✅ '${newSetName}' 세트가 저장되었습니다! 앞으로 좌측 메뉴에서 이 규칙을 바로 선택할 수 있습니다.`,
                        });
                        updateAll();

                        if (pendingMsg) {
                            setTimeout(() => processMessageWithRule(pendingMsg, newSetId, newRuleSet.rules), 500);
                        }
                    }, 500);
                }
            }

            async function handleSend(textOverride) {
                const textToProcess = (typeof textOverride === 'string' ? textOverride : els.messageInput.value).trim();
                if (!textToProcess && !state.setup.isSettingUp) return;

                if (textToProcess) {
                    state.chatHistory.push({ id: Date.now(), role: 'user', text: textToProcess });
                }
                els.messageInput.value = '';
                updateAll();

                if (state.setup.isSettingUp) {
                    handleSetupStep(textToProcess);
                    return;
                }

                if (!state.activeSetId) {
                    state.setup = { isSettingUp: true, pendingMessage: textToProcess, stageIndex: 0, tempRules: {} };
                    const firstStage = SETUP_STAGES[0];
                    setTimeout(() => {
                        state.chatHistory.push({
                            id: Date.now(),
                            role: 'bot',
                            text: `아직 설정된 그라운드 룰이 없네요! 입력하신 메시지를 알맞게 변환하기 위해 몇 가지 질문을 드릴게요.\n\n${firstStage.question}`,
                            options: firstStage.options,
                        });
                        updateAll();
                    }, 500);
                    return;
                }

                processMessageWithRule(textToProcess, state.activeSetId);
            }

            // --- 이벤트 리스너 설정 ---
            els.messageInput.addEventListener('input', updateInputUI);
            els.chatForm.addEventListener('submit', (e) => {
                e.preventDefault();
                handleSend();
            });

            // 초기화
            updateAll();
        </script>
    </body>
</html>
