<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Essentials - 기초 학습 앱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f8fafc;
            overflow-x: hidden;
        }

        /* 전체 높이 최적화를 위한 설정 */
        .app-container {
            max-height: 95vh;
            display: flex;
            flex-direction: column;
        }

        /* 헤더 네트워크 패턴 테마 */
        .header-network-bg {
            background-color: #2563eb;
            background-image: radial-gradient(rgba(255, 255, 255, 0.2) 1px, transparent 1px);
            background-size: 20px 20px;
            position: relative;
        }
        
        .header-network-bg::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.8) 0%, rgba(29, 78, 216, 0.9) 100%);
            z-index: 1;
        }

        .header-content {
            position: relative;
            z-index: 2;
        }

        .option-card {
            transition: all 0.2s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 60px;
            font-size: 0.95rem;
            padding: 0.75rem;
        }

        .option-card:hover:not(.disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border-color: #3b82f6;
        }

        .correct {
            border-color: #10b981 !important;
            background-color: #ecfdf5 !important;
            color: #065f46 !important;
        }

        .incorrect {
            border-color: #ef4444 !important;
            background-color: #fef2f2 !important;
            color: #991b1b !important;
        }

        .disabled {
            cursor: default;
            opacity: 0.8;
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .content-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .content-scroll::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 md:p-4">

    <div id="app" class="app-container w-full max-w-2xl bg-white rounded-2xl shadow-xl overflow-hidden relative border border-gray-100">
        <!-- Header with Network Theme -->
        <header class="header-network-bg p-4 text-white shadow-md">
            <div class="header-content flex justify-between items-center">
                <h1 class="text-xl font-bold tracking-tight">Network Essentials</h1>
                <button id="home-btn" onclick="confirmGoHome()" class="hidden hover:bg-white/10 p-2 rounded-lg transition-colors" title="메인으로 이동">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- Progress Bar -->
        <div class="w-full bg-gray-100 h-1.5">
            <div id="progress-bar" class="bg-blue-400 h-full transition-all duration-500" style="width: 0%"></div>
        </div>

        <!-- Main Content -->
        <main class="p-4 md:p-6 overflow-y-auto content-scroll flex-grow">
            <!-- Loading State -->
            <div id="loading-view" class="hidden flex flex-col items-center justify-center py-16">
                <div class="loader mb-4"></div>
                <p class="text-gray-500 font-medium">문제 생성중...</p>
            </div>

            <!-- Start View -->
            <div id="start-view" class="text-center py-10">
                <div class="text-5xl mb-6">🌐</div>
                <h2 class="text-xl font-bold mb-3 text-gray-800">20문제 네트워크 챌린지</h2>
                <p class="text-gray-500 text-sm mb-8 leading-relaxed">실시간으로 생성되는 문제를 통해<br>네트워크 기초 지식을 테스트합니다.</p>
                <button onclick="startQuiz()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-12 rounded-full transition-all shadow-lg hover:shadow-xl active:scale-95">
                    학습 시작하기
                </button>
            </div>

            <!-- Quiz View -->
            <div id="quiz-view" class="hidden">
                <div class="flex justify-between items-center mb-4">
                    <span id="question-number" class="text-blue-600 text-sm font-bold bg-blue-50 px-3 py-1 rounded-md border border-blue-100">문제 1/20</span>
                    <div class="flex items-center gap-2">
                        <span class="text-gray-400 text-[10px] font-bold uppercase tracking-tighter">정답 수</span>
                        <span id="score-display" class="bg-green-100 text-green-700 text-sm font-bold px-3 py-1 rounded-md border border-green-200">0</span>
                    </div>
                </div>

                <h2 id="question-text" class="text-lg font-bold text-gray-800 mb-6 leading-snug">
                    질문 로딩 중...
                </h2>

                <!-- Options Grid -->
                <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-6">
                    <!-- Cards will be injected here via JS -->
                </div>

                <!-- Feedback Area -->
                <div id="feedback-area" class="hidden border-t pt-4">
                    <div id="feedback-status" class="py-2 px-4 rounded-lg mb-3 font-bold text-center text-sm"></div>
                    <div class="bg-gray-50 p-4 rounded-xl border border-gray-100 mb-4">
                        <p class="text-[10px] font-bold text-gray-400 uppercase mb-1">핵심 해설</p>
                        <p id="explanation-text" class="text-gray-600 leading-normal text-sm"></p>
                    </div>
                    <button id="next-btn" onclick="handleNextClick()" class="w-full bg-gray-800 hover:bg-black text-white font-bold py-3 rounded-xl transition-all shadow-md active:scale-[0.98]">
                        다음 문제로
                    </button>
                </div>
            </div>

            <!-- Result View -->
            <div id="result-view" class="hidden text-center py-6">
                <h2 class="text-2xl font-bold mb-8 text-gray-800">학습 완료!</h2>
                
                <div class="flex justify-center gap-6 mb-10">
                    <div class="bg-blue-50 p-4 rounded-2xl w-28 border border-blue-100">
                        <p class="text-[10px] text-blue-400 font-bold uppercase">최종 점수</p>
                        <p id="final-score" class="text-3xl font-bold text-blue-600">0/20</p>
                    </div>
                    <div class="bg-green-50 p-4 rounded-2xl w-28 border border-green-100">
                        <p class="text-[10px] text-green-400 font-bold uppercase">성취도</p>
                        <p id="achievement" class="text-3xl font-bold text-green-500">0%</p>
                    </div>
                </div>

                <button onclick="location.reload()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-all shadow-md text-lg">
                    메인 화면으로
                </button>
            </div>
        </main>
    </div>

    <!-- Custom Confirm Modal -->
    <div id="confirm-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-[60] flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-2xl max-w-xs w-full shadow-2xl">
            <h3 class="font-bold text-lg mb-2">종료하시겠습니까?</h3>
            <p class="text-gray-500 text-sm mb-6">현재까지의 진행 상황이 저장되지 않습니다.</p>
            <div class="flex gap-3">
                <button onclick="closeConfirmModal()" class="flex-1 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg font-semibold text-gray-600 transition-colors">취소</button>
                <button onclick="goHome()" class="flex-1 py-2 bg-red-500 hover:bg-red-600 rounded-lg font-semibold text-white transition-colors">종료</button>
            </div>
        </div>
    </div>

    <script>
        const apiKey = ""; 
        let questions = []; 
        let currentIndex = 0;
        let score = 0;
        let isAnswered = false;
        let isGenerating = false;
        
        const TOTAL_GOAL = 20;
        const BATCH_SIZE = 5;

        const views = {
            start: document.getElementById('start-view'),
            loading: document.getElementById('loading-view'),
            quiz: document.getElementById('quiz-view'),
            result: document.getElementById('result-view'),
            homeBtn: document.getElementById('home-btn')
        };

        function switchView(viewName) {
            Object.values(views).forEach(view => {
                if(view) view.classList.add('hidden');
            });
            if(views[viewName]) views[viewName].classList.remove('hidden');
            
            if (viewName === 'quiz' || viewName === 'result') {
                views.homeBtn.classList.remove('hidden');
            } else {
                views.homeBtn.classList.add('hidden');
            }
        }

        async function fetchBatch() {
            if (isGenerating || questions.length >= TOTAL_GOAL) return;
            
            isGenerating = true;

            const systemPrompt = `당신은 네트워크 전문가입니다. 네트워크 기초 지식 객관식 문제 ${BATCH_SIZE}개를 생성하세요.
            반드시 JSON 형식이어야 합니다:
            {
                "questions": [
                    {
                        "question": "문제 내용",
                        "options": ["선지1", "선지2", "선지3", "선지4"],
                        "answerIndex": 0,
                        "explanation": "1~2줄 요약 해설"
                    }
                ]
            }
            해설은 반드시 1줄로 매우 간결하게 요약하세요. 기존 문제와 중복되지 않게 하세요.`;

            try {
                const response = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `네트워크 기초 문제 ${BATCH_SIZE}개를 생성해줘.` }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: { 
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "OBJECT",
                                properties: {
                                    questions: {
                                        type: "ARRAY",
                                        items: {
                                            type: "OBJECT",
                                            properties: {
                                                question: { type: "STRING" },
                                                options: { type: "ARRAY", items: { type: "STRING" } },
                                                answerIndex: { type: "NUMBER" },
                                                explanation: { type: "STRING" }
                                            },
                                            required: ["question", "options", "answerIndex", "explanation"]
                                        }
                                    }
                                }
                            }
                        }
                    })
                });

                const data = await response.json();
                const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                const parsed = JSON.parse(text);
                
                if (parsed && Array.isArray(parsed.questions)) {
                    questions = [...questions, ...parsed.questions];
                    
                    if (questions.length === BATCH_SIZE && currentIndex === 0) {
                        switchView('quiz');
                        renderQuestion();
                    }
                    
                    isGenerating = false;
                    if (questions.length < TOTAL_GOAL) {
                        fetchBatch(); 
                    }
                }
            } catch (error) {
                console.error("Batch Fetch Error:", error);
                isGenerating = false;
                if (questions.length === 0) {
                    showErrorMessage("네트워크 오류가 발생했습니다.");
                    switchView('start');
                }
            }
        }

        async function fetchWithRetry(url, options, retries = 5, backoff = 1000) {
            try {
                const res = await fetch(url, options);
                if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
                return res;
            } catch (err) {
                if (retries <= 0) throw err;
                await new Promise(resolve => setTimeout(resolve, backoff));
                return fetchWithRetry(url, options, retries - 1, backoff * 2);
            }
        }

        function startQuiz() {
            questions = [];
            currentIndex = 0;
            score = 0;
            switchView('loading');
            fetchBatch(); 
        }

        function renderQuestion() {
            const q = questions[currentIndex];
            if (!q) return;

            isAnswered = false;
            document.getElementById('question-number').innerText = `문제 ${currentIndex + 1}/${TOTAL_GOAL}`;
            document.getElementById('score-display').innerText = score;
            document.getElementById('question-text').innerText = q.question;
            document.getElementById('progress-bar').style.width = `${((currentIndex) / TOTAL_GOAL) * 100}%`;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            q.options.forEach((opt, idx) => {
                const card = document.createElement('div');
                card.className = 'option-card border-2 border-gray-100 bg-white rounded-xl font-medium text-gray-700';
                card.innerText = opt;
                card.onclick = () => selectOption(idx);
                container.appendChild(card);
            });

            document.getElementById('feedback-area').classList.add('hidden');
        }

        function selectOption(index) {
            if (isAnswered) return;
            isAnswered = true;

            const q = questions[currentIndex];
            const cards = document.querySelectorAll('.option-card');
            const feedbackArea = document.getElementById('feedback-area');
            const feedbackStatus = document.getElementById('feedback-status');
            const explanationText = document.getElementById('explanation-text');

            cards.forEach(card => card.classList.add('disabled'));

            if (index === q.answerIndex) {
                cards[index].classList.add('correct');
                score++;
                document.getElementById('score-display').innerText = score;
                feedbackStatus.innerText = "정답입니다!";
                feedbackStatus.className = "py-2 px-4 rounded-lg mb-3 font-bold text-center text-sm bg-green-100 text-green-700";
            } else {
                if(cards[index]) cards[index].classList.add('incorrect');
                if(cards[q.answerIndex]) cards[q.answerIndex].classList.add('correct');
                feedbackStatus.innerText = "오답입니다.";
                feedbackStatus.className = "py-2 px-4 rounded-lg mb-3 font-bold text-center text-sm bg-red-100 text-red-700";
            }

            explanationText.innerText = q.explanation;
            feedbackArea.classList.remove('hidden');
            feedbackArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function handleNextClick() {
            const nextIndex = currentIndex + 1;
            if (nextIndex < TOTAL_GOAL) {
                if (questions[nextIndex]) {
                    currentIndex++;
                    renderQuestion();
                } else {
                    showErrorMessage("문제를 생성 중입니다...");
                }
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('progress-bar').style.width = `100%`;
            document.getElementById('final-score').innerText = `${score}/${TOTAL_GOAL}`;
            const percent = Math.round((score / TOTAL_GOAL) * 100);
            document.getElementById('achievement').innerText = `${percent}%`;
            switchView('result');
        }

        function showErrorMessage(msg) {
            const existingToast = document.querySelector('.toast-msg');
            if (existingToast) return;

            const msgBox = document.createElement('div');
            msgBox.className = "toast-msg fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-2 rounded-full shadow-2xl z-50 text-xs font-medium";
            msgBox.innerText = msg;
            document.body.appendChild(msgBox);
            setTimeout(() => msgBox.remove(), 2500);
        }

        function confirmGoHome() {
            if (currentIndex < TOTAL_GOAL && questions.length > 0 && !document.getElementById('result-view').classList.contains('hidden')) {
                goHome();
            } else if (!document.getElementById('quiz-view').classList.contains('hidden')) {
                document.getElementById('confirm-modal').classList.remove('hidden');
            } else {
                goHome();
            }
        }

        function closeConfirmModal() {
            document.getElementById('confirm-modal').classList.add('hidden');
        }

        function goHome() {
            closeConfirmModal();
            questions = [];
            currentIndex = 0;
            score = 0;
            switchView('start');
            document.getElementById('progress-bar').style.width = '0%';
        }
    </script>
</body>
</html>
