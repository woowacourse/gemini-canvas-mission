<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정신체리 - Mind Cherry</title>
    <style>
        :root {
            /* 우드 톤 & 고즈넉한 테마 컬러 */
            --bg-color: #f4f1ea; /* 부드러운 한지/모래색 */
            --card-bg: #fffdf9; /* 밝은 크림색 */
            --text-main: #3e2723; /* 진한 커피색 */
            --text-dim: #795548; /* 연한 브라운 */
            --accent-fact: #a64452; /* 체리색 (비평 지적 구간) */
            --accent-insight: #6d8264; /* 평온한 녹색 (긍정적 성찰 구간) */
            --accent-critique: #b08968; /* 따뜻한 나무색 */
            --accent-interview: #5d4037; /* 짙은 나무색 */
            --border-color: #d7ccc8; /* 연한 점토색 */
            --shadow-lg: 0 10px 25px -5px rgba(62, 39, 35, 0.1), 0 8px 10px -6px rgba(62, 39, 35, 0.1);
        }

        body {
            font-family: 'Pretendard', 'Noto Serif KR', serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .app-container {
            width: 100%;
            max-width: 800px;
            padding: 80px 20px;
            box-sizing: border-box;
        }

        /* Views */
        .view-section {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }

        .view-section.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* 1. Input View */
        #input-view {
            text-align: center;
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 15px;
            color: var(--accent-fact);
            letter-spacing: -0.04em;
        }

        .hero-desc {
            color: var(--text-dim);
            font-size: 1.2rem;
            margin-bottom: 50px;
            letter-spacing: 0.05em;
        }

        .input-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
        }

        textarea#raw-input {
            width: 100%;
            height: 350px;
            background: #fafafa;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 8px;
            resize: none;
            font-size: 1.1rem;
            line-height: 1.8;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        textarea#raw-input:focus {
            border-color: var(--accent-critique);
            background: #fff;
        }

        .btn-analyze {
            margin-top: 30px;
            background: var(--accent-interview);
            color: #fff;
            border: none;
            padding: 18px 80px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-analyze:hover {
            background: var(--accent-fact);
            transform: translateY(-2px);
        }

        /* 2. Analysis View */
        .gauge-area {
            margin-bottom: 50px;
            text-align: center;
        }

        .gauge-bar {
            height: 6px;
            background: #e0dcd0;
            border-radius: 3px;
            overflow: hidden;
            margin: 15px 0;
        }

        .gauge-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-insight);
            transition: width 2s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 12px;
            margin-bottom: 40px;
            box-shadow: var(--shadow-lg);
        }

        .critique-card {
            border-top: 4px solid var(--accent-fact);
            background: #fff;
        }

        .critique-card h4 {
            margin: 0 0 20px 0;
            color: var(--accent-fact);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        .critique-text {
            font-size: 1.25rem;
            line-height: 2.2;
            letter-spacing: 0.08em;
            color: var(--text-main);
            white-space: pre-wrap;
        }

        .sentence-display {
            font-size: 1.1rem;
            line-height: 2.2;
            color: var(--text-main);
        }

        .critique-point {
            text-decoration: underline wavy var(--accent-fact);
            background-color: rgba(166, 68, 82, 0.12);
            padding: 2px 0;
            cursor: pointer;
        }
        .insight-sentence { background: rgba(109, 130, 100, 0.15); border-bottom: 2px solid var(--accent-insight); }
        .general-fact { color: var(--text-dim); opacity: 0.6; }

        /* 3. Interview View */
        .interview-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 60px 40px;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            text-align: center;
        }

        .step-tag {
            font-size: 0.8rem;
            background: var(--accent-fact);
            color: white;
            padding: 5px 15px;
            border-radius: 4px;
            margin-bottom: 30px;
            display: inline-block;
            font-weight: 700;
        }

        .interview-q {
            font-size: 1.6rem;
            font-weight: 800;
            line-height: 1.6;
            margin-bottom: 40px;
            color: var(--text-main);
        }

        .interview-a {
            width: 100%;
            background: #fafafa;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 24px;
            border-radius: 8px;
            min-height: 200px;
            font-size: 1.2rem;
            outline: none;
            transition: all 0.3s;
            line-height: 1.8;
            text-align: center;
            box-sizing: border-box;
        }

        .interview-a:focus {
            border-color: var(--accent-fact);
            background: #fff;
        }

        .error-message {
            color: var(--accent-fact);
            font-size: 0.9rem;
            margin-top: 15px;
            font-weight: 700;
            display: none;
        }

        .btn-action {
            padding: 18px 50px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 1.15rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-interview-start {
            background: var(--accent-insight);
            color: white;
            width: 100%;
            margin-top: 30px;
        }

        .btn-next {
            background: var(--accent-interview);
            color: white;
            margin-top: 30px;
            display: inline-block;
        }

        /* 4. Final View */
        .summary-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 60px 40px;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
        }

        .summary-item { margin-bottom: 50px; }
        .summary-title {
            color: var(--accent-insight);
            font-weight: 900;
            font-size: 1.5rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .summary-content {
            padding-left: 24px;
            border-left: 2px solid var(--border-color);
            line-height: 2.2;
            color: var(--text-main);
            font-size: 1.2rem;
            white-space: pre-wrap;
            letter-spacing: 0.05em;
        }

        .btn-copy {
            background: var(--accent-insight);
            color: #fff;
            width: 100%;
            padding: 24px;
            font-size: 1.3rem;
            margin-top: 30px;
            font-weight: 900;
        }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(244, 241, 234, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .spinner {
            font-size: 4rem;
            margin-bottom: 30px;
            animation: bounce 1.2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-30px); }
        }

        .shake { animation: shakeEffect 0.5s ease; }
        @keyframes shakeEffect {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        .copy-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-interview);
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 0.9rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: none;
            z-index: 10001;
        }
    </style>
</head>
<body>

<div id="loading-overlay" class="loading-overlay">
    <div class="spinner">🍒</div>
    <h2 id="loading-text" style="color: var(--text-main); font-weight: 900;">당신의 문맥을 깊이 있게 분석 중...</h2>
</div>

<div id="copy-toast" class="copy-toast">복사가 완료되었습니다.</div>

<div class="app-container">

    <section id="input-view" class="view-section active" style="display: block;">
        <h1 class="hero-title">정신체리 🍒</h1>
        <p class="hero-desc">안일한 회고를 상큼하게 깨워주는 성찰 공간</p>
        <div class="input-card">
            <textarea id="raw-input" placeholder="오늘 당신이 마주한 고통과 선택의 트레이드오프를 가감 없이 기록하세요..."></textarea>
            <button id="btn-analyze" type="button" class="btn-analyze">분석 시작</button>
        </div>
    </section>

    <section id="analysis-view" class="view-section">
        <div class="gauge-area">
            <h2 style="margin:0; font-size: 1rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.2em;">성찰 지수 판독</h2>
            <div class="gauge-bar"><div id="progress-fill" class="gauge-fill"></div></div>
            <div id="status-text" style="font-weight: 700; font-size: 1.1rem; color: var(--text-dim);"></div>
        </div>

        <div class="card critique-card">
            <h4>⚠️ 정신체리 비평</h4>
            <div id="overall-critique" class="critique-text"></div>
        </div>

        <div class="card">
            <h3 style="margin-top: 0; font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 25px;">Context Highlights</h3>
            <div id="sentence-display" class="sentence-display"></div>
            <p style="font-size: 0.8rem; color: var(--text-dim); margin-top: 15px;">
                <span style="background: rgba(166, 68, 82, 0.15); border-bottom: 2px solid var(--accent-fact);">체리색</span>: 비평에서 지적된 정신 못 차린 구간 (보완 필요)
            </p>
        </div>

        <button id="btn-start-interview" type="button" class="btn-action btn-interview-start">5단계 심층 인터뷰로 들어가기</button>
    </section>

    <section id="interview-view" class="view-section">
        <div id="interview-card" class="interview-box">
            <div id="step-tag" class="step-tag">STEP 1 / 5</div>
            <div id="interview-question" class="interview-q"></div>
            <textarea id="interview-answer" class="interview-a" placeholder="당신의 깊이를 이곳에 담아주세요."></textarea>
            <div id="interview-error" class="error-message">그렇게 안일하게 대답하면 정신 못 체립니다. 더 구체적으로 쓰세요.</div>
            <div>
                <button id="btn-next-step" type="button" class="btn-action btn-next">다음 질문</button>
            </div>
        </div>
    </section>

    <section id="final-view" class="view-section">
        <div class="summary-box">
            <h2 style="text-align:center; margin-top:0; color: var(--text-main); font-weight: 900; font-size: 2.2rem; margin-bottom: 60px;">🏆 정신체리 성찰 리포트</h2>

            <div class="summary-item">
                <div class="summary-title">✨ 핵심 깨달음</div>
                <div id="sum-insight" class="summary-content"></div>
            </div>

            <div class="summary-item">
                <div class="summary-title">🔥 새로운 도전 의식</div>
                <div id="sum-spirit" class="summary-content"></div>
            </div>

            <div class="summary-item">
                <div class="summary-title">🚀 개선된 성장 방향</div>
                <div id="sum-direction" class="summary-content"></div>
            </div>

            <button id="btn-copy" type="button" class="btn-action btn-copy">최종 리포트 복사</button>
        </div>
    </section>

</div>

<script>
    const apiKey = "";
    const loadingOverlay = document.getElementById('loading-overlay');
    const loadingText = document.getElementById('loading-text');
    const interviewError = document.getElementById('interview-error');
    const copyToast = document.getElementById('copy-toast');

    const views = {
        input: document.getElementById('input-view'),
        analysis: document.getElementById('analysis-view'),
        interview: document.getElementById('interview-view'),
        final: document.getElementById('final-view')
    };

    const rawInput = document.getElementById('raw-input');
    const progressFill = document.getElementById('progress-fill');
    const statusText = document.getElementById('status-text');
    const overallCritique = document.getElementById('overall-critique');
    const sentenceDisplay = document.getElementById('sentence-display');

    const interviewQuestion = document.getElementById('interview-question');
    const interviewAnswer = document.getElementById('interview-answer');
    const stepTag = document.getElementById('step-tag');
    const interviewCard = document.getElementById('interview-card');
    const btnNextStep = document.getElementById('btn-next-step');

    let interviewQs = [];
    let interviewAs = [];
    let currentStep = 0;

    function switchView(viewId) {
        if (!views[viewId]) return;
        Object.keys(views).forEach(key => {
            views[key].classList.remove('active');
            views[key].style.display = 'none';
        });
        const target = views[viewId];
        target.style.display = 'block';
        setTimeout(() => {
            target.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }, 50);
    }

    function showToast(message) {
        copyToast.innerText = message;
        copyToast.style.display = 'block';
        setTimeout(() => {
            copyToast.style.display = 'none';
        }, 3000);
    }

    function parseAIResponse(text) {
        try {
            const jsonMatch = text.match(/\{[\s\S]*\}/);
            if (jsonMatch) return JSON.parse(jsonMatch[0]);
            return JSON.parse(text);
        } catch (e) {
            console.error("JSON 파싱 실패:", text);
            throw new Error("AI 응답 형식이 올바르지 않습니다.");
        }
    }

    async function callGemini(payload) {
        let retries = 0;
        while (retries < 5) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!response.ok) throw new Error('API Response Error');
                const data = await response.json();
                const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!rawText) throw new Error('Response Text Empty');
                return parseAIResponse(rawText);
            } catch (e) {
                retries++;
                if (retries === 5) throw e;
                await new Promise(r => setTimeout(r, Math.pow(2, retries) * 1000));
            }
        }
    }

    document.getElementById('btn-analyze').addEventListener('click', async (e) => {
        e.preventDefault();
        const text = rawInput.value.trim();
        if (!text) return;

        loadingOverlay.style.display = 'flex';
        loadingText.innerText = "당신의 문맥을 깊이 있게 분석 중...";

        const prompt = `
            너는 우테코 8기 시니어 코치이자, 안일한 크루들의 정신을 체리처럼 상큼하게(?) 깨워주는 독설가 '정신체리'다.
            다음 회고록의 맥락을 분석하라.
            1. overall_critique: 개발자로서의 관점에서 작성자의 안일함을 친한 친구처럼 뼈 때리는 날카로운 팩폭으로 지적하라 (15~20줄 내외). 문장별 줄바꿈을 통해 가독성을 높여라. "정신체리"라는 정체성에 어울리게 말하라.
               중요: 비평의 마지막 부분에는 작성자가 이 회고에서 보여준 긍정적인 면이나 잘한 점을 반드시 한두 줄 포함하여 따뜻한 칭찬으로 마무리하라.
            2. analysis: 문맥을 분석하여 비평(overall_critique)에서 구체적으로 지적하거나 비판한 문장은 CRITIQUE_POINT로 분류하라. 이미 성찰이 담긴 문장은 INSIGHT로, 그 외 일반적인 사실은 GENERAL_FACT로 분류하라.
            3. refinement_questions: 성찰을 완성할 5개의 심층 질문. (문맥 기반)

            JSON 응답 형식: { "overall_critique": "...", "analysis": [{"sentence": "...", "type": "..."}], "refinement_questions": ["...", "...", "...", "...", "..."] }
            텍스트: "${text}"
        `;

        try {
            const result = await callGemini({
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            overall_critique: { type: "STRING" },
                            analysis: { type: "ARRAY", items: { type: "OBJECT", properties: { sentence: {type: "STRING"}, type: {type: "STRING", enum: ["CRITIQUE_POINT", "GENERAL_FACT", "INSIGHT"]} } } },
                            refinement_questions: { type: "ARRAY", items: {type: "STRING"}, minItems: 5, maxItems: 5 }
                        },
                        required: ["overall_critique", "analysis", "refinement_questions"]
                    }
                }
            });

            if (!result || !result.analysis) throw new Error("분석 데이터 형식이 올바르지 않습니다.");
            interviewQs = result.refinement_questions || [];
            overallCritique.innerText = result.overall_critique || "";
            let html = "";
            let critiqueCount = 0, insightCount = 0;
            result.analysis.forEach(item => {
                const sentence = item.sentence || "";
                if (item.type === "CRITIQUE_POINT") {
                    critiqueCount++; html += `<span class="critique-point">${sentence}</span> `;
                } else if (item.type === "INSIGHT") {
                    insightCount++; html += `<span class="insight-sentence">${sentence}</span> `;
                } else {
                    html += `<span class="general-fact">${sentence}</span> `;
                }
            });
            sentenceDisplay.innerHTML = html;
            const score = (critiqueCount + insightCount) > 0 ? Math.round((insightCount / (critiqueCount + insightCount)) * 100) : 0;
            progressFill.style.width = score + "%";
            statusText.innerText = score < 50 ? "아직 정신 못 차렸군요. 체리색 문장들을 확인하세요." : "고민의 흔적이 느껴집니다. 마지막 관문을 통과해볼까요?";
            switchView('analysis');
        } catch (err) {
            console.error(err);
            showToast("분석 중 오류가 발생했습니다.");
        } finally {
            loadingOverlay.style.display = 'none';
        }
    });

    document.getElementById('btn-start-interview').addEventListener('click', (e) => {
        e.preventDefault();
        currentStep = 0;
        interviewAs = [];
        switchView('interview');
        showStep();
    });

    function showStep() {
        stepTag.innerText = `STEP ${currentStep + 1} / 5`;
        interviewQuestion.innerText = interviewQs[currentStep] || "준비된 질문이 없습니다.";
        interviewAnswer.value = "";
        interviewError.style.display = 'none';

        if (currentStep === 4) {
            btnNextStep.innerText = "제출";
        } else {
            btnNextStep.innerText = "다음 질문";
        }

        interviewCard.classList.remove('shake');
        void interviewCard.offsetWidth;
        interviewCard.classList.add('shake');
        interviewAnswer.focus();
    }

    btnNextStep.addEventListener('click', async (e) => {
        e.preventDefault();
        const ans = interviewAnswer.value.trim();
        if (ans.length < 10) {
            interviewError.style.display = 'block';
            return;
        }
        interviewError.style.display = 'none';
        interviewAs.push(ans);

        if (currentStep < 4) {
            currentStep++;
            showStep();
        } else {
            generateFinalSummary();
        }
    });

    async function generateFinalSummary() {
        loadingOverlay.style.display = 'flex';
        loadingText.innerText = "정신체리 리포트를 작성 중입니다...";
        const originalText = rawInput.value;
        const qAndA = interviewQs.map((q, i) => `Q: ${q}\nA: ${interviewAs[i]}`).join('\n');

        const prompt = `
            사용자의 원본 회고와 5단계의 인터뷰 답변을 보고 '정신체리 최종 리포트'를 작성하라.
            너의 페르소나('정신체리' - 팩폭 섞인 애정 어린 코치)를 100% 유지하며 작성하라.
            단순히 내용을 정리하지 말고, 사용자가 어떻게 정신을 차리고 성장을 준비했는지 강조하며 마지막 조언을 건네라.

            각 항목 내에서 문장별로 줄바꿈(\\n)을 적용하여 가독성을 높인 개괄식으로 작성하라.
            - insight_summary: 답변을 통해 사용자가 스스로 인정한 본인의 '안일함'과 새롭게 얻은 기술적 성찰.
            - spirit_summary: "이제야 좀 정신이 체려지는군"과 같은 뉘앙스를 섞어, 새롭게 깨어난 개발자로서의 다짐.
            - direction_summary: 앞으로 당장 실천할 구체적인 학습 및 트레이드오프 분석 전략.

            JSON 응답 형식: { "insight_summary": "...", "spirit_summary": "...", "direction_summary": "..." }
            원본: "${originalText}"
            인터뷰: "${qAndA}"
        `;

        try {
            const summary = await callGemini({
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            insight_summary: { type: "STRING" },
                            spirit_summary: { type: "STRING" },
                            direction_summary: { type: "STRING" }
                        },
                        required: ["insight_summary", "spirit_summary", "direction_summary"]
                    }
                }
            });
            document.getElementById('sum-insight').innerText = summary.insight_summary || "";
            document.getElementById('sum-spirit').innerText = summary.spirit_summary || "";
            document.getElementById('sum-direction').innerText = summary.direction_summary || "";
            switchView('final');
        } catch (err) {
            console.error(err);
            showToast("리포트 생성 중 오류가 발생했습니다.");
        } finally {
            loadingOverlay.style.display = 'none';
        }
    }

    document.getElementById('btn-copy').addEventListener('click', (e) => {
        e.preventDefault();
        const content =
            `[정신체리 성찰 종합 리포트]\n\n` +
            `✨ 핵심 깨달음\n${document.getElementById('sum-insight').innerText}\n\n` +
            `🔥 새로운 도전 의식\n${document.getElementById('sum-spirit').innerText}\n\n` +
            `🚀 개선된 성장 방향\n${document.getElementById('sum-direction').innerText}\n\n` +
            `타협하지 않는 고민이 진짜 성장입니다. 고생하셨습니다.`;
        const el = document.createElement('textarea');
        el.value = content;
        document.body.appendChild(el);
        el.select();
        try {
            document.execCommand('copy');
            showToast("최종 리포트가 복사되었습니다.");
        } catch (err) { console.error('복사 실패', err); }
        document.body.removeChild(el);
    });
</script>

</body>
</html>
