<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오목 대전 v3.1 - 핫픽스 적용</title>
    <!-- [수정됨] 구버전 링크 제거하고 최신 Tailwind CSS v3 CDN 적용 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&display=swap');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f1f5f9;
            color: #334155;
            -webkit-user-select: none;
            user-select: none;
            overflow-x: hidden;
        }

        #board-frame {
            background: linear-gradient(135deg, #E1B16A, #C89447);
            padding: 14px;
            border-radius: 8px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
            border-bottom: 8px solid #8B5A2B;
            border-right: 8px solid #8B5A2B;
            position: relative;
            width: 100%;
            max-width: 650px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
        }

        #board-inner {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 20;
        }

        .cell {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .stone {
            width: 88%; height: 88%;
            max-width: 100%; max-height: 100%;
            border-radius: 50%; z-index: 30;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 2px 3px 5px rgba(0,0,0,0.4);
            flex-shrink: 0; position: relative;
        }

        .cell .stone { position: absolute; }

        .stone.black { background: radial-gradient(circle at 30% 30%, #444, #111, #000); }
        .stone.white { background: radial-gradient(circle at 30% 30%, #fff, #eee, #ccc); border: 1px solid rgba(0,0,0,0.05); }

        .stone::after {
            content: ''; position: absolute;
            top: 15%; left: 20%; width: 30%; height: 30%;
            border-radius: 50%; filter: blur(1px);
        }
        .stone.black::after { background: rgba(255,255,255,0.12); }
        .stone.white::after { background: rgba(255,255,255,0.5); }

        .ghost-stone {
            width: 80%; height: 80%; max-width: 100%; border-radius: 50%;
            position: absolute; z-index: 25; opacity: 0;
            transition: opacity 0.1s; pointer-events: none;
        }
        .cell:not(.occupied):hover .ghost-stone { opacity: 0.35; }
        .ghost-stone.black { background: black; }
        .ghost-stone.white { background: white; }

        .hint-marker {
            width: 12px; height: 12px; border-radius: 50%;
            position: absolute; z-index: 40;
            background-color: #3b82f6; box-shadow: 0 0 15px #3b82f6;
            animation: ping 1s infinite;
        }

        .stone-preview {
            width: 24px !important; height: 24px !important;
            min-width: 24px; min-height: 24px;
            position: relative !important;
            box-shadow: 1px 2px 3px rgba(0,0,0,0.2);
        }

        .btn-faction { transition: all 0.3s; border: 2px solid transparent; }
        .btn-faction.black-active { background-color: #1e293b; color: white; border-color: #0f172a; }
        .btn-faction.white-active { background-color: #ffffff; color: #1e293b; border-color: #cbd5e1; }

        .btn-diff { transition: all 0.2s; border: 2px solid transparent; }
        .btn-diff.easy-active { background-color: #10b981; color: white; }
        .btn-diff.hard-active { background-color: #f43f5e; color: white; }

        .progress-transition { transition: width 0.7s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="flex flex-col items-center py-6 md:py-10 px-4">

    <!-- 결과 모달 창 -->
    <div id="game-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-900/60 backdrop-blur-sm opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-sm w-full mx-4 transform scale-95 transition-transform duration-300 flex flex-col items-center text-center">
            <div id="modal-icon" class="w-20 h-20 rounded-full flex items-center justify-center mb-5 text-4xl shadow-inner">
                <!-- 아이콘 삽입 -->
            </div>
            <h2 id="modal-title" class="text-3xl font-black text-slate-800 mb-2">결과</h2>
            <p id="modal-desc" class="text-slate-500 font-medium mb-8">서브 메시지</p>
            <button id="btn-modal-reset" class="w-full py-4 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-bold text-lg transition-colors shadow-lg">
                다시 시작하기
            </button>
        </div>
    </div>

    <div class="max-w-6xl w-full grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        
        <!-- 좌측: 보드 영역 -->
        <div class="lg:col-span-8 flex flex-col items-center">
            <header class="text-center mb-6">
                <h1 class="text-3xl font-bold text-slate-800 flex items-center justify-center gap-2">
                    오목 대전 <span class="text-blue-500 text-sm font-semibold bg-blue-50 px-2 py-1 rounded-full border border-blue-100">v3.1</span>
                </h1>
                <p class="text-slate-500 text-sm mt-1">스마트 패턴 인식 AI와 대결하세요.</p>
            </header>

            <div id="board-frame">
                <div id="board-inner">
                    <svg id="grid-svg" class="absolute inset-0 w-full h-full pointer-events-none" style="z-index: 10;" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
                    <div id="board"></div>
                </div>
            </div>

            <div id="status-display" class="mt-8 px-10 py-3 bg-white rounded-full shadow-lg border border-slate-100 text-lg font-bold text-blue-600">
                게임을 시작합니다.
            </div>
        </div>

        <!-- 우측: 대시보드 영역 -->
        <div class="lg:col-span-4 flex flex-col gap-4 w-full max-w-[340px] mx-auto">
            
            <div class="bg-white p-5 rounded-2xl shadow-xl border border-slate-50">
                <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">GAME STATUS</h3>
                
                <div class="flex items-center justify-between mb-6">
                    <div id="indicator-player" class="flex flex-col items-center gap-1 p-3 rounded-xl border transition-all w-24 h-24 justify-center">
                        <div id="player-stone-preview" class="stone stone-preview"></div>
                        <span class="text-xs font-bold text-slate-600">나</span>
                    </div>
                    
                    <svg id="turn-arrow" class="w-5 h-5 text-slate-300 transition-all" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>

                    <div id="indicator-ai" class="flex flex-col items-center gap-1 p-3 rounded-xl border transition-all w-24 h-24 justify-center">
                        <div id="ai-stone-preview" class="stone stone-preview"></div>
                        <span class="text-xs font-bold text-slate-600">AI</span>
                    </div>
                </div>

                <!-- [수정됨] 승률 시각화 부분 명확하게 개편 -->
                <div class="space-y-2 mt-4">
                    <div class="flex justify-between items-end">
                        <span class="text-xs font-bold text-slate-500">나의 승리 확률</span>
                        <span id="win-prob-text" class="text-lg font-black text-blue-600">50%</span>
                    </div>
                    <div class="w-full h-3 bg-slate-100 rounded-full overflow-hidden flex shadow-inner relative">
                        <div id="win-prob-bar" class="h-full bg-blue-500 progress-transition" style="width: 50%"></div>
                        <div id="lose-prob-bar" class="h-full bg-rose-400 progress-transition" style="width: 50%"></div>
                    </div>
                    <div class="flex justify-between text-[11px] font-bold text-slate-400">
                        <span class="text-blue-500">← 나 우세</span>
                        <span class="text-rose-500">AI 우세 →</span>
                    </div>
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-xl border border-slate-50 space-y-5">
                <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">CONTROLS</h3>
                
                <div>
                    <label class="text-[11px] font-bold text-slate-500 mb-2 block">나의 진영 선택</label>
                    <div class="flex p-1 bg-slate-100 rounded-lg gap-1">
                        <button id="btn-set-black" class="btn-faction flex-1 py-2 rounded-md text-xs font-bold">흑돌</button>
                        <button id="btn-set-white" class="btn-faction flex-1 py-2 rounded-md text-xs font-bold">백돌</button>
                    </div>
                </div>

                <div>
                    <label class="text-[11px] font-bold text-slate-500 mb-2 block">AI 난이도</label>
                    <div class="flex p-1 bg-slate-100 rounded-lg gap-1">
                        <button id="btn-diff-easy" class="btn-diff flex-1 py-2 rounded-md text-xs font-bold">쉬움</button>
                        <button id="btn-diff-hard" class="btn-diff flex-1 py-2 rounded-md text-xs font-bold">어려움</button>
                    </div>
                </div>

                <div class="pt-1 space-y-2">
                    <button id="btn-hint" class="w-full py-3 rounded-xl bg-blue-50 text-blue-600 text-sm font-bold hover:bg-blue-100 transition-all flex items-center justify-center gap-2 border border-blue-100">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        최적의 수 힌트
                    </button>
                    <button id="btn-reset" class="w-full py-2.5 rounded-xl bg-slate-50 text-slate-500 text-sm font-bold hover:bg-slate-200 transition-all">
                        보드 초기화
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BOARD_SIZE = 15;
        const BLACK = 1, WHITE = 2, EMPTY = 0;
        const HOSHI = [[3,3], [3,11], [11,3], [11,11], [7,7]];

        let board = [], playerColor = BLACK, aiColor = WHITE, turn = BLACK, difficulty = 'hard', winner = 0, isAiThinking = false;

        const boardEl = document.getElementById('board');
        const gridSvg = document.getElementById('grid-svg');
        const statusDisplay = document.getElementById('status-display');
        const winProbBar = document.getElementById('win-prob-bar');
        const loseProbBar = document.getElementById('lose-prob-bar');
        const winProbText = document.getElementById('win-prob-text');

        function init() {
            hideModal();
            board = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(EMPTY));
            turn = BLACK; winner = 0; isAiThinking = false;
            drawGrid();
            renderBoard();
            updateUI();
            
            if (playerColor === WHITE) {
                isAiThinking = true;
                statusDisplay.textContent = "AI가 먼저 대국을 시작합니다...";
                setTimeout(makeAiMove, 800);
            } else {
                statusDisplay.textContent = "당신의 차례입니다 (흑)";
            }
        }

        function drawGrid() {
            gridSvg.innerHTML = '';
            const step = 100 / BOARD_SIZE;
            for (let i = 0; i < BOARD_SIZE; i++) {
                const pos = (i + 0.5) * step;
                const start = (0.5) * step;
                const end = 100 - (0.5) * step;

                const hLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
                hLine.setAttribute("x1", `${start}%`); hLine.setAttribute("y1", `${pos}%`);
                hLine.setAttribute("x2", `${end}%`); hLine.setAttribute("y2", `${pos}%`);
                hLine.setAttribute("stroke", "#1A1105"); hLine.setAttribute("stroke-width", "0.25");
                gridSvg.appendChild(hLine);

                const vLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
                vLine.setAttribute("x1", `${pos}%`); vLine.setAttribute("y1", `${start}%`);
                vLine.setAttribute("x2", `${pos}%`); vLine.setAttribute("y2", `${end}%`);
                vLine.setAttribute("stroke", "#1A1105"); vLine.setAttribute("stroke-width", "0.25");
                gridSvg.appendChild(vLine);
            }

            HOSHI.forEach(([r, c]) => {
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                circle.setAttribute("cx", `${(c + 0.5) * step}%`);
                circle.setAttribute("cy", `${(r + 0.5) * step}%`);
                circle.setAttribute("r", "0.7");
                circle.setAttribute("fill", "#1A1105");
                gridSvg.appendChild(circle);
            });
        }

        function renderBoard() {
            boardEl.innerHTML = '';
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (board[r][c] !== EMPTY) cell.classList.add('occupied');
                    
                    const ghost = document.createElement('div');
                    ghost.className = `ghost-stone ${playerColor === BLACK ? 'black' : 'white'}`;
                    cell.appendChild(ghost);

                    if (board[r][c] !== EMPTY) {
                        const stone = document.createElement('div');
                        stone.className = `stone ${board[r][c] === BLACK ? 'black' : 'white'}`;
                        cell.appendChild(stone);
                    }

                    cell.onclick = () => handleMove(r, c);
                    boardEl.appendChild(cell);
                }
            }
        }

        function handleMove(r, c) {
            if (winner !== 0 || board[r][c] !== EMPTY || turn !== playerColor || isAiThinking) return;
            placeStone(r, c, playerColor);
            clearHint();
            
            if (checkWin(r, c, playerColor)) { endGame(playerColor); return; }
            if (checkDraw()) { endGame(0); return; }

            turn = aiColor; isAiThinking = true; updateUI();
            setTimeout(makeAiMove, 400); 
        }

        function placeStone(r, c, color) {
            board[r][c] = color;
            const idx = r * BOARD_SIZE + c;
            const cell = boardEl.children[idx];
            cell.classList.add('occupied');
            const stone = document.createElement('div');
            stone.className = `stone ${color === BLACK ? 'black' : 'white'}`;
            cell.appendChild(stone);
        }

        function makeAiMove() {
            if (winner !== 0) return;
            const moves = getRankedMoves(board, aiColor);
            let move = moves[0];
            
            if (difficulty === 'easy') {
                if (move.score < 500000000 && Math.random() < 0.4) {
                    const topN = moves.slice(0, Math.min(6, moves.length));
                    move = topN[Math.floor(Math.random() * topN.length)];
                }
            }

            placeStone(move.r, move.c, aiColor);
            
            if (checkWin(move.r, move.c, aiColor)) { endGame(aiColor); return; }
            if (checkDraw()) { endGame(0); return; }

            turn = playerColor; isAiThinking = false; updateUI(); calculateProbability();
        }

        // 패턴 매칭 기반 스마트 휴리스틱 엔진
        function evaluateLinePattern(b, r, c, playerColorStr, oppColorStr, dr, dc) {
            let line = "";
            for (let i = -4; i <= 4; i++) {
                let nr = r + dr * i, nc = c + dc * i;
                if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE) {
                    line += "2"; 
                } else {
                    if (i === 0) {
                        line += "1"; 
                    } else {
                        let stone = b[nr][nc];
                        if (stone === EMPTY) line += "0";
                        else if (String(stone) === playerColorStr) line += "1";
                        else line += "2";
                    }
                }
            }

            if (line.includes("11111")) return 10000000; // 5목
            if (line.includes("011110")) return 1000000; // 열린 4목
            if (line.match(/211110|011112|10111|11011|11101/)) return 90000; // 닫힌 4목 등
            if (line.match(/011100|001110|010110|011010/)) return 40000; // 열린 3목
            if (line.match(/211100|001112|211010|010112|210110|011012|10011|11001|10101/)) return 5000; // 기타 위협
            if (line.match(/001100|0010100|000110|011000/)) return 1000; // 열린 2목
            if (line.match(/211000|000112/)) return 100; // 닫힌 2목
            
            // 1목에 대한 인접 보너스 (초반 포석 시 자연스러운 위치 선점)
            if (line.includes("12") || line.includes("21")) return 20; 
            if (line.includes("102") || line.includes("201")) return 15; 

            return 10;
        }

        function getRankedMoves(b, currentTurnColor) {
            let moves = [];
            const myColorStr = String(currentTurnColor);
            const oppColorStr = String(currentTurnColor === BLACK ? WHITE : BLACK);
            
            let hasStones = false;
            for(let r=0; r<15; r++) for(let c=0; c<15; c++) if(b[r][c]!==EMPTY) hasStones = true;
            if(!hasStones) return [{r:7, c:7, score:0}]; 

            for (let r=0; r<15; r++) {
                for (let c=0; c<15; c++) {
                    if (b[r][c] !== EMPTY) continue;
                    
                    let near = false;
                    for(let i=-2; i<=2; i++) {
                        for(let j=-2; j<=2; j++){
                            let nr=r+i, nc=c+j; 
                            if(nr>=0&&nr<15&&nc>=0&&nc<15&&b[nr][nc]!==EMPTY) { near=true; break; }
                        }
                        if(near) break;
                    }
                    if(!near) continue;

                    const dirs = [[1,0],[0,1],[1,1],[1,-1]];
                    let attackScores = [], defenseScores = [];
                    
                    dirs.forEach(([dr,dc]) => {
                        attackScores.push(evaluateLinePattern(b, r, c, myColorStr, oppColorStr, dr, dc));
                        defenseScores.push(evaluateLinePattern(b, r, c, oppColorStr, myColorStr, dr, dc));
                    });

                    let attack = attackScores.reduce((a, b) => a + b, 0);
                    let defense = defenseScores.reduce((a, b) => a + b, 0);

                    let a4 = attackScores.filter(s => s >= 90000).length;
                    let a3 = attackScores.filter(s => s >= 40000 && s < 90000).length;
                    let d4 = defenseScores.filter(s => s >= 90000).length;
                    let d3 = defenseScores.filter(s => s >= 40000 && s < 90000).length;

                    let score = 0;

                    if (attack >= 10000000) score = 1000000000; 
                    else if (defense >= 10000000) score = 500000000; 
                    else if (attack >= 1000000) score = 100000000; 
                    else if (defense >= 1000000) score = 50000000; 
                    else if (a4 >= 2) score = 10000000; 
                    else if (a4 >= 1 && a3 >= 1) score = 5000000; 
                    else if (a3 >= 2) score = 1000000; 
                    else if (d4 >= 2) score = 500000; 
                    else if (d4 >= 1 && d3 >= 1) score = 100000; 
                    else if (d3 >= 2) score = 50000; 
                    else {
                        if (difficulty === 'hard') score = attack + (defense * 1.5); 
                        else score = attack + (defense * 0.8);
                    }

                    // 점수가 동일한 수들 사이에서 매번 좌상단만 고정 선택되는 것을 방지하기 위해 미세 난수 추가
                    score += Math.random() * 0.5;

                    moves.push({ r, c, score: score });
                }
            }
            return moves.sort((a,b) => b.score - a.score);
        }

        // ==========================================
        // V3.2 추가: 힌트용 심층 탐색 알고리즘 (Minimax + Alpha-Beta Pruning)
        // 수읽기(Look-ahead)를 통해 상대방의 최선의 대응까지 시뮬레이션합니다.
        // ==========================================
        function minimax(b, depth, alpha, beta, isMaximizing, myColor, oppColor) {
            // 바닥 조건: 깊이가 0이거나 단말 노드일 때 현재 보드 평가
            if (depth === 0) {
                const myTop = getRankedMoves(b, myColor)[0];
                const oppTop = getRankedMoves(b, oppColor)[0];
                return (myTop ? myTop.score : 0) - (oppTop ? oppTop.score : 0);
            }

            const currentColor = isMaximizing ? myColor : oppColor;
            // 성능 확보를 위해 상위 6개의 최적 수만 추려서 탐색 트리를 구성
            const candidates = getRankedMoves(b, currentColor).slice(0, 6); 

            if (candidates.length === 0) return 0;
            
            // 시뮬레이션 중 누군가 확정 승리하는 경우 가중치 반환 (빠른 승리 선호)
            if (candidates[0].score >= 100000000) {
                return isMaximizing ? 100000000 + depth : -100000000 - depth;
            }

            if (isMaximizing) {
                let maxEval = -Infinity;
                for (let move of candidates) {
                    b[move.r][move.c] = currentColor;
                    let eval = minimax(b, depth - 1, alpha, beta, false, myColor, oppColor);
                    b[move.r][move.c] = EMPTY;
                    maxEval = Math.max(maxEval, eval);
                    alpha = Math.max(alpha, eval);
                    if (beta <= alpha) break; // Alpha-Beta 가지치기
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (let move of candidates) {
                    b[move.r][move.c] = currentColor;
                    let eval = minimax(b, depth - 1, alpha, beta, true, myColor, oppColor);
                    b[move.r][move.c] = EMPTY;
                    minEval = Math.min(minEval, eval);
                    beta = Math.min(beta, eval);
                    if (beta <= alpha) break; // Alpha-Beta 가지치기
                }
                return minEval;
            }
        }

        function getAdvancedHintMove(b, pColor) {
            const oColor = pColor === BLACK ? WHITE : BLACK;
            const candidates = getRankedMoves(b, pColor).slice(0, 8); // 1차 휴리스틱 상위 8개 추출
            
            if (candidates.length === 0) return null;
            if (candidates[0].score >= 100000000) return candidates[0]; // 즉시 승리 가능하면 깊은 탐색 생략

            let bestScore = -Infinity;
            let bestMove = candidates[0];

            // 2-Depth 앞을 내다보는 시뮬레이션 (내가 두고 -> 상대가 두는 것까지 평가)
            for (let move of candidates) {
                b[move.r][move.c] = pColor;
                // 미니맥스 호출: 상대방 턴(false)부터 시작하여 최악의 상황에서의 내 점수 방어 시뮬레이션
                let score = minimax(b, 2, -Infinity, Infinity, false, pColor, oColor);
                b[move.r][move.c] = EMPTY;

                // 시뮬레이션 결과 점수가 더 높거나, 점수가 같다면 1차 휴리스틱(현재 판세)이 높은 수를 선택
                if (score > bestScore || (score === bestScore && move.score > bestMove.score)) {
                    bestScore = score;
                    bestMove = move;
                }
            }
            return bestMove;
        }
        // ==========================================

        function checkWin(r, c, p) {
            const dirs = [[1,0],[0,1],[1,1],[1,-1]];
            for (let [dr, dc] of dirs) {
                let count = 1;
                for(let s of [1, -1]) for(let i=1; i<=4; i++) {
                    let nr=r+dr*i*s, nc=c+dc*i*s;
                    if(nr>=0&&nr<15&&nc>=0&&nc<15&&board[nr][nc]===p) count++; else break;
                }
                if (count >= 5) return true;
            }
            return false;
        }

        function checkDraw() {
            for(let r=0; r<BOARD_SIZE; r++) {
                for(let c=0; c<BOARD_SIZE; c++) {
                    if(board[r][c] === EMPTY) return false;
                }
            }
            return true;
        }

        function calculateProbability() {
            const pMoves = getRankedMoves(board, playerColor);
            const aMoves = getRankedMoves(board, aiColor);
            if(!pMoves.length || !aMoves.length) return;
            const pBest = pMoves[0].score, aBest = aMoves[0].score;
            
            let prob = pBest >= 10000000 ? 99 : (aBest >= 10000000 ? 1 : 50 + 50 * Math.tanh((pBest - aBest) / 100000));
            prob = Math.max(5, Math.min(95, Math.round(prob)));
            
            // [수정됨] 확률 텍스트 표시와 직관적인 폰트 컬러 동기화
            winProbText.textContent = `${prob}%`;
            winProbText.className = `text-lg font-black ${prob < 50 ? 'text-rose-600' : 'text-blue-600'}`;
            
            winProbBar.style.width = `${prob}%`;
            loseProbBar.style.width = `${100 - prob}%`;
        }

        function updateUI() {
            const pInd = document.getElementById('indicator-player');
            const aInd = document.getElementById('indicator-ai');
            const arrow = document.getElementById('turn-arrow');
            const pStone = document.getElementById('player-stone-preview');
            const aStone = document.getElementById('ai-stone-preview');

            pStone.className = `stone stone-preview ${playerColor === BLACK ? 'black' : 'white'}`;
            aStone.className = `stone stone-preview ${aiColor === BLACK ? 'black' : 'white'}`;

            document.getElementById('btn-set-black').className = `btn-faction flex-1 py-2 rounded-md text-xs font-bold ${playerColor === BLACK ? 'black-active' : 'bg-white text-slate-500'}`;
            document.getElementById('btn-set-white').className = `btn-faction flex-1 py-2 rounded-md text-xs font-bold ${playerColor === WHITE ? 'white-active' : 'bg-white text-slate-500'}`;
            document.getElementById('btn-diff-easy').className = `btn-diff flex-1 py-2 rounded-md text-xs font-bold ${difficulty === 'easy' ? 'easy-active' : 'bg-white text-slate-500'}`;
            document.getElementById('btn-diff-hard').className = `btn-diff flex-1 py-2 rounded-md text-xs font-bold ${difficulty === 'hard' ? 'hard-active' : 'bg-white text-slate-500'}`;

            if (turn === playerColor && winner === 0) {
                pInd.classList.add('border-blue-400', 'bg-blue-50', 'scale-105');
                aInd.classList.remove('border-rose-400', 'bg-rose-50', 'scale-105');
                aInd.style.opacity = "0.4"; pInd.style.opacity = "1";
                statusDisplay.textContent = "당신의 차례입니다"; statusDisplay.style.color = "#2563eb";
                arrow.style.transform = "rotate(180deg)";
            } else if (winner === 0) {
                aInd.classList.add('border-rose-400', 'bg-rose-50', 'scale-105');
                pInd.classList.remove('border-blue-400', 'bg-blue-50', 'scale-105');
                pInd.style.opacity = "0.4"; aInd.style.opacity = "1";
                statusDisplay.textContent = "AI가 생각하는 중..."; statusDisplay.style.color = "#94a3b8";
                arrow.style.transform = "rotate(0deg)";
            }
        }

        function showModal(isPlayerWin, isDraw) {
            const modal = document.getElementById('game-modal');
            const title = document.getElementById('modal-title');
            const desc = document.getElementById('modal-desc');
            const icon = document.getElementById('modal-icon');
            
            if (isDraw) {
                icon.innerHTML = '🤝';
                icon.className = 'w-20 h-20 rounded-full flex items-center justify-center mb-5 text-4xl bg-slate-100 shadow-inner';
                title.textContent = '무승부!';
                title.className = 'text-3xl font-black text-slate-800 mb-2';
                desc.textContent = '치열한 접전이었습니다.';
            } else if (isPlayerWin) {
                icon.innerHTML = '🎉';
                icon.className = 'w-20 h-20 rounded-full flex items-center justify-center mb-5 text-4xl bg-blue-50 text-blue-500 shadow-inner';
                title.textContent = '당신의 승리!';
                title.className = 'text-3xl font-black text-blue-600 mb-2';
                desc.textContent = '스마트 AI를 상대로 멋진 수읽기입니다.';
            } else {
                icon.innerHTML = '🤖';
                icon.className = 'w-20 h-20 rounded-full flex items-center justify-center mb-5 text-4xl bg-rose-50 shadow-inner';
                title.textContent = 'AI 승리!';
                title.className = 'text-3xl font-black text-rose-600 mb-2';
                desc.textContent = '다시 한 번 도전해보세요.';
            }

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.firstElementChild.classList.remove('scale-95');
                modal.firstElementChild.classList.add('scale-100');
            }, 10);
        }

        function hideModal() {
            const modal = document.getElementById('game-modal');
            modal.classList.add('opacity-0');
            modal.firstElementChild.classList.remove('scale-100');
            modal.firstElementChild.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function endGame(p) {
            winner = p;
            
            if (p === 0) { // 무승부
                statusDisplay.textContent = "무승부입니다.";
                statusDisplay.className = `mt-8 px-8 py-3 bg-white rounded-full shadow-lg border-2 border-slate-400 text-slate-600 text-xl font-black`;
                showModal(false, true);
            } else {
                const isPlayer = p === playerColor;
                statusDisplay.textContent = isPlayer ? "당신의 승리! 🎉" : "AI 승리! 🤖";
                statusDisplay.className = `mt-8 px-8 py-3 bg-white rounded-full shadow-lg border-2 ${isPlayer ? 'border-blue-500 text-blue-600' : 'border-rose-500 text-rose-600'} text-xl font-black animate-bounce`;
                
                // [수정됨] 패배 게이지 바 버그 완벽 수정 및 텍스트 색상 처리
                if(isPlayer) { 
                    winProbBar.style.width = "100%"; 
                    loseProbBar.style.width = "0%"; 
                    winProbText.textContent = "100%"; 
                    winProbText.className = "text-lg font-black text-blue-600";
                } else { 
                    winProbBar.style.width = "0%"; 
                    loseProbBar.style.width = "100%"; 
                    winProbText.textContent = "0%"; 
                    winProbText.className = "text-lg font-black text-rose-600";
                }
                
                showModal(isPlayer, false);
            }
        }

        function showHint() {
            if (winner !== 0 || turn !== playerColor || isAiThinking) return;
            clearHint();
            
            // 시뮬레이션 연산 중 UI가 멈추지 않고 '로딩 중'임을 시각화
            const btnHint = document.getElementById('btn-hint');
            const originalHTML = btnHint.innerHTML;
            btnHint.innerHTML = `<svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> 심층 분석 중...`;
            btnHint.classList.add('opacity-75', 'cursor-not-allowed');
            isAiThinking = true; // 분석 중 다른 셀 클릭 방지

            // 비동기로 심층 연산을 실행하여 로딩 UI가 먼저 렌더링될 수 있도록 처리
            setTimeout(() => {
                const move = getAdvancedHintMove(board, playerColor);
                if (move) {
                    const cell = boardEl.children[move.r * BOARD_SIZE + move.c];
                    const marker = document.createElement('div');
                    marker.className = 'hint-marker';
                    cell.appendChild(marker);
                    setTimeout(clearHint, 3000);
                }
                
                // 복구
                btnHint.innerHTML = originalHTML;
                btnHint.classList.remove('opacity-75', 'cursor-not-allowed');
                isAiThinking = false;
            }, 50);
        }

        function clearHint() { const h = document.querySelector('.hint-marker'); if (h) h.remove(); }

        document.getElementById('btn-set-black').onclick = () => { if(playerColor === BLACK) return; playerColor = BLACK; aiColor = WHITE; init(); };
        document.getElementById('btn-set-white').onclick = () => { if(playerColor === WHITE) return; playerColor = WHITE; aiColor = BLACK; init(); };
        document.getElementById('btn-diff-easy').onclick = () => { difficulty = 'easy'; updateUI(); };
        document.getElementById('btn-diff-hard').onclick = () => { difficulty = 'hard'; updateUI(); };
        document.getElementById('btn-hint').onclick = showHint;
        document.getElementById('btn-reset').onclick = init;
        document.getElementById('btn-modal-reset').onclick = init;

        init();
        window.onresize = drawGrid;
    </script>
</body>
</html>
