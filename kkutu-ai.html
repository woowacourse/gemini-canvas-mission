<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI와 끝말잇기 대결</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      @keyframes fade-in-up {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fade-in-up {
        animation: fade-in-up 0.3s ease-out forwards;
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body
    class="bg-gray-50 font-sans text-gray-800 flex items-center justify-center min-h-screen p-4"
  >
    <div
      class="bg-white rounded-2xl shadow-2xl w-full max-w-md flex flex-col h-[700px] overflow-hidden border border-gray-100"
    >
      <!-- 헤더 -->
      <div
        class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-5 text-center shadow-md relative z-10"
      >
        <div class="flex items-center justify-center space-x-2">
          <i data-lucide="bot" class="w-6 h-6 text-blue-200"></i>
          <h1 class="text-2xl font-bold tracking-tight">AI와 끝말잇기 대결</h1>
        </div>
        <p class="text-indigo-100 text-sm mt-1">인공지능을 이길 수 있을까요?</p>
      </div>

      <!-- 턴 표시기 -->
      <div
        id="turnIndicator"
        class="flex justify-between items-center px-6 py-4 bg-gray-50 border-b"
      >
        <div
          id="player1Tag"
          class="px-4 py-2 rounded-full font-bold transition-all duration-300 flex items-center bg-blue-500 text-white shadow-lg transform scale-105"
        >
          👩‍💻 당신
        </div>
        <div class="text-gray-400 font-bold">VS</div>
        <div
          id="player2Tag"
          class="px-4 py-2 rounded-full font-bold transition-all duration-300 flex items-center bg-gray-200 text-gray-500"
        >
          🤖 AI 로봇
        </div>
      </div>

      <!-- 단어 기록 영역 -->
      <div
        id="historyContainer"
        class="flex-1 overflow-y-auto p-5 space-y-4 bg-slate-50 relative scroll-smooth hide-scrollbar"
      >
        <div
          id="emptyState"
          class="h-full flex flex-col items-center justify-center text-gray-400 space-y-3"
        >
          <i data-lucide="book-open" class="w-12 h-12 text-gray-300"></i>
          <p>첫 단어를 입력해 AI와 게임을 시작하세요!</p>
        </div>
        <div id="wordList" class="flex flex-col gap-3"></div>
        <div
          id="hintContainer"
          class="hidden mt-4 p-4 bg-yellow-50 border border-yellow-200 rounded-xl flex gap-3 animate-fade-in text-yellow-800 text-sm"
        >
          <i
            data-lucide="sparkles"
            class="w-5 h-5 shrink-0 text-yellow-500"
          ></i>
          <div id="hintText"></div>
        </div>
      </div>

      <!-- 입력 & 컨트롤 영역 -->
      <div class="p-4 bg-white border-t border-gray-200 relative">
        <!-- 로딩 오버레이 -->
        <div
          id="loadingOverlay"
          class="hidden absolute inset-0 bg-white/80 backdrop-blur-sm flex flex-col items-center justify-center z-20 space-y-2"
        >
          <i
            data-lucide="loader-2"
            class="w-8 h-8 text-indigo-500 animate-spin"
          ></i>
          <p id="loadingMessage" class="text-sm font-bold text-indigo-600">
            처리 중...
          </p>
        </div>

        <!-- 게임 종료 화면 -->
        <div
          id="gameOverArea"
          class="hidden text-center py-4 space-y-4 animate-fade-in"
        >
          <div id="winnerTitle" class="text-2xl font-bold mb-2"></div>
          <p
            id="resultReason"
            class="text-gray-600 bg-gray-100 py-2 rounded-lg"
          ></p>
          <button
            onclick="resetGame()"
            class="mt-4 flex items-center justify-center w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold transition-colors shadow-md"
          >
            <i data-lucide="rotate-ccw" class="w-5 h-5 mr-2"></i>
            새로운 게임 시작하기
          </button>
        </div>

        <!-- 게임 플레이 입력 폼 -->
        <form id="gameForm" class="flex flex-col space-y-3">
          <div
            id="errorArea"
            class="hidden flex items-center text-red-600 bg-red-50 p-2 rounded-lg text-sm font-medium"
          >
            <i data-lucide="alert-circle" class="w-4 h-4 mr-2 shrink-0"></i>
            <span id="errorMsg"></span>
          </div>

          <div class="flex gap-2">
            <input
              id="wordInput"
              type="text"
              placeholder="단어를 입력하세요..."
              class="flex-1 px-4 py-3 border-2 rounded-xl focus:outline-none transition-colors text-lg font-bold shadow-sm border-blue-200 focus:border-blue-500 bg-white"
              autocomplete="off"
            />
            <button
              id="submitBtn"
              type="submit"
              class="px-6 py-3 text-white rounded-xl font-bold shadow-md transition-colors whitespace-nowrap bg-blue-500 hover:bg-blue-600 disabled:opacity-50"
            >
              제출
            </button>
          </div>

          <div class="flex gap-2 pt-2">
            <button
              type="button"
              onclick="handleHint()"
              class="flex-1 flex items-center justify-center py-2 bg-yellow-100 hover:bg-yellow-200 text-yellow-800 rounded-lg transition-colors text-sm font-bold shadow-sm"
            >
              <i
                data-lucide="sparkles"
                class="w-4 h-4 mr-1 text-yellow-600"
              ></i>
              ✨ AI 힌트 받기
            </button>
            <button
              type="button"
              onclick="handleGiveUp()"
              class="flex-1 flex items-center justify-center py-2 bg-gray-100 hover:bg-red-100 text-gray-600 hover:text-red-600 rounded-lg transition-colors text-sm font-bold shadow-sm"
            >
              <i data-lucide="flag" class="w-4 h-4 mr-1"></i>
              기권하기
            </button>
          </div>
        </form>
      </div>
    </div>

    <script>
      // --- 데이터 및 상태 관리 ---
      const dueumMap = {
        라: "나",
        래: "내",
        로: "노",
        뢰: "뇌",
        루: "누",
        르: "느",
        랴: "야",
        려: "여",
        례: "예",
        료: "요",
        류: "유",
        리: "이",
        녀: "여",
        뇨: "요",
        뉴: "유",
        니: "이",
        량: "양",
        력: "역",
        련: "연",
        렬: "열",
        령: "영",
        락: "낙",
        란: "난",
        랄: "날",
        람: "남",
        랍: "납",
        랑: "낭",
        랭: "냉",
        냑: "약",
        냥: "양",
        녑: "엽",
        념: "염",
        렵: "엽",
        록: "녹",
        론: "논",
        롱: "농",
        룡: "용",
        륙: "육",
        륜: "윤",
        률: "율",
        륭: "융",
        륵: "늑",
        름: "늠",
        릉: "능",
        린: "인",
        림: "임",
        립: "입",
      };

      let history = []; // {word, meaning, isUser}
      let currentPlayer = 1; // 1: User, 2: AI
      let isLoading = false;
      let gameOver = false;

      const apiKey = ""; // 런타임에 주입됨

      // --- DOM 요소 참조 ---
      const wordList = document.getElementById("wordList");
      const emptyState = document.getElementById("emptyState");
      const historyContainer = document.getElementById("historyContainer");
      const wordInput = document.getElementById("wordInput");
      const submitBtn = document.getElementById("submitBtn");
      const gameForm = document.getElementById("gameForm");
      const errorArea = document.getElementById("errorArea");
      const errorMsg = document.getElementById("errorMsg");
      const loadingOverlay = document.getElementById("loadingOverlay");
      const loadingMessage = document.getElementById("loadingMessage");
      const gameOverArea = document.getElementById("gameOverArea");
      const winnerTitle = document.getElementById("winnerTitle");
      const resultReason = document.getElementById("resultReason");
      const hintContainer = document.getElementById("hintContainer");
      const hintText = document.getElementById("hintText");
      const player1Tag = document.getElementById("player1Tag");
      const player2Tag = document.getElementById("player2Tag");

      // --- 유틸리티 함수 ---
      function getValidStartChars(lastChar) {
        const validChars = [lastChar];
        if (dueumMap[lastChar]) validChars.push(dueumMap[lastChar]);
        return validChars;
      }

      async function fetchGeminiWithRetry(prompt, schema, maxRetries = 5) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
        const payload = {
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: {
            responseMimeType: "application/json",
            responseSchema: schema,
          },
        };
        const delays = [1000, 2000, 4000, 8000, 16000];

        for (let i = 0; i < maxRetries; i++) {
          try {
            const response = await fetch(url, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const result = await response.json();
            const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!text) throw new Error("Empty API Response");
            return JSON.parse(text);
          } catch (error) {
            if (i === maxRetries - 1) throw error;
            await new Promise((r) => setTimeout(r, delays[i]));
          }
        }
      }

      // --- UI 업데이트 함수 ---
      function setLoading(loading, type = "") {
        isLoading = loading;
        if (loading) {
          loadingOverlay.classList.remove("hidden");
          let msg = "처리 중...";
          if (type === "judge") msg = "AI 심판이 단어를 검증하는 중...";
          else if (type === "ai_turn") msg = "AI가 다음 단어를 생각하는 중...";
          else if (type === "hint") msg = "AI가 기발한 힌트를 찾는 중...";
          loadingMessage.innerText = msg;
        } else {
          loadingOverlay.classList.add("hidden");
        }
        wordInput.disabled = loading || currentPlayer !== 1;
        submitBtn.disabled = loading || currentPlayer !== 1;
      }

      function showError(msg) {
        if (!msg) {
          errorArea.classList.add("hidden");
        } else {
          errorMsg.innerText = msg;
          errorArea.classList.remove("hidden");
          errorArea.classList.add("animate-shake");
          setTimeout(() => errorArea.classList.remove("animate-shake"), 500);
        }
      }

      function updateHistoryUI() {
        if (history.length > 0) emptyState.classList.add("hidden");
        else emptyState.classList.remove("hidden");

        wordList.innerHTML = "";
        history.forEach((item, index) => {
          const isUser = item.isUser;
          const wrapper = document.createElement("div");
          wrapper.className = `flex flex-col ${isUser ? "items-start" : "items-end"} animate-fade-in-up w-full`;

          const bubble = `
                    <div class="flex items-center max-w-[85%]">
                        ${index > 0 && isUser ? '<i data-lucide="arrow-right" class="w-4 h-4 text-gray-300 mr-2 shrink-0"></i>' : ""}
                        <div class="px-4 py-3 rounded-2xl shadow-sm border ${index === history.length - 1 ? (isUser ? "border-blue-300 ring-2 ring-blue-100" : "border-purple-300 ring-2 ring-purple-100") : "border-gray-200"} ${isUser ? "bg-blue-50 text-blue-900 rounded-tl-sm" : "bg-purple-50 text-purple-900 rounded-tr-sm"}">
                            <div class="text-lg font-bold tracking-wide">
                                ${!isUser ? '<i data-lucide="bot" class="inline w-5 h-5 mr-1 mb-1 opacity-70 text-purple-600"></i>' : ""}
                                ${item.word}
                            </div>
                            ${item.meaning ? `<div class="text-xs mt-1 text-gray-500 font-medium leading-relaxed border-t border-gray-200/60 pt-1">${item.meaning}</div>` : ""}
                        </div>
                        ${index > 0 && !isUser ? '<i data-lucide="arrow-right" class="w-4 h-4 text-gray-300 ml-2 shrink-0"></i>' : ""}
                    </div>
                `;
          wrapper.innerHTML = bubble;
          wordList.appendChild(wrapper);
        });
        lucide.createIcons();
        historyContainer.scrollTop = historyContainer.scrollHeight;
      }

      function updateTurnUI() {
        if (currentPlayer === 1) {
          player1Tag.className =
            "px-4 py-2 rounded-full font-bold transition-all duration-300 flex items-center bg-blue-500 text-white shadow-lg transform scale-105";
          player2Tag.className =
            "px-4 py-2 rounded-full font-bold transition-all duration-300 flex items-center bg-gray-200 text-gray-500";
          wordInput.placeholder = "단어를 입력하세요...";
        } else {
          player2Tag.className =
            "px-4 py-2 rounded-full font-bold transition-all duration-300 flex items-center bg-purple-600 text-white shadow-lg transform scale-105";
          player1Tag.className =
            "px-4 py-2 rounded-full font-bold transition-all duration-300 flex items-center bg-gray-200 text-gray-500";
          wordInput.placeholder = "AI가 생각하는 중...";
        }
      }

      // --- 핵심 로직 ---
      function validateFormat(word) {
        if (word.length < 2) return "두 글자 이상의 단어를 입력해주세요.";
        if (!/^[가-힣]+$/.test(word)) return "한글만 입력 가능합니다.";
        if (history.some((h) => h.word === word))
          return "이미 사용된 단어입니다.";

        if (history.length > 0) {
          const lastWord = history[history.length - 1].word;
          const lastChar = lastWord.charAt(lastWord.length - 1);
          const validChars = getValidStartChars(lastChar);
          if (!validChars.includes(word.charAt(0))) {
            return `'${validChars.join("' 또는 '")}'(으)로 시작하는 단어를 입력해주세요.`;
          }
        }
        return null;
      }

      async function handleUserSubmit(e) {
        e.preventDefault();
        if (gameOver || isLoading || currentPlayer !== 1) return;

        const word = wordInput.value.trim();
        const formatError = validateFormat(word);
        if (formatError) {
          showError(formatError);
          return;
        }

        showError(null);
        hintContainer.classList.add("hidden");
        setLoading(true, "judge");

        try {
          const schema = {
            type: "OBJECT",
            properties: {
              isValid: { type: "BOOLEAN" },
              meaning: { type: "STRING" },
            },
          };
          const prompt = `한국어 끝말잇기 심판입니다. 단어 "${word}"가 표준 국어대사전에 있는 실제 명사인가요? 억지 단어나 줄임말은 허용하지 않습니다. 결과는 JSON으로 주세요. {isValid: boolean, meaning: string}`;

          const result = await fetchGeminiWithRetry(prompt, schema);
          if (!result.isValid) {
            showError(`❌ AI 심판: ${result.meaning}`);
            setLoading(false);
            return;
          }

          history.push({ word, meaning: result.meaning, isUser: true });
          wordInput.value = "";
          updateHistoryUI();
          currentPlayer = 2;
          updateTurnUI();
          setLoading(false);

          // AI 턴 시작
          playAITurn();
        } catch (err) {
          showError("검증 중 오류가 발생했습니다. 다시 시도해 주세요.");
          setLoading(false);
        }
      }

      async function playAITurn() {
        if (gameOver) return;
        setLoading(true, "ai_turn");

        try {
          const usedWords = history.map((h) => h.word).join(", ");
          const lastWord = history[history.length - 1].word;
          const lastChar = lastWord.charAt(lastWord.length - 1);
          const validChars = getValidStartChars(lastChar).join(", ");

          const schema = {
            type: "OBJECT",
            properties: {
              suggestedWord: { type: "STRING" },
              meaning: { type: "STRING" },
            },
          };
          const prompt = `끝말잇기 AI입니다. 시작 글자: [${validChars}], 금지 단어: [${usedWords}]. 조건에 맞는 흔한 명사 하나를 골라 JSON으로 주세요. {suggestedWord: string, meaning: string}. 없으면 suggestedWord를 "없음"으로 하세요.`;

          const result = await fetchGeminiWithRetry(prompt, schema);

          if (result.suggestedWord === "없음") {
            endGame(1, "AI가 더 이상 이을 단어를 찾지 못했습니다!");
          } else {
            history.push({
              word: result.suggestedWord,
              meaning: result.meaning,
              isUser: false,
            });
            updateHistoryUI();
            currentPlayer = 1;
            updateTurnUI();
          }
        } catch (err) {
          showError("AI가 단어를 생각하다 지쳤습니다. 당신의 승리!");
          endGame(1, "네트워크 오류로 AI가 기권했습니다.");
        } finally {
          setLoading(false);
        }
      }

      async function handleHint() {
        if (gameOver || isLoading || currentPlayer !== 1) return;
        setLoading(true, "hint");

        try {
          const usedWords = history.map((h) => h.word).join(", ");
          const lastItem = history[history.length - 1];
          const lastChar = lastItem
            ? lastItem.word.charAt(lastItem.word.length - 1)
            : "";
          const validChars = lastChar
            ? getValidStartChars(lastChar).join(", ")
            : "자유";

          const schema = {
            type: "OBJECT",
            properties: {
              suggestedWord: { type: "STRING" },
              meaning: { type: "STRING" },
            },
          };
          const prompt = `끝말잇기 힌트 도우미입니다. 시작 글자: [${validChars}], 금지: [${usedWords}]. 하나 추천해주세요. {suggestedWord: string, meaning: string}`;

          const result = await fetchGeminiWithRetry(prompt, schema);
          if (result.suggestedWord !== "없음") {
            hintText.innerHTML = `<span class="font-bold">AI 힌트: "${result.suggestedWord}"</span> - ${result.meaning}`;
            hintContainer.classList.remove("hidden");
            wordInput.value = result.suggestedWord;
            historyContainer.scrollTop = historyContainer.scrollHeight;
          }
        } catch (err) {
          showError("힌트를 가져오지 못했습니다.");
        } finally {
          setLoading(false);
        }
      }

      function handleGiveUp() {
        if (confirm("정말 기권하시겠습니까?")) {
          endGame(2, "당신이 기권했습니다.");
        }
      }

      function endGame(winner, reason) {
        gameOver = true;
        gameForm.classList.add("hidden");
        gameOverArea.classList.remove("hidden");
        turnIndicator.classList.add("opacity-50");

        if (winner === 1) {
          winnerTitle.innerText = "🎉 당신의 승리! 🎉";
          winnerTitle.className = "text-2xl font-bold mb-2 text-blue-600";
        } else {
          winnerTitle.innerText = "🤖 AI의 승리! 🤖";
          winnerTitle.className = "text-2xl font-bold mb-2 text-purple-600";
        }
        resultReason.innerText = reason;
      }

      function resetGame() {
        history = [];
        currentPlayer = 1;
        gameOver = false;
        wordInput.value = "";
        showError(null);

        gameForm.classList.remove("hidden");
        gameOverArea.classList.add("hidden");
        turnIndicator.classList.remove("opacity-50");
        hintContainer.classList.add("hidden");

        updateHistoryUI();
        updateTurnUI();
        wordInput.disabled = false;
        submitBtn.disabled = false;
      }

      // 초기화
      window.onload = () => {
        lucide.createIcons();
        gameForm.onsubmit = handleUserSubmit;
      };
    </script>
  </body>
</html>
