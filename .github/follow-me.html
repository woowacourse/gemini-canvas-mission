<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>팔로팔로미 - 여행 동선 최적화 플래너</title>

    <!-- Leaflet 지도 라이브러리 추가 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <!-- 구글 폰트: 배달의민족 주아(Jua) 추가 -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

    <style>
        /* ================= CSS 변수 및 리셋 ================= */
        :root {
            --primary-color: #1e3a8a; /* 딥 블루 */
            --primary-light: #eff6ff; /* 아주 밝은 블루 */
            --secondary-color: #3b82f6; /* 밝은 블루 */
            --background-color: #f8fafc;
            --surface-color: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger-color: #ef4444;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-full: 9999px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        #app {
            width: 100%;
            max-width: 480px; /* 모바일 디바이스 기준 */
            background-color: var(--background-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: var(--shadow-md);
        }

        /* ================= 헤더 (하늘/여행 테마 + 애니메이션) ================= */
        header {
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%); /* 청량한 하늘색 그라데이션 */
            padding: 20px 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.2);
            overflow: hidden;
            border-bottom: none;
        }

        .header-content {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }

        header h1 {
            font-family: 'Jua', sans-serif; /* 주아 폰트 적용 */
            color: #ffffff;
            font-size: 1.6rem; /* 폰트 특성에 맞게 크기 살짝 증가 */
            font-weight: 400; /* 주아 폰트는 기본 굵기가 예쁘게 나옴 */
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 0;
            z-index: 2;
        }

        /* 떠다니는 비행기 효과 */
        .plane-icon {
            display: inline-block;
            animation: float 3s ease-in-out infinite;
            font-size: 1.5rem;
        }

        /* 배경 장식 구름 효과 */
        .cloud-icon {
            position: absolute;
            font-size: 1.8rem;
            opacity: 0.8;
            z-index: 1;
        }

        .cloud-1 {
            top: -10px;
            left: 5%;
            animation: float 4s ease-in-out infinite 0.5s;
        }

        .cloud-2 {
            bottom: -5px;
            right: 5%;
            font-size: 1.4rem;
            animation: float 5s ease-in-out infinite 1s;
            opacity: 0.6;
        }

        /* 통통 튀어오르는 애니메이션 */
        @keyframes bounceIn {
            0% { transform: scale(0.9) translateY(10px); opacity: 0; }
            60% { transform: scale(1.05) translateY(-2px); opacity: 1; }
            100% { transform: scale(1) translateY(0); }
        }

        /* 둥실둥실 애니메이션 */
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(3deg); }
        }

        /* ================= 공통 컨테이너 ================= */
        .section-container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ================= 카드 스타일 ================= */
        .card {
            background-color: var(--surface-color);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ================= 입력 폼 ================= */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .input-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .duration-inputs {
            display: grid;
            grid-template-columns: 1fr auto 1fr auto;
            align-items: center;
            gap: 8px;
        }

        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus, input[type="text"]:focus {
            border-color: var(--secondary-color);
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--secondary-color);
            color: white;
            padding: 14px;
            width: 100%;
            font-size: 1rem;
        }

        .btn-primary:hover {
            background-color: var(--primary-color);
        }

        .btn-add {
            background-color: var(--primary-light);
            color: var(--primary-color);
            padding: 12px 16px;
            white-space: nowrap;
        }

        .btn-outline {
            background-color: var(--surface-color);
            color: var(--primary-color);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            font-size: 0.85rem;
        }

        .btn-outline:hover {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
        }

        /* ================= 태그 리스트 ================= */
        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            background-color: var(--primary-light);
            color: var(--primary-color);
            padding: 6px 12px;
            border-radius: var(--radius-full);
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #dbeafe;
        }

        .tag-remove {
            background: transparent;
            color: var(--danger-color);
            border: none;
            padding: 0;
            font-size: 1.1rem;
            line-height: 1;
            cursor: pointer;
        }

        /* ================= 대시보드 및 지도 ================= */
        .map-placeholder {
            width: 100%;
            height: 250px;
            background-color: #e2e8f0;
            border-radius: var(--radius-lg);
            margin-bottom: 20px;
            overflow: hidden;
            z-index: 1;
        }

        .custom-map-node {
            color: white;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
            border: 2px solid white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
            transition: transform 0.2s ease;
        }

        .custom-map-node:hover {
            transform: scale(1.15);
            z-index: 1000 !important;
        }

        /* ================= 일정 카드 리스트 ================= */
        .itinerary-day {
            margin-bottom: 20px;
        }

        .day-header {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--primary-light);
            color: var(--primary-color);
        }

        .route-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }

        .route-list::before {
            content: '';
            position: absolute;
            left: 27px;
            top: 20px;
            bottom: 20px;
            width: 2px;
            background-color: var(--border-color);
            z-index: 1;
        }

        .route-item {
            display: flex;
            align-items: center;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 12px;
            position: relative;
            z-index: 2;
            transition: border-color 0.2s;
        }

        .route-item:hover {
            border-color: var(--secondary-color);
        }

        .route-number {
            width: 28px;
            height: 28px;
            background-color: var(--secondary-color);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: bold;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .route-info {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .route-name {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .route-address {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .route-time {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary-color);
            background-color: var(--primary-light);
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 6px;
        }

        /* 개별 수정 버튼 스타일 */
        .btn-edit-item {
            margin-left: auto;
            background-color: var(--primary-light);
            color: var(--primary-color);
            border: 1px solid #dbeafe;
            border-radius: var(--radius-md);
            padding: 4px 8px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-edit-item:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .transit-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-left: 17px;
            margin: -4px 0;
            position: relative;
            z-index: 2;
        }

        .transit-icon-wrapper {
            width: 20px;
            height: 20px;
            background-color: var(--background-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            box-shadow: 0 0 0 4px var(--background-color);
        }

        .transit-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            background-color: var(--surface-color);
            padding: 4px 8px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .loading-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .ai-badge {
            background-color: #10b981;
            color: white;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
            font-weight: normal;
        }

        /* ================= 수정 요청 모달 ================= */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .modal-content {
            background: var(--surface-color);
            padding: 24px;
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: var(--shadow-md);
        }

        .modal-content h3 {
            color: var(--primary-color);
            margin: 0;
            font-size: 1.15rem;
        }

        .modal-content p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 0;
        }

        .modal-content textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            resize: vertical;
            min-height: 100px;
            font-size: 0.95rem;
            outline: none;
        }

        .modal-content textarea:focus {
            border-color: var(--secondary-color);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 8px;
        }

        .btn-cancel {
            background: var(--border-color);
            color: var(--text-main);
            padding: 10px 16px;
        }

        .btn-cancel:hover {
            background: #cbd5e1;
        }

        .btn-submit-modal {
            background: var(--primary-color);
            color: white;
            padding: 10px 16px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div id="app">
    <header>
        <div class="header-content">
            <span class="cloud-icon cloud-1">☁️</span>
            <h1>팔로팔로미 <span class="plane-icon">✈️</span></h1>
            <span class="cloud-icon cloud-2">☁️</span>
        </div>
    </header>

    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
        <h3 style="color:var(--primary-color); margin-bottom:8px;">AI가 일정을 분석 중입니다...</h3>
        <p style="color:var(--text-muted); font-size:0.9rem;">최적의 동선과 장소를 찾는 중 🤖</p>
    </div>

    <!-- 수정 요청 모달 -->
    <div id="feedback-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 id="modal-title">일정 수정 요청</h3>
            <p>마음에 들지 않는 부분이나 변경하고 싶은 내용을 적어주세요.</p>
            <textarea id="feedback-textarea" placeholder="예: 첫째 날 돼지국밥 식당 말고 다른 식당으로 바꿔줘"></textarea>
            <div class="modal-actions">
                <button type="button" id="btn-modal-cancel" class="btn-cancel">취소</button>
                <button type="button" id="btn-modal-submit" class="btn-submit-modal">수정 적용하기</button>
            </div>
        </div>
    </div>

    <!-- 입력 섹션 (View) -->
    <main id="input-section" class="section-container">
        <div class="card">
            <div class="card-title">📅 여행 기간 설정</div>
            <div class="form-group">
                <div class="duration-inputs">
                    <input type="number" id="input-nights" min="0" value="2" aria-label="박">
                    <span>박</span>
                    <input type="number" id="input-days" min="1" value="3" aria-label="일">
                    <span>일</span>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">📍 방문 장소 입력</div>
            <div class="form-group">
                <div class="input-row">
                    <input type="text" id="input-destination" placeholder="예: 남산타워, 해운대, 돼지국밥" aria-label="여행지">
                    <button type="button" id="btn-add-dest" class="btn-add">+ 추가</button>
                </div>
            </div>
            <div id="tag-container" class="tag-container"></div>
        </div>

        <button type="button" id="btn-generate" class="btn-primary">최적 동선 대시보드 생성</button>
    </main>

    <!-- 대시보드 섹션 (View) -->
    <main id="dashboard-section" class="section-container hidden">
        <div class="map-placeholder" id="map-view"></div>

        <div class="card">
            <div class="card-title" style="justify-content: space-between; align-items: center;">
                <span>✨ 나의 여행 일정</span>
                <div style="display: flex; gap: 8px;">
                    <button type="button" id="btn-request-mod" class="btn-outline">전체 일정 수정</button>
                    <button type="button" id="btn-edit-plan" class="btn-outline" style="color: var(--text-muted); border-color: var(--border-color);">처음으로</button>
                </div>
            </div>
            <div id="itinerary-container"></div>
        </div>
    </main>
</div>

<script>
    /**
     * ==========================================
     * 1. Store (상태 관리)
     * ==========================================
     */
    const Store = {
        state: {
            duration: { nights: 2, days: 3 },
            destinations: [],
            itinerary: [],
            currentView: 'input',
            userFeedback: '',
            modifyingTarget: null // 개별 장소 수정 시 타겟을 기억 { day, pIndex, pName }
        }
    };

    class EventEmitter {
        constructor() {
            this.events = {};
        }
        on(event, listener) {
            if (!this.events[event]) { this.events[event] = []; }
            this.events[event].push(listener);
        }
        emit(event, data) {
            if (this.events[event]) { this.events[event].forEach(listener => listener(data)); }
        }
    }

    /**
     * ==========================================
     * 3-1. Prompt Service (프롬프트 관리)
     * ==========================================
     */
    class AIPromptService {
        static buildItineraryPrompt(destNames, days, userFeedback = "", currentItinerary = null, target = null) {
            // 수정 요청인 경우 (기존 일정이 존재하는 경우)
            if (currentItinerary && userFeedback.trim() !== "") {
                let targetContext = "";
                let strictlyRule = "";

                // 타겟(특정 장소)이 지정된 경우와 전체 일정 수정인 경우 프롬프트 분기 처리
                if (target) {
                    targetContext = `[특정 일정 부분 수정 요청]
                    수정 타겟: Day ${target.day}의 '${target.pName}' 장소
                    사용자 요청사항: "${userFeedback}"`;

                    strictlyRule = `1. **절대적 부분 수정**: 오직 Day ${target.day}의 '${target.pName}' 장소만 교체, 수정 또는 삭제하세요.
                    2. **기존 일정 100% 보존**: Day ${target.day}의 다른 장소들이나, 수정 대상이 아닌 다른 날짜(Day)의 일정은 단 한 글자도 바꾸지 말고 완벽히 기존 데이터 그대로 반환하세요.
                    3. **동선 재조정**: 수정한 장소에 맞춰 해당 날짜의 방문 시간(time)과 이동 수단/소요 시간(transit)만 자연스럽게 재조정하세요.`;
                } else {
                    targetContext = `[전체 일정 수정 요청]
                    사용자 요청사항: "${userFeedback}"`;

                    strictlyRule = `1. **기존 일정 기반 수정**: 사용자의 요청을 반영하되, 피드백과 무관한 나머지 일정은 최대한 기존 데이터를 유지하세요.`;
                }

                return `
                당신은 전문 여행 플래너입니다.
                현재 기획된 ${days}일간의 여행 일정(JSON 데이터)은 다음과 같습니다:
                ${JSON.stringify(currentItinerary)}

                ${targetContext}

                [수정 시 핵심 규칙 - 반드시 지킬 것!]
                ${strictlyRule}
                4. **타 브랜드/상호명 추천 (중요)**: 만약 식당을 변경해 달라는 요청이라면, 기존 식당과 같은 브랜드(프랜차이즈)의 다른 지점을 추천하는 것을 절대 금지합니다. 메뉴 특성은 유지하되 **아예 다른 브랜드/상호명을 가진 새로운 실제 유명 맛집**으로 교체하세요.

                위 규칙과 사용자의 수정 요청사항을 완벽하게 반영하여, 부분 수정된 전체 일정을 이전과 동일한 JSON 배열(itinerary) 형식으로 다시 반환해주세요.
                `;
            }

            // 최초 일정 생성인 경우
            return `
            당신은 전문 여행 플래너입니다. 여행객이 ${days}일 동안 방문하고 싶어 하는 기본 장소 및 먹고 싶은 음식(메뉴) 목록은 다음과 같습니다: [${destNames}].

            이 항목들을 기반으로, 매일매일이 현실적이고 알찬 '정상적인 전체 여행 일정'이 되도록 기획해주세요.

            [핵심 기획 규칙]
            1. **균형 잡힌 분배**: 사용자가 입력한 장소와 음식을 ${days}일간의 일정에 지리적 동선을 고려하여 합리적으로 분배하세요.
            2. **일정의 풍성함**: 각 날짜의 메인 동선과 어울리는 주변 관광 명소, 카페 등을 AI가 스스로 추가해 하루를 꽉 채워주세요.
            3. **메뉴를 실제 맛집으로 변환**: '음식 메뉴'(예: 돼지국밥)가 있다면, 동선 상 가까운 '실제 유명 맛집' 상호명과 주소로 변환하세요.
            4. **시간 및 이동 최적화**: 방문 시간(time)은 "HH:MM", 다음 장소로 이동하는 수단(transitMethod)과 예상 소요 시간(transitDuration)을 기입하세요. 하루 마지막 일정의 이동은 빈 문자열로 처리하세요.

            [데이터 필수 조건]
            1. 모든 장소/식당의 실제 위도(lat)와 경도(lng) 값을 정확히 제공하세요.
            2. 'reason' 필드에 추가/추천 사유를 기재하세요.
            `;
        }

        static getSystemInstruction() {
            return "당신은 최고의 여행 동선 기획 및 맛집 추천 AI입니다.";
        }
    }

    /**
     * ==========================================
     * 3-2. API Service (Gemini AI 연동)
     * ==========================================
     */
    class RouteService {
        static async generateOptimizedItineraryWithAI(destinations, days, userFeedback = "", currentItinerary = null, target = null) {
            const apiKey = "";
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

            const destNames = destinations.map(d => d.name).join(', ');
            // 타겟 정보를 프롬프트에 함께 주입합니다.
            const promptText = AIPromptService.buildItineraryPrompt(destNames, days, userFeedback, currentItinerary, target);
            const systemInstructionText = AIPromptService.getSystemInstruction();

            const payload = {
                contents: [{ parts: [{ text: promptText }] }],
                systemInstruction: { parts: [{ text: systemInstructionText }] },
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            itinerary: {
                                type: "ARRAY",
                                items: {
                                    type: "OBJECT",
                                    properties: {
                                        day: { type: "INTEGER" },
                                        places: {
                                            type: "ARRAY",
                                            items: {
                                                type: "OBJECT",
                                                properties: {
                                                    name: { type: "STRING" },
                                                    address: { type: "STRING" },
                                                    lat: { type: "NUMBER" },
                                                    lng: { type: "NUMBER" },
                                                    reason: { type: "STRING" },
                                                    time: { type: "STRING" },
                                                    transitMethod: { type: "STRING" },
                                                    transitDuration: { type: "STRING" }
                                                },
                                                required: ["name", "address", "lat", "lng", "reason", "time", "transitMethod", "transitDuration"]
                                            }
                                        }
                                    },
                                    required: ["day", "places"]
                                }
                            }
                        }
                    }
                }
            };

            const fetchWithRetry = async (retries = 5) => {
                const delays = [1000, 2000, 4000, 8000, 16000];
                for (let i = 0; i <= retries; i++) {
                    try {
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (!response.ok) throw new Error('API 응답 에러');
                        const data = await response.json();
                        return JSON.parse(data.candidates[0].content.parts[0].text).itinerary;
                    } catch (error) {
                        if (i === retries) throw error;
                        await new Promise(res => setTimeout(res, delays[i]));
                    }
                }
            };

            return await fetchWithRetry();
        }
    }

    /**
     * ==========================================
     * 4. Model (데이터 조작)
     * ==========================================
     */
    class RouteModel extends EventEmitter {
        constructor(store) {
            super();
            this.store = store;
        }

        get state() { return this.store.state; }

        addDestination(name) {
            if (!name.trim()) return;
            this.state.destinations.push({ id: Date.now().toString(), name: name.trim() });
            this.emit('destinationsChanged', this.state.destinations);
        }

        removeDestination(id) {
            this.state.destinations = this.state.destinations.filter(d => d.id !== id);
            this.emit('destinationsChanged', this.state.destinations);
        }

        updateDuration(nights, days) {
            this.state.duration = { nights, days };
            this.emit('durationChanged', this.state.duration);
        }

        setUserFeedback(feedback) {
            this.state.userFeedback = feedback;
        }

        setModifyingTarget(target) {
            this.state.modifyingTarget = target;
        }

        async generateItinerary() {
            const newItinerary = await RouteService.generateOptimizedItineraryWithAI(
                this.state.destinations,
                this.state.duration.days,
                "", null, null
            );
            this.state.itinerary = newItinerary;
            this.state.currentView = 'dashboard';
            this.emit('itineraryGenerated', this.state.itinerary);
            this.emit('viewChanged', this.state.currentView);
        }

        async modifyItinerary() {
            const newItinerary = await RouteService.generateOptimizedItineraryWithAI(
                this.state.destinations,
                this.state.duration.days,
                this.state.userFeedback,
                this.state.itinerary,
                this.state.modifyingTarget // 타겟 정보 전달
            );

            // 코드 레벨 2차 방어 장치: 타겟이 명확한 경우 나머지 일정 보존을 자바스크립트 레벨에서 강제
            if (this.state.modifyingTarget) {
                const targetDay = this.state.modifyingTarget.day;
                const updatedDayData = newItinerary.find(d => d.day === targetDay);

                if (updatedDayData) {
                    const dayIndex = this.state.itinerary.findIndex(d => d.day === targetDay);
                    if (dayIndex !== -1) {
                        // AI가 응답한 데이터 중 사용자가 수정을 누른 '해당 날짜(Day)'의 데이터만 교체!
                        this.state.itinerary[dayIndex] = updatedDayData;
                    }
                }
            } else {
                // 전체 수정인 경우
                this.state.itinerary = newItinerary;
            }

            // 수정 처리 후 타겟/피드백 초기화
            this.state.modifyingTarget = null;
            this.state.userFeedback = '';

            this.emit('itineraryGenerated', this.state.itinerary);
        }

        changeView(viewName) {
            this.state.currentView = viewName;
            this.emit('viewChanged', this.state.currentView);
        }
    }

    /**
     * ==========================================
     * 5. View (UI 렌더링)
     * ==========================================
     */
    class RouteView {
        constructor() {
            this.sectionInput = document.getElementById('input-section');
            this.sectionDashboard = document.getElementById('dashboard-section');

            this.inputNights = document.getElementById('input-nights');
            this.inputDays = document.getElementById('input-days');
            this.inputDest = document.getElementById('input-destination');

            this.btnAddDest = document.getElementById('btn-add-dest');
            this.btnGenerate = document.getElementById('btn-generate');
            this.btnEditPlan = document.getElementById('btn-edit-plan');

            this.btnRequestMod = document.getElementById('btn-request-mod');
            this.modalOverlay = document.getElementById('feedback-modal');
            this.btnModalCancel = document.getElementById('btn-modal-cancel');
            this.btnModalSubmit = document.getElementById('btn-modal-submit');
            this.feedbackTextarea = document.getElementById('feedback-textarea');

            this.tagContainer = document.getElementById('tag-container');
            this.itineraryContainer = document.getElementById('itinerary-container');
            this.loadingOverlay = document.getElementById('loading-overlay');

            this.map = null;
            this.markersLayer = null;
            this.linesLayer = null;
        }

        showLoading(isActive) {
            if (isActive) {
                this.loadingOverlay.classList.add('active');
            } else {
                this.loadingOverlay.classList.remove('active');
            }
        }

        // 모달 동적 타이틀 설정 (어떤 장소를 수정하는지 표시)
        showFeedbackModal(target = null) {
            const titleEl = document.getElementById('modal-title');
            if (target) {
                titleEl.textContent = `Day ${target.day} - '${target.pName}' 수정`;
                this.feedbackTextarea.placeholder = "예: 이 식당 말고 조용한 카페로 바꿔줘, 이 일정은 삭제해줘 등";
            } else {
                titleEl.textContent = `전체 일정 수정 요청`;
                this.feedbackTextarea.placeholder = "예: 첫째 날 일정을 더 여유롭게 바꿔줘";
            }
            this.modalOverlay.classList.remove('hidden');
            this.feedbackTextarea.value = '';
            setTimeout(() => this.feedbackTextarea.focus(), 100);
        }

        hideFeedbackModal() {
            this.modalOverlay.classList.add('hidden');
        }

        renderTags(destinations) {
            this.tagContainer.innerHTML = '';
            if (destinations.length === 0) {
                this.tagContainer.innerHTML = '<span style="color:var(--text-muted); font-size:0.875rem;">등록된 장소나 음식이 없습니다.</span>';
                return;
            }
            destinations.forEach(dest => {
                const tagEl = document.createElement('div');
                tagEl.className = 'tag';
                tagEl.innerHTML = `${dest.name} <button class="tag-remove" data-id="${dest.id}">&times;</button>`;
                this.tagContainer.appendChild(tagEl);
            });
        }

        renderItinerary(itinerary) {
            this.itineraryContainer.innerHTML = '';

            itinerary.forEach((dayInfo) => {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'itinerary-day';

                let routesHTML = '';
                if (!dayInfo.places || dayInfo.places.length === 0) {
                    routesHTML = '<div style="color:var(--text-muted); font-size:0.875rem; padding-left:15px;">일정 없음 (자유 시간)</div>';
                } else {
                    routesHTML = `<div class="route-list">
                        ${dayInfo.places.map((route, rIdx) => {
                        const isAi = route.reason && route.reason !== "사용자 입력 장소" && route.reason !== "User inputted place";
                        const hasTransit = rIdx < dayInfo.places.length - 1 && route.transitMethod && route.transitDuration;

                        let transitIcon = '🚶';
                        if (route.transitMethod && route.transitMethod.includes('버스')) transitIcon = '🚌';
                        else if (route.transitMethod && route.transitMethod.includes('지하철')) transitIcon = '🚇';
                        else if (route.transitMethod && (route.transitMethod.includes('택시') || route.transitMethod.includes('차'))) transitIcon = '🚕';
                        else if (route.transitMethod && route.transitMethod.includes('기차')) transitIcon = '🚆';

                        return `
                                <div class="route-item">
                                    <div class="route-number">${rIdx + 1}</div>
                                    <div class="route-info">
                                        <div class="route-name">
                                            <span class="route-time">${route.time || ''}</span>
                                            <!-- a 태그를 분리하여 구글맵 이동과 수정 버튼 기능을 명확히 분리 -->
                                            <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(route.name + ' ' + route.address)}" target="_blank" rel="noopener noreferrer" style="color:inherit; text-decoration:none; display:flex; align-items:center; gap:4px;">
                                                ${route.name}
                                                ${isAi ? `<span class="ai-badge">AI 추천</span>` : ''}
                                                <span style="font-size:0.75rem; color:var(--secondary-color);" title="구글 지도에서 보기">📍</span>
                                            </a>
                                            <button type="button" class="btn-edit-item" data-day="${dayInfo.day}" data-pindex="${rIdx}" data-pname="${route.name}">✏️ 수정</button>
                                        </div>
                                        <div class="route-address">${route.address || ''}</div>
                                        ${isAi ? `<div style="font-size:0.75rem; color:#10b981; margin-top:4px;">💡 ${route.reason}</div>` : ''}
                                    </div>
                                </div>
                                ${hasTransit ? `
                                    <div class="transit-info">
                                        <div class="transit-icon-wrapper">${transitIcon}</div>
                                        <div class="transit-text">${route.transitMethod}로 ${route.transitDuration} 이동</div>
                                    </div>
                                ` : ''}
                            `;
                    }).join('')}
                    </div>`;
                }

                dayDiv.innerHTML = `<div class="day-header">Day ${dayInfo.day}</div>${routesHTML}`;
                this.itineraryContainer.appendChild(dayDiv);
            });

            this.renderMap(itinerary);
        }

        renderMap(itinerary) {
            if (!this.map) {
                this.map = L.map('map-view').setView([36.5, 127.5], 7);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                    attribution: '&copy; <a href="https://carto.com/attributions">CARTO</a>'
                }).addTo(this.map);
                this.markersLayer = L.layerGroup().addTo(this.map);
                this.linesLayer = L.layerGroup().addTo(this.map);
            } else {
                this.markersLayer.clearLayers();
                this.linesLayer.clearLayers();
            }

            const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];
            let allLatLngs = [];

            itinerary.forEach((dayInfo, dayIndex) => {
                const color = colors[dayIndex % colors.length];
                const latlngs = [];

                dayInfo.places?.forEach((place, placeIndex) => {
                    if (place.lat && place.lng) {
                        const latlng = [place.lat, place.lng];
                        latlngs.push(latlng);
                        allLatLngs.push(latlng);

                        const iconHtml = `<div class="custom-map-node" style="background-color: ${color};">${placeIndex + 1}</div>`;
                        const customIcon = L.divIcon({ html: iconHtml, className: '', iconSize: [26, 26], iconAnchor: [13, 13], popupAnchor: [0, -13] });
                        const marker = L.marker(latlng, { icon: customIcon, zIndexOffset: 100 - placeIndex }).addTo(this.markersLayer);
                        marker.bindPopup(`<b>Day ${dayInfo.day} - ${placeIndex + 1}번째 일정</b><br>${place.name}`);
                    }
                });

                if (latlngs.length > 1) {
                    L.polyline(latlngs, { color: color, weight: 4, opacity: 0.8, lineJoin: 'round' }).addTo(this.linesLayer);
                }
            });

            setTimeout(() => {
                this.map.invalidateSize();
                if (allLatLngs.length > 0) this.map.fitBounds(L.latLngBounds(allLatLngs), { padding: [30, 30] });
            }, 300);
        }

        renderViewToggle(viewName) {
            if (viewName === 'input') {
                this.sectionInput.classList.remove('hidden');
                this.sectionDashboard.classList.add('hidden');
            } else if (viewName === 'dashboard') {
                this.sectionInput.classList.add('hidden');
                this.sectionDashboard.classList.remove('hidden');
            }
        }

        clearDestinationInput() { this.inputDest.value = ''; this.inputDest.focus(); }

        bindAddDestination(handler) {
            this.btnAddDest.addEventListener('click', () => handler(this.inputDest.value));
            this.inputDest.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); handler(this.inputDest.value); }
            });
        }

        bindRemoveDestination(handler) {
            this.tagContainer.addEventListener('click', (e) => {
                if (e.target.classList.contains('tag-remove')) handler(e.target.getAttribute('data-id'));
            });
        }

        bindDurationChange(handler) {
            const changeEvent = () => handler(parseInt(this.inputNights.value) || 0, parseInt(this.inputDays.value) || 0);
            this.inputNights.addEventListener('change', changeEvent);
            this.inputDays.addEventListener('change', changeEvent);
        }

        bindGenerateItinerary(handler) { this.btnGenerate.addEventListener('click', handler); }
        bindEditPlan(handler) { this.btnEditPlan.addEventListener('click', handler); }

        bindOpenFeedbackModal(handler) { this.btnRequestMod.addEventListener('click', handler); }
        bindCloseFeedbackModal(handler) { this.btnModalCancel.addEventListener('click', handler); }
        bindSubmitFeedback(handler) { this.btnModalSubmit.addEventListener('click', () => handler(this.feedbackTextarea.value)); }

        // 개별 아이템 수정 이벤트 위임
        bindEditItem(handler) {
            this.itineraryContainer.addEventListener('click', (e) => {
                const btn = e.target.closest('.btn-edit-item');
                if (btn) {
                    e.preventDefault(); // 기본 이벤트 방지
                    const target = {
                        day: parseInt(btn.getAttribute('data-day')),
                        pIndex: parseInt(btn.getAttribute('data-pindex')),
                        pName: btn.getAttribute('data-pname')
                    };
                    handler(target);
                }
            });
        }
    }

    /**
     * ==========================================
     * 6. Controller
     * ==========================================
     */
    class RouteController {
        constructor(model, view) {
            this.model = model;
            this.view = view;

            this.model.on('destinationsChanged', (dests) => { this.view.renderTags(dests); this.view.clearDestinationInput(); });
            this.model.on('itineraryGenerated', (itinerary) => this.view.renderItinerary(itinerary));
            this.model.on('viewChanged', (viewName) => { this.view.renderViewToggle(viewName); window.scrollTo(0, 0); });

            this.view.bindAddDestination(this.handleAddDestination.bind(this));
            this.view.bindRemoveDestination(this.handleRemoveDestination.bind(this));
            this.view.bindDurationChange(this.handleDurationChange.bind(this));
            this.view.bindGenerateItinerary(this.handleGenerateItinerary.bind(this));
            this.view.bindEditPlan(this.handleEditPlan.bind(this));

            // 전체 수정 오픈
            this.view.bindOpenFeedbackModal(() => {
                this.model.setModifyingTarget(null);
                this.view.showFeedbackModal(null);
            });

            // 개별 아이템 수정 오픈 (타겟 정보를 모달과 모델에 전달)
            this.view.bindEditItem((target) => {
                this.model.setModifyingTarget(target);
                this.view.showFeedbackModal(target);
            });

            this.view.bindCloseFeedbackModal(() => this.view.hideFeedbackModal());
            this.view.bindSubmitFeedback(this.handleFeedbackSubmit.bind(this));

            this.view.renderTags(this.model.state.destinations);
        }

        handleAddDestination(name) { this.model.addDestination(name); }
        handleRemoveDestination(id) { this.model.removeDestination(id); }
        handleDurationChange(nights, days) { this.model.updateDuration(nights, days); }

        async handleGenerateItinerary() {
            if (this.model.state.destinations.length === 0) return alert("장소나 메뉴를 입력해주세요.");
            this.view.showLoading(true);
            try { await this.model.generateItinerary(); }
            catch (error) { console.error(error); alert("일정 생성에 실패했습니다."); }
            finally { this.view.showLoading(false); }
        }

        async handleFeedbackSubmit(feedback) {
            if (!feedback.trim()) return alert("수정 요청 내용을 입력해주세요.");
            this.model.setUserFeedback(feedback);
            this.view.hideFeedbackModal();
            this.view.showLoading(true);
            try { await this.model.modifyItinerary(); }
            catch (error) { console.error(error); alert("일정 수정에 실패했습니다."); }
            finally { this.view.showLoading(false); }
        }

        handleEditPlan() {
            this.model.setUserFeedback('');
            this.model.setModifyingTarget(null);
            this.model.changeView('input');
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const model = new RouteModel(Store);
        const view = new RouteView();
        const app = new RouteController(model, view);
    });

</script>
