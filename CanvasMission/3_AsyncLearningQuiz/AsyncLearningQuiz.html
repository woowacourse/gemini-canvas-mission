<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS 비동기 마스터 퀴즈</title>
    <style>
        /* =========================================
           CSS 스타일
           ========================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
            padding: 20px;
        }

        .app-container {
            background: white;
            width: 100%;
            max-width: 650px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        h1 {
            font-size: 1.5rem;
            color: #1a1a1a;
            letter-spacing: -0.5px;
        }

        h2 {
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 20px;
            word-break: keep-all;
        }

        .hidden {
            display: none !important;
        }

        /* --- 시작 화면 전용 스타일 --- */
        #home-container {
            text-align: center;
            padding: 20px 0;
        }

        #home-container h2 {
            margin-bottom: 10px;
        }

        #home-container p {
            color: #6c757d;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .count-options-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
        }

        .count-btn {
            flex: 1 1 calc(50% - 15px);
            padding: 20px 10px;
            font-size: 1.1rem;
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            color: #495057;
        }

        .count-btn:hover {
            background-color: #e9ecef;
        }

        .count-btn.selected {
            background-color: #e6f2ff;
            border-color: #007bff;
            color: #007bff;
        }

        /* --- 퀴즈 화면 전용 스타일 --- */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button.option-btn {
            padding: 16px 20px;
            font-size: 1.05rem;
            background-color: #ffffff;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            line-height: 1.4;
            color: #333;
        }

        button.option-btn:hover:not(:disabled) {
            background-color: #f8f9fa;
            border-color: #ced4da;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        button.option-btn.correct {
            background-color: #d4edda;
            border-color: #28a745;
            color: #155724;
            font-weight: bold;
        }

        button.option-btn.wrong {
            background-color: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }

        button.option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        #rationale-container {
            margin-top: 25px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 10px;
            border-left: 5px solid #007bff;
            line-height: 1.6;
            animation: fadeIn 0.3s ease-out;
            font-size: 0.95rem;
        }

        #progress {
            font-weight: 600;
            color: #007bff;
            background: #e6f2ff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        /* --- 공통 버튼 스타일 --- */
        .action-btn {
            margin-top: 20px;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        #start-btn { background-color: #007bff; color: white; }
        #start-btn:hover:not(:disabled) { background-color: #0056b3; }
        #start-btn:disabled { background-color: #a0cbfc; cursor: not-allowed; }

        #next-btn { background-color: #28a745; color: white; margin-top: 20px; }
        #next-btn:hover { background-color: #218838; }

        #retry-btn { background-color: #007bff; color: white; }
        #retry-btn:hover { background-color: #0056b3; }

        #home-btn { background-color: #6c757d; color: white; margin-top: 12px; }
        #home-btn:hover { background-color: #5a6268; }

        /* --- 결과 화면 --- */
        #result-container {
            text-align: center;
            padding: 20px 0;
        }

        #score-text {
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.8;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
        }

        .percentage {
            display: block;
            font-size: 2.5rem;
            font-weight: 800;
            margin-top: 10px;
        }
        
        pre {
            background-color: #282c34;
            color: #abb2bf;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            margin-bottom: 15px;
            font-size: 0.9rem;
            font-family: 'Fira Code', Consolas, monospace;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>🚀 JS 비동기 마스터</h1>
            <div id="progress" class="hidden">준비 중...</div>
        </header>

        <!-- 1. 시작 화면 -->
        <section id="home-container">
            <h2>풀이할 문제 개수를 선택하세요</h2>
            <p>총 25개의 문제 은행에서 무작위로 출제됩니다.</p>
            
            <div id="count-options" class="count-options-grid">
                <button class="count-btn" data-count="5">5개 풀기</button>
                <button class="count-btn" data-count="10">10개 풀기</button>
                <button class="count-btn" data-count="20">20개 풀기</button>
                <button class="count-btn" data-count="25">25개 (전체)</button>
            </div>
            
            <button id="start-btn" class="action-btn" disabled>문제 개수를 선택해주세요</button>
        </section>

        <!-- 2. 퀴즈 화면 -->
        <main id="quiz-container" class="hidden">
            <h2 id="question">질문이 여기에 표시됩니다.</h2>
            <div id="options" class="options-grid">
                <!-- 자바스크립트로 보기 버튼 생성 -->
            </div>
            
            <div id="rationale-container" class="hidden">
                <p id="rationale-text"></p>
                <button id="next-btn" class="action-btn">다음 문제로 넘어가기</button>
            </div>
        </main>

        <!-- 3. 결과 화면 -->
        <section id="result-container" class="hidden">
            <h2>🎉 퀴즈 완료!</h2>
            <div id="score-text"></div>
            
            <button id="retry-btn" class="action-btn">방금 푼 문제 다시 풀기</button>
            <button id="home-btn" class="action-btn">처음 화면으로 돌아가기</button>
        </section>
    </div>

    <script>
        /* =========================================
           JavaScript 로직 및 데이터
           ========================================= */
        
        // 🌟 문제 은행 (총 25문제)
        const allQuizData = [
            // --- Part 1 (기본 5문제) ---
            {
                question: "다음 코드의 실행 결과로 올바른 콘솔 출력 순서는 무엇인가요?\n\nconsole.log('A');\nsetTimeout(() => console.log('B'), 0);\nPromise.resolve().then(() => console.log('C'));\nconsole.log('D');",
                options: [
                    { text: "A - D - C - B", rationale: "동기 코드가 먼저 실행된 후, 마이크로태스크인 Promise가 매크로태스크인 setTimeout보다 먼저 실행됩니다.", isCorrect: true },
                    { text: "A - B - C - D", rationale: "자바스크립트는 코드를 위에서 아래로 읽지만, 비동기 콜백은 즉시 실행되지 않고 큐에서 대기합니다.", isCorrect: false },
                    { text: "A - D - B - C", rationale: "setTimeout이 0초라도 바로 실행되는 것이 아니라, Promise와 같은 마이크로태스크보다 우선순위가 낮습니다.", isCorrect: false },
                    { text: "C - A - D - B", rationale: "동기적 실행 컨텍스트에 있는 코드(A, D)가 콜백 큐에 있는 코드보다 항상 먼저 실행됩니다.", isCorrect: false }
                ]
            },
            {
                question: "이벤트 루프(Event Loop)가 새로운 태스크를 실행하기 위해 콜백 큐를 확인하기 직전에 반드시 비워야 하는 곳은 어디인가요?",
                options: [
                    { text: "Microtask Queue", rationale: "이벤트 루프는 하나의 매크로태스크를 처리한 후, 다음 매크로태스크로 넘어가기 전에 마이크로태스크 큐에 쌓인 모든 작업을 처리합니다.", isCorrect: true },
                    { text: "Web APIs", rationale: "Web APIs는 브라우저가 제공하는 비동기 작업을 처리하는 공간이며, 큐와는 성격이 다릅니다.", isCorrect: false },
                    { text: "Heap memory", rationale: "힙 메모리는 객체가 저장되는 공간이며, 실행 흐름을 제어하는 큐와는 직접적인 상관이 없습니다.", isCorrect: false },
                    { text: "Render Tree", rationale: "렌더 트리는 화면을 그리는 과정의 일부이며, 비동기 작업의 우선순위를 결정하는 큐가 아닙니다.", isCorrect: false }
                ]
            },
            {
                question: "async/await 문법에서 'await' 키워드가 하는 역할에 대한 설명으로 가장 적절한 것은 무엇인가요?",
                options: [
                    { text: "Promise가 settled 상태가 될 때까지 함수의 실행을 일시 중단하고 비동기적으로 기다립니다.", rationale: "await는 뒤에 오는 Promise의 결과를 기다리는 동안 호출 스택을 비워주어 다른 작업을 수행할 수 있게 합니다.", isCorrect: true },
                    { text: "비동기 작업을 동기 작업으로 완전히 변환하여 메인 스레드를 점유합니다.", rationale: "async/await는 겉보기에는 동기적이지만 내부적으로는 비동기적으로 동작하며 메인 스레드를 차단하지 않습니다.", isCorrect: false },
                    { text: "모든 setTimeout 작업을 즉시 실행하도록 강제합니다.", rationale: "await는 오직 Promise 객체를 대상으로 작동하며 일반적인 매크로태스크를 제어하지 않습니다.", isCorrect: false },
                    { text: "브라우저의 렌더링 과정을 중단시키고 네트워크 요청에 집중합니다.", rationale: "비동기 처리는 오히려 렌더링이 막히지 않게(Non-blocking) 하기 위해 사용됩니다.", isCorrect: false }
                ]
            },
            {
                question: "Promise의 세 가지 상태에 해당하지 않는 것은 무엇인가요?",
                options: [
                    { text: "Processing", rationale: "Promise의 표준 상태는 Pending, Fulfilled, Rejected 세 가지만 존재합니다.", isCorrect: true },
                    { text: "Pending", rationale: "비동기 처리가 아직 완료되지 않은 초기 상태를 의미합니다.", isCorrect: false },
                    { text: "Fulfilled", rationale: "비동기 처리가 성공적으로 완료되어 결과 값을 반환한 상태입니다.", isCorrect: false },
                    { text: "Rejected", rationale: "비동기 처리가 실패하거나 오류가 발생한 상태입니다.", isCorrect: false }
                ]
            },
            {
                question: "다음 중 매크로태스크 큐(Macrotask Queue)에 담기는 작업이 아닌 것은 무엇인가요?",
                options: [
                    { text: "MutationObserver 콜백", rationale: "MutationObserver와 Promise의 콜백은 마이크로태스크 큐에서 처리됩니다.", isCorrect: true },
                    { text: "setTimeout", rationale: "타이머 이벤트 콜백은 대표적인 매크로태스크 작업입니다.", isCorrect: false },
                    { text: "setInterval", rationale: "반복 타이머 역시 매크로태스크 큐를 통해 관리됩니다.", isCorrect: false },
                    { text: "UI 렌더링/이벤트 발생", rationale: "사용자 입력 이벤트나 화면 갱신 등은 매크로태스크의 범주에 포함됩니다.", isCorrect: false }
                ]
            },
            
            // --- Part 2 (심화 20문제) ---
            {
                question: "Promise 객체가 처음 생성되었을 때 가지는 초기 상태는 무엇인가요?",
                options: [
                    { text: "Pending (대기)", rationale: "비동기 작업이 아직 완료되지 않아 성공도 실패도 아닌 초기 상태를 의미합니다.", isCorrect: true },
                    { text: "Fulfilled (이행)", rationale: "비동기 작업이 성공적으로 완료되어 결과값을 반환한 상태입니다.", isCorrect: false },
                    { text: "Rejected (거부)", rationale: "비동기 작업 처리 중 오류가 발생하여 실패한 상태입니다.", isCorrect: false },
                    { text: "Settled (정착)", rationale: "성공이든 실패든 처리가 완료되어 더 이상 상태가 변하지 않는 묶음 개념입니다.", isCorrect: false }
                ]
            },
            {
                question: "자바스크립트 엔진에서 이벤트 루프(Event Loop)의 핵심적인 역할은 무엇인가요?",
                options: [
                    { text: "콜 스택과 태스크 큐를 주시하다가, 콜 스택이 비면 큐의 첫 번째 작업을 스택으로 밀어 넣습니다.", rationale: "자바스크립트의 비동기 흐름을 제어하는 핵심 메커니즘으로, 동기 코드 실행이 끝난 후 대기 중인 콜백을 실행시킵니다.", isCorrect: true },
                    { text: "코드를 기계어로 컴파일하여 실행 속도를 높입니다.", rationale: "코드를 컴파일하는 것은 JIT 컴파일러의 역할입니다.", isCorrect: false },
                    { text: "메모리 힙(Heap)에 할당된 사용하지 않는 변수들을 정리합니다.", rationale: "메모리를 정리하는 것은 가비지 컬렉터(Garbage Collector)의 역할입니다.", isCorrect: false },
                    { text: "DOM 트리를 순회하며 화면에 UI를 렌더링합니다.", rationale: "UI 렌더링은 브라우저의 렌더링 엔진이 담당하는 영역입니다.", isCorrect: false }
                ]
            },
            {
                question: "다음 중 `async` 키워드가 붙은 함수가 항상 반환하는 객체의 타입은 무엇인가요?",
                options: [
                    { text: "Promise", rationale: "async 함수는 내부에서 무엇을 반환하든 항상 이행(resolve)되거나 거부(reject)되는 Promise 객체로 감싸서 반환합니다.", isCorrect: true },
                    { text: "Function", rationale: "함수 자체를 반환하는 것은 고차 함수(Higher-order function)의 특징입니다.", isCorrect: false },
                    { text: "String", rationale: "내부에서 문자열을 return 하더라도, 최종적으로는 다른 형태로 감싸져서 반환됩니다.", isCorrect: false },
                    { text: "undefined", rationale: "return 문이 없으면 undefined를 반환하지만, 일반적인 undefined 타입과는 다릅니다.", isCorrect: false }
                ]
            },
            {
                question: "`Promise.all()` 메서드의 동작 방식에 대한 설명으로 올바른 것은 무엇인가요?",
                options: [
                    { text: "배열 내의 모든 프로미스가 성공(Fulfilled)해야만 완료되며, 하나라도 실패하면 즉시 실패(Rejected)로 처리됩니다.", rationale: "여러 비동기 작업을 동시에 실행하고 모든 작업이 완료될 때까지 기다릴 때 사용하며, 실패에 매우 민감합니다.", isCorrect: true },
                    { text: "가장 먼저 완료된 프로미스의 결과만 반환하고 나머지는 무시합니다.", rationale: "이는 Promise.all()이 아니라 Promise.race() 메서드의 동작 방식입니다.", isCorrect: false },
                    { text: "성공과 실패 여부에 상관없이 모든 프로미스가 끝날 때까지 기다립니다.", rationale: "실패를 포함해 모든 결과를 기다리는 것은 Promise.allSettled()의 특징입니다.", isCorrect: false },
                    { text: "실패한 프로미스는 자동으로 다시 실행(Retry)합니다.", rationale: "Promise API에는 자동으로 재시도하는 내장 기능이 없습니다.", isCorrect: false }
                ]
            },
            {
                question: "다음 중 `try...catch` 구문을 사용하여 에러를 처리하기 가장 적합한 상황은 무엇인가요?",
                options: [
                    { text: "async/await 환경에서 발생하는 비동기 요청의 실패 처리", rationale: "await를 사용할 때는 동기 코드처럼 동작하므로, 에러 역시 try...catch 블록을 통해 직관적으로 잡아낼 수 있습니다.", isCorrect: true },
                    { text: "일반적인 Promise.then() 체이닝 내부의 동기적 로직", rationale: "Promise 체이닝에서는 .catch() 메서드를 사용하는 것이 더 직관적입니다.", isCorrect: false },
                    { text: "setTimeout 내부 콜백 함수에서 발생하는 에러 잡기", rationale: "비동기 타이머 콜백 내에서 발생한 에러는 바깥의 try...catch로 잡을 수 없습니다.", isCorrect: false },
                    { text: "DOM 요소의 클릭 이벤트 핸들러 등록", rationale: "이벤트 리스너 등록 자체는 에러가 발생할 확률이 적어 try...catch를 필수로 사용하지 않습니다.", isCorrect: false }
                ]
            },
            {

        function shuffleArray(array) {

            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];

            if (text.includes('\n\n')) {
                const parts = text.split('\n\n');
                return `${parts[0]}<br><pre>${parts.slice(1).join('\n\n')}</pre>`;
            }
            return text;
        }

        // --- 이벤트 바인딩 ---
        
        // 1. 문제 수 선택 버튼
        dom.countBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                // UI 업데이트
                dom.countBtns.forEach(b => b.classList.remove('selected'));
                e.target.classList.add('selected');
                
                // 상태 업데이트
                state.selectedCount = parseInt(e.target.getAttribute('data-count'));
                
                // 시작 버튼 활성화
                dom.startBtn.disabled = false;
                const actualCount = Math.min(state.selectedCount, allQuizData.length);
                dom.startBtn.innerText = `총 ${actualCount}개 퀴즈 시작하기 🚀`;
            });
        });

        // 2. 퀴즈 시작
        dom.startBtn.addEventListener('click', () => {
            const actualCount = Math.min(state.selectedCount, allQuizData.length);
            
            // 문제 은행 섞고 필요한 개수만큼 추출
            state.currentQuizData = shuffleArray(allQuizData).slice(0, actualCount);
            
            // 각 문제의 보기들도 섞기
            state.currentQuizData.forEach(quiz => {
                quiz.options = shuffleArray(quiz.options);
            });

            state.currentQuestionIndex = 0;
            state.score = 0;

            // 화면 전환
            dom.homeContainer.classList.add('hidden');
            dom.progressEl.classList.remove('hidden');
            dom.quizContainer.classList.remove('hidden');
            
            renderQuestion();
        });

        // 3. 문제 렌더링
        function renderQuestion() {
            dom.rationaleContainer.classList.add('hidden');
            dom.optionsEl.innerHTML = '';
            
            const currentQuiz = state.currentQuizData[state.currentQuestionIndex];
            
            // 질문 렌더링 (코드 블록 처리 포함)
            dom.questionEl.innerHTML = formatQuestionText(currentQuiz.question);
            
            // 진행률 표시
            dom.progressEl.innerText = `문제 ${state.currentQuestionIndex + 1} / ${state.currentQuizData.length}`;

            // 보기 버튼 생성
            currentQuiz.options.forEach(option => {
                const button = document.createElement('button');
                button.innerText = option.text;
                button.classList.add('option-btn');
                button.addEventListener('click', () => handleAnswer(option, button));
                dom.optionsEl.appendChild(button);
            });
        }

        // 4. 정답 처리
        function handleAnswer(selectedOption, selectedButton) {
            const isCorrect = selectedOption.isCorrect;
            const currentQuiz = state.currentQuizData[state.currentQuestionIndex];
            
            if (isCorrect) {
                selectedButton.classList.add('correct');
                state.score++;
            } else {
                selectedButton.classList.add('wrong');
                // 오답을 고르면 정답 버튼을 시각적으로 알려줌
                Array.from(dom.optionsEl.children).forEach(btn => {
                    const optData = currentQuiz.options.find(o => o.text === btn.innerText);
                    if (optData && optData.isCorrect) {
                        btn.classList.add('correct');
                    }
                });
            }

            // 모든 버튼 비활성화
            Array.from(dom.optionsEl.children).forEach(btn => btn.disabled = true);
            
            // 해설 표시
            const icon = isCorrect ? '✅ 정답입니다!' : '❌ 아쉽네요!';
            dom.rationaleText.innerHTML = `<strong>${icon}</strong><br><br>${selectedOption.rationale}`;
            dom.rationaleContainer.classList.remove('hidden');
            
            // 마지막 문제인지 확인하여 다음 버튼 텍스트 변경
            dom.nextBtn.innerText = (state.currentQuestionIndex === state.currentQuizData.length - 1) 
                ? '결과 확인하기' 
                : '다음 문제로 넘어가기';
        }

        // 5. 다음 문제로 이동
        dom.nextBtn.addEventListener('click', () => {
            state.currentQuestionIndex++;
            if (state.currentQuestionIndex < state.currentQuizData.length) {
                renderQuestion();
            } else {
                showResults();
            }
        });

        // 6. 결과 화면 표시
        function showResults() {
            dom.quizContainer.classList.add('hidden');
            dom.progressEl.classList.add('hidden');
            dom.resultContainer.classList.remove('hidden');
            
            const total = state.currentQuizData.length;
            const percentage = Math.round((state.score / total) * 100);
            
            let feedback = '';
            if (percentage === 100) feedback = "완벽합니다! 비동기 마스터시네요. 👑";
            else if (percentage >= 80) feedback = "훌륭합니다! 핵심 개념을 잘 이해하고 계십니다. 👏";
            else if (percentage >= 50) feedback = "좋은 시도입니다! 오답 노트를 통해 복습해 보세요. 💪";
            else feedback = "조금 더 연습이 필요하군요. 다시 도전해 보세요! 🔥";

            dom.scoreText.innerHTML = `
                총 <strong>${total}</strong>문제 중 <strong>${state.score}</strong>문제를 맞혔습니다.<br>
                <span class="percentage" style="color: ${percentage >= 80 ? '#28a745' : percentage >= 50 ? '#fd7e14' : '#dc3545'};">
                    ${percentage}%
                </span>
                <p style="margin-top: 15px; font-weight: bold; color: #495057;">${feedback}</p>
            `;
        }

        // 7. 다시 풀기 (방금 푼 문제 세트 재도전)
        dom.retryBtn.addEventListener('click', () => {
            state.currentQuestionIndex = 0;
            state.score = 0;
            
            // 보기 순서만 다시 섞기
            state.currentQuizData.forEach(quiz => {
                quiz.options = shuffleArray(quiz.options);
            });
            
            dom.resultContainer.classList.add('hidden');
            dom.progressEl.classList.remove('hidden');
            dom.quizContainer.classList.remove('hidden');
            
            renderQuestion();
        });

        // 8. 처음으로 (초기화 후 홈 화면)
        dom.homeBtn.addEventListener('click', () => {
            state.selectedCount = 0;
            dom.startBtn.disabled = true;
            dom.startBtn.innerText = '문제 개수를 선택해주세요';
            dom.countBtns.forEach(b => b.classList.remove('selected'));
            
            dom.resultContainer.classList.add('hidden');
            dom.homeContainer.classList.remove('hidden');
        });

    </script>
</body>
</html>
