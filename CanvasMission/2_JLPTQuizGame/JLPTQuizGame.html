<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JLPT AI 스마트 퀴즈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans KR', 'Noto Sans JP', sans-serif;
            background-color: #f3f4f6;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bounce-delay {
            animation: bounce 1s infinite;
            animation-delay: 0.2s;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .option-btn {
            transition: all 0.2s ease;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid #3b82f6;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 커스텀 스크롤바 적용 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent; 
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="text-gray-800 h-screen w-screen flex items-center justify-center p-2 sm:p-4 bg-gray-100 overflow-hidden box-border">

    <!-- 메인 컨테이너 (고정된 높이와 overflow-hidden으로 스크롤 분리 완벽 보장) -->
    <div class="flex flex-col md:flex-row w-full max-w-7xl h-full md:h-[94vh] gap-4 mx-auto overflow-hidden">
        
        <!-- ================= 좌측: 메인 앱 영역 (시작/퀴즈/결과) ================= -->
        <div id="app-content" class="flex-1 bg-white rounded-2xl shadow-xl flex flex-col overflow-hidden relative border border-gray-200">
            
            <!-- 1. 시작 화면 -->
            <div id="screen-start" class="flex flex-col items-center justify-center p-8 flex-1 overflow-y-auto custom-scrollbar fade-in">
                <div class="w-24 h-24 bg-gradient-to-tr from-pink-100 to-rose-100 rounded-full flex items-center justify-center mb-6 shadow-sm border-4 border-white relative shrink-0">
                    <span class="text-5xl drop-shadow-sm ml-2">🌸📚</span>
                </div>
                
                <div class="flex items-center justify-center gap-3 mb-3 w-full shrink-0">
                    <span class="animate-bounce text-3xl hidden sm:block">✨</span>
                    <h1 class="text-3xl sm:text-4xl font-extrabold text-center text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600 tracking-tight pb-1">
                        JLPT 필수 단어 퀴즈
                    </h1>
                    <span class="bounce-delay text-3xl hidden sm:block">🚀</span>
                </div>
                
                <p class="text-gray-500 text-center mb-8 font-medium shrink-0">AI 선생님과 함께 뉘앙스까지 완벽하게 학습하세요!</p>
                
                <h2 class="text-lg font-semibold mb-4 text-gray-700 shrink-0">도전할 난이도를 선택하세요</h2>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 w-full max-w-md shrink-0 mb-8">
                    <button onclick="startQuiz('N5')" class="py-3 px-4 bg-white border-2 border-green-500 text-green-600 font-bold rounded-xl hover:bg-green-50 transition">N5 (입문)</button>
                    <button onclick="startQuiz('N4')" class="py-3 px-4 bg-white border-2 border-blue-400 text-blue-500 font-bold rounded-xl hover:bg-blue-50 transition">N4 (초급)</button>
                    <button onclick="startQuiz('N3')" class="py-3 px-4 bg-white border-2 border-indigo-500 text-indigo-600 font-bold rounded-xl hover:bg-indigo-50 transition">N3 (중급)</button>
                    <button onclick="startQuiz('N2')" class="py-3 px-4 bg-white border-2 border-purple-500 text-purple-600 font-bold rounded-xl hover:bg-purple-50 transition">N2 (상급)</button>
                    <button onclick="startQuiz('N1')" class="py-3 px-4 bg-white border-2 border-red-500 text-red-600 font-bold rounded-xl hover:bg-red-50 transition sm:col-span-2">N1 (마스터)</button>
                </div>
            </div>

            <!-- 2. 퀴즈 화면 -->
            <div id="screen-quiz" class="hidden flex-col flex-1 overflow-hidden fade-in">
                <!-- 상단 헤더 & 프로그레스 바 (고정) -->
                <div class="bg-gray-50 px-6 py-4 border-b border-gray-100 shrink-0">
                    <div class="flex justify-between items-center mb-2">
                        <div class="flex items-center gap-2">
                            <!-- 홈 버튼 추가 -->
                            <button onclick="goHome()" class="p-1.5 bg-gray-200 hover:bg-gray-300 rounded-lg text-gray-600 transition" title="처음으로 돌아가기">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                            </button>
                            <span id="quiz-level-badge" class="px-3 py-1 bg-blue-100 text-blue-700 font-bold rounded-full text-sm">N5</span>
                        </div>
                        <span class="text-gray-500 font-medium">문제 <span id="current-question-num" class="text-blue-600 font-bold text-lg">1</span> / <span id="total-question-num">10</span></span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div id="progress-bar" class="bg-blue-500 h-2.5 rounded-full transition-all duration-300" style="width: 10%"></div>
                    </div>
                </div>

                <!-- 문제 및 옵션 영역 (완벽하게 독립 스크롤 적용) -->
                <div class="flex-1 overflow-y-auto custom-scrollbar p-4 sm:p-6 flex flex-col relative bg-white">
                    <div class="flex flex-col items-center justify-center mb-6 mt-2 shrink-0">
                        <p class="text-gray-500 text-sm mb-2">다음 단어의 뜻은?</p>
                        <h2 id="question-word" class="text-5xl font-bold text-gray-800 text-center break-words font-[Noto Sans JP]">食べる</h2>
                    </div>

                    <div id="options-container" class="flex flex-col gap-3 mb-6 max-w-lg mx-auto w-full shrink-0">
                        <!-- 버튼들이 JS로 렌더링 됩니다. -->
                    </div>

                    <!-- 정답 확인 후 나타나는 피드백 (학습 카드) -->
                    <div id="feedback-card" class="hidden bg-blue-50 rounded-xl p-5 border border-blue-100 mb-6 fade-in shadow-sm max-w-lg mx-auto w-full shrink-0">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="bg-blue-500 text-white text-xs font-bold px-2 py-1 rounded">읽기</span>
                            <p id="feedback-reading" class="text-lg font-medium text-gray-800">たべる (타베루)</p>
                        </div>
                        <div class="flex items-center gap-2 mb-3">
                            <span class="bg-green-500 text-white text-xs font-bold px-2 py-1 rounded">의미</span>
                            <p id="feedback-meaning" class="text-lg font-bold text-gray-800">먹다</p>
                        </div>
                        <div class="mt-4 pt-3 border-t border-blue-200">
                            <p class="text-sm text-gray-500 font-bold mb-1">활용 예문</p>
                            <p id="feedback-example" class="text-gray-700 italic">朝ごはんを食べる。<br><span class="text-xs text-gray-500 font-normal">아사고항오 타베루.</span><br><span class="text-sm text-gray-600">아침밥을 먹다.</span></p>
                        </div>
                        
                        <!-- ✨ AI 암기 비법 영역 -->
                        <div class="mt-4 pt-3 border-t border-blue-200">
                            <button onclick="generateMnemonic()" id="btn-mnemonic" class="w-full py-2.5 bg-indigo-50 text-indigo-600 font-bold rounded-lg hover:bg-indigo-100 transition border border-indigo-200 flex items-center justify-center gap-2 text-sm">
                                ✨ AI 연상 암기 비법 생성
                            </button>
                            <div id="mnemonic-result" class="hidden mt-3 text-sm text-gray-700 bg-white p-4 rounded-xl border border-indigo-100 shadow-sm whitespace-pre-wrap leading-relaxed"></div>
                        </div>
                    </div>
                </div>

                <!-- 하단 다음 문제 버튼 (고정) -->
                <div id="next-btn-container" class="hidden shrink-0 p-4 bg-white border-t border-gray-200 fade-in">
                    <button onclick="nextQuestion()" class="w-full max-w-lg mx-auto block py-4 bg-gray-900 text-white font-bold text-lg rounded-xl hover:bg-gray-800 transition shadow-md">
                        다음 문제로
                    </button>
                </div>
            </div>

            <!-- 3. 결과 화면 -->
            <div id="screen-result" class="hidden flex-col items-center p-6 md:p-8 flex-1 overflow-y-auto custom-scrollbar fade-in">
                <div class="w-full max-w-md flex flex-col items-center mx-auto my-auto pb-8 shrink-0">
                    <h2 class="text-3xl font-bold text-gray-800 mb-2 mt-4">퀴즈 결과</h2>
                    <p id="result-message" class="text-gray-500 mb-8">수고하셨습니다!</p>

                    <div class="relative w-40 h-40 mb-6 flex items-center justify-center">
                        <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                            <path class="text-gray-200" stroke-width="3" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <path id="result-circle" class="text-blue-500 transition-all duration-1000 ease-out" stroke-dasharray="0, 100" stroke-width="3" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        </svg>
                        <div class="absolute flex flex-col items-center justify-center text-center">
                            <span id="result-score" class="text-4xl font-bold text-gray-800">8</span>
                            <span class="text-gray-400 text-sm">/ <span id="result-total">10</span> 문제</span>
                        </div>
                    </div>

                    <div class="bg-gray-50 rounded-xl p-4 w-full text-center mb-8 border border-gray-100">
                        <span class="text-gray-600 font-medium">정답률: <span id="result-percentage" class="text-blue-600 font-bold text-xl">80%</span></span>
                    </div>

                    <!-- ✨ 배운 단어로 이야기 만들기 영역 -->
                    <div class="w-full mb-8">
                        <button onclick="generateReviewStory()" id="btn-story" class="w-full py-3.5 bg-indigo-500 text-white font-bold rounded-xl hover:bg-indigo-600 transition shadow-sm flex items-center justify-center gap-2">
                            ✨ 오늘 배운 단어로 복습 이야기 만들기
                        </button>
                        <div id="story-result" class="hidden mt-4 p-5 bg-white border border-indigo-100 rounded-xl text-gray-700 text-sm leading-relaxed shadow-sm whitespace-pre-wrap text-left"></div>
                    </div>

                    <div class="flex flex-col w-full gap-3 mt-auto">
                        <button id="btn-retry-incorrect" onclick="retryIncorrectQuiz()" class="hidden w-full py-3.5 bg-rose-500 text-white font-bold rounded-xl hover:bg-rose-600 transition shadow-sm">
                            틀린 문제만 다시 풀기 (<span id="incorrect-count">0</span>문제)
                        </button>
                        <button onclick="retryQuiz()" class="w-full py-3.5 bg-blue-500 text-white font-bold rounded-xl hover:bg-blue-600 transition shadow-sm">
                            틀린 문제 포함 다시풀기
                        </button>
                        <button onclick="goHome()" class="w-full py-3.5 bg-white border border-gray-300 text-gray-700 font-bold rounded-xl hover:bg-gray-50 transition shadow-sm">
                            처음으로 (난이도 선택)
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= 우측: 상시 대기 제미나이 챗봇 ================= -->
        <div id="persistent-chatbot" class="w-full md:w-[380px] lg:w-[420px] bg-white rounded-2xl shadow-xl flex flex-col h-[45vh] md:h-full shrink-0 border border-gray-200 overflow-hidden relative">
            <!-- 챗봇 헤더 (고정) -->
            <div class="bg-indigo-600 px-5 py-4 flex items-center gap-3 shrink-0 shadow-sm text-white z-10">
                <span class="text-2xl bg-white/20 p-1.5 rounded-lg">🤖</span>
                <div>
                    <h3 class="font-bold text-lg leading-tight flex items-center gap-2">
                        제미나이 튜터
                        <span class="relative flex h-2.5 w-2.5">
                          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-500"></span>
                        </span>
                    </h3>
                    <p class="text-xs text-indigo-100 mt-0.5">상시 대기 중! 궁금한 점을 질문하세요.</p>
                </div>
            </div>
            
            <!-- 채팅 로그 영역 (스크롤) -->
            <div id="chat-messages" class="flex-1 overflow-y-auto custom-scrollbar p-4 flex flex-col gap-4 text-sm bg-[#f8fafc]">
                <!-- 초기 로드 시 환영 메시지가 JS로 삽입됩니다. -->
            </div>
            
            <!-- 입력창 영역 (고정) -->
            <div class="p-3 border-t border-gray-200 bg-white flex gap-2 shrink-0 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-10">
                <input type="text" id="ai-input" placeholder="유사한 단어나 뉘앙스를 물어보세요!" class="flex-grow px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm transition-all" onkeypress="handleEnter(event)">
                <button onclick="sendChatMessage()" id="ai-send-btn" class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl font-bold hover:bg-indigo-700 transition disabled:bg-gray-400 flex items-center justify-center min-w-[70px] shadow-sm">
                    전송
                </button>
            </div>
        </div>

    </div>

    <!-- JavaScript 로직 -->

        function selectOption(selectedIndex, clickedBtn) {

        function showResults() {

        async function fetchGeminiWithBackoff(userQuery, systemPrompt, retries = 5) {
            const delays = [1000, 2000, 4000, 8000, 16000];
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            
            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
            };

            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP Error: ${response.status}`);
                    }
                    
                    const result = await response.json();
                    return result.candidates?.[0]?.content?.parts?.[0]?.text || "응답을 생성할 수 없습니다.";
                } catch (error) {
                    if (i === retries - 1) {
                        throw error;
                    }
                    await new Promise(resolve => setTimeout(resolve, delays[i]));
                }
            }
        }

        async function sendChatMessage() {
            const userText = dom.aiInput.value.trim();
            if (!userText) return;

            appendMessage('user', userText);
            dom.aiInput.value = '';
            dom.aiSendBtn.disabled = true;

            dom.chatMessages.appendChild(loadingDiv);
            dom.chatMessages.scrollTop = dom.chatMessages.scrollHeight;

            let systemPrompt = "당신은 친절한 일본어 학습 선생님입니다. 사용자에게 일본어 학습 관련 힌트나 조언을 제공하세요.";
            
            // 퀴즈 화면이 활성화(flex) 되어 있을 때만 정답 제한 프롬프트 적용
            if (questionList.length > 0 && screens.quiz.classList.contains('flex')) {
                const currentQ = questionList[currentIndex];
                if (currentQ) {
                    const optionString = currentQ.options.join(', ');
                    systemPrompt += `
                        현재 사용자는 JLPT ${currentLevel} 난이도의 단어 퀴즈를 풀고 있습니다.
                        - 현재 질문된 단어: ${currentQ.word}
                        - 단어의 뜻(정답): ${currentQ.meaning}
                        - 객관식 보기: [${optionString}]
                        
                        [절대 엄수 조건]
                        1. 사용자가 어떻게 물어보든, 정답(단어의 뜻)을 직접적으로 말하거나 보기에 있는 정답 단어를 노출해서는 안 됩니다.
                        2. 질문의 의도에 맞게 단어의 뉘앙스, 활용 예시(어원, 상황 등), 유의어 또는 정답을 유추할 수 있는 간접적인 '힌트'만 제공하세요.
                        3. 친근하고 부드러운 한국어(존댓말)로 답변하세요.
                        4. 답변은 너무 길지 않게 핵심만 2~3문장으로 답변하세요.
                    `;
                }
            }

            try {
                const aiResponseText = await fetchGeminiWithBackoff(userText, systemPrompt);
                dom.chatMessages.removeChild(loadingDiv);
                appendMessage('ai', aiResponseText);
            } catch (error) {
                dom.chatMessages.removeChild(loadingDiv);
                appendMessage('ai', "앗, 통신에 문제가 발생했어요. 잠시 후 다시 시도해주세요. 🥲");
            } finally {
                dom.aiSendBtn.disabled = false;
                dom.aiInput.focus();
            }
        }

        // --- 7. 추가 AI 기능: 연상 암기 비법 생성 ---
        async function generateMnemonic() {
            const currentQ = questionList[currentIndex];
            
            dom.btnMnemonic.disabled = true;
            dom.btnMnemonic.innerHTML = '<div class="spinner border-indigo-500 border-t-indigo-200 mr-2 w-4 h-4"></div> 생성 중...';
            dom.mnemonicResult.classList.remove('hidden');
            dom.mnemonicResult.innerHTML = '<div class="text-center text-gray-400 py-2">AI가 기발한 암기법을 고민하고 있습니다...</div>';

            const prompt = `일본어 단어 "${currentQ.word}"(읽기: ${currentQ.reading}, 뜻: ${currentQ.meaning})를 아주 쉽고 재미있게 외울 수 있는 연상 암기법(Mnemonic)을 딱 1~2문장으로 만들어주세요. 일본어 발음과 한국어 뜻을 재치있게 연결해주세요. (예: '다베루(食べる)' -> 다 배부를 때까지 '먹다')`;

            try {
                const response = await fetchGeminiWithBackoff(prompt, "당신은 센스있고 유머러스한 일본어 단어 암기 전문가입니다.");
                dom.mnemonicResult.innerHTML = `💡 <strong>AI 암기 꿀팁:</strong>\n${response}`;
                // 생성 후 부드럽게 스크롤
                const scrollableDiv = dom.mnemonicResult.parentElement.parentElement.parentElement;
                scrollableDiv.scrollTo({ top: scrollableDiv.scrollHeight, behavior: 'smooth' });
            } catch (error) {
                dom.mnemonicResult.innerHTML = "암기법을 생성하는데 실패했습니다. 다시 시도해주세요.";
            } finally {
                dom.btnMnemonic.innerHTML = '✨ AI 연상 암기 비법 재생성';
                dom.btnMnemonic.disabled = false;
            }
        }

        // --- 8. 추가 AI 기능: 복습 이야기 생성 ---
        async function generateReviewStory() {
            dom.btnStory.disabled = true;
            dom.btnStory.innerHTML = '<div class="spinner border-white border-t-indigo-200 mr-2 w-5 h-5"></div> 스토리를 쓰는 중...';
            dom.storyResult.classList.remove('hidden');
            dom.storyResult.innerHTML = '<div class="text-center text-gray-400 py-4">방금 푼 단어들을 조합하여 스토리를 만들고 있습니다...<br>잠시만 기다려주세요!</div>';

            const wordsList = questionList.map(q => `${q.word}(${q.meaning})`).join(', ');
            const prompt = `다음 ${questionList.length}개의 일본어 단어들을 최대한 자연스럽게 모두 활용해서 JLPT ${currentLevel} 수준에 맞는 짧은 이야기(약 4~6문장)를 일본어로 작성해주세요.\n\n[사용할 단어]\n${wordsList}\n\n결과는 아래 형식으로 출력해주세요:\n\n[일본어 이야기]\n(일본어 텍스트)\n\n[한국어 발음]\n(일본어 텍스트의 한국어 발음 표기)\n\n[한국어 해석]\n(한국어 번역 텍스트)\n\n이야기 안에 사용된 ${questionList.length}개의 단어는 **굵게(마크다운 ** 사용)** 표시해주세요.`;

            try {
                const response = await fetchGeminiWithBackoff(prompt, "당신은 일본어 교육 전문가이자, 주어진 단어를 모두 활용해 재미있는 스토리를 잘 지어내는 뛰어난 작가입니다.");
                const formattedResponse = response.replace(/\*\*(.*?)\*\*/g, '<strong class="text-indigo-600 bg-indigo-50 px-1 rounded">$1</strong>');
                dom.storyResult.innerHTML = formattedResponse;
            } catch (error) {
                dom.storyResult.innerHTML = "이야기를 생성하는데 실패했습니다. 다시 시도해주세요.";
            } finally {
                dom.btnStory.innerHTML = '✨ 스토리 다시 만들기';
                dom.btnStory.disabled = false;
            }
        }

    </script>
