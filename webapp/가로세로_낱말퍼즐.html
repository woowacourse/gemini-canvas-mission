<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가로세로 낱말 퍼즐</title>
    <style>
        :root {
            --primary-color: #2AC1BC;
            --primary-dark: #23a09d;
            --bg-color: #F6F6F6;
            --card-bg: #FFFFFF;
            --text-color: #333333;
            --border-color: #E0E0E0;
            --black-cell: #353b48;
        }

        * {
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Lobby Screen */
        #lobby-screen {
            text-align: center;
            background: var(--card-bg);
            padding: 50px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 100%;
        }

        .logo {
            font-size: 2.5rem;
            color: var(--primary-color);
            font-weight: 800;
            margin-bottom: 10px;
        }

        .difficulty-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 35px;
        }

        .diff-option {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .diff-btn {
            width: 100%;
            padding: 16px;
            font-size: 1.15rem;
            border: 2px solid var(--primary-color);
            background: white;
            color: var(--primary-color);
            border-radius: 14px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .diff-btn:hover {
            background: var(--primary-color);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(42, 193, 188, 0.2);
        }

        /* Main Game Screen */
        #game-screen {
            display: none;
            width: 100%;
            max-width: 1100px;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        .game-container {
            display: flex;
            gap: 30px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Board Section */
        .board-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            background: var(--card-bg);
            padding: 10px 25px;
            border-radius: 50px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .stat-item { font-weight: 600; }
        .stat-value { color: var(--primary-color); margin-left: 5px; }

        #game-board {
            display: grid;
            gap: 2px;
            background-color: var(--border-color);
            border: 2px solid var(--border-color);
            padding: 2px;
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .cell {
            width: 50px;
            height: 50px;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            position: relative;
            cursor: pointer;
        }

        .cell.black { background-color: var(--black-cell); cursor: default; }
        .cell.correct { color: var(--primary-color); animation: pop 0.3s ease; }
        .cell .number { position: absolute; top: 2px; left: 2px; font-size: 0.65rem; color: #999; }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Hints Section */
        .hints-section {
            flex: 1;
            min-width: 320px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            max-height: 650px;
            overflow-y: auto;
        }

        .hints-group h3 {
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 8px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            color: var(--primary-color);
        }

        .hint-item {
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.95rem;
            line-height: 1.4;
            border-left: 3px solid transparent;
        }

        .hint-item:hover {
            background: #f0fdfc;
            border-left-color: var(--primary-color);
        }

        .hint-item.solved {
            text-decoration: line-through;
            color: #ccc;
            cursor: default;
        }

        /* Input Modal */
        .input-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(2px);
        }

        .input-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .input-card h4 { margin-top: 0; color: var(--primary-color); }
        #hint-text { margin-bottom: 20px; font-weight: 500; }

        .input-group { display: flex; gap: 10px; }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            outline: none;
        }
        input[type="text"]:focus { border-color: var(--primary-color); }

        .btn-submit { background: var(--primary-color); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn-close { background: #eee; border: none; padding: 10px; margin-top: 15px; width: 100%; border-radius: 8px; cursor: pointer; }

        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #333; color: white; padding: 12px 24px; border-radius: 30px;
            opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 1000;
        }
        .toast.show { opacity: 1; }

        /* Custom Win Modal */
        .win-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(42, 193, 188, 0.95);
            display: none; justify-content: center; align-items: center;
            z-index: 200; color: white;
        }
        .win-card { text-align: center; padding: 20px; }
        .win-card h2 { font-size: 3.5rem; margin-bottom: 10px; }
        .win-card p { font-size: 1.3rem; margin-bottom: 35px; line-height: 1.6; }

        .back-link {
            margin-top: 25px;
            color: #999;
            text-decoration: underline;
            cursor: pointer;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<!-- Lobby Screen -->
<div id="lobby-screen">
    <div class="logo">가로세로 낱말퍼즐</div>
    <p>개발자가 갖춰야 할 지식을 퍼즐로 풀어보세요.</p>
    <div class="difficulty-buttons">
        <div class="diff-option">
            <button class="diff-btn" onclick="startGame('easy')">초급 (5x5)</button>
        </div>
        <div class="diff-option">
            <button class="diff-btn" onclick="startGame('normal1')">중급 1 (8x8)</button>
        </div>
        <div class="diff-option">
            <button class="diff-btn" onclick="startGame('normal2')">중급 2 (8x8)</button>
        </div>
    </div>
</div>

<!-- Game Screen -->
<div id="game-screen">
    <header>
        <h2 id="current-level-title" style="color: var(--primary-color);">초급 퍼즐</h2>
    </header>

    <div class="stats-bar">
        <div class="stat-item">점수: <span id="score" class="stat-value">0</span></div>
        <div class="stat-item">시간: <span id="timer" class="stat-value">00:00</span></div>
    </div>

    <div class="game-container">
        <!-- Board Section -->
        <div class="board-section">
            <div id="game-board"></div>
            <div class="back-link" onclick="location.reload()">난이도 재선택으로 돌아가기</div>
        </div>

        <!-- Hint List Section -->
        <div class="hints-section">
            <div class="hints-group">
                <h3>가로 문제 (Across)</h3>
                <div id="across-hints"></div>
            </div>
            <div class="hints-group" style="margin-top: 30px;">
                <h3>세로 문제 (Down)</h3>
                <div id="down-hints"></div>
            </div>
        </div>
    </div>
</div>

<!-- Input Modal Overlay -->
<div id="input-overlay" class="input-overlay">
    <div class="input-card">
        <h4 id="input-title">Q1 가로</h4>
        <p id="hint-text">문제 내용이 여기에 표시됩니다.</p>
        <div class="input-group">
            <input type="text" id="answer-input" placeholder="정답을 입력하세요" autocomplete="off">
            <button class="btn-submit" onclick="checkAnswer()">확인</button>
        </div>
        <button class="btn-close" onclick="closeInput()">닫기</button>
    </div>
</div>

<!-- Win Modal Overlay -->
<div id="win-overlay" class="win-overlay">
    <div class="win-card">
        <h2>🎉 성공!</h2>
        <p id="win-stats">모든 퍼즐을 완성했습니다.</p>
        <button class="diff-btn" style="background: white; border: none;" onclick="location.reload()">로비로 돌아가기</button>
    </div>
</div>

<div id="toast" class="toast">정답입니다!</div>

<script>
    const levels = {
        easy: {
            title: '초급 퍼즐', size: 5,
            words: [
                { id: 1, x: 0, y: 0, dir: 'h', answer: 'API', hint: '소프트웨어 간의 통신 창구 역할을 하는 인터페이스입니다.' },
                { id: 2, x: 0, y: 0, dir: 'v', answer: 'AWS', hint: '아마존에서 제공하는 가장 대중적인 클라우드 서비스입니다.' },
                { id: 3, x: 2, y: 0, dir: 'h', answer: 'SQL', hint: '데이터베이스 시스템에서 데이터를 조작하기 위한 표준 언어입니다.' },
                { id: 4, x: 0, y: 4, dir: 'v', answer: 'IDE', hint: '개발을 돕는 통합 개발 환경(예: IntelliJ, VSCode)입니다.' }
            ]
        },
        normal1: {
            title: '중급 1 퍼즐', size: 8,
            words: [
                { id: 1, x: 1, y: 0, dir: 'h', answer: 'JAVA', hint: '백엔드 개발에서 널리 쓰이는 객체지향 프로그래밍 언어입니다.' },
                { id: 2, x: 1, y: 0, dir: 'v', answer: 'JSON', hint: '데이터를 교환하기 위한 가벼운 텍스트 기반의 형식입니다.' },
                { id: 3, x: 0, y: 3, dir: 'v', answer: 'DATABASE', hint: '데이터를 구조화하여 저장하고 관리하는 시스템의 집합체입니다.' },
                { id: 4, x: 3, y: 3, dir: 'h', answer: 'AUTH', hint: '인증(Authentication)과 인가(Authorization)를 아우르는 개념입니다.' },
                { id: 5, x: 6, y: 3, dir: 'h', answer: 'SSL', hint: '웹사이트와 브라우저 사이의 보안을 위한 암호화 프로토콜입니다.' }
            ]
        },
        normal2: {
            title: '중급 2 퍼즐', size: 8,
            words: [
                { id: 1, x: 1, y: 1, dir: 'h', answer: 'HTTP', hint: '웹에서 브라우저와 서버 간 데이터를 주고받기 위한 기본 통신 프로토콜입니다.' },
                { id: 2, x: 1, y: 4, dir: 'v', answer: 'PORT', hint: '네트워크 서비스나 특정 프로세스를 식별하기 위한 논리적 단위 번호입니다.' },
                { id: 3, x: 3, y: 4, dir: 'h', answer: 'REST', hint: 'HTTP의 장점을 최대한 활용하는 아키텍처 스타일로 자원(Resource)을 정의합니다.' },
                { id: 4, x: 3, y: 7, dir: 'v', answer: 'TEST', hint: '소프트웨어의 결함을 찾고 의도한 대로 동작하는지 검증하는 과정입니다.' },
                { id: 5, x: 1, y: 2, dir: 'v', answer: 'TAG', hint: 'Git에서 특정 커밋 시점에 이름을 붙여 관리하는 이정표(태그)입니다.' }
            ]
        }
    };

    let currentDifficulty = 'easy';
    let score = 0;
    let seconds = 0;
    let timerInterval;
    let activeWord = null;
    let solvedWords = new Set();

    function startGame(diff) {
        currentDifficulty = diff;
        score = 0;
        solvedWords.clear();
        seconds = 0;

        document.getElementById('lobby-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'flex';
        document.getElementById('current-level-title').innerText = levels[diff].title;
        document.getElementById('score').innerText = '0';

        renderBoard();
        renderHints();
        startTimer();

        // Support Enter key for submission
        document.getElementById('answer-input').onkeypress = (e) => {
            if (e.key === 'Enter') checkAnswer();
        };
    }

    function startTimer() {
        clearInterval(timerInterval);
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            seconds++;
            updateTimerDisplay();
        }, 1000);
    }

    function formatTime(s) {
        const m = Math.floor(s / 60).toString().padStart(2, '0');
        const sec = (s % 60).toString().padStart(2, '0');
        return `${m}:${sec}`;
    }

    function updateTimerDisplay() {
        document.getElementById('timer').innerText = formatTime(seconds);
    }

    function renderBoard() {
        const board = document.getElementById('game-board');
        const config = levels[currentDifficulty];
        board.style.gridTemplateColumns = `repeat(${config.size}, 50px)`;
        board.innerHTML = '';

        const grid = Array.from({ length: config.size }, () => Array(config.size).fill(-1));

        config.words.forEach(word => {
            for (let i = 0; i < word.answer.length; i++) {
                const r = word.dir === 'v' ? word.x + i : word.x;
                const c = word.dir === 'h' ? word.y + i : word.y;
                if (grid[r] && grid[r][c] !== undefined) {
                    grid[r][c] = word.id;
                }
            }
        });

        for (let r = 0; r < config.size; r++) {
            for (let c = 0; c < config.size; c++) {
                const cellDiv = document.createElement('div');
                cellDiv.className = 'cell';
                cellDiv.id = `cell-${r}-${c}`;

                if (grid[r][c] === -1) {
                    cellDiv.classList.add('black');
                } else {
                    const wordIds = config.words.filter(w => {
                        if (w.dir === 'h') return w.x === r && c >= w.y && c < w.y + w.answer.length;
                        if (w.dir === 'v') return w.y === c && r >= w.x && r < w.x + w.answer.length;
                    }).map(w => w.id);

                    cellDiv.onclick = () => openInput(wordIds[0]);

                    const startWord = config.words.find(w => w.x === r && w.y === c);
                    if (startWord) {
                        const num = document.createElement('span');
                        num.className = 'number';
                        num.innerText = startWord.id;
                        cellDiv.appendChild(num);
                    }
                }
                board.appendChild(cellDiv);
            }
        }
    }

    function renderHints() {
        const config = levels[currentDifficulty];
        const acrossDiv = document.getElementById('across-hints');
        const downDiv = document.getElementById('down-hints');

        acrossDiv.innerHTML = '';
        downDiv.innerHTML = '';

        config.words.forEach(word => {
            const hintItem = document.createElement('div');
            hintItem.className = 'hint-item';
            hintItem.id = `hint-${word.id}`;
            hintItem.innerHTML = `<strong>${word.id}.</strong> ${word.hint}`;
            hintItem.onclick = () => openInput(word.id);

            if (word.dir === 'h') acrossDiv.appendChild(hintItem);
            else downDiv.appendChild(hintItem);
        });
    }

    function openInput(wordId) {
        const word = levels[currentDifficulty].words.find(w => w.id === wordId);
        if (solvedWords.has(word.answer)) return;

        activeWord = word;
        document.getElementById('input-title').innerText = `Q${word.id} ${word.dir === 'h' ? '가로' : '세로'}`;
        document.getElementById('hint-text').innerText = word.hint;
        document.getElementById('input-overlay').style.display = 'flex';
        const input = document.getElementById('answer-input');
        input.value = '';
        input.focus();
    }

    function closeInput() {
        document.getElementById('input-overlay').style.display = 'none';
        activeWord = null;
    }

    function checkAnswer() {
        if (!activeWord) return;
        const input = document.getElementById('answer-input');
        const userAnswer = input.value.trim().toUpperCase();

        if (userAnswer === activeWord.answer) {
            solvedWords.add(activeWord.answer);
            score += 5;
            document.getElementById('score').innerText = score;

            updateCellsForWord(activeWord);
            document.getElementById(`hint-${activeWord.id}`).classList.add('solved');

            showToast("정답입니다! +5점");
            closeInput();

            if (solvedWords.size === levels[currentDifficulty].words.length) {
                gameWin();
            }
        } else {
            showToast("틀렸습니다!");
            input.value = '';
        }
    }

    function updateCellsForWord(word) {
        for (let i = 0; i < word.answer.length; i++) {
            const r = word.dir === 'v' ? word.x + i : word.x;
            const c = word.dir === 'h' ? word.y + i : word.y;
            const cell = document.getElementById(`cell-${r}-${c}`);
            if (cell) {
                cell.innerText = word.answer[i];
                cell.classList.add('correct');

                const startWord = levels[currentDifficulty].words.find(w => w.x === r && w.y === c);
                if (startWord) {
                    const num = document.createElement('span');
                    num.className = 'number';
                    num.innerText = startWord.id;
                    cell.appendChild(num);
                }
            }
        }
    }

    function gameWin() {
        clearInterval(timerInterval);
        const timeStr = document.getElementById('timer').innerText;

        const winOverlay = document.getElementById('win-overlay');
        const winStats = document.getElementById('win-stats');

        winStats.innerHTML = `최종 점수: ${score}점<br>소요 시간: ${timeStr}`;
        winOverlay.style.display = 'flex';
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }
</script>

</body>
</html>
