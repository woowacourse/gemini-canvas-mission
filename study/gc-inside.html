<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GC-Inside</title>
    <style>
        /* * 무채색 및 초록색 포인트 컬러 시스템 적용
         */
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --border-color: #333333;
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --accent: #22c55e;
            /* 포인트 컬러: 초록색 */
            --accent-dim: rgba(34, 197, 94, 0.15);
            --dead-color: #444444;
            --stw-color: rgba(255, 60, 60, 0.2);
            /* Stop-the-world 강조용 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace, 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* 헤더 영역 */
        header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--panel-bg);
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header h1::before {
            content: '';
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: var(--accent);
            border-radius: 50%;
        }

        /* 메인 레이아웃 */
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 왼쪽 패널 (제어부 및 코드) */
        .left-panel {
            width: 420px;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            background-color: var(--panel-bg);
            z-index: 10;
        }

        .scenario-selector {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 160px;
            /* 약 3개 정도의 블록만 보이도록 높이 축소 */
            overflow-y: auto;
        }

        /* 스크롤바 스타일링 */
        .scenario-selector::-webkit-scrollbar {
            width: 8px;
        }

        .scenario-selector::-webkit-scrollbar-track {
            background: var(--bg-color);
        }

        .scenario-selector::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .scenario-selector::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        .scenario-btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 0.75rem 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 4px;
            font-size: 0.85rem;
            line-height: 1.3;
        }

        .scenario-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            background-color: var(--accent-dim);
            font-weight: bold;
        }

        .code-display {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .code-line {
            padding: 4px 8px;
            border-left: 3px solid transparent;
            color: var(--text-muted);
            transition: all 0.3s;
            white-space: pre;
        }

        .code-line.active {
            color: var(--text-main);
            border-left-color: var(--accent);
            background-color: var(--accent-dim);
        }

        .description-box {
            padding: 1.5rem;
            border-top: 1px solid var(--border-color);
            min-height: 140px;
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-main);
        }

        .controls {
            padding: 1rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 1rem;
        }

        button.action-btn {
            flex: 1;
            background-color: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 0.8rem;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 4px;
            transition: all 0.2s;
        }

        button.action-btn:hover {
            background-color: var(--accent);
            color: var(--bg-color);
        }

        button.action-btn:disabled {
            border-color: var(--border-color);
            color: var(--border-color);
            cursor: not-allowed;
            background-color: transparent;
        }

        /* 오른쪽 패널 (JVM 메모리 시각화 영역) */
        .right-panel {
            flex: 1;
            position: relative;
            padding: 2rem;
            display: flex;
            gap: 2rem;
            background-image: radial-gradient(var(--border-color) 1px, transparent 1px);
            background-size: 30px 30px;
            transition: background-color 0.5s;
        }

        /* Stop the world 시각 효과 */
        .right-panel.stw-active {
            background-color: var(--stw-color);
        }

        /* 참조선(화살표)을 그릴 SVG 레이어 */
        #svg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* 힙에 존재하는 객체들이 절대 위치로 배치될 레이어 */
        #objects-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 4;
        }

        .memory-column {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .stack-column {
            width: 150px;
            z-index: 2;
        }

        .heap-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            z-index: 2;
        }

        .area-title {
            text-align: center;
            font-weight: bold;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .memory-box {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            position: relative;
            background-color: rgba(30, 30, 30, 0.8);
            transition: all 0.5s;
        }

        /* 하이라이트 효과 */
        .memory-box.highlight {
            border-color: var(--accent);
            box-shadow: inset 0 0 20px var(--accent-dim);
        }

        .memory-box::before {
            content: attr(data-label);
            position: absolute;
            top: -10px;
            left: 15px;
            background-color: var(--panel-bg);
            padding: 0 5px;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* Stack Variables */
        #stack-area {
            min-height: 400px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stack-var {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 10px;
            text-align: center;
            border-radius: 4px;
            transition: all 0.3s;
            position: relative;
            font-weight: bold;
        }

        .stack-var.active {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 10px var(--accent-dim);
        }

        /* Heap Regions */
        .young-gen {
            display: flex;
            gap: 1rem;
            height: 200px;
        }

        #region-eden {
            flex: 2;
        }

        .survivor-spaces {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        #region-s0 {
            flex: 1;
        }

        #region-s1 {
            flex: 1;
        }

        #region-old {
            height: 200px;
        }

        /* Memory Object (Absolute Positioned in JS) */
        .heap-obj {
            position: absolute;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 0.9rem;
            /* 이동 애니메이션의 핵심 */
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1),
                border-color 0.5s, background-color 0.5s, color 0.5s, opacity 0.5s;
        }

        /* 살아있는 객체 (초록색 포인트) */
        .heap-obj.live {
            border: 2px solid var(--accent);
            background-color: var(--bg-color);
            color: var(--accent);
            box-shadow: 0 0 15px var(--accent-dim);
            z-index: 10;
        }

        /* 참조가 끊긴 객체 (무채색/가비지 대기 상태) */
        .heap-obj.dead {
            border: 2px dashed var(--dead-color);
            background-color: transparent;
            color: var(--dead-color);
            opacity: 0.6;
            z-index: 5;
        }

        .heap-obj .age-badge {
            position: absolute;
            bottom: -6px;
            right: -6px;
            background-color: var(--bg-color);
            border: 1px solid currentColor;
            font-size: 0.6rem;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 스텝 인디케이터 */
        .step-indicator {
            display: flex;
            gap: 4px;
            margin-bottom: 1rem;
        }

        .step-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--border-color);
            transition: background-color 0.3s;
        }

        .step-dot.active {
            background-color: var(--accent);
        }

        /* ==========================================
           챗봇 UI 스타일 (추가됨)
           ========================================== */
        .chatbot-toggle-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: var(--panel-bg);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chatbot-toggle-btn:hover {
            background-color: var(--accent);
            color: var(--bg-color);
            transform: translateY(-2px);
        }

        .chatbot-window {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 360px;
            height: 550px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            z-index: 1001;
            overflow: hidden;
            transition: opacity 0.3s ease, transform 0.3s ease;
            transform-origin: bottom right;
        }

        .chatbot-window.hidden {
            opacity: 0;
            transform: scale(0.9) translateY(20px);
            pointer-events: none;
        }

        .chat-header {
            background-color: var(--bg-color);
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 1rem;
        }

        .chat-header-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-header-title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--accent);
            border-radius: 50%;
        }

        .chat-close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s;
        }

        .chat-close-btn:hover {
            color: var(--text-main);
        }

        .chat-body {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: var(--panel-bg);
        }

        /* 스크롤바 스타일링 (챗봇) */
        .chat-body::-webkit-scrollbar {
            width: 6px;
        }

        .chat-body::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-body::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        .chat-message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.5;
            word-break: break-word;
            position: relative;
        }

        /* 봇(AI) 메시지 (좌측, 무채색) */
        .chat-message.bot {
            align-self: flex-start;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-top-left-radius: 2px;
            color: var(--text-main);
        }

        /* 사용자 메시지 (우측, 초록색 포인트) */
        .chat-message.user {
            align-self: flex-end;
            background-color: var(--accent-dim);
            color: var(--accent);
            border: 1px solid var(--accent);
            border-top-right-radius: 2px;
        }

        .chat-input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid var(--border-color);
            background-color: var(--bg-color);
            gap: 8px;
        }

        .chat-input-area input {
            flex: 1;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 20px;
            outline: none;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        .chat-input-area input:focus {
            border-color: var(--accent);
        }

        .chat-send-btn {
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }

        .chat-send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 10px var(--accent-dim);
        }

        .chat-send-btn:disabled {
            background-color: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .typing-indicator::after {
            content: '...';
            animation: typing 1.5s infinite;
        }

        @keyframes typing {
            0% {
                content: '.';
            }

            33% {
                content: '..';
            }

            66% {
                content: '...';
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>GC-Inside</h1>
        <div style="color: var(--text-muted); font-size: 0.9rem;">JVM Garbage Collection 시뮬레이터</div>
    </header>

    <div class="container">
        <!-- 왼쪽 패널 -->
        <div class="left-panel">
            <div class="scenario-selector" id="scenario-selector">
                <!-- JS에서 동적 생성됨 -->
            </div>

            <div class="code-display" id="code-display">
                <!-- JS에서 동적 생성됨 -->
            </div>

            <div class="description-box">
                <div class="step-indicator" id="step-indicator"></div>
                <div id="description-text">상단의 시나리오를 선택하여 학습을 시작하세요.</div>
            </div>

            <div class="controls">
                <button class="action-btn" id="btn-prev" disabled>이전 단계</button>
                <button class="action-btn" id="btn-next">다음 단계</button>
            </div>
        </div>

        <!-- 오른쪽 패널 -->
        <div class="right-panel" id="vis-board">
            <svg id="svg-layer"></svg>
            <div id="objects-layer"></div>

            <div class="memory-column stack-column">
                <div class="area-title">Stack</div>
                <div class="memory-box" id="stack-area" data-label="Local Variables">
                    <!-- 스택 변수 렌더링 영역 -->
                </div>
            </div>

            <div class="memory-column heap-column">
                <div class="area-title">Heap Memory</div>
                <div class="young-gen">
                    <div class="memory-box" id="region-eden" data-label="Eden Space (Young)"></div>
                    <div class="survivor-spaces">
                        <div class="memory-box" id="region-s0" data-label="Survivor 0"></div>
                        <div class="memory-box" id="region-s1" data-label="Survivor 1"></div>
                    </div>
                </div>
                <div class="memory-box" id="region-old" data-label="Old Generation"></div>
            </div>
        </div>
    </div>

    <!-- 챗봇 토글 버튼 -->
    <button id="chatbot-toggle-btn" class="chatbot-toggle-btn">
        <span>모르는 용어나 개념이 있으신가요?</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
    </button>

    <!-- 챗봇 창 -->
    <div id="chatbot-window" class="chatbot-window hidden">
        <div class="chat-header">
            <div class="chat-header-title">GC-Inside AI 도우미</div>
            <button id="chat-close-btn" class="chat-close-btn">&times;</button>
        </div>
        <div class="chat-body" id="chat-body">
            <div class="chat-message bot">안녕하세요! JVM Garbage Collection이나 자바 메모리 관리에 대해 궁금한 점이 있으신가요? 편하게 물어보세요!</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="메시지를 입력하세요..." autocomplete="off">
            <button id="chat-send-btn" class="chat-send-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script>
        /**
         * 시나리오별 상태 (State Machine)
         * 인포그래픽 전달을 위해 GC의 단계를 명시적 스텝으로 구성
         */
        const SCENARIOS = [
            // ==========================================
            // [Part 1] GC 상세 기초 완벽 마스터 (1 ~ 9)
            // ==========================================
            {
                id: 'concept-garbage',
                title: '1. 📖 [개념] 가비지(Garbage)란?',
                code: [
                    "Object cat = new Animal(\"Cat\"); // 1. 객체 생성",
                    "",
                    "cat = null; // 2. 연결 해제",
                    "",
                    "System.gc(); // 3. 가비지 컬렉터 실행"
                ],
                steps: [
                    { stack: [], heap: [], codeIdx: -1, msg: "<b>[1단계: 메모리 공간]</b><br>자바 메모리는 힙(Heap)과 스택(Stack)으로 나뉩니다. 객체의 실제 데이터는 거대한 힙 공간에 저장됩니다." },
                    { stack: ['cat'], heap: [{ id: 'o1', region: 'eden', age: 0, refBy: ['cat'] }], codeIdx: 0, msg: "<b>[2단계: 참조 생성]</b><br><code>new Animal(\"Cat\")</code> 코드가 실행되면 힙에 데이터(객체)가 만들어집니다. 스택의 <code>cat</code> 변수는 이 데이터를 찾아갈 수 있는 주소(화살표)를 가집니다." },
                    { stack: ['cat'], heap: [{ id: 'o1', region: 'eden', age: 0, refBy: ['cat'] }], codeIdx: 0, msg: "<b>[3단계: Reachable 상태]</b><br>초록색 화살표(참조)가 연결되어 있으면 이 객체는 현재 유효하며 사용 중인 상태, 즉 <b>Reachable</b>함을 의미합니다." },
                    { stack: ['cat'], heap: [{ id: 'o1', region: 'eden', age: 0, refBy: [] }], codeIdx: 2, msg: "<b>[4단계: 참조 해제]</b><br><code>cat = null;</code>이 실행되면 주소 연결이 끊어집니다. 힙에는 데이터가 남아있지만 누구도 이 데이터를 찾아갈 수 없게 됩니다. 이를 <b>'가비지(Garbage)'</b>라고 부릅니다." },
                    { stack: ['cat'], heap: [], codeIdx: 4, msg: "<b>[5단계: GC 작동]</b><br>가비지 컬렉터(GC)는 주기적으로 힙을 순찰하며 화살표가 없는 회색 객체들을 찾아내어, 영구적으로 메모리에서 삭제(Sweep)합니다." }
                ]
            },
            {
                id: 'concept-reachability',

        function renderStep() {

        function renderHeapObjects(heapData) {
            const existingIds = Array.from(objectsLayer.children).map(el => el.id.replace('obj-', ''));

            existingIds.forEach(id => {
                if (!newIds.includes(id)) {
                    const el = document.getElementById('obj-' + id);
                    if (el) el.remove();
                }
            });

            heapData.forEach(data => {
                let el = document.getElementById('obj-' + data.id);
                if (!el) {
                    el = document.createElement('div');
                    el.id = 'obj-' + data.id;
                    el.className = 'heap-obj';
                    el.style.transform = `translate(200px, 300px)`;
                    objectsLayer.appendChild(el);

                // isDead 속성을 우선 평가하여, 참조가 있어도 죽은 객체로 렌더링 가능
                const isAlive = data.isDead ? false : data.refBy.length > 0;

                if (isAlive) {
                    el.classList.add('live');
                    el.classList.remove('dead');
                } else {
                    el.classList.add('dead');
                    el.classList.remove('live');

        function updateObjectPositions(state) {
            if (!state) return;

            const regions = {
                eden: document.getElementById('region-eden').getBoundingClientRect(),
                s0: document.getElementById('region-s0').getBoundingClientRect(),
                s1: document.getElementById('region-s1').getBoundingClientRect(),
                old: document.getElementById('region-old').getBoundingClientRect()
            };

            const slots = { eden: 0, s0: 0, s1: 0, old: 0 };
            const sortedHeap = [...state.heap].sort((a, b) => a.id.localeCompare(b.id));

            sortedHeap.forEach(data => {
                const el = document.getElementById('obj-' + data.id);
                if (!el) return;

                const rect = regions[data.region];
                const slotIdx = slots[data.region]++;

                const relativeX = rect.left - boardRect.left;
                const relativeY = rect.top - boardRect.top;

                const padding = 20;
                const objSize = 44;
                const gap = 15;

                const cols = Math.max(1, Math.floor((rect.width - padding * 2) / (objSize + gap)));
                const row = Math.floor(slotIdx / cols);
                const col = slotIdx % cols;

                const targetX = relativeX + padding + col * (objSize + gap);
                const targetY = relativeY + 30 + row * (objSize + gap);

                el.style.transform = `translate(${targetX}px, ${targetY}px)`;
            });
        }

        function drawArrows() {

                    if (isHeapRef) {
                        // 힙 -> 힙 객체 간의 참조 (곡선 형태 지원)
                        const fromX = fromRect.left - boardRect.left + 22; // 중심점 X
                        const fromY = fromRect.top - boardRect.top + 22;   // 중심점 Y
                        const toX = objRect.left - boardRect.left + 22;
                        const toY = objRect.top - boardRect.top + 22;

                        // 방향에 따라 위아래로 곡선을 그려 겹침 방지
                        const curveY = Math.min(fromY, toY) - 50;

                        const dx = toX - fromX;
                        const dy = toY - fromY;
                        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                        const endX = toX - (dx / dist) * 24;
                        const endY = toY - (dy / dist) * 24;

                        svgContent += `

                        const fromY = fromRect.top - boardRect.top + (fromRect.height / 2);
                        const toX = objRect.left - boardRect.left;

        let conversationHistory = [];

        // 챗봇의 성격과 답변 규칙을 정의하는 프롬프트 (1문단 요약 규칙 추가)
        const systemInstruction = "너는 JVM Garbage Collection과 자바 메모리 관리에 대해 친절하게 알려주는 일타강사 AI 챗봇 전문가야. 우아한테크코스 크루나 신입 자바 개발자들이 타겟이므로, 어려운 용어도 쉽게 비유를 들어 설명해줘. [가장 중요한 규칙]: 사용자의 질문에 대한 답변은 반드시 1문단 이내로, 핵심만 아주 짧고 명확하게 요약해서 작성해. 길고 장황한 설명이나 여러 문단으로 나누는 것은 절대 금지야. 현재 화면의 테마에 맞게 전문적이면서도 친근한 톤앤매너를 유지해.";

        // 챗봇 창 열기/닫기
        chatbotToggleBtn.addEventListener('click', () => {
            chatbotWindow.classList.remove('hidden');
            chatbotToggleBtn.style.display = 'none';
            chatInput.focus();
            scrollToBottom();
        });

        chatCloseBtn.addEventListener('click', () => {
            chatbotWindow.classList.add('hidden');
            setTimeout(() => { chatbotToggleBtn.style.display = 'flex'; }, 300);
        });

        // 메시지 전송 이벤트
        chatSendBtn.addEventListener('click', handleSendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSendMessage();
        });

        async function handleSendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            // 1. 사용자 메시지 UI에 추가
            appendMessage('user', text);
            chatInput.value = '';
            chatInput.disabled = true;
            chatSendBtn.disabled = true;

            // 2. 히스토리에 추가
            conversationHistory.push({ role: "user", parts: [{ text: text }] });

            // 3. 로딩 인디케이터 표시
            const loadingId = appendMessage('bot', '<span class="typing-indicator">답변을 생각하는 중입니다</span>');

            try {
                // 4. API 호출 (지수 백오프 적용)
                const responseText = await callGeminiWithRetry(text);

                // 5. 로딩 메시지 교체 및 히스토리 저장
                updateMessage(loadingId, formatTextToHTML(responseText));
                conversationHistory.push({ role: "model", parts: [{ text: responseText }] });

            } catch (error) {
                console.error("Gemini API Error:", error);
                updateMessage(loadingId, "죄송합니다. 네트워크 문제로 응답을 가져오지 못했습니다. 잠시 후 다시 시도해주세요.");
                conversationHistory.pop(); // 실패한 내역 롤백
            } finally {
                chatInput.disabled = false;
                chatSendBtn.disabled = false;
                chatInput.focus();
                scrollToBottom();
            }
        }

        // 지수 백오프(Exponential Backoff)를 적용한 API 호출 함수
        async function callGeminiWithRetry(userText, maxRetries = 5) {
            const payload = {
                contents: conversationHistory,
                systemInstruction: { parts: [{ text: systemInstruction }] }
            };

            let retries = 0;
            const delays = [1000, 2000, 4000, 8000, 16000];

            while (retries <= maxRetries) {
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP Error: ${response.status}`);
                    }

                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || "응답을 생성할 수 없습니다.";

                } catch (error) {
                    if (retries === maxRetries) throw error;
                    await new Promise(res => setTimeout(res, delays[retries]));
                    retries++;
                }
            }
        }

        // UI 헬퍼 함수들
        function appendMessage(sender, htmlContent) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-message ${sender}`;
            const id = 'msg-' + Date.now();
            msgDiv.id = id;
            msgDiv.innerHTML = htmlContent;
            chatBody.appendChild(msgDiv);
            scrollToBottom();
            return id;
        }

        function updateMessage(id, htmlContent) {
            const msgDiv = document.getElementById(id);
            if (msgDiv) {
                msgDiv.innerHTML = htmlContent;
            }
        }

        function scrollToBottom() {
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        // 마크다운 형태의 응답을 간단한 HTML(Bold, 줄바꿈)로 변환
        function formatTextToHTML(text) {
            return text
                .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
                .replace(/\*(.*?)\*/g, '<i>$1</i>')
                .replace(/`(.*?)`/g, '<code style="background:var(--bg-color); color:var(--accent); padding:2px 4px; border-radius:4px;">$1</code>')
                .replace(/\n/g, '<br>');
        }

        // 앱 실행
        init();
    </script>
</body>

</html>
