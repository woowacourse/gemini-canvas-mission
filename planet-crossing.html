<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>행성이의 은하계 건너기</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Pretendard', sans-serif; background-color: #000000; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .interactive { pointer-events: auto; }
        canvas { display: block; }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-areas:
                ". up ."
                "left down right";
            gap: 10px;
            z-index: 20;
        }
        .btn-ctrl {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            cursor: pointer;
            user-select: none;
            backdrop-filter: blur(8px);
            transition: transform 0.1s, background 0.1s;
        }
        .btn-ctrl:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.3); }
        .up { grid-area: up; }
        .down { grid-area: down; }
        .left { grid-area: left; }
        .right { grid-area: right; }

        #invincible-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 50;
        }
        #invincible-ui {
            font-size: 3rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px #ff00ff, 0 0 40px #00ffff;
        }
        #invincible-timer {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            margin-top: -10px;
        }
        .rainbow-text {
            background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow 1s infinite linear;
        }
        @keyframes rainbow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }
    </style>
</head>
<body>

<div id="ui-layer">
    <!-- 무적 알림 -->
    <div id="invincible-container">
        <div id="invincible-ui" class="rainbow-text">RAINBOW POWER!</div>
        <div id="invincible-timer">3.0s</div>
    </div>

    <!-- 상단 점수판 -->
    <div class="p-4 flex justify-between items-start text-white">
        <div class="bg-black/50 backdrop-blur p-3 rounded-xl shadow-lg border-2 border-indigo-500">
            <div class="text-xs text-indigo-300 font-bold uppercase tracking-wider">High Score</div>
            <div id="high-score" class="text-2xl font-black text-indigo-400">0</div>
        </div>
        <div class="bg-black/50 backdrop-blur p-3 rounded-xl shadow-lg border-2 border-indigo-500 text-right">
            <div class="text-xs text-indigo-300 font-bold uppercase tracking-wider">Score</div>
            <div id="current-score" class="text-2xl font-black text-white">0</div>
        </div>
    </div>

    <!-- 시작/종료 오버레이 -->
    <div id="overlay" class="absolute inset-0 flex items-center justify-center bg-black/70 backdrop-blur-sm hidden interactive">

        <!-- 왼쪽 상단 가이드 -->
        <div id="game-guide" class="absolute top-4 left-4 bg-black/40 border border-white/20 p-4 rounded-2xl text-white text-sm max-w-[220px] backdrop-blur-md">
            <div class="font-bold text-indigo-300 mb-2 flex items-center">
                <span class="mr-2">🚀</span> 게임 가이드
            </div>
            <ul class="space-y-2 text-xs leading-relaxed opacity-90">
                <li>• <span class="text-yellow-400 font-bold">방향키</span> 또는 하단 <span class="text-yellow-400 font-bold">버튼</span>으로 이동</li>
                <li>• 앞으로 전진할 때마다 <span class="text-green-400 font-bold">1점</span> 획득</li>
                <li>• 소행성과 충돌하면 게임이 종료됩니다.</li>
                <li>• <span class="text-sky-400 font-bold">Rainbow Power</span>: 무지개 소행성 충돌 시 <span class="text-cyan-400 font-bold">3초간</span> 지속되며 소행성과 충돌하지 않습니다.</li>
            </ul>
        </div>

        <!-- 메인 카드 -->
        <div class="bg-gray-900 p-8 rounded-3xl shadow-2xl text-center max-w-xs w-full border-4 border-indigo-500 relative">
            <h1 id="status-title" class="text-3xl font-black text-indigo-400 mb-2">은하계 건너기</h1>
            <p id="status-desc" class="text-indigo-200 mb-6 text-sm">행성이가 소행성을 피해 안전하게 건너도록 도와주세요!</p>

            <div id="final-score-container" class="mb-6 hidden">
                <div class="text-sm text-indigo-300">최종 점수</div>
                <div id="final-score" class="text-5xl font-black text-white">0</div>
            </div>

            <button id="start-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all transform hover:scale-105 active:scale-95">
                시작하기
            </button>
        </div>
    </div>
</div>

<div id="controls" class="interactive">
    <div class="btn-ctrl up" onclick="handleMove('up')">▲</div>
    <div class="btn-ctrl left" onclick="handleMove('left')">◀</div>
    <div class="btn-ctrl down" onclick="handleMove('down')">▼</div>
    <div class="btn-ctrl right" onclick="handleMove('right')">▶</div>
</div>

<script>
    /**
     * 효과음 매니저 (Web Audio API)
     */
    const AudioEngine = (() => {
        let audioCtx = null;

        const init = () => {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        };

        const playJump = () => {
            init();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        };

        const playCrash = () => {
            init();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(10, audioCtx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        };

        const playPowerup = () => {
            init();
            const now = audioCtx.currentTime;
            [440, 554.37, 659.25, 880].forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + i * 0.1);
                gain.gain.setValueAtTime(0.1, now + i * 0.1);
                gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + i * 0.1);
                osc.stop(now + i * 0.1 + 0.2);
            });
        };

        return { playJump, playCrash, playPowerup };
    })();

    const GRID_SIZE = 1;
    const LANE_WIDTH = 20;
    const MIN_ASTEROID_SPACING = 5;

    let score = 0;
    let highScore = localStorage.getItem('haengseongi-highscore') || 0;
    let isGameOver = false;
    let isMoving = false;
    let gameActive = false;
    let currentLane = 0;
    let furthestLane = 0;

    let isInvincible = false;
    let invincibilityTimeLeft = 0;
    let lastTime = 0;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0x606060, 1.5);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 10);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const starsGeo = new THREE.BufferGeometry();
    const starsVertices = [];
    for (let i = 0; i < 5000; i++) {
        starsVertices.push((Math.random() - 0.5) * 1500, (Math.random() - 0.5) * 1500, (Math.random() - 0.5) * 1500);
    }
    starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(starsVertices, 3));
    const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.8, sizeAttenuation: true });
    const starField = new THREE.Points(starsGeo, starsMat);
    scene.add(starField);

    function createLaneMilkyWay(laneGroup) {
        const geo = new THREE.BufferGeometry();
        const vertices = [];
        const colors = [];
        for (let i = 0; i < 50; i++) {
            vertices.push((Math.random() - 0.5) * LANE_WIDTH * 2, -0.1, (Math.random() - 0.5));
            const color = new THREE.Color();
            color.setHSL(0.6 + Math.random() * 0.1, 0.8, 0.5 + Math.random() * 0.4);
            colors.push(color.r, color.g, color.b);
        }
        geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        const mat = new THREE.PointsMaterial({ size: 0.12, vertexColors: true, transparent: true, opacity: 0.7 });
        const points = new THREE.Points(geo, mat);
        laneGroup.add(points);
    }

    let playerBodyMat, playerRingMat, playerLegMat, starAccessoryMat;

    function createHaengseongi() {
        const group = new THREE.Group();
        const bodyGeo = new THREE.SphereGeometry(0.4, 32, 32);
        playerBodyMat = new THREE.MeshPhongMaterial({ color: 0xffffff });
        const body = new THREE.Mesh(bodyGeo, playerBodyMat);
        body.castShadow = true;
        group.add(body);

        const ringGeo = new THREE.TorusGeometry(0.55, 0.04, 16, 100);
        playerRingMat = new THREE.MeshPhongMaterial({ color: 0xffffff });
        const ring = new THREE.Mesh(ringGeo, playerRingMat);
        ring.rotation.x = Math.PI / 2.5;
        group.add(ring);

        const eyeGeo = new THREE.SphereGeometry(0.04, 8, 8);
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

        const eyeTopL = new THREE.Mesh(eyeGeo, eyeMat);
        eyeTopL.position.set(0.12, 0.25, 0.35);
        group.add(eyeTopL);
        const eyeTopR = new THREE.Mesh(eyeGeo, eyeMat);
        eyeTopR.position.set(-0.12, 0.25, 0.35);
        group.add(eyeTopR);
        const eyeBottom = new THREE.Mesh(eyeGeo, eyeMat);
        eyeBottom.position.set(0, 0.1, 0.38);
        group.add(eyeBottom);

        const starGroup = new THREE.Group();
        const starPartGeo = new THREE.OctahedronGeometry(0.08, 0);
        starAccessoryMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
        for(let i=0; i<3; i++) {
            const p = new THREE.Mesh(starPartGeo, starAccessoryMat);
            p.scale.set(1.5, 0.3, 0.3);
            p.rotation.z = (Math.PI / 3) * i;
            starGroup.add(p);
        }
        starGroup.position.set(0.4, 0.45, 0);
        group.add(starGroup);
        group.starNode = starGroup;

        const legRadius = 0.08, legHeight = 0.2;
        const legGeo = new THREE.CylinderGeometry(legRadius, legRadius, legHeight, 12);
        playerLegMat = new THREE.MeshPhongMaterial({ color: 0xffffff });
        const footGeo = new THREE.SphereGeometry(legRadius, 12, 12);
        const createLeg = (x) => {
            const lg = new THREE.Group();
            const l = new THREE.Mesh(legGeo, playerLegMat);
            const f = new THREE.Mesh(footGeo, playerLegMat);
            f.position.y = -legHeight/2;
            lg.add(l); lg.add(f);
            lg.position.set(x, -0.35, 0);
            lg.rotation.z = x > 0 ? -Math.PI / 8 : Math.PI / 8;
            return lg;
        };
        group.add(createLeg(0.2));
        group.add(createLeg(-0.2));
        group.position.y = 0.6;
        return group;
    }

    const player = createHaengseongi();
    scene.add(player);

    const lanes = [];
    const asteroids = [];
    const laneTypes = ['safe', 'danger', 'danger', 'safe', 'danger', 'danger', 'danger'];

    function createLane(index) {
        const type = index <= 0 ? 'safe' : laneTypes[Math.abs(index) % laneTypes.length];
        const laneGroup = new THREE.Group();
        laneGroup.position.z = -index;
        const geo = new THREE.PlaneGeometry(LANE_WIDTH, 1);
        const mat = new THREE.MeshPhongMaterial({ color: 0x050010, transparent: true, opacity: 0.3, side: THREE.DoubleSide });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.rotation.x = -Math.PI / 2;
        mesh.receiveShadow = true;
        laneGroup.add(mesh);
        createLaneMilkyWay(laneGroup);
        if (type === 'danger' && index !== 0) {
            const speed = (Math.random() * 0.05 + 0.04) * (Math.random() > 0.5 ? 1 : -1);
            lanes.push({ index, type, speed });
        } else { lanes.push({ index, type }); }
        scene.add(laneGroup);
    }

    for (let i = -5; i < 20; i++) createLane(i);

    function spawnAsteroid(laneInfo) {
        const isRainbow = Math.random() < 0.1;
        const spawnX = laneInfo.speed > 0 ? -LANE_WIDTH/2 : LANE_WIDTH/2;

        const othersInLane = asteroids.filter(a => a.laneIndex === laneInfo.index);
        const tooClose = othersInLane.some(a => Math.abs(a.mesh.position.x - spawnX) < MIN_ASTEROID_SPACING);
        if (tooClose) return;

        const group = new THREE.Group();
        const geo = new THREE.IcosahedronGeometry(0.4 + Math.random() * 0.2, 0);
        let mat = isRainbow ? new THREE.MeshPhongMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.5 })
            : new THREE.MeshPhongMaterial({ color: 0x777777, flatShading: true });
        const body = new THREE.Mesh(geo, mat);
        body.castShadow = true;
        body.rotation.set(Math.random(), Math.random(), Math.random());
        group.add(body);
        const asteroidObj = {
            mesh: group, speed: laneInfo.speed, laneIndex: laneInfo.index,
            isRainbow: isRainbow, mat: mat,
            rotSpeed: { x: Math.random()*0.05, y: Math.random()*0.05, z: Math.random()*0.05 }
        };
        asteroidObj.mesh.position.z = -laneInfo.index;
        asteroidObj.mesh.position.y = 0.5;
        asteroidObj.mesh.position.x = spawnX;
        asteroids.push(asteroidObj);
        scene.add(group);
    }

    function activateInvincibility() {
        isInvincible = true;
        invincibilityTimeLeft = 3.0;
        document.getElementById('invincible-container').style.opacity = '1';
        AudioEngine.playPowerup();
    }

    const explosionParticles = [];
    function createCollisionEffect(position, color = 0xffcc00) {
        const particleCount = 40;
        const geo = new THREE.BufferGeometry();
        const vertices = [], velocities = [];
        for (let i = 0; i < particleCount; i++) {
            vertices.push(position.x, position.y, position.z);
            velocities.push((Math.random()-0.5)*0.3, (Math.random()-0.5)*0.3+0.2, (Math.random()-0.5)*0.3);
        }
        geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        const mat = new THREE.PointsMaterial({ color: color, size: 0.15, transparent: true });
        const points = new THREE.Points(geo, mat);
        scene.add(points);
        explosionParticles.push({ mesh: points, velocities, createdAt: Date.now() });
    }

    function handleMove(dir) {
        if (!gameActive || isGameOver || isMoving) return;
        isMoving = true;
        AudioEngine.playJump();
        const targetPos = { x: player.position.x, z: player.position.z };
        if (dir === 'up') {
            targetPos.z -= GRID_SIZE;
            currentLane++;
            if (currentLane > furthestLane) {
                furthestLane = currentLane;
                score++; updateScoreUI();
                createLane(furthestLane + 15);
            }
        } else if (dir === 'down') {
            if (currentLane > -4) { targetPos.z += GRID_SIZE; currentLane--; }
        } else if (dir === 'left') {
            if (player.position.x > -LANE_WIDTH/2 + 1) targetPos.x -= GRID_SIZE;
        } else if (dir === 'right') {
            if (player.position.x < LANE_WIDTH/2 - 1) targetPos.x += GRID_SIZE;
        }

        const startY = player.position.y;
        const jumpHeight = 0.6, duration = 200, startTime = Date.now();
        function animateJump() {
            const elapsed = Date.now() - startTime;
            const progress = Math.min(elapsed / duration, 1);
            player.position.x = THREE.MathUtils.lerp(player.position.x, targetPos.x, progress);
            player.position.z = THREE.MathUtils.lerp(player.position.z, targetPos.z, progress);
            player.position.y = startY + Math.sin(progress * Math.PI) * jumpHeight;
            if (progress < 1) requestAnimationFrame(animateJump);
            else isMoving = false;
        }
        animateJump();
    }

    window.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (key === 'arrowup' || key === 'w') handleMove('up');
        if (key === 'arrowdown' || key === 's') handleMove('down');
        if (key === 'arrowleft' || key === 'a') handleMove('left');
        if (key === 'arrowright' || key === 'd') handleMove('right');
    });

    function updateScoreUI() {
        document.getElementById('current-score').innerText = score;
        document.getElementById('high-score').innerText = highScore;
    }

    function gameOver() {
        gameActive = false;
        isGameOver = true;
        AudioEngine.playCrash();
        createCollisionEffect(player.position, 0xff0000);
        player.visible = false;
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('haengseongi-highscore', highScore);
        }
        document.getElementById('status-title').innerText = "게임 종료!";
        document.getElementById('status-desc').innerText = "행성이가 소행성과 충돌했어요 ㅠㅠ";
        document.getElementById('final-score').innerText = score;
        document.getElementById('final-score-container').classList.remove('hidden');
        document.getElementById('start-btn').innerText = "다시 도전하기";

        document.getElementById('game-guide').style.display = 'block';
        setTimeout(() => document.getElementById('overlay').classList.remove('hidden'), 800);
    }

    function resetGame() {
        score = 0; currentLane = 0; furthestLane = 0;
        isGameOver = false; gameActive = true; isInvincible = false;
        invincibilityTimeLeft = 0;
        document.getElementById('invincible-container').style.opacity = '0';
        player.position.set(0, 0.6, 0);
        player.visible = true;
        playerBodyMat.color.set(0xffffff);
        playerRingMat.color.set(0xffffff);
        playerLegMat.color.set(0xffffff);
        starAccessoryMat.color.set(0xffff00);
        updateScoreUI();
        asteroids.forEach(a => scene.remove(a.mesh)); asteroids.length = 0;
        explosionParticles.forEach(p => scene.remove(p.mesh)); explosionParticles.length = 0;

        document.getElementById('game-guide').style.display = 'none';
        document.getElementById('overlay').classList.add('hidden');
        document.getElementById('final-score-container').classList.add('hidden');
    }

    document.getElementById('start-btn').onclick = resetGame;
    updateScoreUI();
    document.getElementById('overlay').classList.remove('hidden');

    function animate(timestamp) {
        requestAnimationFrame(animate);
        const dt = (timestamp - lastTime) / 1000;
        lastTime = timestamp;
        starField.rotation.y += 0.0002;
        if (gameActive) {
            if (isInvincible) {
                invincibilityTimeLeft -= dt;
                if (invincibilityTimeLeft <= 0) {
                    isInvincible = false;
                    document.getElementById('invincible-container').style.opacity = '0';
                    playerBodyMat.color.set(0xffffff);
                    playerRingMat.color.set(0xffffff);
                    playerLegMat.color.set(0xffffff);
                    starAccessoryMat.color.set(0xffff00);
                } else {
                    document.getElementById('invincible-timer').innerText = invincibilityTimeLeft.toFixed(1) + "s";
                    playerBodyMat.color.setHSL((timestamp * 0.001) % 1, 0.8, 0.5);
                    playerRingMat.color.copy(playerBodyMat.color);
                    playerLegMat.color.copy(playerBodyMat.color);
                    starAccessoryMat.color.copy(playerBodyMat.color);
                }
            }
            if(player.starNode) player.starNode.rotation.y += 0.05;
            lanes.forEach(lane => {
                if (lane.type === 'danger' && Math.random() < 0.018) {
                    spawnAsteroid(lane);
                }
            });
            for (let i = asteroids.length - 1; i >= 0; i--) {
                const a = asteroids[i];
                a.mesh.position.x += a.speed;
                a.mesh.rotation.x += a.rotSpeed.x; a.mesh.rotation.y += a.rotSpeed.y;
                if (a.isRainbow) a.mat.color.setHSL((timestamp * 0.002) % 1, 0.8, 0.6);
                if (Math.abs(a.mesh.position.x) > LANE_WIDTH / 2 + 2) {
                    scene.remove(a.mesh); asteroids.splice(i, 1); continue;
                }
                const dx = Math.abs(player.position.x - a.mesh.position.x), dz = Math.abs(player.position.z - a.mesh.position.z);
                if (dx < 0.7 && dz < 0.6) {
                    if (a.isRainbow) {
                        activateInvincibility(); createCollisionEffect(a.mesh.position, 0x00ffff);
                        scene.remove(a.mesh); asteroids.splice(i, 1);
                    } else if (!isInvincible) gameOver();
                }
            }
            camera.position.z = THREE.MathUtils.lerp(camera.position.z, player.position.z + 6, 0.1);
            camera.position.x = THREE.MathUtils.lerp(camera.position.x, player.position.x, 0.1);
            camera.position.y = 8;
            camera.lookAt(player.position.x, 0, player.position.z - 2);
        }
        for (let i = explosionParticles.length - 1; i >= 0; i--) {
            const exp = explosionParticles[i];
            const pos = exp.mesh.geometry.attributes.position.array;
            for (let j = 0; j < pos.length; j += 3) {
                pos[j] += exp.velocities[j]; pos[j+1] += exp.velocities[j+1]; pos[j+2] += exp.velocities[j+2];
                exp.velocities[j+1] -= 0.008;
            }
            exp.mesh.geometry.attributes.position.needsUpdate = true;
            exp.mesh.material.opacity -= 0.015;
            if (exp.mesh.material.opacity <= 0) { scene.remove(exp.mesh); explosionParticles.splice(i, 1); }
        }
        renderer.render(scene, camera);
    }

    window.onload = () => { camera.position.set(0, 8, 6); animate(0); };
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
