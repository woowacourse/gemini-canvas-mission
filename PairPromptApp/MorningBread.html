<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모닝빵 - 아침 루틴 메이커</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* 커스텀 스크롤바 등 필요시 추가 가능 */
        body {
            -webkit-tap-highlight-color: transparent; /* 모바일 터치 하이라이트 제거 */
        }
    </style>
</head>
<body class="bg-amber-50 font-sans text-amber-950 flex justify-center pb-10 sm:pb-20 min-h-screen">

<div class="w-full max-w-md bg-white shadow-xl min-h-screen relative flex flex-col overflow-x-hidden">

    <!-- Header -->
    <header class="bg-orange-400 text-white px-5 py-6 rounded-b-3xl shadow-md z-10 relative">
        <div class="flex items-center justify-between">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <i data-lucide="croissant" class="text-orange-100 animate-[bounce_3s_infinite]" style="width:32px; height:32px;"></i>
                모닝빵
            </h1>
            <span class="text-orange-100 text-xs font-medium bg-orange-500/50 px-2 py-1 rounded-full">
          오늘의 아침 루틴
        </span>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 space-y-6">

        <!-- Weather Widget -->
        <section class="relative" id="weather-section">
            <!-- 스크립트에서 렌더링됨 -->
        </section>

        <!-- Progress Section -->
        <section class="bg-orange-50/50 p-5 rounded-3xl border border-orange-100">
            <div class="flex justify-between items-end mb-3">
                <span class="text-sm font-semibold text-orange-900">오늘의 준비 진행률</span>
                <span id="progress-text" class="text-2xl font-black text-orange-500">0%</span>
            </div>
            <div class="w-full bg-orange-100 rounded-full h-4 overflow-hidden shadow-inner">
                <div id="progress-bar" class="bg-gradient-to-r from-orange-400 to-orange-500 h-full rounded-full transition-all duration-700 ease-out relative" style="width: 0%;">
                    <!-- 애니메이션 오버레이는 JS에서 주입 -->
                </div>
            </div>
        </section>

        <!-- Location & AI Recommendation Section -->
        <section class="bg-white p-5 rounded-3xl border border-gray-100 shadow-sm">
            <div class="flex items-center gap-2 mb-4 text-amber-950 font-semibold">
                <i data-lucide="map-pin" class="text-orange-500 w-4 h-4" style="width:18px; height:18px;"></i>
                <h2>위치 기반 외출 필수품 추천</h2>
            </div>

            <div id="locations-container" class="flex flex-wrap gap-2 mb-4">
                <!-- 로케이션 태그들 렌더링 -->
            </div>

            <form id="add-location-form" class="flex gap-2 mb-5">
                <input
                        type="text"
                        id="new-location-input"
                        placeholder="다른 지역 추가 (예: 서울 강남구)"
                        class="flex-1 bg-gray-50/50 border border-gray-200 rounded-2xl px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-orange-200 focus:border-orange-300 transition-all"
                />
                <button
                        type="submit"
                        class="bg-orange-100 text-orange-600 px-4 rounded-2xl hover:bg-orange-200 transition-colors flex items-center justify-center"
                >
                    <i data-lucide="plus" style="width:20px; height:20px;"></i>
                </button>
            </form>

            <button
                    id="ai-recommend-btn"
                    class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-orange-400 to-amber-500 text-white py-3.5 rounded-2xl font-bold shadow-md shadow-orange-200 hover:shadow-lg hover:-translate-y-0.5 transition-all disabled:opacity-50 disabled:hover:translate-y-0"
            >
                <i data-lucide="wand-2" id="ai-btn-icon" style="width:18px; height:18px;"></i>
                <span id="ai-btn-text">오늘 외출 필수품 추천받기</span>
            </button>
            <p id="ai-error-msg" class="hidden text-orange-600 text-[11px] sm:text-xs mt-3 text-center bg-orange-50 py-2.5 px-2 rounded-xl flex items-center justify-center gap-1.5 font-medium">
                <i data-lucide="info" style="width:14px; height:14px;"></i> <span id="ai-error-text"></span>
            </p>
        </section>

        <!-- Routines Section -->
        <section class="space-y-4">
            <h2 class="font-semibold text-amber-950 flex items-center gap-2 px-1">
                <i data-lucide="check-circle-2" class="text-orange-400" style="width:18px; height:18px;"></i>
                나의 모닝 루틴
            </h2>

            <div id="routines-container" class="space-y-3">
                <!-- 루틴 리스트 렌더링 -->
            </div>

            <!-- Add Routine Form -->
            <form id="add-routine-form" class="mt-6 flex gap-2">
                <input
                        type="text"
                        id="new-routine-input"
                        placeholder="새로운 루틴 추가 (예: 물 한잔 마시기)"
                        class="flex-1 bg-white border border-amber-200 rounded-2xl px-4 py-3.5 text-base focus:outline-none focus:ring-2 focus:ring-orange-300 shadow-sm transition-all"
                />
                <button
                        type="submit"
                        class="bg-amber-800 text-white px-5 rounded-2xl hover:bg-amber-900 transition-colors shadow-sm flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-amber-500 focus:ring-offset-2"
                >
                    <i data-lucide="plus" style="width:22px; height:22px;"></i>
                </button>
            </form>
        </section>
    </main>

    <!-- Completion Modal -->
    <div id="completion-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm transition-opacity">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl transform scale-95 transition-transform duration-300" id="modal-content">
            <div class="text-center space-y-4">
                <div class="mx-auto w-20 h-20 bg-orange-100 rounded-full flex items-center justify-center mb-2">
                    <span class="text-4xl">🎉</span>
                </div>
                <h3 class="text-2xl font-bold text-amber-950">완벽해요!</h3>
                <p class="text-amber-700 font-medium">
                    오늘의 아침 루틴을 모두 마쳤습니다.<br/>이제 상쾌하게 외출하셔도 좋습니다! 🏃‍♂️
                </p>
                <button
                        id="close-modal-btn"
                        class="w-full mt-6 bg-amber-800 text-white py-3.5 rounded-2xl font-bold hover:bg-amber-900 transition-colors shadow-md"
                >
                    확인
                </button>
            </div>
        </div>
    </div>

</div>

<script>
    // --- State Management ---
    const apiKey = ""; // API key is provided by the execution environment

    const DEFAULT_ROUTINES = [
        { id: '1', text: '씻기', isCompleted: false, isGemini: false },
        { id: '2', text: '아침 먹기', isCompleted: false, isGemini: false },
        { id: '3', text: '스트레칭 하기', isCompleted: false, isGemini: false }
    ];
    const DEFAULT_LOCATION = '경기도 성남시';

    let state = {
        routines: JSON.parse(localStorage.getItem('morning_bread_routines')) || DEFAULT_ROUTINES,
        locations: JSON.parse(localStorage.getItem('morning_bread_locations')) || [DEFAULT_LOCATION],
        weather: null,
        isWeatherLoading: false,
        isWeatherFlipped: false,
        editingId: null,
        isLoadingAI: false,
        prevIsAllDone: false
    };

    // --- DOM Elements ---
    const weatherSection = document.getElementById('weather-section');
    const progressText = document.getElementById('progress-text');
    const progressBar = document.getElementById('progress-bar');
    const locationsContainer = document.getElementById('locations-container');
    const newLocationInput = document.getElementById('new-location-input');
    const routinesContainer = document.getElementById('routines-container');
    const newRoutineInput = document.getElementById('new-routine-input');

    const aiRecommendBtn = document.getElementById('ai-recommend-btn');
    const aiBtnIcon = document.getElementById('ai-btn-icon');
    const aiBtnText = document.getElementById('ai-btn-text');
    const aiErrorMsg = document.getElementById('ai-error-msg');
    const aiErrorText = document.getElementById('ai-error-text');

    const completionModal = document.getElementById('completion-modal');
    const modalContent = document.getElementById('modal-content');

    // --- Helper Fetch with Retry ---
    const fetchWithRetry = async (url, options, maxRetries = 3) => {
        let retries = 0;
        while (retries < maxRetries) {
            try {
                const response = await fetch(url, options);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return await response.json();
            } catch (error) {
                retries++;
                if (retries >= maxRetries) throw error;
                const delay = Math.pow(2, retries - 1) * 1000;
                await new Promise(resolve => setTimeout(resolve, delay));
            }
        }
    };

    // --- Storage & Timers ---
    function saveState() {
        localStorage.setItem('morning_bread_routines', JSON.stringify(state.routines));
        localStorage.setItem('morning_bread_locations', JSON.stringify(state.locations));
        updateProgress();
    }

    function check7AMReset() {
        const now = new Date();
        const lastResetStr = localStorage.getItem('morning_bread_last_reset');
        let lastReset = lastResetStr ? new Date(lastResetStr) : new Date(0);

        const today7AM = new Date();
        today7AM.setHours(7, 0, 0, 0);

        let shouldReset = false;
        if (now >= today7AM) {
            if (lastReset < today7AM) shouldReset = true;
        } else {
            const yesterday7AM = new Date(today7AM);
            yesterday7AM.setDate(yesterday7AM.getDate() - 1);
            if (lastReset < yesterday7AM) shouldReset = true;
        }

        if (shouldReset) {
            state.routines = state.routines.map(r => ({ ...r, isCompleted: false }));
            localStorage.setItem('morning_bread_last_reset', now.toISOString());
            saveState();
            renderRoutines();
        }
    }

    // --- Render Functions ---
    function updateProgress() {
        const total = state.routines.length;
        const completed = state.routines.filter(r => r.isCompleted).length;
        const progress = total === 0 ? 0 : Math.round((completed / total) * 100);
        const isAllDone = total > 0 && completed === total;

        progressText.textContent = `${progress}%`;
        progressBar.style.width = `${progress}%`;

        if (progress > 0) {
            progressBar.innerHTML = `<div class="absolute top-0 right-0 bottom-0 left-0 bg-white/20 w-full h-full animate-[pulse_2s_ease-in-out_infinite]"></div>`;
        } else {
            progressBar.innerHTML = '';
        }

        // Check Modal
        if (isAllDone && !state.prevIsAllDone) {
            showModal();
        }
        state.prevIsAllDone = isAllDone;
    }

    function renderLocations() {
        locationsContainer.innerHTML = state.locations.map(loc => `
        <span class="inline-flex items-center gap-1.5 bg-amber-50 border border-amber-100 text-amber-900 px-3 py-1.5 rounded-xl text-sm font-medium">
          ${loc}
          ${state.locations.length > 1 ? `
            <button onclick="removeLocation('${loc}')" class="text-amber-400 hover:text-amber-600 transition-colors p-0.5 focus:outline-none">
              <i data-lucide="x" style="width:14px; height:14px;"></i>
            </button>
          ` : ''}
        </span>
      `).join('');
        lucide.createIcons();
    }

    function renderRoutines() {
        if (state.routines.length === 0) {
            routinesContainer.innerHTML = `
          <p class="text-center text-gray-400 py-8 text-sm bg-gray-50 rounded-3xl border border-dashed border-gray-200">
            루틴이 없습니다.<br/>새로운 루틴을 추가해보세요!
          </p>`;
            return;
        }

        routinesContainer.innerHTML = state.routines.map(routine => {
            const isEditing = state.editingId === routine.id;

            let innerContent = '';
            if (isEditing) {
                innerContent = `
            <div class="flex items-center gap-2 flex-1">
              <input type="text" id="edit-input-${routine.id}" value="${routine.text}" class="flex-1 bg-white border border-orange-300 rounded-xl px-3 py-1.5 text-amber-900 text-base focus:outline-none focus:ring-2 focus:ring-orange-100" autofocus>
              <button onclick="saveEdit('${routine.id}')" class="bg-orange-100 text-orange-600 p-2 rounded-xl focus:outline-none">
                <i data-lucide="check" style="width:18px; height:18px;"></i>
              </button>
            </div>
          `;
            } else {
                innerContent = `
            <div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-2 flex-1">
              <span class="text-base font-medium truncate ${routine.isCompleted ? 'line-through opacity-60' : ''}">${routine.text}</span>
              ${routine.isGemini ? `
                <span class="inline-flex w-fit items-center text-[10px] bg-indigo-50 border border-indigo-100 text-indigo-600 px-1.5 py-0.5 rounded-md gap-0.5 font-bold">
                  <i data-lucide="wand-2" style="width:10px; height:10px;"></i> AI 추천
                </span>
              ` : ''}
            </div>
            ${!routine.isCompleted ? `
              <div class="flex items-center gap-1 opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity">
                <button onclick="startEditing('${routine.id}')" class="p-2 text-gray-400 hover:text-blue-500 rounded-xl hover:bg-blue-50 transition-colors focus:outline-none">
                  <i data-lucide="edit-2" style="width:16px; height:16px;"></i>
                </button>
                <button onclick="deleteRoutine('${routine.id}')" class="p-2 text-gray-400 hover:text-red-500 rounded-xl hover:bg-red-50 transition-colors focus:outline-none">
                  <i data-lucide="trash-2" style="width:16px; height:16px;"></i>
                </button>
              </div>
            ` : ''}
          `;
            }

            return `
          <div class="group flex items-center gap-3 p-3.5 sm:p-4 rounded-2xl border transition-all ${routine.isCompleted ? 'bg-gray-50 border-gray-100 text-gray-400 shadow-inner' : 'bg-white border-orange-100 shadow-sm hover:border-orange-300'}">
            <button onclick="toggleRoutine('${routine.id}')" class="flex-shrink-0 focus:outline-none p-1">
              ${routine.isCompleted
                ? '<i data-lucide="check-circle-2" class="text-orange-500" style="width:26px; height:26px;"></i>'
                : '<i data-lucide="circle" class="text-gray-200 hover:text-orange-300 transition-colors" style="width:26px; height:26px;"></i>'}
            </button>
            <div class="flex-1 overflow-hidden flex items-center">
              ${innerContent}
            </div>
          </div>
        `;
        }).join('');

        lucide.createIcons();

        // 포커스 이동 (Edit 모드일때)
        if (state.editingId) {
            const input = document.getElementById(`edit-input-${state.editingId}`);
            if(input) {
                input.focus();
                // Move cursor to end
                const val = input.value;
                input.value = '';
                input.value = val;
                input.addEventListener('keydown', (e) => {
                    if(e.key === 'Enter') saveEdit(state.editingId);
                });
            }
        }
    }

    function renderWeatherWidget() {
        if (state.isWeatherLoading) {
            weatherSection.innerHTML = `
          <div class="bg-blue-50/50 border border-blue-100 p-4 rounded-3xl flex justify-center items-center h-24 animate-pulse">
            <span class="text-blue-400 text-sm font-medium">실시간 날씨 정보를 불러오는 중...</span>
          </div>
        `;
            return;
        }

        if (!state.weather) {
            weatherSection.innerHTML = '';
            return;
        }

        const w = state.weather;

        // Icon string generation
        let iconHTML = `<i data-lucide="sun" class="text-yellow-500" style="width:42px; height:42px;"></i>`;
        if (w.condition === 'sunny') iconHTML = `<i data-lucide="sun" class="text-yellow-500 animate-[spin_10s_linear_infinite]" style="width:42px; height:42px;"></i>`;
        if (w.condition === 'cloudy') iconHTML = `<i data-lucide="cloud" class="text-gray-400 animate-[pulse_3s_ease-in-out_infinite]" style="width:42px; height:42px;"></i>`;
        if (w.condition === 'rain') iconHTML = `<i data-lucide="cloud-rain" class="text-blue-500 animate-bounce" style="width:42px; height:42px;"></i>`;
        if (w.condition === 'snow') iconHTML = `<i data-lucide="snowflake" class="text-cyan-400 animate-[spin_5s_linear_infinite]" style="width:42px; height:42px;"></i>`;

        // Warnings Array
        const warnings = [];
        if (w.fineDust && (w.fineDust.includes("나쁨") || w.fineDust.includes("매우나쁨"))) {
            warnings.push({ icon: 'wind', class: 'text-slate-300 animate-pulse', msg: '오늘 미세먼지 농도가 나쁠 예정입니다. 마스크를 꼭 챙기세요.' });
        }
        if (w.currentTemp >= 28 || (w.condition === 'sunny' && w.maxTemp >= 25)) {
            warnings.push({ icon: 'thermometer-sun', class: 'text-orange-400 animate-[bounce_2s_infinite]', msg: '오늘 자외선이 강하고 더울 예정입니다. 선크림, 모자, 양산 등을 챙기세요.' });
        }
        if (w.currentTemp <= 5) {
            warnings.push({ icon: 'thermometer-snowflake', class: 'text-cyan-300 animate-pulse', msg: '오늘 매우 춥습니다. 두꺼운 외투와 방한용품을 단단히 챙기세요.' });
        }
        if (w.precipitation >= 40 || w.condition === 'rain' || w.condition === 'snow') {
            warnings.push({ icon: 'umbrella', class: 'text-blue-300 animate-[bounce_2s_infinite]', msg: '비 또는 눈 예보가 있습니다. 외출 시 우산을 챙기세요.' });
        }

        let warningsHTML = '';
        if (warnings.length > 0) {
            warningsHTML = `
          <div class="flex gap-6 sm:gap-8 items-center justify-center w-full h-full">
            ${warnings.map(warn => `
              <div class="group relative flex flex-col items-center justify-center cursor-help" onclick="event.stopPropagation()">
                <i data-lucide="${warn.icon}" class="${warn.class}" style="width:36px; height:36px;"></i>
                <div class="absolute -bottom-16 sm:-bottom-14 left-1/2 transform -translate-x-1/2 w-max max-w-[180px] sm:max-w-[220px] px-3 py-2 bg-white text-slate-900 text-[11px] sm:text-xs font-bold rounded-xl opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none z-50 shadow-2xl text-center">
                  ${warn.msg}
                  <div class="absolute -top-1 left-1/2 transform -translate-x-1/2 w-2 h-2 bg-white rotate-45"></div>
                </div>
              </div>
            `).join('')}
          </div>
        `;
        } else {
            warningsHTML = `
          <div class="flex flex-col items-center text-slate-300">
            <i data-lucide="check-circle-2" class="mb-1 text-green-400 opacity-80" style="width:32px; height:32px;"></i>
            <p class="font-medium text-xs sm:text-sm">기상 특보가 없는 쾌적한 날입니다!</p>
          </div>
        `;
        }

        weatherSection.innerHTML = `
        <div id="flip-container" class="relative w-full cursor-pointer [perspective:1000px] group/card">
          <div class="relative w-full transition-transform duration-700 [transform-style:preserve-3d] ${state.isWeatherFlipped ? '[transform:rotateY(180deg)]' : ''}">

            <!-- Front Face -->
            <div class="bg-gradient-to-br from-blue-50 to-indigo-50 border border-blue-100 p-5 rounded-3xl shadow-sm flex items-center justify-between [backface-visibility:hidden]">
              <div class="flex items-center gap-4">
                <div class="group relative flex items-center justify-center cursor-help" onclick="event.stopPropagation()">
                  <div class="drop-shadow-sm">${iconHTML}</div>
                  <div class="absolute -bottom-14 left-1/2 transform -translate-x-1/2 w-max max-w-[200px] sm:max-w-xs px-3 py-2 bg-slate-800/95 text-white text-xs font-medium rounded-xl opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none z-50 shadow-lg backdrop-blur-sm text-center">
                    ${w.hoverText}
                    <div class="absolute -top-1 left-1/2 transform -translate-x-1/2 w-2 h-2 bg-slate-800/95 rotate-45"></div>
                  </div>
                </div>
                <div>
                  <p class="text-xs text-blue-800 font-semibold mb-0.5">${state.locations[0]}의 날씨</p>
                  <p class="text-3xl font-bold text-blue-950 tracking-tighter flex items-end gap-1">
                    ${w.currentTemp}°<span class="text-lg text-blue-700/60 font-medium mb-1">C</span>
                  </p>
                </div>
              </div>
              <div class="text-right text-[11px] sm:text-xs text-blue-800/90 space-y-1.5 font-medium bg-white/50 p-2.5 rounded-2xl backdrop-blur-sm shadow-inner">
                <p>최저/최고: <span class="text-blue-950">${w.minTemp}° / ${w.maxTemp}°</span></p>
                <p>미세먼지: <span class="text-blue-950">${w.fineDust}</span></p>
                <p>강수확률: <span class="text-blue-950">${w.precipitation}%</span></p>
              </div>
            </div>

            <!-- Back Face (Warnings) -->
            <div class="absolute inset-0 w-full h-full bg-gradient-to-br from-slate-800 to-slate-900 border border-slate-700 rounded-3xl shadow-lg [transform:rotateY(180deg)] [backface-visibility:hidden] p-4 flex flex-col justify-center items-center">
              ${warningsHTML}
              <div class="absolute top-3 right-4">
                <span class="text-[9px] font-bold text-slate-400 bg-slate-800 px-2 py-1 rounded-full opacity-80 border border-slate-600">오늘의 주의사항</span>
              </div>
              <p class="absolute bottom-2 text-[9px] text-slate-500 animate-pulse">카드를 다시 터치하여 앞면 보기</p>
            </div>

          </div>
        </div>
      `;

        lucide.createIcons();

        // Bind Click
        const flipContainer = document.getElementById('flip-container');
        if (flipContainer) {
            flipContainer.addEventListener('click', () => {
                state.isWeatherFlipped = !state.isWeatherFlipped;
                renderWeatherWidget();
            });
        }
    }

    // --- Actions ---
    window.toggleRoutine = (id) => {
        state.routines = state.routines.map(r => r.id === id ? { ...r, isCompleted: !r.isCompleted } : r);
        saveState();
        renderRoutines();
    };

    window.deleteRoutine = (id) => {
        state.routines = state.routines.filter(r => r.id !== id);
        saveState();
        renderRoutines();
    };

    window.startEditing = (id) => {
        state.editingId = id;
        renderRoutines();
    };

    window.saveEdit = (id) => {
        const input = document.getElementById(`edit-input-${id}`);
        if (input && input.value.trim()) {
            state.routines = state.routines.map(r => r.id === id ? { ...r, text: input.value.trim() } : r);
        }
        state.editingId = null;
        saveState();
        renderRoutines();
    };

    window.removeLocation = (loc) => {
        state.locations = state.locations.filter(l => l !== loc);
        saveState();
        renderLocations();
        fetchWeather(); // 1번째 로케이션이 지워졌을수 있으니 갱신
    };

    document.getElementById('add-routine-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const val = newRoutineInput.value.trim();
        if (!val) return;
        state.routines.push({ id: Date.now().toString(), text: val, isCompleted: false, isGemini: false });
        newRoutineInput.value = '';
        saveState();
        renderRoutines();
    });

    document.getElementById('add-location-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const val = newLocationInput.value.trim();
        if (!val || state.locations.includes(val)) return;
        state.locations.push(val);
        newLocationInput.value = '';
        saveState();
        renderLocations();
    });

    // --- Weather Fetch ---
    async function fetchWeather() {
        if (!state.locations[0]) return;
        state.isWeatherLoading = true;
        renderWeatherWidget();

        try {
            const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(state.locations[0])}&count=1&language=ko&format=json`;
            const geoRes = await fetch(geoUrl);
            const geoData = await geoRes.json();

            let lat = 37.5665;
            let lon = 126.9780;
            if (geoData.results && geoData.results.length > 0) {
                lat = geoData.results[0].latitude;
                lon = geoData.results[0].longitude;
            }

            const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto`;
            const weatherRes = await fetch(weatherUrl);
            const weatherData = await weatherRes.json();

            const aqiUrl = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=pm10`;
            let fineDust = "보통";
            try {
                const aqiRes = await fetch(aqiUrl);
                const aqiData = await aqiRes.json();
                const pm10 = aqiData.current.pm10;
                if (pm10 <= 30) fineDust = "좋음 🔵";
                else if (pm10 <= 80) fineDust = "보통 🟢";
                else if (pm10 <= 150) fineDust = "나쁨 🟠";
                else fineDust = "매우나쁨 🔴";
            } catch(e) {}

            const code = weatherData.current.weather_code;
            const currentTemp = Math.round(weatherData.current.temperature_2m);
            const minTemp = Math.round(weatherData.daily.temperature_2m_min[0]);
            const maxTemp = Math.round(weatherData.daily.temperature_2m_max[0]);
            const precip = weatherData.daily.precipitation_probability_max[0];

            let condition = 'sunny';
            let conditionText = '맑고 화창해요 ☀️';
            let hoverText = '맑은 날씨입니다. 외출하기 좋아요!';

            if ([1, 2, 3, 45, 48].includes(code)) {
                condition = 'cloudy'; conditionText = '구름/흐림 ☁️'; hoverText = '구름이 많거나 흐린 날씨입니다.';
            } else if ([51, 53, 55, 61, 63, 65, 80, 81, 82, 95, 96, 99].includes(code)) {
                condition = 'rain'; conditionText = '비 ☔️'; hoverText = '비 예보가 있습니다! 외출 시 우산을 꼭 챙기세요.';
            } else if ([71, 73, 75, 77, 85, 86].includes(code)) {
                condition = 'snow'; conditionText = '눈 ❄️'; hoverText = '눈 예보가 있습니다! 길이 미끄러울 수 있으니 주의하세요.';
            }

            if (currentTemp >= 28) hoverText += ' 그리고 날씨가 매우 덥습니다 🥵 (열사병 주의)';
            else if (currentTemp <= 5) hoverText += ' 그리고 날씨가 매우 춥습니다 🥶 (감기 조심!)';

            state.weather = { condition, conditionText, hoverText, currentTemp, minTemp, maxTemp, precipitation: precip, fineDust };

        } catch (error) {
            state.weather = { condition: 'cloudy', conditionText: '정보 없음', hoverText: '네트워크 연결이 불안정하여 날씨 정보를 가져올 수 없습니다.', currentTemp: 20, minTemp: 15, maxTemp: 25, precipitation: 0, fineDust: '알수없음' };
        } finally {
            state.isWeatherLoading = false;
            renderWeatherWidget();
        }
    }

    // --- AI Recommendations ---
    aiRecommendBtn.addEventListener('click', async () => {
        if (state.locations.length === 0) {
            aiErrorMsg.classList.remove('hidden');
            aiErrorText.textContent = '지역을 최소 한 곳 이상 추가해주세요.';
            return;
        }

        state.isLoadingAI = true;
        aiErrorMsg.classList.add('hidden');
        aiRecommendBtn.disabled = true;
        aiBtnIcon.setAttribute('data-lucide', 'refresh-cw');
        aiBtnIcon.classList.add('animate-spin');
        aiBtnText.textContent = '상황 분석 및 추천 중...';
        lucide.createIcons();

        try {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const prompt = `오늘 다음 지역들의 날씨를 확인하고, 외출 시 필요한 필수 준비물을 추천해주세요.
지역들: ${state.locations.join(', ')}.
아이템 예시: 우산, 겉옷, 선크림, 마스크, 장갑, 목도리, 선글라스, 물병, 보조배터리, 립밤, 핫팩, 손수건, 미니선풍기 등.
답변은 행동 지침 형태의 문자열로 구성해주세요. 상황에 맞춰 3~5개 정도 추천해주세요.
예시: "우산 챙기기", "선크림 바르기", "따뜻한 외투 입기", "보조배터리 챙기기"`;

            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                tools: [{ google_search: {} }],
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: { type: "ARRAY", items: { type: "STRING" } }
                }
            };

            const result = await fetchWithRetry(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const textResponse = result.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!textResponse) throw new Error("API 응답 형식 오류");

            const recommendations = JSON.parse(textResponse);
            applyRecommendations(recommendations);

        } catch (error) {
            // Fallback
            const fallbackRecs = ["보조배터리 챙기기 🔋", "손수건 챙기기 🧣"];
            if (state.weather) {
                const w = state.weather;
                if (w.condition === 'rain') fallbackRecs.unshift("우산 챙기기 ☔️");
                if (w.condition === 'snow') fallbackRecs.unshift("따뜻한 장갑/목도리 챙기기 🧤");

                if (w.currentTemp >= 28) {
                    fallbackRecs.push("시원한 얼음물 챙기기 🧊", "선크림 꼼꼼히 바르기 🧴", "선글라스 챙기기 🕶️");
                } else if (w.currentTemp <= 5) {
                    fallbackRecs.push("두꺼운 외투 입기 🧥", "핫팩 챙기기 🔥", "보습 립밤 바르기 💄");
                } else {
                    fallbackRecs.push("선크림 바르기 🧴");
                }

                if (w.fineDust && w.fineDust.includes("나쁨")) {
                    fallbackRecs.push("KF94 마스크 챙기기 😷");
                }
            }
            applyRecommendations(fallbackRecs);
            aiErrorMsg.classList.remove('hidden');
            aiErrorText.textContent = 'API 서버 지연으로 자체 스마트 알고리즘을 통해 추천해 드렸습니다! ✨';
        } finally {
            state.isLoadingAI = false;
            aiRecommendBtn.disabled = false;
            aiBtnIcon.setAttribute('data-lucide', 'wand-2');
            aiBtnIcon.classList.remove('animate-spin');
            aiBtnText.textContent = '오늘 외출 필수품 추천받기';
            lucide.createIcons();
        }
    });

    function applyRecommendations(recommendations) {
        recommendations.forEach(rec => {
            if (!state.routines.some(r => r.text === rec)) {
                state.routines.push({
                    id: Date.now().toString() + Math.random().toString(36).substr(2, 9),
                    text: rec,
                    isCompleted: false,
                    isGemini: true
                });
            }
        });
        saveState();
        renderRoutines();
    }

    // --- Modal Handling ---
    function showModal() {
        completionModal.classList.remove('hidden');
        // Timeout to allow display:block to apply before animating opacity/transform
        setTimeout(() => {
            completionModal.classList.add('bg-black/40');
            modalContent.classList.remove('scale-95');
            modalContent.classList.add('scale-100');
        }, 10);
    }

    document.getElementById('close-modal-btn').addEventListener('click', () => {
        modalContent.classList.remove('scale-100');
        modalContent.classList.add('scale-95');
        setTimeout(() => {
            completionModal.classList.add('hidden');
        }, 300);
    });

    // --- Init ---
    function init() {
        lucide.createIcons();
        check7AMReset();
        setInterval(check7AMReset, 60000);
        fetchWeather();
        renderLocations();
        renderRoutines();
        updateProgress();
    }

    init();
</script>
</body>
</html>
