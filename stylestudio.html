<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Style Studio AI</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Custom Scrollbars */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar-dark::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar-dark::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar-dark::-webkit-scrollbar-thumb { background-color: #475569; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 font-sans selection:bg-blue-200 min-h-screen p-4 md:p-8">

<!-- Top Navigation -->
<nav class="max-w-7xl mx-auto flex flex-col xl:flex-row items-center justify-between bg-white px-6 py-4 rounded-[2rem] shadow-sm mb-6 gap-4 xl:gap-0">
    <div class="flex items-center gap-3 w-full xl:w-auto justify-center xl:justify-start">
        <div class="bg-slate-800 p-2 rounded-xl text-white">
            <i data-lucide="shirt" class="w-6 h-6"></i>
        </div>
        <h1 class="text-xl font-extrabold tracking-tight">Style <span class="text-blue-500">Studio</span></h1>
    </div>

    <div class="flex flex-wrap items-center justify-center gap-3 w-full xl:w-auto">
        <!-- Temperature Slider -->
        <div class="flex items-center gap-3 bg-slate-50 px-4 py-2 rounded-2xl border border-slate-100">
            <i data-lucide="thermometer-sun" class="text-orange-500 w-[18px] h-[18px]"></i>
            <input
                    type="range"
                    id="temp-slider"
                    min="-10"
                    max="35"
                    value="20"
                    oninput="handleTemperatureChange(event)"
                    class="w-20 md:w-28 accent-slate-800"
            />
            <span id="temp-display" class="font-bold w-12 text-right">20°C</span>
        </div>

        <!-- Style Concept Selector -->
        <div class="flex items-center gap-2 bg-slate-50 px-4 py-2 rounded-2xl border border-slate-100">
            <i data-lucide="sparkles" class="text-purple-500 hidden md:block w-4 h-4"></i>
            <select
                    id="concept-selector"
                    onchange="handleConceptChange(event)"
                    class="bg-transparent font-bold text-slate-700 outline-none cursor-pointer text-sm md:text-base appearance-none pr-2"
            >
                <!-- Options injected via JS -->
            </select>
        </div>

        <button
                id="btn-generate-ai"
                onclick="generateAIStyle()"
                class="flex items-center gap-2 bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-5 py-2.5 rounded-2xl font-bold hover:shadow-lg hover:shadow-blue-500/30 transition-all active:scale-95 disabled:opacity-70 whitespace-nowrap"
        >
            <span id="ai-btn-icon"><i data-lucide="wand-2" class="w-[18px] h-[18px]"></i></span>
            <span id="ai-btn-text">AI 스타일 추천</span>
        </button>
    </div>
</nav>

<!-- Main Layout -->
<main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

    <!-- Left: Wardrobe Library -->
    <div id="library-container" class="lg:col-span-3 bg-white p-6 rounded-[2rem] shadow-sm h-[800px] overflow-y-auto custom-scrollbar">
        <!-- Library Sections injected via JS -->
    </div>

    <!-- Center: Canvas Preview -->
    <div class="lg:col-span-6 bg-slate-200/50 rounded-[3rem] h-[800px] relative overflow-hidden shadow-inner flex items-center justify-center border border-slate-200">
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-[0.03]">
            <h2 class="text-9xl font-black tracking-tighter rotate-[-45deg] select-none">PREVIEW</h2>
        </div>

        <svg id="svg-canvas" viewBox="0 0 400 600" class="w-full h-full max-h-[700px] drop-shadow-2xl z-10">
            <!-- SVG content injected via JS -->
        </svg>

        <div class="absolute top-6 left-6 bg-white/80 backdrop-blur-md px-4 py-2 rounded-2xl text-sm font-bold shadow-sm text-slate-700 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
            <span id="canvas-temp-vibe">20°C Vibe</span>
        </div>
    </div>

    <!-- Right: Color & My Closet & AI Report -->
    <div class="lg:col-span-3 space-y-6">

        <!-- Color Palette Panel -->
        <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100">
            <div class="flex items-center gap-2 mb-4">
                <i data-lucide="palette" class="text-slate-400 w-[18px] h-[18px]"></i>
                <h3 class="font-bold text-sm text-slate-700">색상 변경</h3>
            </div>

            <div id="active-layer-indicator" class="bg-slate-50 p-3 rounded-xl mb-4 text-xs font-semibold text-slate-500 flex justify-between items-center border border-slate-100">
                <!-- Active layer indicator injected via JS -->
            </div>

            <div id="color-grid" class="grid grid-cols-7 gap-2">
                <!-- Color buttons injected via JS -->
            </div>
        </div>

        <!-- My Closet Panel -->
        <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2">
                    <i data-lucide="library" class="text-slate-400 w-[18px] h-[18px]"></i>
                    <h3 class="font-bold text-sm text-slate-700">내 옷장</h3>
                </div>
                <button
                        onclick="handleSaveToCloset()"
                        class="flex items-center gap-1 text-xs font-bold text-blue-600 bg-blue-50 px-3 py-1.5 rounded-lg hover:bg-blue-100 transition-colors"
                >
                    <i data-lucide="save" class="w-3.5 h-3.5"></i> 저장
                </button>
            </div>

            <div id="closet-container">
                <!-- Closet items injected via JS -->
            </div>
        </div>

        <!-- AI Report Panel -->
        <div id="ai-report-container">
            <!-- AI Report or Loading state injected via JS -->
        </div>

    </div>
</main>

<script>

    ];

    const FALLBACK_DATA = {
        cold: [
            { topId: 'sweatshirt', topColor: '#e2e8f0', bottomId: 'slacks', bottomColor: '#1e3a8a', outerId: 'padding', outerColor: '#0f172a', explanation: '[미니멀] 네이비와 딥 그레이를 매치하여 추운 겨울에 어울리는 차분하고 보온성 있어 보이는 시각적 효과를 줍니다.' },
            { topId: 'hoodie', topColor: '#ffffff', bottomId: 'denim', bottomColor: '#000000', outerId: 'longcoat', outerColor: '#475569', explanation: '[시티보이] 무채색 기반의 깔끔한 대비를 통해 모던하고 세련된 겨울 코어룩을 연출했습니다.' }
        ],
        chilly: [
            { topId: 'shirt', topColor: '#ffffff', bottomId: 'chino', bottomColor: '#d97706', outerId: 'blazer', outerColor: '#14532d', explanation: '[프레피] 딥그린과 브라운의 따뜻한 조화로 가을/초겨울의 클래식한 분위기를 강조했습니다.' },
            { topId: 'shirt', topColor: '#f8fafc', bottomId: 'skirt', bottomColor: '#475569', outerId: 'cardigan', outerColor: '#b45309', explanation: '[캐주얼] 따뜻한 브라운 가디건과 차분한 스커트를 매치하여 쌀쌀한 날씨에 어울리는 포근한 데일리룩을 완성했습니다.' }
        ],
        mild: [
            { topId: 'sweatshirt', topColor: '#8b5cf6', bottomId: 'sweatpants', bottomColor: '#e2e8f0', outerId: 'none', outerColor: '#ffffff', explanation: '[스트릿] 맨투맨과 조거팬츠의 스포티한 조합으로 활동성을 챙기면서도, 퍼플과 라이트 그레이 컬러 매치로 트렌디한 원마일웨어 룩을 완성했습니다.' },
            { topId: 'shirt', topColor: '#ffffff', bottomId: 'slacks', bottomColor: '#475569', outerId: 'blazer', outerColor: '#000000', explanation: '[미니멀] 블랙 & 화이트의 정석적인 대비로 미니멀하고 시크한 매력을 돋보이게 합니다.' }
        ],
        warm: [
            { topId: 'tshirt', topColor: '#e2e8f0', bottomId: 'shorts', bottomColor: '#000000', outerId: 'none', outerColor: '#ffffff', explanation: '[고프코어] 시원해 보이는 라이트 그레이 반팔 티셔츠와 블랙 반바지를 사용하여 더운 날씨에 완벽한 편안함과 깔끔함을 유지하는 컬러 매치입니다.' },
            { topId: 'tshirt', topColor: '#fca5a5', bottomId: 'skirt', bottomColor: '#f8fafc', outerId: 'none', outerColor: '#ffffff', explanation: '[캐주얼] 경쾌한 핑크 티셔츠와 화이트 크림 스커트 조합으로 여름날의 산뜻하고 리조트룩 같은 편안함을 줍니다.' }

    };

    // --- [State Management] ---
    let state = {
        temperature: 20,
        selectedBottom: { id: 'slacks', color: '#0f172a' },
        selectedTop: { id: 'shirt', color: '#ffffff' },
        selectedOuter: { id: 'none', color: '#ffffff' },
        activeLayer: 'top',
        selectedConcept: 'random',
        aiReport: null,
        isLoadingAI: false,
        closet: []
    };

    // --- [SVG Generator Functions] ---
    function getFilterDefs() {
        return `
        <defs>
          <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
          </filter>
          <filter id="inner-shadow">
            <feOffset dx="0" dy="4"/>
            <feGaussianBlur stdDeviation="5" result="offset-blur"/>
            <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
            <feFlood flood-color="black" flood-opacity="0.2" result="color"/>
            <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
            <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
          </filter>
        </defs>
      `;
    }

    function getBottomsSVG(id, color) {
        const isShorts = id === 'shorts';
        const isSkirt = id === 'skirt';

        const baseLeftLeg = isShorts ? "M 140,290 L 200,300 L 200,410 L 115,400 L 105,400 Z" : isSkirt ? "" : "M 140,290 L 200,300 L 200,410 L 150,560 L 110,560 Z";
        const baseRightLeg = isShorts ? "M 260,290 L 200,300 L 200,410 L 285,400 L 295,400 Z" : isSkirt ? "" : "M 260,290 L 200,300 L 200,410 L 250,560 L 290,560 Z";
        const skirtPath = "M 140,290 L 260,290 L 300,480 C 250,490 150,490 100,480 Z";

        let details = '';
        if (id === 'slacks') {
            details = `
          <g stroke="#000000" stroke-opacity="0.15" stroke-width="2" fill="none">
            <line x1="145" y1="310" x2="130" y2="560" />
            <line x1="255" y1="310" x2="270" y2="560" />
            <path d="M 200,295 C 190,340 195,380 200,390" />
            <rect x="150" y="290" width="6" height="15" fill="${color}" stroke="#000" stroke-opacity="0.2" />
            <rect x="244" y="290" width="6" height="15" fill="${color}" stroke="#000" stroke-opacity="0.2" />
          </g>
        `;
        } else if (id === 'denim') {
            details = `
          <g stroke="#b45309" stroke-width="1.5" fill="none" stroke-dasharray="3,2">
            <path d="M 145,295 L 200,305 L 200,405 L 155,555" />
            <path d="M 140,300 L 195,310 L 195,410 L 150,560" />
            <path d="M 255,295 L 200,305 L 200,405 L 245,555" />
            <path d="M 260,300 L 205,310 L 205,410 L 250,560" />
            <path d="M 140,290 C 145,310 160,320 170,320" stroke-dasharray="none" stroke-width="2" stroke="#1e3a8a" stroke-opacity="0.3" />
            <rect x="235" y="295" width="15" height="18" rx="2" stroke-dasharray="none" stroke="#b45309" />
            <path d="M 180,330 C 160,335 145,325 140,320" stroke="#ffffff" stroke-opacity="0.3" stroke-width="3" stroke-dasharray="none" />
            <path d="M 185,345 C 165,350 150,340 145,335" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="none" />
            <path d="M 220,330 C 240,335 255,325 260,320" stroke="#ffffff" stroke-opacity="0.3" stroke-width="3" stroke-dasharray="none" />
          </g>
        `;
        } else if (id === 'chino') {
            details = `
          <g>
            <path d="M 140,290 L 160,340" stroke="#000000" stroke-opacity="0.2" stroke-width="2" />
            <path d="M 260,290 L 240,340" stroke="#000000" stroke-opacity="0.2" stroke-width="2" />
            <rect x="108" y="540" width="44" height="20" fill="${color}" stroke="#000000" stroke-opacity="0.1" />
            <rect x="248" y="540" width="44" height="20" fill="${color}" stroke="#000000" stroke-opacity="0.1" />
            <path d="M 130,440 C 140,445 150,440 160,435" stroke="#000" stroke-opacity="0.1" stroke-width="2" fill="none" />
            <path d="M 270,440 C 260,445 250,440 240,435" stroke="#000" stroke-opacity="0.1" stroke-width="2" fill="none" />
          </g>
        `;
        } else if (id === 'shorts') {
            details = `
          <g>
            <rect x="142" y="288" width="116" height="12" fill="#000" fill-opacity="0.05" />
            <path d="M 195,300 Q 185,320 180,330" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
            <path d="M 205,300 Q 215,320 220,330" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
            <path d="M 125,400 L 125,360" stroke="#000" stroke-opacity="0.1" stroke-width="1.5" />
            <path d="M 275,400 L 275,360" stroke="#000" stroke-opacity="0.1" stroke-width="1.5" />
            <path d="M 110,392 L 195,400" stroke="#000" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="3,2" />
            <path d="M 290,392 L 205,400" stroke="#000" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="3,2" />

            <path d="M 260,290 L 245,330" stroke="#000" stroke-opacity="0.15" stroke-width="2" />
          </g>
        `;
        } else if (id === 'sweatpants') {
            let lines = '';
            for(let i=1; i<=3; i++) lines += `<line x1="${110+i*10}" y1="540" x2="${110+i*10}" y2="560" stroke="#000" stroke-opacity="0.1" />`;
            for(let i=1; i<=3; i++) lines += `<line x1="${250+i*10}" y1="540" x2="${250+i*10}" y2="560" stroke="#000" stroke-opacity="0.1" />`;
            details = `
          <g>
            <rect x="110" y="540" width="40" height="20" fill="${color}" stroke="#000" stroke-opacity="0.1" />
            <rect x="250" y="540" width="40" height="20" fill="${color}" stroke="#000" stroke-opacity="0.1" />
            ${lines}
            <rect x="142" y="288" width="116" height="12" fill="#000" fill-opacity="0.05" />
            <path d="M 195,300 Q 185,320 180,330" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
            <path d="M 205,300 Q 215,320 220,330" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
            <path d="M 135,440 C 145,445 155,445 160,440" stroke="#000" stroke-opacity="0.05" stroke-width="2" fill="none" />

        } else if (id === 'skirt') {
            details = `

            <rect x="140" y="288" width="120" height="8" fill="#000" fill-opacity="0.05" />

        }

        return `
        <g filter="url(#drop-shadow)" style="transition: all 0.3s ease">
          ${isSkirt ? `<path d="${skirtPath}" fill="${color}" />` : `<path d="${baseLeftLeg} ${baseRightLeg}" fill="${color}" />`}

    function getTopsSVG(id, color) {
        const bodyPath = "M 130,150 L 140,300 C 170,305 230,305 260,300 L 270,150 Z";
        const isShortSleeve = id === 'tshirt';
        const leftSleeve = isShortSleeve ? "M 100,120 L 75,190 C 95,200 115,200 128,180 L 130,150 Z" : "M 100,120 L 75,250 C 90,260 110,260 125,250 L 130,150 Z";

        const shoulders = "M 170,100 L 100,120 L 130,150 L 270,150 L 300,120 L 230,100 Z";

        let details = '';
        if (id === 'tshirt') {
            details = `
          <g>
            <path d="M 170,100 C 185,115 215,115 230,100 C 215,120 185,120 170,100 Z" fill="#000" fill-opacity="0.15" />
            <path d="M 82,183 C 98,193 115,193 125,178" stroke="#000" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="2,2" fill="none" />
            <path d="M 318,183 C 302,193 285,193 275,178" stroke="#000" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="2,2" fill="none" />

            <path d="M 270,150 C 280,130 290,125 300,120" stroke="#000" stroke-opacity="0.1" stroke-width="1.5" fill="none" />
          </g>
        `;
        } else if (id === 'sweatshirt') {
            let lines = '';
            for(let i=0; i<12; i++) lines += `<line x1="${145+i*10}" y1="280" x2="${145+i*10}" y2="300" stroke="#000" stroke-opacity="0.1" />`;
            details = `
          <g>
            <line x1="170" y1="100" x2="130" y2="150" stroke="#000" stroke-opacity="0.15" stroke-width="2" />
            <line x1="230" y1="100" x2="270" y2="150" stroke="#000" stroke-opacity="0.15" stroke-width="2" />
            <polygon points="190,110 210,110 200,125" fill="none" stroke="#000" stroke-opacity="0.2" stroke-width="1.5" />
            <rect x="140" y="280" width="120" height="20" fill="#000" fill-opacity="0.05" />
            ${lines}
            <path d="M 75,240 L 125,240" stroke="#000" stroke-opacity="0.15" stroke-width="2" />
            <path d="M 275,240 L 325,240" stroke="#000" stroke-opacity="0.15" stroke-width="2" />
          </g>
        `;
        } else if (id === 'shirt') {
            let buttons = '';
            [130, 160, 190, 220, 250, 280].forEach(y => buttons += `<circle cx="200" cy="${y}" r="3" fill="#ffffff" stroke="#000" stroke-opacity="0.3" stroke-width="0.5" />`);
            details = `
          <g>
            <polygon points="170,100 160,130 190,120 200,110" fill="${color}" filter="url(#drop-shadow)" />
            <polygon points="230,100 240,130 210,120 200,110" fill="${color}" filter="url(#drop-shadow)" />
            <rect x="193" y="110" width="14" height="190" fill="${color}" stroke="#000" stroke-opacity="0.1" stroke-width="1" />

            details = `
          <g>

        } else if (id === 'longcoat') {

    // --- [Rendering Logic] ---
    function renderConcepts() {
        const select = document.getElementById('concept-selector');
        select.innerHTML = CONCEPTS.map(concept =>
            `<option value="${concept.id}" ${state.selectedConcept === concept.id ? 'selected' : ''}>${concept.name}</option>`
        ).join('');
    }

    function renderLibrary() {
        const container = document.getElementById('library-container');

        const renderSection = (title, items, layer, selectedId) => {
            const buttons = items.map(item => {
                const isSelected = selectedId === item.id;
                const bgClass = isSelected ? 'bg-slate-800 text-white shadow-md' : 'bg-white text-slate-600 hover:bg-slate-100';
                let checkIcon = '';
                if (isSelected) {
                    const checkColor = (layer === 'outer' && item.id === 'none') ? 'text-slate-400' : 'text-blue-400';
                    checkIcon = `<i data-lucide="check-circle-2" class="w-4 h-4 ${checkColor}"></i>`;
                }
                return `
            <button onclick="handleSelectClothing('${layer}', '${item.id}')" class="w-full text-left px-4 py-3 rounded-2xl flex items-center justify-between transition-all duration-200 ${bgClass}">
              <span class="font-medium text-sm">${item.name}</span>
              ${checkIcon}
            </button>
          `;
            }).join('');

            return `
          <div class="mb-6">
            <h3 class="text-xs font-bold text-slate-400 mb-3 uppercase tracking-wider">${title}</h3>
            <div class="space-y-2">${buttons}</div>
          </div>
        `;
        };

        container.innerHTML =
            renderSection("Outer", CATALOG.outer, "outer", state.selectedOuter.id) +
            renderSection("Tops", CATALOG.top, "top", state.selectedTop.id) +
            renderSection("Bottoms", CATALOG.bottom, "bottom", state.selectedBottom.id);
    }

    function renderSVG() {
        const canvas = document.getElementById('svg-canvas');

        canvas.innerHTML = `
        ${getFilterDefs()}
        <g id="avatar-group" transform="translate(0, 20)">
          <g onclick="setActiveLayer('bottom')" style="cursor: pointer" class="hover:brightness-110 transition-all">
            ${getBottomsSVG(state.selectedBottom.id, state.selectedBottom.color)}
          </g>
          <g onclick="setActiveLayer('top')" style="cursor: pointer" class="hover:brightness-110 transition-all">
            ${getTopsSVG(state.selectedTop.id, state.selectedTop.color)}
          </g>
          <g onclick="setActiveLayer('outer')" style="cursor: pointer" class="hover:brightness-110 transition-all">
            ${getOutersSVG(state.selectedOuter.id, state.selectedOuter.color)}
          </g>
        </g>
      `;
    }

    function renderColorPalette() {
        // Update Active Layer Indicator
        const indicator = document.getElementById('active-layer-indicator');
        const layerName = state.activeLayer === 'outer' ? '아우터' : state.activeLayer === 'top' ? '상의' : '하의';
        const layerColor = state.activeLayer === 'outer' ? state.selectedOuter.color : state.activeLayer === 'top' ? state.selectedTop.color : state.selectedBottom.color;

        indicator.innerHTML = `
        <span>현재 선택됨</span>
        <span class="bg-white px-3 py-1.5 rounded-md shadow-sm text-blue-600 font-bold uppercase tracking-wide flex items-center gap-1">
          ${layerName}
          <div class="w-3 h-3 rounded-full ml-1 border border-slate-200" style="background-color: ${layerColor}"></div>
        </span>
      `;

        // Update Color Grid
        const grid = document.getElementById('color-grid');
        let buttonsHtml = `
        <div class="relative w-full aspect-square rounded-full shadow-sm overflow-hidden border-2 border-slate-200 hover:scale-110 transition-transform cursor-pointer group flex items-center justify-center bg-gradient-to-tr from-rose-400 via-fuchsia-400 to-indigo-400">
          <input type="color" class="absolute inset-0 w-20 h-20 -top-2 -left-2 opacity-0 cursor-pointer" onchange="handleSelectColor(event.target.value)" title="사용자 지정 색상" />
          <i data-lucide="palette" class="text-white drop-shadow-md relative z-10 pointer-events-none w-3.5 h-3.5"></i>
        </div>
      `;

        COLORS.forEach(color => {
            const isActive = (state.activeLayer === 'bottom' && state.selectedBottom.color === color) ||
                (state.activeLayer === 'top' && state.selectedTop.color === color) ||
                (state.activeLayer === 'outer' && state.selectedOuter.color === color);

            const activeClass = isActive ? 'border-blue-500 scale-110 shadow-md' : 'border-transparent shadow-sm';

            buttonsHtml += `
          <button onclick="handleSelectColor('${color}')" class="w-full aspect-square rounded-full border-2 transition-transform hover:scale-110 active:scale-95 ${activeClass}" style="background-color: ${color}"></button>
        `;
        });
        grid.innerHTML = buttonsHtml;
    }

    function renderCloset() {
        const container = document.getElementById('closet-container');
        if (state.closet.length === 0) {
            container.innerHTML = `
          <div class="text-center py-6 text-sm text-slate-400 bg-slate-50 rounded-xl border border-dashed border-slate-200">
            마음에 드는 스타일을 저장해보세요!
          </div>
        `;
            return;
        }

        let itemsHtml = state.closet.map(outfit => {
            let outerCircle = outfit.outer.id !== 'none' ? `<div class="w-6 h-6 rounded-full border-2 border-white shadow-sm" style="background-color: ${outfit.outer.color}" title="아우터"></div>` : '';
            return `
          <div class="flex items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-100 hover:border-blue-200 transition-colors">
            <div class="flex items-center gap-3">
              <div class="flex -space-x-2">
                ${outerCircle}
                <div class="w-6 h-6 rounded-full border-2 border-white shadow-sm" style="background-color: ${outfit.top.color}" title="상의"></div>
                <div class="w-6 h-6 rounded-full border-2 border-white shadow-sm" style="background-color: ${outfit.bottom.color}" title="하의"></div>
              </div>
              <span class="text-xs font-medium text-slate-500">${outfit.date}</span>
            </div>
            <button onclick="handleLoadFromCloset(${outfit.id})" class="text-xs font-bold text-slate-600 hover:text-blue-600 bg-white px-2 py-1 rounded shadow-sm border border-slate-200">
              적용
            </button>
          </div>
        `;
        }).join('');

        container.innerHTML = `<div class="space-y-3 max-h-[160px] overflow-y-auto custom-scrollbar pr-2">${itemsHtml}</div>`;
    }

    function renderAIReport() {
        const container = document.getElementById('ai-report-container');

        if (state.isLoadingAI) {
            container.innerHTML = `
          <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 flex flex-col items-center justify-center py-8 gap-3">
            <i data-lucide="loader-2" class="w-8 h-8 animate-spin text-blue-500"></i>
            <p class="text-sm font-medium text-slate-500">스타일을 분석 중입니다...</p>
          </div>
        `;
        } else if (state.aiReport) {
            container.innerHTML = `
          <div class="bg-gradient-to-br from-slate-800 to-slate-900 text-white p-6 rounded-[2rem] shadow-xl relative overflow-hidden animate-in slide-in-from-bottom-4 fade-in duration-500">
            <div class="absolute top-0 right-0 p-4 opacity-10">
              <i data-lucide="sparkles" class="w-16 h-16"></i>
            </div>
            <div class="flex items-center gap-2 mb-4">
              <div class="bg-blue-500/20 p-2 rounded-xl text-blue-300">
                <i data-lucide="wand-2" class="w-[18px] h-[18px]"></i>
              </div>
              <h3 class="font-bold text-sm text-blue-100">AI 스타일링 리포트</h3>
            </div>
            <div class="max-h-[150px] overflow-y-auto pr-2 custom-scrollbar-dark">
              <p class="text-sm font-medium leading-relaxed text-slate-200 whitespace-pre-line">${state.aiReport.explanation}</p>
            </div>
          </div>
        `;
        } else {
            container.innerHTML = '';
        }
    }

    function updateDOM() {
        document.getElementById('temp-slider').value = state.temperature;
        document.getElementById('temp-display').innerText = `${state.temperature}°C`;
        document.getElementById('canvas-temp-vibe').innerText = `${state.temperature}°C Vibe`;

        const btnIcon = document.getElementById('ai-btn-icon');
        const btnText = document.getElementById('ai-btn-text');
        const btnGenerate = document.getElementById('btn-generate-ai');

        if(state.isLoadingAI) {
            btnIcon.innerHTML = `<i data-lucide="loader-2" class="w-[18px] h-[18px] animate-spin"></i>`;
            btnText.innerText = '분석 중...';
            btnGenerate.disabled = true;
        } else {
            btnIcon.innerHTML = `<i data-lucide="wand-2" class="w-[18px] h-[18px]"></i>`;
            btnText.innerText = 'AI 스타일 추천';
            btnGenerate.disabled = false;
        }

        renderLibrary();
        renderSVG();
        renderColorPalette();
        renderCloset();
        renderAIReport();

        // Re-initialize icons after DOM update
        lucide.createIcons();
    }

    // --- [Event Handlers] ---
    function setActiveLayer(layer) {
        state.activeLayer = layer;
        updateDOM();
    }

    function handleSelectClothing(layer, id) {
        state.aiReport = null;
        state.activeLayer = layer;
        if (layer === 'bottom') state.selectedBottom.id = id;
        if (layer === 'top') state.selectedTop.id = id;
        if (layer === 'outer') state.selectedOuter.id = id;
        updateDOM();
    }

    function handleSelectColor(color) {
        state.aiReport = null;
        if (state.activeLayer === 'bottom') state.selectedBottom.color = color;
        if (state.activeLayer === 'top') state.selectedTop.color = color;
        if (state.activeLayer === 'outer') state.selectedOuter.color = color;
        updateDOM();
    }

    function handleTemperatureChange(e) {
        state.temperature = Number(e.target.value);
        updateDOM();
    }

    function handleConceptChange(e) {
        state.selectedConcept = e.target.value;
        updateDOM();
    }

    function handleSaveToCloset() {
        const newOutfit = {
            id: Date.now(),
            top: { ...state.selectedTop },
            bottom: { ...state.selectedBottom },
            outer: { ...state.selectedOuter },
            date: new Date().toLocaleDateString()
        };
        state.closet.unshift(newOutfit);
        updateDOM();
    }

    function handleLoadFromCloset(id) {
        const outfit = state.closet.find(o => o.id === id);
        if (outfit) {
            state.selectedTop = { ...outfit.top };
            state.selectedBottom = { ...outfit.bottom };
            state.selectedOuter = { ...outfit.outer };
            state.aiReport = null;
            updateDOM();
        }
    }

    // --- [AI API Logic] ---
    const getFallbackOutfit = (temp) => {
        let category = 'warm';
        if (temp < 5) category = 'cold';
        else if (temp < 15) category = 'chilly';
        else if (temp < 23) category = 'mild';

        const options = FALLBACK_DATA[category];
        return options[Math.floor(Math.random() * options.length)];
    };

    const applyOutfitData = (data) => {
        state.selectedTop = { id: data.topId, color: data.topColor };
        state.selectedBottom = { id: data.bottomId, color: data.bottomColor };
        state.selectedOuter = { id: data.outerId, color: data.outerColor };
        state.aiReport = { explanation: data.explanation };
        updateDOM();
    };

    async function fetchWithBackoff(prompt, maxRetries = 5) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${API_KEY}`;

        const payload = {
            contents: [{ parts: [{ text: prompt }] }],
            systemInstruction: { parts: [{ text: "당신은 세계적인 패션 디렉터입니다. 뻔한 스타일보다는 트렌디하고 개성 있는 다양한 패션 컨셉(미니멀, 스트릿, 시티보이, 고프코어, 프레피, 아메카지 등)을 활용하여 온도에 딱 맞는 창의적인 스타일링을 제안합니다." }] },
            generationConfig: {
                responseMimeType: "application/json",
                responseSchema: {
                    type: "OBJECT",
                    properties: {
                        topId: { type: "STRING", enum: ["tshirt", "sweatshirt", "shirt", "hoodie"] },
                        topColor: { type: "STRING" },
                        bottomId: { type: "STRING", enum: ["slacks", "denim", "chino", "sweatpants", "shorts", "skirt"] },
                        bottomColor: { type: "STRING" },
                        outerId: { type: "STRING", enum: ["none", "cardigan", "blazer", "padding", "longcoat"] },
                        outerColor: { type: "STRING" },
                        explanation: { type: "STRING" }
                    },
                    required: ["topId", "topColor", "bottomId", "bottomColor", "outerId", "outerColor", "explanation"]
                }
            }
        };

        let retries = 0;
        while (retries < maxRetries) {
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error(`API Error: ${response.status}`);

                const result = await response.json();
                return JSON.parse(result.candidates[0].content.parts[0].text);
            } catch (error) {
                retries++;
                if (retries >= maxRetries) throw error;
                await new Promise(res => setTimeout(res, Math.pow(2, retries) * 1000));
            }
        }
    }

    async function generateAIStyle() {
        state.isLoadingAI = true;
        state.aiReport = null;
        updateDOM();

        const conceptObj = CONCEPTS.find(c => c.id === state.selectedConcept);
        const conceptName = conceptObj ? conceptObj.name : 'AI 알아서';
        const conceptInstruction = state.selectedConcept === 'random'
            ? `특정 패션 컨셉(예: 스트릿, 미니멀, 시티보이, 프레피룩, 고프코어 등)을 하나 무작위로 다양하게 정해서`
            : `반드시 '${conceptName}' 컨셉에 완벽하게 맞춰서`;

        const prompt = `현재 온도는 ${state.temperature}°C 입니다.
      이 온도에 어울리도록, ${conceptInstruction} 트렌디한 전체 스타일링(옷 종류와 색상 조합)을 추천해주세요.

      사용 가능한 옷의 종류(ID)는 다음과 같습니다:
      - outerId: 'none' (선택 안함), 'cardigan' (가디건), 'blazer' (블레이저), 'padding' (패딩 자켓), 'longcoat' (롱코트)
      - topId: 'tshirt' (반팔 티셔츠), 'sweatshirt' (맨투맨), 'shirt' (셔츠), 'hoodie' (후디)
      - bottomId: 'slacks' (슬랙스), 'denim' (데님 팬츠), 'chino' (치노 팬츠), 'sweatpants' (조거팬츠/트레이닝복), 'shorts' (반바지), 'skirt' (스커트)

      색상은 반드시 HEX 코드(예: #000000)로 응답해주시고, 'explanation' 필드에 [선택한 스타일 컨셉명]을 대괄호로 표시하여 포함한 뒤, 왜 이 옷들과 색상들을 매치했는지 감각적인 스타일링 팁을 3~4문장으로 상세히 설명해주세요.`;

        try {
            const data = await fetchWithBackoff(prompt);
            applyOutfitData(data);
        } catch (error) {
            console.warn("AI 추천 실패, 로컬 폴백 데이터를 적용합니다.", error);
            const fallback = getFallbackOutfit(state.temperature);
            applyOutfitData(fallback);
        } finally {
            state.isLoadingAI = false;
            updateDOM();
        }
    }

    // --- [Initialization] ---
    renderConcepts();
    updateDOM();

</script>
