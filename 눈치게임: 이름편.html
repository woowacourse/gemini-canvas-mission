<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>눈치게임: 이름편</title>
    <style>
        :root {
            --primary-color: #ff4757;
            --secondary-color: #2f3542;
            --bg-color: #f1f2f6;
            --card-bg: #ffffff;
            --text-color: #2f3542;
            --success-color: #2ed573;
            --gold: #f1c40f;
            --silver: #bdc3c7;
            --bronze: #cd7f32;
            --king-box-bg: #fff9c4;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 550px;
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
        }

        h1 { color: var(--primary-color); margin-bottom: 1.5rem; font-size: 1.8rem; }
        .hidden { display: none !important; }

        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            color: #57606f;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="number"], input[type="text"] {
            width: 100%; padding: 12px; border: 2px solid #ddd;
            border-radius: 10px; font-size: 1rem; box-sizing: border-box; outline: none;
            transition: border-color 0.3s;
        }

        input:focus { border-color: var(--primary-color); }

        button {
            width: 100%; padding: 14px; background-color: var(--primary-color);
            color: white; border: none; border-radius: 10px; font-size: 1.1rem;
            font-weight: bold; cursor: pointer; transition: transform 0.1s, background-color 0.3s; margin-top: 10px;
        }

        button.secondary { background-color: var(--secondary-color); }
        button:hover { filter: brightness(1.1); }
        button:active { transform: scale(0.98); }

        /* Status & Timer */
        .status-bar { display: flex; justify-content: space-between; margin-bottom: 1rem; font-weight: bold; color: #747d8c; }
        .timer-container { height: 10px; background: #dfe4ea; border-radius: 5px; margin-bottom: 1.5rem; overflow: hidden; }
        .timer-bar { height: 100%; background: var(--primary-color); width: 100%; transition: width 0.1s linear; }
        .question-box { background: #f9f9f9; padding: 1.5rem; border-radius: 15px; margin-bottom: 1.5rem; border-left: 5px solid var(--primary-color); }
        .question-text { font-size: 1.3rem; font-weight: bold; }

        /* Bomb Layer */
        .bomb-effect {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000; padding: 20px; box-sizing: border-box;
        }
        .bomb-emoji { font-size: 8rem; animation: shake 0.5s infinite; }
        .explosion-emoji { font-size: 10rem; display: none; }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }

        /* Results List */
        .player-list { text-align: left; margin: 20px 0; max-height: 250px; overflow-y: auto; }
        .player-item {
            display: flex; justify-content: space-between; padding: 12px;
            border-bottom: 1px solid #eee; font-size: 1.1rem;
        }
        .fail-count { color: var(--primary-color); font-weight: bold; }

        /* Podium Layout */
        .podium-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 10px;
            margin-top: 30px;
            min-height: 280px;
        }

        .king-card {
            background: var(--king-box-bg);
            color: var(--text-color);
            padding: 15px 10px;
            border-radius: 15px;
            border: 3px solid #f1c40f;
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .king-reveal { animation: zoomIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) both; }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.5) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .rank-1 { order: 2; min-height: 220px; border-color: var(--gold); z-index: 2; transform: scale(1.1); }
        .rank-2 { order: 1; min-height: 180px; border-color: var(--silver); }
        .rank-3 { order: 3; min-height: 160px; border-color: var(--bronze); }

        .trophy { font-size: 3rem; margin-bottom: 10px; }
        .rank-badge {
            background: #fff;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 8px;
            border: 1px solid #ddd;
        }
        .king-name { font-size: 1.1rem; font-weight: bold; word-break: break-all; margin-bottom: 5px; }
        .king-score { font-size: 0.9rem; color: var(--primary-color); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <!-- Screen 1: Setup -->
    <div id="setup-screen">
        <h1>💣 눈치게임: 이름편</h1>
        <div class="input-group">
            <label for="player-count">참여 인원 수 (명)</label>
            <input type="number" id="player-count" min="2" max="20" value="3">
        </div>
        <div class="input-group">
            <label for="max-rounds">진행할 총 라운드 수 (회)</label>
            <input type="number" id="max-rounds" min="1" max="100" value="10">
        </div>
        <button onclick="goToNicknameSetup()">닉네임 입력 시작</button>
    </div>

    <!-- Screen 2: Nickname Input -->
    <div id="nickname-screen" class="hidden">
        <h1 id="nickname-title">👋 닉네임 등록</h1>
        <p id="nickname-instruction">1번째 사람의 닉네임</p>
        <input type="text" id="nickname-input" placeholder="이름" autocomplete="off">
        <button onclick="registerNickname()">다음</button>
    </div>

    <!-- Screen 3: Gameplay -->
    <div id="game-screen" class="hidden">
        <div class="status-bar">
            <span id="player-turn-info">차례: -</span>
            <span id="game-round-info">진행: 1/10</span>
        </div>
        <div class="timer-container"><div id="timer-bar" class="timer-bar"></div></div>
        <div class="question-box">
            <div id="current-turn-label" style="color:var(--primary-color); margin-bottom:5px;">차례 대기 중</div>
            <div id="question-text" class="question-text">준비하세요!</div>
        </div>
        <input type="text" id="answer-input" placeholder="정답 입력" autocomplete="off">
        <button onclick="checkAnswer()">제출</button>
    </div>

    <!-- Screen 4: Stats List -->
    <div id="stats-screen" class="hidden">
        <h1>📊 오답 통계</h1>
        <p>라운드가 모두 종료되었습니다!</p>
        <div id="player-stats-list" class="player-list"></div>
        <button onclick="revealKings()">다음: 대마왕 공개 👑</button>
    </div>

    <!-- Screen 5: Podium Reveal -->
    <div id="king-screen" class="hidden">
        <h1 style="margin-bottom: 5px;">👹 이름 틀리기 대마왕</h1>
        <p style="font-size: 0.9rem; margin-bottom: 10px;">가장 많이 틀린 주인공들입니다!</p>
        <div id="king-container" class="podium-container"></div>
        <button style="margin-top:30px" onclick="resetGameToStart()">처음으로 돌아가기</button>
    </div>
</div>

<!-- Bomb Animation Layer -->
<div id="bomb-layer" class="bomb-effect hidden">
    <div id="bomb-icon" class="bomb-emoji">💣</div>
    <div id="explosion-icon" class="explosion-emoji">💥</div>
    <div id="bomb-msg" class="game-over-text" style="color:white; margin-top:20px;">시간 초과!</div>
    <div id="wrong-player-display" style="color:var(--primary-color); font-size:1.5rem; font-weight:bold; margin:10px 0;"></div>
    <div id="bomb-next-btn" class="hidden" style="width:100%; max-width:200px;">
        <button onclick="continueGame()">계속하기</button>
    </div>
</div>

<script>
    let playerCount = 0;
    let players = [];
    let currentTurnIndex = 0;
    let targetIndex = 0;
    let roundCount = 0;
    let maxRounds = 10;

    let timerInterval = null;
    let timeLeft = 5.0;
    const TIME_LIMIT = 5.0;

    const screens = ['setup-screen', 'nickname-screen', 'game-screen', 'stats-screen', 'king-screen'];

    function showScreen(id) {
        screens.forEach(s => document.getElementById(s).classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    // 초기화 및 리셋 로직
    function resetGameToStart() {
        players = [];
        playerCount = 0;
        roundCount = 0;
        currentTurnIndex = 0;
        stopTimer();
        document.getElementById('nickname-input').value = "";
        document.getElementById('answer-input').value = "";
        showScreen('setup-screen');
    }

    function goToNicknameSetup() {
        playerCount = parseInt(document.getElementById('player-count').value);
        maxRounds = parseInt(document.getElementById('max-rounds').value);

        if(playerCount < 2) {
            alert("2명 이상 필요합니다.");
            return;
        }
        if(isNaN(maxRounds) || maxRounds < 1) {
            alert("진행 횟수는 1회 이상이어야 합니다.");
            return;
        }

        players = []; // 인원 설정 시 초기화
        showScreen('nickname-screen');
        updateNicknameInstruction();
    }

    function registerNickname() {
        const input = document.getElementById('nickname-input');
        const name = input.value.trim();
        if(!name) {
            alert("이름을 입력하세요.");
            return;
        }

        players.push({ name: name, fails: 0 });
        input.value = "";

        if(players.length < playerCount) {
            updateNicknameInstruction();
        } else {
            startGame();
        }
    }

    function updateNicknameInstruction() {
        document.getElementById('nickname-instruction').innerText = `${players.length + 1}번째 사람의 닉네임`;
        document.getElementById('nickname-input').focus();
    }

    function startGame() {
        roundCount = 0;
        currentTurnIndex = 0;
        showScreen('game-screen');
        nextQuestion();
    }

    function nextQuestion() {
        // 라운드 종료 체크: 질문을 내기 직전에 라운드가 다 찼는지 확인
        if(roundCount >= maxRounds) {
            stopTimer();
            showStats();
            return;
        }

        roundCount++;
        stopTimer();

        const n = Math.floor(Math.random() * playerCount);
        const direction = Math.random() < 0.5 ? "왼쪽" : "오른쪽";

        if (n === 0) {
            targetIndex = currentTurnIndex;
            document.getElementById('question-text').innerText = "자기 자신의 닉네임은?";
        } else {
            if (direction === "오른쪽") {
                targetIndex = (currentTurnIndex + n) % playerCount;
            } else {
                targetIndex = (currentTurnIndex - n) % playerCount;
                if (targetIndex < 0) targetIndex += playerCount;
            }
            document.getElementById('question-text').innerText = `${direction}으로 ${n}번째 사람의 닉네임은?`;
        }

        document.getElementById('current-turn-label').innerText = `${players[currentTurnIndex].name} 님의 차례`;
        document.getElementById('player-turn-info').innerText = `차례: ${players[currentTurnIndex].name}`;
        document.getElementById('game-round-info').innerText = `진행: ${roundCount}/${maxRounds}`;

        const ansInput = document.getElementById('answer-input');
        ansInput.value = "";
        ansInput.focus();
        startTimer();
    }

    function startTimer() {
        timeLeft = TIME_LIMIT;
        timerInterval = setInterval(() => {
            timeLeft -= 0.1;
            document.getElementById('timer-bar').style.width = (timeLeft / TIME_LIMIT * 100) + "%";
            if(timeLeft <= 0) {
                triggerFail("시간 초과!");
            }
        }, 100);
    }

    function stopTimer() {
        if(timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    function checkAnswer() {
        const val = document.getElementById('answer-input').value.trim();
        if(val === players[targetIndex].name) {
            // 성공 시 다음 턴으로
            currentTurnIndex = (currentTurnIndex + 1) % playerCount;
            nextQuestion();
        } else {
            triggerFail("오답입니다!");
        }
    }

    function triggerFail(msg) {
        stopTimer();
        players[currentTurnIndex].fails++;

        const layer = document.getElementById('bomb-layer');
        const bombIcon = document.getElementById('bomb-icon');
        const explIcon = document.getElementById('explosion-icon');
        const nextBtn = document.getElementById('bomb-next-btn');

        document.getElementById('bomb-msg').innerText = msg;
        document.getElementById('wrong-player-display').innerText = `${players[currentTurnIndex].name} 님 오답 (+1)`;

        layer.classList.remove('hidden');
        bombIcon.style.display = 'block';
        explIcon.style.display = 'none';
        nextBtn.classList.add('hidden');

        setTimeout(() => {
            bombIcon.style.display = 'none';
            explIcon.style.display = 'block';
            nextBtn.classList.remove('hidden');
        }, 1000);
    }

    function continueGame() {
        document.getElementById('bomb-layer').classList.add('hidden');
        // 실패 후에도 다음 질문으로 넘어가며 판수는 차감됨
        currentTurnIndex = (currentTurnIndex + 1) % playerCount;
        nextQuestion();
    }

    function showStats() {
        showScreen('stats-screen');
        const list = document.getElementById('player-stats-list');
        list.innerHTML = "";

        // 이름 순으로 표시
        players.forEach(p => {
            list.innerHTML += `<div class="player-item">
                <span>${p.name}</span>
                <span class="fail-count">${p.fails}회 실패</span>
            </div>`;
        });
    }

    function revealKings() {
        showScreen('king-screen');
        const container = document.getElementById('king-container');
        container.innerHTML = "";

        // 오답 많은 순(내림차순) 정렬
        const sorted = [...players].sort((a, b) => b.fails - a.fails);
        const kings = sorted.slice(0, Math.min(3, sorted.length));

        const trophyEmojis = ["🏆", "🥈", "🥉"];
        const rankLabels = ["1등 (대마왕)", "2등", "3등"];

        // 연출 순서: 하위 순위부터 등장
        const revealOrder = kings.length === 3 ? [2, 1, 0] : (kings.length === 2 ? [1, 0] : [0]);

        revealOrder.forEach((originalIdx, orderIdx) => {
            setTimeout(() => {
                const k = kings[originalIdx];
                const card = document.createElement('div');
                card.className = `king-card king-reveal rank-${originalIdx + 1}`;
                card.innerHTML = `
                    <div class="trophy">${trophyEmojis[originalIdx]}</div>
                    <div class="rank-badge">${rankLabels[originalIdx]}</div>
                    <div class="king-name">${k.name}</div>
                    <div class="king-score">오답 ${k.fails}회</div>
                `;
                container.appendChild(card);
            }, orderIdx * 800);
        });
    }

    // 엔터키 지원
    document.addEventListener('keypress', (e) => {
        if(e.key === 'Enter') {
            const setupVisible = !document.getElementById('setup-screen').classList.contains('hidden');
            const nickVisible = !document.getElementById('nickname-screen').classList.contains('hidden');
            const gameVisible = !document.getElementById('game-screen').classList.contains('hidden');
            const bombVisible = !document.getElementById('bomb-layer').classList.contains('hidden');

            if(setupVisible) goToNicknameSetup();
            else if(nickVisible) registerNickname();
            else if(gameVisible) checkAnswer();
            else if(bombVisible && !document.getElementById('bomb-next-btn').classList.contains('hidden')) continueGame();
        }
    });
</script>

</body>
</html>
