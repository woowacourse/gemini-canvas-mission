<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPT 에셋 생성</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f8fafc;
        }

        .style-card {
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .style-card.active {
            border-color: #2563eb;
            background-color: #eff6ff;
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.1);
        }

        .glass-morphism {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .loader {
            border-top-color: #2563eb;
            animation: spinner 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }

        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .image-glow {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-10 flex flex-col items-center">

    <div class="max-w-5xl w-full space-y-10">
        <!-- 헤더 섹션 -->
        <div class="text-center space-y-3">
            <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight">
                🎨 PPT 에셋 생성
            </h1>
            <p class="text-lg text-slate-600 font-medium">
                발표에 사용될 전문가급 일러스트를 만드세요.
            </p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            <!-- 설정 패널 (좌측) -->
            <div class="lg:col-span-4 space-y-6">
                <div class="glass-morphism p-8 rounded-3xl shadow-sm space-y-8">
                    <!-- 스타일 선택 -->
                    <div>
                        <label class="block text-sm font-bold text-slate-800 mb-4 flex items-center gap-2">
                            <i class="fa-solid fa-palette text-blue-600"></i> 스타일 선택
                        </label>
                        <div class="grid grid-cols-2 gap-3" id="styleOptions">
                            <div onclick="selectStyle('flat')" data-style="flat" class="style-card active p-4 border-2 border-slate-100 rounded-2xl text-center">
                                <i class="fa-solid fa-vector-square text-blue-500 mb-2 text-xl"></i>
                                <div class="text-xs font-bold text-slate-700">플랫 디자인</div>
                            </div>
                            <div onclick="selectStyle('3d')" data-style="3d" class="style-card p-4 border-2 border-slate-100 rounded-2xl text-center">
                                <i class="fa-solid fa-cube text-indigo-500 mb-2 text-xl"></i>
                                <div class="text-xs font-bold text-slate-700">3D 입체 에셋</div>
                            </div>
                            <div onclick="selectStyle('isometric')" data-style="isometric" class="style-card p-4 border-2 border-slate-100 rounded-2xl text-center">
                                <i class="fa-solid fa-layer-group text-emerald-500 mb-2 text-xl"></i>
                                <div class="text-xs font-bold text-slate-700">아이소메트릭</div>
                            </div>
                            <div onclick="selectStyle('concept')" data-style="concept" class="style-card p-4 border-2 border-slate-100 rounded-2xl text-center">
                                <i class="fa-solid fa-lightbulb text-amber-500 mb-2 text-xl"></i>
                                <div class="text-xs font-bold text-slate-700">컨셉 아트</div>
                            </div>
                        </div>
                    </div>

                    <!-- 내용 입력 -->
                    <div class="space-y-3">
                        <label class="block text-sm font-bold text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-pen-to-square text-blue-600"></i> 어떤 이미지가 필요한가요?
                        </label>
                        <textarea 
                            id="promptInput" 
                            rows="4" 
                            class="w-full px-4 py-4 rounded-2xl border border-slate-200 focus:ring-4 focus:ring-blue-100 focus:border-blue-500 outline-none transition-all resize-none text-sm font-medium placeholder:text-slate-400"
                            placeholder="예: 클라우드 컴퓨팅을 상징하는 기술적인 아이콘..."
                        ></textarea>
                    </div>

                    <!-- 생성 버튼 -->
                    <button 
                        onclick="handleGenerate()" 
                        id="generateBtn"
                        class="w-full bg-slate-900 hover:bg-blue-700 text-white font-bold py-5 rounded-2xl transition-all flex items-center justify-center gap-3 shadow-xl active:scale-[0.98]"
                    >
                        <i class="fa-solid fa-sparkles"></i>
                        이미지 생성하기
                    </button>
                </div>
            </div>

            <!-- 결과 대시보드 (우측) -->
            <div class="lg:col-span-8 flex flex-col h-full">
                <!-- 초기 상태 -->
                <div id="resultPlaceholder" class="flex-1 min-h-[500px] border-2 border-dashed border-slate-200 rounded-[2rem] flex flex-col items-center justify-center text-slate-400 p-10 bg-white/40">
                    <div class="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mb-6">
                        <i class="fa-regular fa-paper-plane text-3xl opacity-30"></i>
                    </div>
                    <p class="font-semibold text-lg text-center">원하는 스타일을 고르고 내용을 입력해 보세요.</p>
                </div>

                <!-- 결과 표시 영역 -->
                <div id="resultContainer" class="hidden flex-1 glass-morphism p-4 rounded-[2rem] shadow-2xl relative overflow-hidden flex flex-col items-center justify-center">
                    <!-- 로딩 스테이트 -->
                    <div id="loadingOverlay" class="hidden flex flex-col items-center py-20 space-y-6">
                        <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-100 h-16 w-16"></div>
                        <div class="text-center">
                            <p class="text-slate-800 font-bold text-xl">전문가급 에셋 생성 중...</p>
                        </div>
                    </div>

                    <!-- 생성 이미지 -->
                    <div id="imageWrapper" class="hidden w-full h-full flex flex-col items-center gap-6">
                        <div class="relative group w-full max-w-2xl">
                            <img id="generatedImage" src="" alt="Generated Asset" class="rounded-2xl w-full h-auto image-glow">
                        </div>
                        <div class="flex gap-4">
                            <button onclick="saveImage()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-2xl font-bold shadow-lg flex items-center gap-2 transition-all">
                                <i class="fa-solid fa-download"></i> 고화질 저장
                            </button>
                            <button onclick="copyToClipboard()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-8 py-4 rounded-2xl font-bold flex items-center gap-2 transition-all">
                                <i class="fa-solid fa-copy"></i> 이미지 복사
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const apiKey = ""; 
        let currentStyle = 'flat';
        
        const stylePrompts = {
            flat: "professional modern flat illustration, clean vector graphics, corporate color palette, simple shapes, 4k resolution",
            '3d': "premium 3D render, claymorphism, soft volumetric lighting, studio quality, high detail",
            isometric: "detailed isometric illustration, professional tech style, vector aesthetic, precise angles",
            concept: "modern concept illustration, symbolic art, professional visual metaphor, artistic but clean"
        };

        function selectStyle(style) {
            currentStyle = style;
            document.querySelectorAll('.style-card').forEach(card => {
                card.classList.remove('active');
                if(card.dataset.style === style) card.classList.add('active');
            });
        }

        async function fetchWithRetry(url, options, retries = 5, backoff = 1000) {
            try {
                const response = await fetch(url, options);
                if (!response.ok) throw new Error(`API Error: ${response.status}`);
                return await response.json();
            } catch (err) {
                if (retries <= 0) throw err;
                await new Promise(r => setTimeout(r, backoff));
                return fetchWithRetry(url, options, retries - 1, backoff * 2);
            }
        }

        async function handleGenerate() {
            const userInput = document.getElementById('promptInput').value.trim();
            if (!userInput) return;

            const fullPrompt = `${userInput}, ${stylePrompts[currentStyle]}, professional, high resolution`;
            toggleUI(true);

            const IMAGEN_URL = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;
            try {
                const data = await fetchWithRetry(IMAGEN_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ instances: { prompt: fullPrompt }, parameters: { sampleCount: 1 } })
                });
                if (data.predictions?.[0]?.bytesBase64Encoded) {
                    displayResult(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
                } else { throw new Error("No data"); }
            } catch (err) {
                console.error(err);
                toggleUI(false);
            }
        }

        function toggleUI(isLoading) {
            const placeholder = document.getElementById('resultPlaceholder');
            const container = document.getElementById('resultContainer');
            const overlay = document.getElementById('loadingOverlay');
            const wrapper = document.getElementById('imageWrapper');
            const btn = document.getElementById('generateBtn');
            const img = document.getElementById('generatedImage');

            if (isLoading) {
                placeholder.classList.add('hidden');
                container.classList.remove('hidden');
                overlay.classList.remove('hidden');
                wrapper.classList.add('hidden');
                img.src = "";
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-circle-notch animate-spin"></i> 생성 중...';
            } else {
                overlay.classList.add('hidden');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-sparkles"></i> 이미지 생성하기';
            }
        }

        function displayResult(url) {
            const wrapper = document.getElementById('imageWrapper');
            const img = document.getElementById('generatedImage');
            img.src = url;
            wrapper.classList.remove('hidden');
            document.getElementById('loadingOverlay').classList.add('hidden');
            document.getElementById('generateBtn').disabled = false;
            document.getElementById('generateBtn').innerHTML = '<i class="fa-solid fa-sparkles"></i> 이미지 생성하기';
        }

        function saveImage() {
            const img = document.getElementById('generatedImage');
            const link = document.createElement('a');
            link.href = img.src;
            link.download = `ppt-asset-${Date.now()}.png`;
            link.click();
        }

        async function copyToClipboard() {
            const img = document.getElementById('generatedImage');
            try {
                const response = await fetch(img.src);
                const blob = await response.blob();
                await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
            } catch (err) { console.error("Copy failed", err); }
        }

        document.getElementById('promptInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleGenerate(); }
        });
    </script>
</body>
</html>
