<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Stream Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
        }
        
        .font-code {
            font-family: 'Fira Code', monospace;
        }

        /* 부드러운 버튼 애니메이션 */
        .op-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .op-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        /* 스크롤바 디자인 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        /* 다크 모드 스크롤바 */
        .dark-scrollbar::-webkit-scrollbar-thumb {
            background: #475569;
        }
        .dark-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        .pipeline-item {
            animation: slideIn 0.2s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body class="text-gray-900 flex flex-col lg:h-screen lg:overflow-hidden">

    <!-- 상단 네비게이션 -->
    <nav class="bg-slate-900 text-white shrink-0 shadow-md relative z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-500 p-1.5 rounded-lg">
                    <i class="fa-solid fa-flask text-xl text-white px-0.5"></i>
                </div>
                <span class="text-xl font-bold tracking-tight">Java Stream Lab</span>
            </div>
            <div id="level-dots" class="flex space-x-2">
                <!-- 레벨 점들이 여기에 생성됨 -->
            </div>
        </div>
    </nav>

    <!-- 메인 레이아웃 (좌우 분할) -->
    <main class="flex-1 w-full max-w-7xl mx-auto px-4 py-6 flex flex-col lg:flex-row gap-6 overflow-y-auto lg:overflow-hidden custom-scrollbar min-h-0">
        
        <!-- 왼쪽: 미션 대시보드 -->
        <div class="w-full lg:w-5/12 flex flex-col gap-5 overflow-y-auto custom-scrollbar lg:pr-2 pb-2">
            <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden shrink-0">
                <div class="p-6 border-b border-slate-100 flex flex-col gap-2">
                    <div class="flex items-center space-x-2">
                        <span id="level-tag" class="text-[10px] font-black uppercase tracking-widest bg-blue-600 text-white px-2 py-0.5 rounded">Level 1</span>
                        <h2 id="quest-title" class="text-xl font-bold text-slate-800 tracking-tight">불필요한 데이터 걸러내기</h2>
                    </div>
                </div>

                <!-- 데이터 가이드 영역 (상하 배치) -->
                <div class="flex flex-col">
                    <div class="p-5 bg-slate-50 border-b border-slate-100">
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-3">Input Data</span>
                        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm font-code text-sm">
                            <span class="text-blue-500" id="ui-input-type">List&lt;Integer&gt;</span> <span class="text-slate-400">data = </span><br>
                            <span class="text-emerald-600 font-semibold break-words" id="ui-input-value">[1, 2, 3, 4, 5, 6]</span>
                        </div>
                    </div>
                    <div class="p-5 bg-slate-50">
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-3">Target Output</span>
                        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm font-code text-sm">
                            <span class="text-blue-500" id="ui-output-type">List&lt;Integer&gt;</span> <span class="text-slate-400">result = </span><br>
                            <span class="text-orange-500 font-semibold break-words" id="ui-output-value">[2, 4, 6]</span>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <!-- 오른쪽: 코드 에디터 영역 -->
        <div class="w-full lg:w-7/12 flex flex-col lg:h-full min-h-[500px]">
            <section class="bg-slate-900 rounded-2xl shadow-xl overflow-hidden border border-slate-700 flex flex-col h-full">
                <!-- 에디터 헤더 -->
                <div class="bg-slate-800 px-5 py-3 flex items-center justify-between border-b border-slate-700 shrink-0">
                    <div class="flex space-x-1.5">
                        <div class="w-2.5 h-2.5 rounded-full bg-rose-500"></div>
                        <div class="w-2.5 h-2.5 rounded-full bg-amber-500"></div>
                        <div class="w-2.5 h-2.5 rounded-full bg-emerald-500"></div>
                    </div>
                    <span class="text-[10px] font-medium text-slate-400 font-code tracking-wider uppercase">StreamChallenge.java</span>
                </div>

                <!-- 파이프라인 조립창 -->
                <div class="p-6 md:p-8 flex-1 overflow-y-auto custom-scrollbar dark-scrollbar">
                    <div class="font-code text-sm md:text-base leading-relaxed">
                        <div class="mb-2 text-slate-500 italic">// Construct your stream pipeline</div>
                        <div class="text-slate-300 flex flex-wrap gap-2">
                            <div><span class="text-sky-400" id="res-type-label">List&lt;Integer&gt;</span> <span id="pipeline-start">result = data.stream()</span></div>
                        </div>
                        
                        <!-- 동적 연산 리스트 -->
                        <div id="pipeline-list" class="my-2 space-y-1.5 min-h-[40px]">
                            <!-- 여기에 선택된 옵션들이 렌더링됨 -->
                        </div>
                        
                        <div class="text-slate-300">;</div>
                    </div>
                </div>

                <!-- 옵션 선택 팔레트 -->
                <div class="p-5 md:p-6 bg-slate-800/50 border-t border-slate-700 shrink-0">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Available Operations</h3>
                        <button onclick="resetPipeline()" class="text-[10px] font-bold text-slate-500 hover:text-rose-400 uppercase tracking-widest transition-colors flex items-center">
                            <i class="fa-solid fa-trash-can mr-1.5"></i> 전체 초기화
                        </button>
                    </div>
                    <div id="option-palette" class="flex flex-wrap gap-2 max-h-[120px] overflow-y-auto custom-scrollbar dark-scrollbar pr-1">
                        <!-- 버튼들이 여기에 생성됨 -->
                    </div>
                </div>

                <!-- 하단 실행 바 -->
                <div class="px-5 py-4 bg-slate-900 flex justify-end shrink-0 border-t border-slate-800">
                    <button onclick="runCode()" class="bg-emerald-500 hover:bg-emerald-400 text-white px-8 py-3 rounded-xl font-bold shadow-lg shadow-emerald-900/20 transform transition active:scale-95 flex items-center space-x-2 group w-full sm:w-auto justify-center">
                        <span>파이프라인 실행하기</span>
                        <i class="fa-solid fa-play text-xs group-hover:translate-x-1 transition-transform"></i>
                    </button>
                </div>
            </section>
        </div>

    </main>

    <!-- 결과 모달 -->
    <div id="modal-overlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full overflow-hidden shadow-2xl transform transition-all scale-95 opacity-0" id="modal-content">
            <div id="modal-banner" class="p-8 text-center bg-slate-50 border-b border-slate-100">
                <div id="modal-icon-bg" class="w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i id="modal-icon" class="text-2xl text-white"></i>
                </div>
                <h3 id="modal-title" class="text-2xl font-black text-slate-800">결과</h3>
                <p id="modal-text" class="mt-2 text-slate-500 text-sm leading-relaxed"></p>
            </div>
            
            <div id="error-view" class="p-6 bg-slate-50 border-b border-slate-100 hidden">
                <span class="text-[10px] font-bold text-slate-400 uppercase mb-2 block tracking-tighter">실제 출력값 (Actual Result)</span>
                <div class="bg-slate-900 text-slate-300 p-3 rounded-xl font-code text-xs overflow-x-auto whitespace-nowrap custom-scrollbar dark-scrollbar" id="actual-val">
                    -
                </div>
            </div>

            <div class="p-4 flex gap-2">
                <button onclick="closeModal()" id="btn-retry" class="flex-1 py-3 font-bold text-slate-600 hover:bg-slate-50 rounded-2xl transition-colors">다시 시도</button>
                <button onclick="goNext()" id="btn-next" class="flex-1 py-3 bg-blue-600 text-white font-bold rounded-2xl hover:bg-blue-700 transition-colors hidden shadow-lg shadow-blue-200">다음 단계로</button>
            </div>
        </div>
    </div>

    <script>
        // 챌린지 구성
        const challenges = [
            {
                id: 1,
                title: "Mission: 불필요한 데이터 걸러내기",
                inputType: "List<Integer>",
                inputValue: [1, 2, 3, 4, 5, 6],
                outputType: "List<Integer>",
                target: [2, 4, 6],
                options: [
                    { id: 'f_even', text: ".filter(n -> n % 2 == 0)", type: 'i', fn: (d) => d.filter(n => n % 2 === 0) },
                    { id: 'f_odd', text: ".filter(n -> n % 2 != 0)", type: 'i', fn: (d) => d.filter(n => n % 2 !== 0) },
                    { id: 'm_double', text: ".map(n -> n * 2)", type: 'i', fn: (d) => d.map(n => n * 2) },
                    { id: 's_asc', text: ".sorted()", type: 'i', fn: (d) => [...d].sort((a,b) => a-b) },
                    { id: 'c_list', text: ".collect(Collectors.toList())", type: 't', fn: (d) => d }
                ]
            },
            {
                id: 2,
                title: "Mission: 데이터 증폭 및 재배치",
                inputType: "List<Integer>",
                inputValue: [3, 1, 4],
                outputType: "List<Integer>",
                target: [16, 9, 1],
                options: [
                    { id: 'm_sq', text: ".map(n -> n * n)", type: 'i', fn: (d) => d.map(n => n * n) },
                    { id: 'm_double2', text: ".map(n -> n * 2)", type: 'i', fn: (d) => d.map(n => n * 2) },
                    { id: 's_desc', text: ".sorted(Comparator.reverseOrder())", type: 'i', fn: (d) => [...d].sort((a,b) => b-a) },
                    { id: 's_asc2', text: ".sorted()", type: 'i', fn: (d) => [...d].sort((a,b) => a-b) },
                    { id: 'f_big', text: ".filter(n -> n > 5)", type: 'i', fn: (d) => d.filter(n => n > 5) },
                    { id: 'c_list2', text: ".collect(Collectors.toList())", type: 't', fn: (d) => d }
                ]
            },
            {
                id: 3,
                title: "Mission: 특정 패턴 데이터 집계",
                inputType: "List<String>",
                inputValue: ["Apple", "Banana", "Avocado", "Cherry"],
                outputType: "long",
                target: 2,
                options: [
                    { id: 'f_a', text: '.filter(s -> s.startsWith("A"))', type: 'i', fn: (d) => d.filter(s => s.startsWith("A")) },
                    { id: 'f_b', text: '.filter(s -> s.endsWith("a"))', type: 'i', fn: (d) => d.filter(s => s.endsWith("a")) },
                    { id: 'm_upper', text: ".map(String::toUpperCase)", type: 'i', fn: (d) => d.map(s => s.toUpperCase()) },
                    { id: 'm_len', text: ".mapToInt(String::length)", type: 'i', fn: (d) => d.map(s => s.length) },
                    { id: 't_count', text: ".count()", type: 't', fn: (d) => d.length },
                    { id: 'c_list3', text: ".collect(Collectors.toList())", type: 't', fn: (d) => d }
                ]
            },
            {
                id: 4,
                title: "Mission: 데이터 규격화 및 타겟 추출",
                inputType: "String[]",
                // 입력값을 소문자가 섞인 형태로 만들어 map() 사용을 유도
                inputValue: ["java", "Spring", "jpa", "Node"],
                outputType: "List<String>",
                pipelineStart: "Arrays.stream(data)",
                // 타겟은 대문자로 설정 (순서: map -> filter -> collect 강제)
                target: ["JAVA", "JPA"],
                options: [
                    { id: 'm_up', text: ".map(String::toUpperCase)", type: 'i', fn: (d) => d.map(s => s.toUpperCase()) },
                    { id: 'f_j', text: '.filter(s -> s.startsWith("J"))', type: 'i', fn: (d) => d.filter(s => s.startsWith("J")) },
                    { id: 'f_n', text: '.filter(s -> s.contains("o"))', type: 'i', fn: (d) => d.filter(s => s.includes("o")) },
                    { id: 'c_list4', text: ".collect(Collectors.toList())", type: 't', fn: (d) => d }
                ]
            },
            {
                id: 5,
                title: "Mission: 노이즈 제거 및 데이터 정돈",
                inputType: "List<Integer>",
                inputValue: [5, 1, 2, 1, 5, 3],
                outputType: "List<Integer>",
                target: [1, 2, 3, 5],
                options: [
                    { id: 'o_dist', text: ".distinct()", type: 'i', fn: (d) => [...new Set(d)] },
                    { id: 's_asc3', text: ".sorted()", type: 'i', fn: (d) => [...d].sort((a,b) => a-b) },
                    { id: 's_desc3', text: ".sorted(Comparator.reverseOrder())", type: 'i', fn: (d) => [...d].sort((a,b) => b-a) },
                    { id: 'f_odd2', text: ".filter(n -> n % 2 != 0)", type: 'i', fn: (d) => d.filter(n => n % 2 !== 0) },
                    { id: 'c_list5', text: ".collect(Collectors.toList())", type: 't', fn: (d) => d }
                ]
            }
        ];

        let curIdx = 0;
        let activePipeline = [];

        function init() {
            renderDots();
            loadChallenge();
        }

        function renderDots() {
            const container = document.getElementById('level-dots');
            container.innerHTML = challenges.map((_, i) => `
                <div class="w-1.5 h-1.5 rounded-full ${i === curIdx ? 'bg-orange-500 scale-125' : (i < curIdx ? 'bg-emerald-500' : 'bg-slate-700')}"></div>
            `).join('');
        }

        function loadChallenge() {
            const c = challenges[curIdx];
            activePipeline = [];
            
            document.getElementById('level-tag').innerText = `Level ${curIdx + 1}`;
            document.getElementById('quest-title').innerText = c.title;
            
            document.getElementById('ui-input-type').innerText = c.inputType;
            
            // Java 배열 시각적 표현 향상 (String[]인 경우 [] 대신 {} 사용)
            let inputValStr = JSON.stringify(c.inputValue);
            if (c.inputType.includes("[]")) {
                inputValStr = inputValStr.replace(/^\[/, '{').replace(/\]$/, '}');
            }
            document.getElementById('ui-input-value').innerText = inputValStr;
            
            document.getElementById('ui-output-type').innerText = c.outputType;
            document.getElementById('ui-output-value').innerText = JSON.stringify(c.target);
            document.getElementById('res-type-label').innerText = c.outputType;
            
            // 배열 입력 시 Arrays.stream(data) 등 파이프라인 시작점 동적 처리
            document.getElementById('pipeline-start').innerText = `result = ${c.pipelineStart || 'data.stream()'}`;

            renderPalette();
            renderPipeline();
        }

        function renderPalette() {
            const container = document.getElementById('option-palette');
            container.innerHTML = challenges[curIdx].options.map(opt => `
                <button onclick="addToPipeline('${opt.id}')" class="op-btn font-code text-[11px] px-3 py-2 rounded-lg border border-slate-700 bg-slate-900 text-slate-300 hover:border-slate-500 active:scale-95">
                    <span class="text-slate-500 mr-1">+</span> ${opt.text}
                </button>
            `).join('');
        }

        function renderPipeline() {
            const container = document.getElementById('pipeline-list');
            if (activePipeline.length === 0) {
                // 더 밝아진 안내 문구
                container.innerHTML = `<div class="text-slate-400 text-xs italic py-1 pl-6 lg:pl-10 opacity-80">// Select operations from below</div>`;
                return;
            }

            container.innerHTML = activePipeline.map((opt, idx) => `
                <div class="pipeline-item flex items-center group pl-6 lg:pl-8">
                    <span class="text-blue-400 font-code text-sm md:text-base cursor-pointer hover:text-rose-400 transition-colors break-all" onclick="removeFromPipeline(${idx})">
                        &nbsp;&nbsp;&nbsp;&nbsp;${opt.text}
                    </span>
                    <button onclick="removeFromPipeline(${idx})" class="ml-2 opacity-100 lg:opacity-0 lg:group-hover:opacity-100 text-slate-500 hover:text-rose-500 transition-all text-xs shrink-0">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            `).join('');
        }

        function addToPipeline(id) {
            const opt = challenges[curIdx].options.find(o => o.id === id);
            activePipeline.push(opt);
            renderPipeline();
            
            // 자동 스크롤
            const pipelineList = document.getElementById('pipeline-list').parentElement.parentElement;
            pipelineList.scrollTop = pipelineList.scrollHeight;
        }

        function removeFromPipeline(idx) {
            activePipeline.splice(idx, 1);
            renderPipeline();
        }

        function resetPipeline() {
            activePipeline = [];
            renderPipeline();
        }

        function runCode() {
            const c = challenges[curIdx];
            if (activePipeline.length === 0) return alert("연산을 하나 이상 선택하세요.");

            let data = [...c.inputValue];
            let isTerminated = false;
            let errorMsg = null;

            for (let i = 0; i < activePipeline.length; i++) {
                const op = activePipeline[i];
                
                if (isTerminated) {
                    errorMsg = `이미 종료 연산(<code>${activePipeline[i-1].text}</code>)이 수행되어 스트림이 닫혔습니다. 그 뒤에 <code>${op.text}</code>를 사용할 수 없습니다.`;
                    showResult(false, "순서 오류", errorMsg, "N/A");
                    return;
                }

                data = op.fn(data);
                if (op.type === 't') isTerminated = true;
            }

            if (!isTerminated) {
                showResult(false, "종료 연산 누락", "스트림은 종료 연산(예: collect, count)이 있어야 최종 결과를 반환합니다.", "Stream<Reference>");
                return;
            }

            const isCorrect = JSON.stringify(data) === JSON.stringify(c.target);
            if (isCorrect) {
                if (curIdx === challenges.length - 1) {
                    showResult(true, "모든 과정 수료!", "축하합니다!<br>Java Stream Lab의 모든 단계를 완벽하게 클리어하셨습니다!", null, true);
                } else {
                    showResult(true, "정답입니다!", "정확한 스트림 파이프라인을 설계했습니다.");
                }
            } else {
                let actualValStr = JSON.stringify(data);
                if (c.outputType && c.outputType.includes("[]")) {
                    actualValStr = actualValStr.replace(/^\[/, '{').replace(/\]$/, '}');
                }
                showResult(false, "결과 불일치", "파이프라인 결과가 목표값과 다릅니다. 연산의 순서나 종류를 확인하세요.", actualValStr);
            }
        }

        function showResult(success, title, text, actual, isFinal = false) {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            const iconBg = document.getElementById('modal-icon-bg');
            const icon = document.getElementById('modal-icon');
            const btnNext = document.getElementById('btn-next');
            const btnRetry = document.getElementById('btn-retry');
            const errorView = document.getElementById('error-view');

            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-text').innerHTML = text;

            if (success) {
                iconBg.className = "w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 bg-emerald-500 shadow-lg shadow-emerald-200";
                icon.className = "fa-solid fa-check text-2xl text-white";
                btnNext.classList.remove('hidden');
                btnRetry.classList.add('hidden');
                errorView.classList.add('hidden');
                btnNext.innerText = isFinal ? "처음부터 다시하기" : "다음 단계로";
            } else {
                iconBg.className = "w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 bg-rose-500 shadow-lg shadow-rose-200";
                icon.className = "fa-solid fa-xmark text-2xl text-white";
                btnNext.classList.add('hidden');
                btnRetry.classList.remove('hidden');
                errorView.classList.remove('hidden');
                document.getElementById('actual-val').innerText = actual;
            }

            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
            }, 50);
        }

        function closeModal() {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
            }, 200);
        }

        function goNext() {
            closeModal();
            if (curIdx < challenges.length - 1) {
                curIdx++;
                init();
            } else {
                curIdx = 0;
                init();
            }
        }

        window.onload = init;
    </script>
</body>
</html>
