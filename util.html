<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 투두 캘린더</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 기본 폰트 및 리셋 */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            line-height: 1.5;
            padding: 1rem;
        }

        @media (min-width: 768px) {
            body { padding: 2rem; }
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        /* 헤더 스타일 */
        header {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        @media (min-width: 1024px) {
            header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .title-group {
            text-align: center;
        }

        @media (min-width: 1024px) {
            .title-group { text-align: left; }
        }

        .title-group h1 {
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        @media (min-width: 768px) {
            .title-group h1 { font-size: 1.5rem; }
        }

        @media (min-width: 1024px) {
            .title-group h1 { justify-content: flex-start; }
        }

        .title-group p {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 0.25rem;
        }

        .highlight-blue {
            color: #2563eb;
            font-weight: 600;
        }

        /* 컨트롤 그룹 (토글, 네비게이션, 추가 버튼) */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
        }

        @media (min-width: 640px) {
            .controls {
                flex-direction: row;
                justify-content: center;
                width: auto;
            }
        }

        /* 뷰 토글 버튼 */
        .view-toggle {
            display: flex;
            background: white;
            padding: 0.375rem;
            border-radius: 1rem;
            border: 1px solid #e2e8f0;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            width: 100%;
        }

        @media (min-width: 640px) {
            .view-toggle { width: auto; }
        }

        .toggle-btn {
            flex: 1;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            white-space: nowrap;
            background: transparent;
            color: #475569;
        }

        .toggle-btn.active {
            background-color: #2563eb;
            color: white;
        }

        /* 네비게이션 & 추가 버튼 그룹 */
        .action-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            width: 100%;
        }

        @media (min-width: 640px) {
            .action-group { width: auto; }
        }

        .nav-wrapper {
            display: flex;
            align-items: center;
            background: white;
            border-radius: 1rem;
            border: 1px solid #e2e8f0;
            padding: 0.25rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .nav-btn {
            background: none;
            border: none;
            padding: 0.5rem;
            border-radius: 0.75rem;
            cursor: pointer;
            color: #475569;
            transition: background 0.2s;
        }

        .nav-btn:hover { background-color: #f1f5f9; }

        .current-date {
            font-size: 0.875rem;
            font-weight: 700;
            min-width: 110px;
            text-align: center;
            white-space: nowrap;
        }

        .add-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 0.75rem 1.25rem;
            border-radius: 1rem;
            font-weight: 700;
            font-size: 0.875rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.2);
            transition: background 0.2s;
        }

        .add-btn:hover { background-color: #1d4ed8; }

        /* 미지정 일정 섹션 */
        .undated-section {
            background: white;
            border: 2px dashed #cbd5e1;
            border-radius: 1.25rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .section-title {
            font-size: 0.875rem;
            font-weight: 700;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .count-badge {
            font-size: 0.7rem;
            font-weight: 700;
            background-color: #dbeafe;
            color: #2563eb;
            padding: 0.125rem 0.5rem;
            border-radius: 9999px;
        }

        .undated-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.75rem;
            max-height: 150px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        @media (min-width: 768px) {
            .undated-list { grid-template-columns: repeat(3, 1fr); }
        }

        @media (min-width: 1024px) {
            .undated-list { grid-template-columns: repeat(4, 1fr); }
        }

        /* 캘린더 그리드 */
        .calendar-wrapper { overflow-x: hidden; }

        .weekday-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            margin-bottom: 0.5rem;
        }

        .weekday-name {
            text-align: center;
            padding: 0.5rem 0;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
        }

        .weekday-name.sun { color: #ef4444; }
        .weekday-name.sat { color: #3b82f6; }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.5rem;
        }

        @media (min-width: 768px) {
            .calendar-grid { gap: 0.75rem; }
        }

        .day-cell {
            min-height: 140px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            transition: border-color 0.2s;
        }

        @media (min-width: 768px) {
            .day-cell { min-height: 160px; padding: 0.75rem; }
        }

        .view-week .day-cell { min-height: 350px; }
        @media (min-width: 768px) {
            .view-week .day-cell { min-height: 450px; }
        }

        .day-cell.today {
            background-color: #eff6ff;
            border-color: #bfdbfe;
            box-shadow: inset 0 0 0 2px #dbeafe;
        }

        .day-cell.empty {
            background-color: rgba(241, 245, 249, 0.3);
            border: none;
        }

        .cell-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.25rem;
        }

        .day-number {
            font-size: 0.75rem;
            font-weight: 700;
            width: 1.5rem;
            height: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            color: #64748b;
        }

        .today .day-number {
            background-color: #2563eb;
            color: white;
        }

        .cell-stat {
            font-size: 0.55rem;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
        }

        /* 투두 아이템 */
        .task-container {
            flex: 1;
            overflow-y: auto;
            margin-top: 0.5rem;
        }

        .task-item {
            font-size: 0.7rem;
            padding: 0.4rem 0.5rem;
            margin-bottom: 0.25rem;
            border-radius: 0.5rem;
            background-color: #f1f5f9;
            cursor: pointer;
            display: flex;
            align-items: flex-start;
            gap: 0.4rem;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .task-item:hover {
            border-color: #3b82f6;
            background-color: #f8fafc;
        }

        .task-item.completed {
            opacity: 0.5;
            text-decoration: line-through;
            background-color: #f8fafc;
        }

        .task-item i {
            margin-top: 0.15rem;
            flex-shrink: 0;
            font-size: 0.75rem;
        }

        .task-item span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .empty-label {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed #f1f5f9;
            border-radius: 0.75rem;
            color: #cbd5e1;
            font-size: 0.55rem;
            font-style: italic;
        }

        /* 모달 스타일 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-overlay.active { display: flex; }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 448px;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            animation: modalIn 0.2s ease-out;
        }

        @keyframes modalIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-body { padding: 1.5rem; }
        @media (min-width: 768px) { .modal-body { padding: 2rem; } }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-header h3 { font-size: 1.25rem; font-weight: 700; color: #1e293b; }

        .close-x-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.25rem;
            cursor: pointer;
            padding: 0.5rem;
        }

        .form-group { margin-bottom: 1.5rem; }
        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 700;
            color: #64748b;
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            border-radius: 0.75rem;
            border: 1px solid #e2e8f0;
            outline: none;
            transition: border-color 0.2s;
            font-size: 0.875rem;
        }

        .form-input:focus { border-color: #2563eb; border-width: 2px; padding: 0.8125rem 0.9375rem; }

        .form-info {
            font-size: 0.7rem;
            color: #3b82f6;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .modal-footer {
            display: flex;
            gap: 0.75rem;
            margin-top: 2.5rem;
        }

        .btn-cancel {
            flex: 1;
            padding: 0.875rem;
            border-radius: 0.75rem;
            border: 1px solid #e2e8f0;
            background: white;
            color: #475569;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-save {
            flex: 1;
            padding: 0.875rem;
            border-radius: 0.75rem;
            border: none;
            background: #2563eb;
            color: white;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.1);
        }

        /* 스크롤바 커스텀 */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="title-group">
                <h1><i class="fa-solid fa-calendar-check text-blue-600"></i> 스마트 투두 캘린더</h1>
                <p><span class="highlight-blue">날짜 미지정 일정 중</span> 미완료된 항목만 자동으로 오늘 박스로 이동합니다.</p>
            </div>

            <div class="controls">
                <!-- View Toggle -->
                <div class="view-toggle">
                    <button id="viewMonth" class="toggle-btn active">
                        <i class="fa-solid fa-table-cells-large"></i>월간
                    </button>
                    <button id="viewWeek" class="toggle-btn">
                        <i class="fa-solid fa-grip-lines"></i>주간
                    </button>
                </div>

                <!-- Navigation & Add -->
                <div class="action-group">
                    <div class="nav-wrapper">
                        <button id="prevBtn" class="nav-btn"><i class="fa-solid fa-chevron-left"></i></button>
                        <span id="currentDisplayDate" class="current-date">2024년 1월</span>
                        <button id="nextBtn" class="nav-btn"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                    <button id="openModalBtn" class="add-btn">
                        <i class="fa-solid fa-plus"></i> 일정 추가
                    </button>
                </div>
            </div>
        </header>

        <!-- Undated Tasks Section -->
        <section class="undated-section">
            <div class="section-header">
                <h3 class="section-title">
                    <i class="fa-solid fa-layer-group text-blue-500"></i>
                    날짜 미지정 일정 (오늘 기준)
                </h3>
                <span id="undatedCount" class="count-badge">0</span>
            </div>
            <div id="undatedTaskList" class="undated-list custom-scrollbar">
                <!-- JS handles rendering -->
            </div>
        </section>

        <!-- Calendar -->
        <div class="calendar-wrapper">
            <div class="weekday-header">
                <div class="weekday-name sun">Sun</div>
                <div class="weekday-name">Mon</div>
                <div class="weekday-name">Tue</div>
                <div class="weekday-name">Wed</div>
                <div class="weekday-name">Thu</div>
                <div class="weekday-name">Fri</div>
                <div class="weekday-name sat">Sat</div>
            </div>
            <div id="calendarGrid" class="calendar-grid">
                <!-- JS handles rendering -->
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="taskModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-body">
                <div class="modal-header">
                    <h3>새로운 일정 추가</h3>
                    <button id="closeModalBtnX" class="close-x-btn"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="form-group">
                    <label>할 일 제목</label>
                    <input id="taskTitleInput" type="text" placeholder="예: 보고서 작성하기" class="form-input">
                </div>
                <div class="form-group">
                    <label>실행 날짜</label>
                    <input id="taskDateInput" type="date" class="form-input">
                    <p class="form-info">
                        <i class="fa-solid fa-circle-info"></i> 날짜 미입력 시 상단 '미지정' 박스에 추가됩니다.
                    </p>
                </div>
                <div class="modal-footer">
                    <button id="closeModalBtn" class="btn-cancel">취소</button>
                    <button id="saveTaskBtn" class="btn-save">일정 저장</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- State ---
        let tasks = JSON.parse(localStorage.getItem('calendar_tasks_pure_css')) || [];
        let viewMode = 'month'; 
        let currentRefDate = new Date();

        // --- Elements ---
        const calendarGrid = document.getElementById('calendarGrid');
        const undatedTaskList = document.getElementById('undatedTaskList');
        const undatedCount = document.getElementById('undatedCount');
        const currentDisplayDate = document.getElementById('currentDisplayDate');
        const viewMonthBtn = document.getElementById('viewMonth');
        const viewWeekBtn = document.getElementById('viewWeek');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const closeModalBtnX = document.getElementById('closeModalBtnX');
        const taskModal = document.getElementById('taskModal');
        const saveTaskBtn = document.getElementById('saveTaskBtn');
        const taskTitleInput = document.getElementById('taskTitleInput');
        const taskDateInput = document.getElementById('taskDateInput');

        // --- Functions ---
        function formatDate(date) {
            return date.toISOString().split('T')[0];
        }

        function isToday(date) {
            return formatDate(date) === formatDate(new Date());
        }

        function saveTasks() {
            localStorage.setItem('calendar_tasks_pure_css', JSON.stringify(tasks));
        }

        // Logic: Move ONLY "Undated" incomplete tasks to today
        function rolloverTasks() {
            const todayStr = formatDate(new Date());
            let updated = false;
            tasks = tasks.map(task => {
                if (task.isUndated && !task.completed && task.date < todayStr) {
                    updated = true;
                    return { ...task, date: todayStr };
                }
                return task;
            });
            if (updated) saveTasks();
        }

        function toggleTask(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            saveTasks();
            render();
        }

        function createTaskElement(task) {
            const div = document.createElement('div');
            div.className = `task-item ${task.completed ? 'completed' : ''}`;
            div.onclick = (e) => {
                e.stopPropagation();
                toggleTask(task.id);
            };
            div.innerHTML = `
                <i class="fa-regular ${task.completed ? 'fa-circle-check' : 'fa-circle'}" 
                   style="color: ${task.completed ? '#10b981' : '#94a3b8'}"></i>
                <span title="${task.title}">${task.title}</span>
            `;
            return div;
        }

        function render() {
            const todayStr = formatDate(new Date());
            calendarGrid.innerHTML = '';
            undatedTaskList.innerHTML = '';
            
            // View Mode Class
            if (viewMode === 'week') calendarGrid.parentElement.classList.add('view-week');
            else calendarGrid.parentElement.classList.remove('view-week');

            const year = currentRefDate.getFullYear();
            const month = currentRefDate.getMonth();
            currentDisplayDate.textContent = `${year}년 ${month + 1}월`;

            // 1. Render Undated Tasks Box (for Today)
            const todayUndated = tasks.filter(t => t.isUndated && t.date === todayStr);
            undatedCount.textContent = todayUndated.length;

            if (todayUndated.length > 0) {
                todayUndated.forEach(t => undatedTaskList.appendChild(createTaskElement(t)));
            } else {
                undatedTaskList.innerHTML = '<div class="empty-label">오늘 지정된 미지정 일정이 없습니다.</div>';
            }

            // 2. Prepare Calendar Grid Dates
            let datesToRender = [];
            if (viewMode === 'month') {
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                for (let i = 0; i < firstDay; i++) datesToRender.push(null);
                for (let i = 1; i <= daysInMonth; i++) datesToRender.push(new Date(year, month, i));
            } else {
                const startOfWeek = new Date(currentRefDate);
                startOfWeek.setDate(currentRefDate.getDate() - currentRefDate.getDay());
                for (let i = 0; i < 7; i++) {
                    const d = new Date(startOfWeek);
                    d.setDate(startOfWeek.getDate() + i);
                    datesToRender.push(d);
                }
            }

            // 3. Render Calendar Cells
            datesToRender.forEach((date) => {
                const cell = document.createElement('div');
                if (!date) {
                    cell.className = 'day-cell empty';
                    calendarGrid.appendChild(cell);
                    return;
                }

                const dateStr = formatDate(date);
                const dayTasks = tasks.filter(t => !t.isUndated && t.date === dateStr);
                const isTodayDate = isToday(date);
                cell.className = `day-cell ${isTodayDate ? 'today' : ''}`;
                
                const taskContainer = document.createElement('div');
                taskContainer.className = 'task-container custom-scrollbar';
                
                if (dayTasks.length > 0) {
                    dayTasks.forEach(t => taskContainer.appendChild(createTaskElement(t)));
                } else {
                    taskContainer.innerHTML = '<div class="empty-label">없음</div>';
                }

                cell.innerHTML = `
                    <div class="cell-header">
                        <span class="day-number">${date.getDate()}</span>
                        ${dayTasks.length > 0 ? `<span class="cell-stat">${dayTasks.filter(t => t.completed).length}/${dayTasks.length}</span>` : ''}
                    </div>
                `;
                cell.appendChild(taskContainer);
                calendarGrid.appendChild(cell);
            });
        }

        // --- Event Listeners ---
        viewMonthBtn.onclick = () => {
            viewMode = 'month';
            viewMonthBtn.classList.add('active');
            viewWeekBtn.classList.remove('active');
            render();
        };

        viewWeekBtn.onclick = () => {
            viewMode = 'week';
            viewWeekBtn.classList.add('active');
            viewMonthBtn.classList.remove('active');
            render();
        };

        prevBtn.onclick = () => {
            if (viewMode === 'month') currentRefDate.setMonth(currentRefDate.getMonth() - 1);
            else currentRefDate.setDate(currentRefDate.getDate() - 7);
            render();
        };

        nextBtn.onclick = () => {
            if (viewMode === 'month') currentRefDate.setMonth(currentRefDate.getMonth() + 1);
            else currentRefDate.setDate(currentRefDate.getDate() + 7);
            render();
        };

        openModalBtn.onclick = () => {
            taskModal.classList.add('active');
            taskTitleInput.focus();
        };

        const closeAllModals = () => {
            taskModal.classList.remove('active');
            taskTitleInput.value = '';
            taskDateInput.value = '';
        };

        closeModalBtn.onclick = closeAllModals;
        closeModalBtnX.onclick = closeAllModals;

        saveTaskBtn.onclick = () => {
            const title = taskTitleInput.value.trim();
            if (!title) return;
            const dateValue = taskDateInput.value;
            const isUndated = !dateValue;
            const newTask = {
                id: Date.now(),
                title: title,
                date: isUndated ? formatDate(new Date()) : dateValue,
                isUndated: isUndated,
                completed: false
            };
            tasks.push(newTask);
            saveTasks();
            closeAllModals();
            render();
        };

        // --- Initialization ---
        window.onload = () => {
            rolloverTasks();
            render();
        };
    </script>
</body>
</html>
