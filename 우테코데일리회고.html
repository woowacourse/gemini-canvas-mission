<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우테코 데일리 회고</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        .wooteco-bg { background-color: #2ac1bc; }
        .wooteco-text { color: #2ac1bc; }
        .wooteco-border { border-color: #2ac1bc; }
        .wooteco-hover:hover { background-color: #24a8a4; }
        
        .emoji-btn {
            transition: transform 0.2s, background-color 0.2s;
        }
        .emoji-btn.selected {
            transform: scale(1.2);
            background-color: #e5e7eb;
            border-color: #2ac1bc;
            border-width: 2px;
        }
        
        /* Custom scrollbar for textareas */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col items-center justify-center p-4 md:p-0">

    <!-- Loading Screen -->
    <div id="loading-screen" class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden h-[600px] flex flex-col items-center justify-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 wooteco-border mb-4"></div>
        <p class="text-gray-500 font-medium">크루의 기록을 불러오는 중...</p>
    </div>

    <!-- App Container -->
    <div id="app-container" class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden h-[800px] max-h-screen hidden flex-col">
        
        <!-- Header -->
        <header class="wooteco-bg text-white p-4 flex justify-between items-center shadow-md z-10">
            <h1 class="font-bold text-xl tracking-tight flex items-center gap-2">
                <span>🌱</span> 우테코 데일리 회고
            </h1>
            <button id="nav-calendar-btn" class="hidden text-white/80 hover:text-white font-medium text-sm">
                달력 보기
            </button>
            <button id="nav-write-btn" class="hidden text-white/80 hover:text-white font-medium text-sm">
                오늘의 회고
            </button>
        </header>

        <!-- Write Section -->
        <section id="write-section" class="flex-1 overflow-y-auto p-6 hidden flex-col bg-gray-50 fade-in">
            <div class="mb-6 text-center">
                <h2 id="write-date-display" class="text-lg font-bold text-gray-700">2023년 10월 25일</h2>
                <p class="text-sm text-gray-500 mt-1">오늘 하루도 고생 많으셨습니다! 👏</p>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-bold text-gray-700 mb-2">오늘의 기분은 어땠나요?</label>
                <div class="flex justify-between bg-white p-3 rounded-xl shadow-sm border border-gray-100" id="emoji-container">
                    <button class="emoji-btn text-2xl p-2 rounded-lg cursor-pointer" data-emoji="🤩">🤩</button>
                    <button class="emoji-btn text-2xl p-2 rounded-lg cursor-pointer" data-emoji="😊">😊</button>
                    <button class="emoji-btn text-2xl p-2 rounded-lg cursor-pointer" data-emoji="😌">😌</button>
                    <button class="emoji-btn text-2xl p-2 rounded-lg cursor-pointer" data-emoji="🤔">🤔</button>
                    <button class="emoji-btn text-2xl p-2 rounded-lg cursor-pointer" data-emoji="😢">😢</button>
                    <button class="emoji-btn text-2xl p-2 rounded-lg cursor-pointer" data-emoji="🤯">🤯</button>
                </div>
            </div>

            <div class="mb-5 flex-1 flex flex-col">
                <label class="block text-sm font-bold text-gray-700 mb-2">🚀 오늘 한 일</label>
                <textarea id="input-done" class="w-full flex-1 p-4 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#2ac1bc] focus:border-transparent resize-none shadow-sm" placeholder="오늘 학습한 내용, 구현한 기능, 페어 프로그래밍 경험 등을 자유롭게 적어주세요."></textarea>
            </div>

            <div class="mb-6 flex-1 flex flex-col">
                <label class="block text-sm font-bold text-gray-700 mb-2">💡 아쉬운 점 및 개선할 점</label>
                <textarea id="input-regret" class="w-full flex-1 p-4 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#2ac1bc] focus:border-transparent resize-none shadow-sm" placeholder="부족했던 점, 내일 보완할 점을 적어주세요."></textarea>
            </div>

            <button id="save-btn" class="w-full wooteco-bg hover:bg-[#24a8a4] text-white font-bold py-4 rounded-xl shadow-md transition-colors text-lg mt-auto">
                회고 저장하기
            </button>
        </section>

        <!-- Calendar Section -->
        <section id="calendar-section" class="flex-1 overflow-y-auto p-4 hidden flex-col bg-white fade-in">
            <div class="flex justify-between items-center mb-6 px-2 mt-2">
                <button id="prev-month" class="p-2 hover:bg-gray-100 rounded-full transition-colors text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <h2 id="calendar-month-display" class="text-xl font-bold text-gray-800">2023년 10월</h2>
                <button id="next-month" class="p-2 hover:bg-gray-100 rounded-full transition-colors text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>

            <div class="grid grid-cols-7 gap-1 mb-2">
                <div class="text-center text-xs font-semibold text-red-500 py-2">일</div>
                <div class="text-center text-xs font-semibold text-gray-500 py-2">월</div>
                <div class="text-center text-xs font-semibold text-gray-500 py-2">화</div>
                <div class="text-center text-xs font-semibold text-gray-500 py-2">수</div>
                <div class="text-center text-xs font-semibold text-gray-500 py-2">목</div>
                <div class="text-center text-xs font-semibold text-gray-500 py-2">금</div>
                <div class="text-center text-xs font-semibold text-blue-500 py-2">토</div>
            </div>

            <div id="calendar-grid" class="grid grid-cols-7 gap-1 auto-rows-[4.5rem] flex-1 pb-4">
                <!-- Calendar days will be injected here -->
            </div>
            
            <div class="mt-auto pt-4 border-t border-gray-100 flex items-center justify-between px-2 text-sm text-gray-500">
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 rounded-full wooteco-bg"></div>
                    <span>회고 작성됨</span>
                </div>
                <span>* 작성은 익일 오전 6시까지 가능</span>
            </div>
        </section>

    </div>

    <!-- Modal for viewing/editing record -->
    <div id="record-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4 fade-in">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md max-h-[90vh] flex flex-col overflow-hidden">
            <div class="p-4 border-b border-gray-100 flex justify-between items-center wooteco-bg text-white">
                <h3 id="modal-date" class="font-bold text-lg">2023년 10월 25일 회고</h3>
                <button id="close-modal-btn" class="text-white hover:text-gray-200 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-6 overflow-y-auto flex-1 bg-gray-50">
                <div class="flex justify-center mb-6">
                    <div id="modal-emoji" class="text-5xl bg-white p-4 rounded-full shadow-sm">🤩</div>
                </div>
                <div class="mb-6 bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                    <h4 class="text-sm font-bold text-gray-500 mb-2 border-b pb-2 flex items-center gap-2">🚀 오늘 한 일</h4>
                    <p id="modal-done" class="text-gray-800 whitespace-pre-wrap leading-relaxed min-h-[4rem]"></p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                    <h4 class="text-sm font-bold text-gray-500 mb-2 border-b pb-2 flex items-center gap-2">💡 아쉬운 점</h4>
                    <p id="modal-regret" class="text-gray-800 whitespace-pre-wrap leading-relaxed min-h-[4rem]"></p>
                </div>
            </div>
            <div id="modal-action-area" class="p-4 border-t border-gray-100 bg-white">
                <button id="edit-record-btn" class="w-full border-2 wooteco-border wooteco-text hover:bg-teal-50 font-bold py-3 rounded-xl transition-colors hidden">
                    수정하기 (오전 6시 전까지 가능)
                </button>
                <p id="modal-readonly-msg" class="text-center text-sm text-gray-500 py-2 hidden">
                    하루가 지나 수정할 수 없는 기록입니다.
                </p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration & Initialization
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'wooteco-retro-app';
        let currentUser = null;
        let unsubscribeSnapshot = null;

        // State
        let records = {}; // { 'YYYY-MM-DD': { done, regret, emoji } }
        let currentMonth = new Date();
        let selectedEmoji = '😊';

        // 목데이터 생성 함수 (오늘 기준 과거 5일치)
        function getMockData() {
            const mocks = {};
            const todayLogicalDate = new Date(getLogicalDate());
            
            const mockEntries = [
                { emoji: '🤩', done: '레이싱카 미션 1단계 PR 보냄!\n페어랑 소통이 너무 잘 돼서 기분이 좋다.', regret: '테스트 코드 엣지 케이스를 더 꼼꼼히 찾지 못한 점.' },
                { emoji: '🤯', done: '자바스크립트 비동기 처리 학습.\n처음엔 이해가 안갔는데 계속 보니 조금 알 것 같다.', regret: '시간 관리가 안 돼서 늦게까지 깨어있었다. 컨디션 조절 필요.' },
                { emoji: '😌', done: '코드 리뷰 반영해서 리팩토링 진행.\n클래스 분리하니까 코드가 훨씬 깔끔해졌다.', regret: '메서드 이름 짓는 게 너무 오래 걸린다.' },
                { emoji: '😊', done: '새로운 페어와 인사하고 그라운드 룰 정함.\n순조로운 출발!', regret: '환경 세팅에서 에러가 나서 1시간 날림 ㅠㅠ' },
                { emoji: '🤔', done: 'MVC 패턴에 대해 토론함.', regret: '아직 개념이 완벽하게 잡히지 않아서 주말에 복습해야겠다.' }
            ];

            for(let i=1; i<=5; i++) {
                const d = new Date(todayLogicalDate);
                d.setDate(d.getDate() - i);
                const dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                mocks[dateStr] = mockEntries[i-1];
            }
            return mocks;
        }

        // DOM Elements
        const elLoading = document.getElementById('loading-screen');
        const elApp = document.getElementById('app-container');
        const secWrite = document.getElementById('write-section');
        const secCalendar = document.getElementById('calendar-section');
        
        const navWriteBtn = document.getElementById('nav-write-btn');
        const navCalendarBtn = document.getElementById('nav-calendar-btn');
        
        // Write Elements
        const emojiBtns = document.querySelectorAll('.emoji-btn');
        const inputDone = document.getElementById('input-done');
        const inputRegret = document.getElementById('input-regret');
        const saveBtn = document.getElementById('save-btn');
        const writeDateDisplay = document.getElementById('write-date-display');
        
        // Calendar Elements
        const calendarGrid = document.getElementById('calendar-grid');
        const calendarMonthDisplay = document.getElementById('calendar-month-display');
        const prevMonthBtn = document.getElementById('prev-month');
        const nextMonthBtn = document.getElementById('next-month');
        
        // Modal Elements
        const modal = document.getElementById('record-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const editRecordBtn = document.getElementById('edit-record-btn');
        const modalReadonlyMsg = document.getElementById('modal-readonly-msg');

        // Logic: Get "Logical Date" (Day resets at 06:00 AM)
        function getLogicalDate(dateObj = new Date()) {
            const d = new Date(dateObj);
            if (d.getHours() < 6) {
                d.setDate(d.getDate() - 1);
            }
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // Format date string for display
        function formatDisplayDate(dateStr) {
            const [year, month, day] = dateStr.split('-');
            return `${year}년 ${parseInt(month)}월 ${parseInt(day)}일`;
        }

        // Initialize App
        async function init() {
            try {
                // Auth setup
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUser = user;
                        loadData();
                    }
                });

                setupEventListeners();
                
            } catch (error) {
                console.error("Initialization error:", error);
                alert("초기화 중 오류가 발생했습니다.");
            }
        }

        // Load Data from Firestore
        function loadData() {
            if (!currentUser) return;

            const retrosRef = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'retrospectives');
            
            if (unsubscribeSnapshot) unsubscribeSnapshot();

            unsubscribeSnapshot = onSnapshot(retrosRef, (snapshot) => {
                const fetchedRecords = {};
                snapshot.forEach((doc) => {
                    fetchedRecords[doc.id] = doc.data();
                });

                // 목데이터와 실제 데이터 병합 (실제가 덮어씌움)
                records = { ...getMockData(), ...fetchedRecords };

                // Check routing after data is loaded
                checkInitialRouting();

                // Hide loading, show app
                elLoading.classList.add('hidden');
                elApp.classList.remove('hidden');
                elApp.classList.add('flex');

                // Update view if calendar is active
                if (!secCalendar.classList.contains('hidden')) {
                    renderCalendar();
                }

            }, (error) => {
                console.error("Error fetching records:", error);
            });
        }

        // Routing Logic
        function checkInitialRouting() {
            const todayLogical = getLogicalDate();
            if (records[todayLogical]) {
                // Already wrote today's retro
                showCalendar();
            } else {
                // Needs to write today's retro
                showWriteForm(todayLogical);
            }
        }

        function showWriteForm(targetDate, existingData = null) {
            secCalendar.classList.add('hidden');
            secWrite.classList.remove('hidden');
            
            navCalendarBtn.classList.remove('hidden');
            navWriteBtn.classList.add('hidden');

            writeDateDisplay.textContent = formatDisplayDate(targetDate);
            
            if (existingData) {
                inputDone.value = existingData.done || '';
                inputRegret.value = existingData.regret || '';
                selectEmoji(existingData.emoji || '😊');
                saveBtn.textContent = '회고 수정하기';
            } else {
                inputDone.value = '';
                inputRegret.value = '';
                selectEmoji('😊');
                saveBtn.textContent = '회고 저장하기';
            }
            
            // Focus on first input for convenience
            inputDone.focus();
        }

        function showCalendar() {
            secWrite.classList.add('hidden');
            secCalendar.classList.remove('hidden');
            
            navWriteBtn.classList.remove('hidden');
            navCalendarBtn.classList.add('hidden');

            // Set calendar to the logical current month by default
            const todayLogicalDate = new Date(getLogicalDate());
            currentMonth = new Date(todayLogicalDate.getFullYear(), todayLogicalDate.getMonth(), 1);
            
            renderCalendar();
        }

        // Setup Event Listeners
        function setupEventListeners() {
            // Navigation
            navWriteBtn.addEventListener('click', () => {
                const todayLogical = getLogicalDate();
                if(records[todayLogical]) {
                    showWriteForm(todayLogical, records[todayLogical]);
                } else {
                    showWriteForm(todayLogical);
                }
            });
            navCalendarBtn.addEventListener('click', showCalendar);

            // Emoji Selection
            emojiBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    selectEmoji(e.target.dataset.emoji);
                });
            });

            // Save Action
            saveBtn.addEventListener('click', handleSave);

            // Calendar Navigation
            prevMonthBtn.addEventListener('click', () => {
                currentMonth.setMonth(currentMonth.getMonth() - 1);
                renderCalendar();
            });
            nextMonthBtn.addEventListener('click', () => {
                currentMonth.setMonth(currentMonth.getMonth() + 1);
                renderCalendar();
            });

            // Modal Close
            closeModalBtn.addEventListener('click', () => {
                modal.classList.add('hidden');
            });
            modal.addEventListener('click', (e) => {
                if(e.target === modal) modal.classList.add('hidden');
            });
            
            // Edit from Modal
            editRecordBtn.addEventListener('click', () => {
                modal.classList.add('hidden');
                const todayLogical = getLogicalDate();
                if(records[todayLogical]) {
                    showWriteForm(todayLogical, records[todayLogical]);
                }
            });
        }

        function selectEmoji(emoji) {
            selectedEmoji = emoji;
            emojiBtns.forEach(b => b.classList.remove('selected'));
            const selectedBtn = Array.from(emojiBtns).find(b => b.dataset.emoji === emoji);
            if (selectedBtn) selectedBtn.classList.add('selected');
        }

        async function handleSave() {
            if (!currentUser) return;
            
            const done = inputDone.value.trim();
            const regret = inputRegret.value.trim();

            if (!done) {
                // Using modern approach instead of alert
                inputDone.focus();
                inputDone.classList.add('ring-red-400', 'ring-2');
                setTimeout(() => inputDone.classList.remove('ring-red-400', 'ring-2'), 1000);
                return;
            }

            const todayLogical = getLogicalDate();
            
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<div class="animate-spin inline-block w-5 h-5 border-[3px] border-current border-t-transparent text-white rounded-full" role="status" aria-label="loading"></div> 저장 중...';

            try {
                const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'retrospectives', todayLogical);
                await setDoc(docRef, {
                    done,
                    regret,
                    emoji: selectedEmoji,
                    updatedAt: serverTimestamp()
                }, { merge: true });

                // Successfully saved. 
                // Wait briefly for UX, then switch to calendar.
                setTimeout(() => {
                    saveBtn.disabled = false;
                    saveBtn.textContent = '회고 저장하기';
                    showCalendar();
                }, 500);

            } catch (error) {
                console.error("Save error:", error);
                saveBtn.disabled = false;
                saveBtn.textContent = '저장 실패. 다시 시도해주세요.';
                setTimeout(() => { saveBtn.textContent = '회고 저장하기'; }, 2000);
            }
        }

        // Render Calendar Grid
        function renderCalendar() {
            calendarGrid.innerHTML = '';
            
            const year = currentMonth.getFullYear();
            const month = currentMonth.getMonth();
            
            calendarMonthDisplay.textContent = `${year}년 ${month + 1}월`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const todayLogical = getLogicalDate();

            // Empty cells for days before the 1st
            for (let i = 0; i < firstDay; i++) {
                const cell = document.createElement('div');
                cell.className = 'p-1';
                calendarGrid.appendChild(cell);
            }

            // Days of the month
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const hasRecord = !!records[dateStr];
                const isTodayLogical = dateStr === todayLogical;

                const cell = document.createElement('div');
                cell.className = `relative flex flex-col items-center justify-center rounded-xl cursor-pointer transition-all ${isTodayLogical ? 'ring-2 ring-[#2ac1bc] bg-teal-50/30' : 'hover:bg-gray-100'}`;
                
                // Day number
                let dayColor = 'text-gray-700';
                const dayOfWeek = new Date(year, month, day).getDay();
                if (dayOfWeek === 0) dayColor = 'text-red-500';
                if (dayOfWeek === 6) dayColor = 'text-blue-500';
                
                cell.innerHTML = `
                    <span class="absolute top-1.5 left-2 text-xs font-semibold ${dayColor} z-10">${day}</span>
                `;

                // Render Data Indicator
                if (hasRecord) {
                    const record = records[dateStr];
                    cell.innerHTML += `
                        <div class="text-3xl mt-3 z-0 pointer-events-none">${record.emoji}</div>
                    `;
                    cell.addEventListener('click', () => openModal(dateStr, record));
                } else if (isTodayLogical) {
                    // Empty state for today
                    cell.innerHTML += `
                        <div class="w-2 h-2 rounded-full wooteco-bg mt-4"></div>
                    `;
                    cell.addEventListener('click', () => {
                        showWriteForm(dateStr);
                    });
                } else {
                    // Empty past/future date
                    cell.addEventListener('click', () => {
                        // Shake effect or simple log indicating no record
                        cell.classList.add('bg-gray-100');
                        setTimeout(() => cell.classList.remove('bg-gray-100'), 200);
                    });
                }

                calendarGrid.appendChild(cell);
            }
        }

        // Open Modal to view a record
        function openModal(dateStr, record) {
            document.getElementById('modal-date').textContent = formatDisplayDate(dateStr) + ' 회고';
            document.getElementById('modal-emoji').textContent = record.emoji;
            document.getElementById('modal-done').textContent = record.done || '기록이 없습니다.';
            document.getElementById('modal-regret').textContent = record.regret || '기록이 없습니다.';

            const todayLogical = getLogicalDate();
            
            if (dateStr === todayLogical) {
                // Editable (Before 6 AM next day)
                editRecordBtn.classList.remove('hidden');
                modalReadonlyMsg.classList.add('hidden');
            } else {
                // Read Only (After 6 AM next day)
                editRecordBtn.classList.add('hidden');
                modalReadonlyMsg.classList.remove('hidden');
            }

            modal.classList.remove('hidden');
        }

        // Start App
        init();

    </script>
</body>
</html>
