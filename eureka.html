<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유레카 (Eureka) - 아하! 모먼트 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f8fafc;
        }

        .card-huh {
            background-color: #ffffff;
            border-left: 4px solid #fbbf24;
        }

        .green-lv1 { background-color: #f0fdf4; border-left: 4px solid #4ade80; color: #166534; }
        .green-lv2 { background-color: #dcfce7; border-left: 4px solid #22c55e; color: #15803d; }
        .green-lv3 { background-color: #bbf7d0; border-left: 4px solid #16a34a; color: #166534; }
        .green-lv4 { background-color: #166534; border-left: 4px solid #14532d; color: #ffffff; }

        .loading-spinner {
            border: 3px solid rgba(0, 0, 0, 0.1);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border-left-color: #10b981;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .tag-badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 9999px;
            background: #e2e8f0;
            color: #475569;
        }

        .animate-fade-in {
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="text-slate-800 pb-20">

    <div class="max-w-4xl mx-auto px-4 py-8">
        <!-- Header -->
        <header class="mb-10 text-center flex flex-col items-center">
            <h1 class="text-4xl font-bold text-emerald-600 mb-2">Eureka!</h1>
            <p class="text-slate-500 mb-6">생각의 파편을 연결하여 온전한 지식으로 만드세요.</p>
            
            <!-- Auth Form -->
            <div id="authSection" class="w-full max-w-sm bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <div class="space-y-3">
                    <input type="text" id="nicknameInput" 
                        class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all"
                        placeholder="닉네임을 입력하세요">
                    <input type="password" id="passwordInput" 
                        class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all"
                        placeholder="비밀번호를 입력하세요">
                    <button onclick="handleLogin()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 rounded-xl transition-colors">
                        시작하기
                    </button>
                </div>
                <p class="text-[11px] text-slate-400 mt-3">닉네임과 비밀번호만으로 즉시 시작됩니다.</p>
            </div>

            <!-- Profile Info (Hidden until Login) -->
            <div id="profileSection" class="hidden flex items-center gap-3 bg-emerald-100 px-4 py-2 rounded-full border border-emerald-200 animate-fade-in">
                <div class="flex items-center text-emerald-700 text-sm font-bold">
                    <i class="fas fa-user-circle mr-2"></i>
                    <span id="displayNickname">사용자</span>님 환영합니다!
                </div>
                <button onclick="handleLogout()" class="text-emerald-900 hover:text-emerald-600 text-[11px] font-bold border-l border-emerald-300 pl-3">
                    로그아웃
                </button>
            </div>
        </header>

        <!-- Main App Content (Hidden until Login) -->
        <div id="mainApp" class="hidden animate-fade-in">
            <!-- Input Section -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-8">
                <div class="relative">
                    <textarea id="noteInput" rows="3" 
                        class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all resize-none"
                        placeholder="새롭게 알게 된 사실(아하!)이나 궁금한 점(응?)을 자유롭게 적어보세요. AI가 알아서 구분해 드립니다!"></textarea>
                    <div id="loadingOverlay" class="hidden absolute inset-0 bg-white/80 flex items-center justify-center rounded-xl z-10">
                        <div class="loading-spinner mr-3"></div>
                        <span class="font-medium text-slate-600">AI가 문장을 분석하고 분류 중입니다...</span>
                    </div>
                </div>
                <div class="flex justify-end mt-4">
                    <button id="submitBtn" onclick="processNote()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-lg font-semibold transition-colors flex items-center disabled:opacity-50">
                        <i class="fas fa-magic mr-2"></i> 기록하기
                    </button>
                </div>
            </div>

            <!-- Knowledge Check Section -->
            <div class="bg-slate-800 rounded-2xl p-6 mb-8 text-white shadow-lg">
                <div class="flex items-center mb-4">
                    <i class="fas fa-brain text-emerald-400 mr-2"></i>
                    <h2 class="text-lg font-bold">지식 상태 점검</h2>
                </div>
                <div class="flex gap-2">
                    <input type="text" id="checkKeyword" 
                        class="flex-1 bg-slate-700 border-none rounded-lg px-4 py-2 text-white placeholder-slate-400 focus:ring-2 focus:ring-emerald-500"
                        placeholder="점검할 키워드를 입력하세요 (예: 도커)"
                        onkeyup="if(window.event.keyCode==13){checkKnowledge()}">
                    <button onclick="checkKnowledge()" class="bg-emerald-500 hover:bg-emerald-600 px-6 py-2 rounded-lg font-bold transition-colors">
                        점검하기
                    </button>
                </div>
            </div>

            <!-- Stats & Filter -->
            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-amber-50 p-4 rounded-xl border border-amber-100">
                    <div class="text-amber-600 text-xs font-bold uppercase tracking-wider mb-1">응? (궁금증)</div>
                    <div id="huhCount" class="text-2xl font-bold">0</div>
                </div>
                <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-100">
                    <div class="text-emerald-600 text-xs font-bold uppercase tracking-wider mb-1">아하! (깨달음)</div>
                    <div id="ahaCount" class="text-2xl font-bold">0</div>
                </div>
            </div>

            <div class="flex flex-wrap gap-2 mb-6" id="tagFilters">
                <button onclick="window.filterByTag('all')" class="px-4 py-1.5 rounded-full bg-slate-800 text-white text-sm">전체보기</button>
            </div>

            <!-- Knowledge Feed -->
            <div id="feedContainer">
                <div id="emptyState" class="text-center py-20 text-slate-400">
                    <i class="fas fa-lightbulb text-5xl mb-4 block opacity-20"></i>
                    첫 번째 생각을 기록해보세요.
                </div>
                <div id="knowledgeFeed" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <!-- Analysis Modal -->
    <div id="analysisModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="modal-overlay absolute inset-0" onclick="closeModal()"></div>
        <div class="bg-white rounded-3xl w-full max-w-2xl max-h-[80vh] overflow-hidden shadow-2xl relative z-10 flex flex-col">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <h3 class="text-xl font-bold text-slate-800 flex items-center">
                    <i class="fas fa-chart-line text-emerald-600 mr-2"></i>
                    지식 분석 리포트
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="analysisContent" class="p-8 overflow-y-auto"></div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, getDoc, updateDoc, deleteDoc, onSnapshot, query, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase Config & Initialization ---
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'eureka-v2';

        const apiKey = "";
        let firebaseUser = null; 
        let hashedUserId = null; 
        let loggedNickname = "";
        let allCards = []; 
        let userCards = []; 
        let currentTagFilter = 'all';
        let unsubscribeData = null;

        // --- Auth Logic ---
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        const performAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        };

        onAuthStateChanged(auth, (user) => {
            firebaseUser = user;
            if (!user) {
                performAuth();
            }
        });

        async function handleLogin() {
            const nick = document.getElementById('nicknameInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();

            if (!nick || !pass) {
                showCustomMessage("닉네임과 비밀번호를 모두 입력해주세요.");
                return;
            }

            if (!firebaseUser) {
                await performAuth();
            }

            const passwordHash = await sha256(pass);
            hashedUserId = await sha256(`${nick}_${passwordHash}`);
            loggedNickname = nick;

            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('profileSection').classList.remove('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('displayNickname').innerText = nick;

            startDataListener();
        }

        async function handleLogout() {
            if (unsubscribeData) unsubscribeData();
            
            hashedUserId = null;
            loggedNickname = "";
            userCards = [];
            allCards = [];
            
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('profileSection').classList.add('hidden');
            document.getElementById('mainApp').classList.add('hidden');
            document.getElementById('nicknameInput').value = "";
            document.getElementById('passwordInput').value = "";
        }

        // --- Firestore Core ---
        function startDataListener() {
            if (!firebaseUser) return;
            
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'cards');
            const q = query(colRef);
            
            unsubscribeData = onSnapshot(q, (snapshot) => {
                allCards = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                userCards = allCards.filter(c => c.ownerId === hashedUserId);
                userCards.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                renderApp();
            }, (error) => {
                console.error("Firestore Error:", error);
                if (error.code === 'permission-denied') {
                    setTimeout(startDataListener, 1000);
                }
            });
        }

        async function processNote() {
            if (!firebaseUser || !hashedUserId) return;
            const input = document.getElementById('noteInput');
            const text = input.value.trim();
            if (!text) return;

            showLoading(true);
            try {
                const analysisResults = await analyzeWithAIWithRetry(text);
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'cards');

                for (const analysis of analysisResults) {
                    // 필드 값이 undefined가 되지 않도록 안전하게 추출
                    const content = analysis.content || analysis.text || "";
                    if (!content) continue;

                    const cardData = {
                        ownerId: hashedUserId,
                        text: content,
                        type: analysis.type || "HUH",
                        tags: analysis.tags || ["기타"],
                        timestamp: new Date(),
                        level: analysis.type === 'AHA' ? 1 : 0,
                        relatedId: (analysis.relatedHuhId != null) ? String(analysis.relatedHuhId) : null
                    };

                    await addDoc(colRef, cardData);

                    if (cardData.relatedId) {
                        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'cards', cardData.relatedId);
                        const docSnap = await getDoc(docRef);
                        if (docSnap.exists() && docSnap.data().ownerId === hashedUserId) {
                            await updateDoc(docRef, { level: Math.min((docSnap.data().level || 0) + 1, 4) });
                        }
                    }
                }
                input.value = '';
                showCustomMessage("기록되었습니다.");
            } catch (error) {
                console.error("Process Error:", error);
                showCustomMessage("분석 또는 저장 중 오류가 발생했습니다.");
            } finally {
                showLoading(false);
            }
        }

        async function analyzeWithAIWithRetry(text, retries = 5) {
            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i <= retries; i++) {
                try {
                    const systemPrompt = `유레카 AI입니다. 문장을 'AHA'와 'HUH'로 분리해 JSON 배열로 반환하세요.
                    현재 질문 목록: ${JSON.stringify(userCards.filter(c => c.type === 'HUH').map(c => ({id: c.id, text: c.text})))}`;
                    
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: text }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] },
                            generationConfig: { 
                                responseMimeType: "application/json",
                                responseSchema: {
                                    type: "ARRAY",
                                    items: {
                                        type: "OBJECT",
                                        properties: {
                                            content: { type: "STRING" },
                                            type: { type: "STRING", enum: ["HUH", "AHA"] },
                                            tags: { type: "ARRAY", items: { type: "STRING" } },
                                            relatedHuhId: { type: "STRING", nullable: true }
                                        },
                                        required: ["content", "type"]
                                    }
                                }
                            }
                        })
                    });
                    
                    if (!response.ok) throw new Error("API call failed");
                    const result = await response.json();
                    const aiText = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!aiText) throw new Error("Empty AI response");
                    return JSON.parse(aiText);
                } catch (err) {
                    if (i === retries) throw err;
                    await new Promise(res => setTimeout(res, delays[i]));
                }
            }
        }

        async function checkKnowledge() {
            const keyword = document.getElementById('checkKeyword').value.trim();
            if (!keyword) return;

            const relevantCards = userCards.filter(c => 
                c.text.toLowerCase().includes(keyword.toLowerCase()) || 
                c.tags.some(t => t.toLowerCase().includes(keyword.toLowerCase()))
            );

            if (relevantCards.length === 0) {
                showCustomMessage("관련된 기록이 없습니다.");
                return;
            }

            openModal();
            try {
                const systemPrompt = `학습 멘토로서 '${keyword}'에 대한 리포트를 JSON으로 작성하세요: {"summary": "...", "strengths": [], "unresolvedHuhs": [], "nextSteps": []}`;
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: JSON.stringify(relevantCards.map(c => ({type: c.type, text: c.text}))) }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: { 
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "OBJECT",
                                properties: {
                                    summary: { type: "STRING" },
                                    strengths: { type: "ARRAY", items: { type: "STRING" } },
                                    unresolvedHuhs: { type: "ARRAY", items: { type: "STRING" } },
                                    nextSteps: { type: "ARRAY", items: { type: "STRING" } }
                                },
                                required: ["summary", "strengths", "unresolvedHuhs", "nextSteps"]
                            }
                        }
                    })
                });
                
                if (!response.ok) throw new Error("Check API call failed");
                const result = await response.json();
                const aiText = result.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!aiText) throw new Error("Empty AI response");
                displayAnalysis(JSON.parse(aiText), keyword);
            } catch (error) {
                console.error("Check Error:", error);
                document.getElementById('analysisContent').innerHTML = "<p class='text-center py-10'>분석 중 오류가 발생했습니다.</p>";
            }
        }

        // --- UI Rendering ---
        function renderApp() {
            const feed = document.getElementById('knowledgeFeed');
            const emptyState = document.getElementById('emptyState');
            const tagFilters = document.getElementById('tagFilters');
            if (!feed) return;

            const filteredCards = currentTagFilter === 'all' ? userCards : userCards.filter(c => c.tags.includes(currentTagFilter));
            emptyState.style.display = userCards.length === 0 ? 'block' : 'none';
            document.getElementById('huhCount').innerText = userCards.filter(c => c.type === 'HUH').length;
            document.getElementById('ahaCount').innerText = userCards.filter(c => c.type === 'AHA').length;

            const allUserTags = [...new Set(userCards.flatMap(c => c.tags || []))];
            tagFilters.innerHTML = `<button onclick="window.filterByTag('all')" class="px-4 py-1.5 rounded-full ${currentTagFilter === 'all' ? 'bg-slate-800 text-white' : 'bg-slate-200 text-slate-600'} text-sm">전체보기</button>`;
            allUserTags.forEach(tag => {
                tagFilters.innerHTML += `<button onclick="window.filterByTag('${tag}')" class="px-4 py-1.5 rounded-full ${currentTagFilter === tag ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-600'} text-sm">#${tag}</button>`;
            });

            feed.innerHTML = '';
            filteredCards.forEach(card => {
                const isHuh = card.type === 'HUH';
                let bgColor = isHuh ? 'card-huh' : `green-lv${Math.max(1, card.level || 1)}`;
                if (isHuh && card.level > 0) bgColor = `green-lv${card.level}`;
                
                const cardEl = document.createElement('div');
                cardEl.className = `${bgColor} p-5 rounded-xl shadow-sm border border-slate-100 relative group animate-fade-in`;
                const isDark = !isHuh && card.level >= 4;
                
                cardEl.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <span class="text-[10px] font-bold uppercase tracking-widest ${isHuh ? 'text-amber-500' : (isDark ? 'text-white' : 'text-emerald-500')}">
                            ${isHuh ? (card.level > 0 ? `해결 중 (Lv.${card.level})` : '응? (질문)') : `아하! (Lv.${card.level || 1})`}
                        </span>
                        <span class="text-[9px] ${isDark ? 'text-emerald-100' : 'text-slate-400'}">${timeAgo(card.timestamp)}</span>
                    </div>
                    <p class="text-sm leading-relaxed mb-4 font-medium ${isDark ? 'text-white' : ''}">${card.text || ""}</p>
                    <div class="flex flex-wrap gap-1">
                        ${(card.tags || []).map(t => `<span class="tag-badge ${isDark ? 'bg-emerald-800/50 text-white border-none' : ''}">#${t}</span>`).join('')}
                    </div>
                    <button onclick="window.deleteCard('${card.id}')" class="absolute top-4 right-4 opacity-0 group-hover:opacity-100 ${isDark ? 'text-emerald-200' : 'text-slate-300'}">
                        <i class="fas fa-trash-alt text-[10px]"></i>
                    </button>
                `;
                feed.appendChild(cardEl);
            });
        }

        // --- Helpers ---
        window.handleLogin = handleLogin;
        window.handleLogout = handleLogout;
        window.processNote = processNote;
        window.checkKnowledge = checkKnowledge;
        window.deleteCard = async (id) => { 
            if (!firebaseUser) return;
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'cards', id)); 
        };
        window.filterByTag = (tag) => { currentTagFilter = tag; renderApp(); };
        window.closeModal = () => { document.getElementById('analysisModal').classList.add('hidden'); document.body.style.overflow = 'auto'; };

        function showLoading(show) { document.getElementById('loadingOverlay').classList.toggle('hidden', !show); document.getElementById('submitBtn').disabled = show; }
        function openModal() {
            document.getElementById('analysisContent').innerHTML = "<div class='flex flex-col items-center py-12'><div class='loading-spinner mb-4'></div><p class='text-slate-500 text-xs'>리포트 작성 중...</p></div>";
            document.getElementById('analysisModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
        function displayAnalysis(analysis, keyword) {
            const content = document.getElementById('analysisContent');
            content.innerHTML = `
                <div class="mb-6"><span class="text-slate-400 text-xs">주제</span><h4 class="text-2xl font-bold text-slate-800">#${keyword}</h4></div>
                <div class="bg-emerald-50 p-4 rounded-xl mb-6 text-sm text-emerald-900 leading-relaxed">${analysis.summary || ""}</div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div class="bg-white p-4 rounded-xl border border-slate-100">
                        <h5 class="text-xs font-bold text-emerald-600 mb-2">깨달은 사실</h5>
                        <ul class="text-[11px] space-y-1">${(analysis.strengths || []).map(s => `<li>• ${s}</li>`).join('')}</ul>
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-slate-100">
                        <h5 class="text-xs font-bold text-amber-600 mb-2">남은 질문</h5>
                        <ul class="text-[11px] space-y-1">${(analysis.unresolvedHuhs || []).map(h => `<li>• ${h}</li>`).join('')}</ul>
                    </div>
                </div>
                <div><h5 class="text-xs font-bold text-indigo-600 mb-2">성장 제안</h5>
                    <div class="space-y-2">${(analysis.nextSteps || []).map(step => `<div class="bg-slate-50 p-2.5 rounded-lg text-xs flex items-center"><i class="fas fa-chevron-right mr-2 text-indigo-300"></i>${step}</div>`).join('')}</div>
                </div>`;
        }
        function showCustomMessage(msg) {
            const t = document.createElement('div');
            t.className = "fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-2 rounded-full shadow-lg z-[100] text-[11px]";
            t.innerText = msg;
            document.body.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 500); }, 2000);
        }
        function timeAgo(ts) {
            if (!ts) return '';
            const d = ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts);
            const diff = Math.floor((new Date() - d) / 1000);
            if (diff < 60) return '방금 전';
            if (diff < 3600) return `${Math.floor(diff/60)}분 전`;
            return d.toLocaleDateString();
        }
    </script>
</body>
</html>
