<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Candy Match Adventure Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle, #6a11cb 0%, #2575fc 100%);
            margin: 0;
            overflow: hidden;
            touch-action: none;
        }

        .grid-container {
            aspect-ratio: 1 / 1;
            max-width: 500px;
            width: 95vw;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 8px solid rgba(255, 255, 255, 0.1);
            display: grid;
            gap: 4px;
            padding: 8px;
            border-radius: 24px;
            position: relative;
            overflow: hidden;
        }

        .candy {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            border-radius: 12px;
            cursor: pointer;
            user-select: none;
            position: absolute;
            transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                        transform 0.2s ease, opacity 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
            z-index: 10;
        }

        /* 선택 시 애니메이션 */
        .candy.selected {
            transform: scale(1.15);
            z-index: 50;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
            filter: brightness(1.2);
        }

        /* 특수 블록 스타일 */
        .candy.striped-h::after {
            content: ''; position: absolute; width: 85%; height: 10px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent); border-radius: 5px;
        }
        .candy.striped-v::after {
            content: ''; position: absolute; height: 85%; width: 10px; background: linear-gradient(0deg, transparent, rgba(255,255,255,0.9), transparent); border-radius: 5px;
        }
        .candy.wrapped {
            border: 4px solid rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: inset 0 0 10px rgba(255,255,255,0.5), 0 0 15px rgba(255, 255, 255, 0.4);
        }
        .candy.bomb {
            background: radial-gradient(circle, #555, #000);
            border-radius: 50%;
            animation: pulse 0.8s infinite alternate;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.2);
        }

        @keyframes pulse {
            from { transform: scale(0.9); }
            to { transform: scale(1.1); }
        }

        .candy-pop {
            animation: pop 0.4s ease-out forwards;
            pointer-events: none;
            z-index: 100;
        }

        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.8; filter: brightness(2); }
            100% { transform: scale(0); opacity: 0; }
        }

        .score-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            color: white;
            padding: 12px 24px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            min-width: 110px;
        }

        #message-box {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 2rem;
            border-radius: 24px;
            z-index: 1000;
            text-align: center;
            min-width: 300px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen">

    <div class="mb-6 flex flex-col items-center gap-2">
        <h1 class="text-3xl font-black text-white tracking-widest drop-shadow-md">CANDY SAGA PRO</h1>
        <div class="flex gap-4">
            <div class="score-box text-center">
                <p class="text-xs opacity-70 font-bold uppercase">Score</p>
                <p id="current-score" class="text-2xl font-bold">0</p>
            </div>
            <div class="score-box text-center">
                <p class="text-xs opacity-70 font-bold uppercase">High</p>
                <p id="high-score" class="text-2xl font-bold">0</p>
            </div>
        </div>
        <div id="user-info" class="text-[10px] text-white opacity-40 font-mono mt-2"></div>
    </div>

    <div id="game-board" class="grid-container">
        <!-- 캔디들이 자바스크립트에 의해 생성됨 -->
    </div>

    <div class="mt-8">
        <button id="reset-btn" class="bg-white text-indigo-600 px-10 py-3 rounded-full font-bold shadow-xl hover:bg-opacity-90 active:scale-95 transition-all">다시 시작</button>
    </div>

    <div id="message-box">
        <h2 id="msg-title" class="text-2xl font-bold mb-2"></h2>
        <p id="msg-content" class="mb-4 text-gray-600"></p>
        <button id="msg-close" class="bg-indigo-600 text-white px-8 py-2 rounded-full font-bold">확인</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- 초기 설정 ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'candy-saga-pro-v2';
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const GRID_SIZE = 8;
        const CANDY_TYPES = ['🍭', '🍬', '🍩', '🧁', '🍪', '🍫'];
        let score = 0;
        let highScore = 0;
        let board = []; 
        let isProcessing = false;
        let userId = null;

        // 드래그 트래킹
        let dragStartCandy = null;
        let startX, startY;

        const boardEl = document.getElementById('game-board');
        const scoreEl = document.getElementById('current-score');
        const highScoreEl = document.getElementById('high-score');
        const userInfoEl = document.getElementById('user-info');

        // --- 인증 및 데이터 동기화 ---
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        userId = user.uid;
                        userInfoEl.innerText = `사용자 ID: ${userId}`;
                        const scoreDoc = doc(db, 'artifacts', appId, 'users', userId, 'stats', 'game');
                        onSnapshot(scoreDoc, (snap) => {
                            if (snap.exists()) {
                                highScore = snap.data().highScore || 0;
                                highScoreEl.innerText = highScore;
                            }
                        });
                    }
                });
            } catch (error) {
                console.error("Auth Error:", error);
            }
        }

        async function saveScore() {
            if (!userId || score <= highScore) return;
            try {
                await setDoc(doc(db, 'artifacts', appId, 'users', userId, 'stats', 'game'), { highScore: score }, { merge: true });
            } catch (error) {
                console.error("Save Score Error:", error);
            }
        }

        // --- 게임 엔진 ---
        function initBoard() {
            boardEl.innerHTML = '';
            board = [];
            for (let r = 0; r < GRID_SIZE; r++) {
                board[r] = [];
                for (let c = 0; c < GRID_SIZE; c++) {
                    let type;
                    do { type = CANDY_TYPES[Math.floor(Math.random() * CANDY_TYPES.length)]; }
                    while (isInitialMatch(r, c, type));
                    
                    const candy = createCandy(r, c, type);
                    board[r][c] = candy;
                    boardEl.appendChild(candy.element);
                }
            }
            positionCandies();
        }

        function isInitialMatch(r, c, type) {
            if (c >= 2 && board[r][c-1]?.type === type && board[r][c-2]?.type === type) return true;
            if (r >= 2 && board[r-1][c]?.type === type && board[r-2][c]?.type === type) return true;
            return false;
        }

        function createCandy(r, c, type, special = null) {
            const candy = { r, c, type, special, element: null, isActivated: false };
            const el = document.createElement('div');
            el.className = `candy ${special || ''}`;
            el.innerText = type === 'BOMB' ? '💣' : type;
            
            // 드래그/마우스 이벤트 리스너
            el.addEventListener('mousedown', (e) => onDragStart(e, candy));
            el.addEventListener('touchstart', (e) => onDragStart(e.touches[0], candy), { passive: true });

            candy.element = el;
            return candy;
        }

        function positionCandies() {
            const cellSize = boardEl.clientWidth / GRID_SIZE;
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const candy = board[r][c];
                    if (candy && candy.element) {
                        candy.element.style.width = `${cellSize - 6}px`;
                        candy.element.style.height = `${cellSize - 6}px`;
                        candy.element.style.left = `${c * cellSize + 3}px`;
                        candy.element.style.top = `${r * cellSize + 3}px`;
                    }
                }
            }
        }

        // --- 드래그 조작 로직 ---
        function onDragStart(e, candy) {
            if (isProcessing || !candy) return;
            dragStartCandy = candy;
            startX = e.clientX;
            startY = e.clientY;

            // 선택 애니메이션 추가
            candy.element.classList.add('selected');

            const onEnd = (ee) => {
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onEnd);
                document.removeEventListener('touchmove', onMove);
                document.removeEventListener('touchend', onEnd);
                
                // 선택 애니메이션 제거
                if (dragStartCandy && dragStartCandy.element) {
                    dragStartCandy.element.classList.remove('selected');
                }

                const clientX = ee.clientX || (ee.changedTouches ? ee.changedTouches[0].clientX : startX);
                const clientY = ee.clientY || (ee.changedTouches ? ee.changedTouches[0].clientY : startY);
                handleDragEnd(clientX, clientY);
            };

            const onMove = (me) => {
                // 필요시 드래그 중 실시간 시각 효과 추가 가능
            };

            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onEnd);
            document.addEventListener('touchmove', onMove, { passive: true });
            document.addEventListener('touchend', onEnd);
        }

        async function handleDragEnd(endX, endY) {
            if (!dragStartCandy) return;
            const dx = endX - startX;
            const dy = endY - startY;
            const threshold = 30;

            let targetR = dragStartCandy.r;
            let targetC = dragStartCandy.c;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > threshold) targetC++;
                else if (dx < -threshold) targetC--;
            } else {
                if (dy > threshold) targetR++;
                else if (dy < -threshold) targetR--;
            }

            if (targetR >= 0 && targetR < GRID_SIZE && targetC >= 0 && targetC < GRID_SIZE && 
               (targetR !== dragStartCandy.r || targetC !== dragStartCandy.c)) {
                await swapAndCheck(dragStartCandy.r, dragStartCandy.c, targetR, targetC);
            }
            dragStartCandy = null;
        }

        async function swapAndCheck(r1, c1, r2, c2) {
            isProcessing = true;
            const candy1 = board[r1][c1];
            const candy2 = board[r2][c2];

            await performSwap(r1, c1, r2, c2);

            // 특수 블록 수동 발동 (드래그 시 즉시 실행)
            let specialTriggered = false;
            
            // 컬러 밤 발동
            if (candy1.type === 'BOMB' || candy2.type === 'BOMB') {
                if (candy1.type === 'BOMB') await activateBomb(candy1, candy2.type);
                else await activateBomb(candy2, candy1.type);
                specialTriggered = true;
            } 
            // 일반 특수 블록 (줄무늬, 봉투) 발동 - 드래그 시 즉시 효과 적용 요청 반영
            else if (candy1.special || candy2.special) {
                // 매칭 여부와 상관없이 특수 블록이 포함된 이동이면 매칭 프로세스로 진입시켜 발동 유도
                await processMatches(true); 
                specialTriggered = true;
            }

            if (!specialTriggered) {
                const matches = findMatches();
                if (matches.length > 0) {
                    await processMatches();
                } else {
                    await performSwap(r1, c1, r2, c2); // 무효한 스왑시 되돌리기
                }
            }
            isProcessing = false;
        }

        async function performSwap(r1, c1, r2, c2) {
            const temp = board[r1][c1];
            board[r1][c1] = board[r2][c2];
            board[r2][c2] = temp;

            board[r1][c1].r = r1; board[r1][c1].c = c1;
            board[r2][c2].r = r2; board[r2][c2].c = c2;

            positionCandies();
            await new Promise(res => setTimeout(res, 400));
        }

        // --- 매칭 및 특수 캔디 로직 ---
        function findMatches() {
            let matches = [];
            
            // 가로 매칭 체크
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE - 2; c++) {
                    let type = board[r][c]?.type;
                    if (type && type !== 'BOMB' && board[r][c+1]?.type === type && board[r][c+2]?.type === type) {
                        let matchSet = [board[r][c], board[r][c+1], board[r][c+2]];
                        let nextC = c + 3;
                        while (nextC < GRID_SIZE && board[r][nextC]?.type === type) {
                            matchSet.push(board[r][nextC]);
                            nextC++;
                        }
                        matches.push({ blocks: matchSet, type: 'h' });
                        c = nextC - 1;
                    }
                }
            }

            // 세로 매칭 체크
            for (let c = 0; c < GRID_SIZE; c++) {
                for (let r = 0; r < GRID_SIZE - 2; r++) {
                    let type = board[r][c]?.type;
                    if (type && type !== 'BOMB' && board[r+1][c]?.type === type && board[r+2][c]?.type === type) {
                        let matchSet = [board[r][c], board[r+1][c], board[r+2][c]];
                        let nextR = r + 3;
                        while (nextR < GRID_SIZE && board[nextR][c]?.type === type) {
                            matchSet.push(board[nextR][c]);
                            nextR++;
                        }
                        matches.push({ blocks: matchSet, type: 'v' });
                        r = nextR - 1;
                    }
                }
            }
            return matches;
        }

        async function processMatches(forceSpecial = false) {
            let matches = findMatches();
            let toRemove = new Set();
            let specialsToCreate = [];

            if (matches.length === 0 && !forceSpecial) return;

            // 매칭된 블록들을 제거 세트에 추가 및 특수 블록 생성 조건 판단
            matches.forEach(m => {
                m.blocks.forEach(b => toRemove.add(b));
                
                // 5개 이상 -> 컬러 밤
                if (m.blocks.length >= 5) {
                    specialsToCreate.push({ r: m.blocks[1].r, c: m.blocks[1].c, type: 'BOMB', special: 'bomb' });
                } 
                // 4개 -> 줄무늬 캔디 (가로 매칭이면 세로 줄무늬, 세로 매칭이면 가로 줄무늬 생성)
                else if (m.blocks.length === 4) {
                    specialsToCreate.push({ 
                        r: m.blocks[1].r, 
                        c: m.blocks[1].c, 
                        type: m.blocks[0].type, 
                        special: m.type === 'h' ? 'striped-v' : 'striped-h' 
                    });
                }
            });

            // T/L 형태 (봉투 캔디) 감지
            let candyMatchCount = new Map();
            matches.forEach(m => {
                m.blocks.forEach(b => {
                    candyMatchCount.set(b, (candyMatchCount.get(b) || 0) + 1);
                });
            });

            candyMatchCount.forEach((count, candy) => {
                if (count > 1) { 
                    specialsToCreate.push({ r: candy.r, c: candy.c, type: candy.type, special: 'wrapped' });
                }
            });

            // 드래그 시 강제 발동 로직 (매칭이 없더라도 특수 블록이면 터짐)
            if (forceSpecial) {
                for(let r=0; r<GRID_SIZE; r++) {
                    for(let c=0; c<GRID_SIZE; c++) {
                        // 현재 보드에 있는 특수 블록 중 활성화되지 않은 것을 제거 리스트에 추가 (드래그된 블록 대상)
                        if (board[r][c]?.special && !board[r][c].isActivated) {
                            toRemove.add(board[r][c]);
                        }
                    }
                }
            }

            // 1. 특수 능력 연쇄 발동 계산
            let chainActivated = true;
            while(chainActivated) {
                chainActivated = false;
                toRemove.forEach(b => {
                    if (b.special && !b.isActivated) {
                        b.isActivated = true;
                        chainActivated = true;
                        if (b.special === 'striped-h') {
                            // 가로 줄무늬 -> 해당 행 전체 파괴
                            for(let c=0; c<GRID_SIZE; c++) if(board[b.r][c]) toRemove.add(board[b.r][c]);
                        } else if (b.special === 'striped-v') {
                            // 세로 줄무늬 -> 해당 열 전체 파괴
                            for(let r=0; r<GRID_SIZE; r++) if(board[r][b.c]) toRemove.add(board[r][b.c]);
                        } else if (b.special === 'wrapped') {
                            // 봉투 캔디 -> 주변 3x3 파괴
                            for(let dr=-1; dr<=1; dr++) {
                                for(let dc=-1; dc<=1; dc++) {
                                    let nr = b.r + dr, nc = b.c + dc;
                                    if(nr>=0 && nr<GRID_SIZE && nc>=0 && nc<GRID_SIZE && board[nr][nc]) toRemove.add(board[nr][nc]);
                                }
                            }
                        }
                    }
                });
            }

            if (toRemove.size === 0) return;

            // 2. 애니메이션 수행 및 데이터 제거
            toRemove.forEach(b => b.element.classList.add('candy-pop'));
            score += toRemove.size * 10;
            scoreEl.innerText = score;
            await new Promise(res => setTimeout(res, 400));

            toRemove.forEach(b => {
                if (b.element && b.element.parentNode) b.element.remove();
                if (board[b.r][b.c] === b) board[b.r][b.c] = null;
            });

            // 3. 신규 특수 캔디 배치
            specialsToCreate.forEach(s => {
                if (board[s.r][s.c] === null) {
                    const candy = createCandy(s.r, s.c, s.type, s.special);
                    board[s.r][s.c] = candy;
                    boardEl.appendChild(candy.element);
                }
            });

            // 4. 중력 작용 (채우기)
            await dropDown();
            
            // 5. 연쇄 반응 재귀 호출
            await processMatches();
            saveScore();
        }

        async function activateBomb(bomb, targetType) {
            bomb.element.classList.add('candy-pop');
            await new Promise(r => setTimeout(r, 200));
            bomb.element.remove();
            board[bomb.r][bomb.c] = null;

            let targets = [];
            for(let r=0; r<GRID_SIZE; r++) {
                for(let c=0; c<GRID_SIZE; c++) {
                    if (board[r][c]?.type === targetType) {
                        targets.push(board[r][c]);
                    }
                }
            }

            targets.forEach(t => t.element.classList.add('candy-pop'));
            score += targets.length * 20;
            scoreEl.innerText = score;
            await new Promise(r => setTimeout(r, 300));

            targets.forEach(t => {
                if(t.element && t.element.parentNode) t.element.remove();
                board[t.r][t.c] = null;
            });

            await dropDown();
        }

        async function dropDown() {
            for (let c = 0; c < GRID_SIZE; c++) {
                let emptySpots = 0;
                // 기존 블록 하강
                for (let r = GRID_SIZE - 1; r >= 0; r--) {
                    if (board[r][c] === null) {
                        emptySpots++;
                    } else if (emptySpots > 0) {
                        const candy = board[r][c];
                        board[r + emptySpots][c] = candy;
                        candy.r = r + emptySpots;
                        board[r][c] = null;
                    }
                }

                // 새로운 블록 생성 및 낙하
                for (let i = 0; i < emptySpots; i++) {
                    const type = CANDY_TYPES[Math.floor(Math.random() * CANDY_TYPES.length)];
                    const candy = createCandy(-(i + 1), c, type); 
                    boardEl.appendChild(candy.element);
                    
                    // 초기 오프셋 렌더링
                    positionCandies(); 
                    
                    const finalR = emptySpots - 1 - i;
                    // 비동기 렌더링을 위해 약간의 지연 후 목표 위치 설정
                    setTimeout(() => {
                        candy.r = finalR;
                        board[finalR][c] = candy;
                        positionCandies();
                    }, 60);
                }
            }

            positionCandies();
            await new Promise(res => setTimeout(res, 550)); 
        }

        // --- 초기화 이벤트 ---
        document.getElementById('reset-btn').onclick = () => {
            score = 0;
            scoreEl.innerText = '0';
            initBoard();
        };

        window.onload = async () => {
            await initAuth();
            initBoard();
            window.addEventListener('resize', positionCandies);
        };
    </script>
</body>
</html>
