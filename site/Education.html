<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spring Quiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/lucide.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
    body { font-family: 'Pretendard', sans-serif; background-color: #f0f4f8; color: #1e293b; }
    .quiz-option:hover { transform: translateY(-2px); }
    .fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .timer-low { color: #ef4444; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  </style>
</head>
<body class="min-h-screen flex flex-col">

<!-- Header -->
<header class="bg-white border-b sticky top-0 z-50">
  <div class="max-w-3xl mx-auto px-6 h-16 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <i data-lucide="leaf" class="text-green-600 w-6 h-6"></i>
      <h1 class="text-xl font-bold tracking-tight">Spring Quiz</h1>
    </div>
    <div id="header-info" class="hidden flex items-center space-x-4">
      <div class="flex items-center space-x-1 text-slate-500 font-medium">
        <i data-lucide="clock" class="w-4 h-4"></i>
        <span id="timer-text">30s</span>
      </div>
      <div class="text-sm font-bold text-blue-600">
        <span id="header-curr">1</span> / <span id="header-total">15</span>
      </div>
    </div>
  </div>
</header>

<main class="flex-grow flex items-center justify-center p-6">
  <div class="max-w-2xl w-full">

    <div id="quiz-container" class="bg-white p-8 md:p-12 rounded-3xl shadow-xl border border-slate-100 fade-in">

      <!-- 1. Quiz Intro -->
      <div id="quiz-intro" class="text-center">
        <div class="w-20 h-20 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-6">
          <i data-lucide="terminal" class="text-green-600 w-10 h-10"></i>
        </div>
        <h2 class="text-3xl font-extrabold mb-4 text-slate-900">Spring Quiz</h2>
        <p class="text-slate-500 mb-10 leading-relaxed">
          MVC 흐름부터 JPA 영속성 컨텍스트까지!<br>
          각 문제당 <b>30초</b>의 시간이 주어집니다. 준비되셨나요?
        </p>
        <button id="btn-start" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold hover:bg-black transition-all shadow-lg active:scale-[0.98]">
          챌린지 시작하기
        </button>
      </div>

      <!-- 2. Active Quiz -->
      <div id="quiz-active" class="hidden">
        <!-- Progress & Timer Bar -->
        <div class="mb-8">
          <div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden mb-2">
            <div id="timer-bar" class="h-full bg-blue-500 transition-all duration-1000 ease-linear" style="width: 100%"></div>
          </div>
        </div>

        <div class="mb-8">
          <h3 id="quiz-question" class="text-xl font-bold text-slate-800 leading-snug mb-6"></h3>
        </div>

        <div id="quiz-options" class="space-y-3">
          <!-- Options injected here -->
        </div>

        <!-- Feedback Box -->
        <div id="quiz-feedback" class="hidden mt-8 p-6 rounded-2xl border-2 fade-in bg-slate-50 text-center">
          <div class="flex items-center justify-center mb-4">
            <i id="feedback-icon" class="mr-2"></i>
            <span id="feedback-title" class="font-bold text-lg"></span>
          </div>

          <p id="feedback-text" class="text-sm text-slate-600 leading-relaxed whitespace-pre-line mb-6"></p>
          <button id="btn-next" class="w-full py-4 bg-blue-600 text-white rounded-2xl font-bold hover:bg-blue-700 transition shadow-lg">다음 문제</button>
        </div>
      </div>

      <!-- 3. Quiz Result -->
      <div id="quiz-result" class="hidden text-center">
        <div id="result-emoji" class="text-6xl mb-6">🌱</div>
        <h2 class="text-3xl font-extrabold mb-2 text-slate-900">최종 결과</h2>
        <div id="quiz-score-display" class="text-5xl font-black text-blue-600 mb-8">0 / 100</div>

        <div class="bg-slate-50 p-6 rounded-2xl mb-10 text-slate-600 border border-slate-100">
          <p id="quiz-final-msg" class="leading-relaxed"></p>
        </div>

        <button id="btn-reset" class="inline-flex items-center space-x-2 text-slate-400 font-bold hover:text-blue-600 transition p-2">
          <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
          <span>다시 도전하기</span>
        </button>
      </div>

    </div>
  </div>
</main>

<footer class="py-8 text-center text-slate-400 text-xs">
  <p>© 2025 Spring Backend Master Academy</p>
</footer>

<script>
  const quizData = [
    {
      q: "Q1. Spring MVC에서 클라이언트 요청을 가장 먼저 받아 처리 흐름을 제어하는 핵심 컴포넌트는?",
      o: ["ViewResolver", "RestController", "DispatcherServlet", "ControllerAdvice", "WebInitializer"],
      a: 2,
      exp: "DispatcherServlet은 Spring MVC의 프론트 컨트롤러로서, 모든 요청을 받아 핸들러 탐색, 실행, 뷰 렌더링까지 전체 흐름을 조율합니다."
    },
    {
      q: "Q2. Spring MVC에서 클라이언트의 JSON 데이터를 Java 객체로 변환할 때 사용되는 구성 요소로 올바른 것은?",
      o: ["DispatcherServlet", "ViewResolver", "ObjectFactory", "HttpMessageConverter", "ResourceHandler"],
      a: 3,
      exp: "MappingJackson2HttpMessageConverter는 Spring의 HttpMessageConverter 구현체로, Jackson 라이브러리를 사용해 JSON → Java 객체로 역직렬화합니다."
    },
    {
      q: "Q3. 컨트롤러에서 \"reservation\"을 반환하면 reservation.html을 찾아서 렌더링하는 구성 요소는 무엇일까요?",
      o: ["DispatcherServlet", "HandlerMapping", "ViewResolver", "MessageConverter", "ModelMapper"],
      a: 2,
      exp: "ViewResolver는 뷰 이름(\"reservation\")을 실제 파일 경로(/templates/reservation.html)로 변환해주는 역할을 합니다."
    },
    {
      q: "Q4. 다음 중 DTO(Data Transfer Object)를 사용하는 목적이 아닌 것은?",
      o: [
        "계층 간 의존성을 줄여 내부 구조 은닉",
        "민감한 정보 노출 방지(정보 은닉)",
        "클라이언트 요청 데이터 형식의 유연한 구성",
        "Entity 변경 시 API 안정성 확보",
        "DTO 내부에서 직접 비즈니스 로직 수행"
      ],
      a: 4,
      exp: "DTO는 데이터 전달만을 위한 객체(Pure Data Container)이며, 비즈니스 로직을 포함해서는 안 됩니다. 로직은 Service나 Domain Entity에서 처리해야 합니다."
    },
    {
      q: "Q5. H2 DB를 테스트 환경에서 자주 사용하는 가장 큰 이유는?",
      o: ["운영 DB와 동일한 성능", "인메모리 방식이라 별도 설치가 없고 속도가 빠름", "보안 기능이 가장 강력함", "데이터 영구 보존 능력이 뛰어남"],
      a: 1,
      exp: "H2는 가벼운 인메모리 DB라 별도의 외부 서버 설치 없이 테스트 코드 실행 속도를 비약적으로 높일 수 있습니다."
    },
    {
      q: "Q6. JDBC 자원 사용 과정 중 올바른 순서대로 나열된 것은? (1:SQL실행, 2:Connection획득, 3:ResultSet처리, 4:자원정리)",
      o: ["1 → 2 → 3 → 4", "2 → 1 → 3 → 4", "2 → 3 → 1 → 4", "1 → 3 → 2 → 4"],
      a: 1,
      exp: "데이터베이스 연결(Connection) → SQL 실행(Statement) → 결과 처리(ResultSet) → 자원 종료(Close) 순서로 진행됩니다."
    },
    {
      q: "Q7. Token(JWT) 기반 인증의 특징으로 올바르지 않은 것은?",
      o: ["서버가 인증 상태를 저장하지 않는 Stateless 방식", "토큰 자체에 사용자 정보 포함 가능", "서버 확장에 매우 유리함", "토큰 탈취 시 서버에서 즉시 무효화 및 폐기 가능"],
      a: 3,
      exp: "JWT는 서버에 상태를 저장하지 않기 때문에 토큰이 탈취되어도 만료 전까지는 서버에서 강제로 무효화하기 어렵습니다. 따라서 짧은 유효시간과 Refresh Token 사용이 권장됩니다."
    },
    {
      q: "Q8. Spring MVC에서 인증 정보 등을 컨트롤러 메서드 파라미터로 주입받을 때 활용하는 컴포넌트는?",
      o: ["ViewResolver", "HandlerMapping", "HandlerMethodArgumentResolver", "HttpMessageConverter"],
      a: 2,
      exp: "HandlerMethodArgumentResolver는 요청 정보를 기반으로 컨트롤러 메서드의 파라미터를 해석하고 특정 객체(예: 현재 로그인 유저)를 주입하는 데 활용됩니다."
    },
    {
      q: "Q9. Spring MVC에서 인증을 적용하는 가장 일반적이고 권장되는 흐름은?",
      o: ["Controller → Service → 인증 처리", "Filter/Interceptor → 인증 → Controller", "Controller → Repository → 인증 처리", "View → 인증 → Controller"],
      a: 1,
      exp: "인증은 비즈니스 로직(Controller)에 도달하기 전 공통 영역(Filter나 Interceptor)에서 처리하여 보안 위협을 사전에 차단하는 것이 표준입니다."
    },
    {
      q: "Q10. JPA에서 영속성 컨텍스트(Persistence Context)는 어떤 역할을 하는 핵심 개념일까?",
      o: ["객체와 테이블의 매핑 정보 정의", "SQL 쿼리 직접 작성 및 실행 도구", "데이터베이스 연결 풀 관리자", "엔티티를 관리하고 DB와 동기화하는 논리적 환경 제공"],
      a: 3,
      exp: "영속성 컨텍스트는 JPA가 엔티티의 생명주기를 관리하고 데이터 변경사항을 추적하여 DB에 동기화하는 중요한 논리적 공간입니다."
    },
    {
      q: "Q11. 영속성 컨텍스트가 엔티티의 변경을 감지하여 별도의 update 호출 없이 DB에 자동 반영하는 기능은?",
      o: ["동일성 보장", "지연 로딩", "쓰기 지연", "변경 감지 (Dirty Checking)"],
      a: 3,
      exp: "변경 감지(Dirty Checking)는 트랜잭션 커밋 시점에 엔티티의 최초 상태(Snapshot)와 현재 상태를 비교해 변경 사항을 DB에 자동 반영합니다."
    },
    {
      q: "Q12. JPA에서 @ManyToOne 연관관계를 매핑할 때, N+1 문제를 방지하기 위한 가장 대표적인 해결책은?",
      o: ["Eager Loading 사용", "Fetch Join 사용", "LAZY 로딩 완전 제거", "영속성 전이(Cascade) 사용"],
      a: 1,
      exp: "Fetch Join은 JPQL에서 JOIN FETCH 문구를 사용하여 연관된 엔티티를 한 번의 쿼리로 함께 조회함으로써 N+1 문제를 해결합니다."
    },
    {
      q: "Q13. Spring의 @Transactional 어노테이션에 대한 설명으로 올바르지 않은 것은?",
      o: ["메서드 실행 중 예외 발생 시 자동 롤백 수행", "로직 성공 시 변경 사항 자동 커밋", "JPA의 변경 감지(Dirty Checking)와 연계됨", "Private 메서드에 붙여도 항상 정상 동작함"],
      a: 3,
      exp: "@Transactional은 프록시 기반으로 동작하기 때문에 클래스 외부에서 호출되는 Public 메서드에서만 정상적으로 트랜잭션이 적용됩니다."
    },
    {
      q: "Q14. Spring Data JPA에서 인터페이스의 메서드 이름만으로 쿼리를 자동 생성하는 기능은?",
      o: ["NamedQuery", "Query Method", "Criteria API", "JPQL Builder"],
      a: 1,
      exp: "Spring Data JPA는 findByUsername처럼 정해진 명명 규칙에 따라 인터페이스 메서드를 선언하면 쿼리를 자동으로 생성해줍니다."
    },
    {
      q: "Q15. @RestController와 @Controller의 가장 핵심적인 차이점은 무엇인가?",
      o: ["반환값이 항상 뷰(View) 이름임", "반환값이 기본적으로 HTTP 응답 본문(JSON 등)에 담김", "로그인 여부만 체크함", "JPA 사용 가능 여부"],
      a: 1,
      exp: "@RestController는 @Controller에 @ResponseBody가 결합된 형태로, 모든 메서드의 반환값이 JSON/XML 형태의 HTTP 응답 본문으로 직접 전달됩니다."
    }
  ];

  let currentIdx = 0;
  let score = 0;
  let isAnswered = false;
  let timeLeft = 30;
  let timerInterval = null;

  const updateIcons = () => { if (window.lucide) window.lucide.createIcons(); };

  const startTimer = () => {
    timeLeft = 30;
    updateTimerUI();
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      updateTimerUI();
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        handleAnswer(-1, null);
      }
    }, 1000);
  };

  const updateTimerUI = () => {
    const timerText = document.getElementById('timer-text');
    const timerBar = document.getElementById('timer-bar');
    timerText.textContent = `${timeLeft}s`;
    timerBar.style.width = `${(timeLeft / 30) * 100}%`;

    if (timeLeft <= 10) {
      timerText.classList.add('timer-low');
      timerBar.classList.replace('bg-blue-500', 'bg-red-500');
    } else {
      timerText.classList.remove('timer-low');
      timerBar.classList.replace('bg-red-500', 'bg-blue-500');
    }
  };

  function startQuiz() {
    currentIdx = 0;
    score = 0;
    document.getElementById('quiz-intro').classList.add('hidden');
    document.getElementById('quiz-result').classList.add('hidden');
    document.getElementById('quiz-active').classList.remove('hidden');
    document.getElementById('header-info').classList.remove('hidden');
    document.getElementById('header-total').textContent = quizData.length;
    renderQuestion();
  }

  function renderQuestion() {
    isAnswered = false;
    const q = quizData[currentIdx];
    document.getElementById('header-curr').textContent = currentIdx + 1;
    document.getElementById('quiz-question').textContent = q.q;

    const optionsBox = document.getElementById('quiz-options');
    optionsBox.innerHTML = '';
    q.o.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = "quiz-option w-full text-left p-4 md:p-5 rounded-2xl border-2 border-slate-100 bg-white hover:border-blue-200 hover:bg-blue-50/50 transition-all font-medium flex justify-between items-center group";
      btn.innerHTML = `<span>${opt}</span><div class="w-6 h-6 rounded-full border-2 border-slate-100 group-hover:border-blue-200 flex items-center justify-center text-[10px] text-white shrink-0 ml-4">●</div>`;
      btn.onclick = () => handleAnswer(idx, btn);
      optionsBox.appendChild(btn);
    });

    document.getElementById('quiz-feedback').classList.add('hidden');
    updateIcons();
    startTimer();
  }

  function handleAnswer(idx, btn) {
    if (isAnswered) return;
    isAnswered = true;
    clearInterval(timerInterval);

    const q = quizData[currentIdx];
    const isCorrect = idx === q.a;
    if (isCorrect) score++;

    const allBtns = document.querySelectorAll('.quiz-option');
    allBtns.forEach(b => b.classList.add('opacity-50', 'pointer-events-none'));

    if (btn) btn.classList.remove('opacity-50');

    if (isCorrect && btn) {
      btn.classList.add('border-green-500', 'bg-green-50');
    } else if (idx !== -1 && btn) {
      btn.classList.add('border-red-500', 'bg-red-50');
    }

    allBtns[q.a].classList.remove('opacity-50');
    allBtns[q.a].classList.add('border-green-500', 'bg-green-50/50');

    const fBox = document.getElementById('quiz-feedback');
    const fIcon = document.getElementById('feedback-icon');
    const fTitle = document.getElementById('feedback-title');
    const fText = document.getElementById('feedback-text');
    const nextBtn = document.getElementById('btn-next');

    fBox.classList.remove('hidden');
    if (isCorrect) {
      fIcon.innerHTML = `<i data-lucide="check-circle" class="text-green-600"></i>`;
      fTitle.textContent = "정답입니다!";
      fTitle.className = "font-bold text-lg text-green-700";
    } else {
      fIcon.innerHTML = `<i data-lucide="x-circle" class="text-red-600"></i>`;
      fTitle.textContent = idx === -1 ? "시간 초과!" : "오답입니다!";
      fTitle.className = "font-bold text-lg text-red-700";
    }
    fText.textContent = q.exp;

    nextBtn.textContent = (currentIdx === quizData.length - 1) ? "최종 결과 보기" : "다음 문제";
    nextBtn.onclick = () => {
      if (currentIdx < quizData.length - 1) {
        currentIdx++;
        renderQuestion();
      } else {
        showResult();
      }
    };

    updateIcons();
  }

  function showResult() {
    document.getElementById('quiz-active').classList.add('hidden');
    document.getElementById('header-info').classList.add('hidden');
    document.getElementById('quiz-result').classList.remove('hidden');

    const finalScore = Math.round((score / quizData.length) * 100);
    document.getElementById('quiz-score-display').textContent = `${finalScore} / 100`;

    let emoji = "🌱";
    let msg = "";
    if (finalScore === 100) {
      emoji = "🚀";
      msg = "완벽합니다! Spring MVC와 JPA의 모든 핵심을 꿰뚫고 계시군요.";
    } else if (finalScore >= 80) {
      emoji = "⭐";
      msg = "훌륭한 성적입니다! 백엔드 개발자로서 탄탄한 기본기를 갖추고 계시네요.";
    } else if (finalScore >= 60) {
      emoji = "📚";
      msg = "기초는 충분합니다! 해설 내용을 바탕으로 헷갈리는 부분을 보강해보세요.";
    } else {
      emoji = "🔥";
      msg = "Spring은 익숙해질수록 강력한 도구입니다. 다시 한번 챌린지하며 개념을 정리해보세요!";
    }

    document.getElementById('result-emoji').textContent = emoji;
    document.getElementById('quiz-final-msg').textContent = msg;
    updateIcons();
  }

  window.addEventListener('DOMContentLoaded', () => {
    document.getElementById('btn-start').addEventListener('click', startQuiz);
    document.getElementById('btn-reset').addEventListener('click', () => {
      document.getElementById('quiz-result').classList.add('hidden');
      document.getElementById('quiz-intro').classList.remove('hidden');
      updateIcons();
    });
    updateIcons();
  });
</script>
</body>
</html>
