<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>철학자의 서재 - 아들러 심리학 상담</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Serif KR', serif;
            background-color: #f7f5f0; /* 따뜻한 종이 느낌의 배경 */
            color: #2c2925;
        }

        /* 스크롤바 스타일링 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #d6d3d1;
            border-radius: 4px;
        }

        .message-enter {
            animation: fadeIn 0.4s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .typing-indicator span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #78716c;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center p-4 md:p-6 lg:p-8">

<!-- 메인 컨테이너 -->
<div class="w-full max-w-3xl h-full max-h-[900px] flex flex-col bg-white rounded-2xl shadow-xl overflow-hidden border border-stone-200">

    <!-- 헤더 -->
    <header class="px-6 py-5 border-b border-stone-200 bg-stone-50 flex items-center justify-between z-10">
        <div>
            <h1 class="text-xl md:text-2xl font-semibold text-stone-800">철학자의 서재</h1>
            <p class="text-sm text-stone-500 mt-1 font-sans">과거에 얽매이지 않고 '지금, 여기'를 살아갈 용기</p>
        </div>
        <div class="hidden sm:flex items-center space-x-2 text-stone-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
            </svg>
        </div>
    </header>

    <!-- 채팅 영역 -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 scroll-smooth bg-[#fdfcfaf0]">
        <!-- 메시지가 동적으로 추가될 위치 -->
    </main>

    <!-- 입력 영역 -->
    <footer class="p-4 border-t border-stone-200 bg-white">
        <div class="relative flex items-end">
            <textarea id="user-input" rows="1" class="w-full py-3 pl-4 pr-14 bg-stone-50 border border-stone-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-stone-400 focus:border-transparent resize-none font-sans text-stone-800 placeholder-stone-400" placeholder="당신의 고민을 이야기해 주십시오... (Shift+Enter로 줄바꿈)"></textarea>
            <button id="send-btn" class="absolute right-2 bottom-2 p-2 bg-stone-800 text-white rounded-lg hover:bg-stone-700 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-stone-800 disabled:opacity-50 disabled:cursor-not-allowed">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                </svg>
            </button>
        </div>
    </footer>
</div>

<script>
    // API 및 설정
    const apiKey = "";
    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

    // 철학자 시스템 프롬프트 (요청하신 가이드라인 완벽 적용)
    const systemInstruction = `당신은 알프레드 아들러(Alfred Adler)의 심리학을 깊이 연구하고 실천하는 **'철학자'**입니다. 당신은 수많은 고뇌하는 청년들을 만나 그들의 삶에 새로운 관점과 용기를 불어넣어 온 현자이며, 베스트셀러 《미움받을 용기》에 등장하는 철학자와 완벽히 동일한 사상과 태도를 지니고 있습니다.

당신은 인간의 모든 행동과 감정은 특정한 '목적'을 가지고 있으며, 과거의 '원인'에 얽매이지 않는다는 '목적론'을 신봉합니다. 또한, 모든 고민의 근원은 '인간관계'에 있음을 꿰뚫어 보고, '과제의 분리'를 통해 자유를 얻고 '공동체 감각'을 통해 진정한 행복을 찾을 수 있다고 믿습니다. 당신의 목표는 청년이 스스로 답을 찾도록 돕는 것이며, 이를 위해 날카로우면서도 부드러운 소크라테스식 질문을 던지며 대화를 이끌어갑니다. 당신의 어조는 매우 차분하고 논리적이며, 온화한 존댓말(하십시오/합니다체)을 사용합니다. 감정적인 동요 없이 현자의 지혜를 전달하며, 청년의 고통에 공감하되 그가 자신을 합리화하려 할 때는 단호하게 모순을 지적하는 균형 잡힌 태도를 유지합니다.

Context
사용자(청년)는 삶의 의미, 타인의 시선, 인간관계의 어려움, 과거의 상처 등으로 인해 깊이 고뇌하며 당신의 서재를 찾아왔습니다. 그는 현재의 문제에 대한 명확한 해답을 찾기보다, 자신의 감정과 행동의 원인을 과거에서 찾으려는 경향이 있을 수 있습니다. 이 유틸리티 앱은 청년이 자신의 내면을 탐색하고, 아들러 심리학의 핵심 원칙들을 통해 삶의 방향을 재정립하며, 궁극적으로는 주체적인 삶을 살아가도록 돕는 생산성/자기계발 도구입니다. 당신은 청년이 상처받지 않으면서도 깊은 깨달음을 얻고, 용기를 얻어 변화를 시도할 수 있도록 섬세하게 대화를 이끌어야 합니다.

[핵심 사상 (아들러 심리학 5대 원칙)]
당신의 모든 답변은 다음의 원칙에 기반해야 합니다:
1. 트라우마의 부정 (목적론): 인간은 과거의 상처(원인론)에 지배받는 것이 아니라, 현재의 '목적'을 위해 감정과 행동을 선택합니다. 청년이 과거의 상처를 핑계 삼으려 할 때, 그것이 어떤 목적을 위한 것인지 일깨워주세요.
2. 모든 고민은 인간관계에서 비롯된다: 열등감, 우월감, 시기심 등 청년이 털어놓는 고민의 이면에는 항상 타인과의 비교나 관계가 숨어있음을 꿰뚫어 봅니다.
3. 과제의 분리: '이것은 누구의 과제인가?'를 명확히 구분하게 합니다. 타인의 기대를 충족시키기 위해 살 필요가 없으며(인정욕구의 부정), 타인의 과제에 개입하지도 말고 내 과제에 타인을 개입시키지도 않도록 안내합니다.
4. 타자공헌과 공동체 감각: 진정한 행복은 타인을 '친구'로 여기고 그들에게 공헌할 때 얻을 수 있음을 가르칩니다.
5. '지금, 여기'를 살아간다: 인생은 선이 아니라 찰나의 점의 연속입니다. 알 수 없는 미래나 바꿀 수 없는 과거에 얽매이지 않고, 현재의 순간에 강렬한 스포트라이트를 비추도록 돕습니다.

Instruction
1. 청년의 고민 경청 및 공감: 청년이 자신의 고민을 털어놓으면, 우선 그의 이야기를 깊이 경청하고 감정에 공감하는 태도를 보여주십시오. 그의 고통을 충분히 이해하고 존중한다는 것을 전달하되, 감정적으로 동요하거나 섣부른 위로를 건네지 마십시오.
2. 아들러 심리학 원칙 적용 및 핵심 질문 유도:
   - 목적론: "그 경험이 지금 당신에게 어떤 '목적'을 가져다주고 있다고 생각하십니까?"
   - 인간관계: "당신이 느끼는 그 감정 뒤에는 혹시 어떤 타인의 시선이나 관계가 영향을 미치고 있지는 않습니까?"
   - 과제의 분리: "그것은 누구의 과제라고 생각하십니까? 당신의 과제입니까, 아니면 타인의 과제입니까?"
   - 타자공헌: "당신이 타인에게 공헌할 수 있는 작은 일은 무엇이 있을까요?"
   - 지금, 여기: "지금 이 순간, 당신은 무엇을 할 수 있습니까? 과거와 미래가 아닌 '지금, 여기'에 집중한다면 어떤 변화가 가능할까요?"
3. 소크라테스식 문답법 활용: 일방적으로 정답을 제시하거나 설교하지 마십시오. 스스로 탐색하도록 질문하십시오.
4. 대화의 호흡 조절: 한 번에 너무 많은 이론/질문을 쏟아내지 마십시오. 1~2개의 핵심 질문이나 개념만 제시하여 핑퐁 대화를 유도하십시오.
5. 균형 잡힌 태도 유지: 감정은 존중하되 '원인론'에 빠져 합리화할 때는 흔들림 없이 단호하게 모순을 지적하십시오.

## Output Format
- 어조와 말투: 매우 차분하고 논리적이며, 온화한 존댓말(하십시오/합니다체)을 사용하십시오.
- 내용 구성: 청년의 이전 발언 중 핵심적인 부분을 간략히 언급하거나 인용하며 시작하고, 아들러 심리학 원칙에 기반한 1~2개의 핵심 질문으로 이어가십시오.
- 길이: 한 번의 답변은 2~4문단 내외로 간결하게 유지하십시오.

## Constraints
- 절대 금지: 직접적인 명령이나 지시 금지. 정답 설교 금지.
- 비난 금지: 청년의 감정/선택을 비난하지 마십시오. 단호한 지적은 비난이 아닌 깨달음을 위한 질문 형태여야 합니다.
- 원칙 준수: 아들러 심리학 5대 원칙 내에서만 조언하십시오.
- 감정적 동요 금지: 항상 차분하고 이성적인 태도를 유지하십시오.
- 상처 주지 않기: 단호함 속에서도 깨달음, 위로, 용기를 줄 수 있도록 하십시오.`;

    // 대화 히스토리 상태 (Gemini API 형식에 맞춤)
    let chatHistory = [];

    // DOM 요소
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    // 초기 시작 메시지 추가
    window.addEventListener('DOMContentLoaded', () => {
        const initialMessage = "어서 오십시오. 이 늦은 시간에 어떤 고민을 안고 저를 찾아오셨습니까? 편하게 앉아 당신의 이야기를 들려주십시오.";
        addMessageToUI('model', initialMessage);
        chatHistory.push({ role: 'model', parts: [{ text: initialMessage }] });
        adjustTextareaHeight();
    });

    // 텍스트 영역 높이 자동 조절
    function adjustTextareaHeight() {
        userInput.style.height = 'auto';
        userInput.style.height = Math.min(userInput.scrollHeight, 150) + 'px';
    }

    userInput.addEventListener('input', adjustTextareaHeight);

    // 엔터 키 처리 (Shift+Enter는 줄바꿈, Enter는 전송)
    userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSend();
        }
    });

    sendBtn.addEventListener('click', handleSend);

    async function handleSend() {
        const text = userInput.value.trim();
        if (!text) return;

        // 1. 사용자 메시지 UI 및 히스토리에 추가
        addMessageToUI('user', text);
        chatHistory.push({ role: 'user', parts: [{ text }] });

        // 입력창 초기화
        userInput.value = '';
        userInput.disabled = true;
        sendBtn.disabled = true;
        adjustTextareaHeight();

        // 2. 타이핑 인디케이터 표시
        const typingId = showTypingIndicator();

        // 3. API 호출
        try {
            const responseText = await callGeminiAPI(chatHistory);

            // 타이핑 인디케이터 제거
            removeElement(typingId);

            // 모델 응답 UI 및 히스토리에 추가
            addMessageToUI('model', responseText);
            chatHistory.push({ role: 'model', parts: [{ text: responseText }] });
        } catch (error) {
            removeElement(typingId);
            addMessageToUI('model', "오류가 발생했습니다. 잠시 후 다시 당신의 이야기를 들려주시겠습니까?");
            console.error("API Error:", error);
        } finally {
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
        }
    }

    // 지수 백오프를 적용한 API 호출 함수
    const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    async function callGeminiAPI(messages, retries = 5) {
        const delays = [1000, 2000, 4000, 8000, 16000];
        const payload = {
            contents: messages,
            systemInstruction: {
                parts: [{ text: systemInstruction }]
            }
        };

        for (let i = 0; i <= retries; i++) {
            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
                    return data.candidates[0].content.parts[0].text;
                } else {
                    throw new Error("Invalid response structure");
                }
            } catch (error) {
                if (i === retries) {
                    throw error; // 최대 재시도 횟수 초과
                }
                await wait(delays[i]); // 지수 백오프 대기
            }
        }
    }

    // UI에 메시지 추가 (마크다운 줄바꿈 처리 포함)
    function addMessageToUI(sender, text) {
        const wrapper = document.createElement('div');
        wrapper.className = `flex w-full message-enter ${sender === 'user' ? 'justify-end' : 'justify-start'}`;

        const bubble = document.createElement('div');
        const formattedText = text.replace(/\n/g, '<br>');

        if (sender === 'user') {
            bubble.className = "max-w-[80%] md:max-w-[70%] bg-stone-700 text-stone-50 px-5 py-4 rounded-2xl rounded-tr-sm shadow-md font-sans text-[15px] leading-relaxed break-words";
            bubble.innerHTML = formattedText;
        } else {
            bubble.className = "max-w-[85%] md:max-w-[80%] bg-white border border-stone-200 text-stone-800 px-6 py-5 rounded-2xl rounded-tl-sm shadow-sm text-[16px] leading-loose break-words";
            bubble.innerHTML = formattedText;
        }

        wrapper.appendChild(bubble);
        chatContainer.appendChild(wrapper);
        scrollToBottom();
    }

    // 철학자가 생각중임을 나타내는 UI
    function showTypingIndicator() {
        const id = 'typing-' + Date.now();
        const wrapper = document.createElement('div');
        wrapper.id = id;
        wrapper.className = "flex w-full justify-start message-enter";

        const bubble = document.createElement('div');
        bubble.className = "bg-white border border-stone-200 px-5 py-4 rounded-2xl rounded-tl-sm shadow-sm flex items-center space-x-1";
        bubble.innerHTML = `
                <div class="typing-indicator flex items-center h-4">
                    <span></span><span></span><span></span>
                </div>
            `;

        wrapper.appendChild(bubble);
        chatContainer.appendChild(wrapper);
        scrollToBottom();
        return id;
    }

    function removeElement(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
    }

    function scrollToBottom() {
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }
</script>
</body>
</html>
