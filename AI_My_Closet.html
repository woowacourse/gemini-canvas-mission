<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Outfit Planner - Professional Clean</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js" type="module"></script>
    <!-- Markdown Rendering Library -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; color: #1e293b; scroll-behavior: smooth; }
        
        /* AI Response Loader */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4f46e5;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Markdown Styling - Extreme Clean */
        .prose h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 1.5rem; color: #312e81; border-left: 6px solid #4f46e5; padding-left: 0.8rem; }
        .prose h2 { font-size: 1.4rem; font-weight: 800; margin-top: 1.5rem; margin-bottom: 1rem; color: #1e1b4b; }
        .prose hr { border: 0; border-top: 2px solid #e2e8f0; margin: 2rem 0; }
        .prose ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1.25rem; }
        .prose li { margin-bottom: 0.6rem; }
        .prose p { margin-bottom: 1.25rem; line-height: 1.8; }
        
        /* [CRITICAL] REMOVE ALL STRIKETHROUGHS (MIDDLE LINES) */
        .prose del, .prose s, .prose strike { 
            text-decoration: none !important; 
            border: none !important;
            background: none !important;
        }
        .prose * { text-decoration: none !important; }
        .prose strong { color: #1e1b4b; font-weight: 700; text-decoration: none !important; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        /* Category Button Styling */
        .category-btn.active {
            background-color: #4f46e5;
            color: white;
            border-color: #4f46e5;
        }

        /* Select styling */
        .select-wrapper::after {
            content: '▼';
            font-size: 0.7rem;
            position: absolute;
            right: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: #6366f1;
        }
    </style>
</head>
<body class="min-h-screen pb-20">

    <div class="max-w-5xl mx-auto p-4 md:p-8">
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-black text-indigo-600 tracking-tight">AI My Closet</h1>
            <p class="text-slate-500 mt-2">정확한 날씨 분석과 깔끔한 코디 리포트</p>
            <div id="auth-status" class="mt-4 inline-block px-4 py-1 bg-white rounded-full text-[11px] text-slate-400 border border-slate-200 shadow-sm">인증 중...</div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
            <!-- Left: Closet -->
            <div class="space-y-6">
                <section class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                    <h2 class="text-xl font-bold mb-5 flex items-center gap-2">
                        <span>➕</span> 옷 추가하기
                    </h2>
                    <div class="space-y-4">
                        <div class="flex gap-2">
                            <button type="button" data-value="outer" class="category-btn active flex-1 py-3 rounded-xl border-2 border-slate-100 font-bold text-sm transition-all bg-white">🧥 아우터</button>
                            <button type="button" data-value="top" class="category-btn flex-1 py-3 rounded-xl border-2 border-slate-100 font-bold text-sm transition-all bg-white text-slate-400">👕 상의</button>
                        </div>
                        <div class="flex gap-2">
                            <input type="text" id="item-name" placeholder="예: 구스다운 패딩" class="flex-1 p-3 border rounded-xl focus:ring-2 focus:ring-indigo-200 outline-none">
                            <button id="add-btn" class="bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-indigo-700 whitespace-nowrap transition">추가</button>
                        </div>
                    </div>
                </section>

                <div class="grid grid-cols-2 gap-4">
                    <section class="bg-white p-5 rounded-3xl shadow-sm border border-slate-200 h-[350px] flex flex-col">
                        <h3 class="font-bold mb-4 text-orange-600">🧥 아우터</h3>
                        <div id="outer-list" class="flex-1 overflow-y-auto custom-scrollbar space-y-2"></div>
                    </section>
                    <section class="bg-white p-5 rounded-3xl shadow-sm border border-slate-200 h-[350px] flex flex-col">
                        <h3 class="font-bold mb-4 text-blue-600">👕 상의</h3>
                        <div id="top-list" class="flex-1 overflow-y-auto custom-scrollbar space-y-2"></div>
                    </section>
                </div>
            </div>

            <!-- Right: Config -->
            <section class="bg-indigo-600 p-8 rounded-3xl shadow-xl text-white flex flex-col justify-center">
                <h2 class="text-2xl font-black mb-6">📅 코디 조건 설정</h2>
                <div class="space-y-6">
                    <div>
                        <label class="block text-indigo-100 text-sm font-bold mb-2">날짜</label>
                        <input type="date" id="date-input" class="w-full p-4 rounded-2xl bg-white text-slate-900 font-bold outline-none">
                    </div>
                    <div>
                        <label class="block text-indigo-100 text-sm font-bold mb-2">지역</label>
                        <div class="relative select-wrapper">
                            <select id="region-select" class="w-full p-4 rounded-2xl bg-white text-slate-900 font-bold outline-none appearance-none cursor-pointer">
                                <option value="서울">서울특별시</option>
                                <option value="경기도">경기도</option>
                                <option value="강원도">강원도</option>
                                <option value="충청도">충청도</option>
                                <option value="경상도">경상도</option>
                                <option value="전라도">전라도</option>
                                <option value="제주도">제주도</option>
                            </select>
                        </div>
                    </div>
                    <button id="recommend-btn" class="w-full bg-white text-indigo-600 py-5 rounded-2xl font-black text-xl hover:bg-indigo-50 transition shadow-2xl">
                        상세 코디 리포트 생성
                    </button>
                </div>
            </section>
        </div>

        <!-- Lower: Result -->
        <div id="recommendation-result" class="hidden bg-white p-8 md:p-12 rounded-[2rem] border border-slate-200 shadow-sm relative min-h-[500px]">
            <div id="ai-loader" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-white/95 rounded-[2rem] z-20">
                <div class="loader mb-6"></div>
                <p class="text-indigo-600 font-bold animate-pulse text-lg text-center px-4">제미나이가 날씨와 옷장을 분석하여<br>최적의 코디를 구성하고 있습니다.</p>
            </div>
            <div class="flex items-center justify-between mb-8 border-b pb-6">
                <h2 class="text-2xl font-black text-slate-900 flex items-center gap-3">✨ AI 코디 분석 결과</h2>
                <div id="result-meta" class="text-sm font-bold text-indigo-500 bg-indigo-50 px-3 py-1 rounded-lg"></div>
            </div>
            <div id="recommend-content" class="prose max-w-none text-slate-700"></div>
        </div>
    </div>

    <!-- Modal -->
    <div id="custom-modal" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-white p-8 rounded-3xl max-w-sm w-full text-center shadow-2xl">
            <p id="modal-text" class="mb-6 text-slate-700 font-bold"></p>
            <button onclick="closeModal()" class="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl">확인</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const apiKey = ""; 
        const firebaseConfig = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'outfit-planner-final-fix';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let user = null, clothes = [], selectedCategory = "outer";

        // DOM Elements
        const dateInput = document.getElementById('date-input'),
              regionSelect = document.getElementById('region-select'),
              itemNameInput = document.getElementById('item-name'),
              addBtn = document.getElementById('add-btn'),
              recommendBtn = document.getElementById('recommend-btn'),
              recommendationResult = document.getElementById('recommendation-result'),
              recommendContent = document.getElementById('recommend-content'),
              aiLoader = document.getElementById('ai-loader'),
              resultMeta = document.getElementById('result-meta'),
              authStatusEl = document.getElementById('auth-status');

        // Set min date to today
        const todayStr = new Date().toISOString().split('T')[0];
        dateInput.value = todayStr;
        dateInput.min = todayStr;

        // Category Selection
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.category-btn').forEach(b => {
                    b.classList.remove('active', 'bg-indigo-600', 'text-white');
                    b.classList.add('text-slate-400', 'bg-white');
                });
                btn.classList.add('active', 'bg-indigo-600', 'text-white');
                btn.classList.remove('text-slate-400', 'bg-white');
                selectedCategory = btn.getAttribute('data-value');
            });
        });

        // Auth
        async function login() {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        }
        onAuthStateChanged(auth, (u) => {
            user = u;
            if (user) {
                authStatusEl.innerText = "연결됨";
                loadData();
            }
        });
        login();

        function loadData() {
            if (!user) return;
            onSnapshot(collection(db, 'artifacts', appId, 'users', user.uid, 'clothes'), (snapshot) => {
                clothes = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                renderList();
            });
        }

        async function add() {
            const name = itemNameInput.value.trim();
            if (!name || !user) return;
            await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'clothes'), {
                name, category: selectedCategory, createdAt: Date.now()
            });
            itemNameInput.value = "";
        }
        window.remove = async (id) => await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'clothes', id));

        function renderList() {
            const render = (cat, el) => {
                const filtered = clothes.filter(c => c.category === cat);
                el.innerHTML = filtered.length ? filtered.map(c => `
                    <div class="flex justify-between p-3 bg-slate-50 rounded-xl text-sm font-medium">
                        <span>${c.name}</span>
                        <button onclick="window.remove('${c.id}')" class="text-slate-300 hover:text-red-500">✕</button>
                    </div>
                `).join('') : '<p class="text-center text-slate-300 py-10">없음</p>';
            };
            render('outer', document.getElementById('outer-list'));
            render('top', document.getElementById('top-list'));
        }

        async function recommend() {
            if (!clothes.length) return showMsg("옷을 먼저 추가해주세요.");
            recommendationResult.classList.remove('hidden');
            aiLoader.classList.remove('hidden');
            recommendContent.innerHTML = "";
            resultMeta.innerText = `${dateInput.value} | ${regionSelect.value}`;
            recommendationResult.scrollIntoView({ behavior: 'smooth' });

            const sys = `당신은 대한민국 패션 전문가입니다. 사용자의 옷장 데이터를 기반으로 최적의 룩을 제안하세요.

            [출력 구조 지침 - 매우 중요]
            1. 리포트의 가장 첫 줄에 결론부터 작성하세요: "## [추천 아우터]와 [추천 상의]를 입으세요"
            2. 그 바로 아래에 가로 구분선(---)을 넣으세요.
            3. 구분선 아래에 "## 상세 설명" 섹션을 만들어 날씨 정보와 코디 이유를 설명하세요.

            [금지 사항]
            - 숫자를 합치지 마세요. (예: 13-15도라고 표기)
            - 마크다운 취소선 문법(~~) 절대 사용 금지.
            - 4자리수 기온 표기 금지.

            [분석 내용]
            - 실시간 기온, 일교차, 바람 정서를 반영하여 총 2가지 룩을 제안하세요. (룩 1 메인, 룩 2 서브)`;

            const q = `날짜: ${dateInput.value}, 지역: ${regionSelect.value}, 옷장 정보: ${clothes.map(c=>`${c.category}:${c.name}`).join(', ')}`;

            try {
                let res = await callAI(sys, q);
                
                // Sanitization
                res = res.replace(/~~/g, ''); 
                res = res.replace(/(\d{2})(\d{2})°C/g, '$1-$2°C'); 
                
                recommendContent.innerHTML = marked.parse(res);
            } catch (e) {
                recommendContent.innerHTML = "리포트 생성에 실패했습니다.";
            } finally {
                aiLoader.classList.add('hidden');
            }
        }

        async function callAI(sys, q) {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: q }] }],
                    systemInstruction: { parts: [{ text: sys }] },
                    tools: [{ "google_search": {} }]
                })
            });
            const data = await res.json();
            return data.candidates[0].content.parts[0].text;
        }

        window.closeModal = () => document.getElementById('custom-modal').classList.add('hidden');
        function showMsg(t) { document.getElementById('modal-text').innerText = t; document.getElementById('custom-modal').classList.remove('hidden'); }

        addBtn.onclick = add;
        recommendBtn.onclick = recommend;
        itemNameInput.onkeypress = (e) => e.key === 'Enter' && add();
    </script>
</body>
</html>
