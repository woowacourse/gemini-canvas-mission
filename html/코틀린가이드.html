<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>코틀린 가이드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Noto Sans KR", sans-serif;
        background-color: #f3f4f6;
        -webkit-tap-highlight-color: transparent;
      }

      /* 3D Flip Card CSS */
      .perspective-1000 {
        perspective: 1000px;
      }

      .transform-style-3d {
        transform-style: preserve-3d;
      }

      .backface-hidden {
        backface-visibility: hidden;
      }

      .rotate-y-180 {
        transform: rotateY(180deg);
      }

      .card-transition {
        transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      }

      /* 버튼 애니메이션 */
      .btn-press {
        transition:
          transform 0.1s ease,
          background-color 0.3s ease;
      }

      .btn-press:active {
        transform: scale(0.96);
      }

      /* 퀴즈 정답/오답 색상 전환 애니메이션 */
      .quiz-option {
        transition: all 0.3s ease;
      }

      .quiz-correct {
        background-color: #22c55e !important;
        /* bg-green-500 */
        color: white !important;
        border-color: #16a34a !important;
      }

      .quiz-wrong {
        background-color: #ef4444 !important;
        /* bg-red-500 */
        color: white !important;
        border-color: #dc2626 !important;
      }

      /* 모바일 컨테이너 제한 */
      .app-container {
        max-width: 480px;
        margin: 0 auto;
        background-color: #ffffff;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
      }

      .loader {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #7f52ff;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div class="app-container relative">
      <!-- Header -->
      <header
        class="bg-[#7F52FF] text-white p-4 shadow-md flex items-center justify-between shrink-0 z-10"
      >
        <h1 class="text-xl font-bold flex items-center gap-2">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
            <path
              d="M2.66 21.996L21.573 2.923l-10.74 0L2.66 12.012l0 9.984zM2.66 12.012L12.592 2.08l-9.932 0 0 9.932z"
              fill="white"
            />
          </svg>
          코틀린 가이드
        </h1>
        <button
          id="btn-home"
          class="hidden text-white font-medium p-2 btn-press"
          onclick="goHome()"
        >
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
            ></path>
          </svg>
        </button>
      </header>

      <!-- Toast Notification (팝업 알림) -->
      <div
        id="toast-notification"
        class="absolute top-16 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full shadow-2xl text-white font-bold text-lg opacity-0 scale-90 pointer-events-none transition-all duration-300 z-50 flex items-center gap-2"
      >
        <span id="toast-icon"></span>
        <span id="toast-message"></span>
      </div>

      <!-- Main Content Area -->
      <main class="flex-1 overflow-y-auto bg-gray-50 relative p-4">
        <!-- Screen: Home -->
        <div
          id="screen-home"
          class="flex flex-col items-center justify-center h-full gap-6"
        >
          <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-2">환영합니다!</h2>
            <p class="text-gray-500 text-sm">
              코틀린과 안드로이드 기초를 마스터하세요.
            </p>
          </div>

          <button
            onclick="showScreen('screen-categories')"
            class="w-full bg-[#3DDC84] text-white rounded-2xl p-6 shadow-lg btn-press flex flex-col items-center gap-3"
          >
            <svg
              class="w-12 h-12"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"
              ></path>
            </svg>
            <span class="text-xl font-bold">인터랙티브 학습 카드</span>
            <span class="text-sm font-medium opacity-90"
              >핵심 개념을 카드로 넘기며 학습해요</span
            >
          </button>

          <button
            onclick="startQuizFlow()"
            class="w-full bg-[#7F52FF] text-white rounded-2xl p-6 shadow-lg btn-press flex flex-col items-center gap-3"
          >
            <svg
              class="w-12 h-12"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"
              ></path>
            </svg>
            <span class="text-xl font-bold">AI 실전 퀴즈</span>
            <span class="text-sm font-medium opacity-90"
              >Gemini AI가 문제를 내고 채점해줍니다</span
            >
          </button>
        </div>

        <!-- Screen: Categories -->
        <div id="screen-categories" class="hidden flex flex-col gap-4 h-full">
          <h2 class="text-xl font-bold text-gray-800 mb-2">학습 주제 선택</h2>

          <button
            onclick="openCategory(0)"
            class="bg-white border-2 border-gray-200 rounded-xl p-5 text-left btn-press shadow-sm hover:border-[#3DDC84]"
          >
            <h3 class="font-bold text-lg text-gray-800">안드로이드 생명주기</h3>
            <p class="text-sm text-gray-500 mt-1">
              Activity 및 Fragment Lifecycle, AI 다이어그램
            </p>
          </button>
          <button
            onclick="openCategory(1)"
            class="bg-white border-2 border-gray-200 rounded-xl p-5 text-left btn-press shadow-sm hover:border-[#7F52FF]"
          >
            <h3 class="font-bold text-lg text-gray-800">코틀린 핵심 문법</h3>
            <p class="text-sm text-gray-500 mt-1">
              Null-safety 및 스코프 함수 (let, run, apply 등)
            </p>
          </button>
          <button
            onclick="openCategory(2)"
            class="bg-white border-2 border-gray-200 rounded-xl p-5 text-left btn-press shadow-sm hover:border-blue-500"
          >
            <h3 class="font-bold text-lg text-gray-800">Jetpack Compose</h3>
            <p class="text-sm text-gray-500 mt-1">
              State, Recomposition, Modifier 핵심 개념
            </p>
          </button>
        </div>

        <!-- Screen: Flashcards -->
        <div id="screen-flashcards" class="hidden flex flex-col h-full">
          <div class="flex justify-between items-center mb-4">
            <span id="fc-progress" class="text-sm font-bold text-[#7F52FF]"
              >1 / 3</span
            >
            <span id="fc-title" class="text-sm font-bold text-gray-500"
              >주제</span
            >
          </div>

          <!-- Card Container -->
          <div class="flex-1 perspective-1000 relative" onclick="flipCard()">
            <div
              id="flashcard-inner"
              class="w-full h-full absolute transform-style-3d card-transition cursor-pointer shadow-xl rounded-2xl"
            >
              <!-- Front -->
              <div
                class="w-full h-full absolute backface-hidden bg-white rounded-2xl border-2 border-gray-100 flex flex-col items-center justify-center p-6 text-center"
              >
                <svg
                  class="w-10 h-10 text-gray-300 mb-4 animate-bounce"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"
                  ></path>
                </svg>
                <h2
                  id="fc-front-title"
                  class="text-3xl font-bold text-gray-800 mb-2"
                >
                  Front Title
                </h2>
                <p class="text-gray-500 text-sm mt-4">터치하여 뒤집기</p>
              </div>

              <!-- Back -->
              <div
                class="w-full h-full absolute backface-hidden bg-[#f8f9fa] rounded-2xl border-2 border-[#7F52FF] flex flex-col items-center justify-center p-6 text-center rotate-y-180 overflow-y-auto"
              >
                <div
                  id="fc-back-content"
                  class="text-lg text-gray-800 font-medium leading-relaxed w-full"
                >
                  Back Content
                </div>
              </div>
            </div>
          </div>

          <!-- Controls -->
          <div class="flex justify-between mt-6 shrink-0 gap-4">
            <button
              onclick="prevCard()"
              class="flex-1 bg-gray-200 text-gray-700 font-bold py-4 rounded-xl btn-press text-lg"
            >
              이전
            </button>
            <button
              onclick="nextCard()"
              class="flex-1 bg-[#3DDC84] text-white font-bold py-4 rounded-xl btn-press text-lg"
            >
              다음
            </button>
          </div>
        </div>

        <!-- Screen: Flashcards End -->
        <div
          id="screen-flashcards-end"
          class="hidden flex flex-col items-center justify-center h-full gap-6 px-4"
        >
          <div
            class="bg-white p-6 rounded-full shadow-lg border-4 border-[#7F52FF] mb-2"
          >
            <svg
              class="w-16 h-16 text-[#7F52FF]"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5 13l4 4L19 7"
              ></path>
            </svg>
          </div>
          <div class="text-center">
            <h2 class="text-2xl font-bold text-gray-800 mb-2">학습 완료!</h2>
            <p class="text-gray-500 text-sm">
              준비된 모든 카드를 확인했습니다.
            </p>
          </div>

          <div class="w-full flex flex-col gap-3 mt-4">
            <button
              id="btn-generate-ai-card"
              onclick="generateAICardForCurrentCategory()"
              class="w-full bg-[#3DDC84] text-white font-bold py-4 rounded-xl btn-press text-lg shadow-md flex justify-center items-center gap-2"
            >
              <svg
                class="w-6 h-6"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13 10V3L4 14h7v7l9-11h-7z"
                ></path>
              </svg>
              AI로 새 카드 추가하기
            </button>
            <button
              onclick="goHome()"
              class="w-full bg-white border-2 border-gray-200 text-gray-700 font-bold py-4 rounded-xl btn-press text-lg shadow-sm"
            >
              홈으로 돌아가기
            </button>
          </div>
        </div>

        <!-- Screen: Quiz Loading -->
        <div
          id="screen-quiz-loading"
          class="hidden flex flex-col items-center justify-center h-full"
        >
          <div class="loader mb-6"></div>
          <h2 class="text-xl font-bold text-gray-800 text-center">
            Gemini AI가 퀴즈를<br />생성하고 있습니다...
          </h2>
          <p class="text-sm text-gray-500 mt-2">
            잠시만 기다려주세요 (최대 10초 소요)
          </p>
        </div>

        <!-- Screen: Quiz Play -->
        <div id="screen-quiz-play" class="hidden flex flex-col h-full">
          <div class="flex justify-between items-center mb-4">
            <span
              id="quiz-progress"
              class="text-sm font-bold text-[#7F52FF] bg-[#7F52FF]/10 py-1 px-3 rounded-full"
              >문제 1/5</span
            >
            <span id="quiz-score" class="text-sm font-bold text-gray-500"
              >현재 점수: 0점</span
            >
          </div>

          <div
            class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 mb-6 shrink-0"
          >
            <h3
              id="quiz-question"
              class="text-xl font-bold text-gray-800 leading-snug"
            >
              문제 내용이 여기에 표시됩니다.
            </h3>
          </div>

          <div
            id="quiz-options"
            class="flex flex-col gap-3 flex-1 overflow-y-auto pb-4"
          >
            <!-- 옵션 버튼들이 동적으로 추가됨 -->
          </div>

          <div
            id="quiz-feedback-container"
            class="hidden flex-col gap-3 mt-auto pt-4 shrink-0 border-t border-gray-200"
          >
            <div
              id="quiz-explanation"
              class="text-sm text-gray-600 bg-gray-100 p-4 rounded-xl"
            >
              해설이 표시됩니다.
            </div>
            <button
              id="btn-next-quiz"
              onclick="nextQuiz()"
              class="w-full bg-[#7F52FF] text-white font-bold py-4 rounded-xl btn-press text-lg shadow-md"
            >
              다음 문제
            </button>
          </div>
        </div>

        <!-- Screen: Quiz Result -->
        <div
          id="screen-quiz-result"
          class="hidden flex flex-col items-center justify-center h-full gap-6 text-center"
        >
          <div
            class="bg-white p-8 rounded-full shadow-lg border-4 border-[#3DDC84] mb-2"
          >
            <span
              id="final-score"
              class="text-5xl font-extrabold text-[#3DDC84]"
              >100</span
            ><span class="text-2xl font-bold text-gray-500">점</span>
          </div>
          <h2 id="final-message" class="text-2xl font-bold text-gray-800">
            수고하셨습니다!
          </h2>
          <p class="text-gray-500">AI가 생성한 퀴즈를 모두 완료했습니다.</p>

          <button
            onclick="goHome()"
            class="w-full bg-[#7F52FF] text-white font-bold py-4 rounded-xl btn-press text-lg shadow-md mt-4"
          >
            홈으로 돌아가기
          </button>
        </div>
      </main>
    </div>

    <script>
      const apiKey = ""; // Runtime 환경에서 제공됨

      // --- State Variables ---
      let currentCategoryIndex = 0;
      let currentCardIndex = 0;
      let isFlipped = false;
      let quizData = [];
      let currentQuizIndex = 0;
      let userScore = 0;
      let isAnswering = false;

      // --- Flashcard Data ---
      const flashcardCategories = [
        {
          title: "안드로이드 생명주기",
          cards: [
            {
              front: "Activity 생명주기",
              back: "onCreate → onStart → onResume<br><br><b>(실행 중)</b><br><br>onPause → onStop → onDestroy",
              requiresImage: true,
              imagePrompt:
                "A clean minimalist flowchart diagram showing Android Activity Lifecycle: onCreate, onStart, onResume, onPause, onStop, onDestroy. Mobile app style UI, simple shapes, vibrant colors, white background.",
            },
            {
              front: "Fragment 생명주기",
              back: "Fragment는 Activity 내에서 UI의 일부를 나타냅니다.<br><br><b>핵심 콜백:</b><br>onAttach → onCreate → onCreateView → onViewCreated<br>...<br>onDestroyView → onDestroy → onDetach",
            },
          ],
        },
        {
          title: "코틀린 스코프 함수",
          cards: [
            {
              front: "let",
              back: "<b>사용법:</b> 객체.let { it -> ... }<br><br><b>반환값:</b> 람다의 마지막 줄 결과<br><br><b>특징:</b> null 체크(`?.let`)를 할 때 매우 유용하게 쓰입니다.",
            },
            {
              front: "apply",
              back: "<b>사용법:</b> 객체.apply { this... }<br><br><b>반환값:</b> 수신 객체 자신(this)<br><br><b>특징:</b> 객체를 생성하고 바로 프로퍼티를 초기화할 때 유용합니다.",
            },
            {
              front: "Null Safety",
              back: "<b>? (Safe Call):</b> null이 아니면 실행, null이면 null 반환<br><br><b>?: (Elvis):</b> null일 경우 대체값 지정<br><br><b>!! (Not-null):</b> null이 아님을 확언 (NPE 위험)",
            },
          ],
        },
        {
          title: "Jetpack Compose",
          cards: [
            {
              front: "State (상태)",
              back: "시간이 지남에 따라 변할 수 있는 데이터입니다.<br><br>Compose에서는 `remember`와 `mutableStateOf`를 사용하여 상태를 저장하고 UI 업데이트를 트리거합니다.",
            },
            {
              front: "Recomposition (재구성)",
              back: "State(상태)가 변경될 때 Compose가 UI를 다시 그리는 과정입니다.<br><br>Compose는 변경된 데이터의 영향을 받는 컴포저블만 지능적으로 다시 호출하여 성능을 최적화합니다.",
            },
            {
              front: "Modifier (수정자)",
              back: "UI 컴포넌트의 크기, 레이아웃, 동작, 모양, 클릭 이벤트 등을 지정하는 표준화된 객체입니다.<br><br>예: `Modifier.padding(16.dp).fillMaxWidth()`",
            },
          ],
        },
      ];

      // --- Utility: Sleep & Exponential Backoff ---
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      async function fetchWithRetry(url, options, maxRetries = 5) {
        for (let i = 0; i < maxRetries; i++) {
          try {
            const response = await fetch(url, options);
            if (!response.ok)
              throw new Error(`HTTP error! status: ${response.status}`);
            return await response.json();
          } catch (error) {
            if (i === maxRetries - 1) throw error;
            await sleep(Math.pow(2, i) * 1000);
          }
        }
      }

      // --- Navigation Functions ---
      function showScreen(screenId) {
        const screens = [
          "screen-home",
          "screen-categories",
          "screen-flashcards",
          "screen-flashcards-end",
          "screen-quiz-loading",
          "screen-quiz-play",
          "screen-quiz-result",
        ];
        screens.forEach((id) =>
          document.getElementById(id).classList.add("hidden"),
        );
        document.getElementById(screenId).classList.remove("hidden");

        // 홈버튼 표시 로직
        const btnHome = document.getElementById("btn-home");
        if (screenId === "screen-home") {
          btnHome.classList.add("hidden");
        } else {
          btnHome.classList.remove("hidden");
        }
      }

      function goHome() {
        showScreen("screen-home");
      }

      // --- Flashcard Functions ---
      function openCategory(index) {
        currentCategoryIndex = index;
        currentCardIndex = 0;
        isFlipped = false;
        document.getElementById("flashcard-inner").style.transform = "";
        updateFlashcardUI();
        showScreen("screen-flashcards");
      }

      async function updateFlashcardUI() {
        const category = flashcardCategories[currentCategoryIndex];
        const card = category.cards[currentCardIndex];

        document.getElementById("fc-progress").innerText =
          `${currentCardIndex + 1} / ${category.cards.length}`;
        document.getElementById("fc-title").innerText = category.title;
        document.getElementById("fc-front-title").innerHTML = card.front;

        const backContent = document.getElementById("fc-back-content");
        backContent.innerHTML = card.back;

        // Reset Flip
        if (isFlipped) {
          document.getElementById("flashcard-inner").style.transform = "";
          isFlipped = false;
          // 애니메이션을 위해 잠시 대기
          await sleep(300);
        }

        // 이미지 생성이 필요한 카드 (Gemini Imagen API)
        if (card.requiresImage && !card.cachedImage) {
          backContent.innerHTML = `
                <div class="flex flex-col items-center">
                    <div class="loader mb-4 border-[#3DDC84]"></div>
                    <p class="text-sm text-gray-500">AI가 다이어그램을 생성 중입니다...</p>
                </div>
            `;
          generateImage(card);
        } else if (card.cachedImage) {
          backContent.innerHTML = `
                <img src="${card.cachedImage}" class="w-full rounded-xl shadow-sm mb-4" alt="AI Generated Diagram"/>
                <div class="text-sm bg-gray-100 p-2 rounded">${card.back}</div>
            `;
        }
      }

      async function generateImage(card) {
        try {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;
          const payload = {
            instances: [{ prompt: card.imagePrompt }],
            parameters: { sampleCount: 1 },
          };

          const data = await fetchWithRetry(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          if (
            data.predictions &&
            data.predictions[0] &&
            data.predictions[0].bytesBase64Encoded
          ) {
            const imageUrl = `data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`;
            card.cachedImage = imageUrl; // 캐싱

            // 현재 카드가 맞는지 확인 후 업데이트
            const currentCat = flashcardCategories[currentCategoryIndex];
            if (currentCat.cards[currentCardIndex] === card && isFlipped) {
              document.getElementById("fc-back-content").innerHTML = `
                        <img src="${imageUrl}" class="w-full rounded-xl shadow-sm mb-4" alt="AI Generated Diagram"/>
                        <div class="text-sm bg-gray-100 p-3 rounded-lg">${card.back}</div>
                    `;
            }
          } else {
            throw new Error("Invalid image response");
          }
        } catch (error) {
          console.error("Image generation failed:", error);
          const currentCat = flashcardCategories[currentCategoryIndex];
          if (currentCat.cards[currentCardIndex] === card) {
            document.getElementById("fc-back-content").innerHTML = `
                    <div class="p-3 bg-gray-100 text-gray-500 rounded-xl text-xs mb-4 text-center">API 설정 문제로 다이어그램을 불러올 수 없습니다.</div>
                    <div>${card.back}</div>
                `;
          }
        }
      }

      function flipCard() {
        isFlipped = !isFlipped;
        const inner = document.getElementById("flashcard-inner");
        inner.style.transform = isFlipped ? "rotateY(180deg)" : "";
      }

      function nextCard() {
        const category = flashcardCategories[currentCategoryIndex];
        if (currentCardIndex < category.cards.length - 1) {
          currentCardIndex++;
          updateFlashcardUI();
        } else {
          showScreen("screen-flashcards-end");
        }
      }

      function prevCard() {
        if (currentCardIndex > 0) {
          currentCardIndex--;
          updateFlashcardUI();
        }
      }

      async function generateAICardForCurrentCategory() {
        const btn = document.getElementById("btn-generate-ai-card");
        const originalText = btn.innerHTML;
        btn.innerHTML =
          '<div class="loader mx-auto border-t-white w-6 h-6 border-2 border-white/30 rounded-full animate-spin"></div>';
        btn.disabled = true;

        const category = flashcardCategories[currentCategoryIndex];
        const promptText = `
            코틀린/안드로이드 초보자를 위한 학습 앱입니다.
            현재 카테고리는 '${category.title}'입니다. 
            이 카테고리에 맞는 새로운 심화 학습 카드 1개를 생성해주세요. 기존의 카드 내용과 겹치지 않게 새로운 내용을 다뤄주세요.
            반드시 아래 구조의 순수 JSON 포맷으로만 응답하세요. 백틱(\`\`\`)이나 추가 텍스트를 포함하지 마세요.
            {
                "front": "카드 앞면 제목 (핵심 키워드)",
                "back": "카드 뒷면 설명 (HTML 허용, <b>나 <br> 등 사용하여 보기 좋게 작성)"
            }
        `;

        try {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
          const payload = {
            contents: [{ parts: [{ text: promptText }] }],
            generationConfig: { responseMimeType: "application/json" },
          };

          const data = await fetchWithRetry(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          const responseText = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!responseText) throw new Error("Empty response");

          const parsed = JSON.parse(
            responseText
              .replace(/```json/g, "")
              .replace(/```/g, "")
              .trim(),
          );

          if (parsed.front && parsed.back) {
            category.cards.push({ front: parsed.front, back: parsed.back });
            currentCardIndex++;
            updateFlashcardUI();
            showScreen("screen-flashcards");
          } else {
            throw new Error("Invalid format");
          }
        } catch (error) {
          console.error("AI Card generation failed:", error);
          alert("AI 카드 생성에 실패했습니다. (API 환경에서 실행해주세요)");
        } finally {
          btn.innerHTML = originalText;
          btn.disabled = false;
        }
      }

      // --- Quiz Functions ---
      async function startQuizFlow() {
        showScreen("screen-quiz-loading");

        try {
          const promptText = `
                당신은 친절한 안드로이드/코틀린 강사입니다. 코틀린 초보자를 위해 모바일 앱에서 풀 수 있는 객관식 퀴즈 5문제를 생성해주세요.
                주제는 골고루 포함하세요: 안드로이드 생명주기(Activity/Fragment), 코틀린 스코프 함수(let, run, apply 등) 및 Null-safety, Jetpack Compose(State, Modifier 등).
                
                반드시 아래 구조의 순수 JSON 포맷으로만 응답하세요. 백틱(\`\`\`)이나 추가 텍스트를 포함하지 마세요.
                {
                  "questions": [
                    {
                      "question": "문제 내용 (한국어)",
                      "options": ["보기1", "보기2", "보기3", "보기4"],
                      "correctIndex": 정답인덱스번호(0에서 3사이의 정수),
                      "explanation": "정답인 이유에 대한 짧고 명확한 해설 (한국어)"
                    }
                  ]
                }
            `;

          const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
          const payload = {
            contents: [{ parts: [{ text: promptText }] }],
            generationConfig: {
              responseMimeType: "application/json",
            },
          };

          const data = await fetchWithRetry(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          const responseText = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!responseText) throw new Error("Empty response from Gemini");

          const parsed = JSON.parse(
            responseText
              .replace(/```json/g, "")
              .replace(/```/g, "")
              .trim(),
          );

          if (parsed && parsed.questions && parsed.questions.length > 0) {
            quizData = parsed.questions;
            currentQuizIndex = 0;
            userScore = 0;
            showScreen("screen-quiz-play");
            renderQuizQuestion();
          } else {
            throw new Error("Invalid JSON structure");
          }
        } catch (error) {
          console.error("Quiz generation failed:", error);

          // Fallback Quiz Data (API 실패 시 오프라인/기본 퀴즈 제공)
          quizData = [
            {
              question:
                "Activity 생명주기에서 화면에 보이기 직전에 호출되는 메서드는?",
              options: ["onCreate()", "onStart()", "onResume()", "onDestroy()"],
              correctIndex: 1,
              explanation:
                "화면에 보이기 직전에는 onStart()가 호출되며, 사용자와 상호작용하기 직전에는 onResume()이 호출됩니다.",
            },
            {
              question:
                "코틀린에서 NullPointerException을 방지하기 위해 사용하는 안전한 호출 연산자는?",
              options: ["!!", "?:", "?.", "::"],
              correctIndex: 2,
              explanation:
                "?.(Safe Call) 연산자를 사용하면 객체가 null이 아닐 때만 메서드나 프로퍼티에 접근합니다.",
            },
            {
              question:
                "Jetpack Compose에서 시간이 지남에 따라 변할 수 있는 데이터를 무엇이라 부르나요?",
              options: ["Modifier", "State", "Composable", "Recomposition"],
              correctIndex: 1,
              explanation:
                "State(상태)가 변경되면 Compose는 해당 데이터를 읽는 UI를 자동으로 다시 그립니다.",
            },
            {
              question:
                "수신 객체를 생성하고 내부 속성을 초기화한 후 그 객체 자신을 반환할 때 가장 적합한 스코프 함수는?",
              options: ["let", "run", "with", "apply"],
              correctIndex: 3,
              explanation:
                "apply는 수신 객체 자신을 반환하므로 인스턴스 초기화에 주로 사용됩니다.",
            },
            {
              question:
                "Compose에서 UI의 크기나 패딩 등을 변경할 때 사용하는 객체는?",
              options: ["Layout", "View", "Modifier", "State"],
              correctIndex: 2,
              explanation:
                "Modifier는 컴포저블의 장식, 레이아웃, 동작 등을 수정하는 역할을 합니다.",
            },
          ];
          currentQuizIndex = 0;
          userScore = 0;
          showScreen("screen-quiz-play");
          renderQuizQuestion();
        }
      }

      function renderQuizQuestion() {
        isAnswering = false;
        const q = quizData[currentQuizIndex];

        document.getElementById("quiz-progress").innerText =
          `문제 ${currentQuizIndex + 1} / ${quizData.length}`;
        document.getElementById("quiz-score").innerText =
          `현재 점수: ${userScore}점`;
        document.getElementById("quiz-question").innerText = q.question;

        const optionsContainer = document.getElementById("quiz-options");
        optionsContainer.innerHTML = "";

        q.options.forEach((opt, index) => {
          const btn = document.createElement("button");
          btn.className =
            "quiz-option w-full bg-white border-2 border-gray-200 text-gray-700 font-medium p-4 rounded-xl text-left shadow-sm btn-press focus:outline-none";
          btn.innerText = opt;
          btn.onclick = () => handleQuizAnswer(index, btn);
          optionsContainer.appendChild(btn);
        });

        document
          .getElementById("quiz-feedback-container")
          .classList.add("hidden");
      }

      function handleQuizAnswer(selectedIndex, selectedBtn) {
        if (isAnswering) return; // 중복 클릭 방지
        isAnswering = true;

        const q = quizData[currentQuizIndex];
        const buttons = document.getElementById("quiz-options").children;

        // 모든 버튼 비활성화
        for (let btn of buttons) {
          btn.onclick = null;
          btn.classList.remove("btn-press");
          btn.style.opacity = "0.7";
        }

        // 정답 여부 판단 및 시각적 피드백
        if (selectedIndex === q.correctIndex) {
          selectedBtn.classList.add("quiz-correct");
          userScore += 20; // 5문제 기준 1문제당 20점
          document.getElementById("quiz-score").innerText =
            `현재 점수: ${userScore}점`;
          showToast(true);
        } else {
          selectedBtn.classList.add("quiz-wrong");
          // 정답 버튼도 초록색으로 표시
          buttons[q.correctIndex].classList.add("quiz-correct");
          showToast(false);
        }

        // 해설 및 다음 버튼 표시
        const feedbackContainer = document.getElementById(
          "quiz-feedback-container",
        );
        document.getElementById("quiz-explanation").innerHTML =
          `<b>해설:</b> ${q.explanation}`;

        // 마지막 문제면 버튼 텍스트 변경
        const nextBtn = document.getElementById("btn-next-quiz");
        if (currentQuizIndex === quizData.length - 1) {
          nextBtn.innerText = "결과 보기";
          nextBtn.classList.replace("bg-[#7F52FF]", "bg-[#3DDC84]");
        } else {
          nextBtn.innerText = "다음 문제";
          nextBtn.classList.replace("bg-[#3DDC84]", "bg-[#7F52FF]");
        }

        feedbackContainer.classList.remove("hidden");
      }

      function nextQuiz() {
        if (currentQuizIndex < quizData.length - 1) {
          currentQuizIndex++;
          renderQuizQuestion();
        } else {
          finishQuiz();
        }
      }

      function finishQuiz() {
        showScreen("screen-quiz-result");
        const scoreElement = document.getElementById("final-score");
        const messageElement = document.getElementById("final-message");

        scoreElement.innerText = userScore;

        if (userScore === 100) {
          messageElement.innerText = "완벽합니다! 🎉";
        } else if (userScore >= 60) {
          messageElement.innerText = "잘하셨어요! 👍";
        } else {
          messageElement.innerText = "조금 더 복습해볼까요? 💪";
        }
      }

      function showToast(isCorrect) {
        const toast = document.getElementById("toast-notification");
        const icon = document.getElementById("toast-icon");
        const message = document.getElementById("toast-message");

        // 상태 초기화
        toast.className =
          "absolute top-16 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full shadow-xl text-white font-bold text-lg transition-all duration-300 z-50 flex items-center gap-2 pointer-events-none opacity-0 scale-90";

        if (isCorrect) {
          toast.classList.add("bg-[#22c55e]"); // 초록색
          icon.innerHTML =
            '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
          message.innerText = "정답입니다! 🎉";
        } else {
          toast.classList.add("bg-[#ef4444]"); // 빨간색
          icon.innerHTML =
            '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>';
          message.innerText = "아쉽네요! ❌";
        }

        // 나타나기 애니메이션 (약간의 지연으로 렌더링 보장)
        setTimeout(() => {
          toast.classList.add("opacity-100", "scale-100", "translate-y-4");
          toast.classList.remove("opacity-0", "scale-90");
        }, 10);

        // 2초 후 숨김 처리
        setTimeout(() => {
          toast.classList.remove("opacity-100", "scale-100", "translate-y-4");
          toast.classList.add("opacity-0", "scale-90");
        }, 2000);
      }
    </script>
  </body>
</html>
