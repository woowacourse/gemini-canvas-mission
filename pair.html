<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlgoCycle AI - 알고리즘 분석 도구</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        .glass-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border-radius: 2rem;
        }

        .level-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid #e2e8f0;
            background: white;
        }

        .level-btn.active {
            border-color: #2563eb;
            background-color: #eff6ff;
            color: #2563eb;
            font-weight: 800;
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.1);
        }

        /* --- 정밀 마크다운 뷰어 스타일 --- */
        .markdown-viewer h1 { font-size: 2.25rem; font-weight: 800; margin-bottom: 2rem; color: #0f172a; letter-spacing: -0.025em; border-bottom: 4px solid #3b82f6; padding-bottom: 0.5rem; }
        
        .section-header { 
            font-size: 1.4rem; font-weight: 800; margin-top: 3.5rem; margin-bottom: 1.5rem; 
            color: #1e40af; display: flex; align-items: center; gap: 0.75rem; 
            background: #f1f5ff; padding: 1.25rem 1.5rem; border-radius: 1.25rem;
            border-left: 6px solid #2563eb;
        }
        
        .sub-section-header { 
            font-size: 1.2rem; font-weight: 700; margin-top: 2rem; margin-bottom: 1rem; 
            padding: 0.75rem 1.25rem; border-radius: 1rem;
            display: flex; align-items: center; gap: 0.6rem;
        }
        .header-2-1 { background: #f0fdf4; color: #166534; border-left: 4px solid #22c55e; }
        .header-2-2 { background: #fff7ed; color: #9a3412; border-left: 4px solid #f97316; }

        .markdown-viewer p { font-size: 1.1rem; margin-bottom: 1.25rem; color: #334155; padding: 0 0.25rem; }
        .markdown-viewer strong { 
            color: #0f172a; 
            font-weight: 700; 
            background: linear-gradient(to top, #fef08a 35%, transparent 35%);
            padding: 0 2px;
        }
        
        .markdown-viewer ul { margin-bottom: 1.75rem; padding-left: 0.5rem; }
        .markdown-viewer li { position: relative; font-size: 1.05rem; margin-bottom: 0.9rem; padding-left: 1.75rem; color: #475569; list-style: none; }
        .markdown-viewer li::before { content: "•"; position: absolute; left: 0.25rem; color: #3b82f6; font-weight: 900; font-size: 1.2rem; }

        .md-body { padding: 0 0.5rem; }

        pre {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 1.75rem;
            border-radius: 1.5rem;
            overflow-x: auto;
            font-family: 'Fira Code', 'Cascadia Code', monospace;
            font-size: 0.9rem;
            margin: 1.5rem 0;
            border: 1px solid #1e293b;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            /* 핵심 수정: AI가 생성한 줄바꿈과 들여쓰기를 그대로 유지 */
            white-space: pre; 
        }

        #loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.98);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .animate-in { animation: fadeInUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen pb-24">

    <!-- Loading UI -->
    <div id="loading-overlay">
        <div class="relative mb-10">
            <div class="w-28 h-28 border-[10px] border-blue-50 border-t-blue-600 rounded-full animate-spin"></div>
            <div class="absolute inset-0 flex items-center justify-center text-blue-600">
                <i class="fas fa-microchip text-4xl animate-pulse"></i>
            </div>
        </div>
        <h2 class="text-3xl font-black text-slate-800">알고리즘 정밀 분석 중...</h2>
        <p class="text-slate-500 mt-4 font-medium text-center px-6 max-w-md">API 응답을 기다리고 있습니다. 대규모 코드 분석 시 최대 15초가 소요될 수 있습니다.</p>
    </div>

    <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 px-6 py-5 flex justify-between items-center sticky top-0 z-40 shadow-sm">
        <div class="flex items-center gap-3 cursor-pointer group" onclick="location.reload()">
            <div class="bg-blue-600 p-2.5 rounded-2xl group-hover:rotate-6 transition-all duration-300">
                <i class="fas fa-terminal text-white text-xl"></i>
            </div>
            <h1 class="text-2xl font-black tracking-tighter text-slate-900">AlgoCycle <span class="text-blue-600">AI</span></h1>
        </div>
        <div class="hidden sm:flex items-center gap-6 text-xs font-black text-slate-400 uppercase tracking-widest">
            <span>Level up Your Code</span>
            <span class="w-1.5 h-1.5 bg-blue-500 rounded-full"></span>
            <span>Review Assistant</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-12">
        
        <!-- INPUT AREA -->
        <section id="input-section" class="animate-in">
            <div class="text-center mb-14">
                <h2 class="text-5xl font-black text-slate-900 mb-5 tracking-tight">알고리즘 오답노트</h2>
                <p class="text-slate-500 text-xl font-medium">당신의 코드를 AI가 분석하고, 성장을 위한 복습 계획을 설계합니다.</p>
            </div>

            <div class="space-y-10">
                <!-- Problem Meta -->
                <div class="glass-card p-10">
                    <label class="block text-xl font-black mb-5 text-slate-800 flex items-center gap-3">
                        <i class="fas fa-file-signature text-blue-600"></i> 문제 정보
                    </label>
                    <textarea id="problem-input" rows="4" placeholder="예: 백준 1234번 - 가르침 (비트마스킹, N의 범위 50 이하)" class="w-full p-6 rounded-3xl border-2 border-slate-100 bg-slate-50 focus:bg-white focus:border-blue-500 focus:outline-none transition-all text-lg shadow-inner"></textarea>
                    
                    <div class="mt-12">
                        <label class="block text-xl font-black mb-5 text-slate-800 flex items-center gap-3">
                            <i class="fas fa-layer-group text-blue-600"></i> 분석 강도 설정
                        </label>
                        <div class="grid grid-cols-3 gap-5">
                            <button onclick="setLevel('간결히')" class="level-btn p-6 rounded-2xl text-center font-black text-lg" id="btn-간결히">간결히</button>
                            <button onclick="setLevel('보통')" class="level-btn active p-6 rounded-2xl text-center font-black text-lg" id="btn-보통">보통</button>
                            <button onclick="setLevel('세세히')" class="level-btn p-6 rounded-2xl text-center font-black text-lg" id="btn-세세히">세세히</button>
                        </div>
                    </div>
                </div>

                <!-- Code Input -->
                <div class="glass-card p-10">
                    <label class="block text-xl font-black mb-5 text-slate-800 flex items-center gap-3">
                        <i class="fas fa-code text-blue-600"></i> 작성한 소스코드
                    </label>
                    <textarea id="code-input" rows="14" placeholder="작성한 코드를 이곳에 붙여넣으세요..." class="w-full p-6 rounded-3xl border-2 border-slate-100 bg-slate-900 text-blue-100 focus:outline-none transition-all font-mono text-sm leading-relaxed shadow-2xl"></textarea>
                </div>

                <button onclick="startAnalysis()" class="w-full bg-blue-600 text-white py-8 rounded-[2.5rem] font-black text-2xl hover:bg-blue-700 transition shadow-2xl shadow-blue-200 flex items-center justify-center gap-5 group">
                    <i class="fas fa-bolt group-hover:scale-125 transition"></i> AI 분석 리포트 발행
                </button>
            </div>
        </section>

        <!-- RESULT AREA -->
        <section id="result-section" class="hidden animate-in space-y-12 pb-20">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-5 sticky top-28 z-30">
                <button onclick="location.reload()" class="w-full sm:w-auto bg-white/90 backdrop-blur border border-slate-200 px-8 py-4 rounded-2xl font-black text-slate-600 hover:text-blue-600 transition flex items-center justify-center gap-3 shadow-xl">
                    <i class="fas fa-redo"></i> 다시 작성
                </button>
                <button onclick="copyMarkdown()" class="w-full sm:w-auto bg-blue-600 text-white px-10 py-4 rounded-2xl font-black hover:bg-blue-700 transition shadow-2xl flex items-center justify-center gap-3">
                    <i class="fas fa-copy"></i> Notion 스타일로 복사
                </button>
            </div>

            <!-- Review Scheduler -->
            <div id="review-banner" class="bg-white border-4 border-blue-600 p-10 rounded-[3rem] shadow-2xl relative overflow-hidden group">
                <div class="absolute -top-10 -right-10 opacity-[0.03] group-hover:scale-110 transition duration-1000">
                    <i class="fas fa-calendar-alt text-[15rem]"></i>
                </div>
                <div class="relative z-10 flex flex-col md:flex-row items-center gap-10">
                    <div class="flex flex-col items-center">
                        <div class="bg-blue-600 text-white w-24 h-24 rounded-[2rem] flex items-center justify-center text-5xl shadow-xl mb-3">
                            <i class="fas fa-clock-rotate-left"></i>
                        </div>
                        <span class="text-blue-600 font-black text-sm tracking-widest">SCHEDULE</span>
                    </div>
                    <div class="text-center md:text-left flex-grow">
                        <h3 class="text-3xl font-black text-slate-900 mb-3">맞춤형 복습 사이클</h3>
                        <p id="review-reason" class="text-slate-500 font-bold text-lg mb-6 max-w-2xl leading-relaxed"></p>
                        <div id="review-dates" class="flex flex-wrap justify-center md:justify-start gap-5"></div>
                    </div>
                </div>
            </div>

            <!-- Report Content -->
            <div id="markdown-output" class="glass-card p-14 markdown-viewer">
                <!-- AI Content Injected Here -->
            </div>
        </section>

    </main>

    <script>
        let currentLevel = '보통';
        let currentMarkdown = "";
        const apiKey = ""; 

        function setLevel(lvl) {
            currentLevel = lvl;
            document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${lvl}`).classList.add('active');
        }

        function getFormattedDate(daysToAdd) {
            const date = new Date();
            date.setDate(date.getDate() + daysToAdd);
            return `${date.getFullYear()}년 ${String(date.getMonth() + 1).padStart(2, '0')}월 ${String(date.getDate()).padStart(2, '0')}일`;
        }

        async function fetchGeminiWithRetry(url, options, maxRetries = 5) {
            let delay = 1000;
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        throw new Error(`HTTP Error: ${response.status}`);
                    }
                    const text = await response.text();
                    if (!text) throw new Error("Empty response body");
                    return JSON.parse(text);
                } catch (err) {
                    if (i === maxRetries - 1) throw err;
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= 2;
                }
            }
        }

        async function startAnalysis() {
            const prob = document.getElementById('problem-input').value.trim();
            const code = document.getElementById('code-input').value.trim();

            if(!prob || !code) {
                alert("문제와 코드를 모두 입력해 주세요!");
                return;
            }

            const overlay = document.getElementById('loading-overlay');
            overlay.style.display = 'flex';

            const systemPrompt = "당신은 알고리즘 교육 전문가입니다. 사용자의 코드를 엄격하게 분석하되 친절하게 가이드합니다. 출력은 반드시 지정된 JSON 형식을 준수하세요.";
            
            const userPrompt = `
                사용자의 알고리즘 풀이를 분석하여 리포트를 작성하세요.
                분석 수준: ${currentLevel}

                [입력]
                문제: ${prob}
                코드: ${code}

                [JSON 응답 스키마 필독]
                1. title: 문제의 핵심 제목 (추출 불가 시 "알고리즘 분석")
                2. reviewDays: 복습을 추천하는 날짜 간격 (예: [1, 3, 7])
                3. reviewReason: 이 알고리즘의 망각 곡선을 고려한 복습 이유 (1문장)
                4. section0: 알고리즘 분류 (예: DFS/BFS, 세그먼트 트리 등)
                5. section1: 해당 알고리즘의 시간/공간 복잡도 및 동작 원리
                6. section2_1: 코드의 효율성이나 가독성 중 칭찬할 부분
                7. section2_2: 로직 최적화, 변수명, 예외처리 등 개선할 부분
                8. optimizedCode: 성능과 가독성이 개선된 최종 소스코드. 반드시 표준 '자바 컨벤션(또는 해당 언어의 공식 스타일 가이드)'에 맞춰 적절한 줄바꿈과 들여쓰기를 포함하여 사람이 읽기 좋게 포맷팅된 형태로 작성하세요.

                [작성 가이드]
                - 각 섹션에 목차 번호(0., 1. 등)를 포함하지 마세요. UI에서 자동으로 삽입합니다.
                - 가독성을 위해 불렛 포인트(-)와 강조(**)를 많이 사용해 주세요.
            `;

            try {
                const result = await fetchGeminiWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userPrompt }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: { 
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "OBJECT",
                                properties: {
                                    title: { type: "STRING" },
                                    reviewDays: { type: "ARRAY", items: { type: "NUMBER" } },
                                    reviewReason: { type: "STRING" },
                                    section0: { type: "STRING" },
                                    section1: { type: "STRING" },
                                    section2_1: { type: "STRING" },
                                    section2_2: { type: "STRING" },
                                    optimizedCode: { type: "STRING" }
                                }
                            }
                        }
                    })
                });

                const content = JSON.parse(result.candidates[0].content.parts[0].text);
                renderResult(content);
                
            } catch (e) {
                console.error("Analysis Error:", e);
                alert("데이터를 분석하는 과정에서 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.");
            } finally {
                overlay.style.display = 'none';
            }
        }

        function simpleMarkdown(text) {
            if(!text) return "";
            return text.split('\n').map(line => {
                line = line.trim();
                if(!line) return '<div class="h-4"></div>';
                if(line.startsWith('- ') || line.startsWith('* ')) {
                    const content = line.substring(2).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                    return `<li>${content}</li>`;
                }
                return `<p>${line.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</p>`;
            }).join('');
        }

        function renderResult(res) {
            const dateLabels = res.reviewDays.map(d => getFormattedDate(d));
            
            document.getElementById('input-section').classList.add('hidden');
            document.getElementById('result-section').classList.remove('hidden');

            // Set Review Banner
            document.getElementById('review-reason').innerText = res.reviewReason;
            document.getElementById('review-dates').innerHTML = dateLabels.map((date, i) => `
                <div class="bg-blue-50 border-2 border-blue-100 px-6 py-4 rounded-[1.25rem] text-center shadow-sm">
                    <div class="text-[11px] font-black text-blue-400 mb-1 tracking-widest uppercase">Phase ${i+1}</div>
                    <div class="text-base font-black text-slate-800">${date}</div>
                </div>
            `).join('');

            // Set Markdown Content
            const outputArea = document.getElementById('markdown-output');
            const codeSafe = (res.optimizedCode || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

            // 제목 '해설'로 고정 적용
            outputArea.innerHTML = `
                <h1>해설</h1>
                
                <div class="section-header"><i class="fas fa-tags"></i> 0. 해당 문제 알고리즘 카테고리 분류</div>
                <div class="md-body"><p><strong>${res.section0 || "분류 정보 없음"}</strong></p></div>

                <div class="section-header"><i class="fas fa-microchip"></i> 1. 알고리즘 핵심 원리</div>
                <div class="md-body">${simpleMarkdown(res.section1)}</div>

                <div class="section-header"><i class="fas fa-magnifying-glass"></i> 2. 코드 리뷰 및 개선점</div>
                <div class="sub-section-header header-2-1"><i class="fas fa-check-circle"></i> 2-1. 칭찬할 점</div>
                <div class="md-body">${simpleMarkdown(res.section2_1)}</div>
                
                <div class="sub-section-header header-2-2"><i class="fas fa-exclamation-circle"></i> 2-2. 개선점</div>
                <div class="md-body">${simpleMarkdown(res.section2_2)}</div>

                <div class="section-header"><i class="fas fa-code"></i> 3. 추천 최적화 소스코드</div>
                <pre><code>${codeSafe}</code></pre>
            `;

            currentMarkdown = `# 해설\n\n## 0. 카테고리\n${res.section0}\n\n## 1. 핵심원리\n${res.section1}\n\n## 2. 리뷰\n### 2-1. 칭찬할 점\n${res.section2_1}\n### 2-2. 개선점\n${res.section2_2}\n\n## 3. 최적화 코드\n\`\`\`\n${res.optimizedCode}\n\`\`\``;
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function copyMarkdown() {
            const el = document.createElement('textarea');
            el.value = currentMarkdown;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);

            const btn = document.querySelector('button[onclick="copyMarkdown()"]');
            const original = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check-double"></i> 복사 완료';
            btn.classList.replace('bg-blue-600', 'bg-green-600');
            setTimeout(() => {
                btn.innerHTML = original;
                btn.classList.replace('bg-green-600', 'bg-blue-600');
            }, 2000);
        }
    </script>
</body>
</html>
