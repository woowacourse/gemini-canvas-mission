<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우테코 데일리 가챠</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f8fafc;
        }

        .woowa-mint {
            background-color: #2AC1BC;
        }
        .woowa-mint-text {
            color: #2AC1BC;
        }
        .woowa-mint-border {
            border-color: #2AC1BC;
        }
        .woowa-mint-hover:hover {
            background-color: #23a39e;
        }

        /* Loading Spinner */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2AC1BC;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        /* Custom Radio Button Styles */
        .custom-radio:checked + div,
        .custom-checkbox:checked + div {
            background-color: #2AC1BC;
            color: white;
            border-color: #2AC1BC;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 p-4 md:p-8">

<div class="max-w-4xl mx-auto">
    <!-- Header -->
    <header class="text-center mb-10 pt-8">
        <h1 class="text-3xl md:text-4xl font-extrabold mb-3 tracking-tight">
            ☕ 우테코 <span class="woowa-mint-text">데일리 가챠</span> 🎰
        </h1>
        <p class="text-slate-500 text-sm md:text-base">
            매일 아침 10시, 30분 동안 진행되는 데일리 활동!<br class="hidden md:block">
            진부한 TMI는 그만. 우리 조/마을/층에 딱 맞는 기발한 주제를 찾아보세요.
        </p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-12 gap-8">
        <!-- Left: Settings Form -->
        <div class="md:col-span-5 space-y-6 glass-card p-6 md:p-8 rounded-2xl">
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="woowa-mint-text"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                옵션 선택
            </h2>

            <!-- Size Selection -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">👥 참여 규모</label>
                <div class="grid grid-cols-3 gap-2">
                    <label class="cursor-pointer">
                        <input type="radio" name="size" value="조 단위 (약 5명)" class="custom-radio sr-only" checked>
                        <div class="text-center p-2 md:p-3 rounded-lg border border-slate-200 hover:border-slate-300 transition-all text-xs md:text-sm font-medium break-keep leading-snug tracking-tight">
                            조 (5명)
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="size" value="마을 단위 (약 20명)" class="custom-radio sr-only">
                        <div class="text-center p-2 md:p-3 rounded-lg border border-slate-200 hover:border-slate-300 transition-all text-xs md:text-sm font-medium break-keep leading-snug tracking-tight">
                            마을 (20명)
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="size" value="층 단위 (약 50명)" class="custom-radio sr-only">
                        <div class="text-center p-2 md:p-3 rounded-lg border border-slate-200 hover:border-slate-300 transition-all text-xs md:text-sm font-medium break-keep leading-snug tracking-tight">
                            층 (50명)
                        </div>
                    </label>
                </div>
            </div>

            <!-- Style Selection -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">🎭 분위기 / 스타일</label>
                <div class="grid grid-cols-2 gap-2">
                    <label class="cursor-pointer">
                        <input type="radio" name="style" value="가볍게 (아이스브레이킹, 텐션업, 웃음)" class="custom-radio sr-only" checked>
                        <div class="text-center p-2 md:p-3 rounded-lg border border-slate-200 hover:border-slate-300 transition-all text-xs md:text-sm font-medium break-keep leading-snug tracking-tight">
                            🎈 가볍게 (텐션업)
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="style" value="무겁게 (회고, 딥톡, 진지한 고민 나누기)" class="custom-radio sr-only">
                        <div class="text-center p-2 md:p-3 rounded-lg border border-slate-200 hover:border-slate-300 transition-all text-xs md:text-sm font-medium break-keep leading-snug tracking-tight">
                            ⚓ 무겁게 (딥톡)
                        </div>
                    </label>
                </div>
            </div>

            <!-- Category Selection -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">📂 카테고리 (다중 선택 가능)</label>
                <div class="grid grid-cols-2 gap-2" id="category">
                    <label class="cursor-pointer">
                        <input type="checkbox" name="category" value="간단한 게임" class="custom-checkbox sr-only" checked>
                        <div class="text-center p-2 md:p-3 rounded-lg border border-slate-200 hover:border-slate-300 transition-all text-xs md:text-sm font-medium break-keep leading-snug tracking-tight">
                            🎮 간단한 게임
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="checkbox" name="category" value="가벼운 신체 활동" class="custom-checkbox sr-only">
                        <div class="text-center p-2 md:p-3 rounded-lg border border-slate-200 hover:border-slate-300 transition-all text-xs md:text-sm font-medium break-keep leading-snug tracking-tight">
                            🏃 신체 활동
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="checkbox" name="category" value="주제 중심의 토크" class="custom-checkbox sr-only">
                        <div class="text-center p-2 md:p-3 rounded-lg border border-slate-200 hover:border-slate-300 transition-all text-xs md:text-sm font-medium break-keep leading-snug tracking-tight">
                            💬 주제 중심 토크
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="checkbox" name="category" value="무작위 (알아서 추천)" class="custom-checkbox sr-only">
                        <div class="text-center p-2 md:p-3 rounded-lg border border-slate-200 hover:border-slate-300 transition-all text-xs md:text-sm font-medium break-keep leading-snug tracking-tight">
                            🎲 무작위 추천
                        </div>
                    </label>
                </div>
            </div>

            <!-- Generate Button -->
            <button id="generateBtn" class="w-full woowa-mint woowa-mint-hover text-white font-bold py-4 px-6 rounded-xl transition-all flex justify-center items-center gap-2 mt-4 shadow-lg shadow-teal-500/30">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72Z"/><path d="m14 7 3 3"/><path d="M5 6v4"/><path d="M19 14v4"/><path d="M10 2v2"/><path d="M7 8H3"/><path d="M21 16h-4"/><path d="M11 3H9"/></svg>
                데일리 가챠 돌리기
            </button>
        </div>

        <!-- Right: Results Area -->
        <div class="md:col-span-7 glass-card p-6 md:p-8 rounded-2xl flex flex-col min-h-[400px]">
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2 text-slate-800 border-b pb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="woowa-mint-text"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                추천 결과
            </h2>

            <!-- Loading State -->
            <div id="loadingState" class="hidden flex-1 flex flex-col items-center justify-center text-slate-500">
                <div class="loader mb-4"></div>
                <p class="animate-pulse font-medium">AI가 참신한 아이디어를 고민 중입니다...</p>
                <p class="text-xs mt-2 text-slate-400">우테코 감성에 맞는 주제를 뽑는 중 🤖</p>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="flex-1 flex flex-col items-center justify-center text-slate-400 text-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="mb-4 opacity-50"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/></svg>
                <p>좌측에서 옵션을 선택하고<br>추천받기 버튼을 눌러주세요!</p>
            </div>

            <!-- Error State -->
            <div id="errorState" class="hidden flex-1 flex flex-col items-center justify-center text-red-500 text-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-4"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
                <p id="errorMessage" class="font-medium">아이디어를 불러오는데 실패했습니다.</p>
                <button onclick="document.getElementById('generateBtn').click()" class="mt-4 text-sm text-slate-500 underline hover:text-slate-700">다시 시도하기</button>
            </div>

            <!-- Results List -->
            <div id="resultsList" class="hidden space-y-4 overflow-y-auto pr-2 custom-scrollbar flex-1">
                <!-- Cards will be injected here -->
            </div>
        </div>
    </div>
</div>

<style>
    /* Custom Scrollbar for results */
    .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
        background: #f1f5f9;
        border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
    }
</style>

<script>
    const apiKey = ""; // Runtime injection

    // DOM Elements
    const generateBtn = document.getElementById('generateBtn');
    const loadingState = document.getElementById('loadingState');
    const emptyState = document.getElementById('emptyState');
    const errorState = document.getElementById('errorState');
    const errorMessage = document.getElementById('errorMessage');
    const resultsList = document.getElementById('resultsList');

    // Delay utility for exponential backoff
    const delay = ms => new Promise(res => setTimeout(res, ms));

    // Format Result Card
    function createResultCard(item, index) {
        const emojis = ['💡', '🚀', '🔥', '🎯', '✨'];
        const emoji = emojis[index % emojis.length];

        return `
                <div class="bg-white border border-slate-100 p-5 rounded-xl shadow-sm hover:shadow-md transition-shadow">
                    <div class="flex items-start gap-3">
                        <div class="text-2xl mt-1">${emoji}</div>
                        <div class="flex-1">
                            <h3 class="font-bold text-lg text-slate-800 mb-2">${item.title}</h3>
                            <div class="mb-3">
                                <span class="inline-block bg-teal-50 text-teal-700 text-xs font-bold px-2 py-1 rounded mb-1">진행 방법</span>
                                <p class="text-slate-600 text-sm leading-relaxed whitespace-pre-wrap">${item.method}</p>
                            </div>
                            <div class="bg-slate-50 p-3 rounded-lg border border-slate-100">
                                <span class="inline-block text-slate-500 text-xs font-bold mb-1">👍 추천 이유</span>
                                <p class="text-slate-600 text-sm leading-relaxed italic">"${item.reason}"</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
    }

    // Toggle UI states
    function setUIState(state) {
        loadingState.classList.add('hidden');
        emptyState.classList.add('hidden');
        errorState.classList.add('hidden');
        resultsList.classList.add('hidden');
        generateBtn.disabled = (state === 'loading');

        if (state === 'loading') {
            loadingState.classList.remove('hidden');
            generateBtn.innerHTML = '<div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div> 가챠 돌리는 중...';
            generateBtn.classList.add('opacity-70', 'cursor-not-allowed');
        } else {
            generateBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72Z"/><path d="m14 7 3 3"/><path d="M5 6v4"/><path d="M19 14v4"/><path d="M10 2v2"/><path d="M7 8H3"/><path d="M21 16h-4"/><path d="M11 3H9"/></svg> 데일리 가챠 돌리기';
            generateBtn.classList.remove('opacity-70', 'cursor-not-allowed');
        }

        if (state === 'empty') emptyState.classList.remove('hidden');
        if (state === 'error') errorState.classList.remove('hidden');
        if (state === 'results') resultsList.classList.remove('hidden');
    }

    async function fetchRecommendations(size, style, category) {
        const systemPrompt = `당신은 '우아한테크코스(우테코)'라는 개발자 부트캠프의 크루(학생)들을 위한 최고 수준의 레크리에이션 및 데일리 활동 기획자입니다.
            우테코의 데일리 활동은 매일 아침 10시에 정확히 30분 동안 팀원들과 함께 하루를 활기차게 시작하기 위해 진행하는 세션입니다.

            [제약 및 금지 사항 - 매우 중요]
            1. '주말에 뭐하셨나요?', '어제 저녁 뭐 드셨나요?', '자신의 장단점 말하기', 'MBTI 맞추기', 'TMI 방출하기', '좋아하는 영화 추천' 같은 인터넷에 널려있는 너무 흔하고 진부하며 지루한 주제는 절대 금지합니다.
            2. 준비물이 많이 필요하거나, 사전 준비가 길거나, 30분 안에 끝낼 수 없는 과한 활동은 배제하세요.
            3. 타인에게 불쾌감을 줄 수 있는 주제는 제외하세요.

            [요구 사항]
            1. 사용자가 선택한 [규모: ${size}], [스타일: ${style}], [카테고리: ${category}]에 완벽하게 부합하는 활동이어야 합니다.
            2. 참여자들은 20대 중후반 위주의 청년들입니다. 순수하게 텐션을 올리고 팀워크를 다질 수 있는 톡톡 튀고 재미있는 아이디어를 제안하세요. **개발, 코딩, 프로그래밍과 전혀 관련 없는 일상적이고 대중적인 주제나 게임을 적극 추천하세요. 억지로 개발과 연관 지을 필요가 절대 없습니다.**
            3. 창의적인 아이디어 3가지를 제안해주세요.
            4. '진행 방법'은 누구나 바로 읽고 진행자가 되어 따라 할 수 있도록 '1. ~한다. 2. ~한다.' 형식의 명확한 스텝바이스텝(Step-by-step) 가이드와 시간 배분(총 30분)을 상세하게 작성해야 합니다.`;

        const userQuery = `규모: ${size}\n스타일: ${style}\n카테고리: ${category}\n위 조건에 맞는 창의적이고 명확한 진행방법을 가진 데일리 활동 3가지를 추천해주세요.`;

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

        const payload = {
            contents: [{ parts: [{ text: userQuery }] }],
            systemInstruction: { parts: [{ text: systemPrompt }] },
            generationConfig: {
                responseMimeType: "application/json",
                responseSchema: {
                    type: "OBJECT",
                    properties: {
                        recommendations: {
                            type: "ARRAY",
                            items: {
                                type: "OBJECT",
                                properties: {
                                    title: { type: "STRING", description: "활동의 흥미로운 제목" },
                                    method: { type: "STRING", description: "구체적인 진행 방법과 시간 배분" },
                                    reason: { type: "STRING", description: "이 활동이 팀빌딩과 분위기 전환에 왜 좋은지 구체적인 추천 이유" }
                                },
                                required: ["title", "method", "reason"]
                            }
                        }
                    },
                    required: ["recommendations"]
                }
            }
        };

        const maxRetries = 5;
        const baseDelay = 1000;

        for (let i = 0; i < maxRetries; i++) {
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const jsonText = data.candidates[0].content.parts[0].text;
                    return JSON.parse(jsonText).recommendations;
                } else {
                    throw new Error('Invalid response format');
                }
            } catch (error) {
                if (i === maxRetries - 1) throw error;
                await delay(baseDelay * Math.pow(2, i));
            }
        }
    }

    // Event Listener
    generateBtn.addEventListener('click', async () => {
        const size = document.querySelector('input[name="size"]:checked').value;
        const style = document.querySelector('input[name="style"]:checked').value;

        const selectedCategories = Array.from(document.querySelectorAll('input[name="category"]:checked'))
            .map(cb => cb.value);

        if (selectedCategories.length === 0) {
            errorMessage.textContent = '카테고리를 최소 하나 이상 선택해주세요.';
            setUIState('error');
            return;
        }

        const category = selectedCategories.join(', ');

        setUIState('loading');

        try {
            const recommendations = await fetchRecommendations(size, style, category);

            resultsList.innerHTML = '';
            if (recommendations && recommendations.length > 0) {
                recommendations.forEach((item, index) => {
                    resultsList.innerHTML += createResultCard(item, index);
                });
                setUIState('results');
            } else {
                throw new Error('추천 결과를 받아오지 못했습니다.');
            }
        } catch (error) {
            console.error("Error generating recommendations:", error);
            errorMessage.textContent = '일시적인 오류가 발생했습니다. 다시 시도해주세요.';
            setUIState('error');
        }
    });
</script>
</body>
</html>
