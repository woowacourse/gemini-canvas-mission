<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python to Java 코딩테스트 마이그레이션 가이드</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --code-bg: #1e1e1e;
            --code-text: #d4d4d4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        h1 span {
            color: var(--primary-color);
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .input-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        label {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-main);
        }

        textarea {
            width: 100%;
            height: 250px;
            padding: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 0.5rem;
            font-family: 'D2Coding', 'Consolas', monospace;
            font-size: 1rem;
            resize: vertical;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            align-self: center;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #93c5fd;
            cursor: not-allowed;
            transform: none;
        }

        /* Loading Spinner */
        .loader-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem 0;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Results Section */
        #resultSection {
            display: none;
        }

        .result-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--border-color);
        }

        .code-block {
            background-color: var(--code-bg);
            color: var(--code-text);
            padding: 1.5rem;
            border-radius: 0.5rem;
            font-family: 'D2Coding', 'Consolas', monospace;
            overflow-x: auto;
            white-space: pre;
            margin-bottom: 2rem;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .diff-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .diff-card {
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 1.5rem;
        }

        .diff-card h3 {
            color: var(--primary-color);
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        .code-compare {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .code-compare {
                grid-template-columns: 1fr;
            }
        }

        .code-box {
            background-color: #e2e8f0;
            padding: 1rem;
            border-radius: 0.25rem;
        }

        .code-box.python { border-left: 4px solid #f59e0b; }
        .code-box.java { border-left: 4px solid #ef4444; }

        .code-box .label {
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        .code-box pre {
            font-family: 'D2Coding', 'Consolas', monospace;
            margin: 0;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .explanation {
            background-color: white;
            padding: 1rem;
            border-radius: 0.25rem;
            border: 1px dashed var(--border-color);
        }

        .tips-list {
            list-style-type: none;
        }

        .tips-list li {
            position: relative;
            padding-left: 1.5rem;
            margin-bottom: 0.75rem;
        }

        .tips-list li::before {
            content: "💡";
            position: absolute;
            left: 0;
            top: 0;
        }

        .error-message {
            display: none;
            background-color: #fee2e2;
            color: #991b1b;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Python <span>to</span> Java</h1>
        <p class="subtitle">코딩테스트 맞춤형 코드 변환 및 문법 마이그레이션 가이드</p>
    </header>

    <div class="card input-section">
        <label for="pythonInput">파이썬 코드 입력</label>
        <textarea id="pythonInput" placeholder="# 여기에 코딩테스트용 파이썬 코드를 붙여넣으세요.&#10;&#10;import sys&#10;input = sys.stdin.readline&#10;&#10;n = int(input())&#10;arr = list(map(int, input().split()))&#10;arr.sort()&#10;print(arr[0])"></textarea>

        <div id="errorBox" class="error-message"></div>

        <button id="convertBtn" onclick="handleConvert()">자바 코드로 변환 및 분석하기</button>
    </div>

    <div id="loader" class="loader-container">
        <div class="spinner"></div>
        <p>제미나이가 자바 코드로 변환하고 학습 가이드를 생성 중입니다...</p>
    </div>

    <div id="resultSection">
        <div class="card">
            <h2 class="result-title">☕ 변환된 자바 코드 (제출용)</h2>
            <p style="margin-bottom: 1rem; color: var(--text-muted); font-size: 0.9rem;">
                * 코딩테스트에 최적화된 빠른 입출력(BufferedReader, StringTokenizer 등)이 적용되었습니다.
            </p>
            <div id="javaCodeOutput" class="code-block"></div>
        </div>

        <div class="card">
            <h2 class="result-title">🔍 핵심 문법 차이점</h2>
            <div id="differencesOutput" class="diff-grid">
                <!-- 동적으로 채워질 부분 -->
            </div>
        </div>

        <div class="card">
            <h2 class="result-title">🎯 자바 코테 전향자를 위한 꿀팁</h2>
            <ul id="tipsOutput" class="tips-list">
                <!-- 동적으로 채워질 부분 -->
            </ul>
        </div>
    </div>
</div>

<script>
    // 환경에서 주입되는 API 키 (실행 환경에서 자동 할당됨)
    const apiKey = "";

    async function fetchWithRetry(url, options, retries = 5) {
        const delays = [1000, 2000, 4000, 8000, 16000];

        for (let i = 0; i < retries; i++) {
            try {
                const response = await fetch(url, options);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return await response.json();
            } catch (e) {
                if (i === retries - 1) throw e;
                await new Promise(resolve => setTimeout(resolve, delays[i]));
            }
        }
    }

    async function handleConvert() {
        const pythonCode = document.getElementById('pythonInput').value.trim();
        const convertBtn = document.getElementById('convertBtn');
        const loader = document.getElementById('loader');
        const resultSection = document.getElementById('resultSection');
        const errorBox = document.getElementById('errorBox');

        if (!pythonCode) {
            showError('파이썬 코드를 입력해주세요.');
            return;
        }

        // 초기화 및 로딩 UI 표시
        errorBox.style.display = 'none';
        convertBtn.disabled = true;
        resultSection.style.display = 'none';
        loader.style.display = 'flex';

        const systemPrompt = `당신은 파이썬으로 코딩테스트를 준비하던 사람들을 자바로 전향하도록 돕는 최고 수준의 1타 강사입니다.
사용자가 파이썬 코드를 입력하면, 이를 코딩테스트에 최적화된 자바(Java) 코드로 변환하고 상세한 가이드를 제공해야 합니다.
자바 코드는 반드시 백준, 프로그래머스 등에서 바로 실행 가능하도록 클래스명을 'Main'으로 하고, 'BufferedReader', 'StringTokenizer' 등 빠른 입출력을 사용하세요.`;

        const payload = {
            systemInstruction: { parts: [{ text: systemPrompt }] },
            contents: [{ parts: [{ text: "다음 파이썬 코드를 자바로 변환하고 분석해줘:\n\n" + pythonCode }] }],
            generationConfig: {
                responseMimeType: "application/json",
                responseSchema: {
                    type: "OBJECT",
                    properties: {
                        javaCode: {
                            type: "STRING",
                            description: "import문을 포함한 완전한 형태의 자바 Main 클래스 코드"
                        },
                        differences: {
                            type: "ARRAY",
                            items: {
                                type: "OBJECT",
                                properties: {
                                    concept: { type: "STRING", description: "비교할 문법/개념의 이름 (예: 리스트 선언, 반복문 등)" },
                                    pythonCode: { type: "STRING", description: "파이썬에서의 코드 작성법" },
                                    javaCode: { type: "STRING", description: "자바에서의 코드 작성법" },
                                    explanation: { type: "STRING", description: "파이썬과 자바의 차이점 및 주의사항 설명" }
                                }
                            }
                        },
                        tips: {
                            type: "ARRAY",
                            items: { type: "STRING" },
                            description: "자바로 코딩테스트를 준비할 때 알아두면 좋은 팁들"
                        }
                    },
                    required: ["javaCode", "differences", "tips"]
                }
            }
        };

        try {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const data = await fetchWithRetry(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const resultText = data.candidates[0].content.parts[0].text;
            const parsedData = JSON.parse(resultText);

            renderResults(parsedData);

        } catch (error) {
            console.error('API 호출 중 오류 발생:', error);
            showError('코드를 변환하는 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
        } finally {
            loader.style.display = 'none';
            convertBtn.disabled = false;
        }
    }

    function renderResults(data) {
        // 자바 코드 렌더링
        document.getElementById('javaCodeOutput').textContent = data.javaCode;

        // 차이점 분석 렌더링
        const diffContainer = document.getElementById('differencesOutput');
        diffContainer.innerHTML = '';
        data.differences.forEach(diff => {
            const diffHtml = `
                <div class="diff-card">
                    <h3>${escapeHtml(diff.concept)}</h3>
                    <div class="code-compare">
                        <div class="code-box python">
                            <div class="label">Python</div>
                            <pre>${escapeHtml(diff.pythonCode)}</pre>
                        </div>
                        <div class="code-box java">
                            <div class="label">Java</div>
                            <pre>${escapeHtml(diff.javaCode)}</pre>
                        </div>
                    </div>
                    <div class="explanation">
                        ${escapeHtml(diff.explanation)}
                    </div>
                </div>
            `;
            diffContainer.innerHTML += diffHtml;
        });

        // 꿀팁 렌더링
        const tipsContainer = document.getElementById('tipsOutput');
        tipsContainer.innerHTML = '';
        data.tips.forEach(tip => {
            tipsContainer.innerHTML += `<li>${escapeHtml(tip)}</li>`;
        });

        document.getElementById('resultSection').style.display = 'block';

        // 결과창으로 부드럽게 스크롤
        document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function showError(message) {
        const errorBox = document.getElementById('errorBox');
        errorBox.textContent = message;
        errorBox.style.display = 'block';
    }

    // HTML 태그 이스케이프 처리 (XSS 방지 및 코드 렌더링용)
    function escapeHtml(unsafe) {
        if (!unsafe) return '';
        return unsafe
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
