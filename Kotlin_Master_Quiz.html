<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kotlin Syntax Master Quiz</title>
    <style>
        :root {
            --primary: #7F52FF;
            --primary-dark: #6236E2;
            --secondary: #E24462;
            --bg-color: #F0F2F5;
            --card-bg: #FFFFFF;
            --text-main: #2D3436;
            --text-muted: #636E72;
            --correct: #00B894;
            --wrong: #D63031;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
        }

        /* Screen Management */
        .screen {
            padding: 40px;
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .screen.active {
            display: block;
        }

        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.2rem;
            letter-spacing: -1px;
        }

        .intro-text {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-main);
            display: block;
            text-align: center;
        }

        /* Selection Grids */
        .difficulty-grid, .count-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .count-grid {
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        /* Buttons */
        .btn {
            padding: 18px 25px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 700;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-3px); box-shadow: 0 5px 15px rgba(127, 82, 255, 0.3); }

        .btn-outline { background: white; border: 2px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: var(--primary); color: white; }

        .count-btn {
            padding: 15px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 700;
            color: var(--text-muted);
            transition: all 0.2s;
            font-size: 1.1rem;
        }
        .count-btn:hover { border-color: var(--primary); color: var(--primary); }

        .btn-exit {
            padding: 8px 15px;
            font-size: 0.85rem;
            border-radius: 10px;
            background: #f1f2f6;
            color: var(--text-muted);
            width: auto;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-exit:hover { background: #dfe4ea; color: var(--wrong); }

        .btn-grade {
            padding: 8px 15px;
            font-size: 0.85rem;
            border-radius: 10px;
            background: #e9ecef;
            color: var(--primary);
            width: auto;
            font-weight: 700;
            border: 1px solid var(--primary);
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-grade:hover { background: var(--primary); color: white; }

        /* Quiz Header */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .quiz-controls {
            display: flex;
            gap: 8px;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: #eee;
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #a29bfe);
            width: 0%;
            transition: width 0.4s ease;
        }

        /* Question Styles */
        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 25px;
            color: #1e272e;
        }

        code {
            display: block;
            background: #2d3436;
            color: #fab1a0;
            padding: 20px;
            border-radius: 12px;
            font-family: 'Fira Code', 'Consolas', monospace;
            margin: 20px 0;
            white-space: pre-wrap;
            font-size: 1rem;
            border-left: 5px solid var(--primary);
        }

        .option-item {
            background: #f8f9fa;
            padding: 16px 20px;
            border-radius: 14px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid transparent;
            font-weight: 500;
        }

        .option-item:hover { background: #eff2f5; border-color: #ddd; }
        .option-item.selected { border-color: var(--primary); background: #f0ebff; color: var(--primary); }
        .option-item.correct { background: #d1fae5; border-color: var(--correct); color: #065f46; }
        .option-item.wrong { background: #fee2e2; border-color: var(--wrong); color: #991b1b; }

        .input-box {
            width: 100%;
            padding: 18px;
            border: 2px solid #ddd;
            border-radius: 14px;
            font-size: 1.1rem;
            margin-bottom: 20px;
            outline: none;
            transition: 0.2s;
        }
        .input-box:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(127, 82, 255, 0.1); }

        #feedback {
            margin-top: 20px;
            padding: 18px;
            border-radius: 14px;
            text-align: center;
            font-weight: 700;
            display: none;
        }

        /* Result Styles */
        .score-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 12px solid var(--primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0 auto 30px;
        }
        .score-val { font-size: 3.5rem; font-weight: 800; color: var(--primary); }
        .score-total { font-size: 1.2rem; color: var(--text-muted); font-weight: 600; }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Step 1: Difficulty Selection -->
        <div id="screen-start" class="screen active">
            <h1>Kotlin Master Quiz</h1>
            <p class="intro-text">코틀린 문법을 단계별로 정복하세요.</p>
            <span class="section-title">먼저 난이도를 선택해 주세요</span>
            <div class="difficulty-grid">
                <button class="btn btn-primary" onclick="goToCountSelection('Easy')">초급: 기본 문법 & 타입</button>
                <button class="btn btn-primary" onclick="goToCountSelection('Medium')">중급: 제어 flow & 함수</button>
                <button class="btn btn-primary" onclick="onDifficultySelect('Hard')">고급: OOP & 고급 기능</button>
                <button class="btn btn-outline" onclick="onDifficultySelect('All')">전체 랜덤 챌린지</button>
            </div>
        </div>

        <!-- Step 2: Question Count Selection -->
        <div id="screen-count" class="screen">
            <h1 id="selected-diff-title">난이도</h1>
            <p class="intro-text">몇 문제를 풀고 싶으신가요?</p>
            <span class="section-title">문제 개수 선택</span>
            <div class="count-grid">
                <button class="count-btn" onclick="startQuiz(5)">5개</button>
                <button class="count-btn" onclick="startQuiz(10)">10개</button>
                <button class="count-btn" onclick="startQuiz(15)">15개</button>
                <button class="count-btn" onclick="startQuiz(20)">20개</button>
                <button class="count-btn" onclick="startQuiz(25)">25개</button>
                <button class="count-btn" onclick="startQuiz(30)">30개</button>
            </div>
            <button class="btn btn-outline" style="margin-top: 20px;" onclick="resetQuiz()">뒤로 가기</button>
        </div>

        <!-- Step 3: Quiz Execution -->
        <div id="screen-quiz" class="screen">
            <div class="quiz-header">
                <div>
                    <span id="quiz-category" style="color: var(--primary); font-weight: 800; font-size: 0.9rem; text-transform: uppercase;">Category</span>
                    <div id="quiz-count" style="font-weight: 600; color: var(--text-muted);">1 / 10</div>
                </div>
                <div class="quiz-controls">
                    <button class="btn btn-grade" onclick="gradeEarly()">중간 채점</button>
                    <button class="btn btn-exit" onclick="resetQuiz()">나가기</button>
                </div>
            </div>
            
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>

            <div id="quiz-content">
                <div class="question-box">
                    <p class="question-text" id="question-text">Loading...</p>
                    <code id="code-block" class="hidden"></code>
                </div>

                <div id="options-container" class="options-list"></div>

                <div id="input-container" class="hidden">
                    <input type="text" id="answer-input" class="input-box" placeholder="정답을 입력하세요..." autocomplete="off">
                </div>
            </div>

            <div id="feedback"></div>

            <div style="margin-top: 25px; display: flex; gap: 12px;">
                <button id="submit-btn" class="btn btn-primary" onclick="checkAnswer()">정답 확인</button>
                <button id="next-btn" class="btn btn-primary hidden" onclick="nextQuestion()">다음 문제로</button>
            </div>
        </div>

        <!-- Step 4: Result -->
        <div id="screen-result" class="screen">
            <h1 id="result-title">학습 결과</h1>
            <div class="score-circle">
                <span class="score-val" id="final-score">0</span>
                <span class="score-total" id="final-total">/ 10</span>
            </div>
            <p id="result-comment" style="margin-bottom: 30px; font-weight: 600; text-align: center; color: var(--text-main); font-size: 1.1rem;"></p>
            <button class="btn btn-primary" onclick="resetQuiz()">홈으로 가기</button>
        </div>
    </div>

    <script>
        const allQuestions = {
            Easy: [
                { q: "코틀린에서 읽기 전용 변수를 선언할 때 사용하는 키워드는?", type: "choice", options: ["var", "val", "const", "let"], answer: 1, category: "Variables" },
                { q: "가변 변수를 선언하는 키워드는?", type: "choice", options: ["val", "var", "def", "mutable"], answer: 1, category: "Variables" },
                { q: "null을 허용하는 String 타입을 선언하는 방법은?", type: "choice", options: ["String", "String!", "String?", "Nullable<String>"], answer: 2, category: "Null Safety" },
                { q: "문자열 템플릿 사용 시 변수 name을 출력하는 기호는?", type: "input", answer: "$name", category: "String" },
                { q: "코틀린에서 모든 클래스의 최상위 루트 클래스는?", type: "input", answer: "Any", category: "Types" },
                { q: "반환값이 없는 함수의 반환 타입은?", type: "choice", options: ["Void", "Nothing", "Unit", "Null"], answer: 2, category: "Functions" },
                { q: "정수형 100을 Long 타입으로 변환하는 함수는?", type: "choice", options: ["asLong()", "toLong()", "castLong()", "Long(100)"], answer: 1, category: "Types" },
                { q: "1부터 10까지를 포함하는 범위를 만드는 연산자는?", type: "choice", options: ["1..10", "1 until 10", "1 to 10", "1-10"], answer: 0, category: "Ranges" },
                { q: "변수 선언 시 타입을 명시하지 않아도 컴파일러가 타입을 추론하는 기능을 무엇이라 하는가?", type: "choice", options: ["Type Inference", "Type Casting", "Type Checking", "Type Safety"], answer: 0, category: "General" },
                { q: "컴파일 타임 상수를 선언할 때 val 앞에 붙이는 키워드는?", type: "input", answer: "const", category: "Variables" },
                { q: "Boolean 타입의 두 값은?", type: "choice", options: ["0, 1", "yes, no", "true, false", "T, F"], answer: 2, category: "Types" },
                { q: "다음 변수 x의 타입은?", code: "val x = \"Hello\"", type: "input", answer: "String", category: "Types" },
                { q: "코틀린 파일의 확장자는?", type: "input", answer: "kt", category: "General" },
                { q: "여러 줄 문자열을 만들 때 사용하는 기호는?", type: "choice", options: ["' '", "\" \"", "\"\"\" \"\"\"", "''' '''"], answer: 2, category: "String" },
                { q: "변수 n의 값을 1 증가시키는 연산자는?", type: "input", answer: "n++", category: "Operators" },
                { q: "1 until 5 범위에 포함되지 않는 숫자는?", type: "choice", options: ["1", "2", "4", "5"], answer: 3, category: "Ranges" },
                { q: "문자열의 길이를 반환하는 프로퍼티는?", type: "input", answer: "length", category: "String" },
                { q: "두 값이 같은지 비교하는 연산자는?", type: "choice", options: ["=", "==", "===", "equals"], answer: 1, category: "Operators" },
                { q: "조건문 if를 변수에 할당할 수 있는가?", type: "choice", options: ["예", "아니오"], answer: 0, category: "Control Flow" },
                { q: "배열을 선언하는 함수는?", type: "choice", options: ["array()", "arrayOf()", "new Array()", "listOf()"], answer: 1, category: "Arrays" },
                { q: "논리 'AND' 연산자는?", type: "input", answer: "&&", category: "Operators" },
                { q: "실수형 데이터 타입 중 정밀도가 더 높은 것은?", type: "choice", options: ["Float", "Double"], answer: 1, category: "Types" },
                { q: "비트 연산 중 '좌측 시프트'를 수행하는 함수는?", type: "choice", options: ["shl", "shr", "ushr", "left"], answer: 0, category: "Operators" },
                { q: "Char 타입을 숫자로 변환하는 함수는?", type: "input", answer: "toInt", category: "Types" },
                { q: "변수명을 지을 때 숫자로 시작할 수 있는가?", type: "choice", options: ["예", "아니오"], answer: 1, category: "General" },
                { q: "읽기 전용 리스트를 만드는 함수는?", type: "input", answer: "listOf", category: "Collections" },
                { q: "코틀린에서 세미콜론(;)은 필수인가?", type: "choice", options: ["필수다", "선택사항이다"], answer: 1, category: "General" },
                { q: "문자열 내에서 '$' 기호 자체를 출력하려면?", type: "input", answer: "\\$", category: "String" },
                { q: "Any 타입 변수에 null을 넣을 수 있는가?", type: "choice", options: ["넣을 수 있다", "Any?로 선언해야 한다"], answer: 1, category: "Types" },
                { q: "Char 리터럴을 감싸는 기호는?", type: "choice", options: ["' '", "\" \"", "` `", "[ ]"], answer: 0, category: "Types" }
            ],
            Medium: [
                { q: "Java의 switch를 대체하며 더 강력한 기능을 제공하는 문법은?", type: "input", answer: "when", category: "Control Flow" },
                { q: "Elvis 연산자(null일 때 기본값 반환)의 기호는?", type: "input", answer: "?:", category: "Null Safety" },
                { q: "안전한 호출(Safe Call) 연산자는?", type: "choice", options: ["!!", "?.", "?:", "?!"], answer: 1, category: "Null Safety" },
                { q: "단언 연산자(Non-null Assertion)의 기호는?", type: "input", answer: "!!", category: "Null Safety" },
                { q: "가변 리스트를 생성하는 함수는?", type: "input", answer: "mutableListOf", category: "Collections" },
                { q: "for 문에서 step 2의 의미는?", type: "choice", options: ["2번 반복", "2씩 증가", "2까지 반복", "2를 건너뜀"], answer: 1, category: "Control Flow" },
                { q: "함수를 선언할 때 사용하는 키워드는?", type: "input", answer: "fun", category: "Functions" },
                { q: "가변 인자를 받는 함수 파라미터 앞에 붙이는 키워드는?", type: "choice", options: ["args", "array", "vararg", "multiple"], answer: 2, category: "Functions" },
                { q: "타입을 확인하는 'is'의 반대(타입이 아님) 연산자는?", type: "input", answer: "!is", category: "Types" },
                { q: "강제 타입 캐스팅 연산자는?", type: "choice", options: ["is", "as", "to", "in"], answer: 1, category: "Types" },
                { q: "for (i in 5 downTo 1) 에서 첫 번째 i의 값은?", type: "input", answer: "5", category: "Control Flow" },
                { q: "정상적으로 종료되지 않는 함수(예: 예외 발생)의 반환 타입은?", type: "choice", options: ["Unit", "Nothing", "Null", "Exception"], answer: 1, category: "Functions" },
                { q: "리스트에서 조건에 맞는 요소만 걸러내는 함수는?", type: "input", answer: "filter", category: "Collections" },
                { q: "리스트의 각 요소를 변환하여 새 리스트를 만드는 함수는?", type: "input", answer: "map", category: "Collections" },
                { q: "함수의 파라미터에 기본값을 설정할 수 있는가?", type: "choice", options: ["예", "아니오"], answer: 0, category: "Functions" },
                { q: "람다식에서 단일 파라미터를 지칭하는 기본 이름은?", type: "input", answer: "it", category: "Lambda" },
                { q: "클래스 내부에 선언된 함수를 무엇이라 부르는가?", type: "choice", options: ["Static function", "Member function", "Inner function", "Field function"], answer: 1, category: "OOP" },
                { q: "문자열이 특정 문자로 시작하는지 확인하는 함수는?", type: "input", answer: "startsWith", category: "String" },
                { q: "두 집합의 합집합을 구하는 함수는?", type: "choice", options: ["add", "plus", "union", "combine"], answer: 2, category: "Collections" },
                { q: "키-값 쌍을 저장하는 컬렉션은?", type: "input", answer: "Map", category: "Collections" },
                { q: "Map에서 특정 키에 해당하는 값을 가져올 때 null이 아니라고 확신할 때 쓰는 기호는?", code: "map[\"key\"]____", type: "input", answer: "!!", category: "Collections" },
                { q: "while 문과 달리 조건이 뒤에 붙어 최소 한 번은 실행되는 문법은?", type: "choice", options: ["for", "repeat", "do-while", "try"], answer: 2, category: "Control Flow" },
                { q: "함수 호출 시 파라미터 이름을 명시할 수 있는가?", type: "choice", options: ["예", "아니오"], answer: 0, category: "Functions" },
                { q: "리스트에서 중복을 제거한 결과를 반환하는 함수는?", type: "input", answer: "distinct", category: "Collections" },
                { q: "문자열을 정수로 변환할 때 안전하게 변환하는 함수는 (실패 시 null)?", type: "input", answer: "toIntOrNull", category: "Types" },
                { q: "함수 중첩(Function overloading)을 지원하는가?", type: "choice", options: ["예", "아니오"], answer: 0, category: "Functions" },
                { q: "예외를 발생시킬 때 사용하는 키워드는?", type: "input", answer: "throw", category: "Exceptions" },
                { q: "예외를 처리하는 블록은?", type: "choice", options: ["try-catch", "if-else", "check-fail", "error-handle"], answer: 0, category: "Exceptions" },
                { q: "리스트가 비어있는지 확인하는 프로퍼티는?", type: "input", answer: "isEmpty", category: "Collections" },
                { q: "컬렉션의 요소 개수를 반환하는 프로퍼티는?", type: "input", answer: "size", category: "Collections" }
            ],
            Hard: [
                { q: "데이터 보관이 목적인 클래스로 toString, copy 등을 자동 생성해주는 것은?", type: "input", answer: "data class", category: "OOP" },
                { q: "클래스 상속을 허용하기 위해 붙여야 하는 키워드는?", type: "input", answer: "open", category: "OOP" },
                { q: "싱글톤 객체를 생성할 때 사용하는 키워드는?", type: "input", answer: "object", category: "OOP" },
                { q: "정적(static) 멤버를 클래스 내부에 정의할 때 사용하는 블록은?", type: "input", answer: "companion object", category: "OOP" },
                { q: "나중에 초기화할 가변 변수(var)에 사용하는 키워드는?", type: "input", answer: "lateinit", category: "Advanced" },
                { q: "지연 초기화(val 전용)를 구현하는 위임 키워드는?", type: "input", answer: "lazy", category: "Advanced" },
                { q: "기존 클래스에 함수를 추가하는 기능을 무엇이라 하는가?", type: "choice", options: ["Expansion", "Extension function", "Extra function", "Injected function"], answer: 1, category: "Advanced" },
                { q: "상속받는 자식 클래스를 제한하는 클래스 종류는?", type: "input", answer: "sealed class", category: "OOP" },
                { q: "객체 생성 시 가장 먼저 실행되는 블록은?", type: "input", answer: "init", category: "OOP" },
                { q: "주 생성자 외에 추가로 정의하는 생성자는?", type: "choice", options: ["Sub constructor", "Secondary constructor", "Extra constructor", "Child constructor"], answer: 1, category: "OOP" },
                { q: "람다 내부에서 외부 객체의 멤버를 자유롭게 쓰는 고차 함수 기능을 무엇이라 하는가?", type: "choice", options: ["Scope Functions", "Inline Functions", "Member Functions", "Static Functions"], answer: 0, category: "Advanced" },
                { q: "객체를 구성하고 결과값으로 '자기 자신'을 반환하는 함수는?", type: "choice", options: ["let", "apply", "run", "with"], answer: 1, category: "Scope Functions" },
                { q: "객체를 파라미터로 받아 코드 블록을 실행하고 '마지막 줄'을 반환하는 함수는?", type: "choice", options: ["let", "apply", "also", "init"], answer: 0, category: "Scope Functions" },
                { q: "추상 클래스를 선언하는 키워드는?", type: "input", answer: "abstract", category: "OOP" },
                { q: "인터페이스를 선언하는 키워드는?", type: "input", answer: "interface", category: "OOP" },
                { q: "내부 클래스에서 외부 클래스의 멤버에 접근하려면 붙여야 하는 키워드는?", type: "input", answer: "inner", category: "OOP" },
                { q: "함수 호출 오버헤드를 줄이기 위해 본문을 호출 지점에 복사하는 함수는?", type: "input", answer: "inline", category: "Advanced" },
                { q: "가시성 제어자 중 같은 모듈 내에서만 접근 가능한 것은?", type: "choice", options: ["private", "protected", "internal", "public"], answer: 2, category: "OOP" },
                { q: "클래스 상속 시 부모 클래스의 생성자를 호출하는 키워드는?", type: "input", answer: "super", category: "OOP" },
                { q: "메소드 재정의 시 붙여야 하는 필수 키워드는?", type: "input", answer: "override", category: "OOP" },
                { q: "코틀린 비동기 처리를 위한 핵심 경량 스레드 기능은?", type: "input", answer: "coroutines", category: "Advanced" },
                { q: "코루틴을 시작할 때 사용하는 빌더 중 결과를 반환하는 것은?", type: "choice", options: ["launch", "async", "runBlocking", "delay"], answer: 1, category: "Coroutines" },
                { q: "코루틴 내에서만 호출 가능한 일시 중단 함수 키워드는?", type: "input", answer: "suspend", category: "Coroutines" },
                { q: "위임을 통해 프로퍼티 기능을 전달할 때 사용하는 키워드는?", type: "input", answer: "by", category: "Advanced" },
                { q: "열거형 클래스를 선언하는 키워드는?", type: "input", answer: "enum class", category: "OOP" },
                { q: "정적 클래스 타입 체크와 스마트 캐스트를 동시에 수행하는 구문은?", type: "choice", options: ["if(x is String)", "when(x)", "try-catch", "as?"], answer: 0, category: "Types" },
                { q: "바깥 클래스의 인스턴스 없이 생성 가능한 클래스는?", type: "choice", options: ["inner class", "nested class"], answer: 1, category: "OOP" },
                { q: "제네릭에서 타입 파라미터를 정의할 때 쓰는 기호는?", type: "input", answer: "<>", category: "Advanced" },
                { q: "객체 정보를 변경하지 않고 복사본을 만드는 data class의 함수는?", type: "input", answer: "copy", category: "OOP" },
                { q: "자바 코드와의 호환성을 위해 정적 필드를 생성하도록 지시하는 어노테이션은?", type: "input", answer: "@JvmField", category: "Advanced" }
            ]
        };

        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let selectedOption = null;
        let activeDifficulty = 'Easy';
        let answeredCount = 0;

        function goToCountSelection(difficulty) {
            activeDifficulty = difficulty;
            const titleEl = document.getElementById('selected-diff-title');
            const titles = {
                'Easy': '초급: 기본 문법',
                'Medium': '중급: 제어문 & 함수',
                'Hard': '고급: OOP & 심화',
                'All': '전체 랜덤 챌린지'
            };
            titleEl.innerText = titles[difficulty];
            showScreen('screen-count');
        }

        function onDifficultySelect(diff) {
            goToCountSelection(diff);
        }

        function startQuiz(count) {
            let pool = [];
            if(activeDifficulty === 'All') {
                pool = [...allQuestions.Easy, ...allQuestions.Medium, ...allQuestions.Hard];
            } else {
                pool = [...allQuestions[activeDifficulty]];
            }

            currentQuestions = shuffleArray(pool).slice(0, count);
            currentIndex = 0;
            score = 0;
            answeredCount = 0;
            showScreen('screen-quiz');
            loadQuestion();
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function shuffleArray(array) {
            const newArr = [...array];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        }

        function loadQuestion() {
            const q = currentQuestions[currentIndex];
            selectedOption = null;
            
            document.getElementById('quiz-category').innerText = q.category;
            document.getElementById('quiz-count').innerText = `${currentIndex + 1} / ${currentQuestions.length}`;
            document.getElementById('progress-bar').style.width = `${((currentIndex) / currentQuestions.length) * 100}%`;
            document.getElementById('question-text').innerText = q.q;

            const codeBlock = document.getElementById('code-block');
            if(q.code) {
                codeBlock.innerText = q.code;
                codeBlock.classList.remove('hidden');
            } else {
                codeBlock.classList.add('hidden');
            }

            const optionsContainer = document.getElementById('options-container');
            const inputContainer = document.getElementById('input-container');
            optionsContainer.innerHTML = '';
            inputContainer.classList.add('hidden');

            if(q.type === 'choice') {
                q.options.forEach((opt, idx) => {
                    const div = document.createElement('div');
                    div.className = 'option-item';
                    div.innerText = opt;
                    div.onclick = () => selectOption(idx, div);
                    optionsContainer.appendChild(div);
                });
            } else {
                inputContainer.classList.remove('hidden');
                const input = document.getElementById('answer-input');
                input.value = '';
                input.focus();
            }

            document.getElementById('submit-btn').classList.remove('hidden');
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('feedback').style.display = 'none';
        }

        function selectOption(idx, el) {
            if(!document.getElementById('next-btn').classList.contains('hidden')) return;
            document.querySelectorAll('.option-item').forEach(item => item.classList.remove('selected'));
            el.classList.add('selected');
            selectedOption = idx;
        }

        function checkAnswer() {
            const q = currentQuestions[currentIndex];
            let isCorrect = false;
            const feedback = document.getElementById('feedback');

            if(q.type === 'choice') {
                if(selectedOption === null) return; 
                isCorrect = (selectedOption === q.answer);
                document.querySelectorAll('.option-item')[q.answer].classList.add('correct');
                if(!isCorrect) document.querySelectorAll('.option-item')[selectedOption].classList.add('wrong');
            } else {
                const val = document.getElementById('answer-input').value.trim();
                if(!val) return;
                isCorrect = (val.toLowerCase() === q.answer.toLowerCase());
            }

            if(isCorrect) {
                score++;
                feedback.innerText = "정답입니다! ✨";
                feedback.style.background = "#D1FAE5";
                feedback.style.color = "#065F46";
            } else {
                feedback.innerText = `틀렸습니다. 정답: ${q.type === 'choice' ? q.options[q.answer] : q.answer}`;
                feedback.style.background = "#FEE2E2";
                feedback.style.color = "#991B1B";
            }

            answeredCount++;
            feedback.style.display = 'block';
            document.getElementById('submit-btn').classList.add('hidden');
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentIndex++;
            if(currentIndex < currentQuestions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function gradeEarly() {
            if(answeredCount === 0) {
                alert('최소 한 문제 이상은 풀어야 채점이 가능합니다.');
                return;
            }
            showResult(true);
        }

        function showResult(isEarly = false) {
            showScreen('screen-result');
            const totalToGrade = isEarly ? answeredCount : currentQuestions.length;
            
            document.getElementById('result-title').innerText = isEarly ? "중간 채점 결과" : "최종 학습 결과";
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-total').innerText = `/ ${totalToGrade}`;
            
            const comment = document.getElementById('result-comment');
            const p = (score / totalToGrade) * 100;
            
            if(p === 100) comment.innerText = "완벽합니다! 당신은 코틀린 신입니다. 👑";
            else if(p >= 80) comment.innerText = "훌륭한 성적입니다! 코틀린 전문가가 멀지 않았네요. 👍";
            else if(p >= 50) comment.innerText = "좋은 흐름입니다. 계속해서 문법을 다져보세요! 😊";
            else comment.innerText = "기초를 다시 한번 훑어보는 게 어떨까요? 다시 도전해보세요! 💪";
        }

        function resetQuiz() {
            currentIndex = 0;
            score = 0;
            answeredCount = 0;
            currentQuestions = [];
            selectedOption = null;
            showScreen('screen-start');
        }

        document.addEventListener('keydown', (e) => {
            if(e.key === 'Enter') {
                const submitBtn = document.getElementById('submit-btn');
                const nextBtn = document.getElementById('next-btn');
                if(!submitBtn.classList.contains('hidden')) checkAnswer();
                else if(!nextBtn.classList.contains('hidden')) nextQuestion();
            }
        });
    </script>
</body>
</html>
