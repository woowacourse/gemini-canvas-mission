<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자바스크립트의 신기한 세계</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap');
    
    body {
      font-family: 'Noto Sans KR', sans-serif;
    }
    
    code, pre {
      font-family: 'Fira Code', monospace;
    }

    .fade-in {
      animation: fadeIn 0.4s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex items-center justify-center p-4">

  <!-- 메인 애플리케이션 컨테이너 -->
  <div id="app-container" class="bg-white shadow-xl rounded-2xl w-full max-w-3xl overflow-hidden fade-in">
    
    <!-- 1. 시작 화면 -->
    <div id="start-screen" class="p-8 md:p-12 text-center block">
      <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mb-4">자바스크립트의 신기한 세계</h1>
      <p class="text-gray-600 mb-8 leading-relaxed">
        자바스크립트는 때로는 우리의 예상과 전혀 다르게 작동하는 기이하고 신기한 문법들을 가지고 있습니다.<br>
        총 20개의 코드 조각이 어떤 결과를 반환할지 예측해 보십시오.<br>
        모든 퀴즈가 끝난 후 상세한 작동 원리를 확인할 수 있습니다.
      </p>
      <button id="start-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg transition duration-200 transform hover:scale-105">
        처음 시작하기
      </button>
    </div>

    <!-- 2. 퀴즈 화면 -->
    <div id="quiz-screen" class="p-6 md:p-10 hidden">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-bold text-gray-800">문제 <span id="question-number">1</span></h2>
        <div class="text-sm font-medium text-gray-500 bg-gray-100 py-1 px-3 rounded-full">
          진행도: <span id="progress-text">1 / 20</span>
        </div>
      </div>
      
      <!-- 진행바 -->
      <div class="w-full bg-gray-200 rounded-full h-2.5 mb-8">
        <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style="width: 5%"></div>
      </div>

      <!-- 문제 코드 영역 -->
      <div class="bg-gray-900 rounded-xl p-6 mb-8 shadow-inner overflow-x-auto">
        <pre><code id="question-code" class="text-green-400 text-lg md:text-xl font-medium"></code></pre>
      </div>

      <!-- 보기 버튼 영역 -->
      <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- 자바스크립트를 통해 동적으로 버튼이 추가됩니다. -->
      </div>
    </div>

    <!-- 3. 결과 화면 -->
    <div id="result-screen" class="p-6 md:p-10 hidden bg-gray-50">
      <div class="text-center mb-10">
        <h2 class="text-3xl font-bold text-gray-900 mb-2">퀴즈 결과</h2>
        <p class="text-lg text-gray-600">당신의 점수는 <span id="score-display" class="font-bold text-blue-600 text-2xl">0</span> / 20 입니다.</p>
      </div>

      <!-- 상세 결과 목록 -->
      <div id="results-list" class="space-y-6 mb-10">
        <!-- 자바스크립트를 통해 동적으로 결과가 추가됩니다. -->
      </div>

      <div class="text-center">
        <button id="restart-btn" class="bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 px-10 rounded-lg transition duration-200 transform hover:scale-105">
          다시하기
        </button>
      </div>
    </div>

  </div>

  <script>
    // 20개의 문제 및 해설 데이터 정의
    const questions = [
      {
        code: "typeof NaN",
        options: ['"number"', '"NaN"', '"undefined"', '"string"'],
        answer: '"number"',
        explanation: "IEEE 754 표준에 따라 NaN(Not a Number)은 컴퓨터 연산에서 숫자형 데이터 타입에 속하는 특수한 값으로 처리됩니다. 따라서 typeof 연산자를 사용하면 숫자를 의미하는 'number' 문자열을 반환합니다."
      },
      {
        code: "0.1 + 0.2 === 0.3",
        options: ["true", "false", "TypeError", "undefined"],
        answer: "false",
        explanation: "자바스크립트는 부동소수점 연산에 IEEE 754 표준을 사용합니다. 이로 인해 0.1과 0.2를 이진수로 변환하여 더하면 미세한 오차가 발생하여 0.30000000000000004가 도출됩니다. 따라서 정확히 0.3과 일치하지 않습니다."
      },
      {
        code: "[] == ![]",
        options: ["true", "false", "TypeError", "NaN"],
        answer: "true",
        explanation: "논리 부정 연산자(!)에 의해 배열 []은 참 같은 값(truthy)이므로 ![]는 false로 평가됩니다. 이후 동등 연산자(==)는 빈 배열을 숫자로 강제 변환하여 0으로 만들고, false 역시 0으로 변환하므로 결국 0 == 0이 되어 true를 반환합니다."
      },
      {
        code: "typeof null",
        options: ['"null"', '"undefined"', '"object"', '"string"'],
        answer: '"object"',
        explanation: "자바스크립트 초창기 구현의 버그로 인해, null 값의 타입은 'object'로 반환됩니다. 이는 이미 수많은 웹사이트에 적용되어 하위 호환성을 보장하기 위해 현재까지 수정되지 않고 표준으로 유지되고 있습니다."
      },
      {
        code: '\"b\" + \"a\" + + \"a\" + \"a\"',
        options: ['"baaa"', '"baNaNa"', '"baNaN"', 'TypeError'],
        answer: '"baNaNa"',
        explanation: "문자열 'a' 앞에 붙은 단항 덧셈 연산자(+)는 문자열을 숫자로 변환하려고 시도하지만 실패하여 NaN이 됩니다. 따라서 문자열 'b', 'a', NaN, 'a'가 순차적으로 결합되어 소문자와 대문자가 섞인 'baNaNa'가 생성됩니다."
      },
      {
        code: "Math.max()",
        options: ["0", "Infinity", "-Infinity", "NaN"],
        answer: "-Infinity",
        explanation: "인자가 전달되지 않은 Math.max() 함수는 비교를 시작할 가장 작은 초기 상태 값으로 -Infinity를 반환합니다. 반대로 Math.min()에 인자를 주지 않으면 Infinity를 반환합니다."
      },
      {
        code: "[] + []",
        options: ["[]", '""', "0", "NaN"],
        answer: '""',
        explanation: "배열에 덧셈 연산자를 사용하면 내부적으로 toString() 메서드가 호출되어 문자열로 변환됩니다. 빈 배열의 문자열 변환 결과는 빈 문자열이므로, 빈 문자열 두 개를 더한 결과인 빈 문자열이 반환됩니다."
      },
      {
        code: "[] + {}",
        options: ['""', '"[object Object]"', "0", "TypeError"],
        answer: '"[object Object]"',
        explanation: "빈 배열은 빈 문자열로 변환되고, 빈 객체는 문자열로 변환될 때 '[object Object]'가 됩니다. 따라서 이 둘을 결합하면 최종적으로 '[object Object]' 문자열이 도출됩니다."
      },
      {
        code: "true + false",
        options: ['"truefalse"', "1", "0", "NaN"],
        answer: "1",
        explanation: "덧셈 연산에서 불리언(Boolean) 값은 암묵적으로 숫자로 변환됩니다. true는 1로, false는 0으로 각각 변환되므로 1 + 0의 계산이 수행되어 결과값 1을 반환합니다."
      },
      {
        code: "1 < 2 < 3",
        options: ["true", "false", "TypeError", "NaN"],
        answer: "true",
        explanation: "비교 연산자는 왼쪽부터 평가가 진행됩니다. 먼저 1 < 2는 true가 됩니다. 다음으로 true < 3을 평가할 때, true는 숫자 1로 강제 변환되므로 1 < 3이 되어 최종 결과는 true가 됩니다."
      },
      {
        code: "3 > 2 > 1",
        options: ["true", "false", "TypeError", "NaN"],
        answer: "false",
        explanation: "왼쪽부터 차례대로 평가가 진행됩니다. 우선 3 > 2는 true가 됩니다. 이어서 true > 1을 평가할 때 true는 숫자 1로 변환되므로 1 > 1이라는 수식이 도출되며, 이는 거짓이므로 false를 반환합니다."
      },
      {
        code: 'parseInt("null", 24)',
        options: ["NaN", "0", "23", "14"],
        answer: "23",
        explanation: "parseInt 함수는 두 번째 인자로 진법을 받습니다. 24진수에서 알파벳 'n'은 23을 의미하는 유효한 문자이고, 'u'는 유효하지 않은 문자입니다. 따라서 'u'에서 파싱을 멈추고 유효하게 읽은 23을 반환합니다."
      },
      {
        code: "[,,,].length",
        options: ["0", "3", "4", "SyntaxError"],
        answer: "3",
        explanation: "자바스크립트 배열 리터럴에서 맨 마지막에 위치한 쉼표(Trailing comma)는 문법상 무시됩니다. 따라서 쉼표가 3개 작성되어 있으면 빈 슬롯이 3개인 배열이 생성된 것으로 취급되어 길이는 3이 됩니다."
      },
      {
        code: '!!""',
        options: ["true", "false", "undefined", "TypeError"],
        answer: "false",
        explanation: "빈 문자열은 자바스크립트에서 논리적으로 거짓(Falsy)에 해당하는 값입니다. 첫 번째 논리 부정 연산자(!)가 이를 true로 뒤집고, 두 번째 연산자가 다시 반전시켜 결국 false가 도출됩니다."
      },
      {
        code: "typeof (function() {})",
        options: ['"object"', '"function"', '"undefined"', "TypeError"],
        answer: '"function"',
        explanation: "자바스크립트에서 함수는 객체의 일종인 일급 객체입니다. 하지만 typeof 연산자를 사용하면 일반 객체와 명시적으로 구분하기 위하여 특별히 'function'이라는 문자열을 반환하도록 설계되어 있습니다."
      },
      {
        code: '0 == "0"',
        options: ["true", "false", "TypeError", "NaN"],
        answer: "true",
        explanation: "동등 연산자(==)는 두 피연산자의 데이터 타입이 다를 경우 암묵적인 타입 변환을 시도합니다. 우항의 문자열 '0'이 숫자 0으로 변환되어 비교가 수행되므로 값 일치 판정을 받아 true를 반환합니다."
      },
      {
        code: 'false === ""',
        options: ["true", "false", "TypeError", "NaN"],
        answer: "false",
        explanation: "일치 연산자(===)는 값뿐만 아니라 데이터 타입까지 엄격하게 비교하며 암묵적인 타입 변환을 수행하지 않습니다. 불리언 타입인 false와 문자열 타입인 빈 문자열은 타입이 다르므로 결과는 false입니다."
      },
      {
        code: "10,2",
        options: ["10", "2", "12", "SyntaxError"],
        answer: "2",
        explanation: "쉼표(,) 연산자는 각각의 피연산자를 왼쪽부터 오른쪽으로 순차적으로 평가하고, 가장 마지막 피연산자의 평가 결과값을 반환하는 특성을 가지고 있습니다. 따라서 우측에 있는 2를 반환합니다."
      },
      {
        code: "NaN === NaN",
        options: ["true", "false", "TypeError", "undefined"],
        answer: "false",
        explanation: "IEEE 754 부동소수점 표준에 의하여 NaN(Not a Number)은 자기 자신을 포함하여 그 어떤 값과도 일치하지 않는 유일한 특수 값입니다. 값이 NaN인지 확인하려면 반드시 Number.isNaN() 함수를 사용해야 합니다."
      },
      {
        code: "(!+[]+[]+![]).length",
        options: ["0", "9", "10", "TypeError"],
        answer: "9",
        explanation: "+[]는 0이고, !0은 true입니다. 따라서 맨 앞의 !+[]는 true가 됩니다. 뒤의 ![]는 false입니다. 결과적으로 true + [] + false가 되며, 이는 문자열 결합을 일으켜 'truefalse'라는 문자열을 만듭니다. 이 문자열의 길이는 9입니다."
      }
    ];

    // 애플리케이션 상태 변수
    let currentIndex = 0;
    let userAnswers = [];

    // DOM 요소 선택
    const startScreen = document.getElementById('start-screen');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    
    const questionNumberEl = document.getElementById('question-number');
    const progressTextEl = document.getElementById('progress-text');
    const progressBarEl = document.getElementById('progress-bar');
    const questionCodeEl = document.getElementById('question-code');
    const optionsContainer = document.getElementById('options-container');
    
    const scoreDisplay = document.getElementById('score-display');
    const resultsList = document.getElementById('results-list');

    // 이벤트 리스너 등록
    startBtn.addEventListener('click', startQuiz);
    restartBtn.addEventListener('click', resetQuiz);

    // 퀴즈 시작 함수
    function startQuiz() {
      startScreen.classList.add('hidden');
      quizScreen.classList.remove('hidden');
      quizScreen.classList.add('fade-in');
      renderQuestion();
    }

    // 문제 렌더링 함수
    function renderQuestion() {
      const currentQuestion = questions[currentIndex];
      
      // 진행 상태 업데이트
      const currentStep = currentIndex + 1;
      const totalSteps = questions.length;
      
      questionNumberEl.textContent = currentStep;
      progressTextEl.textContent = `${currentStep} / ${totalSteps}`;
      progressBarEl.style.width = `${(currentStep / totalSteps) * 100}%`;
      
      // 코드 내용 렌더링
      questionCodeEl.textContent = currentQuestion.code;
      
      // 보기 버튼 렌더링 초기화 및 생성
      optionsContainer.innerHTML = '';
      
      currentQuestion.options.forEach(option => {
        const button = document.createElement('button');
        button.className = "bg-white border-2 border-gray-200 hover:border-blue-500 hover:bg-blue-50 text-gray-800 font-semibold py-4 px-6 rounded-xl transition duration-200 text-left text-lg shadow-sm w-full";
        button.textContent = option;
        button.addEventListener('click', () => handleAnswer(option));
        optionsContainer.appendChild(button);
      });
    }

    // 답안 선택 처리 함수
    function handleAnswer(selectedOption) {
      userAnswers.push(selectedOption);
      
      currentIndex++;
      
      if (currentIndex < questions.length) {
        renderQuestion();
      } else {
        showResults();
      }
    }

    // 결과 화면 렌더링 함수
    function showResults() {
      quizScreen.classList.add('hidden');
      resultScreen.classList.remove('hidden');
      resultScreen.classList.add('fade-in');
      
      let correctCount = 0;
      resultsList.innerHTML = ''; // 기존 목록 초기화
      
      questions.forEach((q, index) => {
        const userAnswer = userAnswers[index];
        const isCorrect = userAnswer === q.answer;
        
        if (isCorrect) {
          correctCount++;
        }
        
        // 결과 카드 컨테이너 생성
        const resultCard = document.createElement('div');
        resultCard.className = "bg-white rounded-xl shadow-md border border-gray-200 overflow-hidden";
        
        // 결과 카드 헤더 (정답 여부 시각적 표시)
        const headerColor = isCorrect ? "bg-green-500" : "bg-red-500";
        const headerText = isCorrect ? "정답입니다!" : "오답입니다.";
        
        // 템플릿 리터럴을 활용한 동적 HTML 생성
        resultCard.innerHTML = `
          <div class="${headerColor} text-white px-4 py-2 font-bold flex justify-between">
            <span>문제 ${index + 1}</span>
            <span>${headerText}</span>
          </div>
          <div class="p-5">
            <div class="bg-gray-900 rounded-lg p-4 mb-4 overflow-x-auto">
              <code class="text-green-400 font-medium">${q.code}</code>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
              <div class="p-3 bg-gray-50 rounded-lg border border-gray-100">
                <span class="block text-sm text-gray-500 mb-1">나의 선택</span>
                <span class="font-bold ${isCorrect ? 'text-green-600' : 'text-red-600'}">${userAnswer}</span>
              </div>
              <div class="p-3 bg-blue-50 rounded-lg border border-blue-100">
                <span class="block text-sm text-gray-500 mb-1">올바른 정답</span>
                <span class="font-bold text-blue-700">${q.answer}</span>
              </div>
            </div>
            
            <div class="border-t border-gray-100 pt-4 mt-2">
              <h4 class="font-bold text-gray-800 mb-2 flex items-center">
                <svg class="w-5 h-5 mr-1 text-yellow-500" fill="currentColor" viewBox="0 0 20 20">
                  <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
                </svg>
                작동 원리
              </h4>
              <p class="text-gray-600 leading-relaxed text-sm md:text-base">${q.explanation}</p>
            </div>
          </div>
        `;
        
        resultsList.appendChild(resultCard);
      });
      
      // 최종 점수 표시
      scoreDisplay.textContent = correctCount;
      
      // 스크롤 최상단으로 이동
      window.scrollTo(0, 0);
    }

    // 퀴즈 초기화 및 재시작 함수
    function resetQuiz() {
      currentIndex = 0;
      userAnswers = [];
      
      resultScreen.classList.add('hidden');
      startScreen.classList.remove('hidden');
      startScreen.classList.add('fade-in');
      
      window.scrollTo(0, 0);
    }
  </script>
</body>
</html>
