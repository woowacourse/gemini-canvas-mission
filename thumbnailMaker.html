<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Thumbnail Generator Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <!-- 구글 폰트 추가 (다양한 선택지 제공) -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Nanum+Myeongjo:wght@400;700;800&family=Black+Han+Sans&family=Do+Hyeon&family=Song+Myung&display=swap" rel="stylesheet">
  <style>
    body {
        font-family: 'Noto Sans KR', sans-serif;
        background-color: #f3f4f6;
    }

    .canvas-container {
        aspect-ratio: 1.91 / 1;
        width: 100%;
        max-width: 800px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }

    #thumbnailCanvas {
        width: 100%;
        height: 100%;
        border-radius: 12px;
        background-color: white;
    }

    .loading-spinner {
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top: 4px solid #3b82f6;
        width: 24px;
        height: 24px;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    .hidden { display: none; }

    input[type="range"] {
        accent-color: #3b82f6;
    }

    /* 폰트 프리뷰 스타일 */
    option.font-noto { font-family: 'Noto Sans KR', sans-serif; }
    option.font-myeongjo { font-family: 'Nanum Myeongjo', serif; }
    option.font-black { font-family: 'Black Han Sans', sans-serif; }
    option.font-dohyeon { font-family: 'Do Hyeon', sans-serif; }
    option.font-song { font-family: 'Song Myung', serif; }
  </style>
</head>
<body class="p-4 md:p-8">
<div class="max-w-6xl mx-auto">
  <header class="mb-8 text-center">
    <h1 class="text-4xl font-black text-gray-900 mb-2">🎨 블로그 썸네일 생성기</h1>
    <p class="text-gray-600">글꼴을 선택하고 나만의 감각적인 썸네일을 완성해보세요.</p>
  </header>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
    <!-- 설정 패널 -->
    <div class="lg:col-span-5 space-y-6 bg-white p-6 rounded-2xl shadow-lg border border-gray-200 overflow-y-auto max-h-[85vh]">

      <!-- AI 생성 섹션 -->
      <section>
        <label class="block text-sm font-bold text-gray-700 mb-2">AI 배경 이미지 생성</label>
        <textarea id="blogContent" rows="3" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm" placeholder="블로그 내용을 입력하면 AI가 배경 이미지를 그려줍니다."></textarea>
        <button id="generateAiBtn" class="mt-2 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
          AI로 배경 생성하기
        </button>
      </section>

      <hr class="border-gray-100">

      <!-- 텍스트 관리 섹션 -->
      <section class="space-y-4">
        <div class="flex items-center justify-between">
          <label class="text-sm font-bold text-gray-700">텍스트 및 폰트 설정</label>
          <div class="flex gap-2">
            <button id="toggleSubtitleBtn" class="text-xs bg-gray-100 hover:bg-gray-200 px-2 py-1 rounded border border-gray-300 transition">
              <i class="fa-solid fa-plus mr-1"></i>부제목
            </button>
            <button id="toggleDateBtn" class="text-xs bg-gray-100 hover:bg-gray-200 px-2 py-1 rounded border border-gray-300 transition">
              <i class="fa-solid fa-plus mr-1"></i>날짜
            </button>
          </div>
        </div>

        <!-- 폰트 종류 선택 -->
        <div class="space-y-1">
          <label class="block text-xs font-bold text-gray-500 mb-1">글꼴 선택</label>
          <select id="fontFamily" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm appearance-none bg-white">
            <option value="'Noto Sans KR'" class="font-noto">본고딕 (기본/깔끔)</option>
            <option value="'Nanum Myeongjo'" class="font-myeongjo">나눔명조 (고전/감성)</option>
            <option value="'Black Han Sans'" class="font-black">검은고딕 (강렬/굵음)</option>
            <option value="'Do Hyeon'" class="font-dohyeon">도현체 (캐주얼/귀여움)</option>
            <option value="'Song Myung'" class="font-song">송명체 (우아함/예술)</option>
          </select>
        </div>

        <!-- 메인 제목 -->
        <div class="space-y-2">
          <input type="text" id="titleInput" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm" placeholder="메인 제목 입력" value="나만의 특별한 블로그 썸네일">
          <div class="flex items-center gap-4">
            <input type="range" id="fontSize" min="30" max="180" value="85" class="flex-1">
            <span class="text-xs font-mono text-gray-400 w-8">Size</span>
          </div>
        </div>

        <!-- 부제목 (토글형) -->
        <div id="subtitleContainer" class="space-y-2 hidden p-3 bg-gray-50 rounded-lg border border-gray-100 relative">
          <button onclick="toggleElement('subtitle')" class="absolute top-2 right-2 text-gray-400 hover:text-red-500"><i class="fa-solid fa-xmark"></i></button>
          <input type="text" id="subtitleInput" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-400 text-sm" placeholder="부제목 입력" value="글꼴 하나로 바뀌는 썸네일의 분위기">
          <div class="flex items-center gap-4">
            <input type="range" id="subFontSize" min="15" max="80" value="35" class="flex-1">
            <span class="text-xs font-mono text-gray-400 w-8">Sub</span>
          </div>
        </div>

        <!-- 날짜 (토글형) -->
        <div id="dateContainer" class="space-y-2 hidden p-3 bg-gray-50 rounded-lg border border-gray-100 relative">
          <button onclick="toggleElement('date')" class="absolute top-2 right-2 text-gray-400 hover:text-red-500"><i class="fa-solid fa-xmark"></i></button>
          <input type="text" id="dateInput" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-400 text-sm" placeholder="날짜 입력" value="2025. 02. 26">
        </div>
      </section>

      <!-- 디자인 공통 설정 -->
      <section class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1">글자 색상</label>
          <input type="color" id="textColor" class="w-full h-10 p-1 border border-gray-300 rounded cursor-pointer" value="#ffffff">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1">배경색</label>
          <input type="color" id="bgColor" class="w-full h-10 p-1 border border-gray-300 rounded cursor-pointer" value="#1e293b">
        </div>
      </section>

      <section class="space-y-3">
        <div class="flex justify-between items-center">
          <label class="text-sm font-bold text-gray-700">배경 이미지 및 투명도</label>
          <label class="text-xs bg-blue-50 text-blue-600 px-2 py-1 rounded cursor-pointer hover:bg-blue-100">
            파일 업로드
            <input type="file" id="imageUpload" class="hidden" accept="image/*">
          </label>
        </div>
        <div class="flex items-center gap-4">
          <input type="range" id="bgOpacity" min="0" max="100" value="60" class="flex-1">
          <span class="text-xs font-mono text-gray-400 w-8">Opacity</span>
        </div>
      </section>

      <button id="downloadBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl shadow-md transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-image"></i>
        썸네일 저장하기
      </button>
    </div>

    <!-- 프리뷰 패널 -->
    <div class="lg:col-span-7 flex flex-col items-center">
      <div class="sticky top-8 w-full">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold text-gray-800"><i class="fa-solid fa-eye mr-2 text-blue-500"></i>미리보기</h2>
          <span class="text-xs font-mono bg-white px-3 py-1 rounded-full shadow-sm text-gray-500 border border-gray-100">1200 x 630</span>
        </div>
        <div class="canvas-container relative">
          <canvas id="thumbnailCanvas"></canvas>

          <!-- 로딩 오버레이 -->
          <div id="loadingOverlay" class="absolute inset-0 bg-black/60 rounded-xl flex flex-col items-center justify-center text-white hidden backdrop-blur-sm">
            <div class="loading-spinner mb-3"></div>
            <p class="text-sm font-medium">AI가 이미지를 생성 중입니다...</p>
          </div>
        </div>
        <div class="mt-6 grid grid-cols-2 gap-4">
          <div class="p-4 bg-white rounded-xl border border-gray-100 shadow-sm text-center">
            <p class="text-xs text-gray-400 mb-1">추천 글꼴</p>
            <p id="currentFontInfo" class="text-sm font-bold text-gray-700 italic">Noto Sans KR</p>
          </div>
          <div class="p-4 bg-white rounded-xl border border-gray-100 shadow-sm text-center">
            <p class="text-xs text-gray-400 mb-1">비율</p>
            <p class="text-sm font-bold text-gray-700">1.91 : 1 (표준)</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 커스텀 모달 -->
<div id="modal" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-50 p-4">
  <div class="bg-white p-6 rounded-2xl max-w-sm w-full shadow-2xl">
    <h3 id="modalTitle" class="text-xl font-bold mb-3">알림</h3>
    <p id="modalBody" class="text-gray-600 mb-6 leading-relaxed"></p>
    <button onclick="closeModal()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold transition">확인</button>
  </div>
</div>

<script>
  const apiKey = "";
  const canvas = document.getElementById('thumbnailCanvas');
  const ctx = canvas.getContext('2d');

  // 설정 요소들
  const titleInput = document.getElementById('titleInput');
  const subtitleInput = document.getElementById('subtitleInput');
  const dateInput = document.getElementById('dateInput');
  const fontFamily = document.getElementById('fontFamily');
  const textColor = document.getElementById('textColor');
  const fontSize = document.getElementById('fontSize');
  const subFontSize = document.getElementById('subFontSize');
  const bgColor = document.getElementById('bgColor');
  const bgOpacity = document.getElementById('bgOpacity');
  const imageUpload = document.getElementById('imageUpload');
  const blogContent = document.getElementById('blogContent');
  const generateAiBtn = document.getElementById('generateAiBtn');
  const loadingOverlay = document.getElementById('loadingOverlay');
  const downloadBtn = document.getElementById('downloadBtn');

  // 상태 변수
  let backgroundImage = null;
  let aiGeneratedImage = null;
  let showSubtitle = false;
  let showDate = false;

  const CANVAS_WIDTH = 1200;
  const CANVAS_HEIGHT = 630;
  canvas.width = CANVAS_WIDTH;
  canvas.height = CANVAS_HEIGHT;

  function showModal(title, message) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalBody').innerText = message;
      document.getElementById('modal').classList.remove('hidden');
  }

  function closeModal() {
      document.getElementById('modal').classList.add('hidden');
  }

  function toggleElement(type) {
      if (type === 'subtitle') {
          showSubtitle = !showSubtitle;
          document.getElementById('subtitleContainer').classList.toggle('hidden', !showSubtitle);
          document.getElementById('toggleSubtitleBtn').classList.toggle('bg-blue-500', showSubtitle);
          document.getElementById('toggleSubtitleBtn').classList.toggle('text-white', showSubtitle);
      } else if (type === 'date') {
          showDate = !showDate;
          document.getElementById('dateContainer').classList.toggle('hidden', !showDate);
          document.getElementById('toggleDateBtn').classList.toggle('bg-blue-500', showDate);
          document.getElementById('toggleDateBtn').classList.toggle('text-white', showDate);
      }
      drawThumbnail();
  }

  document.getElementById('toggleSubtitleBtn').onclick = () => toggleElement('subtitle');
  document.getElementById('toggleDateBtn').onclick = () => toggleElement('date');

  async function fetchWithRetry(url, options, maxRetries = 5) {
      for (let i = 0; i < maxRetries; i++) {
          try {
              const response = await fetch(url, options);
              if (response.ok) return await response.json();
              if (response.status !== 429 && response.status < 500) break;
          } catch (e) {
              if (i === maxRetries - 1) throw e;
          }
          await new Promise(res => setTimeout(res, Math.pow(2, i) * 1000));
      }
      throw new Error("API 요청 실패");
  }

  function wrapText(context, text, x, y, maxWidth) {
      const words = text.split(' ');
      let line = '';
      const lines = [];

      for (let n = 0; n < words.length; n++) {
          let testLine = line + words[n] + ' ';
          let metrics = context.measureText(testLine);
          let testWidth = metrics.width;
          if (testWidth > maxWidth && n > 0) {
              lines.push(line);
              line = words[n] + ' ';
          } else {
              line = testLine;
          }
      }
      lines.push(line);
      return lines;
  }

  function drawThumbnail() {
      const selectedFont = fontFamily.value;
      document.getElementById('currentFontInfo').innerText = selectedFont.replace(/'/g, '');

      // 1. 배경
      ctx.fillStyle = bgColor.value;
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      // 2. 이미지
      const activeImg = aiGeneratedImage || backgroundImage;
      if (activeImg) {
          ctx.globalAlpha = bgOpacity.value / 100;
          const canvasRatio = CANVAS_WIDTH / CANVAS_HEIGHT;
          const imgRatio = activeImg.width / activeImg.height;
          let dw, dh, dx, dy;

          if (imgRatio > canvasRatio) {
              dh = CANVAS_HEIGHT;
              dw = activeImg.width * (CANVAS_HEIGHT / activeImg.height);
              dx = (CANVAS_WIDTH - dw) / 2;
              dy = 0;
          } else {
              dw = CANVAS_WIDTH;
              dh = activeImg.height * (CANVAS_WIDTH / activeImg.width);
              dx = 0;
              dy = (CANVAS_HEIGHT - dh) / 2;
          }
          ctx.drawImage(activeImg, dx, dy, dw, dh);
          ctx.globalAlpha = 1.0;
      }

      // 3. 텍스트
      ctx.fillStyle = textColor.value;
      ctx.textAlign = 'center';
      ctx.shadowColor = "rgba(0, 0, 0, 0.7)";
      ctx.shadowBlur = 15;
      ctx.shadowOffsetX = 3;
      ctx.shadowOffsetY = 3;

      let totalContentHeight = 0;
      const elements = [];

      // 제목 설정
      const mainSize = parseInt(fontSize.value);
      // Black Han Sans의 경우 가중치 처리가 다를 수 있음
      const mainWeight = selectedFont.includes('Black Han Sans') ? '' : '900';
      ctx.font = `${mainWeight} ${mainSize}px ${selectedFont}`;
      const mainLines = wrapText(ctx, titleInput.value || "제목을 입력하세요", 0, 0, CANVAS_WIDTH * 0.85);
      elements.push({ type: 'main', lines: mainLines, size: mainSize, weight: mainWeight });
      totalContentHeight += mainLines.length * (mainSize * 1.2);

      // 부제목 설정
      if (showSubtitle) {
          const subSize = parseInt(subFontSize.value);
          const subWeight = selectedFont.includes('Black Han Sans') ? '' : '400';
          ctx.font = `${subWeight} ${subSize}px ${selectedFont}`;
          const subLines = wrapText(ctx, subtitleInput.value || "", 0, 0, CANVAS_WIDTH * 0.8);
          elements.push({ type: 'sub', lines: subLines, size: subSize, weight: subWeight });
          totalContentHeight += (subLines.length * (subSize * 1.3)) + 30;
      }

      // 날짜 설정
      if (showDate) {
          const dateSize = 28;
          elements.push({ type: 'date', text: dateInput.value || "", size: dateSize });
          totalContentHeight += dateSize + 40;
      }

      let currentY = (CANVAS_HEIGHT - totalContentHeight) / 2;

      elements.forEach(el => {
          if (el.type === 'main') {
              ctx.font = `${el.weight} ${el.size}px ${selectedFont}`;
              el.lines.forEach(line => {
                  currentY += el.size * 0.8;
                  ctx.fillText(line.trim(), CANVAS_WIDTH / 2, currentY);
                  currentY += el.size * 0.4;
              });
          } else if (el.type === 'sub') {
              currentY += 20;
              ctx.font = `${el.weight} ${el.size}px ${selectedFont}`;
              el.lines.forEach(line => {
                  currentY += el.size * 0.8;
                  ctx.fillText(line.trim(), CANVAS_WIDTH / 2, currentY);
                  currentY += el.size * 0.5;
              });
          } else if (el.type === 'date') {
              currentY += 40;
              ctx.font = `400 ${el.size}px ${selectedFont}`;
              ctx.fillText(el.text, CANVAS_WIDTH / 2, currentY + el.size);
          }
      });

      ctx.shadowBlur = 0;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 0;
  }

  async function generateAiImage() {
      const content = blogContent.value.trim();
      if (!content) {
          showModal("알림", "이미지 생성을 위해 블로그 내용을 입력해주세요.");
          return;
      }

      loadingOverlay.classList.remove('hidden');
      generateAiBtn.disabled = true;

      try {
          const promptRes = await fetchWithRetry(
              `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`,
              {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                      contents: [{ parts: [{ text: `Generate a visual prompt for a professional background image based on: "${content}". No text in image. Abstract or high-quality photography style.` }] }]
                  })
              }
          );
          const prompt = promptRes.candidates?.[0]?.content?.parts?.[0]?.text || content;

          const imgRes = await fetchWithRetry(
              `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`,
              {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                      instances: { prompt: prompt },
                      parameters: { sampleCount: 1 }
                  })
              }
          );

          if (imgRes.predictions?.[0]) {
              const base64 = `data:image/png;base64,${imgRes.predictions[0].bytesBase64Encoded}`;
              const img = new Image();
              img.onload = () => {
                  aiGeneratedImage = img;
                  backgroundImage = null;
                  drawThumbnail();
                  loadingOverlay.classList.add('hidden');
              };
              img.src = base64;
          }
      } catch (err) {
          console.error(err);
          showModal("오류", "AI 이미지 생성 중 문제가 발생했습니다.");
          loadingOverlay.classList.add('hidden');
      } finally {
          generateAiBtn.disabled = false;
      }
  }

  // 모든 입력 요소에 이벤트 연결
  [titleInput, subtitleInput, dateInput, fontFamily, textColor, fontSize, subFontSize, bgColor, bgOpacity].forEach(el => {
      el.addEventListener('input', drawThumbnail);
  });

  imageUpload.onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
          const reader = new FileReader();
          reader.onload = (ev) => {
              const img = new Image();
              img.onload = () => {
                  backgroundImage = img;
                  aiGeneratedImage = null;
                  drawThumbnail();
              };
              img.src = ev.target.result;
          };
          reader.readAsDataURL(file);
      }
  };

  generateAiBtn.onclick = generateAiImage;

  downloadBtn.onclick = () => {
      const link = document.createElement('a');
      link.download = `thumbnail-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png', 1.0);
      link.click();
  };

  window.onload = () => {
      document.fonts.ready.then(drawThumbnail);
  };
</script>
</body>
</html>
