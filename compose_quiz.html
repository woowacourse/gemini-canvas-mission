<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jetpack Compose 마스터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f0f4f8;
            overflow-x: hidden;
        }

        .slide-in {
            animation: slideIn 0.4s ease-out forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        pre {
            background-color: #1e293b;
            color: #e2e8f0;
            padding: 1.25rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            overflow-x: auto;
            line-height: 1.6;
            border: 1px solid #334155;
        }

        .bg-compose-gradient {
            background: linear-gradient(135deg, #4285F4 0%, #34A853 100%);
        }

        .progress-bar {
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .category-btn.active {
            background-color: white;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        
        .cat-easy.active { color: #10b981; }
        .cat-normal.active { color: #3b82f6; }
        .cat-hard.active { color: #ef4444; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-8">

    <header class="w-full max-w-2xl mb-8 text-center">
        <h1 class="text-4xl font-extrabold bg-compose-gradient bg-clip-text text-transparent mb-2">Compose Master</h1>
        <p class="text-slate-500 font-medium">난이도별 체계적인 학습으로 Compose 전문가가 되세요</p>
    </header>

    <main class="w-full max-w-2xl bg-white rounded-[2rem] shadow-2xl overflow-hidden border border-slate-100 flex flex-col min-h-[750px]">
        <nav class="flex border-b border-slate-100 p-2 gap-2 bg-slate-50/50">
            <button id="learnTab" onclick="switchMode('learn')" class="flex-1 py-3 rounded-xl font-bold text-blue-600 bg-white shadow-sm transition-all">
                <i class="fas fa-book-open mr-2"></i>개념 학습
            </button>
            <button id="quizTab" onclick="switchMode('quiz')" class="flex-1 py-3 rounded-xl font-bold text-slate-400 hover:text-slate-600 transition-all">
                <i class="fas fa-pen-nib mr-2"></i>실력 테스트
            </button>
        </nav>

        <div id="categorySection" class="px-6 pt-4">
            <div class="bg-slate-100 p-1 rounded-2xl flex gap-1">
                <button onclick="setCategory('easy')" id="cat-easy" class="category-btn cat-easy flex-1 py-2 text-sm font-bold rounded-xl transition-all active text-emerald-600 bg-white">
                    쉬움
                </button>
                <button onclick="setCategory('normal')" id="cat-normal" class="category-btn cat-normal flex-1 py-2 text-sm font-bold rounded-xl transition-all text-slate-500">
                    보통
                </button>
                <button onclick="setCategory('hard')" id="cat-hard" class="category-btn cat-hard flex-1 py-2 text-sm font-bold rounded-xl transition-all text-slate-500">
                    어려움
                </button>
            </div>
        </div>

        <div class="px-6 pt-6">
            <div class="flex justify-between items-end mb-2">
                <span id="progressText" class="text-xs font-bold text-slate-400 tracking-tighter uppercase">STEP 1 / 10</span>
                <span id="percentageText" class="text-sm font-black text-blue-600">10%</span>
            </div>
            <div class="w-full h-3 bg-slate-100 rounded-full overflow-hidden">
                <div id="progressBar" class="progress-bar h-full bg-compose-gradient w-[10%]"></div>
            </div>
        </div>

        <div id="content" class="flex-1 p-6 flex flex-col"></div>

        <div id="navButtons" class="p-6 bg-slate-50/30 border-t border-slate-50 flex justify-between gap-4">
            <button onclick="prevItem()" id="prevBtn" class="flex-1 py-4 px-4 rounded-2xl border border-slate-200 text-slate-600 font-bold hover:bg-white hover:shadow-md disabled:opacity-20 disabled:cursor-not-allowed transition-all">
                이전
            </button>
            <button onclick="nextItem()" id="nextBtn" class="flex-1 py-4 px-4 rounded-2xl bg-compose-gradient text-white font-bold shadow-lg shadow-blue-200 hover:brightness-110 active:scale-95 transition-all">
                다음
            </button>
        </div>
    </main>

    <div id="resultModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-[2.5rem] p-10 max-w-sm w-full text-center shadow-2xl">
            <div id="resultIcon" class="w-24 h-24 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-5xl mx-auto mb-6">
                <i class="fas fa-flag-checkered"></i>
            </div>
            <h2 id="resultTitle" class="text-2xl font-black mb-3 text-slate-800">완료!</h2>
            <p id="resultMsg" class="text-slate-500 mb-8 leading-relaxed"></p>
            <button onclick="closeModal()" class="w-full py-4 bg-compose-gradient text-white rounded-2xl font-bold shadow-xl shadow-blue-100">처음으로</button>
        </div>
    </div>

    <script>
        const studyData = {
            easy: [
                { title: "Compose의 정의", content: "Jetpack Compose는 안드로이드를 위한 현대적인 선언형 UI 도구 키트입니다. XML 없이 Kotlin 코드로만 UI를 작성합니다.", code: "@Composable\nfun Welcome() {\n    Text(\"Compose의 세계에 오신 것을 환영합니다!\")\n}", hint: "데이터가 변하면 UI가 자동으로 업데이트됩니다." },
                { title: "Text 컴포넌트", content: "화면에 문자열을 표시하는 가장 기본 컴포넌트입니다.", code: "Text(\n    text = \"안녕하세요\",\n    color = Color.Blue,\n    fontSize = 20.sp\n)", hint: "문자열 크기는 sp 단위를 사용하세요." },
                { title: "Column 레이아웃", content: "여러 요소를 수직으로 나열할 때 사용합니다.", code: "Column {\n    Text(\"위\")\n    Text(\"아래\")\n}", hint: "CSS의 flex-direction: column과 유사합니다." },
                { title: "Row 레이아웃", content: "여러 요소를 수평으로 나열할 때 사용합니다.", code: "Row {\n    Text(\"왼쪽\")\n    Text(\"오른쪽\")\n}", hint: "가로 정렬 시 필수적인 레이아웃입니다." },
                { title: "Modifier의 기초", content: "UI 요소의 장식이나 행동을 변경하는 객체입니다.", code: "Box(\n    modifier = Modifier\n        .size(100.dp)\n        .background(Color.Red)\n)", hint: "순차적으로 적용되므로 순서가 중요합니다." },
                { title: "Button 컴포넌트", content: "사용자의 클릭 이벤트를 처리하는 버튼을 만듭니다.", code: "Button(onClick = { /* 행동 */ }) {\n    Text(\"클릭하세요\")\n}", hint: "onClick 람다 안에 실행할 코드를 넣습니다." },
                { title: "Image 표시하기", content: "이미지 리소스를 화면에 그립니다.", code: "Image(\n    painter = painterResource(id = R.drawable.my_image),\n    contentDescription = \"설명\"\n)", hint: "접근성을 위해 설명을 반드시 포함하세요." },
                { title: "Box 레이아웃", content: "요소를 겹치거나 특정 위치에 고정할 때 사용합니다.", code: "Box {\n    Image(...)\n    Text(\"이미지 위 텍스트\")\n}", hint: "자식들이 쌓이는 순서대로 겹쳐집니다." },
                { title: "Spacer 활용", content: "요소 사이에 공백을 줄 때 사용합니다.", code: "Column {\n    Text(\"A\")\n    Spacer(modifier = Modifier.height(16.dp))\n    Text(\"B\")\n}", hint: "padding 대신 명시적인 공백을 줄 때 편리합니다." },
                { title: "색상과 테마 기초", content: "MaterialTheme을 사용하여 앱의 전체적인 색상을 관리합니다.", code: "MaterialTheme(colorScheme = lightColorScheme()) {\n    Text(\"테마가 적용된 텍스트\")\n}", hint: "일관된 디자인 시스템 구축에 유리합니다." }
            ],
            normal: [
                { title: "상태(State)와 Remember", content: "UI가 변화하려면 상태를 기억하고 추적해야 합니다.", code: "val count = remember { mutableStateOf(0) }\nButton(onClick = { count.value++ }) {\n    Text(\"Count: ${count.value}\")\n}", hint: "recomposition 시에도 값을 잃지 않게 해줍니다." },
                { title: "LazyColumn 기초", content: "대량의 리스트를 메모리 효율적으로 보여줍니다.", code: "LazyColumn {\n    items(itemsList) { item ->\n        Text(item.name)\n    }\n}", hint: "RecyclerView의 현대적 대체재입니다." },
                { title: "상태 호이스팅(Hoisting)", content: "상태를 상위로 끌어올려 컴포넌트를 무상태(Stateless)로 만듭니다.", code: "fun Screen() {\n    var text by remember { mutableStateOf(\"\") }\n    InputField(text, onValueChange = { text = it })\n}", hint: "테스트와 재사용성이 높아집니다." },
                { title: "TextField 입력", content: "사용자로부터 텍스트 입력을 받습니다.", code: "TextField(\n    value = text,\n    onValueChange = { newText -> text = newText }\n)", hint: "실시간으로 상태를 업데이트해야 입력이 보입니다." },
                { title: "LaunchedEffect", content: "컴포지션 시작 시 정해진 비동기 작업을 수행합니다.", code: "LaunchedEffect(key1 = true) {\n    viewModel.fetchData()\n}", hint: "UI 스레드를 방해하지 않고 작업을 수행합니다." },
                { title: "Scaffold 구조", content: "앱의 표준 UI 구조(TopBar, FAB 등)를 쉽게 잡습니다.", code: "Scaffold(topBar = { MyTopBar() }) { padding ->\n    Content(modifier = Modifier.padding(padding))\n}", hint: "Material 디자인의 기본 레이아웃입니다." },
                { title: "Animation 기초", content: "값을 애니메이션화하여 부드러운 UI를 만듭니다.", code: "val alpha by animateFloatAsState(if (visible) 1f else 0f)", hint: "복잡한 코드 없이도 부드러운 전환이 가능합니다." },
                { title: "Card 컴포넌트", content: "관련 있는 정보를 하나의 그룹으로 시각화합니다.", code: "Card(elevation = CardDefaults.cardElevation(4.dp)) {\n    Text(\"카드 내용\")\n}", hint: "Surface의 특정 활용 케이스로 이해하면 쉽습니다." },
                { title: "RememberCoroutineScope", content: "이벤트 핸들러 내에서 코루틴을 실행할 때 사용합니다.", code: "val scope = rememberCoroutineScope()\nButton(onClick = { scope.launch { /* 작업 */ } }) { ... }", hint: "컴포저블 내부가 아닌 클릭 리스너 등에서 유용합니다." },
                { title: "CompositionLocal", content: "트리 하위로 데이터를 암시적으로 전달합니다.", code: "val LocalColor = compositionLocalOf { Color.Black }", hint: "테마나 전역 환경 설정 전달에 쓰입니다." }
            ],
            hard: [
                { title: "SideEffect 개념", content: "Compose 상태가 아닌 외부 시스템과 동기화가 필요할 때 사용합니다.", code: "SideEffect {\n    analytics.logScreenView()\n}", hint: "성공적인 리컴포지션마다 매번 실행됩니다." },
                { title: "DerivedStateOf 최적화", content: "상태 변화 빈도를 줄여 성능을 최적화합니다.", code: "val showButton by remember {\n    derivedStateOf { scrollState.value > 100 }\n}", hint: "자주 변하는 상태로부터 파생된 상태를 만들 때 필수입니다." },
                { title: "Custom Layout 구현", content: "Layout 컴포저블을 사용하여 직접 측정 및 배치 로직을 짭니다.", code: "Layout(content) { measurables, constraints ->\n    // 측정 및 배치 구현\n}", hint: "표준 레이아웃으로 안 되는 복잡한 디자인에 사용합니다." },
                { title: "DisposableEffect", content: "리소스 해제가 필요한 작업을 수행합니다.", code: "DisposableEffect(Unit) {\n    onDispose { /* 리스너 해제 등 */ }\n}", hint: "컴포지션이 종료될 때 클린업이 가능합니다." },
                { title: "SnapshotState 시스템", content: "Compose의 상태 추적 알고리즘 원리를 이해합니다.", code: "val state = snapshotStateListOf<String>()", hint: "내부 요소의 변경을 어떻게 감지하는지 공부하세요." },
                { title: "SubcomposeLayout", content: "자식의 크기에 따라 다른 자식을 동적으로 구성합니다.", code: "SubcomposeLayout { constraints ->\n    // 동적 레이아웃 로직\n}", hint: "BoxWithConstraints의 기반 기술입니다." },
                { title: "성능 디버깅 - Recomposition", content: "불필요한 리컴포지션을 찾는 법과 원인을 분석합니다.", code: "// Layout Inspector 사용 권장", hint: "컴포넌트의 안정성(Stability)을 체크하세요." },
                { title: "Graphics Layer 활용", content: "하드웨어 가속을 이용한 변환 및 효과를 적용합니다.", code: "modifier = Modifier.graphicsLayer(alpha = 0.5f, rotationZ = 45f)", hint: "전체 다시 그리기를 피하며 효과를 줍니다." },
                { title: "Navigation Deep Dive", content: "중첩된 그래프와 Safe Args 등을 다룹니다.", code: "composable(\"route/{id}\") { entry -> ... }", hint: "화면 간 상태 공유와 백스택 관리가 핵심입니다." },
                { title: "Semantics & Accessibility", content: "테스트와 장애인 접근성을 위한 의미 정보를 추가합니다.", code: "modifier = Modifier.semantics { contentDescription = \"...\" }", hint: "고급 앱 개발자라면 반드시 챙겨야 할 요소입니다." }
            ]
        };

        // 20 integrated questions covering all levels
        const integratedQuiz = [
            { question: "Compose에서 UI를 그리는 최소 단위 함수는 무엇인가요?", options: ["View", "Composable", "Activity", "Widget"], answer: 1, explanation: "@Composable 어노테이션이 붙은 함수가 UI 단위입니다." },
            { question: "수직 배치를 위해 사용하는 레이아웃 컴포넌트는?", options: ["Row", "Box", "Column", "Flow"], answer: 2, explanation: "Column은 자식들을 세로로 배치합니다." },
            { question: "상태를 기억하기 위해 remember와 함께 사용되는 객체는?", options: ["mutableStateOf", "staticState", "fixedState", "rememberState"], answer: 0, explanation: "mutableStateOf는 변경 가능한 상태를 생성합니다." },
            { question: "리컴포지션 사이에서 값을 유지해주는 함수는?", options: ["save", "remember", "keep", "persist"], answer: 1, explanation: "remember는 이전의 상태 값을 메모리에 보존합니다." },
            { question: "대량의 리스트를 효율적으로 렌더링하는 컴포넌트는?", options: ["RecyclerView", "ListView", "LazyColumn", "Column"], answer: 2, explanation: "LazyColumn은 화면에 보이는 요소만 렌더링합니다." },
            { question: "UI의 크기나 클릭 이벤트를 정의할 때 사용하는 객체는?", options: ["Decorator", "Modifier", "Styler", "Adapter"], answer: 1, explanation: "Modifier를 통해 크기, 배경, 행동 등을 정의합니다." },
            { question: "상위 노드로 상태를 끌어올려 재사용성을 높이는 기법은?", options: ["상태 호이스팅", "상태 인젝션", "상태 버블링", "상태 캡슐화"], answer: 0, explanation: "State Hoisting은 Compose의 핵심 패턴입니다." },
            { question: "비동기 API 호출 등 Side Effect를 실행할 때 사용하는 블록은?", options: ["LaunchedEffect", "SideBlock", "AsyncScope", "Coroutines"], answer: 0, explanation: "LaunchedEffect는 코루틴 스코프를 제공하며 부수 효과를 관리합니다." },
            { question: "불필요한 연산을 방지하기 위해 파생된 상태를 최적화하는 함수는?", options: ["remember", "derivedStateOf", "produceState", "rememberState"], answer: 1, explanation: "derivedStateOf는 계산 결과가 바뀔 때만 UI를 갱신하도록 돕습니다." },
            { question: "컴포저블이 화면에서 사라질 때 리소스를 정리하는 효과는?", options: ["LaunchedEffect", "SideEffect", "DisposableEffect", "FinalEffect"], answer: 2, explanation: "DisposableEffect의 onDispose에서 정리 로직을 작성합니다." },
            { question: "요소들을 겹쳐서 배치할 때 가장 적합한 레이아웃은?", options: ["Box", "Stack", "Layer", "Column"], answer: 0, explanation: "Box는 자식 요소들을 층층이 쌓습니다." },
            { question: "Scaffold 컴포넌트의 주된 목적은?", options: ["이미지 필터링", "표준 앱 구조 제공", "데이터베이스 연결", "네트워크 통신"], answer: 1, explanation: "상단바, 하단바 등 Material 디자인 뼈대를 제공합니다." },
            { question: "텍스트 입력 시 사용되는 컴포넌트는?", options: ["InputBox", "TextField", "TextView", "EditText"], answer: 1, explanation: "TextField(또는 OutlinedTextField)를 사용합니다." },
            { question: "전역 테마나 설정을 명시적 전달 없이 하위로 공유하는 방식은?", options: ["GlobalState", "CompositionLocal", "Broadcast", "Context"], answer: 1, explanation: "CompositionLocal은 하위 트리 전체에서 접근 가능한 환경 값을 제공합니다." },
            { question: "상태 변화에 따른 수치 애니메이션을 가장 쉽게 구현하는 방법은?", options: ["animate*AsState", "transitionTo", "AnimationController", "ValueAnimator"], answer: 0, explanation: "animateFloatAsState 같은 API가 가장 간편합니다." },
            { question: "자식의 측정 결과에 따라 레이아웃을 동적으로 정할 때 사용하는 것은?", options: ["CustomLayout", "SubcomposeLayout", "FlexLayout", "DynamicBox"], answer: 1, explanation: "SubcomposeLayout은 측정 시점의 조절이 가능합니다." },
            { question: "애니메이션이나 변환 효과 시 하드웨어 가속 레이어를 사용하려면?", options: ["graphicsLayer", "drawLayer", "hwLayer", "viewLayer"], answer: 0, explanation: "Modifier.graphicsLayer를 통해 효율적인 변환이 가능합니다." },
            { question: "이미지 표시 시 스크린 리더기를 위해 필요한 필수 속성은?", options: ["contentDescription", "altText", "imageTitle", "summary"], answer: 0, explanation: "contentDescription은 시각 장애인을 위한 접근성 설명입니다." },
            { question: "컴포지션 성공 시마다 매번 외부 시스템에 알림을 주려면?", options: ["LaunchedEffect", "SideEffect", "DisposableEffect", "UpdateEffect"], answer: 1, explanation: "SideEffect는 매 성공적인 리컴포지션 시 실행됩니다." },
            { question: "공식 Navigation 라이브러리에서 화면 사이를 이동할 때 사용하는 객체는?", options: ["Router", "Navigator", "NavController", "ScreenManager"], answer: 2, explanation: "NavController를 통해 navigate() 등을 호출합니다." }
        ];

        let currentMode = 'learn';
        let category = 'easy'; // Default difficulty
        let currentIndex = 0;
        let score = 0;
        let quizSelected = false;

        const contentEl = document.getElementById('content');
        const progressText = document.getElementById('progressText');
        const percentageText = document.getElementById('percentageText');
        const progressBar = document.getElementById('progressBar');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const learnTab = document.getElementById('learnTab');
        const quizTab = document.getElementById('quizTab');
        const categorySection = document.getElementById('categorySection');

        function setCategory(cat) {
            category = cat;
            currentIndex = 0;
            score = 0;
            
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active', 'text-emerald-600', 'text-blue-600', 'text-red-600', 'bg-white');
                btn.classList.add('text-slate-500');
            });
            
            const activeBtn = document.getElementById(`cat-${cat}`);
            if (activeBtn) {
                activeBtn.classList.add('active', 'bg-white');
                activeBtn.classList.remove('text-slate-500');
                if(cat === 'easy') activeBtn.classList.add('text-emerald-600');
                else if(cat === 'normal') activeBtn.classList.add('text-blue-600');
                else if(cat === 'hard') activeBtn.classList.add('text-red-600');
            }
            render();
        }

        function switchMode(mode) {
            if (currentMode === mode) return;
            currentMode = mode;
            currentIndex = 0;
            score = 0;
            
            if (mode === 'learn') {
                learnTab.className = "flex-1 py-3 rounded-xl font-bold text-blue-600 bg-white shadow-sm transition-all";
                quizTab.className = "flex-1 py-3 rounded-xl font-bold text-slate-400 hover:text-slate-600 transition-all";
                categorySection.classList.remove('hidden');
            } else {
                quizTab.className = "flex-1 py-3 rounded-xl font-bold text-blue-600 bg-white shadow-sm transition-all";
                learnTab.className = "flex-1 py-3 rounded-xl font-bold text-slate-400 hover:text-slate-600 transition-all";
                categorySection.classList.add('hidden');
            }
            render();
        }

        function render() {
            const data = currentMode === 'learn' ? studyData[category] : integratedQuiz;
            if (!data || !data[currentIndex]) return;

            const currentData = data[currentIndex];
            const total = data.length;
            
            const progress = ((currentIndex + 1) / total) * 100;
            progressText.innerText = (currentMode === 'learn' ? 'STEP ' : 'QUIZ ') + (currentIndex + 1) + " / " + total;
            percentageText.innerText = Math.round(progress) + "%";
            progressBar.style.width = progress + "%";

            prevBtn.disabled = currentIndex === 0;
            nextBtn.innerText = currentIndex === total - 1 ? '완료' : '다음';
            
            contentEl.innerHTML = '';
            const container = document.createElement('div');
            container.className = 'slide-in flex-1 flex flex-col';

            if (currentMode === 'learn') {
                let badgeClass = 'bg-emerald-100 text-emerald-600';
                let label = '쉬움';
                if(category === 'normal') { badgeClass = 'bg-blue-100 text-blue-600'; label = '보통'; }
                if(category === 'hard') { badgeClass = 'bg-red-100 text-red-600'; label = '어려움'; }

                container.innerHTML = `
                    <div class="mb-2 flex items-center gap-2">
                        <span class="px-3 py-1 ${badgeClass} text-[11px] font-black rounded-full uppercase tracking-wider">${label}</span>
                    </div>
                    <h2 class="text-2xl font-black text-slate-800 mb-4">${currentData.title}</h2>
                    <p class="text-slate-500 mb-6 leading-relaxed font-medium">${currentData.content}</p>
                    <div class="relative mb-6">
                        <pre><code>${currentData.code}</code></pre>
                        <button onclick="copyCode(this)" class="absolute top-4 right-4 text-slate-500 hover:text-white transition-colors bg-slate-800/50 p-2 rounded-lg backdrop-blur-sm">
                            <i class="far fa-copy"></i>
                        </button>
                    </div>
                    <div class="mt-auto p-5 bg-gradient-to-br from-blue-50 to-green-50 rounded-[1.5rem] border border-blue-100 flex items-start gap-4">
                        <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-blue-600 shrink-0 shadow-sm">
                            <i class="fas fa-lightbulb"></i>
                        </div>
                        <p class="text-sm text-blue-900 leading-relaxed pt-1 font-semibold">${currentData.hint}</p>
                    </div>
                `;
            } else {
                quizSelected = false;
                const optionsHtml = currentData.options.map((opt, idx) => `
                    <button onclick="checkAnswer(${idx}, this)" class="quiz-opt w-full p-4 mb-3 text-left rounded-2xl border-2 border-slate-100 hover:border-blue-400 hover:bg-blue-50/50 transition-all flex justify-between items-center group">
                        <span class="font-bold text-slate-600 group-hover:text-blue-600">${idx + 1}. ${opt}</span>
                        <span class="status-icon opacity-0 scale-50 transition-all"><i class="fas fa-circle-check text-xl"></i></span>
                    </button>
                `).join('');

                container.innerHTML = `
                    <div class="mb-2 flex items-center gap-2">
                        <span class="px-3 py-1 bg-slate-800 text-white text-[11px] font-black rounded-full uppercase tracking-wider">실력 테스트</span>
                    </div>
                    <h2 class="text-xl font-bold text-slate-800 mb-6 leading-snug">${currentData.question}</h2>
                    <div class="flex-1">${optionsHtml}</div>
                    <div id="feedback" class="mt-4 opacity-0 translate-y-2 transition-all duration-300"></div>
                `;
                nextBtn.disabled = true;
            }
            contentEl.appendChild(container);
        }

        function checkAnswer(selectedIdx, element) {
            if (quizSelected) return;
            quizSelected = true;
            const currentQuiz = integratedQuiz[currentIndex];
            const correctIdx = currentQuiz.answer;
            const feedback = document.getElementById('feedback');
            const options = document.querySelectorAll('.quiz-opt');
            
            options.forEach((opt, idx) => {
                opt.classList.remove('hover:border-blue-400', 'hover:bg-blue-50/50');
                if (idx === correctIdx) {
                    opt.classList.add('border-green-500', 'bg-green-50', 'text-green-700');
                    opt.querySelector('.status-icon').innerHTML = '<i class="fas fa-check-circle text-green-500"></i>';
                    opt.querySelector('.status-icon').className = 'status-icon opacity-100 scale-100';
                } else if (idx === selectedIdx) {
                    opt.classList.add('border-red-500', 'bg-red-50', 'text-red-700');
                    opt.querySelector('.status-icon').innerHTML = '<i class="fas fa-times-circle text-red-500"></i>';
                    opt.querySelector('.status-icon').className = 'status-icon opacity-100 scale-100';
                }
            });

            if (selectedIdx === correctIdx) score++;
            feedback.innerHTML = `
                <div class="p-5 rounded-2xl ${selectedIdx === correctIdx ? 'bg-green-50 border border-green-100' : 'bg-red-50 border border-red-100'}">
                    <p class="text-sm font-semibold leading-relaxed">
                        <i class="fas fa-info-circle mr-1"></i> ${currentQuiz.explanation}
                    </p>
                </div>
            `;
            feedback.classList.remove('opacity-0', 'translate-y-2');
            nextBtn.disabled = false;
        }

        function nextItem() {
            const data = currentMode === 'learn' ? studyData[category] : integratedQuiz;
            if (currentIndex < data.length - 1) {
                currentIndex++;
                render();
            } else {
                showResult();
            }
        }

        function prevItem() {
            if (currentIndex > 0) {
                currentIndex--;
                render();
            }
        }

        function showResult() {
            const modal = document.getElementById('resultModal');
            const msg = document.getElementById('resultMsg');
            const data = currentMode === 'learn' ? studyData[category] : integratedQuiz;
            
            if (currentMode === 'quiz') {
                const percent = Math.round((score / data.length) * 100);
                let evaluation = "대단합니다! Compose 마스터의 길에 가까워졌어요.";
                if(percent < 40) evaluation = "다시 한번 개념 학습을 정독해보세요.";
                else if(percent < 75) evaluation = "기본기가 탄탄하네요! 조금만 더 하면 전문가입니다.";

                msg.innerHTML = `최종 점수: <span class='text-blue-600 font-bold'>${score} / ${data.length}</span><br><br><span class="text-sm font-medium text-slate-500">${evaluation}</span>`;
            } else {
                let diffName = "쉬움";
                if(category === 'normal') diffName = "보통";
                if(category === 'hard') diffName = "어려움";
                msg.innerText = `[${diffName}] 난이도의 개념 학습을 모두 완료했습니다! 고생하셨습니다.`;
            }
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('resultModal').classList.add('hidden');
            currentIndex = 0;
            score = 0;
            switchMode('learn');
        }

        function copyCode(btn) {
            const code = btn.nextElementSibling.innerText;
            const textArea = document.createElement("textarea");
            textArea.value = code;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            const icon = btn.querySelector('i');
            icon.className = 'fas fa-check text-green-400';
            setTimeout(() => icon.className = 'far fa-copy', 2000);
        }

        window.onload = render;
    </script>
</body>
</html>
