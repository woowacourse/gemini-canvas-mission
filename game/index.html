<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>회전 카트 랠리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 마리오 감성에 어울리는 둥글고 두꺼운 폰트 로드 -->
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Jua', sans-serif;
      user-select: none;
    }

    .svg-container svg {
      width: 100%;
      height: 100%;
    }

    /* 마리오 스타일 텍스트 및 테두리 효과 */
    .mario-text {
      text-shadow: 3px 3px 0 #000, -1.5px -1.5px 0 #000, 1.5px 1.5px 0 #000, -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000;
    }

    .mario-text-sm {
      text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    }

    .mario-border {
      border: 4px solid #000;
      box-shadow: 4px 6px 0px rgba(0, 0, 0, 1);
    }

    .mario-btn:active {
      transform: translateY(4px);
      box-shadow: 0px 2px 0px rgba(0, 0, 0, 1);
    }

    /* 레이싱 체크무늬 및 배경 패턴 */
    .checkered-bg {
      background-image: linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%, #000),
      linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%, #000);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
      background-color: #fff;
    }

    .track-bg {
      background: linear-gradient(to bottom, #4ade80 0%, #22c55e 100%);
    }

    .sky-bg {
      background: linear-gradient(to bottom, #38bdf8 0%, #7dd3fc 100%);
    }

    /* 키보드 버튼 패널 */
    .key-badge {
      display: inline-block;
      padding: 1px 4px;
      border-radius: 999px;
      font-weight: bold;
      font-size: 0.65rem;
      text-transform: uppercase;
      border: 2px solid #000;
      box-shadow: 0 2px 0 #000;
      background-color: #fff;
      color: #000;
    }

    @media (min-width: 640px) {
      .key-badge {
        padding: 2px 6px;
        font-size: 0.75rem;
      }
    }

    @media (min-width: 768px) {
      .key-badge {
        padding: 4px 10px;
        font-size: 0.9rem;
        border: 3px solid #000;
        box-shadow: 0 3px 0 #000;
      }
    }

    /* 세로 반응형 최적화 (높이 기준) */
    @media (max-height: 900px) {
      .vh-title {
        font-size: 4rem !important;
        margin-top: 1.5rem !important;
        margin-bottom: 0.5rem !important;
      }

      .vh-subtitle {
        font-size: 2.5rem !important;
        margin-bottom: 1rem !important;
      }

      .vh-box {
        padding: 1.5rem !important;
        margin-bottom: 1rem !important;
      }

      .vh-box-label {
        font-size: 1.75rem !important;
        margin-bottom: 1rem !important;
      }

      .vh-btn {
        width: 4rem !important;
        height: 4rem !important;
        font-size: 2rem !important;
      }

      .vh-start-btn {
        padding: 0.75rem 2rem !important;
        font-size: 2rem !important;
      }

      .vh-info {
        padding: 1rem !important;
        margin-top: 1rem !important;
      }

      .vh-hud {
        padding: 1rem !important;
      }

      .vh-player {
        max-width: 90px !important;
        padding: 0.35rem !important;
      }

      .vh-timer {
        font-size: 4rem !important;
      }

      .vh-target {
        max-height: 28vh !important;
        padding: 0.75rem !important;
      }

      .vh-choice-wrap {
        height: 35% !important;
      }

      .vh-choice {
        max-width: 150px !important;
      }

      .vh-result-title {
        font-size: 4rem !important;
        margin-top: 1rem !important;
        margin-bottom: 1rem !important;
      }

      .vh-result-box {
        padding: 1rem !important;
        gap: 0.75rem !important;
      }

      .vh-result-item {
        padding: 0.75rem !important;
      }

      .vh-result-rank {
        font-size: 2rem !important;
      }

      .vh-result-name {
        font-size: 1.75rem !important;
      }

      .vh-result-score {
        font-size: 2.25rem !important;
      }

      .vh-result-btn {
        padding: 0.75rem 2rem !important;
        font-size: 1.5rem !important;
        margin-top: 1rem !important;
      }

      .checkered-bg {
        height: 1.5rem !important;
      }
    }

    @media (max-height: 750px) {
      .vh-title {
        font-size: 3rem !important;
        margin-top: 1rem !important;
      }

      .vh-subtitle {
        font-size: 1.5rem !important;
      }

      .vh-box {
        padding: 1rem !important;
      }

      .vh-btn {
        width: 3rem !important;
        height: 3rem !important;
        font-size: 1.5rem !important;
      }

      .vh-start-btn {
        padding: 0.5rem 1rem !important;
        font-size: 1.5rem !important;
      }

      .vh-timer {
        font-size: 3.5rem !important;
      }

      .vh-target {
        max-height: 28vh !important;
      }

      .vh-choice {
        max-width: 130px !important;
      }

      .vh-result-title {
        font-size: 3rem !important;
        margin-top: 0.5rem !important;
        margin-bottom: 0.5rem !important;
      }

      .vh-result-box {
        padding: 0.75rem !important;
        gap: 0.5rem !important;
      }

      .vh-result-item {
        padding: 0.5rem !important;
      }

      .vh-result-rank {
        font-size: 1.5rem !important;
      }

      .vh-result-name {
        font-size: 1.4rem !important;
      }

      .vh-result-score {
        font-size: 1.75rem !important;
      }

      .vh-result-btn {
        padding: 0.5rem 1.5rem !important;
        font-size: 1.25rem !important;
        margin-top: 0.5rem !important;
      }
    }

    @media (max-height: 600px) {
      .vh-title {
        font-size: 2.5rem !important;
      }

      .vh-timer {
        font-size: 3rem !important;
      }

      .vh-target {
        max-height: 32vh !important;
      }

      .vh-choice {
        max-width: 110px !important;
      }

      .vh-result-title {
        font-size: 2.25rem !important;
        margin-top: 0.25rem !important;
      }

      .vh-result-box {
        padding: 0.5rem !important;
        gap: 0.3rem !important;
      }

      .vh-result-item {
        padding: 0.4rem !important;
        border-width: 3px !important;
      }

      .vh-result-rank {
        font-size: 1.25rem !important;
      }

      .vh-result-name {
        font-size: 1.2rem !important;
      }

      .vh-result-score {
        font-size: 1.5rem !important;
      }

      .vh-result-btn {
        padding: 0.4rem 1.25rem !important;
        font-size: 1.1rem !important;
        margin-top: 0.25rem !important;
      }

      .checkered-bg {
        height: 1rem !important;
      }
    }
  </style>
</head>
<body class="sky-bg text-white h-screen overflow-hidden flex flex-col relative">

<div class="absolute bottom-0 left-0 w-full h-[35%] track-bg border-t-8 border-black z-0"></div>

<div class="flex-1 flex flex-col relative z-10 overflow-hidden" id="app"></div>

<script>
  // --- 게임 설정 전역 변수 ---
  const MAX_ROUNDS = 3;
  const TOTAL_IMAGE_SETS = 8;
  const ROUND_TIME = 10;
  const SCORES = [10, 8, 5, 3, 1];

  const PLAYER_COLORS = [
    { bg: 'bg-[#EF4444]', text: 'text-white', name: 'P1' },
    { bg: 'bg-[#22C55E]', text: 'text-white', name: 'P2' },
    { bg: 'bg-[#3B82F6]', text: 'text-white', name: 'P3' },
    { bg: 'bg-[#FFB000]', text: 'text-white', name: 'P4' },
  ];

  const KEY_MAP = {
    '1': { p: 0, choice: 0 },
    '2': { p: 0, choice: 1 },
    '3': { p: 0, choice: 2 },
    '4': { p: 0, choice: 3 },
    '9': { p: 1, choice: 0 },
    '0': { p: 1, choice: 1 },
    '-': { p: 1, choice: 2 },
    '=': { p: 1, choice: 3 },
    'z': { p: 2, choice: 0 },
    'x': { p: 2, choice: 1 },
    'c': { p: 2, choice: 2 },
    'v': { p: 2, choice: 3 },
    'm': { p: 3, choice: 0 },
    ',': { p: 3, choice: 1 },
    '.': { p: 3, choice: 2 },
    '/': { p: 3, choice: 3 },
  };

  const KEY_LABELS = [
    ['1', '2', '3', '4'], ['9', '0', '-', '='], ['Z', 'X', 'C', 'V'], ['M', ',', '.', '/'],
  ];

  let state = {
    screen: 'setup',
    playerCount: 2,
    players: [],
    currentRound: 0,
    roundSequence: [],
    timeLeft: ROUND_TIME,
    targetIndex: -1,
    images: [],
    correctAnswersCount: 0,
    angles: [0, 0, 0, 0],
    lastTime: 0,
    animationFrameId: null,
  };

  const appDiv = document.getElementById('app');

  function generateSVG(imageSetId, variant) {
    const isCorrect = (variant === 0);
    switch (imageSetId) {
      case 1: // 로봇
        const robotLeftEye = `<circle cx="35" cy="45" r="5" fill="#3498db" stroke="#000" stroke-width="2"/>`;
        const robotRightEye = isCorrect ? `<circle cx="65" cy="45" r="5" fill="#3498db" stroke="#000" stroke-width="2"/>` : `<rect x="60" y="40" width="10" height="10" fill="#3498db" stroke="#000" stroke-width="2"/>`;
        return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="25" y="30" width="50" height="50" rx="5" fill="#ecf0f1" stroke="#2c3e50" stroke-width="3"/><line x1="50" y1="30" x2="50" y2="15" stroke="#2c3e50" stroke-width="3"/><circle cx="50" cy="10" r="5" fill="#f1c40f" stroke="#000" stroke-width="1"/>${robotLeftEye}${robotRightEye}<rect x="35" y="65" width="30" height="4" fill="#e74c3c" stroke="#000" stroke-width="1"/></svg>`;
      case 2: // 로켓
        const rocketFlames = isCorrect ? `<path d="M42,70 Q42,90 46,82 Q50,95 54,82 Q58,90 58,70" fill="#f39c12" stroke="#000" stroke-width="1.5"/>` : `<path d="M44,70 Q44,90 50,82 Q56,90 56,70" fill="#f39c12" stroke="#000" stroke-width="1.5"/>`;
        return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><polygon points="50,15 20,65 80,65" fill="#95a5a6" stroke="#2c3e50" stroke-width="2"/><polygon points="50,10 35,70 65,70" fill="#ecf0f1" stroke="#2c3e50" stroke-width="2"/>${rocketFlames}<circle cx="50" cy="45" r="7" fill="#3498db" stroke="#2c3e50" stroke-width="2"/></svg>`;
      case 3: // 열쇠
        const keyTeeth = isCorrect ? `<rect x="70" y="52" width="5" height="15" fill="#f1c40f" stroke="#000"/><rect x="80" y="52" width="5" height="15" fill="#f1c40f" stroke="#000"/><rect x="90" y="52" width="5" height="15" fill="#f1c40f" stroke="#000"/>` : `<rect x="75" y="52" width="6" height="15" fill="#f1c40f" stroke="#000"/><rect x="85" y="52" width="6" height="15" fill="#f1c40f" stroke="#000"/>`;
        return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="35" y="45" width="60" height="8" fill="#f1c40f" stroke="#2c3e50" stroke-width="3"/><circle cx="25" cy="49" r="12" fill="#f1c40f" stroke="#2c3e50" stroke-width="3"/><circle cx="25" cy="49" r="4" fill="#2c3e50"/>${keyTeeth}</svg>`;
      case 4: // 레이싱카
        const racingWheels = isCorrect ? `<circle cx="35" cy="72" r="8" fill="#333" stroke="#000"/><circle cx="65" cy="72" r="8" fill="#333" stroke="#000"/>` : `<rect x="28" y="65" width="14" height="14" rx="2" fill="#333" stroke="#000"/><rect x="58" y="65" width="14" height="14" rx="2" fill="#333" stroke="#000"/>`;
        return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="50" width="60" height="20" rx="3" fill="#e74c3c" stroke="#000" stroke-width="2"/><rect x="30" y="42" width="35" height="10" rx="2" fill="#e74c3c" stroke="#000" stroke-width="2"/>${racingWheels}</svg>`;
      case 5: // 트로피
        const handle = isCorrect ? `<path d="M30,40 Q18,40 18,55 Q18,70 30,70" fill="none" stroke="#f1c40f" stroke-width="5"/><path d="M70,40 Q82,40 82,55 Q82,70 70,70" fill="none" stroke="#f1c40f" stroke-width="5"/>` : `<polyline points="30,40 18,40 18,70 30,70" fill="none" stroke="#f1c40f" stroke-width="5"/><polyline points="70,40 82,40 82,70 70,70" fill="none" stroke="#f1c40f" stroke-width="5"/>`;
        const star = `<polygon points="50,42 52,48 58,48 53,52 55,58 50,54 45,58 47,52 42,48 48,48" fill="#e67e22" stroke="#000" stroke-width="1"/>`;
        return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="30" y="30" width="40" height="50" rx="5" fill="#f1c40f" stroke="#000" stroke-width="2"/>${handle}${star}<rect x="35" y="80" width="30" height="8" fill="#7f8c8d" stroke="#000"/></svg>`;
      case 6: // 버섯
        const mushSpots = isCorrect ? `<circle cx="50" cy="32" r="10" fill="#fff"/><circle cx="28" cy="45" r="6" fill="#fff"/><circle cx="72" cy="45" r="6" fill="#fff"/>` : `<rect x="42" y="24" width="16" height="16" rx="2" fill="#fff"/><rect x="20" y="40" width="10" height="10" rx="1" fill="#fff"/><rect x="70" y="40" width="10" height="10" rx="1" fill="#fff"/>`;
        const face = `<rect x="42" y="65" width="2" height="6" fill="#000"/><rect x="56" y="65" width="2" height="6" fill="#000"/><path d="M46,75 Q50,78 54,75" fill="none" stroke="#000" stroke-width="1.5"/>`;
        return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="35" y="55" width="30" height="32" rx="10" fill="#fde3a7" stroke="#000" stroke-width="2"/><path d="M15,55 Q15,15 50,15 Q90,15 85,55" fill="#e74c3c" stroke="#000" stroke-width="2"/>${mushSpots}${face}</svg>`;
      case 7: // 깃발
        const flagPath = isCorrect ? 'M20,20 Q50,5 80,20 L80,55 Q50,40 20,55 Z' : 'M20,20 Q50,35 80,20 L80,55 Q50,70 20,55 Z';
        const dots = `<rect x="35" y="15" width="8" height="8" fill="#000"/><rect x="55" y="15" width="8" height="8" fill="#000"/>`;
        return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><line x1="20" y1="15" x2="20" y2="90" stroke="#000" stroke-width="5"/><path d="${flagPath}" fill="#fff" stroke="#000" stroke-width="2"/>${dots}</svg>`;
      case 8: // 선인장
        const arm = isCorrect ? `<path d="M25,40 L25,55 L42,55" fill="none" stroke="#2ecc71" stroke-width="10"/>` : `<path d="M25,50 L25,55 L42,55" fill="none" stroke="#2ecc71" stroke-width="10"/>`;
        return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="42" y="20" width="16" height="60" rx="8" fill="#2ecc71" stroke="#000" stroke-width="3"/>${arm}<path d="M75,40 L75,55 L58,55" fill="none" stroke="#2ecc71" stroke-width="10"/><rect x="32" y="80" width="36" height="15" fill="#d35400" stroke="#000" stroke-width="2"/></svg>`;
      default:
        return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="40" fill="#ccc"/></svg>`;
    }
  }

  // --- 화면 렌더링 함수들 ---
  function renderSetup() {
    appDiv.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full w-full py-4 sm:py-8">
                    <div class="absolute top-2 sm:top-6 left-0 w-full h-6 sm:h-10 checkered-bg border-b-4 border-black z-0"></div>
                    <div class="absolute bottom-2 sm:bottom-6 left-0 w-full h-6 sm:h-10 checkered-bg border-y-4 border-black z-0"></div>
                    <h1 class="vh-title text-4xl sm:text-6xl md:text-8xl font-black text-white mario-text text-center mb-1 sm:mb-2 z-10 tracking-wide mt-10 uppercase">
                        <span class="text-red-500">회전</span> <span class="text-green-500">카트</span>
                    </h1>
                    <h2 class="vh-subtitle text-2xl sm:text-4xl md:text-5xl font-black text-yellow-300 mario-text text-center mb-4 sm:mb-8 z-10">랠리!</h2>
                    <div class="vh-box bg-white text-black p-4 sm:p-8 rounded-2xl sm:rounded-3xl mario-border flex flex-col items-center z-10 max-w-lg w-[90%] shadow-2xl shrink-0">
                        <label class="vh-box-label text-lg sm:text-3xl mb-3 sm:mb-6 font-black text-center text-black leading-tight">레이서 인원을 선택하세요<br><span class="text-sm sm:text-xl text-gray-500">(2~4인)</span></label>
                        <div class="flex space-x-3 sm:space-x-6 mb-4 sm:mb-8">
                            ${[2, 3, 4].map(n => `<button onclick="setPlayerCount(${n})" class="vh-btn w-10 h-10 sm:w-16 sm:h-16 rounded-full text-xl sm:text-3xl font-black transition-all mario-border mario-btn flex items-center justify-center ${state.playerCount === n ? 'bg-blue-500 text-white scale-125' : 'bg-gray-200 text-gray-500 hover:bg-yellow-300 hover:text-black'}">${n}</button>`)
                                       .join('')}
                        </div>
                        <button onclick="startGame()" class="vh-start-btn px-6 sm:px-12 py-2 sm:py-4 bg-red-500 text-white font-black rounded-full text-xl sm:text-4xl mario-border mario-btn transition-transform text-center shadow-lg w-full">START!</button>
                    </div>
                    <div class="vh-info mt-4 sm:mt-8 text-xs sm:text-xl text-white mario-text-sm max-w-2xl w-[90%] text-center leading-relaxed z-10 bg-black/60 p-3 sm:p-5 rounded-xl sm:rounded-2xl mario-border shadow-xl mb-10 shrink-0">
                        <p class="mb-1 sm:mb-2 text-yellow-300 text-base sm:text-2xl uppercase">[패드 조작키 안내]</p>
                        P1: <span class="text-red-400">1, 2, 3, 4</span> | P2: <span class="text-green-400">9, 0, -, =</span><br>P3: <span class="text-blue-400">Z, X, C, V</span> | P4: <span class="text-yellow-400">M, ,, ., /</span>
                    </div>
                </div>`;
  }

  function renderGame() {
    const statusHTML = state.players.map((p, i) => `
                <div class="vh-player flex flex-col items-center p-1 sm:p-2 rounded-xl sm:rounded-2xl mario-border ${p.hasAnswered ? 'opacity-60 scale-95' : 'scale-100'} ${PLAYER_COLORS[i].bg} ${PLAYER_COLORS[i].text} relative w-[18vw] max-w-[80px] sm:max-w-[100px] shadow-lg transition-transform shrink-0">
                    <span class="vh-player-name font-black text-[10px] sm:text-sm md:text-lg mario-text-sm leading-tight">${PLAYER_COLORS[i].name}</span>
                    <span class="vh-player-score text-sm sm:text-xl md:text-2xl font-black mario-text-sm mt-0 leading-tight">${p.score}</span>
                    ${p.hasAnswered ? '<div class="absolute -bottom-2 sm:-bottom-3 bg-white text-black text-[8px] sm:text-xs font-black px-1.5 py-0.5 sm:px-2 sm:py-0.5 rounded-full mario-border transform -rotate-6">선택!</div>' : ''}
                </div>`).join('');

    const choicesHTML = state.images.map((svg, i) => {
      const keysHTML = state.players.map((p, pi) => `<div class="${PLAYER_COLORS[pi].bg} ${PLAYER_COLORS[pi].text} key-badge text-center shadow-md">${KEY_LABELS[pi][i]}</div>`)
                            .join('');
      return `
                <div class="vh-choice flex flex-col items-center flex-1 max-w-[100px] sm:max-w-[140px] md:max-w-[160px] z-10 shrink-0">
                    <div class="vh-choice-inner w-full aspect-square bg-white rounded-full mario-border mb-1 sm:mb-2 flex items-center justify-center overflow-hidden shadow-xl relative">
                        <div id="choice-img-${i}" class="svg-container w-full h-full p-2">${svg}</div>
                    </div>
                    <div class="grid grid-cols-2 gap-0.5 sm:gap-1 w-full px-0.5">${keysHTML}</div>
                </div>`;
    }).join('');

    appDiv.innerHTML = `
                <div class="vh-hud flex flex-row justify-between items-start p-2 sm:p-4 z-20 w-full shrink-0">
                    <div class="flex flex-wrap justify-start gap-1 sm:gap-2 max-w-[60%]">${statusHTML}</div>
                    <div class="vh-timer-box flex flex-col items-end bg-black/50 p-2 sm:p-3 rounded-xl sm:rounded-2xl mario-border backdrop-blur-sm shadow-xl shrink-0">
                        <div class="vh-lap text-yellow-300 text-sm sm:text-xl md:text-2xl font-black mario-text mb-0 leading-none">LAP ${state.currentRound} / ${MAX_ROUNDS}</div>
                        <div class="vh-timer text-3xl sm:text-5xl md:text-6xl font-black mario-text tabular-nums leading-none ${state.timeLeft <= 5 ? 'text-red-500 animate-pulse' : 'text-white'}" id="timer-display">${Math.ceil(state.timeLeft)}</div>
                    </div>
                </div>
                <div class="vh-target-wrap flex flex-col items-center justify-center flex-1 z-10 min-h-0 py-1 sm:py-2">
                    <div class="vh-target h-full max-h-[20vh] sm:max-h-[25vh] aspect-square bg-yellow-400 mario-border rounded-xl flex items-center justify-center p-1.5 sm:p-3 shadow-2xl animate-bounce relative shrink-0">
                        <div class="absolute -top-2 -right-2 sm:-top-4 sm:-right-4 bg-red-500 text-white text-[10px] sm:text-base font-black mario-border px-1.5 py-0.5 sm:px-2 sm:py-1 rounded-full transform rotate-12 mario-text-sm">TARGET!</div>
                        <div class="w-full h-full svg-container bg-white rounded-lg p-1 sm:p-2 mario-border">${state.images[state.targetIndex]}</div>
                    </div>
                </div>
                <div class="vh-choice-wrap flex justify-center items-center h-[35%] space-x-2 sm:space-x-4 md:space-x-6 px-2 sm:px-4 z-10 relative shrink-0 w-full">${choicesHTML}</div>`;
  }

  function renderResult() {
    const sorted = [...state.players].sort((a, b) => b.score - a.score);
    const listHTML = sorted.map((p, i) => {
      const is1st = i === 0;
      return `
                <div class="vh-result-item flex items-center justify-between w-full p-2 sm:p-4 rounded-xl sm:rounded-2xl mario-border ${is1st ? 'bg-yellow-400' : 'bg-black/60'} ${is1st ? 'scale-[1.03] sm:scale-105 shadow-[0_0_20px_rgba(255,215,0,0.3)] z-20' : 'z-10'} relative transition-all shrink-0">
                    <div class="flex items-center space-x-2 sm:space-x-6 min-w-0">
                        <span class="vh-result-rank ${is1st ? 'text-2xl sm:text-5xl text-red-600' : 'text-xl sm:text-4xl text-white'} font-black mario-text-sm shrink-0">${i + 1}위</span>
                        <span class="vh-result-name text-lg sm:text-3xl font-black ${is1st ? 'text-black' : 'text-white'} truncate">${PLAYER_COLORS[p.id].name}</span>
                    </div>
                    <span class="vh-result-score text-2xl sm:text-5xl font-black mario-text ${is1st ? 'text-white' : 'text-yellow-300'} shrink-0">${p.score}점</span>
                </div>`;
    }).join('');

    appDiv.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full space-y-4 sm:space-y-8 p-4 sm:p-8 z-10 relative w-full overflow-hidden">
                    <div class="absolute top-2 sm:top-6 left-0 w-full h-6 sm:h-10 checkered-bg border-y-4 border-black z-0"></div>
                    <h1 class="vh-result-title text-4xl sm:text-7xl md:text-8xl font-black text-white mario-text text-center mb-2 sm:mb-6 z-10 tracking-widest mt-4 uppercase shrink-0">RACE FINISH!</h1>
                    <div class="vh-result-box w-[92%] max-w-2xl bg-white/10 backdrop-blur-md p-4 sm:p-8 rounded-2xl sm:rounded-3xl mario-border flex flex-col space-y-1 sm:space-y-2 shadow-2xl z-10 shrink-0 overflow-visible">${listHTML}</div>
                    <button onclick="initSetup()" class="vh-result-btn mt-4 sm:mt-10 px-6 sm:px-12 py-2 sm:py-5 bg-blue-500 text-white font-black rounded-full text-lg sm:text-3xl hover:bg-blue-600 transition-transform active:scale-95 mario-border mario-btn shadow-xl z-10 shrink-0">다시 레이스하기</button>
                    <div class="absolute bottom-2 sm:bottom-6 left-0 w-full h-6 sm:h-10 checkered-bg border-y-4 border-black z-0"></div>
                </div>`;
  }

  // --- 게임 엔진 로직 ---
  function setPlayerCount(n) {
    state.playerCount = n;
    renderSetup();
  }

  function initSetup() {
    state.screen = 'setup';
    state.currentRound = 0;
    renderSetup();
  }

  function startGame() {
    state.players = Array.from({ length: state.playerCount }, (_, i) => ({
      id: i, name: `P${i + 1}`, score: 0, hasAnswered: false, isCorrect: false, answerOrder: -1,
    }));
    const pool = Array.from({ length: TOTAL_IMAGE_SETS }, (_, i) => i + 1);
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    state.roundSequence = pool.slice(0, MAX_ROUNDS);
    state.currentRound = 0;
    startRound();
  }

  function startRound() {
    state.currentRound++;
    if (state.currentRound > MAX_ROUNDS) {
      state.screen = 'finalResult';
      renderResult();
      return;
    }

    const setId = state.roundSequence[state.currentRound - 1];
    state.timeLeft = ROUND_TIME;
    state.correctAnswersCount = 0;
    state.angles = [0, 0, 0, 0];
    state.players.forEach(p => {
      p.hasAnswered = false;
      p.isCorrect = false;
      p.answerOrder = -1; // 이번 라운드 정답 순서 초기화
    });

    let temp = [generateSVG(setId, 0), generateSVG(setId, 1), generateSVG(setId, 1), generateSVG(setId, 1)];
    for (let i = temp.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [temp[i], temp[j]] = [temp[j], temp[i]];
    }
    state.images = temp;
    const target = generateSVG(setId, 0);
    state.targetIndex = state.images.findIndex(s => s === target);

    state.screen = 'playing';
    renderGame();
    state.lastTime = performance.now();
    if (state.animationFrameId) cancelAnimationFrame(state.animationFrameId);
    state.animationFrameId = requestAnimationFrame(loop);
  }

  function processRoundScores() {
    // 이번 라운드 정답자들의 점수를 일괄 업데이트
    state.players.forEach(p => {
      if (p.isCorrect && p.answerOrder !== -1) {
        const score = SCORES[p.answerOrder] || 1;
        p.score += score;
      }
    });
  }

  function loop(t) {
    if (state.screen !== 'playing') return;
    const dt = (t - state.lastTime) / 1000;
    state.lastTime = t;
    state.timeLeft -= dt;

    if (state.timeLeft <= 0) {
      state.timeLeft = 0;
      const el = document.getElementById('timer-display');
      if (el) {
        el.innerText = '0';
        el.classList.replace('text-white', 'text-red-500');
        el.classList.remove('animate-pulse');
      }

      state.screen = 'revealing';

      // 고속 회전 멈추고 정방향 정렬
      for (let i = 0; i < 4; i++) {
        state.angles[i] = 6120;
        const img = document.getElementById(`choice-img-${i}`);
        if (img) img.style.transform = `rotate(6120deg)`;
      }

      // 점수 계산 (시간 종료 직후)
      processRoundScores();

      setTimeout(() => {
        // 정답 하이라이트 및 HUD 점수 업데이트 반영을 위한 렌더링
        renderGame();

        for (let i = 0; i < 4; i++) {
          const box = document.getElementById(`choice-img-${i}`).parentElement;
          if (i === state.targetIndex) {
            box.classList.replace('bg-white', 'bg-green-300');
            box.classList.add('ring-4', 'sm:ring-8', 'ring-yellow-400', 'scale-110', 'sm:scale-125', 'transition-transform', 'duration-300', 'z-20');
          } else {
            box.classList.add('opacity-40', 'transition-opacity', 'duration-300', 'scale-90');
          }
        }
        setTimeout(() => startRound(), 2000);
      }, 700);
      return;
    }

    const elapsed = ROUND_TIME - state.timeLeft;
    const v0 = 816;
    const angle = (elapsed <= 5) ? v0 * elapsed : (v0 * 5) + (v0 * (elapsed - 5)) - (0.5 * (v0 / 5) * (elapsed - 5) * (elapsed - 5));
    for (let i = 0; i < 4; i++) {
      state.angles[i] = angle;
      const img = document.getElementById(`choice-img-${i}`);
      if (img) img.style.transform = `rotate(${angle}deg)`;
    }
    const tel = document.getElementById('timer-display');
    if (tel) {
      tel.innerText = Math.ceil(Math.max(0, state.timeLeft));
      if (state.timeLeft <= 5 && !tel.classList.contains('text-red-500')) {
        tel.classList.replace('text-white', 'text-red-500');
        tel.classList.add('animate-pulse');
      }
    }
    state.animationFrameId = requestAnimationFrame(loop);
  }

  window.addEventListener('keydown', (e) => {
    if (state.screen !== 'playing') return;
    const key = e.key.toLowerCase();
    const map = KEY_MAP[key];
    if (map) {
      const { p, choice } = map;
      if (p >= state.playerCount) return;
      const player = state.players[p];
      if (player.hasAnswered) return;

      player.hasAnswered = true;

      if (choice === state.targetIndex) {
        player.isCorrect = true;
        player.answerOrder = state.correctAnswersCount; // 정답 순서 기록
        state.correctAnswersCount++;
      }

      // UI에서 '선택!' 뱃지만 즉시 업데이트 (점수 업데이트는 안 함)
      renderGame();

      // 렌더링 후 회전 상태 유지
      for (let i = 0; i < 4; i++) {
        const img = document.getElementById(`choice-img-${i}`);
        if (img) img.style.transform = `rotate(${state.angles[i]}deg)`;
      }
    }
  });

  initSetup();
</script>
</body>
</html>
