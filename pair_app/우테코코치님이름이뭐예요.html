<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우아한테크코스 - 코치를 맞춰라!</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/variable/pretendardvariable.css" />

    <!-- 토스 컬러 팔레트를 Tailwind에 주입 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        toss: {
                            blue: '#3182F6',
                            blueHover: '#1B64DA',
                            red: '#F04452',
                            redHover: '#D93D4A',
                            green: '#04C065',
                            bg: '#F2F4F6',
                            surface: '#FFFFFF',
                            textMain: '#191F28',
                            textSub: '#8B95A1',
                            border: '#E5E8EB',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* 글로벌 폰트 및 배경 설정 (토스 스타일) */
        body {
            font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #F2F4F6;
            min-height: 100vh;
            color: #191F28;
            -webkit-font-smoothing: antialiased;
        }

        /* View 전환 애니메이션 */
        .view-container {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .view-hidden {
            opacity: 0;
            pointer-events: none;
            position: absolute;
            transform: translateY(10px);
        }

        .view-active {
            opacity: 1;
            pointer-events: auto;
            position: relative;
            transform: translateY(0);
        }

        /* 토스 스타일 세그먼트 컨트롤 (선이 없는 둥근 면) */
        .toss-segmented {
            display: flex;
            background: #F2F4F6;
            border-radius: 16px;
            padding: 4px;
        }

        .toss-segmented label {
            flex: 1;
            text-align: center;
            padding: 12px 8px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.875rem;
            color: #8B95A1;
            transition: all 0.2s ease;
        }

        .toss-segmented input[type="radio"] {
            display: none;
        }

        .toss-segmented input[type="radio"]:checked+label {
            background: #FFFFFF;
            color: #191F28;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        /* 타이머 프로그레스 바 (토스 스타일) */
        .timer-bar {
            height: 8px;
            background: #E5E8EB;
            border-radius: 9999px;
            overflow: hidden;
            width: 100%;
        }

        .timer-fill {
            height: 100%;
            background: #3182F6;
            border-radius: 9999px;
            transition: width 0.1s linear, background-color 0.3s ease;
        }

        .timer-warning {
            background: #F9A825;
        }

        .timer-danger {
            background: #F04452;
        }

        /* 입력 폼 포커스 디자인 */
        input.toss-input {
            background-color: #F2F4F6;
            transition: all 0.2s ease;
        }

        input.toss-input:focus {
            outline: none;
            background-color: #FFFFFF;
            box-shadow: inset 0 0 0 2px #3182F6;
        }

        /* 버튼 기본/호버 효과 */
        .btn-toss-primary {
            background-color: #3182F6;
            color: white;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-toss-primary:hover:not(:disabled) {
            background-color: #1B64DA;
        }

        .btn-toss-primary:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn-toss-primary:disabled {
            background-color: #E5E8EB;
            color: #B0B8C1;
            cursor: not-allowed;
        }

        /* 객관식 버튼 토스 스타일 */
        .choice-btn {
            background: #F2F4F6;
            color: #191F28;
            transition: all 0.2s ease;
        }

        .choice-btn:hover:not(:disabled) {
            background: #E5E8EB;
        }

        .choice-btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        /* 정답/오답 애니메이션 클래스 */
        .correct-answer {
            background-color: #04C065 !important;
            color: white !important;
        }

        .wrong-answer {
            background-color: #F04452 !important;
            color: white !important;
            animation: shake 0.4s cubic-bezier(.36, .07, .19, .97) both;
        }

        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-2px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(4px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-6px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(6px, 0, 0);
            }
        }

        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-slide-up {
            animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>

<body class="flex items-center justify-center p-0 md:p-8">

    <!-- 메인 애플리케이션 컨테이너 (토스 앱 화면 스타일의 카드) -->
    <div id="app"
        class="bg-white w-full h-full md:h-auto md:max-w-md md:rounded-[32px] p-6 md:p-8 relative overflow-hidden md:shadow-[0_12px_40px_rgba(0,0,0,0.08)]">

        <!-- ==========================================
             View 1: 설정 및 코치 등록 (Setup View) 
        =========================================== -->
        <div id="setup-view" class="view-container view-active flex flex-col gap-8 h-full">
            <!-- 헤더 영역: 좌측 정렬, 큰 타이포그래피 -->
            <div class="mt-4 md:mt-0">
                <h1 class="text-[26px] font-extrabold text-toss-textMain leading-tight">우테코 코치님,<br>이름이 뭐예요?</h1>
                <p class="text-[15px] text-toss-textSub mt-2 font-medium">크루원들과 함께 코치님들의 얼굴을 익혀보세요.</p>
            </div>

            <!-- 데이터 입력 영역 (Data Entry) -->
            <div class="flex-1 flex flex-col gap-6">
                <!-- 코치 데이터 추가 영역 -->
                <div>
                    <div class="flex items-center justify-between mb-3">
                        <h2 class="text-[17px] font-bold text-toss-textMain">코치 데이터 추가</h2>
                        <!-- 더미 데이터 버튼 (토스 스타일 텍스트 버튼) -->
                        <button id="btn-load-mock"
                            class="text-[13px] font-semibold text-toss-blue hover:bg-blue-50 px-3 py-1.5 rounded-lg transition-colors">
                            테스트 데이터 채우기
                        </button>
                    </div>

                    <div class="w-full">
                        <!-- 업로드 영역과 리스트 영역을 하나의 토스형 면으로 통합 -->
                        <div id="upload-container" class="bg-toss-bg rounded-2xl p-5 min-h-[140px] transition-colors">
                            <!-- JavaScript를 통해 렌더링 -->
                        </div>
                        <!-- 실제 파일 입력 폼은 숨겨둠 -->
                        <input type="file" id="coach-image" accept="image/*" multiple class="hidden">

                        <div class="flex items-center justify-between mt-3 px-1">
                            <span class="text-[13px] font-medium text-toss-textSub">등록된 코치 <span id="coach-count"
                                    class="font-bold text-toss-textMain">0</span>명</span>
                            <span id="min-req-warning" class="text-[13px] text-toss-red hidden font-medium">객관식은 최소 4명이
                                필요합니다.</span>
                        </div>
                    </div>
                </div>

                <!-- 게임 설정 영역 -->
                <div class="space-y-5">
                    <!-- 제한 시간 설정 -->
                    <div>
                        <span class="block text-[14px] font-bold text-toss-textMain mb-2">제한 시간</span>
                        <div class="toss-segmented">
                            <input type="radio" id="time-5" name="timeSetting" value="5" checked>
                            <label for="time-5">5초</label>

                            <input type="radio" id="time-10" name="timeSetting" value="10">
                            <label for="time-10">10초</label>

                            <input type="radio" id="time-15" name="timeSetting" value="15">
                            <label for="time-15">15초</label>

                            <input type="radio" id="time-30" name="timeSetting" value="30">
                            <label for="time-30">30초</label>
                        </div>
                    </div>

                    <!-- 입력 방식 설정 -->
                    <div>
                        <span class="block text-[14px] font-bold text-toss-textMain mb-2">입력 방식</span>
                        <div class="toss-segmented">
                            <input type="radio" id="mode-choice" name="modeSetting" value="choice" checked>
                            <label for="mode-choice">보기 선택</label>

                            <input type="radio" id="mode-typing" name="modeSetting" value="typing">
                            <label for="mode-typing">직접 입력</label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 하단 고정 액션 버튼 -->
            <div class="mt-auto pt-4 pb-2">
                <button id="btn-start-game" class="btn-toss-primary w-full h-[56px] rounded-2xl text-[17px] font-bold"
                    disabled>
                    퀴즈 시작하기
                </button>
            </div>
        </div>

        <!-- ==========================================
             View 2: 퀴즈 진행 (Game View) 
        =========================================== -->
        <div id="game-view" class="view-container view-hidden flex flex-col items-center h-full">

            <!-- 상단 헤더 및 컨트롤 -->
            <div class="w-full flex justify-between items-center mb-6 mt-2">
                <span class="text-[15px] font-bold text-toss-textSub">
                    <span id="current-question-num" class="text-toss-textMain">1</span> / <span
                        id="total-question-num">10</span>
                </span>
                <div class="flex items-center gap-2">
                    <button id="btn-skip"
                        class="text-[13px] font-semibold text-toss-textSub bg-toss-bg hover:bg-toss-border px-4 py-2 rounded-xl transition-colors">
                        건너뛰기
                    </button>
                    <button id="btn-end-game"
                        class="text-[13px] font-semibold text-toss-red bg-[#FEE2E5] hover:bg-[#FCD4D9] px-4 py-2 rounded-xl transition-colors">
                        종료
                    </button>
                </div>
            </div>

            <!-- 프로그레스 타이머 -->
            <div class="w-full mb-8 relative">
                <div class="flex justify-between items-end mb-2">
                    <span class="text-[14px] font-bold text-toss-textMain">남은 시간</span>
                    <span class="text-[20px] font-extrabold text-toss-blue tabular-nums leading-none">
                        <span id="timer-text">30</span><span
                            class="text-[15px] text-toss-textSub font-bold ml-0.5">초</span>
                    </span>
                </div>
                <div class="timer-bar">
                    <div id="timer-fill" class="timer-fill" style="width: 100%;"></div>
                </div>
            </div>

            <!-- 문제 이미지 (Target Image) -->
            <div class="relative w-56 h-56 mb-8 rounded-[32px] p-2 bg-toss-bg shadow-inner">
                <div class="w-full h-full rounded-[24px] overflow-hidden relative shadow-sm">
                    <img id="question-image" src="" alt="코치 사진" class="w-full h-full object-cover">
                    <!-- 정답/오답 오버레이 효과 -->
                    <div id="feedback-overlay"
                        class="absolute inset-0 bg-white/90 flex items-center justify-center opacity-0 transition-opacity duration-200">
                        <i id="feedback-icon" data-lucide="check-circle" class="w-20 h-20 text-toss-green"></i>
                    </div>
                </div>
            </div>

            <!-- 힌트 영역 (Hint Area) -->
            <div id="hint-area" class="w-full min-h-[80px] mb-4 flex flex-col gap-2 justify-end">
                <!-- JavaScript를 통해 힌트가 시간에 따라 순차적으로 주입됩니다 -->
            </div>

            <!-- 입력 영역 (Input Area) -->
            <div id="input-area" class="w-full mt-auto mb-2">
                <!-- JavaScript를 통해 렌더링 -->
            </div>

        </div>

        <!-- ==========================================
             View 3: 결과 화면 (Result View) 
        =========================================== -->
        <div id="result-view" class="view-container view-hidden flex flex-col items-center justify-center h-full py-8">
            <div class="w-24 h-24 bg-blue-50 text-toss-blue rounded-full flex items-center justify-center mb-6">
                <i data-lucide="check-circle-2" class="w-12 h-12"></i>
            </div>

            <h2 class="text-[28px] font-extrabold text-toss-textMain mb-2">퀴즈 완료</h2>
            <p class="text-[16px] text-toss-textSub font-medium mb-10 text-center">모든 코치님의 닉네임을 확인했습니다.</p>

            <div class="w-full bg-toss-bg rounded-[24px] p-8 text-center mb-10">
                <div class="text-[15px] font-semibold text-toss-textSub mb-2">최종 스코어</div>
                <div class="flex items-baseline justify-center gap-1">
                    <span id="final-score" class="text-[56px] font-extrabold text-toss-textMain leading-none">0</span>
                    <span class="text-[24px] font-bold text-toss-textSub">/</span>
                    <span id="final-total" class="text-[24px] font-bold text-toss-textSub" id="final-total">0</span>
                </div>
                <div id="result-message" class="mt-4 text-[15px] font-bold text-toss-blue">
                    수고하셨습니다!
                </div>
            </div>

            <div class="flex flex-col gap-3 w-full mt-auto">
                <button id="btn-restart" class="btn-toss-primary w-full h-[56px] rounded-2xl text-[17px] font-bold">
                    다시 하기
                </button>
                <button id="btn-gohome"
                    class="bg-toss-bg text-toss-textMain hover:bg-toss-border w-full h-[56px] rounded-2xl text-[17px] font-bold transition-colors">
                    설정으로 돌아가기
                </button>
            </div>
        </div>

    </div>

    <!-- Application Logic (JavaScript) -->
    <script>
        // Lucide 아이콘 초기화
        lucide.createIcons();

        /* =========================================================
         * Coach Introduction Data (힌트용 소개 문구)
         * ========================================================= */
        const COACH_INTROS = {
            "포비": "반란군을 키우는 포비",
            "제이슨": "그 박재성 아닙니다",
            "네오": "빨간약, 파란약",
            "워니": "세상은 호락호락 하지 않다. 괜찮다 나도 호락호락하지 않으니까",
            "브라운": "마음 가는 대로",
            "준": "메이커",
            "구구": "개발자를 양성하는 개발자",
            "왼손": "왼온원에서 보아요",
            "제임스": "여러분이 제 꿈이에요",
            "레아": "네트워킹을 좋아하는 개발자",
            "브리": "저 베이스 알려 주실 분,,",
            "리사": "커피챗은 언제나 환영입니다",
            "디노": "오프라인에서 만나요",
            "검프": "이것이 바이브 코딩이다",
            "시지프": "함께 추억 많이 쌓아요",
            "류시": "오로지 독자 시점",
            "솔라": "개발보다는 서비스를 좋아하는",
            "저스틴": "낭만주의"
        };

        /* =========================================================
         * State Management (상태 관리자)
         * ========================================================= */
        const AppState = {
            coaches: [],
            gameQueue: [],
            currentIdx: 0,
            score: 0,
            settings: { timeLimit: 5, mode: 'choice' },
            timer: { intervalId: null, timeLeft: 0 },
            hintLevel: 0,
            isAnswering: false
        };

        /* =========================================================
         * DOM Elements
         * ========================================================= */
        const DOM = {
            views: {
                setup: document.getElementById('setup-view'),
                game: document.getElementById('game-view'),
                result: document.getElementById('result-view')
            },
            setup: {
                imageInput: document.getElementById('coach-image'),
                uploadContainer: document.getElementById('upload-container'),
                coachCount: document.getElementById('coach-count'),
                startBtn: document.getElementById('btn-start-game'),
                minReqWarning: document.getElementById('min-req-warning'),
                timeRadios: document.getElementsByName('timeSetting'),
                modeRadios: document.getElementsByName('modeSetting'),
                loadMockBtn: document.getElementById('btn-load-mock')
            },
            game: {
                currentNum: document.getElementById('current-question-num'),
                totalNum: document.getElementById('total-question-num'),
                timerText: document.getElementById('timer-text'),
                timerFill: document.getElementById('timer-fill'),
                image: document.getElementById('question-image'),
                inputArea: document.getElementById('input-area'),
                hintArea: document.getElementById('hint-area'),
                skipBtn: document.getElementById('btn-skip'),
                endBtn: document.getElementById('btn-end-game'),
                feedbackOverlay: document.getElementById('feedback-overlay'),
                feedbackIcon: document.getElementById('feedback-icon')
            },
            result: {
                score: document.getElementById('final-score'),
                total: document.getElementById('final-total'),
                message: document.getElementById('result-message'),
                restartBtn: document.getElementById('btn-restart'),
                homeBtn: document.getElementById('btn-gohome')
            }
        };

        /* =========================================================
         * Event Listeners Initialization
         * ========================================================= */
        function initEvents() {
            DOM.setup.imageInput.addEventListener('change', handleFileSelect);
            DOM.setup.loadMockBtn.addEventListener('click', loadMockData);

            Array.from(DOM.setup.modeRadios).forEach(radio => {
                radio.addEventListener('change', updateStartButtonState);
            });

            DOM.setup.startBtn.addEventListener('click', startGame);

            DOM.result.restartBtn.addEventListener('click', () => startGame());
            DOM.result.homeBtn.addEventListener('click', () => switchView('setup'));

            DOM.game.skipBtn.addEventListener('click', handleSkip);
            DOM.game.endBtn.addEventListener('click', handleEndGame);
        }

        /* =========================================================
         * Core Functions
         * ========================================================= */

        // 토스 스타일 커스텀 토스트 알림 (모던하고 눈에 잘 띄게)
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            // 토스의 스낵바는 보통 짙은 회색 배경을 선호합니다.
            toast.className = `fixed bottom-10 md:bottom-auto md:top-10 left-1/2 transform -translate-x-1/2 px-5 py-3.5 rounded-2xl text-white text-[15px] font-semibold shadow-lg z-50 transition-all duration-300 opacity-0 translate-y-4 md:-translate-y-4 flex items-center gap-2 pointer-events-none bg-[#333D4B]`;

            const icon = type === 'success' ? 'check-circle-2' : (type === 'error' ? 'alert-circle' : 'info');
            const iconColor = type === 'success' ? 'text-toss-green' : (type === 'error' ? 'text-toss-red' : 'text-toss-blue');

            toast.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5 ${iconColor}"></i><span>${message}</span>`;

            document.body.appendChild(toast);
            lucide.createIcons();

            void toast.offsetWidth;
            toast.classList.remove('opacity-0', 'translate-y-4', 'md:-translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-4', 'md:-translate-y-4');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // 한국어 초성 추출 헬퍼 함수
        function getChosung(str) {
            const chosung = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
            let result = '';
            for (let i = 0; i < str.length; i++) {
                const code = str.charCodeAt(i);
                if (code >= 44032 && code <= 55203) {
                    result += chosung[Math.floor((code - 44032) / 588)];
                } else {
                    result += str[i];
                }
            }
            return result;
        }

        // 힌트 출력 함수 (토스 스타일 말풍선 느낌)
        function showHint(level, fullName) {
            AppState.hintLevel = level;
            const match = fullName.match(/^([^(]+)/);
            const korName = match ? match[1].trim() : fullName;

            let hintLabel = '';
            let hintText = '';

            if (level === 1) {
                hintLabel = '소개';
                hintText = COACH_INTROS[korName] || '비밀이 많은 코치님입니다.';
            } else if (level === 2) {
                hintLabel = '글자수';
                const len = korName.replace(/\s+/g, '').length;
                hintText = 'O'.repeat(len) + ` (${len}글자)`;
            } else if (level === 3) {
                hintLabel = '초성';
                hintText = getChosung(korName);
            }

            const hintEl = document.createElement('div');
            hintEl.className = 'text-[14px] bg-toss-bg rounded-2xl px-4 py-3 flex gap-3 items-center animate-slide-up w-full';
            hintEl.innerHTML = `
                <span class="font-bold text-toss-blue bg-blue-100 px-2 py-1 rounded-md text-[12px] tracking-tight shrink-0">${hintLabel}</span>
                <span class="text-toss-textMain font-semibold">${hintText}</span>
            `;

            DOM.game.hintArea.appendChild(hintEl);
        }

        function handleSkip() {
            if (AppState.isAnswering) return;
            const correctName = AppState.gameQueue[AppState.currentIdx].name;

            let targetEl = document.createElement('div');
            if (AppState.settings.mode === 'typing') {
                const actualInput = DOM.game.inputArea.querySelector('input');
                if (actualInput) targetEl = actualInput;
            }

            handleAnswer(false, targetEl, correctName);
        }

        function handleEndGame() {
            if (AppState.isAnswering) return;
            stopTimer();
            showResult();
        }

        function switchView(viewName) {
            Object.values(DOM.views).forEach(view => {
                view.classList.remove('view-active');
                view.classList.add('view-hidden');
            });
            DOM.views[viewName].classList.remove('view-hidden');
            DOM.views[viewName].classList.add('view-active');
        }

        function handleFileSelect(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;

            let duplicateCount = 0;
            let addedCount = 0;

            Array.from(files).forEach(file => {
                const rawName = file.name.replace(/\.[^/.]+$/, "").trim();
                if (AppState.coaches.some(c => c.name === rawName)) {
                    duplicateCount++;
                    return;
                }

                const reader = new FileReader();
                reader.onload = (event) => {
                    const newCoach = {
                        id: Date.now().toString() + Math.random().toString(36).substr(2, 9),
                        image: event.target.result,
                        name: rawName
                    };
                    AppState.coaches.push(newCoach);
                    addedCount++;

                    renderCoachList();
                    updateStartButtonState();
                };
                reader.readAsDataURL(file);
            });

            e.target.value = '';

            setTimeout(() => {
                if (duplicateCount > 0 && addedCount > 0) {
                    showToast(`${addedCount}명 추가 (중복 ${duplicateCount}명 제외)`, 'warning');
                } else if (duplicateCount > 0 && addedCount === 0) {
                    showToast(`이미 모두 등록되어 있습니다.`, 'error');
                } else if (addedCount > 0) {
                    showToast(`${addedCount}명의 코치를 추가했어요.`, 'success');
                }
            }, 100);
        }

        function getValidAnswers(fullName) {
            const baseName = fullName.toLowerCase().replace(/\s+/g, '');
            const answers = [baseName];
            const match = fullName.match(/^([^(]+)(?:\(([^)]+)\))?/);
            if (match) {
                if (match[1]) answers.push(match[1].toLowerCase().replace(/\s+/g, ''));
                if (match[2]) answers.push(match[2].toLowerCase().replace(/\s+/g, ''));
            }
            return answers;
        }

        // 토스 스타일 리스트 렌더링 (경계선을 없애고 면으로 구분)
        function renderCoachList() {
            DOM.setup.coachCount.textContent = AppState.coaches.length;
            const container = DOM.setup.uploadContainer;

            if (AppState.coaches.length === 0) {
                // 토스의 엠프티 스테이트 (Empty State) 스타일
                container.innerHTML = `
                    <label for="coach-image" class="w-full h-full min-h-[140px] flex flex-col items-center justify-center cursor-pointer group">
                        <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center mb-3 shadow-sm group-hover:scale-105 transition-transform">
                            <i data-lucide="image-plus" class="w-6 h-6 text-toss-blue"></i>
                        </div>
                        <span class="text-[15px] text-toss-textMain font-bold">코치 사진 업로드</span>
                        <p class="text-[13px] text-toss-textSub mt-1 text-center px-2">파일 이름이 '한국어(영어).jpg' 형식이면<br>이름이 자동으로 입력돼요.</p>
                    </label>
                `;
            } else {
                let html = `<div class="flex flex-wrap gap-4" id="coach-list">`;

                AppState.coaches.forEach(coach => {
                    html += `
                        <div class="flex-shrink-0 flex flex-col items-center gap-2 relative group w-16 md:w-[72px]">
                            <div class="w-16 h-16 md:w-[72px] md:h-[72px] rounded-2xl overflow-hidden relative shadow-sm">
                                <img src="${coach.image}" alt="${coach.name}" class="w-full h-full object-cover bg-white">
                                <button onclick="removeCoach('${coach.id}')" class="absolute inset-0 bg-black/60 text-white flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity" title="삭제">
                                    <i data-lucide="trash-2" class="w-6 h-6"></i>
                                </button>
                            </div>
                            <span class="text-[12px] font-bold text-toss-textMain truncate w-full text-center">${coach.name}</span>
                        </div>
                    `;
                });

                html += `
                        <label for="coach-image" class="flex-shrink-0 flex flex-col items-center justify-start gap-2 relative w-16 md:w-[72px] cursor-pointer group">
                            <div class="w-16 h-16 md:w-[72px] md:h-[72px] rounded-2xl flex items-center justify-center bg-white group-hover:bg-blue-50 transition-colors shadow-sm">
                                <i data-lucide="plus" class="w-7 h-7 text-toss-textSub group-hover:text-toss-blue transition-colors"></i>
                            </div>
                            <span class="text-[12px] font-bold text-toss-textSub group-hover:text-toss-blue transition-colors">추가하기</span>
                        </label>
                    </div>
                `;
                container.innerHTML = html;
            }
            lucide.createIcons();
        }

        window.removeCoach = function (id) {
            AppState.coaches = AppState.coaches.filter(c => c.id !== id);
            renderCoachList();
            updateStartButtonState();
        }

        function updateStartButtonState() {
            const count = AppState.coaches.length;
            const mode = Array.from(DOM.setup.modeRadios).find(r => r.checked).value;

            if (mode === 'choice' && count >= 2 && count < 4) {
                DOM.setup.minReqWarning.textContent = "보기가 " + count + "개로 제한돼요. (권장: 4명 이상)";
                DOM.setup.minReqWarning.classList.remove('hidden');
                DOM.setup.minReqWarning.classList.replace('text-toss-red', 'text-yellow-500');
            } else if (mode === 'choice' && count < 2) {
                DOM.setup.minReqWarning.textContent = "객관식은 최소 2명이 필요해요.";
                DOM.setup.minReqWarning.classList.remove('hidden');
                DOM.setup.minReqWarning.classList.replace('text-yellow-500', 'text-toss-red');
            } else {
                DOM.setup.minReqWarning.classList.add('hidden');
            }

            const minRequired = mode === 'choice' ? 2 : 1;
            DOM.setup.startBtn.disabled = count < minRequired;
        }

        function loadMockData() {
            const mockNames = [
                "포비(Pobi)", "제이슨(Jason)", "네오(Neo)", "워니(Woni)",
                "브라운(Brown)", "준(Jun)", "구구(Gugu)", "왼손(Left)",
                "제임스(James)", "레아(Lea)"
            ];
            const colors = ["3182F6", "04C065", "F04452", "F9A825", "2A2F34", "8B95A1"];

            AppState.coaches = [];

            mockNames.forEach((name, i) => {
                const bgColor = colors[i % colors.length];
                const initials = name.substring(0, 2);
                const imageUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(initials)}&background=${bgColor}&color=fff&size=256&font-size=0.4&bold=true`;

                AppState.coaches.push({
                    id: `mock_${i}`,
                    image: imageUrl,
                    name: name
                });
            });

            renderCoachList();
            updateStartButtonState();
            showToast('테스트용 데이터가 채워졌어요.');
        }

        function startGame() {
            AppState.settings.timeLimit = parseInt(Array.from(DOM.setup.timeRadios).find(r => r.checked).value);
            AppState.settings.mode = Array.from(DOM.setup.modeRadios).find(r => r.checked).value;

            AppState.gameQueue = [...AppState.coaches].sort(() => Math.random() - 0.5);
            AppState.currentIdx = 0;
            AppState.score = 0;
            AppState.isAnswering = false;

            DOM.game.totalNum.textContent = AppState.gameQueue.length;

            switchView('game');
            renderQuestion();
        }

        function renderQuestion() {
            AppState.isAnswering = false;
            AppState.hintLevel = 0;
            DOM.game.hintArea.innerHTML = '';

            const currentCoach = AppState.gameQueue[AppState.currentIdx];

            DOM.game.currentNum.textContent = AppState.currentIdx + 1;
            DOM.game.image.src = currentCoach.image;
            DOM.game.feedbackOverlay.style.opacity = '0';
            DOM.game.inputArea.innerHTML = '';

            if (AppState.settings.mode === 'choice') {
                renderMultipleChoice(currentCoach);
            } else {
                renderTypingInput(currentCoach);
            }

            startTimer();
        }

        function renderMultipleChoice(correctCoach) {
            const container = document.createElement('div');
            container.className = 'grid grid-cols-2 gap-3';

            const wrongCoaches = AppState.coaches.filter(c => c.id !== correctCoach.id)
                .sort(() => Math.random() - 0.5);

            const optionsCount = Math.min(3, wrongCoaches.length);
            const options = wrongCoaches.slice(0, optionsCount).map(c => c.name);

            options.push(correctCoach.name);
            options.sort(() => Math.random() - 0.5);

            options.forEach(optionName => {
                const btn = document.createElement('button');
                // 토스 스타일 객관식 버튼: 볼드하고 큼직하게
                btn.className = 'choice-btn w-full h-[60px] rounded-2xl font-bold text-[16px] text-toss-textMain';
                btn.textContent = optionName;
                btn.onclick = () => handleAnswer(optionName === correctCoach.name, btn, correctCoach.name);
                container.appendChild(btn);
            });

            DOM.game.inputArea.appendChild(container);
        }

        function renderTypingInput(correctCoach) {
            const form = document.createElement('form');
            form.className = 'flex flex-col gap-3';

            const input = document.createElement('input');
            input.type = 'text';
            // 토스 스타일 폼: 둥글고 회색 배경
            input.className = 'toss-input w-full h-[60px] px-5 rounded-2xl text-center text-[18px] font-bold text-toss-textMain placeholder-toss-textSub';
            input.placeholder = '이름을 입력하세요';
            input.autocomplete = 'off';

            const submitBtn = document.createElement('button');
            submitBtn.type = 'submit';
            submitBtn.className = 'btn-toss-primary w-full h-[60px] rounded-2xl font-bold text-[17px]';
            submitBtn.textContent = '정답 확인';

            form.appendChild(input);
            form.appendChild(submitBtn);

            form.onsubmit = (e) => {
                e.preventDefault();
                const userAnswer = input.value.trim().toLowerCase().replace(/\s+/g, '');
                const validAnswers = getValidAnswers(correctCoach.name);
                const isCorrect = validAnswers.includes(userAnswer);

                handleAnswer(isCorrect, input, correctCoach.name);
            };

            DOM.game.inputArea.appendChild(form);
            setTimeout(() => input.focus(), 100);
        }

        function handleAnswer(isCorrect, targetElement, correctName) {
            if (AppState.isAnswering) return;
            AppState.isAnswering = true;

            stopTimer();

            if (isCorrect) AppState.score++;

            const isChoice = AppState.settings.mode === 'choice';

            DOM.game.feedbackIcon.setAttribute('data-lucide', isCorrect ? 'check-circle-2' : 'x-circle');
            DOM.game.feedbackIcon.className = `w-20 h-20 ${isCorrect ? 'text-toss-green' : 'text-toss-red'}`;
            lucide.createIcons();
            DOM.game.feedbackOverlay.style.opacity = '1';

            if (isChoice) {
                const buttons = DOM.game.inputArea.querySelectorAll('button');
                buttons.forEach(btn => {
                    btn.disabled = true;
                    if (btn.textContent === correctName) {
                        btn.classList.add('correct-answer');
                    } else if (btn === targetElement && !isCorrect) {
                        btn.classList.add('wrong-answer');
                    }
                });
            } else {
                targetElement.disabled = true;
                const submitBtn = DOM.game.inputArea.querySelector('button');
                submitBtn.disabled = true;

                if (isCorrect) {
                    targetElement.classList.add('correct-answer');
                } else {
                    targetElement.classList.add('wrong-answer');
                    // 오답일 경우 토스 스타일로 텍스트 컬러 지정
                    targetElement.classList.replace('text-toss-textMain', 'text-white');
                    targetElement.value = correctName;
                }
            }

            setTimeout(() => {
                AppState.currentIdx++;
                if (AppState.currentIdx < AppState.gameQueue.length) {
                    renderQuestion();
                } else {
                    showResult();
                }
            }, 1200); // 토스는 피드백 후 전환이 약간 더 빠른 편입니다.
        }

        function startTimer() {
            stopTimer();

            const limit = AppState.settings.timeLimit;
            AppState.timer.timeLeft = limit;

            DOM.game.timerText.textContent = limit;

            DOM.game.timerFill.style.transition = 'none';
            DOM.game.timerFill.style.width = '100%';
            DOM.game.timerFill.className = 'timer-fill';

            void DOM.game.timerFill.offsetWidth;
            DOM.game.timerFill.style.transition = 'width 1s linear, background-color 0.3s ease';

            AppState.timer.intervalId = setInterval(() => {
                AppState.timer.timeLeft--;
                const left = AppState.timer.timeLeft;
                const percentage = (left / limit) * 100;

                DOM.game.timerText.textContent = left;
                DOM.game.timerFill.style.width = `${percentage}%`;

                if (percentage <= 25) {
                    DOM.game.timerFill.className = 'timer-fill timer-danger';
                } else if (percentage <= 50) {
                    DOM.game.timerFill.className = 'timer-fill timer-warning';
                }

                const currentCoach = AppState.gameQueue[AppState.currentIdx];
                if (percentage <= 75 && AppState.hintLevel < 1) { showHint(1, currentCoach.name); }
                if (percentage <= 50 && AppState.hintLevel < 2) { showHint(2, currentCoach.name); }
                if (percentage <= 25 && AppState.hintLevel < 3) { showHint(3, currentCoach.name); }

                if (left <= 0) {
                    stopTimer();
                    const correctName = currentCoach.name;
                    let targetEl = document.createElement('div');
                    if (AppState.settings.mode === 'typing') {
                        const actualInput = DOM.game.inputArea.querySelector('input');
                        if (actualInput) targetEl = actualInput;
                    }
                    handleAnswer(false, targetEl, correctName);
                }
            }, 1000);
        }

        function stopTimer() {
            if (AppState.timer.intervalId) {
                clearInterval(AppState.timer.intervalId);
                AppState.timer.intervalId = null;
            }
        }

        function showResult() {
            stopTimer();
            switchView('result');

            const total = AppState.gameQueue.length;
            const score = AppState.score;
            const percentage = (score / total) * 100;

            DOM.result.score.textContent = score;
            DOM.result.total.textContent = total;

            let msg = "";
            let msgColor = "";
            if (percentage === 100) {
                msg = "완벽해요! 코치님들을 모두 외우셨네요 🎉";
                msgColor = "text-toss-blue";
            } else if (percentage >= 70) {
                msg = "훌륭해요! 거의 다 외우셨어요 👍";
                msgColor = "text-toss-green";
            } else {
                msg = "조금 더 연습해볼까요? 할 수 있어요 💪";
                msgColor = "text-yellow-600";
            }

            DOM.result.message.textContent = msg;
            DOM.result.message.className = `mt-4 text-[16px] font-bold ${msgColor}`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            initEvents();
            renderCoachList();
        });

    </script>
</body>

</html>
