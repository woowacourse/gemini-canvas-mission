<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주전뽑기: 스페인 격파 프로젝트</title>

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons (CDN) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* 커스텀 스크롤바 스타일 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(30, 41, 59, 0.5);
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(71, 85, 105, 0.8);
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(100, 116, 139, 1);
        }
    </style>
</head>
<body class="min-h-screen bg-slate-900 text-slate-100 font-sans p-4 md:p-8">

<!-- 헤더 -->
<header class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
    <div>
        <h1 class="text-2xl md:text-3xl font-extrabold text-white flex items-center gap-2">
            <i data-lucide="trophy" class="text-yellow-400 w-8 h-8"></i> 주전뽑기: 스페인 격파 프로젝트
        </h1>
        <p class="text-slate-400 text-sm mt-1">주어진 예산으로 최고의 효율을 내는 스쿼드를 구성하세요!</p>
    </div>

    <div class="flex gap-4">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-3 flex flex-col items-center min-w-[120px]">
            <span class="text-xs text-slate-400 mb-1 flex items-center gap-1"><i data-lucide="coins"
                                                                                 class="w-3 h-3"></i> 남은 예산</span>
            <span id="budget-display" class="text-xl font-bold text-yellow-400">240억</span>
        </div>
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-3 flex flex-col items-center min-w-[120px]">
            <span class="text-xs text-slate-400 mb-1 flex items-center gap-1"><i data-lucide="activity"
                                                                                 class="w-3 h-3"></i> 팀 능력치</span>
            <span id="power-display" class="text-xl font-bold text-blue-400">0</span>
        </div>
    </div>
</header>

<!-- 시너지 표시 영역 (새로 추가) -->
<div id="synergy-container" class="max-w-5xl mx-auto mb-6 flex flex-wrap gap-2 hidden">
    <!-- JS로 렌더링됨 -->
</div>

<main class="max-w-5xl mx-auto flex flex-col lg:flex-row gap-6 h-full">
    <!-- 왼쪽: 그라운드 뷰 -->
    <section class="flex-1 flex flex-col">
        <!-- 포메이션 및 도감 버튼 헤더 -->
        <div class="flex justify-between items-center mb-3">
            <div class="flex items-center gap-2">
                <span class="text-sm font-bold text-slate-300">포메이션</span>
                <select id="formation-select" onchange="changeFormation(this.value)"
                        class="bg-slate-700 text-white text-sm font-bold rounded-lg p-1.5 outline-none border border-slate-600 focus:border-yellow-400 cursor-pointer">
                    <option value="4-3-3">4-3-3</option>
                    <option value="4-4-2">4-4-2</option>
                    <option value="3-4-3">3-4-3</option>
                    <option value="4-2-3-1">4-2-3-1</option>
                    <option value="3-5-2">3-5-2</option>
                </select>
            </div>
            <button onclick="openSynergyModal()"
                    class="text-sm bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-xl font-bold flex items-center gap-2 transition shadow-lg">
                <i data-lucide="book-open" class="w-4 h-4"></i> 시너지 도감
            </button>
        </div>

        <div class="bg-green-600 rounded-2xl p-4 md:p-6 shadow-2xl relative border-4 border-white/20 h-[650px] md:h-[700px] flex flex-col justify-between overflow-hidden">
            <!-- 필드 라인 그래픽 -->
            <div class="absolute inset-x-0 top-1/2 h-0.5 bg-white/30 transform -translate-y-1/2"></div>
            <div class="absolute top-1/2 left-1/2 w-24 h-24 border-2 border-white/30 rounded-full transform -translate-x-1/2 -translate-y-1/2"></div>
            <div class="absolute top-0 left-1/2 w-48 h-24 border-2 border-t-0 border-white/30 transform -translate-x-1/2"></div>
            <div class="absolute bottom-0 left-1/2 w-48 h-24 border-2 border-b-0 border-white/30 transform -translate-x-1/2"></div>

            <!-- 선수 슬롯 -->
            <div id="pitch-container" class="relative z-10 flex flex-col h-full justify-between py-2">
                <!-- 포지션별 슬롯이 JS로 렌더링됩니다 -->
            </div>
        </div>

        <!-- 하단 액션 버튼 -->
        <div class="mt-6 flex gap-4">
            <button id="btn-ai" onclick="askAICoach()" disabled
                    class="flex-1 py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2 transition bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700">
                <i data-lucide="brain" class="w-5 h-5"></i> AI 코치 피드백
            </button>
            <button id="btn-match" onclick="playMatch()" disabled
                    class="flex-1 py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2 transition bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700">
                <i data-lucide="swords" class="w-5 h-5"></i> 스페인전 시작
            </button>
        </div>
        <p id="squad-warning" class="text-center text-sm text-slate-500 mt-2">11명의 선발 라인업을 모두 채워야 경기를 시작할 수 있습니다.</p>
    </section>

    <!-- 오른쪽: 선수 목록 (상점 역할) -->
    <section
            class="w-full lg:w-[400px] flex flex-col bg-slate-800/50 rounded-2xl border border-slate-700 overflow-hidden h-[650px] md:h-[700px] lg:h-auto">
        <!-- 포지션 탭 -->
        <div id="tabs-container" class="flex border-b border-slate-700 bg-slate-800">
            <!-- 탭이 JS로 렌더링됩니다 -->
        </div>

        <!-- 리스트 스크롤 영역 -->
        <div id="player-list" class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar">
            <!-- 선수 목록이 JS로 렌더링됩니다 -->
        </div>
    </section>
</main>

<!-- 토스트 컨테이너 -->
<div id="toast-container"></div>

<!-- 결과 모달 -->
<div id="match-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 px-4">
    <div class="bg-slate-800 border-2 border-slate-700 p-8 rounded-3xl max-w-md w-full text-center relative overflow-hidden">
        <!-- 로딩 뷰 -->
        <div id="match-loading" class="py-10">
            <div class="animate-spin w-16 h-16 border-4 border-indigo-500 border-t-transparent rounded-full mx-auto mb-6"></div>
            <h2 class="text-2xl font-bold text-white mb-2">경기 진행 중...</h2>
            <p class="text-slate-400">무적함대 스페인과 치열한 승부를 펼치고 있습니다!</p>
        </div>
        <!-- 결과 뷰 -->
        <div id="match-result" class="py-6 hidden">
            <h2 id="match-status-text" class="text-4xl font-extrabold mb-2">결과</h2>
            <div class="flex justify-center items-center gap-6 my-8">
                <div class="text-center">
                    <p class="text-sm text-slate-400 mb-1">나의 팀</p>
                    <p id="match-final-power" class="text-3xl font-bold text-white">0</p>
                    <p id="match-base-power" class="text-xs text-indigo-400 mt-1"></p>
                </div>
                <div class="text-2xl font-black text-slate-600">VS</div>
                <div class="text-center">
                    <p class="text-sm text-slate-400 mb-1">스페인</p>
                    <p id="match-spain-power" class="text-3xl font-bold text-white">970</p>
                    <p class="text-xs text-slate-500 mt-1">고정 스탯</p>
                </div>
            </div>
            <button onclick="closeMatchModal()"
                    class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl transition">
                확인
            </button>
        </div>
    </div>
</div>

<!-- AI 코치 모달 -->
<div id="ai-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 px-4">
    <div class="bg-slate-800 border-2 border-indigo-500/50 p-8 rounded-3xl max-w-lg w-full relative">
        <div class="flex items-center gap-3 mb-6 border-b border-slate-700 pb-4">
            <div class="bg-indigo-500/20 p-3 rounded-full text-indigo-400">
                <i data-lucide="brain" class="w-7 h-7"></i>
            </div>
            <div>
                <h2 class="text-xl font-bold text-white">AI 수석 코치의 리포트</h2>
                <p class="text-sm text-slate-400">Gemini가 분석한 전술 리포트입니다.</p>
            </div>
        </div>

        <div class="min-h-[100px] flex items-center justify-center">
            <!-- 로딩 뷰 -->
            <div id="ai-loading" class="flex flex-col items-center gap-3">
                <div class="animate-pulse flex gap-2">
                    <div class="w-2 h-2 bg-indigo-500 rounded-full"></div>
                    <div class="w-2 h-2 bg-indigo-500 rounded-full delay-75"></div>
                    <div class="w-2 h-2 bg-indigo-500 rounded-full delay-150"></div>
                </div>
                <p class="text-sm text-slate-400">코치진이 스쿼드를 열심히 분석 중입니다...</p>
            </div>
            <!-- 결과 뷰 -->
            <p id="ai-feedback"
               class="text-lg leading-relaxed text-indigo-100 font-medium whitespace-pre-line hidden"></p>
        </div>

        <button id="ai-close-btn" onclick="closeAiModal()"
                class="hidden w-full mt-8 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition">
            라커룸으로 돌아가기
        </button>
    </div>
</div>

<!-- 시너지 도감 모달 -->
<div id="synergy-dict-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 px-4">
    <div class="bg-slate-800 border-2 border-slate-700 p-6 rounded-3xl max-w-sm w-full relative">
        <button onclick="closeSynergyModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white transition">
            <i data-lucide="x" class="w-6 h-6"></i>
        </button>
        <h2 class="text-xl font-bold text-white mb-4 flex items-center gap-2">
            <i data-lucide="book-open" class="text-indigo-400 w-6 h-6"></i> 시너지 도감
        </h2>
        <div id="synergy-dict-content" class="max-h-[60vh] overflow-y-auto custom-scrollbar pr-2">
            <!-- 시너지 목록이 JS로 렌더링됩니다 -->
        </div>
    </div>
</div>

<!-- JavaScript 로직 -->

        {id: 2, name: '황희찬', pos: 'FWD', cost: 30, power: 85, trait: '황소 같은 돌파'},

        {id: 4, name: '이승우', pos: 'FWD', cost: 15, power: 79, trait: '센스쟁이 조커'},
        {id: 5, name: '오현규', pos: 'FWD', cost: 15, power: 79, trait: '파워풀 타겟맨'},
        {id: 6, name: '엄원상', pos: 'FWD', cost: 10, power: 78, trait: '미친 스피드'},
        {id: 7, name: '이강인', pos: 'MID', cost: 45, power: 88, trait: '마법의 왼발'},

        {id: 12, name: '백승호', pos: 'MID', cost: 15, power: 79, trait: '강력한 중거리'},
        {id: 13, name: '정우영', pos: 'MID', cost: 15, power: 79, trait: '왕성한 활동량'},
        {id: 14, name: '김민재', pos: 'DEF', cost: 45, power: 90, trait: '통곡의 벽'},
        {id: 15, name: '설영우', pos: 'DEF', cost: 15, power: 79, trait: '스마트한 풀백'},
        {id: 16, name: '김진수', pos: 'DEF', cost: 15, power: 78, trait: '베테랑의 품격'},
        {id: 17, name: '김영권', pos: 'DEF', cost: 15, power: 78, trait: '기적의 사나이'},
        {id: 18, name: '정승현', pos: 'DEF', cost: 10, power: 76, trait: '안정적인 수비'},
        {id: 19, name: '이기제', pos: 'DEF', cost: 10, power: 76, trait: '날카로운 킥'},
        {id: 20, name: '조유민', pos: 'DEF', cost: 10, power: 76, trait: '파이터형 수비'},
        {id: 21, name: '조현우', pos: 'GK', cost: 20, power: 83, trait: '빛현우'},
        {id: 22, name: '김승규', pos: 'GK', cost: 15, power: 80, trait: '빌드업 마스터'},
        {id: 23, name: '송범근', pos: 'GK', cost: 10, power: 77, trait: '차세대 수문장'},
    ];

    // 시너지 사전 정의
    const SYNERGIES = [
        {id: 'S1', name: '황금 뚝배기', players: [7, 3], bonus: 15, desc: '이강인 크로스 + 조규성 헤더'},
        {id: 'S2', name: '월클 듀오', players: [1, 14], bonus: 10, desc: '손흥민 + 김민재 든든함'},
        {id: 'S3', name: '좌우 쌍포', players: [1, 7], bonus: 10, desc: '손흥민 + 이강인 파괴력'},
        {id: 'S4', name: '미친 텐션', players: [2, 4], bonus: 8, desc: '황희찬 + 이승우 활력'},
        {id: 'S5', name: '통곡의 1차선', players: [14, 21], bonus: 8, desc: '김민재 + 조현우 철벽 방어'},
        {id: 'S6', name: '마당쇠 듀오', players: [8, 9], bonus: 8, desc: '황인범 + 이재성 활동량'},

        // --- 소외된 선수 구제: 신규 시너지 대거 추가 ---
        {id: 'S7', name: '에너자이저', players: [10, 13], bonus: 8, desc: '홍현석 + 정우영 무한 체력'},
        {id: 'S8', name: '우측면 지배자', players: [6, 15], bonus: 8, desc: '엄원상 + 설영우 스피드'},
        {id: 'S9', name: '푸른피 케미', players: [5, 19], bonus: 8, desc: '오현규 + 이기제 (수원 삼성 케미)'},
        {id: 'S10', name: '녹색 심장', players: [12, 16], bonus: 8, desc: '백승호 + 김진수 (전북 현대 케미)'},
        {id: 'S11', name: '호랑이 철벽', players: [11, 18], bonus: 8, desc: '박용우 + 정승현 (울산 라인)'},
        {id: 'S12', name: '빌드업 마스터', players: [17, 22], bonus: 8, desc: '김영권 + 김승규 후방 전개'},
        {id: 'S13', name: '차세대 방패', players: [20, 23], bonus: 8, desc: '조유민 + 송범근 투지 방어'},

        // --- 다인원(3명) 강력 트리오 시너지 추가 ---
        {id: 'S14', name: '96 황금세대', players: [2, 8, 14], bonus: 18, desc: '황희찬+황인범+김민재 동갑내기 케미'},
        {id: 'S15', name: '유럽파 공격진', players: [1, 2, 7], bonus: 18, desc: '손흥민+황희찬+이강인 막강 삼각편대'},
        {id: 'S16', name: '울산의 방패', players: [17, 18, 21], bonus: 15, desc: '김영권+정승현+조현우 (울산 철벽)'},
        {id: 'S17', name: '스피드 레이서', players: [1, 2, 6], bonus: 15, desc: '손흥민+황희찬+엄원상 미친 속도'},
        {id: 'S18', name: '전북의 혼', players: [3, 12, 16], bonus: 15, desc: '조규성+백승호+김진수 (전북 왕조 케미)'},
        {id: 'S19', name: '언성 히어로즈', players: [9, 11, 13], bonus: 15, desc: '이재성+박용우+정우영 헌신적인 활동량'},
        {id: 'S20', name: '젊은 피', players: [7, 10, 15], bonus: 15, desc: '이강인+홍현석+설영우 차세대 에이스'}
    ];

    const MAX_BUDGET = 240;
    const SPAIN_POWER = 970;

    // 포메이션별 포지션 제한 설정
    const FORMATIONS = {
        '4-3-3': {FWD: 3, MID: 3, DEF: 4, GK: 1},
        '4-4-2': {FWD: 2, MID: 4, DEF: 4, GK: 1},
        '3-4-3': {FWD: 3, MID: 4, DEF: 3, GK: 1},
        '4-2-3-1': {FWD: 1, MID: 5, DEF: 4, GK: 1}, // 2선 3명, 3선 2명을 모두 MID(5)로 간주
        '3-5-2': {FWD: 2, MID: 5, DEF: 3, GK: 1}
    };
    let currentFormation = '4-3-3';
    const POSITIONS = ['FWD', 'MID', 'DEF', 'GK'];

    // 무적함대 스페인 스쿼드 (총 능력치 970에 맞춤 - 완전 각성)
    const SPAIN_SQUAD = {
        GK: [{name: '시몬', power: 87}],
        DEF: [{name: '쿠쿠렐라', power: 86}, {name: '라포르트', power: 88}, {name: '르노르망', power: 85}, {
            name: '카르바할',
            power: 89
        }],
        MID: [{name: '파비안', power: 87}, {name: '로드리', power: 94}, {name: '페드리', power: 90}],
        FWD: [{name: '윌리엄스', power: 87}, {name: '모라타', power: 86}, {name: '야말', power: 91}]
    };

    // 오늘 컨디션 랜덤 부여 (앱 로드 시 1회)
    PLAYERS.forEach(p => {
        const conditionVal = Math.floor(Math.random() * 7) - 3; // -3 ~ +3 사이 변동
        p.basePower = p.power; // 원래 능력치 백업
        p.power = p.basePower + conditionVal; // 컨디션이 반영된 최종 능력치
        p.condition = conditionVal > 1 ? 'UP' : conditionVal < -1 ? 'DOWN' : 'NORMAL';
    });

    // --- [상태 관리] ---
    let selectedPlayers = [];
    let activeTab = 'FWD';
    let activeSynergies = [];
    let synergyBonus = 0;

    // --- [렌더링 함수] ---
    function renderAll() {
        // 시너지 계산
        activeSynergies = [];
        synergyBonus = 0;
        const selectedIds = selectedPlayers.map(p => p.id);
        SYNERGIES.forEach(syn => {
            // 요구 선수가 모두 선발 라인업에 있는지 확인
            if (syn.players.every(id => selectedIds.includes(id))) {
                activeSynergies.push(syn);
                synergyBonus += syn.bonus;
            }
        });

        const currentBudget = MAX_BUDGET - selectedPlayers.reduce((sum, p) => sum + p.cost, 0);
        const totalPower = selectedPlayers.reduce((sum, p) => sum + p.power, 0) + synergyBonus;
        const isSquadFull = selectedPlayers.length === 11;

        // 상단 스탯 업데이트
        const budgetEl = document.getElementById('budget-display');
        budgetEl.innerText = `${currentBudget}억`;
        budgetEl.className = `text-xl font-bold ${currentBudget < 20 ? 'text-red-400' : 'text-yellow-400'}`;
        document.getElementById('power-display').innerHTML = `${totalPower} <span class="text-xs text-green-400 ml-1 font-normal">${synergyBonus > 0 ? '+' + synergyBonus + '(시너지)' : ''}</span>`;

        // 시너지 UI 렌더링
        const synergyContainer = document.getElementById('synergy-container');
        if (activeSynergies.length > 0) {
            synergyContainer.classList.remove('hidden');
            synergyContainer.innerHTML = activeSynergies.map(syn => `
          <div class="bg-indigo-900/50 border border-indigo-500 text-indigo-200 px-3 py-1.5 rounded-full text-sm font-bold flex items-center gap-2 shadow-lg animate-pulse">
            ✨ ${syn.name} <span class="bg-indigo-500 text-white text-[10px] px-1.5 py-0.5 rounded">+${syn.bonus}</span>
          </div>
        `).join('');
        } else {
            synergyContainer.classList.add('hidden');
            synergyContainer.innerHTML = '';
        }

        // 버튼 상태 업데이트
        const btnAi = document.getElementById('btn-ai');
        const btnMatch = document.getElementById('btn-match');
        const warning = document.getElementById('squad-warning');

        if (isSquadFull) {
            btnAi.disabled = false;
            btnAi.className = 'flex-1 py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2 transition bg-indigo-600 hover:bg-indigo-500 text-white shadow-[0_4px_14px_0_rgba(79,70,229,0.39)]';
            btnMatch.disabled = false;
            btnMatch.className = 'flex-1 py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2 transition bg-red-600 hover:bg-red-500 text-white shadow-[0_4px_14px_0_rgba(220,38,38,0.39)]';
            warning.style.display = 'none';
        } else {
            btnAi.disabled = true;
            btnAi.className = 'flex-1 py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2 transition bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700';
            btnMatch.disabled = true;
            btnMatch.className = 'flex-1 py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2 transition bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700';
            warning.style.display = 'block';
        }

        // 포지션 탭 렌더링
        const tabsHtml = POSITIONS.map(pos => `
        <button onclick="setActiveTab('${pos}')" class="flex-1 py-3 text-sm font-bold border-b-2 transition ${activeTab === pos ? 'border-yellow-400 text-yellow-400' : 'border-transparent text-slate-400 hover:bg-slate-700/50'}">
          ${pos}
        </button>
      `).join('');
        document.getElementById('tabs-container').innerHTML = tabsHtml;

        // 그라운드 슬롯 렌더링
        let pitchHtml = '';

        // 1. 스페인 진영 렌더링 (위쪽, 빨간색 톤)
        const SPAIN_POSITIONS = ['GK', 'DEF', 'MID', 'FWD'];
        SPAIN_POSITIONS.forEach(pos => {
            let slotsHtml = '';
            SPAIN_SQUAD[pos].forEach(player => {
                slotsHtml += `
            <div class="relative flex flex-col items-center justify-center w-11 h-12 md:w-14 md:h-16 bg-red-100 border-2 border-red-400 rounded-lg shadow-md opacity-90 z-10 cursor-default">
              <span class="text-[9px] md:text-xs font-bold text-red-900">${player.name}</span>
              <span class="text-[8px] md:text-[10px] text-red-600 font-bold mt-0.5">⚡${player.power}</span>
            </div>
          `;
            });
            pitchHtml += `<div class="flex justify-center w-full gap-2 md:gap-4">${slotsHtml}</div>`;
        });

        // 2. 한국 진영 렌더링 (아래쪽, 흰색 톤)
        POSITIONS.forEach(pos => {
            const count = FORMATIONS[currentFormation][pos];
            const playersInPos = selectedPlayers.filter(p => p.pos === pos);
            let slotsHtml = '';

            for (let i = 0; i < count; i++) {
                const player = playersInPos[i];
                if (player) {
                    // 컨디션 아이콘 설정
                    const condIcon = player.condition === 'UP' ? '<i data-lucide="trending-up" class="w-3 h-3 text-red-500"></i>' :
                        player.condition === 'DOWN' ? '<i data-lucide="trending-down" class="w-3 h-3 text-blue-500"></i>' :
                            '<i data-lucide="minus" class="w-3 h-3 text-slate-400"></i>';

                    slotsHtml += `
              <div onclick="handleRemovePlayer(${player.id})" class="relative flex flex-col items-center justify-center w-11 h-12 md:w-14 md:h-16 bg-white border-2 border-slate-300 rounded-lg shadow-lg cursor-pointer transform hover:scale-105 transition z-10">
                <div class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-0.5 opacity-0 hover:opacity-100 transition z-20">
                  <i data-lucide="x" class="w-3 h-3"></i>
                </div>
                <div class="absolute -top-2 -left-2 bg-slate-800 rounded-full p-0.5 z-20 shadow-md">
                  ${condIcon}
                </div>
                <span class="text-[9px] md:text-xs font-bold text-slate-800">${player.name}</span>
                <span class="text-[8px] md:text-[10px] text-blue-600 font-bold mt-0.5">⚡${player.power}</span>
              </div>
            `;
                } else {
                    slotsHtml += `
              <div onclick="setActiveTab('${pos}')" class="flex items-center justify-center w-11 h-12 md:w-14 md:h-16 bg-green-800/60 border-2 border-dashed border-white/40 rounded-lg cursor-pointer hover:bg-green-700/60 transition shadow-inner z-10">
                <i data-lucide="user-plus" class="w-4 h-4 md:w-5 md:h-5 text-white/50"></i>
              </div>
            `;
                }
            }
            pitchHtml += `<div class="flex justify-center w-full gap-2 md:gap-4">${slotsHtml}</div>`;
        });
        document.getElementById('pitch-container').innerHTML = pitchHtml;

        // 상점 목록 렌더링
        const posCount = selectedPlayers.filter(p => p.pos === activeTab).length;
        const isPosFull = posCount >= FORMATIONS[currentFormation][activeTab];

        const shopHtml = PLAYERS.filter(p => p.pos === activeTab).map(player => {
            const isSelected = selectedPlayers.some(p => p.id === player.id);
            const isTooExpensive = !isSelected && currentBudget < player.cost;
            const isDisabled = (!isSelected && isPosFull) || isTooExpensive;

            // 컨디션 화살표 색상 및 기호
            const condColor = player.condition === 'UP' ? 'text-red-400' : player.condition === 'DOWN' ? 'text-blue-400' : 'text-slate-400';
            const condArrow = player.condition === 'UP' ? '↗' : player.condition === 'DOWN' ? '↘' : '➖';

            // 잠재적 시너지 계산 (이 선수를 뽑으면 완성되는 시너지가 있는지 확인)
            const selectedIds = selectedPlayers.map(p => p.id);
            const relatedSynergies = SYNERGIES.filter(syn => {
                if (!syn.players.includes(player.id)) return false; // 이 선수가 포함된 시너지가 아니면 패스
                const otherPlayers = syn.players.filter(id => id !== player.id);
                // 나머지 필요한 선수들이 이미 모두 선발 라인업에 있는지 확인
                return otherPlayers.every(id => selectedIds.includes(id)) && otherPlayers.length > 0;
            });

            let synergyBadgeHtml = '';
            if (relatedSynergies.length > 0) {
                const badgeText = relatedSynergies.map(s => `✨${s.name}`).join(' ');
                synergyBadgeHtml = `<span class="text-[10px] bg-indigo-500/20 text-indigo-300 px-1.5 py-0.5 rounded border border-indigo-500/50 animate-pulse">${badgeText}</span>`;
            }

            return `
          <div class="flex justify-between items-center p-3 rounded-xl border transition ${isSelected ? 'bg-green-900/30 border-green-500/50' : 'bg-slate-800 border-slate-700 hover:border-slate-500'}">
            <div>
              <div class="flex items-center gap-2 mb-1">
                <span class="font-extrabold text-white text-base">${player.name}</span>
                <span class="text-[10px] font-bold ${condColor}">${condArrow}</span>
                ${isSelected ? `<span class="text-[10px] bg-green-500/20 text-green-400 px-1.5 py-0.5 rounded">선발됨</span>` : ''}
                ${synergyBadgeHtml}
              </div>
              <span class="text-xs text-slate-400">${player.trait}</span>
            </div>

            <div class="flex items-center gap-4">
              <div class="text-right">
                <p class="text-sm font-bold text-yellow-400">${player.cost}억</p>
                <p class="text-xs font-bold text-blue-400">⚡${player.power}</p>
              </div>
              <button onclick="handleSelectPlayer(${player.id})" ${isDisabled ? 'disabled' : ''}
                class="w-10 h-10 rounded-lg flex items-center justify-center transition ${isSelected ? 'bg-red-500/20 text-red-400 hover:bg-red-500/40' : isDisabled ? 'bg-slate-700/50 text-slate-500 cursor-not-allowed' : 'bg-indigo-600 text-white hover:bg-indigo-500'}">
                <i data-lucide="${isSelected ? 'x' : 'check'}" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        `;
        }).join('');
        document.getElementById('player-list').innerHTML = shopHtml;

        // Lucide 아이콘 다시 그리기 (DOM이 교체되었으므로)
        lucide.createIcons();
    }

    // --- [인게임 액션] ---
    function setActiveTab(pos) {
        activeTab = pos;
        renderAll();
    }

    function handleSelectPlayer(playerId) {
        const player = PLAYERS.find(p => p.id === playerId);
        const isAlreadySelected = selectedPlayers.some(p => p.id === player.id);

        if (isAlreadySelected) {
            handleRemovePlayer(playerId);
            return;
        }

        const posCount = selectedPlayers.filter(p => p.pos === player.pos).length;
        if (posCount >= FORMATIONS[currentFormation][player.pos]) {
            showToast(`${player.pos} 포지션은 이미 꽉 찼습니다!`);
            return;
        }

        const currentBudget = MAX_BUDGET - selectedPlayers.reduce((sum, p) => sum + p.cost, 0);
        if (currentBudget < player.cost) {
            showToast(`예산이 부족합니다! (${player.cost}억 필요)`);
            return;
        }

        selectedPlayers.push(player);
        renderAll();
    }

    function handleRemovePlayer(playerId) {
        selectedPlayers = selectedPlayers.filter(p => p.id !== playerId);
        renderAll();
    }

    function showToast(msg) {
        const toast = document.createElement('div');
        toast.className = 'fixed top-10 left-1/2 transform -translate-x-1/2 bg-red-500 text-white px-6 py-3 rounded-full shadow-2xl font-bold z-50 animate-bounce';
        toast.innerText = msg;
        document.getElementById('toast-container').appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }

    // --- [스페인전 시뮬레이션] ---
    function playMatch() {
        const modal = document.getElementById('match-modal');
        const loading = document.getElementById('match-loading');
        const result = document.getElementById('match-result');

        modal.classList.remove('hidden');
        modal.classList.add('flex');
        loading.classList.remove('hidden');
        result.classList.add('hidden');

        const totalPower = selectedPlayers.reduce((sum, p) => sum + p.power, 0) + synergyBonus;

        setTimeout(() => {
            const randomFactor = Math.floor(Math.random() * 41) - 10; // -10 ~ +30 (기적의 카잔 패치: 운이 좋으면 +30까지 뻥튀기)
            const finalPower = totalPower + randomFactor;

            let status = '';
            if (finalPower > SPAIN_POWER) status = 'WIN';
            else if (finalPower === SPAIN_POWER) status = 'DRAW';
            else status = 'LOSE';

            const statusText = document.getElementById('match-status-text');
            statusText.innerText = status === 'WIN' ? '기적의 승리! 🏆' : status === 'DRAW' ? '치열한 무승부 🤝' : '아쉬운 패배 😢';
            statusText.className = `text-4xl font-extrabold mb-2 ${status === 'WIN' ? 'text-green-400' : status === 'DRAW' ? 'text-yellow-400' : 'text-red-400'}`;

            document.getElementById('match-final-power').innerText = finalPower;
            document.getElementById('match-base-power').innerHTML = `기본+시너지 ${totalPower} <br/> 승부운 ${randomFactor > 0 ? '+' + randomFactor : randomFactor}`;

            loading.classList.add('hidden');
            result.classList.remove('hidden');
        }, 2000);
    }

    function closeMatchModal() {
        document.getElementById('match-modal').classList.add('hidden');
        document.getElementById('match-modal').classList.remove('flex');
    }

    // --- [AI 코치 평가 (Gemini API)] ---
    async function askAICoach() {
        const modal = document.getElementById('ai-modal');
        const loading = document.getElementById('ai-loading');
        const feedback = document.getElementById('ai-feedback');
        const closeBtn = document.getElementById('ai-close-btn');

        modal.classList.remove('hidden');
        modal.classList.add('flex');
        loading.classList.remove('hidden');
        loading.classList.add('flex');
        feedback.classList.add('hidden');
        closeBtn.classList.add('hidden');

        const fwdNames = selectedPlayers.filter(p => p.pos === 'FWD').map(p => p.name).join(', ');
        const midNames = selectedPlayers.filter(p => p.pos === 'MID').map(p => p.name).join(', ');
        const defNames = selectedPlayers.filter(p => p.pos === 'DEF').map(p => p.name).join(', ');
        const gkName = selectedPlayers.filter(p => p.pos === 'GK').map(p => p.name).join(', ');
        const totalPower = selectedPlayers.reduce((sum, p) => sum + p.power, 0) + synergyBonus;
        const remainingBudget = MAX_BUDGET - selectedPlayers.reduce((sum, p) => sum + p.cost, 0);
        const synergyNames = activeSynergies.map(s => s.name).join(', ') || '없음';

        const prompt = `당신은 대한민국 축구 국가대표팀 수석 코치입니다.
감독이 피파랭킹 1위 스페인을 꺾기 위해 예산 240억 중 ${240 - remainingBudget}억을 활용해 다음 선발 라인업을 짰습니다.
- 공격수: ${fwdNames}
- 미드필더: ${midNames}
- 수비수: ${defNames}
- 골키퍼: ${gkName}
현재 발동된 선수간 시너지 효과: ${synergyNames}
시너지를 포함한 총 능력치는 ${totalPower} (스페인은 970)입니다.
감독의 전술적 선택(누구에게 돈을 많이 썼는지, 가성비, 발동된 시너지, 선수들의 컨디션 등)을 구체적으로 분석하고, 스페인전 승리 가능성을 '친근하고 재치있는 2~3문장'으로 짧게 평가해주세요.
주의: 매번 똑같은 말이 나오지 않도록, 때로는 호들갑스럽게 칭찬하고, 때로는 날카롭게 팩트폭력을 날리는 등 다양한 톤앤매너를 사용해주세요.`;

        const apiKey = ""; // Runtime 환경에서 제공됨

        function showFeedback(text) {
            loading.classList.add('hidden');
            loading.classList.remove('flex');
            feedback.innerText = text;
            feedback.classList.remove('hidden');
            closeBtn.classList.remove('hidden');
        }

        try {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const response = await fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    contents: [{parts: [{text: prompt}]}],
                    systemInstruction: {parts: [{text: "너는 재치있고 전술적인 축구 AI 코치야. 짧고 명확하게 한국어로 답변해."}]}
                })
            });
            const data = await response.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "코치진이 분석에 실패했습니다. 라인업을 다시 확인해주세요!";
            showFeedback(text);
        } catch (error) {
            showFeedback("통신 문제로 코치진과 연락이 닿지 않습니다. 다시 시도해주세요!");
        }
    }

    function closeAiModal() {
        document.getElementById('ai-modal').classList.add('hidden');
        document.getElementById('ai-modal').classList.remove('flex');
    }

    // --- [새로운 기능: 포메이션 변경 및 시너지 도감] ---
    function changeFormation(form) {
        currentFormation = form;
        const limits = FORMATIONS[currentFormation];

        // 바뀐 포메이션 제한을 초과하는 선수 자동 제외
        POSITIONS.forEach(pos => {
            const playersInPos = selectedPlayers.filter(p => p.pos === pos);
            if (playersInPos.length > limits[pos]) {
                const toRemove = playersInPos.slice(limits[pos]);
                toRemove.forEach(p => {
                    selectedPlayers = selectedPlayers.filter(sp => sp.id !== p.id);
                });
            }
        });
        renderAll();
        showToast(`${form} 포메이션으로 변경되었습니다.`);
    }

    function renderSynergyDict() {
        const dictHtml = SYNERGIES.map(syn => {
            const playerNames = syn.players.map(id => PLAYERS.find(p => p.id === id).name).join(' + ');
            return `
          <div class="bg-slate-700/50 p-4 rounded-xl border border-slate-600 mb-3 hover:border-indigo-400 transition">
            <div class="flex justify-between items-center mb-2">
              <span class="font-bold text-indigo-300 text-lg">${syn.name}</span>
              <span class="text-sm font-bold bg-indigo-500 text-white px-2 py-0.5 rounded-full">+${syn.bonus}</span>
            </div>
            <p class="text-sm text-slate-300 mb-1 font-medium"><span class="text-slate-400 text-xs">필요:</span> ${playerNames}</p>
            <p class="text-xs text-slate-400">${syn.desc}</p>
          </div>
        `;
        }).join('');
        document.getElementById('synergy-dict-content').innerHTML = dictHtml;
    }

    function openSynergyModal() {
        document.getElementById('synergy-dict-modal').classList.remove('hidden');
        document.getElementById('synergy-dict-modal').classList.add('flex');
    }

    function closeSynergyModal() {
        document.getElementById('synergy-dict-modal').classList.add('hidden');
        document.getElementById('synergy-dict-modal').classList.remove('flex');
    }

    // --- 초기 렌더링 ---
    renderSynergyDict();
    renderAll();
</script>
</body>
</html>
