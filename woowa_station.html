<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우아한 정거장</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f8fafc;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .woowa-bg { background-color: #2ac1bc; }
        .woowa-text { color: #2ac1bc; }
        .woowa-border { border-color: #2ac1bc; }

        /* Sidebar Navigation Styles */
        #mainNav {
            width: 240px;
            background-color: #1e293b;
            color: #f8fafc;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .nav-item {
            padding: 0.75rem 1.25rem;
            margin: 0.25rem 0.75rem;
            border-radius: 0.75rem;
            display: flex;
            align-items: center; gap: 0.75rem;
            transition: all 0.2s;
            cursor: pointer;
            color: #94a3b8;
        }

        .nav-item:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: #f8fafc;
        }

        .nav-item.active {
            background-color: #2ac1bc;
            color: white;
            box-shadow: 0 4px 12px rgba(42, 193, 188, 0.3);
        }

        /* Sub-tab Styles */
        .sub-tab {
            padding: 0.5rem 1rem;
            border-radius: 0.6rem;
            font-size: 0.8125rem;
            font-weight: 600;
            color: #64748b;
            background-color: white;
            border: 1px solid #e2e8f0;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .sub-tab.active {
            background-color: #2ac1bc;
            border-color: #2ac1bc;
            color: white;
            box-shadow: 0 2px 6px rgba(42, 193, 188, 0.15);
        }

        /* Status Sidebar */
        #statusSidebar {
            width: 340px;
            background-color: #ffffff;
            border-left: 1px solid #e2e8f0;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, width 0.3s ease;
        }

        #statusSidebar.collapsed {
            width: 0;
            border-left: none;
        }

        /* Card Styles */
        .link-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            padding: 0.875rem;
            transition: all 0.2s;
        }

        .link-card:hover {
            border-color: #2ac1bc;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transform: translateY(-2px);
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .status-dot {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid white;
        }

        .spinner {
            border: 2px solid rgba(0,0,0,0.1);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border-left-color: #2ac1bc;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Panel Headers */
        .panel-title {
            display: none;
            font-size: 0.75rem;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.75rem;
            margin-left: 0.25rem;
        }
        .view-all .panel-title { display: block; }
        .view-all .link-panel { margin-bottom: 2.5rem; }

        .app-symbol {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .sidebar-logo-img {
            filter: brightness(0) invert(1);
        }
        .modal-logo-img {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }

        @media (max-width: 768px) {
            #mainNav { width: 64px; }
            .nav-text { display: none; }
            #statusSidebar { position: fixed; right: 0; height: 100%; z-index: 50; }
        }
    </style>
</head>
<body>

    <!-- 1. 좌측 사이드바 내비게이션 -->
    <nav id="mainNav">
        <div class="p-6 mb-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 woowa-bg rounded-lg flex items-center justify-center overflow-hidden p-1 shadow-inner">
                    <img id="mainLogoImg" src="우아한테크코스_심볼 일러스트_black.png" class="app-symbol sidebar-logo-img hidden" alt="Logo" onerror="this.classList.add('hidden'); document.getElementById('mainLogoFallback').classList.remove('hidden')">
                    <i id="mainLogoFallback" class="fas fa-satellite-dish text-white text-sm"></i>
                </div>
                <span class="nav-text font-bold text-lg tracking-tight text-white">우아한 정거장</span>
            </div>
        </div>

        <div class="flex-1">
            <div class="nav-item active" onclick="switchView('links')">
                <i class="fas fa-bolt w-5"></i>
                <span class="nav-text font-medium text-sm">도킹 센터</span>
            </div>
            <div class="nav-item" onclick="switchView('ai')">
                <i class="fas fa-language w-5"></i>
                <span class="nav-text font-medium text-sm">전파 교정기</span>
            </div>
        </div>
        
        <div class="p-4 border-t border-slate-700 opacity-40 text-[10px] text-center text-white">
            &copy; 2026 우아한 정거장
        </div>
    </nav>

    <!-- 2. 메인 콘텐츠 영역 -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <header class="h-14 bg-white border-b border-slate-200 px-6 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-4">
                <h2 id="viewTitle" class="font-bold text-slate-800 text-lg">도킹 센터</h2>
            </div>
            
            <div class="flex items-center gap-3">
                <div class="header-nickname-section flex items-center gap-2 bg-slate-50 p-1 rounded-xl border border-slate-100">
                    <div id="nicknameDisplay" class="hidden items-center gap-2 px-2">
                        <span class="text-[11px] font-bold text-slate-400 uppercase tracking-tighter text-teal-600">Pilot</span>
                        <span id="currentNicknameText" class="text-sm font-bold text-slate-700"></span>
                        <button id="editNicknameBtn" class="text-slate-400 hover:text-teal-500 transition-colors" title="이름 수정">
                            <i class="fas fa-pen text-[10px]"></i>
                        </button>
                    </div>
                    <div id="nicknameInputGroup" class="flex items-center gap-1">
                        <input type="text" id="globalNicknameInput" placeholder="닉네임 입력" 
                            class="w-24 md:w-32 p-1.5 text-xs bg-white border border-slate-200 rounded-lg focus:ring-1 focus:ring-teal-400 outline-none transition-all">
                        <button id="saveNicknameBtn" class="woowa-bg text-white text-[10px] font-bold px-3 py-1.5 rounded-lg hover:brightness-105 transition-all shadow-sm">
                            등록
                        </button>
                    </div>
                </div>

                <button id="toggleStatusSidebar" class="p-2 text-slate-400 hover:text-slate-600 transition-colors" title="크루 현황 보기">
                    <i class="fas fa-broadcast-tower text-xl text-teal-500"></i>
                </button>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto custom-scrollbar p-6">
            <div id="linksView" class="view-container max-w-5xl mx-auto view-all">
                <div class="flex flex-col gap-4 mb-8">
                    <div class="flex items-center gap-3 w-full">
                        <div class="relative flex-1">
                            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                            <input type="text" id="linkSearch" placeholder="제목, 내용, 키워드 검색..." 
                                class="w-full pl-11 pr-4 py-2.5 rounded-xl bg-white border border-slate-200 focus:ring-2 focus:ring-teal-400 focus:outline-none shadow-sm transition-all text-sm">
                        </div>
                        <button id="openLinkModalBtn" class="woowa-bg text-white h-[42px] px-5 rounded-xl font-bold flex items-center gap-2 hover:brightness-105 transition-all shadow-sm shrink-0 text-sm">
                            <i class="fas fa-plus-circle"></i>
                            <span class="hidden md:inline">링크 공유</span>
                        </button>
                    </div>
                    
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">
                            <button onclick="switchLinkCategory('all')" class="sub-tab active" id="btn-all">📦 전체 섹터</button>
                            <button onclick="switchLinkCategory('fixed')" class="sub-tab" id="btn-fixed">📌 필수 프로토콜</button>
                            <button onclick="switchLinkCategory('crew')" class="sub-tab" id="btn-crew">📡 공유 주파수</button>
                            <button onclick="switchLinkCategory('mission')" class="sub-tab" id="btn-mission">🚀 탐사 기록물</button>
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">정렬</span>
                            <select id="linkSortSelect" class="p-1.5 text-[11px] rounded-lg bg-white border border-slate-200 outline-none cursor-pointer font-semibold text-slate-600 shadow-sm">
                                <option value="latest">🆕 수신순</option>
                                <option value="popular">🔥 반응순</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="space-y-2">
                    <div id="panel-fixed" class="link-panel">
                        <h3 class="panel-title">📌 필수 프로토콜</h3>
                        <div id="fixedContainer" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
                    </div>
                    <div id="panel-crew" class="link-panel">
                        <h3 class="panel-title">📡 공유 주파수</h3>
                        <div id="crewLinksContainer" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 relative min-h-[100px]">
                            <div class="loading-state flex justify-center py-10 col-span-full"><div class="spinner"></div></div>
                        </div>
                    </div>
                    <div id="panel-mission" class="link-panel">
                        <h3 class="panel-title">🚀 탐사 기록물</h3>
                        <div id="missionLinksContainer" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 relative min-h-[100px]">
                            <div class="loading-state flex justify-center py-10 col-span-full"><div class="spinner"></div></div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="aiView" class="view-container hidden">
                <div class="max-w-3xl mx-auto space-y-6">
                    <div class="bg-white rounded-3xl p-8 border border-slate-200 shadow-sm">
                        <h3 class="text-xl font-bold text-slate-800 mb-2">전파 교정기</h3>
                        <p class="text-slate-500 text-sm mb-6">부드러운 교신을 위해 말투를 정거장 프로토콜에 맞춰 교정합니다.</p>
                        <div class="space-y-4">
                            <textarea id="toneInput" rows="4" placeholder="교신 내용을 입력하세요..." 
                                class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-200 focus:ring-2 focus:ring-teal-400 outline-none resize-none"></textarea>
                            <button id="convertBtn" class="w-full woowa-bg text-white font-bold py-4 rounded-xl shadow-lg hover:brightness-105 transition-all flex items-center justify-center gap-2">
                                <i class="fas fa-bolt" id="convertIcon"></i>
                                <div id="convertLoader" class="spinner hidden"></div>
                                교정하기
                            </button>
                        </div>
                        <div id="toneResultContainer" class="hidden mt-8 p-6 rounded-2xl bg-teal-50 border border-teal-100">
                            <div class="flex justify-between items-center mb-3">
                                <span class="text-xs font-bold text-teal-600 uppercase tracking-widest">권장 교신 어구</span>
                                <button id="copyResultBtn" class="text-teal-600 hover:text-teal-700 text-sm flex items-center gap-1 font-bold">
                                    <i class="fas fa-copy"></i> 복사
                                </button>
                            </div>
                            <p id="toneResultText" class="text-slate-700 leading-relaxed font-medium text-lg"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <aside id="statusSidebar">
        <div class="p-4 border-b border-slate-200 bg-white shrink-0 text-center">
            <h4 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-3 px-1">지금 뭐하고 계신가요?</h4>
            <form id="statusForm" class="space-y-3">
                <div class="space-y-2">
                    <div class="flex flex-col gap-2">
                        <select id="userStatusSelect" class="w-full p-2.5 text-xs rounded-xl bg-slate-50 border border-slate-200 outline-none cursor-pointer focus:ring-1 focus:ring-teal-400">
                            <option value="미션하고 있어요">🚀 미션하고 있어요</option>
                            <option value="회의하고 있어요">🤝 회의하고 있어요</option>
                            <option value="협업하고 있어요">💻 협업하고 있어요</option>
                            <option value="놀고 있어요">☕ 놀고 있어요</option>
                        </select>
                        <select id="userLocationSelect" class="w-full p-2.5 text-xs rounded-xl bg-slate-50 border border-slate-200 outline-none cursor-pointer focus:ring-1 focus:ring-teal-400">
                            <option value="11층 마을">🏘️ 11층 마을</option>
                            <option value="12층 마을">🏘️ 12층 마을</option>
                            <option value="13층 마을">🏘️ 13층 마을</option>
                            <option value="안드로메다">🌌 안드로메다</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full woowa-bg text-white text-xs font-bold py-3 rounded-xl hover:brightness-105 transition-all shadow-md">
                        신호 보내기
                    </button>
                </div>
            </form>
        </div>
        <div class="p-3 border-b border-slate-100 flex justify-between items-center bg-white/50 h-10 shrink-0">
            <h3 class="font-bold text-slate-500 text-[10px] uppercase tracking-tighter flex items-center gap-2">
                <i class="fas fa-users-viewfinder text-teal-500"></i> 탑승 크루 현황
            </h3>
            <span id="totalOnlineCount" class="text-[10px] font-bold bg-slate-100 text-slate-400 px-2 py-0.5 rounded-full">0</span>
        </div>
        <div id="statusListContainer" class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-5 bg-[#f2f3f5]/50">
            <div class="loading-state flex justify-center py-10"><div class="spinner"></div></div>
        </div>
    </aside>

    <!-- Modals & Toasts -->
    <div id="linkModal" class="fixed inset-0 z-[60] flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm modal-overlay"></div>
        <div class="relative bg-white w-full max-w-md mx-4 rounded-2xl shadow-2xl overflow-hidden p-8 text-center border border-teal-50">
            <div class="flex justify-center mb-4">
                <img id="modalLogoImg" src="" class="modal-logo-img hidden" alt="Symbol">
                <i id="modalLogoFallback" class="fas fa-plus-circle text-teal-500 text-3xl"></i>
            </div>
            <h3 id="modalTitle" class="text-xl font-bold text-slate-800 mb-6 tracking-tight">데이터 도킹</h3>
            <form id="addLinkForm" class="space-y-4 text-left">
                <div id="categoryField">
                    <label class="block text-xs font-bold text-slate-500 mb-1 uppercase">데이터 섹터</label>
                    <select id="linkCategory" class="w-full p-2.5 rounded-xl bg-slate-50 border border-slate-200 focus:ring-2 focus:ring-teal-400 focus:border-teal-400 outline-none transition-all text-sm">
                        <option value="crewLinks">공유 주파수</option>
                        <option value="missionLinks">탐사 기록물</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1 uppercase">식별 명칭</label>
                    <input type="text" id="linkTitle" required placeholder="명칭을 입력하세요" class="w-full p-2.5 rounded-xl bg-slate-50 border border-slate-200 focus:ring-2 focus:ring-teal-400 focus:border-teal-400 outline-none transition-all text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1 uppercase">좌표 (URL)</label>
                    <input type="url" id="linkUrl" required placeholder="https://..." class="w-full p-2.5 rounded-xl bg-slate-50 border border-slate-200 focus:ring-2 focus:ring-teal-400 focus:border-teal-400 outline-none transition-all text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1 uppercase">데이터 설명</label>
                    <textarea id="linkDescription" rows="2" placeholder="어떤 정보인지 파일럿들에게 알려주세요" class="w-full p-2.5 rounded-xl bg-slate-50 border border-slate-200 focus:ring-2 focus:ring-teal-400 focus:border-teal-400 outline-none transition-all text-sm resize-none"></textarea>
                </div>
                <div class="flex gap-3 pt-4">
                    <button type="button" class="flex-1 bg-slate-100 text-slate-600 font-bold py-3 rounded-xl modal-overlay text-sm">취소</button>
                    <button type="submit" id="submitLinkBtn" class="flex-2 woowa-bg text-white font-bold py-3 px-8 rounded-xl hover:brightness-105 transition-all shadow-lg text-sm">도킹 승인</button>
                </div>
            </form>
        </div>
    </div>

    <div id="deleteModal" class="fixed inset-0 z-[80] flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 text-center">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm delete-modal-overlay"></div>
        <div class="relative bg-white w-full max-w-xs mx-4 rounded-3xl shadow-2xl overflow-hidden p-8 border border-red-50">
            <div class="flex justify-center mb-5">
                <img id="deleteModalLogoImg" src="" class="w-14 h-14 grayscale opacity-40 hidden" alt="Symbol">
                <i class="fas fa-trash-alt text-red-100 text-5xl"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-800 mb-2 tracking-tight">데이터 폐기</h3>
            <p class="text-slate-500 text-xs mb-8 leading-relaxed">폐기된 데이터는 복구가 불가능하며<br>정거장 네트워크에서 영구 삭제됩니다.</p>
            <div class="flex gap-2">
                <button type="button" class="flex-1 bg-slate-100 text-slate-600 font-bold py-3 rounded-xl text-sm delete-modal-overlay">취소</button>
                <button type="button" id="confirmDeleteBtn" class="flex-1 bg-red-500 text-white font-bold py-3 rounded-xl text-sm hover:bg-red-600 transition-all shadow-md">폐기 완료</button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl transition-all opacity-0 translate-y-4 pointer-events-none z-[100] font-medium text-sm border border-white/10">
        메시지
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot, query, serverTimestamp, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuration
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const apiKey = ""; 

        const FIXED_LINKS = [
            { id: 'f1', title: '우테코 LMS', url: 'https://techcourse.woowahan.com', description: '공공 학습 관리 시스템' },
            { id: 'f2', title: '생활 가이드북', url: 'https://docs.google.com/document/d/1IltsTYaLYkQbXOW1W2GuC85_vrwoPNh_2jbdS0f9wdU/edit?tab=t.0', description: '캠퍼스 생활 규칙 및 안내' },
            { id: 'f3', title: '알쓸크잡', url: 'https://docs.google.com/spreadsheets/d/186j1bXZJRo7SVqD8rY0In-QRsO6E-fvl1Dys40Tqtbs/edit?gid=1164815192#gid=1164815192', description: '크루들을 위한 유용한 잡학지식' },
            { id: 'f4', title: '우테코 레포지토리', url: 'https://github.com/orgs/woowacourse/repositories', description: '미션 및 프로젝트 소스 보관소' }
        ];

        const STATUS_TYPES = [
            { label: "미션하고 있어요", color: "#23a559", icon: "🚀" },
            { label: "회의하고 있어요", color: "#f0b232", icon: "🤝" },
            { label: "협업하고 있어요", color: "#5865f2", icon: "💻" },
            { label: "놀고 있어요", color: "#80848e", icon: "☕" }
        ];

        let linksData = { fixed: FIXED_LINKS, crewLinks: [], missionLinks: [] };
        let appBranding = { symbol: "" };
        let currentSearchQuery = "";
        let currentCategory = "all";
        let currentSort = "latest";
        let registeredNickname = ""; 
        let currentUser = null;
        let currentEditMode = { active: false, id: null, collection: null };
        let pendingDeletion = { collection: null, id: null };

        // -------------------------
        // NICKNAME & SYMBOL & UI
        // -------------------------
        function updateAppSymbolUI(symbolData) {
            if (!symbolData) return;
            appBranding.symbol = symbolData;
            ['#mainLogoImg', '#modalLogoImg', '#deleteModalLogoImg'].forEach(sel => {
                const el = document.querySelector(sel);
                if (el) { el.src = symbolData; el.classList.remove('hidden'); }
            });
            ['#mainLogoFallback', '#modalLogoFallback'].forEach(sel => {
                const el = document.querySelector(sel);
                if (el) el.classList.add('hidden');
            });
        }

        const setNickname = (name) => {
            if (!name.trim()) { showToast("닉네임을 입력해주세요!"); return; }
            registeredNickname = name.trim();
            document.getElementById('currentNicknameText').textContent = registeredNickname;
            document.getElementById('nicknameInputGroup').classList.add('hidden');
            document.getElementById('nicknameDisplay').classList.remove('hidden');
            document.getElementById('nicknameDisplay').classList.add('flex');
            showToast(`${registeredNickname} 크루님, 도킹을 환영합니다! 👋`);
            renderLinks();
        };

        document.getElementById('saveNicknameBtn').addEventListener('click', () => setNickname(document.getElementById('globalNicknameInput').value));
        document.getElementById('editNicknameBtn').addEventListener('click', () => {
            document.getElementById('nicknameDisplay').classList.remove('flex');
            document.getElementById('nicknameDisplay').classList.add('hidden');
            document.getElementById('nicknameInputGroup').classList.remove('hidden');
            document.getElementById('globalNicknameInput').focus();
        });

        window.switchView = (viewName) => {
            ['links', 'ai'].forEach(v => document.getElementById(`${v}View`)?.classList.add('hidden'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            document.getElementById(`${viewName}View`)?.classList.remove('hidden');
            const activeItem = Array.from(document.querySelectorAll('.nav-item')).find(item => 
                item.textContent.includes(viewName === 'links' ? '도킹 센터' : '전파 교정기')
            );
            if (activeItem) activeItem.classList.add('active');
            document.getElementById('viewTitle').textContent = viewName === 'links' ? '도킹 센터' : '전파 교정기';
        };

        window.switchLinkCategory = (category) => {
            currentCategory = category;
            ['all', 'fixed', 'crew', 'mission'].forEach(cat => document.getElementById(`btn-${cat}`)?.classList.remove('active'));
            document.getElementById(`btn-${category}`)?.classList.add('active');
            const lv = document.getElementById('linksView');
            if (category === 'all') lv.classList.add('view-all'); else lv.classList.remove('view-all');
            renderLinks();
        };

        document.getElementById('linkSortSelect').addEventListener('change', (e) => { currentSort = e.target.value; renderLinks(); });
        document.getElementById('toggleStatusSidebar').addEventListener('click', () => document.getElementById('statusSidebar').classList.toggle('collapsed'));
        document.getElementById('linkSearch').addEventListener('input', (e) => { currentSearchQuery = e.target.value.toLowerCase().trim(); renderLinks(); });

        // -------------------------
        // GEMINI AI (전파 교정기)
        // -------------------------
        async function convertTone(text) {
            const systemPrompt = `당신은 우아한테크코스의 크루입니다. 입력받은 문장을 정중하고 따뜻하며 협력적인 말투로 변환하세요. 
            1. 상대방의 노고를 먼저 언급하거나 인사하세요. 
            2. 명령조 대신 '~해주실 수 있을까요?'와 같은 요청조를 사용하세요. 
            3. '일 것 같아요' 같은 쿠션어를 적절히 섞으세요. 
            4. 오직 변환된 문장만 출력하세요.`;
            
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
            };

            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i <= delays.length; i++) {
                try {
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!res.ok) throw new Error(`API error: ${res.status}`);
                    const data = await res.json();
                    const resultText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!resultText) throw new Error("Empty response");
                    return resultText;
                } catch (err) {
                    if (i === delays.length) throw err;
                    await new Promise(r => setTimeout(r, delays[i]));
                }
            }
        }

        document.getElementById('convertBtn').addEventListener('click', async () => {
            const inputEl = document.getElementById('toneInput');
            const text = inputEl.value.trim();
            if (!text) return;

            const resultContainer = document.getElementById('toneResultContainer');
            const resultText = document.getElementById('toneResultText');
            const icon = document.getElementById('convertIcon');
            const loader = document.getElementById('convertLoader');

            icon.classList.add('hidden');
            loader.classList.remove('hidden');
            resultContainer.classList.add('hidden');

            try {
                const converted = await convertTone(text);
                resultText.textContent = converted;
                resultContainer.classList.remove('hidden');
            } catch (e) {
                showToast("교정 중 오류가 발생했습니다. 다시 시도해 주세요.");
            } finally {
                icon.classList.remove('hidden');
                loader.classList.add('hidden');
            }
        });

        // -------------------------
        // FIREBASE SYNC & RENDER
        // -------------------------
        function setupListeners() {
            if (!currentUser) return; 

            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'branding'), (snapshot) => {
                if (snapshot.exists()) updateAppSymbolUI(snapshot.data().symbol);
            }, (err) => console.error("Branding sync fail", err));

            ['crewLinks', 'missionLinks'].forEach(colName => {
                onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', colName)), (snapshot) => {
                    linksData[colName] = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    renderLinks();
                }, (err) => console.error(`${colName} sync fail`, err));
            });

            onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'userStatuses')), (snapshot) => {
                const grouped = {}; STATUS_TYPES.forEach(t => grouped[t.label] = []); let total = 0;
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    if (grouped[data.status]) { grouped[data.status].push({ nickname: docSnap.id, ...data }); total++; }
                });
                renderStatusBoard(grouped, total);
            }, (err) => console.error("Status sync fail", err));
        }

        function createLinkCard(id, data, isFixed = false, collectionName = '') {
            const card = document.createElement('div');
            card.className = 'link-card flex flex-col justify-between group transition-all h-full';
            const faviconUrl = `https://www.google.com/s2/favicons?sz=64&domain_url=${data.url}`;
            const description = data.description || '설명이 없습니다.';
            const likedBy = data.likedBy || [];
            const isLiked = likedBy.includes(registeredNickname);
            
            card.innerHTML = `
                <div class="flex items-start gap-3 cursor-pointer overflow-hidden mb-3" onclick="window.open('${data.url}', '_blank')">
                    <div class="w-9 h-9 mt-0.5 rounded-lg bg-slate-50 flex items-center justify-center border border-slate-100 shrink-0 overflow-hidden">
                        <img src="${faviconUrl}" class="w-5 h-5" onerror="this.src='${appBranding.symbol}'; if(!'${appBranding.symbol}') this.style.display='none';">
                    </div>
                    <div class="overflow-hidden pr-2 text-left">
                        <h4 class="font-bold text-slate-700 text-sm truncate group-hover:text-teal-600 transition-colors">${data.title}</h4>
                        <p class="text-[11px] text-slate-500 mt-0.5 line-clamp-2 leading-relaxed">${description}</p>
                    </div>
                </div>
                <div class="flex items-center justify-between border-t border-slate-50 pt-2">
                    <div class="flex items-center gap-3">
                        ${!isFixed ? `
                            <button class="like-btn flex items-center gap-1 group/like transition-all" title="좋아요">
                                <i class="${isLiked ? 'fas fa-heart text-red-500' : 'far fa-heart text-slate-400'} text-xs group-hover/like:scale-125 transition-transform"></i>
                                <span class="text-[10px] font-bold ${isLiked ? 'text-red-500' : 'text-slate-400'}">${likedBy.length}</span>
                            </button>
                        ` : `
                            <span class="text-[9px] text-slate-300 font-bold uppercase tracking-tighter">Protocol</span>
                        `}
                    </div>
                    <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                        ${!isFixed ? `
                            <button class="edit-link-btn p-1 text-slate-400 hover:text-teal-500 transition-colors"><i class="fas fa-edit text-[11px]"></i></button>
                            <button class="delete-link-btn p-1 text-slate-400 hover:text-red-500 transition-colors"><i class="fas fa-trash-alt text-[11px]"></i></button>
                        ` : ''}
                        <button class="copy-link-btn p-1 text-slate-400 hover:text-teal-500 transition-colors" title="복사"><i class="fas fa-copy text-[11px]"></i></button>
                    </div>
                </div>`;
            
            if (!isFixed) {
                card.querySelector('.like-btn').addEventListener('click', (e) => { e.stopPropagation(); toggleLike(collectionName, id, likedBy); });
                card.querySelector('.edit-link-btn').addEventListener('click', (e) => { e.stopPropagation(); openEditModal(collectionName, id, data); });
                card.querySelector('.delete-link-btn').addEventListener('click', (e) => { 
                    e.stopPropagation(); pendingDeletion = { collection: collectionName, id: id };
                    document.getElementById('deleteModal').classList.remove('opacity-0', 'pointer-events-none');
                    document.getElementById('deleteModal').classList.add('opacity-100');
                });
            }
            card.querySelector('.copy-link-btn').addEventListener('click', (e) => { e.stopPropagation(); copyToClipboard(data.url); });
            return card;
        }

        function renderLinks() {
            const cmap = { fixed: { id: 'panel-fixed', c: 'fixedContainer' }, crewLinks: { id: 'panel-crew', c: 'crewLinksContainer' }, missionLinks: { id: 'panel-mission', c: 'missionLinksContainer' } };
            Object.entries(cmap).forEach(([key, meta]) => {
                const panel = document.getElementById(meta.id), container = document.getElementById(meta.c);
                if(!container) return;
                let filtered = linksData[key].filter(l => l.title.toLowerCase().includes(currentSearchQuery) || l.url.toLowerCase().includes(currentSearchQuery) || (l.description && l.description.toLowerCase().includes(currentSearchQuery)));
                if (currentSort === 'popular') filtered.sort((a, b) => (b.likedBy?.length || 0) - (a.likedBy?.length || 0));
                else if (key !== 'fixed') filtered.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                let s = (currentCategory === 'all' || (currentCategory === 'fixed' && key === 'fixed') || (currentCategory === 'crew' && key === 'crewLinks') || (currentCategory === 'mission' && key === 'missionLinks'));
                if (s && (filtered.length > 0 || currentSearchQuery === "")) {
                    panel.classList.remove('hidden'); container.innerHTML = '';
                    if (filtered.length === 0 && currentSearchQuery !== "") panel.classList.add('hidden');
                    else filtered.forEach(l => container.appendChild(createLinkCard(l.id, l, key === 'fixed', key)));
                } else panel.classList.add('hidden');
            });
        }

        function renderStatusBoard(grouped, total) {
            const container = document.getElementById('statusListContainer');
            document.getElementById('totalOnlineCount').textContent = total;
            if(!container) return;
            container.innerHTML = '';
            STATUS_TYPES.forEach(type => {
                const users = grouped[type.label]; if (!users || users.length === 0) return;
                const section = document.createElement('div');
                section.innerHTML = `<h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2 px-2 text-left">${type.label} — ${users.length}</h4>
                    <div class="space-y-1">
                        ${users.map(u => {
                            const displayStatus = u.status === '놀고 있어요' ? '노는 중' : u.status.replace('하고 있어요', '하는 중');
                            return `<div class="flex items-center gap-3 px-2 py-2 rounded-lg hover:bg-white cursor-default group transition-all">
                                <div class="relative shrink-0 w-8 h-8">
                                    <div class="w-full h-full rounded-full border border-slate-200 bg-slate-50 flex items-center justify-center overflow-hidden">
                                        <img src="${appBranding.symbol}" class="w-6 h-6 object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                                        <i class="fas fa-user text-slate-300 hidden"></i>
                                    </div>
                                    <div class="status-dot" style="background-color: ${type.color}"></div>
                                </div>
                                <div class="flex-1 flex justify-between items-center min-w-0 text-left">
                                    <div class="min-w-0 pr-2">
                                        <div class="text-sm font-semibold text-slate-700 truncate leading-tight">${u.nickname}</div>
                                        <div class="text-[9px] text-slate-400 font-bold uppercase truncate">${type.icon} ${displayStatus}</div>
                                    </div>
                                    <div class="shrink-0 text-right text-[11px] font-extrabold text-teal-600 bg-teal-50 px-2 py-1 rounded-lg shadow-sm border border-teal-100 whitespace-nowrap">
                                        📍 ${u.location || '어딘가'}
                                    </div>
                                </div>
                            </div>`;
                        }).join('')}
                    </div>`;
                container.appendChild(section);
            });
        }

        // -------------------------
        // ACTIONS
        // -------------------------
        async function toggleLike(col, id, likedBy = []) {
            if (!registeredNickname) { showToast("상단에서 파일럿 이름을 먼저 설정해주세요! 👤"); return; }
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', col, id);
            try {
                if (likedBy.includes(registeredNickname)) await updateDoc(docRef, { likedBy: arrayRemove(registeredNickname) });
                else await updateDoc(docRef, { likedBy: arrayUnion(registeredNickname) });
            } catch (e) { showToast("좋아요 처리에 실패했습니다."); }
        }

        async function handleConfirmDelete() {
            if (!currentUser || !pendingDeletion.id) return;
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', pendingDeletion.collection, pendingDeletion.id));
                showToast("데이터 폐기 완료! 🗑️");
            } catch (e) { showToast("삭제 권한이 없습니다."); }
            finally { closeDeleteModal(); }
        }
        document.getElementById('confirmDeleteBtn').addEventListener('click', handleConfirmDelete);
        document.querySelectorAll('.delete-modal-overlay').forEach(el => el.addEventListener('click', closeDeleteModal));
        function closeDeleteModal() { pendingDeletion = { collection: null, id: null }; document.getElementById('deleteModal').classList.add('opacity-0', 'pointer-events-none'); }

        const updateCrewStatus = async () => {
            if (!registeredNickname) { showToast("상단에서 파일럿 이름을 먼저 설정해주세요! 👤"); return; }
            const status = document.getElementById('userStatusSelect').value, location = document.getElementById('userLocationSelect').value;
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'userStatuses', registeredNickname), { status, location, updatedAt: serverTimestamp(), userId: currentUser.uid });
                showToast("신호가 송출되었습니다! 📡");
            } catch (e) { showToast("저장 실패"); }
        };
        document.getElementById('statusForm').addEventListener('submit', (e) => { e.preventDefault(); updateCrewStatus(); });

        function openEditModal(col, id, data) {
            currentEditMode = { active: true, id, collection: col };
            document.getElementById('modalTitle').textContent = '데이터 수정';
            document.getElementById('submitLinkBtn').textContent = '수정 승인';
            document.getElementById('categoryField').classList.add('hidden');
            document.getElementById('linkTitle').value = data.title;
            document.getElementById('linkUrl').value = data.url;
            document.getElementById('linkDescription').value = data.description || '';
            toggleModal();
        }

        document.getElementById('addLinkForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('linkTitle').value, url = document.getElementById('linkUrl').value, description = document.getElementById('linkDescription').value;
            try {
                if (currentEditMode.active) {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', currentEditMode.collection, currentEditMode.id), { title, url, description, updatedAt: serverTimestamp() });
                    showToast("수정 완료! ✨");
                } else {
                    const col = document.getElementById('linkCategory').value;
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', col), { title, url, description, likedBy: [], createdAt: serverTimestamp(), creatorNickname: registeredNickname });
                    showToast("공유 완료! 🚀");
                }
                toggleModal();
            } catch (e) { showToast("처리 오류 발생"); }
        });

        function toggleModal() { 
            const m = document.getElementById('linkModal'); const isActive = m.classList.contains('opacity-100');
            if (isActive) {
                currentEditMode = { active: false, id: null, collection: null };
                document.getElementById('categoryField').classList.remove('hidden');
                document.getElementById('addLinkForm').reset();
            }
            m.classList.toggle('opacity-0', isActive); m.classList.toggle('opacity-100', !isActive); m.classList.toggle('pointer-events-none', isActive); 
        }

        document.getElementById('openLinkModalBtn').addEventListener('click', toggleModal);
        document.querySelectorAll('.modal-overlay').forEach(el => el.addEventListener('click', toggleModal));
        function copyToClipboard(text) { const el = document.createElement('textarea'); el.value = text; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el); showToast("주소가 복사되었습니다!"); }
        function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.remove('opacity-0', 'translate-y-4'); t.classList.add('opacity-100', 'translate-y-0'); setTimeout(() => { t.classList.add('opacity-0', 'translate-y-4'); t.classList.remove('opacity-100', 'translate-y-0'); }, 2000); }

        const init = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    setupListeners();
                    renderLinks();
                } else {
                    currentUser = null;
                }
            });
        };
        init();
    </script>
</body>
</html>
