<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 스터디 플래너</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-color: #333;
            --border-radius: 12px;
            --accent-color: #ff6b6b;
            --pause-color: #f39c12;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 1000px;
            height: 600px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .timer-section {
            flex: 1.2;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 1px solid #eee;
        }

        .mode-switch {
            margin-bottom: 30px;
            background: #eee;
            padding: 5px;
            border-radius: 30px;
            display: flex;
        }

        .mode-btn {
            padding: 8px 20px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 25px;
            font-weight: 600;
            transition: 0.3s;
        }

        .mode-btn.active {
            background: var(--primary-color);
            color: white;
        }

        .display-container {
            width: 100%;
            min-height: 120px;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .display {
            font-size: 80px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .timer-inputs {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            width: 100%;
        }

        .timer-inputs.hidden {
            display: none;
        }

        .timer-inputs input {
            width: 25vw;
            max-width: 180px;
            min-width: 100px;
            text-align: center;
            border: 2px solid transparent;
            background-color: transparent;
            border-radius: 8px;
            font-size: clamp(40px, 8vw, 80px);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--text-color);
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
            padding: 5px 10px;
        }

        #input-min { text-align: right; padding-right: 5px; }
        #input-sec { text-align: left; padding-left: 5px; }

        .timer-inputs input:focus {
            border-color: #eee;
            background-color: #f9f9f9;
        }

        .timer-inputs span {
            font-size: clamp(30px, 6vw, 60px);
            font-weight: 700;
            color: #ccc;
            margin-top: -5px;
            width: 20px;
            text-align: center;
        }

        .status-indicator {
            font-size: 15px;
            color: var(--primary-color);
            font-weight: 600;
            margin-top: -10px;
            margin-bottom: 15px;
            height: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(74, 144, 226, 0.1);
            padding: 4px 12px;
            border-radius: 12px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .status-indicator.active {
            opacity: 1;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--primary-color);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        .controls button {
            padding: 12px 35px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 0 5px;
            transition: 0.2s;
            font-weight: 600;
            min-width: 120px;
        }

        .start-btn { background: var(--primary-color); color: white; }
        .pause-btn { background: var(--pause-color); color: white; }
        .reset-btn { background: #999; color: white; }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] { -moz-appearance: textfield; }

        .todo-section {
            flex: 0.8;
            padding: 30px;
            display: flex;
            flex-direction: column;
            background: #fafafa;
        }

        .todo-section h2 {
            margin-bottom: 20px;
            font-size: 20px;
            color: #555;
        }

        .todo-input-group {
            display: flex; gap: 10px; margin-bottom: 20px;
        }

        #todo-input {
            flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; outline: none;
        }

        #add-todo {
            padding: 10px 15px; background: var(--primary-color); color: white; border: none; border-radius: 6px; cursor: pointer;
        }

        .todo-list { list-style: none; overflow-y: auto; flex: 1; }

        .todo-item {
            background: white; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; flex-direction: column; box-shadow: 0 2px 5px rgba(0,0,0,0.05); animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .todo-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .todo-text { flex: 1; margin-right: 10px; word-break: break-all; font-weight: 500; }
        .todo-item.completed .todo-text { text-decoration: line-through; color: #aaa; }
        
        .completed-time {
            font-size: 11px;
            color: #2ecc71;
            font-weight: 600;
            margin-top: 4px;
            display: none;
        }
        .todo-item.completed .completed-time {
            display: block;
        }

        .todo-actions { display: flex; gap: 5px; }
        .todo-actions button { 
            border: none; 
            background: none; 
            cursor: pointer; 
            font-size: 14px; 
            padding: 6px; 
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .delete-btn { color: var(--accent-color); }
        .delete-btn:hover { background: rgba(255, 107, 107, 0.1); }
        .check-btn { color: #2ecc71; }
        .check-btn:hover { background: rgba(46, 204, 113, 0.1); }

        @media (max-width: 768px) {
            .container { flex-direction: column; height: auto; }
            .timer-section { border-right: none; border-bottom: 1px solid #eee; }
            .timer-inputs input { width: 35vw; }
            .display { font-size: 60px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <section class="timer-section">
            <div class="mode-switch">
                <button class="mode-btn active" id="btn-timer" onclick="setMode('timer')">타이머</button>
                <button class="mode-btn" id="btn-stopwatch" onclick="setMode('stopwatch')">스톱워치</button>
            </div>

            <div class="status-indicator" id="status-indicator">
                <div class="status-dot"></div>
                <span id="status-text"></span>
            </div>

            <div class="display-container">
                <div id="timer-setup" class="timer-inputs">
                    <input type="number" id="input-min" placeholder="00" min="0" max="999" value="25" oninput="handleInputChange()">
                    <span>:</span>
                    <input type="number" id="input-sec" placeholder="00" min="0" max="59" value="00" oninput="handleInputChange()">
                </div>
                <div class="display" id="display" style="display: none;">00:00</div>
            </div>

            <div class="controls">
                <button id="main-btn" class="start-btn" onclick="toggleStartPause()">시작</button>
                <button class="reset-btn" onclick="reset()">초기화</button>
            </div>
        </section>

        <section class="todo-section">
            <h2>오늘의 할 일</h2>
            <div class="todo-input-group">
                <input type="text" id="todo-input" placeholder="할 일을 입력하세요..." onkeypress="if(event.keyCode==13) addTodo()">
                <button id="add-todo" onclick="addTodo()">추가</button>
            </div>
            <ul class="todo-list" id="todo-list"></ul>
        </section>
    </div>

    <script>
        const state = {
            currentMode: 'timer',
            timer: {
                timeLeft: 1500,
                isRunning: false,
                isPaused: false,
                intervalId: null,
                initialSet: 1500
            },
            stopwatch: {
                elapsedTime: 0,
                isRunning: false,
                intervalId: null
            }
        };

        const display = document.getElementById('display');
        const timerSetup = document.getElementById('timer-setup');
        const mainBtn = document.getElementById('main-btn');
        const statusIndicator = document.getElementById('status-indicator');
        const statusText = document.getElementById('status-text');
        const inputMin = document.getElementById('input-min');
        const inputSec = document.getElementById('input-sec');

        function handleInputChange() {
            if (!state.timer.isRunning && !state.timer.isPaused) {
                const m = Math.min(parseInt(inputMin.value) || 0, 999);
                const s = Math.min(parseInt(inputSec.value) || 0, 59);
                inputMin.value = m;
                inputSec.value = s;
                state.timer.timeLeft = (m * 60) + s;
                state.timer.initialSet = state.timer.timeLeft;
            }
        }

        function setMode(newMode) {
            state.currentMode = newMode;
            document.getElementById('btn-timer').classList.toggle('active', state.currentMode === 'timer');
            document.getElementById('btn-stopwatch').classList.toggle('active', state.currentMode === 'stopwatch');
            updateUI();
        }

        function formatTime(seconds) {
            const absSecs = Math.abs(seconds);
            const m = Math.floor(absSecs / 60);
            const s = absSecs % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function updateUI() {
            const current = state.currentMode === 'timer' ? state.timer : state.stopwatch;
            const other = state.currentMode === 'timer' ? state.stopwatch : state.timer;

            if (state.currentMode === 'timer' && !state.timer.isRunning && !state.timer.isPaused) {
                timerSetup.classList.remove('hidden');
                display.style.display = 'none';
            } else {
                timerSetup.classList.add('hidden');
                display.style.display = 'flex';
                display.innerText = formatTime(state.currentMode === 'timer' ? state.timer.timeLeft : state.stopwatch.elapsedTime);
            }

            if (current.isRunning) {
                mainBtn.innerText = '일시정지';
                mainBtn.className = 'pause-btn';
            } else {
                mainBtn.innerText = '시작';
                mainBtn.className = 'start-btn';
            }

            if (other.isRunning) {
                const otherLabel = state.currentMode === 'timer' ? '스톱워치' : '타이머';
                const otherTime = state.currentMode === 'timer' ? state.stopwatch.elapsedTime : state.timer.timeLeft;
                statusText.innerText = `${otherLabel} 작동 중 (${formatTime(otherTime)})`;
                statusIndicator.classList.add('active');
            } else {
                statusIndicator.classList.remove('active');
            }
        }

        function toggleStartPause() {
            const current = state.currentMode === 'timer' ? state.timer : state.stopwatch;
            if (current.isRunning) {
                pause(state.currentMode);
            } else {
                start(state.currentMode);
            }
        }

        function start(targetMode) {
            const target = state[targetMode];
            if (target.isRunning) return;

            if (targetMode === 'timer') {
                if (target.timeLeft <= 0) {
                    showNotification("시간을 설정해주세요.");
                    return;
                }
                target.isPaused = false;
            }

            target.isRunning = true;
            target.intervalId = setInterval(() => {
                if (targetMode === 'timer') {
                    target.timeLeft--;
                    if (target.timeLeft <= 0) {
                        finishTimer();
                    }
                } else {
                    target.elapsedTime++;
                }
                updateUI();
            }, 1000);

            updateUI();
        }

        function pause(targetMode) {
            const target = state[targetMode];
            clearInterval(target.intervalId);
            target.isRunning = false;
            if (targetMode === 'timer') target.isPaused = true;
            updateUI();
        }

        function reset() {
            const targetMode = state.currentMode;
            const target = state[targetMode];
            pause(targetMode);
            if (targetMode === 'timer') {
                target.timeLeft = target.initialSet;
                target.isPaused = false;
            } else {
                target.elapsedTime = 0;
            }
            updateUI();
        }

        function finishTimer() {
            pause('timer');
            state.timer.timeLeft = 0;
            state.timer.isPaused = false;
            showNotification("목표 시간이 종료되었습니다!");
            updateUI();
        }

        function showNotification(msg) {
            const banner = document.createElement('div');
            banner.style.cssText = "position:fixed; top:20px; left:50%; transform:translateX(-50%); background:var(--primary-color); color:white; padding:15px 30px; border-radius:30px; box-shadow:0 4px 15px rgba(0,0,0,0.2); z-index:1000; animation: fadeIn 0.3s ease;";
            banner.innerText = msg;
            document.body.appendChild(banner);
            setTimeout(() => {
                banner.style.opacity = '0';
                banner.style.transition = '0.5s';
                setTimeout(() => banner.remove(), 500);
            }, 3000);
        }

        function addTodo() {
            const input = document.getElementById('todo-input');
            const text = input.value.trim();
            if (!text) return;
            const li = document.createElement('li');
            li.className = 'todo-item';
            
            // 휴지통 아이콘 (SVG)
            const trashIcon = `
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18"></path>
                    <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                    <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
            `;

            li.innerHTML = `
                <div class="todo-main">
                    <span class="todo-text">${text}</span>
                    <div class="todo-actions">
                        <button class="check-btn" title="완료" onclick="toggleTodo(this)">✓</button>
                        <button class="delete-btn" title="삭제" onclick="this.closest('li').remove()">
                            ${trashIcon}
                        </button>
                    </div>
                </div>
                <div class="completed-time"></div>
            `;
            document.getElementById('todo-list').appendChild(li);
            input.value = '';
        }

        function toggleTodo(btn) {
            const item = btn.closest('.todo-item');
            const timeDisplay = item.querySelector('.completed-time');
            const isCompleting = !item.classList.contains('completed');
            
            item.classList.toggle('completed');
            
            if (isCompleting) {
                const now = new Date();
                let hours = now.getHours();
                const minutes = now.getMinutes().toString().padStart(2, '0');
                const ampm = hours >= 12 ? '오후' : '오전';
                hours = hours % 12;
                hours = hours ? hours : 12;
                timeDisplay.innerText = `${ampm} ${hours}:${minutes} 완료`;
            } else {
                timeDisplay.innerText = '';
            }
        }

        updateUI();
    </script>
</body>
</html>
