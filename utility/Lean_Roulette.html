<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lean Roulette</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #F5F7FA;
        }
        /* 결정 애니메이션 효과 */
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        .result-animation {
            animation: popIn 0.5s ease-out forwards;
        }
        .shuffling {
            opacity: 0.7;
            transform: scale(0.95);
            transition: all 0.1s;
        }
        /* 모달 표시용 클래스 추가 */
        .modal-active {
            transform: scale(1) !important;
            opacity: 1 !important;
        }
        /* 선택지 강조 애니메이션 (추가됨) */
        .highlight-option {
            background-color: #dcfce7 !important; /* Tailwind bg-green-100 */
            border-color: #22c55e !important; /* Tailwind border-green-500 */
            transform: scale(1.03);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            z-index: 10;
            transition: all 0.15s ease;
        }
    </style>
</head>
<body class="min-h-screen py-8 px-4 flex justify-center items-start">

    <div class="max-w-2xl w-full space-y-6">
        
        <!-- 헤더 영역 -->
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-bold text-gray-800">🤔 Lean Roulette</h1>
            <p class="text-gray-500">고민되는 선택지들과 중요도(가중치)를 입력해 보세요!</p>
        </div>

        <!-- AI 어시스턴트 영역 (상단으로 이동) -->
        <div class="bg-white rounded-xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] p-6 md:p-8 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-purple-400 to-indigo-500"></div>
            <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center">
                <svg class="w-5 h-5 mr-2 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                ✨ AI 어시스턴트
            </h3>
            
            <div class="space-y-4">
                <div>
                    <label for="aiSituationInput" class="block text-sm font-medium text-gray-700 mb-1">상황 설명 (AI 추천용)</label>
                    <div class="flex gap-2">
                        <input type="text" id="aiSituationInput" class="flex-grow px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none transition-shadow" placeholder="예: 팀 회식 메뉴 추천해줘 (소고기 제외)">
                        <button id="aiRecommendBtn" class="py-2 px-4 bg-purple-600 hover:bg-purple-700 text-white font-medium rounded-lg shadow-sm transition-colors whitespace-nowrap flex items-center">
                            추천받기
                        </button>
                    </div>
                    <p id="aiErrorMessage" class="text-red-500 text-sm mt-1 hidden"></p>
                </div>
            </div>
        </div>

        <!-- 메인 컨텐츠 영역 -->
        <div class="bg-white rounded-xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] p-6 md:p-8">
            
            <!-- 선택지 목록 -->
            <div class="space-y-4" id="optionsList">
                <!-- JavaScript로 선택지 항목들이 여기에 렌더링됩니다 -->
            </div>

            <!-- 버튼 영역 -->
            <div class="mt-6 flex flex-col sm:flex-row gap-3">
                <button id="addOptionBtn" class="flex-1 py-3 px-4 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium rounded-lg transition-colors flex justify-center items-center">
                    <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                    선택지 추가
                </button>
                <button id="decideBtn" class="flex-1 py-3 px-4 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg shadow-md transition-colors transform active:scale-95">
                    🎲 결정하기!
                </button>
            </div>
            
            <!-- AI 장단점 분석 버튼 (선택지 카드로 이동) -->
            <div class="mt-4 pt-4 border-t border-gray-100">
                <button id="aiAnalyzeBtn" class="w-full py-3 px-4 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold rounded-lg transition-colors border border-indigo-200">
                    🔍 현재 선택지 장단점 분석하기
                </button>
            </div>

            <!-- 에러 메시지 표시 -->
            <p id="errorMessage" class="text-red-500 text-sm mt-3 text-center hidden"></p>
        </div>

        <!-- AI 분석 결과 영역 -->
        <div id="aiResultArea" class="hidden bg-white rounded-xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] p-6 md:p-8 border border-purple-100 relative">
            <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center">
                <svg class="w-5 h-5 mr-2 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                장단점 분석 결과
            </h3>
            
            <div id="aiLoadingIndicator" class="hidden py-8 text-center text-purple-600 flex flex-col items-center justify-center">
                <svg class="animate-spin h-8 w-8 mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                <span class="font-medium">AI가 열심히 분석하고 있습니다...</span>
            </div>
            
            <div id="aiAnalysisCards" class="grid gap-4 md:grid-cols-2">
                <!-- JavaScript로 카드가 여기에 렌더링됩니다 -->
            </div>
        </div>

        <!-- 히스토리 영역 -->
        <div class="bg-white rounded-xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] p-6 md:p-8">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-800">🕒 결정 히스토리</h3>
                <button id="clearHistoryBtn" class="text-sm px-3 py-1 bg-red-50 text-red-500 hover:bg-red-100 rounded-lg transition-colors font-medium">
                    전체 삭제
                </button>
            </div>
            
            <ul id="historyList" class="space-y-3">
                <!-- JavaScript로 히스토리가 여기에 렌더링됩니다 -->
            </ul>
            <div id="emptyHistoryMessage" class="text-center text-gray-400 py-4 hidden">
                아직 결정된 기록이 없습니다.
            </div>
        </div>

    </div>

    <!-- 결과 표시 모달 추가 -->
    <div id="resultModalOverlay" class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 transition-opacity duration-200 opacity-0">
        <div id="resultModalBox" class="bg-green-500 rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl transform scale-95 opacity-0 transition-all duration-200">
            <div class="p-8 text-center text-white relative">
                <button id="closeModalBtn" class="absolute top-4 right-4 text-green-200 hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
                <h2 class="text-sm font-medium text-green-100 mb-2">신의 선택은...</h2>
                <div id="finalResultText" class="text-4xl font-bold break-words my-4">결과</div>
            </div>
        </div>
    </div>

    <script>
        // DOM 요소
        const optionsListEl = document.getElementById('optionsList');
        const addOptionBtn = document.getElementById('addOptionBtn');
        const decideBtn = document.getElementById('decideBtn');
        const finalResultText = document.getElementById('finalResultText');
        const historyListEl = document.getElementById('historyList');
        const emptyHistoryMessage = document.getElementById('emptyHistoryMessage');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        const errorMessage = document.getElementById('errorMessage');

        // 모달 관련 DOM 요소
        const resultModalOverlay = document.getElementById('resultModalOverlay');
        const resultModalBox = document.getElementById('resultModalBox');
        const closeModalBtn = document.getElementById('closeModalBtn');

        // AI DOM 요소
        const aiSituationInput = document.getElementById('aiSituationInput');
        const aiRecommendBtn = document.getElementById('aiRecommendBtn');
        const aiAnalyzeBtn = document.getElementById('aiAnalyzeBtn');
        const aiResultArea = document.getElementById('aiResultArea');
        const aiLoadingIndicator = document.getElementById('aiLoadingIndicator');
        const aiAnalysisCards = document.getElementById('aiAnalysisCards');
        const aiErrorMessage = document.getElementById('aiErrorMessage');

        // 상태 관리
        let options = [];
        let history = [];
        let lastAiSituation = ''; // 추가: 마지막으로 추천받은 상황 저장 변수

        // 초기화
        function init() {
            // 로컬 스토리지에서 데이터 불러오기
            const savedOptions = localStorage.getItem('decision_options');
            const savedHistory = localStorage.getItem('decision_history');
            const savedLastSituation = localStorage.getItem('last_ai_situation');

            if (savedOptions) {
                options = JSON.parse(savedOptions);
            } else {
                // 기본 선택지 2개
                options = [
                    { id: generateId(), name: '', weight: 1 },
                    { id: generateId(), name: '', weight: 1 }
                ];
            }

            if (savedHistory) {
                history = JSON.parse(savedHistory);
            }

            if (savedLastSituation) {
                lastAiSituation = savedLastSituation;
            }

            renderOptions();
            renderHistory();
        }

        // 유틸리티: ID 생성
        function generateId() {
            return Math.random().toString(36).substr(2, 9);
        }

        // 유틸리티: 로컬 스토리지 저장
        function saveData() {
            localStorage.setItem('decision_options', JSON.stringify(options));
            localStorage.setItem('decision_history', JSON.stringify(history));
        }

        // UI 렌더링: 선택지 목록
        function renderOptions() {
            optionsListEl.innerHTML = '';
            
            const totalWeight = options.reduce((sum, opt) => sum + Math.max(0, parseFloat(opt.weight) || 0), 0);

            // 헤더 라벨
            const headerHtml = `
                <div class="flex gap-2 mb-2 px-1">
                    <div class="flex-grow text-sm font-medium text-gray-500">선택지 입력</div>
                    <div class="w-20 text-sm font-medium text-gray-500 text-center">가중치</div>
                    <div class="w-16 text-sm font-medium text-gray-500 text-right">확률</div>
                    <div class="w-10 text-center text-sm font-medium text-gray-500">삭제</div>
                </div>
            `;
            optionsListEl.insertAdjacentHTML('beforeend', headerHtml);

            options.forEach((opt, index) => {
                const currentWeight = Math.max(0, parseFloat(opt.weight) || 0);
                const percentage = totalWeight > 0 ? ((currentWeight / totalWeight) * 100).toFixed(1) : 0;

                const itemDiv = document.createElement('div');
                itemDiv.className = 'flex gap-2 items-center p-2 rounded-lg transition-all duration-200 border border-transparent';
                itemDiv.id = `option-row-${opt.id}`;
                itemDiv.innerHTML = `
                    <input type="text" 
                        class="option-name flex-grow px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-shadow" 
                        placeholder="예: 짜장면" 
                        value="${opt.name}" 
                        data-id="${opt.id}">
                    <input type="number" 
                        class="option-weight w-20 px-2 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-shadow text-center" 
                        min="0" step="1" 
                        value="${opt.weight}" 
                        data-id="${opt.id}">
                    <div id="perc-${opt.id}" class="w-16 text-right text-sm font-bold text-green-600 self-center">${percentage}%</div>
                    <button class="remove-btn w-10 h-10 flex items-center justify-center text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors" data-id="${opt.id}" ${options.length <= 2 ? 'disabled style="opacity:0.3; cursor:not-allowed;"' : ''} title="삭제">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                `;
                optionsListEl.appendChild(itemDiv);
            });

            // 가중치 총합 표시 추가
            const totalHtml = `
                <div class="flex justify-end pr-[112px] mt-2">
                    <span class="text-sm font-medium text-gray-600 bg-gray-50 px-3 py-1.5 rounded-lg border border-gray-200 shadow-sm">
                        가중치 총합: <span id="totalWeightDisplay" class="text-gray-900 font-bold ml-1">${totalWeight}</span>
                    </span>
                </div>
            `;
            optionsListEl.insertAdjacentHTML('beforeend', totalHtml);

            // 이벤트 리스너 다시 연결
            document.querySelectorAll('.option-name').forEach(input => {
                input.addEventListener('input', (e) => updateOption(e.target.dataset.id, 'name', e.target.value));
            });
            document.querySelectorAll('.option-weight').forEach(input => {
                input.addEventListener('input', (e) => updateOption(e.target.dataset.id, 'weight', parseFloat(e.target.value) || 0));
            });
            document.querySelectorAll('.remove-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.currentTarget.dataset.id;
                    removeOption(id);
                });
            });
        }

        // 확률 및 총합 실시간 업데이트
        function updateProbabilities() {
            const totalWeight = options.reduce((sum, opt) => sum + Math.max(0, parseFloat(opt.weight) || 0), 0);
            
            options.forEach(opt => {
                const currentWeight = Math.max(0, parseFloat(opt.weight) || 0);
                const percentage = totalWeight > 0 ? ((currentWeight / totalWeight) * 100).toFixed(1) : 0;
                const percEl = document.getElementById(`perc-${opt.id}`);
                if (percEl) percEl.textContent = `${percentage}%`;
            });

            const totalEl = document.getElementById('totalWeightDisplay');
            if (totalEl) totalEl.textContent = totalWeight;
        }

        // UI 렌더링: 히스토리 목록
        function renderHistory() {
            historyListEl.innerHTML = '';
            
            if (history.length === 0) {
                historyListEl.classList.add('hidden');
                emptyHistoryMessage.classList.remove('hidden');
                clearHistoryBtn.classList.add('hidden');
                return;
            }

            historyListEl.classList.remove('hidden');
            emptyHistoryMessage.classList.add('hidden');
            clearHistoryBtn.classList.remove('hidden');

            // 최신 순으로 렌더링
            const reversedHistory = [...history].reverse();
            reversedHistory.forEach(item => {
                const li = document.createElement('li');
                li.className = 'bg-gray-50 p-3 rounded-lg flex justify-between items-center border border-gray-100';
                
                // 날짜 포맷팅
                const date = new Date(item.timestamp);
                const dateStr = `${date.getMonth()+1}/${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2, '0')}`;

                li.innerHTML = `
                    <div class="flex flex-col">
                        <span class="text-green-600 font-bold text-lg">${item.result}</span>
                        <span class="text-xs text-gray-400">후보: ${item.candidates.join(', ')}</span>
                    </div>
                    <span class="text-xs text-gray-400 bg-white px-2 py-1 rounded-md border">${dateStr}</span>
                `;
                historyListEl.appendChild(li);
            });
        }

        // 액션: 선택지 업데이트
        function updateOption(id, field, value) {
            const index = options.findIndex(opt => opt.id === id);
            if (index !== -1) {
                options[index][field] = value;
                saveData();
                hideError();
                if (field === 'weight') {
                    updateProbabilities();
                }
            }
        }

        // 액션: 선택지 추가
        function addOption() {
            options.push({ id: generateId(), name: '', weight: 1 });
            saveData();
            renderOptions();
            
            // 새로 추가된 인풋으로 포커스 이동
            setTimeout(() => {
                const inputs = document.querySelectorAll('.option-name');
                inputs[inputs.length - 1].focus();
            }, 50);
        }

        // 액션: 선택지 삭제
        function removeOption(id) {
            if (options.length <= 2) return; // 최소 2개 유지
            
            options = options.filter(opt => opt.id !== id);
            saveData();
            renderOptions();
        }

        // 에러 메시지 표시/숨김
        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.classList.remove('hidden');
        }
        function hideError() {
            errorMessage.classList.add('hidden');
        }

        // 액션: 결정하기 (가중치 기반 랜덤)
        function makeDecision() {
            hideError();

            // 유효한 선택지 필터링 (이름이 있고 가중치가 0 초과인 것)
            const validOptions = options.filter(opt => opt.name.trim() !== '' && opt.weight > 0);

            if (validOptions.length < 2) {
                showError("이름이 있고 가중치가 1 이상인 선택지가 최소 2개 필요합니다.");
                return;
            }

            // 버튼 비활성화 (연타 방지)
            decideBtn.disabled = true;
            decideBtn.classList.add('opacity-75', 'cursor-not-allowed');

            // 모달 열기 및 룰렛 효과 준비
            resultModalOverlay.classList.remove('hidden');
            void resultModalOverlay.offsetWidth; // 리플로우 강제 발생
            resultModalOverlay.classList.remove('opacity-0');
            resultModalOverlay.classList.add('opacity-100');
            
            resultModalBox.classList.remove('result-animation');
            resultModalBox.classList.add('shuffling', 'modal-active');
            
            // 기존 하이라이트 초기화
            const clearHighlights = () => {
                document.querySelectorAll('[id^="option-row-"]').forEach(el => {
                    el.classList.remove('highlight-option', 'bg-green-50', 'border-green-300', 'scale-[1.02]', 'shadow-sm', 'z-10', 'bg-green-100', 'border-green-500', 'shadow-md');
                    el.classList.add('border-transparent');
                });
            };

            let shuffleCount = 0;
            const maxShuffle = 15;
            const shuffleInterval = setInterval(() => {
                const randomVisualIndex = Math.floor(Math.random() * validOptions.length);
                const currentOpt = validOptions[randomVisualIndex];
                finalResultText.textContent = currentOpt.name;
                
                // 애니메이션 (포커스 효과)
                clearHighlights();
                const highlightEl = document.getElementById(`option-row-${currentOpt.id}`);
                if(highlightEl) {
                    highlightEl.classList.remove('border-transparent');
                    highlightEl.classList.add('highlight-option');
                }

                shuffleCount++;

                if (shuffleCount >= maxShuffle) {
                    clearInterval(shuffleInterval);
                    
                    // 실제 가중치 기반 추첨 알고리즘 실행
                    const winner = calculateWeightedRandom(validOptions);
                    
                    // 최종 결과 표시
                    clearHighlights();
                    const winnerEl = document.getElementById(`option-row-${winner.id}`);
                    if(winnerEl) {
                        winnerEl.classList.remove('border-transparent');
                        winnerEl.classList.add('highlight-option');
                    }

                    resultModalBox.classList.remove('shuffling');
                    void resultModalBox.offsetWidth; // 리플로우 강제 발생 (애니메이션 재시작을 위해)
                    resultModalBox.classList.add('result-animation');
                    
                    finalResultText.textContent = `🎉 ${winner.name} 🎉`;

                    // 히스토리에 추가
                    addHistory(winner.name, validOptions.map(o => o.name));

                    // 버튼 활성화
                    decideBtn.disabled = false;
                    decideBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                }
            }, 80);
        }

        // 모달 닫기 이벤트 추가
        function closeModal() {
            resultModalOverlay.classList.remove('opacity-100');
            resultModalOverlay.classList.add('opacity-0');
            resultModalBox.classList.remove('modal-active');
            setTimeout(() => {
                resultModalOverlay.classList.add('hidden');
                resultModalBox.classList.remove('result-animation');
            }, 200);
        }

        closeModalBtn.addEventListener('click', closeModal);
        resultModalOverlay.addEventListener('click', (e) => {
            if (e.target === resultModalOverlay) closeModal();
        });

        // 핵심 알고리즘: 가중치 비례 랜덤 선택
        function calculateWeightedRandom(validOptions) {
            // 전체 가중치 합산
            const totalWeight = validOptions.reduce((sum, opt) => sum + opt.weight, 0);
            
            // 0 ~ totalWeight 사이의 랜덤 값 생성
            let randomNum = Math.random() * totalWeight;
            
            // 어느 구간에 속하는지 확인
            for (let i = 0; i < validOptions.length; i++) {
                randomNum -= validOptions[i].weight;
                if (randomNum <= 0) {
                    return validOptions[i];
                }
            }
            // Fallback (부동소수점 오차 대비)
            return validOptions[validOptions.length - 1];
        }

        // 액션: 히스토리 추가
        function addHistory(resultName, candidateNames) {
            const newRecord = {
                id: generateId(),
                result: resultName,
                candidates: candidateNames,
                timestamp: new Date().getTime()
            };
            
            // 최대 20개까지만 저장
            history.unshift(newRecord);
            if (history.length > 20) {
                history = history.slice(0, 20);
            }
            
            saveData();
            renderHistory();
        }

        // 액션: 히스토리 삭제
        function clearHistory() {
            if(confirm('결정 기록을 모두 삭제하시겠습니까?')) {
                history = [];
                saveData();
                renderHistory();
            }
        }

        // 이벤트 리스너 등록
        addOptionBtn.addEventListener('click', addOption);
        decideBtn.addEventListener('click', makeDecision);
        clearHistoryBtn.addEventListener('click', clearHistory);

        // --- AI 기능 구현 ---
        const apiKey = "";
        const GEMINI_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

        function showAiError(msg) {
            aiErrorMessage.textContent = msg;
            aiErrorMessage.classList.remove('hidden');
            setTimeout(() => aiErrorMessage.classList.add('hidden'), 3000);
        }

        async function fetchGeminiAPI(payload, maxRetries = 5) {
            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i <= maxRetries; i++) {
                try {
                    const response = await fetch(GEMINI_API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error(`API 요청 실패: ${response.status}`);
                    return await response.json();
                } catch (error) {
                    if (i === maxRetries) throw error;
                    await new Promise(resolve => setTimeout(resolve, delays[i]));
                }
            }
        }

        // 1. AI 추천받기 기능
        aiRecommendBtn.addEventListener('click', async () => {
            const situation = aiSituationInput.value.trim();
            if (!situation) {
                showAiError("추천받을 상황을 먼저 입력해주세요!");
                return;
            }

            const originalText = aiRecommendBtn.innerHTML;
            aiRecommendBtn.innerHTML = `<svg class="animate-spin h-5 w-5 mr-2 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> 추천중...`;
            aiRecommendBtn.disabled = true;

            const payload = {
                contents: [{ parts: [{ text: `다음 상황에 맞는 구체적이고 적절한 선택지 5개를 추천해줘. 상황: ${situation}` }] }],
                systemInstruction: { parts: [{ text: "너는 결정 장애가 있는 사람을 도와주는 선택지 추천 전문가야. 사용자의 상황에 가장 잘 맞는 짧고 명확한 단어 또는 짧은 구문 형태의 선택지 5개를 추천해줘." }] },
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            recommendations: {
                                type: "ARRAY",
                                items: { type: "STRING" }
                            }
                        }
                    }
                }
            };

            try {
                const result = await fetchGeminiAPI(payload);
                const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                if (text) {
                    const data = JSON.parse(text);
                    
                    // 입력된 상황이 이전과 다른지 비교
                    if (lastAiSituation !== situation) {
                        // 1, 2, 3. 기존 선택지, 가중치, 확률 초기화 (options 배열 비우기)
                        options = [];
                        // 4. 이전 AI 분석 결과 영역 초기화 및 숨김
                        aiAnalysisCards.innerHTML = '';
                        aiResultArea.classList.add('hidden');
                    } else {
                        // 상황이 같으면 기존 비어있는 선택지만 자동 삭제 (목록 유지)
                        options = options.filter(opt => opt.name.trim() !== '');
                    }

                    // 새로운 추천 선택지 추가
                    data.recommendations.forEach(rec => {
                        options.push({ id: generateId(), name: rec, weight: 1 });
                    });
                    
                    // 마지막 상황 설명 업데이트 및 스토리지 저장
                    lastAiSituation = situation;
                    localStorage.setItem('last_ai_situation', lastAiSituation);

                    saveData();
                    renderOptions();
                    aiSituationInput.value = '';
                }
            } catch (error) {
                console.error(error);
                showAiError("AI 추천을 가져오는 중 오류가 발생했습니다.");
            } finally {
                aiRecommendBtn.innerHTML = originalText;
                aiRecommendBtn.disabled = false;
            }
        });

        // 2. AI 장단점 분석 기능
        aiAnalyzeBtn.addEventListener('click', async () => {
            const validOptions = options.filter(opt => opt.name.trim() !== '');
            if (validOptions.length === 0) {
                showAiError("분석할 선택지가 없습니다. 위에서 선택지를 추가해주세요.");
                return;
            }

            aiResultArea.classList.remove('hidden');
            aiAnalysisCards.innerHTML = '';
            aiLoadingIndicator.classList.remove('hidden');
            
            const originalText = aiAnalyzeBtn.innerHTML;
            aiAnalyzeBtn.innerHTML = "분석중...";
            aiAnalyzeBtn.disabled = true;

            const optionNames = validOptions.map(opt => opt.name).join(", ");
            const payload = {
                contents: [{ parts: [{ text: `다음 선택지들에 대해 각각의 장점 1~2개와 단점 1~2개를 분석해줘: ${optionNames}` }] }],
                systemInstruction: { parts: [{ text: "너는 객관적인 비교 분석 전문가야. 주어진 여러 선택지들의 장점과 단점을 공정하고 명확하게 비교 분석해줘." }] },
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            analysis: {
                                type: "ARRAY",
                                items: {
                                    type: "OBJECT",
                                    properties: {
                                        optionName: { type: "STRING" },
                                        pros: { type: "ARRAY", items: { type: "STRING" } },
                                        cons: { type: "ARRAY", items: { type: "STRING" } }
                                    }
                                }
                            }
                        }
                    }
                }
            };

            try {
                const result = await fetchGeminiAPI(payload);
                const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                if (text) {
                    const data = JSON.parse(text);
                    
                    data.analysis.forEach(item => {
                        const prosHtml = item.pros.map(p => `<li class="text-green-700 flex items-start"><span class="mr-1.5 mt-0.5 text-green-500">⊕</span>${p}</li>`).join('');
                        const consHtml = item.cons.map(c => `<li class="text-red-700 flex items-start"><span class="mr-1.5 mt-0.5 text-red-500">⊖</span>${c}</li>`).join('');
                        
                        const cardHtml = `
                            <div class="bg-gray-50 rounded-xl p-5 border border-gray-200 shadow-sm hover:shadow-md transition-shadow">
                                <h4 class="text-lg font-bold text-gray-800 mb-3 pb-2 border-b border-gray-200">${item.optionName}</h4>
                                <div class="space-y-3">
                                    <div>
                                        <div class="text-sm font-bold text-green-600 mb-1">장점</div>
                                        <ul class="text-sm space-y-1">${prosHtml}</ul>
                                    </div>
                                    <div class="pt-2 border-t border-gray-100">
                                        <div class="text-sm font-bold text-red-500 mb-1">단점</div>
                                        <ul class="text-sm space-y-1">${consHtml}</ul>
                                    </div>
                                </div>
                            </div>
                        `;
                        aiAnalysisCards.insertAdjacentHTML('beforeend', cardHtml);
                    });
                }
            } catch (error) {
                console.error(error);
                aiAnalysisCards.innerHTML = `<div class="col-span-2 text-center text-red-500 p-4 bg-red-50 rounded-lg">분석 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.</div>`;
            } finally {
                aiLoadingIndicator.classList.add('hidden');
                aiAnalyzeBtn.innerHTML = originalText;
                aiAnalyzeBtn.disabled = false;
            }
        });

        // 앱 시작
        init();
    </script>
</body>
</html>
