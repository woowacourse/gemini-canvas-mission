<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메시지를 알잘딱깔센😎 - 메시지 정제 서비스</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
        .loading-spinner {
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top: 3px solid #3b82f6;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* 스타일 및 수신자 버튼 활성화 상태 */
        .toggle-btn.active {
            background-color: #2563eb;
            color: white;
            border-color: #2563eb;
        }
        /* 토스트 애니메이션 */
        .toast-animate {
            animation: slideUpFade 0.3s ease-out forwards;
        }
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-2xl w-full bg-white rounded-3xl shadow-xl overflow-hidden relative">
        <!-- 헤더 -->
        <div class="bg-blue-600 p-8 text-white text-center">
            <h1 class="text-2xl font-bold mb-2">메시지를 알잘딱깔센 😎</h1>
            <p class="text-blue-100 opacity-90">어떤 내용이든 알잘딱깔센 다듬어 보세요!</p>
        </div>

        <div class="p-8 space-y-6">
            <!-- 결과 섹션 -->
            <div id="resultArea" class="hidden space-y-4 pb-6 border-b border-gray-100">
                <div class="flex items-center justify-between">
                    <h3 class="text-lg font-bold text-gray-800">이렇게 보내보면 어떨까요?</h3>
                    <button id="copyBtn" class="text-sm text-blue-600 hover:underline">내용 복사하기</button>
                </div>
                <div id="output" class="p-5 bg-blue-50 rounded-2xl text-gray-800 leading-relaxed whitespace-pre-wrap border border-blue-100 min-h-[100px]">
                    <!-- 다듬어진 메시지 표시 영역 -->
                </div>
                <div id="errorMsg" class="hidden text-red-500 text-sm text-center"></div>
            </div>

            <!-- 입력 섹션 (메인/직접입력 공용) -->
            <div id="inputSection">
                <label id="inputLabel" class="block text-sm font-semibold text-gray-700 mb-2">보내려는 메시지 또는 상황/맥락</label>
                <textarea id="rawInput" rows="5" 
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition outline-none resize-none"
                    placeholder="예: 과제 늦을 것 같다는 말 정중하게 (혹은 직접 작성한 초안 입력)"></textarea>
            </div>

            <!-- 퀵 수정 버튼 섹션 (추가 다듬기용) -->
            <div id="quickPromptArea" class="hidden animate-fade-in">
                <label class="block text-sm font-semibold text-gray-700 mb-3">어떻게 수정할까요? (버튼 클릭 시 즉시 반영)</label>
                <div class="flex flex-wrap gap-2" id="quickPromptContainer">
                    <button type="button" data-prompt="자연스러운 구어체를 사용하되, 인위적인 유행어나 신조어는 절대 사용하지 마세요. 한국어 자음 활용 시 규칙을 엄수하세요: 1) 'ㅠㅠ'는 한 번에 최대 2개까지만 사용(예: ㅠㅠ). 2) 'ㅋㅋ'는 정말 웃긴 상황에서만 5개 이상 사용(예: ㅋㅋㅋㅋㅋ). 또한 '~냐'와 같은 공격적이거나 무례하게 들릴 수 있는 의문형 어미는 절대 사용하지 마세요. 대신 '~어?', '~니?' 등 부드러운 어미를 사용하고, 텍스트 기반 감정 표현을 섞어 실제 한국인이 보낸 것처럼 자연스럽게 고쳐줘." class="quick-btn px-4 py-2 rounded-full border border-gray-200 bg-white text-gray-700 text-sm font-medium hover:bg-blue-50 hover:border-blue-500 transition-all">👤 좀 더 사람처럼</button>
                    <button type="button" data-prompt="🙇 존댓말(높임말)을 사용해서 아주 정중하게 고쳐줘" class="quick-btn px-4 py-2 rounded-full border border-gray-200 bg-white text-gray-700 text-sm font-medium hover:border-blue-500 transition-all">🙇 존댓말로</button>
                    <button type="button" data-prompt="🤝 반말(비격식체)을 사용하되, '~냐'와 같은 무례한 어미는 자제하고 부드럽고 친근한 어조로 고쳐줘" class="quick-btn px-4 py-2 rounded-full border border-gray-200 bg-white text-gray-700 text-sm font-medium hover:border-blue-500 transition-all">🤝 반말로</button>
                    <button type="button" data-prompt="🙏 좀 더 정중하고 예의 바른 느낌으로 수정해줘" class="quick-btn px-4 py-2 rounded-full border border-gray-200 bg-white text-gray-700 text-sm font-medium hover:border-blue-500 transition-all">🙏 정중하게</button>
                    <button type="button" data-prompt="😊 상대방을 배려하는 따뜻하고 부드러운 느낌으로 수정해줘. '~냐' 같은 딱딱한 어미는 피해서 작성해줘." class="quick-btn px-4 py-2 rounded-full border border-gray-200 bg-white text-gray-700 text-sm font-medium hover:bg-blue-50 hover:border-blue-500 transition-all">😊 친근하게</button>
                    <button type="button" data-prompt="🤏 불필요한 말은 빼고 최대한 핵심만 짧게 줄여줘" class="quick-btn px-4 py-2 rounded-full border border-gray-200 bg-white text-gray-700 text-sm font-medium hover:border-blue-500 transition-all">🤏 더 짧게</button>
                    <button type="button" data-prompt="📝 상황을 조금 더 구체적으로 풀어서 자세하게 작성해줘" class="quick-btn px-4 py-2 rounded-full border border-gray-200 bg-white text-gray-700 text-sm font-medium hover:border-blue-500 transition-all">📝 더 자세하게</button>
                    <button type="button" data-prompt="✨ 문장 중간중간에 어울리는 이모지를 자연스럽게 섞어서 활기차게 만들어줘" class="quick-btn px-4 py-2 rounded-full border border-gray-200 bg-white text-gray-700 text-sm font-medium hover:border-blue-500 transition-all">✨ 이모지 추가</button>
                    <button type="button" data-prompt="🙅 기분 나쁘지 않게 배려하면서도 정중하게 거절하는 톤으로 바꿔줘" class="quick-btn px-4 py-2 rounded-full border border-gray-200 bg-white text-gray-700 text-sm font-medium hover:border-blue-500 transition-all">🙅 부드러운 거절</button>
                    <button type="button" data-prompt="🤝 미안한 마음을 충분히 표현하면서 양해를 구하는 사과문 느낌으로 다듬어줘" class="quick-btn px-4 py-2 rounded-full border border-gray-200 bg-white text-gray-700 text-sm font-medium hover:border-blue-500 transition-all">🤝 사과/양해</button>
                    <button type="button" id="directInputBtn" class="px-4 py-2 rounded-full border-2 border-dashed border-blue-400 bg-blue-50 text-blue-700 text-sm font-bold hover:bg-blue-100 transition-all">⌨️ 직접 입력</button>
                </div>
            </div>

            <!-- 수신자 선택 -->
            <div id="recipientSection">
                <label class="block text-sm font-semibold text-gray-700 mb-3">받는 사람</label>
                <div class="flex flex-wrap gap-2 mb-3" id="recipientBtnContainer">
                    <button type="button" class="recipient-btn toggle-btn px-4 py-2 rounded-full border border-gray-200 bg-white text-gray-700 text-sm font-medium hover:border-blue-500 transition-all">대학교 교수님</button>
                    <button type="button" class="recipient-btn toggle-btn px-4 py-2 rounded-full border border-gray-200 bg-white text-gray-700 text-sm font-medium hover:border-blue-500 transition-all">직장 상사</button>
                    <button type="button" class="recipient-btn toggle-btn px-4 py-2 rounded-full border border-gray-200 bg-white text-gray-700 text-sm font-medium hover:border-blue-500 transition-all">거래처 담당자</button>
                    <button type="button" class="recipient-btn toggle-btn px-4 py-2 rounded-full border border-gray-200 bg-white text-gray-700 text-sm font-medium hover:border-blue-500 transition-all">동료/팀원</button>
                    <button type="button" class="recipient-btn toggle-btn px-4 py-2 rounded-full border border-gray-200 bg-white text-gray-700 text-sm font-medium hover:border-blue-500 transition-all">선배/후배</button>
                    <button type="button" class="recipient-btn toggle-btn px-4 py-2 rounded-full border border-gray-200 bg-white text-gray-700 text-sm font-medium hover:border-blue-500 transition-all">어색한 친구</button>
                    <button type="button" class="recipient-btn toggle-btn px-4 py-2 rounded-full border border-gray-200 bg-white text-gray-700 text-sm font-medium hover:border-blue-500 transition-all">친한 친구</button>
                    <button type="button" class="recipient-btn toggle-btn px-4 py-2 rounded-full border border-gray-200 bg-white text-gray-700 text-sm font-medium hover:border-blue-500 transition-all">서비스 고객센터</button>
                    <button type="button" class="recipient-btn toggle-btn px-4 py-2 rounded-full border border-gray-200 bg-white text-gray-700 text-sm font-medium hover:border-blue-500 transition-all">기타</button>
                    <button type="button" id="customRecipientBtn" class="recipient-btn toggle-btn px-4 py-2 rounded-full border border-gray-200 bg-white text-gray-700 text-sm font-medium hover:border-blue-500 transition-all">직접 입력</button>
                </div>
                <input type="text" id="recipientInput" 
                    class="hidden w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition outline-none"
                    placeholder="예: 시청 관계자, 부모님 등">
            </div>

            <!-- 형식/어조 선택 -->
            <div id="styleSection">
                <label class="block text-sm font-semibold text-gray-700 mb-3">형식/어조 선택 (중복 가능)</label>
                <div class="flex flex-wrap gap-2" id="styleContainer">
                    <button type="button" data-style="mail" class="style-btn toggle-btn px-4 py-2 rounded-full border border-gray-200 bg-white text-gray-700 text-sm font-medium hover:border-blue-500 transition-all">메일 📧</button>
                    <button type="button" data-style="text" class="style-btn toggle-btn px-4 py-2 rounded-full border border-gray-200 bg-white text-gray-700 text-sm font-medium hover:border-blue-500 transition-all">문자 💬</button>
                    <button type="button" data-style="inquiry" class="style-btn toggle-btn px-4 py-2 rounded-full border border-gray-200 bg-white text-gray-700 text-sm font-medium hover:border-blue-500 transition-all">문의글 📩</button>
                    <button type="button" data-style="review" class="style-btn toggle-btn px-4 py-2 rounded-full border border-gray-200 bg-white text-gray-700 text-sm font-medium hover:border-blue-500 transition-all">리뷰 ⭐</button>
                </div>
            </div>

            <!-- 글자 수 선택 (선택 사항) -->
            <div id="lengthSection">
                <label class="block text-sm font-semibold text-gray-700 mb-3">글자 수 (선택)</label>
                <div class="flex flex-wrap gap-2" id="lengthContainer">
                    <button type="button" data-length="short" class="length-btn toggle-btn px-4 py-2 rounded-full border border-gray-200 bg-white text-gray-700 text-sm font-medium hover:border-blue-500 transition-all">짧게</button>
                    <button type="button" data-length="medium" class="length-btn toggle-btn px-4 py-2 rounded-full border border-gray-200 bg-white text-gray-700 text-sm font-medium hover:border-blue-500 transition-all">적당히</button>
                    <button type="button" data-length="long" class="length-btn toggle-btn px-4 py-2 rounded-full border border-gray-200 bg-white text-gray-700 text-sm font-medium hover:border-blue-500 transition-all">상세히</button>
                </div>
            </div>

            <!-- 액션 버튼 -->
            <div class="flex flex-col sm:flex-row gap-3">
                <button id="refineBtn" 
                    class="flex-[2] bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg transform active:scale-[0.98] transition-all flex items-center justify-center gap-3">
                    <span id="btnText">메시지 다듬기</span>
                    <div id="loading" class="hidden loading-spinner"></div>
                </button>
                <button id="resetBtn" 
                    class="hidden flex-1 bg-white border-2 border-blue-600 text-blue-600 font-bold py-4 rounded-xl shadow-md hover:bg-blue-50 transform active:scale-[0.98] transition-all">
                    새로 시작
                </button>
            </div>
        </div>

        <!-- 토스트 메시지 컨테이너 -->
        <div id="toastContainer" class="fixed bottom-10 left-0 right-0 flex flex-col items-center z-50 pointer-events-none px-4"></div>

        <!-- 푸터 -->
        <div class="p-6 bg-gray-50 text-center">
            <p class="text-xs text-gray-400">© 2026 메시지를 알잘딱깔센.</p>
        </div>
    </div>

    <script>
        const apiKey = ""; 
        const modelName = "gemini-2.5-flash-preview-09-2025";

        const rawInput = document.getElementById('rawInput');
        const inputLabel = document.getElementById('inputLabel');
        const inputSection = document.getElementById('inputSection');
        const quickPromptArea = document.getElementById('quickPromptArea');
        const recipientSection = document.getElementById('recipientSection');
        const styleSection = document.getElementById('styleSection');
        const lengthSection = document.getElementById('lengthSection');
        
        const recipientInput = document.getElementById('recipientInput');
        const refineBtn = document.getElementById('refineBtn');
        const resetBtn = document.getElementById('resetBtn');
        const btnText = document.getElementById('btnText');
        const resultArea = document.getElementById('resultArea');
        const output = document.getElementById('output');
        const loading = document.getElementById('loading');
        const errorMsg = document.getElementById('errorMsg');
        const copyBtn = document.getElementById('copyBtn');
        const styleBtns = document.querySelectorAll('.style-btn');
        const recipientBtns = document.querySelectorAll('.recipient-btn');
        const lengthBtns = document.querySelectorAll('.length-btn');
        const quickBtns = document.querySelectorAll('.quick-btn');
        const directInputBtn = document.getElementById('directInputBtn');
        const customRecipientBtn = document.getElementById('customRecipientBtn');
        const toastContainer = document.getElementById('toastContainer');

        // 상태 관리
        const selectedStyles = new Set();
        let selectedRecipient = "";
        let selectedLength = ""; 
        let lastRefinedText = ""; 
        let isIterative = false; 

        const stylePrompts = {
            'mail': '서론, 본론, 결론을 갖춘 정중한 구조로 메시지를 작성한다. 문어체를 사용해도 괜찮으며, 가급적 두괄식 구조를 사용할 수 있도록 한다. 이모티콘 등 비격식적인 언어의 사용은 자제한다.',
            'text': '한국어 구어체의 특징을 살린 어조를 사용하되, 무례하게 보일 수 있는 ~냐 등의 어미는 피하고 친근한 어조를 사용한다. 생성형 AI의 특징이 나타나지 않도록 특히 주의해 메시지를 생성한다.',
            'inquiry': '서비스 고객센터에 남길 문의글 형식을 고려해서 메시지를 작성한다. 상황 설명과 감정 호소(간절함)가 강조되도록 하여 해결 의지를 높인다.',
            'review': '생성형 AI 티가 특히 나지 않도록 주의해서 생성할 것, 비속어나 불쾌한 문장은 정제하되 사용자가 원래 입력한 내용에서 나타나는 사용자 특유의 말투는 살릴 것, 상품의 장/단점을 잘 드러나게 할 것, 사용자의 긍정적/부정적 감정이 읽는 입장에서 부담스러울 정도로 드러나진 않지만, 차분하게 전달이 잘 되도록 생성할 것, 길이가 다소 짧아도 괜찮으니 없는 말을 지어내지 말 것'
        };

        const lengthPrompts = {
            'short': '불필요한 미사여구를 제외하고 핵심만 빠르게 전달할 수 있도록 간결하게 작성해줘.',
            'medium': '상황에 가장 적합한 표준적인 길이로 작성해줘.',
            'long': '충분한 설명과 예의를 갖춘 문장 구조를 사용해줘. 상대방이 상황을 깊이 이해할 수 있도록 문장을 풍성하게 다듬어줘.'
        };

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'bg-gray-800 text-white px-6 py-3 rounded-full shadow-2xl text-sm font-medium toast-animate mb-3 text-center';
            toast.innerText = message;
            toastContainer.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        function resetApp() {
            lastRefinedText = "";
            isIterative = false;
            selectedStyles.clear();
            selectedRecipient = "";
            selectedLength = "";
            
            inputSection.classList.remove('hidden');
            quickPromptArea.classList.add('hidden');
            recipientSection.classList.remove('hidden');
            styleSection.classList.remove('hidden');
            lengthSection.classList.remove('hidden');
            
            rawInput.value = "";
            inputLabel.innerText = "보내려는 메시지 또는 상황/맥락";
            rawInput.placeholder = "예: 과제 늦을 것 같다는 말 정중하게 (혹은 직접 작성한 초안 입력)";
            btnText.innerText = "메시지 다듬기";
            
            resultArea.classList.add('hidden');
            resetBtn.classList.add('hidden'); 
            output.innerText = "";
            recipientInput.classList.add('hidden');
            recipientInput.value = "";
            recipientBtns.forEach(b => b.classList.remove('active'));
            styleBtns.forEach(b => b.classList.remove('active'));
            lengthBtns.forEach(b => b.classList.remove('active'));
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        resetBtn.addEventListener('click', resetApp);

        directInputBtn.addEventListener('click', () => {
            inputSection.classList.toggle('hidden');
            if (!inputSection.classList.contains('hidden')) {
                rawInput.focus();
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            }
        });

        quickBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const prompt = btn.getAttribute('data-prompt');
                refineMessage(prompt);
            });
        });

        recipientBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const wasActive = btn.classList.contains('active');
                recipientBtns.forEach(b => b.classList.remove('active'));
                recipientInput.classList.add('hidden');
                selectedRecipient = "";

                if (!wasActive) {
                    btn.classList.add('active');
                    if (btn === customRecipientBtn) {
                        recipientInput.classList.remove('hidden');
                        selectedRecipient = "custom";
                    } else {
                        selectedRecipient = btn.innerText;
                    }
                }
            });
        });

        styleBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const style = btn.getAttribute('data-style');
                if (selectedStyles.has(style)) {
                    selectedStyles.delete(style);
                    btn.classList.remove('active');
                } else {
                    selectedStyles.add(style);
                    btn.classList.add('active');
                }
            });
        });

        lengthBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const wasActive = btn.classList.contains('active');
                lengthBtns.forEach(b => b.classList.remove('active'));
                selectedLength = "";

                if (!wasActive) {
                    btn.classList.add('active');
                    selectedLength = btn.getAttribute('data-length');
                }
            });
        });

        async function fetchWithRetry(url, options, retries = 5, backoff = 1000) {
            try {
                const response = await fetch(url, options);
                if (!response.ok) throw new Error('API 요청 실패');
                return await response.json();
            } catch (err) {
                if (retries > 0) {
                    await new Promise(res => setTimeout(res, backoff));
                    return fetchWithRetry(url, options, retries - 1, backoff * 2);
                }
                throw err;
            }
        }

        async function refineMessage(quickPrompt = null) {
            const userInput = quickPrompt || rawInput.value.trim();
            const finalRecipient = selectedRecipient === "custom" ? recipientInput.value.trim() : selectedRecipient;

            if (!userInput || !finalRecipient) {
                showToast("기입/선택하지 않은 항목이 있습니다");
                return;
            }

            refineBtn.disabled = true;
            loading.classList.remove('hidden');
            errorMsg.classList.add('hidden');

            let styleInstructions = "";
            selectedStyles.forEach(style => {
                styleInstructions += `- ${stylePrompts[style]}\n`;
            });

            let lengthInstruction = selectedLength ? `- ${lengthPrompts[selectedLength]}` : "- 상황에 맞는 적절한 길이로 작성하세요.";

            // 수신자별 맞춤 가이드 보강
            let recipientContext = "";
            if (finalRecipient === "기타") {
                recipientContext = "수신자가 명확히 지정되지 않았습니다. 상황에 맞게 유연하게 다듬어주세요.";
            } else if (finalRecipient === "어색한 친구") {
                recipientContext = "'어색한 친구'에게 보내는 메시지입니다. 반말을 사용하더라도 상대방을 존중하고 조심스러운 어투로 다듬어주세요. 호칭은 '야' 대신 '00아'를 사용하고, '~냐'와 같이 무례하게 들릴 수 있는 어미는 절대 사용하지 마세요.";
            } else if (finalRecipient === "친한 친구") {
                recipientContext = "'친한 친구'에게 보내는 메시지입니다. 편한 반말을 사용하되, 무례해 보일 수 있는 '야'라는 호칭 대신 '00아'를 사용하고, '~냐' 등 상대방 기분을 상하게 할 수 있는 어미는 피하세요.";
            } else {
                recipientContext = `'${finalRecipient}'에게 보내는 메시지입니다.`;
            }

            const systemPrompt = `당신은 메시지 예절 및 문장 정제 전문가입니다. 
사용자의 입력 내용(초안 또는 상황)을 분석하여 최적으로 다듬어주세요.

전체 가이드라인:
- 한국의 정서와 상황에 맞는 적절한 어조를 사용하세요.
- 비격식체(반말)를 사용할 때에도 상대방을 존중하는 태도를 유지하세요. 특히 '~냐'와 같은 공격적이거나 고압적인 어미는 일절 사용하지 않습니다.
- 결과물은 정제된 메시지 내용만 출력하고 다른 설명은 절대 포함하지 마세요.

수신자 및 길이 지침:
- ${recipientContext}
${lengthInstruction}

추가 스타일 지침:
${styleInstructions || "- 상황에 맞는 일반적인 정중한 톤을 사용하세요."}`;

            let userQuery = isIterative 
                ? `[기존 메시지]: ${lastRefinedText}\n[추가 수정 요청 사항]: ${userInput}`
                : `[입력 내용]: ${userInput}\n[수신자]: ${finalRecipient}`;

            try {
                const result = await fetchWithRetry(
                    `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: userQuery }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] }
                        })
                    }
                );

                const refinedText = result.candidates?.[0]?.content?.parts?.[0]?.text;
                
                if (refinedText) {
                    lastRefinedText = refinedText.trim();
                    output.innerText = lastRefinedText;
                    resultArea.classList.remove('hidden');
                    resetBtn.classList.remove('hidden'); 
                    
                    if (!isIterative) {
                        isIterative = true;
                        inputSection.classList.add('hidden');
                        quickPromptArea.classList.remove('hidden');
                        recipientSection.classList.add('hidden');
                        styleSection.classList.add('hidden');
                        lengthSection.classList.add('hidden');
                        
                        inputLabel.innerText = "프롬프트 추가 (수정 요청)";
                        rawInput.placeholder = "어떻게 더 고칠까요? (예: 좀 더 짧게, 더 정중하게 등)";
                        btnText.innerText = "메시지 추가로 다듬기";
                    }
                    rawInput.value = ""; 
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    throw new Error("결과 생성 실패");
                }
            } catch (err) {
                showError("메시지를 다듬는 중 오류가 발생했습니다. 다시 시도해주세요.");
            } finally {
                refineBtn.disabled = false;
                loading.classList.add('hidden');
            }
        }

        function showError(msg) {
            errorMsg.innerText = msg;
            errorMsg.classList.remove('hidden');
            resultArea.classList.remove('hidden');
        }

        copyBtn.addEventListener('click', () => {
            const text = output.innerText;
            const tempInput = document.createElement('textarea');
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            
            const originalText = copyBtn.innerText;
            copyBtn.innerText = "복사 완료!";
            setTimeout(() => copyBtn.innerText = originalText, 2000);
        });

        refineBtn.addEventListener('click', () => refineMessage());
    </script>
</body>
</html>
