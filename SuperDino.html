<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Dino Run - Classic Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f7f7f7;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 250px;
            background-color: #ffffff;
            overflow: hidden;
            border-bottom: 2px solid #535353;
        }
        canvas {
            display: block;
        }
        .ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        .heart {
            width: 20px;
            height: 20px;
            background-color: #ff5252;
            position: relative;
            transform: rotate(-45deg);
        }
        .heart::before, .heart::after {
            content: "";
            width: 20px;
            height: 20px;
            background-color: #ff5252;
            border-radius: 50%;
            position: absolute;
        }
        .heart::before { top: -10px; left: 0; }
        .heart::after { left: 10px; top: 0; }

        .score-layer {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 14px;
            color: #535353;
            z-index: 10;
        }
        #message-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border: 2px solid #535353;
            z-index: 20;
            display: none;
            width: 400px;
        }
        .btn {
            margin-top: 20px;
            padding: 10px 20px;
            background: #535353;
            color: white;
            border: none;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
        }
        .btn:hover { background: #333; }

        #charge-indicator {
            position: absolute;
            height: 6px;
            background: #4caf50;
            display: none;
            border: 1px solid #333;
        }

        #level-up-toast {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: #535353;
            font-size: 14px;
            font-weight: bold;
            display: none;
            pointer-events: none;
            z-index: 15;
            animation: bounce 0.5s ease infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateX(-50%) translateY(0); }
            to { transform: translateX(-50%) translateY(-10px); }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="ui-layer" id="heart-container"></div>
    <div class="score-layer" id="score-display">HI 00000 00000</div>

    <div id="level-up-toast">LEVEL UP! OBSTACLES GROWING!</div>

    <div id="message-box">
        <h2 id="msg-title" style="font-size: 18px; margin-bottom: 15px;">DINO RUN</h2>
        <p id="msg-body" style="font-size: 10px; line-height: 1.6; color: #666;">스페이스를 길게 눌러 높이 점프하세요!<br>장애물이 점점 커집니다!</p>
        <button id="start-btn" class="btn">START</button>
    </div>

    <div id="charge-indicator"></div>

    <canvas id="gameCanvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const heartContainer = document.getElementById('heart-container');
    const scoreDisplay = document.getElementById('score-display');
    const messageBox = document.getElementById('message-box');
    const msgTitle = document.getElementById('msg-title');
    const msgBody = document.getElementById('msg-body');
    const startBtn = document.getElementById('start-btn');
    const chargeIndicator = document.getElementById('charge-indicator');
    const levelUpToast = document.getElementById('level-up-toast');

    canvas.width = 800;
    canvas.height = 250;

    // Web Audio API
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playBeep(freq, duration, type = 'square') {
        if (!audioCtx) audioCtx = new AudioContext();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    function playLevelUpSound() {
        playBeep(523.25, 0.1); // C5
        setTimeout(() => playBeep(659.25, 0.1), 100); // E5
        setTimeout(() => playBeep(783.99, 0.2), 200); // G5
    }

    // 게임 설정
    const GRAVITY = 0.75;
    const INITIAL_SPEED = 5.0;
    const MAX_SPEED = 14;
    const MILESTONE_SCORE = 200;
    const SPEED_BOOST = 0.7;
    const MIN_OBSTACLE_GAP = 380;
    const INVINCIBLE_DURATION = 1000;
    const MAX_CHARGE_TIME = 250;
    const MIN_JUMP_FORCE = 10;
    const MAX_JUMP_FORCE = 17.5;

    let gameState = 'START';
    let gameSpeed = INITIAL_SPEED;
    let score = 0;
    let highScore = 0;
    let frames = 0;
    let lastRecoveryFrame = 0;
    let lastLevelUpScore = 0;
    let currentLevel = 0;

    const dino = {
        x: 60,
        y: 0,
        width: 44,
        height: 47,
        vy: 0,
        hp: 3,
        isJumping: false,
        isCharging: false,
        chargeStart: 0,
        invincibleUntil: 0,
        groundY: canvas.height - 57,

        draw() {
            ctx.save();
            if (Date.now() < this.invincibleUntil) {
                ctx.globalAlpha = Math.floor(Date.now() / 100) % 2 === 0 ? 0.2 : 0.7;
            }

            ctx.fillStyle = '#535353';
            // Dino Pixel Art
            ctx.fillRect(this.x + 10, this.y, 25, 20);
            ctx.fillRect(this.x + 30, this.y + 4, 10, 8);
            ctx.fillRect(this.x + 15, this.y + 15, 20, 20);
            ctx.fillRect(this.x, this.y + 18, 15, 12);

            const legOffset = Math.floor(frames / (10 - Math.min(5, gameSpeed/2))) % 2 === 0 ? 0 : 5;
            if (!this.isJumping) {
                ctx.fillRect(this.x + 15, this.y + 35, 5, 10 + legOffset);
                ctx.fillRect(this.x + 25, this.y + 35, 5, 10 + (5 - legOffset));
            } else {
                ctx.fillRect(this.x + 15, this.y + 35, 5, 10);
                ctx.fillRect(this.x + 25, this.y + 35, 5, 10);
            }

            ctx.fillStyle = 'white';
            ctx.fillRect(this.x + 15, this.y + 4, 4, 4);
            ctx.restore();

            if (this.isCharging) {
                const duration = Math.min(Date.now() - this.chargeStart, MAX_CHARGE_TIME);
                const width = (duration / MAX_CHARGE_TIME) * this.width;
                chargeIndicator.style.display = 'block';
                chargeIndicator.style.left = (this.x) + 'px';
                chargeIndicator.style.top = (this.y - 15) + 'px';
                chargeIndicator.style.width = width + 'px';
            } else {
                chargeIndicator.style.display = 'none';
            }
        }
    };

    let obstacles = [];
    let items = [];

    class Obstacle {
        constructor() {
            this.x = canvas.width + 100;
            const rand = Math.random();
            // 레벨에 따른 높이 증가 (최대 점프력은 약 190px, 장애물은 최대 85px로 제한하여 여유 확보)
            const heightMultiplier = Math.min(1.8, 1 + (currentLevel * 0.15));

            if (rand > 0.4) {
                this.type = 'CACTUS';
                this.width = 25;
                this.height = (35 + Math.random() * 10) * heightMultiplier;
            } else {
                this.type = 'BUSH';
                this.width = 45;
                this.height = 20 * heightMultiplier;
            }
            this.y = canvas.height - this.height - 10;
        }
        update() { this.x -= gameSpeed; }
        draw() {
            ctx.fillStyle = '#535353';
            if (this.type === 'CACTUS') {
                ctx.fillRect(this.x + (this.width/3), this.y, (this.width/3), this.height);
                ctx.fillRect(this.x, this.y + 10, 5, 12);
                ctx.fillRect(this.x + this.width - 5, this.y + 5, 5, 12);
                ctx.fillRect(this.x, this.y + 22, this.width, 3);
            } else {
                ctx.fillRect(this.x, this.y + 5, this.width, this.height - 5);
                ctx.fillRect(this.x + 10, this.y, this.width - 20, 5);
            }
        }
    }

    class HeartItem {
        constructor() {
            this.width = 24;
            this.height = 24;
            this.x = canvas.width + 100;
            // 평지(지면 바로 위)에 나타나도록 설정
            this.y = canvas.height - 35;
        }
        update() { this.x -= gameSpeed; }
        draw() {
            ctx.font = '24px Arial';
            ctx.fillText('❤️', this.x, this.y);
        }
    }

    function updateHeartUI() {
        heartContainer.innerHTML = '';
        for (let i = 0; i < dino.hp; i++) {
            const h = document.createElement('div');
            h.className = 'heart';
            heartContainer.appendChild(h);
        }
    }

    function initGame() {
        dino.hp = 3;
        dino.y = dino.groundY;
        dino.vy = 0;
        dino.isJumping = false;
        dino.isCharging = false;
        dino.invincibleUntil = 0;
        obstacles = [];
        items = [];
        score = 0;
        lastLevelUpScore = 0;
        currentLevel = 0;
        gameSpeed = INITIAL_SPEED;
        frames = 0;
        lastRecoveryFrame = 0;
        updateHeartUI();
        messageBox.style.display = 'none';
        levelUpToast.style.display = 'none';
        gameState = 'PLAYING';
    }

    function handleGameOver() {
        gameState = 'GAMEOVER';
        playBeep(120, 0.4, 'sawtooth');
        if (score > highScore) highScore = score;
        msgTitle.innerText = "GAME OVER";
        msgBody.innerHTML = `SCORE: ${Math.floor(score).toString().padStart(5, '0')}<br>HI-SCORE: ${Math.floor(highScore).toString().padStart(5, '0')}`;
        startBtn.innerText = "RETRY";
        messageBox.style.display = 'block';
    }

    function update() {
        if (gameState !== 'PLAYING') return;

        frames++;
        score += 0.15;

        // 레벨업 및 가속/장애물 성장
        if (score >= lastLevelUpScore + MILESTONE_SCORE) {
            lastLevelUpScore = Math.floor(score / MILESTONE_SCORE) * MILESTONE_SCORE;
            currentLevel++;
            gameSpeed = Math.min(MAX_SPEED, gameSpeed + SPEED_BOOST);
            playLevelUpSound();

            levelUpToast.innerText = `LEVEL ${currentLevel} UP!`;
            levelUpToast.style.display = 'block';
            setTimeout(() => { levelUpToast.style.display = 'none'; }, 2000);
        }

        dino.vy += GRAVITY;
        dino.y += dino.vy;

        if (dino.y > dino.groundY) {
            dino.y = dino.groundY;
            dino.vy = 0;
            dino.isJumping = false;
        }

        // 장애물 생성
        const currentGap = MIN_OBSTACLE_GAP + (gameSpeed * 12);
        if (obstacles.length === 0 || (canvas.width - obstacles[obstacles.length-1].x > currentGap)) {
            if (Math.random() < 0.035) obstacles.push(new Obstacle());
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
            const obs = obstacles[i];
            obs.update();
            const hb = { x: dino.x + 12, y: dino.y + 8, width: dino.width - 24, height: dino.height - 12 };
            if (obs.x < hb.x + hb.width && obs.x + obs.width > hb.x &&
                obs.y < hb.y + hb.height && obs.y + obs.height > hb.y) {
                if (Date.now() > dino.invincibleUntil) {
                    dino.hp--;
                    dino.invincibleUntil = Date.now() + INVINCIBLE_DURATION;
                    playBeep(200, 0.1, 'sine');
                    updateHeartUI();
                    if (dino.hp <= 0) {
                        handleGameOver();
                        return;
                    }
                }
            }
            if (obs.x + obs.width < -100) obstacles.splice(i, 1);
        }

        // 회복 아이템 (지면에 생성)
        if (frames - lastRecoveryFrame > 4500 && Math.random() < 0.005) {
            items.push(new HeartItem());
            lastRecoveryFrame = frames;
        }

        for (let i = items.length - 1; i >= 0; i--) {
            const item = items[i];
            item.update();
            // 충돌 판정 (Y축 범위 넓게 설정하여 획득하기 쉽게)
            if (item.x < dino.x + dino.width && item.x + item.width > dino.x &&
                item.y - 30 < dino.y + dino.height && item.y + 10 > dino.y) {
                if (dino.hp < 5) {
                    dino.hp++;
                    playBeep(600, 0.1, 'sine');
                    updateHeartUI();
                }
                items.splice(i, 1);
            } else if (item.x + item.width < -100) {
                items.splice(i, 1);
            }
        }

        const s = Math.floor(score).toString().padStart(5, '0');
        const h = Math.floor(highScore).toString().padStart(5, '0');
        scoreDisplay.innerText = `HI ${h} ${s}`;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = '#535353';
        ctx.setLineDash([2, 4]);
        ctx.beginPath();
        ctx.moveTo(0, canvas.height - 10);
        ctx.lineTo(canvas.width, canvas.height - 10);
        ctx.stroke();
        ctx.setLineDash([]);

        dino.draw();
        obstacles.forEach(o => o.draw());
        items.forEach(it => it.draw());

        if (gameState === 'PLAYING') {
            update();
            requestAnimationFrame(draw);
        }
    }

    // 입력 처리
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && gameState === 'PLAYING') {
            if (!dino.isJumping && !dino.isCharging) {
                dino.isCharging = true;
                dino.chargeStart = Date.now();
            }
        }
    });

    window.addEventListener('keyup', (e) => {
        if (e.code === 'Space' && gameState === 'PLAYING') {
            if (dino.isCharging) {
                const duration = Math.min(Date.now() - dino.chargeStart, MAX_CHARGE_TIME);
                const jumpForce = MIN_JUMP_FORCE + (duration / MAX_CHARGE_TIME) * (MAX_JUMP_FORCE - MIN_JUMP_FORCE);
                dino.vy = -jumpForce;
                dino.isJumping = true;
                dino.isCharging = false;
                playBeep(350, 0.05, 'sine');
            }
        }
    });

    startBtn.addEventListener('click', () => {
        initGame();
        draw();
    });

    window.onload = () => {
        messageBox.style.display = 'block';
        dino.y = dino.groundY;
        draw();
    };
</script>
</body>
</html>
