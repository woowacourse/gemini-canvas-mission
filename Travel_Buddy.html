<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>해외 출국 가이드 - 트래블 버디</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');

        :root {
            --primary: #2563eb;
            --secondary: #64748b;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
        }

        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .tab-content { display: none; opacity: 0; transform: translateY(10px); transition: all 0.3s ease; }
        .tab-content.active { display: block; opacity: 1; transform: translateY(0); }

        .card-gradient {
            background: linear-gradient(135deg, rgba(255,255,255,1) 0%, rgba(248,250,252,1) 100%);
        }

        .checkbox-custom {
            appearance: none;
            width: 1.25rem;
            height: 1.25rem;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }

        .checkbox-custom:checked {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .checkbox-custom:checked::after {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            color: white;
            font-size: 0.75rem;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .checkbox-custom:checked + label {
            text-decoration: line-through;
            color: #94a3b8;
        }

        .nav-btn.active {
            color: var(--primary);
            background-color: #eff6ff;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen pb-24">

<!-- Header -->
<header class="sticky top-0 z-50 glass border-b border-slate-200 px-6 py-4">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
        <h1 class="text-2xl font-black text-blue-600 tracking-tight flex items-center gap-2 cursor-pointer" onclick="showTab('explore')">
            <i class="fa-solid fa-paper-plane"></i>
            TRAVEL BUDDY
        </h1>
        <nav class="flex bg-slate-100 p-1 rounded-2xl">
            <button onclick="showTab('explore')" id="nav-explore" class="nav-btn active px-5 py-2 rounded-xl text-sm font-bold transition flex items-center gap-2">
                <i class="fa-solid fa-compass text-lg"></i> 탐색
            </button>
            <button onclick="showTab('mypage')" id="nav-mypage" class="nav-btn px-5 py-2 rounded-xl text-sm font-bold transition flex items-center gap-2 relative">
                <i class="fa-solid fa-list-check text-lg"></i> 마이페이지
                <span id="list-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full hidden border-2 border-white">0</span>
            </button>
        </nav>
    </div>
</header>

<!-- Main Content -->
<main class="max-w-5xl mx-auto p-6">

    <!-- Tab: Explore -->
    <section id="explore" class="tab-content active space-y-8">
        <div class="bg-blue-600 rounded-[2rem] p-8 text-white shadow-xl shadow-blue-200 relative overflow-hidden">
            <div class="relative z-10">
                <h2 class="text-3xl font-bold mb-2">어디로 떠나시나요?</h2>
                <p class="text-blue-100 opacity-90">인천공항 팁부터 전세계 국가별 입국 정보를 완벽 정리했습니다.</p>
            </div>
            <i class="fa-solid fa-earth-americas absolute -bottom-10 -right-10 text-[12rem] opacity-10 rotate-12"></i>
        </div>

        <div id="destinations-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Destinations injected here -->
        </div>
    </section>

    <!-- Tab: My Page -->
    <section id="mypage" class="tab-content space-y-8">
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 border-b border-slate-200 pb-6">
            <div>
                <h2 class="text-3xl font-bold text-slate-800">준비 현황</h2>
                <p class="text-slate-500 mt-1">추가한 도시의 체크리스트를 관리하세요.</p>
            </div>
            <div class="bg-white px-4 py-2 rounded-2xl border border-slate-200 shadow-sm inline-flex items-center gap-2">
                <span class="text-sm text-slate-500">전체 준비 완료:</span>
                <span id="overall-progress" class="font-bold text-blue-600">0%</span>
            </div>
        </div>

        <div id="my-lists-container" class="space-y-8">
            <!-- Checklist content -->
        </div>
    </section>

</main>

<!-- Info Modal -->
<div id="info-modal" class="fixed inset-0 bg-slate-900/60 z-[100] hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-[2.5rem] max-w-xl w-full p-8 shadow-2xl relative animate-in fade-in zoom-in duration-300">
        <button onclick="closeModal()" class="absolute top-6 right-6 w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center text-slate-500 hover:bg-red-50 hover:text-red-500 transition">
            <i class="fa-solid fa-xmark text-lg"></i>
        </button>

        <div id="modal-body">
            <div class="flex items-center gap-4 mb-6">
                <!-- 아이콘 박스를 제거하고 이모지가 직접 들어갈 자리 -->
                <div id="modal-emoji-display" class="w-16 h-16 bg-slate-50 rounded-2xl flex items-center justify-center text-4xl shadow-sm border border-slate-100">
                    <!-- Emoji injected here -->
                </div>
                <div>
                    <h3 id="modal-title" class="text-2xl font-bold text-slate-800">상세 가이드</h3>
                    <p id="modal-subtitle" class="text-sm text-slate-400">필수 정보 및 에티켓 가이드</p>
                </div>
            </div>

            <div id="modal-loading" class="hidden py-16 text-center">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto"></div>
                <p class="mt-4 text-slate-500 font-medium italic">AI가 추천 정보를 생성하고 있습니다...</p>
            </div>

            <div id="modal-content" class="max-h-[50vh] overflow-y-auto pr-2 space-y-6">
                <!-- Content injected here -->
            </div>

            <div class="mt-8 pt-6 border-t border-slate-100">
                <button onclick="closeModal()" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold hover:bg-slate-800 transition active:scale-[0.98]">
                    가이드 닫기
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    const apiKey = "";

    const destinations = [
        {
            id: "korea_common",
            name: "한국 출국 (인천공항)",
            emoji: "🇰🇷",
            essentials: ["IC여권 (유효기간 6개월 이상)", "스마트패스(SmartPass) 앱 등록", "공항철도/버스 예약", "여행자보험 가입 증명서", "인천공항 주차 예약", "Q-CODE(귀국 시 필요)"],
            warnings: ["스마트패스 전용 라인 이용", "액체류 100ml 이하 지퍼백 보관", "보조배터리/라이터는 위탁 불가", "자동출입국심사 등록 확인"],

        },

            warnings: ["VJW 면세 QR 미리 캡처", "식당 예약 시 노쇼 절대 금지", "대중교통 이용 시 좌측 통행", "일부 상점 현금만 가능", "길거리 흡연 엄격 금지"],
            color: "from-red-50 to-red-100",
            iconColor: "text-red-600",
            landmark: "fa-torii-gate"
        },
        {
            id: "taiwan",
            name: "대만",
            emoji: "🇹🇼",
            essentials: ["온라인 입국신고서 작성", "이지카드(교통카드) 예약", "대만 유심/eSIM", "110v 어댑터", "휴대용 우산 (날씨 변덕)"],
            warnings: ["지하철 내 음식물 섭취 엄금", "전자담배 반입 절대 금지", "대중교통 노약자석 비워두기", "전압 110v 확인"],
            color: "from-pink-50 to-pink-100",
            iconColor: "text-pink-600",
            landmark: "fa-temple"
        },
        {
            id: "hongkong",
            name: "홍콩",
            emoji: "🇭🇰",
            essentials: ["입국신고서 (기내작성)", "옥토퍼스 카드 (교통/결제)", "홍콩 유심/eSIM", "BF형 멀티어댑터 (삼각발)", "현금(다이파이동 등 대비)"],
            warnings: ["실내 냉방 매우 강함 (긴팔 필수)", "비닐봉투 유료화 엄격", "식당 합석 문화 자연스러움", "식사 전 찻물로 식기 세척 관습"],
            color: "from-red-100 to-orange-100",
            iconColor: "text-red-700",

        },
        {
            id: "vietnam_danang",
            name: "베트남",
            emoji: "🇻🇳",
            essentials: ["그랩(Grab) 앱 카드 연동", "샤워기 필터 (필수)", "트레블월렛/로그 카드", "동(VND) 환전", "모기 기피제"],
            warnings: ["얼음/길거리 음식 위생 주의", "공항 픽업 사기 주의", "고수 빼기 문구 준비", "오토바이 날치기 주의 (스마트폰)"],
            color: "from-yellow-100 to-red-50",
            iconColor: "text-yellow-600",
            landmark: "fa-leaf"
        },
        {
            id: "thailand",
            name: "태국",
            emoji: "🇹🇭",
            essentials: ["GLN(QR 결제) 설정", "왕궁 방문용 단정한 복장", "모기 기피제/상비약", "트레블월렛 카드", "샤워기 필터"],
            warnings: ["왕실 모독 절대 금지(징역)", "전자담배 반입 금지", "머리 만지는 행위 실례", "툭툭 비용 사전 흥정"],
            color: "from-yellow-50 to-yellow-100",
            iconColor: "text-yellow-600",
            landmark: "fa-landmark"
        },
        {
            id: "usa",
            name: "미국",
            emoji: "🇺🇸",
            essentials: ["ESTA(전자비자) 승인", "영문 숙소 주소/전화번호", "국제운전면허증 (렌터카 시)", "110v 어댑터", "팁 지불용 소액 달러"],
            warnings: ["식당 팁(15-20%) 필수 문화", "육류 성분 라면 반입 주의", "공항 보안검색 매우 엄격", "대마 관련 식품 절대 주의"],
            color: "from-blue-50 to-blue-100",
            iconColor: "text-blue-600",
            landmark: "fa-monument"
        },
        {
            id: "uk",
            name: "영국",
            emoji: "🇬🇧",
            essentials: ["컨택리스 신용카드 (교통)", "BF형 멀티어댑터 (3구)", "우산 또는 후드집업", "런던 오이스터 카드 (선택)", "유로 아닌 파운드 환전"],
            warnings: ["무단횡단이 일상적이나 주의", "식당 도시세/봉사료 포함 여부 확인", "지하철(Tube) 내 신호 안터짐", "박물관 사전 예약 권장"],
            color: "from-blue-100 to-red-100",
            iconColor: "text-blue-800",
            landmark: "fa-clock"
        },
        {
            id: "spain",
            name: "스페인",
            emoji: "🇪🇸",
            essentials: ["소매치기 방지 와이어/링", "유로(EUR) 환전", "선글라스/자외선차단제", "구글 맵 오프라인 저장", "트레블월렛"],
            warnings: ["식당 식전 빵/물 유료 확인", "시에스타(낮잠시간) 영업 확인", "소매치기 극심 (가방은 항상 앞으로)", "야간 축제 인파 속 소지품 주의"],
            color: "from-yellow-100 to-red-100",
            iconColor: "text-red-500",
            landmark: "fa-guitar"
        }
    ];

    let myChecklists = JSON.parse(localStorage.getItem('myChecklists')) || [];

    window.onload = () => {
        renderDestinations();
        renderMyLists();
        updateBadge();
        updateProgress();
    };

    function showTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));

        document.getElementById(tabId).classList.add('active');
        document.getElementById(`nav-${tabId}`).classList.add('active');
        window.scrollTo(0, 0);
    }

    function renderDestinations() {
        const grid = document.getElementById('destinations-grid');
        grid.innerHTML = destinations.map(dest => `
            <div class="card-gradient p-8 rounded-[2rem] border border-white shadow-sm flex flex-col justify-between transition-all hover:shadow-xl hover:-translate-y-1">
                <div>
                    <div class="flex justify-between items-start mb-6">
                        <span class="text-5xl">${dest.emoji}</span>
                        <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm">
                            <i class="fa-solid fa-location-dot ${dest.iconColor}"></i>
                        </div>
                    </div>
                    <h3 class="text-2xl font-bold text-slate-800 mb-3">${dest.name}</h3>
                    <div class="space-y-3 mb-8">
                        <div class="flex items-center gap-2 text-xs font-bold text-slate-400 uppercase tracking-widest">
                            <span class="w-2 h-2 rounded-full bg-blue-500"></span> 핵심 가이드
                        </div>
                        <ul class="text-sm text-slate-600 space-y-2">
                            ${dest.essentials.slice(0, 3).map(item => `<li class="flex items-start gap-2"><i class="fa-solid fa-check text-blue-500 mt-0.5"></i> ${item}</li>`).join('')}
                        </ul>
                    </div>
                </div>
                <div class="space-y-3">
                    <button onclick="showDetails('${dest.id}')" class="w-full py-3 text-slate-500 text-sm font-bold hover:text-blue-600 transition flex items-center justify-center gap-2">
                         가이드 상세보기 <i class="fa-solid fa-chevron-right text-[10px]"></i>
                    </button>
                    <button onclick="addToMyList('${dest.id}')" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold hover:bg-blue-600 transition shadow-lg shadow-slate-200 active:scale-[0.98]">
                        리스트에 추가
                    </button>
                </div>
            </div>
        `).join('');
    }

    function showDetails(destId) {
        const dest = destinations.find(d => d.id === destId);
        const modal = document.getElementById('info-modal');
        const title = document.getElementById('modal-title');
        const subtitle = document.getElementById('modal-subtitle');
        const emojiBox = document.getElementById('modal-emoji-display');
        const content = document.getElementById('modal-content');

        // 왼쪽 박스에 이모지 표시
        emojiBox.innerText = dest.emoji;

        // 제목 설정 (옆의 이모지 제거)
        title.innerText = `${dest.name} 상세 가이드`;
        subtitle.innerText = "필수 정보 및 에티켓 가이드";

        // 콘텐츠 구성
        content.innerHTML = `
            <div class="space-y-8 py-2">
                <section>
                    <h4 class="text-lg font-bold text-blue-600 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-clipboard-list"></i> 필수 서류 및 준비물
                    </h4>
                    <div class="grid grid-cols-1 gap-2">
                        ${dest.essentials.map(item => `
                            <div class="bg-slate-50 p-4 rounded-xl text-sm font-medium border border-slate-100 flex items-center gap-3">
                                <i class="fa-solid fa-circle-check text-blue-400"></i> ${item}
                            </div>
                        `).join('')}
                    </div>
                </section>

                <section>
                    <h4 class="text-lg font-bold text-orange-600 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-triangle-exclamation"></i> 현지 주의사항 & 에티켓
                    </h4>
                    <div class="space-y-3">
                        ${dest.warnings.map(item => `
                            <div class="flex gap-3 p-4 bg-orange-50/50 rounded-xl border border-orange-100">
                                <i class="fa-solid fa-circle-info text-orange-400 mt-1"></i>
                                <p class="text-sm text-slate-700 leading-relaxed font-medium">${item}</p>
                            </div>
                        `).join('')}
                    </div>
                </section>
            </div>
        `;

        modal.classList.remove('hidden');
    }

    function addToMyList(destId) {
        if (myChecklists.some(item => item.id === destId)) {
            showTab('mypage');
            return;
        }
        const destination = destinations.find(d => d.id === destId);
        const newList = {
            ...destination,
            items: [
                ...destination.essentials.map(text => ({ text, checked: false, type: 'essential' })),
                ...destination.warnings.map(text => ({ text, checked: false, type: 'warning' }))
            ]
        };
        myChecklists.push(newList);
        saveData();
        renderMyLists();
        updateBadge();
        updateProgress();
        showTab('mypage');
    }

    function toggleItem(destId, index) {
        const list = myChecklists.find(l => l.id === destId);
        if (list) {
            list.items[index].checked = !list.items[index].checked;
            saveData();
            updateProgress();
            renderMyLists();
        }
    }

    function removeDestination(destId) {
        myChecklists = myChecklists.filter(l => l.id !== destId);
        saveData();
        renderMyLists();
        updateBadge();
        updateProgress();
    }

    function renderMyLists() {
        const container = document.getElementById('my-lists-container');

        if (myChecklists.length === 0) {
            container.innerHTML = `
                <div class="text-center py-24 bg-white rounded-[3rem] border-2 border-dashed border-slate-200">
                    <div class="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-6">
                        <i class="fa-solid fa-suitcase-rolling text-4xl text-slate-300"></i>
                    </div>
                    <h3 class="text-xl font-bold text-slate-800">텅 비어있어요</h3>
                    <p class="text-slate-400 mt-2">탐색 탭에서 여행지를 추가해보세요.</p>
                    <button onclick="showTab('explore')" class="mt-8 px-8 py-3 bg-blue-600 text-white rounded-2xl font-bold shadow-lg shadow-blue-100">도시 추가하기</button>
                </div>
            `;
            return;
        }

        container.innerHTML = myChecklists.map(list => {
            const total = list.items.length;
            const checked = list.items.filter(i => i.checked).length;
            const percent = Math.round((checked / total) * 100);

            return `
                <div class="bg-white rounded-[2.5rem] shadow-xl shadow-slate-200/50 border border-slate-100 overflow-hidden">
                    <div class="p-8 border-b border-slate-50 flex flex-wrap justify-between items-center gap-4 bg-slate-50/30">
                        <div class="flex items-center gap-4">
                            <span class="text-4xl">${list.emoji}</span>
                            <div>
                                <h3 class="text-xl font-bold text-slate-800">${list.name} 준비 체크</h3>
                                <div class="flex items-center gap-2 mt-1">
                                    <div class="w-32 h-1.5 bg-slate-200 rounded-full overflow-hidden">
                                        <div class="h-full bg-blue-500 transition-all duration-500" style="width: ${percent}%"></div>
                                    </div>
                                    <span class="text-[10px] font-bold text-blue-500">${percent}%</span>
                                </div>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="recommendSouvenir('${list.name}')" class="px-5 py-2.5 bg-blue-600 text-white rounded-xl text-sm font-bold shadow-md hover:bg-blue-700 transition flex items-center gap-2">
                                <i class="fa-solid fa-gift"></i> AI 선물추천
                            </button>
                            <button onclick="removeDestination('${list.id}')" class="w-10 h-10 bg-white border border-slate-200 text-slate-400 hover:text-red-500 rounded-xl transition flex items-center justify-center shadow-sm">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                    <div class="p-8">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div class="space-y-4">
                                <p class="text-xs font-black text-blue-500 uppercase tracking-widest flex items-center gap-2">
                                    <i class="fa-solid fa-passport"></i> Essential Items
                                </p>
                                <div class="space-y-3">
                                    ${list.items.filter(i => i.type === 'essential').map((item) => {
                                        const originalIdx = list.items.indexOf(item);
                                        return `
                                            <div class="flex items-center gap-3 p-3 hover:bg-slate-50 rounded-xl transition">
                                                <input type="checkbox" id="item-${list.id}-${originalIdx}"
                                                    class="checkbox-custom"
                                                    ${item.checked ? 'checked' : ''}
                                                    onchange="toggleItem('${list.id}', ${originalIdx})">
                                                <label for="item-${list.id}-${originalIdx}" class="text-sm font-medium text-slate-700 cursor-pointer select-none">${item.text}</label>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                            <div class="space-y-4">
                                <p class="text-xs font-black text-orange-500 uppercase tracking-widest flex items-center gap-2">
                                    <i class="fa-solid fa-lightbulb"></i> Travel Tips
                                </p>
                                <div class="space-y-3">
                                    ${list.items.filter(i => i.type === 'warning').map((item) => {
                                        const originalIdx = list.items.indexOf(item);
                                        return `
                                            <div class="flex items-center gap-3 p-3 hover:bg-slate-50 rounded-xl transition">
                                                <input type="checkbox" id="warn-${list.id}-${originalIdx}"
                                                    class="checkbox-custom border-orange-200"
                                                    ${item.checked ? 'checked' : ''}
                                                    onchange="toggleItem('${list.id}', ${originalIdx})">
                                                <label for="warn-${list.id}-${originalIdx}" class="text-sm font-medium text-slate-700 cursor-pointer select-none italic">${item.text}</label>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function updateProgress() {
        if (myChecklists.length === 0) {
            const pd = document.getElementById('overall-progress');
            if (pd) pd.innerText = `0%`;
            return;
        }
        const allItems = myChecklists.flatMap(l => l.items);
        const total = allItems.length;
        const checked = allItems.filter(i => i.checked).length;
        const percent = total > 0 ? Math.round((checked / total) * 100) : 0;
        document.getElementById('overall-progress').innerText = `${percent}%`;
    }

    function updateBadge() {
        const badge = document.getElementById('list-badge');
        const count = myChecklists.length;
        if (count > 0) {
            badge.innerText = count;
            badge.classList.remove('hidden');
        } else {
            badge.classList.add('hidden');
        }
    }

    function saveData() {
        localStorage.setItem('myChecklists', JSON.stringify(myChecklists));
    }

    function closeModal() {
        document.getElementById('info-modal').classList.add('hidden');
    }

    async function recommendSouvenir(country) {
        const modal = document.getElementById('info-modal');
        const loading = document.getElementById('modal-loading');
        const result = document.getElementById('modal-content');
        const title = document.getElementById('modal-title');
        const subtitle = document.getElementById('modal-subtitle');
        const emojiBox = document.getElementById('modal-emoji-display');

        const dest = destinations.find(d => d.name === country) || { emoji: "🎁" };

        emojiBox.innerText = dest.emoji;
        title.innerText = `${country} 추천 기념품`;
        subtitle.innerText = "AI가 추천하는 필수 쇼핑 리스트";

        modal.classList.remove('hidden');
        loading.classList.remove('hidden');
        result.classList.add('hidden');
        result.innerHTML = '';

        const prompt = `${country} 여행 시 꼭 사와야 할 기념품 3~5가지를 추천해주세요.`;

        try {
            const response = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                })
            });

            const data = await response.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "정보를 가져오지 못했습니다.";

            loading.classList.add('hidden');
            result.classList.remove('hidden');
            result.innerText = text;

        } catch (error) {
            loading.classList.add('hidden');
            result.classList.remove('hidden');
            result.innerText = "연결이 원활하지 않습니다.";
        }
    }

    async function fetchWithRetry(url, options, retries = 5, backoff = 1000) {
        try {
            const response = await fetch(url, options);
            if (!response.ok) throw new Error('API request failed');
            return response;
        } catch (err) {
            if (retries <= 0) throw err;
            await new Promise(resolve => setTimeout(resolve, backoff));
            return fetchWithRetry(url, options, retries - 1, backoff * 2);
        }
    }
</script>
</body>
</html>
