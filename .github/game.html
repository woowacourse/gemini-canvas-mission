<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5초 준다! - 보드게임</title>
    <style>
        /* 웹 폰트 적용 (Noto Sans KR) */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

        body {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          font-family: 'Noto Sans KR', sans-serif;
          background-color: #F8F9FA;
          color: #212529;
          display: flex;
          flex-direction: column;
          height: 100vh;
          overflow: hidden;
        }

        .hidden {
          display: none !important;
        }

        /* ==========================================
           게임 준비 화면 (Setup UI)
           ========================================== */
        .setup-container {
          flex: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 2rem;
          width: 100%;
          box-sizing: border-box;
        }

        .setup-card {
          background: #FFFFFF;
          padding: 3rem 4rem;
          border-radius: 24px;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
          display: flex;
          flex-direction: column;
          align-items: center;
          max-width: 1100px;
          width: 100%;
        }

        .setup-title-row {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 12px;
          font-size: 3rem;
          font-weight: 800;
          margin-bottom: 1.5rem;
          color: #212529;
        }

        .setup-timer-input {
          font-size: 3rem;
          font-weight: 800;
          width: 90px;
          text-align: center;
          border: 2px solid #DEE2E6;
          border-radius: 12px;
          color: #FF6B6B;
          background-color: #FFFFFF;
          outline: none;
          font-family: inherit;
          transition: border-color 0.2s;
        }

        .setup-timer-input:focus {
          border-color: #339AF0;
        }

        .setup-options-container {
          display: flex;
          justify-content: center;
          flex-wrap: wrap;
          gap: 3rem;
          background-color: #F8F9FA;
          padding: 1.5rem 3rem;
          border-radius: 16px;
          margin-bottom: 2.5rem;
          border: 1px solid #E9ECEF;
        }

        .setup-option-group {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 10px;
        }

        .setup-option-label {
          font-size: 1rem;
          font-weight: 700;
          color: #868E96;
        }

        .setup-option-controls {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 12px;
        }

        .ctrl-btn {
          width: 36px;
          height: 36px;
          font-size: 1.2rem;
          font-weight: 700;
          color: #495057;
          background-color: #F1F3F5;
          border: none;
          border-radius: 8px;
          cursor: pointer;
          display: flex;
          align-items: center;
          justify-content: center;
          transition: background-color 0.2s, transform 0.1s, opacity 0.2s;
        }

        .ctrl-btn:hover:not(:disabled) {
          background-color: #E9ECEF;
        }

        .ctrl-btn:active:not(:disabled) {
          transform: scale(0.95);
          background-color: #DEE2E6;
        }

        .ctrl-btn:disabled {
          opacity: 0.3;
          cursor: not-allowed;
        }

        .setup-val-input {
          font-size: 1.2rem;
          font-weight: 700;
          width: 80px;
          text-align: center;
          border: none;
          background-color: transparent;
          outline: none;
          font-family: inherit;
          color: #212529;
        }

        .player-names-grid {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          align-content: flex-start;
          gap: 12px;
          width: 100%;
          height: 220px;
          overflow-y: auto;
          padding: 4px 10px;
        }

        .player-names-grid::-webkit-scrollbar {
          width: 6px;
        }
        .player-names-grid::-webkit-scrollbar-thumb {
          background-color: #CED4DA;
          border-radius: 3px;
        }

        .player-input-wrapper {
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          background: #F8F9FA;
          padding: 10px 14px;
          border: 1px solid #E9ECEF;
          border-radius: 12px;
          flex: 1 1 140px;
          max-width: 180px;
          transition: border-color 0.2s, box-shadow 0.2s;
        }

        .player-input-wrapper:focus-within {
          border-color: #339AF0;
          box-shadow: 0 0 0 3px rgba(51, 154, 240, 0.1);
        }

        .player-input-label {
          font-size: 0.85rem;
          color: #868E96;
          margin-bottom: 4px;
          font-weight: 600;
        }

        .player-name-input {
          width: 100%;
          font-size: 1.1rem;
          padding: 4px 0;
          border: none;
          border-bottom: 2px solid transparent;
          background: transparent;
          outline: none;
          text-align: left;
          font-family: inherit;
          font-weight: 700;
          color: #343A40;
          box-sizing: border-box;
          transition: border-color 0.2s;
        }

        .player-name-input:focus {
          border-bottom-color: #339AF0;
        }

        .setup-message {
          margin-top: 2rem;
          padding-top: 2rem;
          border-top: 2px dashed #E9ECEF;
          width: 100%;
          font-size: 1.6rem;
          font-weight: 700;
          color: #339AF0;
          text-align: center;
          white-space: pre-line;
          line-height: 1.4;
        }

        /* ==========================================
           게임 메인 래퍼 (좌측 스코어보드 + 우측 게임보드)
           ========================================== */
        .game-main-wrapper {
          flex: 1;
          display: flex;
          flex-direction: row;
          width: 100%;
          overflow: hidden;
        }

        /* ==========================================
           좌측 스코어보드 영역
           ========================================== */
        .scoreboard {
          width: 220px;
          background-color: transparent;
          border-right: none;
          padding: 2rem 1rem 2rem 2rem;
          display: flex;
          flex-direction: column;
          box-shadow: none;
          z-index: 5;
        }

        .scoreboard-title {
          font-size: 1.2rem;
          font-weight: 700;
          color: #ADB5BD;
          margin: 0 0 1rem 0;
          text-align: left;
          padding-bottom: 0.5rem;
          border-bottom: 2px solid #E9ECEF;
        }

        .score-list {
          list-style: none;
          padding: 0;
          margin: 0;
          display: flex;
          flex-direction: column;
          gap: 6px;
          overflow-y: auto;
          padding-right: 5px;
          flex: 1;
        }

        .score-list::-webkit-scrollbar {
          width: 4px;
        }
        .score-list::-webkit-scrollbar-thumb {
          background-color: #DEE2E6;
          border-radius: 2px;
        }

        .score-item {
          display: flex;
          justify-content: space-between;
          align-items: center;
          background-color: transparent;
          padding: 8px 12px;
          border-radius: 10px;
          border-left: 3px solid transparent;
          transition: all 0.2s;
        }

        .score-item.active {
          background-color: #FFFFFF;
          border-left-color: #339AF0;
          box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
          transform: translateX(4px);
        }

        .score-name-wrapper {
          display: flex;
          align-items: center;
          max-width: 70%;
        }

        .score-name {
          font-size: 1rem;
          font-weight: 600;
          color: #868E96;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        .score-value {
          font-size: 1.05rem;
          font-weight: 700;
          color: #ADB5BD;
        }

        .score-item.active .score-name {
          font-weight: 800;
          color: #343A40;
        }

        .score-item.active .score-value {
          font-weight: 900;
          color: #339AF0;
        }

        /* ==========================================
           우측 게임 진행 화면 (Game UI)
           ========================================== */
        .game-board {
          flex: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 0 3rem 8vh 3rem;
          position: relative;
        }

        .prompt-area {
          font-size: 5rem;
          font-weight: 900;
          text-align: center;
          color: #212529;
          word-break: keep-all;
          margin-bottom: 2rem;
          white-space: pre-line;
          line-height: 1.3;
          text-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
        }

        .timer {
          display: inline-flex;
          align-items: baseline;
          justify-content: center;
          font-size: 2.5rem;
          font-weight: 900;
          color: #FA5252;
          background-color: #FFF5F5;
          padding: 8px 30px;
          border-radius: 50px;
          border: 2px solid #FFE3E3;
          margin-bottom: 2.5rem;
          box-shadow: 0 8px 16px rgba(250, 82, 82, 0.1);
          font-variant-numeric: tabular-nums;
        }

        .timer::after {
          content: '초';
          font-size: 1.4rem;
          font-weight: 700;
          margin-left: 6px;
          color: #FFA8A8;
        }

        .word-grid {
          display: flex;
          justify-content: center;
          flex-wrap: wrap;
          gap: 15px;
          min-height: 60px;
          width: 100%;
          max-width: 900px;
        }

        .word-card {
          background-color: #FFFFFF;
          padding: 10px 24px;
          border-radius: 14px;
          border: 1px solid #E9ECEF;
          font-size: 1.6rem;
          font-weight: 700;
          color: #495057;
          box-shadow: 0 6px 15px rgba(0, 0, 0, 0.04);
          animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
          0% { transform: scale(0.5); opacity: 0; }
          100% { transform: scale(1); opacity: 1; }
        }

        /* ==========================================
           하단 입력창 영역
           ========================================== */
        .input-section {
          position: relative;
          width: 100%;
          padding: 4vh 0 5vh 0;
          background-color: #FFFFFF;
          display: flex;
          justify-content: center;
          border-top: 1px solid #E9ECEF;
          box-shadow: 0 -4px 20px rgba(0,0,0,0.03);
          z-index: 10;
        }

        .duplicate-warning {
          position: absolute;
          top: 0;
          left: 50%;
          transform: translate(-50%, 10px);
          background-color: #343A40;
          color: #FFFFFF;
          padding: 12px 28px;
          border-radius: 30px;
          font-size: 1.4rem;
          font-weight: 700;
          box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
          opacity: 0;
          visibility: hidden;
          transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
          pointer-events: none;
          z-index: 20;
        }

        .duplicate-warning.show {
          opacity: 1;
          visibility: visible;
          transform: translate(-50%, -50%);
        }

        .word-input {
          width: 70%;
          max-width: 900px;
          font-size: 2.8rem;
          font-weight: 800;
          text-align: center;
          padding: 24px 32px;
          border: 3px solid #DEE2E6;
          border-radius: 24px;
          outline: none;
          background-color: #F8F9FA;
          color: #212529;
          transition: all 0.2s ease-in-out;
        }

        .word-input:focus {
          background-color: #FFFFFF;
          border-color: #339AF0;
          box-shadow: 0 10px 25px rgba(51, 154, 240, 0.15);
          transform: translateY(-3px);
        }

        .word-input:disabled {
          background-color: #E9ECEF;
          border-color: #E9ECEF;
          color: #ADB5BD;
        }

        .word-input::placeholder {
          color: #CED4DA;
          font-weight: 600;
        }

        /* ==========================================
           모달 (Modals)
           ========================================== */
        .modal-overlay {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          background-color: rgba(33, 37, 41, 0.85);
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 1000;
          backdrop-filter: blur(4px);
        }

        .modal-content {
          background-color: #FFFFFF;
          padding: 3rem 4rem;
          border-radius: 24px;
          text-align: center;
          box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
          max-width: 600px;
          width: 90%;
        }

        .modal-title {
          font-size: 2.5rem;
          font-weight: 800;
          margin: 0 0 1rem 0;
        }

        .modal-desc {
          font-size: 1.5rem;
          font-weight: 500;
          color: #495057;
          margin: 0;
          line-height: 1.5;
          white-space: pre-line;
        }

        .spinner {
          margin: 2rem auto 0;
          width: 60px;
          height: 60px;
          border: 6px solid #F1F3F5;
          border-radius: 50%;
          animation: spin 1s linear infinite;
        }

        .restart-btn {
          margin-top: 2.5rem;
          padding: 1.2rem 3rem;
          font-size: 1.4rem;
          font-weight: 800;
          color: #FFFFFF;
          background-color: #339AF0;
          border: none;
          border-radius: 16px;
          cursor: pointer;
          transition: background-color 0.2s, transform 0.1s;
        }

        .restart-btn:hover { background-color: #228BE6; }
        .restart-btn:active { transform: scale(0.95); }

        .spacebar-icon {
          display: inline-block;
          margin-top: 2rem;
          padding: 10px 40px;
          background-color: #E9ECEF;
          border: 2px solid #CED4DA;
          border-radius: 8px;
          font-weight: 800;
          color: #495057;
          font-size: 1.2rem;
          letter-spacing: 2px;
          box-shadow: 0 4px 0 #CED4DA;
        }

        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<!-- 1. 게임 준비 화면 -->
<section id="setup-ui" class="setup-container">
    <div class="setup-card">
        <div class="setup-title-row">
            <input type="number" id="setting-timer" class="setup-timer-input" value="7" min="1" max="99">
            <span>초 준다</span>
        </div>

        <div class="setup-options-container">
            <!-- 참여 인원 설정 -->
            <div class="setup-option-group">
                <span class="setup-option-label">참여 인원 (명)</span>
                <div class="setup-option-controls">
                    <button id="btn-player-minus" class="ctrl-btn">-</button>
                    <input type="text" id="setting-count" class="setup-val-input" value="5" readonly>
                    <button id="btn-player-plus" class="ctrl-btn">+</button>
                </div>
            </div>

            <!-- 목표 점수 설정 -->
            <div class="setup-option-group">
                <span class="setup-option-label">목표 점수 (점)</span>
                <div class="setup-option-controls">
                    <button id="btn-score-minus" class="ctrl-btn">-</button>
                    <input type="text" id="setting-target-score" class="setup-val-input" value="5" readonly>
                    <button id="btn-score-plus" class="ctrl-btn">+</button>
                </div>
            </div>

            <!-- 난이도 설정 추가 -->
            <div class="setup-option-group">
                <span class="setup-option-label">문제 난이도</span>
                <div class="setup-option-controls">
                    <button id="btn-diff-minus" class="ctrl-btn">-</button>
                    <input type="text" id="setting-difficulty" class="setup-val-input" value="보통" readonly>
                    <button id="btn-diff-plus" class="ctrl-btn">+</button>
                </div>
            </div>
        </div>

        <div id="player-names-grid" class="player-names-grid">
            <!-- 자바스크립트로 자동 생성됨 -->
        </div>

        <div id="setup-message" class="setup-message">
            설정을 마치셨다면 스페이스바를 눌러 게임을 시작하세요!
        </div>
    </div>
</section>

<!-- 2. 게임 메인 보드 화면 (좌우 분할 래퍼) -->
<main id="game-ui" class="game-main-wrapper hidden">
    <!-- 좌측 스코어보드 -->
    <aside class="scoreboard">
        <h3 class="scoreboard-title">현재 점수</h3>
        <ul id="score-list" class="score-list">
            <!-- 자바스크립트로 랭킹 자동 생성 -->
        </ul>
    </aside>

    <!-- 우측 메인 게임 보드 -->
    <div class="game-board">
        <div id="prompt-area" class="prompt-area"></div>
        <div id="main-timer" class="timer hidden">5</div>
        <div id="submitted-words" class="word-grid"></div>
    </div>
</main>

<!-- 3. 하단 공통 입력창 영역 -->
<footer class="input-section">
    <div id="duplicate-warning" class="duplicate-warning"></div>
    <input
            type="text"
            id="word-input"
            class="word-input"
            autocomplete="off"
            placeholder="정답을 입력하세요"
            disabled
    >
</footer>

<!-- 모달 창들 -->
<div id="ai-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <h2 class="modal-title" style="color: #748FFC;">AI 심사 중</h2>
        <p class="modal-desc">제출하신 답변을 팩트 기반으로 판정하고 있습니다...</p>
        <div class="spinner" style="border-top-color: #748FFC;"></div>
    </div>
</div>

<div id="turn-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <h2 id="turn-modal-title" class="modal-title" style="color: #FF6B6B;">시간 초과!</h2>
        <p id="turn-modal-desc" class="modal-desc">안내 문구</p>
    </div>
</div>

<div id="loading-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <h2 class="modal-title" style="color: #FFA94D;">문제 준비 중</h2>
        <p class="modal-desc">선택하신 난이도의 제시어를 생성하고 있습니다.<br>잠시만 기다려 주세요.</p>
        <div class="spinner" style="border-top-color: #FFA94D;"></div>
    </div>
</div>

<!-- "준비 완료 (대기)" 모달 -->
<div id="ready-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <h2 class="modal-title" style="color: #37B24D;">제시어 준비 완료!</h2>
        <p id="ready-modal-desc" class="modal-desc">마음의 준비를 하시고 시작하세요.</p>
        <div class="spacebar-icon">SPACE</div>
    </div>
</div>

<div id="victory-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <h2 class="modal-title" style="color: #FCC419;">게임 종료!</h2>
        <p id="victory-modal-desc" class="modal-desc">우승자 안내</p>
        <button class="restart-btn" onclick="resetGame()">처음으로 돌아가기</button>
    </div>
</div>

<script>
    /* ==========================================
       AI 연동 서비스 (Gemini API)
       ========================================== */
    const GeminiService = (function() {
      const apiKey = "";
      const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

      const difficultyGuides = {
        '쉬움': '수식어를 완전히 배제하고, 누구나 쉽게 알고 있는 범주가 넓은 단답형 명사로 1~2단어로 출제해. (예: 과일, 길거리 음식, 학용품)',
        '보통': '직관적이거나 일상적인 수식어가 붙거나 범주가 좁은 명사로 출제해. (예: 빨간색 과일, 국물 요리)',
        '어려움': '특정 조건이 붙거나 상당히 구체적인 범주로 출제해. (예: 껍질을 깎아 먹는 과일, 국물이 있는 길거리 음식)',
        '초고난이도': '역사적 지식이나 한정적인 전문 지식이 필요한 추상적/구체적 카테고리로 출제해. (예: 조선시대 왕의 이름, 아프리카 국가, 커피 원두 종류). 지나치게 특수한 주제는 안됨(예: 아프리카에 서식하는 메뚜기)'
      };

      function delay(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      async function fetchWithRetry(payload, attempt = 0) {
        const delays = [1000, 2000, 4000, 8000, 16000];
        try {
          const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            throw new Error('API request failed');
          }

          return await response.json();
        } catch (error) {
          if (attempt >= delays.length) {
            throw error;
          }
          await delay(delays[attempt]);
          return fetchWithRetry(payload, attempt + 1);
        }
      }

      function createPayload(sysText, userText, schemaProps) {
        return {
          contents: [{ parts: [{ text: userText }] }],
          systemInstruction: { parts: [{ text: sysText }] },
          generationConfig: {
            responseMimeType: "application/json",
            responseSchema: {
              type: "OBJECT",
              properties: schemaProps
            }
          }
        };
      }

      function parseResponse(result) {
        const text = result.candidates[0].content.parts[0].text;
        return JSON.parse(text);
      }

      async function generatePrompts(count, difficulty) {
        const guideText = difficultyGuides[difficulty];
        const sysText = `너는 보드게임 '5초 준다!'의 출제 위원이야. 사용자가 요청한 개수에 맞춰 창의적이고 명확한 제시어를 출제해. 제시어는 단답형으로 3가지를 대답할 수 있는 명확한 카테고리나 조건이어야 해.\n[난이도 지시사항]\n${guideText}`;
        const userText = `${count}개의 제시어를 만들어줘.`;

        const schemaProps = {
          prompts: {
            type: "ARRAY",
            items: { type: "STRING" }
          }
        };

        try {
          const payload = createPayload(sysText, userText, schemaProps);
          const result = await fetchWithRetry(payload);
          const parsed = parseResponse(result);
          return parsed.prompts;
        } catch (e) {
          return ['국물 요리', '학용품', '겨울 스포츠', '의류 브랜드', '매운 음식'];
        }
      }

      async function judgeAnswers(prompt, answers) {
        const sysText = "너는 보드게임 '5초 준다!'의 아주 엄격하고 단호한 심판이야. 제시어에 대해 플레이어가 제출한 3개의 단어가 모두 조건에 부합하는지 팩트 기반으로 심사해.\n[심사 기준]\n1. 단 하나라도 사실과 다르거나 제시어와 관련이 없다면 '실패(false)'로 처리해.\n2. 제출된 3개의 단어는 서로 다른 개별적 대상이어야 해. 언어만 다르거나(사과/Apple), 줄임말이거나(대한민국/한국), 같은 대상을 부르는 다른 이름(개/강아지)이라면 꼼수로 간주하고 반드시 '실패(false)'로 처리해. (커피/카페라떼)라면 서로 다른 대상으로 보기에 충분해.\n이유(reason)는 초등학생도 이해할 수 있게 짧고 명확하게 한 문장으로 작성해. 정답인 경우 이유는 비워둬.";
        const userText = `제시어: ${prompt}\n제출된 단어: ${answers.join(', ')}`;

        const schemaProps = {
          isValid: { type: "BOOLEAN" },
          reason: { type: "STRING" }
        };

        try {
          const payload = createPayload(sysText, userText, schemaProps);
          const result = await fetchWithRetry(payload);
          return parseResponse(result);
        } catch (e) {
          return { isValid: true, reason: "" };
        }
      }

      return {
        generatePrompts: generatePrompts,
        judgeAnswers: judgeAnswers
      };
    })();

    /* ==========================================
       상태 관리 (State Management)
       ========================================== */
    const STATUS = {
      SETUP: 'SETUP',
      WAITING: 'WAITING',
      READY_TO_START: 'READY_TO_START',
      PLAYING: 'PLAYING',
      JUDGING: 'JUDGING',
      LOADING: 'LOADING'
    };

    const SetupState = {
      timer: 5,
      playerCount: 5,
      maxPlayers: 10,
      minPlayers: 2,
      targetScore: 5,
      maxTargetScore: 50,
      minTargetScore: 1,
      difficulties: ['쉬움', '보통', '어려움', '초고난이도'],
      difficultyIdx: 1
    };

    const AppState = {
      status: STATUS.SETUP,
      time: 5,
      timerId: null,
      warningTimerId: null,
      fetchPromise: null, // 비동기 무한 루프 방지를 위한 Promise 객체 저장
      difficulty: '보통',

      currentWords: [],
      allWords: [],
      players: [],
      currentPlayerIdx: 0,
      roundStartPlayerIdx: 0,
      targetScore: 5,

      promptBuffer: [],
      currentPrompt: ''
    };

    /* ==========================================
       UI 유틸리티 (DOM Manipulation)
       ========================================== */
    function getEl(id) {
      return document.getElementById(id);
    }

    function updateUI(id, text) {
      const el = getEl(id);
      if (!el) return;
      el.innerText = text;
    }

    function setInputValue(id, val) {
      const el = getEl(id);
      if (!el) return;
      el.value = val;
    }

    function showEl(id) {
      const el = getEl(id);
      if (!el) return;
      el.classList.remove('hidden');
    }

    function hideEl(id) {
      const el = getEl(id);
      if (!el) return;
      el.classList.add('hidden');
    }

    function hideAllModals() {
      hideEl('ai-modal');
      hideEl('turn-modal');
      hideEl('loading-modal');
      hideEl('ready-modal');
      hideEl('victory-modal');
    }

    function setMainInputState(disabled) {
      const el = getEl('word-input');
      if (!el) return;
      el.disabled = disabled;
      if (disabled) return;
      el.focus();
    }

    function clearMainInput() {
      const el = getEl('word-input');
      if (!el) return;
      el.value = '';
    }

    function clearWordCards() {
      const container = getEl('submitted-words');
      if (!container) return;
      container.innerHTML = '';
    }

    /* ==========================================
       스코어보드 UI 로직 (Scoreboard Rendering)
       ========================================== */
    function applyActiveStateToItem(item, player) {
      if (player.id !== AppState.currentPlayerIdx) return;
      item.classList.add('active');
    }

    function createScoreNameEl(player) {
      const nameWrapper = document.createElement('div');
      nameWrapper.className = 'score-name-wrapper';

      if (player.id === AppState.currentPlayerIdx) {
        const icon = document.createElement('span');
        icon.innerText = '🎯 ';
        nameWrapper.appendChild(icon);
      }

      const nameEl = document.createElement('span');
      nameEl.className = 'score-name';
      nameEl.innerText = player.name;
      nameWrapper.appendChild(nameEl);

      return nameWrapper;
    }

    function createScoreValueEl(score) {
      const scoreEl = document.createElement('span');
      scoreEl.className = 'score-value';
      scoreEl.innerText = `${score}점`;
      return scoreEl;
    }

    function createScoreListItem(player) {
      const li = document.createElement('li');
      li.className = 'score-item';

      applyActiveStateToItem(li, player);

      li.appendChild(createScoreNameEl(player));
      li.appendChild(createScoreValueEl(player.score));

      return li;
    }

    function sortPlayers(a, b) {
      const scoreDiff = b.score - a.score;
      if (scoreDiff !== 0) return scoreDiff;
      return a.id - b.id;
    }

    function getSortedPlayers() {
      const copy = [...AppState.players];
      return copy.sort(sortPlayers);
    }

    function appendPlayerItem(player) {
      const container = getEl('score-list');
      if (!container) return;
      container.appendChild(createScoreListItem(player));
    }

    function renderScoreboard() {
      const container = getEl('score-list');
      if (!container) return;
      container.innerHTML = '';

      const sorted = getSortedPlayers();
      sorted.forEach(appendPlayerItem);
    }

    /* ==========================================
       경고 메시지 UI (Warning Toast UI)
       ========================================== */
    function hideDuplicateWarning() {
      const el = getEl('duplicate-warning');
      if (!el) return;
      el.classList.remove('show');

      if (AppState.warningTimerId === null) return;
      clearTimeout(AppState.warningTimerId);
      AppState.warningTimerId = null;
    }

    function handleDuplicateWord(word) {
      const el = getEl('duplicate-warning');
      if (!el) return;

      el.innerText = `[${word}] 이미 등록되어 있습니다`;
      el.classList.add('show');

      if (AppState.warningTimerId !== null) {
        clearTimeout(AppState.warningTimerId);
      }

      clearMainInput();
      AppState.warningTimerId = setTimeout(hideDuplicateWarning, 3000);
    }

    /* ==========================================
       설정 UI 로직 (Setup Logic)
       ========================================== */
    function createPlayerInputDom(index) {
      const wrapper = document.createElement('div');
      wrapper.className = 'player-input-wrapper';

      const label = document.createElement('label');
      label.className = 'player-input-label';
      label.innerText = `${index + 1}번 플레이어`;

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'player-name-input';
      input.id = `player-name-${index}`;

      const alphabet = String.fromCharCode(65 + index);
      input.value = `플레이어 ${alphabet}`;

      wrapper.appendChild(label);
      wrapper.appendChild(input);
      return wrapper;
    }

    function renderPlayerInputs() {
      const container = getEl('player-names-grid');
      if (!container) return;

      container.innerHTML = '';
      for (let i = 0; i < SetupState.playerCount; i++) {
        container.appendChild(createPlayerInputDom(i));
      }
    }

    function increasePlayer() {
      if (SetupState.playerCount >= SetupState.maxPlayers) return;
      SetupState.playerCount += 1;
      setInputValue('setting-count', SetupState.playerCount);
      renderPlayerInputs();
    }

    function decreasePlayer() {
      if (SetupState.playerCount <= SetupState.minPlayers) return;
      SetupState.playerCount -= 1;
      setInputValue('setting-count', SetupState.playerCount);
      renderPlayerInputs();
    }

    function increaseTargetScore() {
      if (SetupState.targetScore >= SetupState.maxTargetScore) return;
      SetupState.targetScore += 1;
      setInputValue('setting-target-score', SetupState.targetScore);
    }

    function decreaseTargetScore() {
      if (SetupState.targetScore <= SetupState.minTargetScore) return;
      SetupState.targetScore -= 1;
      setInputValue('setting-target-score', SetupState.targetScore);
    }

    function updateDifficultyUI() {
      setInputValue('setting-difficulty', SetupState.difficulties[SetupState.difficultyIdx]);

      const btnMinus = getEl('btn-diff-minus');
      const btnPlus = getEl('btn-diff-plus');

      if (btnMinus) btnMinus.disabled = false;
      if (btnPlus) btnPlus.disabled = false;

      if (btnMinus) {
        if (SetupState.difficultyIdx <= 0) {
          btnMinus.disabled = true;
        }
      }

      if (btnPlus) {
        if (SetupState.difficultyIdx >= SetupState.difficulties.length - 1) {
          btnPlus.disabled = true;
        }
      }
    }

    function increaseDifficulty() {
      if (SetupState.difficultyIdx >= SetupState.difficulties.length - 1) return;
      SetupState.difficultyIdx += 1;
      updateDifficultyUI();
    }

    function decreaseDifficulty() {
      if (SetupState.difficultyIdx <= 0) return;
      SetupState.difficultyIdx -= 1;
      updateDifficultyUI();
    }

    function pushToBuffer(prompt) {
      AppState.promptBuffer.push(prompt);
    }

    /* ==========================================
       설정 저장 및 게임 전환 (Transition to Game)
       ========================================== */
    function saveTimerSetting() {
      const timerInput = getEl('setting-timer');
      if (!timerInput) return;

      const parsed = parseInt(timerInput.value, 10);
      if (isNaN(parsed)) return;

      SetupState.timer = parsed;
    }

    function savePlayerName(index) {
      const input = getEl(`player-name-${index}`);
      if (!input) return;

      AppState.players.push({
        id: index,
        name: input.value,
        score: 0
      });
    }

    function savePlayerSettings() {
      AppState.players = [];
      for (let i = 0; i < SetupState.playerCount; i++) {
        savePlayerName(i);
      }
    }

    function saveTargetScoreSetting() {
      AppState.targetScore = SetupState.targetScore;
    }

    function transitionToReadyState() {
      AppState.status = STATUS.READY_TO_START;
      hideAllModals();

      const nextPlayer = getCurrentPlayerName();
      updateUI('ready-modal-desc', `${nextPlayer}님, 준비되셨다면 스페이스바를 누르세요.`);
      showEl('ready-modal');
    }

    async function startGameFlow() {
      saveTimerSetting();
      savePlayerSettings();
      saveTargetScoreSetting();
      AppState.difficulty = SetupState.difficulties[SetupState.difficultyIdx];

      AppState.roundStartPlayerIdx = 0;
      AppState.currentPlayerIdx = 0;

      AppState.status = STATUS.LOADING;

      hideEl('setup-ui');
      renderScoreboard();
      showEl('game-ui');

      showEl('loading-modal');

      const prompts = await GeminiService.generatePrompts(3, AppState.difficulty);
      prompts.forEach(pushToBuffer);

      transitionToReadyState();
    }

    function resetGame() {
      hideAllModals();
      stopTimer();
      hideDuplicateWarning();

      AppState.status = STATUS.SETUP;
      AppState.promptBuffer = [];
      AppState.allWords = [];
      AppState.currentWords = [];
      AppState.players = [];
      AppState.fetchPromise = null;

      clearMainInput();
      clearWordCards();

      hideEl('game-ui');
      showEl('setup-ui');
    }

    /* ==========================================
       타이머 및 게임 루프 로직 (Game Loop)
       ========================================== */
    function stopTimer() {
      if (AppState.timerId === null) return;
      clearInterval(AppState.timerId);
      AppState.timerId = null;
    }

    function handleTimeOver() {
      if (AppState.time > 0) return;
      processTimeOver();
    }

    function tick() {
      AppState.time -= 1;
      updateUI('main-timer', AppState.time);
      handleTimeOver();
    }

    function startTimer() {
      AppState.time = SetupState.timer;
      updateUI('main-timer', AppState.time);
      stopTimer();
      AppState.timerId = setInterval(tick, 1000);
    }

    function getNextIdx(idx) {
      const next = idx + 1;
      if (next >= AppState.players.length) return 0;
      return next;
    }

    function setupNextRoundStarter() {
      AppState.roundStartPlayerIdx = getNextIdx(AppState.roundStartPlayerIdx);
      AppState.currentPlayerIdx = AppState.roundStartPlayerIdx;
    }

    function getCurrentPlayerName() {
      return AppState.players[AppState.currentPlayerIdx].name;
    }

    function showTurnModal(title, desc, colorCode) {
      const titleEl = getEl('turn-modal-title');
      if (titleEl) titleEl.style.color = colorCode;

      updateUI('turn-modal-title', title);
      updateUI('turn-modal-desc', desc);
      showEl('turn-modal');
    }

    function checkAllFail() {
      return AppState.currentPlayerIdx === AppState.roundStartPlayerIdx;
    }

    function buildAllFailDesc(reason) {
      const nextPlayer = getCurrentPlayerName();
      const baseDesc = `아무도 정답을 맞히지 못했습니다.\n${nextPlayer}님부터 새 제시어로 시작합니다.`;
      if (reason === null) return baseDesc;
      if (reason === undefined) return baseDesc;

      return `오답 사유: ${reason}\n\n${baseDesc}`;
    }

    function processAllFail(reason = null) {
      AppState.currentPrompt = '';
      AppState.allWords = [];
      clearWordCards();

      setupNextRoundStarter();
      renderScoreboard();

      const desc = buildAllFailDesc(reason);
      showTurnModal('전원 실패!', desc, '#868E96');
    }

    function passTurnWithinRound() {
      AppState.currentPlayerIdx = getNextIdx(AppState.currentPlayerIdx);
      renderScoreboard();

      if (checkAllFail()) {
        processAllFail(null);
        return;
      }

      const nextPlayer = getCurrentPlayerName();
      showTurnModal('시간 초과!', `${nextPlayer}님에게 키보드를 넘기고\n스페이스바를 눌러주세요!`, '#FF6B6B');
    }

    function processTimeOver() {
      AppState.status = STATUS.WAITING;
      stopTimer();
      setMainInputState(true);
      hideEl('main-timer');
      hideDuplicateWarning();

      AppState.currentWords = []; // 다음 플레이어를 위해 현재 턴 단어 배열만 초기화 (화면 UI 및 allWords는 유지)

      passTurnWithinRound();
    }

    function processWin(winner) {
      hideAllModals();
      showEl('victory-modal');
      updateUI('victory-modal-desc', `${winner.name}님이 목표 점수(${AppState.targetScore}점)에 도달했습니다!\n최종 우승을 축하합니다!`);
    }

    function processNextRoundSuccess() {
      setupNextRoundStarter();
      renderScoreboard();

      const nextPlayer = getCurrentPlayerName();
      hideAllModals();
      showTurnModal('정답 인정!', `${nextPlayer}님에게 키보드를 넘기고\n스페이스바를 눌러주세요!`, '#37B24D');
    }

    function handleJudgeSuccess() {
      AppState.status = STATUS.WAITING;
      AppState.currentPrompt = '';
      AppState.allWords = [];
      clearWordCards();

      const currentPlayer = AppState.players[AppState.currentPlayerIdx];
      currentPlayer.score += 1;
      renderScoreboard();

      if (currentPlayer.score >= AppState.targetScore) {
        processWin(currentPlayer);
        return;
      }

      processNextRoundSuccess();
    }

    function processJudgeFail(reason) {
      AppState.status = STATUS.WAITING;
      setMainInputState(true);
      // 오답 시 clearWordCards(); 구문을 제거하여 화면의 단어 유지
      AppState.currentWords = []; // 다음 플레이어를 위해 현재 턴 단어 배열만 초기화

      AppState.currentPlayerIdx = getNextIdx(AppState.currentPlayerIdx);
      renderScoreboard();

      if (checkAllFail()) {
        processAllFail(reason);
        return;
      }

      const nextPlayer = getCurrentPlayerName();
      showTurnModal('오답!', `${reason}\n\n${nextPlayer}님에게 키보드를 넘기고\n스페이스바를 눌러주세요!`, '#FF6B6B');
    }

    async function processJudging() {
      AppState.status = STATUS.JUDGING;
      stopTimer();
      setMainInputState(true);
      hideDuplicateWarning();

      hideAllModals();
      showEl('ai-modal');

      const result = await GeminiService.judgeAnswers(AppState.currentPrompt, AppState.currentWords);

      hideEl('ai-modal');

      if (result.isValid) {
        handleJudgeSuccess();
        return;
      }

      processJudgeFail(result.reason);
    }

    function checkTurnEnd() {
      if (AppState.currentWords.length < 3) return;
      processJudging();
    }

    function addWordToState(word) {
      AppState.currentWords.push(word);
      AppState.allWords.push(word);
    }

    function renderWordCard(word) {
      const container = getEl('submitted-words');
      if (!container) return;

      const card = document.createElement('div');
      card.className = 'word-card';
      card.innerText = word;
      container.appendChild(card);
    }

    function handleValidWord(word) {
      addWordToState(word);
      renderWordCard(word);
      clearMainInput();
      checkTurnEnd();
    }

    function processWord(word) {
      const trimmed = word.trim();
      if (trimmed === '') return;

      const isDup = AppState.allWords.includes(trimmed);
      if (isDup) {
        handleDuplicateWord(trimmed);
        return;
      }

      hideDuplicateWarning();
      handleValidWord(trimmed);
    }

    function beginPlay() {
      AppState.status = STATUS.PLAYING;
      AppState.currentWords = [];

      hideAllModals();
      hideDuplicateWarning();

      renderScoreboard();

      showEl('main-timer');
      updateUI('prompt-area', AppState.currentPrompt);

      setMainInputState(false);
      clearMainInput();
      startTimer();
    }

    async function refillBufferIfNeeded() {
      if (AppState.promptBuffer.length >= 3) return;

      if (AppState.fetchPromise) {
        await AppState.fetchPromise; // 기존에 진행 중인 API 요청이 있다면 무시하지 않고 끝날 때까지 대기
        return;
      }

      AppState.isFetchingPrompts = true;
      AppState.fetchPromise = GeminiService.generatePrompts(5, AppState.difficulty);
      const newPrompts = await AppState.fetchPromise;

      newPrompts.forEach(pushToBuffer);
      AppState.isFetchingPrompts = false;
      AppState.fetchPromise = null;
    }

    async function fetchNextPrompt() {
      if (AppState.promptBuffer.length === 0) {
        AppState.status = STATUS.LOADING;
        showEl('loading-modal');
        await refillBufferIfNeeded(); // 이제 Promise를 안전하게 대기하여 빈 접시 오류(무한 루프) 해결
        transitionToReadyState();
        return;
      }

      AppState.currentPrompt = AppState.promptBuffer.shift();
      refillBufferIfNeeded();
      beginPlay();
    }

    function executeStartAction() {
      if (AppState.currentPrompt !== '') {
        beginPlay();
        return;
      }
      fetchNextPrompt();
    }

    /* ==========================================
       이벤트 핸들러 (Event Handlers)
       ========================================== */
    function handleSpacebar(event) {
      if (event.code !== 'Space') return;

      if (AppState.status === STATUS.SETUP) {
        event.preventDefault();
        startGameFlow();
        return;
      }

      if (AppState.status === STATUS.READY_TO_START) {
        event.preventDefault();
        executeStartAction();
        return;
      }

      if (AppState.status === STATUS.WAITING) {
        event.preventDefault();
        executeStartAction();
        return;
      }
    }

    function handleEnter(event) {
      if (event.key !== 'Enter') return;
      if (event.isComposing) return;
      if (AppState.status !== STATUS.PLAYING) return;

      event.preventDefault();
      const inputEl = getEl('word-input');
      if (!inputEl) return;

      processWord(inputEl.value);
    }

    function handleInputEvent() {
      hideDuplicateWarning();
    }

    function forceFocus() {
      if (AppState.status !== STATUS.PLAYING) return;
      const el = getEl('word-input');
      if (!el) return;
      el.focus();
    }

    function handleBlur() {
      setTimeout(forceFocus, 10);
    }

    /* ==========================================
       초기화 로직 (Initialization)
       ========================================== */
    function bindSetupEvents() {
      const btnPlayerMinus = getEl('btn-player-minus');
      if (btnPlayerMinus) btnPlayerMinus.addEventListener('click', decreasePlayer);

      const btnPlayerPlus = getEl('btn-player-plus');
      if (btnPlayerPlus) btnPlayerPlus.addEventListener('click', increasePlayer);

      const btnScoreMinus = getEl('btn-score-minus');
      if (btnScoreMinus) btnScoreMinus.addEventListener('click', decreaseTargetScore);

      const btnScorePlus = getEl('btn-score-plus');
      if (btnScorePlus) btnScorePlus.addEventListener('click', increaseTargetScore);

      const btnDiffMinus = getEl('btn-diff-minus');
      if (btnDiffMinus) btnDiffMinus.addEventListener('click', decreaseDifficulty);

      const btnDiffPlus = getEl('btn-diff-plus');
      if (btnDiffPlus) btnDiffPlus.addEventListener('click', increaseDifficulty);
    }

    function bindGameEvents() {
      document.addEventListener('keydown', handleSpacebar);

      const inputEl = getEl('word-input');
      if (!inputEl) return;
      inputEl.addEventListener('keyup', handleEnter);
      inputEl.addEventListener('input', handleInputEvent);
      inputEl.addEventListener('blur', handleBlur);
    }

    function initApp() {
      AppState.status = STATUS.SETUP;

      renderPlayerInputs();
      updateDifficultyUI();
      bindSetupEvents();
      bindGameEvents();
    }

    window.onload = initApp;
</script>
</body>
</html>
