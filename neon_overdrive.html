<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Survivor: Pure Overdrive</title>
    <style>
        /* =========================================
           순수 CSS 스타일링 (프레임워크 제거)
           ========================================= */
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #020617;
            color: white;
            font-family: 'Pretendard', sans-serif;
            user-select: none;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
        }

        .hidden {
            display: none !important;
        }

        /* UI 레이아웃 */
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .interactive {
            pointer-events: auto;
        }

        /* 상단 경험치 바 */
        .xp-container {
            width: 100%;
            height: 20px;
            background-color: #0f172a;
            border-bottom: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        #xpFill {
            height: 100%;
            background: linear-gradient(to right, #3b82f6, #22d3ee);
            transition: width 0.2s ease-out;
            width: 0%;
        }

        /* 상단 정보 표시 */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 0 2rem;
            margin-top: 1.5rem;
            box-sizing: border-box;
        }

        .stat-item {
            font-size: 1.875rem;
            font-weight: 900;
        }

        #timer { font-family: monospace; color: #dbeafe; letter-spacing: -0.05em; }
        #levelDisplay { font-style: italic; color: #22d3ee; }
        #killCount { color: #f43f5e; }

        /* 화면 덮개 공통 (시작, 레벨업, 종료) */
        .screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            z-index: 50;
        }

        #startScreen { background-color: rgba(2, 6, 23, 0.9); }
        #levelUpScreen { background-color: rgba(2, 6, 23, 0.95); }
        #gameOverScreen { background-color: rgba(69, 10, 10, 0.9); }

        /* 시작 화면 타이포그래피 및 버튼 */
        .title {
            font-size: 6rem;
            font-weight: 900;
            background: linear-gradient(to bottom right, #60a5fa, #d946ef);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 0 0 1rem 0;
            font-style: italic;
            letter-spacing: -0.05em;
            text-align: center;
        }

        .subtitle {
            color: #93c5fd;
            font-size: 1.25rem;
            margin-bottom: 3rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .btn {
            padding: 1.25rem 4rem;
            border-radius: 9999px;
            font-size: 1.875rem;
            font-weight: 900;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: #2563eb;
            color: white;
            box-shadow: 0 0 30px rgba(37,99,235,0.5);
        }

        .btn-primary:hover {
            background-color: #c026d3;
            transform: scale(1.1);
        }

        .btn-danger {
            background-color: white;
            color: #450a0a;
        }

        .btn-danger:hover {
            background-color: #fee2e2;
            transform: scale(1.05);
        }

        .hint {
            margin-top: 2rem;
            color: #64748b;
            font-family: monospace;
            font-size: 1rem;
        }

        /* 레벨 업 화면 */
        .level-up-title {
            font-size: 3rem;
            font-weight: 900;
            color: #facc15;
            margin-bottom: 3rem;
            font-style: italic;
            letter-spacing: -0.025em;
        }

        .upgrade-list {
            display: flex;
            gap: 2rem;
        }

        .level-up-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.95));
            border: 2px solid #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
            border-radius: 1rem;
            width: 18rem;
            padding: 2rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .level-up-card:hover {
            background: rgba(56, 189, 248, 0.3);
            border-color: #f0abfc;
            transform: scale(1.05);
            cursor: pointer;
        }

        .card-icon {
            font-size: 3.75rem;
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 900;
            margin-bottom: 0.75rem;
            color: white;
            text-transform: uppercase;
            letter-spacing: -0.025em;
        }

        .card-desc {
            font-size: 1rem;
            color: #bfdbfe;
            line-height: 1.5;
            font-weight: 500;
        }

        /* 게임 오버 화면 */
        .game-over-title {
            font-size: 4.5rem;
            font-weight: 900;
            color: white;
            margin-bottom: 1.5rem;
            font-style: italic;
        }

        .final-score {
            font-size: 1.875rem;
            color: #fecaca;
            margin-bottom: 3rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div class="ui-overlay">
    <!-- XP Bar -->
    <div class="xp-container">
        <div id="xpFill"></div>
    </div>

    <!-- Stats -->
    <div class="stats-bar">
        <div id="timer" class="stat-item">00:00</div>
        <div id="levelDisplay" class="stat-item">LEVEL 1</div>
        <div id="killCount" class="stat-item">KILLS: 0</div>
    </div>

    <!-- Start Screen -->
    <div id="startScreen" class="screen interactive">
        <h1 class="title">NEON OVERDRIVE</h1>
        <p class="subtitle">High Speed Survival Rogue-lite</p>
        <button id="startBtn" class="btn btn-primary">엔진 가동</button>
        <p class="hint">WASD / ARROWS TO MOVE</p>
    </div>

    <!-- Level Up Screen -->
    <div id="levelUpScreen" class="screen interactive hidden">
        <h2 class="level-up-title">UPGRADE SELECT</h2>
        <div id="upgradeList" class="upgrade-list">
            <!-- Upgrades injected here via JS -->
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="screen interactive hidden">
        <h2 class="game-over-title">SYSTEM FAILURE</h2>
        <p id="finalScore" class="final-score"></p>
        <button onclick="location.reload()" class="btn btn-danger">재부팅</button>
    </div>
</div>

<script>
    /* =========================================
       순수 JavaScript 게임 로직 (프레임워크 무의존성)
       ========================================= */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const xpFill = document.getElementById('xpFill');
    const timerDisplay = document.getElementById('timer');
    const levelDisplay = document.getElementById('levelDisplay');
    const killCountDisplay = document.getElementById('killCount');
    const startScreen = document.getElementById('startScreen');
    const startBtn = document.getElementById('startBtn');
    const levelUpScreen = document.getElementById('levelUpScreen');
    const upgradeList = document.getElementById('upgradeList');
    const gameOverScreen = document.getElementById('gameOverScreen');

    // 게임 전역 상태
    let gameActive = false;
    let paused = false;
    let kills = 0;
    let level = 1;
    let xp = 0;
    let xpToNextLevel = 80;
    let startTime;
    let frameCount = 0;

    // 플레이어 객체 설정 (성장 폭이 큼)
    const player = {
        x: 0,
        y: 0,
        radius: 16,
        color: '#38bdf8',
        speed: 4.5,
        hp: 120,
        maxHp: 120,
        attackSpeed: 45,
        lastAttack: 0,
        damage: 35,
        projectileCount: 1,
        range: 500,
        magnetRange: 100
    };

    const keys = {};
    const enemies = [];
    const projectiles = [];
    const gems = [];

    // 업그레이드 옵션
    const upgrades = [
        { id: 'dmg', name: '오버클럭 전력', desc: '데미지가 40% 대폭 증가합니다.', icon: '💥' },
        { id: 'spd', name: '터보 엔진', desc: '이동 속도가 25% 빨라집니다.', icon: '🚀' },
        { id: 'aspd', name: '고속 연사', desc: '공격 속도가 30% 빨라집니다.', icon: '⚡' },
        { id: 'hp', name: '나노 아머', desc: '최대 체력이 40 증가하고 완쾌됩니다.', icon: '🛡️' },
        { id: 'count', name: '멀티 스트라이크', desc: '투사체가 2개 추가로 발사됩니다!', icon: '✨' },
        { id: 'magnet', name: '고성능 자석', desc: '아이템 수집 범위가 50% 넓어집니다.', icon: '🧲' }
    ];

    // 캔버스 리사이징 처리
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        if (!gameActive) {
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
        }
    }

    window.addEventListener('resize', resize);
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    startBtn.addEventListener('click', () => {
        startScreen.classList.add('hidden');
        gameActive = true;
        startTime = Date.now();
        resize();
        requestAnimationFrame(gameLoop);
    });

    // 적 클래스
    class Enemy {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.radius = 12;
            const timeScale = (Date.now() - startTime) / 60000;
            this.speed = 1.5 + (timeScale * 0.8);
            this.hp = 40 + (level * 15) + (timeScale * 50);
            this.color = level % 5 === 0 ? '#f43f5e' : '#e11d48';
            this.damage = 0.8;
        }

        update() {
            const dx = player.x - this.x;
            const dy = player.y - this.y;
            const dist = Math.sqrt(dx*dx + dy*dy);

            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * this.speed;

            if (dist < this.radius + player.radius) {
                player.hp -= this.damage;
                if (player.hp <= 0) endGame();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = this.color;
            ctx.fill();
            ctx.closePath();
            ctx.shadowBlur = 0;
        }
    }

    // 투사체 클래스
    class Projectile {
        constructor(x, y, targetX, targetY, angleOffset = 0) {
            this.x = x;
            this.y = y;
            this.radius = 8;
            this.speed = 10;
            this.damage = player.damage;

            const baseAngle = Math.atan2(targetY - y, targetX - x);
            const angle = baseAngle + angleOffset;

            this.vx = Math.cos(angle) * this.speed;
            this.vy = Math.sin(angle) * this.speed;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#fbbf24';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#f59e0b';
            ctx.fill();
            ctx.closePath();
            ctx.shadowBlur = 0;
        }
    }

    // 경험치 보석 클래스
    class Gem {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.radius = 5;
            this.xp = 20 + Math.floor(level * 2);
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#22d3ee';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#22d3ee';
            ctx.fill();
            ctx.closePath();
            ctx.shadowBlur = 0;
        }
    }

    // 적 스폰 로직 (카메라 기준 무한 맵 스폰으로 변경)
    function spawnEnemy() {
        const spawnInterval = Math.max(5, 40 - (level * 1.5));
        if (frameCount % Math.floor(spawnInterval) === 0) {
            // 현재 카메라의 위치(좌측 상단 좌표)
            const camX = player.x - canvas.width / 2;
            const camY = player.y - canvas.height / 2;

            let x, y;
            const edge = Math.floor(Math.random() * 4);
            const margin = 100; // 화면 밖 100px에서 스폰

            // 화면의 상대적 위치가 아닌, 월드 좌표 기준으로 스폰
            if (edge === 0) { x = camX + Math.random() * canvas.width; y = camY - margin; }
            else if (edge === 1) { x = camX + canvas.width + margin; y = camY + Math.random() * canvas.height; }
            else if (edge === 2) { x = camX + Math.random() * canvas.width; y = camY + canvas.height + margin; }
            else { x = camX - margin; y = camY + Math.random() * canvas.height; }
            enemies.push(new Enemy(x, y));
        }
    }

    // 자동 공격 로직
    function autoAttack() {
        if (frameCount - player.lastAttack >= player.attackSpeed) {
            let nearest = null;
            let minDist = player.range;

            enemies.forEach(e => {
                const d = Math.sqrt((e.x - player.x)**2 + (e.y - player.y)**2);
                if (d < minDist) {
                    minDist = d;
                    nearest = e;
                }
            });

            if (nearest) {
                const spread = 0.2;
                for(let i=0; i < player.projectileCount; i++) {
                    const offset = (i - (player.projectileCount - 1) / 2) * spread;
                    projectiles.push(new Projectile(player.x, player.y, nearest.x, nearest.y, offset));
                }
                player.lastAttack = frameCount;
            }
        }
    }

    // UI 텍스트 갱신
    function updateUI() {
        const time = Math.floor((Date.now() - startTime) / 1000);
        const m = Math.floor(time / 60).toString().padStart(2, '0');
        const s = (time % 60).toString().padStart(2, '0');
        timerDisplay.innerText = `${m}:${s}`;
        xpFill.style.width = `${(xp / xpToNextLevel) * 100}%`;
        levelDisplay.innerText = `LEVEL ${level}`;
        killCountDisplay.innerText = `KILLS: ${kills}`;
    }

    // 경험치 확인 및 레벨업
    function checkLevelUp() {
        if (xp >= xpToNextLevel) {
            xp -= xpToNextLevel;
            level++;
            xpToNextLevel = Math.floor(xpToNextLevel * 1.25);
            showLevelUp();
        }
    }

    // 레벨업 화면 및 카드 생성 (순수 HTML/CSS 구조)
    function showLevelUp() {
        paused = true;
        levelUpScreen.classList.remove('hidden');
        upgradeList.innerHTML = '';

        const shuffled = [...upgrades].sort(() => 0.5 - Math.random()).slice(0, 3);
        shuffled.forEach(upg => {
            const card = document.createElement('div');
            card.className = 'level-up-card interactive';
            card.innerHTML = `
                    <div class="card-icon">${upg.icon}</div>
                    <div class="card-title">${upg.name}</div>
                    <div class="card-desc">${upg.desc}</div>
                `;
            card.onclick = () => applyUpgrade(upg.id);
            upgradeList.appendChild(card);
        });
    }

    // 업그레이드 적용 로직
    function applyUpgrade(id) {
        if (id === 'dmg') player.damage *= 1.4;
        if (id === 'spd') player.speed += 0.8;
        if (id === 'aspd') player.attackSpeed = Math.max(5, player.attackSpeed * 0.7);
        if (id === 'hp') {
            player.maxHp += 40;
            player.hp = player.maxHp;
        }
        if (id === 'count') player.projectileCount += 2;
        if (id === 'magnet') player.magnetRange *= 1.5;

        levelUpScreen.classList.add('hidden');
        paused = false;
    }

    // 게임 종료 처리
    function endGame() {
        gameActive = false;
        gameOverScreen.classList.remove('hidden');
        document.getElementById('finalScore').innerText = `생존 시간: ${timerDisplay.innerText} | 처치 수: ${kills} | 레벨: ${level}`;
    }

    // 메인 게임 루프 (무한 월드 렌더링 적용)
    function gameLoop() {
        if (!gameActive) return;
        if (paused) {
            requestAnimationFrame(gameLoop);
            return;
        }

        ctx.fillStyle = '#020617';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 카메라 위치 계산 (플레이어가 항상 화면 중앙에 오도록)
        const camX = player.x - canvas.width / 2;
        const camY = player.y - canvas.height / 2;

        // 배경 그리드 렌더링 (화면에 고정되지만 움직이는 것처럼 오프셋 적용)
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 2;
        const gridSize = 60;

        let offsetX = -(camX % gridSize);
        let offsetY = -(camY % gridSize);

        // 갭(gap) 방지 보정
        if (offsetX > 0) offsetX -= gridSize;
        if (offsetY > 0) offsetY -= gridSize;

        for(let x=offsetX; x<canvas.width; x+=gridSize) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for(let y=offsetY; y<canvas.height; y+=gridSize) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }

        // 플레이어 이동 로직 (무한 맵이므로 제약 코드 삭제)
        let dx = 0, dy = 0;
        if (keys['ArrowUp'] || keys['KeyW']) dy -= 1;
        if (keys['ArrowDown'] || keys['KeyS']) dy += 1;
        if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1;
        if (keys['ArrowRight'] || keys['KeyD']) dx += 1;

        if (dx !== 0 || dy !== 0) {
            const len = Math.sqrt(dx*dx + dy*dy);
            player.x += (dx / len) * player.speed;
            player.y += (dy / len) * player.speed;
        }

        // --- 월드 좌표계 렌더링 시작 ---
        ctx.save();
        ctx.translate(-camX, -camY); // 캔버스를 카메라 위치 역방향으로 이동

        // 보석 렌더링 및 자석 효과
        gems.forEach((gem, i) => {
            gem.draw();
            const d = Math.sqrt((gem.x - player.x)**2 + (gem.y - player.y)**2);
            if (d < player.magnetRange) {
                gem.x += (player.x - gem.x) * 0.15;
                gem.y += (player.y - gem.y) * 0.15;
            }
            if (d < player.radius + gem.radius) {
                xp += gem.xp;
                gems.splice(i, 1);
                checkLevelUp();
            }
        });

        // 플레이어 렌더링 (월드 좌표이므로 그대로 그리면 중앙에 렌더링됨)
        ctx.shadowBlur = 20;
        ctx.shadowColor = player.color;
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fillStyle = player.color;
        ctx.fill();
        ctx.closePath();
        ctx.shadowBlur = 0;

        // 플레이어 체력 바
        ctx.fillStyle = '#1e293b';
        ctx.roundRect(player.x - 25, player.y - 35, 50, 8, 4);
        ctx.fill();
        const hpWidth = (player.hp / player.maxHp) * 50;
        ctx.fillStyle = player.hp > player.maxHp * 0.3 ? '#10b981' : '#f43f5e';
        ctx.roundRect(player.x - 25, player.y - 35, Math.max(0, hpWidth), 8, 4);
        ctx.fill();

        // 적 업데이트
        spawnEnemy();
        enemies.forEach((enemy, i) => {
            enemy.update();
            enemy.draw();
        });

        // 공격 및 투사체 판정
        autoAttack();
        projectiles.forEach((p, pi) => {
            p.update();
            p.draw();

            for(let ei = enemies.length - 1; ei >= 0; ei--) {
                const e = enemies[ei];
                const d = Math.sqrt((p.x - e.x)**2 + (p.y - e.y)**2);
                if (d < p.radius + e.radius) {
                    e.hp -= p.damage;
                    projectiles.splice(pi, 1);
                    if (e.hp <= 0) {
                        gems.push(new Gem(e.x, e.y));
                        enemies.splice(ei, 1);
                        kills++;
                    }
                    break;
                }
            }

            // 투사체 소멸 판정 (플레이어와의 거리를 기준으로 소멸 처리)
            const distFromPlayer = Math.sqrt((p.x - player.x)**2 + (p.y - player.y)**2);
            if (distFromPlayer > Math.max(canvas.width, canvas.height)) {
                projectiles.splice(pi, 1);
            }
        });

        // --- 월드 좌표계 렌더링 종료 ---
        ctx.restore();

        updateUI();
        frameCount++;
        requestAnimationFrame(gameLoop);
    }

    resize();
</script>
</body>
</html>
