<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전기🔌 새나가는거 아니야?</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* 모달 애니메이션 */
        @keyframes zoomIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .animate-zoom-in {
            animation: zoomIn 0.3s ease-out forwards;
        }
        /* 스크롤바 숨기기 (선택사항) */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #e2e8f0;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans selection:bg-yellow-200">

<div class="max-w-md mx-auto bg-white min-h-screen shadow-xl relative overflow-hidden flex flex-col">

    <!-- Header -->
    <header class="bg-yellow-400 p-6 rounded-b-3xl shadow-sm z-10 relative">
        <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2 mb-2">
            전기🔌 새나가는거 아니야?
        </h1>
        <p class="text-yellow-900 text-sm font-medium flex items-center gap-1">
            <i data-lucide="calendar" class="w-4 h-4"></i> 현재 계절 설정: <span id="season-text"></span> 모드
        </p>

        <!-- Progress Bar -->
        <div class="mt-6 bg-white/40 rounded-full h-3 w-full overflow-hidden">
            <div id="progress-bar" class="bg-slate-900 h-full rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
        </div>
        <div class="flex justify-between mt-2 text-sm font-bold text-slate-900">
            <span>체크리스트 달성률</span>
            <span id="progress-text">0%</span>
        </div>
    </header>

    <!-- Content -->
    <main class="p-6 flex-1 overflow-y-auto">

        <!-- Fixed Tasks Section -->
        <section class="mb-8">
            <div class="flex items-center gap-2 mb-3">
                <i data-lucide="zap" class="w-5 h-5 text-yellow-500"></i>
                <h2 class="text-lg font-bold text-slate-800">매일 아침 고정 할 일</h2>
            </div>

            <div id="fixed-tasks-list" class="space-y-2">
                <!-- JavaScript로 렌더링됨 -->
            </div>

            <form id="fixed-form" class="mt-3 flex gap-2">
                <input
                        type="text"
                        id="new-fixed-input"
                        placeholder="새로운 고정 할 일 추가..."
                        class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-400"
                />
                <button
                        type="submit"
                        class="bg-slate-800 text-white p-2 rounded-xl hover:bg-slate-700 transition-colors"
                >
                    <i data-lucide="plus" class="w-6 h-6"></i>
                </button>
            </form>
        </section>

        <!-- Additional Tasks Section -->
        <section class="mb-8">
            <div class="flex items-center gap-2 mb-3">
                <i data-lucide="sun" class="w-5 h-5 text-orange-500"></i>
                <h2 class="text-lg font-bold text-slate-800">오늘만 추가로 챙길 것</h2>
            </div>

            <div id="additional-tasks-list" class="space-y-2">
                <!-- JavaScript로 렌더링됨 -->
            </div>

            <form id="additional-form" class="mt-3 flex gap-2">
                <input
                        type="text"
                        id="new-additional-input"
                        placeholder="오늘 챙겨야 할 물건, 우산 등..."
                        class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-orange-400"
                />
                <button
                        type="submit"
                        class="bg-slate-800 text-white p-2 rounded-xl hover:bg-slate-700 transition-colors"
                >
                    <i data-lucide="plus" class="w-6 h-6"></i>
                </button>
            </form>
        </section>

        <!-- Reset Button -->
        <button
                onclick="resetAll()"
                class="w-full py-3 mt-4 text-slate-500 font-medium border border-slate-200 rounded-xl hover:bg-slate-50 transition-colors"
        >
            내일 아침을 위해 체크 초기화하기
        </button>

    </main>

    <!-- Completion Modal -->
    <div id="completion-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl animate-zoom-in">
            <div class="w-20 h-20 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="door-open" class="w-10 h-10 text-yellow-500"></i>
            </div>
            <h3 class="text-2xl font-extrabold text-slate-900 mb-2">
                완벽해요!
            </h3>
            <p class="text-slate-600 mb-8 text-lg font-medium">
                안전하게 체크 완료했어요.<br/>
                이제 밖으로 나가볼까요?
            </p>
            <button
                    onclick="closeModal()"
                    class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold text-lg hover:bg-slate-800 transition-colors shadow-lg shadow-slate-900/20"
            >
                네, 나갈게요! 🏃‍♂️
            </button>
        </div>
    </div>

</div>

<!-- JavaScript Logic -->
<script>
    // 초기 데이터 세팅
    let fixedTasks = [
        { id: 'f1', text: '가스 밸브 잠그기', checked: false, type: 'always' },
        { id: 'f2', text: '보일러 끄기', checked: false, type: 'winter' },
        { id: 'f3', text: '전기장판 끄기', checked: false, type: 'winter' },
        { id: 'f4', text: '에어컨/선풍기 끄기', checked: false, type: 'summer' }
    ];

    let additionalTasks = [];
    let currentSeason = '';
    let hasShownModal = false;

    // 초기화 (계절 계산 및 체크)
    function initApp() {
        const currentMonth = new Date().getMonth() + 1;
        const isWinter = currentMonth >= 11 || currentMonth <= 3;
        const isSummer = currentMonth >= 6 && currentMonth <= 9;

        if (isWinter) currentSeason = '겨울';
        else if (isSummer) currentSeason = '여름';
        else currentSeason = '봄/가을';

        fixedTasks = fixedTasks.map(task => {
            if (task.type === 'summer' && (isWinter || currentMonth === 4 || currentMonth === 5 || currentMonth === 10)) {
                task.checked = true;
            }
            if (task.type === 'winter' && (isSummer || currentMonth === 4 || currentMonth === 5 || currentMonth === 10)) {
                task.checked = true;
            }
            return task;
        });

        document.getElementById('season-text').innerText = currentSeason;
        updateUI();
    }

    // 화면 갱신 함수
    function updateUI() {
        renderFixedTasks();
        renderAdditionalTasks();
        updateProgress();
        lucide.createIcons(); // 아이콘 새로고침
    }

    // 1. 고정 할 일 렌더링
    function renderFixedTasks() {
        const container = document.getElementById('fixed-tasks-list');
        container.innerHTML = fixedTasks.map(task => `
                <div class="flex items-center justify-between p-3 rounded-xl border transition-all ${task.checked ? 'bg-slate-50 border-slate-200 text-slate-400' : 'bg-white border-yellow-200 shadow-sm'}">
                    <button type="button" onclick="toggleFixed('${task.id}')" class="flex flex-1 items-center gap-3 text-left">
                        <i data-lucide="${task.checked ? 'check-circle-2' : 'circle'}" class="w-6 h-6 shrink-0 ${task.checked ? 'text-green-500' : 'text-slate-300'}"></i>
                        <span class="font-medium ${task.checked ? 'line-through' : ''}">
                            ${task.text}
                        </span>
                    </button>
                    <button type="button" onclick="deleteFixed('${task.id}')" class="p-2 text-slate-300 hover:text-red-500 transition-colors">
                        <i data-lucide="trash-2" class="w-5 h-5"></i>
                    </button>
                </div>
            `).join('');
    }

    // 2. 추가 할 일 렌더링
    function renderAdditionalTasks() {
        const container = document.getElementById('additional-tasks-list');
        if (additionalTasks.length === 0) {
            container.innerHTML = `<p class="text-center text-sm text-slate-400 py-4">오늘 특별히 챙길 항목이 있나요?</p>`;
            return;
        }
        container.innerHTML = additionalTasks.map(task => `
                <div class="flex items-center justify-between p-3 rounded-xl border transition-all ${task.checked ? 'bg-slate-50 border-slate-200 text-slate-400' : 'bg-white border-orange-200 shadow-sm'}">
                    <button type="button" onclick="toggleAdditional('${task.id}')" class="flex flex-1 items-center gap-3 text-left">
                        <i data-lucide="${task.checked ? 'check-circle-2' : 'circle'}" class="w-6 h-6 shrink-0 ${task.checked ? 'text-green-500' : 'text-slate-300'}"></i>
                        <span class="font-medium ${task.checked ? 'line-through' : ''}">
                            ${task.text}
                        </span>
                    </button>
                    <button type="button" onclick="deleteAdditional('${task.id}')" class="p-2 text-slate-300 hover:text-red-500 transition-colors">
                        <i data-lucide="trash-2" class="w-5 h-5"></i>
                    </button>
                </div>
            `).join('');
    }

    // 3. 진행도 계산 및 모달 표시
    function updateProgress() {
        const totalTasks = fixedTasks.length + additionalTasks.length;
        const completedTasks = fixedTasks.filter(t => t.checked).length + additionalTasks.filter(t => t.checked).length;
        const progress = totalTasks === 0 ? 0 : Math.round((completedTasks / totalTasks) * 100);

        document.getElementById('progress-bar').style.width = `${progress}%`;
        document.getElementById('progress-text').innerText = `${progress}%`;

        if (progress === 100 && totalTasks > 0 && !hasShownModal) {
            document.getElementById('completion-modal').classList.remove('hidden');
            document.getElementById('completion-modal').classList.add('flex');
            hasShownModal = true;
        } else if (progress < 100) {
            hasShownModal = false;
        }
    }

    // 액션 함수들
    function toggleFixed(id) {
        fixedTasks = fixedTasks.map(t => t.id === id ? { ...t, checked: !t.checked } : t);
        updateUI();
    }

    function toggleAdditional(id) {
        additionalTasks = additionalTasks.map(t => t.id === id ? { ...t, checked: !t.checked } : t);
        updateUI();
    }

    function deleteFixed(id) {
        fixedTasks = fixedTasks.filter(t => t.id !== id);
        updateUI();
    }

    function deleteAdditional(id) {
        additionalTasks = additionalTasks.filter(t => t.id !== id);
        updateUI();
    }

    // 폼 제출 이벤트 설정
    document.getElementById('fixed-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const input = document.getElementById('new-fixed-input');
        if (!input.value.trim()) return;
        fixedTasks.push({ id: `f_${Date.now()}`, text: input.value, checked: false, type: 'always' });
        input.value = '';
        updateUI();
    });

    document.getElementById('additional-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const input = document.getElementById('new-additional-input');
        if (!input.value.trim()) return;
        additionalTasks.push({ id: `a_${Date.now()}`, text: input.value, checked: false });
        input.value = '';
        updateUI();
    });

    // 초기화
    function resetAll() {
        const currentMonth = new Date().getMonth() + 1;
        const isWinter = currentMonth >= 11 || currentMonth <= 3;
        const isSummer = currentMonth >= 6 && currentMonth <= 9;

        fixedTasks = fixedTasks.map(task => {
            let isChecked = false;
            if (task.type === 'summer' && (isWinter || currentMonth === 4 || currentMonth === 5 || currentMonth === 10)) isChecked = true;
            if (task.type === 'winter' && (isSummer || currentMonth === 4 || currentMonth === 5 || currentMonth === 10)) isChecked = true;
            return { ...task, checked: isChecked };
        });
        additionalTasks = [];
        hasShownModal = false;
        updateUI();
    }

    function closeModal() {
        document.getElementById('completion-modal').classList.add('hidden');
        document.getElementById('completion-modal').classList.remove('flex');
    }

    // 앱 실행
    initApp();
</script>
</body>
</html>
