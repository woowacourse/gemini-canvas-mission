<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>은오의 TODO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background-color: #e5e7eb;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            overflow: hidden;
        }

        .calendar-day {
            min-height: 120px;
            background-color: white;
            padding: 0.5rem;
            transition: background-color 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .calendar-day:hover {
            background-color: #f9fafb;
        }

        .calendar-day.active {
            background-color: #eff6ff;
            border: 2px solid #3b82f6;
            padding: calc(0.5rem - 2px);
        }

        .calendar-day.today {
            background-color: #f0f9ff;
        }
        
        .calendar-day.today .day-number {
            color: #2563eb;
            font-weight: 800;
        }

        .calendar-day.other-month {
            background-color: #f9fafb;
            color: #9ca3af;
        }

        .calendar-todo-item {
            font-size: 0.7rem;
            padding: 2px 4px;
            margin-bottom: 2px;
            border-radius: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
        }

        .calendar-todo-item.completed {
            text-decoration: line-through;
            opacity: 0.5;
        }

        /* Category Colors - Original Blue/Indigo Theme */
        .bg-cat-homework { background-color: #dcfce7; color: #166534; border-left: 3px solid #22c55e; }
        .bg-cat-work { background-color: #fee2e2; color: #991b1b; border-left: 3px solid #ef4444; }
        .bg-cat-exercise { background-color: #e0e7ff; color: #3730a3; border-left: 3px solid #6366f1; }
        .bg-cat-etc { background-color: #f3f4f6; color: #374151; border-left: 3px solid #9ca3af; }

        .cat-homework { background-color: #22c55e; }
        .cat-work { background-color: #ef4444; }
        .cat-exercise { background-color: #6366f1; }
        .cat-etc { background-color: #9ca3af; }

        .todo-item.completed span {
            text-decoration: line-through;
            color: #9ca3af;
        }

        .day-chip {
            cursor: pointer;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            transition: all 0.2s;
        }
        .day-chip.selected {
            background-color: #3b82f6;
            color: white;
            border-color: #2563eb;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row md:items-center justify-between mb-8 bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <div>
                <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">은오의 TODO</h1>
                <p class="text-gray-500 text-sm mt-1">스마트하게 관리하는 나의 하루</p>
            </div>
            <div class="flex gap-4 mt-4 md:mt-0">
                <div class="text-center bg-gray-50 px-4 py-2 rounded-lg border border-gray-100">
                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Total Tasks</p>
                    <p id="total-count" class="text-xl font-bold text-gray-800">0</p>
                </div>
                <div class="text-center bg-blue-50 px-4 py-2 rounded-lg border border-blue-100">
                    <p class="text-[10px] text-blue-400 font-bold uppercase tracking-wider">Completed</p>
                    <p id="completed-count" class="text-xl font-bold text-blue-600">0</p>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 xl:grid-cols-4 gap-8">
            <!-- Calendar Section -->
            <div class="xl:col-span-3 bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <div class="flex items-center justify-between mb-6">
                    <h2 id="calendar-month" class="text-2xl font-bold text-gray-800"></h2>
                    <div class="flex gap-2">
                        <button onclick="changeMonth(-1)" class="p-2 hover:bg-gray-100 rounded-lg transition-colors text-gray-600">◀</button>
                        <button onclick="goToToday()" class="px-4 py-2 text-sm font-semibold text-blue-600 hover:bg-blue-50 rounded-lg transition-colors">Today</button>
                        <button onclick="changeMonth(1)" class="p-2 hover:bg-gray-100 rounded-lg transition-colors text-gray-600">▶</button>
                    </div>
                </div>
                
                <div class="grid grid-cols-7 text-center font-bold text-gray-400 text-xs mb-2">
                    <div class="text-red-400 uppercase tracking-widest">Sun</div>
                    <div class="uppercase tracking-widest">Mon</div>
                    <div class="uppercase tracking-widest">Tue</div>
                    <div class="uppercase tracking-widest">Wed</div>
                    <div class="uppercase tracking-widest">Thu</div>
                    <div class="uppercase tracking-widest">Fri</div>
                    <div class="text-blue-400 uppercase tracking-widest">Sat</div>
                </div>
                <div id="calendar-body" class="calendar-grid"></div>
            </div>

            <!-- To-Do Section -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 h-fit sticky top-8">
                <h2 id="selected-date-label" class="text-xl font-bold text-gray-800 mb-6 border-b pb-4">날짜를 선택하세요</h2>
                
                <div class="space-y-4 mb-8">
                    <div>
                        <label class="text-xs font-bold text-gray-400 uppercase tracking-wider ml-1">Task Name</label>
                        <input type="text" id="todo-input" placeholder="할 일을 입력하세요..." 
                               class="w-full px-4 py-3 mt-1 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                    </div>

                    <div>
                        <label class="text-xs font-bold text-gray-400 uppercase tracking-wider ml-1">Category</label>
                        <select id="category-input" onchange="toggleInputType()" class="w-full px-4 py-3 mt-1 rounded-lg border border-gray-200 focus:outline-none bg-white text-gray-700">
                            <option value="과제">과제 (마감일 지정)</option>
                            <option value="알바">알바 (요일 반복)</option>
                            <option value="운동">운동 (요일 반복)</option>
                            <option value="기타">기타 (일반)</option>
                        </select>
                    </div>

                    <div id="deadline-container">
                        <label class="text-xs font-bold text-gray-400 uppercase tracking-wider ml-1">Deadline</label>
                        <input type="date" id="deadline-input" class="w-full px-4 py-3 mt-1 rounded-lg border border-gray-200 focus:outline-none bg-white">
                    </div>

                    <div id="repeat-container" class="hidden">
                        <label class="text-xs font-bold text-gray-400 uppercase tracking-wider ml-1">Repeat Days</label>
                        <div class="flex flex-wrap gap-2 mt-2">
                            <span class="day-chip" data-day="0">일</span>
                            <span class="day-chip" data-day="1">월</span>
                            <span class="day-chip" data-day="2">화</span>
                            <span class="day-chip" data-day="3">수</span>
                            <span class="day-chip" data-day="4">목</span>
                            <span class="day-chip" data-day="5">금</span>
                            <span class="day-chip" data-day="6">토</span>
                        </div>
                    </div>
                    
                    <button onclick="addTodo()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition-colors shadow-lg shadow-blue-100">
                        Add Task
                    </button>
                </div>

                <div id="todo-list-container">
                    <ul id="todo-list" class="space-y-3"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentDate = new Date();
        let selectedDateKey = new Date().toLocaleDateString('en-CA');
        
        let todos = JSON.parse(localStorage.getItem('calendar_todos')) || {};

        const categoryMap = { '과제': 'cat-homework', '알바': 'cat-work', '운동': 'cat-exercise', '기타': 'cat-etc' };
        const categoryBgMap = { '과제': 'bg-cat-homework', '알바': 'bg-cat-work', '운동': 'bg-cat-exercise', '기타': 'bg-cat-etc' };

        function init() {
            document.querySelectorAll('.day-chip').forEach(chip => {
                chip.onclick = () => chip.classList.toggle('selected');
            });
            
            selectDate(selectedDateKey);
            updateStats();
        }

        function toggleInputType() {
            const cat = document.getElementById('category-input').value;
            const deadlineCont = document.getElementById('deadline-container');
            const repeatCont = document.getElementById('repeat-container');
            
            if (cat === '과제') {
                deadlineCont.classList.remove('hidden');
                repeatCont.classList.add('hidden');
            } else if (cat === '알바' || cat === '운동') {
                deadlineCont.classList.add('hidden');
                repeatCont.classList.remove('hidden');
            } else {
                deadlineCont.classList.add('hidden');
                repeatCont.classList.add('hidden');
            }
        }

        function renderCalendar() {
            const calendarBody = document.getElementById('calendar-body');
            const monthLabel = document.getElementById('calendar-month');
            calendarBody.innerHTML = '';

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            monthLabel.innerText = `${year}년 ${month + 1}월`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const prevMonthLastDay = new Date(year, month, 0).getDate();

            for (let i = firstDay - 1; i >= 0; i--) {
                calendarBody.appendChild(createDayElement(year, month - 1, prevMonthLastDay - i, true));
            }
            for (let i = 1; i <= daysInMonth; i++) {
                calendarBody.appendChild(createDayElement(year, month, i, false));
            }
            const remaining = (calendarBody.children.length > 35 ? 42 : 35) - calendarBody.children.length;
            for (let i = 1; i <= remaining; i++) {
                calendarBody.appendChild(createDayElement(year, month + 1, i, true));
            }
        }

        function createDayElement(y, m, d, isOtherMonth) {
            const date = new Date(y, m, d);
            const key = date.toLocaleDateString('en-CA');
            const div = document.createElement('div');
            div.className = `calendar-day ${isOtherMonth ? 'other-month' : ''}`;
            if (key === new Date().toLocaleDateString('en-CA')) div.classList.add('today');
            if (key === selectedDateKey) div.classList.add('active');

            div.innerHTML = `<div class="day-number text-sm font-bold">${d}</div>`;
            
            const dayTodos = [...(todos[key] || [])];
            
            Object.values(todos).flat().forEach(t => {
                if (t.repeatDays && t.repeatDays.includes(date.getDay().toString())) {
                    if (!dayTodos.find(dt => dt.id === t.id)) {
                        dayTodos.push(t);
                    }
                }
            });

            if (dayTodos.length > 0) {
                const list = document.createElement('div');
                list.className = 'flex-1 overflow-hidden pointer-events-none mt-1';
                dayTodos.forEach((todo, idx) => {
                    if (idx < 3) {
                        const item = document.createElement('div');
                        const isCompleted = isTodoCompleted(todo, key);
                        item.className = `calendar-todo-item ${categoryBgMap[todo.category]} ${isCompleted ? 'completed' : ''}`;
                        item.innerText = todo.text;
                        list.appendChild(item);
                    } else if (idx === 3) {
                        const more = document.createElement('div');
                        more.className = 'text-[9px] text-gray-400 font-bold ml-1';
                        more.innerText = `+${dayTodos.length - 3} more`;
                        list.appendChild(more);
                    }
                });
                div.appendChild(list);
            }

            div.onclick = () => selectDate(key);
            return div;
        }

        function isTodoCompleted(todo, dateKey) {
            if (!todo.repeatDays) return todo.completed;
            if (!todo.completedDates) return false;
            return todo.completedDates.includes(dateKey);
        }

        function selectDate(key) {
            selectedDateKey = key;
            const dateObj = new Date(key);
            document.getElementById('selected-date-label').innerText = `${dateObj.getMonth()+1}월 ${dateObj.getDate()}일의 일정`;
            renderCalendar();
            renderTodoList();
        }

        function renderTodoList() {
            const list = document.getElementById('todo-list');
            list.innerHTML = '';
            
            const date = new Date(selectedDateKey);
            const dayOfWeek = date.getDay().toString();

            const dayTodos = [];
            if (todos[selectedDateKey]) {
                todos[selectedDateKey].forEach(t => dayTodos.push(t));
            }
            
            Object.values(todos).flat().forEach(t => {
                if (t.repeatDays && t.repeatDays.includes(dayOfWeek)) {
                    if (!dayTodos.find(dt => dt.id === t.id)) {
                        dayTodos.push(t);
                    }
                }
            });

            if (dayTodos.length === 0) {
                list.innerHTML = '<div class="text-center py-12 opacity-30 text-xs font-bold text-gray-400 uppercase tracking-widest">No Tasks Found</div>';
                return;
            }

            dayTodos.forEach((todo) => {
                const isCompleted = isTodoCompleted(todo, selectedDateKey);
                const li = document.createElement('li');
                li.className = `todo-item group flex items-center justify-between p-3 rounded-lg border border-gray-100 bg-gray-50 hover:bg-white hover:shadow-sm transition-all ${isCompleted ? 'completed' : ''}`;
                
                let infoText = '';
                if (todo.category === '과제' && todo.deadline) {
                    const diff = Math.ceil((new Date(todo.deadline) - new Date(selectedDateKey)) / (1000*60*60*24));
                    infoText = `D-${diff} (${todo.deadline})`;
                } else if (todo.repeatDays) {
                    const days = ['일','월','화','수','목','금','토'];
                    infoText = `매주 ${todo.repeatDays.map(d => days[d]).join(',')}`;
                }

                li.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <input type="checkbox" ${isCompleted ? 'checked' : ''} onchange="toggleTodo('${todo.id}')" class="w-4 h-4 rounded text-blue-600 cursor-pointer">
                        <div class="flex flex-col truncate">
                            <span class="text-sm font-semibold text-gray-700 truncate">${todo.text}</span>
                            <div class="flex items-center gap-2 mt-0.5">
                                <span class="text-[9px] uppercase font-black flex items-center gap-1">
                                    <span class="w-1.5 h-1.5 rounded-full ${categoryMap[todo.category]}"></span>
                                    ${todo.category}
                                </span>
                                ${infoText ? `<span class="text-[9px] font-bold text-gray-400">${infoText}</span>` : ''}
                            </div>
                        </div>
                    </div>
                    <button onclick="deleteTodo('${todo.id}')" class="p-1.5 text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                `;
                list.appendChild(li);
            });
        }

        function addTodo() {
            const input = document.getElementById('todo-input');
            const cat = document.getElementById('category-input').value;
            const deadline = document.getElementById('deadline-input').value;
            const selectedRepeatDays = Array.from(document.querySelectorAll('.day-chip.selected')).map(c => c.dataset.day);
            
            if (!input.value.trim()) return;

            const newTodo = {
                id: 'todo_' + Date.now(),
                text: input.value.trim(),
                category: cat,
                completed: false,
                deadline: (cat === '과제') ? deadline : null,
                repeatDays: (cat === '알바' || cat === '운동') ? selectedRepeatDays : null,
                completedDates: [] 
            };

            if (!todos[selectedDateKey]) todos[selectedDateKey] = [];
            todos[selectedDateKey].push(newTodo);

            input.value = '';
            document.getElementById('deadline-input').value = '';
            document.querySelectorAll('.day-chip').forEach(c => c.classList.remove('selected'));
            
            saveAndRefresh();
        }

        function toggleTodo(todoId) {
            for (let dateKey in todos) {
                const todo = todos[dateKey].find(t => t.id === todoId);
                if (todo) {
                    if (todo.repeatDays) {
                        if (!todo.completedDates) todo.completedDates = [];
                        const index = todo.completedDates.indexOf(selectedDateKey);
                        if (index > -1) todo.completedDates.splice(index, 1);
                        else todo.completedDates.push(selectedDateKey);
                    } else {
                        todo.completed = !todo.completed;
                    }
                    break;
                }
            }
            saveAndRefresh();
        }

        function deleteTodo(todoId) {
            for (let dateKey in todos) {
                const index = todos[dateKey].findIndex(t => t.id === todoId);
                if (index > -1) {
                    todos[dateKey].splice(index, 1);
                    if (todos[dateKey].length === 0) delete todos[dateKey];
                    break;
                }
            }
            saveAndRefresh();
        }

        function saveAndRefresh() {
            localStorage.setItem('calendar_todos', JSON.stringify(todos));
            renderCalendar();
            renderTodoList();
            updateStats();
        }

        function updateStats() {
            let total = 0, completed = 0;
            Object.values(todos).forEach(list => list.forEach(item => { 
                total++; 
                if (item.completed || (item.completedDates && item.completedDates.length > 0)) completed++; 
            }));
            document.getElementById('total-count').innerText = total;
            document.getElementById('completed-count').innerText = completed;
        }

        function changeMonth(delta) { currentDate.setMonth(currentDate.getMonth() + delta); renderCalendar(); }
        function goToToday() { currentDate = new Date(); selectDate(currentDate.toLocaleDateString('en-CA')); }

        window.onload = init;
    </script>
</body>
</html>
