<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>레시픽 (Reci-Pick)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* 기본 애니메이션 및 스타일 */
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
      }
      .view-section {
        display: none;
        flex-direction: column;
        height: 100%;
        overflow-y: auto;
      }
      .view-section.active {
        display: flex;
        animation: fadeIn 0.3s ease-in-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 20px);
      }
      /* 요리 모드 진행바 트랜지션 */
      #cook-progress-bar {
        transition: width 0.3s ease-out;
      }
      /* 스크롤바 숨기기 (카테고리 필터용) */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body
    class="bg-gray-100 flex justify-center h-screen overflow-hidden text-gray-800"
  >
    <!-- 모바일 앱 컨테이너 -->
    <div
      class="w-full max-w-md bg-white shadow-2xl relative flex flex-col h-full overflow-hidden"
    >
      <!-- 공통 헤더 (요리 모드 제외) -->
      <header
        id="main-header"
        class="px-5 py-4 flex items-center justify-between border-b border-gray-100 bg-white z-10 shrink-0"
      >
        <div class="flex items-center gap-2">
          <svg
            class="text-orange-500 w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"
            ></path>
            <line x1="6" y1="17" x2="18" y2="17"></line>
          </svg>
          <h1 class="text-xl font-bold text-gray-900 tracking-tight">레시픽</h1>
        </div>
        <button
          id="btn-close-detail"
          class="hidden p-2 -mr-2 text-gray-500 hover:bg-gray-100 rounded-full"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </header>

      <!-- 메인 콘텐츠 영역 -->
      <main class="flex-1 relative overflow-hidden bg-gray-50">
        <!-- 1. 홈 (아카이브) 뷰 -->
        <section
          id="view-home"
          class="view-section active p-4 space-y-4 pb-24 relative"
        >
          <!-- 검색 및 카테고리 (Sticky) -->
          <div class="sticky top-0 bg-gray-50 z-10 pt-1 pb-3 space-y-3">
            <div class="relative">
              <input
                type="text"
                id="search-input"
                placeholder="재료나 요리 이름 검색..."
                class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-orange-500 outline-none text-sm shadow-sm bg-white"
              />
              <svg
                class="w-5 h-5 text-gray-400 absolute left-3 top-3.5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                ></path>
              </svg>
            </div>
            <div
              id="category-filter"
              class="flex gap-2 overflow-x-auto no-scrollbar pb-1"
            >
              <!-- 카테고리 동적 렌더링 -->
            </div>
          </div>

          <div
            id="empty-state"
            class="hidden flex-col items-center justify-center h-full text-center text-gray-500 p-6 pt-10"
          >
            <svg
              class="w-12 h-12 text-gray-300 mb-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"
              ></path>
              <line x1="6" y1="17" x2="18" y2="17"></line>
            </svg>
            <p class="text-lg font-semibold mb-2">
              조건에 맞는 레시피가 없어요
            </p>
          </div>
          <div id="recipe-list" class="space-y-4"></div>
        </section>

        <!-- 2. 레시피 추가 뷰 (AI 추출) -->
        <section id="view-add" class="view-section bg-white p-5 pb-24">
          <h2 class="text-xl font-bold mb-4">새 레시피 추가</h2>

          <!-- 추가 방식 탭 -->
          <div class="flex p-1 bg-gray-100 rounded-lg mb-6 shrink-0">
            <button
              id="tab-ai-btn"
              class="flex-1 py-2 text-sm font-semibold rounded-md bg-white shadow text-orange-600 transition-colors"
            >
              AI로 추출
            </button>
            <button
              id="tab-manual-btn"
              class="flex-1 py-2 text-sm font-semibold rounded-md text-gray-500 transition-colors"
            >
              직접 작성
            </button>
          </div>

          <!-- AI 추출 섹션 -->
          <div id="add-ai-section" class="flex flex-col flex-1">
            <div
              class="bg-orange-50 border border-orange-100 rounded-xl p-4 mb-6"
            >
              <p class="text-sm text-orange-800 font-medium mb-1">
                영상 링크나 텍스트를 붙여넣으세요.
              </p>
              <p class="text-xs text-orange-600">
                AI가 불필요한 잡담을 빼고 요리 제목, 재료, 순서만 쏙 뽑아줍니다.
              </p>
            </div>
            <textarea
              id="ai-extract-input"
              class="w-full p-4 border border-gray-300 rounded-xl bg-gray-50 resize-none h-40 mb-4 focus:ring-2 focus:ring-orange-500 outline-none"
              placeholder="예: 유튜브 링크(https://...) 또는 요리 블로그 글 복사 붙여넣기"
            ></textarea>

            <button
              id="btn-extract"
              class="mt-auto w-full py-4 rounded-xl font-bold text-white shadow-md bg-orange-500 hover:bg-orange-600 transition-colors flex justify-center items-center gap-2"
            >
              <span>AI로 레시피 정제하기</span>
            </button>
          </div>

          <!-- 수동 입력 섹션 -->
          <div
            id="add-manual-section"
            class="hidden flex flex-col flex-1 space-y-4 overflow-y-auto pb-4"
          >
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1"
                >요리 제목*</label
              >
              <input
                type="text"
                id="manual-title"
                class="w-full p-3 border border-gray-300 rounded-xl bg-gray-50 focus:ring-2 focus:ring-orange-500 outline-none"
                placeholder="예: 초간단 간장계란밥"
              />
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1"
                >카테고리 (분류)</label
              >
              <input
                type="text"
                id="manual-category"
                class="w-full p-3 border border-gray-300 rounded-xl bg-gray-50 focus:ring-2 focus:ring-orange-500 outline-none"
                placeholder="예: 한식, 자취요리"
              />
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1"
                >원본 URL (선택)</label
              >
              <input
                type="url"
                id="manual-url"
                class="w-full p-3 border border-gray-300 rounded-xl bg-gray-50 focus:ring-2 focus:ring-orange-500 outline-none"
                placeholder="https://"
              />
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1"
                >재료 (쉼표로 구분)</label
              >
              <textarea
                id="manual-ingredients"
                class="w-full p-3 border border-gray-300 rounded-xl bg-gray-50 resize-none h-20 focus:ring-2 focus:ring-orange-500 outline-none"
                placeholder="예: 밥 1공기, 계란 1개, 간장 1T"
              ></textarea>
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1"
                >조리 순서 (줄바꿈으로 구분)</label
              >
              <textarea
                id="manual-steps"
                class="w-full p-3 border border-gray-300 rounded-xl bg-gray-50 resize-none h-28 focus:ring-2 focus:ring-orange-500 outline-none"
                placeholder="1. 팬에 기름을 두른다.&#10;2. 계란 후라이를 한다."
              ></textarea>
            </div>
            <button
              id="btn-manual-save"
              class="w-full py-4 rounded-xl font-bold text-white shadow-md bg-orange-500 hover:bg-orange-600 transition-colors mt-2"
            >
              기록 저장하기
            </button>
          </div>
        </section>

        <!-- 3. 냉장고 파먹기 뷰 (AI 생성) -->
        <section id="view-fridge" class="view-section bg-white p-5 pb-24">
          <h2 class="text-xl font-bold mb-4">냉장고 파먹기</h2>
          <div class="bg-green-50 border border-green-100 rounded-xl p-4 mb-6">
            <p class="text-sm text-green-800 font-medium mb-1">
              현재 있는 재료와 먹고 싶은 메뉴를 입력해주세요.
            </p>
            <p class="text-xs text-green-600">
              입력하신 정보를 기반으로 맛있는 맞춤형 레시피를 AI가 즉석에서
              생성합니다.
            </p>
          </div>

          <label class="block text-sm font-semibold text-gray-700 mb-1"
            >보유 재료 (필수)</label
          >
          <textarea
            id="ai-fridge-input"
            class="w-full p-4 border border-gray-300 rounded-xl bg-gray-50 resize-none h-24 mb-4 focus:ring-2 focus:ring-green-500 outline-none"
            placeholder="예: 감자 2개, 양파 반개, 스팸 1통, 계란 3개"
          ></textarea>

          <label class="block text-sm font-semibold text-gray-700 mb-1"
            >원하는 요리/스타일 (선택)</label
          >
          <input
            type="text"
            id="ai-fridge-style-input"
            class="w-full p-4 border border-gray-300 rounded-xl bg-gray-50 mb-6 focus:ring-2 focus:ring-green-500 outline-none"
            placeholder="예: 매콤한 찌개, 다이어트식, 맥주 안주"
          />

          <button
            id="btn-generate-fridge"
            class="w-full py-4 rounded-xl font-bold text-white shadow-md bg-green-500 hover:bg-green-600 transition-colors flex justify-center items-center gap-2"
          >
            <span>맞춤 레시피 생성하기</span>
          </button>
        </section>

        <!-- 4. 레시피 상세 뷰 -->
        <section id="view-detail" class="view-section bg-white pb-24 relative">
          <div class="p-6 pb-2 border-b border-gray-100">
            <div class="flex items-start justify-between mb-2">
              <h2
                id="detail-title"
                class="text-2xl font-bold text-gray-900 leading-snug"
              ></h2>
              <button
                id="btn-edit-recipe"
                class="p-2 -mr-2 text-gray-400 hover:text-orange-500 transition-colors"
              >
                <svg
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
                  ></path>
                  <path
                    d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
                  ></path>
                </svg>
              </button>
            </div>
            <div class="flex items-center gap-2 mb-3">
              <span
                id="detail-badge"
                class="inline-block bg-orange-100 text-orange-600 text-[10px] px-2 py-1 rounded-full font-bold"
              ></span>
              <span
                id="detail-category"
                class="inline-block bg-gray-100 text-gray-600 text-[10px] px-2 py-1 rounded-full font-bold"
              ></span>
            </div>
            <a
              id="detail-url"
              href="#"
              target="_blank"
              class="hidden items-center gap-1 text-sm text-blue-500 bg-blue-50 px-3 py-1.5 rounded-lg mb-4 hover:bg-blue-100 inline-flex w-fit"
            >
              <svg
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                stroke-width="2"
              >
                <path
                  d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
                ></path>
                <path
                  d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
                ></path>
              </svg>
              원본 링크 열기
            </a>
          </div>
          <div class="p-6">
            <section class="mb-8">
              <h3
                class="text-lg font-bold flex items-center gap-2 mb-4 text-orange-500"
              >
                <svg
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                  stroke-width="2"
                >
                  <path d="M9 11l3 3L22 4"></path>
                  <path
                    d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"
                  ></path>
                </svg>
                <span class="text-gray-900">준비 재료</span>
              </h3>
              <ul
                id="detail-ingredients"
                class="grid grid-cols-2 gap-y-2 gap-x-4"
              ></ul>
            </section>
            <section>
              <h3
                class="text-lg font-bold flex items-center gap-2 mb-4 text-orange-500"
              >
                <svg
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                  stroke-width="2"
                >
                  <path
                    d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"
                  ></path>
                  <path d="M9 12l2 2 4-4"></path>
                </svg>
                <span class="text-gray-900">조리 순서</span>
              </h3>
              <div id="detail-steps" class="space-y-4"></div>
            </section>
          </div>
          <div class="p-6 flex gap-3 mt-4">
            <button
              id="btn-delete"
              class="px-4 py-3 text-red-500 bg-red-50 rounded-xl font-semibold flex-1 active:bg-red-100 transition-colors"
            >
              삭제
            </button>
            <button
              id="btn-start-cook"
              class="px-4 py-3 bg-gray-900 text-white rounded-xl font-bold flex-[2] flex justify-center items-center gap-2 shadow-lg active:bg-black transition-colors"
            >
              <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                <path d="M5 3l14 9-14 9V3z"></path>
              </svg>
              요리 모드 시작
            </button>
          </div>
        </section>

        <!-- 4-1. 레시피 수정 뷰 -->
        <section
          id="view-edit"
          class="view-section bg-white p-5 pb-24 relative"
        >
          <h2 class="text-xl font-bold mb-4">레시피 수정</h2>
          <div class="flex flex-col flex-1 space-y-4 overflow-y-auto pb-4">
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1"
                >요리 제목*</label
              >
              <input
                type="text"
                id="edit-title"
                class="w-full p-3 border border-gray-300 rounded-xl bg-gray-50 focus:ring-2 focus:ring-orange-500 outline-none"
              />
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1"
                >카테고리 (분류)</label
              >
              <input
                type="text"
                id="edit-category"
                class="w-full p-3 border border-gray-300 rounded-xl bg-gray-50 focus:ring-2 focus:ring-orange-500 outline-none"
              />
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1"
                >원본 URL</label
              >
              <input
                type="url"
                id="edit-url"
                class="w-full p-3 border border-gray-300 rounded-xl bg-gray-50 focus:ring-2 focus:ring-orange-500 outline-none"
              />
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1"
                >재료 (쉼표로 구분)</label
              >
              <textarea
                id="edit-ingredients"
                class="w-full p-3 border border-gray-300 rounded-xl bg-gray-50 resize-none h-24 focus:ring-2 focus:ring-orange-500 outline-none"
              ></textarea>
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1"
                >조리 순서 (줄바꿈으로 구분)</label
              >
              <textarea
                id="edit-steps"
                class="w-full p-3 border border-gray-300 rounded-xl bg-gray-50 resize-none h-32 focus:ring-2 focus:ring-orange-500 outline-none"
              ></textarea>
            </div>
            <button
              id="btn-edit-save"
              class="w-full py-4 rounded-xl font-bold text-white shadow-md bg-orange-500 hover:bg-orange-600 transition-colors mt-2"
            >
              수정 완료
            </button>
          </div>
        </section>

        <!-- 5. 요리 모드 (전체 화면 덮기) -->
        <section
          id="view-cook"
          class="fixed inset-0 bg-gray-900 text-white z-50 flex flex-col hidden"
        >
          <header class="p-4 flex items-center justify-between shrink-0">
            <button
              id="btn-close-cook"
              class="p-2 bg-gray-800 rounded-full text-gray-300 hover:text-white"
            >
              <svg
                class="w-6 h-6"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
            <div id="cook-step-counter" class="text-sm font-bold text-gray-400">
              1 / 5
            </div>
          </header>

          <div class="h-1 bg-gray-800 w-full shrink-0">
            <div
              id="cook-progress-bar"
              class="h-full bg-orange-500"
              style="width: 0%"
            ></div>
          </div>

          <!-- 스와이프 영역 -->
          <div
            id="cook-swipe-area"
            class="flex-1 flex flex-col items-center justify-center p-8 select-none touch-pan-y"
          >
            <h4
              id="cook-step-title"
              class="text-orange-400 font-bold mb-6 text-xl text-center"
            >
              Step 1
            </h4>
            <p
              id="cook-step-text"
              class="text-3xl md:text-4xl font-bold text-center leading-snug break-keep text-gray-50"
            ></p>

            <div
              class="mt-16 text-gray-500 flex items-center gap-2 text-sm animate-pulse"
            >
              <svg
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                stroke-width="2"
              >
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
              화면을 스와이프 하세요
              <svg
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                stroke-width="2"
              >
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </div>
          </div>

          <!-- 하단 네비게이션 버튼 (터치 보조) -->
          <div class="flex p-4 gap-4 pb-safe shrink-0">
            <button
              id="btn-cook-prev"
              class="flex-1 py-5 bg-gray-800 rounded-2xl flex justify-center items-center disabled:opacity-30 disabled:cursor-not-allowed active:bg-gray-700 transition-colors"
            >
              <svg
                class="w-8 h-8"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                stroke-width="2"
              >
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
            </button>
            <button
              id="btn-cook-next"
              class="flex-1 py-5 bg-gray-800 rounded-2xl flex justify-center items-center disabled:opacity-30 disabled:cursor-not-allowed active:bg-gray-700 transition-colors"
            >
              <svg
                class="w-8 h-8"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                stroke-width="2"
              >
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </button>
          </div>
        </section>
      </main>

      <!-- 하단 GNB (Global Navigation Bar) -->
      <nav
        id="bottom-nav"
        class="absolute bottom-0 w-full bg-white border-t border-gray-100 px-6 py-2 flex justify-between items-center z-20 pb-safe"
      >
        <button
          onclick="navigateTo('home')"
          class="nav-btn flex flex-col items-center gap-1 w-16"
          data-target="home"
        >
          <svg
            class="w-6 h-6 mb-0.5 nav-icon"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            stroke-width="2"
          >
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span class="text-[10px] font-medium nav-text">아카이브</span>
        </button>
        <button
          onclick="navigateTo('add')"
          class="nav-btn bg-orange-500 text-white p-3 rounded-full shadow-lg transform -translate-y-4 hover:bg-orange-600 transition-colors"
          data-target="add"
        >
          <svg
            class="w-7 h-7"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            stroke-width="2"
          >
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <button
          onclick="navigateTo('fridge')"
          class="nav-btn flex flex-col items-center gap-1 w-16"
          data-target="fridge"
        >
          <svg
            class="w-6 h-6 mb-0.5 nav-icon"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            stroke-width="2"
          >
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path
              d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"
            ></path>
          </svg>
          <span class="text-[10px] font-medium nav-text">냉장고</span>
        </button>
      </nav>
    </div>

    <!-- 글로벌 로딩 오버레이 -->
    <div
      id="loading-overlay"
      class="fixed inset-0 bg-black bg-opacity-50 z-[100] hidden flex-col items-center justify-center text-white"
    >
      <svg
        class="animate-spin h-10 w-10 mb-4"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
      >
        <circle
          class="opacity-25"
          cx="12"
          cy="12"
          r="10"
          stroke="currentColor"
          stroke-width="4"
        ></circle>
        <path
          class="opacity-75"
          fill="currentColor"
          d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
        ></path>
      </svg>
      <p id="loading-text" class="font-bold text-lg">
        AI가 레시피를 분석중입니다...
      </p>
    </div>

    <script>
      // --- 1. 상태 관리 (변수 최상단 배치로 TDZ 호이스팅 오류 방지) ---
      const STORAGE_KEY = 'recipick_recipes_vanilla';
      let recipes = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      let currentRecipeId = null;
      let currentSearchTerm = '';
      let currentCategory = '전체';

      function saveRecipes() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(recipes));
        renderHome();
      }

      // --- 2. Gemini API 연동 ---
      const apiKey = ''; // 실행 환경에서 런타임 제공
      let customApiKey = localStorage.getItem('gemini_custom_key') || '';

      async function callGeminiAPI(promptText, systemInstruction) {
        const payload = {
          contents: [{ parts: [{ text: promptText }] }],
          systemInstruction: { parts: [{ text: systemInstruction }] },
          generationConfig: {
            responseMimeType: 'application/json',
            responseSchema: {
              type: 'OBJECT',
              properties: {
                title: { type: 'STRING' },
                ingredients: { type: 'ARRAY', items: { type: 'STRING' } },
                steps: { type: 'ARRAY', items: { type: 'STRING' } },
              },
              required: ['title', 'ingredients', 'steps'],
            },
          },
        };

        let delay = 1000;
        for (let i = 0; i < 5; i++) {
          try {
            const activeKey = customApiKey || apiKey;
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${activeKey}`;

            const response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
            });

            if (response.status === 401 || response.status === 403) {
              const userInput = prompt(
                'API 인증 오류(401/403)가 발생했습니다. 브라우저 세션이 만료되었거나 Canvas 외부 환경입니다.\n본인의 Gemini API 키를 입력해주세요 (취소 시 중단):',
                customApiKey
              );
              if (userInput) {
                customApiKey = userInput.trim();
                localStorage.setItem('gemini_custom_key', customApiKey);
                i--;
                continue;
              } else {
                throw new Error('인증 실패: API 키가 누락되었습니다.');
              }
            }

            if (!response.ok)
              throw new Error(`HTTP error! status: ${response.status}`);

            const result = await response.json();
            const textResponse =
              result.candidates?.[0]?.content?.parts?.[0]?.text;

            if (!textResponse) throw new Error('응답에 텍스트가 없습니다.');
            return JSON.parse(textResponse);
          } catch (error) {
            if (
              error.message.includes('인증 실패') ||
              error.message.includes('401') ||
              error.message.includes('403')
            ) {
              throw error;
            }

            if (i === 4) {
              console.error('Gemini API Error after 5 retries:', error);
              throw error;
            }
            await new Promise((r) => setTimeout(r, delay));
            delay *= 2;
          }
        }
      }

      // 로딩 UI 제어
      function showLoading(text) {
        document.getElementById('loading-text').innerText = text;
        document.getElementById('loading-overlay').classList.remove('hidden');
        document.getElementById('loading-overlay').classList.add('flex');
      }
      function hideLoading() {
        document.getElementById('loading-overlay').classList.add('hidden');
        document.getElementById('loading-overlay').classList.remove('flex');
      }

      // --- 3. 주요 기능 로직 ---

      // URL에서 텍스트 추출 프록시
      async function fetchUrlContent(url) {
        try {
          const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(
            url
          )}`;
          const response = await fetch(proxyUrl);

          if (!response.ok) {
            console.warn('프록시 응답 실패. Gemini 자체 검색으로 전환합니다.');
            return null;
          }

          const data = await response.json();
          if (!data || !data.contents) return null;

          const parser = new DOMParser();
          const doc = parser.parseFromString(data.contents, 'text/html');

          doc
            .querySelectorAll(
              'script, style, nav, footer, header, noscript, iframe'
            )
            .forEach((el) => el.remove());

          const title = doc.title || '';
          const metaDesc =
            doc.querySelector('meta[name="description"]')?.content ||
            doc.querySelector('meta[property="og:description"]')?.content ||
            '';

          const mainContent = doc.querySelector(
            'article, main, .post-content, .entry-content, #content'
          );
          let bodyText = mainContent
            ? mainContent.innerText
            : doc.body.innerText;

          bodyText = bodyText.replace(/\s+/g, ' ').trim();

          return `[페이지 제목]: ${title}\n[요약 설명]: ${metaDesc}\n[본문 내용]: ${bodyText.substring(
            0,
            10000
          )}`;
        } catch (error) {
          console.warn(
            'URL 텍스트 추출 불가. Gemini 검색으로 대체합니다.',
            error.message
          );
          return null;
        }
      }

      // [기능 1] 텍스트/URL에서 레시피 추출
      document
        .getElementById('btn-extract')
        .addEventListener('click', async () => {
          const input = document
            .getElementById('ai-extract-input')
            .value.trim();
          if (!input) return alert('추출할 링크나 텍스트를 입력해주세요.');

          let promptContent = input;
          const isUrl = /^https?:\/\//i.test(input);

          if (isUrl) {
            showLoading('URL에 접속하여 웹페이지 내용을 스크랩 중입니다...');
            const extractedText = await fetchUrlContent(input);

            if (extractedText && extractedText.length > 100) {
              promptContent = `다음은 사용자가 입력한 URL에서 직접 스크랩한 원본 텍스트입니다.\n\n---\n${extractedText}\n---\n\n위 내용에서 실제 레시피 정보를 찾아 정제해주세요.`;
            } else {
              promptContent = `다음 URL의 레시피를 추출해주세요: ${input}\n(텍스트 직접 스크랩이 제한된 환경이므로, 검색 도구를 활용해 링크의 실제 내용을 최대한 확인해주세요.)`;
            }
          }

          showLoading('AI가 레시피를 분석 및 정제하고 있습니다...');
          try {
            const systemPrompt = `너는 웹페이지 텍스트를 분석하여 요리 레시피를 추출하는 AI야. 
가장 중요한 원칙: "절대로 임의의 레시피를 지어내지 마라." 
사용자가 제공한 텍스트 내용이나 URL의 '실제 내용'에 기반해서만 요리 제목, 재료 목록, 조리 순서를 JSON으로 반환해. 한국어 계량 표현(한 꼬집 등)은 원본 그대로 유지해.
만약 제공된 내용에서 레시피 정보(재료나 순서)를 명확하게 찾을 수 없다면, 임의로 생성하지 말고 title에 "레시피 정보를 찾을 수 없습니다"라고 적고 ingredients와 steps는 빈 배열([])을 반환해. 거짓말하거나 없는 내용을 지어내지 마.`;

            const recipeData = await callGeminiAPI(promptContent, systemPrompt);

            if (
              recipeData.title === '레시피 정보를 찾을 수 없습니다' ||
              (recipeData.ingredients.length === 0 &&
                recipeData.steps.length === 0)
            ) {
              alert(
                '입력하신 링크나 텍스트에서 명확한 레시피 정보를 찾을 수 없습니다.\n(유튜브 영상 등은 텍스트 내용 스크랩이 차단되어 있을 수 있습니다.)'
              );
              hideLoading();
              return;
            }

            const newRecipe = {
              id: Date.now().toString(),
              title: recipeData.title || 'AI 추출 레시피',
              category: '미분류',
              originalUrl: isUrl ? input : '',
              ingredients: recipeData.ingredients || [],
              steps: recipeData.steps || [],
              type: 'AI 추출',
              createdAt: new Date().toISOString(),
            };

            recipes.unshift(newRecipe);
            saveRecipes();
            document.getElementById('ai-extract-input').value = '';
            navigateTo('detail', newRecipe.id);
          } catch (error) {
            if (error.message.includes('인증 실패')) {
              alert('API 키 입력이 취소되어 작업을 중단합니다.');
            } else {
              alert(
                '레시피를 추출하는 데 실패했습니다. 오류: ' + error.message
              );
            }
          } finally {
            hideLoading();
          }
        });

      // [기능 2] 냉장고 파먹기 (재료 + 요리 방향 기반 생성)
      document
        .getElementById('btn-generate-fridge')
        .addEventListener('click', async () => {
          const ingredients = document
            .getElementById('ai-fridge-input')
            .value.trim();
          const style = document
            .getElementById('ai-fridge-style-input')
            .value.trim();

          if (!ingredients)
            return alert('현재 가지고 계신 재료를 입력해주세요.');

          showLoading('입력하신 정보로 최적의 레시피를 창작 중입니다...');
          try {
            const systemPrompt =
              '너는 2030 자취생을 위한 천재 요리사 AI야. 사용자가 입력한 보유 재료들과 (입력된 경우) 원하는 요리 방향을 최대한 반영하여, 자취생이 쉽고 맛있게 만들 수 있는 레시피를 하나 창작해줘. 요리 제목은 흥미롭게 짓고, 재료와 조리 순서를 JSON으로 반환해. 물, 식용유, 소금, 간장 같은 기본 조미료는 사용자가 가지고 있다고 가정해도 좋아.';

            let promptText = `보유 재료: ${ingredients}`;
            if (style) {
              promptText += `\n원하는 요리 방향/스타일: ${style}`;
            }

            const recipeData = await callGeminiAPI(promptText, systemPrompt);

            const newRecipe = {
              id: Date.now().toString(),
              title: recipeData.title || '냉장고 파먹기 맞춤 요리',
              category: 'AI 창작',
              originalUrl: '',
              ingredients: recipeData.ingredients || [],
              steps: recipeData.steps || [],
              type: 'AI 창작 (냉장고)',
              createdAt: new Date().toISOString(),
            };

            recipes.unshift(newRecipe);
            saveRecipes();
            document.getElementById('ai-fridge-input').value = '';
            document.getElementById('ai-fridge-style-input').value = '';
            navigateTo('detail', newRecipe.id);
          } catch (error) {
            if (error.message.includes('인증 실패')) {
              alert('API 키 입력이 취소되어 작업을 중단합니다.');
            } else {
              alert(
                '레시피를 생성하는 데 실패했습니다. 오류: ' + error.message
              );
            }
          } finally {
            hideLoading();
          }
        });

      // --- 4. UI 렌더링 및 라우팅 ---
      function navigateTo(viewId, recipeId = null) {
        document
          .querySelectorAll('.view-section')
          .forEach((el) => el.classList.remove('active'));
        const targetView = document.getElementById(`view-${viewId}`);
        if (targetView) targetView.classList.add('active');

        const header = document.getElementById('main-header');
        const bottomNav = document.getElementById('bottom-nav');
        const btnCloseDetail = document.getElementById('btn-close-detail');

        if (viewId === 'cook') {
          header.classList.add('hidden');
          bottomNav.classList.add('hidden');
          initCookingMode(recipeId);
        } else {
          header.classList.remove('hidden');
          bottomNav.classList.remove('hidden');

          if (viewId === 'detail') {
            btnCloseDetail.classList.remove('hidden');
            btnCloseDetail.onclick = () => navigateTo('home');
            renderDetail(recipeId);
          } else if (viewId === 'edit') {
            btnCloseDetail.classList.remove('hidden');
            btnCloseDetail.onclick = () =>
              navigateTo('detail', currentRecipeId);
            renderEdit(recipeId);
          } else {
            btnCloseDetail.classList.add('hidden');
            if (viewId === 'home') renderHome();
          }
        }

        document.querySelectorAll('.nav-btn').forEach((btn) => {
          const icon = btn.querySelector('.nav-icon');
          const text = btn.querySelector('.nav-text');
          if (
            btn.dataset.target === viewId ||
            (viewId === 'detail' && btn.dataset.target === 'home') ||
            (viewId === 'edit' && btn.dataset.target === 'home')
          ) {
            if (icon) {
              icon.classList.add('text-orange-500');
              icon.classList.remove('text-gray-400');
            }
            if (text) {
              text.classList.add('text-orange-500');
              text.classList.remove('text-gray-400');
            }
          } else {
            if (icon) {
              icon.classList.remove('text-orange-500');
              icon.classList.add('text-gray-400');
            }
            if (text) {
              text.classList.remove('text-orange-500');
              text.classList.add('text-gray-400');
            }
          }
        });
      }

      function renderCategories() {
        const categoryContainer = document.getElementById('category-filter');
        const categories = [
          '전체',
          ...new Set(recipes.map((r) => r.category || '미분류')),
        ];

        categoryContainer.innerHTML = categories
          .map(
            (cat) => `
        <button onclick="setCategory('${cat}')" class="px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-colors border ${
              currentCategory === cat
                ? 'bg-gray-800 text-white border-gray-800'
                : 'bg-white text-gray-600 border-gray-200'
            }">
          ${cat}
        </button>
      `
          )
          .join('');
      }

      window.setCategory = function (cat) {
        currentCategory = cat;
        renderHome();
      };

      function renderHome() {
        renderCategories();
        const listContainer = document.getElementById('recipe-list');
        const emptyState = document.getElementById('empty-state');
        listContainer.innerHTML = '';

        let filteredRecipes = recipes.filter((r) => {
          const matchCategory =
            currentCategory === '전체' ||
            (r.category || '미분류') === currentCategory;
          const searchTarget = (
            r.title +
            ' ' +
            (r.ingredients ? r.ingredients.join(' ') : '')
          ).toLowerCase();
          const matchSearch = searchTarget.includes(currentSearchTerm);
          return matchCategory && matchSearch;
        });

        if (filteredRecipes.length === 0) {
          emptyState.classList.remove('hidden');
          emptyState.classList.add('flex');
        } else {
          emptyState.classList.add('hidden');
          emptyState.classList.remove('flex');

          filteredRecipes.forEach((recipe) => {
            const card = document.createElement('div');
            card.className =
              'bg-white border border-gray-100 rounded-2xl p-4 shadow-sm hover:shadow-md transition-shadow cursor-pointer active:scale-[0.98]';
            card.onclick = () => navigateTo('detail', recipe.id);

            let ingredientsHtml = '';
            if (recipe.ingredients && recipe.ingredients.length > 0) {
              const previewIng = recipe.ingredients.slice(0, 4);
              const extraCount = recipe.ingredients.length - 4;
              ingredientsHtml = `<div class="flex flex-wrap gap-1.5 mt-3">
              ${previewIng
                .map(
                  (ing) =>
                    `<span class="bg-gray-100 text-gray-600 text-[11px] px-2 py-1 rounded-md">${ing}</span>`
                )
                .join('')}
              ${
                extraCount > 0
                  ? `<span class="bg-gray-100 text-gray-500 text-[11px] px-2 py-1 rounded-md">+${extraCount}</span>`
                  : ''
              }
            </div>`;
            }

            card.innerHTML = `
            <div class="flex justify-between items-start mb-2">
              <h3 class="font-bold text-gray-900 text-base line-clamp-2 leading-tight pr-2">${
                recipe.title
              }</h3>
              <span class="bg-gray-100 text-gray-600 text-[10px] px-2 py-1 rounded-full font-bold whitespace-nowrap shrink-0">
                ${recipe.category || '미분류'}
              </span>
            </div>
            ${ingredientsHtml}
          `;
            listContainer.appendChild(card);
          });
        }
      }

      function renderDetail(id) {
        currentRecipeId = id;
        const recipe = recipes.find((r) => r.id === id);
        if (!recipe) return navigateTo('home');

        document.getElementById('detail-title').innerText = recipe.title;

        const badge = document.getElementById('detail-badge');
        badge.innerText = recipe.type;
        badge.className = `inline-block text-[10px] px-2 py-1 rounded-full font-bold ${
          recipe.type.includes('창작')
            ? 'bg-green-100 text-green-600'
            : 'bg-orange-100 text-orange-600'
        }`;

        document.getElementById('detail-category').innerText =
          recipe.category || '미분류';

        const urlEl = document.getElementById('detail-url');
        if (recipe.originalUrl) {
          urlEl.href = recipe.originalUrl;
          urlEl.classList.remove('hidden');
          urlEl.classList.add('inline-flex');
        } else {
          urlEl.classList.add('hidden');
          urlEl.classList.remove('inline-flex');
        }

        const ingContainer = document.getElementById('detail-ingredients');
        if (recipe.ingredients && recipe.ingredients.length > 0) {
          ingContainer.innerHTML = recipe.ingredients
            .map(
              (ing) => `
          <li class="flex items-center gap-2 text-gray-700 bg-gray-50 p-2 rounded-lg">
            <div class="w-1.5 h-1.5 rounded-full bg-orange-400 shrink-0"></div>
            <span class="text-sm">${ing}</span>
          </li>
        `
            )
            .join('');
        } else {
          ingContainer.innerHTML = `<li class="text-sm text-gray-500 col-span-2 p-2">입력된 재료가 없습니다.</li>`;
        }

        const stepsContainer = document.getElementById('detail-steps');
        const startCookBtn = document.getElementById('btn-start-cook');
        if (recipe.steps && recipe.steps.length > 0) {
          stepsContainer.innerHTML = recipe.steps
            .map(
              (step, idx) => `
          <div class="flex gap-4 items-start">
            <div class="flex-shrink-0 w-6 h-6 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center text-sm font-bold mt-0.5">
              ${idx + 1}
            </div>
            <p class="text-gray-700 leading-relaxed text-[15px] pt-0.5">${step}</p>
          </div>
        `
            )
            .join('');
          startCookBtn.style.display = 'flex';
        } else {
          stepsContainer.innerHTML = `<p class="text-sm text-gray-500 p-2">입력된 조리 순서가 없습니다.</p>`;
          startCookBtn.style.display = 'none';
        }
      }

      function renderEdit(id) {
        const recipe = recipes.find((r) => r.id === id);
        if (!recipe) return navigateTo('home');

        document.getElementById('edit-title').value = recipe.title || '';
        document.getElementById('edit-category').value = recipe.category || '';
        document.getElementById('edit-url').value = recipe.originalUrl || '';
        document.getElementById('edit-ingredients').value = (
          recipe.ingredients || []
        ).join(', ');
        document.getElementById('edit-steps').value = (recipe.steps || []).join(
          '\n'
        );
      }

      // --- 4-1. 수동 작성 & 수정 & 검색 관련 이벤트 ---
      document.getElementById('tab-ai-btn').addEventListener('click', () => {
        document.getElementById('add-ai-section').classList.remove('hidden');
        document.getElementById('add-manual-section').classList.add('hidden');
        document.getElementById('tab-ai-btn').className =
          'flex-1 py-2 text-sm font-semibold rounded-md bg-white shadow text-orange-600 transition-colors';
        document.getElementById('tab-manual-btn').className =
          'flex-1 py-2 text-sm font-semibold rounded-md text-gray-500 transition-colors';
      });

      document
        .getElementById('tab-manual-btn')
        .addEventListener('click', () => {
          document
            .getElementById('add-manual-section')
            .classList.remove('hidden');
          document.getElementById('add-ai-section').classList.add('hidden');
          document.getElementById('tab-manual-btn').className =
            'flex-1 py-2 text-sm font-semibold rounded-md bg-white shadow text-orange-600 transition-colors';
          document.getElementById('tab-ai-btn').className =
            'flex-1 py-2 text-sm font-semibold rounded-md text-gray-500 transition-colors';
        });

      document
        .getElementById('btn-manual-save')
        .addEventListener('click', () => {
          const title = document.getElementById('manual-title').value.trim();
          if (!title) return alert('요리 제목을 입력해주세요.');

          const newRecipe = {
            id: Date.now().toString(),
            title,
            category:
              document.getElementById('manual-category').value.trim() ||
              '미분류',
            originalUrl: document.getElementById('manual-url').value.trim(),
            ingredients: document
              .getElementById('manual-ingredients')
              .value.split(',')
              .map((i) => i.trim())
              .filter((i) => i),
            steps: document
              .getElementById('manual-steps')
              .value.split('\n')
              .map((s) => s.trim())
              .filter((s) => s),
            type: '직접 작성',
            createdAt: new Date().toISOString(),
          };

          recipes.unshift(newRecipe);
          saveRecipes();

          document.getElementById('manual-title').value = '';
          document.getElementById('manual-category').value = '';
          document.getElementById('manual-url').value = '';
          document.getElementById('manual-ingredients').value = '';
          document.getElementById('manual-steps').value = '';

          navigateTo('detail', newRecipe.id);
        });

      document.getElementById('search-input').addEventListener('input', (e) => {
        currentSearchTerm = e.target.value.trim().toLowerCase();
        renderHome();
      });

      document
        .getElementById('btn-edit-recipe')
        .addEventListener('click', () => {
          navigateTo('edit', currentRecipeId);
        });

      document.getElementById('btn-edit-save').addEventListener('click', () => {
        const title = document.getElementById('edit-title').value.trim();
        if (!title) return alert('요리 제목은 필수입니다.');

        const recipeIndex = recipes.findIndex((r) => r.id === currentRecipeId);
        if (recipeIndex === -1) return;

        recipes[recipeIndex] = {
          ...recipes[recipeIndex],
          title,
          category:
            document.getElementById('edit-category').value.trim() || '미분류',
          originalUrl: document.getElementById('edit-url').value.trim(),
          ingredients: document
            .getElementById('edit-ingredients')
            .value.split(',')
            .map((i) => i.trim())
            .filter((i) => i),
          steps: document
            .getElementById('edit-steps')
            .value.split('\n')
            .map((s) => s.trim())
            .filter((s) => s),
        };

        saveRecipes();
        navigateTo('detail', currentRecipeId);
      });

      // --- 5. 요리 모드 (화면 유지 & 스와이프) ---
      let cookSteps = [];
      let currentStepIndex = 0;
      let wakeLock = null;
      let touchStartX = null;

      async function requestWakeLock() {
        try {
          if ('wakeLock' in navigator) {
            wakeLock = await navigator.wakeLock.request('screen');
          }
        } catch (err) {
          console.warn('Wake Lock error:', err);
        }
      }

      function releaseWakeLock() {
        if (wakeLock !== null) {
          wakeLock.release().then(() => (wakeLock = null));
        }
      }

      function initCookingMode(id) {
        const recipe = recipes.find((r) => r.id === id);
        if (!recipe || !recipe.steps.length) return;

        cookSteps = recipe.steps;
        currentStepIndex = 0;
        requestWakeLock();
        updateCookUI();
        document.getElementById('view-cook').classList.remove('hidden');
      }

      function updateCookUI() {
        document.getElementById('cook-step-counter').innerText = `${
          currentStepIndex + 1
        } / ${cookSteps.length}`;
        document.getElementById('cook-step-title').innerText = `Step ${
          currentStepIndex + 1
        }`;
        document.getElementById('cook-step-text').innerText =
          cookSteps[currentStepIndex];

        const progress = ((currentStepIndex + 1) / cookSteps.length) * 100;
        document.getElementById(
          'cook-progress-bar'
        ).style.width = `${progress}%`;

        document.getElementById('btn-cook-prev').disabled =
          currentStepIndex === 0;
        document.getElementById('btn-cook-next').disabled =
          currentStepIndex === cookSteps.length - 1;
      }

      function nextStep() {
        if (currentStepIndex < cookSteps.length - 1) {
          currentStepIndex++;
          updateCookUI();
        }
      }

      function prevStep() {
        if (currentStepIndex > 0) {
          currentStepIndex--;
          updateCookUI();
        }
      }

      const swipeArea = document.getElementById('cook-swipe-area');
      swipeArea.addEventListener(
        'touchstart',
        (e) => {
          touchStartX = e.touches[0].clientX;
        },
        { passive: true }
      );
      swipeArea.addEventListener('touchend', (e) => {
        if (touchStartX === null) return;
        const touchEndX = e.changedTouches[0].clientX;
        const diff = touchStartX - touchEndX;

        if (Math.abs(diff) > 50) {
          if (diff > 0) nextStep();
          else prevStep();
        }
        touchStartX = null;
      });

      document
        .getElementById('btn-cook-prev')
        .addEventListener('click', prevStep);
      document
        .getElementById('btn-cook-next')
        .addEventListener('click', nextStep);

      document
        .getElementById('btn-close-cook')
        .addEventListener('click', () => {
          releaseWakeLock();
          document.getElementById('view-cook').classList.add('hidden');
          navigateTo('detail', currentRecipeId);
        });

      // --- 6. 기타 이벤트 바인딩 ---
      document
        .getElementById('btn-close-detail')
        .addEventListener('click', () => navigateTo('home'));

      document
        .getElementById('btn-start-cook')
        .addEventListener('click', () => {
          initCookingMode(currentRecipeId);
        });

      document.getElementById('btn-delete').addEventListener('click', () => {
        if (confirm('정말 삭제하시겠습니까?')) {
          recipes = recipes.filter((r) => r.id !== currentRecipeId);
          saveRecipes();
          navigateTo('home');
        }
      });

      // 초기 실행
      renderHome();
    </script>
  </body>
</html>
