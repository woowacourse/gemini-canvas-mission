<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 약속 플래너 - 실시간 장소 추천</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet.js -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        body, html {
            height: 100%;
            margin: 0;
            overflow: hidden;
            font-family: 'Pretendard', sans-serif;
            touch-action: none; 
        }

        #map {
            height: 100vh;
            width: 100%;
            z-index: 1;
        }

        /* 서랍 레이아웃 스타일 */
        #drawer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            z-index: 100;
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.12);
            height: 85vh; 
            transform: translateY(65vh); 
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex;
            flex-direction: column;
            will-change: transform;
        }

        #drawer.dragging {
            transition: none;
        }

        .drawer-header {
            width: 100%;
            padding: 14px 0;
            cursor: grab;
            flex-shrink: 0;
        }

        .drawer-handle {
            width: 40px;
            height: 4px;
            background: #e2e8f0;
            border-radius: 10px;
            margin: 0 auto;
        }

        .scrollable-content {
            overflow-y: auto;
            flex-grow: 1;
            padding: 0 24px 180px 24px;
            -webkit-overflow-scrolling: touch;
        }

        /* 결과 패널 스타일 */
        #results-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: 400px;
            height: 100vh;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(15px);
            z-index: 200;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
            transform: translateX(100%);
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex;
            flex-direction: column;
            border-top-left-radius: 32px;
            border-bottom-left-radius: 32px;
        }

        #results-panel.show {
            transform: translateX(0);
        }

        .results-header {
            padding: 16px 24px 8px 24px;
        }

        /* 결과 창 재오픈 버튼 */
        #reopen-btn {
            position: fixed;
            top: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            background: #2563eb;
            color: white;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.4);
            z-index: 150;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        @media (max-width: 768px) {
            #results-panel { width: 100%; border-radius: 0; }
        }

        .select-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1.5px solid #f1f5f9;
            background: #f8fafc;
            color: #64748b;
        }
        .select-btn.active {
            background-color: #2563eb;
            color: white;
            border-color: #2563eb;
            font-weight: 600;
        }

        #autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            margin-top: 8px;
            z-index: 1000;
            max-height: 200px;
            overflow-y: auto;
            box-shadow: 0 12px 24px -4px rgba(0, 0, 0, 0.15);
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 0.8s linear infinite;
        }

        .custom-tooltip {
            background: #2563eb;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 11px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-100">

    <!-- 지도 컨테이너 -->
    <div id="map"></div>

    <!-- 결과 창 다시 열기 버튼 -->
    <div id="reopen-btn" onclick="openResults()">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
        </svg>
    </div>

    <!-- 결과 사이드 패널 -->
    <div id="results-panel">
        <div class="results-header">
            <div class="flex items-center justify-between mb-1">
                <h2 id="results-title" class="text-xl font-black text-slate-900 tracking-tight text-nowrap">AI 추천 일정</h2>
                <button onclick="closeResults()" class="p-2 hover:bg-slate-100 rounded-full transition-colors text-slate-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div id="results-meta" class="mb-4 p-4 bg-blue-50 border border-blue-100 rounded-[20px] text-[12px] font-bold text-blue-800 leading-snug shadow-sm space-y-1">
                <!-- 메타 데이터 로드 위치 -->
            </div>
        </div>
        <div id="results-list" class="flex-grow overflow-y-auto px-6 pb-10 space-y-4">
            <!-- 장소 카드 로드 위치 -->
        </div>
    </div>

    <!-- 아래쪽 서랍(입력 폼) -->
    <div id="drawer">
        <div class="drawer-header" id="drawer-handle-area">
            <div class="drawer-handle"></div>
        </div>
        
        <div class="scrollable-content">
            <h1 class="text-2xl font-black text-slate-900 mb-8 tracking-tight">대신 계획 짜드립니다.</h1>

            <form id="planForm" class="space-y-8" onsubmit="return false;">
                <!-- 위치 입력 -->
                <div class="relative">
                    <label class="block text-sm font-bold text-slate-700 mb-3 ml-1">위치 <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <input type="text" id="input-location" autocomplete="off" placeholder="지역이나 장소명을 입력하세요" 
                            class="w-full p-4 pl-5 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:bg-white focus:outline-none transition-all placeholder:text-slate-400">
                        <div id="search-loading" class="hidden absolute right-4 top-4">
                            <div class="w-5 h-5 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                        </div>
                    </div>
                    <div id="autocomplete-list" class="hidden"></div>
                </div>

                <!-- 목적 선택 -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-3 ml-1">목적 <span class="text-red-500">*</span></label>
                    <div class="flex flex-wrap gap-2.5" id="purpose-group">
                        <button type="button" class="select-btn px-6 py-3.5 rounded-2xl text-[13px]" data-value="데이트">데이트</button>
                        <button type="button" class="select-btn px-6 py-3.5 rounded-2xl text-[13px]" data-value="가족모임">가족모임</button>
                        <button type="button" class="select-btn px-6 py-3.5 rounded-2xl text-[13px]" data-value="친목">친목</button>
                        <button type="button" class="select-btn px-6 py-3.5 rounded-2xl text-[13px]" data-value="비즈니스">비즈니스</button>
                    </div>
                </div>

                <!-- 인원수 입력 -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-3 ml-1">인원수 <span class="text-red-500">*</span></label>
                    <div class="relative flex items-center">
                        <input type="text" id="input-people" placeholder="예: 3" 
                            class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:bg-white focus:outline-none transition-all">
                        <span class="absolute right-5 text-slate-500 font-semibold text-sm">명</span>
                    </div>
                    <p id="people-error" class="hidden text-red-500 text-[11px] font-medium mt-2 ml-2">유효한 숫자를 입력해 주세요.</p>
                </div>

                <!-- 분위기 선택 -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-3 ml-1">분위기 (선택)</label>
                    <div class="flex flex-wrap gap-2.5" id="mood-group">
                        <button type="button" class="select-btn px-5 py-3 rounded-2xl text-[13px]" data-value="조용한">조용한</button>
                        <button type="button" class="select-btn px-5 py-3 rounded-2xl text-[13px]" data-value="활기찬">활기찬</button>
                        <button type="button" class="select-btn px-5 py-3 rounded-2xl text-[13px]" data-value="감성적인">감성적인</button>
                        <button type="button" class="select-btn px-5 py-3 rounded-2xl text-[13px]" data-value="액티비티">액티비티</button>
                    </div>
                </div>

                <!-- 좋아하는 것 -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-3 ml-1">좋아하는 것 (선택)</label>
                    <input type="text" id="input-likes" placeholder="예: 만화 카페, 보드게임, 루프탑" 
                        class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:bg-white focus:outline-none transition-all">
                </div>

                <!-- 추가 옵션 -->
                <div class="bg-slate-50 border border-slate-100 p-6 rounded-[32px] space-y-6">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] ml-1">추가 상세 옵션 (선택)</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div class="md:col-span-2">
                            <label class="block text-[11px] font-bold text-slate-500 mb-2 ml-1">날짜</label>
                            <input type="date" id="input-date" class="w-full p-3.5 text-sm bg-white border border-slate-200 rounded-xl focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-slate-500 mb-2 ml-1">시작 시간</label>
                            <input type="time" id="input-time-start" class="w-full p-3.5 text-sm bg-white border border-slate-200 rounded-xl focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-slate-500 mb-2 ml-1">종료 시간</label>
                            <div class="relative">
                                <input type="time" id="input-time-end" disabled 
                                    class="w-full p-3.5 text-sm bg-white border border-slate-200 rounded-xl focus:outline-none disabled:bg-slate-100 disabled:text-slate-400 disabled:cursor-not-allowed">
                                <p id="time-error" class="hidden text-red-500 text-[10px] font-medium mt-1 ml-1 leading-tight">시작 시간보다 이른 시간으로 지정할 수 없습니다.</p>
                            </div>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-[11px] font-bold text-slate-500 mb-2 ml-1">최대 예산</label>
                            <div class="relative">
                                <input type="number" id="input-budget" placeholder="기본 100,000원" class="w-full p-3.5 pr-10 text-sm bg-white border border-slate-200 rounded-xl focus:outline-none">
                                <span class="absolute right-4 top-3.5 text-slate-400 text-xs">원</span>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <div class="fixed bottom-0 left-0 right-0 p-6 pb-12 bg-white/90 backdrop-blur-xl border-t border-slate-100 flex justify-center">
            <button id="planBtn" disabled class="group w-full max-w-lg py-5 bg-slate-200 text-white font-black text-lg rounded-3xl transition-all flex items-center justify-center space-x-3 disabled:cursor-not-allowed">
                <span id="btnText" class="flex items-center">AI 계획짜기 시작</span>
            </button>
        </div>
    </div>

    <script>
        const apiKey = ""; 
        const map = L.map('map', { zoomControl: false }).setView([37.5665, 126.9780], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let currentMarkers = [];
        let searchCoords = [37.5665, 126.9780];

        function clearMarkers() {
            currentMarkers.forEach(m => map.removeLayer(m));
            currentMarkers = [];
        }

        // 서랍 드래그 및 결과 패널 상호작용 로직
        const drawer = document.getElementById('drawer');
        const handleArea = document.getElementById('drawer-handle-area');
        let isDragging = false, startY = 0, currentTranslateY = 65;
        const TOP_LIMIT = 5, MID_LIMIT = 65, BOTTOM_LIMIT = 82;

        function setDrawerPosition(percentage) {
            currentTranslateY = Math.max(TOP_LIMIT, Math.min(percentage, BOTTOM_LIMIT));
            drawer.style.transform = `translateY(${currentTranslateY}vh)`;
        }

        const getClientY = (e) => e.touches ? e.touches[0].clientY : e.clientY;
        
        const startDrag = (e) => { 
            isDragging = true; 
            startY = getClientY(e); 
            drawer.classList.add('dragging'); 
        };

        const moveDrag = (e) => {
            if (!isDragging) return;
            const y = getClientY(e);
            const newTranslateY = currentTranslateY + ((y - startY) / window.innerHeight) * 100;
            
            // 서랍을 열기 시작하면 결과 패널 닫기
            if (newTranslateY < BOTTOM_LIMIT - 2) {
                closeResults();
            }

            setDrawerPosition(newTranslateY);
            startY = y;
        };

        const endDrag = () => {
            if (!isDragging) return;
            isDragging = false; 
            drawer.classList.remove('dragging');
            
            if (currentTranslateY < 35) {
                setDrawerPosition(TOP_LIMIT);
                closeResults();
            } else if (currentTranslateY < 75) {
                setDrawerPosition(MID_LIMIT);
                closeResults();
            } else {
                setDrawerPosition(BOTTOM_LIMIT);
            }
        };

        handleArea.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', moveDrag);
        window.addEventListener('mouseup', endDrag);
        handleArea.addEventListener('touchstart', startDrag, { passive: true });
        window.addEventListener('touchmove', moveDrag, { passive: false });
        window.addEventListener('touchend', endDrag);

        // 시간 유효성 검사 및 최소값 제어 (제공된 로직 적용)
        const timeStart = document.getElementById('input-time-start');
        const timeEnd = document.getElementById('input-time-end');
        const timeError = document.getElementById('time-error');

        timeStart.addEventListener('input', () => {
            if (timeStart.value) {
                timeEnd.disabled = false;
                // 브라우저 캘린더/시간 UI에 최소값 힌트 제공
                timeEnd.min = timeStart.value; 
                
                // 시작 시간을 변경했는데, 기존 종료 시간이 시작 시간보다 빠를 경우 종료 시간 초기화
                if (timeEnd.value && timeEnd.value < timeStart.value) {
                    timeEnd.value = ""; // 강제 초기화
                    timeError.classList.remove('hidden');
                } else {
                    timeError.classList.add('hidden');
                }
            } else {
                timeEnd.disabled = true;
                timeEnd.value = "";
                timeError.classList.add('hidden');
            }
        });

        timeEnd.addEventListener('input', () => {
            // 종료 시간 선택 시, 시작 시간보다 빠르면 즉시 초기화
            if (timeStart.value && timeEnd.value && timeEnd.value < timeStart.value) {
                timeEnd.value = ""; // 사용자가 선택하자마자 강제로 비워버림
                timeError.classList.remove('hidden');
            } else {
                timeError.classList.add('hidden');
            }
        });

        // 위치 자동완성 (OSM Nominatim)
        const locationInput = document.getElementById('input-location');
        const autocompleteList = document.getElementById('autocomplete-list');
        const searchLoading = document.getElementById('search-loading');
        let searchTimeout = null;

        locationInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            if (locationInput.value.length < 2) return autocompleteList.classList.add('hidden');
            searchTimeout = setTimeout(async () => {
                searchLoading.classList.remove('hidden');
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(locationInput.value)}&limit=5&countrycodes=kr`);
                    const data = await res.json();
                    autocompleteList.innerHTML = '';
                    data.forEach(p => {
                        const name = p.display_name.split(',')[0];
                        const item = document.createElement('div');
                        item.className = 'suggestion-item p-4 border-b border-slate-50 last:border-0 cursor-pointer hover:bg-slate-50';
                        item.innerHTML = `<span class="font-bold block text-sm">${name}</span><span class="text-[11px] text-slate-400">${p.display_name}</span>`;
                        item.onclick = () => {
                            locationInput.value = name;
                            searchCoords = [parseFloat(p.lat), parseFloat(p.lon)];
                            map.setView(searchCoords, 16);
                            autocompleteList.classList.add('hidden');
                            validateForm();
                        };
                        autocompleteList.appendChild(item);
                    });
                    autocompleteList.classList.remove('hidden');
                } finally { searchLoading.classList.add('hidden'); }
            }, 500);
        });

        // 폼 유효성 검사
        const planBtn = document.getElementById('planBtn');
        const btnText = document.getElementById('btnText');
        const peopleInput = document.getElementById('input-people');
        let selectedPurpose = '', selectedMood = '';

        document.getElementById('purpose-group').querySelectorAll('.select-btn').forEach(btn => btn.onclick = () => {
            document.getElementById('purpose-group').querySelectorAll('.select-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active'); selectedPurpose = btn.dataset.value; validateForm();
        });

        document.getElementById('mood-group').querySelectorAll('.select-btn').forEach(btn => btn.onclick = () => {
            const active = btn.classList.contains('active');
            document.getElementById('mood-group').querySelectorAll('.select-btn').forEach(b => b.classList.remove('active'));
            if (!active) { btn.classList.add('active'); selectedMood = btn.dataset.value; } else selectedMood = '';
            validateForm();
        });

        peopleInput.onblur = () => {
            const n = Number(peopleInput.value.replace(/[^0-9]/g, ''));
            if (!n || n <= 0) { peopleInput.value = ''; document.getElementById('people-error').classList.remove('hidden'); }
            else { peopleInput.value = n; document.getElementById('people-error').classList.add('hidden'); }
            validateForm();
        };

        function validateForm() {
            const ok = locationInput.value.trim() && selectedPurpose && Number(peopleInput.value) > 0;
            planBtn.disabled = !ok;
            planBtn.classList.toggle('bg-blue-600', ok);
            planBtn.classList.toggle('bg-slate-200', !ok);
        }

        [locationInput, peopleInput].forEach(el => el.addEventListener('input', validateForm));

        // AI 계획짜기 실행
        planBtn.onclick = async () => {
            // 시간 유효성 검증
            if (timeStart.value && timeEnd.value && timeEnd.value < timeStart.value) {
                timeError.classList.remove('hidden');
                timeEnd.focus();
                return;
            }

            // 펜딩 상태 UI 업데이트 (회색 배경)
            planBtn.disabled = true;
            planBtn.classList.remove('bg-blue-600');
            planBtn.classList.add('bg-slate-400');
            btnText.innerHTML = `<div class="spinner mr-3"></div> AI가 실제 장소를 분석 중...`;
            
            const params = {
                location: locationInput.value,
                coords: searchCoords,
                purpose: selectedPurpose,
                people: peopleInput.value,
                mood: selectedMood || "좋은",
                likes: document.getElementById('input-likes').value || "맛집과 카페",
                date: document.getElementById('input-date').value || new Date().toISOString().split('T')[0],
                timeStart: document.getElementById('input-time-start').value || "13:00",
                timeEnd: document.getElementById('input-time-end').value || "20:00",
                budget: document.getElementById('input-budget').value || "100000"
            };

            try {
                const planData = await fetchAIPlan(params);
                renderResults(planData, params);
                setDrawerPosition(BOTTOM_LIMIT);
                
                // 성공 상태
                planBtn.classList.remove('bg-slate-400');
                planBtn.classList.add('bg-emerald-500');
                btnText.innerText = `생성 완료`;
                
                setTimeout(() => { 
                    planBtn.disabled = false; 
                    planBtn.classList.remove('bg-emerald-500');
                    planBtn.classList.add('bg-blue-600');
                    btnText.innerText = `AI 계획짜기 시작`; 
                }, 2000);
            } catch (err) {
                console.error(err);
                btnText.innerText = `다시 시도해주세요`;
                planBtn.classList.remove('bg-slate-400');
                planBtn.classList.add('bg-blue-600');
                planBtn.disabled = false;
            }
        };

        // Gemini API 호출 함수
        async function fetchAIPlan(p) {
            const prompt = `
                사용자가 한국 ${p.location}(좌표: ${p.coords[0]}, ${p.coords[1]}) 주변에서 ${p.purpose}를 위해 ${p.people}명과 함께 보낼 일정을 짜려고 해.
                분위기는 ${p.mood} 느낌이며, 좋아하는 것은 ${p.likes}이야.
                예산은 약 ${p.budget}원 정도야.
                
                조건:
                1. 한국에 실제로 존재하는 유명하고 평점 좋은 장소 3곳(카페, 식당, 명소 등)을 선정해줘.
                2. 각 장소의 정확한 이름과 실제 주소, 그리고 실제 위치와 가까운 위도/경도(lat, lng)를 제공해줘.
                3. 일정 시간은 ${p.timeStart}부터 ${p.timeEnd} 사이에 배치해줘.
                
                반드시 아래 JSON 형식으로만 응답해줘:
                {
                    "places": [
                        {
                            "name": "장소 이름",
                            "type": "카페/식당/명소",
                            "address": "실제 도로명 주소",
                            "time": "방문 시간",
                            "fee": 1인당 예상 비용(숫자),
                            "lat": 위도(숫자),
                            "lng": 경도(숫자),
                            "desc": "이 장소를 추천하는 짧은 이유"
                        }
                    ],
                    "totalFee": 전체 예상 총 요금(숫자)
                }
            `;

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { responseMimeType: "application/json" }
                })
            });

            if (!response.ok) throw new Error("API 호출 실패");
            const result = await response.json();
            return JSON.parse(result.candidates[0].content.parts[0].text);
        }

        // 결과 렌더링 함수
        function renderResults(data, params) {
            clearMarkers();
            const list = document.getElementById('results-list');
            const meta = document.getElementById('results-meta');
            list.innerHTML = '';
            
            document.getElementById('results-title').innerText = `오늘의 ${params.purpose} 일정`;
            meta.innerHTML = `
                <div class="flex items-center"><span class="w-16 text-blue-400">일시</span> 🗓 ${params.date} | ⏰ ${params.timeStart} ~ ${params.timeEnd}</div>
                <div class="flex items-center"><span class="w-16 text-blue-400">장소</span> 📍 ${params.location} | 👥 ${params.people}명</div>
                <div class="flex items-center text-blue-700 font-black mt-1.5 pt-1.5 border-t border-blue-200/50">
                    <span class="w-16">총 예산</span> <span class="text-sm">₩ ${data.totalFee.toLocaleString()}</span>
                </div>
            `;

            const bounds = L.latLngBounds();
            data.places.forEach((s, idx) => {
                const card = document.createElement('div');
                card.className = 'p-5 bg-slate-50 border border-slate-100 rounded-[24px] hover:bg-white hover:shadow-xl hover:scale-[1.02] transition-all cursor-pointer group';
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-3">
                        <span class="px-2.5 py-0.5 bg-blue-600 text-white text-[10px] font-black rounded-full uppercase">${s.type}</span>
                        <span class="text-[11px] font-bold text-blue-500 bg-blue-50 px-2 py-0.5 rounded-lg">${s.time}</span>
                    </div>
                    <h3 class="text-base font-black text-slate-900 mb-1 group-hover:text-blue-600 transition-colors">${s.name}</h3>
                    <p class="text-[10px] text-slate-400 mb-2 flex items-center">
                        <svg class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"></path></svg>
                        ${s.address}
                    </p>
                    <p class="text-[12px] text-slate-600 leading-snug mb-3">${s.desc}</p>
                    <div class="text-xs font-bold text-slate-700 flex justify-between pt-2.5 border-t border-slate-200/30">
                        <span class="text-slate-400 font-medium italic">Estimated per person</span>
                        <span>₩ ${s.fee.toLocaleString()}</span>
                    </div>
                `;
                card.onclick = () => { map.flyTo([s.lat, s.lng], 17); if(window.innerWidth < 768) closeResults(); };
                list.appendChild(card);

                const marker = L.marker([s.lat, s.lng]).addTo(map)
                    .bindTooltip(s.name, { permanent: true, direction: 'top', className: 'custom-tooltip', offset: [0, -10] })
                    .bindPopup(`<div class="font-black text-blue-600">${s.name}</div><div class="text-[10px] text-slate-500 mt-1">${s.address}</div>`);
                currentMarkers.push(marker);
                bounds.extend([s.lat, s.lng]);
            });

            map.fitBounds(bounds, { padding: [80, 80] });
            document.getElementById('results-panel').classList.add('show');
            document.getElementById('reopen-btn').style.display = 'none';
        }

        function closeResults() { 
            const panel = document.getElementById('results-panel');
            if (panel.classList.contains('show')) {
                panel.classList.remove('show'); 
                document.getElementById('reopen-btn').style.display = 'flex'; 
            }
        }
        
        function openResults() { 
            document.getElementById('results-panel').classList.add('show'); 
            document.getElementById('reopen-btn').style.display = 'none'; 
            setDrawerPosition(BOTTOM_LIMIT);
        }
    </script>
