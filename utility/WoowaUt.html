<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우테코 서바이벌 대시보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.8/dist/web/static/pretendard.css" rel="stylesheet" />
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    body {
      font-family: 'Pretendard', sans-serif;
    }
    
    /* 스크롤바 커스텀 */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9; 
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1; 
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8; 
    }

    input:focus, button:focus, select:focus { outline: none; }
    
    /* 체크박스 애니메이션용 */
    .transition-all { transition-property: all; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 300ms; }
  </style>
</head>
<body class="min-h-screen bg-gray-50 text-gray-800 p-4 md:p-8">

  <!-- Header -->
  <header class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center mb-8 pb-6 border-b border-gray-200">
    <div>
      <h1 class="text-3xl font-bold flex items-center gap-3 text-gray-900">
        <span class="w-4 h-8 bg-[#2ac1bc] rounded-sm block"></span>
        우테코 서바이벌 대시보드
      </h1>
      <p class="text-gray-500 mt-2 ml-7">성공적인 수료를 위한 나만의 작업 공간</p>
    </div>
    <div class="mt-4 md:mt-0 bg-white px-4 py-2 rounded-lg shadow-sm border border-gray-100 flex items-center gap-2">
      <i class="ph-bold ph-clock text-[#2ac1bc] text-xl"></i>
      <span id="current-time-display" class="font-medium text-gray-700">로딩 중...</span>
    </div>
  </header>

  <!-- Main Grid -->
  <main class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <!-- Left Column: Todos -->
    <section class="lg:col-span-7 bg-white rounded-2xl shadow-sm border border-gray-100 p-6 flex flex-col h-[calc(100vh-12rem)] min-h-[500px]">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold flex items-center gap-2 text-gray-800">
          <i class="ph-bold ph-list-checks text-[#2ac1bc] text-2xl"></i>
          미션 & 할 일 관리
        </h2>
        <span id="todo-count-badge" class="text-sm font-medium bg-[#2ac1bc]/10 text-[#2ac1bc] px-3 py-1 rounded-full">
          0개 남음
        </span>
      </div>

      <!-- Add Todo Form -->
      <form id="add-todo-form" class="mb-6 flex flex-col gap-3 bg-gray-50 p-4 rounded-xl border border-gray-100">
        <input type="text" id="todo-text" placeholder="예: 자동차 경주 미션 1단계 PR 제출" required
          class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#2ac1bc]/50 bg-white">
        <div class="flex gap-2 items-center">
          <div class="flex flex-1 gap-2">
            <input type="date" id="todo-date"
              class="w-1/2 px-3 py-2 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#2ac1bc]/50 text-sm bg-white">
            <input type="time" id="todo-time"
              class="w-1/2 px-3 py-2 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#2ac1bc]/50 text-sm bg-white">
          </div>
          <button type="submit" class="bg-[#2ac1bc] hover:bg-[#23a39e] text-white px-5 py-2 rounded-lg font-medium transition-colors flex items-center gap-1 shrink-0">
            <i class="ph-bold ph-plus"></i> 추가
          </button>
        </div>
      </form>

      <!-- Todo List -->
      <div id="todo-list" class="flex-1 overflow-y-auto pr-2 space-y-3 custom-scrollbar">
        <!-- Todos rendered here -->
      </div>
    </section>

    <!-- Right Column: URLs -->
    <section class="lg:col-span-5 bg-white rounded-2xl shadow-sm border border-gray-100 p-6 flex flex-col h-[calc(100vh-12rem)] min-h-[500px]">
      <h2 class="text-xl font-bold mb-6 flex items-center gap-2 text-gray-800">
        <i class="ph-bold ph-link text-[#2ac1bc] text-2xl"></i>
        필수 즐겨찾기
      </h2>

      <!-- Add URL Form -->
      <form id="add-url-form" class="mb-6 flex flex-col gap-3 bg-gray-50 p-4 rounded-xl border border-gray-100">
        <div class="flex gap-2 relative">
          
          <!-- Category Select -->
          <select id="url-category-select" class="w-1/3 px-3 py-2 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#2ac1bc]/50 text-sm bg-white">
            <!-- Categories rendered here -->
          </select>

          <!-- New Category Input Wrapper (Hidden by default) -->
          <div id="new-category-wrapper" class="hidden w-1/3 flex border border-gray-200 rounded-lg focus-within:ring-2 focus-within:ring-[#2ac1bc]/50 bg-white overflow-hidden">
            <input type="text" id="new-category-input" placeholder="새 카테고리" class="w-full px-2 py-2 text-sm focus:outline-none">
            <button type="button" id="confirm-category-btn" class="px-2 text-[#2ac1bc] hover:bg-gray-50 flex items-center justify-center">
              <i class="ph-bold ph-check"></i>
            </button>
            <button type="button" id="cancel-category-btn" class="px-2 text-gray-400 hover:bg-gray-50 flex items-center justify-center">
              <i class="ph-bold ph-x"></i>
            </button>
          </div>

          <input type="text" id="url-title" placeholder="사이트 이름 (예: 페이먼츠 API)" required
            class="w-2/3 px-3 py-2 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#2ac1bc]/50 text-sm bg-white">
        </div>
        <div class="flex gap-2">
          <input type="url" id="url-link" placeholder="URL 주소 (https://...)" required
            class="flex-1 px-3 py-2 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#2ac1bc]/50 text-sm bg-white">
          <button type="submit" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-lg font-medium transition-colors flex items-center shrink-0">
            <i class="ph-bold ph-plus"></i>
          </button>
        </div>
      </form>

      <!-- URL List -->
      <div id="url-list" class="flex-1 overflow-y-auto pr-2 space-y-6 custom-scrollbar">
        <!-- URLs rendered here -->
      </div>
    </section>

  </main>

  <!-- Firebase & App Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, setDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // --- State Management ---
    let currentUser = null;
    let todosData = [];
    let urlsData = [];
    let categoriesData = [];
    
    const DEFAULT_CATEGORIES = ['과제/LMS', 'GitHub', '공식문서', '크루/블로그', '기타'];

    // Firebase Init
    let db, auth, appId;
    try {
      const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
      const app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
      appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
    } catch (error) {
      console.error("Firebase init failed:", error);
    }

    // --- DOM Elements ---
    const elements = {
      timeDisplay: document.getElementById('current-time-display'),
      todoList: document.getElementById('todo-list'),
      todoCountBadge: document.getElementById('todo-count-badge'),
      urlList: document.getElementById('url-list'),
      categorySelect: document.getElementById('url-category-select'),
      newCatWrapper: document.getElementById('new-category-wrapper'),
      newCatInput: document.getElementById('new-category-input'),
      addTodoForm: document.getElementById('add-todo-form'),
      addUrlForm: document.getElementById('add-url-form'),
    };

    // --- Utilities ---
    const escapeHTML = (str) => {
      if(!str) return '';
      return str.replace(/[&<>'"]/g, tag => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    };

    const updateClock = () => {
      const now = new Date();
      const optionsDate = { month: 'short', day: 'numeric', weekday: 'short' };
      const optionsTime = { hour: '2-digit', minute: '2-digit', hour12: true };
      elements.timeDisplay.innerText = `${now.toLocaleDateString('ko-KR', optionsDate)} ${now.toLocaleTimeString('ko-KR', optionsTime)}`;
    };

    const calculateTimeLeft = (deadline) => {
      if (!deadline) return { text: '', isUrgent: false, isExpired: false };
      const now = new Date();
      const target = new Date(deadline);
      const diff = target - now;

      if (diff < 0) return { text: '기한 만료', isUrgent: false, isExpired: true };

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const mins = Math.floor((diff / 1000 / 60) % 60);

      if (days > 3) return { text: `D-${days}`, isUrgent: false, isExpired: false };
      if (days > 0) return { text: `D-${days} ${hours}시간`, isUrgent: true, isExpired: false };
      if (hours > 0) return { text: `${hours}시간 ${mins}분 남음`, isUrgent: true, isExpired: false };
      return { text: `${mins}분 남음`, isUrgent: true, isExpired: false };
    };

    // --- Render Functions ---
    const renderTodos = () => {
      const activeCount = todosData.filter(t => !t.isDone).length;
      elements.todoCountBadge.innerText = `${activeCount}개 남음`;

      if (todosData.length === 0) {
        elements.todoList.innerHTML = `
          <div class="text-center py-10 text-gray-400 flex flex-col items-center">
            <i class="ph-fill ph-check-circle text-5xl mb-3 text-gray-200"></i>
            <p>등록된 할 일이 없습니다.</p>
            <p class="text-sm mt-1">오늘의 학습 목표를 설정해 보세요!</p>
          </div>
        `;
        return;
      }

      const sortedTodos = [...todosData].sort((a, b) => {
        if (a.isDone !== b.isDone) return a.isDone ? 1 : -1;
        if (!a.deadline) return 1;
        if (!b.deadline) return -1;
        return new Date(a.deadline) - new Date(b.deadline);
      });

      elements.todoList.innerHTML = sortedTodos.map(todo => {
        const timeStatus = calculateTimeLeft(todo.deadline);
        
        // CSS Classes mapping
        let containerClass = 'bg-white border-gray-200 hover:border-[#2ac1bc]/30 shadow-sm';
        if (todo.isDone) containerClass = 'bg-gray-50 border-gray-100 opacity-60';
        else if (timeStatus.isExpired) containerClass = 'bg-red-50/50 border-red-100';

        let badgeClass = 'bg-blue-50 text-blue-600';
        if (timeStatus.isExpired) badgeClass = 'bg-red-100 text-red-600';
        else if (timeStatus.isUrgent) badgeClass = 'bg-orange-100 text-orange-600';

        let badgeIcon = timeStatus.isExpired ? '<i class="ph-bold ph-warning-circle text-[14px]"></i>' : '<i class="ph-bold ph-clock text-[14px]"></i>';

        const deadlineLabel = todo.deadline ? new Date(todo.deadline).toLocaleString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';

        return `
          <div class="flex items-start gap-3 p-4 rounded-xl border transition-all ${containerClass}">
            <button onclick="toggleTodo('${todo.id}', ${todo.isDone})" class="mt-0.5 text-[#2ac1bc] hover:text-[#23a39e] transition-colors focus:outline-none">
              ${todo.isDone ? '<i class="ph-fill ph-check-circle text-2xl"></i>' : '<i class="ph ph-circle text-2xl"></i>'}
            </button>
            
            <div class="flex-1 min-w-0">
              <p class="text-[15px] font-medium ${todo.isDone ? 'line-through text-gray-500' : 'text-gray-800'}">
                ${escapeHTML(todo.text)}
              </p>
              
              ${todo.deadline && !todo.isDone ? `
                <div class="flex items-center gap-1.5 mt-2 text-xs font-semibold px-2 py-1 rounded inline-flex ${badgeClass}">
                  ${badgeIcon}
                  ${timeStatus.text}
                  <span class="font-normal opacity-70 ml-1">(${deadlineLabel})</span>
                </div>
              ` : ''}
            </div>

            <button onclick="deleteDocItem('todos', '${todo.id}')" class="text-gray-300 hover:text-red-500 transition-colors p-1" title="삭제">
              <i class="ph-bold ph-trash text-base"></i>
            </button>
          </div>
        `;
      }).join('');
    };

    const renderUrls = () => {
      // 1. Render Options in Select
      const selectHtml = categoriesData.map(cat => `<option value="${escapeHTML(cat)}">${escapeHTML(cat)}</option>`).join('');
      elements.categorySelect.innerHTML = selectHtml + `<option value="__NEW__" class="text-[#2ac1bc] font-semibold">+ 새 카테고리 추가...</option>`;

      // 2. Render URLs List
      const groupedUrls = categoriesData.reduce((acc, cat) => {
        acc[cat] = urlsData.filter(url => url.category === cat);
        return acc;
      }, {});

      // Add orphaned URLs
      urlsData.forEach(url => {
        if (!groupedUrls[url.category]) groupedUrls[url.category] = [url];
      });

      const categoriesToRender = Object.keys(groupedUrls);

      if (urlsData.length === 0) {
        elements.urlList.innerHTML = `<p class="text-center text-gray-400 py-10 text-sm">등록된 즐겨찾기가 없습니다.</p>`;
        return;
      }

      elements.urlList.innerHTML = categoriesToRender.map(category => {
        const catUrls = groupedUrls[category];
        if (!catUrls || catUrls.length === 0) return '';

        return `
          <div class="space-y-3">
            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider border-b border-gray-100 pb-1">
              ${escapeHTML(category)}
            </h3>
            <div class="grid gap-2">
              ${catUrls.map(url => `
                <div class="group flex items-center justify-between p-3 rounded-lg border border-gray-100 bg-white hover:border-[#2ac1bc] hover:shadow-sm transition-all">
                  <a href="${escapeHTML(url.link)}" target="_blank" rel="noopener noreferrer" class="flex-1 flex items-center gap-2 truncate text-gray-700 group-hover:text-[#2ac1bc]">
                    <i class="ph-bold ph-arrow-square-out opacity-50 shrink-0"></i>
                    <span class="font-medium truncate text-[14px]">${escapeHTML(url.title)}</span>
                  </a>
                  <button onclick="deleteDocItem('urls', '${url.id}')" class="text-gray-300 hover:text-red-500 transition-colors p-1 ml-2 opacity-0 group-hover:opacity-100" title="삭제">
                    <i class="ph-bold ph-trash text-base"></i>
                  </button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    };

    // --- Actions (Window scoped for inline handlers) ---
    window.toggleTodo = async (id, currentStatus) => {
      if (!currentUser) return;
      const todo = todosData.find(t => t.id === id);
      if (todo) {
        await setDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'todos', id), {
          ...todo,
          isDone: !currentStatus
        });
      }
    };

    window.deleteDocItem = async (collectionName, id) => {
      if (!currentUser) return;
      await deleteDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, collectionName, id));
    };

    // --- Form Submissions ---
    elements.addTodoForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) return;

      const text = document.getElementById('todo-text').value.trim();
      const dateStr = document.getElementById('todo-date').value;
      const timeStr = document.getElementById('todo-time').value || '23:59';
      
      if (!text) return;

      let deadlineIso = null;
      if (dateStr) {
        deadlineIso = new Date(`${dateStr}T${timeStr}:00`).toISOString();
      }

      const id = Date.now().toString();
      await setDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'todos', id), {
        text,
        deadline: deadlineIso,
        isDone: false
      });

      e.target.reset();
    });

    elements.addUrlForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) return;

      const title = document.getElementById('url-title').value.trim();
      let link = document.getElementById('url-link').value.trim();
      let category = elements.categorySelect.value;

      // 만약 새 카테고리 추가 모드였다면, 입력값을 카테고리로 강제 적용 (보험용)
      if (!elements.newCatWrapper.classList.contains('hidden')) {
        const newCat = elements.newCatInput.value.trim();
        if(newCat) category = newCat;
      }

      if (!title || !link) return;
      if (!link.startsWith('http://') && !link.startsWith('https://')) {
        link = 'https://' + link;
      }

      const id = Date.now().toString();
      await setDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'urls', id), {
        title, link, category
      });

      document.getElementById('url-title').value = '';
      document.getElementById('url-link').value = '';
    });

    // --- Category Toggle Logic ---
    elements.categorySelect.addEventListener('change', (e) => {
      if (e.target.value === '__NEW__') {
        elements.categorySelect.classList.add('hidden');
        elements.newCatWrapper.classList.remove('hidden');
        elements.newCatWrapper.classList.add('flex');
        elements.newCatInput.focus();
      }
    });

    const closeCategoryInput = () => {
      elements.newCatWrapper.classList.add('hidden');
      elements.newCatWrapper.classList.remove('flex');
      elements.categorySelect.classList.remove('hidden');
      elements.newCatInput.value = '';
      elements.categorySelect.value = categoriesData[0] || '';
    };

    const addCategory = async () => {
      const newCat = elements.newCatInput.value.trim();
      if (newCat && currentUser) {
        if (!categoriesData.includes(newCat)) {
          const safeId = newCat.replace(/\//g, '_'); // 문서 ID에 슬래시(/)가 들어가지 않도록 방어
          await setDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'categories', safeId), { name: newCat });
        }
        // 임시로 먼저 UI에 추가 후 선택되게 함
        if(!categoriesData.includes(newCat)) categoriesData.push(newCat);
        renderUrls();
        elements.categorySelect.value = newCat;
      }
      closeCategoryInput();
    };

    document.getElementById('confirm-category-btn').addEventListener('click', addCategory);
    document.getElementById('cancel-category-btn').addEventListener('click', closeCategoryInput);
    elements.newCatInput.addEventListener('keydown', (e) => {
      if(e.key === 'Enter') { e.preventDefault(); addCategory(); }
    });


    // --- Firebase Sync & Listeners ---
    let isFirstUrlsFetch = true;
    let isFirstCatsFetch = true;

    const setupListeners = (userId) => {
      const urlsRef = collection(db, 'artifacts', appId, 'users', userId, 'urls');
      const todosRef = collection(db, 'artifacts', appId, 'users', userId, 'todos');
      const categoriesRef = collection(db, 'artifacts', appId, 'users', userId, 'categories');

      onSnapshot(todosRef, (snapshot) => {
        todosData = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        renderTodos();
      }, err => console.error(err));

      onSnapshot(categoriesRef, (snapshot) => {
        if (isFirstCatsFetch && snapshot.empty) {
          isFirstCatsFetch = false;
          // Set Default Categories
          DEFAULT_CATEGORIES.forEach(cat => {
            const safeId = cat.replace(/\//g, '_'); // 문서 ID에 슬래시(/)가 들어가지 않도록 방어
            setDoc(doc(db, 'artifacts', appId, 'users', userId, 'categories', safeId), { name: cat });
          });
        } else {
          isFirstCatsFetch = false;
          categoriesData = snapshot.docs.map(d => d.data().name);
          renderUrls(); // URL requires Categories to be grouped
        }
      }, err => console.error(err));

      onSnapshot(urlsRef, (snapshot) => {
        if (isFirstUrlsFetch && snapshot.empty) {
          isFirstUrlsFetch = false;
          // Set Default URLs
          const defaults = [
            { id: '1', title: '우아한테크코스 LMS', link: 'https://lms.woowacourse.com', category: '과제/LMS' },
            { id: '2', title: '우아한테크코스 GitHub', link: 'https://github.com/woowacourse', category: 'GitHub' },
            { id: '3', title: 'Java 21 API 문서', link: 'https://docs.oracle.com/en/java/javase/21/docs/api/index.html', category: '공식문서' }
          ];
          defaults.forEach(item => setDoc(doc(db, 'artifacts', appId, 'users', userId, 'urls', item.id), item));
        } else {
          isFirstUrlsFetch = false;
          urlsData = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          renderUrls();
        }
      }, err => console.error(err));
    };

    // --- Init ---
    const initApp = async () => {
      updateClock();
      setInterval(() => {
        updateClock();
        renderTodos(); // 1분마다 타이머 렌더링 갱신
      }, 60000);

      if (!auth) return;
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      } catch (error) {
        console.error("Auth error:", error);
      }
    };

    if (auth) {
      initApp();
      onAuthStateChanged(auth, (user) => {
        if (user) {
          currentUser = user;
          setupListeners(user.uid);
        } else {
          currentUser = null;
        }
      });
    }

  </script>
</body>
</html>
