<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보송 청소 매니저</title>
    <!-- 세련되고 친근한 고운 돋움 & 노토 산스 조합 -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #a5d8ff; /* 파스텔 블루 */
            --primary-dark: #74c0fc;
            --bg: #f8f9fa;
            --card-white: #ffffff;
            --text-main: #343a40;
            --text-sub: #868e96;
            --pastel-yellow: #fff9db; /* 임박 */
            --pastel-pink: #ffe3e3;   /* 지남 */
            --pastel-mint: #e6fcf5;   /* 안전/완료 */
            --radius-lg: 24px;
            --radius-md: 16px;
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.03);
            --shadow-md: 0 12px 24px rgba(0, 0, 0, 0.06);
            --glow-pink: 0 0 20px rgba(255, 227, 227, 0.6);
            --glow-yellow: 0 0 20px rgba(255, 249, 219, 0.6);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; padding: 0; 
            font-family: 'Gowun Dodum', 'Noto Sans KR', sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background-color: var(--bg); 
            color: var(--text-main); 
            line-height: 1.6; 
            padding-bottom: 120px; 
            overflow-x: hidden;
        }

        /* --- 공통 요소 --- */
        button { 
            cursor: pointer; 
            border: none; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
            outline: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        button:active { transform: scale(0.95); }
        
        input { 
            width: 100%; padding: 14px 18px; 
            border: 2px solid #e9ecef; 
            border-radius: var(--radius-md); 
            margin-bottom: 12px; 
            font-size: 1rem; 
            outline: none; 
            background: #fff;
            transition: all 0.2s;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(165, 216, 255, 0.2); }

        /* --- 로그인/회원가입 --- */
        #login-screen { 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            /* 컬러감을 더한 생기있는 파스텔톤 그라데이션 */
            background: linear-gradient(135deg, #ffdeeb 0%, #e6fcf5 50%, #d0ebff 100%);
            padding: 20px; 
        }
        .login-card { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(10px);
            padding: 48px 32px; 
            border-radius: 32px; 
            box-shadow: var(--shadow-md); 
            max-width: 400px; 
            width: 100%; 
            text-align: center; 
        }
        .login-illustration { font-size: 4.5rem; margin-bottom: 16px; display: block; }
        .login-card h2 { margin-bottom: 8px; color: #212529; font-weight: 700; font-size: 1.7rem; }
        .login-card p { font-size: 0.95rem; color: var(--text-sub); margin-bottom: 32px; }

        .submit-btn { 
            background: var(--primary-dark); 
            color: white; 
            padding: 16px; 
            width: 100%; 
            font-size: 1.1rem; 
            font-weight: 700; 
            border-radius: var(--radius-md);
            box-shadow: 0 4px 12px rgba(116, 192, 252, 0.3);
        }
        .auth-toggle { margin-top: 24px; font-size: 0.9rem; color: var(--text-sub); }
        .auth-toggle span { color: var(--primary-dark); cursor: pointer; font-weight: 700; margin-left: 6px; text-decoration: underline; }

        /* --- 메인 헤더 --- */
        #main-app { display: none; }
        header { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(16px);
            padding: 16px 24px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        header h1 { font-size: 1.2rem; color: #212529; font-weight: 700; }
        .logout-btn { 
            background: #f1f3f5; 
            padding: 8px 16px; 
            font-size: 0.8rem; 
            color: #495057; 
            border-radius: 50px; 
        }

        /* --- 대시보드 --- */
        .content-container { padding: 24px; max-width: 1000px; margin: 0 auto; }
        
        /* 4x2 디폴트 그리드 배치 */
        .grid-layout { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 20px; 
        }
        
        /* 태블릿 및 모바일 반응형 */
        @media (max-width: 900px) {
            .grid-layout { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 500px) {
            .grid-layout { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .task-card { padding: 20px 12px; }
            .icon-container { font-size: 2.5rem; margin-bottom: 10px; }
            .task-name { font-size: 1rem; }
            .elapsed-days { font-size: 1.1rem; margin: 8px 0; }
        }

        .task-card {
            background: var(--card-white); 
            border-radius: var(--radius-lg); 
            padding: 28px 20px;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            text-align: center;
            box-shadow: var(--shadow-sm); 
            position: relative; 
            border: 1.5px solid transparent;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .task-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-md); }
        
        .task-card.imminent { background-color: var(--pastel-yellow); border-color: #fff3bf; box-shadow: var(--glow-yellow); }
        .task-card.overdue { background-color: var(--pastel-pink); border-color: #ffc9c9; box-shadow: var(--glow-pink); }

        .icon-container { font-size: 3.2rem; margin-bottom: 14px; }
        .task-name { font-weight: 700; font-size: 1.1rem; color: #212529; margin-bottom: 6px; }
        .task-info { font-size: 0.85rem; color: var(--text-sub); }
        .elapsed-days { font-size: 1.4rem; font-weight: 700; margin: 10px 0; color: #4dabf7; }
        .overdue-msg { 
            font-size: 0.8rem; 
            color: #f03e3e; 
            font-weight: 500; 
            margin-top: 8px; 
            min-height: 48px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            line-height: 1.5;
            word-break: keep-all;
        }
        
        /* 완료 버튼 스타일 간소화 */
        .clean-btn { 
            background: #ffffff; 
            color: #495057; 
            width: 90px;
            height: 40px;
            margin-top: 16px; 
            font-size: 0.95rem; 
            border-radius: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.04);
            font-weight: 700;
            border: 1px solid #e9ecef;
        }
        .clean-btn:hover { background: var(--pastel-mint); color: #0ca678; border-color: #b2f2bb; }
        .task-card.overdue .clean-btn, .task-card.imminent .clean-btn { border-color: rgba(0,0,0,0.05); }

        .edit-cycle-btn { position: absolute; top: 16px; right: 16px; background: rgba(0,0,0,0.04); width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #adb5bd; font-size: 0.9rem; }

        /* --- 하단 내비게이션 --- */
        .bottom-nav { 
            position: fixed; 
            bottom: 24px; 
            left: 50%; 
            transform: translateX(-50%);
            width: calc(100% - 48px);
            max-width: 500px;
            height: 72px; 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(24px);
            display: flex; 
            border-radius: 36px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.12); 
            z-index: 1000;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.85rem; color: #adb5bd; transition: 0.3s; cursor: pointer; }
        .nav-item.active { color: var(--primary-dark); font-weight: 700; }
        .nav-icon { font-size: 1.6rem; margin-bottom: 2px; }

        /* --- 로그 탭 --- */
        .log-list { background: transparent; display: flex; flex-direction: column; gap: 12px; }
        .log-item { 
            background: white;
            padding: 20px 24px; 
            border-radius: var(--radius-md); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: var(--shadow-sm);
            border: 1px solid #f1f3f5;
        }
        .log-item-content { display: flex; flex-direction: column; gap: 4px; }
        .log-item-name { font-weight: 700; font-size: 1.05rem; color: #212529; }
        .log-date { font-size: 0.9rem; color: var(--text-sub); }
        .log-edit-btn { background: #f8f9fa; color: #868e96; width: 44px; height: 44px; border-radius: 14px; font-size: 1.1rem; border: 1px solid #e9ecef; }

        /* 필터 컨테이너 (드롭다운 방식) */
        .filter-container { margin-bottom: 24px; text-align: left; }
        .custom-select {
            width: 100%;
            max-width: 240px;
            padding: 12px 16px;
            font-size: 0.95rem;
            color: var(--text-main);
            background-color: white;
            border: 2px solid #e9ecef;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23868e96' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        .custom-select:focus { border-color: var(--primary-dark); outline: none; }

        /* --- 모달 --- */
        @keyframes modalEntrance {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-overlay { 
            display: none; position: fixed; top:0; left:0; width:100%; height:100%; 
            background: rgba(0,0,0,0.2); 
            z-index: 2000; align-items: center; justify-content: center; 
            backdrop-filter: blur(10px); 
        }
        .modal-content { 
            background: white; padding: 40px 32px; 
            border-radius: 32px; width: 90%; max-width: 380px; 
            box-shadow: 0 24px 48px rgba(0,0,0,0.15); 
            animation: modalEntrance 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center;
        }
        .modal-content h3 { margin-bottom: 12px; font-size: 1.4rem; color: #212529; }
        .modal-desc { font-size: 0.95rem; color: var(--text-sub); margin-bottom: 28px; line-height: 1.6; }

        .modal-btn-group { display: flex; gap: 12px; }
        .modal-btn { flex: 1; padding: 16px; border-radius: 18px; font-size: 1rem; font-weight: 700; }
        .modal-btn.cancel { background: #f1f3f5; color: #495057; }
        .modal-btn.confirm { background: var(--primary-dark); color: white; }

        #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 3000; font-weight: 700; color: var(--primary-dark); font-size: 1.2rem; }
        .loading-spinner { font-size: 3rem; margin-bottom: 20px; animation: wave 1.5s infinite ease-in-out; }
        @keyframes wave { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    </style>
</head>
<body>

    <div id="loading">
        <div class="loading-spinner">✨</div>
        <span>보송보송한 공간을 준비 중이에요...</span>
    </div>

    <!-- --- 로그인/회원가입 화면 --- -->
    <div id="login-screen">
        <div class="login-card">
            <span class="login-illustration">🏠</span>
            <h2 id="auth-title">보송 청소 매니저</h2>
            <p id="auth-desc">나만의 공간을 조금 더 보송하게 가꿔볼까요?</p>
            
            <div id="auth-error" class="error-msg"></div>
            
            <input type="email" id="email-input" placeholder="이메일 주소">
            <input type="password" id="password-input" placeholder="비밀번호">
            
            <button class="submit-btn" id="auth-submit-btn">시작하기</button>
            
            <div class="auth-toggle">
                <span id="auth-toggle-msg">아직 계정이 없으신가요?</span>
                <span id="auth-toggle-btn">회원가입</span>
            </div>
        </div>
    </div>

    <!-- --- 메인 앱 화면 --- -->
    <div id="main-app">
        <header>
            <h1>✨ 보송 매니저</h1>
            <button class="logout-btn" id="logout-btn">로그아웃</button>
        </header>

        <main class="content-container">
            <!-- 대시보드 뷰 -->
            <div id="dashboard-view">
                <div class="grid-layout" id="task-grid"></div>
            </div>

            <!-- 기록 뷰 -->
            <div id="log-view" style="display: none;">
                <h2 style="margin-bottom: 8px; font-size: 1.5rem;">청소 발자국</h2>
                <p style="color: var(--text-sub); font-size: 0.95rem; margin-bottom: 24px;">우리가 함께 가꾼 소중한 기록들이에요.</p>
                
                <!-- 필터 셀렉트 박스 -->
                <div class="filter-container">
                    <select id="log-filter-select" class="custom-select"></select>
                </div>
                
                <div class="log-list" id="log-list"></div>
            </div>
        </main>

        <nav class="bottom-nav">
            <div class="nav-item active" id="nav-dashboard" onclick="window.switchView('dashboard')">
                <span class="nav-icon">🏠</span>
                <span>대시보드</span>
            </div>
            <div class="nav-item" id="nav-logs" onclick="window.switchView('logs')">
                <span class="nav-icon">📜</span>
                <span>청소 발자국</span>
            </div>
        </nav>
    </div>

    <!-- --- 모달: 주기 수정 --- -->
    <div class="modal-overlay" id="edit-modal">
        <div class="modal-content">
            <h3 id="modal-task-name">주기 설정</h3>
            <p class="modal-desc">주기를 변경할까요?</p>
            <input type="number" id="cycle-input" min="1" placeholder="숫자만 적어주세요">
            <div class="modal-btn-group">
                <button id="modal-cancel" class="modal-btn cancel">취소</button>
                <button id="modal-save" class="modal-btn confirm">변경하기</button>
            </div>
        </div>
    </div>

    <!-- --- 모달: 기록 정보 수정 --- -->
    <div class="modal-overlay" id="edit-log-modal">
        <div class="modal-content">
            <h3>기록 수정</h3>
            <p class="modal-desc">실제 청소했던 시간을 알려주세요.<br>다음 주기를 정확하게 챙겨드릴게요!</p>
            <input type="datetime-local" id="log-time-input">
            <div class="modal-btn-group">
                <button id="modal-log-cancel" class="modal-btn cancel">취소</button>
                <button id="modal-log-save" class="modal-btn confirm">저장하기</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInAnonymously, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, collection, onSnapshot, addDoc, serverTimestamp, Timestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyDq6wkk8J_vy73fH8RnKksqIxrvWbrfxO4",
            authDomain: "cleaning-manager-392b2.firebaseapp.com",
            projectId: "cleaning-manager-392b2",
            storageBucket: "cleaning-manager-392b2.firebasestorage.app",
            messagingSenderId: "662564558347",
            appId: "1:662564558347:web:e80cd367ca2f50aeb3190e",
            measurementId: "G-FCTKSXSC9W"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // 고정된 앱 ID
        const APP_COLLECTION_ID = "solo-cleaning-manager-v1";

        setPersistence(auth, browserLocalPersistence);

        const DEFAULT_TASKS = [
            { id: 'bathroom', name: '화장실 청소', cycle: 7, icon: '🚽' },
            { id: 'food-waste', name: '음식물 쓰레기', cycle: 2, icon: '🍏' },
            { id: 'recycle', name: '재활용 쓰레기', cycle: 4, icon: '♻️' },
            { id: 'general-waste', name: '일반 쓰레기', cycle: 4, icon: '🗑️' },
            { id: 'floor', name: '바닥 청소', cycle: 3, icon: '🧹' },
            { id: 'dusting', name: '먼지 털기', cycle: 5, icon: '✨' },
            { id: 'laundry', name: '옷 빨래', cycle: 3, icon: '👕' },
            { id: 'bedding', name: '이불 빨래', cycle: 14, icon: '🛌' }
        ];

        // --- 다정하면서도 챙겨주는 친근한 룸메이트 말투 ---
        const TASK_MESSAGES = {
            'bathroom': {
                imminent: "슬슬 화장실 바닥이 미끄러워지려 해요. 가볍게 물청소 어때요?",
                overdue: "반짝반짝 빛나는 화장실로 변신시킬 시간이에요!"
            },
            'food-waste': {
                imminent: "냄새가 나기 전에 미리 비워주면 주방이 더 상쾌해질 거예요.",
                overdue: "음식물 쓰레기가 너무 오래 기다렸어요. 지금 쏙 비워주세요!"
            },
            'recycle': {
                imminent: "분리수거함이 제법 찼네요. 나가는 길에 가볍게 비우고 올까요?",
                overdue: "재활용품 산이 생기기 직전이에요! 오늘 꼭 정리해 봐요."
            },
            'general-waste': {
                imminent: "쓰레기 봉투가 묵직해졌나요? 미리 묶어두면 마음이 편할 거예요.",
                overdue: "방 안의 상쾌한 공기를 위해 일반 쓰레기를 비울 때가 되었어요!"
            },
            'floor': {
                imminent: "발바닥에 먼지가 살짝 밟히는 것 같아요. 보송하게 밀어볼까요?",
                overdue: "먼지 없이 깨끗한 바닥을 위해 청소기를 윙~ 돌려봐요!"
            },
            'dusting': {
                imminent: "가구들이 먼지 코트를 입으려 해요. 가볍게 털어내 줄까요?",
                overdue: "상쾌한 호흡을 위해 가구 위 먼지들을 시원하게 닦아내 주세요!"
            },
            'laundry': {
                imminent: "빨래 바구니가 꽤 찼어요. 오늘 세탁기를 한번 깨워볼까요?",
                overdue: "내일 입을 옷이 없을지도 몰라요! 지금 바로 세탁을 시작해 봐요."
            },
            'bedding': {
                imminent: "꿀잠을 위해 이불을 빨 때가 됐어요. 포근한 햇볕 냄새를 입혀볼까요?",
                overdue: "보송보송한 침대를 위해 오늘 이불 세탁을 꼭 추천드려요!"
            }
        };

        let currentUser = null;
        let userSettings = {};
        let cleaningLogs = [];
        let isSignupMode = false;
        let settingsUnsub = null;
        let logsUnsub = null;
        let activeFilter = 'all';

        // ---------------------------------------------------------
        // 1. 인증 로직
        // ---------------------------------------------------------
        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            document.getElementById('loading').style.display = 'none';

            if (user && !user.isAnonymous) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                startRealtimeUpdates(user.uid);
            } else {
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('main-app').style.display = 'none';
                stopRealtimeUpdates();
                if (!user) await signInAnonymously(auth).catch(() => {});
            }
        });

        document.getElementById('auth-submit-btn').onclick = async () => {
            const email = document.getElementById('email-input').value.trim();
            const password = document.getElementById('password-input').value;
            const errorEl = document.getElementById('auth-error');

            if(!email || !password) {
                errorEl.innerText = "이메일과 비밀번호를 모두 적어주세요! ✨";
                errorEl.style.display = 'block';
                return;
            }

            try {
                errorEl.style.display = 'none';
                document.getElementById('loading').style.display = 'flex';
                if (isSignupMode) await createUserWithEmailAndPassword(auth, email, password);
                else await signInWithEmailAndPassword(auth, email, password);
            } catch (err) {
                errorEl.innerText = "앗, 정보가 맞지 않아요. 다시 확인해 보실래요?";
                errorEl.style.display = 'block';
                document.getElementById('loading').style.display = 'none';
            }
        };

        document.getElementById('auth-toggle-btn').onclick = () => {
            isSignupMode = !isSignupMode;
            document.getElementById('auth-title').innerText = isSignupMode ? "회원가입" : "보송 청소 매니저";
            document.getElementById('auth-desc').innerText = isSignupMode ? "함께 깨끗한 자취방을 만들어가요." : "나만의 공간을 조금 더 보송하게 가꿔볼까요?";
            document.getElementById('auth-submit-btn').innerText = isSignupMode ? "가입하기" : "시작하기";
            document.getElementById('auth-toggle-msg').innerText = isSignupMode ? "이미 계정이 있으신가요?" : "아직 계정이 없으신가요?";
            document.getElementById('auth-toggle-btn').innerText = isSignupMode ? "로그인" : "회원가입";
        };

        document.getElementById('logout-btn').onclick = () => signOut(auth);

        // ---------------------------------------------------------
        // 2. 데이터 연동
        // ---------------------------------------------------------
        function stopRealtimeUpdates() {
            if (settingsUnsub) settingsUnsub();
            if (logsUnsub) logsUnsub();
            settingsUnsub = null;
            logsUnsub = null;
            userSettings = {};
            cleaningLogs = [];
        }

        function startRealtimeUpdates(uid) {
            stopRealtimeUpdates();

            settingsUnsub = onSnapshot(collection(db, 'artifacts', APP_COLLECTION_ID, 'users', uid, 'settings'), (snap) => {
                userSettings = {};
                snap.forEach(d => userSettings[d.id] = d.data().cycle);
                renderDashboard();
            });

            logsUnsub = onSnapshot(collection(db, 'artifacts', APP_COLLECTION_ID, 'users', uid, 'logs'), (snap) => {
                cleaningLogs = [];
                snap.forEach(d => {
                    const data = d.data();
                    let ts = data.timestamp instanceof Timestamp ? data.timestamp.toDate() : new Date();
                    cleaningLogs.push({ id: d.id, ...data, timestamp: ts });
                });
                cleaningLogs.sort((a, b) => b.timestamp - a.timestamp);
                renderDashboard();
                renderLogs();
            });
        }

        // ---------------------------------------------------------
        // 3. 필터 드롭다운 초기화
        // ---------------------------------------------------------
        function initFilterSelect() {
            const select = document.getElementById('log-filter-select');
            if (!select) return;
            select.innerHTML = `<option value="all">전체보기</option>`;
            DEFAULT_TASKS.forEach(t => {
                select.innerHTML += `<option value="${t.id}">${t.name}</option>`;
            });
            
            select.addEventListener('change', (e) => {
                activeFilter = e.target.value;
                renderLogs();
            });
        }

        // ---------------------------------------------------------
        // 4. UI 렌더링
        // ---------------------------------------------------------
        function renderDashboard() {
            const grid = document.getElementById('task-grid');
            if (!grid) return;
            grid.innerHTML = '';

            DEFAULT_TASKS.forEach(task => {
                const cycle = parseInt(userSettings[task.id] || task.cycle);
                const taskLogs = cleaningLogs.filter(l => l.taskId === task.id);
                const lastDate = taskLogs[0]?.timestamp;
                
                let elapsed = 0; let statusClass = ''; let msg = ''; let nextDateStr = '-- / --';
                
                if (lastDate) {
                    const today = new Date(); today.setHours(0,0,0,0);
                    const last = new Date(lastDate); last.setHours(0,0,0,0);
                    elapsed = Math.floor((today - last) / 86400000);
                    const next = new Date(lastDate); next.setDate(next.getDate() + cycle);
                    nextDateStr = `${next.getMonth()+1}월 ${next.getDate()}일`;

                    const taskMsg = TASK_MESSAGES[task.id] || { imminent: "곧 청소할 시간입니다.", overdue: "청소가 필요한 시기입니다." };

                    if (elapsed >= cycle) { statusClass = 'overdue'; msg = taskMsg.overdue; }
                    else if (cycle - elapsed <= 1) { statusClass = 'imminent'; msg = taskMsg.imminent; }
                } else {
                    msg = '아직 기록이 없네요. 오늘 첫 청소를 시작해 볼까요?';
                }

                const card = document.createElement('div');
                card.className = `task-card ${statusClass}`;
                card.innerHTML = `
                    <button class="edit-cycle-btn">⚙️</button>
                    <div class="icon-container">${task.icon}</div>
                    <div class="task-name">${task.name}</div>
                    <div class="task-info">${cycle}일 주기</div>
                    <div class="elapsed-days">${lastDate ? elapsed + '일째' : '새로운 시작'}</div>
                    <div class="task-info">다음 예정: ${nextDateStr}</div>
                    <div class="overdue-msg">${msg}</div>
                    <button class="clean-btn"><span style="margin-right: 4px; font-size: 1.1rem; color: #a5d8ff;">✓</span> 완료</button>
                `;
                
                card.querySelector('.edit-cycle-btn').onclick = (e) => {
                    e.stopPropagation();
                    currentEditId = task.id;
                    document.getElementById('modal-task-name').innerText = task.name;
                    document.getElementById('cycle-input').value = cycle;
                    document.getElementById('edit-modal').style.display = 'flex';
                };

                card.querySelector('.clean-btn').onclick = async () => {
                    if (!currentUser || currentUser.isAnonymous) return;
                    await addDoc(collection(db, 'artifacts', APP_COLLECTION_ID, 'users', currentUser.uid, 'logs'), { 
                        taskId: task.id, taskName: task.name, timestamp: serverTimestamp() 
                    });
                };
                grid.appendChild(card);
            });
        }

        function renderLogs() {
            const list = document.getElementById('log-list');
            if (!list) return;
            list.innerHTML = '';
            const filtered = activeFilter === 'all' ? cleaningLogs : cleaningLogs.filter(l => l.taskId === activeFilter);
            
            if (filtered.length === 0) {
                list.innerHTML = '<div style="padding:80px 20px; text-align:center; color:#adb5bd; font-size:1.1rem">아직 남겨진 청소 발자국이 없어요. 🏠</div>';
                return;
            }

            filtered.forEach(log => {
                const item = document.createElement('div');
                item.className = 'log-item';
                const dateStr = log.timestamp.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit' });
                
                item.innerHTML = `
                    <div class="log-item-content">
                        <div class="log-item-name">${log.taskName}</div>
                        <div class="log-date">${dateStr}</div>
                    </div>
                    <button class="log-edit-btn" title="기록 수정">✏️</button>
                `;
                item.querySelector('.log-edit-btn').onclick = () => {
                    currentEditLogId = log.id;
                    const date = new Date(log.timestamp);
                    const offset = date.getTimezoneOffset() * 60000;
                    const localDate = new Date(date.getTime() - offset);
                    document.getElementById('log-time-input').value = localDate.toISOString().slice(0, 16);
                    document.getElementById('edit-log-modal').style.display = 'flex';
                };
                list.appendChild(item);
            });
        }

        // ---------------------------------------------------------
        // 5. 전역 뷰 및 모달 전환
        // ---------------------------------------------------------
        window.switchView = (view) => {
            document.getElementById('dashboard-view').style.display = view === 'dashboard' ? 'block' : 'none';
            document.getElementById('log-view').style.display = view === 'logs' ? 'block' : 'none';
            document.getElementById('nav-dashboard').classList.toggle('active', view === 'dashboard');
            document.getElementById('nav-logs').classList.toggle('active', view === 'logs');
            if (view === 'logs') { renderLogs(); }
        };

        let currentEditId = null;
        document.getElementById('modal-cancel').onclick = () => document.getElementById('edit-modal').style.display = 'none';
        document.getElementById('modal-save').onclick = async () => {
            const val = document.getElementById('cycle-input').value;
            if (val > 0 && currentUser) {
                await setDoc(doc(db, 'artifacts', APP_COLLECTION_ID, 'users', currentUser.uid, 'settings', currentEditId), { cycle: parseInt(val) }, { merge: true });
                document.getElementById('edit-modal').style.display = 'none';
            }
        };

        let currentEditLogId = null;
        document.getElementById('modal-log-cancel').onclick = () => document.getElementById('edit-log-modal').style.display = 'none';
        document.getElementById('modal-log-save').onclick = async () => {
            const time = document.getElementById('log-time-input').value;
            if (time && currentEditLogId && currentUser) {
                const newDate = new Date(time);
                await updateDoc(doc(db, 'artifacts', APP_COLLECTION_ID, 'users', currentUser.uid, 'logs', currentEditLogId), { timestamp: Timestamp.fromDate(newDate) });
                document.getElementById('edit-log-modal').style.display = 'none';
            }
        };

        // 초기화
        initFilterSelect();

    </script>
</body>
</html>
