<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>우테코 데일리 로그</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 마크다운 파싱을 위한 marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* ✅ Apple System Font 및 프리미엄 타이포그래피 */
        body {
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            transition: background 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: #f5f5f7;
            touch-action: none;
            -webkit-font-smoothing: antialiased;
            color: #1d1d1f;
        }

        #app {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            transform-style: preserve-3d;
        }

        /* ✅ 은은한 Apple 스타일 계절 배경 */
        .season-spring { background: radial-gradient(circle at 50% 0%, #fff5f7 0%, #fce4ec 100%); }
        .season-summer { background: radial-gradient(circle at 50% 0%, #f0f9ff 0%, #bae6fd 100%); }
        .season-autumn { background: radial-gradient(circle at 50% 0%, #fff7ed 0%, #ffedd5 100%); }
        .season-winter { background: radial-gradient(circle at 50% 0%, #ffffff 0%, #e8e8ed 100%); }

        @keyframes fall-down { 0% { top: -10vh; opacity: 0; } 10% { opacity: 0.8; } 80% { opacity: 0.8; } 100% { top: 110vh; opacity: 0; } }
        @keyframes float-up { 0% { bottom: -10vh; opacity: 0; } 10% { opacity: 0.4; } 80% { opacity: 0.4; } 100% { bottom: 110vh; opacity: 0; } }
        @keyframes sway-rotate { 0% { transform: translateX(-20px) rotate(0deg); } 100% { transform: translateX(20px) rotate(360deg); } }
        @keyframes shimmer { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.7; } }

        .fx-wrapper { position: absolute; pointer-events: none; z-index: 1; }
        .fx-inner { display: flex; align-items: center; justify-content: center; }

        .summer-sun {
            position: absolute; top: -200px; left: 50%; transform: translateX(-50%);
            width: 1000px; height: 1000px;
            background: radial-gradient(circle, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 70%);
            pointer-events: none; z-index: 0;
            animation: shimmer 10s ease-in-out infinite;
        }

        /* Coverflow 3D 컨테이너 */
        #coverflow-container {
            flex: 1; display: flex; align-items: center; justify-content: center;
            perspective: 1500px; position: relative; z-index: 10;
            transform-style: preserve-3d;
        }

        #coverflow-track {
            position: relative; width: 100%; height: 320px;
            transform-style: preserve-3d; display: flex; justify-content: center; align-items: center;
        }

        /* ✅ 카드 디자인 */
        .cover-item {
            position: absolute; width: 220px; height: 220px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(25px) saturate(190%);
            -webkit-backdrop-filter: blur(25px) saturate(190%);
            border-radius: 44px;
            border: 0.5px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 10px 40px rgba(0,0,0,0.04);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; user-select: none;
            -webkit-backface-visibility: hidden; backface-visibility: hidden;
            transform-style: preserve-3d;
            will-change: transform, opacity;
            transition: box-shadow 0.4s cubic-bezier(0.25, 1, 0.5, 1), background 0.3s ease;
        }

        .cover-item:hover { background: rgba(255, 255, 255, 0.6); }
        .cover-day { font-size: 5rem; font-weight: 200; color: #1d1d1f; line-height: 1; letter-spacing: -0.04em; pointer-events: none; }
        .cover-weekday { font-size: 0.8rem; font-weight: 700; color: #86868b; margin-top: 14px; text-transform: uppercase; letter-spacing: 0.2em; pointer-events: none; }

        /* ✅ iOS 알림 스타일 뱃지 (경계선에 걸침) */
        .cover-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #ff3b30;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            border: 2.5px solid #ffffff;
            box-shadow: 0 4px 10px rgba(255, 59, 48, 0.3);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: scale(0.5);
            z-index: 50;
        }
        .has-record .cover-badge { opacity: 1; transform: scale(1); }

        /* 모달 스타일 */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.08); backdrop-filter: blur(45px) saturate(180%);
            -webkit-backdrop-filter: blur(45px) saturate(180%);
            display: none; justify-content: center; align-items: center; z-index: 100;
            opacity: 0; transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-overlay.active { display: flex; opacity: 1; }

        .modal-content {
            background: rgba(255, 255, 255, 0.82); width: 92%; max-width: 500px; max-height: 85vh;
            border-radius: 52px; padding: 3.5rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 40px 120px rgba(0,0,0,0.08);
            display: flex; flex-direction: column;
            transform: scale(0.94) translateY(20px); transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); }

        /* ✅ 애플 스타일 피커 그리드 및 아이템 */
        .picker-section-title {
            font-size: 10px; font-weight: 800; color: #86868b; text-transform: uppercase;
            letter-spacing: 0.2em; margin-bottom: 16px; padding-left: 4px;
        }
        .picker-grid { display: grid; grid-template-cols: repeat(3, 1fr); gap: 10px; width: 100%; }
        .picker-item {
            padding: 16px 12px; border-radius: 20px; text-align: center; font-size: 0.9rem; font-weight: 600;
            cursor: pointer; transition: all 0.4s cubic-bezier(0.2, 1, 0.2, 1);
            background: rgba(0, 0, 0, 0.04); color: #1d1d1f;
            border: 0.5px solid transparent;
        }
        .picker-item:hover { background: rgba(0, 0, 0, 0.08); }
        .picker-item.active {
            background: #1d1d1f; color: #ffffff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            transform: scale(1.04);
        }

        .year-chips {
            display: flex; overflow-x: auto; gap: 8px; padding-bottom: 4px;
            -ms-overflow-style: none; scrollbar-width: none;
        }
        .year-chips::-webkit-scrollbar { display: none; }

        /* 출석부 칩(Chip) 스타일 */
        .attendance-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .attendance-chip {
            padding: 12px 20px; border-radius: 18px; background: rgba(255, 255, 255, 0.6);
            border: 0.5px solid rgba(0,0,0,0.05); font-size: 0.95rem; font-weight: 700;
            color: #1d1d1f; box-shadow: 0 4px 10px rgba(0,0,0,0.02); transition: all 0.3s ease;
        }
        .attendance-chip span { color: #34c759; margin-right: 6px; }

        /* 마크다운 리포트 스타일 */
        .prose-report h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 1rem; color: #1d1d1f; border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 0.5rem; }
        .prose-report h2 { font-size: 1.25rem; font-weight: 700; margin-top: 1.5rem; margin-bottom: 0.75rem; color: #1d1d1f; }
        .prose-report p { margin-bottom: 1rem; line-height: 1.7; color: #424245; }
        .prose-report ul { padding-left: 1.25rem; margin-bottom: 1rem; list-style-type: disc; }

        .spinner {
            border: 2.5px solid rgba(0, 0, 0, 0.05); width: 22px; height: 22px; border-radius: 50%;
            border-left-color: #1d1d1f; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>

<script>
    const env = { apiKey: "", recordsRepository: new Map() };
    let currentAudio = null;

    const dateDomain = {
        formatDateKey(date) { const y = date.getFullYear(); const m = String(date.getMonth() + 1).padStart(2, '0'); const d = String(date.getDate()).padStart(2, '0'); return `${y}-${m}-${d}`; },
        getMonthName(mIdx) { const m = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"]; return m[mIdx]; },
        getSeasonClass(mIdx) { const m = mIdx + 1; if (m >= 3 && m <= 5) return 'season-spring'; if (m >= 6 && m <= 8) return 'season-summer'; if (m >= 9 && m <= 11) return 'season-autumn'; return 'season-winter'; },
        addDays(date, days) { const r = new Date(date); r.setDate(r.getDate() + days); return r; },
        getWeekday(date) { const d = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"]; return d[date.getDay()]; }
    };

    const aiService = {
        async fetchFromGemini(prompt) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${env.apiKey}`;
            const payload = { contents: [{ parts: [{ text: prompt }] }] };
            for (let i = 0, delays = [1000, 2000, 4000, 8000, 16000]; i < 5; i++) {
                try {
                    const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    if (!response.ok) throw new Error("API Error");
                    const result = await response.json(); return result.candidates?.[0]?.content?.parts?.[0]?.text;
                } catch (error) { if (i === 4) throw error; await new Promise(res => setTimeout(res, delays[i])); }
            }
        },
        async generateQuestions() {
            try {
                const text = await this.fetchFromGemini(`우테코 크루 성찰 질문 3개 반환 (번호 없이).`);
                let qList = text.split('\n').map(q => q.replace(/^[\d\.\-\*\s]+/, '').trim()).filter(q => q.length > 0);
                return qList.slice(0, 3);
            } catch(e) { return ["오늘의 성과는?", "어려움은?", "내일의 계획은?"]; }
        },
        async generateSummary(questions, answers) {
            try {
                const prompt = `당신은 우아한테크코스 지망생 크루 본인입니다. 직접 작성한 3가지 답변을 바탕으로, 하나의 유기적인 회고록을 1인칭 시점으로 완성해주세요. 날짜나 질문 번호는 포함하지 마세요.\n[나의 답변들]\n질문 1: ${questions[0]} -> 답변: ${answers[0]}\n질문 2: ${questions[1]} -> 답변: ${answers[1]}\n질문 3: ${questions[2]} -> 답변: ${answers[2]}`;
                return await this.fetchFromGemini(prompt);
            } catch(e) { return answers.join('\n\n'); }
        },
        async generateMockInterviewQuestion(log) { return await this.fetchFromGemini(`회고를 읽고 날카로운 면접 질문 1개: ${log}`); },
        async generateMonthlyInsight(logs) { return await this.fetchFromGemini(`성장 포인트, 조언, 응원을 정리해 정교한 마크다운 형식으로 리포트를 작성하세요:\n${logs}`); },
        async generateTTS(text) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${env.apiKey}`;
            const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: text }] }], generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Aoede" } } } } }) });
            const result = await response.json(); return result.candidates[0].content.parts[0].inlineData.data;
        }
    };

    const coverflowDomain = {
        track: document.getElementById('coverflow-track'), datesArray: [], items: [],
        centerIndex: 15, virtualScroll: 15, targetScroll: 15,
        isDragging: false, animationFrameId: null,
        startX: 0, startScroll: 0, lastX: 0, lastTime: 0, velocity: 0, wheelTimeout: null,
        currentYear: new Date().getFullYear(), currentMonth: new Date().getMonth(),

        init() { this.resetToDate(new Date()); this.bindEvents(); this.initCustomPicker(); },

        initCustomPicker() {
            const yg = document.getElementById('picker-year-grid');
            const mg = document.getElementById('picker-month-grid');
            if(!yg || !mg) return;
            yg.innerHTML = ''; mg.innerHTML = '';
            const cy = new Date().getFullYear();
            for(let y = cy - 2; y <= cy + 2; y++) {
                const el = document.createElement('div'); el.className = `picker-item flex-none px-6 py-3 min-w-[90px] ${y === this.currentYear ? 'active' : ''}`; el.innerText = y;
                el.onclick = () => { this.currentYear = y; this.updateFromPicker(); }; yg.appendChild(el);
            }
            for(let m = 0; m < 12; m++) {
                const el = document.createElement('div'); el.className = `picker-item ${m === this.currentMonth ? 'active' : ''}`; el.innerText = dateDomain.getMonthName(m).substring(0, 3);
                el.onclick = () => { this.currentMonth = m; this.updateFromPicker(); }; mg.appendChild(el);
            }
        },

        openDatePicker() { uiDomain.openModal('date-picker-modal'); },
        updateFromPicker() { this.resetToDate(new Date(this.currentYear, this.currentMonth, 1)); },

        resetToDate(date) {
            this.currentYear = date.getFullYear(); this.currentMonth = date.getMonth();
            this.datesArray = []; for (let i = -this.centerIndex; i <= this.centerIndex; i++) this.datesArray.push(dateDomain.addDays(date, i));
            this.virtualScroll = this.centerIndex; this.targetScroll = this.centerIndex;
            this.createDOMItems(); this.render();
        },

        createDOMItems() {
            this.track.innerHTML = ''; this.items = [];
            this.datesArray.forEach((date, index) => {
                const el = document.createElement('div'); el.className = 'cover-item';
                const dk = dateDomain.formatDateKey(date); if (env.recordsRepository.has(dk)) el.classList.add('has-record');
                el.innerHTML = `<div class="cover-badge"></div><div class="cover-day">${date.getDate()}</div><div class="cover-weekday">${dateDomain.getWeekday(date)}</div>`;

                // ✅ 수정: 옆에 위치한 날짜 클릭 시 이동 기능 확실히 구현
                el.onclick = (e) => {
                    if (this.isDragging || Math.abs(this.velocity) > 0.05) return;
                    // 현재 배열 내에서의 위치(index)로 targetScroll을 강제 설정 ✅
                    if (index === Math.round(this.virtualScroll)) {
                        journalDomain.openJournal(dk);
                    } else {
                        this.targetScroll = index;
                        this.animateSnap();
                    }
                };
                this.track.appendChild(el); this.items.push(el);
            });
        },

        checkAndShiftArray() {
            while (this.virtualScroll > this.centerIndex + 0.6) { this.datesArray.push(dateDomain.addDays(this.datesArray[this.datesArray.length - 1], 1)); this.datesArray.shift(); this.targetScroll--; this.virtualScroll--; this.createDOMItems(); }
            while (this.virtualScroll < this.centerIndex - 0.6) { this.datesArray.unshift(dateDomain.addDays(this.datesArray[0], -1)); this.datesArray.pop(); this.targetScroll++; this.virtualScroll++; this.createDOMItems(); }
        },

        render() {
            this.items.forEach((item, index) => {
                const raw = index - this.virtualScroll; const offset = raw - 0.25 * Math.sin(raw * Math.PI); const abs = Math.abs(offset), sign = Math.sign(offset);
                let tx = 0, ry = 0, sc = 1, tz = 0, op = 1;
                if (abs < 1) { tx = offset * 160; ry = offset * -55; sc = 1 - (abs * 0.15); tz = abs * -120; }
                else { tx = (sign * 160) + (offset - sign) * 45; ry = sign * -55; sc = 0.85; tz = -120 - (abs - 1) * 40; op = Math.max(0, 1 - (abs - 2) * 0.4); }
                item.style.transform = `translateX(${tx}px) translateZ(${tz}px) scale(${sc}) rotateY(${ry}deg)`; item.style.opacity = op; item.style.zIndex = Math.round(100 - abs * 10);
            });
            this.updateHeaderAndBackground();
        },

        updateHeaderAndBackground() {
            const cd = this.datesArray[Math.round(this.virtualScroll)]; if (!cd) return;
            this.currentYear = cd.getFullYear(); this.currentMonth = cd.getMonth();
            const yearEl = document.getElementById('display-year'); if(yearEl) yearEl.innerText = `${this.currentYear} YEAR`;
            const monthEl = document.getElementById('display-month'); if(monthEl) monthEl.innerText = dateDomain.getMonthName(this.currentMonth);
            const sc = dateDomain.getSeasonClass(this.currentMonth); document.body.className = sc; seasonFXDomain.changeSeason(sc);
            document.querySelectorAll('#picker-year-grid .picker-item').forEach(i => i.innerText == this.currentYear ? i.classList.add('active') : i.classList.remove('active'));
            document.querySelectorAll('#picker-month-grid .picker-item').forEach((i, idx) => idx == this.currentMonth ? i.classList.add('active') : i.classList.remove('active'));
        },

        animateSnap() {
            const diff = this.targetScroll - this.virtualScroll;
            if (Math.abs(diff) < 0.001) { this.virtualScroll = Math.round(this.targetScroll); this.targetScroll = this.virtualScroll; this.checkAndShiftArray(); this.render(); return; }
            this.virtualScroll += diff * 0.14; this.checkAndShiftArray(); this.render();
            this.animationFrameId = requestAnimationFrame(() => this.animateSnap());
        },

        bindEvents() {
            const c = document.getElementById('coverflow-container');
            const os = (e) => { this.isDragging = true; this.startX = e.type.includes('mouse') ? e.pageX : e.touches[0].pageX; this.lastX = this.startX; this.lastTime = Date.now(); this.startScroll = this.virtualScroll; this.velocity = 0; if (this.animationFrameId) cancelAnimationFrame(this.animationFrameId); };
            const om = (e) => { if (!this.isDragging) return; const cx = e.type.includes('mouse') ? e.pageX : e.touches[0].pageX; const ct = Date.now(), dt = ct - this.lastTime; if (dt > 0) this.velocity = (cx - this.lastX) / dt; this.lastX = cx; this.lastTime = ct; this.virtualScroll = this.startScroll + (this.startX - cx) * 0.02; this.targetScroll = this.virtualScroll; this.checkAndShiftArray(); this.render(); };
            const oe = () => { if (!this.isDragging) return; this.isDragging = false; const mom = Math.max(-12, Math.min(12, this.velocity * 10)); this.targetScroll = Math.round(this.virtualScroll - mom); this.animateSnap(); };
            c.addEventListener('mousedown', os); window.addEventListener('mousemove', om); window.addEventListener('mouseup', oe);
            c.addEventListener('touchstart', os, {passive: true}); c.addEventListener('touchmove', om, {passive: true}); c.addEventListener('touchend', oe);
            c.addEventListener('wheel', (e) => { if (document.querySelector('.modal-overlay.active')) return; e.preventDefault(); const dx = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY; this.targetScroll += dx * 0.008; if (this.animationFrameId) cancelAnimationFrame(this.animationFrameId); this.animateSnap(); clearTimeout(this.wheelTimeout); this.wheelTimeout = setTimeout(() => { this.targetScroll = Math.round(this.targetScroll); this.animateSnap(); }, 150); }, { passive: false });
        }
    };

    const journalDomain = {
        currentSelectedDate: null, writeAnswers: [], currentStep: 0, questions: [],
        openJournal(dk) { this.currentSelectedDate = dk; const rec = env.recordsRepository.get(dk); if (rec) { document.getElementById('view-date-title').innerText = dk; document.getElementById('view-content').innerText = rec; interviewDomain.reset(); uiDomain.openModal('view-modal'); } else this.startWriteProcess(); },
        async startWriteProcess() {
            uiDomain.openModal('write-modal');
            const l = document.getElementById('ai-question-loading'); if(l) { l.classList.remove('hidden'); l.classList.add('flex'); }
            const c = document.getElementById('question-step-container'); if(c) c.classList.add('hidden');
            this.questions = await aiService.generateQuestions();
            if(l) l.classList.add('hidden');
            this.resetWriteModal();
        },
        resetWriteModal() {
            this.writeAnswers = []; this.currentStep = 0;
            const sc = document.getElementById('question-step-container'); if(sc) sc.classList.remove('hidden');
            const pc = document.getElementById('ai-processing-container'); if(pc) pc.classList.add('hidden');
            const rc = document.getElementById('final-result-container'); if(rc) rc.classList.add('hidden');
            this.updateQuestionUI();
        },
        updateQuestionUI() {
            const si = document.getElementById('step-indicator'); if(si) si.innerText = `${this.currentStep + 1}/3`;
            const qt = document.getElementById('question-text'); if(qt) qt.innerText = this.questions[this.currentStep] || "질문을 준비 중입니다";
            const ai = document.getElementById('answer-input'); if(ai) ai.value = "";
        },
        async nextStep() {
            const ai = document.getElementById('answer-input');
            const val = ai ? ai.value.trim() : ""; if(!val) return;
            this.writeAnswers[this.currentStep] = val;
            if (this.currentStep < 2) { this.currentStep++; this.updateQuestionUI(); }
            else {
                const sc = document.getElementById('question-step-container'); if(sc) sc.classList.add('hidden');
                const pc = document.getElementById('ai-processing-container'); if(pc) { pc.classList.remove('hidden'); pc.classList.add('flex'); }
                const sum = await aiService.generateSummary(this.questions, this.writeAnswers);
                if(pc) pc.classList.add('hidden');
                const rc = document.getElementById('final-result-container'); if(rc) { rc.classList.remove('hidden'); rc.classList.add('flex'); }
                const fr = document.getElementById('final-record-input'); if(fr) fr.value = sum;
            }
        },
        saveRecord() {
            env.recordsRepository.set(this.currentSelectedDate, document.getElementById('final-record-input').value);
            uiDomain.closeModal('write-modal');
            coverflowDomain.createDOMItems();
            coverflowDomain.render();
        },
        deleteCurrentRecord() {
            env.recordsRepository.delete(this.currentSelectedDate);
            uiDomain.closeModal('view-modal');
            coverflowDomain.createDOMItems();
            coverflowDomain.render();
        }
    };

    const uiDomain = {
        openModal(id) { const m = document.getElementById(id); if(m) { m.style.display = 'flex'; setTimeout(() => m.classList.add('active'), 10); } },
        closeModal(id) { const m = document.getElementById(id); if(m) { m.classList.remove('active'); setTimeout(() => m.style.display = 'none', 600); } if(currentAudio) {currentAudio.pause(); currentAudio=null;} }
    };

    const interviewDomain = { async askQuestion() { const c = document.getElementById('interview-result-container'); c.classList.remove('hidden'); const t = document.getElementById('interview-text'); t.innerText = "질문을 생성 중입니다..."; const q = await aiService.generateMockInterviewQuestion(document.getElementById('view-content').innerText); t.innerText = q; }, reset() { const c = document.getElementById('interview-result-container'); if(c) c.classList.add('hidden'); } };
    const ttsDomain = { async playTTS() { if (currentAudio) { currentAudio.pause(); currentAudio = null; return; } const b64 = await aiService.generateTTS(document.getElementById('view-content').innerText.substring(0, 500)); const u = URL.createObjectURL(new Blob([this.p2w(b64, 24000)], { type: 'audio/wav' })); currentAudio = new Audio(u); currentAudio.play(); }, p2w(b, s) { const bin = atob(b), l = bin.length, bytes = new Uint8Array(l); for (let i = 0; i < l; i++) bytes[i] = bin.charCodeAt(i); const buf = new ArrayBuffer(44 + l), v = new DataView(buf); const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }; w(0, 'RIFF'); v.setUint32(4, 36 + l, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, s, true); v.setUint32(28, s * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, l, true); new Uint8Array(buf, 44).set(bytes); return buf; } };

    // ✅ 출석부 로직 개선 (기록된 날짜만 칩 리스트로 노출)
    const attendanceDomain = {
        showMonthlyAttendance() {
            const y = coverflowDomain.currentYear, mIdx = coverflowDomain.currentMonth, m = mIdx + 1;
            const p = `${y}-${String(m).padStart(2, '0')}-`;

            const titleEl = document.getElementById('attendance-title');
            if(titleEl) titleEl.innerText = `${y} ${dateDomain.getMonthName(mIdx)}`;

            const listContainer = document.getElementById('attendance-days-list');
            if(!listContainer) return;
            listContainer.innerHTML = '';

            const attendedDays = [];
            for (const [dateKey] of env.recordsRepository.entries()) {
                if (dateKey.startsWith(p)) attendedDays.push(parseInt(dateKey.split('-')[2]));
            }
            attendedDays.sort((a, b) => a - b);

            if (attendedDays.length === 0) {
                listContainer.innerHTML = `<div class="text-[#86868b] py-10 opacity-60">기록이 아직 없습니다.</div>`;
            } else {
                attendedDays.forEach(day => {
                    const chip = document.createElement('div');
                    chip.className = 'attendance-chip';
                    chip.innerHTML = `<span>●</span> ${day}일`;
                    listContainer.appendChild(chip);
                });
            }

            const countEl = document.getElementById('attendance-count');
            if(countEl) countEl.innerText = attendedDays.length;
            uiDomain.openModal('attendance-modal');
        }
    };

    const insightDomain = {
        async generateInsight() {
            uiDomain.openModal('insight-modal');
            const l = document.getElementById('insight-loading'), c = document.getElementById('insight-content-container'), t = document.getElementById('insight-text');
            l.classList.remove('hidden'); l.classList.add('flex'); c.classList.add('hidden');
            let logs = ""; const p = `${coverflowDomain.currentYear}-${String(coverflowDomain.currentMonth+1).padStart(2, '0')}-`;
            for (const [k, v] of env.recordsRepository.entries()) if (k.startsWith(p)) logs += `${k}: ${v}\n`;
            if(!logs) { l.classList.add('hidden'); c.classList.remove('hidden'); t.innerText = "이번 달 기록이 없습니다."; return; }
            const res = await aiService.generateMonthlyInsight(logs);
            l.classList.add('hidden'); c.classList.remove('hidden');
            t.innerHTML = marked.parse(res);
        }
    };

    const monthlyLogsDomain = { showLogs() { const p = `${coverflowDomain.currentYear}-${String(coverflowDomain.currentMonth+1).padStart(2, '0')}-`; const l = document.getElementById('monthly-logs-list'); l.innerHTML = ''; document.getElementById('monthly-logs-title').innerText = "Logs"; let cnt = 0; for (const [k, v] of env.recordsRepository.entries()) if (k.startsWith(p)) { cnt++; const c = document.createElement('div'); c.className = 'bg-white/40 backdrop-blur-md p-7 rounded-[40px] border border-white/50 text-left cursor-pointer hover:bg-white/80 transition'; c.innerHTML = `<div class="font-bold text-[#1d1d1f] text-xl mb-1">${k.split('-')[2]} DAY</div><div class="text-[#86868b] text-sm line-clamp-2">${v}</div>`; c.onclick = () => { uiDomain.closeModal('monthly-logs-modal'); coverflowDomain.resetToDate(new Date(k)); setTimeout(() => journalDomain.openJournal(k), 100); }; l.appendChild(c); } if(cnt === 0) l.innerHTML = `<div class="text-center py-10 text-[#86868b]">No records.</div>`; uiDomain.openModal('monthly-logs-modal'); } };

    const seasonFXDomain = {
        container: null, currentSeason: null,
        svgs: {
            petal: `<svg viewBox="0 0 30 30" width="100%" height="100%"><path d="M15,0 C20,10 30,15 15,30 C0,15 10,10 15,0" fill="#ffb7c5"/></svg>`,
            maple: `<svg viewBox="0 0 512 512" width="100%" height="100%"><path d="M495.8,206.5l-63.5-16.1l20.1-40.2c3.4-6.8,1.4-15.1-4.7-19.4c-6.1-4.2-14.4-3.4-19.7,2.1L327.3,238L270.8,45.4 c-1.9-6.4-7.5-11-14.2-11.4c-6.7-0.4-12.8,3.4-15.5,9.5L184.7,238L84,133c-5.3-5.5-13.6-6.3-19.7-2.1c-6.1,4.2-8.1,12.5-4.7,19.4 l20.1,40.2l-63.5,16.1c-7.3,1.9-12.2,8.6-11.8,16.2c0.4,7.6,6.1,13.7,13.6,14.6l96.6,11.8l-72.2,107.5c-4.3,6.3-3.4,14.9,2.2,20.2 c5.6,5.3,14.3,5.4,20,0.3l108.8-97l46.1,118.8c1.3,6.9,8.5,11,15.6,8.7c7-2.3,11-9.9,8.6-16.7L256,231l44.3,168.4 c-2.4,6.8,1.6,14.4,8.6,16.7c7.1,2.3,14.3-1.8,15.6-8.7l46.1-118.8l108.8,97c5.7,5.1,14.4,5,20-0.3c5.6-5.3,6.4-13.8,2.2-20.2 L429.3,257l96.6-11.8c7.5-0.9,13.2-7,13.6-14.6C508,215.1,503.1,208.4,495.8,206.5z" fill="#e65100"/></svg>`
        },
        init() { this.container = document.createElement('div'); this.container.id = 'season-fx-container'; this.container.style.cssText = 'position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: hidden;'; document.getElementById('app').insertBefore(this.container, document.getElementById('coverflow-container')); },
        changeSeason(s) { if (this.currentSeason === s) return; this.currentSeason = s; this.container.innerHTML = ''; if (s === 'season-spring') this.cP('petal', 20, 'fall-down'); else if (s === 'season-summer') this.cSS(); else if (s === 'season-autumn') this.cP('maple', 15, 'fall-down'); else if (s === 'season-winter') this.cP('snowflake', 45, 'fall-down'); },
        cSS() { const sn = document.createElement('div'); sn.className = 'summer-sun'; this.container.appendChild(sn); this.cP('mote', 30, 'float-up'); },
        cP(t, c, anim) { for (let i = 0; i < c; i++) { const w = document.createElement('div'); w.className = 'fx-wrapper'; w.style.left = Math.random() * 100 + 'vw'; const dur = t === 'mote' ? (15 + Math.random() * 10) : (8 + Math.random() * 8); w.style.animation = `${anim} ${dur}s linear infinite`; w.style.animationDelay = `-${Math.random() * dur}s`; const n = document.createElement('div'); n.className = 'fx-inner'; n.style.animation = `sway-rotate ${5 + Math.random() * 5}s ease-in-out infinite alternate`; if(t === 'snowflake') { const sz = 10 + Math.random() * 12; n.style.width = `${sz}px`; n.style.height = `${sz}px`; n.style.background = 'white'; n.style.borderRadius = '50%'; n.style.opacity = 0.6 + Math.random() * 0.3; n.style.filter = `blur(${Math.random() * 1.5}px)`; n.style.boxShadow = '0 0 15px rgba(255,255,255,0.8)'; } else if(t === 'mote') { const sz = 1 + Math.random() * 2; n.style.width = `${sz}px`; n.style.height = `${sz}px`; n.style.background = 'white'; n.style.borderRadius = '50%'; n.style.opacity = 0.2 + Math.random() * 0.3; } else { n.style.width = '24px'; n.style.height = '24px'; n.innerHTML = this.svgs[t]; } w.appendChild(n); this.container.appendChild(w); } }
    };

    document.addEventListener('DOMContentLoaded', () => { seasonFXDomain.init(); coverflowDomain.init(); });
