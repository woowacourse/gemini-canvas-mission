<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배구 게임</title>
    <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
    <style>
        :root {
            --baemin-cyan: #2AC1BC;
            --baemin-dark: #333333;
            --baemin-white: #FFFFFF;
            --baemin-gray: #F6F6F6;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--baemin-gray);
            font-family: 'Do Hyeon', sans-serif;
            overflow: hidden;
            color: var(--baemin-dark);
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 500px;
            background-color: var(--baemin-white);
            border: 8px solid var(--baemin-dark);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        #selection-screen {
            position: absolute;
            inset: 0;
            background-color: var(--baemin-cyan);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #selection-screen h1 {
            font-size: 3rem;
            color: white;
            margin-bottom: 40px;
            text-shadow: 2px 2px 0px var(--baemin-dark);
        }

        .char-options {
            display: flex;
            gap: 40px;
        }

        .char-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            border: 4px solid var(--baemin-dark);
            width: 200px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .char-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 0px var(--baemin-dark);
        }

        .char-card h2 { margin: 10px 0; }
        .char-card p { font-size: 0.9rem; line-height: 1.4; color: #666; }
        .char-card .skill { font-weight: bold; color: var(--baemin-cyan); margin-top: 10px; }

        #game-over-screen {
            position: absolute;
            inset: 0;
            background-color: rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: white;
        }

        #game-over-screen h2 { font-size: 4rem; margin-bottom: 20px; }
        .btn-restart, .btn-home {
            padding: 12px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-family: 'Do Hyeon', sans-serif;
            margin: 5px;
        }
        .btn-restart { background: var(--baemin-cyan); }
        .btn-home { background: #666; }

        canvas {
            display: block;
            background-color: #f0f9f9;
        }

        #score-board {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 100px;
            font-size: 2.5rem;
            pointer-events: none;
            z-index: 5;
        }

        .score {
            background: var(--baemin-dark);
            color: white;
            padding: 5px 20px;
            border-radius: 10px;
        }

        #message {
            position: absolute;
            bottom: 15px;
            left: 20px;
            font-size: 0.9rem;
            color: var(--baemin-dark);
            opacity: 0.8;
            white-space: nowrap;
        }

        #back-to-home {
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-family: 'Do Hyeon', sans-serif;
            background: #eee;
            border: 1px solid #ccc;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        #back-to-home:hover { background: #ddd; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="selection-screen">
        <h1>누구로 배구할까요?</h1>
        <div class="char-options">
            <div class="char-card" onclick="startGame('A')">
                <div style="font-size: 50px;">🏃‍♂️</div>
                <h2>캐릭터 A</h2>
                <p>수비 특화: 지면 다이빙</p>
                <div class="skill">기술: 다이빙 리시브</div>
                <div style="font-size: 11px; margin-top: 5px;">(지상 이동 중 X키)</div>
            </div>
            <div class="char-card" onclick="startGame('B')">
                <div style="font-size: 50px;">💥</div>
                <h2>캐릭터 B</h2>
                <p>공격 특화: 파워 강타</p>
                <div class="skill">기술: 파워 스파이크</div>
                <div style="font-size: 11px; margin-top: 5px;">(점프 중 공 근처 X키)</div>
            </div>
        </div>
    </div>

    <div id="game-over-screen">
        <h2 id="winner-text">승리!</h2>
        <div style="display: flex;">
            <button class="btn-restart" onclick="resetGame()">다시 하기</button>
            <button class="btn-home" onclick="location.reload()">캐릭터 선택</button>
        </div>
    </div>

    <div id="score-board">
        <div class="score" id="score-left">0</div>
        <div class="score" id="score-right">0</div>
    </div>
    
    <canvas id="gameCanvas"></canvas>
    <div id="message">조작법 - 이동: 방향키 | 점프: Z | 기술: X</div>
    <button id="back-to-home" onclick="location.reload()">메인으로</button>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const selectionScreen = document.getElementById('selection-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const scoreLeftEl = document.getElementById('score-left');
    const scoreRightEl = document.getElementById('score-right');

    canvas.width = 800;
    canvas.height = 500;

    const GRAVITY = 0.25; 
    const GROUND_Y = 450;
    const NET_WIDTH = 10;
    const NET_HEIGHT = 150;
    const WIN_SCORE = 6;

    let gameState = 'selection';
    let p1Score = 0;
    let p2Score = 0;
    let p1CharType = 'A';
    const keys = {};

    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.vx = (Math.random() - 0.5) * 4;
            this.vy = (Math.random() - 0.5) * 4;
            this.life = 1.0;
            this.color = color;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life -= 0.04;
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    }

    let particles = [];

    class Player {
        constructor(x, y, color, side, type) {
            this.x = x;
            this.y = y;
            this.radius = 25;
            this.color = color;
            this.side = side;
            this.type = type;
            this.vx = 0;
            this.vy = 0;
            this.speed = 4;
            this.jumpPower = -9;
            this.isGrounded = false;
            this.isDiving = false;
            this.diveCooldown = 0;
            this.isSpiking = false;
        }

        update() {
            if (this.side === 'left') {
                if (!this.isDiving) {
                    if (keys['ArrowLeft']) this.vx = -this.speed;
                    else if (keys['ArrowRight']) this.vx = this.speed;
                    else this.vx *= 0.8;

                    if (keys['KeyZ'] && this.isGrounded) {
                        this.vy = this.jumpPower;
                        this.isGrounded = false;
                    }
                    
                    if (keys['KeyX'] && this.type === 'A' && this.isGrounded && this.diveCooldown === 0) {
                        this.startDive();
                    }
                }
            } else {
                this.updateAI();
            }

            this.vy += GRAVITY;
            this.x += this.vx;
            this.y += this.vy;

            const minX = this.side === 'left' ? this.radius : canvas.width / 2 + NET_WIDTH / 2 + this.radius;
            const maxX = this.side === 'left' ? canvas.width / 2 - NET_WIDTH / 2 - this.radius : canvas.width - this.radius;

            if (this.x < minX) { this.x = minX; this.vx = 0; }
            if (this.x > maxX) { this.x = maxX; this.vx = 0; }

            if (this.y + this.radius > GROUND_Y) {
                this.y = GROUND_Y - this.radius;
                this.vy = 0;
                this.isGrounded = true;
                this.isDiving = false;
            }
            
            if (this.diveCooldown > 0) this.diveCooldown--;
        }

        startDive() {
            this.isDiving = true;
            this.diveCooldown = 50;
            if (ball.x < canvas.width / 2) {
                const dir = ball.x > this.x ? 1 : -1;
                this.vx = dir * 12; 
            } else {
                this.vx = 10;
            }
            this.vy = -1.5;
            for(let i=0; i<8; i++) particles.push(new Particle(this.x, this.y, this.color));
        }

        updateAI() {
            const defenseX = canvas.width * 0.8;
            const targetX = (ball.x > canvas.width / 2 + 50) ? ball.x : defenseX;
            
            if (this.x < targetX - 5) this.vx = this.speed * 0.9;
            else if (this.x > targetX + 5) this.vx = -this.speed * 0.9;
            else this.vx = 0;

            if (ball.x > canvas.width / 2 && ball.y < 350 && this.isGrounded && Math.abs(ball.x - this.x) < 60) {
                if (ball.vy > 0 || ball.y < 200) {
                    this.vy = this.jumpPower;
                    this.isGrounded = false;
                }
            }

            if (!this.isGrounded && Math.abs(this.x - ball.x) < 70 && Math.abs(this.y - ball.y) < 70) {
                if (Math.random() < 0.1) this.isSpiking = true; 
            }
        }

        draw() {
            ctx.save();
            if (this.isDiving) {
                ctx.translate(this.x, this.y);
                ctx.rotate(this.side === 'left' ? 0.6 : -0.6);
                ctx.translate(-this.x, -this.y);
            }
            
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            ctx.fillStyle = 'white';
            const eyeX = this.side === 'left' ? 10 : -10;
            ctx.beginPath();
            ctx.arc(this.x + eyeX, this.y - 8, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(this.x + eyeX + (this.side === 'left' ? 2 : -2), this.y - 8, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    class Ball {
        constructor() {
            this.radius = 45; 
            this.ignoreCollisionTimer = 0; // 스파이크 시 캐릭터 몸체 충돌 무시 타이머
            this.reset('left');
        }

        reset(winner) {
            if (winner === 'left') {
                this.x = 650;
                this.y = 50;
            } else {
                this.x = 150;
                this.y = 50;
            }
            this.vx = 0;
            this.vy = 0;
            this.ignoreCollisionTimer = 0;
        }

        update() {
            this.vy += GRAVITY * 0.6; 
            this.x += this.vx;
            this.y += this.vy;

            if (this.ignoreCollisionTimer > 0) this.ignoreCollisionTimer--;

            if (this.y - this.radius < 0) {
                this.y = this.radius;
                this.vy *= -0.7;
            }
            if (this.x - this.radius < 0) {
                this.x = this.radius;
                this.vx *= -0.7;
            }
            if (this.x + this.radius > canvas.width) {
                this.x = canvas.width - this.radius;
                this.vx *= -0.7;
            }

            const netX = canvas.width / 2;
            const netTop = canvas.height - NET_HEIGHT;
            if (this.y + this.radius > netTop && Math.abs(this.x - netX) < this.radius + NET_WIDTH/2) {
                if (this.y < netTop + 15) {
                    this.vy *= -0.7;
                    this.y = netTop - this.radius;
                } else {
                    this.vx *= -0.7;
                    this.x = this.x < netX ? netX - NET_WIDTH/2 - this.radius : netX + NET_WIDTH/2 + this.radius;
                }
            }

            if (this.y + this.radius > GROUND_Y) {
                if (this.x < canvas.width / 2) {
                    p2Score++;
                    this.reset('right');
                } else {
                    p1Score++;
                    this.reset('left');
                }
                updateScore();
                checkGameEnd();
            }
        }

        draw() {
            ctx.save();
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#2AC1BC';
            ctx.fill();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 4;
            ctx.stroke();
            
            ctx.beginPath();
            ctx.lineWidth = 2;
            ctx.arc(this.x, this.y, this.radius * 0.7, 0, Math.PI, true);
            ctx.stroke();
            ctx.restore();
        }
    }

    let p1, p2, ball;

    function startGame(charType) {
        p1CharType = charType;
        resetGame();
        selectionScreen.style.display = 'none';
    }

    function resetGame() {
        p1Score = 0;
        p2Score = 0;
        updateScore();
        p1 = new Player(150, 400, '#FFD400', 'left', p1CharType);
        p2 = new Player(650, 400, '#FF6B6B', 'right', 'B'); 
        ball = new Ball();
        gameState = 'playing';
        gameOverScreen.style.display = 'none';
        requestAnimationFrame(gameLoop);
    }

    function updateScore() {
        scoreLeftEl.innerText = p1Score;
        scoreRightEl.innerText = p2Score;
    }

    function checkGameEnd() {
        if (p1Score >= WIN_SCORE || p2Score >= WIN_SCORE) {
            gameState = 'over';
            const winner = p1Score >= WIN_SCORE ? "플레이어 승리!" : "상대 NPC 승리!";
            document.getElementById('winner-text').innerText = winner;
            gameOverScreen.style.display = 'flex';
        }
    }

    function checkCollision(p, b) {
        // 스파이크 직후 시전자와의 충돌 일시 무시
        if (b.ignoreCollisionTimer > 0) return;

        const dx = p.x - b.x;
        const dy = p.y - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        const collisionDist = (p.type === 'B') ? (p.radius + b.radius + 20) : (p.radius + b.radius);

        if (dist < collisionDist) {
            const isP1Skill = (p.side === 'left' && keys['KeyX']);
            const isP2Skill = (p.side === 'right' && p.isSpiking); 

            if (p.type === 'B' && !p.isGrounded && (isP1Skill || isP2Skill)) {
                const targetDir = p.side === 'left' ? 1 : -1;
                
                // 네트에 걸리는 것을 방지하기 위해 각도 상향 보정 (수평 속도 강화, 수직 속도 조절)
                // 공이 네트 근처일 때만 조금 더 띄워주는 보정 추가
                let spikeVY = 7;
                if (Math.abs(b.x - canvas.width/2) < 150) spikeVY = 4; // 네트 근처면 살짝 띄워서 넘김

                b.vx = targetDir * 14; 
                b.vy = spikeVY; 
                
                // 충돌 무시 타이머 설정 (몸에 맞고 튕기는 현상 제거)
                b.ignoreCollisionTimer = 15; 
                
                createHitEffect(b.x, b.y, '#FF6B6B');
                if (p.side === 'right') p.isSpiking = false;
            } else if (p.type === 'A' && p.isDiving) {
                b.vy = -10;
                b.vx = (canvas.width/2 - b.x) * 0.04; 
                createHitEffect(b.x, b.y, '#2AC1BC');
            } else {
                const bounceAngle = Math.atan2(b.y - p.y, b.x - p.x);
                let force = 6.5;
                b.vx = Math.cos(bounceAngle) * force;
                b.vy = Math.sin(bounceAngle) * force;
                
                if (p.side === 'right' && b.vx > -2) b.vx = -4.5;
                if (p.side === 'left' && b.vx < 2) b.vx = 4.5;
            }

            // 겹침 보정
            if (b.y > p.y && p.isGrounded && b.ignoreCollisionTimer === 0) b.y = p.y - b.radius;
        }
    }

    function createHitEffect(x, y, color) {
        for(let i=0; i<15; i++) particles.push(new Particle(x, y, color));
    }

    function gameLoop() {
        if (gameState !== 'playing') return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = '#f9f9f9';
        ctx.fillRect(0, 0, canvas.width, GROUND_Y);
        ctx.fillStyle = '#eee';
        ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
        
        ctx.fillStyle = '#333';
        ctx.fillRect(canvas.width / 2 - NET_WIDTH / 2, canvas.height - NET_HEIGHT, NET_WIDTH, NET_HEIGHT);

        p1.update();
        p2.update();
        ball.update();

        checkCollision(p1, ball);
        checkCollision(p2, ball);

        particles = particles.filter(p => p.life > 0);
        particles.forEach(p => { p.update(); p.draw(); });

        p1.draw();
        p2.draw();
        ball.draw();

        requestAnimationFrame(gameLoop);
    }
</script>

</body>
</html>
