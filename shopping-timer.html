<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>쇼핑 타이머 - 현명한 소비의 시작</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');

      body {
        font-family: 'Pretendard', sans-serif;
        background-color: #f5f3ff; /* 연한 보라색 배경 */
      }

      .timer-card {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .timer-card:hover {
        transform: translateY(-4px);
        box-shadow:
          0 10px 25px -5px rgba(139, 92, 246, 0.1),
          0 8px 10px -6px rgba(139, 92, 246, 0.1);
      }

      .progress-bar {
        transition: width 1s linear;
      }

      /* 그라데이션 버튼 스타일 */
      .btn-gradient {
        background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
        transition: opacity 0.2s;
      }

      .btn-gradient:hover {
        opacity: 0.9;
      }

      .btn-gradient:disabled {
        background: #d1d5db;
        cursor: not-allowed;
      }

      /* 알림 메시지 스타일 */
      #notification-container {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 1000;
      }
    </style>
  </head>
  <body class="p-4 md:p-8">
    <div id="notification-container"></div>

    <div class="max-w-2xl mx-auto">
      <!-- 헤더 -->
      <header class="mb-8 text-center">
        <h1 class="text-3xl font-bold text-slate-800 mb-2">
          <i class="fas fa-hourglass-half text-purple-600 mr-2"></i>쇼핑 타이머
        </h1>
        <p class="text-slate-500 font-medium">
          충동구매 전 충분한 여유, 정말 필요한 물건인가요?
        </p>
      </header>

      <!-- 대시보드 (절약 금액) -->
      <div
        class="bg-white rounded-3xl p-6 shadow-sm border border-purple-100 mb-8 flex items-center justify-between"
      >
        <div>
          <p
            class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1"
          >
            지금까지 참아내어 절약한 금액
          </p>
          <h2 id="total-saved" class="text-2xl font-bold text-purple-600">
            0원
          </h2>
        </div>
        <div class="bg-purple-100 p-4 rounded-2xl">
          <i class="fas fa-piggy-bank text-purple-600 text-2xl"></i>
        </div>
      </div>

      <!-- 상품 등록 폼 -->
      <section
        class="bg-white rounded-3xl p-6 shadow-md border border-purple-50 mb-8"
      >
        <h3 class="text-lg font-bold mb-6 flex items-center text-slate-800">
          <i class="fas fa-plus-circle mr-2 text-purple-500"></i>새 상품 등록
        </h3>
        <div class="space-y-4">
          <input
            type="text"
            id="item-name"
            placeholder="상품 이름 (예: 빈티지 오버핏 셔츠)"
            class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all"
          />
          <input
            type="url"
            id="item-link"
            placeholder="상품 링크 (URL)"
            class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all"
          />
          <input
            type="number"
            id="item-price"
            placeholder="가격 (원)"
            class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all"
          />

          <div class="space-y-2">
            <label class="text-xs font-bold text-slate-400 ml-1 uppercase"
              >고민할 시간 설정</label
            >
            <div class="grid grid-cols-2 gap-4">
              <div class="relative">
                <input
                  type="number"
                  id="item-hours"
                  placeholder="0"
                  min="0"
                  value="48"
                  class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-center font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all"
                />
                <span
                  class="absolute right-4 top-4 text-[10px] text-slate-400 font-bold"
                  >시간</span
                >
              </div>
              <div class="relative">
                <input
                  type="number"
                  id="item-minutes"
                  placeholder="0"
                  min="0"
                  max="59"
                  value="0"
                  class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-center font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all"
                />
                <span
                  class="absolute right-4 top-4 text-[10px] text-slate-400 font-bold"
                  >분</span
                >
              </div>
            </div>
          </div>

          <button
            onclick="addItem()"
            class="btn-gradient w-full text-white font-bold py-4 rounded-2xl shadow-lg shadow-purple-200 transform active:scale-[0.98] transition-all"
          >
            고민 시작하기
          </button>
        </div>
      </section>

      <!-- 타이머 리스트 -->
      <section>
        <div class="flex items-center justify-between mb-4 px-2">
          <h3 class="text-lg font-bold text-slate-800">
            심사숙고 중인 위시리스트
          </h3>
          <span
            id="active-count"
            class="bg-purple-100 text-purple-600 text-xs font-bold px-3 py-1 rounded-full"
            >0</span
          >
        </div>
        <div id="items-list" class="space-y-5">
          <!-- 아이템들이 여기에 렌더링됩니다 -->
        </div>
      </section>
    </div>

    <script>
      let items = JSON.parse(localStorage.getItem('shoppingTimer_items')) || [];
      let totalSaved =
        parseInt(localStorage.getItem('shoppingTimer_saved')) || 0;

      function updateStorage() {
        localStorage.setItem('shoppingTimer_items', JSON.stringify(items));
        localStorage.setItem('shoppingTimer_saved', totalSaved.toString());
        render();
      }

      function showMessage(msg, type = 'info') {
        const container = document.getElementById('notification-container');
        const toast = document.createElement('div');
        const bgColor =
          type === 'success'
            ? 'bg-emerald-500'
            : type === 'error'
              ? 'bg-rose-500'
              : 'bg-purple-600';

        toast.className = `${bgColor} text-white px-6 py-4 rounded-2xl shadow-xl mb-3 animate-bounce flex items-center font-bold text-sm`;
        toast.innerHTML = `<i class="fas fa-info-circle mr-3"></i> ${msg}`;

        container.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transition = '0.5s';
          setTimeout(() => toast.remove(), 500);
        }, 3000);
      }

      function addItem() {
        const name = document.getElementById('item-name').value;
        const link = document.getElementById('item-link').value;
        const price = parseInt(document.getElementById('item-price').value);
        const hours =
          parseInt(document.getElementById('item-hours').value) || 0;
        const minutes =
          parseInt(document.getElementById('item-minutes').value) || 0;

        if (!name || !link || isNaN(price)) {
          showMessage('모든 정보를 정확히 입력해주세요.', 'error');
          return;
        }

        if (hours === 0 && minutes === 0) {
          showMessage('고민할 시간을 설정해주세요.', 'error');
          return;
        }

        const totalMs = hours * 3600 * 1000 + minutes * 60 * 1000;

        const newItem = {
          id: Date.now(),
          name,
          link,
          price,
          duration: totalMs,
          createdAt: Date.now(),
          expiresAt: Date.now() + totalMs,
          notified: false,
        };

        items.unshift(newItem); // 최신 항목이 위로 오도록

        // 입력 필드 초기화
        document.getElementById('item-name').value = '';
        document.getElementById('item-link').value = '';
        document.getElementById('item-price').value = '';
        document.getElementById('item-hours').value = '48';
        document.getElementById('item-minutes').value = '0';

        updateStorage();
        showMessage(
          '타이머가 시작되었습니다. 신중하게 고민해보세요!',
          'success',
        );
      }

      function deleteItem(id, isRegret = false) {
        const item = items.find((i) => i.id === id);
        if (isRegret) {
          totalSaved += item.price;
          showMessage(
            `${item.price.toLocaleString()}원을 절약하셨습니다!`,
            'success',
          );
        }
        items = items.filter((i) => i.id !== id);
        updateStorage();
      }

      function openLink(id) {
        const item = items.find((i) => i.id === id);
        if (Date.now() < item.expiresAt) {
          showMessage('아직 고민 시간이 끝나지 않았습니다!', 'error');
          return;
        }
        window.open(item.link, '_blank');
      }

      function formatTime(ms) {
        if (ms <= 0) return '시간 종료';
        const totalSeconds = Math.floor(ms / 1000);
        const days = Math.floor(totalSeconds / 86400);
        const hours = Math.floor((totalSeconds % 86400) / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        let result = '';
        if (days > 0) result += `${days}일 `;
        if (hours > 0 || days > 0) result += `${hours}시간 `;
        result += `${minutes}분 ${seconds}초`;
        return result;
      }

      function render() {
        const listElement = document.getElementById('items-list');
        const activeCountElement = document.getElementById('active-count');
        const totalSavedElement = document.getElementById('total-saved');

        totalSavedElement.innerText = `${totalSaved.toLocaleString()}원`;
        activeCountElement.innerText = items.length;

        if (items.length === 0) {
          listElement.innerHTML = `
                    <div class="text-center py-20 bg-white rounded-3xl border border-dashed border-purple-200">
                        <i class="fas fa-shopping-bag text-5xl mb-4 text-purple-100"></i>
                        <p class="text-slate-400 font-medium">고민 중인 상품이 없습니다.</p>
                    </div>
                `;
          return;
        }

        listElement.innerHTML = items
          .map((item) => {
            const now = Date.now();
            const timeLeft = item.expiresAt - now;
            const isExpired = timeLeft <= 0;
            const progress = Math.min(
              100,
              ((now - item.createdAt) / item.duration) * 100,
            );

            if (isExpired && !item.notified) {
              item.notified = true;
              showMessage(
                `[알림] '${item.name}'의 고민 시간이 끝났습니다!`,
                'success',
              );
            }

            return `
                    <div class="timer-card bg-white rounded-3xl p-6 border border-purple-50 shadow-sm relative overflow-hidden">
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex-1 min-w-0">
                                <h4 class="font-bold text-slate-800 text-lg truncate pr-2">${item.name}</h4>
                                <p class="text-purple-600 font-bold">${item.price.toLocaleString()}원</p>
                            </div>
                            <button onclick="deleteItem(${item.id}, false)" class="text-slate-300 hover:text-rose-500 transition-colors" title="삭제">
                                <i class="fas fa-trash-alt text-lg"></i>
                            </button>
                        </div>
                        
                        <div class="bg-slate-50 rounded-2xl p-4 mb-6 border border-slate-100">
                            <div class="flex justify-between text-[10px] font-bold uppercase mb-2">
                                <span class="text-slate-400">${isExpired ? '고민 완료!' : '남은 시간'}</span>
                                <span class="${isExpired ? 'text-emerald-500' : 'text-purple-600'} font-mono">${isExpired ? 'READY' : formatTime(timeLeft)}</span>
                            </div>
                            <div class="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden">
                                <div class="progress-bar ${isExpired ? 'bg-emerald-500' : 'bg-purple-500'} h-full rounded-full" style="width: ${progress}%"></div>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <button onclick="deleteItem(${item.id}, true)" class="py-3.5 rounded-2xl bg-slate-100 text-slate-600 font-bold text-xs hover:bg-rose-50 hover:text-rose-600 transition-all">
                                안 살래요
                            </button>
                            <button 
                                onclick="openLink(${item.id})" 
                                ${!isExpired ? 'disabled' : ''} 
                                class="btn-gradient py-3.5 rounded-2xl text-white font-bold text-xs shadow-md transition-all flex items-center justify-center">
                                <i class="fas fa-shopping-cart mr-2"></i> ${isExpired ? '구매하기' : '대기 중'}
                            </button>
                        </div>
                    </div>
                `;
          })
          .join('');
      }

      setInterval(render, 1000);

      window.onload = () => {
        render();
        if (
          Notification.permission !== 'granted' &&
          Notification.permission !== 'denied'
        ) {
          Notification.requestPermission();
        }
      };
    </script>
  </body>
</html>
