<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESTful API 네이밍 어시스턴트</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js for rendering markdown from Gemini response -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Custom scrollbar for a sleek look */
        .chat-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .chat-scroll::-webkit-scrollbar-track {
            background: #111827;
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }
        .chat-scroll::-webkit-scrollbar-thumb:hover {
            background: #4b5563;
        }

        /* Markdown formatting styles inside the bot messages */
        .markdown-body p { margin-bottom: 0.75rem; line-height: 1.6; }
        .markdown-body ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1rem; }
        .markdown-body ol { list-style-type: decimal; margin-left: 1.5rem; margin-bottom: 1rem; }
        .markdown-body li { margin-bottom: 0.25rem; }
        .markdown-body pre { background: #1f2937; padding: 1rem; border-radius: 0.5rem; margin-bottom: 1rem; overflow-x: auto; border: 1px solid #374151;}
        .markdown-body code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; background: #374151; padding: 0.1rem 0.4rem; border-radius: 0.25rem; font-size: 0.9em;}
        .markdown-body pre code { background: none; padding: 0; font-size: 0.9em; color: #e5e7eb;}
        .markdown-body h3 { font-size: 1.25rem; font-weight: 700; margin-top: 1.5rem; margin-bottom: 0.75rem; color: #f3f4f6; border-bottom: 1px solid #374151; padding-bottom: 0.5rem;}
        .markdown-body h4 { font-size: 1.1rem; font-weight: 600; margin-top: 1rem; margin-bottom: 0.5rem; color: #e5e7eb; }
        .markdown-body strong { color: #60a5fa; font-weight: 600; }

        /* Typing animation */
        .typing-indicator {
            display: flex;
            align-items: center;
            padding: 0.5rem 0;
        }
        .typing-indicator span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #9ca3af;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col font-sans overflow-hidden selection:bg-blue-500 selection:text-white">

<!-- Header -->
<header class="bg-gray-800 border-b border-gray-700 py-4 px-6 flex items-center justify-between shadow-md shrink-0">
    <div class="flex items-center">
        <div class="bg-blue-600 p-2 rounded-lg mr-3">
            <i data-lucide="braces" class="text-white w-6 h-6"></i>
        </div>
        <div>
            <h1 class="text-xl font-bold text-white">RESTful API 네이밍 어시스턴트</h1>
            <p class="text-xs text-gray-400">비즈니스 모델과 기능을 알려주시면 완벽한 URI를 추천해드립니다.</p>
        </div>
    </div>
    <button id="reset-btn" class="text-gray-400 hover:text-white flex items-center gap-1.5 text-sm bg-gray-700 hover:bg-gray-600 px-3 py-2 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500" title="비즈니스 모델 초기화">
        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
        <span class="hidden sm:inline font-medium">초기화</span>
    </button>
</header>

<!-- Chat Container -->
<main id="chat-container" class="flex-1 overflow-y-auto p-4 sm:p-6 chat-scroll flex flex-col gap-4">
    <!-- Messages will be injected here -->
</main>

<!-- Input Area -->
<footer class="bg-gray-800 border-t border-gray-700 p-4 shrink-0 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
    <div class="max-w-4xl mx-auto relative">
        <form id="chat-form" class="flex items-end gap-2">
            <div class="relative flex-1">
                    <textarea
                            id="user-input"
                            rows="1"
                            class="w-full bg-gray-700 border border-gray-600 text-white rounded-xl py-3 pl-4 pr-12 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none overflow-hidden"
                            placeholder="메시지를 입력하세요..."
                            required
                    ></textarea>
            </div>
            <button
                    type="submit"
                    id="send-btn"
                    class="bg-blue-600 hover:bg-blue-500 text-white rounded-xl p-3 h-[48px] w-[48px] flex items-center justify-center transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-gray-900 disabled:opacity-50 disabled:cursor-not-allowed"
            >
                <i data-lucide="send" class="w-5 h-5 ml-1"></i>
            </button>
        </form>
        <div class="text-center mt-2">
            <span class="text-[10px] text-gray-500">Powered by Gemini</span>
        </div>
    </div>
</footer>

<script>
    // Initialize Icons
    lucide.createIcons();

    // --- Application State ---
    // step 1: Waiting for Business Model
    // step 2: Waiting for API Function
    // step 3: Processing (Generating Name)
    let currentStep = 1;
    let businessModel = "";
    let apiFunction = "";

    // Elements
    const chatContainer = document.getElementById('chat-container');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const resetBtn = document.getElementById('reset-btn');

    // --- Configuration ---
    const apiKey = ""; // Execution environment will provide the API key

    // --- Auto-resize textarea ---
    userInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight < 120 ? this.scrollHeight : 120) + 'px';
        if (this.value.trim() === '') {
            this.style.height = '48px'; // Reset to default single line height
        }
    });

    // Enter to submit (Shift+Enter for new line)
    userInput.addEventListener('keydown', function(e) {
        // 한글 입력(IME) 중 엔터키 입력 시 중복 제출 방지
        if (e.isComposing) return;

        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            chatForm.dispatchEvent(new Event('submit'));
        }
    });

    // --- Chat UI Functions ---
    function addMessage(text, sender, isMarkdown = false) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `flex w-full ${sender === 'user' ? 'justify-end' : 'justify-start'} animate-fade-in`;

        const bubbleDiv = document.createElement('div');

        if (sender === 'user') {
            bubbleDiv.className = 'bg-blue-600 text-white max-w-[85%] sm:max-w-[75%] rounded-2xl rounded-tr-sm px-5 py-3 shadow-sm whitespace-pre-wrap break-words';
            bubbleDiv.textContent = text;
        } else {
            bubbleDiv.className = 'bg-gray-800 text-gray-200 border border-gray-700 max-w-[95%] sm:max-w-[85%] rounded-2xl rounded-tl-sm px-5 py-4 shadow-sm break-words markdown-body';
            if (isMarkdown) {
                // Using marked.js to parse markdown text securely
                bubbleDiv.innerHTML = marked.parse(text);
            } else {
                bubbleDiv.textContent = text;
            }
        }

        // Avatar for bot
        if (sender === 'bot') {
            const avatarDiv = document.createElement('div');
            avatarDiv.className = 'bg-blue-900 border border-blue-700 rounded-full w-8 h-8 flex items-center justify-center mr-3 mt-1 shrink-0';
            avatarDiv.innerHTML = '<i data-lucide="bot" class="text-blue-300 w-5 h-5"></i>';

            const wrapperDiv = document.createElement('div');
            wrapperDiv.className = 'flex max-w-full';
            wrapperDiv.appendChild(avatarDiv);
            wrapperDiv.appendChild(bubbleDiv);
            messageDiv.appendChild(wrapperDiv);
        } else {
            messageDiv.appendChild(bubbleDiv);
        }

        chatContainer.appendChild(messageDiv);
        lucide.createIcons();
        scrollToBottom();
    }

    function showTypingIndicator() {
        const id = 'typing-' + Date.now();
        const messageDiv = document.createElement('div');
        messageDiv.id = id;
        messageDiv.className = `flex w-full justify-start animate-fade-in mb-2`;

        const wrapperDiv = document.createElement('div');
        wrapperDiv.className = 'flex';

        const avatarDiv = document.createElement('div');
        avatarDiv.className = 'bg-blue-900 border border-blue-700 rounded-full w-8 h-8 flex items-center justify-center mr-3 mt-1 shrink-0';
        avatarDiv.innerHTML = '<i data-lucide="bot" class="text-blue-300 w-5 h-5"></i>';

        const bubbleDiv = document.createElement('div');
        bubbleDiv.className = 'bg-gray-800 border border-gray-700 rounded-2xl rounded-tl-sm px-4 py-3 flex items-center';
        bubbleDiv.innerHTML = `
                <div class="typing-indicator">
                    <span></span><span></span><span></span>
                </div>
            `;

        wrapperDiv.appendChild(avatarDiv);
        wrapperDiv.appendChild(bubbleDiv);
        messageDiv.appendChild(wrapperDiv);
        chatContainer.appendChild(messageDiv);

        lucide.createIcons();
        scrollToBottom();
        return id;
    }

    function removeTypingIndicator(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
    }

    function scrollToBottom() {
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function setInputState(disabled) {
        userInput.disabled = disabled;
        sendBtn.disabled = disabled;
        if (disabled) {
            userInput.classList.add('opacity-50', 'cursor-not-allowed');
        } else {
            userInput.classList.remove('opacity-50', 'cursor-not-allowed');
            userInput.focus();
        }
    }

    // --- Initial Bot Greeting ---
    setTimeout(() => {
        addMessage("안녕하세요! RESTful API 설계를 도와주는 네이밍 전문가입니다. 🚀\n\n먼저, 개발 중이신 서비스의 **[ 1단계: 비즈니스 모델 ]** (예: 이커머스 쇼핑몰, 사내 HR 시스템, 블로그 등)을 입력해주세요.", "bot", true);
    }, 500);

    // --- Event Listener ---
    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = userInput.value.trim();
        if (!text) return;

        // Clear input and reset height
        userInput.value = '';
        userInput.style.height = '48px';

        // Show user message
        addMessage(text, 'user');

        if (currentStep === 1) {
            // Step 1 -> 2
            businessModel = text;
            currentStep = 2;
            setTimeout(() => {
                addMessage(`**비즈니스 모델**: [ ${businessModel} ] (으)로 확인되었습니다. 훌륭합니다!\n\n다음으로 이 API가 수행할 **[ 2단계: API의 구체적인 기능 ]** 을 알려주세요. \n(예: "특정 회원의 장바구니에 담긴 상품 목록을 조회한다", "새로운 상품 리뷰를 등록한다" 등)`, "bot", true);
            }, 600);
        }
        else if (currentStep === 2) {
            // Step 2 -> 3
            apiFunction = text;
            currentStep = 3;
            setInputState(true);

            const typingId = showTypingIndicator();

            try {
                const recommendation = await fetchGeminiRecommendation(businessModel, apiFunction);
                removeTypingIndicator(typingId);
                addMessage(recommendation, 'bot', true);

                // Reset to ask again (기능만 다시 입력 받도록 currentStep = 2 유지)
                setTimeout(() => {
                    addMessage(`현재 비즈니스 모델: **[ ${businessModel} ]**\n\n다른 API 기능에 대한 네이밍이 필요하신가요? **[ 2단계: API 기능 ]**을 계속해서 입력해주세요.\n(비즈니스 모델을 변경하시려면 우측 상단의 '초기화' 버튼을 눌러주세요)`, "bot", true);
                    currentStep = 2;
                    // businessModel은 유지
                    apiFunction = "";
                    setInputState(false);
                }, 1500);

            } catch (error) {
                removeTypingIndicator(typingId);
                console.error(error);
                addMessage("죄송합니다. AI 서버와 통신하는 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.\n(개발자 도구 콘솔에서 자세한 오류를 확인하실 수 있습니다.)", "bot", false);
                currentStep = 2; // Allow retry of step 2
                setInputState(false);
            }
        }
    });

    // 초기화 버튼 이벤트 리스너
    resetBtn.addEventListener('click', () => {
        if (currentStep === 3) return; // API 호출 중에는 초기화 방지

        currentStep = 1;
        businessModel = "";
        apiFunction = "";

        // 입력창 활성화 및 초기화 메시지 출력
        setInputState(false);
        userInput.value = '';
        userInput.style.height = '48px';

        addMessage("비즈니스 모델 설정이 초기화되었습니다. 🔄\n\n새로운 프로젝트의 **[ 1단계: 비즈니스 모델 ]** 을 입력해주세요.", "bot", true);
    });

    // --- Gemini API Logic ---
    async function fetchWithRetry(url, options, maxRetries = 5) {
        const delays = [1000, 2000, 4000, 8000, 16000];
        for (let i = 0; i < maxRetries; i++) {
            try {
                const response = await fetch(url, options);
                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(`HTTP ${response.status}: ${errData.error?.message || 'Unknown error'}`);
                }
                return await response.json();
            } catch (error) {
                console.warn(`Attempt ${i + 1} failed: ${error.message}`);
                if (i === maxRetries - 1) throw error;
                await new Promise(resolve => setTimeout(resolve, delays[i]));
            }
        }
    }

    async function fetchGeminiRecommendation(bm, func) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

        const systemPrompt = `
당신은 10년 차 시니어 백엔드 개발자이자 RESTful API 설계 전문가입니다.
사용자가 제공한 '비즈니스 모델'과 'API 기능'을 바탕으로, 가장 RESTful하고 모범적인 API 엔드포인트 이름(URI) 및 HTTP 메서드를 3~5개 추천해야 합니다.

응답 형식 (Markdown):
1. **HTTP Method** \`/api/path/...\` 형태의 코드 블록으로 강조.
2. 명사 복수형 사용, 동사 지양(컨트롤러/액션 제외), 계층적 구조 등 RESTful 원칙을 철저히 지킬 것.
3. Path Variable (예: \`{userId}\`) 과 필요한 경우 Query Parameter (예: \`?status=active\`)를 명확히 표현할 것.
4. 각 추천 항목 아래에 간략한 '추천 이유'를 1~2줄로 설명할 것.
5. 친절하고 전문적인 어투를 사용할 것.
            `;

        const userPrompt = `
비즈니스 모델 (Domain): ${bm}
API 기능 설명: ${func}

위 정보를 바탕으로 RESTful API 네이밍을 추천해주세요.
            `;

        const payload = {
            contents: [{ parts: [{ text: userPrompt }] }],
            systemInstruction: { parts: [{ text: systemPrompt }] }
        };

        const response = await fetchWithRetry(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const text = response.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!text) {
            throw new Error("Invalid response format from Gemini API");
        }
        return text;
    }

    // Helper CSS for fade-in animation
    document.head.insertAdjacentHTML('beforeend', `
            <style>
                .animate-fade-in {
                    animation: fadeIn 0.3s ease-in-out;
                }
                @keyframes fadeIn {
                    from { opacity: 0; transform: translateY(10px); }
                    to { opacity: 1; transform: translateY(0); }
                }
            </style>
        `);
</script>
</body>
</html>
