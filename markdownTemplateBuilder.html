<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 마크다운 템플릿 빌더</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            bord-render li { margin-bottom: 0.5rem; }
        .markdown-render code { font-family: 'Fira Code', monospace; background: #f1f5f9; padding: 0.2rem 0.4rem; border-radius: 6px; font-size: 0.9em; color: #e11d48; }
        .markdown-render pre { background: #1e293b; color: #f8fafc; padding: 1.5rem; border-radius: 12px; overflow-x: auto; margin-bottom: 1.5rem; font-family: 'Fira Code', monospace; font-size: 0.9rem; }
        .markdown-render blockquote { border-left: 4px solid var(--primary); padding-left: 1.25rem; color: #64748b; font-style: italic; margin-bottom: 1.5rem; }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }

        .btn-shine {
            position: relative;
            overflow: hidden;
        }
        .btn-shine::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            transition: 0.5s;
        }
        .btn-shine:hover::after {
            left: 100%;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-12">

<!-- Decoration Background -->
<div class="fixed top-0 left-0 w-full h-1/2 bg-gradient-to-b from-indigo-50 to-transparent -z-10"></div>
<div class="fixed -top-24 -left-24 w-96 h-96 bg-blue-100 rounded-full blur-3xl opacity-50 -z-10"></div>
<div class="fixed top-1/2 -right-24 w-80 h-80 bg-indigo-100 rounded-full blur-3xl opacity-40 -z-10"></div>

<div class="w-full max-w-4xl space-y-10">
    <!-- Header Section -->
    <header class="text-center space-y-3">
        <div class="inline-flex items-center gap-2 px-3 py-1 bg-indigo-100 text-indigo-600 rounded-full text-[10px] font-black uppercase tracking-widest mb-2">
            AI Template Engine
        </div>
        <h1 class="text-4xl md:text-5xl font-black text-slate-900 tracking-tight">문서의 시작을 <span class="text-indigo-600">스마트하게</span></h1>
        <p class="text-slate-500 font-medium">상황을 입력하면 AI가 최적의 마크다운 템플릿을 제안해 드립니다.</p>
    </header>

    <!-- Main Input Section -->
    <div class="glass-card p-2 md:p-3 rounded-[2.5rem] shadow-2xl shadow-indigo-100/50 flex flex-col md:flex-row items-center gap-2 border border-white">
        <input type="text" id="situationInput"
               placeholder="예: 오늘 배운 코틀린 문법 회고록 써줘, 깃허브 리드미 양식 짜줘..."
               class="flex-1 w-full px-8 py-5 bg-transparent text-lg font-medium outline-none placeholder:text-slate-300"
               onkeypress="if(event.keyCode==13) buildTemplate()">
        <button onclick="buildTemplate()" id="buildBtn" class="btn-shine w-full md:w-auto px-10 py-5 bg-slate-900 text-white font-black rounded-[2rem] hover:bg-black transition-all shadow-xl flex items-center justify-center gap-3 active:scale-95">
            <span id="btnText">템플릿 생성</span>
            <svg id="buildIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
            <div id="buildLoader" class="hidden w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
        </button>
    </div>

    <!-- Result Section -->
    <div id="resultArea" class="hidden space-y-6 animate-fade-in">
        <div class="flex justify-between items-center px-4">
            <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest">Suggested Template</h3>
            <button onclick="copyMarkdown()" class="flex items-center gap-2 text-xs font-bold text-indigo-600 hover:text-indigo-800 transition-colors bg-indigo-50 px-4 py-2 rounded-full">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                마크다운 복사
            </button>
        </div>

        <div class="bg-white rounded-[2rem] p-10 md:p-16 shadow-xl border border-slate-100 overflow-hidden relative">
            <div id="markdownContent" class="markdown-render">
                <!-- Markdown Rendered Here -->
            </div>
        </div>
    </div>

    <!-- Empty State / Footer -->
    <footer id="footer" class="text-center pt-10">
        <p class="text-[10px] font-bold text-slate-300 uppercase tracking-[0.2em]">Crafted with Intelligence & Minimalism</p>
    </footer>
</div>

<!-- Toast -->
<div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-8 py-4 rounded-2xl opacity-0 pointer-events-none transition-all duration-300 shadow-2xl z-50 transform translate-y-4 font-bold text-sm">
    복사되었습니다!
</div>

<script>
    const apiKey = "";
    let currentMarkdown = "";

    async function buildTemplate() {
        const situation = document.getElementById('situationInput').value.trim();
        if (!situation) return showToast("템플릿의 내용을 알려주세요.");

        const buildBtn = document.getElementById('buildBtn');
        const buildLoader = document.getElementById('buildLoader');
        const buildIcon = document.getElementById('buildIcon');
        const btnText = document.getElementById('btnText');
        const resultArea = document.getElementById('resultArea');

        // UI Feedback
        buildBtn.disabled = true;
        buildIcon.classList.add('hidden');
        buildLoader.classList.remove('hidden');
        btnText.innerText = "설계 중...";

        const systemPrompt = `당신은 세계 최고의 마크다운 템플릿 설계자입니다. 사용자의 상황에 딱 맞는 "작성 틀(Template)"을 제안하세요.
        사용자가 바로 내용을 채워 넣을 수 있도록 [이곳에 내용을 입력하세요]와 같은 가이드라인을 포함한 구조적인 마크다운을 작성하세요.
        응답은 마크다운 텍스트 그 자체여야 하며, 다른 부가 설명 없이 마크다운만 출력하세요.`;

        try {
            const response = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `템플릿 요청 상황: ${situation}` }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] }
                })
            });

            const result = await response.json();
            currentMarkdown = result.candidates[0].content.parts[0].text;

            // Render and Display
            document.getElementById('markdownContent').innerHTML = parseMarkdown(currentMarkdown);
            resultArea.classList.remove('hidden');

            // Scroll to result
            window.scrollTo({ top: resultArea.offsetTop - 50, behavior: 'smooth' });
            showToast("템플릿이 완성되었습니다.");

        } catch (err) {
            console.error(err);
            showToast("생성 중 오류가 발생했습니다.");
        } finally {
            buildBtn.disabled = false;
            buildIcon.classList.remove('hidden');
            buildLoader.classList.add('hidden');
            btnText.innerText = "템플릿 생성";
        }
    }

    async function fetchWithRetry(url, options, retries = 5, delay = 1000) {
        for (let i = 0; i < retries; i++) {
            try {
                const res = await fetch(url, options);
                if (res.ok) return res;
            } catch (e) {}
            await new Promise(r => setTimeout(r, delay * Math.pow(2, i)));
        }
        throw new Error('API Request Failed');
    }

    // Minimalist Markdown Parser
    function parseMarkdown(md) {
        if (!md) return "";
        let html = md
            .replace(/^# (.*$)/gm, '<h1>$1</h1>')
            .replace(/^## (.*$)/gm, '<h2>$1</h2>')
            .replace(/^### (.*$)/gm, '<h3>$1</h3>')
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/^\> (.*$)/gm, '<blockquote>$1</blockquote>')
            .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
            .replace(/`(.*?)`/g, '<code>$1</code>')
            .replace(/^[*-] (.*$)/gm, '<li>$1</li>')
            .replace(/\n\n/g, '</p><p>')
            .replace(/\n/g, '<br>');

        html = html.replace(/(<li>.*<\/li>)/gms, (match) => `<ul class="list-disc ml-6">${match}</ul>`);
        return `<div class="md-body animate-fade-in"><p>${html}</p></div>`;
    }

    function copyMarkdown() {
        if (!currentMarkdown) return;
        const textarea = document.createElement('textarea');
        textarea.value = currentMarkdown;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast("클립보드에 복사되었습니다!");
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.classList.remove('opacity-0', 'translate-y-4');
        toast.classList.add('opacity-100', 'translate-y-0');
        setTimeout(() => {
            toast.classList.add('opacity-0', 'translate-y-4');
            toast.classList.remove('opacity-100', 'translate-y-0');
        }, 3000);
    }
</script>
</body>
</html>
