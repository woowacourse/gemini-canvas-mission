<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe: Advanced Bomb Edition</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #1a1a1a;
            --accent-color: #4f46e5;
            --x-color: #ef4444;
            --o-color: #3b82f6;
            --border-color: #e5e7eb;
            --hover-color: #f9fafb;
            --warning-color: #f59e0b;
            --bomb-color: #1f2937;
            --disabled-color: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            width: 100%;
            max-width: 500px;
        }

        h1 {
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent-color);
        }

        .rules {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .settings-container {
            margin-bottom: 1rem;
            background: var(--hover-color);
            padding: 12px;
            border-radius: 16px;
        }

        .settings-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #4b5563;
        }

        .bomb-button-group {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .bomb-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 2px solid var(--border-color);
            background: white;
            color: var(--text-color);
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bomb-btn:hover:not(:disabled) {
            border-color: var(--accent-color);
            background: var(--hover-color);
        }

        .bomb-btn.active {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .bomb-btn:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .stats-container {
            display: flex;
            justify-content: space-around;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            background: var(--hover-color);
            padding: 8px;
            border-radius: 12px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .stat-label { font-weight: 600; }
        .stat-value { font-weight: 800; font-size: 1rem; }
        .x-stat { color: var(--x-color); }
        .o-stat { color: var(--o-color); }

        .status {
            margin-bottom: 1rem;
            font-size: 1rem;
            font-weight: 600;
            min-height: 1.5rem;
            transition: color 0.3s;
        }

        .turn-indicator {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            background: var(--border-color);
            margin-bottom: 1rem;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 1.5rem;
        }

        .cell {
            aspect-ratio: 1 / 1;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .cell:hover {
            background: var(--hover-color);
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .cell.mine { cursor: not-allowed; transform: none; }
        .cell.opponent-occupied { border-style: dashed; border-color: var(--warning-color); }
        .cell.x { color: var(--x-color); }
        .cell.o { color: var(--o-color); }

        .cell.winner {
            background: var(--accent-color) !important;
            color: white !important;
            border-color: var(--accent-color) !important;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button.main-btn {
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--accent-color);
            color: white;
        }

        button.main-btn:hover { opacity: 0.9; transform: scale(1.02); }

        .shake { animation: shake 0.4s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .bomb-explode {
            animation: explode 0.6s ease-out forwards;
            z-index: 10;
        }

        @keyframes explode {
            0% { transform: scale(1); background: var(--bomb-color); color: white; }
            50% { transform: scale(1.2); background: #ef4444; border-radius: 50%; }
            100% { transform: scale(1); background: transparent; }
        }

        .cell span {
            display: inline-block;
            animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .locked-notice {
            font-size: 0.75rem;
            color: var(--disabled-color);
            margin-top: 4px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Tic Tac Toe 5x5</h1>
    <p class="rules">
        4개 연결 시 승리! | 인당 뺏기 3회 (3턴부터)<br>
        <b>보드가 꽉 차면 무제한 뺏기 가능! 뺏어서 즉시 승리 가능!</b>
    </p>

    <div class="settings-container">
        <span class="settings-label">💣 폭탄 개수 설정</span>
        <div class="bomb-button-group" id="bombBtnGroup">
            <button class="bomb-btn active" data-count="2">2</button>
            <button class="bomb-btn" data-count="3">3</button>
            <button class="bomb-btn" data-count="4">4</button>
            <button class="bomb-btn" data-count="5">5</button>
        </div>
        <p id="lockNotice" class="locked-notice">게임 진행 중에는 설정을 변경할 수 없습니다.</p>
    </div>
    
    <div class="stats-container">
        <div class="stat-item x-stat">
            <span class="stat-label">X 뺏기 기회</span>
            <span class="stat-value" id="xOverwrites">3</span>
        </div>
        <div class="stat-item o-stat">
            <span class="stat-label">O 뺏기 기회</span>
            <span class="stat-value" id="oOverwrites">3</span>
        </div>
    </div>

    <div class="turn-indicator" id="turnIndicator">
        차례: <span id="currentPlayer">X</span>
    </div>

    <div class="status" id="status">게임을 시작하세요!</div>

    <div class="board" id="board">
        <!-- Cells generated by JS -->
    </div>

    <div class="controls">
        <button id="resetBtn" class="main-btn">새 게임 / 초기화</button>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const boardElement = document.getElementById('board');
        const statusElement = document.getElementById('status');
        const currentPlayerElement = document.getElementById('currentPlayer');
        const resetBtn = document.getElementById('resetBtn');
        const xOverwriteElement = document.getElementById('xOverwrites');
        const oOverwriteElement = document.getElementById('oOverwrites');
        const bombBtns = document.querySelectorAll('.bomb-btn');
        const lockNotice = document.getElementById('lockNotice');

        const SIZE = 5;
        const WIN_COUNT = 4;
        let cells = [];
        let currentPlayer = 'X';
        let gameState = Array(SIZE * SIZE).fill("");
        let bombs = new Set();
        let gameActive = true;
        let isGameStarted = false; // 첫 수를 두었는지 체크
        let playerTurns = { 'X': 0, 'O': 0 }; 
        let overwritesRemaining = { 'X': 3, 'O': 3 };
        let selectedBombCount = 2;

        // 승리 조건 생성
        const winningConditions = [];
        for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c <= SIZE - WIN_COUNT; c++) {
                winningConditions.push([r*5+c, r*5+c+1, r*5+c+2, r*5+c+3]);
            }
        }
        for (let c = 0; c < SIZE; c++) {
            for (let r = 0; r <= SIZE - WIN_COUNT; r++) {
                winningConditions.push([r*5+c, (r+1)*5+c, (r+2)*5+c, (r+3)*5+c]);
            }
        }
        for (let r = 0; r <= SIZE - WIN_COUNT; r++) {
            for (let c = 0; c <= SIZE - WIN_COUNT; c++) {
                winningConditions.push([r*5+c, (r+1)*5+c+1, (r+2)*5+c+2, (r+3)*5+c+3]);
            }
        }
        for (let r = 0; r <= SIZE - WIN_COUNT; r++) {
            for (let c = WIN_COUNT - 1; c < SIZE; c++) {
                winningConditions.push([r*5+c, (r+1)*5+c-1, (r+2)*5+c-2, (r+3)*5+c-3]);
            }
        }

        // 폭탄 버튼 이벤트
        bombBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (isGameStarted) return;
                
                bombBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedBombCount = parseInt(btn.getAttribute('data-count'));
                
                // 버튼 누를 때마다 폭탄 재배치 (게임 시작 전이니까)
                generateBombs();
            });
        });

        function generateBombs() {
            bombs.clear();
            while(bombs.size < selectedBombCount) {
                bombs.add(Math.floor(Math.random() * (SIZE * SIZE)));
            }
        }

        function initGame() {
            boardElement.innerHTML = '';
            cells = [];
            for (let i = 0; i < SIZE * SIZE; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.setAttribute('data-index', i);
                cell.addEventListener('click', handleCellClick);
                boardElement.appendChild(cell);
                cells.push(cell);
            }
            
            isGameStarted = false;
            toggleBombSettings(true);
            generateBombs();
            resetGameState();
        }

        function toggleBombSettings(enabled) {
            bombBtns.forEach(btn => btn.disabled = !enabled);
            lockNotice.style.display = enabled ? 'none' : 'block';
        }

        function handleCellClick(e) {
            const clickedCell = e.target.closest('.cell');
            const index = parseInt(clickedCell.getAttribute('data-index'));
            const cellValue = gameState[index];
            const isBoardFull = !gameState.includes("");

            if (!gameActive) return;
            if (cellValue === currentPlayer) return;

            // 게임 시작 처리 (첫 클릭 시)
            if (!isGameStarted) {
                isGameStarted = true;
                toggleBombSettings(false);
            }

            // 상대방 칸 뺏기 로직
            if (cellValue !== "" && cellValue !== currentPlayer) {
                if (playerTurns[currentPlayer] < 2) {
                    showMessage("뺏기는 3번째 턴부터 가능합니다!", "var(--warning-color)");
                    triggerShake(clickedCell);
                    return;
                }

                if (!isBoardFull && overwritesRemaining[currentPlayer] <= 0) {
                    showMessage("뺏기 기회 소진! (꽉 차면 무제한)", "var(--x-color)");
                    triggerShake(clickedCell);
                    return;
                }

                if (!isBoardFull) {
                    overwritesRemaining[currentPlayer]--;
                    updateStats();
                }
            }

            // 폭탄 체크
            if (bombs.has(index)) {
                handleBombExplosion(clickedCell, index);
                return;
            }

            makeMove(clickedCell, index);
        }

        function handleBombExplosion(cell, index) {
            cell.innerHTML = '<span>💣</span>';
            cell.classList.add('bomb-explode');
            showMessage("콰쾅! 폭탄이 터졌습니다.", "var(--bomb-color)");
            
            bombs.delete(index);
            gameState[index] = "";
            playerTurns[currentPlayer]++; 

            setTimeout(() => {
                cell.innerHTML = '';
                cell.classList.remove('bomb-explode');
                updateBoardClasses();
                changePlayer();
            }, 600);
        }

        function makeMove(cell, index) {
            gameState[index] = currentPlayer;
            playerTurns[currentPlayer]++;
            cell.innerHTML = `<span>${currentPlayer}</span>`;
            updateBoardClasses();
            checkResult();
        }

        function updateBoardClasses() {
            cells.forEach((cell, idx) => {
                const val = gameState[idx];
                cell.classList.remove('x', 'o', 'occupied', 'mine', 'opponent-occupied');
                if (val !== "") {
                    cell.classList.add(val.toLowerCase(), 'occupied');
                    if (val === currentPlayer) cell.classList.add('mine');
                    else cell.classList.add('opponent-occupied');
                }
            });
        }

        function checkResult() {
            let roundWon = false;
            let winningLine = null;

            for (let condition of winningConditions) {
                if (gameState[condition[0]] !== "" && 
                    condition.every(idx => gameState[idx] === gameState[condition[0]])) {
                    roundWon = true;
                    winningLine = condition;
                    break;
                }
            }

            if (roundWon) {
                showMessage(`승리! ${currentPlayer} 플레이어!`, "var(--accent-color)");
                gameActive = false;
                winningLine.forEach(idx => cells[idx].classList.add('winner'));
                return;
            }

            changePlayer();
        }

        function changePlayer() {
            currentPlayer = currentPlayer === "X" ? "O" : "X";
            currentPlayerElement.innerText = currentPlayer;
            currentPlayerElement.style.color = currentPlayer === "X" ? "var(--x-color)" : "var(--o-color)";
            
            const isBoardFull = !gameState.includes("");
            const canOverwrite = playerTurns[currentPlayer] >= 2;
            
            let statusMsg = `${currentPlayer}의 차례`;
            if (isBoardFull) {
                statusMsg += " (무제한 뺏기 활성화!)";
            } else if (canOverwrite && overwritesRemaining[currentPlayer] > 0) {
                statusMsg += ` (뺏기: ${overwritesRemaining[currentPlayer]}회)`;
            }
            
            statusElement.innerText = statusMsg;
            statusElement.style.color = isBoardFull ? "var(--accent-color)" : "var(--text-color)";
            
            updateBoardClasses();
        }

        function updateStats() {
            const isBoardFull = !gameState.includes("");
            xOverwriteElement.innerText = isBoardFull ? "∞" : overwritesRemaining['X'];
            oOverwriteElement.innerText = isBoardFull ? "∞" : overwritesRemaining['O'];
        }

        function showMessage(msg, color) {
            statusElement.innerText = msg;
            statusElement.style.color = color;
        }

        function triggerShake(element) {
            element.classList.add('shake');
            setTimeout(() => element.classList.remove('shake'), 400);
        }

        function resetGameState() {
            gameActive = true;
            currentPlayer = "X";
            gameState = Array(SIZE * SIZE).fill("");
            playerTurns = { 'X': 0, 'O': 0 };
            overwritesRemaining = { 'X': 3, 'O': 3 };
            updateStats();
            showMessage("게임을 시작하세요!", "var(--text-color)");
            currentPlayerElement.innerText = "X";
            currentPlayerElement.style.color = "var(--x-color)";
            updateBoardClasses();
        }

        initGame();
        resetBtn.addEventListener('click', initGame);
    });
</script>

</body>
</html>
