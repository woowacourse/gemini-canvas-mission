<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 모의 주식 거래소 - Ultimate Edition</title>
    <style>
        :root {
            --bg-color: #020617;
            --card-bg: #1e293b;
            --accent-cyan: #22d3ee;
            --accent-up: #ef4444;
            --accent-down: #3b82f6;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border-glow: 0 0 15px rgba(34, 211, 238, 0.2);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: var(--border-glow);
        }

        .info-group { text-align: center; }
        .info-label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 4px; letter-spacing: 0.5px; }
        .info-value { font-size: 1.6rem; font-weight: 800; color: var(--accent-cyan); font-variant-numeric: tabular-nums; }
        .info-value.cash { color: var(--accent-green); }
        .info-value.total { color: #facc15; }

        .header-controls { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
        .api-status {
            font-size: 0.7rem; color: var(--accent-green);
            background: rgba(16, 185, 129, 0.1);
            padding: 4px 12px; border-radius: 20px; border: 1px solid var(--accent-green); font-weight: bold;
        }
        .header-restart-btn {
            background: rgba(244, 63, 94, 0.1); color: #f87171;
            border: 1px solid rgba(244, 63, 94, 0.4);
            padding: 4px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; cursor: pointer; transition: all 0.2s;
        }
        .header-restart-btn:hover { background: #ef4444; color: white; border-color: #ef4444; }

        main { flex: 1; display: flex; flex-direction: column; gap: 20px; }

        .news-section {
            background: #0f172a; border: 2px solid #1e293b; border-radius: 20px;
            padding: 40px; text-align: center; position: relative; min-height: 320px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
        }

        .news-title { font-size: 0.9rem; color: #f43f5e; font-weight: bold; letter-spacing: 4px; margin-bottom: 20px; text-transform: uppercase; }
        #news-board { font-size: 1.75rem; font-weight: 700; line-height: 1.5; color: #fff; min-height: 3em; max-width: 850px; word-break: keep-all; }
        .cursor { display: inline-block; width: 10px; height: 1.5rem; background: var(--accent-cyan); margin-left: 5px; animation: blink 1s infinite; vertical-align: middle; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .next-btn {
            margin-top: 30px; background: var(--accent-cyan); color: #020617; border: none;
            padding: 14px 45px; font-size: 1.1rem; font-weight: 800; border-radius: 10px; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .next-btn:hover:not(:disabled) { transform: scale(1.05); box-shadow: 0 0 25px rgba(34, 211, 238, 0.4); }
        .next-btn:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }

        .stock-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .stock-card {
            background: var(--card-bg); border: 1px solid #334155; border-radius: 16px;
            padding: 24px; transition: all 0.3s ease; position: relative; overflow: hidden;
        }

        /* Sparkline Chart Style */
        .chart-container { width: 100%; height: 60px; margin-bottom: 15px; background: rgba(0,0,0,0.2); border-radius: 8px; padding: 5px; }
        .sparkline { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: all 0.5s ease; }
        .sparkline-up { stroke: var(--accent-up); }
        .sparkline-down { stroke: var(--accent-down); }

        @keyframes blink-up {
            0% { background-color: var(--card-bg); }
            50% { background-color: rgba(239, 68, 68, 0.3); border-color: var(--accent-up); }
            100% { background-color: var(--card-bg); }
        }
        @keyframes blink-down {
            0% { background-color: var(--card-bg); }
            50% { background-color: rgba(59, 130, 246, 0.3); border-color: var(--accent-down); }
            100% { background-color: var(--card-bg); }
        }
        .animate-up { animation: blink-up 0.6s ease-out; }
        .animate-down { animation: blink-down 0.6s ease-out; }

        .stock-name { font-size: 1.25rem; font-weight: 700; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .stock-name::before { content: ""; width: 4px; height: 16px; background: var(--accent-cyan); border-radius: 2px; }

        .stat-row { display: flex; justify-content: space-between; margin-bottom: 12px; }
        .stat-label { color: var(--text-dim); font-size: 0.85rem; }
        .stat-val { font-weight: 700; font-size: 1.1rem; }
        .impact-badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; font-weight: 800; }
        .impact-plus { background: rgba(239, 68, 68, 0.15); color: #f87171; }
        .impact-minus { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }

        .quantity-control {
            margin-top: 15px; background: rgba(15, 23, 42, 0.5);
            padding: 12px; border-radius: 10px; display: flex; flex-direction: column; gap: 8px;
        }
        .qty-label { font-size: 0.75rem; color: var(--text-dim); font-weight: 600; }
        .qty-input {
            width: 100%; background: #0f172a; border: 1px solid #334155; color: var(--accent-cyan);
            padding: 8px; border-radius: 6px; text-align: center; font-weight: 700; outline: none;
        }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .trade-btn { padding: 12px; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .btn-buy { background: var(--accent-up); color: white; }
        .btn-sell { background: var(--accent-down); color: white; }
        .trade-btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; z-index: 2000;
        }
        .modal-content {
            background: #1e293b; border: 2px solid var(--accent-cyan); border-radius: 24px;
            padding: 40px; width: 95%; max-width: 550px; text-align: center;
            box-shadow: 0 0 50px rgba(34, 211, 238, 0.3); animation: zoomIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes zoomIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .modal-title { font-size: 2rem; font-weight: 900; margin-bottom: 15px; color: #fff; }

        /* Achievement Emblems */
        .achievement-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 25px; }
        .emblem {
            background: rgba(34, 211, 238, 0.1); border: 1px solid var(--accent-cyan); border-radius: 12px;
            padding: 10px; width: 100px; display: flex; flex-direction: column; align-items: center; gap: 5px;
        }
        .emblem-icon { font-size: 1.5rem; }
        .emblem-name { font-size: 0.65rem; font-weight: 700; color: var(--accent-cyan); }

        .result-stats {
            background: rgba(15, 23, 42, 0.5); border-radius: 16px;
            padding: 20px; margin-bottom: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
        }
        .res-label { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 5px; }
        .res-value { font-size: 1.4rem; font-weight: 800; }
        .pos { color: var(--accent-up); }
        .neg { color: var(--accent-down); }

        #toast {
            position: fixed; top: 40px; left: 50%; transform: translateX(-50%);
            padding: 12px 24px; border-radius: 10px; background: #1e293b; color: white;
            font-weight: 600; display: none; z-index: 3000; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1); animation: slideDown 0.3s ease-out;
        }
        @keyframes slideDown { from { top: -20px; opacity: 0; } to { top: 40px; opacity: 1; } }

        @media (max-width: 768px) { .stock-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<header>
    <div class="info-group">
        <div class="info-label">Current Turn</div>
        <div id="display-turn" class="info-value">Day 1/10</div>
    </div>
    <div class="info-group">
        <div class="info-label">Available Cash</div>
        <div id="display-cash" class="info-value cash">$10,000</div>
    </div>
    <div class="info-group">
        <div class="info-label">Total Assets</div>
        <div id="display-total" class="info-value total">$10,000</div>
    </div>
    <div class="header-controls">
        <div class="api-status">AI ACTIVE</div>
        <button class="header-restart-btn" onclick="openRestartModal()">게임 재시작</button>
    </div>
</header>

<main>
    <section class="news-section">
        <div class="news-title">MARKET BREAKING NEWS</div>
        <div id="news-board">시작하려면 아래 버튼을 누르세요. 시장을 분석하여 AI 뉴스를 생성합니다.</div>
        <button id="next-btn" class="next-btn" onclick="handleTurn()">
            <span>게임 시작</span>
        </button>
    </section>

    <section id="stock-container" class="stock-grid">
        <!-- Cards -->
    </section>
</main>

<!-- Result Modal with Achievement System -->
<div id="modal-overlay" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-title">투자 리포트</div>
        <div id="achievement-board" class="achievement-container">
            <!-- Emblems injected here -->
        </div>
        <div id="result-rank" style="color: var(--accent-cyan); font-weight: 800; font-size: 1.5rem; margin-bottom: 25px;">투자 전문가</div>
        <div class="result-stats">
            <div>
                <div class="res-label">최종 자산</div>
                <div id="res-total" class="res-value">$0</div>
            </div>
            <div>
                <div class="res-label">총 수익률</div>
                <div id="res-roi" class="res-value">0%</div>
            </div>
        </div>
        <button class="modal-btn btn-confirm" style="width: 100%; padding: 15px; border-radius: 12px; font-weight: 800; background: var(--accent-cyan); color: #020617; border:none; cursor:pointer;" onclick="restartGame()">새 게임 시작하기</button>
    </div>
</div>

<!-- Restart Confirmation -->
<div id="restart-modal" class="modal-overlay">
    <div class="modal-content" style="max-width: 400px;">
        <div class="modal-title" style="font-size: 1.5rem;">재시작 확인</div>
        <p class="modal-desc">정말로 게임을 다시 시작하시겠습니까?<br>데이터가 모두 초기화됩니다.</p>
        <div class="modal-btn-group" style="display:flex; gap:10px;">
            <button class="modal-btn btn-confirm" style="flex:1; padding:12px; border-radius:8px; border:none; cursor:pointer; background:var(--accent-up); color:white;" onclick="restartGame()">재시작</button>
            <button class="modal-btn btn-cancel" style="flex:1; padding:12px; border-radius:8px; border:none; cursor:pointer; background:#475569; color:white;" onclick="closeRestartModal()">취소</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
    // Sound Engine using Web Audio API
    const AudioEngine = {
        ctx: null,
        init() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
        playNote(freq, type, duration, vol) {
            this.init();
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gain.gain.setValueAtTime(vol, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
        },
        playTrade() { this.playNote(800, 'sine', 0.1, 0.1); },
        playSell() { this.playNote(600, 'sine', 0.15, 0.1); },
        playNews() {
            this.playNote(440, 'triangle', 0.3, 0.1);
            setTimeout(() => this.playNote(660, 'triangle', 0.3, 0.1), 100);
        },
        playError() { this.playNote(150, 'sawtooth', 0.3, 0.1); }
    };

    const apiKey = "";
    const INITIAL_CASH = 10000;

    let gameState = {
        turn: 0,
        maxTurn: 10,
        cash: INITIAL_CASH,
        isProcessing: false,
        stocks: [
            { id: 0, name: '광통신 인프라', sector: '광통신', price: 100, owned: 0, lastImpact: 0, prevPrice: 100, tempQty: 1, history: [100] },
            { id: 1, name: 'AI 반도체', sector: 'AI', price: 100, owned: 0, lastImpact: 0, prevPrice: 100, tempQty: 1, history: [100] },
            { id: 2, name: '우주 항공', sector: '우주', price: 100, owned: 0, lastImpact: 0, prevPrice: 100, tempQty: 1, history: [100] }
        ]
    };

    function init() {
        renderStocks();
        updateDisplay();
    }

    // SVG Sparkline Generator
    function generateSparkline(history) {
        const width = 200;
        const height = 50;
        const min = Math.min(...history) * 0.9;
        const max = Math.max(...history) * 1.1;
        const range = max - min;

        const points = history.map((val, i) => {
            const x = (i / (gameState.maxTurn)) * width;
            const y = height - ((val - min) / range) * height;
            return `${x},${y}`;
        }).join(' ');

        const isUp = history[history.length - 1] >= history[0];
        const colorClass = isUp ? 'sparkline-up' : 'sparkline-down';

        return `<svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" style="width:100%; height:100%;">
                        <polyline class="sparkline ${colorClass}" points="${points}" />
                    </svg>`;
    }

    function renderStocks() {
        const container = document.getElementById('stock-container');
        container.innerHTML = '';

        gameState.stocks.forEach((stock, idx) => {
            const impactClass = stock.lastImpact >= 0 ? 'impact-plus' : 'impact-minus';
            const impactSign = stock.lastImpact >= 0 ? '+' : '';

            const card = document.createElement('div');
            card.id = `stock-card-${idx}`;
            card.className = `stock-card`;
            card.innerHTML = `
                    <div class="chart-container">${generateSparkline(stock.history)}</div>
                    <div class="stock-name">${stock.name}</div>
                    <div class="stock-stats">
                        <div class="stat-row">
                            <span class="stat-label">현재 주가</span>
                            <span class="stat-val">$${stock.price.toLocaleString()}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">섹터 영향</span>
                            <span class="impact-badge ${impactClass}">${impactSign}${stock.lastImpact}%</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">보유 수량</span>
                            <span class="stat-val">${stock.owned}주</span>
                        </div>
                    </div>

                    <div class="quantity-control">
                        <div class="qty-label">매매 수량 설정</div>
                        <input type="number" id="qty-input-${idx}" class="qty-input"
                               value="${stock.tempQty}" min="1"
                               oninput="updateTempQty(${idx}, this.value)">
                    </div>

                    <div class="btn-group">
                        <button class="trade-btn btn-buy" onclick="trade(${idx}, 'buy')"
                                ${gameState.turn === 0 || gameState.turn > gameState.maxTurn ? 'disabled' : ''}>매수</button>
                        <button class="trade-btn btn-sell" onclick="trade(${idx}, 'sell')"
                                ${gameState.turn === 0 || gameState.turn > gameState.maxTurn ? 'disabled' : ''}>매도</button>
                    </div>
                `;
            container.appendChild(card);
        });
    }

    function updateTempQty(idx, val) {
        const num = Math.floor(parseInt(val));
        gameState.stocks[idx].tempQty = isNaN(num) || num < 1 ? 1 : num;
    }

    function updateDisplay() {
        document.getElementById('display-turn').textContent = `Day ${gameState.turn}/${gameState.maxTurn}`;
        document.getElementById('display-cash').textContent = `$${Math.floor(gameState.cash).toLocaleString()}`;

        const stockValue = gameState.stocks.reduce((acc, s) => acc + (s.price * s.owned), 0);
        const total = gameState.cash + stockValue;
        document.getElementById('display-total').textContent = `$${Math.floor(total).toLocaleString()}`;
    }

    let typewriterTimeout;
    function typeWriter(text, i = 0) {
        const board = document.getElementById('news-board');
        if (i === 0) {
            board.innerHTML = '';
            clearTimeout(typewriterTimeout);
        }

        if (i < text.length) {
            board.innerHTML = text.substring(0, i + 1) + '<span class="cursor"></span>';
            typewriterTimeout = setTimeout(() => typeWriter(text, i + 1), 25);
        } else {
            board.innerHTML = text;
        }
    }

    async function getAINews() {
        const systemPrompt = `너는 주식 게임의 게임 마스터야. 주식 시장에 파급력을 미칠 가상의 속보를 1개 생성해. [광통신 인프라], [AI 반도체], [우주 항공] 3개 섹터의 주가 영향(-30 ~ +30 정수)을 평가해. 반드시 아래 JSON 형식으로만 응답해.`;
        const modelName = "gemini-2.5-flash-preview-09-2025";
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;

        const payload = {
            contents: [{ parts: [{ text: "Day " + (gameState.turn + 1) + " 시장 뉴스를 생성해줘." }] }],
            systemInstruction: { parts: [{ text: systemPrompt }] },
            generationConfig: {
                responseMimeType: "application/json",
                responseSchema: {
                    type: "OBJECT",
                    properties: {
                        news_headline: { type: "STRING" },
                        impact: {
                            type: "OBJECT",
                            properties: {
                                "광통신": { type: "NUMBER" },
                                "AI": { type: "NUMBER" },
                                "우주": { type: "NUMBER" }
                            }
                        }
                    },
                    required: ["news_headline", "impact"]
                }
            }
        };

        let retries = 5;
        let delay = 1000;

        for (let i = 0; i < retries; i++) {
            try {
                const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (!response.ok) throw new Error("HTTP " + response.status);
                const result = await response.json();
                return JSON.parse(result.candidates[0].content.parts[0].text);
            } catch (e) {
                if (i === retries - 1) throw e;
                await new Promise(r => setTimeout(r, delay));
                delay *= 2;
            }
        }
    }

    async function handleTurn() {
        if (gameState.turn >= gameState.maxTurn) return;

        gameState.isProcessing = true;
        const btn = document.getElementById('next-btn');
        btn.disabled = true;
        btn.querySelector('span').textContent = "시장 분석 중...";

        try {
            const data = await getAINews();
            AudioEngine.playNews();
            gameState.turn++;

            gameState.stocks.forEach(stock => {
                stock.prevPrice = stock.price;
                const impact = data.impact[stock.sector] || 0;
                stock.lastImpact = impact;
                stock.price = Math.max(1, Math.round(stock.price * (1 + (impact / 100))));
                stock.history.push(stock.price); // Update Price History
            });

            typeWriter(data.news_headline);
            renderStocks();
            updateDisplay();

            // Trigger Trend Animations
            gameState.stocks.forEach((stock, idx) => {
                const card = document.getElementById(`stock-card-${idx}`);
                if (card) {
                    if (stock.price > stock.prevPrice) {
                        card.classList.add('animate-up');
                        setTimeout(() => card.classList.remove('animate-up'), 600);
                    } else if (stock.price < stock.prevPrice) {
                        card.classList.add('animate-down');
                        setTimeout(() => card.classList.remove('animate-down'), 600);
                    }
                }
            });

            if (gameState.turn === gameState.maxTurn) {
                btn.querySelector('span').textContent = "결과 확인";
                btn.disabled = false;
                btn.onclick = showResults;
            } else {
                btn.querySelector('span').textContent = "다음 턴으로 가기";
                btn.disabled = false;
            }

        } catch (err) {
            AudioEngine.playError();
            console.error(err);
            showToast("AI 통신 오류. 다시 시도해 주세요.", "error");
            btn.disabled = false;
            btn.querySelector('span').textContent = "다시 시도";
        } finally {
            gameState.isProcessing = false;
        }
    }

    function trade(idx, action) {
        const stock = gameState.stocks[idx];
        const amount = stock.tempQty;
        const cost = stock.price * amount;
        const card = document.getElementById(`stock-card-${idx}`);

        if (action === 'buy') {
            if (gameState.cash >= cost) {
                gameState.cash -= cost;
                stock.owned += amount;
                AudioEngine.playTrade();
                showToast(`${stock.name} ${amount}주 매수 완료.`, "buy");
                if (card) {
                    card.classList.add('animate-up');
                    setTimeout(() => card.classList.remove('animate-up'), 600);
                }
            } else {
                AudioEngine.playError();
                showToast("매수 잔액이 부족합니다!", "error");
            }
        } else if (action === 'sell') {
            if (stock.owned >= amount) {
                gameState.cash += cost;
                stock.owned -= amount;
                AudioEngine.playSell();
                showToast(`${stock.name} ${amount}주 매도 완료.`, "sell");
                if (card) {
                    card.classList.add('animate-down');
                    setTimeout(() => card.classList.remove('animate-down'), 600);
                }
            } else {
                AudioEngine.playError();
                showToast("보유 수량이 부족합니다!", "error");
            }
        }
        updateDisplay();
        renderStocks();
    }

    // Achievement Logic
    function getAchievements(roi, total, stocks) {
        const list = [];
        if (roi > 100) list.push({ icon: '👑', name: '자본주의 괴물' });
        else if (roi > 50) list.push({ icon: '📈', name: '슈퍼 개미' });
        else if (roi > 0) list.push({ icon: '🌱', name: '성공적 입문' });
        else list.push({ icon: '💀', name: '파산 아티스트' });

        if (total > 30000) list.push({ icon: '💎', name: '다이아몬드 핸즈' });

        const maxOwned = Math.max(...stocks.map(s => s.owned));
        if (maxOwned > 100) list.push({ icon: '🐋', name: '시장의 고래' });

        const diversified = stocks.every(s => s.owned > 0);
        if (diversified) list.push({ icon: '⚖️', name: '리스크 관리자' });

        return list;
    }

    function showResults() {
        const stockValue = gameState.stocks.reduce((acc, s) => acc + (s.price * s.owned), 0);
        const total = gameState.cash + stockValue;
        const roi = ((total - INITIAL_CASH) / INITIAL_CASH) * 100;

        document.getElementById('res-total').textContent = `$${Math.floor(total).toLocaleString()}`;
        const roiEl = document.getElementById('res-roi');
        roiEl.textContent = `${roi >= 0 ? '+' : ''}${roi.toFixed(1)}%`;
        roiEl.className = `res-value ${roi >= 0 ? 'pos' : 'neg'}`;

        // Render Achievements
        const achBoard = document.getElementById('achievement-board');
        achBoard.innerHTML = '';
        const achievements = getAchievements(roi, total, gameState.stocks);
        achievements.forEach(ach => {
            achBoard.innerHTML += `
                    <div class="emblem">
                        <div class="emblem-icon">${ach.icon}</div>
                        <div class="emblem-name">${ach.name}</div>
                    </div>
                `;
        });

        const rankEl = document.getElementById('result-rank');
        if (roi > 70) rankEl.textContent = "🏆 투자의 신 (워렌 버핏 빙의)";
        else if (roi > 20) rankEl.textContent = "📈 전문 투자자 (시장 수익률 상회)";
        else if (roi >= 0) rankEl.textContent = "📉 평범한 개미 (본전 사수)";
        else rankEl.textContent = "💸 투자 주의군 (한강 물 체크 금지)";

        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function openRestartModal() {
        if (gameState.turn === 0 || gameState.turn === gameState.maxTurn) {
            restartGame();
        } else {
            document.getElementById('restart-modal').style.display = 'flex';
        }
    }

    function closeRestartModal() {
        document.getElementById('restart-modal').style.display = 'none';
    }

    function restartGame() {
        gameState = {
            turn: 0,
            maxTurn: 10,
            cash: INITIAL_CASH,
            isProcessing: false,
            stocks: [
                { id: 0, name: '광통신 인프라', sector: '광통신', price: 100, owned: 0, lastImpact: 0, prevPrice: 100, tempQty: 1, history: [100] },
                { id: 1, name: 'AI 반도체', sector: 'AI', price: 100, owned: 0, lastImpact: 0, prevPrice: 100, tempQty: 1, history: [100] },
                { id: 2, name: '우주 항공', sector: '우주', price: 100, owned: 0, lastImpact: 0, prevPrice: 100, tempQty: 1, history: [100] }
            ]
        };

        clearTimeout(typewriterTimeout);
        document.getElementById('modal-overlay').style.display = 'none';
        document.getElementById('restart-modal').style.display = 'none';
        document.getElementById('news-board').textContent = "시작하려면 아래 버튼을 누르세요. 시장을 분석하여 AI 뉴스를 생성합니다.";

        const btn = document.getElementById('next-btn');
        btn.querySelector('span').textContent = "게임 시작";
        btn.onclick = handleTurn;
        btn.disabled = false;

        init();
        showToast("시스템이 초기화되었습니다.", "success");
    }

    function showToast(text, type = "info") {
        const toast = document.getElementById('toast');
        toast.textContent = text;
        toast.style.display = 'block';

        let borderColor = 'var(--accent-cyan)';
        if (type === 'buy') borderColor = 'var(--accent-up)';
        if (type === 'sell') borderColor = 'var(--accent-down)';
        if (type === 'success') borderColor = 'var(--accent-green)';
        if (type === 'error') borderColor = 'var(--accent-up)';

        toast.style.borderBottom = `4px solid ${borderColor}`;

        setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }

    window.onload = init;
</script>
</body>
</html>
