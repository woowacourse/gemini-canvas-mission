<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkMind AI | Smart URL Archiving</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .link-card:hover { transform: translateY(-4px); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.2); border-color: #a5b4fc; }
        .loader { border-top-color: #4f46e5; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .menu-active { background-color: #eef2ff !important; color: #4f46e5 !important; font-weight: 600; }
        .menu-active i { color: #4f46e5 !important; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #ccc; }
    </style>
</head>
<body class="text-slate-800">

    <div id="app" class="flex min-h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-white border-r border-slate-200 hidden md:flex flex-col">
            <div class="p-6">
                <h1 class="text-2xl font-bold text-indigo-600 flex items-center gap-2">
                    <i class="fas fa-brain"></i> LinkMind
                </h1>
            </div>
            <nav id="sidebar-nav" class="flex-1 px-4 space-y-1 overflow-y-auto">
                <!-- Sidebar content rendered by JS -->
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
            <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 z-10">
                <div class="flex-1 max-w-xl">
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                            <i class="fas fa-search"></i>
                        </span>
                        <input type="text" id="search-input" oninput="app.handleSearch(this.value)" placeholder="제목 또는 태그로 검색..." class="block w-full pl-10 pr-3 py-2 border border-slate-200 rounded-full bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm transition-all">
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="app.showAddModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700 transition shadow-md active:scale-95">
                        <i class="fas fa-plus mr-1"></i> 링크 저장
                    </button>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto p-8">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h2 id="current-view-title" class="text-xl font-bold text-slate-900">모든 링크</h2>
                        <p class="text-xs text-slate-400 mt-1" id="link-count">0개의 링크 보관됨</p>
                    </div>
                </div>
                <div id="link-grid" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6"></div>
            </div>
        </main>
    </div>

    <!-- Main Add Link Modal -->
    <div id="link-modal" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <h3 class="text-lg font-bold text-slate-800">새 링크 아카이빙</h3>
                <button onclick="app.closeModal('link-modal')" class="text-slate-400 hover:text-slate-600 transition"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="p-6 overflow-y-auto space-y-4">
                <!-- Thumbnail Preview Area -->
                <div class="w-full h-40 bg-slate-50 rounded-xl overflow-hidden relative border border-slate-200 flex items-center justify-center shadow-inner">
                    <img id="modal-image-preview" src="" class="hidden w-full h-full object-cover">
                    <div id="modal-image-placeholder" class="text-slate-300 flex flex-col items-center gap-2">
                        <i class="fas fa-image text-3xl"></i>
                        <span class="text-xs font-medium">썸네일 미리보기</span>
                    </div>
                    <input type="hidden" id="modal-image" value="">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">URL</label>
                    <div class="flex gap-2">
                        <input type="url" id="modal-url" placeholder="https://www.youtube.com/watch?v=..." class="flex-1 px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm transition-all">
                        <button onclick="app.analyzeWithAI()" id="ai-btn" class="bg-indigo-50 text-indigo-700 px-4 py-2 rounded-lg text-sm font-bold hover:bg-indigo-100 transition flex items-center gap-2">
                            <i class="fas fa-magic"></i> AI 분석
                        </button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">제목</label>
                    <input type="text" id="modal-title" placeholder="AI가 자동으로 제목을 생성합니다." class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">설명 및 요약</label>
                    <textarea id="modal-desc" rows="3" placeholder="AI 분석을 실행하면 링크의 핵심 내용이 요약됩니다." class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm"></textarea>
                    <div id="ai-loading" class="hidden items-center gap-2 mt-2 text-xs text-indigo-600 font-medium">
                        <div class="loader w-3 h-3 border-2 rounded-full"></div>
                        <span>인사이트 및 메타데이터를 추출 중입니다...</span>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">폴더 선택</label>
                        <select id="modal-folder" class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm"></select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">태그</label>
                        <input type="text" id="modal-tags" placeholder="쉼표로 구분" class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                    </div>
                </div>
                <div class="bg-indigo-50 p-3 rounded-lg flex items-center gap-3">
                    <input type="checkbox" id="modal-reminder" class="w-4 h-4 text-indigo-600 rounded cursor-pointer">
                    <label for="modal-reminder" class="text-xs text-indigo-700 font-medium cursor-pointer">24시간 후 리마인드 알림 받기</label>
                </div>
            </div>
            <div class="p-6 border-t border-slate-100 flex justify-end gap-3 bg-slate-50">
                <button onclick="app.closeModal('link-modal')" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-200 rounded-lg transition">취소</button>
                <button onclick="app.saveLink()" class="px-8 py-2 bg-indigo-600 text-white text-sm font-bold rounded-lg hover:bg-indigo-700 transition shadow-lg active:scale-95">저장하기</button>
            </div>
        </div>
    </div>

    <!-- Custom Confirm Modal for Delete -->
    <div id="confirm-modal" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-[60] p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl w-full max-w-sm shadow-2xl overflow-hidden flex flex-col">
            <div class="p-6">
                <div class="flex items-center gap-3 mb-2">
                    <div class="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center text-red-600">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <h3 class="text-lg font-bold text-slate-800">링크 삭제</h3>
                </div>
                <p class="text-sm text-slate-600 ml-13">이 링크를 아카이브에서 영구적으로 삭제하시겠습니까?</p>
            </div>
            <div class="p-4 border-t border-slate-100 flex justify-end gap-3 bg-slate-50">
                <button onclick="app.closeConfirmModal()" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-200 rounded-lg">취소</button>
                <button onclick="app.confirmDelete()" class="px-4 py-2 bg-red-600 text-white text-sm font-bold rounded-lg hover:bg-red-700">삭제하기</button>
            </div>
        </div>
    </div>

    <!-- Custom Prompt Modal for Add Folder -->
    <div id="prompt-modal" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-[60] p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl w-full max-w-sm shadow-2xl overflow-hidden flex flex-col">
            <div class="p-6">
                <h3 class="text-lg font-bold text-slate-800 mb-4">새 폴더 추가</h3>
                <input type="text" id="prompt-input" placeholder="폴더 이름을 입력하세요 (예: 사이드 프로젝트)" class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
            </div>
            <div class="p-4 border-t border-slate-100 flex justify-end gap-3 bg-slate-50">
                <button onclick="app.closePromptModal()" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-200 rounded-lg">취소</button>
                <button onclick="app.submitPromptModal()" class="px-4 py-2 bg-indigo-600 text-white text-sm font-bold rounded-lg hover:bg-indigo-700">추가하기</button>
            </div>
        </div>
    </div>

    <!-- Custom Confirm Modal for Folder Delete -->
    <div id="folder-confirm-modal" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-[60] p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl w-full max-w-sm shadow-2xl overflow-hidden flex flex-col">
            <div class="p-6">
                <div class="flex items-center gap-3 mb-2">
                    <div class="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center text-red-600">
                        <i class="fas fa-folder-minus"></i>
                    </div>
                    <h3 class="text-lg font-bold text-slate-800">폴더 삭제</h3>
                </div>
                <p class="text-sm text-slate-600 ml-13" id="folder-delete-msg">이 폴더를 삭제하시겠습니까? 내부의 링크들은 '기본' 폴더로 안전하게 이동됩니다.</p>
            </div>
            <div class="p-4 border-t border-slate-100 flex justify-end gap-3 bg-slate-50">
                <button onclick="app.closeFolderConfirmModal()" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-200 rounded-lg">취소</button>
                <button onclick="app.confirmDeleteFolder()" class="px-4 py-2 bg-red-600 text-white text-sm font-bold rounded-lg hover:bg-red-700">삭제하기</button>
            </div>
        </div>
    </div>

    <!-- Toast UI -->
    <div id="toast" class="fixed bottom-8 right-8 transition-all transform translate-y-20 opacity-0 pointer-events-none z-[100]">
        <div class="bg-slate-900 text-white px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3 min-w-[300px]">
            <div id="toast-icon" class="w-8 h-8 bg-indigo-600 rounded-full flex items-center justify-center text-sm">
                <i class="fas fa-check"></i>
            </div>
            <div>
                <p class="text-sm font-bold" id="toast-message"></p>
                <p class="text-[10px] text-slate-400">LinkMind System</p>
            </div>
        </div>
    </div>

    <script>
        const apiKey = ""; 

        class LinkMindApp {
            constructor() {
                this.links = JSON.parse(localStorage.getItem('lm_links')) || [];
                this.folders = JSON.parse(localStorage.getItem('lm_folders')) || ['기본', '업무', '레퍼런스', '학습'];
                this.currentFilter = 'all';
                this.searchQuery = '';
                this.pendingDeleteId = null; 
                this.pendingDeleteFolder = null; 
                this.init();
            }

            init() {
                this.renderSidebar();
                this.renderLinks();
                this.checkReminders();
                window.onclick = (e) => {
                    if (e.target.id === 'link-modal') this.closeModal('link-modal');
                    if (e.target.id === 'confirm-modal') this.closeConfirmModal();
                    if (e.target.id === 'prompt-modal') this.closePromptModal();
                    if (e.target.id === 'folder-confirm-modal') this.closeFolderConfirmModal();

                    if (!e.target.closest('.folder-menu-wrapper')) {
                        document.querySelectorAll('.folder-dropdown').forEach(menu => menu.classList.add('hidden'));
                    }
                };
            }

            saveToStorage() {
                localStorage.setItem('lm_links', JSON.stringify(this.links));
                localStorage.setItem('lm_folders', JSON.stringify(this.folders));
                this.renderSidebar();
                this.renderLinks();
            }

            renderSidebar() {
                const nav = document.getElementById('sidebar-nav');
                nav.innerHTML = '';

                const staticMenus = [
                    { id: 'all', label: '모든 링크', icon: 'fa-layer-group' },
                    { id: 'unread', label: '안 읽은 링크', icon: 'fa-envelope' },
                    { id: 'popular', label: '자주 찾는 링크', icon: 'fa-fire' }
                ];

                staticMenus.forEach(menu => {
                    const btn = document.createElement('button');
                    const isActive = this.currentFilter === menu.id;
                    btn.className = `w-full flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg transition-all ${isActive ? 'menu-active shadow-sm' : 'text-slate-600 hover:bg-slate-50'}`;
                    btn.innerHTML = `<i class="fas ${menu.icon} w-5"></i> ${menu.label}`;
                    btn.onclick = () => this.setFilter(menu.id);
                    nav.appendChild(btn);
                });

                const divider = document.createElement('div');
                divider.className = 'pt-6 pb-2';
                divider.innerHTML = '<p class="px-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest">나의 폴더</p>';
                nav.appendChild(divider);

                this.folders.forEach(folder => {
                    const wrapper = document.createElement('div');
                    const isActive = this.currentFilter === folder;
                    wrapper.className = `group flex items-center justify-between w-full rounded-lg transition-all ${isActive ? 'menu-active shadow-sm' : 'text-slate-600 hover:bg-slate-50'}`;
                    
                    wrapper.innerHTML = `
                        <button class="flex-1 flex items-center gap-3 px-4 py-2 text-sm font-medium text-left truncate" onclick="app.setFilter('${folder}')">
                            <i class="fas fa-folder w-5"></i> <span class="truncate">${folder}</span>
                        </button>
                        ${folder !== '기본' ? `
                        <div class="relative folder-menu-wrapper">
                            <button onclick="app.toggleFolderMenu('${folder}', event)" class="opacity-0 group-hover:opacity-100 px-3 py-2 text-slate-400 hover:text-slate-600 transition-all focus:opacity-100" title="메뉴">
                                <i class="fas fa-ellipsis-v"></i>
                            </button>
                            <div id="folder-menu-${folder}" class="folder-dropdown hidden absolute right-0 mt-1 w-24 bg-white rounded-lg shadow-lg border border-slate-100 py-1 z-50">
                                <button onclick="app.requestDeleteFolder('${folder}', event)" class="w-full text-left px-4 py-2 text-xs text-red-600 hover:bg-red-50 font-medium transition-colors">
                                    <i class="fas fa-trash-alt mr-1"></i> 삭제
                                </button>
                            </div>
                        </div>
                        ` : ''}
                    `;
                    nav.appendChild(wrapper);
                });

                const addFolderBtn = document.createElement('button');
                addFolderBtn.className = "w-full flex items-center gap-3 px-4 py-2 text-sm text-indigo-600 hover:bg-indigo-50 rounded-lg mt-4 font-bold transition-all border border-dashed border-indigo-200";
                addFolderBtn.innerHTML = `<i class="fas fa-plus-circle"></i> 새 폴더 추가`;
                addFolderBtn.onclick = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    this.showAddFolder();
                };
                nav.appendChild(addFolderBtn);

                const modalFolder = document.getElementById('modal-folder');
                if (modalFolder) {
                    modalFolder.innerHTML = this.folders.map(f => `<option value="${f}">${f}</option>`).join('');
                }
            }

            renderLinks() {
                const grid = document.getElementById('link-grid');
                const countEl = document.getElementById('link-count');
                grid.innerHTML = '';

                let filtered = [...this.links];

                if (this.currentFilter === 'unread') filtered = filtered.filter(l => !l.isRead);
                else if (this.currentFilter === 'popular') filtered = filtered.sort((a, b) => b.viewCount - a.viewCount);
                else if (!['all', 'unread', 'popular'].includes(this.currentFilter)) {
                    filtered = filtered.filter(l => l.folder === this.currentFilter);
                }

                if (this.searchQuery) {
                    const q = this.searchQuery.toLowerCase();
                    filtered = filtered.filter(l => l.title.toLowerCase().includes(q) || l.tags.toLowerCase().includes(q));
                }

                countEl.innerText = `${filtered.length}개의 지식이 보관되어 있습니다.`;

                if (filtered.length === 0) {
                    grid.innerHTML = `<div class="col-span-full py-32 text-center text-slate-400"><i class="fas fa-folder-open text-3xl mb-4 block"></i>저장된 지식이 없습니다.</div>`;
                    return;
                }

                filtered.forEach(link => {
                    const card = document.createElement('div');
                    card.className = "bg-white rounded-2xl border border-slate-200 shadow-sm link-card flex flex-col transition-all cursor-default overflow-hidden";
                    
                    // 썸네일 처리 로직
                    const hasImage = !!link.imageUrl;
                    const imgHtml = hasImage ? `<img src="${link.imageUrl}" alt="Thumbnail" class="w-full h-full object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                                                <div class="absolute inset-0 items-center justify-center text-slate-300 text-3xl" style="display:none;"><i class="fas fa-link"></i></div>` 
                                             : `<div class="absolute inset-0 flex items-center justify-center text-slate-300 text-3xl"><i class="fas fa-link"></i></div>`;

                    card.innerHTML = `
                        <!-- Thumbnail Header -->
                        <div class="h-40 w-full relative bg-slate-50 border-b border-slate-100 flex-shrink-0">
                            ${imgHtml}
                            <div class="absolute inset-0 bg-gradient-to-b from-black/20 to-transparent pointer-events-none"></div>
                            <div class="absolute top-3 left-3 z-10">
                                <span class="px-2 py-1 bg-white/90 backdrop-blur-sm text-[10px] font-bold text-indigo-600 rounded uppercase tracking-wider shadow-sm">${link.folder}</span>
                            </div>
                            <div class="absolute top-3 right-3 flex gap-1 z-10">
                                <button onclick="app.toggleRead('${link.id}', event)" class="w-8 h-8 flex items-center justify-center rounded-full bg-white/90 backdrop-blur-sm shadow-sm transition-all ${link.isRead ? 'text-green-500' : 'text-slate-400 hover:text-green-500'}" title="읽음 표시">
                                    <i class="fas fa-check-circle"></i>
                                </button>
                                <button onclick="app.requestDelete('${link.id}', event)" class="w-8 h-8 flex items-center justify-center rounded-full bg-white/90 backdrop-blur-sm shadow-sm text-slate-400 hover:text-red-500 transition-all" title="삭제">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </div>
                        </div>
                        
                        <!-- Content Body -->
                        <div class="p-5 flex-1 flex flex-col">
                            <h4 class="font-bold text-slate-900 mb-2 leading-tight line-clamp-2 min-h-[2.8rem]">${link.title}</h4>
                            <p class="text-sm text-slate-500 mb-4 line-clamp-3 text-justify leading-relaxed">${link.description || '인사이트 추출 대기 중...'}</p>
                            
                            <div class="pt-4 border-t border-slate-50 flex items-center justify-between mt-auto">
                                <div class="flex items-center gap-3 overflow-hidden">
                                    <span class="text-[11px] font-medium text-slate-400 flex items-center gap-1 flex-shrink-0"><i class="fas fa-eye"></i> ${link.viewCount}</span>
                                    <div class="flex gap-1 overflow-hidden truncate">
                                        ${link.tags ? link.tags.split(',').slice(0, 2).map(t => `<span class="text-[10px] text-indigo-500">#${t.trim()}</span>`).join('') : ''}
                                    </div>
                                </div>
                                <button onclick="app.visitLink('${link.id}', '${link.url}')" class="bg-slate-900 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-indigo-600 transition flex items-center gap-2 flex-shrink-0">열기 <i class="fas fa-external-link-alt text-[10px]"></i></button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }

            setFilter(filter) {
                this.currentFilter = filter;
                const titleMap = { 'all': '모든 링크', 'unread': '안 읽은 링크', 'popular': '가장 많이 본 링크' };
                document.getElementById('current-view-title').innerText = titleMap[filter] || filter;
                this.renderSidebar();
                this.renderLinks();
            }

            handleSearch(val) {
                this.searchQuery = val;
                this.renderLinks();
            }

            toggleFolderMenu(folderName, event) {
                event.preventDefault();
                event.stopPropagation();
                
                document.querySelectorAll('.folder-dropdown').forEach(menu => {
                    if (menu.id !== `folder-menu-${folderName}`) {
                        menu.classList.add('hidden');
                    }
                });
                
                const menu = document.getElementById(`folder-menu-${folderName}`);
                if (menu) {
                    menu.classList.toggle('hidden');
                }
            }

            async analyzeWithAI() {
                const url = document.getElementById('modal-url').value;
                if (!url || !url.startsWith('http')) return this.showToast("올바른 URL을 입력하세요.");

                const loading = document.getElementById('ai-loading');
                const aiBtn = document.getElementById('ai-btn');
                loading.classList.remove('hidden');
                loading.classList.add('flex');
                aiBtn.disabled = true;

                try {
                    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
                    const htmlResponse = await fetch(proxyUrl);
                    if (!htmlResponse.ok) throw new Error("웹페이지 HTML을 로드할 수 없습니다.");
                    
                    const htmlData = await htmlResponse.json();
                    
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(htmlData.contents, "text/html");

                    // 메타데이터(제목, 설명, 썸네일) 추출
                    let pageTitle = doc.querySelector('meta[property="og:title"]')?.content 
                                 || doc.querySelector('title')?.innerText 
                                 || "제목 없음";
                                 
                    let pageDescription = doc.querySelector('meta[property="og:description"]')?.content 
                                       || doc.querySelector('meta[name="description"]')?.content 
                                       || doc.querySelector('body')?.innerText?.substring(0, 500) 
                                       || "설명을 찾을 수 없습니다.";
                                       
                    let channelName = "알 수 없음";
                    let imageUrl = doc.querySelector('meta[property="og:image"]')?.content 
                                || doc.querySelector('meta[name="twitter:image"]')?.content 
                                || "";

                    // 썸네일 URL 상대 경로 처리
                    if (imageUrl && imageUrl.startsWith('/')) {
                        try {
                            imageUrl = new URL(url).origin + imageUrl;
                        } catch(e) {}
                    }

                    if (url.includes('youtube.com') || url.includes('youtu.be')) {
                        pageTitle = pageTitle.replace(' - YouTube', '').trim();
                        
                        const authorEl = doc.querySelector('link[itemprop="name"]');
                        if (authorEl) {
                            channelName = authorEl.getAttribute('content');
                        } else {
                            const authorMeta = doc.querySelector('meta[name="author"]');
                            if (authorMeta) {
                                channelName = authorMeta.getAttribute('content');
                            }
                        }

                        // 유튜브 고화질 썸네일 강제 추출
                        const videoIdMatch = url.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:[^\/\n\s]+\/\S+\/|(?:v|e(?:mbed)?)\/|\S*?[?&]v=)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
                        if (videoIdMatch && videoIdMatch[1]) {
                            imageUrl = `https://img.youtube.com/vi/${videoIdMatch[1]}/hqdefault.jpg`;
                        }
                    }

                    // 썸네일 모달창 프리뷰 세팅
                    document.getElementById('modal-image').value = imageUrl;
                    const previewEl = document.getElementById('modal-image-preview');
                    const placeholderEl = document.getElementById('modal-image-placeholder');
                    
                    if(imageUrl) {
                        previewEl.src = imageUrl;
                        previewEl.classList.remove('hidden');
                        placeholderEl.classList.add('hidden');
                    } else {
                        previewEl.classList.add('hidden');
                        placeholderEl.classList.remove('hidden');
                    }

                    const systemPrompt = `당신은 지식 관리 PM입니다.
                    반드시 아래에 제공된 [실제 웹페이지 제목], [유튜버/작성자 정보], [실제 설명 텍스트] 정보만을 기반으로 분석하세요.
                    절대로 링크의 내용을 마음대로 추측하거나 다른 지식을 지어내지 마세요.
                    응답은 마크다운(backticks) 없이 순수한 JSON 객체 하나만 반환하세요.
                    
                    [실제 웹페이지 제목]: ${pageTitle}
                    [유튜버/작성자 정보]: ${channelName}
                    [실제 설명 텍스트]: ${pageDescription}
                    
                    응답 형식: {"title": "정제된 제목 (채널명 제외)", "summary": "'[유튜버/작성자 정보] 채널의 영상으로...' 처럼 작성자 정보를 포함하여 위 텍스트에 기반한 핵심 요약 2문장 작성", "tags": ["키워드1", "키워드2"]}`;
                    
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: "제공된 실제 텍스트를 바탕으로 JSON 요약을 생성하세요." }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] }
                        })
                    });

                    if (!response.ok) throw new Error(`API 오류: ${response.status}`);

                    const data = await response.json();
                    
                    const candidate = data.candidates?.[0];
                    if (!candidate) throw new Error("AI 응답 결과가 없습니다.");
                    
                    const textPart = candidate.content?.parts?.find(p => p.text);
                    if (!textPart || !textPart.text) {
                        throw new Error("응답 데이터에서 텍스트를 찾을 수 없습니다.");
                    }

                    const rawText = textPart.text;
                    const jsonMatch = rawText.match(/\{[\s\S]*\}/);
                    if (!jsonMatch) throw new Error("JSON 파싱 불가");
                    
                    const result = JSON.parse(jsonMatch[0]);

                    document.getElementById('modal-title').value = result.title || pageTitle;
                    document.getElementById('modal-desc').value = result.summary || pageDescription;
                    document.getElementById('modal-tags').value = result.tags?.join(', ') || "";
                    
                    this.showToast("실제 웹페이지 데이터를 기반으로 인사이트를 추출했습니다.");
                } catch (err) {
                    console.error("AI Analysis Error:", err);
                    this.showToast("분석에 실패했습니다. 내용을 직접 입력해주세요.");
                } finally {
                    loading.classList.add('hidden');
                    aiBtn.disabled = false;
                }
            }

            saveLink() {
                const urlInput = document.getElementById('modal-url');
                const titleInput = document.getElementById('modal-title');
                if (!urlInput.value || !titleInput.value) return this.showToast("URL과 제목을 확인하세요.");

                const newLink = {
                    id: String(Date.now()),
                    url: urlInput.value,
                    title: titleInput.value,
                    description: document.getElementById('modal-desc').value,
                    imageUrl: document.getElementById('modal-image').value, // 썸네일 URL 저장
                    folder: document.getElementById('modal-folder').value,
                    tags: document.getElementById('modal-tags').value,
                    isRead: false, viewCount: 0, createdAt: Date.now(),
                    reminderAt: document.getElementById('modal-reminder').checked ? Date.now() + 86400000 : null,
                    reminderDone: false
                };

                this.links.unshift(newLink);
                this.saveToStorage();
                this.closeModal('link-modal');
                this.showToast("보관함에 저장되었습니다.");
            }

            requestDelete(id, event) {
                if (event) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                this.pendingDeleteId = String(id);
                document.getElementById('confirm-modal').style.display = 'flex';
            }

            closeConfirmModal() {
                document.getElementById('confirm-modal').style.display = 'none';
                this.pendingDeleteId = null;
            }

            confirmDelete() {
                if (!this.pendingDeleteId) return;
                
                const initialCount = this.links.length;
                this.links = this.links.filter(l => String(l.id) !== this.pendingDeleteId);
                
                if (this.links.length < initialCount) {
                    this.saveToStorage();
                    this.showToast("링크가 삭제되었습니다.");
                } else {
                    this.showToast("삭제 대상을 찾을 수 없습니다.");
                }
                this.closeConfirmModal();
            }

            requestDeleteFolder(folderName, event) {
                if (event) {
                    event.preventDefault();
                    event.stopPropagation();
                }

                document.querySelectorAll('.folder-dropdown').forEach(menu => menu.classList.add('hidden'));

                this.pendingDeleteFolder = folderName;
                document.getElementById('folder-delete-msg').innerText = `'${folderName}' 폴더를 삭제하시겠습니까? 내부의 링크들은 '기본' 폴더로 안전하게 이동됩니다.`;
                document.getElementById('folder-confirm-modal').style.display = 'flex';
            }

            closeFolderConfirmModal() {
                document.getElementById('folder-confirm-modal').style.display = 'none';
                this.pendingDeleteFolder = null;
            }

            confirmDeleteFolder() {
                if (!this.pendingDeleteFolder) return;
                
                const targetFolder = this.pendingDeleteFolder;
                
                this.folders = this.folders.filter(f => f !== targetFolder);
                
                this.links.forEach(link => {
                    if (link.folder === targetFolder) {
                        link.folder = '기본';
                    }
                });
                
                if (this.currentFilter === targetFolder) {
                    this.currentFilter = 'all';
                }
                
                this.saveToStorage();
                this.showToast(`'${targetFolder}' 폴더가 삭제되었습니다.`);
                this.closeFolderConfirmModal();
            }

            visitLink(id, url) {
                const link = this.links.find(l => String(l.id) === String(id));
                if (link) {
                    link.viewCount++;
                    link.isRead = true;
                    this.saveToStorage();
                    window.open(url, '_blank');
                }
            }

            toggleRead(id, event) {
                if (event) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                const link = this.links.find(l => String(l.id) === String(id));
                if (link) {
                    link.isRead = !link.isRead;
                    this.saveToStorage();
                    this.showToast(link.isRead ? "읽음 표시" : "안 읽음 표시");
                }
            }

            showAddModal() {
                ['modal-url', 'modal-title', 'modal-desc', 'modal-tags', 'modal-image'].forEach(id => document.getElementById(id).value = '');
                
                // 미리보기 초기화
                document.getElementById('modal-image-preview').classList.add('hidden');
                document.getElementById('modal-image-placeholder').classList.remove('hidden');

                document.getElementById('modal-reminder').checked = false;
                document.getElementById('link-modal').style.display = 'flex';
                document.getElementById('modal-url').focus();
            }

            closeModal(id) { document.getElementById(id).style.display = 'none'; }

            showAddFolder() {
                document.getElementById('prompt-input').value = '';
                document.getElementById('prompt-modal').style.display = 'flex';
                setTimeout(() => document.getElementById('prompt-input').focus(), 100);
            }

            closePromptModal() {
                document.getElementById('prompt-modal').style.display = 'none';
            }

            submitPromptModal() {
                const name = document.getElementById('prompt-input').value;
                if (name && name.trim()) {
                    const folderName = name.trim();
                    if (!this.folders.includes(folderName)) {
                        this.folders.push(folderName);
                        this.saveToStorage();
                        this.showToast(`'${folderName}' 폴더 생성완료.`);
                        this.closePromptModal();
                    } else {
                        this.showToast("이미 있는 폴더입니다.");
                    }
                } else {
                    this.showToast("폴더 이름을 입력해주세요.");
                }
            }

            showToast(msg) {
                const toast = document.getElementById('toast');
                document.getElementById('toast-message').innerText = msg;
                toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
                setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none'), 3000);
            }

            checkReminders() {
                const now = Date.now();
                let updated = false;
                this.links.forEach(l => {
                    if (l.reminderAt && !l.reminderDone && now > l.reminderAt) {
                        this.showToast(`🔔 리마인드: ${l.title}`);
                        l.reminderDone = true;
                        updated = true;
                    }
                });
                if (updated) this.saveToStorage();
            }
        }

        window.app = new LinkMindApp();
    </script>
</body>
</html>
