<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>메모좀! - 나만의 문장 수집가</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
    <style>
        /* 파스텔 그린 테마 변수 */
        :root {
            --bg-color: #F6FAF7;
            --surface-color: #FFFFFF;
            --text-primary: #4A564F;
            --text-secondary: #97A39D;
            --accent-color: #88CBA1;
            --accent-hover: #75B58E;
            --input-bg: #F0F6F2;
            --tag-bg: #EAF4EE;
            --tag-text: #609E78;
            --border-color: transparent;
            --danger-color: #FF8C8C;

            --font-main: 'Gowun Dodum', sans-serif;
            --font-title: 'Jua', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* 데스크톱 환경에서도 모바일 뷰처럼 보이도록 배경색 분리 */
        body {
            font-family: var(--font-main);
            background-color: #E8EDE9; /* 바탕은 살짝 어둡게 */
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Mobile App Layout */
        .app-container {
            width: 100%;
            max-width: 500px; /* 스마트폰 너비 고정 */
            background-color: var(--bg-color); /* 앱 컨테이너 배경은 밝게 */
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            box-shadow: 0 0 40px rgba(0,0,0,0.05);
        }

        /* Header / Logo */
        .app-header {
            text-align: center;
            padding-bottom: 10px;
            padding-top: 10px;
        }

        .app-title {
            font-family: var(--font-title);
            font-size: 2.5rem;
            color: var(--accent-color);
            margin-bottom: 8px;
            text-shadow: 2px 2px 0px rgba(136, 203, 161, 0.2);
        }

        .app-subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* Form Section */
        .record-panel {
            background-color: transparent;
        }

        .form-card {
            background-color: var(--surface-color);
            padding: 24px;
            border-radius: 28px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.03);
            border: 3px solid #EAF4EE;
        }

        .section-title {
            font-family: var(--font-title);
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: var(--accent-color);
            text-align: center;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border-color);
            border-radius: 20px;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text-primary);
            background-color: var(--input-bg);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-color);
            background-color: var(--surface-color);
            transform: translateY(-2px);
        }

        .form-control::placeholder { color: #B5C2BB; }

        textarea.form-control {
            resize: vertical;
            min-height: 40px;
        }

        .quote-input {
            font-size: 1.1rem;
            line-height: 1.6;
            min-height: 100px !important;
        }

        /* Tag Input System */
        .tags-input-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 10px 14px;
            background-color: var(--input-bg);
            border-radius: 20px;
            border: 2px solid var(--border-color);
            min-height: 50px;
            align-items: center;
            transition: all 0.3s;
            cursor: text;
        }

        .tags-input-wrapper:focus-within {
            border-color: var(--accent-color);
            background-color: var(--surface-color);
            transform: translateY(-2px);
        }

        .draft-tag {
            background-color: var(--tag-bg);
            color: var(--tag-text);
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .draft-tag .remove-tag {
            cursor: pointer;
            font-weight: bold;
            opacity: 0.6;
            padding-left: 2px;
        }

        .tag-input-field {
            border: none;
            outline: none;
            background: transparent;
            flex-grow: 1;
            font-size: 0.95rem;
            min-width: 100px;
            color: var(--text-primary);
            font-family: inherit;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            margin-top: 8px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 20px;
            font-family: var(--font-title);
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(136, 203, 161, 0.3);
        }

        .btn-submit:hover, .btn-submit:active {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        /* List Section */
        .list-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Dynamic Filters (가로 스크롤 최적화) */
        .dynamic-filters {
            display: flex;
            gap: 8px;
            flex-wrap: nowrap;
            overflow-x: auto;
            padding-bottom: 12px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .dynamic-filters::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            padding: 8px 16px;
            background-color: var(--surface-color);
            border: 2px solid #DCE8E1;
            border-radius: 24px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .filter-btn.special-btn {
            background-color: var(--surface-color);
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .filter-btn.special-btn:active {
            transform: scale(0.95);
        }

        .filter-btn.active {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
            box-shadow: 0 4px 10px rgba(136, 203, 161, 0.3);
        }

        /* Single Column Grid */
        .quotes-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Quote Card */
        .quote-card {
            background-color: var(--surface-color);
            border-radius: 28px;
            padding: 24px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.02);
            border: 3px solid #EAF4EE;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
        }

        .quote-card:active {
            transform: scale(0.98);
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .card-tag {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--tag-text);
            background-color: var(--tag-bg);
            padding: 4px 10px;
            border-radius: 12px;
        }

        .card-quote {
            font-family: var(--font-title);
            font-size: 1.3rem;
            line-height: 1.5;
            color: var(--text-primary);
            margin-bottom: 20px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: auto;
        }

        .card-source {
            font-weight: 600;
            background-color: var(--input-bg);
            padding: 4px 10px;
            border-radius: 10px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            font-family: var(--font-title);
            font-size: 1.3rem;
        }

        /* Modal - Mobile Optimized */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(246, 250, 247, 0.9);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: flex-end; /* 모바일 특화: 아래에서 위로 올라오도록 */
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: var(--surface-color);
            width: 100%;
            max-width: 500px; /* 앱 컨테이너 너비와 일치 */
            border-radius: 40px 40px 0 0; /* 상단 모서리만 둥글게 */
            padding: 40px 24px;
            box-shadow: 0 -10px 40px rgba(136, 203, 161, 0.15);
            border-top: 4px solid #EAF4EE;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-close {
            position: absolute;
            top: 20px; right: 24px;
            background: var(--input-bg);
            border: none;
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem;
            color: var(--text-primary);
            cursor: pointer;
        }

        .modal-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 20px;
        }

        .modal-quote {
            font-family: var(--font-title);
            font-size: 1.8rem;
            line-height: 1.5;
            color: var(--text-primary);
            margin-bottom: 24px;
        }

        .modal-meta {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .modal-source {
            font-weight: 600;
            color: var(--accent-color);
            background-color: var(--tag-bg);
            padding: 4px 12px;
            border-radius: 12px;
        }

        .modal-thought-box {
            background-color: var(--input-bg);
            padding: 24px;
            border-radius: 24px;
            border: 2px dashed #DCE8E1;
        }

        .modal-thought-title {
            font-family: var(--font-title);
            font-size: 1.2rem;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .modal-thought {
            font-size: 1rem;
            line-height: 1.7;
            color: var(--text-primary);
            white-space: pre-wrap;
        }

        .modal-actions {
            margin-top: 24px;
            text-align: center; /* 모바일은 중앙 정렬이 더 편안함 */
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: underline;
            text-decoration-thickness: 2px;
            text-underline-offset: 4px;
            padding: 10px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: var(--accent-color);
            color: white;
            padding: 14px 28px;
            border-radius: 30px;
            font-family: var(--font-title);
            font-size: 1.1rem;
            box-shadow: 0 8px 20px rgba(136, 203, 161, 0.4);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1001;
            white-space: nowrap;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

    </style>
</head>
<body>

<div class="app-container">
    <header class="app-header">
        <h1 class="app-title">메모좀!</h1>
        <p class="app-subtitle">길가다 마주친 귀여운 문구, 마음을 울린 한 마디를 담아주세요.</p>
    </header>

    <!-- Form Section -->
    <aside class="record-panel">
        <div class="form-card">
            <h2 class="section-title">📝 나만의 조각 모으기</h2>
            <form id="quote-form">
                <div class="form-group">
                    <textarea id="quote-text" class="form-control quote-input" placeholder="어떤 예쁜 문장을 발견하셨나요?&#10;(길가다 본 간판, 책의 한 구절 등 모두 좋아요!)" required></textarea>
                </div>

                <div class="form-group">
                    <div class="tags-input-wrapper" id="tags-wrapper" onclick="document.getElementById('tag-input').focus()">
                        <div id="draft-tags-list" style="display:flex; flex-wrap:wrap; gap:6px;"></div>
                        <input type="text" id="tag-input" class="tag-input-field" placeholder="#어울리는 태그를 달아주세요">
                    </div>
                </div>

                <div class="form-group">
                    <input type="text" id="quote-source" class="form-control" placeholder="어디서 보았나요? (예: 동네 카페 벽면)">
                </div>

                <div class="form-group">
                    <textarea id="quote-thought" class="form-control" placeholder="이 문장이 왜 마음에 쏙 들었나요? 편하게 끄적여보세요."></textarea>
                </div>

                <button type="submit" class="btn-submit">조각 보관하기 ✨</button>
            </form>
        </div>
    </aside>

    <!-- List Section -->
    <section class="list-panel">
        <!-- 가로 스크롤 필터 영역 -->
        <div class="dynamic-filters" id="filter-container">
            <!-- Javascript로 버튼이 주입됩니다 -->
        </div>

        <!-- 세로형 카드 리스트 -->
        <div class="quotes-grid" id="quotes-grid">
            <!-- Javascript로 카드가 주입됩니다 -->
        </div>
    </section>
</div>

<!-- Modal for Quote Details (Bottom Sheet Style) -->
<div class="modal-overlay" id="quote-modal">
    <div class="modal-content">
        <button class="modal-close" id="modal-close">&times;</button>

        <div class="modal-tags" id="modal-tags-display"></div>
        <div class="modal-quote" id="modal-quote-text"></div>

        <div class="modal-meta">
            <span class="modal-source" id="modal-source-text"></span>
            <span style="color: #DCE8E1">|</span>
            <span id="modal-date-text"></span>
        </div>

        <div id="modal-thought-section" class="modal-thought-box">
            <div class="modal-thought-title">💭 나의 끄적임</div>
            <div class="modal-thought" id="modal-thought-text"></div>
        </div>

        <div class="modal-actions">
            <button class="btn-delete" id="btn-delete-quote">이 문장 지우기</button>
        </div>
    </div>
</div>

<!-- Toast Notification -->
<div class="toast" id="toast-msg">조각이 안전하게 담겼어요!</div>

<script>
    // --- State Management ---
    let quotes = [];
    let currentFilter = '전체';
    let currentOpenQuoteId = null;
    let draftTags = [];

    // --- DOM Elements ---
    const form = document.getElementById('quote-form');
    const grid = document.getElementById('quotes-grid');
    const filterContainer = document.getElementById('filter-container');
    const tagInput = document.getElementById('tag-input');
    const draftTagsList = document.getElementById('draft-tags-list');
    const modal = document.getElementById('quote-modal');
    const modalCloseBtn = document.getElementById('modal-close');
    const btnDelete = document.getElementById('btn-delete-quote');
    const toast = document.getElementById('toast-msg');

    // --- Initialization ---
    function init() {
        loadQuotes();
        renderFilters();
        renderQuotes();
        setupEventListeners();
    }

    // --- Data Layer ---
    function loadQuotes() {
        const saved = localStorage.getItem('myQuotes');
        if (saved) {
            quotes = JSON.parse(saved);
            quotes = quotes.map(q => {
                if (!q.tags) q.tags = q.category ? [q.category] : [];
                return q;
            });
            quotes.sort((a, b) => b.timestamp - a.timestamp);
        }
    }

    function saveQuotes() {
        localStorage.setItem('myQuotes', JSON.stringify(quotes));
    }

    // --- Tag System ---
    function addDraftTag(text) {
        const tag = text.trim().replace(/^#/, '');
        if (tag && !draftTags.includes(tag)) {
            draftTags.push(tag);
            renderDraftTags();
        }
        tagInput.value = '';
    }

    function removeDraftTag(tagToRemove) {
        draftTags = draftTags.filter(tag => tag !== tagToRemove);
        renderDraftTags();
    }

    function renderDraftTags() {
        draftTagsList.innerHTML = '';
        draftTags.forEach(tag => {
            const tagEl = document.createElement('div');
            tagEl.className = 'draft-tag';
            tagEl.innerHTML = `
                    <span>#${tag}</span>
                    <span class="remove-tag" onclick="removeDraftTag('${tag}')">&times;</span>
                `;
            draftTagsList.appendChild(tagEl);
        });
        tagInput.placeholder = draftTags.length > 0 ? "태그 더 달기" : "#어울리는 태그를 달아주세요";
    }

    // --- Events ---
    function setupEventListeners() {
        form.addEventListener('submit', handleFormSubmit);

        tagInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ',') {
                e.preventDefault();
                addDraftTag(tagInput.value);
            } else if (e.key === 'Backspace' && tagInput.value === '' && draftTags.length > 0) {
                draftTags.pop();
                renderDraftTags();
            }
        });

        modalCloseBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        btnDelete.addEventListener('click', () => {
            if(currentOpenQuoteId && confirm('이 문장을 보관함에서 지우시겠어요? 🥲')) {
                deleteQuote(currentOpenQuoteId);
                closeModal();
                showToast('문장 조각이 지워졌어요.');
            }
        });
    }

    // --- Action Handlers ---
    function handleFormSubmit(e) {
        e.preventDefault();

        if (tagInput.value.trim() !== '') addDraftTag(tagInput.value);

        const text = document.getElementById('quote-text').value.trim();
        const source = document.getElementById('quote-source').value.trim() || '출처 미상';
        const thought = document.getElementById('quote-thought').value.trim();

        if (!text) return;

        const newQuote = {
            id: Date.now().toString(),
            text,
            tags: [...draftTags],
            source,
            thought,
            timestamp: Date.now(),
            dateStr: new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' })
        };

        quotes.unshift(newQuote);
        saveQuotes();

        draftTags = [];
        renderDraftTags();
        form.reset();

        renderFilters();
        renderQuotes();
        showToast('새로운 문장 조각이 담겼어요! ✨');
    }

    function deleteQuote(id) {
        quotes = quotes.filter(q => q.id !== id);
        saveQuotes();
        renderFilters();
        renderQuotes();
    }

    function pickRandomQuote() {
        if (quotes.length === 0) {
            showToast('아직 기록된 문장이 없어요 🥲');
            return;
        }
        const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
        openModal(randomQuote);
    }

    // --- Rendering ---
    function getUniqueTags() {
        const tagSet = new Set();
        quotes.forEach(q => {
            if(q.tags) q.tags.forEach(t => tagSet.add(t));
        });
        return Array.from(tagSet).sort();
    }

    function renderFilters() {
        const uniqueTags = getUniqueTags();
        filterContainer.innerHTML = '';

        // [신규 기능] 우연히 꺼내보기 버튼
        const randomBtn = document.createElement('button');
        randomBtn.className = 'filter-btn special-btn';
        randomBtn.innerHTML = '🎲 문장 랜덤 뽑기';
        randomBtn.addEventListener('click', pickRandomQuote);
        filterContainer.appendChild(randomBtn);

        // 전체 보기 버튼
        const allBtn = document.createElement('button');
        allBtn.className = `filter-btn ${currentFilter === '전체' ? 'active' : ''}`;
        allBtn.innerText = '모든 조각';
        allBtn.addEventListener('click', () => setFilter('전체'));
        filterContainer.appendChild(allBtn);

        // 동적 태그 버튼들
        uniqueTags.forEach(tag => {
            const btn = document.createElement('button');
            btn.className = `filter-btn ${currentFilter === tag ? 'active' : ''}`;
            btn.innerText = `#${tag}`;
            btn.addEventListener('click', () => setFilter(tag));
            filterContainer.appendChild(btn);
        });
    }

    function setFilter(filter) {
        currentFilter = filter;
        renderFilters();
        renderQuotes();
    }

    function renderQuotes() {
        grid.innerHTML = '';

        const filteredQuotes = currentFilter === '전체'
            ? quotes
            : quotes.filter(q => q.tags && q.tags.includes(currentFilter));

        if (filteredQuotes.length === 0) {
            grid.innerHTML = `
                    <div class="empty-state">
                        <p>텅 비어있어요 🥲</p>
                        <p style="font-size: 1.1rem; margin-top: 10px; color: var(--text-secondary); font-family: var(--font-main);">
                            ${currentFilter === '전체' ? '당신의 마음을 흔든 첫 번째 문장을 남겨주세요!' : '이 태그에 해당하는 문장이 없네요.'}
                        </p>
                    </div>
                `;
            return;
        }

        filteredQuotes.forEach(quote => {
            const card = document.createElement('div');
            card.className = 'quote-card';

            let tagsHtml = '';
            if(quote.tags && quote.tags.length > 0) {
                tagsHtml = `<div class="card-tags">
                        ${quote.tags.map(t => `<span class="card-tag">#${t}</span>`).join('')}
                    </div>`;
            }

            card.innerHTML = `
                    ${tagsHtml}
                    <div class="card-quote">"${quote.text.replace(/\n/g, '<br>')}"</div>
                    <div class="card-footer">
                        <span class="card-source">${quote.source !== '출처 미상' ? quote.source : ''}</span>
                    </div>
                `;

            card.addEventListener('click', () => openModal(quote));
            grid.appendChild(card);
        });
    }

    // --- Modal & UI Effects ---
    function openModal(quote) {
        currentOpenQuoteId = quote.id;

        const tagsDisplay = document.getElementById('modal-tags-display');
        tagsDisplay.innerHTML = quote.tags && quote.tags.length > 0
            ? quote.tags.map(t => `<span class="card-tag">#${t}</span>`).join('')
            : '';

        document.getElementById('modal-quote-text').innerHTML = `"${quote.text.replace(/\n/g, '<br>')}"`;
        document.getElementById('modal-source-text').innerText = quote.source;
        document.getElementById('modal-date-text').innerText = quote.dateStr;

        const thoughtSection = document.getElementById('modal-thought-section');
        const thoughtText = document.getElementById('modal-thought-text');

        if (quote.thought) {
            thoughtSection.style.display = 'block';
            thoughtText.innerText = quote.thought;
        } else {
            thoughtSection.style.display = 'none';
        }

        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        modal.classList.remove('active');
        currentOpenQuoteId = null;
        document.body.style.overflow = '';
    }

    function showToast(message) {
        toast.innerText = message;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    // Run app
    init();
</script>
</body>
</html>
