<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>쇼핑 타이머 - 현명한 소비의 시작</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');

      body {
        font-family: 'Pretendard', sans-serif;
        background-color: #f8fafc;
      }

      .timer-card {
        transition: transform 0.2s;
      }

      .timer-card:hover {
        transform: translateY(-2px);
      }

      .progress-bar {
        transition: width 1s linear;
      }

      /* 알림 메시지 스타일 */
      #notification-container {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 1000;
      }
    </style>
  </head>
  <body class="p-4 md:p-8">
    <div id="notification-container"></div>

    <div class="max-w-2xl mx-auto">
      <!-- 헤더 -->
      <header class="mb-8 text-center">
        <h1 class="text-3xl font-bold text-slate-800 mb-2">
          <i class="fas fa-hourglass-half text-blue-600 mr-2"></i>쇼핑 타이머
        </h1>
        <p class="text-slate-500">
          충동구매 전 충분한 여유, 정말 필요한 물건인가요?
        </p>
      </header>

      <!-- 대시보드 (절약 금액) -->
      <div
        class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 mb-8 flex items-center justify-between"
      >
        <div>
          <p class="text-sm text-slate-500 mb-1">
            지금까지 참아내어 절약한 금액
          </p>
          <h2 id="total-saved" class="text-2xl font-bold text-green-600">
            0원
          </h2>
        </div>
        <div class="bg-green-100 p-4 rounded-full">
          <i class="fas fa-piggy-bank text-green-600 text-2xl"></i>
        </div>
      </div>

      <!-- 상품 등록 폼 -->
      <section
        class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 mb-8"
      >
        <h3 class="text-lg font-bold mb-4 flex items-center">
          <i class="fas fa-plus-circle mr-2 text-blue-500"></i>새 상품 등록
        </h3>
        <div class="space-y-4">
          <input
            type="text"
            id="item-name"
            placeholder="상품 이름 (예: 빈티지 오버핏 셔츠)"
            class="w-full p-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
          <input
            type="url"
            id="item-link"
            placeholder="상품 링크 (URL)"
            class="w-full p-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
          <input
            type="number"
            id="item-price"
            placeholder="가격 (원)"
            class="w-full p-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />

          <div class="space-y-2">
            <label class="text-sm font-semibold text-slate-600 ml-1"
              >고민할 시간 설정</label
            >
            <div class="grid grid-cols-2 gap-4">
              <div class="relative">
                <input
                  type="number"
                  id="item-hours"
                  placeholder="0"
                  min="0"
                  value="48"
                  class="w-full p-3 pr-12 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
                <span class="absolute right-4 top-3.5 text-slate-400"
                  >시간</span
                >
              </div>
              <div class="relative">
                <input
                  type="number"
                  id="item-minutes"
                  placeholder="0"
                  min="0"
                  max="59"
                  value="0"
                  class="w-full p-3 pr-12 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
                <span class="absolute right-4 top-3.5 text-slate-400">분</span>
              </div>
            </div>
          </div>

          <button
            onclick="addItem()"
            class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition duration-200"
          >
            고민 시작하기
          </button>
        </div>
      </section>

      <!-- 타이머 리스트 -->
      <section>
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-bold">고민 중인 상품들</h3>
          <span
            id="active-count"
            class="bg-blue-100 text-blue-600 text-xs font-bold px-2.5 py-0.5 rounded-full"
            >0</span
          >
        </div>
        <div id="items-list" class="space-y-4">
          <!-- 아이템들이 여기에 렌더링됩니다 -->
        </div>
      </section>
    </div>

    <script>
      let items = JSON.parse(localStorage.getItem('shoppingTimer_items')) || [];
      let totalSaved =
        parseInt(localStorage.getItem('shoppingTimer_saved')) || 0;

      function updateStorage() {
        localStorage.setItem('shoppingTimer_items', JSON.stringify(items));
        localStorage.setItem('shoppingTimer_saved', totalSaved.toString());
        render();
      }

      function showMessage(msg, type = 'info') {
        const container = document.getElementById('notification-container');
        const toast = document.createElement('div');
        const bgColor =
          type === 'success'
            ? 'bg-green-500'
            : type === 'error'
              ? 'bg-red-500'
              : 'bg-blue-500';

        toast.className = `${bgColor} text-white px-6 py-3 rounded-xl shadow-lg mb-2 animate-bounce flex items-center`;
        toast.innerHTML = `<i class="fas fa-info-circle mr-2"></i> ${msg}`;

        container.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transition = '0.5s';
          setTimeout(() => toast.remove(), 500);
        }, 3000);
      }

      function addItem() {
        const name = document.getElementById('item-name').value;
        const link = document.getElementById('item-link').value;
        const price = parseInt(document.getElementById('item-price').value);
        const hours =
          parseInt(document.getElementById('item-hours').value) || 0;
        const minutes =
          parseInt(document.getElementById('item-minutes').value) || 0;

        if (!name || !link || isNaN(price)) {
          showMessage('모든 정보를 정확히 입력해주세요.', 'error');
          return;
        }

        if (hours === 0 && minutes === 0) {
          showMessage('고민할 시간을 설정해주세요.', 'error');
          return;
        }

        const totalMs = hours * 3600 * 1000 + minutes * 60 * 1000;

        const newItem = {
          id: Date.now(),
          name,
          link,
          price,
          duration: totalMs,
          createdAt: Date.now(),
          expiresAt: Date.now() + totalMs,
          notified: false,
        };

        items.push(newItem);

        // 입력 필드 초기화
        document.getElementById('item-name').value = '';
        document.getElementById('item-link').value = '';
        document.getElementById('item-price').value = '';
        document.getElementById('item-hours').value = '48';
        document.getElementById('item-minutes').value = '0';

        updateStorage();
        showMessage('타이머가 시작되었습니다. 신중하게 고민해보세요!');
      }

      function deleteItem(id, isRegret = false) {
        const item = items.find((i) => i.id === id);
        if (isRegret) {
          totalSaved += item.price;
          showMessage(
            `멋져요! ${item.price.toLocaleString()}원을 절약하셨습니다.`,
            'success',
          );
        }
        items = items.filter((i) => i.id !== id);
        updateStorage();
      }

      function openLink(id) {
        const item = items.find((i) => i.id === id);
        if (Date.now() < item.expiresAt) {
          showMessage('아직 고민 시간이 끝나지 않았습니다!', 'error');
          return;
        }
        window.open(item.link, '_blank');
      }

      function formatTime(ms) {
        if (ms <= 0) return '시간 종료';
        const totalSeconds = Math.floor(ms / 1000);
        const days = Math.floor(totalSeconds / 86400);
        const hours = Math.floor((totalSeconds % 86400) / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        let result = '';
        if (days > 0) result += `${days}일 `;
        if (hours > 0 || days > 0) result += `${hours}시간 `;
        result += `${minutes}분 ${seconds}초`;
        return result;
      }

      function render() {
        const listElement = document.getElementById('items-list');
        const activeCountElement = document.getElementById('active-count');
        const totalSavedElement = document.getElementById('total-saved');

        totalSavedElement.innerText = `${totalSaved.toLocaleString()}원`;
        activeCountElement.innerText = items.length;

        if (items.length === 0) {
          listElement.innerHTML = `
                    <div class="text-center py-12 text-slate-400">
                        <i class="fas fa-ghost text-4xl mb-3 block"></i>
                        고민 중인 상품이 없습니다.
                    </div>
                `;
          return;
        }

        listElement.innerHTML = items
          .map((item) => {
            const now = Date.now();
            const timeLeft = item.expiresAt - now;
            const isExpired = timeLeft <= 0;
            const progress = Math.min(
              100,
              ((now - item.createdAt) / item.duration) * 100,
            );

            if (isExpired && !item.notified) {
              item.notified = true;
              showMessage(
                `[알림] '${item.name}'의 고민 시간이 끝났습니다!`,
                'success',
              );
              if (Notification.permission === 'granted') {
                new Notification('쇼핑 타이머 종료', {
                  body: `'${item.name}'을(를) 이제 구매할 수 있습니다.`,
                });
              }
            }

            return `
                    <div class="timer-card bg-white rounded-2xl p-5 shadow-sm border border-slate-200 overflow-hidden">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <h4 class="font-bold text-slate-800 text-lg">${item.name}</h4>
                                <p class="text-blue-600 font-semibold">${item.price.toLocaleString()}원</p>
                            </div>
                            <button onclick="deleteItem(${item.id}, true)" class="text-slate-400 hover:text-red-500 transition" title="구매 포기하기">
                                <i class="fas fa-times text-xl"></i>
                            </button>
                        </div>
                        
                        <div class="mb-4">
                            <div class="flex justify-between text-xs text-slate-500 mb-1">
                                <span>${isExpired ? '고민 완료!' : '남은 시간: ' + formatTime(timeLeft)}</span>
                                <span>${Math.round(progress)}%</span>
                            </div>
                            <div class="w-full bg-slate-100 rounded-full h-2">
                                <div class="progress-bar ${isExpired ? 'bg-green-500' : 'bg-blue-500'} h-2 rounded-full" style="width: ${progress}%"></div>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <button onclick="deleteItem(${item.id}, true)" class="py-2.5 rounded-xl border border-slate-200 text-slate-600 font-medium hover:bg-slate-50 transition">
                                <i class="fas fa-heart-crack mr-1"></i> 안 살래요
                            </button>
                            <button 
                                onclick="openLink(${item.id})" 
                                ${!isExpired ? 'disabled' : ''} 
                                class="py-2.5 rounded-xl font-bold transition flex items-center justify-center
                                ${isExpired ? 'bg-blue-600 text-white hover:bg-blue-700' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}">
                                <i class="fas fa-shopping-cart mr-2"></i> ${isExpired ? '구매하기' : '대기 중'}
                            </button>
                        </div>
                    </div>
                `;
          })
          .join('');
      }

      setInterval(render, 1000);

      window.onload = () => {
        render();
        if (
          Notification.permission !== 'granted' &&
          Notification.permission !== 'denied'
        ) {
          Notification.requestPermission();
        }
      };
    </script>
  </body>
</html>
