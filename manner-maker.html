<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매너 메이커 - 레트로 에디션</title>
    <!-- Tailwind CSS for utility styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @font-face {
            font-family: 'Gulim';
            src: local('Gulim'), local('Dotum');
        }
        body {
            font-family: 'Gulim', 'Dotum', sans-serif;
            background-color: #008080;
            user-select: none;
            overflow: hidden;
        }
        .win95-shadow {
            box-shadow: 1px 1px 0px rgba(0,0,0,1);
        }
        .win95-border {
            border-top: 2px solid white;
            border-left: 2px solid white;
            border-right: 2px solid #808080;
            border-bottom: 2px solid #808080;
        }
        .win95-border-inset {
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid white;
            border-bottom: 2px solid white;
            background-color: white;
        }
        .win95-button:active {
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid white;
            border-bottom: 2px solid white;
            padding-top: 3px;
            padding-left: 3px;
        }
        .active-tab {
            background-color: #000080 !important;
            color: white !important;
            font-weight: bold;
        }
        @keyframes load {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(350%); }
        }
        .loading-bar-anim {
            animation: load 2s infinite;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="p-3">
    <div id="app" class="max-w-md mx-auto flex flex-col h-full min-h-screen pb-12">
        <!-- 상단 뒤로가기 버튼 (결과 페이지 전용) -->
        <div id="back-nav" class="hidden mb-2">
            <button onclick="changeStep(1)" class="win95-border win95-button bg-[#c0c0c0] px-3 py-1.5 text-[11px] font-bold flex items-center gap-1">
                <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i> 전체 뒤로가기
            </button>
        </div>

        <!-- 메인 윈도우 -->
        <div class="win95-border win95-shadow bg-[#c0c0c0] flex-1 flex flex-col overflow-hidden">
            <!-- 타이틀 바 -->
            <div class="bg-[#000080] px-2 py-0.5 flex items-center justify-between">
                <div class="flex items-center gap-1">
                    <i data-lucide="monitor" class="w-3.5 h-3.5 text-white"></i>
                    <span id="win-title" class="text-white text-[11px] font-bold">매너 메이커 v2.3</span>
                </div>
                <div class="flex gap-0.5 opacity-30">
                    <div class="w-4 h-4 bg-[#c0c0c0] border border-white"></div>
                    <div class="w-4 h-4 bg-[#c0c0c0] border border-white"></div>
                </div>
            </div>

            <!-- 콘텐츠 영역 -->
            <div id="content" class="p-2 overflow-y-auto h-full flex flex-col">
                <!-- STEP 1: 입력 화면 -->
                <div id="step-1" class="space-y-1">
                    <div class="flex items-start gap-2 bg-white win95-border-inset p-2 mb-1">
                        <i data-lucide="alert-triangle" class="w-6 h-6 text-yellow-500 shrink-0"></i>
                        <div class="text-[10px] leading-tight">
                            <p class="font-bold text-[#800000]">알림: 정중한 소통 가이드</p>
                            <p>예의를 갖춘 답변으로 원만한 관계를 유지하세요.</p>
                        </div>
                    </div>

                    <!-- 01. 사건 유형 -->
                    <fieldset class="relative mt-3 mb-3 border-2 border-white border-t-[#808080] border-l-[#808080] p-3 pt-4">
                        <legend class="absolute -top-2 left-2 bg-[#c0c0c0] px-1 text-[10px] font-bold flex items-center gap-1">
                            <i data-lucide="file-text" class="w-3 h-3"></i> 01. 사건 유형
                        </legend>
                        <div id="category-grid" class="grid grid-cols-3 gap-1">
                            <!-- JS에서 렌더링 -->
                        </div>
                        <div id="subject-grid" class="flex gap-1 mt-2">
                            <!-- JS에서 렌더링 -->
                        </div>
                    </fieldset>

                    <!-- 02. 대상 및 관계 -->
                    <fieldset class="relative mt-3 mb-3 border-2 border-white border-t-[#808080] border-l-[#808080] p-3 pt-4">
                        <legend class="absolute -top-2 left-2 bg-[#c0c0c0] px-1 text-[10px] font-bold flex items-center gap-1">
                            <i data-lucide="user" class="w-3 h-3"></i> 02. 대상 및 관계
                        </legend>
                        <div id="relation-grid" class="grid grid-cols-3 gap-1 mb-2">
                            <!-- JS에서 렌더링 -->
                        </div>
                        <input type="text" id="recipientName" placeholder="대상 이름 (필수 아님)" class="win95-border-inset w-full px-2 py-1.5 text-[12px] outline-none">
                    </fieldset>

                    <!-- 03. 상세 정황 -->
                    <fieldset class="relative mt-3 mb-3 border-2 border-white border-t-[#808080] border-l-[#808080] p-3 pt-4">
                        <legend class="absolute -top-2 left-2 bg-[#c0c0c0] px-1 text-[10px] font-bold flex items-center gap-1">
                            <i data-lucide="message-square" class="w-3 h-3"></i> 03. 상세 정황
                        </legend>
                        <div id="quick-situations" class="flex flex-wrap gap-1 mb-2">
                            <!-- JS에서 렌더링 -->
                        </div>
                        <textarea id="additionalInfo" placeholder="추가 상황을 입력하세요..." class="win95-border-inset w-full px-2 py-1.5 text-[11px] h-12 outline-none resize-none"></textarea>
                    </fieldset>

                    <button onclick="handleGenerate()" class="win95-border win95-button w-full bg-[#c0c0c0] py-2.5 text-[13px] font-bold flex items-center justify-center gap-2 mt-2">
                        문구 생성 실행(G)
                    </button>
                </div>

                <!-- STEP 2: 결과 화면 -->
                <div id="step-2" class="hidden flex flex-col gap-3">
                    <div id="loading-ui" class="py-16 flex flex-col items-center justify-center gap-4">
                        <div class="w-48 bg-white border-2 border-[#808080] border-t-black border-l-black h-5 relative overflow-hidden">
                            <div class="absolute top-0 left-0 h-full bg-[#000080] loading-bar-anim" style="width: 30%;"></div>
                        </div>
                        <p id="loading-text" class="text-[10px] font-bold text-[#404040]">시스템 부팅 중...</p>
                    </div>

                    <div id="result-ui" class="hidden flex flex-col gap-3">
                        <div class="flex items-center justify-between gap-1 border-b border-[#808080] pb-2 overflow-x-auto no-scrollbar">
                            <div id="tabs-container" class="flex gap-1"></div>
                        </div>
                        <div class="win95-border-inset p-3 min-h-[140px] relative">
                            <div class="absolute -top-1.5 -right-1.5 rotate-12 bg-yellow-300 border border-black px-1.5 py-0.5 text-[9px] font-bold shadow-sm">추천 문구</div>
                            <div id="message-content" class="text-[13px] leading-relaxed break-all font-medium text-black"></div>
                        </div>
                        <button onclick="copyCurrentMessage()" class="win95-border win95-button w-full py-3 text-[13px] font-bold flex items-center justify-center gap-2">
                            <i data-lucide="copy" class="w-4 h-4"></i> 클립보드 복사
                        </button>

                        <!-- 수정 요청 -->
                        <fieldset class="relative mt-3 mb-3 border-2 border-white border-t-[#808080] border-l-[#808080] p-3 pt-4">
                            <legend class="absolute -top-2 left-2 bg-[#c0c0c0] px-1 text-[10px] font-bold flex items-center gap-1">
                                <i data-lucide="refresh-cw" class="w-3 h-3"></i> 수정 요청 (Debug)
                            </legend>
                            <div class="space-y-3">
                                <div class="flex items-center justify-between">
                                    <span class="text-[10px] font-bold text-slate-500">지시 사항</span>
                                    <div class="flex gap-1">
                                        <button onclick="setLength('짧게')" class="len-btn px-2 py-0.5 text-[10px] border border-[#808080] bg-white">짧게</button>
                                        <button onclick="setLength('길게')" class="len-btn px-2 py-0.5 text-[10px] border border-[#808080] bg-white">길게</button>
                                    </div>
                                </div>
                                <div class="flex gap-1">
                                    <input type="text" id="retryInput" placeholder="예: 조금 더 정중하게..." class="win95-border-inset flex-1 px-2 py-1.5 text-[11px] outline-none">
                                    <button onclick="handleGenerate(true)" class="win95-border win95-button px-3 bg-[#c0c0c0] text-[11px] font-bold">실행</button>
                                </div>
                            </div>
                        </fieldset>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 하단 태스크바 -->
    <div class="fixed bottom-0 left-0 w-full bg-[#c0c0c0] border-t-2 border-white px-1.5 py-1 flex items-center justify-between z-50">
        <button class="win95-border win95-button flex items-center gap-1.5 px-2.5 py-1 bg-[#c0c0c0]">
            <div class="bg-[#000080] w-3.5 h-3.5 flex items-center justify-center">
                <i data-lucide="monitor" class="text-white w-2.5 h-2.5"></i>
            </div>
            <span class="text-[12px] font-black italic tracking-tighter">Start</span>
        </button>
        <div id="clock" class="px-2 win95-border-inset bg-[#c0c0c0] text-[11px] font-bold">00:00</div>
    </div>

    <!-- 토스트 알림 -->
    <div id="toast" class="hidden fixed inset-0 flex items-center justify-center z-[100] bg-black/20 backdrop-blur-[1px]">
        <div class="win95-border win95-shadow bg-[#c0c0c0] w-[220px] p-2">
            <div class="bg-[#000080] px-2 py-0.5 text-white text-[10px] font-bold">알림</div>
            <div class="text-center py-4">
                <p class="text-[12px] font-bold mb-3">복사되었습니다!</p>
                <button onclick="closeToast()" class="win95-border win95-button px-6 py-1.5 bg-[#c0c0c0] text-[11px] font-bold">확인</button>
            </div>
        </div>
    </div>

    <script>
        const CATEGORIES = [
            { id: 'wedding', label: '결혼', emoji: '💍' },
            { id: 'condolence', label: '부고', emoji: '🕯️' },
            { id: 'first_birthday', label: '돌잔치', emoji: '🍼' },
            { id: 'promotion', label: '승진', emoji: '🏆' },
            { id: 'opening', label: '개업', emoji: '🎊' },
            { id: 'birthday', label: '생일', emoji: '🎂' },
        ];
        const RELATIONS = [
            { id: 'boss', label: '부장님' },
            { id: 'colleague', label: '옆자리' },
            { id: 'friend', label: '10년지기' },
            { id: 'casual', label: '어색사이' },
            { id: 'family', label: '혈육' },
        ];
        const QUICK_SITUATIONS = ["축의금만 보냄", "직접 참석", "바빠서 못 감", "오랜만의 연락"];
        const SUBJECTS = [{ id: 'target', label: '그쪽 소식' }, { id: 'me', label: '내 홍보물' }];
        const LOADING_TEXTS = ["시스템 부팅 중...", "메모리 정리 중...", "정중한 문장 생성 중...", "데이터 조회 중..."];

        let selection = { category: '', relation: '', subject: 'target', additionalInfo: '', recipientName: '' };
        let lengthOption = null;
        let currentMessages = [];
        let activeTabIndex = 0;

        // 초기화
        window.onload = () => {
            renderGrids();
            updateClock();
            setInterval(updateClock, 1000);
            lucide.createIcons();
        };

        function renderGrids() {
            // Category Grid
            const catGrid = document.getElementById('category-grid');
            catGrid.innerHTML = CATEGORIES.map(cat => `
                <button onclick="selectCategory('${cat.id}')" id="cat-${cat.id}" class="py-1.5 text-[10px] win95-border bg-[#c0c0c0] active:bg-[#e0e0e0]">
                    ${cat.emoji} ${cat.label}
                </button>
            `).join('');

            // Subject Grid
            const subGrid = document.getElementById('subject-grid');
            subGrid.innerHTML = SUBJECTS.map(sub => `
                <button onclick="selectSubject('${sub.id}')" id="sub-${sub.id}" class="flex-1 py-1 text-[9px] win95-border ${selection.subject === sub.id ? 'active-tab' : 'bg-[#c0c0c0]'}">
                    ${sub.label}
                </button>
            `).join('');

            // Relation Grid
            const relGrid = document.getElementById('relation-grid');
            relGrid.innerHTML = RELATIONS.map(rel => `
                <button onclick="selectRelation('${rel.id}')" id="rel-${rel.id}" class="px-1 py-1 text-[10px] win95-border bg-[#c0c0c0]">
                    ${rel.label}
                </button>
            `).join('');

            // Quick Situations
            const quickSit = document.getElementById('quick-situations');
            quickSit.innerHTML = QUICK_SITUATIONS.map(sit => `
                <button onclick="setQuickSituation('${sit}')" class="px-1.5 py-0.5 bg-white border border-[#808080] text-[9px] hover:bg-slate-100">${sit}</button>
            `).join('');
        }

        function selectCategory(id) {
            selection.category = id;
            CATEGORIES.forEach(c => {
                document.getElementById(`cat-${c.id}`).classList.remove('active-tab', 'win95-border-inset');
                document.getElementById(`cat-${c.id}`).classList.add('win95-border');
            });
            document.getElementById(`cat-${id}`).classList.add('active-tab', 'win95-border-inset');
        }

        function selectSubject(id) {
            selection.subject = id;
            SUBJECTS.forEach(s => document.getElementById(`sub-${s.id}`).classList.remove('active-tab'));
            document.getElementById(`sub-${id}`).classList.add('active-tab');
        }

        function selectRelation(id) {
            selection.relation = id;
            RELATIONS.forEach(r => document.getElementById(`rel-${r.id}`).classList.remove('active-tab'));
            document.getElementById(`rel-${id}`).classList.add('active-tab');
        }

        function setQuickSituation(text) {
            selection.additionalInfo = text;
            document.getElementById('additionalInfo').value = text;
        }

        function setLength(opt) {
            lengthOption = lengthOption === opt ? null : opt;
            document.querySelectorAll('.len-btn').forEach(btn => {
                btn.classList.remove('active-tab');
                if(btn.innerText === lengthOption) btn.classList.add('active-tab');
            });
        }

        function changeStep(step) {
            if(step === 1) {
                document.getElementById('step-1').classList.remove('hidden');
                document.getElementById('step-2').classList.add('hidden');
                document.getElementById('back-nav').classList.add('hidden');
            } else {
                document.getElementById('step-1').classList.add('hidden');
                document.getElementById('step-2').classList.remove('hidden');
                document.getElementById('back-nav').classList.remove('hidden');
            }
        }

        async function handleGenerate(isRetry = false) {
            if (!selection.category || !selection.relation) return;
            
            selection.recipientName = document.getElementById('recipientName').value;
            selection.additionalInfo = document.getElementById('additionalInfo').value;

            changeStep(2);
            document.getElementById('loading-ui').classList.remove('hidden');
            document.getElementById('result-ui').classList.add('hidden');

            const loadingInterval = setInterval(() => {
                document.getElementById('loading-text').innerText = LOADING_TEXTS[Math.floor(Math.random() * LOADING_TEXTS.length)];
            }, 1000);

            const apiKey = ""; // Runtime provides key
            const combinedRetry = isRetry ? `${lengthOption || ''} ${document.getElementById('retryInput').value}` : "";
            
            const systemPrompt = `당신은 예의 바른 문장을 작성하는 전문가입니다. 상황에 맞는 3가지 버전(정중함99%, 진심1%, 이모티콘)의 문구를 JSON 형식으로 응답하세요. { "messages": [ { "type": "정중함99%", "content": "..." }, ... ] }`;
            const userQuery = isRetry ? `피드백 반영: ${combinedRetry}` : `${selection.subject}의 ${selection.category} 상황, ${selection.relation}에게 보낼 문구. 이름: ${selection.recipientName}, 추가정보: ${selection.additionalInfo}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userQuery }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                const result = await response.json();
                const data = JSON.parse(result.candidates[0].content.parts[0].text);
                currentMessages = data.messages;
                renderResults();
            } catch (error) {
                console.error(error);
                document.getElementById('message-content').innerText = "오류가 발생했습니다. 다시 시도해주세요.";
            } finally {
                clearInterval(loadingInterval);
                document.getElementById('loading-ui').classList.add('hidden');
                document.getElementById('result-ui').classList.remove('hidden');
            }
        }

        function renderResults() {
            const tabs = document.getElementById('tabs-container');
            tabs.innerHTML = currentMessages.map((msg, idx) => `
                <button onclick="setActiveTab(${idx})" class="tab-btn px-3 py-1 text-[10px] win95-border ${idx === activeTabIndex ? 'active-tab' : 'bg-[#c0c0c0]'}">
                    ${msg.type}
                </button>
            `).join('');
            document.getElementById('message-content').innerText = currentMessages[activeTabIndex].content;
        }

        function setActiveTab(idx) {
            activeTabIndex = idx;
            renderResults();
        }

        function copyCurrentMessage() {
            const text = currentMessages[activeTabIndex].content;
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            document.getElementById('toast').classList.remove('hidden');
        }

        function closeToast() {
            document.getElementById('toast').classList.add('hidden');
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
    </script>
</body>
</html>
