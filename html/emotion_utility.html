<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>감정의 정원 (Garden of Emotions)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');

        :root {
            --char-pink: #FFD1DC;
            --char-eye: #4A4E69;
            --garden-soil: #D2B48C;
            --sway-speed: 3s;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #fdf6f0;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: #4a4a4a;
        }

        #content-area {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            overflow-y: auto;
            padding: 32px 24px 120px 24px;
        }

        .page.active {
            display: flex;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* 캐릭터 디자인 수정: 이목구비 위치 및 대칭 최적화 */
        .char-container {
            width: 200px;
            height: 200px;
            background: var(--char-pink);
            border-radius: 50%;
            border: 6px solid white;
            box-shadow: 0 10px 25px rgba(255, 182, 193, 0.4);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .char-face-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: -10px; /* 얼굴 전체 위치 살짝 위로 */
        }

        .char-eyes {
            display: flex;
            gap: 40px;
            z-index: 10;
        }

        .char-eye {
            width: 14px;
            height: 14px;
            background: var(--char-eye);
            border-radius: 50%;
        }

        /* 입 모양: 중앙 정렬 및 대칭형 u자 */
        .char-mouth {
            width: 24px;
            height: 12px;
            border-bottom: 3.5px solid var(--char-eye);
            border-radius: 0 0 12px 12px;
            margin-top: 18px;
            z-index: 10;
        }

        /* 볼터치 위치 최적화 */
        .char-blush {
            position: absolute;
            width: 24px;
            height: 12px;
            background: rgba(255, 105, 180, 0.25);
            filter: blur(5px);
            border-radius: 50%;
            top: 8px; /* 눈 바로 아래쪽 */
        }
        .blush-left { left: -32px; }
        .blush-right { right: -32px; }

        /* 정원 텃밭 스타일 */
        .garden-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            background: #e3d5ca;
            padding: 16px;
            border-radius: 28px;
            box-shadow: inset 0 4px 12px rgba(0,0,0,0.08);
        }

        .garden-plot {
            aspect-ratio: 1/1;
            background: #d5bdaf;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 4px solid #b79d8d;
            transition: all 0.3s ease;
        }

        .plot-date {
            position: absolute;
            top: 4px;
            left: 5px;
            font-size: 9px;
            color: rgba(255,255,255,0.6);
            font-weight: 800;
        }

        /* 꽃 애니메이션 및 크기 */
        .flower-pop {
            font-size: 2.2rem;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.1));
            animation: sway var(--sway-speed) infinite ease-in-out;
            transform-origin: bottom center;
            z-index: 5;
        }

        .seed-pop {
            font-size: 1.4rem;
            opacity: 0.8;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes sway {
            0%, 100% { transform: rotate(-4deg) scale(1); }
            50% { transform: rotate(4deg) scale(1.15); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        /* 1년 전체보기 레이아웃 */
        .year-view-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding-bottom: 40px;
        }

        .mini-month-card {
            background: white;
            padding: 8px;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .mini-month-title {
            font-size: 10px;
            font-weight: 900;
            color: #bbb;
            margin-bottom: 4px;
            text-align: center;
        }

        .mini-garden-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
        }

        .mini-plot {
            aspect-ratio: 1/1;
            background: #f0f0f0;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 6px;
        }

        .mini-plot.has-flower { background: #ffe5ec; }
        .mini-plot.has-seed { background: #e8f5e9; }

        .month-selector {
            background: white;
            padding: 12px 20px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .nav-btn.active { color: #ff8aae; }
        .progress-fill { background: linear-gradient(90deg, #ffb7c5, #ff8aae); }

        .bouncing {
            animation: bounce 3s infinite ease-in-out;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-12px) scale(1.01); }
        }
    </style>
</head>
<body>

<div id="content-area">
    <!-- 1. 캐릭터 페이지 -->
    <div id="page-home" class="page active items-center">
        <div class="w-full flex justify-end mb-4">
            <button onclick="toggleModal('interaction-guide')" class="bg-white/80 p-3 rounded-2xl shadow-sm active:scale-90 transition">
                <i class="fas fa-magic text-pink-400"></i>
            </button>
        </div>

        <div class="text-center mb-10">
            <h1 class="text-3xl font-black text-gray-800 mb-2">오늘의 친구</h1>
            <p id="char-status-text" class="text-gray-400 font-medium italic">"얼굴을 예쁘게 다듬어봤어요!"</p>
        </div>

        <div class="relative flex-1 flex items-center justify-center mb-12">
            <div id="char-main-container" class="char-container bouncing" onclick="handleCharClick()">
                <div class="char-face-wrapper">
                    <div class="char-blush blush-left"></div>
                    <div class="char-blush blush-right"></div>
                    <div class="char-eyes">
                        <div class="char-eye"></div>
                        <div class="char-eye"></div>
                    </div>
                    <div id="char-mouth" class="char-mouth"></div>
                </div>
            </div>
            <div id="char-interaction-bubble" class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-full mb-8 bg-white px-5 py-3 rounded-2xl shadow-xl text-sm opacity-0 transition-all pointer-events-none z-50">
                안녕!
            </div>
        </div>

        <div class="w-full max-w-sm bg-white p-8 rounded-[40px] shadow-lg border border-pink-50 mb-6">
            <div class="flex justify-between items-end mb-3">
                <div class="flex flex-col">
                    <span class="text-[10px] text-gray-300 uppercase font-black mb-1">성장 등급</span>
                    <span id="display-role" class="text-xl font-black text-pink-400">초보 정원사</span>
                </div>
                <span id="display-level" class="text-lg font-black text-gray-200">LV.1</span>
            </div>
            <div class="progress-bar h-3 bg-gray-50 rounded-full overflow-hidden mb-6">
                <div id="display-exp-bar" class="progress-fill h-full w-0 transition-all duration-1000"></div>
            </div>
            <div class="flex gap-3">
                <button onclick="interact('pet')" class="flex-1 py-4 bg-pink-50 rounded-2xl text-sm font-bold text-pink-500 active:scale-95 transition">쓰다듬기</button>
                <button id="btn-talk" onclick="interact('talk')" class="flex-1 py-4 bg-gray-50 rounded-2xl text-sm font-bold text-gray-300 cursor-not-allowed">대화하기</button>
            </div>
        </div>
    </div>

    <!-- 2. 기록 페이지 -->
    <div id="page-journal" class="page">
        <div class="max-w-md mx-auto w-full">
            <div class="mb-8">
                <h2 class="text-3xl font-black text-gray-800 mb-2">마음 심기</h2>
                <p class="text-gray-400 font-medium">기록 후 일주일이 지나면 꽃이 피어납니다.</p>
            </div>

            <div class="bg-white p-8 rounded-[40px] shadow-sm border border-gray-100">
                    <textarea id="diary-input"
                              class="w-full h-56 p-5 rounded-3xl bg-gray-50 focus:bg-white focus:ring-4 focus:ring-pink-100 transition-all resize-none text-lg outline-none border-none mb-6"
                              placeholder="오늘 하루는 어땠나요?"></textarea>
                <button onclick="analyzeExperience()" id="analyze-btn"
                        class="w-full bg-gray-800 hover:bg-black text-white font-bold py-5 rounded-[28px] shadow-xl transition transform active:scale-95 flex items-center justify-center gap-3 text-lg">
                    <i class="fas fa-wand-sparkles text-pink-300"></i>
                    감정 분석하기
                </button>
            </div>
        </div>
    </div>

    <!-- 3. 정원 페이지 -->
    <div id="page-garden" class="page">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-3xl font-black text-gray-800">나의 정원</h2>
            <button onclick="toggleYearView()" id="view-toggle-btn" class="bg-white px-4 py-2 rounded-xl shadow-sm text-xs font-bold text-gray-500 transition active:scale-95">
                1년 전체 보기
            </button>
        </div>

        <div id="garden-content-area" class="flex-1 flex flex-col">
            <div id="month-view-controls">
                <div class="month-selector flex justify-between items-center">
                    <button onclick="changeMonth(-1)" class="text-gray-300 hover:text-gray-600 px-2"><i class="fas fa-chevron-left"></i></button>
                    <span id="current-month-display" class="font-black text-gray-700 text-lg">2024년 5월</span>
                    <button onclick="changeMonth(1)" class="text-gray-300 hover:text-gray-600 px-2"><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>

            <div id="garden-container" class="flex-1 overflow-y-auto">
                <!-- 그리드 렌더링 영역 -->
            </div>
        </div>
    </div>
</div>

<!-- Modals -->
<div id="selection-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center p-6 z-[200]">
    <div class="bg-white w-full max-w-sm p-8 rounded-[40px] shadow-2xl text-center">
        <h3 class="text-2xl font-bold mb-2">분석 완료</h3>
        <p class="text-xs text-gray-400 mb-6">텃밭에 씨앗을 심을 준비가 되었습니다.</p>
        <div id="flower-options" class="space-y-4"></div>
    </div>
</div>

<!-- Nav Bar -->
<nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-50 flex justify-around items-center px-4 z-[150] h-[90px]">
    <button onclick="navTo('home')" id="nav-home" class="nav-btn active flex flex-col items-center flex-1">
        <i class="fas fa-face-smile-beam text-2xl"></i>
        <span class="text-[10px] mt-1 font-black">캐릭터</span>
    </button>
    <button onclick="navTo('journal')" id="nav-journal" class="nav-btn flex flex-col items-center flex-1 text-gray-300">
        <i class="fas fa-feather text-2xl"></i>
        <span class="text-[10px] mt-1 font-black">경험기록</span>
    </button>
    <button onclick="navTo('garden')" id="nav-garden" class="nav-btn flex flex-col items-center flex-1 text-gray-300">
        <i class="fas fa-seedling text-2xl"></i>
        <span class="text-[10px] mt-1 font-black">나의정원</span>
    </button>
</nav>

<script type="module">
    const flowerDb = [
        { id: 'happy', name: '해바라기', emoji: '🌻' },
        { id: 'peace', name: '수국', emoji: '💠' },
        { id: 'tired', name: '라벤더', emoji: '🪻' },
        { id: 'passion', name: '장미', emoji: '🌹' },
        { id: 'sad', name: '안개꽃', emoji: '🌬️' },
        { id: 'excited', name: '작약', emoji: '🌸' }
    ];

    // --- 테스트를 위한 1월 더미 데이터 생성 함수 ---
    const generateDummyData = () => {
        const dummy = [];
        const year = 2024;
        // 1월 전체(1~31일)를 임의의 꽃으로 채움
        for(let d=1; d<=31; d++) {
            const dateStr = `${year}-01-${String(d).padStart(2, '0')}`;
            const randomFlower = flowerDb[Math.floor(Math.random() * flowerDb.length)];

            // 1일부터 24일까지는 이미 꽃이 핀 상태(7일 이상 경과), 25일부터 31일까지는 씨앗 상태로 설정
            const daysAgo = 31 - d + 2;
            const plantedAt = Date.now() - (daysAgo * 24 * 60 * 60 * 1000);

            dummy.push({
                date: dateStr,
                type: randomFlower.id,
                plantedAt: plantedAt
            });
        }
        return dummy;
    };

    // 초기 상태 설정 시 generateDummyData()를 바로 실행하여 flowers 배열에 할당
    const state = {
        level: 1,
        experience: 0,
        flowers: generateDummyData(),
        viewDate: new Date(2024, 0, 1), // 테스트를 위해 2024년 1월로 초기 보기 설정
        viewMode: 'month'
    };

    const apiKey = "";

    window.navTo = (pageId) => {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(`page-${pageId}`).classList.add('active');

        document.querySelectorAll('.nav-btn').forEach(b => {
            b.classList.remove('active', 'text-pink-400');
            b.classList.add('text-gray-300');
        });
        const activeBtn = document.getElementById(`nav-${pageId}`);
        if (activeBtn) {
            activeBtn.classList.add('active', 'text-pink-400');
            activeBtn.classList.remove('text-gray-300');
        }

        if (pageId === 'garden') renderGarden();
    };

    window.changeMonth = (val) => {
        state.viewDate.setMonth(state.viewDate.getMonth() + val);
        renderGarden();
    };

    window.toggleYearView = () => {
        state.viewMode = state.viewMode === 'month' ? 'year' : 'month';
        document.getElementById('view-toggle-btn').innerText = state.viewMode === 'month' ? '1년 전체 보기' : '월별 보기';
        document.getElementById('month-view-controls').style.display = state.viewMode === 'month' ? 'block' : 'none';
        renderGarden();
    };

    function renderGarden() {
        const container = document.getElementById('garden-container');
        container.innerHTML = '';

        if (state.viewMode === 'month') {
            renderMonth(state.viewDate, container);
            document.getElementById('current-month-display').innerText = `${state.viewDate.getFullYear()}년 ${state.viewDate.getMonth() + 1}월`;
        } else {
            renderYear(state.viewDate.getFullYear(), container);
        }
    }

    function isFullyGrown(plantedAt) {
        const SEVEN_DAYS_MS = 7 * 24 * 60 * 60 * 1000;
        return (Date.now() - plantedAt) >= SEVEN_DAYS_MS;
    }

    function renderMonth(date, parent) {
        const grid = document.createElement('div');
        grid.className = "garden-grid mb-10";

        const year = date.getFullYear();
        const month = date.getMonth();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 1; i <= daysInMonth; i++) {
            const dateStr = `${year}-${String(month+1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
            const flowerEntry = state.flowers.find(f => f.date === dateStr);

            const plot = document.createElement('div');
            plot.className = "garden-plot";
            plot.innerHTML = `<span class="plot-date">${i}</span>`;

            if (flowerEntry) {
                const info = flowerDb.find(d => d.id === flowerEntry.type);
                const grown = isFullyGrown(flowerEntry.plantedAt);

                if (grown) {
                    plot.innerHTML += `<span class="flower-pop">${info.emoji}</span>`;
                    plot.style.background = "#ffe5ec";
                } else {
                    plot.innerHTML += `<span class="seed-pop">🌱</span>`;
                    plot.style.background = "#e8f5e9";
                }
            }
            grid.appendChild(plot);
        }
        parent.appendChild(grid);
    }

    function renderYear(year, parent) {
        const yearGrid = document.createElement('div');
        yearGrid.className = "year-view-grid";

        for (let m = 0; m < 12; m++) {
            const monthCard = document.createElement('div');
            monthCard.className = "mini-month-card";
            monthCard.innerHTML = `<div class="mini-month-title">${m+1}월</div>`;

            const miniGrid = document.createElement('div');
            miniGrid.className = "mini-garden-grid";

            const daysInMonth = new Date(year, m + 1, 0).getDate();
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(m+1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const flowerEntry = state.flowers.find(f => f.date === dateStr);

                const miniPlot = document.createElement('div');
                miniPlot.className = "mini-plot";
                if (flowerEntry) {
                    const grown = isFullyGrown(flowerEntry.plantedAt);
                    if (grown) {
                        miniPlot.classList.add('has-flower');
                        miniPlot.innerText = flowerDb.find(f => f.id === flowerEntry.type).emoji;
                    } else {
                        miniPlot.classList.add('has-seed');
                        miniPlot.innerText = "🌱";
                    }
                }
                miniGrid.appendChild(miniPlot);
            }
            monthCard.appendChild(miniGrid);
            yearGrid.appendChild(monthCard);
        }
        parent.appendChild(yearGrid);
    }

    window.analyzeExperience = async () => {
        const input = document.getElementById('diary-input').value.trim();
        if (!input) return;

        const btn = document.getElementById('analyze-btn');
        btn.disabled = true;
        btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> 분석 중...`;

        try {
            const systemPrompt = `Analyze journal and suggest 3 flower IDs from: ${JSON.stringify(flowerDb)}. Return JSON: { "selections": [ { "id": "flower_id", "reason": "KR reason" } ] }`;
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: input }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    generationConfig: { responseMimeType: "application/json" }
                })
            });
            const data = await response.json();
            const res = JSON.parse(data.candidates[0].content.parts[0].text);
            showSelection(res.selections);
        } catch (e) {
            showSelection([{id:'happy', reason:'기분 좋은 하루였네요!'}]);
        } finally {
            btn.disabled = false;
            btn.innerHTML = `<i class="fas fa-wand-sparkles text-pink-300"></i> 감정 분석하기`;
        }
    };

    function showSelection(selections) {
        const container = document.getElementById('flower-options');
        container.innerHTML = '';
        selections.forEach(sel => {
            const flower = flowerDb.find(f => f.id === sel.id);
            const div = document.createElement('div');
            div.className = "p-5 border-2 border-gray-50 rounded-3xl hover:border-pink-300 cursor-pointer transition text-left active:scale-95";
            div.innerHTML = `<div class="flex items-center gap-4"><span class="text-3xl">${flower.emoji}</span><div><h4 class="font-black text-gray-800">${flower.name}</h4><p class="text-[10px] text-gray-400 mt-1">${sel.reason}</p></div></div>`;
            div.onclick = () => plantFlower(flower);
            container.appendChild(div);
        });
        document.getElementById('selection-modal').classList.remove('hidden');
    }

    function plantFlower(flower) {
        const today = new Date();
        const dateStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

        const existingIdx = state.flowers.findIndex(f => f.date === dateStr);
        if(existingIdx > -1) {
            state.flowers[existingIdx].type = flower.id;
            state.flowers[existingIdx].plantedAt = Date.now();
        } else {
            state.flowers.push({ date: dateStr, type: flower.id, plantedAt: Date.now() });
        }

        addExp(34);
        closeModal('selection-modal');
        document.getElementById('diary-input').value = '';
        navTo('garden');
    }

    window.interact = (type) => {
        if (type === 'pet') {
            showBubble("기분이 몽글몽글해요!");
            animateHeart();
        } else if (type === 'talk' && state.level >= 3) {
            showBubble("오늘 정원에 새 꽃이 필까요?");
        }
    };

    window.handleCharClick = () => interact('pet');

    function animateHeart() {
        const m = document.getElementById('char-mouth');
        m.style.borderBottom = "none";
        m.innerText = "❤️";
        m.style.fontSize = "12px";
        setTimeout(() => {
            m.innerText = "";
            m.style.borderBottom = "3.5px solid var(--char-eye)";
            m.style.fontSize = "0px";
        }, 1000);
    }

    function addExp(amount) {
        state.experience += amount;
        if (state.experience >= 100) {
            state.level++;
            state.experience %= 100;
            checkUnlocks();
            showBubble(`정원사 레벨업! LV.${state.level}`);
        }
        updateStats();
    }

    function updateStats() {
        document.getElementById('display-level').innerText = `LV.${state.level}`;
        document.getElementById('display-exp-bar').style.width = `${state.experience}%`;
        document.getElementById('display-role').innerText = state.level < 3 ? "초보 정원사" : "꿈꾸는 정원사";
    }

    function checkUnlocks() {
        if (state.level >= 3) {
            const btn = document.getElementById('btn-talk');
            btn.classList.remove('bg-gray-50', 'text-gray-300', 'cursor-not-allowed');
            btn.classList.add('bg-pink-100', 'text-pink-600');
            btn.innerText = "대화하기";
        }
    }

    function showBubble(text) {
        const b = document.getElementById('char-interaction-bubble');
        b.innerText = text;
        b.style.opacity = '1';
        b.style.transform = 'translate(-50%, -100%) translateY(-10px)';
        setTimeout(() => { b.style.opacity = '0'; b.style.transform = 'translate(-50%, -100%)'; }, 2500);
    }

    window.toggleModal = (id) => document.getElementById(`${id}-modal`).classList.remove('hidden');
    window.closeModal = (id) => document.getElementById(id).classList.add('hidden');

    updateStats();
    navTo('home');
</script>
</body>
</html>
