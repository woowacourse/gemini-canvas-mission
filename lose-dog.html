<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>져주개 - 강아지 자존감 지킴이</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 귀여운 픽셀 폰트 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/neodgm/neodgm-webfont@latest/neodgm/style.css"
    />
    <style>
      :root {
        --dark-text: #334155;
        --app-bg: #fff1f2;
        --primary: #fb7185;
        --border: #334155;
        --gauge-bg: #e2e8f0;
        --gauge-fill: #fcd34d;
      }

      body {
        font-family: 'NeoDunggeunmo', sans-serif;
        background-color: #ffffff;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        touch-action: manipulation;
        color: var(--dark-text);
      }

      #app-container {
        width: 100%;
        max-width: 420px;
        height: 100%;
        background-color: var(--app-bg);
        background-image: radial-gradient(#fda4af 2px, transparent 2px);
        background-size: 20px 20px;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        transition: background-color 0.2s;
      }

      @media (min-width: 420px) {
        #app-container {
          border-left: 4px solid var(--border);
          border-right: 4px solid var(--border);
        }
      }

      .cute-box {
        background: white;
        border: 3px solid var(--border);
        border-radius: 12px;
        box-shadow: 2px 2px 0 var(--border);
      }

      /* 자존감 게이지 */
      .esteem-container {
        width: 100%;
        height: 16px;
        background: var(--gauge-bg);
        border: 2px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
      }
      .esteem-fill {
        height: 100%;
        background: var(--gauge-fill);
        width: 0%;
        transition: width 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.1);
      }

      /* 버튼 스타일 */
      .action-btn {
        border: 3px solid var(--border);
        border-radius: 24px;
        box-shadow: 0 5px 0 var(--border);
        transition:
          transform 0.1s,
          box-shadow 0.1s;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      .action-btn:active:not(:disabled) {
        transform: translateY(5px);
        box-shadow: 0 0px 0 var(--border);
      }
      .action-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        filter: grayscale(100%);
      }

      .timer-container {
        border: 3px solid var(--border);
        border-radius: 16px;
        background: white;
        height: 18px;
        padding: 2px;
        box-shadow: 2px 2px 0 var(--border);
      }
      .timer-fill {
        height: 100%;
        background-color: var(--primary);
        border-radius: 8px;
        width: 100%;
      }

      /* 애니메이션 */
      .float {
        animation: float 2s ease-in-out infinite;
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      .pop-scale {
        animation: popScale 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)
          forwards;
      }
      @keyframes popScale {
        0% {
          transform: scale(0.2);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      .pop-up {
        animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
      @keyframes popUp {
        0% {
          transform: scale(0.2) translate(-20px, 20px) rotate(20deg);
          opacity: 0;
        }
        80% {
          transform: scale(1.1) translate(0, 0) rotate(-5deg);
          opacity: 1;
        }
        100% {
          transform: scale(1) translate(0, 0) rotate(0deg);
          opacity: 1;
        }
      }

      .text-flash {
        animation: flashText 0.6s ease-in-out forwards;
      }
      @keyframes flashText {
        0% {
          transform: translate(-50%, -50%) scale(0.5);
          opacity: 0;
        }
        20% {
          transform: translate(-50%, -50%) scale(1.2);
          opacity: 1;
        }
        100% {
          transform: translate(-50%, -50%) scale(1.5);
          opacity: 0;
        }
      }

      .bubble-tail::after {
        content: '';
        position: absolute;
        bottom: -8px;
        left: 50%;
        transform: translateX(-50%);
        border-width: 8px 8px 0;
        border-style: solid;
        border-color: var(--border) transparent transparent transparent;
      }
      .bubble-tail::before {
        content: '';
        position: absolute;
        bottom: -4px;
        left: 50%;
        transform: translateX(-50%);
        border-width: 6px 6px 0;
        border-style: solid;
        border-color: white transparent transparent transparent;
        z-index: 1;
      }

      /* 악세사리 (기본 게임 중에는 숨김) */
      .accessory {
        display: none;
      }
      .show-all .accessory {
        display: block !important;
      }
    </style>
  </head>
  <body>
    <div id="app-container">
      <!-- 중앙 가위바위보 예고 -->
      <div
        id="warning-text"
        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-7xl font-bold drop-shadow-[4px_4px_0_var(--border)] z-40 hidden pointer-events-none whitespace-nowrap"
      ></div>

      <!-- 상단 헤더: 일자 배치 -->
      <header
        class="p-4 bg-white/80 backdrop-blur-md border-b-2 border-pink-200 z-10 flex-shrink-0"
      >
        <div class="flex flex-col gap-3">
          <div class="flex justify-between items-center w-full">
            <div class="cute-box px-3 py-1 flex items-center gap-2">
              <span
                class="text-[9px] text-gray-500 font-bold uppercase tracking-tighter"
                >Best</span
              >
              <span
                id="best-score-display"
                class="text-sm font-bold text-sky-500"
                >0</span
              >
            </div>
            <div class="cute-box px-3 py-1 flex items-center gap-2 text-right">
              <span
                class="text-[9px] text-gray-500 font-bold uppercase tracking-tighter"
                >Score</span
              >
              <span id="score-display" class="text-sm font-bold text-rose-500"
                >0</span
              >
            </div>
          </div>
          <div class="w-full">
            <div class="flex justify-between items-center mb-1 px-1">
              <span class="text-[9px] font-bold text-pink-600"
                >강아지 자존감 게이지</span
              >
              <span class="text-[8px] text-gray-400 font-bold"
                >100%를 향해 져주개!</span
              >
            </div>
            <div class="esteem-container">
              <div id="esteem-bar" class="esteem-fill"></div>
            </div>
          </div>
        </div>
      </header>

      <!-- 메인 게임 스테이지 -->
      <main
        class="flex-1 flex flex-col items-center justify-center relative p-4 z-10 min-h-0"
      >
        <div
          id="timer-wrapper"
          class="w-full max-w-[240px] mb-8 opacity-0 transition-opacity flex-shrink-0"
        >
          <div class="timer-container">
            <div id="timer-bar" class="timer-fill"></div>
          </div>
        </div>

        <div
          id="message-box"
          class="cute-box px-6 py-2 mb-6 text-center text-lg font-bold bubble-tail relative opacity-0 translate-y-2 text-slate-500 flex-shrink-0"
        >
          준비!
        </div>

        <!-- 강아지 캐릭터 영역 -->
        <div id="dog-container" class="relative mt-2 float flex-shrink-0">
          <div
            class="w-32 h-32 sm:w-36 sm:h-36 bg-white border-4 border-[--border] rounded-[2rem] flex items-center justify-center shadow-[6px_6px_0_var(--border)] relative z-10 p-2 overflow-visible"
          >
            <svg
              viewBox="0 0 16 16"
              class="w-full h-full"
              shape-rendering="crispEdges"
              xmlns="http://www.w3.org/2000/svg"
            >
              <!-- 강아지 몸체 -->
              <path d="M3 2h3v3H3z M10 2h3v3h-3z M2 5h12v5H2z" fill="#d97706" />
              <path d="M4 3h1v1H4z M11 3h1v1h-1z" fill="#fcd34d" />
              <path
                d="M3 9h10v1H3z M2 10h12v3H2z M3 13h10v1H3z"
                fill="#ffffff"
              />
              <!-- 눈, 코, 혀 -->
              <path d="M4 7h2v2H4z M10 7h2v2h-2z" fill="#334155" />
              <path d="M7 10h2v1H7z" fill="#334155" />
              <path d="M7 11h2v2H7z" fill="#fb7185" />
              <!-- 볼터치 -->
              <path d="M2 8h2v1H2z M12 8h2v1h-2z" fill="#fbcfe8" />

              <!-- 🎀 악세사리 그룹 (클래스 제어로 한꺼번에 보여줌) -->
              <g class="accessory">
                <!-- 리본 -->
                <path d="M6 13h4v2H6z" fill="#fb7185" />
                <path d="M5 14h1v1H5z M10 14h1v1h-1z" fill="#fda4af" />
                <!-- 귀걸이 -->
                <path d="M2 3h1v2H2z M13 3h1v2h-1z" fill="#fcd34d" />
                <path d="M2 5h1v1H2z M13 5h1v1H2z" fill="#fde047" />
                <!-- 선글라스 -->
                <path d="M3 6.5h10v2H3z" fill="#1e293b" />
                <path d="M4 7h2v0.5H4z M10 7h2v0.5h-2z" fill="#475569" />
                <!-- 왕관 -->
                <path
                  d="M5 -1h1v2H5z M8 -1.5h1v2H8z M11 -1h1v2h-1z"
                  fill="#fbbf24"
                />
                <path d="M5 1h6v1.5H5z" fill="#f59e0b" />
                <path d="M7 1h2v1H7z" fill="#ef4444" />
              </g>
            </svg>
          </div>

          <div
            id="dog-hand"
            class="absolute -top-10 -right-10 w-24 h-24 sm:w-28 sm:h-28 bg-white border-4 border-[--border] rounded-full flex items-center justify-center text-6xl shadow-[4px_4px_0_var(--border)] z-30 hidden"
          >
            ✊
          </div>
          <div
            id="user-hand"
            class="absolute -bottom-10 -left-10 w-24 h-24 sm:w-28 sm:h-28 bg-blue-50 border-4 border-[--border] rounded-full flex items-center justify-center text-6xl shadow-[4px_4px_0_var(--border)] z-30 hidden"
          >
            ✋
          </div>
        </div>
      </main>

      <!-- 하단 컨트롤러 영역 -->
      <footer
        class="p-6 bg-white/90 backdrop-blur-md border-t-2 border-pink-200 flex-shrink-0 z-20 shadow-[0_-10px_20px_rgba(0,0,0,0.05)]"
      >
        <div class="grid grid-cols-3 gap-3">
          <button
            onclick="playRound('scissors')"
            class="action-btn h-20 sm:h-24 bg-yellow-100 hover:bg-yellow-200"
            disabled
          >
            <span class="text-4xl mb-1 drop-shadow-sm">✌️</span>
            <span class="text-[10px] font-bold text-yellow-700">가위</span>
          </button>
          <button
            onclick="playRound('rock')"
            class="action-btn h-20 sm:h-24 bg-rose-100 hover:bg-rose-200"
            disabled
          >
            <span class="text-4xl mb-1 drop-shadow-sm">✊</span>
            <span class="text-[10px] font-bold text-rose-700">바위</span>
          </button>
          <button
            onclick="playRound('paper')"
            class="action-btn h-20 sm:h-24 bg-blue-100 hover:bg-blue-200"
            disabled
          >
            <span class="text-4xl mb-1 drop-shadow-sm">✋</span>
            <span class="text-[10px] font-bold text-blue-700">보</span>
          </button>
        </div>
      </footer>

      <!-- 모달 컨테이너 -->
      <div
        id="modal"
        class="absolute inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-6"
      >
        <div
          id="modal-content-container"
          class="cute-box w-full max-w-[320px] p-8 text-center bg-white flex flex-col items-center"
        ></div>
      </div>
    </div>

    <script>
      let score = 0;
      let bestScore = localStorage.getItem('dogGameBestScore') || 0;
      let dogChoice = '';
      let timerId = null;
      let isWaitingForInput = false;

      // 🌟 성공 목표치: 10점 🌟
      const MAX_SCORE = 10;
      const GAME_TIME_LIMIT = 2000; // 제한 시간 2초

      const choices = ['rock', 'paper', 'scissors'];
      const emojiMap = { rock: '✊', paper: '✋', scissors: '✌️' };
      const sequenceData = [
        { text: '가위!', color: '#f59e0b' },
        { text: '바위!', color: '#f59e0b' },
        { text: '보!', color: '#ef4444' },
      ];

      const scoreDisplay = document.getElementById('score-display');
      const bestScoreDisplay = document.getElementById('best-score-display');
      const esteemBar = document.getElementById('esteem-bar');
      const dogContainer = document.getElementById('dog-container');
      const messageBox = document.getElementById('message-box');
      const warningText = document.getElementById('warning-text');
      const timerWrapper = document.getElementById('timer-wrapper');
      const timerBar = document.getElementById('timer-bar');
      const dogHand = document.getElementById('dog-hand');
      const userHand = document.getElementById('user-hand');
      const userButtons = document.querySelectorAll('.action-btn');
      const modal = document.getElementById('modal');
      const modalContentContainer = document.getElementById(
        'modal-content-container',
      );
      const appContainer = document.getElementById('app-container');

      bestScoreDisplay.textContent = bestScore;

      showStartScreen();

      function showStartScreen() {
        modal.style.display = 'flex';
        dogContainer.classList.remove('show-all');
        modalContentContainer.innerHTML = `
                <div class="text-5xl mb-2">🐶</div>
                <h1 class="text-3xl text-[--dark-text] mb-4 font-bold">져주개!</h1>
                <div class="text-sm text-gray-600 mb-8 bg-slate-50 border-2 border-slate-200 p-4 rounded-2xl w-full text-center leading-relaxed">
                    강아지에게 일부러 져서<br>
                    <span class="text-rose-500 font-bold">강아지의 자존감</span>을 채워주세요!<br>
                    100%가 되면 멋진 일이 생길지도?
                </div>
                <button onclick="startGame()" class="w-full bg-rose-400 text-white border-3 border-[--border] rounded-2xl py-3 text-xl font-bold shadow-[0_4px_0_var(--border)] active:translate-y-[4px] transition-all">
                    시작하기!
                </button>
            `;
      }

      function startGame() {
        modal.style.display = 'none';
        score = 0;
        updateUI();
        nextRound();
      }

      function nextRound() {
        updateUI();
        dogHand.classList.add('hidden');
        userHand.classList.add('hidden');
        warningText.classList.add('hidden');
        timerWrapper.style.opacity = '0';
        timerBar.style.transition = 'none';
        timerBar.style.width = '100%';
        setButtonsEnabled(false);
        showMessage('준비!', '#64748b');
        setTimeout(startWarningSequence, 600);
      }

      function startWarningSequence() {
        warningText.classList.remove('hidden');
        let step = 0;
        function showNextText() {
          if (step >= sequenceData.length) {
            warningText.classList.add('hidden');
            dogAttack();
            return;
          }
          warningText.textContent = sequenceData[step].text;
          warningText.style.color = sequenceData[step].color;
          warningText.classList.remove('text-flash');
          void warningText.offsetWidth;
          warningText.classList.add('text-flash');
          step++;
          setTimeout(showNextText, 600);
        }
        showNextText();
      }

      function dogAttack() {
        dogChoice = choices[Math.floor(Math.random() * choices.length)];
        dogHand.textContent = emojiMap[dogChoice];
        dogHand.classList.remove('hidden');
        void dogHand.offsetWidth;
        dogHand.classList.add('pop-scale');
        showMessage('지금!', '#fb7185');
        isWaitingForInput = true;
        setButtonsEnabled(true);
        timerWrapper.style.opacity = '1';
        void timerBar.offsetWidth;
        timerBar.style.transition = `width ${GAME_TIME_LIMIT}ms linear`;
        timerBar.style.width = '0%';
        timerId = setTimeout(handleTimeout, GAME_TIME_LIMIT);
      }

      function playRound(userChoice) {
        if (!isWaitingForInput) return;
        isWaitingForInput = false;
        setButtonsEnabled(false);
        clearTimeout(timerId);
        userHand.textContent = emojiMap[userChoice];
        userHand.classList.remove('hidden');
        void userHand.offsetWidth;
        userHand.classList.add('pop-up');
        evaluate(userChoice);
      }

      function handleTimeout() {
        if (!isWaitingForInput) return;
        isWaitingForInput = false;
        setButtonsEnabled(false);
        screenFlash();
        showMessage('시간 초과! ⏰', '#ef4444');
        setTimeout(() => endGame(false), 1000);
      }

      function evaluate(userChoice) {
        let success = false;
        if (
          userChoice !== dogChoice &&
          ((dogChoice === 'rock' && userChoice === 'scissors') ||
            (dogChoice === 'paper' && userChoice === 'rock') ||
            (dogChoice === 'scissors' && userChoice === 'paper'))
        ) {
          success = true;
          score++;
          if (score > bestScore) {
            bestScore = score;
            localStorage.setItem('dogGameBestScore', bestScore);
          }
        }
        updateUI();
        if (success) {
          if (score >= MAX_SCORE) {
            showMessage('자존감 폭발! 👑', '#10b981');
            setTimeout(() => endGame(true), 1000);
          } else {
            showMessage('성공! +1 💖', '#10b981');
            setTimeout(nextRound, 1000);
          }
        } else {
          showMessage('실패! 💦', '#ef4444');
          screenFlash();
          setTimeout(() => endGame(false), 1200);
        }
      }

      function endGame(isPerfect) {
        modal.style.display = 'flex';

        if (isPerfect) {
          // 완벽한 성공 화면: 모든 악세사리 착용
          dogContainer.classList.add('show-all');
          modalContentContainer.innerHTML = `
                    <div class="text-5xl mb-2">✨👑✨</div>
                    <h1 class="text-2xl text-sky-500 mb-4 font-bold">자존감 100% 달성!</h1>
                    <div class="bg-amber-50 border-2 border-amber-200 p-4 rounded-2xl mb-6 w-full">
                        <p class="text-sm text-amber-800 leading-relaxed">
                            당신의 노력으로 강아지가<br>세상에서 가장 화려해졌어요!
                        </p>
                    </div>
                    <div class="flex flex-col gap-3 w-full">
                        <button onclick="startGame()" class="w-full bg-sky-400 text-white border-3 border-[--border] rounded-2xl py-3 text-lg font-bold shadow-[0_4px_0_var(--border)] active:translate-y-[4px] transition-all">다시 놀아주기</button>
                        <button onclick="showStartScreen()" class="w-full bg-slate-200 text-slate-700 border-3 border-[--border] rounded-2xl py-3 text-lg font-bold shadow-[0_4px_0_var(--border)] active:translate-y-[4px] transition-all">홈으로</button>
                    </div>
                `;
        } else {
          // 게임 오버 화면
          let evalText =
            score === 0
              ? '저를 그렇게 이기고 싶어요? 🐶💦'
              : score < 5
                ? '져주는게 어렵나요? 😏'
                : '오~ 제법 잘 하시네요! 👏';
          modalContentContainer.innerHTML = `
                    <div class="text-5xl mb-2">💀</div>
                    <h1 class="text-3xl text-rose-500 mb-4 font-bold">게임 오버!</h1>
                    <div class="text-[10px] text-gray-500 mb-1">채워진 자존감</div>
                    <div class="text-5xl font-bold text-sky-500 mb-3">${Math.floor((score / MAX_SCORE) * 100)}%</div>
                    <div class="text-xs font-bold bg-amber-100 text-amber-700 rounded-lg p-3 inline-block mb-8 px-4 text-center leading-tight">${evalText}</div>
                    <div class="flex flex-col gap-3 w-full">
                        <button onclick="startGame()" class="w-full bg-rose-400 text-white border-3 border-[--border] rounded-2xl py-3 text-lg font-bold shadow-[0_4px_0_var(--border)] active:translate-y-[4px] transition-all">다시 도전!</button>
                        <button onclick="showStartScreen()" class="w-full bg-slate-200 text-slate-700 border-3 border-[--border] rounded-2xl py-3 text-lg font-bold shadow-[0_4px_0_var(--border)] active:translate-y-[4px] transition-all">홈으로</button>
                    </div>
                `;
        }
      }

      function updateUI() {
        scoreDisplay.textContent = score;
        bestScoreDisplay.textContent = bestScore;

        // 게이지 업데이트 (MAX_SCORE 기준)
        const esteemPercent = Math.min((score / MAX_SCORE) * 100, 100);
        esteemBar.style.width = `${esteemPercent}%`;
      }

      function setButtonsEnabled(enabled) {
        userButtons.forEach((btn) => (btn.disabled = !enabled));
      }
      function showMessage(text, color) {
        messageBox.textContent = text;
        messageBox.style.color = color;
        messageBox.style.opacity = '1';
        messageBox.style.transform = 'translateY(0)';
      }
      function screenFlash() {
        appContainer.style.backgroundColor = '#fecaca';
        setTimeout(
          () => (appContainer.style.backgroundColor = 'var(--app-bg)'),
          200,
        );
      }
    </script>
  </body>
</html>
