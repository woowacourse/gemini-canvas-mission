<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>유연함의 힘 - 일일 독서 퀴즈</title>
        <!-- Tailwind CSS (CDN) -->
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
            body {
                font-family: 'Pretendard', sans-serif;
            }
            /* 부드러운 페이드인 애니메이션 */
            .fade-in {
                animation: fadeIn 0.5s ease-in-out;
            }
            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        </style>
    </head>
    <body class="min-h-screen bg-slate-50 flex items-center justify-center p-4 text-slate-800">
        <div id="app" class="max-w-2xl w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
            <!-- JS로 내용이 렌더링됩니다. -->
        </div>

        <script>
            // SVG 아이콘 모음 (Lucide 호환)
            const icons = {
                bookOpen: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6 text-indigo-200"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>`,
                checkCircleSmall: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`,
                checkCircleMedium: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 mr-2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`,
                xCircleSmall: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`,
                xCircleMedium: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 mr-2"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`,
                arrowRight: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 ml-2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>`,
                lightbulbSmall: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 mr-2 text-blue-600"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.9 1.2 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg>`,
                lightbulbLarge: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-24 h-24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.9 1.2 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg>`,
                loader2: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-10 h-10 animate-spin text-indigo-500"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>`,
                alertCircle: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-12 h-12 mb-2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`,
            };

            // 책 "유연함의 힘" 목차 데이터
            const chapters = [
                '1장. 경험은 가장 훌륭한 스승: 유연한 사람만이 경험에서 배운다',
                '2장. 학습을 부르는 마인드셋: 경험은 학습의 어머니다',
                '3장. 성과와 성장, 두 마리 토끼를 모두 잡는 법: 유연성 강화 목표에 학습 초점을 맞춰라',
                '4장. 내면의 과학자를 깨워라: 실험 계획 수립과 수행',
                '5장. 성장 공동체를 구축하라: 피드백이 학습 효과를 극대화한다',
                '6장. 경험에서 의미를 찾아라: 멀리 내다보며 체계적으로 성찰하라',
                '7장. 감정을 학습의 지렛대로 사용하는 법: 감정의 노예가 아닌 주인이 되어라',
                '8장. 환경에 휘둘리지 말고 환경을 이용하라: 아픈 경험에서도 교훈을 찾아라',
                '9장. 유연함의 기술을 알리는 코치가 되어라: 함께 성장하는 사회를 만들기 위하여',
                '10장. 유연성이 조직의 경쟁력이다: 유연함의 기술을 이용한 직원 개발 프로그램',
                '11장. 학습 조직과 유연함의 기술: 마이크로소프트의 사례',
            ];

            // 앱 상태 관리
            let state = {
                currentDayIndex: 0,
                currentQuiz: null,
                isLoading: true,
                error: null,
                selectedOption: null,
                isSubmitted: false,
            };

            // Gemini API로 퀴즈 가져오기
            async function fetchQuizFromGemini() {
                state.isLoading = true;
                state.error = null;
                state.isSubmitted = false;
                state.selectedOption = null;
                render();

                const chapterTitle = chapters[state.currentDayIndex % chapters.length];
                const apiKey = ''; // 실행 환경에서 자동으로 주입됩니다.
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

                const prompt = `수잔 애쉬포드의 '유연함의 힘(The Power of Flexing)' 책의 '${chapterTitle}' 부분에 대한 객관적이고 정확한 사지선다형 독서 퀴즈를 1개 만들어주세요. 저자의 핵심 주장과 책에 서술된 연구 결과에 반드시 근거해야 합니다.`;

                const payload = {
                    contents: [{ parts: [{ text: prompt }] }],
                    systemInstruction: {
                        parts: [
                            {
                                text: '당신은 객관적이고 정확한 독서 퀴즈 출제자입니다. 주관적 해석을 배제하고 오로지 책의 내용과 실증적 연구 결과에만 근거하여 문제를 출제합니다. 사용자의 요청에 따라 반드시 제공된 JSON 스키마 형식으로만 응답해야 합니다.',
                            },
                        ],
                    },
                    generationConfig: {
                        responseMimeType: 'application/json',
                        responseSchema: {
                            type: 'OBJECT',
                            properties: {
                                question: { type: 'STRING', description: '책의 내용에 근거한 퀴즈 질문' },
                                options: { type: 'ARRAY', items: { type: 'STRING' }, description: '4개의 보기' },
                                answerIndex: { type: 'INTEGER', description: '정답 인덱스 (0에서 3 사이)' },
                                explanation: {
                                    type: 'STRING',
                                    description: '오답을 고른 사람도 이해할 수 있는 객관적인 정답 해설',
                                },
                                lesson: { type: 'STRING', description: '해당 챕터에서 얻어야 할 실질적인 핵심 교훈' },
                            },
                            required: ['question', 'options', 'answerIndex', 'explanation', 'lesson'],
                        },
                    },
                };

                let delay = 1000;
                for (let i = 0; i < 6; i++) {
                    try {
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload),
                        });

                        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                        const data = await response.json();
                        const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (!text) throw new Error('No text in response');

                        state.currentQuiz = JSON.parse(text);
                        state.isLoading = false;
                        render();
                        return;
                    } catch (err) {
                        if (i === 5) {
                            state.error =
                                'AI 퀴즈를 생성하는 데 실패했습니다. 객관적 데이터를 불러오는 중 오류가 발생했습니다.';
                            state.isLoading = false;
                            render();
                            return;
                        }
                        await new Promise((res) => setTimeout(res, delay));
                        delay *= 2;
                    }
                }
            }

            // 이벤트 핸들러 (전역 스코프)
            window.handleOptionSelect = function (index) {
                if (!state.isSubmitted) {
                    state.selectedOption = index;
                    render();
                }
            };

            window.handleSubmit = function () {
                if (state.selectedOption !== null) {
                    state.isSubmitted = true;
                    render();
                }
            };

            window.handleNextDay = function () {
                state.currentDayIndex++;
                fetchQuizFromGemini();
            };

            window.handleRetry = function () {
                fetchQuizFromGemini();
            };

            // UI 렌더링 함수
            function render() {
                const app = document.getElementById('app');
                const isCorrect = state.currentQuiz ? state.selectedOption === state.currentQuiz.answerIndex : false;

                let contentHTML = '';

                if (state.isLoading) {
                    contentHTML = `
                    <div class="flex flex-col items-center justify-center text-slate-500 space-y-4 h-[450px]">
                        ${icons.loader2}
                        <p class="text-lg font-medium animate-pulse">Gemini AI가 오늘의 객관적 퀴즈를 출제하고 있습니다...</p>
                    </div>
                `;
                } else if (state.error) {
                    contentHTML = `
                    <div class="flex flex-col items-center justify-center text-red-500 space-y-4 text-center h-[450px]">
                        ${icons.alertCircle}
                        <p class="text-lg font-bold">${state.error}</p>
                        <button onclick="window.handleRetry()" class="mt-4 px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors">
                            다시 시도하기
                        </button>
                    </div>
                `;
                } else if (state.currentQuiz) {
                    const quiz = state.currentQuiz;
                    const chapterTitle = chapters[state.currentDayIndex % chapters.length];

                    let optionsHTML = quiz.options
                        .map((option, index) => {
                            let buttonClass = 'border-slate-200 hover:border-indigo-300 hover:bg-slate-50';
                            let iconClass = 'border-slate-300 text-transparent';
                            let iconSVG = '';

                            if (state.isSubmitted) {
                                if (index === quiz.answerIndex) {
                                    buttonClass = 'border-green-500 bg-green-50 text-green-800';
                                    iconClass = 'bg-green-500 border-green-500 text-white';
                                    iconSVG = icons.checkCircleSmall;
                                } else if (index === state.selectedOption) {
                                    buttonClass = 'border-red-400 bg-red-50 text-red-800';
                                    iconClass = 'bg-red-500 border-red-500 text-white';
                                    iconSVG = icons.xCircleSmall;
                                } else {
                                    buttonClass = 'border-slate-200 bg-slate-50 opacity-50';
                                }
                            } else if (state.selectedOption === index) {
                                buttonClass = 'border-indigo-500 bg-indigo-50 text-indigo-700';
                                iconClass = 'border-indigo-500 bg-indigo-500 text-white';
                            }

                            return `
                        <button
                            onclick="window.handleOptionSelect(${index})"
                            ${state.isSubmitted ? 'disabled' : ''}
                            class="w-full text-left p-4 rounded-xl border-2 transition-all duration-200 flex items-center ${buttonClass}"
                        >
                            <div class="w-6 h-6 rounded-full flex items-center justify-center mr-3 border flex-shrink-0 ${iconClass}">
                                ${iconSVG}
                            </div>
                            <span class="leading-snug">${option}</span>
                        </button>
                    `;
                        })
                        .join('');

                    let resultsHTML = '';
                    if (state.isSubmitted) {
                        resultsHTML = `
                        <div class="space-y-6 fade-in mt-6">
                            ${
                                !isCorrect
                                    ? `
                                <div class="bg-red-50 border-l-4 border-red-500 p-5 rounded-r-xl">
                                    <div class="flex items-center text-red-800 font-bold mb-2">
                                        ${icons.xCircleMedium}
                                        앗, 아쉽게도 오답입니다!
                                    </div>
                                    <p class="text-red-900 leading-relaxed text-sm">
                                        ${quiz.explanation}
                                    </p>
                                </div>
                            `
                                    : `
                                <div class="bg-green-50 border-l-4 border-green-500 p-5 rounded-r-xl">
                                    <div class="flex items-center text-green-800 font-bold mb-2">
                                        ${icons.checkCircleMedium}
                                        정답입니다! 정확히 이해하셨네요.
                                    </div>
                                    <p class="text-green-900 leading-relaxed text-sm">
                                        ${quiz.explanation}
                                    </p>
                                </div>
                            `
                            }

                            <div class="bg-blue-50 border border-blue-100 p-6 rounded-xl relative overflow-hidden">
                                <div class="absolute top-0 right-0 p-4 opacity-10">
                                    ${icons.lightbulbLarge}
                                </div>
                                <div class="relative z-10">
                                    <h4 class="flex items-center text-blue-800 font-bold text-lg mb-3">
                                        ${icons.lightbulbSmall}
                                        오늘의 핵심 교훈
                                    </h4>
                                    <p class="text-blue-900 leading-relaxed font-medium">
                                        ${quiz.lesson}
                                    </p>
                                </div>
                            </div>

                            <button
                                onclick="window.handleNextDay()"
                                class="w-full flex items-center justify-center py-4 rounded-xl font-bold text-lg bg-slate-800 hover:bg-slate-900 text-white transition-colors shadow-md"
                            >
                                다음 챕터 퀴즈 생성하기
                                ${icons.arrowRight}
                            </button>
                        </div>
                    `;
                    }

                    const submitButtonHTML = !state.isSubmitted
                        ? `
                    <button
                        onclick="window.handleSubmit()"
                        ${state.selectedOption === null ? 'disabled' : ''}
                        class="w-full py-4 rounded-xl font-bold text-lg transition-colors mt-6 ${
                            state.selectedOption !== null
                                ? 'bg-indigo-600 hover:bg-indigo-700 text-white shadow-md'
                                : 'bg-slate-100 text-slate-400 cursor-not-allowed'
                        }"
                    >
                        정답 확인하기
                    </button>
                `
                        : '';

                    contentHTML = `
                    <div class="w-full">
                        <div class="mb-6">
                            <h2 class="text-sm font-semibold text-indigo-600 mb-2 uppercase tracking-wider">
                                오늘의 독서 범위
                            </h2>
                            <h3 class="text-2xl font-bold text-slate-800 leading-tight">
                                ${chapterTitle}
                            </h3>
                        </div>

                        <div class="mb-8">
                            <p class="text-lg text-slate-700 font-medium mb-6">
                                Q. ${quiz.question}
                            </p>
                            <div class="space-y-3">
                                ${optionsHTML}
                            </div>
                        </div>

                        ${submitButtonHTML}
                        ${resultsHTML}
                    </div>
                `;
                }

                // 전체 레이아웃 구성
                app.innerHTML = `
                <div class="bg-indigo-600 p-6 text-white flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        ${icons.bookOpen}
                        <h1 class="text-xl font-bold tracking-tight">유연함의 힘 (The Power of Flexing)</h1>
                    </div>
                    <div class="px-3 py-1 bg-indigo-500 rounded-full text-sm font-medium">
                        Day ${state.currentDayIndex + 1}
                    </div>
                </div>
                <div class="p-8 min-h-[450px] flex flex-col justify-center">
                    ${contentHTML}
                </div>
            `;
            }

            // 초기 실행
            fetchQuizFromGemini();
        </script>
    </body>
</html>
