<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우아한 알고리즘 - 알고리즘 설계의 청사진</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #6366f1;
            --primary-light: #818cf8;
            --success: #10b981;
            --error: #f43f5e;
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --code-bg: #020617;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Pretendard', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* Layout */
        header { padding: 3rem 1rem 2rem; text-align: center; background: linear-gradient(to bottom, #1e293b, var(--bg)); }
        header h1 { font-size: 2.8rem; color: var(--primary); margin-bottom: 0.5rem; letter-spacing: -1.5px; font-weight: 800; }
        header p { color: var(--text-muted); font-size: 1.1rem; }

        nav {
            display: flex; justify-content: center; gap: 10px; padding: 1rem;
            position: sticky; top: 0; background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px); z-index: 100; border-bottom: 1px solid var(--border); flex-wrap: wrap;
        }
        nav button {
            padding: 0.8rem 1.6rem; border: none; background: transparent;
            color: var(--text-muted); cursor: pointer; border-radius: 12px;
            font-weight: 700; transition: 0.3s;
        }
        nav button.active { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); }

        main { max-width: 900px; margin: 2rem auto; padding: 0 1.5rem; min-height: 70vh; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease-out; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* UI Elements */
        .card { background: var(--card); border-radius: 20px; padding: 2rem; border: 1px solid var(--border); margin-bottom: 1.5rem; position: relative; transition: border-color 0.3s; }
        .card:hover { border-color: var(--primary-light); }
        .btn { padding: 0.8rem 1.5rem; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; text-align: center; font-size: 1rem; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-light); }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: var(--primary); color: white; }
        .btn-disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; border: 2px solid var(--border); }
        
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }

        /* Algorithm Detail View */
        .algo-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 10px; }
        .theory-box { background: rgba(255,255,255,0.02); padding: 1.5rem; border-radius: 12px; border-left: 4px solid var(--primary); margin-bottom: 1.5rem; }
        .theory-box h3 { color: var(--primary-light); margin-bottom: 0.5rem; }
        
        .visual-box { background: var(--code-bg); padding: 2rem; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid var(--border); overflow-x: auto; margin-bottom: 1.5rem; }
        .visual-desc { font-size: 0.9rem; color: var(--text-muted); margin-top: 15px; text-align: center; line-height: 1.5; }
        
        .example-card { background: #0f172a; padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 1.5rem; }
        .example-card h4 { color: var(--success); margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; font-size: 1.1rem; }
        .example-solution { background: rgba(16, 185, 129, 0.05); border-left: 3px solid var(--success); padding: 1.2rem; border-radius: 0 8px 8px 0; font-size: 0.95rem; color: var(--text-main); margin-top: 1rem; line-height: 1.7; }
        
        .ex-visual-box { background: #1e293b; padding: 1.5rem; border-radius: 10px; margin: 15px 0; border: 1px solid var(--border); display: flex; justify-content: center; }

        /* Code Block Styles */
        .code-toggle-btn { width: 100%; padding: 1rem; background: var(--card); border: 1px solid var(--border); color: var(--text-main); margin-top: 1rem; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .code-toggle-btn:hover { border-color: var(--primary); color: var(--primary-light); }
        .code-container { margin-top: 10px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .code-tabs { display: flex; background: #0f172a; border-bottom: 1px solid var(--border); }
        .code-tab-btn { flex: 1; padding: 0.8rem; background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-weight: bold; transition: 0.2s; }
        .code-tab-btn:hover { color: var(--text-main); }
        .code-tab-btn.active { color: var(--primary-light); border-bottom: 2px solid var(--primary); background: #1e293b; }
        .code-block { margin: 0; padding: 1.2rem; background: #020617; color: #a5b4fc; font-family: monospace; font-size: 0.9rem; overflow-x: auto; white-space: pre; line-height: 1.5; }

        /* Quiz */
        .quiz-option-group { display: flex; gap: 10px; margin-top: 1rem; flex-direction: column; }
        .option-btn { width: 100%; padding: 1.2rem; background: #0f172a; border: 1px solid var(--border); border-radius: 12px; color: white; text-align: left; cursor: pointer; transition: 0.2s; font-size: 1rem; }
        .option-btn:hover:not(:disabled) { border-color: var(--primary); transform: translateX(5px); background: #1e293b; }
        .option-btn.correct { background: var(--success) !important; border-color: var(--success) !important; color: white !important; }
        .option-btn.wrong { background: var(--error) !important; border-color: var(--error) !important; color: white !important; }

        /* Dashboard Visualization */
        .mastery-item { margin-bottom: 1.5rem; }
        .mastery-label { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-weight: 600; }
        .mastery-bar-bg { height: 12px; background: var(--border); border-radius: 6px; overflow: hidden; }
        .mastery-bar-fill { height: 100%; transition: width 1s ease-in-out; }

        /* Modal */
        #modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; z-index: 1000; overflow-y: auto; }
        #modal-content { max-width: 850px; width: 95%; margin: 2rem auto; background: var(--card); border-radius: 24px; padding: 2.5rem; position: relative; border: 1px solid var(--border); }
        
        .modal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
        .back-btn { background: transparent; border: none; color: var(--text-muted); font-size: 1rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: 0.2s; padding: 0.5rem 0; }
        .back-btn:hover { color: var(--primary); }
        .close-btn { font-size: 2rem; cursor: pointer; color: var(--text-muted); transition: 0.2s; line-height: 1; }
        .close-btn:hover { color: white; }

        .status-badge { font-size: 0.8rem; padding: 4px 10px; border-radius: 20px; font-weight: 700; white-space: nowrap; }
        .badge-learned { background: rgba(16, 185, 129, 0.2); color: var(--success); border: 1px solid var(--success); }
        .badge-locked { background: rgba(244, 63, 94, 0.2); color: var(--error); border: 1px solid var(--error); }
        .badge-level { background: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid var(--warning); }
        .card-badge { position: absolute; top: 1.5rem; right: 1.5rem; }

        code { background: #000; padding: 2px 6px; border-radius: 4px; color: var(--primary-light); font-family: monospace; }
        .highlight-text { color: var(--warning); font-weight: bold; }
    </style>
</head>

                </div>

        </div>
    </main>

        <div id="modal-content">
            <div id="modal-nav-container"></div>
            <div id="modal-view-content"></div>
        </div>

                    {
                        title: "바이러스 감염 네트워크",
                        level: "백준 실버 3 수준",
                        desc: "신종 바이러스가 네트워크를 통해 전파되고 있습니다. 1번 컴퓨터가 바이러스에 감염되었을 때, 이 컴퓨터와 직접 또는 간접적으로 연결되어 있는 모든 컴퓨터는 바이러스에 감염됩니다.<br><br>네트워크 상에서 서로 연결되어 있는 정보가 주어질 때, <b>1번 컴퓨터를 통해 바이러스에 걸리게 되는 컴퓨터의 총 개수</b>를 구하는 프로그램을 작성하세요.",
                        io: "<b>입력:</b><br>첫째 줄: 컴퓨터의 수 N (1 &lt;= N &lt;= 100)<br>둘째 줄: 연결된 네트워크 쌍의 수 M<br>셋째 줄부터 M개의 줄: 서로 연결된 컴퓨터의 번호 쌍<br><br><b>출력:</b><br>1번 컴퓨터를 통해 바이러스에 걸리게 되는 컴퓨터의 수 (1번 컴퓨터 자신은 제외)",
                        solution: "이 문제는 연결된 그래프에서 특정 노드(1번)가 속한 <b>'연결 요소(Connected Component)'의 크기</b>를 구하는 전형적인 탐색 문제입니다.<br><br>1. 인접 리스트(Adjacency List) 방식으로 네트워크 연결 정보를 양방향으로 저장합니다.<br>2. 1번 컴퓨터에서 시작하여 DFS(재귀) 또는 BFS(큐)를 수행합니다.<br>3. 새롭게 방문하는 컴퓨터마다 방문 처리를 하고 카운트를 1씩 증가시킵니다.",

                            py: `import sys
from collections import deque

def solve(n, edges):
    # 인접 리스트 생성
    graph = [[] for _ in range(n + 1)]
    for u, v in edges:
        graph[u].append(v)
        graph[v].append(u)
        
    visited = [False] * (n + 1)
    queue = deque([1])  # 1번 컴퓨터부터 시작
    visited[1] = True
    count = 0
    
    # BFS 탐색
    while queue:
        node = queue.popleft()
        
        for neighbor in graph[node]:
            if not visited[neighbor]:
                visited[neighbor] = True
                queue.append(neighbor)
                count += 1  # 새로 감염된 컴퓨터 수 증가
                
    return count`,
                            js: `function solve(n, edges) {
    // 인접 리스트 생성
    const graph = Array.from({length: n + 1}, () => []);
    for (let [u, v] of edges) {
        graph[u].push(v);
        graph[v].push(u);
    }
    
    const visited = new Array(n + 1).fill(false);
    const queue = [1]; // 1번 컴퓨터부터 시작
    visited[1] = true;
    let count = 0;
    
    // BFS 탐색
    while (queue.length > 0) {
        const node = queue.shift();
        
        for (let neighbor of graph[node]) {
            if (!visited[neighbor]) {
                visited[neighbor] = true;
                queue.push(neighbor);
                count++; // 새로 감염된 컴퓨터 수 증가
            }
        }
    }
    
    return count;
}`,
                            cpp: `#include &lt;iostream&gt;
#include &lt;vector&gt;
#include &lt;queue&gt;
using namespace std;

int solve(int n, vector&lt;pair&lt;int, int&gt;&gt;& edges) {
    // 인접 리스트 생성
    vector&lt;vector&lt;int&gt;&gt; graph(n + 1);
    for (auto& edge : edges) {
        graph[edge.first].push_back(edge.second);
        graph[edge.second].push_back(edge.first);
    }
    
    vector&lt;bool&gt; visited(n + 1, false);
    queue&lt;int&gt; q;
    
    q.push(1); // 1번 컴퓨터 시작
    visited[1] = true;
    int count = 0;
    
    // BFS 탐색
    while (!q.empty()) {
        int node = q.front();
        q.pop();
        
        for (int neighbor : graph[node]) {
            if (!visited[neighbor]) {
                visited[neighbor] = true;
                q.push(neighbor);
                count++;
            }
        }
    }
    
    return count;
}`

    // 여벌이 있지만 도난당한 본인 체육복 입는 학생 필터링
    let realReserve = reserve.filter(r => !lost.includes(r)).sort((a,b)=>a-b);
    let realLost = lost.filter(l => !reserve.includes(l));
    
    // 체육복이 있는 학생(n - 잃어버린 학생)
    let answer = n - realLost.length;
    
    for (let r of realReserve) {
        // 앞번호 확인
        let frontIdx = realLost.indexOf(r - 1);
        if (frontIdx !== -1) {
            realLost.splice(frontIdx, 1);
            answer++;
            continue;
        }
        // 뒷번호 확인
        let backIdx = realLost.indexOf(r + 1);
        if (backIdx !== -1) {
            realLost.splice(backIdx, 1);
            answer++;
        }
    }
    
    return answer;

int solution(int n, vector&lt;int&gt; lost, vector&lt;int&gt; reserve) {
    vector&lt;int&gt; students(n + 2, 1); // 1~n번 학생의 체육복 개수 초기화
    
    for (int l : lost) students[l]--;
    for (int r : reserve) students[r]++;
    
    int answer = 0;

        // 체육복이 없는 학생일 경우
        if (students[i] == 0) {
            // 앞번호 학생이 여벌이 있는 경우

                students[i - 1]--;
                students[i]++;

            }
        }

    }

                        solution: "1번 마을(시작점)에서 다른 모든 마을까지의 최단 거리를 구하는 전형적인 <b>단일 출발점 최단 경로</b> 문제입니다. 간선의 가중치(시간)가 모두 양수이므로 다익스트라 알고리즘을 사용합니다.<br><br>1. 인접 리스트에 양방향 도로 정보를 저장합니다.<br>2. 우선순위 큐를 사용하여 현재 가장 시간이 적게 걸리는 마을을 선택하고 인접 마을의 도착 시간을 갱신합니다.<br>3. 완성된 최단 거리 테이블에서 값이 K 이하인 마을의 개수를 셉니다.",
                        codes: {
                            py: `import heapq

def solution(N, road, K):
    # 인접 리스트 초기화
    graph = [[] for _ in range(N + 1)]
    for u, v, w in road:
        graph[u].append((w, v))
        graph[v].append((w, u))
        
    distances = [float('inf')] * (N + 1)
    distances[1] = 0
    pq = [(0, 1)] # (거리, 노드번호)
    
    while pq:
        dist, node = heapq.heappop(pq)
        
        # 이미 처리된 노드는 무시
        if distances[node] < dist:
            continue
            
        for cost, next_node in graph[node]:
            new_cost = dist + cost
            if new_cost < distances[next_node]:
                distances[next_node] = new_cost
                heapq.heappush(pq, (new_cost, next_node))
                
    # K 이하인 마을 수 카운트
    answer = sum(1 for d in distances if d <= K)
    return answer`,
                            js: `function solution(N, road, K) {
    const graph = Array.from({length: N + 1}, () => []);
    for(let [u, v, w] of road) {
        graph[u].push([w, v]);
        graph[v].push([w, u]);
    }
    
    const dist = new Array(N + 1).fill(Infinity);
    dist[1] = 0;
    
    // 우선순위 큐 대신 간단한 배열 순회 다익스트라 (N이 작을 경우 유효)
    const visited = new Array(N + 1).fill(false);
    
    for(let i = 0; i < N; i++) {
        let minDist = Infinity;
        let node = -1;
        
        // 방문하지 않은 노드 중 최단 거리 노드 선택
        for(let j = 1; j <= N; j++) {
            if(!visited[j] && dist[j] < minDist) {
                minDist = dist[j];
                node = j;
            }
        }
        
        if(node === -1) break;
        visited[node] = true;
        
        for(let [cost, nextNode] of graph[node]) {
            if(dist[node] + cost < dist[nextNode]) {
                dist[nextNode] = dist[node] + cost;
            }
        }
    }
    
    return dist.filter(d => d <= K).length;
}`,
                            cpp: `#include &lt;iostream&gt;
#include &lt;vector&gt;
#include &lt;queue&gt;

using namespace std;

int solution(int N, vector&lt;vector&lt;int&gt;&gt; road, int K) {
    vector&lt;vector&lt;pair&lt;int, int&gt;&gt;&gt; graph(N + 1);
    for (auto& r : road) {
        graph[r[0]].push_back({r[2], r[1]});
        graph[r[1]].push_back({r[2], r[0]});
    }
    
    vector&lt;int&gt; dist(N + 1, 1e9);
    // 최소 힙: (거리, 노드)
    priority_queue&lt;pair&lt;int, int&gt;, vector&lt;pair&lt;int, int&gt;&gt;, greater&lt;pair&lt;int, int&gt;&gt;&gt; pq;
    
    dist[1] = 0;
    pq.push({0, 1});
    
    while (!pq.empty()) {
        int d = pq.top().first;
        int node = pq.top().second;
        pq.pop();
        
        if (dist[node] &lt; d) continue;
        
        for (auto& edge : graph[node]) {
            int cost = edge.first;
            int nextNode = edge.second;
            
            if (d + cost &lt; dist[nextNode]) {
                dist[nextNode] = d + cost;
                pq.push({dist[nextNode], nextNode});
            }
        }
    }
    
    int answer = 0;
    for (int i = 1; i &lt;= N; i++) {
        if (dist[i] &lt;= K) answer++;
    }
    return answer;
}`

#include &lt;vector&gt;
using namespace std;

int countSubarrays(int N, int M, vector&lt;int&gt;& arr) {
    int left = 0, right = 0;
    int currentSum = 0, count = 0;
    
    while (true) {
        if (currentSum &gt;= M) {
            if (currentSum == M) count++;
            currentSum -= arr[left++];
        } else if (right == N) {

        } else {

    }

            setTimeout(() => {
                if(idx + 1 < qSet.length) renderQuizPage(algoId, qSet, idx + 1, score, isConcept);
                else {
                    if(isConcept && score === qSet.length) {
                        if(!state.stats[algoId]) state.stats[algoId] = {tried:0, correct:0, learned:false};
                        state.stats[algoId].learned = true; save();
                    }
                    renderResult(algoId, score, qSet.length, isConcept);
                }
            }, 1000);
        }

        function renderResult(algoId, score, total, isConcept) {
            const passed = score === total;
            document.getElementById('modal-view-content').innerHTML = `
                <div style="text-align:center; padding:2rem;">
                    <div style="font-size:4rem; margin-bottom:1rem;">${passed ? '🎉' : '🥲'}</div>
                    <h2>${isConcept ? (passed ? '학습 완료!' : '재도전 필요') : '퀴즈 종료'}</h2>
                    <p style="font-size:1.5rem; margin:1rem 0;">${score} / ${total}</p>
                    <button class="btn btn-primary" onclick="${isConcept ? (passed ? 'closeModal()' : `openLearn('${algoId}')`) : `openQuizSelection('${algoId}')`}">확인</button>
                </div>
            `;
        }

        function updateDashboard() {
            let totalT = 0, totalC = 0;
            document.getElementById('mastery-container').innerHTML = ALGO_DB.map(algo => {
                const s = state.stats[algo.id] || {tried:0, correct:0, learned:false};
                totalT += s.tried; totalC += s.correct;
                const acc = s.tried === 0 ? (s.learned ? 100 : 0) : (s.correct / s.tried) * 100;
                const mastery = Math.round((acc * 0.7) + (s.learned ? 30 : 0));
                return `
                    <div class="mastery-item">
                        <div class="mastery-label"><span>${algo.name}</span><span>${mastery}% ${s.learned ? '✅' : '🔒'}</span></div>
                        <div class="mastery-bar-bg"><div class="mastery-bar-fill" style="width:${mastery}%; background:linear-gradient(90deg, var(--primary), var(--success));"></div></div>
                    </div>
                `;
            }).join('');
            document.getElementById('total-tried').innerText = totalT + "문항";
            document.getElementById('avg-accuracy').innerText = (totalT === 0 ? 0 : Math.round((totalC/totalT)*100)) + '%';
        }

        function resetData() { if(confirm("초기화하시겠습니까?")) { localStorage.clear(); location.reload(); } }
        function save() { localStorage.setItem('algo_bp_stats', JSON.stringify(state.stats)); }
        function closeModal() { document.getElementById('modal').style.display = 'none'; renderAlgoList(); updateDashboard(); }
        window.onclick = e => { if(e.target == document.getElementById('modal')) closeModal(); }
        init();
    </script>
</body>
</html>
