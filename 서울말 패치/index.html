<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이프의 서울말 패치 프로젝트</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');

    body {
      font-family: 'Pretendard', sans-serif;
      background-color: #f8fafc;
      touch-action: manipulation;
      overflow-x: hidden;
    }

    .card-shadow {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }

    .btn-bounce:active {
      transform: scale(0.95);
    }

    .animate-pop {
      animation: pop 0.4s cubic-bezier(0.26, 0.53, 0.74, 1.48);
    }

    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .hidden { display: none; }
    .wrong-bg { background-color: #fef2f2; border-color: #ef4444; }

    /* 얄미운 캐릭터 애니메이션 */
    @keyframes smirk {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(5deg); }
    }
    .character-smirk {
      animation: smirk 0.5s ease-in-out infinite;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

<!-- Start Screen -->
<div id="start-screen" class="w-full max-w-md bg-white rounded-[2rem] p-10 card-shadow text-center border border-slate-100">
  <div class="mb-6 relative flex justify-center">
    <div id="intro-character-container"></div>
    <div class="absolute -top-2 -right-2 bg-blue-500 text-white text-[10px] font-bold px-2 py-1 rounded-full">Ver 2.2</div>
  </div>
  <h1 class="text-3xl font-extrabold text-slate-900 mb-3 tracking-tight">서울말 패치 2.2</h1>
  <p class="text-slate-500 mb-10 leading-relaxed text-sm">
    서울 깍쟁이 쥐가 비웃기 전에<br>완벽한 서울말을 구사해 보세요!
  </p>
  <button id="start-btn" class="w-full py-5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-2xl transition-all btn-bounce shadow-lg shadow-blue-200 text-lg">
    패치 시작하기
  </button>
</div>

<!-- Loading Screen -->
<div id="loading-screen" class="hidden flex flex-col items-center text-center">
  <div class="w-12 h-12 border-4 border-slate-200 border-t-blue-600 rounded-full animate-spin mb-6"></div>
  <p class="text-slate-600 font-bold animate-pulse">서울 쥐가 문제를 고르는 중...</p>
</div>

<!-- Game Screen -->
<div id="game-screen" class="hidden w-full max-w-md">
  <div class="flex justify-between items-end mb-4 px-2">
    <div>
      <p class="text-xs font-bold text-slate-400 uppercase tracking-tighter mb-1">Progress</p>
      <div class="flex gap-1" id="step-dots"></div>
    </div>
    <span id="score-text" class="text-xl font-black text-blue-600 italic">000</span>
  </div>

  <div class="bg-white rounded-[2rem] p-8 card-shadow border border-slate-100 relative overflow-hidden">
    <!-- Feedback Overlay -->
    <div id="feedback-overlay" class="hidden absolute inset-0 z-10 flex flex-col items-center justify-center text-center p-6 backdrop-blur-md rounded-[2rem] animate-pop">
      <div id="character-view" class="mb-2 transition-transform"></div>
      <h3 id="feedback-message" class="text-2xl font-black mb-1"></h3>
      <p id="feedback-sub" class="text-slate-600 mb-6 font-medium"></p>

      <div id="correct-controls" class="w-full hidden">
        <button id="next-btn" class="w-full py-4 bg-slate-900 text-white font-bold rounded-xl btn-bounce">다음 문제로</button>
      </div>

      <div id="reveal-controls" class="w-full hidden space-y-3">
        <button id="retry-btn" class="w-full py-4 bg-blue-600 text-white font-bold rounded-xl btn-bounce">다시 풀기 (0점)</button>
        <button id="skip-btn" class="w-full py-4 bg-slate-200 text-slate-600 font-bold rounded-xl btn-bounce">이 문제는 넘어가기</button>
      </div>
    </div>

    <div class="text-center mb-8">
      <div class="inline-block px-3 py-1 bg-slate-100 rounded-lg text-[10px] font-bold text-slate-500 mb-3 uppercase tracking-widest">Question</div>
      <h2 id="dialect-text" class="text-3xl font-extrabold text-slate-800 leading-snug break-keep"></h2>
    </div>

    <div class="space-y-5">
      <div class="relative">
        <input type="text" id="answer-input" placeholder="말투를 맞춰서 입력하세요" autocomplete="off"
               class="w-full p-5 bg-slate-50 border-2 border-transparent rounded-2xl focus:bg-white focus:border-blue-500 focus:outline-none transition-all text-lg font-medium">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <button id="hint-btn" class="py-4 bg-amber-100 hover:bg-amber-200 text-amber-700 font-bold rounded-2xl btn-bounce transition-all text-sm">
          💡 한글자 채우기
        </button>
        <button id="reveal-btn" class="py-4 bg-slate-100 hover:bg-slate-200 text-slate-500 font-bold rounded-2xl btn-bounce transition-all text-sm">
          👀 정답 확인
        </button>
      </div>

      <button id="submit-btn" class="w-full py-5 bg-blue-600 text-white font-black rounded-2xl btn-bounce transition-all shadow-md">
        확인
      </button>
    </div>
  </div>
</div>

<!-- Result Screen -->
<div id="result-screen" class="hidden w-full max-w-md bg-white rounded-[2rem] p-10 card-shadow text-center border border-slate-100">
  <div id="result-character-container" class="flex justify-center mb-4"></div>
  <h2 class="text-3xl font-extrabold text-slate-900 mb-2">패치 완료!</h2>
  <p class="text-slate-500 mb-8 font-medium">서울 쥐가 인정할 수준은 된 것 같아요.</p>
  <div class="bg-blue-50 rounded-2xl p-6 mb-10">
    <p class="text-slate-400 text-xs font-bold uppercase mb-1">Final Score</p>
    <p id="final-score-text" class="text-5xl font-black text-blue-600"></p>
  </div>
  <button onclick="location.reload()" class="w-full py-5 bg-slate-900 text-white font-bold rounded-2xl btn-bounce">
    처음부터 다시 하기
  </button>
</div>

<script>
  const apiKey = "";
  let questions = [];
  let currentIndex = 0;
  let score = 0;
  let currentProblemPenalty = false;

  const praiseMessages = ["마 쫌 치네?", "니 이미 서울 식구네", "니 경상도 사람 맞나?", "뭐고 왤케 잘하노", "이야 살아있네"];

  // 얄미운 서울 쥐 SVG 캐릭터
  const getMouseSVG = (type) => {
    const isNasty = type === 'reveal';
    const eyeColor = isNasty ? '#ef4444' : '#1e293b';
    const brow = isNasty ? `<path d="M35 35 Q45 30 55 35" stroke="black" stroke-width="2" fill="none"/> <path d="M65 35 Q75 30 85 35" stroke="black" stroke-width="2" fill="none"/>` : '';
    const mouth = isNasty
        ? `<path d="M50 75 Q60 65 70 75" stroke="black" stroke-width="3" fill="none" class="character-smirk"/>`
        : `<path d="M50 70 Q60 85 70 70" stroke="black" stroke-width="3" fill="none"/>`;

    return `
            <svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                <!-- Ears -->
                <circle cx="30" cy="30" r="20" fill="#cbd5e1"/>
                <circle cx="90" cy="30" r="20" fill="#cbd5e1"/>
                <circle cx="30" cy="30" r="12" fill="#fecaca"/>
                <circle cx="90" cy="30" r="12" fill="#fecaca"/>
                <!-- Face -->
                <circle cx="60" cy="70" r="45" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
                <!-- Eyes -->
                <circle cx="45" cy="60" r="5" fill="${eyeColor}"/>
                <circle cx="75" cy="60" r="5" fill="${eyeColor}"/>
                ${brow}
                <!-- Nose -->
                <circle cx="60" cy="72" r="6" fill="#f87171"/>
                <!-- Mouth -->
                ${mouth}
                <!-- Whiskers -->
                <line x1="20" y1="70" x2="40" y2="72" stroke="#94a3b8" stroke-width="1"/>
                <line x1="20" y1="80" x2="40" y2="78" stroke="#94a3b8" stroke-width="1"/>
                <line x1="100" y1="70" x2="80" y2="72" stroke="#94a3b8" stroke-width="1"/>
                <line x1="100" y1="80" x2="80" y2="78" stroke="#94a3b8" stroke-width="1"/>
            </svg>`;
  };

  const elements = {
    start: document.getElementById('start-screen'),
    loading: document.getElementById('loading-screen'),
    game: document.getElementById('game-screen'),
    result: document.getElementById('result-screen'),
    dialect: document.getElementById('dialect-text'),
    input: document.getElementById('answer-input'),
    submit: document.getElementById('submit-btn'),
    hintBtn: document.getElementById('hint-btn'),
    revealBtn: document.getElementById('reveal-btn'),
    score: document.getElementById('score-text'),
    dots: document.getElementById('step-dots'),
    overlay: document.getElementById('feedback-overlay'),
    charView: document.getElementById('character-view'),
    fMsg: document.getElementById('feedback-message'),
    fSub: document.getElementById('feedback-sub'),
    nextBtn: document.getElementById('next-btn'),
    retryBtn: document.getElementById('retry-btn'),
    skipBtn: document.getElementById('skip-btn'),
    correctControls: document.getElementById('correct-controls'),
    revealControls: document.getElementById('reveal-controls'),
    introChar: document.getElementById('intro-character-container'),
    resultChar: document.getElementById('result-character-container')
  };

  // 초기 화면 캐릭터
  elements.introChar.innerHTML = getMouseSVG('normal');

  function normalize(text) {
    return text.replace(/[\s\.]/g, '');
  }

  async function fetchQuestions() {
    elements.start.classList.add('hidden');
    elements.loading.classList.remove('hidden');

    const systemPrompt = `
                당신은 우테코 크루 '이프'를 위한 서울말 교정 튜터입니다.
                RAG 시스템을 통해 경상도 방언과 서울 표준어 매핑 데이터를 사용합니다.

                [중요 지침]
                1. 말투 유지: 방언이 반말이면 표준어도 반드시 반말이어야 합니다.
                2. 복수 정답: 하나의 사투리에 대해 의미가 통하는 유사한 표준어 표현들을 배열로 제공하세요.
                3. 문장 끝: 표준어 표현들에는 가급적 마침표(.)를 포함시켜 정석적인 문장을 만드세요.

                반드시 아래 JSON 형식으로만 응답하세요:
                [
                    {"dialect": "사투리 문장", "standards": ["정답1", "정답2", "정답3"]}
                ]
            `;

    try {
      const response = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: "RAG DB에서 서울말 패치 퀴즈 10개를 반말/존댓말 구분해서 생성해줘." }] }],
          systemInstruction: { parts: [{ text: systemPrompt }] },
          generationConfig: { responseMimeType: "application/json" }
        })
      });

      const data = await response.json();
      questions = JSON.parse(data.candidates[0].content.parts[0].text);

      initDots();
      startGame();
    } catch (error) {
      alert("네트워크 상태를 확인해주세요!");
      location.reload();
    }
  }

  async function fetchWithRetry(url, options, retries = 5) {
    const delays = [1000, 2000, 4000, 8000, 16000];
    for (let i = 0; i < retries; i++) {
      try {
        const res = await fetch(url, options);
        if (res.ok) return res;
      } catch (e) {}
      await new Promise(r => setTimeout(r, delays[i]));
    }
    throw new Error("Max retries");
  }

  function initDots() {
    elements.dots.innerHTML = '';
    for(let i=0; i<10; i++) {
      const dot = document.createElement('div');
      dot.className = 'w-2 h-2 rounded-full bg-slate-200 transition-all';
      elements.dots.appendChild(dot);
    }
  }

  function startGame() {
    elements.loading.classList.add('hidden');
    elements.game.classList.remove('hidden');
    renderQuestion();
  }

  function renderQuestion() {
    const q = questions[currentIndex];
    elements.dialect.innerText = q.dialect;
    elements.input.value = "";
    elements.input.classList.remove('wrong-bg');
    elements.overlay.classList.add('hidden');
    currentProblemPenalty = false;

    const dots = elements.dots.children;
    for(let i=0; i<dots.length; i++) {
      dots[i].className = i === currentIndex ? 'w-6 h-2 rounded-full bg-blue-600 transition-all' : (i < currentIndex ? 'w-2 h-2 rounded-full bg-blue-200' : 'w-2 h-2 rounded-full bg-slate-200');
    }

    elements.score.innerText = score.toString().padStart(3, '0');
    elements.input.focus();
  }

  elements.hintBtn.onclick = () => {
    const standard = questions[currentIndex].standards[0];
    const currentInput = elements.input.value;
    let matchedCount = 0;
    for(let i = 0; i < currentInput.length && i < standard.length; i++) {
      if(currentInput[i] === standard[i]) matchedCount++;
      else break;
    }
    if (matchedCount === 0) elements.input.value = standard[0];
    else if (matchedCount < standard.length) elements.input.value = standard.substring(0, matchedCount + 1);
    elements.input.focus();
  };

  elements.revealBtn.onclick = () => {
    showFeedback('reveal', "어휴, 이것도 몰라요?", questions[currentIndex].standards.join(" / "));
  };

  elements.submit.onclick = () => {
    const userVal = normalize(elements.input.value);
    const q = questions[currentIndex];
    const isCorrect = q.standards.some(s => normalize(s) === userVal);

    if (isCorrect) {
      const addScore = currentProblemPenalty ? 0 : 100;
      score += addScore;
      showFeedback('correct', praiseMessages[Math.floor(Math.random() * praiseMessages.length)], currentProblemPenalty ? "다음엔 나 도움 없이 해봐!" : `+${addScore} Point!`);
    } else {
      elements.input.classList.add('wrong-bg');
      elements.input.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' }, { transform: 'translateX(0)' }], { duration: 250 });
      setTimeout(() => elements.input.classList.remove('wrong-bg'), 1000);
    }
  };

  function showFeedback(type, msg, sub) {
    elements.overlay.classList.remove('hidden');
    elements.correctControls.classList.add('hidden');
    elements.revealControls.classList.add('hidden');
    elements.charView.innerHTML = getMouseSVG(type);

    if (type === 'correct') {
      elements.overlay.className = "absolute inset-0 z-10 flex flex-col items-center justify-center text-center p-6 backdrop-blur-md rounded-[2rem] animate-pop bg-emerald-50/90";
      elements.fMsg.innerText = msg;
      elements.fMsg.className = "text-2xl font-black mb-2 text-emerald-700";
      elements.correctControls.classList.remove('hidden');
    } else {
      elements.overlay.className = "absolute inset-0 z-10 flex flex-col items-center justify-center text-center p-6 backdrop-blur-md rounded-[2rem] animate-pop bg-rose-50/90";
      elements.fMsg.innerText = msg;
      elements.fMsg.className = "text-2xl font-black mb-2 text-rose-700";
      elements.revealControls.classList.remove('hidden');
    }
    elements.fSub.innerText = sub;
  }

  elements.nextBtn.onclick = () => {
    currentIndex++;
    if (currentIndex < questions.length) renderQuestion();
    else showResult();
  };

  elements.retryBtn.onclick = () => {
    elements.overlay.classList.add('hidden');
    elements.input.value = "";
    currentProblemPenalty = true;
    elements.input.focus();
  };

  elements.skipBtn.onclick = () => {
    currentIndex++;
    if (currentIndex < questions.length) renderQuestion();
    else showResult();
  };

  function showResult() {
    elements.game.classList.add('hidden');
    elements.result.classList.remove('hidden');
    elements.resultChar.innerHTML = getMouseSVG('normal');
    document.getElementById('final-score-text').innerText = score;
  }

  document.getElementById('start-btn').onclick = fetchQuestions;
  elements.input.addEventListener('keypress', (e) => { if (e.key === 'Enter') elements.submit.click(); });
</script>
</body>
</html>
