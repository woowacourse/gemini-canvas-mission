<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우테코 테코톡 퀴즈 생성기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        woowa: '#2ac1bc', // 배달의민족 민트색상 포인트
                        woowaDark: '#229a96'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8fafc;
        }
        .quiz-card {
            transition: all 0.3s ease;
        }
        .quiz-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .answer-section {
            display: none;
            animation: fadeIn 0.5s;
        }
        .answer-section.show {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

<!-- Header -->
<header class="bg-white shadow-sm border-b-4 border-woowa">
    <div class="max-w-4xl mx-auto px-4 py-6 sm:px-6 lg:px-8 flex items-center justify-between">
        <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
            <i class="fa-solid fa-graduation-cap text-woowa"></i>
            우테코 테코톡 퀴즈 생성기
        </h1>
        <span class="bg-woowa/10 text-woowaDark px-3 py-1 rounded-full text-sm font-medium">신규 크루용</span>
    </div>
</header>

<!-- Main Content -->
<main class="flex-grow max-w-4xl mx-auto px-4 py-8 sm:px-6 lg:px-8 w-full">

    <!-- Filter Section -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-8">
        <h2 class="text-lg font-semibold mb-4 text-slate-700">원하는 퀴즈의 조건을 선택하세요</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <!-- Level Select -->
            <div>
                <label for="level" class="block text-sm font-medium text-slate-600 mb-1">레벨 (Level)</label>
                <select id="level" class="w-full rounded-lg border-slate-300 border py-2 px-3 focus:ring-woowa focus:border-woowa outline-none transition">
                    <option value="all">전체 레벨</option>
                    <option value="Level 1">Level 1</option>
                    <option value="Level 2">Level 2</option>
                </select>
            </div>
            <!-- Field Select -->
            <div>
                <label for="field" class="block text-sm font-medium text-slate-600 mb-1">분야 (Field)</label>
                <select id="field" class="w-full rounded-lg border-slate-300 border py-2 px-3 focus:ring-woowa focus:border-woowa outline-none transition">
                    <option value="all">전체 분야</option>
                    <option value="Backend">백엔드 (Backend)</option>
                    <option value="Android">안드로이드 (Android)</option>
                </select>
            </div>
            <!-- Keyword Select -->
            <div>
                <label for="keyword" class="block text-sm font-medium text-slate-600 mb-1">키워드 (Keyword)</label>
                <select id="keyword" class="w-full rounded-lg border-slate-300 border py-2 px-3 focus:ring-woowa focus:border-woowa outline-none transition">
                    <option value="all">전체 키워드</option>
                    <option value="Network">네트워크/HTTP</option>
                    <option value="Architecture">아키텍처/설계</option>
                    <option value="Library">라이브러리</option>
                </select>
            </div>
        </div>
        <button id="generateBtn" class="w-full bg-woowa hover:bg-woowaDark text-white font-bold py-3 px-4 rounded-lg transition duration-200 flex justify-center items-center gap-2 shadow-md">
            <i class="fa-solid fa-wand-magic-sparkles"></i> 퀴즈 생성하기
        </button>
    </section>

    <!-- Quiz Display Section -->
    <section id="quizContainer" class="space-y-6">
        <!-- Quizzes will be injected here by JS -->
        <div class="text-center py-12 text-slate-500 bg-white rounded-xl border border-dashed border-slate-300">
            <i class="fa-regular fa-face-smile-wink text-4xl mb-3 text-slate-300"></i>
            <p>조건을 선택하고 퀴즈 생성하기 버튼을 눌러주세요!</p>
        </div>
    </section>

</main>

<!-- Footer -->
<footer class="bg-slate-50 py-6 border-t border-slate-200 mt-auto">
    <div class="max-w-4xl mx-auto px-4 text-center text-slate-500 text-sm">
        <p>본 퀴즈는 [10분 테코톡] 밍곰의 멱등성, 토바에의 Retrofit 영상을 기반으로 제작되었습니다.</p>
    </div>
</footer>

<!-- JavaScript Data and Logic -->
<script>
    // 이전에 정리한 2개 영상의 데이터를 바탕으로 구성된 퀴즈 DB
    const quizData = [
        {
            id: 1,
            level: 'Level 2',
            field: 'Backend',
            keyword: 'Network',
            videoTitle: '[10분 테코톡] 밍곰의 멱등성',
            videoLink: 'https://www.youtube.com/watch?v=6znXX1tnIAs',
            question: 'HTTP 메서드 중 멱등성을 보장하지 않아, 결제나 재고 수정 같은 요청 시 중복 처리를 방어해야 하는 대표적인 메서드 2가지는 무엇인가요?',
            answer: 'POST, PATCH',
            explanation: 'GET, PUT, DELETE는 동일한 요청을 여러 번 보내도 결과가 같은 멱등성을 보장하지만, POST와 PATCH는 보장하지 않습니다. 따라서 불안정한 네트워크 환경에서 중복 요청 시 치명적인 버그가 발생할 수 있습니다.'
        },
        {
            id: 2,
            level: 'Level 2',
            field: 'Backend',
            keyword: 'Architecture',
            videoTitle: '[10분 테코톡] 밍곰의 멱등성',
            videoLink: 'https://www.youtube.com/watch?v=6znXX1tnIAs',
            question: '클라이언트가 서버로 중복 요청을 보낼 때, 서버가 이를 구별하고 동일한 요청이 여러 번 처리되는 것을 막기 위해 클라이언트가 생성하여 헤더 등에 담아 보내는 고유한 값은 무엇인가요?',
            answer: '멱등키 (Idempotency Key)',
            explanation: '서버는 전달받은 멱등키를 DB에 저장해두고, 똑같은 키가 다시 들어오면 비즈니스 로직(핸들러)을 타지 않고 기존에 저장해 둔 응답 결과를 그대로 반환하여 중복 처리를 방어합니다.'
        },
        {
            id: 3,
            level: 'Level 1',
            field: 'Android',
            keyword: 'Library',
            videoTitle: '[10분 테코톡] 토바에의 Retrofit',
            videoLink: 'https://www.youtube.com/watch?v=jIdydvGgguE',
            question: '안드로이드 네트워크 통신 시 발생하는 보일러플레이트 코드를 줄여주며, 인터페이스(Interface)와 어노테이션(@GET 등)만으로 API 명세를 깔끔하게 정의할 수 있게 해주는 라이브러리는 무엇인가요?',
            answer: 'Retrofit (레트로핏)',
            explanation: 'HttpURLConnection이나 OkHttp를 직접 사용할 때 발생하는 반복적인 코드와 데이터 파싱, 예외 처리를 개발자 대신 깔끔하게 처리해주는 라이브러리입니다.'
        },
        {
            id: 4,
            level: 'Level 1',
            field: 'Android',
            keyword: 'Architecture',
            videoTitle: '[10분 테코톡] 토바에의 Retrofit',
            videoLink: 'https://www.youtube.com/watch?v=jIdydvGgguE',
            question: 'Retrofit은 런타임에 인터페이스의 구현체(Proxy 객체)를 동적으로 생성합니다. 이때 API 함수가 처음 호출될 때 어노테이션 정보를 읽어와 HTTP 요청 객체를 완성하기 위해 내부적으로 사용하는 Java 기술은 무엇인가요?',
            answer: '리플렉션 (Reflection)',
            explanation: 'Retrofit은 리플렉션을 통해 인터페이스에 선언된 어노테이션 정보를 읽어옵니다. 초기 호출 시에만 이 분기를 타고, 이후에는 캐싱된 정보를 사용하여 오버헤드를 줄입니다.'
        }
    ];

    // DOM Elements
    const generateBtn = document.getElementById('generateBtn');
    const levelSelect = document.getElementById('level');
    const fieldSelect = document.getElementById('field');
    const keywordSelect = document.getElementById('keyword');
    const quizContainer = document.getElementById('quizContainer');

    // Event Listener for Generate Button
    generateBtn.addEventListener('click', generateQuizzes);

    function generateQuizzes() {
        const selectedLevel = levelSelect.value;
        const selectedField = fieldSelect.value;
        const selectedKeyword = keywordSelect.value;

        // Filter logic
        const filteredQuizzes = quizData.filter(quiz => {
            const matchLevel = selectedLevel === 'all' || quiz.level === selectedLevel;
            const matchField = selectedField === 'all' || quiz.field === selectedField;
            const matchKeyword = selectedKeyword === 'all' || quiz.keyword === selectedKeyword;
            return matchLevel && matchField && matchKeyword;
        });

        // Render logic
        quizContainer.innerHTML = ''; // Clear previous quizzes

        if (filteredQuizzes.length === 0) {
            quizContainer.innerHTML = `
                    <div class="text-center py-12 text-slate-500 bg-white rounded-xl border border-dashed border-slate-300">
                        <i class="fa-solid fa-circle-exclamation text-4xl mb-3 text-slate-300"></i>
                        <p>선택하신 조건에 맞는 퀴즈가 없습니다.</p>
                        <p class="text-sm mt-2">다른 조건을 선택해 보세요!</p>
                    </div>
                `;
            return;
        }

        filteredQuizzes.forEach((quiz, index) => {
            const quizCard = document.createElement('div');
            quizCard.className = 'quiz-card bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden';

            quizCard.innerHTML = `
                    <div class="p-6">
                        <div class="flex flex-wrap gap-2 mb-4">
                            <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded">${quiz.level}</span>
                            <span class="bg-purple-100 text-purple-800 text-xs font-semibold px-2.5 py-0.5 rounded">${quiz.field}</span>
                            <span class="bg-emerald-100 text-emerald-800 text-xs font-semibold px-2.5 py-0.5 rounded">${quiz.keyword}</span>
                        </div>
                        <h3 class="text-xl font-bold text-slate-800 mb-2 leading-tight">Q${index + 1}. ${quiz.question}</h3>
                        <p class="text-sm text-slate-500 mb-6 flex items-center gap-1">
                            <i class="fa-solid fa-video"></i> 출처: <a href="${quiz.videoLink}" target="_blank" class="hover:text-woowa underline decoration-woowa/30 underline-offset-2 transition">${quiz.videoTitle}</a>
                        </p>

                        <button onclick="toggleAnswer(${quiz.id})" class="text-woowa font-semibold hover:text-woowaDark transition flex items-center gap-2 outline-none">
                            <i id="icon-${quiz.id}" class="fa-solid fa-chevron-down"></i> 정답 및 해설 보기
                        </button>

                        <div id="answer-${quiz.id}" class="answer-section mt-4 p-4 bg-slate-50 rounded-lg border border-slate-100">
                            <div class="mb-3">
                                <span class="font-bold text-slate-800 text-lg flex items-center gap-2">
                                    <i class="fa-solid fa-check text-woowa"></i> 정답: <span class="text-woowaDark">${quiz.answer}</span>
                                </span>
                            </div>
                            <p class="text-slate-600 leading-relaxed text-sm">${quiz.explanation}</p>
                        </div>
                    </div>
                `;
            quizContainer.appendChild(quizCard);
        });
    }

    // Toggle Answer Visibility
    window.toggleAnswer = function(id) {
        const answerDiv = document.getElementById(`answer-${id}`);
        const icon = document.getElementById(`icon-${id}`);

        if (answerDiv.classList.contains('show')) {
            answerDiv.classList.remove('show');
            icon.classList.remove('fa-chevron-up');
            icon.classList.add('fa-chevron-down');
        } else {
            answerDiv.classList.add('show');
            icon.classList.remove('fa-chevron-down');
            icon.classList.add('fa-chevron-up');
        }
    };
</script>
</body>
</html>
