<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Master Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #5382a1;
            --secondary: #f89820;
            --bg: #f4f7f9;
            --card: #ffffff;
            --text: #333;
            --error: #e74c3c;
            --success: #2ecc71;
            --info: #3498db;
            --radius: 12px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: var(--card);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            position: relative;
        }

        header { text-align: center; margin-bottom: 30px; }
        h1 { color: var(--primary); margin-bottom: 5px; font-size: 1.8rem; }
        .subtitle { color: #666; font-size: 0.9rem; margin-bottom: 20px; }

        .close-btn {
            position: absolute; right: 20px; top: 20px; background: #eee;
            border: none; font-size: 1.5rem; width: 35px; height: 35px;
            border-radius: 50%; cursor: pointer; display: none;
            line-height: 35px; text-align: center; z-index: 10;
        }

        .view { display: none; }
        .view.active { display: block; }

        .btn {
            padding: 12px 24px; border: none; border-radius: 8px;
            cursor: pointer; font-weight: 600; transition: 0.2s; font-size: 1rem;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: var(--secondary); color: white; }
        .btn-outline { background: #f0f0f0; color: #555; }
        .btn:hover:not(:disabled) { opacity: 0.8; }
        .btn:disabled { background: #ddd; cursor: not-allowed; color: #aaa; }

        /* 난이도 선택 카드 디자인 */
        .difficulty-panel {
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        .difficulty-panel p {
            margin-top: 0;
            font-weight: 700;
            color: var(--primary);
            font-size: 1.05rem;
            margin-bottom: 20px;
        }

        .diff-selector { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        .diff-btn {
            padding: 10px 20px; border: 2px solid #cbd5e1; border-radius: 25px;
            background: white; cursor: pointer; font-size: 0.95rem; font-weight: 500;
            transition: all 0.2s ease; color: #64748b;
        }
        .diff-btn:hover { border-color: var(--primary); color: var(--primary); }
        .diff-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 12px rgba(83, 130, 161, 0.3); }

        /* 대시보드 스탯 */
        .stats-row { display: flex; gap: 15px; margin-bottom: 25px; }
        .stat-card {
            flex: 1; padding: 20px; border-radius: 10px; text-align: center;
            cursor: pointer; transition: 0.2s;
        }
        .stat-card.correct { background: #e8f5e9; color: var(--success); }
        .stat-card.wrong { background: #ffebee; color: var(--error); }
        .stat-card:hover { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .stat-val { font-size: 2.5rem; font-weight: 800; display: block; }

        /* 퀴즈 UI */
        .q-box {
            background: #f9f9f9; padding: 25px; border-left: 5px solid var(--primary);
            margin-bottom: 20px; font-weight: 700; line-height: 1.6; font-size: 1.15rem;
        }
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .opt-btn {
            text-align: left; padding: 15px; border: 1px solid #eee; border-radius: 8px;
            background: white; cursor: pointer; font-size: 1rem; transition: 0.2s;
        }
        .opt-btn:hover:not(:disabled) { border-color: var(--primary); background: #f0f7ff; }
        .opt-btn.correct { background: var(--success) !important; color: white; border-color: var(--success); }
        .opt-btn.wrong { background: var(--error) !important; color: white; border-color: var(--error); }

        .feedback {
            margin-top: 20px; padding: 15px; border-radius: 8px; display: none;
            white-space: pre-wrap; font-size: 0.95rem; line-height: 1.7;
        }
        .feedback.hint { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .feedback.desc { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }

        /* 목록 스타일 */
        .list-container { max-height: 450px; overflow-y: auto; margin-top: 10px; border-top: 1px solid #eee; }
        .list-item { border-bottom: 1px solid #eee; }
        .list-header { padding: 15px; display: flex; align-items: center; cursor: pointer; position: relative; }
        .list-header:hover { background: #fcfcfc; }
        .badge {
            font-size: 0.75rem; padding: 3px 8px; border-radius: 4px;
            color: white; margin-right: 12px; white-space: nowrap; flex-shrink: 0; font-weight: bold;
        }
        .badge.beg { background: #5dade2; }
        .badge.mid { background: #58d68d; }
        .badge.adv { background: #a569bd; }
        .q-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
        .arrow { position: absolute; right: 15px; color: #aaa; transition: 0.3s; font-size: 0.8rem; }
        .list-content { padding: 0 15px 25px 50px; display: none; background: #fafafa; }
        .list-content.active { display: block; }

        /* 커스텀 모달 */
        .modal-bg {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal { background: white; padding: 30px; border-radius: var(--radius); width: 90%; max-width: 580px; position: relative; max-height: 90vh; overflow-y: auto; text-align: center; }
        .modal h2 { margin-top: 0; color: var(--primary); font-size: 1.3rem; padding-right: 30px; text-align: center; }
        .modal-close { position: absolute; right: 20px; top: 20px; font-size: 1.8rem; cursor: pointer; color: #999; border: none; background: none; line-height: 1; }
        .modal-close:hover { color: var(--error); }

        /* 축하/안내 모달 전용 */
        .celeb-icon { font-size: 4rem; margin-bottom: 20px; display: block; }
        .celeb-text { font-size: 1.1rem; line-height: 1.6; color: #555; margin-bottom: 25px; }

        footer { margin-top: 30px; display: flex; justify-content: space-between; gap: 10px; }
    </style>
</head>
<body>

<div class="container">
    <!-- 전역 대시보드 복귀 버튼 -->
    <button id="globalCloseBtn" class="close-btn" onclick="goToDashboard()">×</button>
    
    <header>
        <h1>☕ Java Master Quiz</h1>
        <div class="subtitle">Java 기초부터 21 최신 문법까지 완전 정복!</div>
    </header>

    <!-- 1. 시작 화면 -->
    <div id="view-start" class="view active">
        <div class="difficulty-panel">
            <p>퀴즈 난이도 선택</p>
            <div class="diff-selector">
                <button class="diff-btn active" onclick="setDiff('beginner', this)">초보</button>
                <button class="diff-btn" onclick="setDiff('intermediate', this)">중수</button>
                <button class="diff-btn" onclick="setDiff('advanced', this)">고수</button>
                <button class="diff-btn" onclick="setDiff('all', this)">전체</button>
            </div>
        </div>
        <div style="text-align:center">
            <button id="btn-start-init" class="btn btn-primary" style="width:100%" onclick="startQuiz()">학습 시작</button>
        </div>
    </div>

    <!-- 2. 대시보드 (사용자 페이지) -->
    <div id="view-dashboard" class="view">
        <div class="stats-row">
            <div class="stat-card correct" onclick="showHistory('correct')">
                <span id="count-correct" class="stat-val">0</span>
                <span class="stat-label">정답 문제</span>
            </div>
            <div class="stat-card wrong" onclick="openWrongActionModal()">
                <span id="count-wrong" class="stat-val">0</span>
                <span class="stat-label">오답 내역</span>
            </div>
        </div>
        
        <div class="difficulty-panel">
            <p>난이도 설정 변경</p>
            <div class="diff-selector" id="dash-diffs">
                <button class="diff-btn" onclick="setDiff('beginner', this)">초보</button>
                <button class="diff-btn" onclick="setDiff('intermediate', this)">중수</button>
                <button class="diff-btn" onclick="setDiff('advanced', this)">고수</button>
                <button class="diff-btn" onclick="setDiff('all', this)">전체</button>
            </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <button id="btn-quiz-continue" class="btn btn-primary" onclick="startQuiz()">이어서 풀기</button>
            <button class="btn btn-outline" onclick="location.reload()">처음으로</button>
        </div>
    </div>

    <!-- 3. 퀴즈 화면 -->
    <div id="view-quiz" class="view">
        <div id="q-text" class="q-box"></div>
        <div id="options-area" class="options-grid"></div>
        <div id="q-feedback" class="feedback"></div>
        <footer>
            <button id="btn-giveup" class="btn btn-outline" onclick="showAnswer()">정답 보기</button>
            <button id="btn-next" class="btn btn-primary" onclick="nextQuestion()">다음 문제</button>
        </footer>
    </div>

    <!-- 4. 내역 리스트 -->
    <div id="view-list" class="view">
        <h3 id="list-title">내역 확인</h3>
        <div id="history-list" class="list-container"></div>
        <div style="margin-top:20px">
            <button class="btn btn-primary" style="width:100%" onclick="goToDashboard()">대시보드</button>
        </div>
    </div>

    <!-- 5. 오답노트 목록 -->
    <div id="view-wrong-note-list" class="view">
        <h3>오답노트</h3>
        <p class="subtitle">문제를 선택해서 다시 도전해보세요.</p>
        <div id="wrong-note-list" class="list-container"></div>
        <div style="margin-top:20px">
            <button class="btn btn-primary" style="width:100%" onclick="goToDashboard()">그만하기</button>
        </div>
    </div>

    <!-- 모달: 오답 관리 옵션 -->
    <div id="modal-action" class="modal-bg" onclick="closeModal('modal-action')">
        <div class="modal" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal('modal-action')">×</button>
            <h2>오답 관리</h2>
            <p>원하는 작업을 선택하세요.</p>
            <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;">
                <button class="btn btn-primary" onclick="handleShowHistoryInModal()">오답 목록 확인</button>
                <button class="btn btn-secondary" onclick="openWrongNoteList()">오답노트 문제 다시 풀기</button>
            </div>
        </div>
    </div>

    <!-- 모달: 오답노트 개별 퀴즈 팝업 -->
    <div id="modal-note-quiz" class="modal-bg" onclick="closeModal('modal-note-quiz')">
        <div class="modal" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal('modal-note-quiz')">×</button>
            <h2 id="note-modal-title">다시 풀기</h2>
            <div id="note-q-text" class="q-box" style="font-size:1rem; padding:15px;"></div>
            <div id="note-options-area" class="options-grid"></div>
            <div id="note-q-feedback" class="feedback"></div>
        </div>
    </div>

    <!-- 모달: 난이도 정복 축하 팝업 -->
    <div id="modal-celebration" class="modal-bg" onclick="closeModal('modal-celebration')">
        <div class="modal" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal('modal-celebration')">×</button>
            <span class="celeb-icon">🎊</span>
            <h2 id="celeb-title">정복을 축하합니다!</h2>
            <div id="celeb-msg" class="celeb-text"></div>
            <button class="btn btn-primary" style="width:100%" onclick="closeModal('modal-celebration')">확인</button>
        </div>
    </div>

    <!-- 모달: 오답 내역 없음 안내 팝업 -->
    <div id="modal-no-wrong" class="modal-bg" onclick="closeModal('modal-no-wrong')">
        <div class="modal" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal('modal-no-wrong')">×</button>
            <span class="celeb-icon" style="color: var(--success);">✔</span>
            <h2 style="color: var(--success);">완벽합니다!</h2>
            <div class="celeb-text">현재 기록된 오답 내역이 없습니다.<br>모든 문제를 완벽하게 이해하고 계시네요!</div>
            <button class="btn btn-primary" style="width:100%" onclick="closeModal('modal-no-wrong')">확인</button>
        </div>
    </div>

    <!-- 모달: 시도 이력 없음 안내 팝업 -->
    <div id="modal-no-attempts" class="modal-bg" onclick="closeModal('modal-no-attempts')">
        <div class="modal" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal('modal-no-attempts')">×</button>
            <span class="celeb-icon" style="color: var(--info);">?</span>
            <h2 style="color: var(--info);">아직 시도하지 않았습니다!</h2>
            <div class="celeb-text">문제를 하나도 풀지 않은 상태입니다.<br>먼저 퀴즈를 풀고 실력을 쌓아보세요!</div>
            <button class="btn btn-primary" style="width:100%" onclick="closeModal('modal-no-attempts')">확인</button>
        </div>
    </div>
</div>

<script>
    const masterQuestions = [
        // --- 초보 (Beginner) ---
        { id: 101, difficulty: 'beginner', question: "Java에서 정수 연산의 기본 단위이며 4바이트(32비트) 크기를 가진 데이터 타입은?", options: ["short", "byte", "int", "long"], answer: 2, hint: "가장 일반적인 정수 리터럴의 타입입니다.", explanation: "Java의 정수 연산은 기본적으로 int 타입으로 수행되며 성능과 메모리 효율의 균형이 가장 좋습니다." },
        { id: 102, difficulty: 'beginner', question: "상위 클래스의 메서드를 하위 클래스에서 목적에 맞게 재정의하는 것을 무엇이라 하나요?", options: ["Overloading", "Overriding", "Casting", "Encapsulation"], answer: 1, hint: "부모의 동작을 '무시하고 덮어쓰는' 느낌의 용어입니다.", explanation: "오버라이딩(Overriding)은 상속받은 메서드를 자식 클래스에서 새롭게 구현하는 다형성의 핵심 기능입니다." },
        { id: 103, difficulty: 'beginner', question: "Java 21에서 도입된, 순서가 정의된 컬렉션을 통합 관리하는 인터페이스는?", options: ["SequencedCollection", "OrderedList", "LinkedGroup", "StreamSet"], answer: 0, hint: "첫 번째와 마지막 요소에 접근하는 표준 메서드를 제공합니다.", explanation: "Java 21의 SequencedCollection은 getFirst(), getLast() 등을 통해 순서가 있는 컬렉션의 접근 방식을 통일했습니다." },
        { id: 104, difficulty: 'beginner', question: "문자열 객체의 실제 값을 비교할 때 사용하는 올바른 메서드는?", options: ["==", "compare()", "equals()", "isSame()"], answer: 2, hint: "객체의 주소값이 아닌 메모리에 저장된 '데이터'를 비교해야 합니다.", explanation: "==는 참조 주소를 비교하므로, 문자열 내용을 비교할 때는 반드시 equals()를 사용해야 합니다." },
        { id: 105, difficulty: 'beginner', question: "한 번 할당된 값을 변경할 수 없도록 변수를 상수로 만드는 키워드는?", options: ["static", "const", "final", "void"], answer: 2, hint: "클래스에 사용하면 상속을 금지하고, 메서드에 사용하면 재정의를 금지합니다.", explanation: "final 키워드는 변수를 상수로 만들거나, 메서드 오버라이딩/클래스 상속을 제한할 때 사용됩니다." },
        { id: 106, difficulty: 'beginner', question: "LIFO(Last In First Out) 구조를 가진 자료구조 클래스는?", options: ["Queue", "List", "Stack", "Set"], answer: 2, hint: "나중에 넣은 것이 가장 먼저 나오는 형태입니다.", explanation: "Stack은 마지막에 입력된 데이터를 가장 먼저 꺼내는 후입선출 구조를 제공합니다." },
        { id: 107, difficulty: 'beginner', question: "Java 프로그램의 실행 시작점이 되는 메서드 이름은?", options: ["start", "run", "main", "init"], answer: 2, hint: "가장 핵심이 되는 메서드입니다.", explanation: "public static void main(String[] args) 메서드는 Java 프로그램의 엔트리 포인트입니다." },
        { id: 108, difficulty: 'beginner', question: "정해진 횟수만큼 반복문을 실행할 때 주로 사용하는 구문은?", options: ["if", "while", "for", "switch"], answer: 2, hint: "초기값, 조건식, 증감식이 한 곳에 모여있습니다.", explanation: "for 문은 반복 횟수가 명확할 때 가장 가독성이 좋은 반복문입니다." },
        { id: 109, difficulty: 'beginner', question: "객체를 생성할 때 new 연산자와 함께 호출되는 것은?", options: ["메서드", "필드", "생성자", "패키지"], answer: 2, hint: "클래스 이름과 동일한 이름을 가집니다.", explanation: "생성자(Constructor)는 객체가 생성될 때 초기화를 담당하는 특별한 코드 블록입니다." },
        { id: 110, difficulty: 'beginner', question: "여러 개의 데이터를 인덱스를 통해 관리하는 가장 기본적인 자료구조는?", options: ["Map", "Set", "Array", "Class"], answer: 2, hint: "크기가 고정되어 있습니다.", explanation: "배열(Array)은 동일한 타입의 데이터를 연속된 메모리 공간에 저장하는 기본 자료구조입니다." },
        { id: 111, difficulty: 'beginner', question: "클래스 내부의 데이터를 외부에서 함부로 변경하지 못하게 숨기는 기법은?", options: ["상속", "다형성", "캡슐화", "추상화"], answer: 2, hint: "private 제어자를 사용합니다.", explanation: "캡슐화(Encapsulation)는 데이터 보호와 코드 독립성을 위해 내부 구현을 숨기는 것을 말합니다." },
        { id: 112, difficulty: 'beginner', question: "Java에서 모든 클래스의 최상위 부모 클래스는?", options: ["System", "String", "Object", "Class"], answer: 2, hint: "모든 객체가 이 클래스의 메서드를 가집니다.", explanation: "java.lang.Object는 Java의 모든 클래스가 암시적으로 상속받는 루트 클래스입니다." },
        { id: 113, difficulty: 'beginner', question: "소수점을 포함한 숫자를 저장하는 기본 데이터 타입 중 정밀도가 더 높은 것은?", options: ["float", "double", "decimal", "long"], answer: 1, hint: "64비트 크기를 사용합니다.", explanation: "double은 float보다 더 넓은 범위와 정밀도를 제공하는 기본 부동 소수점 타입입니다." },

        { id: 301, difficulty: 'advanced', question: "Java 21 가상 스레드(Virtual Threads)가 추구하는 핵심적인 아키텍처 목표는?", options: ["OS 스레드와 1:1 대응하여 연산 속도 향상", "경량 스레드를 통해 컨텍스트 스위칭 비용을 최소화하며 수백만 개 처리", "CPU 클럭 속도를 소프트웨어적으로 증폭", "모든 동기화 락을 제거하여 충돌 방지"], answer: 1, hint: "처리량(Throughput) 중심의 경량화된 동시성 모델입니다.", explanation: "가상 스레드는 OS 스레드를 점유하지 않고 JVM 내부에서 스케줄링되어 I/O 블로킹 상황에서 자원 효율을 극대화합니다." },
        { id: 302, difficulty: 'advanced', question: "JVM의 G1 Garbage Collector에서 데이터가 큰 객체를 할당하기 위한 전용 리전은?", options: ["Eden Region", "Survivor Region", "Old Region", "Humongous Region"], answer: 3, hint: "거대한(Huge) 객체를 의미하는 용어에서 파생되었습니다.", explanation: "리전 크기의 50%를 넘는 객체는 Humongous Region에 저장되어 Old 영역으로의 잦은 복사 오버헤드를 줄입니다." },
        { id: 303, difficulty: 'advanced', question: "ConcurrentHashMap에서 Java 8 이후 성능 최적화를 위해 사용하는 동기화 메커니즘은?", options: ["전체 맵 독점 락", "Segment 방식의 세분화 락", "버킷 첫 노드에 대한 CAS와 synchronized", "Volatile 키워드 전용"], answer: 2, hint: "락 범위를 특정 버킷 단위로 세밀하게 쪼갠 방식입니다.", explanation: "Java 8 이후 구조는 Segment를 버리고 각 버킷의 첫 노드를 락 기준으로 삼아 동시 경합을 최소화했습니다." },

        { id: 306, difficulty: 'advanced', question: "JVM 메모리 구조 중 모든 스레드가 공유하며 메서드 데이터, 런타임 상수 풀 등을 저장하는 곳은?", options: ["Stack", "Heap", "Method Area", "PC Register"], answer: 2, hint: "Java 8 이후로는 Metaspace로 대체된 영역입니다.", explanation: "메서드 영역(Method Area)은 클래스 수준의 정보가 로드되는 공용 공간입니다." },
        { id: 307, difficulty: 'advanced', question: "Java의 메모리 가시성 문제를 해결하기 위해 변수 값을 CPU 캐시가 아닌 메인 메모리에서 읽고 쓰게 강제하는 키워드는?", options: ["synchronized", "final", "volatile", "transient"], answer: 2, hint: "변동이 심하다는 의미의 단어입니다.", explanation: "volatile은 멀티스레드 환경에서 변수 값의 최신 상태를 보장하여 데이터 불일치를 방지합니다." },
        { id: 308, difficulty: 'advanced', question: "클래스 로딩 과정 중 바이트코드가 JVM 명세를 준수하는지, 시스템 안전을 해치지 않는지 확인하는 단계는?", options: ["Loading", "Verification", "Preparation", "Resolution"], answer: 1, hint: "검증 단계입니다.", explanation: "Verification 단계는 로드된 클래스의 유효성과 보안을 검사하는 핵심 과정입니다." },
        { id: 309, difficulty: 'advanced', question: "G1 GC에서 한 Region의 객체들을 다른 Region으로 복사하여 파편화를 줄이는 과정을 무엇이라 하나요?", options: ["Marking", "Evacuation", "Sweeping", "Compaction"], answer: 1, hint: "대피시킨다는 의미입니다.", explanation: "Evacuation은 살아있는 객체들을 새로운 영역으로 옮겨 메모리 조각화를 방지하는 작업입니다." },
        { id: 310, difficulty: 'advanced', question: "Java 바이트코드를 실행 시점에 원시 기계어 코드로 변환하여 성능을 높이는 컴파일러는?", options: ["JDK", "JIT Compiler", "javac", "Interpreter"], answer: 1, hint: "Just In Time의 약자입니다.", explanation: "JIT 컴파일러는 반복되는 코드를 탐지하여 기계어로 미리 번역해 실행 속도를 비약적으로 향상시킵니다." },
        { id: 311, difficulty: 'advanced', question: "객체의 직렬화 과정에서 특정 필드를 제외하고 싶을 때 사용하는 키워드는?", options: ["static", "volatile", "transient", "native"], answer: 2, hint: "일시적이라는 의미입니다.", explanation: "transient 키워드가 붙은 필드는 직렬화 대상에서 빠져 저장되거나 전송되지 않습니다." },
        { id: 312, difficulty: 'advanced', question: "Java 17에서 정식 도입된, 상속받을 수 있는 클래스를 명시적으로 제한하는 기능은?", options: ["Final Classes", "Sealed Classes", "Strict Classes", "Restricted Classes"], answer: 1, hint: "봉인되었다는 의미입니다.", explanation: "Sealed Classes(봉인된 클래스)는 permits 키워드를 통해 상속을 허용할 하위 클래스를 지정할 수 있습니다." },
        { id: 313, difficulty: 'advanced', question: "불변 데이터를 저장하는 가장 간결한 구조로, Java 14에서 도입된 클래스 형태는?", options: ["DTO", "VO", "Record", "POJO"], answer: 2, hint: "기록한다는 의미의 단어입니다.", explanation: "Record는 필드, 생성자, 접근자, toString 등을 자동으로 생성해주는 데이터 중심 클래스입니다." },
        { id: 314, difficulty: 'advanced', question: "JVM의 TLAB(Thread Local Allocation Buffer)의 주요 목적은?", options: ["객체 정렬", "GC 성능 향상", "스레드 간 경합 없이 빠른 메모리 할당", "힙 크기 조절"], answer: 2, hint: "각 스레드만의 전용 할당 구역입니다.", explanation: "TLAB은 스레드마다 힙의 일부를 전용으로 주어 객체 할당 시 락(Lock)에 의한 오버헤드를 줄입니다." },
        { id: 315, difficulty: 'advanced', question: "Java의 강한 참조와 달리 GC 발생 시 메모리가 부족하지 않아도 무조건 수거되는 참조 타입은?", options: ["Soft Reference", "Weak Reference", "Phantom Reference", "Safe Reference"], answer: 1, hint: "약한 참조라고 부릅니다.", explanation: "WeakReference는 대상 객체를 참조하는 강한 참조가 없어지면 다음 GC 때 즉시 수거됩니다." },
        { id: 316, difficulty: 'advanced', question: "동시성 프로그래밍에서 여러 연산을 하나의 원자적 단위로 묶어 처리하는 기술은?", options: ["Isolation", "Atomic Operations", "Deadlock", "Context Switching"], answer: 1, hint: "나눌 수 없는 최소 단위라는 의미입니다.", explanation: "Atomic 클래스들은 CAS 연산을 사용하여 원자성을 보장하며 락 없이 동시성을 처리합니다." },
        { id: 317, difficulty: 'advanced', question: "Java에서 C나 C++ 라이브러리를 호출하기 위해 사용하는 인터페이스 기술은?", options: ["JAXB", "JDBC", "JNI", "JMS"], answer: 2, hint: "Native Interface의 약자가 포함됩니다.", explanation: "JNI(Java Native Interface)는 자바 코드가 네이티브 응용 프로그램 및 라이브러리와 통신하게 해줍니다." },
        { id: 318, difficulty: 'advanced', question: "객체 내부의 상태를 바깥으로 노출하지 않고 메시지 전달을 통해서만 상호작용하게 하는 원칙은?", options: ["Tell, Don't Ask", "DRY", "SOLID", "KISS"], answer: 0, hint: "묻지 말고 시켜라.", explanation: "객체의 상태를 조회하여 판단하기보다 객체에 직접 명령을 내리는 것이 캡슐화에 유리하다는 원칙입니다." },
        { id: 319, difficulty: 'advanced', question: "자바의 힙 메모리에서 Young Generation과 Old Generation의 비율을 조절하는 옵션은?", options: ["-Xmx", "-Xms", "-XX:NewRatio", "-XX:SurvivorRatio"], answer: 2, hint: "새로운 것과 오래된 것의 비율입니다.", explanation: "-XX:NewRatio 옵션으로 Young 영역과 Old 영역의 크기 비율을 설정할 수 있습니다." },
        { id: 320, difficulty: 'advanced', question: "Java 21의 가상 스레드 환경에서 Pinning 현상을 방지하기 위해 피해야 할 것은?", options: ["가변 변수 사용", "synchronized 블록 내 I/O 작업", "제네릭 사용", "재귀 호출"], answer: 1, hint: "가상 스레드가 플랫폼 스레드에 고정되는 현상입니다.", explanation: "synchronized 내 블로킹 I/O는 가상 스레드를 운반 스레드에 고정시켜 성능을 저하시킬 수 있으므로 ReentrantLock 사용이 권장됩니다." }
    ];

    let state = {
        difficulty: 'beginner',
        solvedIds: new Set(),
        wrongIds: new Set(),
        seenIds: new Set(),
        currentPool: [],
        currentIndex: 0,
        hasAnswered: false,
        mode: 'normal'
    };

    function setDiff(val, btn) {
        state.difficulty = val;
        syncDifficultyUI();
        updateDashboardButtons();
    }

    function syncDifficultyUI() {
        const difficultyLabels = {
            'beginner': '초보',
            'intermediate': '중수',
            'advanced': '고수',
            'all': '전체'
        };
        const currentLabel = difficultyLabels[state.difficulty];

        document.querySelectorAll('.diff-btn').forEach(btn => {
            const isMatch = btn.innerText.trim() === currentLabel;
            btn.classList.toggle('active', isMatch);
        });
    }

    function updateDashboardButtons() {
        let fullPool = (state.difficulty === 'all') ? [...masterQuestions] : masterQuestions.filter(q => q.difficulty === state.difficulty);
        const remaining = fullPool.filter(q => !state.solvedIds.has(q.id) && !state.wrongIds.has(q.id));
        const attemptedCount = fullPool.filter(q => state.solvedIds.has(q.id) || state.wrongIds.has(q.id)).length;

        const startInitBtn = document.getElementById('btn-start-init');
        const continueBtn = document.getElementById('btn-quiz-continue');

        let btnText = "학습 시작";
        let isDisabled = false;

        if (remaining.length === 0) {
            btnText = "준비 중 (Coming Soon...)";
            isDisabled = true;
        } else if (attemptedCount > 0) {
            btnText = "이어서 풀기";
        }

        if (startInitBtn) {
            startInitBtn.innerText = btnText;
            startInitBtn.disabled = isDisabled;
        }
        if (continueBtn) {
            continueBtn.innerText = btnText;
            continueBtn.disabled = isDisabled;
        }
    }

    function showView(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        const target = document.getElementById(`view-${viewId}`);
        if(target) target.classList.add('active');
        
        const closeable = ['quiz', 'list', 'wrong-note-list'].includes(viewId);
        document.getElementById('globalCloseBtn').style.display = closeable ? 'block' : 'none';
    }

    function startQuiz() {
        state.mode = 'normal';
        let pool = (state.difficulty === 'all') ? [...masterQuestions] : masterQuestions.filter(q => q.difficulty === state.difficulty);
        pool = pool.filter(q => !state.solvedIds.has(q.id) && !state.wrongIds.has(q.id));

        if (pool.length === 0) {
            showCelebrationModal();
            return;
        }

        state.currentPool = pool.sort(() => Math.random() - 0.5);
        state.currentIndex = 0;
        showView('quiz');
        loadQuestion();
    }

    function loadQuestion() {
        if (state.currentIndex >= state.currentPool.length) {
            showCelebrationModal();
            return;
        }

        const q = state.currentPool[state.currentIndex];
        state.hasAnswered = false;
        state.seenIds.add(q.id);

        document.getElementById('q-text').innerText = q.question;
        document.getElementById('q-feedback').style.display = 'none';
        document.getElementById('btn-giveup').disabled = false;
        
        const optionsArea = document.getElementById('options-area');
        optionsArea.innerHTML = '';
        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt;
            btn.onclick = () => handleAnswer(idx, btn);
            optionsArea.appendChild(btn);
        });
    }

    function handleAnswer(idx, btn) {
        const q = state.currentPool[state.currentIndex];
        
        if (!state.hasAnswered) {
            state.hasAnswered = true;
            if (idx === q.answer) {
                state.solvedIds.add(q.id);
                state.wrongIds.delete(q.id);
                btn.classList.add('correct');
                showFeedback(q.explanation, 'desc');
                disableOptions(document.getElementById('options-area'));
                updateDashboardStats();
            } else {
                state.wrongIds.add(q.id);
                btn.classList.add('wrong');
                showFeedback(`힌트: ${q.hint}`, 'hint');
                updateDashboardStats();
            }
        } else {
            if (idx === q.answer) {
                btn.classList.add('correct');
                showFeedback(q.explanation, 'desc');
                disableOptions(document.getElementById('options-area'));
            } else {
                btn.classList.add('wrong');
                btn.disabled = true;
            }
        }
    }

    function showCelebrationModal() {
        const diffName = state.difficulty === 'all' ? '전체' : (state.difficulty === 'beginner' ? '초보' : (state.difficulty === 'intermediate' ? '중수' : '고수'));
        const msg = document.getElementById('celeb-msg');
        msg.innerText = `${diffName} 난이도의 모든 문제를 정복하셨습니다!\n더 이상 풀 수 있는 새로운 문제가 없습니다.\n추후 업데이트될 새로운 문제들을 기다려 주세요!`;
        
        document.getElementById('modal-celebration').style.display = 'flex';
        goToDashboard();
    }

    function nextQuestion() {
        if (!state.hasAnswered) {
            const q = state.currentPool[state.currentIndex];
            state.wrongIds.add(q.id);
            updateDashboardStats();
        }
        
        state.currentIndex++;
        
        let fullPool = (state.difficulty === 'all') ? [...masterQuestions] : masterQuestions.filter(q => q.difficulty === state.difficulty);
        const remaining = fullPool.filter(q => !state.solvedIds.has(q.id) && !state.wrongIds.has(q.id));
        
        if (remaining.length === 0) {
            showCelebrationModal();
        } else if (state.currentIndex >= state.currentPool.length) {
            goToDashboard();
        } else {
            loadQuestion();
        }
    }

    function showFeedback(text, type, targetId = 'q-feedback') {
        const fb = document.getElementById(targetId);
        fb.innerText = text;
        fb.className = `feedback ${type}`;
        fb.style.display = 'block';
    }

    function disableOptions(container) {
        container.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
    }

    function showAnswer() {
        const q = state.currentPool[state.currentIndex];
        if (!state.hasAnswered) {
            state.hasAnswered = true;
            state.wrongIds.add(q.id);
            updateDashboardStats();
        }
        const btns = document.querySelectorAll('#options-area .opt-btn');
        btns[q.answer].classList.add('correct');
        showFeedback(q.explanation, 'desc');
        disableOptions(document.getElementById('options-area'));
        document.getElementById('btn-giveup').disabled = true;
    }

    function updateDashboardStats() {
        const correctCount = document.getElementById('count-correct');
        const wrongCount = document.getElementById('count-wrong');
        if(correctCount) correctCount.innerText = state.solvedIds.size;
        if(wrongCount) wrongCount.innerText = state.wrongIds.size;
        updateDashboardButtons();
    }

    function goToDashboard() {
        updateDashboardStats();
        syncDifficultyUI();
        showView('dashboard');
    }

    function openWrongActionModal() {
        const totalSolved = state.solvedIds.size;
        const totalWrong = state.wrongIds.size;

        if (totalSolved === 0 && totalWrong === 0) {
            document.getElementById('modal-no-attempts').style.display = 'flex';
            return;
        }

        if (totalWrong === 0) {
            document.getElementById('modal-no-wrong').style.display = 'flex';
            return;
        }

        document.getElementById('modal-action').style.display = 'flex';
    }

    function closeModal(id) { 
        document.getElementById(id).style.display = 'none'; 
    }

    function handleShowHistoryInModal() { closeModal('modal-action'); showHistory('wrong'); }

    function showHistory(type) {
        showView('list');
        const listDiv = document.getElementById('history-list');
        const title = document.getElementById('list-title');
        listDiv.innerHTML = '';
        
        const ids = type === 'correct' ? Array.from(state.solvedIds) : Array.from(state.wrongIds);
        title.innerText = type === 'correct' ? "정답 기록" : "오답 상세 내역";

        if (ids.length === 0) {
            listDiv.innerHTML = '<p style="padding:40px; color:#999; text-align:center">아직 기록이 없습니다.</p>';
            return;
        }

        ids.forEach(id => {
            const q = masterQuestions.find(item => item.id === id);
            if(!q) return;
            const item = document.createElement('div');
            item.className = 'list-item';
            const badgeMap = { beginner: 'beg', intermediate: 'mid', advanced: 'adv' };
            const labelMap = { beginner: '초보', intermediate: '중수', advanced: '고수' };

            item.innerHTML = `
                <div class="list-header" onclick="toggleHistory(this)">
                    <span class="badge ${badgeMap[q.difficulty]}">${labelMap[q.difficulty]}</span>
                    <span class="q-title">${q.question}</span>
                    <span class="arrow">▼</span>
                </div>
                <div class="list-content">
                    <p><strong>정답:</strong> ${q.options[q.answer]}</p>
                    <p><strong>상세 설명:</strong> ${q.explanation}</p>
                </div>
            `;
            listDiv.appendChild(item);
        });
    }

    function toggleHistory(header) {
        const content = header.nextElementSibling;
        const arrow = header.querySelector('.arrow');
        const isActive = content.classList.contains('active');
        content.classList.toggle('active');
        arrow.style.transform = isActive ? 'rotate(0deg)' : 'rotate(180deg)';
    }

    function openWrongNoteList() {
        closeModal('modal-action');
        showView('wrong-note-list');
        renderWrongNoteList();
    }

    function renderWrongNoteList() {
        const listDiv = document.getElementById('wrong-note-list');
        listDiv.innerHTML = '';
        
        const ids = Array.from(state.wrongIds);
        if (ids.length === 0) {
            listDiv.innerHTML = '<p style="padding:40px; color:#999; text-align:center">모든 오답을 정복하셨습니다!</p>';
        }

        ids.forEach(id => {
            const q = masterQuestions.find(item => item.id === id);
            if(!q) return;
            const item = document.createElement('div');
            item.className = 'list-item';
            const badgeMap = { beginner: 'beg', intermediate: 'mid', advanced: 'adv' };
            const labelMap = { beginner: '초보', intermediate: '중수', advanced: '고수' };

            item.innerHTML = `
                <div class="list-header" onclick="showNotePopup(${q.id})">
                    <span class="badge ${badgeMap[q.difficulty]}">${labelMap[q.difficulty]}</span>
                    <span class="q-title">${q.question}</span>
                </div>
            `;
            listDiv.appendChild(item);
        });
    }

    function showNotePopup(id) {
        const q = masterQuestions.find(item => item.id === id);
        const modal = document.getElementById('modal-note-quiz');
        const qText = document.getElementById('note-q-text');
        const optArea = document.getElementById('note-options-area');
        const fbArea = document.getElementById('note-q-feedback');
        
        qText.innerText = q.question;
        fbArea.style.display = 'none';
        optArea.innerHTML = '';
        
        let firstTry = true;

        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt;
            btn.onclick = () => {
                if (firstTry) {
                    if (idx === q.answer) {
                        btn.classList.add('correct');
                        state.wrongIds.delete(q.id);
                        state.solvedIds.add(q.id);
                        showFeedback(q.explanation, 'desc', 'note-q-feedback');
                        disableOptions(optArea);
                        
                        renderWrongNoteList(); 
                        updateDashboardStats();
                    } else {
                        firstTry = false;
                        btn.classList.add('wrong');
                        showFeedback(`힌트: ${q.hint}`, 'hint', 'note-q-feedback');
                    }
                } else {
                    if (idx === q.answer) {
                        btn.classList.add('correct');
                        showFeedback(q.explanation, 'desc', 'note-q-feedback');
                        disableOptions(optArea);
                    } else {
                        btn.classList.add('wrong');
                        btn.disabled = true;
                    }
                }
            };
            optArea.appendChild(btn);
        });

        modal.style.display = 'flex';
    }

    window.onload = () => {
        updateDashboardStats();
        syncDifficultyUI();
    };
</script>

</body>
</html>
