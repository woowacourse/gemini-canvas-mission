<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend Pro Interviewer - Premium Edition</title>
    <style>
        :root {
            --bg-color: #0b0f1a;
            --card-bg: #1e293b;
            --accent-primary: #38bdf8;
            --accent-secondary: #818cf8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --glass: rgba(255, 255, 255, 0.03);
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image:
                    radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.05) 0%, transparent 40%),
                    radial-gradient(circle at 90% 80%, rgba(129, 140, 248, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            overflow-x: hidden;
        }

        /* Progress Bar Section */
        .header-nav {
            width: 100%;
            max-width: 500px;
            margin-bottom: 3rem;
            text-align: center;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 0.75rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dim);
        }

        .progress-info span b {
            color: var(--accent-primary);
            font-size: 1.1rem;
        }

        .progress-track {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
            transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: -0.02em;
            margin-bottom: 2rem;
            background: linear-gradient(to right, #fff, var(--accent-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Flashcard Scene */
        .scene {
            width: 100%;
            max-width: 380px;
            height: 520px;
            perspective: 2000px;
            margin-bottom: 2rem;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .card.is-flipped { transform: rotateY(180deg); }

        .card__face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            padding: 3rem 2.5rem;
            border-radius: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }

        .card__face--front {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            justify-content: center;
            align-items: center;
        }

        .card__face--back {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            transform: rotateY(180deg);
            justify-content: space-between;
        }

        .label-badge {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--accent-primary);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-bottom: 1.5rem;
        }

        .card__face--front h2 {
            font-size: 1.8rem;
            line-height: 1.4;
            text-align: center;
        }

        .card__face--back p {
            font-size: 1.1rem;
            line-height: 1.7;
            color: #e2e8f0;
            margin-bottom: auto;
        }

        .btn-pressure {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            padding: 1.1rem;
            border-radius: 1.25rem;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-pressure:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 30px -5px rgba(56, 189, 248, 0.4);
        }

        /* Interview Section */
        .interview-container {
            width: 100%;
            max-width: 650px;
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: all 0.6s ease;
        }

        .interview-container.show {
            max-height: 2000px;
            opacity: 1;
            margin-top: 2rem;
        }

        .interview-box {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 2rem;
            padding: 2.5rem;
        }

        .interviewer-tag {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--accent-primary);
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .question-bubble {
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            color: #f8fafc;
            min-height: 60px;
        }

        .answer-area textarea {
            width: 100%;
            height: 160px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #334155;
            border-radius: 1.25rem;
            padding: 1.25rem;
            color: white;
            font-size: 1rem;
            line-height: 1.6;
            resize: none;
            margin-bottom: 1.5rem;
            transition: var(--transition);
        }

        .answer-area textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.1);
        }

        .btn-submit {
            background: var(--success);
            color: white;
            border: none;
            width: 100%;
            padding: 1.2rem;
            border-radius: 1.25rem;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn-submit:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .btn-submit:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
        }

        /* Modal Evaluation Result */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 26, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 1.5rem;
        }

        .modal-card {
            background: #1e293b;
            width: 100%;
            max-width: 600px;
            border-radius: 2.5rem;
            padding: 3rem;
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
            transform: scale(0.9);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-overlay.active { display: flex; }
        .modal-overlay.active .modal-card { transform: scale(1); opacity: 1; }

        .score-display {
            text-align: center;
            margin-bottom: 2rem;
        }

        .score-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.1);
            border: 4px solid var(--success);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: 900;
            color: var(--success);
            margin-bottom: 1rem;
        }

        .eval-section { margin-bottom: 1.5rem; }
        .eval-label { color: var(--accent-primary); font-weight: 800; font-size: 0.9rem; text-transform: uppercase; margin-bottom: 0.5rem; display: block; }
        .eval-content { line-height: 1.7; color: #cbd5e1; white-space: pre-wrap; }

        .model-answer-box {
            background: rgba(15, 23, 42, 0.5);
            padding: 1.5rem;
            border-radius: 1.5rem;
            border: 1px dashed rgba(255,255,255,0.2);
            margin-top: 1.5rem;
        }

        .btn-close-modal {
            background: var(--accent-primary);
            border: none;
            color: #0b0f1a;
            padding: 1rem 2rem;
            border-radius: 1rem;
            font-weight: 800;
            width: 100%;
            margin-top: 2rem;
            cursor: pointer;
        }

        /* Utils */
        .controls { display: flex; gap: 1rem; margin-top: 1rem; }
        .btn-next { background: #334155; border: none; color: white; padding: 0.8rem 2rem; border-radius: 1rem; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-next:hover { background: #475569; }

        .loader {
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .modal-card::-webkit-scrollbar { width: 6px; }
        .modal-card::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        @media (max-width: 480px) {
            .scene { height: 480px; }
            .modal-card { padding: 2rem; }
        }
    </style>
</head>
<body>

<!-- Header & Progress -->
<div class="header-nav">
    <div class="progress-info">
        <span>DAILY INTERVIEW PROGRESS</span>
        <span><b id="progress-val">0</b> / <span id="total-count">15</span> COMPLETED</span>
    </div>
    <div class="progress-track">
        <div class="progress-fill" id="progress-bar"></div>
    </div>
</div>

<h1>Backend Interview Pro</h1>

<!-- Card -->
<div class="scene">
    <div class="card" id="card">
        <div class="card__face card__face--front">
            <span class="label-badge">Interview Topic</span>
            <h2 id="q-title">객체지향 프로그래밍의 다형성<br>(Polymorphism)</h2>
        </div>
        <div class="card__face card__face--back">
            <span class="label-badge">Key Concept</span>
            <p id="a-desc">하나의 인터페이스나 상위 클래스를 여러 하위 클래스에서 다양한 방식으로 구현하여 유연성과 확장성을 높이는 설계 원칙입니다.</p>
            <button class="btn-pressure" id="btn-pressure">
                압박 면접 질문 받기 🔥
            </button>
        </div>
    </div>
</div>

<div class="controls">
    <button class="btn-next" id="btn-next">다른 카드 보기</button>
</div>

<!-- Interview Session -->
<div class="interview-container" id="interview-container">
    <div class="interview-box">
        <div class="interviewer-tag">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Senior Backend Engineer
        </div>
        <div class="question-bubble" id="interview-q"></div>

        <div class="answer-area">
            <textarea id="answer-text" placeholder="꼬리 질문에 대한 답변을 구체적으로 적어주세요..."></textarea>
            <button class="btn-submit" id="btn-submit">
                답변 제출 및 평가받기
            </button>
        </div>
    </div>
</div>

<!-- Result Modal -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal-card">
        <div class="score-display">
            <div class="score-circle" id="modal-score">0</div>
            <h3 style="font-size: 1.5rem;">면접 평가 결과</h3>
        </div>

        <div class="eval-section">
            <span class="eval-label">Interviewer's Feedback</span>
            <div class="eval-content" id="modal-feedback"></div>
        </div>

        <div class="model-answer-box">
            <span class="eval-label">Concise Model Answer</span>
            <div class="eval-content" id="modal-model-answer" style="color: var(--accent-primary);"></div>
        </div>

        <button class="btn-close-modal" id="btn-close-modal">학습 계속하기</button>
    </div>
</div>

<script>
    const apiKey = "";
    let completedCount = 0;
    let currentIndex = 0;

    // Extended Flashcard Data (15 Cards)
    const cardData = [
        {
            keyword: "Polymorphism (다형성)",
            title: "객체지향 프로그래밍의 다형성<br>(Polymorphism)",
            desc: "하나의 인터페이스나 상위 클래스를 여러 하위 클래스에서 다양한 방식으로 구현하여 유연성과 확장성을 높이는 설계 원칙입니다."
        },
        {
            keyword: "Dependency Injection (의존성 주입)",
            title: "Spring Framework의 의존성 주입<br>(DI)",
            desc: "객체 내부에서 직접 의존 대상을 생성하지 않고, 외부(IoC)에서 생성하여 주입해주는 패턴입니다. 결합도를 낮추고 테스트 용이성을 확보합니다."
        },
        {
            keyword: "Persistence Context (영속성 컨텍스트)",
            title: "JPA 영속성 컨텍스트<br>(Persistence Context)",
            desc: "엔티티를 영구 저장하고 관리하는 논리적 환경입니다. 1차 캐시, 쓰기 지연, Dirty Checking 등의 기능을 제공합니다."
        },
        {
            keyword: "B-Tree Index (인덱스)",
            title: "데이터베이스 B-Tree 인덱스<br>(Indexing)",
            desc: "데이터 검색 속도를 높이기 위해 특정 컬럼 데이터를 정렬하여 별도 관리하는 자료구조입니다. 읽기 성능을 높이고 쓰기 성능을 일부 희생합니다."
        },
        {
            keyword: "Event-Driven Architecture (이벤트 기반 구조)",
            title: "이벤트 기반 아키텍처<br>(EDA)",
            desc: "상태 변화(Event)를 감지하고 반응하는 방식입니다. 서비스 간 결합도를 최소화하고 비동기 처리를 통해 확장성을 높입니다."
        },
        {
            keyword: "Transaction Isolation Levels (트랜잭션 격리 수준)",
            title: "트랜잭션 격리 수준<br>(Isolation Level)",
            desc: "동시에 실행되는 트랜잭션들이 서로 얼마나 고립되어 있는지를 나타내는 수준입니다. Read Uncommitted부터 Serializable까지 4단계가 있습니다."
        },
        {
            keyword: "CAP Theorem (CAP 정리)",
            title: "분산 시스템의 CAP 정리<br>(CAP Theorem)",
            desc: "분산 시스템은 일관성(Consistency), 가용성(Availability), 분할 내성(Partition Tolerance)의 세 가지 속성을 동시에 모두 만족할 수 없다는 이론입니다."
        },
        {
            keyword: "Richardson Maturity Model (REST 성숙도 모델)",
            title: "REST API 성숙도 모델<br>(Maturity Model)",
            desc: "REST 원칙을 얼마나 잘 지키고 있는지를 단계별(Level 0~3)로 구분한 모델입니다. 하이퍼미디어(HATEOAS)를 포함하는 3단계가 최종입니다."
        },
        {
            keyword: "Connection Pool (커넥션 풀)",
            title: "데이터베이스 커넥션 풀<br>(HikariCP)",
            desc: "미리 일정 수의 DB 커넥션을 생성하여 풀에 담아두고, 요청 시 대여 및 반납하는 방식입니다. 매번 연결을 맺고 끊는 오버헤드를 줄입니다."
        },
        {
            keyword: "N+1 Problem (N+1 문제)",
            title: "JPA N+1 문제와 해결 방안<br>(N+1 Problem)",
            desc: "연관된 엔티티를 조회할 때, 의도치 않게 추가적인 쿼리가 N번 더 실행되는 문제입니다. Fetch Join이나 EntityGraph를 통해 해결합니다."
        },
        {
            keyword: "Distributed Lock (분산 락)",
            title: "Redis를 활용한 분산 락<br>(Distributed Lock)",
            desc: "여러 서버 인스턴스가 하나의 공유 자원에 접근할 때, 동시성을 제어하기 위해 외부 저장소(Redis 등)를 이용해 락을 관리하는 기법입니다."
        },
        {
            keyword: "Deadlock (교착 상태)",
            title: "교착 상태의 발생 조건<br>(Deadlock)",
            desc: "두 개 이상의 프로세스가 서로가 가진 자원을 기다리며 무한 대기에 빠지는 현상입니다. 상호 배제, 점유 및 대기, 비선점, 환형 대기 조건이 모두 만족될 때 발생합니다."
        },
        {
            keyword: "OAuth 2.0 Authorization Flow (인증 흐름)",
            title: "OAuth 2.0 인증 흐름<br>(OAuth 2.0)",
            desc: "제3의 애플리케이션이 사용자의 비밀번호 공유 없이 자원에 접근할 권한을 부여받는 표준 프레임워크입니다. Authorization Code 방식이 주로 쓰입니다."
        },
        {
            keyword: "Database Normalization (정규화)",
            title: "데이터베이스 정규화의 목적<br>(Normalization)",
            desc: "데이터 중복을 최소화하고 이상 현상(Anomaly)을 방지하기 위해 논리적 구조를 설계하는 과정입니다. 삽입, 삭제, 수정 이상을 해결합니다."
        },
        {
            keyword: "Cache Aside Pattern (캐시 어사이드 패턴)",
            title: "캐시 읽기 전략: Cache Aside<br>(Look Aside)",
            desc: "데이터 조회 시 먼저 캐시를 확인하고, 없으면 DB에서 조회하여 캐시에 저장하는 패턴입니다. 가장 널리 쓰이는 캐시 전략 중 하나입니다."
        }
    ];

    const card = document.getElementById('card');
    const qTitle = document.getElementById('q-title');
    const aDesc = document.getElementById('a-desc');
    const container = document.getElementById('interview-container');
    const iQ = document.getElementById('interview-q');
    const ansArea = document.getElementById('answer-text');
    const btnPressure = document.getElementById('btn-pressure');
    const btnSubmit = document.getElementById('btn-submit');
    const modal = document.getElementById('modal-overlay');
    const progressFill = document.getElementById('progress-bar');
    const progressVal = document.getElementById('progress-val');
    const totalCountEl = document.getElementById('total-count');

    // Initialize total count display
    totalCountEl.textContent = cardData.length;

    function updateProgress() {
        const percentage = Math.min((completedCount / cardData.length) * 100, 100);
        progressFill.style.width = percentage + "%";
        progressVal.textContent = completedCount;
    }

    function typeWriter(text, el, callback) {
        el.innerHTML = "";
        let i = 0;
        const timer = setInterval(() => {
            if (i < text.length) {
                el.innerHTML += text.charAt(i);
                i++;
            } else {
                clearInterval(timer);
                if(callback) callback();
            }
        }, 30);
    }

    async function fetchGemini(sysPrompt, userPrompt) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
        const payload = {
            contents: [{ parts: [{ text: userPrompt }] }],
            systemInstruction: { parts: [{ text: sysPrompt }] }
        };

        for (let i = 0, delay = 1000; i < 5; i++, delay *= 2) {
            try {
                const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (res.ok) {
                    const data = await res.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text;
                }
                if (res.status !== 429) throw new Error("API Error");
                await new Promise(r => setTimeout(r, delay));
            } catch (e) { if (i === 4) throw e; }
        }
    }

    card.addEventListener('click', (e) => {
        if (!e.target.closest('#btn-pressure')) card.classList.toggle('is-flipped');
    });

    document.getElementById('btn-next').addEventListener('click', () => {
        container.classList.remove('show');
        if (card.classList.contains('is-flipped')) {
            card.classList.remove('is-flipped');
            setTimeout(next, 400);
        } else next();
    });

    function next() {
        let nextIdx;
        do { nextIdx = Math.floor(Math.random() * cardData.length); } while (nextIdx === currentIndex);
        currentIndex = nextIdx;
        qTitle.innerHTML = cardData[currentIndex].title;
        aDesc.textContent = cardData[currentIndex].desc;
        ansArea.value = "";
        iQ.innerHTML = "";
    }

    btnPressure.addEventListener('click', async () => {
        btnPressure.disabled = true;
        btnPressure.innerHTML = `<div class="loader"></div>`;

        const sys = "너는 10년 차 수석 백엔드 개발자이자 깐깐한 면접관이야. 지원자가 제시한 키워드에 대해 실제 대규모 트래픽 환경에서 발생할 수 있는 '성능 병목'이나 '트레이드오프'에 대해 아주 날카로운 꼬리 질문을 딱 1개만 던져줘. 3문장 이내로.";
        const user = `키워드: ${cardData[currentIndex].keyword}`;

        try {
            const question = await fetchGemini(sys, user);
            container.classList.add('show');
            typeWriter(question, iQ);
            setTimeout(() => container.scrollIntoView({ behavior: 'smooth' }), 500);
        } catch (err) {
            alert("질문을 가져오지 못했습니다.");
        } finally {
            btnPressure.disabled = false;
            btnPressure.innerHTML = `압박 면접 질문 받기 🔥`;
        }
    });

    btnSubmit.addEventListener('click', async () => {
        const answer = ansArea.value.trim();
        if (!answer) return alert("답변을 입력해주세요.");

        btnSubmit.disabled = true;
        btnSubmit.innerHTML = `<div class="loader"></div> 평가 진행 중...`;

        const sys = `지원자가 당신의 꼬리 질문에 답변했어.
            1. 기술적 정확성을 100점 만점으로 평가해.
            2. 실무 관점의 보완점(Best Practice)을 3줄 이내로 피드백해.
            3. 마지막에 이 질문에 대한 가장 완벽한 'Model Answer'를 예시로 작성해줘.
               - 단, 길이를 기존 대비 절반 정도로 줄여서 핵심만 담을 것.
               - 불렛 포인트(-)를 사용하여 가독성 있게 구조화할 것.
            응답은 반드시 JSON 형식으로 해: {"score": 숫자, "feedback": "내용", "modelAnswer": "내용"}`;

        const user = `질문: ${iQ.textContent}\n지원자 답변: ${answer}`;

        try {
            const resultText = await fetchGemini(sys, user);
            const jsonStr = resultText.match(/\{.*\}/s)[0];
            const res = JSON.parse(jsonStr);

            document.getElementById('modal-score').textContent = res.score;
            document.getElementById('modal-feedback').textContent = res.feedback;
            document.getElementById('modal-model-answer').innerHTML = res.modelAnswer.replace(/\n/g, '<br>');

            modal.classList.add('active');

            if (res.score >= 50) {
                completedCount++;
                updateProgress();
            }
        } catch (err) {
            alert("평가에 실패했습니다. 다시 시도해주세요.");
        } finally {
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = `답변 제출 및 평가받기`;
        }
    });

    document.getElementById('btn-close-modal').addEventListener('click', () => {
        modal.classList.remove('active');
        document.getElementById('btn-next').click();
    });
</script>
</body>
</html>
