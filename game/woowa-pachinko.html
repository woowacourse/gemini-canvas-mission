<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우아파칭코 - 프리미엄 에디션</title>
    <style>
        :root {
            --bg-color: #020617;
            --panel-color: #1e293b;
            --accent-color: #38bdf8;
            --neon-pink: #f472b6;
            --neon-green: #4ade80;
            --neon-yellow: #fbbf24;
            --gold-gradient: linear-gradient(135deg, #f59e0b, #fbbf24, #f59e0b);
            --text-color: #f8fafc;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-wrapper {
            display: flex;
            gap: 0;
            padding: 30px;
            background: linear-gradient(180deg, #334155 0%, #0f172a 100%);
            border-radius: 50px;
            box-shadow: 
                0 0 0 10px #1e293b,
                0 0 100px rgba(56, 189, 248, 0.3),
                inset 0 0 20px rgba(255, 255, 255, 0.1);
            border: 4px solid #475569;
            position: relative;
        }

        .machine-header {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            background: #0f172a;
            padding: 10px 40px;
            border-radius: 20px;
            border: 3px solid var(--accent-color);
            box-shadow: 0 0 20px var(--accent-color);
            z-index: 10;
        }

        .machine-header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px var(--accent-color), 0 0 20px var(--accent-color);
            letter-spacing: 2px;
        }

        #canvas-container {
            position: relative;
            background: #000;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 1);
            border: 10px solid #111827;
        }

        canvas {
            display: block;
        }

        #ui-panel {
            width: 300px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 20px;
            border-radius: 0 40px 40px 0;
            border-left: 2px solid rgba(255, 255, 255, 0.1);
        }

        .stats-card {
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.5) 0%, rgba(15, 23, 42, 0.8) 100%);
            padding: 25px;
            border-radius: 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .stat-item {
            margin-bottom: 20px;
        }

        .stat-label {
            display: block;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 8px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        #score { color: var(--neon-green); text-shadow: 0 0 10px rgba(74, 222, 128, 0.5); }
        #balls { color: var(--neon-pink); text-shadow: 0 0 10px rgba(244, 114, 182, 0.5); }

        .control-group {
            margin-bottom: 20px;
        }

        .power-controller {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #020617;
            padding: 12px;
            border-radius: 20px;
            margin-bottom: 15px;
            border: 1px solid #334155;
        }

        .ctrl-btn {
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #334155, #1e293b);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 24px;
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #0f172a;
        }

        .ctrl-btn:hover { background: #475569; transform: translateY(-1px); }
        .ctrl-btn:active { transform: translateY(2px); box-shadow: none; }

        #powerDisplay {
            font-size: 28px;
            font-weight: 900;
            color: var(--accent-color);
            min-width: 50px;
            text-align: center;
            text-shadow: 0 0 10px var(--accent-color);
        }

        button#launch-btn {
            width: 100%;
            padding: 22px;
            font-size: 24px;
            font-weight: 900;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            background: linear-gradient(180deg, var(--accent-color), #0284c7);
            color: #fff;
            box-shadow: 0 6px 0 #0369a1, 0 10px 20px rgba(56, 189, 248, 0.4);
            transition: all 0.1s;
        }

        button#launch-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0369a1;
        }

        #reset-btn {
            width: 100%;
            padding: 10px;
            background: transparent;
            color: #475569;
            border: 1px solid #334155;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 15px;
            font-size: 11px;
            transition: all 0.3s;
        }

        #reset-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 6, 23, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            border-radius: 16px;
        }

        #overlay.active { display: flex; animation: fadeIn 0.5s ease-out; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .game-description {
            margin-top: 25px;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .desc-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 12px;
            line-height: 1.4;
        }

        .desc-tag {
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 900;
            font-size: 10px;
            min-width: 55px;
            text-align: center;
        }

        .tag-chance { background: var(--neon-yellow); color: #000; }
        .tag-goal { background: var(--neon-green); color: #000; }
        .tag-out { background: var(--out); color: #fff; }

        .guide-text {
            font-size: 11px;
            color: #64748b;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <div class="machine-header">
        <h1>우아파칭코</h1>
    </div>

    <div id="canvas-container">
        <canvas id="pachinkoCanvas" width="540" height="800"></canvas>
        <div id="overlay">
            <h2 style="color:var(--neon-pink); font-size:48px; font-weight:900; margin-bottom:10px;">LIMIT OVER</h2>
            <p style="font-size:20px; margin-bottom:30px;">최종 획득 점수: <span id="final-score-val" style="color:var(--neon-green); font-weight:bold;">0</span></p>
            <button onclick="initGame()" style="padding:15px 40px; cursor:pointer; background:var(--accent-color); border:none; border-radius:12px; font-weight:bold; color:white; font-size:18px; box-shadow: 0 5px 15px rgba(56,189,248,0.4);">RESTART</button>
        </div>
    </div>

    <div id="ui-panel">
        <div class="stats-card">
            <div class="stat-item">
                <span class="stat-label">점수</span>
                <span id="score" class="stat-value">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">남은 구슬</span>
                <span id="balls" class="stat-value">500</span>
            </div>
        </div>

        <div class="controls">
            <div class="guide-text">
                [Space] 연속 발사 / [↑/↓] 강도 조절
            </div>
            
            <div class="control-group">
                <div class="power-controller">
                    <button class="ctrl-btn" id="btnPowerDown">−</button>
                    <span id="powerDisplay">18</span>
                    <button class="ctrl-btn" id="btnPowerUp">+</button>
                </div>
            </div>
            
            <button id="launch-btn">발사!</button>

            <!-- 게임 설명 섹션 -->
            <div class="game-description">
                <div class="desc-item">
                    <span class="desc-tag tag-chance">CHANCE</span>
                    <span>중앙 포켓 진입 시 슬롯 가동!<br>잭팟 당첨 시 <strong>10,000점</strong></span>
                </div>
                <div class="desc-item">
                    <span class="desc-tag tag-goal">GOAL</span>
                    <span>최하단 움직이는 골인 지점!<br>통과 시 즉시 <strong>5,000점</strong></span>
                </div>
                <div class="desc-item">
                    <span class="desc-tag tag-out">OUT</span>
                    <span>구슬이 소멸되는 구멍입니다.<br>최대한 피해서 골인하세요!</span>
                </div>
            </div>
        </div>

        <button id="reset-btn" onclick="initGame()">기기 초기화</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('pachinkoCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const ballsEl = document.getElementById('balls');
    const powerDisplay = document.getElementById('powerDisplay');
    const btnPowerUp = document.getElementById('btnPowerUp');
    const btnPowerDown = document.getElementById('btnPowerDown');
    const launchBtn = document.getElementById('launch-btn');
    const overlay = document.getElementById('overlay');
    const finalScoreVal = document.getElementById('final-score-val');

    const COLORS = {
        accent: '#38bdf8',
        pink: '#f472b6',
        green: '#4ade80',
        yellow: '#fbbf24',
        out: '#ef4444',
        bgSpace: '#030712'
    };

    const CONFIG = {
        GRAVITY: 0.28,
        FRICTION: 0.993,
        WALL_BOUNCE: 0.45,
        PEG_BOUNCE: 0.75,
        SPINNER_BOUNCE: 0.94,
        INITIAL_BALLS: 500,
        BALL_RADIUS: 5,
        PEG_RADIUS: 4,
        LAUNCH_COOLDOWN: 100
    };

    let state = {
        score: 0,
        remainingBalls: CONFIG.INITIAL_BALLS,
        balls: [],
        pegs: [],
        spinners: [],
        goal: null,
        walls: [],
        outHoles: [],
        currentPower: 18,
        isGameOver: false,
        isSpacePressed: false,
        lastLaunchTime: 0,
        reservations: 0,
        isSpinning: false,
        spinTimer: 0,
        spinResults: [0, 0, 0],
        jackpotActive: false,
        jackpotFlash: 0,
        pulseAnim: 0,
        mascotImg: null,
        imgLoaded: false,
        launchFlash: 0
    };

    const loadMascot = () => {
        state.mascotImg = new Image();
        state.mascotImg.src = 'https://raw.githubusercontent.com/woowacourse/woowacourse-docs/main/logo/planet.png';
        state.mascotImg.onload = () => { state.imgLoaded = true; };
    };

    class Ball {
        constructor(x, y, vx, vy) {
            this.x = x; this.y = y; this.vx = vx; this.vy = vy;
            this.radius = CONFIG.BALL_RADIUS;
            this.isDead = false;
            this.color = '#fff';
        }
        update() {
            this.vy += CONFIG.GRAVITY;
            this.vx *= CONFIG.FRICTION;
            this.vy *= CONFIG.FRICTION;
            if (state.goal) {
                const dx = this.x - (state.goal.x + state.goal.width/2);
                const dy = this.y - (state.goal.y - 15);
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 50) this.vx += (dx > 0 ? 0.08 : -0.08); 
            }
            this.vx += (Math.random() - 0.5) * 0.04; 
            this.x += this.vx; this.y += this.vy;
            if (this.x - this.radius < 0) { this.x = this.radius; this.vx *= -CONFIG.WALL_BOUNCE; }
            else if (this.x + this.radius > canvas.width) { this.x = canvas.width - this.radius; this.vx *= -CONFIG.WALL_BOUNCE; }
            if (this.y - this.radius < 0) { this.y = this.radius; this.vy *= -CONFIG.WALL_BOUNCE; }
            if (this.y - this.radius > canvas.height) this.isDead = true;
        }
        draw() {
            ctx.save();
            ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#fff';
            ctx.fill();
            ctx.restore();
        }
    }

    class Spinner {
        constructor(x, y, length, speed, isGuarding = false, moveRange = 0) {
            this.originX = x; this.x = x; this.y = y; this.length = length;
            this.angle = Math.random() * Math.PI; this.baseSpeed = speed; this.speed = speed;
            this.thickness = isGuarding ? 8 : 5; this.isGuarding = isGuarding;
            this.speedModTimer = 0; this.moveRange = moveRange; 
            this.moveAngle = Math.random() * Math.PI * 2; this.moveSpeed = 0.02 + Math.random() * 0.02;
        }
        update() { 
            if (this.isGuarding) {
                this.speedModTimer++;
                if (this.speedModTimer > 60) { this.speed = this.baseSpeed * (0.7 + Math.random() * 2); this.speedModTimer = 0; }
            }
            this.angle += this.speed; 
            if (this.moveRange > 0) {
                this.moveAngle += this.moveSpeed;
                this.x = this.originX + Math.sin(this.moveAngle) * this.moveRange;
            }
        }
        draw() {
            ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle);
            ctx.fillStyle = this.isGuarding ? COLORS.pink : COLORS.yellow;
            ctx.shadowBlur = 15; ctx.shadowColor = this.isGuarding ? COLORS.pink : COLORS.yellow;
            ctx.fillRect(-this.length/2, -this.thickness/2, this.length, this.thickness);
            ctx.fillRect(-this.thickness/2, -this.length/2, this.thickness, this.length);
            ctx.restore();
        }
        checkCollision(ball) {
            const dx = ball.x - this.x; const dy = ball.y - this.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < (this.length / 2) + ball.radius) {
                const nx = dx / dist; const ny = dy / dist;
                const powerMult = this.isGuarding ? 80 : 60;
                const tangentX = -ny * this.speed * powerMult; const tangentY = nx * this.speed * powerMult;
                ball.vx = (ball.vx * -CONFIG.SPINNER_BOUNCE) + tangentX;
                ball.vy = (ball.vy * -CONFIG.SPINNER_BOUNCE) + tangentY;
                ball.x += nx * 6; ball.y += ny * 6;
            }
        }
    }

    class Peg {
        constructor(x, y, isBumper = false) {
            this.x = x; this.y = y; this.radius = isBumper ? 9 : CONFIG.PEG_RADIUS;
            this.isBumper = isBumper; this.active = false; this.activeTimer = 0;
        }
        draw() {
            ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            if (this.isBumper) {
                ctx.fillStyle = this.active ? '#fff' : COLORS.pink;
                ctx.shadowBlur = 15; ctx.shadowColor = COLORS.pink;
            } else { ctx.fillStyle = this.active ? COLORS.accent : '#334155'; }
            ctx.fill(); ctx.shadowBlur = 0;
            if (this.activeTimer > 0) { this.activeTimer--; if (this.activeTimer === 0) this.active = false; }
        }
    }

    class GoalZone {
        constructor() {
            this.width = 32; this.height = 35;
            this.originX = canvas.width / 2 - this.width / 2; this.x = this.originX;
            this.originY = canvas.height - 110; this.y = this.originY; this.angle = 0;
        }
        update() { this.angle += 0.04; this.y = this.originY + Math.sin(this.angle) * 10; }
        draw() {
            ctx.save(); ctx.strokeStyle = COLORS.green; ctx.lineWidth = 4;
            ctx.shadowBlur = 25; ctx.shadowColor = COLORS.green;
            ctx.strokeRect(this.x, this.y, this.width, this.height);
            ctx.fillStyle = COLORS.green; ctx.font = '900 11px Arial';
            ctx.textAlign = 'center'; ctx.fillText("GOAL", this.x + this.width / 2, this.y + 22);
            ctx.restore();
        }
        checkScore(ball) { return ball.x > this.x && ball.x < this.x + this.width && ball.y > this.y && ball.y < this.y + this.height; }
    }

    class GuideWall {
        constructor(x1, y1, x2, y2) { this.x1 = x1; this.y1 = y1; this.x2 = x2; this.y2 = y2; }
        draw() {
            ctx.save();
            ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 12; ctx.lineCap = 'round';
            ctx.shadowBlur = 5; ctx.shadowColor = 'rgba(255,255,255,0.1)';
            ctx.beginPath(); ctx.moveTo(this.x1, this.y1); ctx.lineTo(this.x2, this.y2); ctx.stroke();
            ctx.restore();
        }
        checkCollision(ball) {
            const dx = this.x2 - this.x1; const dy = this.y2 - this.y1;
            const lenSq = dx * dx + dy * dy;
            const t = Math.max(0, Math.min(1, ((ball.x - this.x1) * dx + (ball.y - this.y1) * dy) / lenSq));
            const projX = this.x1 + t * dx; const projY = this.y1 + t * dy;
            const dist = Math.sqrt((ball.x - projX) ** 2 + (ball.y - projY) ** 2);
            if (dist < ball.radius + 6) {
                const nx = (ball.x - projX) / dist; const ny = (ball.y - projY) / dist;
                const dot = ball.vx * nx + ball.vy * ny;
                ball.vx = (ball.vx - 2 * dot * nx) * 0.45;
                ball.vy = (ball.vy - 2 * dot * ny) * 0.45;
                ball.x += nx * 4; ball.y += ny * 4;
            }
        }
        getDistToPoint(px, py) {
            const dx = this.x2 - this.x1; const dy = this.y2 - this.y1;
            const lenSq = dx * dx + dy * dy;
            const t = Math.max(0, Math.min(1, ((px - this.x1) * dx + (py - this.y1) * dy) / lenSq));
            return Math.sqrt((px - (this.x1 + t * dx))**2 + (py - (this.y1 + t * dy))**2);
        }
    }

    function initGame() {
        state = { ...state, score: 0, remainingBalls: CONFIG.INITIAL_BALLS, balls: [], pegs: [], spinners: [], walls: [], 
                  reservations: 0, isSpinning: false, jackpotActive: false, isGameOver: false, pulseAnim: 0, launchFlash: 0 };
        overlay.classList.remove('active');
        state.goal = new GoalZone();
        const centerX = canvas.width / 2;
        state.outHoles = [{ x: 50, y: canvas.height - 45, radius: 25 }, { x: canvas.width - 50, y: canvas.height - 45, radius: 25 }];
        const chanceTopY = 480; const chanceGateHalfWidth = 15; 
        state.walls.push(new GuideWall(centerX - chanceGateHalfWidth, chanceTopY, centerX - 110, 530), new GuideWall(centerX + chanceGateHalfWidth, chanceTopY, centerX + 110, 530));
        const mountainTopY = canvas.height - 120; const goalFunnelGap = 60; 
        state.walls.push(new GuideWall(centerX - (goalFunnelGap/2), mountainTopY, 70, canvas.height - 70), new GuideWall(centerX + (goalFunnelGap/2), mountainTopY, canvas.width - 70, canvas.height - 70));
        const rows = 18; const cols = 13;
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                let x = c * (canvas.width / cols) + (canvas.width / cols) / 2;
                if (r % 2 === 1) x += (canvas.width / cols) / 2;
                let y = 120 + r * 35;
                const inLCD = x > 130 && x < 410 && y > 170 && y < 430;
                const inBottom = y > mountainTopY - 40;
                let tooCloseToWall = false;
                state.walls.forEach(w => { if (w.getDistToPoint(x, y) < 30) tooCloseToWall = true; });
                if (!inLCD && !inBottom && !tooCloseToWall && x > 25 && x < canvas.width - 25) {
                    let spawnProb = (Math.abs(x - centerX) < 65) ? 0.35 : 0.8; 
                    if (Math.random() < spawnProb) state.pegs.push(new Peg(x, y, Math.random() > 0.94));
                }
            }
        }
        state.pegs.push(new Peg(centerX - 35, 535), new Peg(centerX + 35, 535), new Peg(centerX, 580, true)); 
        state.spinners.push(new Spinner(centerX, mountainTopY - 80, 85, 0.06, true, 30));
        state.spinners.push(new Spinner(100, 250, 60, 0.03, false, 40), new Spinner(440, 250, 60, -0.03, false, 40));
        state.spinners.push(new Spinner(120, 500, 50, -0.04), new Spinner(420, 500, 50, 0.04));
        updateUI();
    }

    function drawLCD() {
        const x = 160, y = 200, w = 220, h = 180;
        ctx.fillStyle = '#000'; ctx.strokeStyle = '#475569'; ctx.lineWidth = 6;
        ctx.fillRect(x, y, w, h); ctx.strokeRect(x, y, w, h);
        ctx.save(); ctx.globalAlpha = 0.1; ctx.fillStyle = state.jackpotActive ? COLORS.pink : COLORS.accent; ctx.fillRect(x, y, w, h); ctx.restore();
        if (state.jackpotActive) {
            state.jackpotFlash++;
            ctx.fillStyle = state.jackpotFlash % 10 < 5 ? COLORS.pink : '#fff';
            ctx.font = '900 42px Arial'; ctx.textAlign = 'center'; ctx.fillText("JACKPOT", x + w/2, y + h/2 + 5);
            ctx.shadowBlur = 20; ctx.shadowColor = COLORS.pink;
        } else if (state.isSpinning) {
            ctx.fillStyle = '#fff'; ctx.font = '900 64px Arial'; ctx.textAlign = 'center';
            const elapsed = Date.now() - state.spinTimer;
            const drawNum = (num, offset) => ctx.fillText(num, x + w/2 + offset, y + h/2 + 20);
            let n1 = state.spinResults[0], n2 = state.spinResults[1], n3 = state.spinResults[2];
            if (elapsed < 1000) n1 = Math.floor(Math.random() * 10);
            if (elapsed < 2000) n2 = Math.floor(Math.random() * 10);
            if (elapsed < 3000) n3 = Math.floor(Math.random() * 10);
            drawNum(n1, -65); drawNum(n2, 0); drawNum(n3, 65);
            if (elapsed > 3500) { state.isSpinning = false; checkSpinResult(n1, n2, n3); }
        } else {
            ctx.fillStyle = '#334155'; ctx.font = '900 24px Arial'; ctx.textAlign = 'center'; ctx.fillText("INSERT BALLS", x + w/2, y + h/2 + 5);
        }
        state.pulseAnim += 0.08;
        const pulse = Math.sin(state.pulseAnim) * 4;
        ctx.fillStyle = '#475569'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'left'; ctx.fillText("STOCK:", x + 15, y + h - 15);
        for (let i = 0; i < 4; i++) {
            const lx = x + 75 + i * 32; const ly = y + h - 18;
            const isActive = i < state.reservations;
            ctx.save();
            if (isActive) {
                ctx.shadowBlur = 15 + pulse; ctx.shadowColor = COLORS.accent;
                ctx.fillStyle = COLORS.accent; ctx.translate(lx, ly); ctx.rotate(Math.PI / 4); ctx.fillRect(-7, -7, 14, 14);
            } else {
                ctx.fillStyle = '#0f172a'; ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1; ctx.translate(lx, ly); ctx.rotate(Math.PI / 4); ctx.fillRect(-6, -6, 12, 12); ctx.strokeRect(-6, -6, 12, 12);
            }
            ctx.restore();
        }
    }

    function checkSpinResult(n1, n2, n3) {
        if (n1 === n2 && n2 === n3) {
            state.jackpotActive = true; state.score += 10000;
            setTimeout(() => { state.jackpotActive = false; if (state.reservations > 0) { state.reservations--; startSpin(); } }, 6000);
        } else if (state.reservations > 0) { state.reservations--; startSpin(); }
        updateUI();
    }

    function startSpin() {
        if (state.isSpinning || state.jackpotActive) return;
        state.isSpinning = true; state.spinTimer = Date.now();
        const win = Math.random() < 0.06;
        if (win) { const n = Math.floor(Math.random() * 10); state.spinResults = [n, n, n]; } 
        else { state.spinResults = [Math.floor(Math.random() * 10), Math.floor(Math.random() * 10), Math.floor(Math.random() * 10)]; }
    }

    function launchBall() {
        if (state.remainingBalls <= 0 || state.isGameOver) return;
        const now = Date.now(); if (now - state.lastLaunchTime < CONFIG.LAUNCH_COOLDOWN) return;
        state.remainingBalls--; state.lastLaunchTime = now; state.launchFlash = 1.0; updateUI();
        state.balls.push(new Ball(canvas.width - 35, 60, (-state.currentPower * 0.52) + (Math.random() - 0.5) * 4, (-state.currentPower * 0.1) + (Math.random() - 0.5) * 3));
    }

    function resolveCollision(ball, peg) {
        const dx = ball.x - peg.x; const dy = ball.y - peg.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < ball.radius + peg.radius) {
            peg.active = true; peg.activeTimer = 10;
            const nx = dx / dist, ny = dy / dist;
            const dot = ball.vx * nx + ball.vy * ny;
            const bounce = peg.isBumper ? 1.6 : CONFIG.PEG_BOUNCE;
            ball.vx = (ball.vx - 2 * dot * nx) * bounce + (Math.random() - 0.5) * 0.6;
            ball.vy = (ball.vy - 2 * dot * ny) * bounce;
            ball.x += nx * (ball.radius + peg.radius - dist + 3);
            ball.y += ny * (ball.radius + peg.radius - dist + 3);
        }
    }

    function updateUI() {
        scoreEl.innerText = state.score.toLocaleString();
        ballsEl.innerText = state.remainingBalls;
        powerDisplay.innerText = state.currentPower;
        if (state.remainingBalls === 0 && state.balls.length === 0 && !state.isSpinning && !state.jackpotActive) {
            state.isGameOver = true; finalScoreVal.innerText = state.score.toLocaleString(); overlay.classList.add('active');
        }
    }

    function drawOutHoles() {
        state.outHoles.forEach((hole) => {
            ctx.save(); ctx.beginPath(); ctx.arc(hole.x, hole.y, hole.radius, 0, Math.PI * 2);
            const grad = ctx.createRadialGradient(hole.x, hole.y, 5, hole.x, hole.y, hole.radius);
            grad.addColorStop(0, '#1a0000'); grad.addColorStop(1, '#000');
            ctx.fillStyle = grad; ctx.fill(); ctx.strokeStyle = COLORS.out; ctx.lineWidth = 4; ctx.globalAlpha = 0.8; ctx.stroke();
            ctx.shadowBlur = 10; ctx.shadowColor = COLORS.out;
            ctx.fillStyle = COLORS.out; ctx.font = 'black 12px Arial'; ctx.textAlign = 'center'; ctx.globalAlpha = 1.0; ctx.fillText("OUT", hole.x, hole.y + 6);
            ctx.restore();
        });
    }

    function drawBackgroundMascot() {
        if (!state.mascotImg || !state.imgLoaded) return;
        ctx.save(); ctx.imageSmoothingEnabled = false; ctx.filter = 'invert(1) brightness(1.2) contrast(1.2)'; ctx.globalAlpha = 0.2; 
        const size = 450; const x = canvas.width / 2 - size / 2; const y = canvas.height / 2 - size / 2 + 60;
        ctx.shadowBlur = 40; ctx.shadowColor = COLORS.accent; ctx.drawImage(state.mascotImg, x, y, size, size);
        ctx.restore();
    }

    function drawLauncher() {
        const lx = canvas.width - 35;
        const ly = 60;
        if (state.launchFlash > 0) {
            ctx.save(); ctx.beginPath();
            const grad = ctx.createRadialGradient(lx, ly, 5, lx, ly, 50);
            grad.addColorStop(0, `rgba(56, 189, 248, ${state.launchFlash})`);
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad; ctx.arc(lx, ly, 50, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
            state.launchFlash -= 0.1;
        }
        ctx.save();
        ctx.strokeStyle = '#64748b'; ctx.lineWidth = 14; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(canvas.width - 5, 60); ctx.lineTo(canvas.width - 50, 60); ctx.stroke();
        ctx.fillStyle = COLORS.accent; ctx.shadowBlur = 15; ctx.shadowColor = COLORS.accent;
        ctx.beginPath(); ctx.arc(lx, ly, 8, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }

    function update() {
        ctx.fillStyle = COLORS.bgSpace; ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawBackgroundMascot();
        if (state.isSpacePressed) launchBall();
        ctx.save(); ctx.globalAlpha = 0.08;
        const grad = ctx.createRadialGradient(canvas.width/2, state.goal.y-15, 5, canvas.width/2, state.goal.y-15, 60);
        grad.addColorStop(0, COLORS.pink); grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(canvas.width/2, state.goal.y-15, 60, 0, Math.PI*2); ctx.fill(); ctx.restore();

        const chanceW = 32;
        ctx.save();
        ctx.shadowBlur = 20; ctx.shadowColor = COLORS.yellow;
        ctx.fillStyle = COLORS.yellow; 
        ctx.fillRect(canvas.width/2 - chanceW/2, 520, chanceW, 25);
        ctx.fillStyle = '#000'; ctx.font = '900 10px Arial'; ctx.textAlign = 'center'; ctx.fillText("CHANCE", canvas.width/2, 537);
        ctx.restore();

        drawOutHoles();
        state.goal.update(); state.goal.draw();
        drawLCD();
        drawLauncher();
        state.walls.forEach(w => w.draw());
        state.pegs.forEach(p => p.draw());
        state.spinners.forEach(s => { s.update(); s.draw(); });

        for (let i = state.balls.length - 1; i >= 0; i--) {
            const ball = state.balls[i]; ball.update();
            state.pegs.forEach(peg => resolveCollision(ball, peg));
            state.spinners.forEach(spinner => spinner.checkCollision(ball));
            state.walls.forEach(wall => wall.checkCollision(ball));
            if (ball.x > canvas.width/2 - chanceW/2 && ball.x < canvas.width/2 + chanceW/2 && ball.y > 520 && ball.y < 545) {
                if (state.reservations < 4) { if (!state.isSpinning && !state.jackpotActive) startSpin(); else state.reservations++; }
                state.score += 50; ball.isDead = true; updateUI();
            }
            if (state.goal.checkScore(ball)) { state.score += 5000; ball.isDead = true; updateUI(); }
            state.outHoles.forEach(hole => { if (Math.sqrt((ball.x - hole.x)**2 + (ball.y - hole.y)**2) < hole.radius) ball.isDead = true; });
            ball.draw(); if (ball.isDead) state.balls.splice(i, 1);
        }
        requestAnimationFrame(update);
    }

    const changePower = (d) => { state.currentPower = Math.max(8, Math.min(35, state.currentPower + d)); updateUI(); };
    btnPowerUp.onclick = () => changePower(1); btnPowerDown.onclick = () => changePower(-1);
    launchBtn.onmousedown = () => state.isSpacePressed = true; window.onmouseup = () => state.isSpacePressed = false;
    window.onkeydown = (e) => {
        if (e.code === 'Space') { e.preventDefault(); state.isSpacePressed = true; }
        if (e.code === 'ArrowUp') { e.preventDefault(); changePower(1); }
        if (e.code === 'ArrowDown') { e.preventDefault(); changePower(-1); }
    };
    window.onkeyup = (e) => { if (e.code === 'Space') state.isSpacePressed = false; };
    loadMascot(); initGame(); update();
</script>
