  <!-- Tailwind Custom Config -->
  <script>
    tailwind.config = {
      theme: {

          fontFamily: {

          }
        }
      }
    }
  </script>

  <style>

      100% { opacity: 1; transform: translate(-50%, 0); }
    }
    /* Custom scrollbar for chat */
    .chat-scroll::-webkit-scrollbar { width: 6px; }
    .chat-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Hide views by default */
    .view-section { display: none; }
    .view-section.active { display: block; animation: fadeIn 0.2s ease-out; }

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-red-600');
        btn.classList.add('text-gray-400');
        const icon = btn.querySelector('svg');
        if (icon) icon.classList.remove('fill-current');
      });

      const activeBtn = document.getElementById(`nav-${tabId}`);
      activeBtn.classList.remove('text-gray-400');
      activeBtn.classList.add('text-red-600');
      const activeIcon = activeBtn.querySelector('svg');
      if (tabId === 'home' && activeIcon) activeIcon.classList.add('fill-current'); // Special fill for home

      if (tabId === 'chat') {
        scrollToBottom();
      }
      
      lucide.createIcons();
    };

    window.goToLink = function(tabId, category) {
      if(tabId === 'words') {
        state.wordCategory = category;
        state.wordPage = 1;
        renderWordCategories();
        renderWords();
      } else if (tabId === 'phrases') {
        state.phraseCategory = category;
        state.phrasePage = 1;
        renderPhraseCategories();
        renderPhrases();
      }
      switchTab(tabId);
    };

    function renderItemCard(item) {
      return `
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between mb-3 hover:shadow-md transition-shadow">
          <div class="flex-1 pr-4">
            <h3 class="text-gray-900 font-bold mb-1">${item.kr}</h3>
            <p class="text-xl font-bold text-red-600 tracking-wide mb-1 font-mplus">${item.jp}</p>
            <p class="text-gray-500 text-sm">[${item.pron}]</p>
          </div>
          <button onclick="playTTS('${item.jp}')" class="w-12 h-12 bg-red-50 text-red-500 rounded-full flex items-center justify-center hover:bg-red-100 active:scale-95 transition-all flex-shrink-0">
            <i data-lucide="volume-2" class="w-6 h-6"></i>
          </button>
        </div>
      `;
    }

    function renderPagination(currentPage, totalItems, type) {
      const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);
      if (totalPages <= 1) return '';
      
      return `
        <div class="flex justify-center items-center gap-4 py-6">
          <button ${currentPage === 1 ? 'disabled' : ''} 
            onclick="setPage('${type}', ${currentPage - 1})" 
            class="w-10 h-10 flex items-center justify-center rounded-full bg-white border border-gray-200 text-gray-600 disabled:opacity-30 hover:bg-gray-50 active:bg-gray-100 transition-colors">
            &lt;
          </button>
          <span class="text-sm font-bold text-gray-600">${currentPage} / ${totalPages}</span>
          <button ${currentPage === totalPages ? 'disabled' : ''} 
            onclick="setPage('${type}', ${currentPage + 1})" 
            class="w-10 h-10 flex items-center justify-center rounded-full bg-white border border-gray-200 text-gray-600 disabled:opacity-30 hover:bg-gray-50 active:bg-gray-100 transition-colors">
            &gt;
          </button>
        </div>
      `;
    }

    window.setPage = function(type, page) {
      if(type === 'words') {
        state.wordPage = page;
        renderWords();
      } else {
        state.phrasePage = page;
        renderPhrases();
      }
      mainContent.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.setCategory = function(type, catId) {
      if(type === 'words') {
        state.wordCategory = catId;
        state.wordPage = 1;
        renderWordCategories();
        renderWords();
      } else {
        state.phraseCategory = catId;
        state.phrasePage = 1;
        renderPhraseCategories();
        renderPhrases();
      }
    };

    function renderWordCategories() {
      const container = document.getElementById('word-categories');
      container.innerHTML = wordCategories.map(cat => `
        <button onclick="setCategory('words', '${cat.id}')" 
          class="px-4 py-2 rounded-full whitespace-nowrap text-sm font-bold transition-colors ${state.wordCategory === cat.id ? 'bg-red-600 text-white' : 'bg-white text-gray-600 border border-gray-200'}">
          ${cat.label}
        </button>
      `).join('');
    }

    function renderPhraseCategories() {
      const container = document.getElementById('phrase-categories');
      container.innerHTML = phraseCategories.map(cat => `
        <button onclick="setCategory('phrases', '${cat.id}')" 
          class="px-4 py-2 rounded-full whitespace-nowrap text-sm font-bold transition-colors ${state.phraseCategory === cat.id ? 'bg-red-600 text-white' : 'bg-white text-gray-600 border border-gray-200'}">
          ${cat.label}
        </button>
      `).join('');
    }

    function renderWords() {
      const filtered = wordsData.filter(w => {
        const matchCat = state.wordCategory === 'all' || w.cat === state.wordCategory;
        const matchSearch = (w.kr || '').includes(state.wordSearch) || (w.jp || '').includes(state.wordSearch) || (w.pron || '').includes(state.wordSearch);
        return matchCat && matchSearch;
      });

      const listContainer = document.getElementById('word-list');
      const pageContainer = document.getElementById('word-pagination');

      if (filtered.length === 0) {
        listContainer.innerHTML = '<div class="text-center text-gray-500 py-10">검색 결과가 없습니다.</div>';
        pageContainer.innerHTML = '';
      } else {
        const start = (state.wordPage - 1) * ITEMS_PER_PAGE;
        const paginated = filtered.slice(start, start + ITEMS_PER_PAGE);
        listContainer.innerHTML = paginated.map(renderItemCard).join('');
        pageContainer.innerHTML = renderPagination(state.wordPage, filtered.length, 'words');
      }
      lucide.createIcons();
    }

    function renderPhrases() {
      const filtered = phrasesData.filter(p => {
        const matchCat = state.phraseCategory === 'all' || p.cat === state.phraseCategory;
        const matchSearch = (p.kr || '').includes(state.phraseSearch) || (p.jp || '').includes(state.phraseSearch) || (p.pron || '').includes(state.phraseSearch);
        return matchCat && matchSearch;
      });

      const listContainer = document.getElementById('phrase-list');
      const pageContainer = document.getElementById('phrase-pagination');

      if (filtered.length === 0) {
        listContainer.innerHTML = '<div class="text-center text-gray-500 py-10">검색 결과가 없습니다.</div>';
        pageContainer.innerHTML = '';
      } else {
        const start = (state.phrasePage - 1) * ITEMS_PER_PAGE;
        const paginated = filtered.slice(start, start + ITEMS_PER_PAGE);
        listContainer.innerHTML = paginated.map(renderItemCard).join('');
        pageContainer.innerHTML = renderPagination(state.phrasePage, filtered.length, 'phrases');
      }
      lucide.createIcons();
    }

    // Event Listeners for search
    document.getElementById('word-search').addEventListener('input', (e) => {
      state.wordSearch = e.target.value;
      state.wordPage = 1;
      renderWords();
    });

    document.getElementById('phrase-search').addEventListener('input', (e) => {
      state.phraseSearch = e.target.value;
      state.phrasePage = 1;
      renderPhrases();
    });

    // --- CHAT LOGIC ---
    function scrollToBottom() {
      if (chatMessagesContainer) {
        chatMessagesContainer.scrollTop = chatMessagesContainer.scrollHeight;
      }
    }

    function renderChatMessages() {
      let html = state.chatMessages.map((msg, i) => {
        const isUser = msg.role === 'user';
        const wrapperClass = `flex ${isUser ? 'justify-end' : 'justify-start'}`;
        const bubbleClass = `max-w-[85%] rounded-2xl px-4 py-3 text-sm ${isUser ? 'bg-red-600 text-white rounded-tr-none' : 'bg-gray-100 text-gray-800 rounded-tl-none'}`;
        
        // 마크다운 특수문자(*)를 화면에 표시하기 전에 제거합니다.
        const cleanText = msg.text.replace(/\*/g, '');
        let content = cleanText.split('\n').map(line => `<p class="mb-1 last:mb-0">${line}</p>`).join('');
        
        let ttsButton = '';
        if (!isUser && i !== 0) {
          // Simple heuristic to extract Japanese
          const jpMatch = cleanText.match(/[\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff]+/g);
          const jpText = jpMatch ? jpMatch.join(' ') : cleanText;
          const escapedText = jpText.replace(/'/g, "\\'").replace(/"/g, "&quot;");
          ttsButton = `
            <button onclick="playTTS('${escapedText}')" class="mt-2 flex items-center gap-1 text-xs text-red-600 font-bold bg-white/50 px-2 py-1 rounded-md hover:bg-white pointer-events-auto">
              <i data-lucide="volume-2" class="w-3 h-3"></i> 발음 듣기
            </button>
          `;
        }

        return `
          <div class="${wrapperClass}">
            <div class="${bubbleClass}">
              ${content}
              ${ttsButton}
            </div>
          </div>
        `;
      }).join('');

      if (state.isChatLoading) {
        html += `
          <div class="flex justify-start">
            <div class="bg-gray-100 text-gray-500 rounded-2xl rounded-tl-none px-4 py-3 flex items-center gap-2 text-sm">
              <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> 입력중...
            </div>
          </div>
        `;
      }

      chatMessagesContainer.innerHTML = html;
      lucide.createIcons();
      scrollToBottom();
    }

    document.getElementById('chat-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = chatInput.value.trim();
      if (!text || state.isChatLoading) return;

      state.chatMessages.push({ role: 'user', text: text });
      chatInput.value = '';
      state.isChatLoading = true;
      renderChatMessages();

      const apiKey = ""; // API Key 
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
      const systemPrompt = "당신은 일본 여행을 가서 식당이나 이자카야를 방문하는 한국인 미식가를 돕는 일본어 도우미입니다. 사용자가 상황이나 필요한 표현을 한국어로 물어보면, 당장 식당에서 쓸 수 있는 가장 자연스럽고 간단한 일본어 표현(한자/히라가나)과 그 한국어 발음을 알려주세요. 복잡한 문법 설명은 절대 하지 말고, 실전에서 바로 읽을 수 있게 짧고 명확하게 대답하세요. 친절하고 간결한 어투를 사용하세요. 단, 마크다운 특수기호(*, ** 등)는 절대 사용하지 말고 순수 텍스트로만 답변하세요.";

      const payload = {
        contents: [{ parts: [{ text: text }] }],
        systemInstruction: { parts: [{ text: systemPrompt }] }
      };

      const fetchWithRetry = async (retries = 5, delay = 1000) => {
        for (let i = 0; i < retries; i++) {
          try {
            const response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            const data = await response.json();
            return data.candidates?.[0]?.content?.parts?.[0]?.text || "응답을 생성할 수 없습니다.";
          } catch (error) {
            if (i === retries - 1) throw error;
            await new Promise(resolve => setTimeout(resolve, delay * Math.pow(2, i)));
          }
        }
      };

      try {
        const reply = await fetchWithRetry();
        state.chatMessages.push({ role: 'assistant', text: reply });
      } catch (error) {
        showToast("챗봇 응답에 실패했습니다. 잠시 후 다시 시도해주세요.");
        state.chatMessages.push({ role: 'assistant', text: "죄송합니다, 통신 오류가 발생했습니다. 나중에 다시 질문해주세요." });
      } finally {
        state.isChatLoading = false;
        renderChatMessages();
      }
    });

    chatInput.addEventListener('input', (e) => {
      chatSubmitBtn.disabled = !e.target.value.trim() || state.isChatLoading;
      if (chatSubmitBtn.disabled) {
        chatSubmitBtn.classList.add('opacity-50');
      } else {
        chatSubmitBtn.classList.remove('opacity-50');
      }
    });

    // --- INIT ---
    function init() {
      lucide.createIcons();
      renderWordCategories();
      renderPhraseCategories();
      renderWords();
      renderPhrases();
      renderChatMessages();
      
      // Select home icon fill initially
      const homeIcon = document.getElementById('nav-home').querySelector('svg');
      if(homeIcon) homeIcon.classList.add('fill-current');
    }

    init();

  </script>
</body>
</html>
