<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Quiz for Frontend Devs</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS Variables: Catppuccin Mocha Theme --- */
        :root {
            --ctp-base: #1e1e2e;
            --ctp-mantle: #181825;
            --ctp-surface0: #313244;
            --ctp-surface1: #45475a;
            --ctp-text: #cdd6f4;
            --ctp-subtext1: #bac2de;
            --ctp-blue: #89b4fa;
            --ctp-green: #a6e3a1;
            --ctp-red: #f38ba8;
            --ctp-yellow: #f9e2af;
            --ctp-mauve: #cba6f7;
            --ctp-peach: #fab387;
            --ctp-overlay0: #6c7086;

            --font-main: 'Noto Sans KR', sans-serif;
            --font-code: 'JetBrains Mono', monospace;
        }

        /* --- Global Reset & Layout --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--ctp-base);
            color: var(--ctp-text);
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        #app {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }

        /* --- Header --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 2px solid var(--ctp-surface0);
        }

        .brand {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--ctp-blue);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .score-board {
            font-size: 0.9rem;
            color: var(--ctp-subtext1);
            text-align: right;
        }

        .score-board span {
            display: block;
        }

        .highlight-score {
            color: var(--ctp-yellow);
            font-weight: bold;
        }

        /* --- Quiz Card --- */
        .card {
            background-color: var(--ctp-surface0);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.4s ease-out;
            position: relative;
            overflow: hidden;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Badges */
        .badges {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--ctp-base);
        }

        /* Topic Colors */
        .badge[data-topic="HTTP"] { background-color: var(--ctp-blue); }
        .badge[data-topic="DNS"] { background-color: var(--ctp-mauve); }
        .badge[data-topic="CORS"] { background-color: var(--ctp-red); }
        .badge[data-topic="REST"] { background-color: var(--ctp-green); }
        .badge[data-topic="TCP"] { background-color: var(--ctp-peach); }
        .badge[data-topic="기타"] { background-color: var(--ctp-subtext1); }

        /* Question Area */
        .question-text {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 16px;
            white-space: pre-line;
        }

        .code-block {
            background-color: var(--ctp-mantle);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            border: 1px solid var(--ctp-surface1);
        }

        code {
            font-family: var(--font-code);
            font-size: 0.9rem;
            color: var(--ctp-blue);
        }

        /* Options */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
        }

        .option-btn {
            background-color: var(--ctp-surface1);
            border: 2px solid transparent;
            color: var(--ctp-text);
            padding: 14px 16px;
            border-radius: 12px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font-main);
            font-size: 0.95rem;
            position: relative;
        }

        .option-btn:hover:not(:disabled) {
            background-color: var(--ctp-overlay0);
        }

        .option-btn.selected {
            border-color: var(--ctp-blue);
            background-color: rgba(137, 180, 250, 0.1);
        }

        .option-btn.correct {
            border-color: var(--ctp-green);
            background-color: rgba(166, 227, 161, 0.15);
        }

        .option-btn.wrong {
            border-color: var(--ctp-red);
            background-color: rgba(243, 139, 168, 0.15);
            opacity: 0.7;
        }

        .option-btn:disabled {
            cursor: default;
        }

        /* Hint Section */
        .hint-section {
            margin-bottom: 20px;
            border-top: 1px solid var(--ctp-surface1);
            padding-top: 16px;
        }

        .hint-toggle {
            background: none;
            border: none;
            color: var(--ctp-yellow);
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-main);
            font-weight: 500;
            padding: 0;
        }

        .hint-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out;
            margin-top: 8px;
            background-color: var(--ctp-mantle);
            border-radius: 8px;
        }

        .hint-content.open {
            max-height: 500px; /* Approximate max height */
        }

        .diagram-container {
            padding: 16px;
        }
        
        svg {
            width: 100%;
            height: auto;
            display: block;
        }
        
        /* SVG Internal Styles */
        .svg-bg { fill: var(--ctp-mantle); }
        .svg-box { fill: var(--ctp-surface0); stroke: var(--ctp-overlay0); stroke-width: 2; }
        .svg-text { fill: var(--ctp-text); font-family: var(--font-code); font-size: 12px; }
        .svg-arrow { stroke: var(--ctp-blue); stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
        .svg-accent { fill: var(--ctp-blue); }

        /* Action Buttons */
        .action-area {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .primary-btn {
            background-color: var(--ctp-blue);
            color: var(--ctp-base);
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
        }

        .primary-btn:hover {
            opacity: 0.9;
        }

        .primary-btn:disabled {
            background-color: var(--ctp-surface1);
            color: var(--ctp-subtext1);
            cursor: not-allowed;
        }

        /* Result Panel */
        .result-panel {
            background-color: var(--ctp-mantle);
            padding: 16px;
            border-radius: 12px;
            margin-top: 10px;
            display: none; /* Hidden by default */
            animation: fadeIn 0.3s;
        }

        .result-title {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .result-correct { color: var(--ctp-green); }
        .result-wrong { color: var(--ctp-red); }

        .explanation {
            font-size: 0.9rem;
            color: var(--ctp-subtext1);
        }

        /* Loading */
        .loading-container {
            text-align: center;
            padding: 40px;
            color: var(--ctp-subtext1);
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--ctp-surface1);
            border-top: 4px solid var(--ctp-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Game Over Screen */
        .game-over {
            text-align: center;
            padding: 40px 0;
            display: none;
        }
        
        .game-over h2 { color: var(--ctp-blue); margin-bottom: 16px; }
        .final-score { font-size: 2rem; font-weight: bold; margin-bottom: 24px; color: var(--ctp-green); }
    </style>
</head>
<body>

<div id="app">
    <!-- 1. Header -->
    <header>
        <div class="brand">
            <span>🌐</span> Network Quiz
        </div>
        <div class="score-board">
            <span id="score-display">Score: 0 / 0</span>
            <span id="highscore-display">🏆 최고: 0</span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="main-content">
        <!-- Loading View -->
        <div id="loading-view" class="loading-container">
            <div class="spinner"></div>
            <p>AI가 문제를 생성 중입니다...</p>
        </div>

        <!-- Quiz Card -->
        <div id="quiz-card" class="card" style="display: none;">
            <div class="badges">
                <span id="badge-topic" class="badge" data-topic="HTTP">HTTP</span>
                <span id="badge-difficulty" class="badge" style="background-color: var(--ctp-surface1);">Medium</span>
            </div>

            <div id="question-text" class="question-text">
                문제 로딩 중...
            </div>

            <!-- Code block container (optional) -->
            <div id="code-container" class="code-block" style="display: none;">
                <pre><code id="code-content"></code></pre>
            </div>

            <div id="options-container" class="options-grid">
                <!-- Buttons injected by JS -->
            </div>

            <!-- Hint Section -->
            <div class="hint-section">
                <button id="hint-toggle-btn" class="hint-toggle">
                    💡 힌트: 다이어그램 보기 ▼
                </button>
                <div id="hint-content" class="hint-content">
                    <div id="diagram-target" class="diagram-container">
                        <!-- SVG Injected here -->
                    </div>
                </div>
            </div>

            <!-- Result & Actions -->
            <div class="action-area">
                <div id="result-panel" class="result-panel">
                    <div id="result-title" class="result-title"></div>
                    <div id="explanation-text" class="explanation"></div>
                </div>
                
                <button id="primary-btn" class="primary-btn" disabled>정답 확인</button>
            </div>
        </div>

        <!-- Game Over View -->
        <div id="game-over-view" class="game-over card">
            <h2>🎉 퀴즈 완료!</h2>
            <div class="final-score" id="final-score-text">8 / 10점</div>
            <p style="margin-bottom: 24px;">네트워크 기초 지식을 훌륭하게 테스트하셨습니다.</p>
            <button id="restart-btn" class="primary-btn">다시 시작하기</button>
        </div>
    </main>
</div>

<script>
/**
 * --- 1. DiagramRenderer Class ---
 * SVG 그래픽 데이터를 관리하고 렌더링하는 클래스
 */
class DiagramRenderer {
    constructor() {
        this.colors = {
            bg: "#181825",
            box: "#313244",
            text: "#cdd6f4",
            arrow: "#89b4fa",
            accent: "#f38ba8",
            success: "#a6e3a1"
        };
    }

    getDiagram(type) {
        const width = 400;
        const height = 200;
        let content = '';

        // 공통 Arrowhead definition
        const defs = `
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="${this.colors.arrow}" />
                </marker>
            </defs>
        `;

        switch (type) {
            case "HTTP":
                content = `
                    <rect x="20" y="60" width="80" height="60" rx="5" fill="${this.colors.box}" stroke="${this.colors.arrow}" />
                    <text x="60" y="95" text-anchor="middle" fill="${this.colors.text}" font-size="12" font-weight="bold">Browser</text>
                    
                    <rect x="300" y="60" width="80" height="60" rx="5" fill="${this.colors.box}" stroke="${this.colors.arrow}" />
                    <text x="340" y="95" text-anchor="middle" fill="${this.colors.text}" font-size="12" font-weight="bold">Server</text>
                    
                    <line x1="110" y1="80" x2="290" y2="80" stroke="${this.colors.arrow}" stroke-width="2" marker-end="url(#arrowhead)" />
                    <text x="200" y="70" text-anchor="middle" fill="${this.colors.text}" font-size="10">Request (GET/POST)</text>

                    <line x1="290" y1="110" x2="110" y2="110" stroke="${this.colors.success}" stroke-width="2" marker-end="url(#arrowhead)" />
                    <text x="200" y="135" text-anchor="middle" fill="${this.colors.text}" font-size="10">Response (200 OK)</text>
                `;
                break;

            case "DNS":
                content = `
                    <rect x="10" y="80" width="60" height="40" rx="4" fill="${this.colors.box}" />
                    <text x="40" y="105" text-anchor="middle" fill="${this.colors.text}" font-size="10">User</text>

                    <rect x="100" y="20" width="80" height="40" rx="4" fill="${this.colors.box}" />
                    <text x="140" y="45" text-anchor="middle" fill="${this.colors.text}" font-size="10">Resolver</text>

                    <rect x="220" y="20" width="60" height="40" rx="4" fill="${this.colors.box}" />
                    <text x="250" y="45" text-anchor="middle" fill="${this.colors.text}" font-size="10">Root NS</text>

                    <rect x="220" y="140" width="80" height="40" rx="4" fill="${this.colors.box}" stroke="${this.colors.success}" />
                    <text x="260" y="165" text-anchor="middle" fill="${this.colors.text}" font-size="10">Auth NS</text>

                    <path d="M70 100 L100 40" stroke="${this.colors.arrow}" fill="none" marker-end="url(#arrowhead)" />
                    <path d="M180 40 L220 40" stroke="${this.colors.arrow}" fill="none" marker-end="url(#arrowhead)" />
                    <path d="M250 60 L260 140" stroke="${this.colors.arrow}" fill="none" marker-end="url(#arrowhead)" />
                    <path d="M220 160 L140 60" stroke="${this.colors.success}" fill="none" marker-end="url(#arrowhead)" />
                    
                    <text x="90" y="80" fill="${this.colors.text}" font-size="10">①</text>
                    <text x="200" y="30" fill="${this.colors.text}" font-size="10">②</text>
                    <text x="265" y="100" fill="${this.colors.text}" font-size="10">③</text>
                    <text x="170" y="120" fill="${this.colors.success}" font-size="10">④ IP</text>
                `;
                break;

            case "CORS":
                content = `
                    <rect x="10" y="50" width="100" height="100" rx="5" fill="none" stroke="${this.colors.text}" stroke-dasharray="4" />
                    <text x="60" y="40" text-anchor="middle" fill="${this.colors.text}" font-size="10">Browser (Origin A)</text>

                    <rect x="280" y="60" width="100" height="80" rx="5" fill="${this.colors.box}" />
                    <text x="330" y="105" text-anchor="middle" fill="${this.colors.text}" font-size="12">API (Origin B)</text>

                    <line x1="110" y1="80" x2="270" y2="80" stroke="${this.colors.accent}" stroke-width="1.5" marker-end="url(#arrowhead)" />
                    <text x="190" y="75" text-anchor="middle" fill="${this.colors.accent}" font-size="9">① Preflight (OPTIONS)</text>

                    <line x1="270" y1="120" x2="110" y2="120" stroke="${this.colors.success}" stroke-width="1.5" marker-end="url(#arrowhead)" />
                    <text x="190" y="115" text-anchor="middle" fill="${this.colors.success}" font-size="9">② Allow-Origin: A</text>

                    <text x="190" y="145" text-anchor="middle" fill="${this.colors.text}" font-size="9">③ Actual Request</text>
                `;
                break;

            case "TCP":
                content = `
                    <text x="50" y="30" text-anchor="middle" fill="${this.colors.text}" font-size="12" font-weight="bold">Client</text>
                    <text x="350" y="30" text-anchor="middle" fill="${this.colors.text}" font-size="12" font-weight="bold">Server</text>
                    
                    <line x1="50" y1="40" x2="50" y2="180" stroke="${this.colors.text}" stroke-width="1" stroke-dasharray="4"/>
                    <line x1="350" y1="40" x2="350" y2="180" stroke="${this.colors.text}" stroke-width="1" stroke-dasharray="4"/>

                    <!-- SYN -->
                    <line x1="50" y1="60" x2="340" y2="90" stroke="${this.colors.arrow}" stroke-width="2" marker-end="url(#arrowhead)" />
                    <text x="200" y="70" text-anchor="middle" fill="${this.colors.arrow}" font-size="10">① SYN</text>

                    <!-- SYN-ACK -->
                    <line x1="350" y1="100" x2="60" y2="130" stroke="${this.colors.success}" stroke-width="2" marker-end="url(#arrowhead)" />
                    <text x="200" y="110" text-anchor="middle" fill="${this.colors.success}" font-size="10">② SYN + ACK</text>

                    <!-- ACK -->
                    <line x1="50" y1="140" x2="340" y2="170" stroke="${this.colors.arrow}" stroke-width="2" marker-end="url(#arrowhead)" />
                    <text x="200" y="150" text-anchor="middle" fill="${this.colors.arrow}" font-size="10">③ ACK</text>
                `;
                break;
            
            case "REST":
                content = `
                    <rect x="20" y="20" width="360" height="160" rx="8" fill="${this.colors.box}" />
                    <text x="200" y="45" text-anchor="middle" fill="${this.colors.text}" font-size="14" font-weight="bold">RESTful API Design</text>
                    
                    <g transform="translate(40, 70)">
                        <text x="0" y="0" fill="${this.colors.blue}" font-family="monospace" font-size="12">GET    /users</text>
                        <text x="150" y="0" fill="${this.colors.text}" font-size="12">→ 목록 조회</text>
                        
                        <text x="0" y="25" fill="${this.colors.success}" font-family="monospace" font-size="12">POST   /users</text>
                        <text x="150" y="25" fill="${this.colors.text}" font-size="12">→ 생성</text>
                        
                        <text x="0" y="50" fill="${this.colors.accent}" font-family="monospace" font-size="12">PUT    /users/:id</text>
                        <text x="150" y="50" fill="${this.colors.text}" font-size="12">→ 수정</text>
                        
                        <text x="0" y="75" fill="${this.colors.red}" font-family="monospace" font-size="12">DELETE /users/:id</text>
                        <text x="150" y="75" fill="${this.colors.text}" font-size="12">→ 삭제</text>
                    </g>
                `;
                break;

            default: // DEFAULT
                content = `
                    <circle cx="60" cy="100" r="30" fill="${this.colors.box}" stroke="${this.colors.arrow}" />
                    <text x="60" y="105" text-anchor="middle" fill="${this.colors.text}" font-size="10">Client</text>

                    <path d="M110 100 Q 200 40 290 100" stroke="${this.colors.arrow}" fill="none" stroke-dasharray="5,5" />
                    <path d="M110 100 Q 200 160 290 100" stroke="${this.colors.success}" fill="none" stroke-dasharray="5,5" />
                    <text x="200" y="105" text-anchor="middle" fill="${this.colors.subtext1}" font-size="10">Internet / Network</text>

                    <rect x="300" y="70" width="60" height="60" fill="${this.colors.box}" stroke="${this.colors.text}" />
                    <text x="330" y="105" text-anchor="middle" fill="${this.colors.text}" font-size="10">Server</text>
                `;
        }

        return `<svg viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg" style="background:${this.colors.bg}; border-radius:8px;">${defs}${content}</svg>`;
    }
}

/**
 * --- 2. GeminiService Class ---
 * AI 문제 생성 및 통신 담당
 */
class GeminiService {
    constructor() {
        this.apiKey = ""; // 시스템 환경 변수 주입
        this.model = "gemini-2.5-flash-preview-09-2025";
        this.baseUrl = "https://generativelanguage.googleapis.com/v1beta/models";
    }

    async generateQuestion(previousTopics = []) {
        const prompt = `
            웹 프론트엔드 개발자가 알아야 할 네트워크 기초 지식 퀴즈를 하나 만들어주세요.
            
            [주제 범위]
            - HTTP (메서드, 상태코드, 헤더, 버전 등)
            - DNS (동작 원리, 레코드)
            - CORS (Same-Origin Policy, Preflight)
            - REST API (설계 원칙)
            - TCP/IP (3-way handshake)
            - 브라우저 캐싱, HTTPS, 쿠키/세션 등
            
            [제약 사항]
            - 이미 출제된 주제: [${previousTopics.join(', ')}] (가능하면 피해주세요)
            - 난이도: Easy, Medium, Hard 중 하나
            - 한국어로 작성
            - hintDiagramType은 반드시 다음 중 하나: "HTTP", "DNS", "CORS", "REST", "TCP", "DEFAULT"
            
            [출력 포맷]
            JSON 포맷으로만 응답해주세요.
        `;

        const requestBody = {
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: {
                responseMimeType: "application/json",
                responseSchema: {
                    type: "OBJECT",
                    properties: {
                        topic: { type: "STRING" },
                        questionText: { type: "STRING" },
                        code: { type: "STRING", nullable: true },
                        options: { type: "ARRAY", items: { type: "STRING" } },
                        answerIndex: { type: "INTEGER" },
                        difficulty: { type: "STRING" },
                        explanation: { type: "STRING" },
                        hintDiagramType: { type: "STRING", enum: ["HTTP", "DNS", "CORS", "REST", "TCP", "DEFAULT"] }
                    },
                    required: ["topic", "questionText", "options", "answerIndex", "difficulty", "explanation", "hintDiagramType"]
                }
            }
        };

        const maxRetries = 3;
        for (let attempt = 0; attempt < maxRetries; attempt++) {
            try {
                const response = await fetch(`${this.baseUrl}/${this.model}:generateContent?key=${this.apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) throw new Error(`API Error: ${response.status}`);

                const data = await response.json();
                const textContent = data.candidates[0].content.parts[0].text;
                return JSON.parse(textContent);

            } catch (error) {
                console.warn(`Attempt ${attempt + 1} failed:`, error);
                if (attempt === maxRetries - 1) throw error;
                await new Promise(r => setTimeout(r, 1000 * Math.pow(2, attempt))); // Exponential backoff
            }
        }
    }
}

/**
 * --- 3. UI Class ---
 * DOM 조작 및 화면 갱신
 */
class UI {
    constructor() {
        this.elements = {
            loading: document.getElementById('loading-view'),
            card: document.getElementById('quiz-card'),
            gameOver: document.getElementById('game-over-view'),
            
            badgeTopic: document.getElementById('badge-topic'),
            badgeDifficulty: document.getElementById('badge-difficulty'),
            questionText: document.getElementById('question-text'),
            codeContainer: document.getElementById('code-container'),
            codeContent: document.getElementById('code-content'),
            optionsContainer: document.getElementById('options-container'),
            
            hintBtn: document.getElementById('hint-toggle-btn'),
            hintContent: document.getElementById('hint-content'),
            diagramTarget: document.getElementById('diagram-target'),
            
            primaryBtn: document.getElementById('primary-btn'),
            resultPanel: document.getElementById('result-panel'),
            resultTitle: document.getElementById('result-title'),
            explanationText: document.getElementById('explanation-text'),
            
            scoreDisplay: document.getElementById('score-display'),
            highScoreDisplay: document.getElementById('highscore-display'),
            finalScoreText: document.getElementById('final-score-text'),
            restartBtn: document.getElementById('restart-btn')
        };

        this.diagramRenderer = new DiagramRenderer();
        this.isHintOpen = false;
    }

    showLoading() {
        this.elements.loading.style.display = 'block';
        this.elements.card.style.display = 'none';
        this.elements.gameOver.style.display = 'none';
    }

    showQuiz() {
        this.elements.loading.style.display = 'none';
        this.elements.card.style.display = 'block';
        this.elements.gameOver.style.display = 'none';
        
        // Reset state
        this.resetCardState();
    }

    showGameOver(score, total) {
        this.elements.loading.style.display = 'none';
        this.elements.card.style.display = 'none';
        this.elements.gameOver.style.display = 'block';
        this.elements.finalScoreText.textContent = `${score} / ${total}점`;
    }

    resetCardState() {
        this.elements.resultPanel.style.display = 'none';
        this.elements.primaryBtn.textContent = '정답 확인';
        this.elements.primaryBtn.disabled = true;
        this.elements.hintContent.classList.remove('open');
        this.isHintOpen = false;
        
        // Remove old selections
        const oldBtns = this.elements.optionsContainer.querySelectorAll('.option-btn');
        oldBtns.forEach(btn => btn.remove());
    }

    renderQuestion(data, onOptionSelect) {
        // Badges
        this.elements.badgeTopic.textContent = data.topic;
        this.elements.badgeTopic.dataset.topic = data.hintDiagramType; // Color mapping logic
        this.elements.badgeDifficulty.textContent = data.difficulty;

        // Text
        this.elements.questionText.textContent = data.questionText;

        // Code
        if (data.code && data.code.trim() !== "" && data.code !== "null") {
            this.elements.codeContainer.style.display = 'block';
            this.elements.codeContent.textContent = data.code;
        } else {
            this.elements.codeContainer.style.display = 'none';
        }

        // Options
        this.elements.optionsContainer.innerHTML = '';
        data.options.forEach((optText, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = optText;
            btn.dataset.index = index;
            btn.onclick = () => {
                // UI Visual Selection
                this.elements.optionsContainer.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                this.elements.primaryBtn.disabled = false;
                onOptionSelect(index);
            };
            this.elements.optionsContainer.appendChild(btn);
        });

        // Diagram
        this.elements.diagramTarget.innerHTML = this.diagramRenderer.getDiagram(data.hintDiagramType);
    }

    toggleHint() {
        this.isHintOpen = !this.isHintOpen;
        if(this.isHintOpen) {
            this.elements.hintContent.classList.add('open');
        } else {
            this.elements.hintContent.classList.remove('open');
        }
    }

    showResult(isCorrect, correctIndex, selectedIndex, explanation) {
        const btns = this.elements.optionsContainer.querySelectorAll('.option-btn');
        
        btns.forEach((btn, idx) => {
            btn.disabled = true; // Disable all
            if (idx === correctIndex) btn.classList.add('correct');
            if (idx === selectedIndex && !isCorrect) btn.classList.add('wrong');
        });

        this.elements.resultPanel.style.display = 'block';
        if (isCorrect) {
            this.elements.resultTitle.innerHTML = '✅ 정답!';
            this.elements.resultTitle.className = 'result-title result-correct';
        } else {
            this.elements.resultTitle.innerHTML = `❌ 오답. 정답: ${correctIndex + 1}번`;
            this.elements.resultTitle.className = 'result-title result-wrong';
        }
        
        this.elements.explanationText.textContent = explanation;
        this.elements.primaryBtn.textContent = '다음 문제 →';
    }

    updateScore(score, total, highScore) {
        this.elements.scoreDisplay.textContent = `Score: ${score} / ${total}`;
        this.elements.highScoreDisplay.textContent = `🏆 최고: ${highScore}`;
    }
}

/**
 * --- 4. QuizController Class ---
 * 게임 로직 및 상태 관리
 */
class QuizController {
    constructor(app) {
        this.gemini = new GeminiService();
        this.ui = new UI();
        
        this.state = {
            score: 0,
            questionCount: 0,
            maxQuestions: 10,
            currentQuestionData: null,
            selectedIndex: -1,
            isAnswerChecked: false,
            previousTopics: [],
            highScore: parseInt(localStorage.getItem('networkQuizHighScore') || '0')
        };

        this.initEventListeners();
    }

    initEventListeners() {
        // Option selection handled in UI render callback
        
        // Hint Toggle
        this.ui.elements.hintBtn.addEventListener('click', () => {
            this.ui.toggleHint();
        });

        // Primary Button (Check Answer / Next)
        this.ui.elements.primaryBtn.addEventListener('click', () => {
            if (this.state.isAnswerChecked) {
                this.loadNextQuestion();
            } else {
                this.checkAnswer();
            }
        });

        // Restart
        this.ui.elements.restartBtn.addEventListener('click', () => {
            this.startGame();
        });
    }

    async startGame() {
        this.state.score = 0;
        this.state.questionCount = 0;
        this.state.previousTopics = [];
        this.state.isAnswerChecked = false;
        
        this.ui.updateScore(0, 0, this.state.highScore);
        await this.loadNextQuestion();
    }

    async loadNextQuestion() {
        if (this.state.questionCount >= this.state.maxQuestions) {
            this.endGame();
            return;
        }

        this.ui.showLoading();
        this.state.isAnswerChecked = false;
        this.state.selectedIndex = -1;

        try {
            const data = await this.gemini.generateQuestion(this.state.previousTopics);
            this.state.currentQuestionData = data;
            
            // Topic history (keep last 5)
            this.state.previousTopics.push(data.topic);
            if(this.state.previousTopics.length > 5) this.state.previousTopics.shift();

            this.ui.showQuiz();
            this.ui.renderQuestion(data, (idx) => {
                this.state.selectedIndex = idx;
            });

        } catch (error) {
            alert('문제 생성에 실패했습니다. 잠시 후 다시 시도해주세요.\n' + error.message);
            // Fallback: manually restart or retry logic could go here
        }
    }

    checkAnswer() {
        if (this.state.selectedIndex === -1) return;

        const data = this.state.currentQuestionData;
        const isCorrect = (this.state.selectedIndex === data.answerIndex);
        
        if (isCorrect) this.state.score++;
        this.state.questionCount++;
        this.state.isAnswerChecked = true;

        // Update High Score immediately
        if (this.state.score > this.state.highScore) {
            this.state.highScore = this.state.score;
            localStorage.setItem('networkQuizHighScore', this.state.highScore);
        }

        this.ui.updateScore(this.state.score, this.state.questionCount, this.state.highScore);
        this.ui.showResult(isCorrect, data.answerIndex, this.state.selectedIndex, data.explanation);
    }

    endGame() {
        this.ui.showGameOver(this.state.score, this.state.maxQuestions);
    }
}

/**
 * --- 5. App Entry ---
 */
class App {
    init() {
        const controller = new QuizController();
        controller.startGame();
    }
}

// Start Application
window.onload = () => {
    const app = new App();
    app.init();
};
